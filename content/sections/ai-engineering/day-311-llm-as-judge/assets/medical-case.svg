<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Kappa from 0.44 to 0.86.">
  <title>One judge, recalibrated</title>
  <style>
    .medical-case-bg   { fill: #f8fafc; }
    .medical-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medical-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medical-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medical-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medical-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medical-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .medical-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .medical-case-stage { opacity: 1; }

    .medical-case-s0 { animation-delay: 0.00s; }
    .medical-case-e0 { animation-delay: 0.00s; }
    .medical-case-s1 { animation-delay: 1.28s; }
    .medical-case-e1 { animation-delay: 1.28s; }
    .medical-case-s2 { animation-delay: 2.56s; }
    .medical-case-e2 { animation-delay: 2.56s; }
    .medical-case-s3 { animation-delay: 3.84s; }
    .medical-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .medical-case-conn  { animation: medical-case-trace 6.4s ease-in-out infinite; }
      .medical-case-stage { animation: medical-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes medical-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes medical-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .medical-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .medical-case-stage { animation: medical-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes medical-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="medical-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="medical-case-bg" width="980" height="322"/>
  <text class="medical-case-h1"  x="30" y="40">One judge, recalibrated</text>
  <text class="medical-case-sub" x="30" y="64">Kappa from 0.44 to 0.86.</text>
  <g class="medical-case-stage medical-case-s0">
    <rect class="medical-case-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="medical-case-step" x="44" y="142">01</text>
    <text class="medical-case-name" x="70" y="142">The judge preferred 800-word summaries</text>
    <text class="medical-case-desc" x="44" y="166">Bullet-pointed and</text>
    <text class="medical-case-desc" x="44" y="182">comprehensive. Consistently 5/5.</text>
  </g>
  <line class="medical-case-line medical-case-conn medical-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#medical-case-tip)"/>
  <g class="medical-case-stage medical-case-s1">
    <rect class="medical-case-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="medical-case-step" x="280" y="142">02</text>
    <text class="medical-case-name" x="306" y="142">Physicians preferred 200 words</text>
    <text class="medical-case-desc" x="280" y="166">Concise, with the critical</text>
    <text class="medical-case-desc" x="280" y="182">vitals highlighted.</text>
  </g>
  <line class="medical-case-line medical-case-conn medical-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#medical-case-tip)"/>
  <g class="medical-case-stage medical-case-s2">
    <rect class="medical-case-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="medical-case-step" x="516" y="142">03</text>
    <text class="medical-case-name" x="542" y="142">The rubric was rewritten</text>
    <text class="medical-case-desc" x="516" y="166">Deduct a point per 100 words</text>
    <text class="medical-case-desc" x="516" y="182">over target; require all five</text>
    <text class="medical-case-desc" x="516" y="198">vitals present.</text>
    <text class="medical-case-edge" x="516" y="242">anchored</text>
  </g>
  <line class="medical-case-line medical-case-conn medical-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#medical-case-tip)"/>
  <g class="medical-case-stage medical-case-s3">
    <rect class="medical-case-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="medical-case-step" x="752" y="142">04</text>
    <text class="medical-case-name" x="778" y="142">Agreement rose to 0.86</text>
    <text class="medical-case-desc" x="752" y="166">From 0.44. Same judge model,</text>
    <text class="medical-case-desc" x="752" y="182">different rubric.</text>
  </g>
  <text class="medical-case-sub" x="30" y="304">The model never changed, which is the lesson: the judge was faithfully applying a rubric that did not encode what the domain experts actually valued.</text>
</svg>
