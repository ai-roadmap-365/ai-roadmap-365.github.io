<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six elements, and one is an order.">
  <title>What a judge prompt contains</title>
  <style>
    .judge-prompt-anatomy-bg   { fill: #f8fafc; }
    .judge-prompt-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-prompt-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-prompt-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-prompt-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-prompt-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-prompt-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-prompt-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-prompt-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-prompt-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-prompt-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-prompt-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-prompt-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .judge-prompt-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .judge-prompt-anatomy-stage { opacity: 1; }

    .judge-prompt-anatomy-s0 { animation-delay: 0.00s; }
    .judge-prompt-anatomy-e0 { animation-delay: 0.00s; }
    .judge-prompt-anatomy-s1 { animation-delay: 1.37s; }
    .judge-prompt-anatomy-e1 { animation-delay: 1.37s; }
    .judge-prompt-anatomy-s2 { animation-delay: 2.74s; }
    .judge-prompt-anatomy-e2 { animation-delay: 2.74s; }
    .judge-prompt-anatomy-s3 { animation-delay: 4.11s; }
    .judge-prompt-anatomy-e3 { animation-delay: 4.11s; }
    .judge-prompt-anatomy-s4 { animation-delay: 5.49s; }
    .judge-prompt-anatomy-e4 { animation-delay: 5.49s; }
    .judge-prompt-anatomy-s5 { animation-delay: 6.86s; }
    .judge-prompt-anatomy-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .judge-prompt-anatomy-conn  { animation: judge-prompt-anatomy-trace 9.600000000000001s ease-in-out infinite; }
      .judge-prompt-anatomy-stage { animation: judge-prompt-anatomy-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes judge-prompt-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes judge-prompt-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .judge-prompt-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .judge-prompt-anatomy-stage { animation: judge-prompt-anatomy-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes judge-prompt-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="judge-prompt-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="judge-prompt-anatomy-bg" width="980" height="322"/>
  <text class="judge-prompt-anatomy-h1"  x="30" y="40">What a judge prompt contains</text>
  <text class="judge-prompt-anatomy-sub" x="30" y="64">Six elements, and one is an order.</text>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s0">
    <rect class="judge-prompt-anatomy-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="44" y="142">01</text>
    <text class="judge-prompt-anatomy-name" x="70" y="142">An impartial evaluator persona</text>
    <text class="judge-prompt-anatomy-desc" x="44" y="166">Strict, and</text>
    <text class="judge-prompt-anatomy-desc" x="44" y="182">domain-specific.</text>
  </g>
  <line class="judge-prompt-anatomy-line judge-prompt-anatomy-conn judge-prompt-anatomy-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#judge-prompt-anatomy-tip)"/>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s1">
    <rect class="judge-prompt-anatomy-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="201" y="142">02</text>
    <text class="judge-prompt-anatomy-name" x="227" y="142">Query, context, candidate, reference</text>
    <text class="judge-prompt-anatomy-desc" x="201" y="166">Everything needed to</text>
    <text class="judge-prompt-anatomy-desc" x="201" y="182">judge, and nothing</text>
    <text class="judge-prompt-anatomy-desc" x="201" y="198">else.</text>
  </g>
  <line class="judge-prompt-anatomy-line judge-prompt-anatomy-conn judge-prompt-anatomy-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#judge-prompt-anatomy-tip)"/>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s2">
    <rect class="judge-prompt-anatomy-warn" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="358" y="142">03</text>
    <text class="judge-prompt-anatomy-name" x="384" y="142">An anchored 1-5 rubric</text>
    <text class="judge-prompt-anatomy-desc" x="358" y="166">Concrete criteria</text>
    <text class="judge-prompt-anatomy-desc" x="358" y="182">per tier, not "rate</text>
    <text class="judge-prompt-anatomy-desc" x="358" y="198">the quality".</text>
  </g>
  <line class="judge-prompt-anatomy-line judge-prompt-anatomy-conn judge-prompt-anatomy-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#judge-prompt-anatomy-tip)"/>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s3">
    <rect class="judge-prompt-anatomy-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="515" y="142">04</text>
    <text class="judge-prompt-anatomy-name" x="541" y="142">Critique before score</text>
    <text class="judge-prompt-anatomy-desc" x="515" y="166">Reasoning first,</text>
    <text class="judge-prompt-anatomy-desc" x="515" y="182">then the number. The</text>
    <text class="judge-prompt-anatomy-desc" x="515" y="198">order matters.</text>
    <text class="judge-prompt-anatomy-edge" x="515" y="242">chain of thought</text>
  </g>
  <line class="judge-prompt-anatomy-line judge-prompt-anatomy-conn judge-prompt-anatomy-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#judge-prompt-anatomy-tip)"/>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s4">
    <rect class="judge-prompt-anatomy-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="672" y="142">05</text>
    <text class="judge-prompt-anatomy-name" x="698" y="142">A strict output schema</text>
    <text class="judge-prompt-anatomy-desc" x="672" y="166">Parseable, with a</text>
    <text class="judge-prompt-anatomy-desc" x="672" y="182">fallback for</text>
    <text class="judge-prompt-anatomy-desc" x="672" y="198">malformed output.</text>
  </g>
  <line class="judge-prompt-anatomy-line judge-prompt-anatomy-conn judge-prompt-anatomy-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#judge-prompt-anatomy-tip)"/>
  <g class="judge-prompt-anatomy-stage judge-prompt-anatomy-s5">
    <rect class="judge-prompt-anatomy-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="judge-prompt-anatomy-step" x="829" y="142">06</text>
    <text class="judge-prompt-anatomy-name" x="855" y="142">Temperature zero</text>
    <text class="judge-prompt-anatomy-desc" x="829" y="166">So the same input</text>
    <text class="judge-prompt-anatomy-desc" x="829" y="182">produces the same</text>
    <text class="judge-prompt-anatomy-desc" x="829" y="198">verdict.</text>
  </g>
  <text class="judge-prompt-anatomy-sub" x="30" y="304">Requiring the critique before the score is not a formatting preference: a number emitted first is a guess the rationale then justifies, and the reverse order produces a rationale the number follows from.</text>
</svg>
