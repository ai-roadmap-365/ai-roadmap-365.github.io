<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where a compiler is better.">
  <title>Where a judge belongs</title>
  <style>
    .judge-when-bg   { fill: #f8fafc; }
    .judge-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .judge-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .judge-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .judge-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .judge-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .judge-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .judge-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .judge-when-row { opacity: 1; }
    .judge-when-r0 { animation-delay: 0.00s; }
    .judge-when-r1 { animation-delay: 0.45s; }
    .judge-when-r2 { animation-delay: 0.90s; }
    .judge-when-r3 { animation-delay: 1.35s; }
    .judge-when-r4 { animation-delay: 1.80s; }
    .judge-when-row { animation: judge-when-reveal 7.3s ease-in-out infinite; }
    @keyframes judge-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="judge-when-bg" width="980" height="390"/>
  <text class="judge-when-h1"  x="30" y="40">Where a judge belongs</text>
  <text class="judge-when-sub" x="30" y="64">And where a compiler is better.</text>
  <rect class="judge-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="judge-when-name" x="46" y="122">Use a judge</text>
  <text class="judge-when-desc" x="46" y="142">Open-ended qualities.</text>
  <text class="judge-when-desc judge-when-row judge-when-r0" x="46" y="182">RAG faithfulness and answer relevance</text>
  <text class="judge-when-desc judge-when-row judge-when-r1" x="46" y="216">Support tone and helpfulness</text>
  <text class="judge-when-desc judge-when-row judge-when-r2" x="46" y="250">Multi-step reasoning quality</text>
  <text class="judge-when-desc judge-when-row judge-when-r3" x="46" y="284">Summarisation across documents</text>
  <text class="judge-when-desc judge-when-row judge-when-r4" x="46" y="318">Anything with no single right wording</text>
  <rect class="judge-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="judge-when-name" x="526" y="122">Use a deterministic check</text>
  <text class="judge-when-desc" x="526" y="142">Facts with one answer.</text>
  <text class="judge-when-desc judge-when-row judge-when-r0" x="526" y="182">JSON syntax — use a parser</text>
  <text class="judge-when-desc judge-when-row judge-when-r1" x="526" y="216">Arithmetic — compute it</text>
  <text class="judge-when-desc judge-when-row judge-when-r2" x="526" y="250">Code correctness — compile and test</text>
  <text class="judge-when-desc judge-when-row judge-when-r3" x="526" y="284">Exact identifiers and amounts</text>
  <text class="judge-when-desc judge-when-row judge-when-r4" x="526" y="318">A judge here is slower and less reliable</text>
  <text class="judge-when-sub" x="30" y="372">A judge is also not a substitute for security red-teaming: it grades quality against a rubric, and an adversarial probe is a different activity with a different success criterion — Day 349's.</text>
</svg>
