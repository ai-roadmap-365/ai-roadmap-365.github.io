<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four dimensions, not one score.">
  <title>Decompose the rubric</title>
  <style>
    .rubric-decomposition-bg   { fill: #f8fafc; }
    .rubric-decomposition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubric-decomposition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubric-decomposition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubric-decomposition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubric-decomposition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rubric-decomposition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rubric-decomposition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rubric-decomposition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rubric-decomposition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rubric-decomposition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rubric-decomposition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rubric-decomposition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rubric-decomposition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rubric-decomposition-stage { opacity: 1; }

    .rubric-decomposition-s0 { animation-delay: 0.00s; }
    .rubric-decomposition-e0 { animation-delay: 0.00s; }
    .rubric-decomposition-s1 { animation-delay: 1.28s; }
    .rubric-decomposition-e1 { animation-delay: 1.28s; }
    .rubric-decomposition-s2 { animation-delay: 2.56s; }
    .rubric-decomposition-e2 { animation-delay: 2.56s; }
    .rubric-decomposition-s3 { animation-delay: 3.84s; }
    .rubric-decomposition-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rubric-decomposition-conn  { animation: rubric-decomposition-trace 6.4s ease-in-out infinite; }
      .rubric-decomposition-stage { animation: rubric-decomposition-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rubric-decomposition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rubric-decomposition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rubric-decomposition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rubric-decomposition-stage { animation: rubric-decomposition-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rubric-decomposition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rubric-decomposition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rubric-decomposition-bg" width="980" height="322"/>
  <text class="rubric-decomposition-h1"  x="30" y="40">Decompose the rubric</text>
  <text class="rubric-decomposition-sub" x="30" y="64">Four dimensions, not one score.</text>
  <g class="rubric-decomposition-stage rubric-decomposition-s0">
    <rect class="rubric-decomposition-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rubric-decomposition-step" x="44" y="142">01</text>
    <text class="rubric-decomposition-name" x="70" y="142">Faithfulness and grounding</text>
    <text class="rubric-decomposition-desc" x="44" y="166">Every stated fact verifiable</text>
    <text class="rubric-decomposition-desc" x="44" y="182">against the retrieved context.</text>
    <text class="rubric-decomposition-edge" x="44" y="242">1-5</text>
  </g>
  <line class="rubric-decomposition-line rubric-decomposition-conn rubric-decomposition-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rubric-decomposition-tip)"/>
  <g class="rubric-decomposition-stage rubric-decomposition-s1">
    <rect class="rubric-decomposition-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rubric-decomposition-step" x="280" y="142">02</text>
    <text class="rubric-decomposition-name" x="306" y="142">Relevance and directness</text>
    <text class="rubric-decomposition-desc" x="280" y="166">Answers the question asked,</text>
    <text class="rubric-decomposition-desc" x="280" y="182">without tangential filler.</text>
    <text class="rubric-decomposition-edge" x="280" y="242">1-5</text>
  </g>
  <line class="rubric-decomposition-line rubric-decomposition-conn rubric-decomposition-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rubric-decomposition-tip)"/>
  <g class="rubric-decomposition-stage rubric-decomposition-s2">
    <rect class="rubric-decomposition-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rubric-decomposition-step" x="516" y="142">03</text>
    <text class="rubric-decomposition-name" x="542" y="142">Tone and brand alignment</text>
    <text class="rubric-decomposition-desc" x="516" y="166">Matches the intended persona.</text>
    <text class="rubric-decomposition-edge" x="516" y="242">1-5</text>
  </g>
  <line class="rubric-decomposition-line rubric-decomposition-conn rubric-decomposition-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rubric-decomposition-tip)"/>
  <g class="rubric-decomposition-stage rubric-decomposition-s3">
    <rect class="rubric-decomposition-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rubric-decomposition-step" x="752" y="142">04</text>
    <text class="rubric-decomposition-name" x="778" y="142">Safety and policy</text>
    <text class="rubric-decomposition-desc" x="752" y="166">No leaked keys, no PII, no</text>
    <text class="rubric-decomposition-desc" x="752" y="182">forbidden advice.</text>
    <text class="rubric-decomposition-edge" x="752" y="242">pass/fail</text>
  </g>
  <text class="rubric-decomposition-sub" x="30" y="304">A composite score hides exactly the information a regression needs: faithfulness falling while tone improves nets out to no change, and only separate sub-scores reveal that the system got less accurate.</text>
</svg>
