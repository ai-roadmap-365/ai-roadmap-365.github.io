<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Anonymised, order-swapped, scored on a card.">
  <title>A blind tasting</title>
  <style>
    .sommelier-bg   { fill: #f8fafc; }
    .sommelier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sommelier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sommelier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sommelier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sommelier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sommelier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sommelier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sommelier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sommelier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sommelier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sommelier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sommelier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sommelier-row { opacity: 1; }
    .sommelier-r0 { animation-delay: 0.00s; }
    .sommelier-r1 { animation-delay: 0.45s; }
    .sommelier-r2 { animation-delay: 0.90s; }
    .sommelier-r3 { animation-delay: 1.35s; }
    .sommelier-r4 { animation-delay: 1.80s; }
    .sommelier-row { animation: sommelier-reveal 7.3s ease-in-out infinite; }
    @keyframes sommelier-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sommelier-bg" width="980" height="390"/>
  <text class="sommelier-h1"  x="30" y="40">A blind tasting</text>
  <text class="sommelier-sub" x="30" y="64">Anonymised, order-swapped, scored on a card.</text>
  <rect class="sommelier-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sommelier-name" x="46" y="122">Labels visible</text>
  <text class="sommelier-desc" x="46" y="142">Bias, unavoidably.</text>
  <text class="sommelier-desc sommelier-row sommelier-r0" x="46" y="182">The expensive label is seen</text>
  <text class="sommelier-desc sommelier-row sommelier-r1" x="46" y="216">Expectation shapes the verdict</text>
  <text class="sommelier-desc sommelier-row sommelier-r2" x="46" y="250">One order, one tasting</text>
  <text class="sommelier-desc sommelier-row sommelier-r3" x="46" y="284">No standard scoring card</text>
  <text class="sommelier-desc sommelier-row sommelier-r4" x="46" y="318">A confident, contaminated result</text>
  <rect class="sommelier-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sommelier-name" x="526" y="122">Blind and swapped</text>
  <text class="sommelier-desc" x="526" y="142">Three controls.</text>
  <text class="sommelier-desc sommelier-row sommelier-r0" x="526" y="182">Identical unmarked glasses</text>
  <text class="sommelier-desc sommelier-row sommelier-r1" x="526" y="216">Tasted in both orders</text>
  <text class="sommelier-desc sommelier-row sommelier-r2" x="526" y="250">Aroma, acidity, tannin, finish scored separately</text>
  <text class="sommelier-desc sommelier-row sommelier-r3" x="526" y="284">A standard 1-100 card</text>
  <text class="sommelier-desc sommelier-row sommelier-r4" x="526" y="318">Reproducible across sessions</text>
  <text class="sommelier-sub" x="30" y="372">Scoring the dimensions separately is the part that carries over most directly: a single overall impression cannot be diagnosed, and four sub-scores tell you which quality moved.</text>
</svg>
