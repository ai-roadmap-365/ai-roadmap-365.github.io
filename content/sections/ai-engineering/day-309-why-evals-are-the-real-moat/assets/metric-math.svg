<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="What each one actually measures.">
  <title>Three metrics, precisely</title>
  <style>
    .metric-math-bg   { fill: #f8fafc; }
    .metric-math-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-math-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-math-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-math-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-math-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-math-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-math-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-math-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-math-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-math-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-math-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-math-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-math-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-math-stage { opacity: 1; }

    .metric-math-s0 { animation-delay: 0.00s; }
    .metric-math-e0 { animation-delay: 0.00s; }
    .metric-math-s1 { animation-delay: 1.50s; }
    .metric-math-e1 { animation-delay: 1.50s; }
    .metric-math-s2 { animation-delay: 3.00s; }
    .metric-math-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-math-conn  { animation: metric-math-trace 6s ease-in-out infinite; }
      .metric-math-stage { animation: metric-math-arrive 6s ease-in-out infinite; }
    }
    @keyframes metric-math-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-math-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-math-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-math-stage { animation: metric-math-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-math-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-math-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-math-bg" width="980" height="322"/>
  <text class="metric-math-h1"  x="30" y="40">Three metrics, precisely</text>
  <text class="metric-math-sub" x="30" y="64">What each one actually measures.</text>
  <g class="metric-math-stage metric-math-s0">
    <rect class="metric-math-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="metric-math-step" x="44" y="142">01</text>
    <text class="metric-math-name" x="70" y="142">Exact match</text>
    <text class="metric-math-desc" x="44" y="166">Binary, after normalisation. Right for</text>
    <text class="metric-math-desc" x="44" y="182">identifiers and amounts.</text>
    <text class="metric-math-edge" x="44" y="242">0 or 1</text>
  </g>
  <line class="metric-math-line metric-math-conn metric-math-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#metric-math-tip)"/>
  <g class="metric-math-stage metric-math-s1">
    <rect class="metric-math-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="metric-math-step" x="359" y="142">02</text>
    <text class="metric-math-name" x="385" y="142">Token F1</text>
    <text class="metric-math-desc" x="359" y="166">Overlap of token sets. Precision and recall,</text>
    <text class="metric-math-desc" x="359" y="182">harmonically combined.</text>
  </g>
  <line class="metric-math-line metric-math-conn metric-math-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#metric-math-tip)"/>
  <g class="metric-math-stage metric-math-s2">
    <rect class="metric-math-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="metric-math-step" x="674" y="142">03</text>
    <text class="metric-math-name" x="700" y="142">ROUGE-L</text>
    <text class="metric-math-desc" x="674" y="166">Longest common subsequence, so word order</text>
    <text class="metric-math-desc" x="674" y="182">counts.</text>
    <text class="metric-math-edge" x="674" y="242">sequence</text>
  </g>
  <text class="metric-math-sub" x="30" y="304">Choosing per field rather than per response is what makes these useful: an extracted dollar amount wants exact match, and the summary in the same response wants something that tolerates rephrasing.</text>
</svg>
