<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All answerable yes or no.">
  <title>Five readiness checks</title>
  <style>
    .eval-readiness-bg   { fill: #f8fafc; }
    .eval-readiness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-readiness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-readiness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-readiness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-readiness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-readiness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-readiness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-readiness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-readiness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-readiness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-readiness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-readiness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-readiness-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-readiness-stage { opacity: 1; }

    .eval-readiness-s0 { animation-delay: 0.00s; }
    .eval-readiness-e0 { animation-delay: 0.00s; }
    .eval-readiness-s1 { animation-delay: 1.33s; }
    .eval-readiness-e1 { animation-delay: 1.33s; }
    .eval-readiness-s2 { animation-delay: 2.67s; }
    .eval-readiness-e2 { animation-delay: 2.67s; }
    .eval-readiness-s3 { animation-delay: 4.00s; }
    .eval-readiness-e3 { animation-delay: 4.00s; }
    .eval-readiness-s4 { animation-delay: 5.33s; }
    .eval-readiness-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-readiness-conn  { animation: eval-readiness-trace 8s ease-in-out infinite; }
      .eval-readiness-stage { animation: eval-readiness-arrive 8s ease-in-out infinite; }
    }
    @keyframes eval-readiness-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-readiness-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-readiness-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-readiness-stage { animation: eval-readiness-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-readiness-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-readiness-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-readiness-bg" width="980" height="322"/>
  <text class="eval-readiness-h1"  x="30" y="40">Five readiness checks</text>
  <text class="eval-readiness-sub" x="30" y="64">All answerable yes or no.</text>
  <g class="eval-readiness-stage eval-readiness-s0">
    <rect class="eval-readiness-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="eval-readiness-step" x="44" y="142">01</text>
    <text class="eval-readiness-name" x="70" y="142">A versioned ground truth set</text>
    <text class="eval-readiness-desc" x="44" y="166">At least a hundred</text>
    <text class="eval-readiness-desc" x="44" y="182">domain-specific examples.</text>
  </g>
  <line class="eval-readiness-line eval-readiness-conn eval-readiness-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#eval-readiness-tip)"/>
  <g class="eval-readiness-stage eval-readiness-s1">
    <rect class="eval-readiness-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="eval-readiness-step" x="233" y="142">02</text>
    <text class="eval-readiness-name" x="259" y="142">Deterministic gates in CI</text>
    <text class="eval-readiness-desc" x="233" y="166">Schemas, exact matches</text>
    <text class="eval-readiness-desc" x="233" y="182">and regex constraints,</text>
    <text class="eval-readiness-desc" x="233" y="198">automatically.</text>
  </g>
  <line class="eval-readiness-line eval-readiness-conn eval-readiness-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#eval-readiness-tip)"/>
  <g class="eval-readiness-stage eval-readiness-s2">
    <rect class="eval-readiness-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="eval-readiness-step" x="422" y="142">03</text>
    <text class="eval-readiness-name" x="448" y="142">Anchored rubrics</text>
    <text class="eval-readiness-desc" x="422" y="166">1-5 scales with described</text>
    <text class="eval-readiness-desc" x="422" y="182">anchors, not "rate the</text>
    <text class="eval-readiness-desc" x="422" y="198">quality".</text>
  </g>
  <line class="eval-readiness-line eval-readiness-conn eval-readiness-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#eval-readiness-tip)"/>
  <g class="eval-readiness-stage eval-readiness-s3">
    <rect class="eval-readiness-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="eval-readiness-step" x="611" y="142">04</text>
    <text class="eval-readiness-name" x="637" y="142">A pinned baseline</text>
    <text class="eval-readiness-desc" x="611" y="166">Immutable, so every run</text>
    <text class="eval-readiness-desc" x="611" y="182">produces a delta.</text>
  </g>
  <line class="eval-readiness-line eval-readiness-conn eval-readiness-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#eval-readiness-tip)"/>
  <g class="eval-readiness-stage eval-readiness-s4">
    <rect class="eval-readiness-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="eval-readiness-step" x="800" y="142">05</text>
    <text class="eval-readiness-name" x="826" y="142">Merges blocked on regression</text>
    <text class="eval-readiness-desc" x="800" y="166">Otherwise the suite is a</text>
    <text class="eval-readiness-desc" x="800" y="182">report, not a gate.</text>
  </g>
  <text class="eval-readiness-sub" x="30" y="304">Anchored rubrics are the item most often done badly: an unanchored 1-5 scale produces judge scores that drift between runs, which destroys the comparability the baseline exists to provide.</text>
</svg>
