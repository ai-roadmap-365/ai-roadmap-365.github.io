<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Twelve percent missed, then zero regressions.">
  <title>One team, before and after</title>
  <style>
    .legal-case-bg   { fill: #f8fafc; }
    .legal-case-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legal-case-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legal-case-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legal-case-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legal-case-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legal-case-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .legal-case-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .legal-case-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .legal-case-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .legal-case-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .legal-case-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .legal-case-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .legal-case-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .legal-case-stage { opacity: 1; }

    .legal-case-s0 { animation-delay: 0.00s; }
    .legal-case-e0 { animation-delay: 0.00s; }
    .legal-case-s1 { animation-delay: 1.28s; }
    .legal-case-e1 { animation-delay: 1.28s; }
    .legal-case-s2 { animation-delay: 2.56s; }
    .legal-case-e2 { animation-delay: 2.56s; }
    .legal-case-s3 { animation-delay: 3.84s; }
    .legal-case-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .legal-case-conn  { animation: legal-case-trace 6.4s ease-in-out infinite; }
      .legal-case-stage { animation: legal-case-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes legal-case-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes legal-case-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .legal-case-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .legal-case-stage { animation: legal-case-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes legal-case-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="legal-case-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="legal-case-bg" width="980" height="322"/>
  <text class="legal-case-h1"  x="30" y="40">One team, before and after</text>
  <text class="legal-case-sub" x="30" y="64">Twelve percent missed, then zero regressions.</text>
  <g class="legal-case-stage legal-case-s0">
    <rect class="legal-case-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="legal-case-step" x="44" y="142">01</text>
    <text class="legal-case-name" x="70" y="142">Ten manual samples</text>
    <text class="legal-case-desc" x="44" y="166">Prompt 3.0 shipped. 12% of</text>
    <text class="legal-case-desc" x="44" y="182">commercial leases missed mutual</text>
    <text class="legal-case-desc" x="44" y="198">indemnification.</text>
  </g>
  <line class="legal-case-line legal-case-conn legal-case-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#legal-case-tip)"/>
  <g class="legal-case-stage legal-case-s1">
    <rect class="legal-case-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="legal-case-step" x="280" y="142">02</text>
    <text class="legal-case-name" x="306" y="142">450 labelled contracts</text>
    <text class="legal-case-desc" x="280" y="166">Curated by senior attorneys. The</text>
    <text class="legal-case-desc" x="280" y="182">dataset is the asset.</text>
    <text class="legal-case-edge" x="280" y="242">domain</text>
  </g>
  <line class="legal-case-line legal-case-conn legal-case-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#legal-case-tip)"/>
  <g class="legal-case-stage legal-case-s2">
    <rect class="legal-case-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="legal-case-step" x="516" y="142">03</text>
    <text class="legal-case-name" x="542" y="142">A multi-tier suite</text>
    <text class="legal-case-desc" x="516" y="166">Exact match for dollar limits,</text>
    <text class="legal-case-desc" x="516" y="182">JSON F1 for tables, a judge for</text>
    <text class="legal-case-desc" x="516" y="198">interpretation.</text>
  </g>
  <line class="legal-case-line legal-case-conn legal-case-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#legal-case-tip)"/>
  <g class="legal-case-stage legal-case-s3">
    <rect class="legal-case-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="legal-case-step" x="752" y="142">04</text>
    <text class="legal-case-name" x="778" y="142">34 iterations, 3 migrations</text>
    <text class="legal-case-desc" x="752" y="166">Twelve months, zero production</text>
    <text class="legal-case-desc" x="752" y="182">regressions.</text>
  </g>
  <text class="legal-case-sub" x="30" y="304">The gate is worth noting precisely: 100% on high-risk indemnity clauses and above 92% composite, which is a different threshold per risk class rather than one number for everything.</text>
</svg>
