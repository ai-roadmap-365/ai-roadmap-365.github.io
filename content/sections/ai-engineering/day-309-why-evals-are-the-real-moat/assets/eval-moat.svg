<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where they are overhead.">
  <title>Where evals are the moat</title>
  <style>
    .eval-moat-bg   { fill: #f8fafc; }
    .eval-moat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-moat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-moat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-moat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-moat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-moat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-moat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-moat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-moat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-moat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-moat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-moat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-moat-row { opacity: 1; }
    .eval-moat-r0 { animation-delay: 0.00s; }
    .eval-moat-r1 { animation-delay: 0.45s; }
    .eval-moat-r2 { animation-delay: 0.90s; }
    .eval-moat-r3 { animation-delay: 1.35s; }
    .eval-moat-r4 { animation-delay: 1.80s; }
    .eval-moat-row { animation: eval-moat-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-moat-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-moat-bg" width="980" height="390"/>
  <text class="eval-moat-h1"  x="30" y="40">Where evals are the moat</text>
  <text class="eval-moat-sub" x="30" y="64">And where they are overhead.</text>
  <rect class="eval-moat-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-moat-name" x="46" y="122">Build the harness</text>
  <text class="eval-moat-desc" x="46" y="142">Anything with users.</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r0" x="46" y="182">Customer-facing AI applications</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r1" x="46" y="216">RAG pipelines and extraction bots</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r2" x="46" y="250">Agentic workflows</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r3" x="46" y="284">Anywhere a silent regression would matter</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r4" x="46" y="318">Which is nearly everything in production</text>
  <rect class="eval-moat-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-moat-name" x="526" y="122">Do not</text>
  <text class="eval-moat-desc" x="526" y="142">Disposable work.</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r0" x="526" y="182">One-off brainstorming</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r1" x="526" y="216">Throwaway prototypes</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r2" x="526" y="250">An academic benchmark is not your domain</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r3" x="526" y="284">MMLU says nothing about your workflows</text>
  <text class="eval-moat-desc eval-moat-row eval-moat-r4" x="526" y="318">But keep the failures you find</text>
  <text class="eval-moat-sub" x="30" y="372">Keeping the failures even for a prototype is the cheap half of the flywheel: a text file of inputs that went wrong is the seed of the dataset, and it costs nothing to start collecting.</text>
</svg>
