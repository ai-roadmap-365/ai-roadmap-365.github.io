<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three prompts, or five hundred examples.">
  <title>Vibe checks against an eval suite</title>
  <style>
    .vibe-or-eval-bg   { fill: #f8fafc; }
    .vibe-or-eval-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-eval-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-eval-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-eval-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-eval-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vibe-or-eval-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vibe-or-eval-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vibe-or-eval-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vibe-or-eval-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vibe-or-eval-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vibe-or-eval-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vibe-or-eval-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vibe-or-eval-row { opacity: 1; }
    .vibe-or-eval-r0 { animation-delay: 0.00s; }
    .vibe-or-eval-r1 { animation-delay: 0.45s; }
    .vibe-or-eval-r2 { animation-delay: 0.90s; }
    .vibe-or-eval-r3 { animation-delay: 1.35s; }
    .vibe-or-eval-r4 { animation-delay: 1.80s; }
    .vibe-or-eval-row { animation: vibe-or-eval-reveal 7.3s ease-in-out infinite; }
    @keyframes vibe-or-eval-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vibe-or-eval-bg" width="980" height="390"/>
  <text class="vibe-or-eval-h1"  x="30" y="40">Vibe checks against an eval suite</text>
  <text class="vibe-or-eval-sub" x="30" y="64">Three prompts, or five hundred examples.</text>
  <rect class="vibe-or-eval-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vibe-or-eval-name" x="46" y="122">Vibe checks</text>
  <text class="vibe-or-eval-desc" x="46" y="142">Three prompts, a nod.</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r0" x="46" y="182">Whatever examples came to mind</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r1" x="46" y="216">No record of what was checked</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r2" x="46" y="250">No baseline to compare against</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r3" x="46" y="284">A tone fix breaks order-number parsing</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r4" x="46" y="318">Discovered by customers</text>
  <rect class="vibe-or-eval-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vibe-or-eval-name" x="526" y="122">An eval suite</text>
  <text class="vibe-or-eval-desc" x="526" y="142">Curated and repeatable.</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r0" x="526" y="182">Hundreds of domain-specific examples</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r1" x="526" y="216">Versioned, with a pinned baseline</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r2" x="526" y="250">Deltas measured, not felt</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r3" x="526" y="284">A regression blocks the merge</text>
  <text class="vibe-or-eval-desc vibe-or-eval-row vibe-or-eval-r4" x="526" y="318">Discovered in CI</text>
  <text class="vibe-or-eval-sub" x="30" y="372">The fear of editing prompts is the symptom worth watching for: a team that will not touch a system prompt has correctly concluded it cannot detect what a change would break.</text>
</svg>
