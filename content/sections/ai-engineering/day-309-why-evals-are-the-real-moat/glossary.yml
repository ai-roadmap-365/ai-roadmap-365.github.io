terms:
- term: Evaluation Moat
  definition: A proprietary collection of labeled domain datasets and rubrics enabling rapid AI optimization.
- term: Vibe Check
  definition: Subjective, unscientific manual testing of a handful of prompts by an individual developer.
- term: Exact Match (EM)
  definition: A binary evaluation metric checking if model output exactly matches the ground truth string.
- term: Evaluation-Driven Development (EDD)
  definition: Authoring eval datasets and rubrics before tuning prompts or fine-tuning models.
- term: Golden Test Set
  definition: A curated, high-priority benchmark dataset representing critical business invariants.
- term: Pass@k
  definition: The probability that at least one of $k$ generated candidate outputs satisfies all evaluation
    criteria.
- term: Semantic Similarity Metric
  definition: Using cosine similarity of text embeddings to measure closeness of meaning.
- term: Regression Gate
  definition: An automated CI check blocking deployment if eval scores fall below baseline thresholds.
