questions:
- question: Why are proprietary evaluation datasets considered the true competitive moat in production
    AI applications?
  options:
  - Because hard drives are expensive
  - Because evals replace all backend databases
  - Because evals prevent computers from overheating
  - 'Weights and prompts commoditise; your eval set does not'
  answer_index: 3
  explanation: High-quality domain evaluation datasets allow teams to switch model vendors, optimize prompts,
    and fine-tune models with deterministic confidence.
- question: What is the primary limitation of relying solely on 'Vibe Checks' (manual ad-hoc prompting)
    when developing AI features?
  options:
  - 'No statistical power, and it cannot run in CI'
  - It requires Python 3.12
  - It makes language models run out of memory
  - It only works on Linux
  answer_index: 0
  explanation: Vibe checks are subjective, unrepeatable, and incapable of detecting regressions across
    diverse datasets.
- question: Which evaluation metric is best suited for assessing factual extraction from structured documents
    (e.g. extracting JSON invoice fields)?
  options:
  - Perplexity
  - 'Exact match and field-level F1'
  - BLEU score
  - Sentence length count
  answer_index: 1
  explanation: Exact Match and field-level F1 evaluate deterministic data extraction accuracy without
    subjective scoring.
- question: What is 'Evaluation-Driven Development' (EDD) in AI engineering?
  options:
  - Writing code without unit tests
  - Deploying models directly to production to see if users complain
  - 'Write the eval set before tuning anything'
  - Generating random data
  answer_index: 2
  explanation: EDD establishes objective benchmarks before model experimentation, mirroring TDD in classical
    software.
- question: What is a 'Regression Gate' in an AI evaluation pipeline?
  options:
  - A firewall rule blocking inbound network traffic
  - A git branch deletion command
  - A database transaction lock
  - 'A CI gate that blocks a drop against the baseline'
  answer_index: 3
  explanation: Regression gates prevent degraded prompt changes or model updates from entering production.
