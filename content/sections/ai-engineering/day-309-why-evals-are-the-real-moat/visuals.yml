visuals:
- id: ai-evaluation-hierarchy-and-taxonomy
  file: assets/ai-evaluation-hierarchy-and-taxonomy.svg
  type: diagram
  title: AI Evaluation Hierarchy and Taxonomy
  alt: AI Evaluation Hierarchy and Taxonomy showing Heuristics & Exact Match, Embedding Similarity, LLM-as-Judge
    Rubrics, Human Expert Review, and Production Observability
  description: Taxonomy diagram comparing the five tiers of production AI evaluation.
- id: evaluation-driven-development-lifecycle
  file: assets/evaluation-driven-development-lifecycle.svg
  type: diagram
  title: Evaluation Driven Development Lifecycle
  alt: Evaluation Driven Development Lifecycle showing Curate Dataset, Run Baseline Eval, Optimize Prompt
    or Model, Execute Regression Gate, and Deploy
  description: Lifecycle flowchart showing the iterative Evaluation-Driven Development (EDD) workflow.
- id: eval-tiers
  file: assets/eval-tiers.svg
  type: diagram
  title: 'Three tiers of evaluation'
  alt: 'Diagram: the three tiers of an AI evaluation harness'
  description: 'A three-stage description of evaluation tiers covering deterministic checks, semantic similarity and model-graded rubrics.'
- id: vibe-or-eval
  file: assets/vibe-or-eval.svg
  type: diagram
  title: 'Vibe checks against an eval suite'
  alt: 'Diagram: manual spot-checking compared with an automated evaluation harness'
  description: 'A two-column comparison of subjective manual review against a curated automated evaluation suite.'
- id: eval-lineage
  file: assets/eval-lineage.svg
  type: diagram
  title: 'Three eras of evaluation'
  alt: 'Diagram: the progression from supervised metrics to LLM-as-judge evaluation'
  description: 'A three-stage progression of evaluation from classification metrics through n-gram overlap to holistic multi-dimensional evaluation.'
- id: eval-benefits
  file: assets/eval-benefits.svg
  type: diagram
  title: 'Three things evals unlock'
  alt: 'Diagram: the three capabilities an evaluation harness provides'
  description: 'A three-stage description of evaluation benefits covering confident prompt editing, model migration and the production feedback flywheel.'
- id: metric-math
  file: assets/metric-math.svg
  type: diagram
  title: 'Three metrics, precisely'
  alt: 'Diagram: exact match, token F1 and ROUGE-L compared'
  description: 'A three-stage description of evaluation metrics covering exact match, token-level F1 and longest-common-subsequence ROUGE.'
- id: olympic-timing
  file: assets/olympic-timing.svg
  type: diagram
  title: 'Olympic timing'
  alt: 'Diagram: measured athletic timing compared with subjective judgement'
  description: 'A two-column comparison of instrumented measurement against audience judgement, as an analogy for evaluation.'
- id: legal-case
  file: assets/legal-case.svg
  type: diagram
  title: 'One team, before and after'
  alt: 'Diagram: the measured effect of adopting evaluation-driven development'
  description: 'A four-stage walkthrough of a legal AI team''s transition from manual testing to a multi-tier evaluation harness.'
- id: eval-cost
  file: assets/eval-cost.svg
  type: diagram
  title: 'Evaluation costs money'
  alt: 'Diagram: tiered evaluation cadence compared with running every check on every commit'
  description: 'A two-column comparison of tiered evaluation scheduling against running the full judged suite continuously.'
- id: eval-readiness
  file: assets/eval-readiness.svg
  type: diagram
  title: 'Five readiness checks'
  alt: 'Diagram: the five-point evaluation readiness checklist'
  description: 'A five-stage checklist covering the ground truth dataset, deterministic gates, rubrics, pinned baselines and CI integration.'
- id: eval-moat
  file: assets/eval-moat.svg
  type: diagram
  title: 'Where evals are the moat'
  alt: 'Diagram: when a formal evaluation harness is warranted'
  description: 'A two-column comparison of systems requiring formal evaluation against those where it is disproportionate, and what the harness accumulates.'
