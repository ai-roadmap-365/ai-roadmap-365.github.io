<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Because a contract spans all of them.">
  <title>Six layers, one turn</title>
  <style>
    .atomic-multifile-bg   { fill: #f8fafc; }
    .atomic-multifile-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-multifile-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-multifile-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-multifile-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-multifile-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .atomic-multifile-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .atomic-multifile-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .atomic-multifile-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .atomic-multifile-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .atomic-multifile-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .atomic-multifile-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .atomic-multifile-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .atomic-multifile-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .atomic-multifile-stage { opacity: 1; }

    .atomic-multifile-s0 { animation-delay: 0.00s; }
    .atomic-multifile-e0 { animation-delay: 0.00s; }
    .atomic-multifile-s1 { animation-delay: 1.37s; }
    .atomic-multifile-e1 { animation-delay: 1.37s; }
    .atomic-multifile-s2 { animation-delay: 2.74s; }
    .atomic-multifile-e2 { animation-delay: 2.74s; }
    .atomic-multifile-s3 { animation-delay: 4.11s; }
    .atomic-multifile-e3 { animation-delay: 4.11s; }
    .atomic-multifile-s4 { animation-delay: 5.49s; }
    .atomic-multifile-e4 { animation-delay: 5.49s; }
    .atomic-multifile-s5 { animation-delay: 6.86s; }
    .atomic-multifile-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .atomic-multifile-conn  { animation: atomic-multifile-trace 9.600000000000001s ease-in-out infinite; }
      .atomic-multifile-stage { animation: atomic-multifile-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes atomic-multifile-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes atomic-multifile-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .atomic-multifile-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .atomic-multifile-stage { animation: atomic-multifile-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes atomic-multifile-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="atomic-multifile-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="atomic-multifile-bg" width="980" height="322"/>
  <text class="atomic-multifile-h1"  x="30" y="40">Six layers, one turn</text>
  <text class="atomic-multifile-sub" x="30" y="64">Because a contract spans all of them.</text>
  <g class="atomic-multifile-stage atomic-multifile-s0">
    <rect class="atomic-multifile-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="44" y="142">01</text>
    <text class="atomic-multifile-name" x="70" y="142">Database model</text>
    <text class="atomic-multifile-desc" x="44" y="166">The schema the data</text>
    <text class="atomic-multifile-desc" x="44" y="182">actually has.</text>
  </g>
  <line class="atomic-multifile-line atomic-multifile-conn atomic-multifile-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#atomic-multifile-tip)"/>
  <g class="atomic-multifile-stage atomic-multifile-s1">
    <rect class="atomic-multifile-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="201" y="142">02</text>
    <text class="atomic-multifile-name" x="227" y="142">Validation schema</text>
    <text class="atomic-multifile-desc" x="201" y="166">The DTO the API</text>
    <text class="atomic-multifile-desc" x="201" y="182">accepts and returns.</text>
  </g>
  <line class="atomic-multifile-line atomic-multifile-conn atomic-multifile-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#atomic-multifile-tip)"/>
  <g class="atomic-multifile-stage atomic-multifile-s2">
    <rect class="atomic-multifile-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="358" y="142">03</text>
    <text class="atomic-multifile-name" x="384" y="142">Service layer</text>
    <text class="atomic-multifile-desc" x="358" y="166">The business logic</text>
    <text class="atomic-multifile-desc" x="358" y="182">between them.</text>
  </g>
  <line class="atomic-multifile-line atomic-multifile-conn atomic-multifile-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#atomic-multifile-tip)"/>
  <g class="atomic-multifile-stage atomic-multifile-s3">
    <rect class="atomic-multifile-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="515" y="142">04</text>
    <text class="atomic-multifile-name" x="541" y="142">Route handler</text>
    <text class="atomic-multifile-desc" x="515" y="166">The public surface.</text>
  </g>
  <line class="atomic-multifile-line atomic-multifile-conn atomic-multifile-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#atomic-multifile-tip)"/>
  <g class="atomic-multifile-stage atomic-multifile-s4">
    <rect class="atomic-multifile-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="672" y="142">05</text>
    <text class="atomic-multifile-name" x="698" y="142">Client bindings</text>
    <text class="atomic-multifile-desc" x="672" y="166">Which break silently</text>
    <text class="atomic-multifile-desc" x="672" y="182">if the contract</text>
    <text class="atomic-multifile-desc" x="672" y="198">moved.</text>
  </g>
  <line class="atomic-multifile-line atomic-multifile-conn atomic-multifile-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#atomic-multifile-tip)"/>
  <g class="atomic-multifile-stage atomic-multifile-s5">
    <rect class="atomic-multifile-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="atomic-multifile-step" x="829" y="142">06</text>
    <text class="atomic-multifile-name" x="855" y="142">Integration tests</text>
    <text class="atomic-multifile-desc" x="829" y="166">Which is what proves</text>
    <text class="atomic-multifile-desc" x="829" y="182">all six agree.</text>
  </g>
  <text class="atomic-multifile-sub" x="30" y="304">Changing five of six is the failure this workflow prevents: each layer compiles, the tests are the only thing that notices, and running them in the same turn is what makes the change atomic in practice.</text>
</svg>
