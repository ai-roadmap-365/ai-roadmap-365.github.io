<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Agentic TDD and Plan Execute Workflow">
  <title>Agentic TDD and Plan Execute Workflow</title>
  <defs>
    <style>
      .d304a-bg { fill: #f8fafc; }
      .d304a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d304a-plan { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d304a-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d304a-green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d304a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d304a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d304a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d304a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d304a-bg" />
  
  <text x="40" y="40" class="d304a-title">The 4-Stage Agentic TDD Workflow (Plan -> Red -> Green -> Refactor)</text>
  <text x="40" y="65" class="d304a-subtitle">Agentic TDD and Plan Execute Workflow diagram illustrating Spec, Plan Approval, Write Failing Test Red, Implement Code Green, and Refactor Clean</text>
  
  <!-- Phase 1: Plan -->
  <rect x="40" y="110" width="190" height="270" class="d304a-plan" />
  <text x="55" y="140" class="d304a-header" fill="#1d4ed8">1. Plan-then-Execute</text>
  <text x="55" y="170" class="d304a-text">• User sends spec prompt</text>
  <text x="55" y="190" class="d304a-text">• Agent reads repo structure</text>
  <text x="55" y="210" class="d304a-text">• Outputs architecture plan</text>
  <text x="55" y="230" class="d304a-text">• Identifies all file impacts</text>
  <text x="55" y="260" class="d304a-text" font-weight="600">Human Checkpoint:</text>
  <text x="55" y="280" class="d304a-text">Developer approves plan</text>
  
  <!-- Phase 2: Red Test -->
  <rect x="255" y="110" width="190" height="270" class="d304a-red" />
  <text x="270" y="140" class="d304a-header" fill="#b91c1c">2. RED: Failing Test</text>
  <text x="270" y="170" class="d304a-text">• Writes unit test first</text>
  <text x="270" y="190" class="d304a-text">• Defines expected types</text>
  <text x="270" y="210" class="d304a-text">• Runs `pytest tests/`</text>
  <text x="270" y="230" class="d304a-text">• Verifies test FAILS</text>
  <text x="270" y="260" class="d304a-text" font-weight="600">Goal:</text>
  <text x="270" y="280" class="d304a-text">Establish ground truth</text>
  
  <!-- Phase 3: Green Code -->
  <rect x="470" y="110" width="190" height="270" class="d304a-green" />
  <text x="485" y="140" class="d304a-header" fill="#15803d">3. GREEN: Implement</text>
  <text x="485" y="170" class="d304a-text">• Writes minimal logic</text>
  <text x="485" y="190" class="d304a-text">• Atomic multi-file edits</text>
  <text x="485" y="210" class="d304a-text">• Runs `pytest tests/`</text>
  <text x="485" y="230" class="d304a-text">• Self-corrects until pass</text>
  <text x="485" y="260" class="d304a-text" font-weight="600">State:</text>
  <text x="485" y="280" class="d304a-text">100% tests passing</text>
  
  <!-- Phase 4: Refactor -->
  <rect x="685" y="110" width="175" height="270" class="d304a-card" />
  <text x="700" y="140" class="d304a-header">4. Refactor &amp; Polish</text>
  <text x="700" y="170" class="d304a-text">• Cleans code structure</text>
  <text x="700" y="190" class="d304a-text">• Adds docstrings</text>
  <text x="700" y="210" class="d304a-text">• Runs `mypy` &amp; `ruff`</text>
  <text x="700" y="230" class="d304a-text">• Final regression run</text>
  <text x="700" y="260" class="d304a-text" font-weight="600">Ready:</text>
  <text x="700" y="280" class="d304a-text">Clean PR merge</text>
</svg>