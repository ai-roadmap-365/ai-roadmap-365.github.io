<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four signals from one stack trace.">
  <title>Deconstructing a traceback</title>
  <style>
    .traceback-parsing-bg   { fill: #f8fafc; }
    .traceback-parsing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-parsing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-parsing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-parsing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-parsing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-parsing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .traceback-parsing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .traceback-parsing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .traceback-parsing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .traceback-parsing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .traceback-parsing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .traceback-parsing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .traceback-parsing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .traceback-parsing-stage { opacity: 1; }

    .traceback-parsing-s0 { animation-delay: 0.00s; }
    .traceback-parsing-e0 { animation-delay: 0.00s; }
    .traceback-parsing-s1 { animation-delay: 1.28s; }
    .traceback-parsing-e1 { animation-delay: 1.28s; }
    .traceback-parsing-s2 { animation-delay: 2.56s; }
    .traceback-parsing-e2 { animation-delay: 2.56s; }
    .traceback-parsing-s3 { animation-delay: 3.84s; }
    .traceback-parsing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .traceback-parsing-conn  { animation: traceback-parsing-trace 6.4s ease-in-out infinite; }
      .traceback-parsing-stage { animation: traceback-parsing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes traceback-parsing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes traceback-parsing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .traceback-parsing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .traceback-parsing-stage { animation: traceback-parsing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes traceback-parsing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="traceback-parsing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="traceback-parsing-bg" width="980" height="322"/>
  <text class="traceback-parsing-h1"  x="30" y="40">Deconstructing a traceback</text>
  <text class="traceback-parsing-sub" x="30" y="64">Four signals from one stack trace.</text>
  <g class="traceback-parsing-stage traceback-parsing-s0">
    <rect class="traceback-parsing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-parsing-step" x="44" y="142">01</text>
    <text class="traceback-parsing-name" x="70" y="142">Fault location</text>
    <text class="traceback-parsing-desc" x="44" y="166">The file and line. Not the whole</text>
    <text class="traceback-parsing-desc" x="44" y="182">file.</text>
  </g>
  <line class="traceback-parsing-line traceback-parsing-conn traceback-parsing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#traceback-parsing-tip)"/>
  <g class="traceback-parsing-stage traceback-parsing-s1">
    <rect class="traceback-parsing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-parsing-step" x="280" y="142">02</text>
    <text class="traceback-parsing-name" x="306" y="142">Function scope</text>
    <text class="traceback-parsing-desc" x="280" y="166">Which function, so the</text>
    <text class="traceback-parsing-desc" x="280" y="182">surrounding contract is</text>
    <text class="traceback-parsing-desc" x="280" y="198">retrievable.</text>
  </g>
  <line class="traceback-parsing-line traceback-parsing-conn traceback-parsing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#traceback-parsing-tip)"/>
  <g class="traceback-parsing-stage traceback-parsing-s2">
    <rect class="traceback-parsing-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-parsing-step" x="516" y="142">03</text>
    <text class="traceback-parsing-name" x="542" y="142">Root cause</text>
    <text class="traceback-parsing-desc" x="516" y="166">The exception type, and the</text>
    <text class="traceback-parsing-desc" x="516" y="182">value that produced it.</text>
    <text class="traceback-parsing-edge" x="516" y="242">denominator 0</text>
  </g>
  <line class="traceback-parsing-line traceback-parsing-conn traceback-parsing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#traceback-parsing-tip)"/>
  <g class="traceback-parsing-stage traceback-parsing-s3">
    <rect class="traceback-parsing-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="traceback-parsing-step" x="752" y="142">04</text>
    <text class="traceback-parsing-name" x="778" y="142">A targeted fix</text>
    <text class="traceback-parsing-desc" x="752" y="166">Guard the condition and return a</text>
    <text class="traceback-parsing-desc" x="752" y="182">defined fallback.</text>
  </g>
  <text class="traceback-parsing-sub" x="30" y="304">Sending the raw text works and sending the deconstruction works better: the parsed form tells the agent exactly which two lines to read, rather than asking it to locate the fault itself.</text>
</svg>
