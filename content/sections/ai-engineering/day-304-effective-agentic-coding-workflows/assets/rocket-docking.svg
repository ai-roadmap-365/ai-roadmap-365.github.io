<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fire, measure, correct, verify.">
  <title>An orbital docking system</title>
  <style>
    .rocket-docking-bg   { fill: #f8fafc; }
    .rocket-docking-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rocket-docking-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rocket-docking-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rocket-docking-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rocket-docking-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rocket-docking-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rocket-docking-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rocket-docking-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rocket-docking-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rocket-docking-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rocket-docking-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rocket-docking-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rocket-docking-row { opacity: 1; }
    .rocket-docking-r0 { animation-delay: 0.00s; }
    .rocket-docking-r1 { animation-delay: 0.45s; }
    .rocket-docking-r2 { animation-delay: 0.90s; }
    .rocket-docking-r3 { animation-delay: 1.35s; }
    .rocket-docking-r4 { animation-delay: 1.80s; }
    .rocket-docking-row { animation: rocket-docking-reveal 7.3s ease-in-out infinite; }
    @keyframes rocket-docking-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rocket-docking-bg" width="980" height="390"/>
  <text class="rocket-docking-h1"  x="30" y="40">An orbital docking system</text>
  <text class="rocket-docking-sub" x="30" y="64">Fire, measure, correct, verify.</text>
  <rect class="rocket-docking-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rocket-docking-name" x="46" y="122">Instrumented</text>
  <text class="rocket-docking-desc" x="46" y="142">Every correction measured.</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r0" x="46" y="182">Thrusters fire toward the port</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r1" x="46" y="216">Optical sensors measure alignment</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r2" x="46" y="250">+2.4 degrees of error, detected</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r3" x="46" y="284">Micro-thrusters correct, in reverse</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r4" x="46" y="318">Verified again before the clamps lock</text>
  <rect class="rocket-docking-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rocket-docking-name" x="526" y="122">Uninstrumented</text>
  <text class="rocket-docking-desc" x="526" y="142">Aim and hope.</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r0" x="526" y="182">Fire toward the port</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r1" x="526" y="216">No measurement in the loop</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r2" x="526" y="250">An error nobody detects</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r3" x="526" y="284">No correction, because no signal</text>
  <text class="rocket-docking-desc rocket-docking-row rocket-docking-r4" x="526" y="318">Verified by whether it worked</text>
  <text class="rocket-docking-sub" x="30" y="372">"Verified again before the clamps lock" is the part that maps onto re-running the suite after a fix: correcting without re-measuring is the same as not measuring.</text>
</svg>
