<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Self Healing Test Runner State Machine">
  <title>Self Healing Test Runner State Machine</title>
  <defs>
    <style>
      .d304f-bg { fill: #f8fafc; }
      .d304f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d304f-exec { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d304f-diag { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d304f-fix { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d304f-succ { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d304f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d304f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d304f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d304f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d304f-pipe { stroke: #64748b; stroke-width: 2px; fill: none; }
      .d304f-loop { stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d304f-bg" />
  
  <text x="40" y="40" class="d304a-title">Automated Self-Healing Loop: Execute -> Diagnose -> Patch -> Verify</text>
  <text x="40" y="65" class="d304a-subtitle">Self Healing Test Runner State Machine showing Test Execution, Traceback Extraction, LLM Repair Generation, Patch Apply, and Iteration Limit Guard</text>
  
  <!-- Step 1: Run Test -->
  <rect x="40" y="110" width="180" height="260" class="d304f-exec" />
  <text x="55" y="140" class="d304f-header" fill="#1d4ed8">1. Test Execution</text>
  <text x="55" y="170" class="d304f-text">• Runs `pytest tests/`</text>
  <text x="55" y="190" class="d304f-text">• Evaluates returncode</text>
  <text x="55" y="220" class="d304f-text" font-weight="600">Decision Gate:</text>
  <text x="55" y="240" class="d304f-text">rc == 0 -> Success!</text>
  <text x="55" y="260" class="d304f-text">rc != 0 -> Parse Errors</text>
  
  <!-- Step 2: Extract Diagnostics -->
  <rect x="250" y="110" width="180" height="260" class="d304f-diag" />
  <text x="265" y="140" class="d304f-header" fill="#b91c1c">2. Traceback Parser</text>
  <text x="265" y="170" class="d304f-text">• Extracts failing file</text>
  <text x="265" y="190" class="d304f-text">• Extracts line number</text>
  <text x="265" y="210" class="d304f-text">• Extracts assertion error</text>
  <text x="265" y="240" class="d304f-text" font-weight="600">Output:</text>
  <text x="265" y="260" class="d304f-text">Structured error context</text>
  
  <!-- Step 3: Repair Synthesis -->
  <rect x="460" y="110" width="180" height="260" class="d304f-fix" />
  <text x="475" y="140" class="d304f-header" fill="#7e22ce">3. Repair Synthesis</text>
  <text x="475" y="170" class="d304f-text">• Model analyzes failure</text>
  <text x="475" y="190" class="d304f-text">• Synthesizes patch</text>
  <text x="475" y="210" class="d304f-text">• Applies search/replace</text>
  <text x="475" y="240" class="d304f-text" font-weight="600">Guard:</text>
  <text x="475" y="260" class="d304f-text">Max 4 iterations</text>
  
  <!-- Step 4: Success -->
  <rect x="670" y="110" width="190" height="260" class="d304f-succ" />
  <text x="685" y="140" class="d304f-header" fill="#15803d">4. Verified PR</text>
  <text x="685" y="170" class="d304f-text">• 100% tests green</text>
  <text x="685" y="190" class="d304f-text">• Linter checks pass</text>
  <text x="685" y="210" class="d304f-text">• Generates PR summary</text>
  <text x="685" y="240" class="d304f-text" font-weight="600">Outcome:</text>
  <text x="685" y="260" class="d304f-text">Zero regression merge</text>
  
  <!-- Loop Arrow -->
  <path d="M 550 370 L 550 400 L 130 400 L 130 370" class="d304f-loop" />
  <text x="270" y="415" class="d304f-text" font-weight="600" fill="#dc2626">Iterative Self-Healing Loop (rc != 0)</text>
</svg>