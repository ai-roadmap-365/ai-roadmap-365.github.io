questions:
- question: Why is the two-phase 'Plan-then-Execute' workflow superior to immediate one-shot code editing
    for coding agents?
  options:
  - It makes the agent run slower
  - It forces the model to reason through dependencies, edge cases, and file impacts in planning mode
    before modifying code, allowing the developer to spot architectural flaws early
  - It disables all unit tests
  - It avoids using Python
  answer_index: 1
  explanation: Planning mode separates architectural reasoning from code synthesis, catching flawed assumptions
    before code is modified.
- question: How does Agentic Test-Driven Development (TDD) fundamentally prevent agent hallucinations?
  options:
  - By writing unit tests before implementation code, establishing deterministic failure-to-pass criteria
    (`Red -> Green`) that the agent cannot guess or hallucinate past
  - By compiling C++ code
  - By deleting the git history
  - By increasing LLM temperature to 1.0
  answer_index: 0
  explanation: 'TDD gives the agent an objective mathematical acceptance gate: the task is only complete
    when tests turn green.'
- question: In an automated self-healing test loop, what information must be fed back to the language
    model when a test fails?
  options:
  - Only the word 'FAILED'
  - The exact failing test name, stdout/stderr logs, full Python stack trace with file/line references,
    and the assertion error details
  - A random Wikipedia article
  - The entire operating system kernel log
  answer_index: 1
  explanation: Stack traces and assertion errors provide the diagnostic feedback needed for the model
    to localize and fix bugs.
- question: What is an atomic multi-file edit in agentic workflows?
  options:
  - Editing one file per week
  - A coordinated patch modifying related data models, API endpoints, serialization schemas, and unit
    tests simultaneously so the codebase remains in a consistent compiling state
  - Deleting all files at once
  - Splitting a single function into 50 files
  answer_index: 1
  explanation: Atomic multi-file edits ensure interface and schema changes across multiple files stay
    synchronized.
- question: What is the recommended maximum turn limit for an autonomous self-healing test loop before
    requiring human intervention?
  options:
  - 1 turn
  - 3 to 5 iterations (to prevent runaway token costs and destructive code thrashing)
  - 500 iterations
  - Infinite iterations
  answer_index: 1
  explanation: Limiting self-healing loops to 3–5 iterations prevents token waste and code degradation
    when an agent is stuck.
