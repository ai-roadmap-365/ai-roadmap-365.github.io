visuals:
- id: agentic-tdd-and-plan-execute-workflow
  file: assets/agentic-tdd-and-plan-execute-workflow.svg
  type: diagram
  title: Agentic TDD and Plan Execute Workflow
  alt: Agentic TDD and Plan Execute Workflow diagram illustrating Spec, Plan Approval, Write Failing Test
    Red, Implement Code Green, and Refactor Clean
  description: Lifecycle diagram showing the Plan-then-Execute and Agentic TDD development workflow.
- id: self-healing-test-runner-state-machine
  file: assets/self-healing-test-runner-state-machine.svg
  type: diagram
  title: Self Healing Test Runner State Machine
  alt: Self Healing Test Runner State Machine showing Test Execution, Traceback Extraction, LLM Repair
    Generation, Patch Apply, and Iteration Limit Guard
  description: State machine diagram showing the automated self-healing test and repair loop.
- id: plan-then-execute
  file: assets/plan-then-execute.svg
  type: diagram
  title: 'Plan, test, implement, verify'
  alt: 'Diagram: the four phases of a disciplined agentic coding workflow'
  description: 'A four-stage description of the agentic workflow covering exploration and planning, failing tests, implementation and self-verification.'
- id: vibe-or-disciplined
  file: assets/vibe-or-disciplined.svg
  type: diagram
  title: 'Two construction methods'
  alt: 'Diagram: unstructured code generation compared with a planned, test-verified workflow'
  description: 'A two-column comparison of one-shot code generation against a planned workflow with tests and self-correction.'
- id: workflow-lineage
  file: assets/workflow-lineage.svg
  type: diagram
  title: 'Three disciplines, synthesised'
  alt: 'Diagram: the engineering disciplines that agentic coding workflows combine'
  description: 'A three-stage progression from test-driven development through automated program repair to plan-and-solve reasoning.'
- id: self-healing-loop
  file: assets/self-healing-loop.svg
  type: diagram
  title: 'The self-healing loop'
  alt: 'Diagram: the convergence of an automated self-healing repair loop'
  description: 'A four-stage description of self-healing repair showing pass rates across iterations and the rationale for the iteration cap.'
- id: traceback-parsing
  file: assets/traceback-parsing.svg
  type: diagram
  title: 'Deconstructing a traceback'
  alt: 'Diagram: how a raw traceback is parsed into structured repair signals'
  description: 'A four-stage description of traceback deconstruction covering fault location, function scope, root cause and a targeted fix.'
- id: rocket-docking
  file: assets/rocket-docking.svg
  type: diagram
  title: 'An orbital docking system'
  alt: 'Diagram: automated spacecraft docking as an analogy for a self-healing test loop'
  description: 'A two-column comparison of a sensor-guided docking sequence against an uninstrumented approach.'
- id: tdd-antipatterns
  file: assets/tdd-antipatterns.svg
  type: diagram
  title: 'Three ways an agent games a test'
  alt: 'Diagram: the three ways a coding agent can satisfy a test without fixing anything'
  description: 'A four-stage description of TDD anti-patterns covering permissive assertions, mocking the unit under test, weakening a golden test, and the control.'
- id: atomic-multifile
  file: assets/atomic-multifile.svg
  type: diagram
  title: 'Six layers, one turn'
  alt: 'Diagram: the six layers a single feature change touches'
  description: 'A six-stage description of the layers a coordinated change spans, from database model to client and tests.'
- id: when-to-intervene
  file: assets/when-to-intervene.svg
  type: diagram
  title: 'Let it run, or step in'
  alt: 'Diagram: when to allow a self-healing loop to continue and when to intervene'
  description: 'A two-column comparison of failures a coding agent should resolve autonomously against those requiring immediate human intervention.'
- id: workflow-when
  file: assets/workflow-when.svg
  type: diagram
  title: 'Where the full harness pays'
  alt: 'Diagram: when a self-healing test workflow is warranted'
  description: 'A two-column comparison of tasks warranting a full agentic TDD harness against those where it is disproportionate.'
