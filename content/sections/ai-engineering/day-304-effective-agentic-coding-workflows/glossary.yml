terms:
- term: Plan-then-Execute
  definition: A two-phase workflow where an agent outlines its technical approach before writing or modifying
    code.
- term: Agentic TDD
  definition: Authoring strict automated test assertions first to serve as the ground truth acceptance
    gate for an agent.
- term: Self-Healing Test Loop
  definition: An automated cycle of running tests, capturing stack traces, and prompting the model to
    repair failures.
- term: Atomic Multi-File Edit
  definition: Modifying interdependent files in a single synchronized patch to maintain architectural
    consistency.
- term: Code Thrashing
  definition: When an agent repeatedly alters and reverts code in unsuccessful attempts to satisfy a broken
    test.
- term: Patch Convergence
  definition: The rate at which iterative agent edits progress toward a 100% passing test suite.
- term: Traceback Parsing
  definition: Extracting file names, line numbers, and exception messages from terminal error outputs.
- term: Verification Gate
  definition: A deterministic command (e.g. pytest, mypy, ruff) that blocks task completion until it exits
    with code 0.
