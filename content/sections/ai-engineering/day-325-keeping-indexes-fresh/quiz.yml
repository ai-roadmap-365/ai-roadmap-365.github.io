questions:
  - question: Why can a reconciliation that iterates the source's document list never find an orphaned
      document?
    options:
      - Because orphans are stored in a separate index that the loop does not open
      - Because an orphan is by definition a document the source no longer mentions, so a loop driven by
        the source's ids never visits it — the comparison must walk the union of both id sets
      - Because orphans have no version, so the comparison skips them
      - It can find them, provided the loop runs often enough
    answer_index: 1
    explanation: The bug is structural rather than a matter of frequency. You cannot find what you are
      not looking at, and a source-driven loop is not looking at the index's extra keys.
  - question: Two documents are stale. Why is the count less useful than the staleness ages?
    options:
      - The count is harder to compute than the ages
      - Because a document stale by thirty seconds and one stale by three weeks contribute equally to the
        count, but only the second indicates something is actually broken
      - Because counts cannot be graphed
      - They are equally useful; ages are only for reporting
    answer_index: 1
    explanation: Freshness is a distribution. Ages separate a document mid-update from one whose updates
      have been failing silently for weeks.
  - question: What failure is the delete guard defending against, and why is refusing the whole run the
      right response?
    options:
      - A slow network; refusing lets the run retry later
      - A source enumeration that fails in a way that looks like success — an auth error returning an
        empty list — which makes every indexed document appear orphaned; the run's premise is wrong, so
        deleting even a subset would be acting on a conclusion that does not hold
      - A corrupted index file; refusing avoids further corruption
      - Duplicate document ids; refusing avoids deleting the wrong copy
    answer_index: 1
    explanation: If the enumeration is wrong, every classification derived from it is wrong. Partial
      action on bad input is still action on bad input.
  - question: Why should a correct reconciliation be idempotent, and what does it mean if it is not?
    options:
      - Idempotency is a style preference with no diagnostic value
      - Because reconciling twice against an unchanged source must find nothing left to do; if the second
        run still reports work, the reconciler's notion of "same version" disagrees with what it writes
      - Because non-idempotent reconciliation is slower
      - Because it guarantees the index can never contain orphans
    answer_index: 1
    explanation: Convergence is the check that the comparison and the writer agree. A reconciler that
      never settles is reporting a real disagreement, not a cosmetic one.
  - question: Why does an over-eager definition of "version" turn a cheap freshness check into an
      expensive one?
    options:
      - Because longer version strings take more memory to compare
      - Because a version that changes on cosmetic edits — a whitespace change, a touched timestamp —
        marks unchanged documents as stale, and each one triggers a re-embed that costs the same as the
        original
      - Because comparison is O(n squared) in version length
      - Because the index rejects versions it has seen before
    answer_index: 1
    explanation:
      "The comparison itself stays cheap. What it triggers is not — reconciliation's cost is
      dominated by re-embedding whatever it declares stale."
