title: Keeping Indexes Fresh
section: ai-engineering
subsection: production-ai-systems
week: 47
learning_promise:
  'Measure how far an index has drifted from its source rather than assuming it has not:
  classify every document as fresh, missing, stale or orphaned, report staleness as a distribution
  rather than a count, and reconcile behind a guard that refuses to empty an index when the source
  enumeration fails in a way that looks like success.'
objectives:
  - Classify index drift into its four categories and explain why they differ in consequence.
  - Explain why a source-driven scan can never find an orphaned document, and compare over the union
    instead.
  - Measure staleness as a per-document age and report a percentile rather than a count.
  - Implement a delete guard that refuses an implausible mass deletion, and justify refusing over
    partial action.
  - Show that a correct reconciliation is idempotent, and diagnose what it means when it is not.
