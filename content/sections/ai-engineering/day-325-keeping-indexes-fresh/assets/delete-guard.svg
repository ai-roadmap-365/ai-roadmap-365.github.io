<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the guard that prevents it.">
  <title>The catastrophic reconciliation</title>
  <style>
    .delete-guard-bg   { fill: #f8fafc; }
    .delete-guard-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delete-guard-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delete-guard-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delete-guard-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delete-guard-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .delete-guard-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delete-guard-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .delete-guard-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .delete-guard-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .delete-guard-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .delete-guard-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .delete-guard-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .delete-guard-row { opacity: 1; }
    .delete-guard-r0 { animation-delay: 0.00s; }
    .delete-guard-r1 { animation-delay: 0.45s; }
    .delete-guard-r2 { animation-delay: 0.90s; }
    .delete-guard-r3 { animation-delay: 1.35s; }
    .delete-guard-r4 { animation-delay: 1.80s; }
    .delete-guard-row { animation: delete-guard-reveal 7.3s ease-in-out infinite; }
    @keyframes delete-guard-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="delete-guard-bg" width="980" height="390"/>
  <text class="delete-guard-h1"  x="30" y="40">The catastrophic reconciliation</text>
  <text class="delete-guard-sub" x="30" y="64">And the guard that prevents it.</text>
  <rect class="delete-guard-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="delete-guard-name" x="46" y="122">Unguarded</text>
  <text class="delete-guard-desc" x="46" y="142">The source returns nothing.</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r0" x="46" y="182">An enumeration bug, or an expired credential</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r1" x="46" y="216">Every indexed document looks orphaned</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r2" x="46" y="250">The reconciler deletes the entire index</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r3" x="46" y="284">Correctly, by its own logic</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r4" x="46" y="318">And the rebuild takes hours</text>
  <rect class="delete-guard-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="delete-guard-name" x="526" y="122">Guarded</text>
  <text class="delete-guard-desc" x="526" y="142">A proportion check first.</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r0" x="526" y="182">Compute the orphan fraction</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r1" x="526" y="216">Above a threshold, refuse and alert</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r2" x="526" y="250">A quarter orphaned is plausible</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r3" x="526" y="284">All of it is not</text>
  <text class="delete-guard-desc delete-guard-row delete-guard-r4" x="526" y="318">Broken enumeration is the likely cause</text>
  <text class="delete-guard-sub" x="30" y="372">This is the most dangerous bug in the entire area because the code is working exactly as written: nothing malfunctions, and a silent empty enumeration is indistinguishable from a mass deletion.</text>
</svg>
