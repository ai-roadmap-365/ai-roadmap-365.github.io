<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And staleness is not latency.">
  <title>Freshness is not consistency</title>
  <style>
    .freshness-not-consistency-bg   { fill: #f8fafc; }
    .freshness-not-consistency-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-consistency-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-consistency-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-consistency-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-consistency-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-not-consistency-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-not-consistency-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-not-consistency-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-not-consistency-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-not-consistency-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-not-consistency-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-not-consistency-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-not-consistency-row { opacity: 1; }
    .freshness-not-consistency-r0 { animation-delay: 0.00s; }
    .freshness-not-consistency-r1 { animation-delay: 0.45s; }
    .freshness-not-consistency-r2 { animation-delay: 0.90s; }
    .freshness-not-consistency-r3 { animation-delay: 1.35s; }
    .freshness-not-consistency-r4 { animation-delay: 1.80s; }
    .freshness-not-consistency-row { animation: freshness-not-consistency-reveal 7.3s ease-in-out infinite; }
    @keyframes freshness-not-consistency-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="freshness-not-consistency-bg" width="980" height="390"/>
  <text class="freshness-not-consistency-h1"  x="30" y="40">Freshness is not consistency</text>
  <text class="freshness-not-consistency-sub" x="30" y="64">And staleness is not latency.</text>
  <rect class="freshness-not-consistency-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-not-consistency-name" x="46" y="122">Freshness and staleness</text>
  <text class="freshness-not-consistency-desc" x="46" y="142">About the age of a copy.</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r0" x="46" y="182">How far behind the index is right now</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r1" x="46" y="216">A perfectly consistent index can be a month stale</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r2" x="46" y="250">Measured by comparison against the source</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r3" x="46" y="284">Reconciliation finds unknown divergence</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r4" x="46" y="318">Ranking by recency over stale data prefers the newest stale item</text>
  <rect class="freshness-not-consistency-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-not-consistency-name" x="526" y="122">Consistency and latency</text>
  <text class="freshness-not-consistency-desc" x="526" y="142">About operations.</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r0" x="526" y="182">Consistency is ordering of concurrent operations</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r1" x="526" y="216">Latency is how long one update takes to land</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r2" x="526" y="250">Low latency on the happy path says nothing about staleness</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r3" x="526" y="284">Ingestion applies known changes</text>
  <text class="freshness-not-consistency-desc freshness-not-consistency-row freshness-not-consistency-r4" x="526" y="318">Both are necessary, neither is sufficient</text>
  <text class="freshness-not-consistency-sub" x="30" y="372">The last row on the left is a real product trap: recency ranking over an index that is a month behind will confidently surface the newest of your out-of-date documents.</text>
</svg>
