<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Caches, crawlers, views, and law.">
  <title>Four traditions this borrows from</title>
  <style>
    .freshness-lineage-bg   { fill: #f8fafc; }
    .freshness-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .freshness-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .freshness-lineage-stage { opacity: 1; }

    .freshness-lineage-s0 { animation-delay: 0.00s; }
    .freshness-lineage-e0 { animation-delay: 0.00s; }
    .freshness-lineage-s1 { animation-delay: 1.28s; }
    .freshness-lineage-e1 { animation-delay: 1.28s; }
    .freshness-lineage-s2 { animation-delay: 2.56s; }
    .freshness-lineage-e2 { animation-delay: 2.56s; }
    .freshness-lineage-s3 { animation-delay: 3.84s; }
    .freshness-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .freshness-lineage-conn  { animation: freshness-lineage-trace 6.4s ease-in-out infinite; }
      .freshness-lineage-stage { animation: freshness-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes freshness-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes freshness-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .freshness-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .freshness-lineage-stage { animation: freshness-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes freshness-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="freshness-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="freshness-lineage-bg" width="980" height="322"/>
  <text class="freshness-lineage-h1"  x="30" y="40">Four traditions this borrows from</text>
  <text class="freshness-lineage-sub" x="30" y="64">Caches, crawlers, views, and law.</text>
  <g class="freshness-lineage-stage freshness-lineage-s0">
    <rect class="freshness-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-lineage-step" x="44" y="142">01</text>
    <text class="freshness-lineage-name" x="70" y="142">Cache invalidation</text>
    <text class="freshness-lineage-desc" x="44" y="166">Write-through, TTLs, explicit</text>
    <text class="freshness-lineage-desc" x="44" y="182">invalidation. A retrieval index</text>
    <text class="freshness-lineage-desc" x="44" y="198">is a cache with an expensive</text>
  </g>
  <line class="freshness-lineage-line freshness-lineage-conn freshness-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#freshness-lineage-tip)"/>
  <g class="freshness-lineage-stage freshness-lineage-s1">
    <rect class="freshness-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-lineage-step" x="280" y="142">02</text>
    <text class="freshness-lineage-name" x="306" y="142">Crawler freshness, 1990s</text>
    <text class="freshness-lineage-desc" x="280" y="166">Revisit scheduling as resource</text>
    <text class="freshness-lineage-desc" x="280" y="182">allocation: budget spent on a</text>
    <text class="freshness-lineage-desc" x="280" y="198">static page is budget lost.</text>
  </g>
  <line class="freshness-lineage-line freshness-lineage-conn freshness-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#freshness-lineage-tip)"/>
  <g class="freshness-lineage-stage freshness-lineage-s2">
    <rect class="freshness-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-lineage-step" x="516" y="142">03</text>
    <text class="freshness-lineage-name" x="542" y="142">Materialised views, 1980s</text>
    <text class="freshness-lineage-desc" x="516" y="166">Incremental maintenance. The</text>
    <text class="freshness-lineage-desc" x="516" y="182">correctness arguments live in</text>
    <text class="freshness-lineage-desc" x="516" y="198">this literature.</text>
    <text class="freshness-lineage-edge" x="516" y="242">theory</text>
  </g>
  <line class="freshness-lineage-line freshness-lineage-conn freshness-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#freshness-lineage-tip)"/>
  <g class="freshness-lineage-stage freshness-lineage-s3">
    <rect class="freshness-lineage-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="freshness-lineage-step" x="752" y="142">04</text>
    <text class="freshness-lineage-name" x="778" y="142">Right to erasure, 2018</text>
    <text class="freshness-lineage-desc" x="752" y="166">Orphans became a legal exposure</text>
    <text class="freshness-lineage-desc" x="752" y="182">rather than an aesthetic one.</text>
  </g>
  <text class="freshness-lineage-sub" x="30" y="304">The last row is what makes deletion propagation deserve its own attention rather than a footnote to updates: it is the one drift category with a regulator attached.</text>
</svg>
