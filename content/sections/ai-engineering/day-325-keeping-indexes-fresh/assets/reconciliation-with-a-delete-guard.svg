<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Reconciliation with a Delete Guard showing the compare step producing four categories and the guard refusing a run where the orphaned fraction exceeds a threshold">
  <title>Reconciliation with a Delete Guard</title>
  <defs>
    <style>
      .d325b-bg { fill: #f8fafc; }
      .d325b-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d325b-ok { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; }
      .d325b-bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; }
      .d325b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d325b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d325b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .d325b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d325b-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d325b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d325b-bg"/>
  <text x="40" y="40" class="d325b-title">Reconciliation with a Delete Guard</text>
  <text x="40" y="64" class="d325b-sub">Indexing and updating are recoverable. Deleting is not, so it is the only action gated behind a plausibility check.</text>

  <rect x="40" y="105" width="150" height="70" rx="8" class="d325b-box"/>
  <text x="115" y="132" class="d325b-h" text-anchor="middle">Enumerate</text>
  <text x="115" y="152" class="d325b-t" text-anchor="middle">both sides</text>

  <rect x="240" y="105" width="150" height="70" rx="8" class="d325b-box"/>
  <text x="315" y="132" class="d325b-h" text-anchor="middle">Compare</text>
  <text x="315" y="152" class="d325b-t" text-anchor="middle">over the union</text>
  <path d="M 190 140 L 234 140" class="d325b-flow" marker-end="url(#d325b-a)"/>

  <rect x="450" y="80" width="180" height="50" rx="6" class="d325b-ok"/>
  <text x="540" y="110" class="d325b-t" text-anchor="middle">missing -> index it</text>
  <rect x="450" y="140" width="180" height="50" rx="6" class="d325b-ok"/>
  <text x="540" y="170" class="d325b-t" text-anchor="middle">stale -> update it</text>
  <rect x="450" y="200" width="180" height="50" rx="6" class="d325b-bad"/>
  <text x="540" y="230" class="d325b-t" text-anchor="middle">orphaned -> DELETE</text>

  <path d="M 390 130 L 444 105" class="d325b-flow" marker-end="url(#d325b-a)"/>
  <path d="M 390 140 L 444 165" class="d325b-flow" marker-end="url(#d325b-a)"/>
  <path d="M 390 155 L 444 225" class="d325b-flow" marker-end="url(#d325b-a)"/>

  <rect x="680" y="190" width="180" height="70" rx="8" class="d325b-bad"/>
  <text x="770" y="216" class="d325b-h" text-anchor="middle">guard</text>
  <text x="770" y="238" class="d325b-t" text-anchor="middle">orphans / indexed &lt;= 25%?</text>
  <path d="M 630 225 L 674 225" class="d325b-flow" marker-end="url(#d325b-a)"/>

  <text x="40" y="310" class="d325b-h">The failure the guard exists for</text>
  <text x="40" y="334" class="d325b-t">A source enumeration that fails in a way that looks like success — an auth error returning an empty list, a paginated API</text>
  <text x="40" y="354" class="d325b-t">stopping at page one — makes EVERY indexed document look orphaned. A reconciler without a guard then empties the index,</text>
  <text x="40" y="374" class="d325b-t">and does so while reporting complete success.</text>
  <text x="40" y="402" class="d325b-t">Refusing is the right response, not deleting a "safe" subset: the run's premise is wrong, so none of its conclusions hold.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 390 130 L 444 105" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 190 140 L 234 140" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 390 140 L 444 165" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 390 155 L 444 225" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 630 225 L 674 225" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
