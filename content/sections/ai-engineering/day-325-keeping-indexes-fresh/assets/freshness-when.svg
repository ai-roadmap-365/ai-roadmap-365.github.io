<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when rebuilding is the answer.">
  <title>When to measure freshness</title>
  <style>
    .freshness-when-bg   { fill: #f8fafc; }
    .freshness-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .freshness-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .freshness-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .freshness-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .freshness-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .freshness-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .freshness-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .freshness-when-row { opacity: 1; }
    .freshness-when-r0 { animation-delay: 0.00s; }
    .freshness-when-r1 { animation-delay: 0.45s; }
    .freshness-when-r2 { animation-delay: 0.90s; }
    .freshness-when-r3 { animation-delay: 1.35s; }
    .freshness-when-r4 { animation-delay: 1.80s; }
    .freshness-when-row { animation: freshness-when-reveal 7.3s ease-in-out infinite; }
    @keyframes freshness-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="freshness-when-bg" width="980" height="390"/>
  <text class="freshness-when-h1"  x="30" y="40">When to measure freshness</text>
  <text class="freshness-when-sub" x="30" y="64">And when rebuilding is the answer.</text>
  <rect class="freshness-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-when-name" x="46" y="122">Measure it</text>
  <text class="freshness-when-desc" x="46" y="142">Documents change and vanish.</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r0" x="46" y="182">Documents edited after publication</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r1" x="46" y="216">Deletion has a legal dimension</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r2" x="46" y="250">The corpus is too large to rebuild routinely</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r3" x="46" y="284">Anybody has asked whether it is current</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r4" x="46" y="318">And nobody could answer</text>
  <rect class="freshness-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="freshness-when-name" x="526" y="122">Rebuild instead</text>
  <text class="freshness-when-desc" x="526" y="142">Append-only or small.</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r0" x="526" y="182">A genuinely immutable archive</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r1" x="526" y="216">A fixed set of manuals</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r2" x="526" y="250">A rebuild that takes four minutes</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r3" x="526" y="284">Run it as often as you like</text>
  <text class="freshness-when-desc freshness-when-row freshness-when-r4" x="526" y="318">No deletion bug, because nothing is deleted</text>
  <text class="freshness-when-sub" x="30" y="372">The threshold is usually the first deletion that has to propagate, or the first corpus large enough that a rebuild no longer fits in the maintenance window.</text>
</svg>
