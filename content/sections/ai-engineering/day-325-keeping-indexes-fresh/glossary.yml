terms:
  - term: Index Freshness
    definition: How closely a derived index reflects its source of truth right now, measured rather than
      assumed.
  - term: Drift
    definition: Divergence between a source and an index, falling into exactly four categories —
      fresh, missing, stale and orphaned.
  - term: Orphaned Document
    definition: A document present in the index but deleted at the source. The only drift category a
      source-driven scan cannot find.
  - term: Stale Document
    definition: A document present in both but held at an older version in the index, so the system
      answers confidently from superseded text.
  - term: Reconciliation
    definition: Comparing source and index and applying the differences — indexing the missing, updating
      the stale, deleting the orphaned.
  - term: Staleness Age
    definition: How long a document has been out of date, reported as a distribution rather than a count.
  - term: Delete Guard
    definition: A plausibility check that refuses a reconciliation which would delete an implausible
      share of the index in one run.
  - term: Deletion Propagation
    definition: Ensuring a deletion at the source reaches every derived copy, including the index and any
      cache. A legal requirement under right-to-erasure rules.
  - term: Idempotent Reconciliation
    definition: A reconciliation that finds nothing left to do when run a second time against an
      unchanged source.
  - term: Freshness Objective
    definition: A stated target such as a p95 staleness bound and zero orphans, which makes freshness a
      measurable service concern rather than an opinion.
