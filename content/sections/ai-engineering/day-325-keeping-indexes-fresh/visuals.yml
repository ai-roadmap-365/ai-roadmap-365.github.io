visuals:
  - id: four-kinds-of-index-drift
    file: assets/four-kinds-of-index-drift.svg
    type: diagram
    title: Four Kinds of Index Drift
    alt: 'Four Kinds of Index Drift showing the four regions formed by whether a document is present at
      the source and in the index: fresh, missing, stale, and orphaned'
    description: A two-by-two of source presence against index presence, showing which category each
      combination produces and why their consequences differ.
  - id: reconciliation-with-a-delete-guard
    file: assets/reconciliation-with-a-delete-guard.svg
    type: diagram
    title: Reconciliation with a Delete Guard
    alt: Reconciliation with a Delete Guard showing the compare step producing four categories and the
      guard refusing a run where the orphaned fraction exceeds a threshold
    description: Flow from enumeration through comparison to the three reconciliation actions, with the
      delete path gated behind a plausibility guard.
