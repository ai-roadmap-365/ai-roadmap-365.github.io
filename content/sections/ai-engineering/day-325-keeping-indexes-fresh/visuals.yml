visuals:
  - id: four-kinds-of-index-drift
    file: assets/four-kinds-of-index-drift.svg
    type: diagram
    title: Four Kinds of Index Drift
    alt: 'Four Kinds of Index Drift showing the four regions formed by whether a document is present at
      the source and in the index: fresh, missing, stale, and orphaned'
    description: A two-by-two of source presence against index presence, showing which category each
      combination produces and why their consequences differ.
  - id: reconciliation-with-a-delete-guard
    file: assets/reconciliation-with-a-delete-guard.svg
    type: diagram
    title: Reconciliation with a Delete Guard
    alt: Reconciliation with a Delete Guard showing the compare step producing four categories and the
      guard refusing a run where the orphaned fraction exceeds a threshold
    description: Flow from enumeration through comparison to the three reconciliation actions, with the
      delete path gated behind a plausibility guard.
  - id: four-drift-states
    file: assets/four-drift-states.svg
    type: diagram
    title: 'Four states, two questions'
    alt: 'Diagram: the four drift states of an index against its source'
    description: 'A four-stage description of index drift states covering fresh, missing, stale and orphaned documents.'
  - id: measure-or-assume
    file: assets/measure-or-assume.svg
    type: diagram
    title: 'Measuring drift, or assuming it away'
    alt: 'Diagram: measured index freshness compared with assumed freshness'
    description: 'A two-column comparison of measuring index drift against relying on the pipeline having run.'
  - id: freshness-lineage
    file: assets/freshness-lineage.svg
    type: diagram
    title: 'Four traditions this borrows from'
    alt: 'Diagram: the traditions that inform index freshness practice'
    description: 'A four-stage progression from cache invalidation through crawler scheduling and materialised views to right-to-erasure law.'
  - id: reconcile-steps
    file: assets/reconcile-steps.svg
    type: diagram
    title: 'Five steps to reconcile'
    alt: 'Diagram: the five steps of an index reconciliation run'
    description: 'A five-stage description of reconciliation covering enumeration, union comparison, measurement, the delete guard and convergence.'
  - id: delete-guard
    file: assets/delete-guard.svg
    type: diagram
    title: 'The catastrophic reconciliation'
    alt: 'Diagram: an unguarded reconciliation compared with one that refuses implausible deletions'
    description: 'A two-column comparison of reconciliation with and without a proportional delete guard.'
  - id: stock-take
    file: assets/stock-take.svg
    type: diagram
    title: 'Shelves and a stock system'
    alt: 'Diagram: shop stock discrepancies as an analogy for index drift states'
    description: 'A two-column comparison of shop stock discrepancies against index drift, including the failed stock-take.'
  - id: freshness-implications
    file: assets/freshness-implications.svg
    type: diagram
    title: 'Five consequences of reconciling'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of freshness work'
    description: 'A five-stage description of freshness implications covering read access, erasure propagation, comparison cost, partitioning and re-embedding.'
  - id: freshness-not-consistency
    file: assets/freshness-not-consistency.svg
    type: diagram
    title: 'Freshness is not consistency'
    alt: 'Diagram: freshness compared with consistency, and staleness compared with latency'
    description: 'A two-column comparison of freshness against related but distinct concepts.'
  - id: freshness-when
    file: assets/freshness-when.svg
    type: diagram
    title: 'When to measure freshness'
    alt: 'Diagram: when freshness measurement is warranted and when a rebuild suffices'
    description: 'A two-column comparison of situations requiring freshness measurement against those where a full rebuild is adequate.'
  - id: freshness-not-ingestion
    file: assets/freshness-not-ingestion.svg
    type: diagram
    title: 'Freshness is not ingestion'
    alt: 'Diagram: index freshness work compared with three things it is mistaken for'
    description: 'A two-column comparison of freshness measurement against ingestion frequency and binary freshness questions.'
  - id: freshness-alternatives
    file: assets/freshness-alternatives.svg
    type: diagram
    title: 'Four ways to bound staleness'
    alt: 'Diagram: four approaches to keeping a derived index current'
    description: 'A four-stage description of freshness approaches covering scheduled rebuilds, document TTLs, change data capture and index aliasing.'
  - id: drift-example
    file: assets/drift-example.svg
    type: diagram
    title: 'Reading a drift report'
    alt: 'Diagram: how a drift report is read, from classification through ages to the delete guard'
    description: 'A four-stage walkthrough of interpreting a reconciliation report covering classification, orphan identification, staleness ages and the guard threshold.'
