questions:
- question: Why is an 'Idempotency Key' pattern critical for LLM backend endpoints?
  options:
  - To make the Python script compile to WebAssembly
  - Because generative AI model API calls are expensive and slow (1-10s); if a mobile client drops connection
    and retries the exact same prompt with an Idempotency Key, the backend returns the cached in-flight
    or completed response rather than double-billing the user for duplicate model inference
  - To encrypt database passwords
  - To format markdown headers
  answer_index: 1
  explanation: Idempotency prevents duplicate billing and redundant expensive inference on network retries.
- question: What are the three operational states of a 'Circuit Breaker' in an AI gateway?
  options:
  - Red, Yellow, Green
  - CLOSED (Normal operation, requests flow through), OPEN (Upstream failure threshold exceeded, immediately
    fail fast or route to fallback without calling provider), and HALF-OPEN (Testing probe requests to
    see if upstream recovered)
  - Input, Hidden, Output
  - Draft, Review, Published
  answer_index: 1
  explanation: Circuit breakers protect backend resources by failing fast when downstream model APIs degrade.
- question: How does an asynchronous generator (`async for chunk in stream`) in Python optimize memory
    during LLM response streaming?
  options:
  - By writing all tokens to a hard drive file first
  - By yielding individual token chunks immediately as they arrive from the model socket, keeping RAM
    usage per connection near zero rather than buffering multi-megabyte completions in server memory
  - By converting tokens into images
  - By restarting the Python interpreter
  answer_index: 1
  explanation: Streaming generators stream data incrementally without buffering large completions in memory.
- question: What is the standard HTTP format for Server-Sent Events (SSE) streaming?
  options:
  - Raw binary bytes
  - 'Content-Type: `text/event-stream`, with lines formatted as `data: <payload>\n\n` and a final termination
    marker `data: [DONE]\n\n`'
  - An XML RSS feed
  - A CSV spreadsheet
  answer_index: 1
  explanation: 'SSE uses `text/event-stream` with standard `data: ...\n\n` framing.'
- question: How should a production AI backend handle client disconnects during a streaming response?
  options:
  - Keep generating all tokens until the model finishes and discard the output
  - Listen to the HTTP request disconnect event (e.g. `request.is_disconnected()`), cancel the upstream
    model generation task immediately, and abort downstream token consumption to save money
  - Crash the server process
  - Send an error email to the developer
  answer_index: 1
  explanation: Canceling aborted streaming sessions saves substantial GPU inference costs.
