questions:
- question: Why is an 'Idempotency Key' pattern critical for LLM backend endpoints?
  options:
  - To make the Python script compile to WebAssembly
  - To format markdown headers
  - To encrypt database passwords
  - 'A retry returns the cached reply instead of billing twice'
  answer_index: 3
  explanation: Idempotency prevents duplicate billing and redundant expensive inference on network retries.
- question: What are the three operational states of a 'Circuit Breaker' in an AI gateway?
  options:
  - 'Closed, open, and half-open'
  - Red, Yellow, Green
  - Input, Hidden, Output
  - 'Draft, Review, and then Published'
  answer_index: 0
  explanation: Circuit breakers protect backend resources by failing fast when downstream model APIs degrade.
- question: How does an asynchronous generator (`async for chunk in stream`) in Python optimize memory
    during LLM response streaming?
  options:
  - 'By writing all of the tokens to a hard drive file first'
  - 'It yields chunks as they arrive, so memory stays flat'
  - By converting tokens into images
  - By restarting the Python interpreter
  answer_index: 1
  explanation: Streaming generators stream data incrementally without buffering large completions in memory.
- question: What is the standard HTTP format for Server-Sent Events (SSE) streaming?
  options:
  - Raw binary bytes
  - An XML RSS feed
  - 'text/event-stream'
  - A CSV spreadsheet
  answer_index: 2
  explanation: 'SSE uses `text/event-stream` with standard `data: ...\n\n` framing.'
- question: How should a production AI backend handle client disconnects during a streaming response?
  options:
  - Keep generating all tokens until the model finishes and discard the output
  - Send an error email to the developer
  - Crash the server process
  - 'Detect the disconnect and cancel the upstream call'
  answer_index: 3
  explanation: Canceling aborted streaming sessions saves substantial GPU inference costs.
