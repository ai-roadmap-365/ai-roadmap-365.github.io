<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And which are always worth it.">
  <title>Which patterns you need</title>
  <style>
    .backend-when-bg   { fill: #f8fafc; }
    .backend-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backend-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backend-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backend-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backend-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backend-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backend-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backend-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backend-when-row { opacity: 1; }
    .backend-when-r0 { animation-delay: 0.00s; }
    .backend-when-r1 { animation-delay: 0.45s; }
    .backend-when-r2 { animation-delay: 0.90s; }
    .backend-when-r3 { animation-delay: 1.35s; }
    .backend-when-r4 { animation-delay: 1.80s; }
    .backend-when-row { animation: backend-when-reveal 7.3s ease-in-out infinite; }
    @keyframes backend-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="backend-when-bg" width="980" height="390"/>
  <text class="backend-when-h1"  x="30" y="40">Which patterns you need</text>
  <text class="backend-when-sub" x="30" y="64">And which are always worth it.</text>
  <rect class="backend-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="backend-when-name" x="46" y="122">Always</text>
  <text class="backend-when-desc" x="46" y="142">Two, at any scale.</text>
  <text class="backend-when-desc backend-when-row backend-when-r0" x="46" y="182">Stream, rather than buffer</text>
  <text class="backend-when-desc backend-when-row backend-when-r1" x="46" y="216">It is simpler and cheaper both ways</text>
  <text class="backend-when-desc backend-when-row backend-when-r2" x="46" y="250">Disable proxy buffering explicitly</text>
  <text class="backend-when-desc backend-when-row backend-when-r3" x="46" y="284">Cap concurrency deliberately</text>
  <text class="backend-when-desc backend-when-row backend-when-r4" x="46" y="318">Even for one user</text>
  <rect class="backend-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="backend-when-name" x="526" y="122">Once it matters</text>
  <text class="backend-when-desc" x="526" y="142">Three thresholds.</text>
  <text class="backend-when-desc backend-when-row backend-when-r0" x="526" y="182">Idempotency, once requests cost money</text>
  <text class="backend-when-desc backend-when-row backend-when-r1" x="526" y="216">Circuit breakers, once uptime is promised</text>
  <text class="backend-when-desc backend-when-row backend-when-r2" x="526" y="250">Distributed locks, once there is more than one worker</text>
  <text class="backend-when-desc backend-when-row backend-when-r3" x="526" y="284">An internal tool may need none</text>
  <text class="backend-when-desc backend-when-row backend-when-r4" x="526" y="318">A metered product needs all three</text>
  <text class="backend-when-sub" x="30" y="372">"Once requests cost money" is the trigger worth watching for, and it arrives earlier than expected: a duplicate generation is a real charge from the first paying user onward.</text>
</svg>
