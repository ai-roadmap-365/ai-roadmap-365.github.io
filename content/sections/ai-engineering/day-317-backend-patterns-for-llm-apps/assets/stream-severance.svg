<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four decisions, in order.">
  <title>When the stream dies mid-answer</title>
  <style>
    .stream-severance-bg   { fill: #f8fafc; }
    .stream-severance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-severance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-severance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-severance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-severance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stream-severance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stream-severance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stream-severance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stream-severance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stream-severance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stream-severance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stream-severance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stream-severance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stream-severance-stage { opacity: 1; }

    .stream-severance-s0 { animation-delay: 0.00s; }
    .stream-severance-e0 { animation-delay: 0.00s; }
    .stream-severance-s1 { animation-delay: 1.28s; }
    .stream-severance-e1 { animation-delay: 1.28s; }
    .stream-severance-s2 { animation-delay: 2.56s; }
    .stream-severance-e2 { animation-delay: 2.56s; }
    .stream-severance-s3 { animation-delay: 3.84s; }
    .stream-severance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stream-severance-conn  { animation: stream-severance-trace 6.4s ease-in-out infinite; }
      .stream-severance-stage { animation: stream-severance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stream-severance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stream-severance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stream-severance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stream-severance-stage { animation: stream-severance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stream-severance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stream-severance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stream-severance-bg" width="980" height="322"/>
  <text class="stream-severance-h1"  x="30" y="40">When the stream dies mid-answer</text>
  <text class="stream-severance-sub" x="30" y="64">Four decisions, in order.</text>
  <g class="stream-severance-stage stream-severance-s0">
    <rect class="stream-severance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stream-severance-step" x="44" y="142">01</text>
    <text class="stream-severance-name" x="70" y="142">Detect the severance</text>
    <text class="stream-severance-desc" x="44" y="166">A closed upstream connection,</text>
    <text class="stream-severance-desc" x="44" y="182">not a completed generation.</text>
  </g>
  <line class="stream-severance-line stream-severance-conn stream-severance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stream-severance-tip)"/>
  <g class="stream-severance-stage stream-severance-s1">
    <rect class="stream-severance-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stream-severance-step" x="280" y="142">02</text>
    <text class="stream-severance-name" x="306" y="142">Keep what arrived</text>
    <text class="stream-severance-desc" x="280" y="166">The user has already read it.</text>
    <text class="stream-severance-desc" x="280" y="182">Discarding it is a choice.</text>
    <text class="stream-severance-edge" x="280" y="242">Day 358</text>
  </g>
  <line class="stream-severance-line stream-severance-conn stream-severance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stream-severance-tip)"/>
  <g class="stream-severance-stage stream-severance-s2">
    <rect class="stream-severance-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stream-severance-step" x="516" y="142">03</text>
    <text class="stream-severance-name" x="542" y="142">Signal incompleteness</text>
    <text class="stream-severance-desc" x="516" y="166">A terminal frame marking the</text>
    <text class="stream-severance-desc" x="516" y="182">answer truncated, not failed</text>
    <text class="stream-severance-desc" x="516" y="198">silently.</text>
  </g>
  <line class="stream-severance-line stream-severance-conn stream-severance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stream-severance-tip)"/>
  <g class="stream-severance-stage stream-severance-s3">
    <rect class="stream-severance-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stream-severance-step" x="752" y="142">04</text>
    <text class="stream-severance-name" x="778" y="142">Retry under the same key</text>
    <text class="stream-severance-desc" x="752" y="166">So a resumed request does not</text>
    <text class="stream-severance-desc" x="752" y="182">become a second charge.</text>
  </g>
  <text class="stream-severance-sub" x="30" y="304">The second and fourth interact: retaining the partial is a user-experience decision and re-requesting under the same idempotency key is what stops that decision costing money twice.</text>
</svg>
