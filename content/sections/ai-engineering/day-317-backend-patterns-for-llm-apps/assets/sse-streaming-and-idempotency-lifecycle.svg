<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="SSE Streaming and Idempotency Lifecycle">
  <title>SSE Streaming and Idempotency Lifecycle</title>
  <defs>
    <style>
      .d317a-bg { fill: #f8fafc; }
      .d317a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d317a-step1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d317a-step2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d317a-step3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d317a-step4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d317a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d317a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d317a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d317a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d317a-bg" />
  
  <text x="40" y="40" class="d317a-title">SSE Streaming and Idempotency Pipeline</text>
  <text x="40" y="65" class="d317a-subtitle">SSE Streaming and Idempotency Lifecycle showing Client Request with Idempotency Key, Cache Lookup, Model Streaming Generator, and SSE Token Delivery</text>
  
  <!-- Step 1: Client Request with Idempotency Key -->
  <rect x="40" y="110" width="180" height="270" class="d317a-step1" />
  <text x="55" y="140" class="d317a-header" fill="#1d4ed8">1. Client Request</text>
  <text x="55" y="170" class="d317a-text">• `POST /api/chat/stream`</text>
  <text x="55" y="190" class="d317a-text">• `Idempotency-Key: uuid`</text>
  <text x="55" y="210" class="d317a-text">• Prompt &amp; Model params</text>
  <text x="55" y="230" class="d317a-text">• Streaming headers requested</text>
  <text x="55" y="260" class="d317a-text" font-weight="600">Header:</text>
  <text x="55" y="280" class="d317a-text">Accept: text/event-stream</text>
  
  <!-- Step 2: Idempotency Gate -->
  <rect x="250" y="110" width="180" height="270" class="d317a-step2" />
  <text x="265" y="140" class="d317a-header" fill="#7e22ce">2. Idempotency Check</text>
  <text x="265" y="170" class="d317a-text">• Query Redis for Key</text>
  <text x="265" y="190" class="d317a-text">• If IN_FLIGHT -> Attach</text>
  <text x="265" y="210" class="d317a-text">• If COMPLETED -> Replay</text>
  <text x="265" y="230" class="d317a-text">• If NEW -> Set Lock TTL</text>
  <text x="265" y="260" class="d317a-text" font-weight="600">Guarantee:</text>
  <text x="265" y="280" class="d317a-text">Zero duplicate billing</text>
  
  <!-- Step 3: Async Generator -->
  <rect x="460" y="110" width="180" height="270" class="d317a-step3" />
  <text x="475" y="140" class="d317a-header" fill="#a16207">3. Async Stream</text>
  <text x="475" y="170" class="d317a-text">• Open socket to model</text>
  <text x="475" y="190" class="d317a-text">• `async for chunk in resp`</text>
  <text x="475" y="210" class="d317a-text">• Format `data: {token}`</text>
  <text x="475" y="230" class="d317a-text">• Heartbeat ping (15s)</text>
  <text x="475" y="260" class="d317a-text" font-weight="600">Memory:</text>
  <text x="475" y="280" class="d317a-text">Near-zero buffer RAM</text>
  
  <!-- Step 4: Final Event Delivery -->
  <rect x="670" y="110" width="190" height="270" class="d317a-step4" />
  <text x="685" y="140" class="d317a-header" fill="#15803d">4. Termination</text>
  <text x="685" y="170" class="d317a-text">• Emit `data: [DONE]`</text>
  <text x="685" y="190" class="d317a-text">• Save full completion</text>
  <text x="685" y="210" class="d317a-text">• Log token count to DB</text>
  <text x="685" y="230" class="d317a-text">• Release idempotency key</text>
  <text x="685" y="260" class="d317a-text" font-weight="600">Result:</text>
  <text x="685" y="280" class="d317a-text" fill="#15803d" font-weight="700">Clean SSE Close</text>
</svg>