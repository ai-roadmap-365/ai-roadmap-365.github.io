<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Continuous delivery, metered once, rerouted on fault.">
  <title>A power grid</title>
  <style>
    .power-grid-bg   { fill: #f8fafc; }
    .power-grid-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-grid-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-grid-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-grid-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-grid-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .power-grid-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .power-grid-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .power-grid-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .power-grid-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .power-grid-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .power-grid-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .power-grid-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .power-grid-row { opacity: 1; }
    .power-grid-r0 { animation-delay: 0.00s; }
    .power-grid-r1 { animation-delay: 0.45s; }
    .power-grid-r2 { animation-delay: 0.90s; }
    .power-grid-r3 { animation-delay: 1.35s; }
    .power-grid-r4 { animation-delay: 1.80s; }
    .power-grid-row { animation: power-grid-reveal 7.3s ease-in-out infinite; }
    @keyframes power-grid-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="power-grid-bg" width="980" height="390"/>
  <text class="power-grid-h1"  x="30" y="40">A power grid</text>
  <text class="power-grid-sub" x="30" y="64">Continuous delivery, metered once, rerouted on fault.</text>
  <rect class="power-grid-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="power-grid-name" x="46" y="122">The grid</text>
  <text class="power-grid-desc" x="46" y="142">Three mechanisms.</text>
  <text class="power-grid-desc power-grid-row power-grid-r0" x="46" y="182">Power flows continuously as generated</text>
  <text class="power-grid-desc power-grid-row power-grid-r1" x="46" y="216">A meter reading has a transaction id</text>
  <text class="power-grid-desc power-grid-row power-grid-r2" x="46" y="250">A duplicate signal bills once</text>
  <text class="power-grid-desc power-grid-row power-grid-r3" x="46" y="284">A surge trips a breaker</text>
  <text class="power-grid-desc power-grid-row power-grid-r4" x="46" y="318">Supply reroutes without a blackout</text>
  <rect class="power-grid-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="power-grid-name" x="526" y="122">The backend</text>
  <text class="power-grid-desc" x="526" y="142">The same three.</text>
  <text class="power-grid-desc power-grid-row power-grid-r0" x="526" y="182">Tokens stream as generated</text>
  <text class="power-grid-desc power-grid-row power-grid-r1" x="526" y="216">Requests carry an idempotency key</text>
  <text class="power-grid-desc power-grid-row power-grid-r2" x="526" y="250">A retry returns the cached response</text>
  <text class="power-grid-desc power-grid-row power-grid-r3" x="526" y="284">An upstream failure opens the circuit</text>
  <text class="power-grid-desc power-grid-row power-grid-r4" x="526" y="318">Traffic falls back to another provider</text>
  <text class="power-grid-sub" x="30" y="372">Rerouting without a blackout is the design goal worth keeping: a circuit breaker's purpose is not to stop serving, it is to stop serving from the failing path.</text>
</svg>
