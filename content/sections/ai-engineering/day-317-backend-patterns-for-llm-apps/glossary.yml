terms:
- term: Server-Sent Events (SSE)
  definition: A lightweight unidirectional streaming protocol over HTTP/2 using `text/event-stream`.
- term: Idempotency Key
  definition: A unique client-generated token guaranteeing that repeated identical requests are executed
    exactly once.
- term: Circuit Breaker
  definition: A stability pattern that prevents cascading failures by stopping calls to a failing downstream
    dependency.
- term: Backpressure
  definition: Flow control mechanism balancing fast model generation rates with slower client network
    consumption.
- term: Async Generator
  definition: A Python coroutine yielding values incrementally over time using `async def` and `yield`.
- term: Fail-Fast
  definition: Immediately returning an error or fallback response without waiting for a known-broken upstream
    service to time out.
- term: Half-Open State
  definition: The trial state of a circuit breaker where a small sample of probe requests tests upstream
    health.
- term: Cancellation Token
  definition: A signal aborting upstream model generation when an end user cancels the request or navigates
    away.
