visuals:
- id: sse-streaming-and-idempotency-lifecycle
  file: assets/sse-streaming-and-idempotency-lifecycle.svg
  type: diagram
  title: SSE Streaming and Idempotency Lifecycle
  alt: SSE Streaming and Idempotency Lifecycle showing Client Request with Idempotency Key, Cache Lookup,
    Model Streaming Generator, and SSE Token Delivery
  description: Lifecycle diagram showing idempotent request handling and Server-Sent Events token streaming.
- id: circuit-breaker-state-machine-topology
  file: assets/circuit-breaker-state-machine-topology.svg
  type: diagram
  title: Circuit Breaker State Machine Topology
  alt: Circuit Breaker State Machine Topology showing CLOSED state (normal traffic), OPEN state (fail
    fast to secondary fallback), and HALF-OPEN state (canary probe recovery)
  description: State transition diagram of a resilient circuit breaker protecting AI gateway infrastructure.
- id: three-patterns
  file: assets/three-patterns.svg
  type: diagram
  title: 'Three backend patterns'
  alt: 'Diagram: the three backend resilience patterns for LLM applications'
  description: 'A three-stage description of the core LLM backend patterns covering server-sent event streaming, idempotent deduplication and circuit breaking.'
- id: stream-or-buffer
  file: assets/stream-or-buffer.svg
  type: diagram
  title: 'Streaming, or buffering'
  alt: 'Diagram: streaming generation compared with buffering a full completion'
  description: 'A two-column comparison of yielding tokens as they arrive against accumulating a full completion in memory.'
- id: transport-lineage
  file: assets/transport-lineage.svg
  type: diagram
  title: 'Four stages of transport'
  alt: 'Diagram: the progression from short polling to resilient AI gateway middleware'
  description: 'A four-stage progression of backend communication from HTTP polling through WebSockets and SSE to integrated resilience middleware.'
- id: idempotency-flow
  file: assets/idempotency-flow.svg
  type: diagram
  title: 'How deduplication works'
  alt: 'Diagram: how an idempotency key deduplicates a retried generation request'
  description: 'A four-stage description of idempotent request handling covering key derivation, lock acquisition, cached response return and TTL expiry.'
- id: power-grid
  file: assets/power-grid.svg
  type: diagram
  title: 'A power grid'
  alt: 'Diagram: power grid mechanisms as an analogy for the three backend patterns'
  description: 'A two-column comparison mapping electrical grid mechanisms onto streaming, idempotency and circuit breaking.'
- id: stream-severance
  file: assets/stream-severance.svg
  type: diagram
  title: 'When the stream dies mid-answer'
  alt: 'Diagram: recovering from an upstream stream severed mid-generation'
  description: 'A four-stage description of handling a severed generation stream covering detection, partial retention, client signalling and retry policy.'
- id: backend-failures
  file: assets/backend-failures.svg
  type: diagram
  title: 'Four streaming failure modes'
  alt: 'Diagram: the four failure modes of a streaming AI backend and their controls'
  description: 'A four-stage description of streaming backend failures covering memory growth, proxy buffering, key expiry and cascading upstream failure.'
- id: breaker-states
  file: assets/breaker-states.svg
  type: diagram
  title: 'Circuit breaker states'
  alt: 'Diagram: the closed, open and half-open states of an upstream circuit breaker'
  description: 'A two-column comparison of circuit breaker behaviour in normal operation against a tripped state.'
- id: sse-scale
  file: assets/sse-scale.svg
  type: diagram
  title: 'What bounds a streaming gateway'
  alt: 'Diagram: the capacity model of a streaming gateway'
  description: 'A four-stage description of streaming gateway capacity covering connection-bound concurrency, memory per stream, file descriptors and load balancer configuration.'
- id: backend-when
  file: assets/backend-when.svg
  type: diagram
  title: 'Which patterns you need'
  alt: 'Diagram: when each backend resilience pattern is required'
  description: 'A two-column comparison of situations requiring circuit breakers and idempotency against simpler cases, and what always applies.'
