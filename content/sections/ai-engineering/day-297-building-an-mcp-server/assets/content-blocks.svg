<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not only strings.">
  <title>Tools return content blocks</title>
  <style>
    .content-blocks-bg   { fill: #f8fafc; }
    .content-blocks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .content-blocks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .content-blocks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .content-blocks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .content-blocks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .content-blocks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .content-blocks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .content-blocks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .content-blocks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .content-blocks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .content-blocks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .content-blocks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .content-blocks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .content-blocks-stage { opacity: 1; }

    .content-blocks-s0 { animation-delay: 0.00s; }
    .content-blocks-e0 { animation-delay: 0.00s; }
    .content-blocks-s1 { animation-delay: 1.28s; }
    .content-blocks-e1 { animation-delay: 1.28s; }
    .content-blocks-s2 { animation-delay: 2.56s; }
    .content-blocks-e2 { animation-delay: 2.56s; }
    .content-blocks-s3 { animation-delay: 3.84s; }
    .content-blocks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .content-blocks-conn  { animation: content-blocks-trace 6.4s ease-in-out infinite; }
      .content-blocks-stage { animation: content-blocks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes content-blocks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes content-blocks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .content-blocks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .content-blocks-stage { animation: content-blocks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes content-blocks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="content-blocks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="content-blocks-bg" width="980" height="322"/>
  <text class="content-blocks-h1"  x="30" y="40">Tools return content blocks</text>
  <text class="content-blocks-sub" x="30" y="64">Not only strings.</text>
  <g class="content-blocks-stage content-blocks-s0">
    <rect class="content-blocks-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="content-blocks-step" x="44" y="142">01</text>
    <text class="content-blocks-name" x="70" y="142">Text</text>
    <text class="content-blocks-desc" x="44" y="166">The common case. A summary the</text>
    <text class="content-blocks-desc" x="44" y="182">model reads.</text>
  </g>
  <line class="content-blocks-line content-blocks-conn content-blocks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#content-blocks-tip)"/>
  <g class="content-blocks-stage content-blocks-s1">
    <rect class="content-blocks-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="content-blocks-step" x="280" y="142">02</text>
    <text class="content-blocks-name" x="306" y="142">Structured JSON</text>
    <text class="content-blocks-desc" x="280" y="166">When the caller needs fields</text>
    <text class="content-blocks-desc" x="280" y="182">rather than prose.</text>
  </g>
  <line class="content-blocks-line content-blocks-conn content-blocks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#content-blocks-tip)"/>
  <g class="content-blocks-stage content-blocks-s2">
    <rect class="content-blocks-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="content-blocks-step" x="516" y="142">03</text>
    <text class="content-blocks-name" x="542" y="142">Images</text>
    <text class="content-blocks-desc" x="516" y="166">Rendered by the client and</text>
    <text class="content-blocks-desc" x="516" y="182">passed into a vision context.</text>
    <text class="content-blocks-edge" x="516" y="242">multimodal</text>
  </g>
  <line class="content-blocks-line content-blocks-conn content-blocks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#content-blocks-tip)"/>
  <g class="content-blocks-stage content-blocks-s3">
    <rect class="content-blocks-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="content-blocks-step" x="752" y="142">04</text>
    <text class="content-blocks-name" x="778" y="142">Resource links</text>
    <text class="content-blocks-desc" x="752" y="166">A pointer rather than a payload,</text>
    <text class="content-blocks-desc" x="752" y="182">which keeps the context small.</text>
  </g>
  <text class="content-blocks-sub" x="30" y="304">The last option is underused and often the right one: returning a resource URI instead of a megabyte of content lets the client decide whether to fetch it, rather than spending context unconditionally.</text>
</svg>
