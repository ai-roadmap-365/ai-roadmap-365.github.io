<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three cross-cutting concerns.">
  <title>Middleware around every tool</title>
  <style>
    .middleware-hooks-bg   { fill: #f8fafc; }
    .middleware-hooks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .middleware-hooks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .middleware-hooks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .middleware-hooks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .middleware-hooks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .middleware-hooks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .middleware-hooks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .middleware-hooks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .middleware-hooks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .middleware-hooks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .middleware-hooks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .middleware-hooks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .middleware-hooks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .middleware-hooks-stage { opacity: 1; }

    .middleware-hooks-s0 { animation-delay: 0.00s; }
    .middleware-hooks-e0 { animation-delay: 0.00s; }
    .middleware-hooks-s1 { animation-delay: 1.50s; }
    .middleware-hooks-e1 { animation-delay: 1.50s; }
    .middleware-hooks-s2 { animation-delay: 3.00s; }
    .middleware-hooks-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .middleware-hooks-conn  { animation: middleware-hooks-trace 6s ease-in-out infinite; }
      .middleware-hooks-stage { animation: middleware-hooks-arrive 6s ease-in-out infinite; }
    }
    @keyframes middleware-hooks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes middleware-hooks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .middleware-hooks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .middleware-hooks-stage { animation: middleware-hooks-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes middleware-hooks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="middleware-hooks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="middleware-hooks-bg" width="980" height="322"/>
  <text class="middleware-hooks-h1"  x="30" y="40">Middleware around every tool</text>
  <text class="middleware-hooks-sub" x="30" y="64">Three cross-cutting concerns.</text>
  <g class="middleware-hooks-stage middleware-hooks-s0">
    <rect class="middleware-hooks-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="middleware-hooks-step" x="44" y="142">01</text>
    <text class="middleware-hooks-name" x="70" y="142">Pre-execution authentication</text>
    <text class="middleware-hooks-desc" x="44" y="166">Checked once, in a wrapper, rather than in</text>
    <text class="middleware-hooks-desc" x="44" y="182">every handler.</text>
  </g>
  <line class="middleware-hooks-line middleware-hooks-conn middleware-hooks-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#middleware-hooks-tip)"/>
  <g class="middleware-hooks-stage middleware-hooks-s1">
    <rect class="middleware-hooks-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="middleware-hooks-step" x="359" y="142">02</text>
    <text class="middleware-hooks-name" x="385" y="142">Timing metrics</text>
    <text class="middleware-hooks-desc" x="359" y="166">Duration per tool, which is where Day 339's</text>
    <text class="middleware-hooks-desc" x="359" y="182">latency signal comes from.</text>
  </g>
  <line class="middleware-hooks-line middleware-hooks-conn middleware-hooks-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#middleware-hooks-tip)"/>
  <g class="middleware-hooks-stage middleware-hooks-s2">
    <rect class="middleware-hooks-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="middleware-hooks-step" x="674" y="142">03</text>
    <text class="middleware-hooks-name" x="700" y="142">Audit logging</text>
    <text class="middleware-hooks-desc" x="674" y="166">Every invocation to the security log, without</text>
    <text class="middleware-hooks-desc" x="674" y="182">cluttering business logic.</text>
  </g>
  <text class="middleware-hooks-sub" x="30" y="304">Composing these as decorators rather than writing them into handlers is what keeps them present: a cross-cutting concern implemented per function is a concern that will be missing from the function somebody adds next month.</text>
</svg>
