<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="So you write the function.">
  <title>Four things the decorator handles</title>
  <style>
    .fastmcp-benefits-bg   { fill: #f8fafc; }
    .fastmcp-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fastmcp-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fastmcp-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fastmcp-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fastmcp-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fastmcp-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fastmcp-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fastmcp-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fastmcp-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fastmcp-benefits-stage { opacity: 1; }

    .fastmcp-benefits-s0 { animation-delay: 0.00s; }
    .fastmcp-benefits-e0 { animation-delay: 0.00s; }
    .fastmcp-benefits-s1 { animation-delay: 1.28s; }
    .fastmcp-benefits-e1 { animation-delay: 1.28s; }
    .fastmcp-benefits-s2 { animation-delay: 2.56s; }
    .fastmcp-benefits-e2 { animation-delay: 2.56s; }
    .fastmcp-benefits-s3 { animation-delay: 3.84s; }
    .fastmcp-benefits-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fastmcp-benefits-conn  { animation: fastmcp-benefits-trace 6.4s ease-in-out infinite; }
      .fastmcp-benefits-stage { animation: fastmcp-benefits-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fastmcp-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fastmcp-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fastmcp-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fastmcp-benefits-stage { animation: fastmcp-benefits-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fastmcp-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fastmcp-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fastmcp-benefits-bg" width="980" height="322"/>
  <text class="fastmcp-benefits-h1"  x="30" y="40">Four things the decorator handles</text>
  <text class="fastmcp-benefits-sub" x="30" y="64">So you write the function.</text>
  <g class="fastmcp-benefits-stage fastmcp-benefits-s0">
    <rect class="fastmcp-benefits-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fastmcp-benefits-step" x="44" y="142">01</text>
    <text class="fastmcp-benefits-name" x="70" y="142">Schema derivation</text>
    <text class="fastmcp-benefits-desc" x="44" y="166">100% from type hints and</text>
    <text class="fastmcp-benefits-desc" x="44" y="182">docstrings. Nothing to maintain</text>
    <text class="fastmcp-benefits-desc" x="44" y="198">separately.</text>
  </g>
  <line class="fastmcp-benefits-line fastmcp-benefits-conn fastmcp-benefits-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fastmcp-benefits-tip)"/>
  <g class="fastmcp-benefits-stage fastmcp-benefits-s1">
    <rect class="fastmcp-benefits-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fastmcp-benefits-step" x="280" y="142">02</text>
    <text class="fastmcp-benefits-name" x="306" y="142">Coercion and validation</text>
    <text class="fastmcp-benefits-desc" x="280" y="166">Before the handler runs, so bad</text>
    <text class="fastmcp-benefits-desc" x="280" y="182">arguments never reach your</text>
    <text class="fastmcp-benefits-desc" x="280" y="198">logic.</text>
  </g>
  <line class="fastmcp-benefits-line fastmcp-benefits-conn fastmcp-benefits-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fastmcp-benefits-tip)"/>
  <g class="fastmcp-benefits-stage fastmcp-benefits-s2">
    <rect class="fastmcp-benefits-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fastmcp-benefits-step" x="516" y="142">03</text>
    <text class="fastmcp-benefits-name" x="542" y="142">Error recovery</text>
    <text class="fastmcp-benefits-desc" x="516" y="166">An uncaught exception would</text>
    <text class="fastmcp-benefits-desc" x="516" y="182">crash a script. Here it is a</text>
    <text class="fastmcp-benefits-desc" x="516" y="198">readable result.</text>
  </g>
  <line class="fastmcp-benefits-line fastmcp-benefits-conn fastmcp-benefits-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fastmcp-benefits-tip)"/>
  <g class="fastmcp-benefits-stage fastmcp-benefits-s3">
    <rect class="fastmcp-benefits-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fastmcp-benefits-step" x="752" y="142">04</text>
    <text class="fastmcp-benefits-name" x="778" y="142">Stdio framing</text>
    <text class="fastmcp-benefits-desc" x="752" y="166">Unbuffered pipes, JSON-RPC</text>
    <text class="fastmcp-benefits-desc" x="752" y="182">dispatch, capability handshake.</text>
    <text class="fastmcp-benefits-desc" x="752" y="198">Zero custom code.</text>
    <text class="fastmcp-benefits-edge" x="752" y="242">one line</text>
  </g>
  <text class="fastmcp-benefits-sub" x="30" y="304">The third is the difference between a tool an agent can recover from and one that ends the session: a database error the model can read is a retry, and a dead subprocess is a dead conversation.</text>
</svg>
