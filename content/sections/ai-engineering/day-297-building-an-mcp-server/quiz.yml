questions:
- question: How does the FastMCP Python SDK derive tool descriptions and parameter JSON schemas from native
    Python code?
  options:
  - It requires developers to write raw C header files
  - 'It inspects function docstrings for descriptions and Python type annotations (e.g. `def add(a: int,
    b: int) -> int`) to generate standard JSON Schema properties'
  - It queries an external cloud API
  - It generates schemas randomly at runtime
  answer_index: 1
  explanation: FastMCP uses Python reflection and type inspection to convert function signatures and docstrings
    directly into compliant JSON Schema definitions.
- question: What is the decorator pattern used in FastMCP to register a Python function as an MCP tool?
  options:
  - '`@mcp.tool()`'
  - '`@app.route()`'
  - '`@pytest.mark.test`'
  - '`@dataclass`'
  answer_index: 0
  explanation: '`@mcp.tool()` registers the decorated callable into the server''s internal tool registry
    with its parsed JSON schema.'
- question: How should an MCP tool indicate that an execution failed due to invalid arguments or runtime
    errors?
  options:
  - Crash the server process immediately with `sys.exit(1)`
  - 'Return a JSON-RPC response containing `content` with the error description and set `isError: true`'
  - Silently return an empty string
  - Send an email to the user
  answer_index: 1
  explanation: 'Setting `isError: true` in the result payload informs the AI model that the tool failed,
    allowing it to inspect the error text and self-correct.'
- question: Why is Pydantic commonly integrated with FastMCP tool handlers?
  options:
  - To speed up Python bytecode compilation
  - To provide strict runtime data validation, automatic type casting, and rich field descriptions for
    complex nested parameter schemas
  - To connect to GPU CUDA memory
  - To compress image files
  answer_index: 1
  explanation: Pydantic models define robust data validation schemas that translate directly into OpenAPI/JSON
    Schema models for AI agents.
- question: Which method initiates the standard stdio event loop in a Python MCP server?
  options:
  - '`mcp.run(transport=''stdio'')`'
  - '`mcp.listen_bluetooth()`'
  - '`server.connect_database()`'
  - '`os.fork()`'
  answer_index: 0
  explanation: '`mcp.run(transport=''stdio'')` starts the event loop listening on stdin and responding
    on stdout.'
