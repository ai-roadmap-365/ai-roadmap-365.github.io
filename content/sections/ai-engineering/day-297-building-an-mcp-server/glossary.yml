terms:
- term: FastMCP
  definition: A high-level Python framework for building Model Context Protocol servers using concise
    decorator syntax and automated schema generation.
- term: '@mcp.tool()'
  definition: The decorator used to register Python functions as callable AI tools in an MCP server.
- term: Type Annotation Inspection
  definition: Using Python's `typing` and `inspect` modules to generate JSON Schema types (`integer`,
    `string`, `boolean`, `array`) automatically.
- term: Docstring Parsing
  definition: Extracting tool summaries and parameter descriptions from function docstrings.
- term: isError Flag
  definition: A boolean field in the MCP tool response indicating whether the tool execution succeeded
    or failed.
- term: Content Block
  definition: 'A structured element within an MCP response (`{"type": "text", "text": "..."}`) carrying
    output payloads.'
- term: Stdio Event Loop
  definition: The core asynchronous loop reading JSON-RPC lines from stdin and writing serialized responses
    to stdout.
- term: Pydantic Schema Validation
  definition: Validating incoming dictionary arguments against Pydantic models prior to handler function
    invocation.
