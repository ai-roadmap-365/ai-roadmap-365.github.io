terms:
- term: Production Assistant
  definition: An integrated AI application combining routing, hybrid search, reranking, and grounded generation.
- term: Grounded Citations
  definition: Formal references embedded in generated text pointing to specific source document chunks.
- term: Refusal Guardrail
  definition: A mechanism preventing generation when retrieved context relevance falls below confidence
    thresholds.
- term: Time-to-First-Token (TTFT)
  definition: The duration from user prompt submission until the first streaming token is rendered.
- term: Retrieval Confidence Threshold
  definition: The minimum reranker or cosine score required to proceed with answer generation.
- term: Prompt Context Budget
  definition: The maximum number of tokens allocated for retrieved context in the LLM prompt.
- term: Execution Tracing
  definition: Logging timing, token usage, and intermediate states across all pipeline stages.
- term: Source Attribution
  definition: Verifiable provenance linking generated claims to exact knowledge base passages.
