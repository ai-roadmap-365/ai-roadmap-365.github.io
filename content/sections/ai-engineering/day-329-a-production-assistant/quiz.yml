questions:
- question: What is the primary architectural purpose of an end-to-end Production RAG Assistant?
  options:
  - To play video games
  - To synthesize query transformation, hybrid retrieval, cross-encoder reranking, parent context expansion,
    grounded citation generation, and refusal guardrails into a resilient user-facing system
  - To format hard drives
  - To replace all human employees with one script
  answer_index: 1
  explanation: A production assistant synthesizes all multi-stage retrieval and generation layers into
    a reliable service.
- question: How should a production RAG assistant respond when retrieval returns zero relevant documents
    (or all scores fall below a minimum confidence threshold)?
  options:
  - Invent a creative plausible story to avoid disappointing the user
  - Execute a graceful refusal (e.g. 'I do not have sufficient documentation in the verified knowledge
    base to answer this question accurately.') rather than hallucinating false claims
  - Crash with an HTTP 500 error
  - Restart the server
  answer_index: 1
  explanation: Strict refusal guardrails prevent high-risk hallucinations when context is missing.
- question: How are verified citations structured in a production RAG response?
  options:
  - By linking to random Wikipedia pages
  - 'By embedding deterministic citation markers (e.g. `[Doc-42: §3.1]`) in the generated prose mapped
    to exact document IDs, section titles, and source URLs in the response payload'
  - By printing the entire database in footer
  - By writing bibliography in Latin
  answer_index: 1
  explanation: Structured citations map specific statements directly to retrieved source document IDs
    and offsets.
- question: What is the recommended P95 latency target for an end-to-end streaming production RAG assistant?
  options:
  - 15 minutes
  - Under 800ms for Time-to-First-Token (TTFT) across query transformation, hybrid search, reranking,
    and generation start
  - 10 milliseconds
  - 1 hour
  answer_index: 1
  explanation: Production streaming RAG targets sub-800ms TTFT for seamless user experience.
- question: What telemetry metrics should be captured for every production assistant query?
  options:
  - User's monitor screen resolution
  - Query latency, retrieval candidates count, reranker top score, prompt token count, completion token
    count, and citation count
  - The server CPU serial number
  - The room temperature
  answer_index: 1
  explanation: Complete observability requires logging retrieval scores, token counts, latencies, and
    citations.
