<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Production RAG Assistant Architecture">
  <title>End-to-End Production RAG Assistant Architecture</title>
  <defs>
    <style>
      .d329a-bg { fill: #f8fafc; }
      .d329a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d329a-s1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d329a-s2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d329a-s3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d329a-s4 { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .d329a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d329a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d329a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d329a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d329a-bg" />
  
  <text x="40" y="40" class="d329a-title">End-to-End Production Assistant Architecture</text>
  <text x="40" y="65" class="d329a-subtitle">End-to-End Production RAG Assistant Architecture showing User Prompt, Query Router, Hybrid Search (Dense + Sparse), Cross-Encoder Reranker, Confidence Threshold Check, Prompt Assembly, Streaming Generation, and Telemetry Tracing</text>
  
  <!-- Stage 1: Ingestion & Routing -->
  <rect x="40" y="110" width="190" height="270" class="d329a-s1" />
  <text x="55" y="145" class="d329a-header" fill="#1d4ed8">1. Route &amp; Transform</text>
  <text x="55" y="180" class="d329a-text">• User Prompt Ingest</text>
  <text x="55" y="205" class="d329a-text">• Semantic Query Router</text>
  <text x="55" y="230" class="d329a-text">• HyDE / Expansion</text>
  <text x="55" y="255" class="d329a-text">• Latency: 15ms</text>
  <text x="55" y="295" class="d329a-text" font-weight="600" fill="#1d4ed8">Input Optimization</text>
  
  <!-- Stage 2: Hybrid Search & Rerank -->
  <rect x="250" y="110" width="190" height="270" class="d329a-s2" />
  <text x="265" y="145" class="d329a-header" fill="#7e22ce">2. Hybrid &amp; Rerank</text>
  <text x="265" y="180" class="d329a-text">• BM25 + Vector Search</text>
  <text x="265" y="205" class="d329a-text">• Reciprocal Rank Fusion</text>
  <text x="265" y="230" class="d329a-text">• Cross-Encoder Score</text>
  <text x="265" y="255" class="d329a-text">• Top-k Parent Resolution</text>
  <text x="265" y="295" class="d329a-text" font-weight="600" fill="#7e22ce">Precision Filtering</text>
  
  <!-- Stage 3: Guardrail & Assembly -->
  <rect x="460" y="110" width="190" height="270" class="d329a-s3" />
  <text x="475" y="145" class="d329a-header" fill="#15803d">3. Guardrail Check</text>
  <text x="475" y="180" class="d329a-text">• Score &gt; 0.65 Threshold</text>
  <text x="475" y="205" class="d329a-text">• **Pass:** Inject Context</text>
  <text x="475" y="230" class="d329a-text">• **Fail:** Graceful Refusal</text>
  <text x="475" y="255" class="d329a-text">• Context Budget: 2k tok</text>
  <text x="475" y="295" class="d329a-text" font-weight="600" fill="#15803d">Zero Hallucination</text>
  
  <!-- Stage 4: Generation & Stream -->
  <rect x="670" y="110" width="190" height="270" class="d329a-s4" />
  <text x="685" y="145" class="d329a-header" fill="#b45309">4. Stream &amp; Trace</text>
  <text x="685" y="180" class="d329a-text">• SSE Token Streaming</text>
  <text x="685" y="205" class="d329a-text">• `[Doc-ID]` Citations</text>
  <text x="685" y="230" class="d329a-text">• TTFT: &lt; 400ms</text>
  <text x="685" y="255" class="d329a-text">• OpenTelemetry Trace</text>
  <text x="685" y="295" class="d329a-text" font-weight="600" fill="#b45309">Verified Answers</text>
</svg>