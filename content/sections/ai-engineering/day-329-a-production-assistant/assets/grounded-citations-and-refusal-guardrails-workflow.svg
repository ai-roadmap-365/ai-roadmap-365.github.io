<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Grounded Citations and Refusal Guardrails Workflow">
  <title>Grounded Citations and Refusal Guardrails Workflow</title>
  <defs>
    <style>
      .d329b-bg { fill: #f8fafc; }
      .d329b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d329b-pass { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d329b-ref { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 6px; }
      .d329b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d329b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d329b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d329b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d329b-bg" />
  
  <text x="40" y="40" class="d329a-title">Grounded Citation &amp; Refusal Guardrail Engine</text>
  <text x="40" y="65" class="d329a-subtitle">Grounded Citations and Refusal Guardrails Workflow showing Confidence Check: Above 0.65 -> Stream Grounded Answer with [Doc-ID] Citations; Below 0.65 -> Graceful Refusal with Zero Hallucination</text>
  
  <!-- High Confidence Branch -->
  <rect x="40" y="110" width="390" height="270" class="d329b-pass" />
  <text x="60" y="145" class="d329b-header" fill="#15803d">Case A: High Confidence (Score &gt;= 0.65)</text>
  <text x="60" y="180" class="d329b-text">• Reranker Confidence: 0.94</text>
  <text x="60" y="205" class="d329b-text">• **Action:** Assemble prompt with parent context</text>
  <text x="60" y="230" class="d329b-text">• **Generated Response:**</text>
  <text x="60" y="255" class="d329b-text">  "PostgreSQL VACUUM cleans dead tuples [Doc-PG: §4].</text>
  <text x="60" y="275" class="d329b-text">  Autovacuum runs based on threshold [Doc-PG: §9]."</text>
  <text x="60" y="315" class="d329b-text" font-weight="600" fill="#15803d">Outcome: 100% Verifiable Citations</text>
  
  <!-- Low Confidence Branch -->
  <rect x="470" y="110" width="390" height="270" class="d329b-ref" />
  <text x="490" y="145" class="d329b-header" fill="#b91c1c">Case B: Low Confidence (Score &lt; 0.65)</text>
  <text x="490" y="180" class="d329b-text">• Reranker Confidence: 0.22 (Irrelevant docs)</text>
  <text x="490" y="205" class="d329b-text">• **Action: Trigger Refusal Guardrail**</text>
  <text x="490" y="230" class="d329b-text">• **Generated Response:**</text>
  <text x="490" y="255" class="d329b-text">  "I could not locate verified documentation to answer</text>
  <text x="490" y="275" class="d329b-text">  your inquiry regarding this topic."</text>
  <text x="490" y="315" class="d329b-text" font-weight="600" fill="#b91c1c">Outcome: Zero Hallucination Risk</text>
</svg>