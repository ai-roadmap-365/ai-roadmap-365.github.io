terms:
- term: Evaluation Harness
  definition: A unified framework executing benchmark datasets against AI models, computing metrics, and
    generating reports.
- term: Batch Evaluation
  definition: Running an evaluation harness concurrently across hundreds or thousands of test cases.
- term: Composite Score
  definition: A weighted combination of deterministic, statistical, and model-graded evaluation metrics.
- term: Concurrency Throttling
  definition: Restricting the number of simultaneous API requests using semaphores to avoid rate limits.
- term: Exponential Backoff
  definition: An algorithm that retries failed requests with exponentially increasing wait times.
- term: Regression Diff Report
  definition: A report highlighting test cases that regressed or improved between model versions.
- term: Golden Invariant
  definition: A non-negotiable evaluation test case that must pass 100% of the time.
- term: Evaluation Artifact
  definition: The output files (JSON results, markdown reports) generated by an evaluation run.
