<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The ones that are structural.">
  <title>Five of the ten checks</title>
  <style>
    .harness-checklist-bg   { fill: #f8fafc; }
    .harness-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-checklist-stage { opacity: 1; }

    .harness-checklist-s0 { animation-delay: 0.00s; }
    .harness-checklist-e0 { animation-delay: 0.00s; }
    .harness-checklist-s1 { animation-delay: 1.33s; }
    .harness-checklist-e1 { animation-delay: 1.33s; }
    .harness-checklist-s2 { animation-delay: 2.67s; }
    .harness-checklist-e2 { animation-delay: 2.67s; }
    .harness-checklist-s3 { animation-delay: 4.00s; }
    .harness-checklist-e3 { animation-delay: 4.00s; }
    .harness-checklist-s4 { animation-delay: 5.33s; }
    .harness-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-checklist-conn  { animation: harness-checklist-trace 8s ease-in-out infinite; }
      .harness-checklist-stage { animation: harness-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes harness-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-checklist-stage { animation: harness-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-checklist-bg" width="980" height="322"/>
  <text class="harness-checklist-h1"  x="30" y="40">Five of the ten checks</text>
  <text class="harness-checklist-sub" x="30" y="64">The ones that are structural.</text>
  <g class="harness-checklist-stage harness-checklist-s0">
    <rect class="harness-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="harness-checklist-step" x="44" y="142">01</text>
    <text class="harness-checklist-name" x="70" y="142">Stratified coverage</text>
    <text class="harness-checklist-desc" x="44" y="166">Happy paths, hard</text>
    <text class="harness-checklist-desc" x="44" y="182">negatives, boundaries,</text>
    <text class="harness-checklist-desc" x="44" y="198">adversarial. Day 310's</text>
  </g>
  <line class="harness-checklist-line harness-checklist-conn harness-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#harness-checklist-tip)"/>
  <g class="harness-checklist-stage harness-checklist-s1">
    <rect class="harness-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="harness-checklist-step" x="233" y="142">02</text>
    <text class="harness-checklist-name" x="259" y="142">An immutable baseline</text>
    <text class="harness-checklist-desc" x="233" y="166">Version-controlled, never</text>
    <text class="harness-checklist-desc" x="233" y="182">mutated in place.</text>
  </g>
  <line class="harness-checklist-line harness-checklist-conn harness-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#harness-checklist-tip)"/>
  <g class="harness-checklist-stage harness-checklist-s2">
    <rect class="harness-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="harness-checklist-step" x="422" y="142">03</text>
    <text class="harness-checklist-name" x="448" y="142">Multi-tier metrics</text>
    <text class="harness-checklist-desc" x="422" y="166">Exact match, schema F1,</text>
    <text class="harness-checklist-desc" x="422" y="182">and a calibrated judge.</text>
  </g>
  <line class="harness-checklist-line harness-checklist-conn harness-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#harness-checklist-tip)"/>
  <g class="harness-checklist-stage harness-checklist-s3">
    <rect class="harness-checklist-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="harness-checklist-step" x="611" y="142">04</text>
    <text class="harness-checklist-name" x="637" y="142">Zero invariant failures</text>
    <text class="harness-checklist-desc" x="611" y="166">Mission-critical cases at</text>
    <text class="harness-checklist-desc" x="611" y="182">100%, always.</text>
  </g>
  <line class="harness-checklist-line harness-checklist-conn harness-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#harness-checklist-tip)"/>
  <g class="harness-checklist-stage harness-checklist-s4">
    <rect class="harness-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="harness-checklist-step" x="800" y="142">05</text>
    <text class="harness-checklist-name" x="826" y="142">CI gating on the delta</text>
    <text class="harness-checklist-desc" x="800" y="166">A pull request fails on a</text>
    <text class="harness-checklist-desc" x="800" y="182">regression beyond</text>
    <text class="harness-checklist-desc" x="800" y="198">tolerance.</text>
  </g>
  <text class="harness-checklist-sub" x="30" y="304">The other five are operational — redaction, cost reporting, observability integration, diff reporting and judge calibration — and every one of them is easier to add now than to retrofit.</text>
</svg>
