<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different sensors for different questions.">
  <title>A standardised exam grader</title>
  <style>
    .exam-grading-bg   { fill: #f8fafc; }
    .exam-grading-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-grading-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-grading-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-grading-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-grading-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-grading-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-grading-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exam-grading-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exam-grading-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exam-grading-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exam-grading-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exam-grading-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-grading-row { opacity: 1; }
    .exam-grading-r0 { animation-delay: 0.00s; }
    .exam-grading-r1 { animation-delay: 0.45s; }
    .exam-grading-r2 { animation-delay: 0.90s; }
    .exam-grading-r3 { animation-delay: 1.35s; }
    .exam-grading-r4 { animation-delay: 1.80s; }
    .exam-grading-row { animation: exam-grading-reveal 7.3s ease-in-out infinite; }
    @keyframes exam-grading-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exam-grading-bg" width="980" height="390"/>
  <text class="exam-grading-h1"  x="30" y="40">A standardised exam grader</text>
  <text class="exam-grading-sub" x="30" y="64">Different sensors for different questions.</text>
  <rect class="exam-grading-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exam-grading-name" x="46" y="122">One method for everything</text>
  <text class="exam-grading-desc" x="46" y="142">Wrong for most questions.</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r0" x="46" y="182">Optical bubble reading, applied to essays</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r1" x="46" y="216">Or a human reading multiple choice</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r2" x="46" y="250">Precise where precision is not needed</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r3" x="46" y="284">Imprecise where it is</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r4" x="46" y="318">Slow and inaccurate at once</text>
  <rect class="exam-grading-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exam-grading-name" x="526" y="122">Matched methods</text>
  <text class="exam-grading-desc" x="526" y="142">Three sensors.</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r0" x="526" y="182">Bubbles scored binary and exactly</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r1" x="526" y="216">Equations checked structurally</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r2" x="526" y="250">Essays graded against a rubric</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r3" x="526" y="284">Sub-scores per section</text>
  <text class="exam-grading-desc exam-grading-row exam-grading-r4" x="526" y="318">One scorecard at the end</text>
  <text class="exam-grading-sub" x="30" y="372">The scorecard with sub-category breakdowns is what makes the result actionable: an overall percentage says a candidate passed, and the section breakdown says what they should study.</text>
</svg>
