questions:
- question: What are the four core architectural components of an end-to-end AI Evaluation Harness?
  options:
  - A web browser, a CSS file, a sound card, and a keyboard
  - 'Loader, runner, evaluator, and regression reporter'
  - A compiler, a database trigger, a DNS server, and a router
  - Three Python files without functions
  answer_index: 1
  explanation: A complete evaluation harness requires dataset management, execution orchestration, multi-tier
    metric evaluation, and regression reporting.
- question: Why is concurrency control (e.g. `asyncio.Semaphore` or thread pools) necessary when running
    batch evaluations against LLM APIs?
  options:
  - To prevent hard drive corruption
  - To make JSON files smaller
  - 'To go fast without tripping rate limits'
  - To disable Python garbage collection
  answer_index: 2
  explanation: Concurrency throttling ensures rapid batch evaluation without triggering vendor rate limits.
- question: What is a 'Composite Evaluation Score' in a multi-tier eval harness?
  options:
  - The price of the GPU server
  - The length of the response in characters
  - The number of lines of code in the prompt
  - 'One weighted number over schema, overlap, and judge'
  answer_index: 3
  explanation: Composite scoring balances strict structural compliance with nuanced semantic quality.
- question: How should an evaluation harness handle transient API network errors during a 500-sample benchmark
    run?
  options:
  - 'Retry transient errors and log the rest, without halting'
  - Crash immediately and discard all completed progress
  - Skip the rest of the dataset
  - Restart the entire operating system
  answer_index: 0
  explanation: Resilient evaluation harnesses retry transient errors and isolate failures to ensure reliable
    batch execution.
- question: What artifact should an evaluation harness generate upon completion for CI/CD integration?
  options:
  - A raw binary dump
  - 'A summary JSON plus a Markdown report'
  - An MP3 audio recording
  - A plain empty text file
  answer_index: 1
  explanation: Structured JSON and Markdown reports enable automated CI gate decisions and human reviewer
    inspection.
