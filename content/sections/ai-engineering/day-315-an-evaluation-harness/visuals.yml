visuals:
- id: end-to-end-evaluation-harness-architecture
  file: assets/end-to-end-evaluation-harness-architecture.svg
  type: diagram
  title: End-to-End Evaluation Harness Architecture
  alt: End-to-End Evaluation Harness Architecture showing Dataset Streaming, Concurrent Batch Runner,
    Multi-Metric Engine (EM, JSON F1, LLM Judge), Aggregator, and CI Markdown Reporter
  description: System architecture diagram of an end-to-end AI evaluation harness.
- id: composite-evaluation-scoring-and-aggregation-flow
  file: assets/composite-evaluation-scoring-and-aggregation-flow.svg
  type: diagram
  title: Composite Evaluation Scoring and Aggregation Flow
  alt: Composite Evaluation Scoring and Aggregation Flow showing Exact Match (25%), JSON F1 (25%), LLM
    Judge (50%), Weighted Average, Category Breakdown, and Final Decision
  description: Scoring pipeline calculating composite weighted metric averages across stratified benchmark
    categories.
- id: harness-pipeline
  file: assets/harness-pipeline.svg
  type: diagram
  title: 'The harness, end to end'
  alt: 'Diagram: the five stages of an end-to-end evaluation harness'
  description: 'A five-stage description of an evaluation harness covering dataset loading, concurrent execution, multi-metric scoring, regression gating and reporting.'
- id: harness-or-script
  file: assets/harness-or-script.svg
  type: diagram
  title: 'A harness, or a notebook loop'
  alt: 'Diagram: a unified evaluation harness compared with ad-hoc evaluation scripts'
  description: 'A two-column comparison of a versioned automated harness against ad-hoc notebook evaluation.'
- id: harness-lineage
  file: assets/harness-lineage.svg
  type: diagram
  title: 'Three phases of eval tooling'
  alt: 'Diagram: the progression from ad-hoc scripts to integrated evaluation platforms'
  description: 'A three-stage progression of evaluation tooling from Jupyter scripts through standalone benchmark runners to CI-integrated platforms.'
- id: concurrency-throttle
  file: assets/concurrency-throttle.svg
  type: diagram
  title: 'Running a thousand cases quickly'
  alt: 'Diagram: the concurrency controls of a high-throughput evaluation runner'
  description: 'A three-stage description of evaluation concurrency covering a semaphore pool, token bucket rate limiting and adaptive backoff.'
- id: exam-grading
  file: assets/exam-grading.svg
  type: diagram
  title: 'A standardised exam grader'
  alt: 'Diagram: automated exam grading as an analogy for multi-metric evaluation'
  description: 'A two-column comparison of applying a single grading method to all questions against matching methods to question types.'
- id: harness-checklist
  file: assets/harness-checklist.svg
  type: diagram
  title: 'Five of the ten checks'
  alt: 'Diagram: the structural requirements of a production evaluation harness'
  description: 'A five-stage checklist covering dataset stratification, baseline immutability, multi-tier metrics, invariant pass rates and CI gating.'
- id: harness-roi
  file: assets/harness-roi.svg
  type: diagram
  title: 'What twelve months produced'
  alt: 'Diagram: the measured effects of adopting an evaluation harness over a year'
  description: 'A four-stage description of measured outcomes covering deployment velocity, customer escalations, inference cost and engineering confidence.'
- id: nightly-matrix
  file: assets/nightly-matrix.svg
  type: diagram
  title: 'What a nightly run adds'
  alt: 'Diagram: what scheduled matrix evaluation adds beyond pull request gating'
  description: 'A three-stage description of scheduled evaluation covering the model matrix, price-performance tracking and dataset expansion.'
- id: fintech-case
  file: assets/fintech-case.svg
  type: diagram
  title: 'Two weeks to fifteen minutes'
  alt: 'Diagram: a financial platform''s evaluation harness and its measured outcome'
  description: 'A four-stage walkthrough of a fintech evaluation harness covering the benchmark, composite metrics, regulatory gates and the outcome.'
- id: harness-when
  file: assets/harness-when.svg
  type: diagram
  title: 'When to build the harness'
  alt: 'Diagram: when a unified evaluation harness is warranted'
  description: 'A two-column comparison of systems requiring a full evaluation harness against disposable prototypes, with adoption practices.'
