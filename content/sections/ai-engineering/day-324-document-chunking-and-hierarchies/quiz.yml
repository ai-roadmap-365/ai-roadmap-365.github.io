questions:
- question: What is the core dilemma in selecting a chunk size for standard Retrieval-Augmented Generation?
  options:
  - Small chunks are too fast for computers to read
  - Small chunks (e.g. 100 tokens) produce sharp, highly specific vector embeddings that match queries
    precisely but lack sufficient surrounding context for the LLM to reason; Large chunks (e.g. 1,500
    tokens) provide rich context but produce diluted, averaged embeddings that suffer from poor search
    precision
  - Chunking is only needed for audio files
  - Large chunks cause syntax errors in JSON
  answer_index: 1
  explanation: Small chunks optimize retrieval precision while large chunks optimize generation context.
- question: How does 'Parent-Document Retrieval' (Small-to-Big Retrieval) solve this chunking dilemma?
  options:
  - By deleting child chunks after search
  - By indexing small child chunks (e.g. 100-token sentences) in the vector database for high-precision
    search, but attaching metadata referencing a larger parent block (e.g. 1,000-token section); when
    a child matches, the full parent document is injected into the LLM prompt
  - By asking the user's parents for permission
  - By compressing all documents into single-character tokens
  answer_index: 1
  explanation: Parent-document retrieval searches over small child vectors but returns full parent context
    blocks.
- question: How does 'Semantic Chunking' determine split boundaries compared to Fixed-Size Chunking?
  options:
  - By counting exactly 500 characters
  - By calculating embedding distances between consecutive sentences; when the cosine distance between
    sentence i and sentence i+1 exceeds a percentile threshold (indicating a shift in topic), a chunk
    boundary is placed
  - By splitting on commas
  - By picking random line numbers
  answer_index: 1
  explanation: Semantic chunking splits text dynamically at points where semantic vector distance between
    sentences spikes.
- question: Why is Markdown AST-aware chunking superior to naive fixed-token splitting for technical documentation?
  options:
  - It makes the files larger
  - 'It preserves semantic structure: headers (`#`, `##`), code blocks (```), and tables are never sliced
    in half mid-syntax, maintaining syntactic validity and context coherence'
  - It changes fonts automatically
  - It translates English to German
  answer_index: 1
  explanation: Structure-aware chunking preserves table integrity, code block syntax, and header context
    hierarchies.
- question: What is 'Sliding Window Chunking with Overlap'?
  options:
  - Opening multiple browser windows
  - Creating chunks of size N (e.g. 500 tokens) where each chunk shares M tokens of overlap (e.g. 100
    tokens) with the preceding chunk, preventing critical semantic concepts from being severed at boundary
    cuts
  - Deleting every second sentence
  - Running search in parallel
  answer_index: 1
  explanation: Chunk overlap ensures that sentences spanning a boundary cut are not lost from context.
