<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Semantic Chunking Distance Threshold Graph">
  <title>Semantic Chunking Distance Threshold Graph</title>
  <defs>
    <style>
      .d324b-bg { fill: #f8fafc; }
      .d324b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d324b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d324b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d324b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d324b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d324b-line { stroke: #3b82f6; stroke-width: 3px; fill: none; }
      .d324b-thresh { stroke: #ef4444; stroke-width: 2px; stroke-dasharray: 6 4; }
      .d324b-split { stroke: #22c55e; stroke-width: 2px; stroke-dasharray: 4 2; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d324b-bg" />
  
  <text x="40" y="40" class="d324a-title">Semantic Boundary Detection via Embedding Distance</text>
  <text x="40" y="65" class="d324a-subtitle">Semantic Chunking Distance Threshold Graph showing Cosine Distance spikes across sentence transitions with Dynamic Split Threshold placing boundary cuts</text>
  
  <!-- Graph Card -->
  <rect x="40" y="100" width="820" height="290" class="d324b-card" />
  
  <!-- Threshold line -->
  <line x1="80" y1="220" x2="820" y2="220" class="d324b-thresh" />
  <text x="680" y="210" class="d324b-header" fill="#ef4444">Split Threshold (95th Percentile = 0.45)</text>
  
  <!-- Data Curve -->
  <path d="M 100 310 Q 150 300 200 320 T 300 150 T 400 330 T 500 320 T 600 130 T 700 310 T 800 320" class="d324b-line" />
  
  <!-- Split Marker 1 -->
  <line x1="300" y1="120" x2="300" y2="350" class="d324b-split" />
  <text x="250" y="140" class="d324b-header" fill="#15803d">Split 1 (Topic Change)</text>
  <text x="250" y="370" class="d324b-text">Sentence 4 -> 5: Introduction -> Architecture</text>
  
  <!-- Split Marker 2 -->
  <line x1="600" y1="120" x2="600" y2="350" class="d324b-split" />
  <text x="550" y="140" class="d324b-header" fill="#15803d">Split 2 (Topic Change)</text>
  <text x="550" y="370" class="d324b-text">Sentence 11 -> 12: Architecture -> Pricing</text>
</svg>