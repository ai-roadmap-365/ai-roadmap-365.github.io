<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Parent-Document Hierarchical Retrieval Flow">
  <title>Parent-Document Hierarchical Retrieval Flow</title>
  <defs>
    <style>
      .d324a-bg { fill: #f8fafc; }
      .d324a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d324a-c1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d324a-c2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d324a-c3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d324a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d324a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d324a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d324a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d324a-bg" />
  
  <text x="40" y="40" class="d324a-title">Parent-Document (Small-to-Big) Retrieval Flow</text>
  <text x="40" y="65" class="d324a-subtitle">Parent-Document Hierarchical Retrieval Flow showing Granular Child Chunk Search (100 tokens), Vector Match, Parent Document Lookup (1000 tokens), and Context Assembly for LLM</text>
  
  <!-- Step 1: Granular Vector Search -->
  <rect x="40" y="110" width="250" height="270" class="d324a-c1" />
  <text x="60" y="145" class="d324a-header" fill="#1d4ed8">1. Granular Vector Search</text>
  <text x="60" y="180" class="d324a-text">• User Query: "refund policy for shoes"</text>
  <text x="60" y="205" class="d324a-text">• Child Chunks: 80 - 150 tokens</text>
  <text x="60" y="230" class="d324a-text">• Vector Index: Sharp cosine match</text>
  <text x="60" y="255" class="d324a-text">• **Child Match:** `child_doc_42` (0.94)</text>
  <text x="60" y="295" class="d324a-text" font-weight="600" fill="#1d4ed8">Benefit: High Search Precision</text>
  <text x="60" y="320" class="d324a-text">Zero vector embedding dilution</text>
  
  <!-- Step 2: Parent Document Lookup -->
  <rect x="325" y="110" width="250" height="270" class="d324a-c2" />
  <text x="345" y="145" class="d324a-header" fill="#7e22ce">2. Parent ID Resolution</text>
  <text x="345" y="180" class="d324a-text">• Read metadata `parent_id`</text>
  <text x="345" y="205" class="d324a-text">• Map `child_42` -> `parent_doc_7`</text>
  <text x="345" y="230" class="d324a-text">• Fetch from Document Store / S3</text>
  <text x="345" y="255" class="d324a-text">• Parent Size: 1,200 tokens</text>
  <text x="345" y="295" class="d324a-text" font-weight="600" fill="#7e22ce">Lookup: KV / SQL (1ms)</text>
  <text x="345" y="320" class="d324a-text">Deduplicate overlapping parents</text>
  
  <!-- Step 3: Context Assembly -->
  <rect x="610" y="110" width="250" height="270" class="d324a-c3" />
  <text x="630" y="145" class="d324a-header" fill="#15803d">3. Full Generation Context</text>
  <text x="630" y="180" class="d324a-text">• Entire Return Policy Section</text>
  <text x="630" y="205" class="d324a-text">• Complete table of exclusions</text>
  <text x="630" y="230" class="d324a-text">• Full header hierarchy</text>
  <text x="630" y="255" class="d324a-text">• Injected into LLM prompt</text>
  <text x="630" y="295" class="d324a-text" font-weight="600" fill="#15803d">Outcome: Perfect Answer</text>
  <text x="630" y="320" class="d324a-text">Zero hallucinated context</text>
</svg>