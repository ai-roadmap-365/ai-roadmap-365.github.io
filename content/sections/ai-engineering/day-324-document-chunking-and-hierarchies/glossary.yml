terms:
- term: Parent-Document Retrieval
  definition: A technique searching over small child vector chunks but retrieving larger parent documents
    for generation.
- term: Semantic Chunking
  definition: Splitting documents dynamically at statistical spikes in semantic distance between consecutive
    sentences.
- term: Small-to-Big Retrieval
  definition: Hierarchical retrieval matching granular sentences and expanding to paragraph or chapter
    context.
- term: Chunk Overlap
  definition: A buffer of shared tokens between adjacent chunks preventing context loss across boundary
    cuts.
- term: Structure-Aware Chunking
  definition: Splitting documents respecting syntactic markdown trees, tables, headers, and code blocks.
- term: Child Chunk
  definition: A fine-grained text slice (50-150 tokens) indexed in vector storage for search precision.
- term: Parent Chunk
  definition: A broad contextual document block (500-2000 tokens) stored in document storage for LLM prompt
    injection.
- term: Context Dilution
  definition: The degradation of vector embedding specificity when large multi-topic documents are compressed
    into one vector.
