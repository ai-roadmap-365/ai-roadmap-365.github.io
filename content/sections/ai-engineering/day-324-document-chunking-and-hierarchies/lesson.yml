week: 47
learning_promise: 'Master document chunking strategies and hierarchical indexing: implement semantic boundary
  splitting, parent-document retrieval, and small-to-big context expansion in Python.'
objectives:
- 'Deconstruct the fundamental trade-off of chunk size: small chunks optimize retrieval precision while
  large chunks preserve generation context.'
- Implement Semantic Chunking splitting text along sentence embedding distance shifts rather than arbitrary
  token counts.
- Architect Parent-Document Retrieval (Small-to-Big Search) indexing fine-grained 100-token child chunks
  that map to 1,000-token parent context blocks.
- Build a production-grade Hierarchical Document Chunker in Python supporting Markdown AST structure,
  overlap windows, and parent-child ID mapping.
- Evaluate retrieval precision and recall trade-offs across fixed-size, recursive, semantic, and hierarchical
  chunking strategies.
