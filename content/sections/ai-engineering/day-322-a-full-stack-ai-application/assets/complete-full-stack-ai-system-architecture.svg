<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Complete Full-Stack AI System Architecture">
  <title>Complete Full-Stack AI System Architecture</title>
  <defs>
    <style>
      .d322a-bg { fill: #f8fafc; }
      .d322a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d322a-c1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d322a-c2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d322a-c3 { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d322a-c4 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d322a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d322a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d322a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d322a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d322a-bg" />
  
  <text x="40" y="40" class="d322a-title">Complete Full-Stack AI Application Pipeline</text>
  <text x="40" y="65" class="d322a-subtitle">Complete Full-Stack AI System Architecture showing Client UI, Edge Auth &amp; Quota Gateway, Multi-Tier Cache, Two-Phase Billing Engine, Model Router, and LLM Providers</text>
  
  <!-- Step 1: Frontend Client -->
  <rect x="40" y="110" width="180" height="270" class="d322a-c1" />
  <text x="55" y="140" class="d322a-header" fill="#1d4ed8">1. Client UX</text>
  <text x="55" y="170" class="d322a-text">• Optimistic UI state</text>
  <text x="55" y="190" class="d322a-text">• SSE Stream parsing</text>
  <text x="55" y="210" class="d322a-text">• Smart Auto-Scroll</text>
  <text x="55" y="230" class="d322a-text">• Abort Controller</text>
  <text x="55" y="260" class="d322a-text" font-weight="600">Perception:</text>
  <text x="55" y="280" class="d322a-text">0ms Instant Response</text>
  
  <!-- Step 2: Gateway & Caching -->
  <rect x="250" y="110" width="180" height="270" class="d322a-c2" />
  <text x="265" y="140" class="d322a-header" fill="#7e22ce">2. Gateway &amp; Cache</text>
  <text x="265" y="170" class="d322a-text">• SHA-256 Auth &amp; Scopes</text>
  <text x="265" y="190" class="d322a-text">• RPM / TPM Quota Gate</text>
  <text x="265" y="210" class="d322a-text">• Tier 1 Exact Hash (1ms)</text>
  <text x="265" y="230" class="d322a-text">• Tier 2 Semantic (15ms)</text>
  <text x="265" y="260" class="d322a-text" font-weight="600">Cache Hit:</text>
  <text x="265" y="280" class="d322a-text">Instant Return ($0.00)</text>
  
  <!-- Step 3: Billing Pre-Auth -->
  <rect x="460" y="110" width="180" height="270" class="d322a-c3" />
  <text x="475" y="140" class="d322a-header" fill="#a16207">3. Pre-Auth Hold</text>
  <text x="475" y="170" class="d322a-text">• Check available balance</text>
  <text x="475" y="190" class="d322a-text">• Reserve estimated hold</text>
  <text x="475" y="210" class="d322a-text">• Prevent overdrafts</text>
  <text x="475" y="230" class="d322a-text">• Track in-flight requests</text>
  <text x="475" y="260" class="d322a-text" font-weight="600">Guarantee:</text>
  <text x="475" y="280" class="d322a-text">Zero Unpaid Compute</text>
  
  <!-- Step 4: Router & Settlement -->
  <rect x="670" y="110" width="190" height="270" class="d322a-c4" />
  <text x="685" y="140" class="d322a-header" fill="#15803d">4. Router &amp; Settle</text>
  <text x="685" y="170" class="d322a-text">• Multi-Provider Failover</text>
  <text x="685" y="190" class="d322a-text">• Stream SSE tokens</text>
  <text x="685" y="210" class="d322a-text">• Exact Token Settlement</text>
  <text x="685" y="230" class="d322a-text">• Release unused hold</text>
  <text x="685" y="260" class="d322a-text" font-weight="600">Final Balance:</text>
  <text x="685" y="280" class="d322a-text" fill="#15803d" font-weight="700">Reconciled 100%</text>
</svg>