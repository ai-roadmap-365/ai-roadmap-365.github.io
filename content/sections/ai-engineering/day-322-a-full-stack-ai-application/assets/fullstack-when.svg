<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what a prototype still owes.">
  <title>When the full architecture applies</title>
  <style>
    .fullstack-when-bg   { fill: #f8fafc; }
    .fullstack-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fullstack-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fullstack-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fullstack-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fullstack-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fullstack-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fullstack-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fullstack-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fullstack-when-row { opacity: 1; }
    .fullstack-when-r0 { animation-delay: 0.00s; }
    .fullstack-when-r1 { animation-delay: 0.45s; }
    .fullstack-when-r2 { animation-delay: 0.90s; }
    .fullstack-when-r3 { animation-delay: 1.35s; }
    .fullstack-when-r4 { animation-delay: 1.80s; }
    .fullstack-when-row { animation: fullstack-when-reveal 7.3s ease-in-out infinite; }
    @keyframes fullstack-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fullstack-when-bg" width="980" height="390"/>
  <text class="fullstack-when-h1"  x="30" y="40">When the full architecture applies</text>
  <text class="fullstack-when-sub" x="30" y="64">And what a prototype still owes.</text>
  <rect class="fullstack-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fullstack-when-name" x="46" y="122">The full stack</text>
  <text class="fullstack-when-desc" x="46" y="142">Commercial and multi-tenant.</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r0" x="46" y="182">Commercial SaaS products</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r1" x="46" y="216">Enterprise copilots</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r2" x="46" y="250">Multi-tenant customer assistants</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r3" x="46" y="284">Anything with paying users</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r4" x="46" y="318">Anything with an availability commitment</text>
  <rect class="fullstack-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fullstack-when-name" x="526" y="122">A prototype owes three</text>
  <text class="fullstack-when-desc" x="526" y="142">Even at ten lines.</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r0" x="526" y="182">Keys server-side, never in the client</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r1" x="526" y="216">A hard spend cap</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r2" x="526" y="250">Token counts recorded per request</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r3" x="526" y="284">The rest can wait</text>
  <text class="fullstack-when-desc fullstack-when-row fullstack-when-r4" x="526" y="318">These three cannot</text>
  <text class="fullstack-when-sub" x="30" y="372">The three on the right are the ones whose absence produces an unrecoverable outcome — an exposed key, an unbounded bill, or a usage history that was never captured and cannot be reconstructed.</text>
</svg>
