<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Seven checkpoints, in order.">
  <title>One request, end to end</title>
  <style>
    .request-timeline-bg   { fill: #f8fafc; }
    .request-timeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-timeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-timeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-timeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-timeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-timeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .request-timeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .request-timeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .request-timeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .request-timeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .request-timeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .request-timeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .request-timeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .request-timeline-stage { opacity: 1; }

    .request-timeline-s0 { animation-delay: 0.00s; }
    .request-timeline-e0 { animation-delay: 0.00s; }
    .request-timeline-s1 { animation-delay: 1.40s; }
    .request-timeline-e1 { animation-delay: 1.40s; }
    .request-timeline-s2 { animation-delay: 2.80s; }
    .request-timeline-e2 { animation-delay: 2.80s; }
    .request-timeline-s3 { animation-delay: 4.20s; }
    .request-timeline-e3 { animation-delay: 4.20s; }
    .request-timeline-s4 { animation-delay: 5.60s; }
    .request-timeline-e4 { animation-delay: 5.60s; }
    .request-timeline-s5 { animation-delay: 7.00s; }
    .request-timeline-e5 { animation-delay: 7.00s; }
    .request-timeline-s6 { animation-delay: 8.40s; }
    .request-timeline-e6 { animation-delay: 8.40s; }
    @media (prefers-reduced-motion: no-preference) {
      .request-timeline-conn  { animation: request-timeline-trace 11.200000000000001s ease-in-out infinite; }
      .request-timeline-stage { animation: request-timeline-arrive 11.200000000000001s ease-in-out infinite; }
    }
    @keyframes request-timeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes request-timeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .request-timeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .request-timeline-stage { animation: request-timeline-settle 11.200000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes request-timeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="request-timeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="request-timeline-bg" width="980" height="322"/>
  <text class="request-timeline-h1"  x="30" y="40">One request, end to end</text>
  <text class="request-timeline-sub" x="30" y="64">Seven checkpoints, in order.</text>
  <g class="request-timeline-stage request-timeline-s0">
    <rect class="request-timeline-box" x="30" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="44" y="142">01</text>
    <text class="request-timeline-name" x="70" y="142">Authenticate</text>
    <text class="request-timeline-desc" x="44" y="166">Hashed key,</text>
    <text class="request-timeline-desc" x="44" y="182">constant-time</text>
    <text class="request-timeline-desc" x="44" y="198">comparison,</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e0" x1="141" y1="170" x2="163" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s1">
    <rect class="request-timeline-box" x="165" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="179" y="142">02</text>
    <text class="request-timeline-name" x="205" y="142">Rate limit</text>
    <text class="request-timeline-desc" x="179" y="166">Requests and</text>
    <text class="request-timeline-desc" x="179" y="182">tokens per</text>
    <text class="request-timeline-desc" x="179" y="198">minute. Cheap</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e1" x1="276" y1="170" x2="298" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s2">
    <rect class="request-timeline-warn" x="300" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="314" y="142">03</text>
    <text class="request-timeline-name" x="340" y="142">Place a credit hold</text>
    <text class="request-timeline-desc" x="314" y="166">Atomically, with</text>
    <text class="request-timeline-desc" x="314" y="182">a TTL. No</text>
    <text class="request-timeline-desc" x="314" y="198">generation</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e2" x1="411" y1="170" x2="433" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s3">
    <rect class="request-timeline-box" x="435" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="449" y="142">04</text>
    <text class="request-timeline-name" x="475" y="142">Check the caches</text>
    <text class="request-timeline-desc" x="449" y="166">Exact, then</text>
    <text class="request-timeline-desc" x="449" y="182">semantic. A hit</text>
    <text class="request-timeline-desc" x="449" y="198">settles at zero</text>
    <text class="request-timeline-edge" x="449" y="242">20 ms</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e3" x1="546" y1="170" x2="568" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s4">
    <rect class="request-timeline-box" x="570" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="584" y="142">05</text>
    <text class="request-timeline-name" x="610" y="142">Route to a provider</text>
    <text class="request-timeline-desc" x="584" y="166">Cascade by</text>
    <text class="request-timeline-desc" x="584" y="182">complexity; fail</text>
    <text class="request-timeline-desc" x="584" y="198">over on error.</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e4" x1="681" y1="170" x2="703" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s5">
    <rect class="request-timeline-box" x="705" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="719" y="142">06</text>
    <text class="request-timeline-name" x="745" y="142">Stream</text>
    <text class="request-timeline-desc" x="719" y="166">SSE frames,</text>
    <text class="request-timeline-desc" x="719" y="182">abortable, with</text>
    <text class="request-timeline-desc" x="719" y="198">the trace ID</text>
  </g>
  <line class="request-timeline-line request-timeline-conn request-timeline-e5" x1="816" y1="170" x2="838" y2="170" marker-end="url(#request-timeline-tip)"/>
  <g class="request-timeline-stage request-timeline-s6">
    <rect class="request-timeline-good" x="840" y="118" width="109" height="104" rx="10"/>
    <text class="request-timeline-step" x="854" y="142">07</text>
    <text class="request-timeline-name" x="880" y="142">Settle</text>
    <text class="request-timeline-desc" x="854" y="166">Exact tokens</text>
    <text class="request-timeline-desc" x="854" y="182">charged, the</text>
    <text class="request-timeline-desc" x="854" y="198">remaining hold</text>
  </g>
  <text class="request-timeline-sub" x="30" y="304">The ordering is entirely about cost: every step before the fifth is cheap and can reject, and everything expensive happens only once all of them have passed.</text>
</svg>
