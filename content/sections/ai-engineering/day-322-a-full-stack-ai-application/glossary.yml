terms:
- term: Full-Stack AI Application
  definition: A complete, integrated software product uniting client UI, streaming gateway, auth, billing,
    caching, and model routing.
- term: Two-Phase Token Transaction
  definition: Reserving an estimated credit hold before generation and settling exact token charges upon
    completion.
- term: End-to-End Resilience
  definition: The ability of an application to withstand client disconnects, provider outages, and rate
    limits without data loss.
- term: Cache-First Architecture
  definition: Checking exact and semantic cache layers before allocating model compute or placing credit
    holds.
- term: Sub-Second TTFT
  definition: Delivering the first token to the client viewport in under 1,000 milliseconds.
- term: Zero-Overdraft Guarantee
  definition: Architectural assurance that tenants cannot consume more compute credits than their available
    balance.
- term: Multi-Provider Failover
  definition: Seamlessly switching from primary to secondary model replicas during cloud provider incidents.
- term: Production Readiness Audit
  definition: A comprehensive verification checklist assessing security, latency, economics, and reliability.
