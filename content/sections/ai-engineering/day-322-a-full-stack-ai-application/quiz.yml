questions:
- question: What is the primary architectural value of assembling an integrated Full-Stack AI Application
    pipeline?
  options:
  - It makes the codebase look complex
  - It coordinates client presentation, authentication, two-phase credit billing, multi-tier caching,
    and vendor fallback into a unified, secure, resilient, and monetizable platform
  - It eliminates the need for unit testing
  - It replaces the database with text files
  answer_index: 1
  explanation: A complete full-stack architecture harmonizes UX, security, billing, caching, and multi-cloud
    resilience.
- question: In what order should an incoming client chat request pass through the backend pipeline layers?
  options:
  - Inference -> Billing -> Auth -> Cache
  - 1. Edge Authentication & Quotas -> 2. Tier 1 & 2 Caching -> 3. Credit Pre-Auth Hold -> 4. Vendor Router
    / Model Stream -> 5. Exact Usage Settlement & Balance Update
  - Model call -> Frontend render -> Database save
  - Random order
  answer_index: 1
  explanation: Security, quotas, and caching must precede expensive model execution and credit settlement.
- question: What happens when a user query hits Tier 1 (Exact Match) or Tier 2 (Semantic Cache)?
  options:
  - The server crashes
  - The cached response is returned immediately in under 15ms with zero GPU token costs and zero credit
    pre-auth holds, maximizing profit margins and delivering instant user responses
  - The user is billed double
  - The cache is deleted
  answer_index: 1
  explanation: Cache hits deliver instant responses at zero model API cost.
- question: How does the full-stack system protect against partial streaming failures mid-generation?
  options:
  - By charging the user the full estimated amount
  - The backend detects the disconnect/error, settles only the exact tokens generated up to the failure
    point, releases the remaining pre-auth hold, and returns a graceful error to the client
  - By locking the user's account
  - By rebooting the server
  answer_index: 1
  explanation: Two-phase settlement ensures users are only billed for actual delivered tokens.
- question: What standard ensures that frontend client state remains synchronized with backend streaming
    progress?
  options:
  - 'Server-Sent Events (SSE) with structured JSON event framing (`event: message`, `data: {...}`)'
  - FTP file transfer
  - Email notifications
  - Printing to paper
  answer_index: 0
  explanation: Structured SSE event frames communicate tokens, metadata, and termination states cleanly.
