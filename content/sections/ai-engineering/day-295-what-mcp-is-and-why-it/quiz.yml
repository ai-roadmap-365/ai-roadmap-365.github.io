questions:
- question: What is the primary industry problem solved by the Model Context Protocol (MCP)?
  options:
  - 'The N x M integration problem'
  - It replaces HTML with XML in browsers
  - It reduces Python memory usage to zero bytes
  - It compiles CUDA kernels for AMD GPUs
  answer_index: 0
  explanation: MCP standardizes the interface between AI host applications (Claude Desktop, IDEs) and
    data providers/tools into a universal 1-to-N protocol.
- question: Which messaging protocol serves as the foundation for Model Context Protocol communication?
  options:
  - gRPC binary protobuf
  - 'JSON-RPC 2.0 over stdio or HTTP with SSE'
  - SOAP XML over SMTP
  - Raw TCP sockets with custom byte headers
  answer_index: 1
  explanation: MCP uses JSON-RPC 2.0 framing over stdio for local subprocesses and SSE for remote network
    servers.
- question: What are the three fundamental primitives exposed by an MCP Server?
  options:
  - Models, Weights, and Hyperparameters
  - Tables, Views, and Stored Procedures
  - 'Tools, resources, and prompts'
  - Files, Folders, and Sockets
  answer_index: 2
  explanation: MCP formally standardizes Tools (dynamic functions), Resources (URI-addressable data/files),
    and Prompts (reusable workflow templates).
- question: How does capability negotiation operate during the initial MCP initialization handshake?
  options:
  - The client sends a raw binary seed
  - The client downloads the server's source code
  - The server encrypts the hard drive
  - 'The client sends initialize; the server replies'
  answer_index: 3
  explanation: The `initialize` and `notifications/initialized` handshake establishes protocol version
    parity and feature availability before tools are dispatched.
- question: Why is stdio (standard input/output) the preferred default transport for local MCP servers?
  options:
  - 'No ports, no CORS, and lifecycle tied to the process'
  - Stdio is faster than CPU L1 cache
  - Stdio enables wireless Bluetooth communication
  - Stdio prevents Python imports
  answer_index: 0
  explanation: Stdio provides sandboxed process boundaries, zero port collision risk, and immediate cleanup
    when the client terminates.
