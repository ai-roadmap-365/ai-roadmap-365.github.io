visuals:
- id: mcp-universal-architecture-n-times-m
  file: assets/mcp-universal-architecture-n-times-m.svg
  type: diagram
  title: MCP Universal Architecture N times M
  alt: MCP Universal Architecture N times M diagram comparing fragmented bespoke point-to-point connections
    with universal MCP standardized protocol bus
  description: Comparative architecture diagram illustrating how MCP eliminates the N-times-M tool integration
    dilemma.
- id: mcp-jsonrpc-handshake-and-lifecycle
  file: assets/mcp-jsonrpc-handshake-and-lifecycle.svg
  type: diagram
  title: MCP JSONRPC Handshake and Lifecycle
  alt: MCP JSONRPC Handshake and Lifecycle sequence diagram showing Initialize, Initialized Notification,
    Tools List, and Tools Call request flows
  description: Sequence diagram showing the complete JSON-RPC 2.0 initialization and tool execution lifecycle.
- id: mcp-primitives
  file: assets/mcp-primitives.svg
  type: diagram
  title: 'Three primitives'
  alt: 'Diagram: the three primitives the Model Context Protocol standardises'
  description: 'A three-stage description of MCP primitives covering executable tools, readable resources and prompt templates.'
- id: n-times-m
  file: assets/n-times-m.svg
  type: diagram
  title: 'N x M, or N + M'
  alt: 'Diagram: point-to-point integrations compared with a single protocol'
  description: 'A two-column comparison of bespoke connectors per client-tool pair against one protocol both sides implement.'
- id: mcp-lineage
  file: assets/mcp-lineage.svg
  type: diagram
  title: 'Three steps to a standard'
  alt: 'Diagram: the progression from the Language Server Protocol to MCP'
  description: 'A three-stage progression from LSP through proprietary plugin ecosystems to the open Model Context Protocol.'
- id: mcp-not-lockin
  file: assets/mcp-not-lockin.svg
  type: diagram
  title: 'Three things MCP is not'
  alt: 'Diagram: what MCP is compared with three misconceptions about it'
  description: 'A two-column comparison of MCP''s actual scope against assumptions of vendor lock-in, framework replacement and REST replacement.'
- id: jsonrpc-messages
  file: assets/jsonrpc-messages.svg
  type: diagram
  title: 'Three message shapes'
  alt: 'Diagram: the three JSON-RPC message types used by MCP'
  description: 'A four-stage description of MCP message framing covering requests, responses, notifications, and how tool errors are represented.'
- id: stdio-or-sse
  file: assets/stdio-or-sse.svg
  type: diagram
  title: 'Two transports'
  alt: 'Diagram: stdio transport compared with server-sent events over HTTP'
  description: 'A two-column comparison of local stdio transport against remote SSE transport for MCP servers.'
- id: hdmi-analogy
  file: assets/hdmi-analogy.svg
  type: diagram
  title: 'Before and after HDMI'
  alt: 'Diagram: proprietary connectors compared with a single unified standard'
  description: 'A two-column comparison of a proliferation of proprietary connectors against one unified standard.'
- id: mcp-benefits
  file: assets/mcp-benefits.svg
  type: diagram
  title: 'Four things the protocol buys'
  alt: 'Diagram: the four engineering benefits of adopting MCP'
  description: 'A four-stage description of MCP benefits covering integration effort, dynamic discovery, process isolation and standardised approval.'
- id: mcp-security
  file: assets/mcp-security.svg
  type: diagram
  title: 'What a local server can reach'
  alt: 'Diagram: the privileges of a local MCP server and the controls that bound them'
  description: 'A two-column comparison of an unrestricted local MCP server against one with a bounded working directory and sanitised environment.'
- id: mcp-when
  file: assets/mcp-when.svg
  type: diagram
  title: 'When a protocol beats a function'
  alt: 'Diagram: when to expose a capability over MCP'
  description: 'A two-column comparison of situations favouring an MCP server against those where a direct function call is simpler.'
