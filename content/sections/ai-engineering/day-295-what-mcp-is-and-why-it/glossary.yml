terms:
- term: Model Context Protocol (MCP)
  definition: An open universal protocol standardizing how AI applications connect to external tools,
    data resources, and prompts.
- term: JSON-RPC 2.0
  definition: A lightweight remote procedure call specification encoding requests, responses, and notifications
    in JSON format.
- term: MCP Host / Client
  definition: The AI application (such as Claude Desktop, Cursor, or an IDE) that manages connections
    to MCP servers.
- term: MCP Server
  definition: A lightweight program exposing tools, resources, and prompts to MCP clients via standard
    interfaces.
- term: Stdio Transport
  definition: A local communication channel routing JSON-RPC messages across the standard input (stdin)
    and output (stdout) streams of a subprocess.
- term: SSE Transport
  definition: Server-Sent Events over HTTP used for streaming JSON-RPC messages from remote MCP servers.
- term: MCP Tools
  definition: Executable functions exposed by an MCP server that the AI model can invoke with validated
    JSON arguments.
- term: MCP Resources
  definition: URI-addressable data sources (files, database tables, logs) that can be read by clients
    and attached to prompts.
