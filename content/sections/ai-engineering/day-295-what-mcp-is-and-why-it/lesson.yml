learning_promise: Master the architecture, motivation, and JSON-RPC 2.0 protocol mechanics of Anthropic's
  open-standard Model Context Protocol (MCP) connecting AI clients to local and remote tools, resources,
  and prompts.
objectives:
- Deconstruct the N-times-M integration dilemma solved by the Model Context Protocol.
- 'Analyze the JSON-RPC 2.0 transport layers: Standard I/O (stdio) vs Server-Sent Events (SSE).'
- 'Differentiate the three core MCP primitives: Tools, Resources, and Prompts.'
- Implement a standards-compliant JSON-RPC 2.0 MCP protocol parser in pure Python.
- Evaluate security boundaries, privilege isolation, and capability negotiation in MCP sessions.
