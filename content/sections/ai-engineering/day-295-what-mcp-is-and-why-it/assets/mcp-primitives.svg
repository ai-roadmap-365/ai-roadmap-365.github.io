<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Tools, resources, prompts.">
  <title>Three primitives</title>
  <style>
    .mcp-primitives-bg   { fill: #f8fafc; }
    .mcp-primitives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-primitives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-primitives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-primitives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-primitives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-primitives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-primitives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-primitives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-primitives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-primitives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-primitives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-primitives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcp-primitives-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcp-primitives-stage { opacity: 1; }

    .mcp-primitives-s0 { animation-delay: 0.00s; }
    .mcp-primitives-e0 { animation-delay: 0.00s; }
    .mcp-primitives-s1 { animation-delay: 1.50s; }
    .mcp-primitives-e1 { animation-delay: 1.50s; }
    .mcp-primitives-s2 { animation-delay: 3.00s; }
    .mcp-primitives-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcp-primitives-conn  { animation: mcp-primitives-trace 6s ease-in-out infinite; }
      .mcp-primitives-stage { animation: mcp-primitives-arrive 6s ease-in-out infinite; }
    }
    @keyframes mcp-primitives-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcp-primitives-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcp-primitives-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcp-primitives-stage { animation: mcp-primitives-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcp-primitives-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcp-primitives-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcp-primitives-bg" width="980" height="322"/>
  <text class="mcp-primitives-h1"  x="30" y="40">Three primitives</text>
  <text class="mcp-primitives-sub" x="30" y="64">Tools, resources, prompts.</text>
  <g class="mcp-primitives-stage mcp-primitives-s0">
    <rect class="mcp-primitives-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-primitives-step" x="44" y="142">01</text>
    <text class="mcp-primitives-name" x="70" y="142">Tools</text>
    <text class="mcp-primitives-desc" x="44" y="166">Executable actions with schemas. What the</text>
    <text class="mcp-primitives-desc" x="44" y="182">model calls.</text>
    <text class="mcp-primitives-edge" x="44" y="242">actions</text>
  </g>
  <line class="mcp-primitives-line mcp-primitives-conn mcp-primitives-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#mcp-primitives-tip)"/>
  <g class="mcp-primitives-stage mcp-primitives-s1">
    <rect class="mcp-primitives-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-primitives-step" x="359" y="142">02</text>
    <text class="mcp-primitives-name" x="385" y="142">Resources</text>
    <text class="mcp-primitives-desc" x="359" y="166">Data and files the client can read and</text>
    <text class="mcp-primitives-desc" x="359" y="182">subscribe to changes on.</text>
    <text class="mcp-primitives-edge" x="359" y="242">data</text>
  </g>
  <line class="mcp-primitives-line mcp-primitives-conn mcp-primitives-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#mcp-primitives-tip)"/>
  <g class="mcp-primitives-stage mcp-primitives-s2">
    <rect class="mcp-primitives-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="mcp-primitives-step" x="674" y="142">03</text>
    <text class="mcp-primitives-name" x="700" y="142">Prompts</text>
    <text class="mcp-primitives-desc" x="674" y="166">Templates the host surfaces as slash</text>
    <text class="mcp-primitives-desc" x="674" y="182">commands.</text>
    <text class="mcp-primitives-edge" x="674" y="242">templates</text>
  </g>
  <text class="mcp-primitives-sub" x="30" y="304">Separating resources from tools is the design choice that makes clients able to do sensible things: a file is something to read and offer to the user, and a tool is something to ask permission before running.</text>
</svg>
