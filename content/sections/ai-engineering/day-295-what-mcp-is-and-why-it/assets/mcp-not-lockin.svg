<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them is a common suspicion.">
  <title>Three things MCP is not</title>
  <style>
    .mcp-not-lockin-bg   { fill: #f8fafc; }
    .mcp-not-lockin-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-lockin-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-lockin-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-lockin-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-lockin-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-not-lockin-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-not-lockin-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-not-lockin-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-not-lockin-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-not-lockin-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-not-lockin-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-not-lockin-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-not-lockin-row { opacity: 1; }
    .mcp-not-lockin-r0 { animation-delay: 0.00s; }
    .mcp-not-lockin-r1 { animation-delay: 0.45s; }
    .mcp-not-lockin-r2 { animation-delay: 0.90s; }
    .mcp-not-lockin-r3 { animation-delay: 1.35s; }
    .mcp-not-lockin-r4 { animation-delay: 1.80s; }
    .mcp-not-lockin-row { animation: mcp-not-lockin-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-not-lockin-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-not-lockin-bg" width="980" height="390"/>
  <text class="mcp-not-lockin-h1"  x="30" y="40">Three things MCP is not</text>
  <text class="mcp-not-lockin-sub" x="30" y="64">One of them is a common suspicion.</text>
  <rect class="mcp-not-lockin-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-not-lockin-name" x="46" y="122">What it is</text>
  <text class="mcp-not-lockin-desc" x="46" y="142">A wire protocol.</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r0" x="46" y="182">JSON-RPC 2.0 over stdio or SSE</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r1" x="46" y="216">Client and server cleanly separated</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r2" x="46" y="250">Three primitives, one abstraction</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r3" x="46" y="284">Model-agnostic by construction</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r4" x="46" y="318">Open source, MIT licensed</text>
  <rect class="mcp-not-lockin-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-not-lockin-name" x="526" y="122">Three misconceptions</text>
  <text class="mcp-not-lockin-desc" x="526" y="142">All easy to hold.</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r0" x="526" y="182">"Anthropic lock-in" — it works with any model</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r1" x="526" y="216">"A framework" — frameworks consume MCP servers</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r2" x="526" y="250">"A REST replacement" — it wraps APIs with discovery metadata</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r3" x="526" y="284">The protocol does not run models</text>
  <text class="mcp-not-lockin-desc mcp-not-lockin-row mcp-not-lockin-r4" x="526" y="318">And it does not orchestrate them</text>
  <text class="mcp-not-lockin-sub" x="30" y="372">The third row is the useful clarification for architects: MCP adds an agent-discoverable description layer on top of whatever API already exists, rather than replacing the API.</text>
</svg>
