<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="MCP JSONRPC Handshake and Lifecycle">
  <title>MCP JSONRPC Handshake and Lifecycle</title>
  <defs>
    <style>
      .d295f-bg { fill: #f8fafc; }
      .d295f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
      .d295f-client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d295f-server { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d295f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d295f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d295f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d295f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d295f-msg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1e293b; }
      .d295f-flow { stroke: #3b82f6; stroke-width: 2px; fill: none; marker-end: url(#d295f-arr); }
      .d295f-resp { stroke: #22c55e; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d295f-bg" />
  
  <text x="40" y="40" class="d295f-title">MCP JSON-RPC 2.0 Protocol Lifecycle</text>
  <text x="40" y="65" class="d295f-subtitle">MCP JSONRPC Handshake and Lifecycle sequence diagram showing Initialize, Initialized Notification, Tools List, and Tools Call request flows</text>
  
  <!-- Client Column -->
  <rect x="80" y="100" width="160" height="50" class="d295f-client" />
  <text x="110" y="130" class="d295f-header" fill="#1d4ed8">MCP Client</text>
  
  <!-- Server Column -->
  <rect x="660" y="100" width="160" height="50" class="d295f-server" />
  <text x="690" y="130" class="d295f-header" fill="#15803d">MCP Server</text>
  
  <!-- Lifelines -->
  <line x1="160" y1="150" x2="160" y2="400" stroke="#cbd5e1" stroke-width="2" />
  <line x1="740" y1="150" x2="740" y2="400" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Handshake Step 1: Initialize -->
  <line x1="160" y1="180" x2="740" y2="180" class="d295f-flow" />
  <text x="280" y="175" class="d295f-msg">1. request: {"method": "initialize", "params": {...}}</text>
  
  <line x1="740" y1="215" x2="160" y2="215" class="d295f-resp" />
  <text x="280" y="210" class="d295f-msg">2. response: {"result": {"capabilities": {"tools": {...}}}}</text>
  
  <!-- Handshake Step 2: Initialized Notification -->
  <line x1="160" y1="250" x2="740" y2="250" class="d295f-flow" />
  <text x="280" y="245" class="d295f-msg">3. notify: {"method": "notifications/initialized"}</text>
  
  <!-- Discovery: tools/list -->
  <line x1="160" y1="290" x2="740" y2="290" class="d295f-flow" />
  <text x="280" y="285" class="d295f-msg">4. request: {"method": "tools/list"}</text>
  
  <line x1="740" y1="325" x2="160" y2="325" class="d295f-resp" />
  <text x="280" y="320" class="d295f-msg">5. response: {"result": {"tools": [{"name": "read_file", ...}]}}</text>
  
  <!-- Execution: tools/call -->
  <line x1="160" y1="365" x2="740" y2="365" class="d295f-flow" />
  <text x="280" y="360" class="d295f-msg">6. request: {"method": "tools/call", "params": {"name": "read_file"}}</text>
  
  <line x1="740" y1="395" x2="160" y2="395" class="d295f-resp" />
  <text x="280" y="390" class="d295f-msg">7. response: {"result": {"content": [{"type": "text", "text": "..."}]}}</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 160 180 L 740 180" stroke="#3b82f6" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 160 250 L 740 250" stroke="#3b82f6" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 160 290 L 740 290" stroke="#3b82f6" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 160 365 L 740 365" stroke="#3b82f6" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>