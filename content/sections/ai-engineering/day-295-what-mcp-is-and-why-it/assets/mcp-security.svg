<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what that obliges.">
  <title>What a local server can reach</title>
  <style>
    .mcp-security-bg   { fill: #f8fafc; }
    .mcp-security-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-security-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-security-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-security-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-security-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-security-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-security-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-security-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-security-row { opacity: 1; }
    .mcp-security-r0 { animation-delay: 0.00s; }
    .mcp-security-r1 { animation-delay: 0.45s; }
    .mcp-security-r2 { animation-delay: 0.90s; }
    .mcp-security-r3 { animation-delay: 1.35s; }
    .mcp-security-r4 { animation-delay: 1.80s; }
    .mcp-security-row { animation: mcp-security-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-security-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-security-bg" width="980" height="390"/>
  <text class="mcp-security-h1"  x="30" y="40">What a local server can reach</text>
  <text class="mcp-security-sub" x="30" y="64">And what that obliges.</text>
  <rect class="mcp-security-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-security-name" x="46" y="122">Unrestricted</text>
  <text class="mcp-security-desc" x="46" y="142">Your shell privileges.</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r0" x="46" y="182">Reads any file you can read</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r1" x="46" y="216">SSH keys and credential files included</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r2" x="46" y="250">Full environment, including tokens</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r3" x="46" y="284">Arbitrary network egress</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r4" x="46" y="318">A malicious package is a full compromise</text>
  <rect class="mcp-security-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-security-name" x="526" y="122">Bounded</text>
  <text class="mcp-security-desc" x="526" y="142">Least privilege, locally.</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r0" x="526" y="182">A restricted working directory</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r1" x="526" y="216">A sanitised environment, only what it needs</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r2" x="526" y="250">Explicit egress policy</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r3" x="526" y="284">Installed from a source you trust</text>
  <text class="mcp-security-desc mcp-security-row mcp-security-r4" x="526" y="318">Reviewed like any dependency</text>
  <text class="mcp-security-sub" x="30" y="372">The overhead argument favours doing this: JSON-RPC over a pipe costs roughly 0.2 ms per call against 500-3000 ms of generation, so nothing about the security posture is a performance trade.</text>
</svg>
