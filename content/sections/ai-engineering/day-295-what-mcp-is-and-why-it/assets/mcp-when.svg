<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Client count is the deciding factor.">
  <title>When a protocol beats a function</title>
  <style>
    .mcp-when-bg   { fill: #f8fafc; }
    .mcp-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcp-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcp-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcp-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcp-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcp-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcp-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcp-when-row { opacity: 1; }
    .mcp-when-r0 { animation-delay: 0.00s; }
    .mcp-when-r1 { animation-delay: 0.45s; }
    .mcp-when-r2 { animation-delay: 0.90s; }
    .mcp-when-r3 { animation-delay: 1.35s; }
    .mcp-when-r4 { animation-delay: 1.80s; }
    .mcp-when-row { animation: mcp-when-reveal 7.3s ease-in-out infinite; }
    @keyframes mcp-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mcp-when-bg" width="980" height="390"/>
  <text class="mcp-when-h1"  x="30" y="40">When a protocol beats a function</text>
  <text class="mcp-when-sub" x="30" y="64">Client count is the deciding factor.</text>
  <rect class="mcp-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-when-name" x="46" y="122">Use MCP</text>
  <text class="mcp-when-desc" x="46" y="142">More than one consumer.</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r0" x="46" y="182">Tools usable across several AI clients</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r1" x="46" y="216">Enterprise platforms with modular integrations</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r2" x="46" y="250">Where lock-in is a real concern</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r3" x="46" y="284">Where a tool outlives the app that used it first</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r4" x="46" y="318">Community distribution</text>
  <rect class="mcp-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mcp-when-name" x="526" y="122">Use a function</text>
  <text class="mcp-when-desc" x="526" y="142">One application.</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r0" x="526" y="182">A single monolithic web application</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r1" x="526" y="216">No external integration requirement</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r2" x="526" y="250">An embedded Python call is simpler</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r3" x="526" y="284">No daemon to run or supervise</text>
  <text class="mcp-when-desc mcp-when-row mcp-when-r4" x="526" y="318">And nothing to discover</text>
  <text class="mcp-when-sub" x="30" y="372">The question worth asking is how many things will consume this capability over its life, because the protocol's cost is paid once and its benefit scales with consumers.</text>
</svg>
