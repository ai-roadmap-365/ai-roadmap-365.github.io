terms:
- term: AI Guardrails
  definition: A programmatic and model-based defensive boundary inspecting inputs and outputs of AI systems.
- term: PII (Personally Identifiable Information)
  definition: Sensitive data (SSNs, credit cards, phone numbers, emails) that can identify an individual.
- term: Prompt Injection
  definition: An adversarial attack designed to override system instructions and hijack model execution.
- term: Indirect Prompt Injection
  definition: Malicious instructions embedded in external retrieved context (webpages, PDFs, emails).
- term: Topical Guardrail
  definition: A filter ensuring an assistant remains focused within its authorized business domain.
- term: Llama Guard
  definition: An open-weight instruction-tuned safety classifier model designed for content moderation.
- term: NeMo Guardrails
  definition: An open-source toolkit from NVIDIA for defining conversational flows and safety rails.
- term: Fallback Response
  definition: A pre-written, safe deterministic response returned when an input or output violates guardrails.
