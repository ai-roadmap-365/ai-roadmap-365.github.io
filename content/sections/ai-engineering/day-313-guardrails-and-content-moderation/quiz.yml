questions:
- question: What is the primary difference between 'Input Guardrails' and 'Output Guardrails' in an AI
    architecture?
  options:
  - Input guardrails run in Python, output guardrails run in C++
  - Input guardrails screen incoming user queries before sending them to the LLM (blocking prompt injections,
    PII, and off-topic queries), while Output guardrails inspect the generated model response before returning
    it to the user (blocking hallucinations, toxic output, and leaked secrets)
  - Input guardrails only work on mobile devices
  - Output guardrails control monitor brightness
  answer_index: 1
  explanation: Input rails prevent malicious or dangerous payloads from entering the model; output rails
    verify safety and compliance before reaching the user.
- question: How does 'PII Masking' protect customer privacy and data compliance (e.g. GDPR, HIPAA)?
  options:
  - By deleting the customer's account
  - By intercepting user text and replacing sensitive entities (such as Social Security Numbers, credit
    cards, and emails) with generic synthetic placeholders (e.g. `[REDACTED_SSN]`) before logging or sending
    data to third-party LLM APIs
  - By encrypting the user's monitor screen
  - By compressing text into ZIP archives
  answer_index: 1
  explanation: PII redaction ensures sensitive customer identifiers are never transmitted to external
    APIs or stored in plaintext logs.
- question: What is an 'Indirect Prompt Injection' attack?
  options:
  - When a developer writes a typo in their system prompt
  - When an attacker places malicious instructions inside external data (such as a webpage, email, or
    PDF document) that an AI agent retrieves and executes while performing a legitimate user task
  - When an internet router drops connection packets
  - When a database query runs out of memory
  answer_index: 1
  explanation: Indirect injection occurs via untrusted third-party data ingested by RAG systems or agentic
    tools.
- question: Why is relying solely on system prompt instructions (e.g. 'Never talk about politics') insufficient
    for enterprise guardrails?
  options:
  - Because system prompts are limited to 10 words
  - Because LLMs are probabilistic sequence predictors that can be bypassed using semantic obfuscation,
    roleplaying jailbreaks, multi-language translation, or delimiter injection; programmatic outer guardrails
    provide deterministic enforcement
  - Because system prompts make models run slower
  - Because system prompts only work on OpenAI
  answer_index: 1
  explanation: System prompts can be bypassed; hard programmatic guardrails provide deterministic outer
    boundary enforcement.
- question: What is 'Topical Guardrailing' in enterprise customer assistants?
  options:
  - Enforcing that an assistant only answers questions within its defined business domain (e.g. banking
    transactions) and gracefully declines off-topic queries (e.g. writing creative poetry or discussing
    political debates)
  - Sorting database rows by topic name
  - Limiting model context window size
  - Translating text to Latin
  answer_index: 0
  explanation: Topical rails keep specialized agents focused on their designated domain and prevent brand
    reputation risks.
