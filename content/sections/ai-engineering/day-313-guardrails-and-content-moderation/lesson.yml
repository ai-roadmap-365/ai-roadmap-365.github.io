learning_promise: 'Master defensive engineering for production AI: build multi-layer guardrails combining
  regex filters, PII redactors, semantic moderation models (Llama Guard), topical rails (NeMo Guardrails),
  and prompt injection defenses.'
objectives:
- 'Architect multi-layer input and output guardrail pipelines: pre-execution input screening, execution
  boundary enforcement, and post-execution output sanitization.'
- Implement PII redaction and token masking for sensitive data (SSNs, credit cards, API keys, emails)
  using deterministic regex and named-entity recognition.
- Detect and neutralize Direct and Indirect Prompt Injections (jailbreaks, delimiter escapes, system prompt
  extraction).
- Implement a production Guardrail Defense Engine in Python supporting PII masking, topical domain bounding,
  toxicity filtering, and safe fallback responses.
- Benchmark guardrail latency overhead and false positive rejection rates.
