<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A request in the prompt is not a control.">
  <title>A rail is code</title>
  <style>
    .rail-or-prompt-bg   { fill: #f8fafc; }
    .rail-or-prompt-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-or-prompt-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-or-prompt-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-or-prompt-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-or-prompt-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-or-prompt-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rail-or-prompt-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rail-or-prompt-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rail-or-prompt-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rail-or-prompt-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rail-or-prompt-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rail-or-prompt-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rail-or-prompt-row { opacity: 1; }
    .rail-or-prompt-r0 { animation-delay: 0.00s; }
    .rail-or-prompt-r1 { animation-delay: 0.45s; }
    .rail-or-prompt-r2 { animation-delay: 0.90s; }
    .rail-or-prompt-r3 { animation-delay: 1.35s; }
    .rail-or-prompt-r4 { animation-delay: 1.80s; }
    .rail-or-prompt-row { animation: rail-or-prompt-reveal 7.3s ease-in-out infinite; }
    @keyframes rail-or-prompt-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rail-or-prompt-bg" width="980" height="390"/>
  <text class="rail-or-prompt-h1"  x="30" y="40">A rail is code</text>
  <text class="rail-or-prompt-sub" x="30" y="64">A request in the prompt is not a control.</text>
  <rect class="rail-or-prompt-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rail-or-prompt-name" x="46" y="122">Programmatic rails</text>
  <text class="rail-or-prompt-desc" x="46" y="142">Middleware, deterministic.</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r0" x="46" y="182">Executed before and after the model</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r1" x="46" y="216">Regex maskers and classifier heads</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r2" x="46" y="250">Deterministic safe fallbacks</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r3" x="46" y="284">Testable, and auditable</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r4" x="46" y="318">Cannot be argued with</text>
  <rect class="rail-or-prompt-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rail-or-prompt-name" x="526" y="122">Not rails</text>
  <text class="rail-or-prompt-desc" x="526" y="142">Two things they are not.</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r0" x="526" y="182">"Please do not be harmful" in the prompt</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r1" x="526" y="216">Inside the channel being attacked</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r2" x="526" y="250">Nor a replacement for database RBAC</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r3" x="526" y="284">Rails bound the model, not the database</text>
  <text class="rail-or-prompt-desc rail-or-prompt-row rail-or-prompt-r4" x="526" y="318">Both layers are required</text>
  <text class="rail-or-prompt-sub" x="30" y="372">The RBAC point is worth stating explicitly: a guardrail that stops the model asking for data it should not have is useful, and a database that would have answered is still the vulnerability.</text>
</svg>
