<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the defence for each.">
  <title>Two evolved attacks</title>
  <style>
    .advanced-jailbreaks-bg   { fill: #f8fafc; }
    .advanced-jailbreaks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-jailbreaks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-jailbreaks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-jailbreaks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-jailbreaks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .advanced-jailbreaks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .advanced-jailbreaks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .advanced-jailbreaks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .advanced-jailbreaks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .advanced-jailbreaks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .advanced-jailbreaks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .advanced-jailbreaks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .advanced-jailbreaks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .advanced-jailbreaks-stage { opacity: 1; }

    .advanced-jailbreaks-s0 { animation-delay: 0.00s; }
    .advanced-jailbreaks-e0 { animation-delay: 0.00s; }
    .advanced-jailbreaks-s1 { animation-delay: 1.28s; }
    .advanced-jailbreaks-e1 { animation-delay: 1.28s; }
    .advanced-jailbreaks-s2 { animation-delay: 2.56s; }
    .advanced-jailbreaks-e2 { animation-delay: 2.56s; }
    .advanced-jailbreaks-s3 { animation-delay: 3.84s; }
    .advanced-jailbreaks-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .advanced-jailbreaks-conn  { animation: advanced-jailbreaks-trace 6.4s ease-in-out infinite; }
      .advanced-jailbreaks-stage { animation: advanced-jailbreaks-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes advanced-jailbreaks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes advanced-jailbreaks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .advanced-jailbreaks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .advanced-jailbreaks-stage { animation: advanced-jailbreaks-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes advanced-jailbreaks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="advanced-jailbreaks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="advanced-jailbreaks-bg" width="980" height="322"/>
  <text class="advanced-jailbreaks-h1"  x="30" y="40">Two evolved attacks</text>
  <text class="advanced-jailbreaks-sub" x="30" y="64">And the defence for each.</text>
  <g class="advanced-jailbreaks-stage advanced-jailbreaks-s0">
    <rect class="advanced-jailbreaks-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-jailbreaks-step" x="44" y="142">01</text>
    <text class="advanced-jailbreaks-name" x="70" y="142">Delimiter injection</text>
    <text class="advanced-jailbreaks-desc" x="44" y="166">A closing tag in user text ends</text>
    <text class="advanced-jailbreaks-desc" x="44" y="182">your system context early.</text>
  </g>
  <line class="advanced-jailbreaks-line advanced-jailbreaks-conn advanced-jailbreaks-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#advanced-jailbreaks-tip)"/>
  <g class="advanced-jailbreaks-stage advanced-jailbreaks-s1">
    <rect class="advanced-jailbreaks-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-jailbreaks-step" x="280" y="142">02</text>
    <text class="advanced-jailbreaks-name" x="306" y="142">Defence: randomised boundaries</text>
    <text class="advanced-jailbreaks-desc" x="280" y="166">Escape user delimiters and wrap</text>
    <text class="advanced-jailbreaks-desc" x="280" y="182">in a nonce-tagged boundary.</text>
    <text class="advanced-jailbreaks-edge" x="280" y="242">nonce</text>
  </g>
  <line class="advanced-jailbreaks-line advanced-jailbreaks-conn advanced-jailbreaks-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#advanced-jailbreaks-tip)"/>
  <g class="advanced-jailbreaks-stage advanced-jailbreaks-s2">
    <rect class="advanced-jailbreaks-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-jailbreaks-step" x="516" y="142">03</text>
    <text class="advanced-jailbreaks-name" x="542" y="142">Language and cipher obfuscation</text>
    <text class="advanced-jailbreaks-desc" x="516" y="166">Low-resource languages, Base64,</text>
    <text class="advanced-jailbreaks-desc" x="516" y="182">simple ciphers past English</text>
    <text class="advanced-jailbreaks-desc" x="516" y="198">filters.</text>
  </g>
  <line class="advanced-jailbreaks-line advanced-jailbreaks-conn advanced-jailbreaks-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#advanced-jailbreaks-tip)"/>
  <g class="advanced-jailbreaks-stage advanced-jailbreaks-s3">
    <rect class="advanced-jailbreaks-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="advanced-jailbreaks-step" x="752" y="142">04</text>
    <text class="advanced-jailbreaks-name" x="778" y="142">Defence: multilingual classifiers</text>
    <text class="advanced-jailbreaks-desc" x="752" y="166">And decode encodings before</text>
    <text class="advanced-jailbreaks-desc" x="752" y="182">inspecting.</text>
  </g>
  <text class="advanced-jailbreaks-sub" x="30" y="304">The randomised boundary token is the elegant part: an attacker cannot close a delimiter whose name they cannot predict, which turns a parsing problem into a guessing one.</text>
</svg>
