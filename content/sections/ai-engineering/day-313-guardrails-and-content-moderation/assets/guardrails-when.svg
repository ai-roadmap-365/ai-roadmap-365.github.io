<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where they are overhead.">
  <title>Where rails are required</title>
  <style>
    .guardrails-when-bg   { fill: #f8fafc; }
    .guardrails-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrails-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrails-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrails-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrails-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrails-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .guardrails-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .guardrails-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .guardrails-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .guardrails-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .guardrails-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .guardrails-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .guardrails-when-row { opacity: 1; }
    .guardrails-when-r0 { animation-delay: 0.00s; }
    .guardrails-when-r1 { animation-delay: 0.45s; }
    .guardrails-when-r2 { animation-delay: 0.90s; }
    .guardrails-when-r3 { animation-delay: 1.35s; }
    .guardrails-when-r4 { animation-delay: 1.80s; }
    .guardrails-when-row { animation: guardrails-when-reveal 7.3s ease-in-out infinite; }
    @keyframes guardrails-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="guardrails-when-bg" width="980" height="390"/>
  <text class="guardrails-when-h1"  x="30" y="40">Where rails are required</text>
  <text class="guardrails-when-sub" x="30" y="64">And where they are overhead.</text>
  <rect class="guardrails-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="guardrails-when-name" x="46" y="122">Deploy the rails</text>
  <text class="guardrails-when-desc" x="46" y="142">User input, real data, real tools.</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r0" x="46" y="182">Any user-generated input</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r1" x="46" y="216">Customer PII in the path</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r2" x="46" y="250">Enterprise database access</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r3" x="46" y="284">Agents with external tools</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r4" x="46" y="318">Anything publicly reachable</text>
  <rect class="guardrails-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="guardrails-when-name" x="526" y="122">Lighter</text>
  <text class="guardrails-when-desc" x="526" y="142">Pre-sanitised and internal.</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r0" x="526" y="182">Offline batch analytics</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r1" x="526" y="216">Inputs already sanitised upstream</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r2" x="526" y="250">No external tools</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r3" x="526" y="284">But keep the output secret scan</text>
  <text class="guardrails-when-desc guardrails-when-row guardrails-when-r4" x="526" y="318">A leaked key is a leaked key</text>
  <text class="guardrails-when-sub" x="30" y="372">Audit logging belongs on both sides: every blocked request is security telemetry, and a rail that refuses silently gives you no way to tell an attack from a false positive.</text>
</svg>
