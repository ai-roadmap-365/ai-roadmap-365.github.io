<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two before the model, two after.">
  <title>Four rails, in order</title>
  <style>
    .rail-layers-bg   { fill: #f8fafc; }
    .rail-layers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-layers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-layers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-layers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-layers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rail-layers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rail-layers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rail-layers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rail-layers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rail-layers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rail-layers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rail-layers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rail-layers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rail-layers-stage { opacity: 1; }

    .rail-layers-s0 { animation-delay: 0.00s; }
    .rail-layers-e0 { animation-delay: 0.00s; }
    .rail-layers-s1 { animation-delay: 1.28s; }
    .rail-layers-e1 { animation-delay: 1.28s; }
    .rail-layers-s2 { animation-delay: 2.56s; }
    .rail-layers-e2 { animation-delay: 2.56s; }
    .rail-layers-s3 { animation-delay: 3.84s; }
    .rail-layers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rail-layers-conn  { animation: rail-layers-trace 6.4s ease-in-out infinite; }
      .rail-layers-stage { animation: rail-layers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rail-layers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rail-layers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rail-layers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rail-layers-stage { animation: rail-layers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rail-layers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rail-layers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rail-layers-bg" width="980" height="322"/>
  <text class="rail-layers-h1"  x="30" y="40">Four rails, in order</text>
  <text class="rail-layers-sub" x="30" y="64">Two before the model, two after.</text>
  <g class="rail-layers-stage rail-layers-s0">
    <rect class="rail-layers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rail-layers-step" x="44" y="142">01</text>
    <text class="rail-layers-name" x="70" y="142">PII redaction</text>
    <text class="rail-layers-desc" x="44" y="166">Before anything leaves your</text>
    <text class="rail-layers-desc" x="44" y="182">infrastructure. Regex and NER.</text>
    <text class="rail-layers-edge" x="44" y="242">input</text>
  </g>
  <line class="rail-layers-line rail-layers-conn rail-layers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rail-layers-tip)"/>
  <g class="rail-layers-stage rail-layers-s1">
    <rect class="rail-layers-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rail-layers-step" x="280" y="142">02</text>
    <text class="rail-layers-name" x="306" y="142">Injection screening</text>
    <text class="rail-layers-desc" x="280" y="166">Known jailbreak patterns</text>
    <text class="rail-layers-desc" x="280" y="182">intercepted before inference.</text>
    <text class="rail-layers-edge" x="280" y="242">input</text>
  </g>
  <line class="rail-layers-line rail-layers-conn rail-layers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rail-layers-tip)"/>
  <g class="rail-layers-stage rail-layers-s2">
    <rect class="rail-layers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rail-layers-step" x="516" y="142">03</text>
    <text class="rail-layers-name" x="542" y="142">Topical policy</text>
    <text class="rail-layers-desc" x="516" y="166">Is this question inside the</text>
    <text class="rail-layers-desc" x="516" y="182">assistant's scope at all?</text>
    <text class="rail-layers-edge" x="516" y="242">input</text>
  </g>
  <line class="rail-layers-line rail-layers-conn rail-layers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rail-layers-tip)"/>
  <g class="rail-layers-stage rail-layers-s3">
    <rect class="rail-layers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rail-layers-step" x="752" y="142">04</text>
    <text class="rail-layers-name" x="778" y="142">Output filtering</text>
    <text class="rail-layers-desc" x="752" y="166">Secret leaks and unsupported</text>
    <text class="rail-layers-desc" x="752" y="182">claims, before the user sees</text>
    <text class="rail-layers-desc" x="752" y="198">them.</text>
    <text class="rail-layers-edge" x="752" y="242">output</text>
  </g>
  <text class="rail-layers-sub" x="30" y="304">The fourth is the one teams add last and need most: the input rails cannot see what the model will say, and a leaked key or an invented policy reaches the user through the response.</text>
</svg>
