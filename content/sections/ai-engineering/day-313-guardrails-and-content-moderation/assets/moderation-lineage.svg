<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Blocklists, classifiers, then programmable rails.">
  <title>Three stages of moderation</title>
  <style>
    .moderation-lineage-bg   { fill: #f8fafc; }
    .moderation-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moderation-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moderation-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moderation-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moderation-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .moderation-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .moderation-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .moderation-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .moderation-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .moderation-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .moderation-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .moderation-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .moderation-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .moderation-lineage-stage { opacity: 1; }

    .moderation-lineage-s0 { animation-delay: 0.00s; }
    .moderation-lineage-e0 { animation-delay: 0.00s; }
    .moderation-lineage-s1 { animation-delay: 1.50s; }
    .moderation-lineage-e1 { animation-delay: 1.50s; }
    .moderation-lineage-s2 { animation-delay: 3.00s; }
    .moderation-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .moderation-lineage-conn  { animation: moderation-lineage-trace 6s ease-in-out infinite; }
      .moderation-lineage-stage { animation: moderation-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes moderation-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes moderation-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .moderation-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .moderation-lineage-stage { animation: moderation-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes moderation-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="moderation-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="moderation-lineage-bg" width="980" height="322"/>
  <text class="moderation-lineage-h1"  x="30" y="40">Three stages of moderation</text>
  <text class="moderation-lineage-sub" x="30" y="64">Blocklists, classifiers, then programmable rails.</text>
  <g class="moderation-lineage-stage moderation-lineage-s0">
    <rect class="moderation-lineage-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="moderation-lineage-step" x="44" y="142">01</text>
    <text class="moderation-lineage-name" x="70" y="142">Keyword blocklists, 2000s-2020</text>
    <text class="moderation-lineage-desc" x="44" y="166">Bypassed by leetspeak, typos and translation.</text>
  </g>
  <line class="moderation-lineage-line moderation-lineage-conn moderation-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#moderation-lineage-tip)"/>
  <g class="moderation-lineage-stage moderation-lineage-s1">
    <rect class="moderation-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="moderation-lineage-step" x="359" y="142">02</text>
    <text class="moderation-lineage-name" x="385" y="142">Moderation classifiers, 2021-2023</text>
    <text class="moderation-lineage-desc" x="359" y="166">Multi-label probability scores across harm</text>
    <text class="moderation-lineage-desc" x="359" y="182">categories.</text>
  </g>
  <line class="moderation-lineage-line moderation-lineage-conn moderation-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#moderation-lineage-tip)"/>
  <g class="moderation-lineage-stage moderation-lineage-s2">
    <rect class="moderation-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="moderation-lineage-step" x="674" y="142">03</text>
    <text class="moderation-lineage-name" x="700" y="142">Programmable rails, 2023</text>
    <text class="moderation-lineage-desc" x="674" y="166">Policy languages, structured validation,</text>
    <text class="moderation-lineage-desc" x="674" y="182">dialogue flow control.</text>
  </g>
  <text class="moderation-lineage-sub" x="30" y="304">Each stage still has a place in the tiered waterfall: the blocklist is the 0.2 ms tier that catches the unsophisticated attempt, and the classifier is what catches the one that got past it.</text>
</svg>
