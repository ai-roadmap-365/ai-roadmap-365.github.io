<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All testable.">
  <title>Five checks before going public</title>
  <style>
    .guardrail-checklist-bg   { fill: #f8fafc; }
    .guardrail-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrail-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrail-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrail-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrail-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guardrail-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .guardrail-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .guardrail-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .guardrail-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .guardrail-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .guardrail-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .guardrail-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .guardrail-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .guardrail-checklist-stage { opacity: 1; }

    .guardrail-checklist-s0 { animation-delay: 0.00s; }
    .guardrail-checklist-e0 { animation-delay: 0.00s; }
    .guardrail-checklist-s1 { animation-delay: 1.33s; }
    .guardrail-checklist-e1 { animation-delay: 1.33s; }
    .guardrail-checklist-s2 { animation-delay: 2.67s; }
    .guardrail-checklist-e2 { animation-delay: 2.67s; }
    .guardrail-checklist-s3 { animation-delay: 4.00s; }
    .guardrail-checklist-e3 { animation-delay: 4.00s; }
    .guardrail-checklist-s4 { animation-delay: 5.33s; }
    .guardrail-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .guardrail-checklist-conn  { animation: guardrail-checklist-trace 8s ease-in-out infinite; }
      .guardrail-checklist-stage { animation: guardrail-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes guardrail-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes guardrail-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .guardrail-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .guardrail-checklist-stage { animation: guardrail-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes guardrail-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="guardrail-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="guardrail-checklist-bg" width="980" height="322"/>
  <text class="guardrail-checklist-h1"  x="30" y="40">Five checks before going public</text>
  <text class="guardrail-checklist-sub" x="30" y="64">All testable.</text>
  <g class="guardrail-checklist-stage guardrail-checklist-s0">
    <rect class="guardrail-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="guardrail-checklist-step" x="44" y="142">01</text>
    <text class="guardrail-checklist-name" x="70" y="142">PII masked before egress</text>
    <text class="guardrail-checklist-desc" x="44" y="166">Identifiers redacted</text>
    <text class="guardrail-checklist-desc" x="44" y="182">before data leaves your</text>
    <text class="guardrail-checklist-desc" x="44" y="198">infrastructure.</text>
  </g>
  <line class="guardrail-checklist-line guardrail-checklist-conn guardrail-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#guardrail-checklist-tip)"/>
  <g class="guardrail-checklist-stage guardrail-checklist-s1">
    <rect class="guardrail-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="guardrail-checklist-step" x="233" y="142">02</text>
    <text class="guardrail-checklist-name" x="259" y="142">Injection intercepted pre-inference</text>
    <text class="guardrail-checklist-desc" x="233" y="166">Known signatures blocked</text>
    <text class="guardrail-checklist-desc" x="233" y="182">without spending a</text>
    <text class="guardrail-checklist-desc" x="233" y="198">generation.</text>
  </g>
  <line class="guardrail-checklist-line guardrail-checklist-conn guardrail-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#guardrail-checklist-tip)"/>
  <g class="guardrail-checklist-stage guardrail-checklist-s2">
    <rect class="guardrail-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="guardrail-checklist-step" x="422" y="142">03</text>
    <text class="guardrail-checklist-name" x="448" y="142">Topical constraints enforced</text>
    <text class="guardrail-checklist-desc" x="422" y="166">Out-of-scope queries</text>
    <text class="guardrail-checklist-desc" x="422" y="182">declined gracefully.</text>
  </g>
  <line class="guardrail-checklist-line guardrail-checklist-conn guardrail-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#guardrail-checklist-tip)"/>
  <g class="guardrail-checklist-stage guardrail-checklist-s3">
    <rect class="guardrail-checklist-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="guardrail-checklist-step" x="611" y="142">04</text>
    <text class="guardrail-checklist-name" x="637" y="142">Output scanned for secrets</text>
    <text class="guardrail-checklist-desc" x="611" y="166">Tokens, keys and</text>
    <text class="guardrail-checklist-desc" x="611" y="182">passwords, before the</text>
    <text class="guardrail-checklist-desc" x="611" y="198">response is returned.</text>
  </g>
  <line class="guardrail-checklist-line guardrail-checklist-conn guardrail-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#guardrail-checklist-tip)"/>
  <g class="guardrail-checklist-stage guardrail-checklist-s4">
    <rect class="guardrail-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="guardrail-checklist-step" x="800" y="142">05</text>
    <text class="guardrail-checklist-name" x="826" y="142">Fallbacks tested</text>
    <text class="guardrail-checklist-desc" x="800" y="166">Pre-scripted refusals</text>
    <text class="guardrail-checklist-desc" x="800" y="182">that read as helpful</text>
    <text class="guardrail-checklist-desc" x="800" y="198">rather than broken.</text>
  </g>
  <text class="guardrail-checklist-sub" x="30" y="304">The last item is the one that determines whether users tolerate the rails: a refusal that explains what the assistant can do instead is a boundary, and a bare rejection is a bug report.</text>
</svg>
