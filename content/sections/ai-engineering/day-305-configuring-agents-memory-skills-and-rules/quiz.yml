questions:
- question: What is the primary function of an `AGENTS.md` (or `.cursorrules`, `CLAUDE.md`) file placed
    in a repository root?
  options:
  - To store binary database backups
  - To encrypt git commits
  - 'To give every agent the project''s standing instructions'
  - To run a local web server
  answer_index: 2
  explanation: '`AGENTS.md` and repository rule files automatically prime coding agents with project-specific
    context and constraints.'
- question: What is the recommended priority hierarchy when resolving conflicting rules in a coding agent?
  options:
  - Random selection
  - Default System > Global User > Project rules > Task prompt
  - Alphabetical order of filenames
  - 'Task prompt, project rules, user rules, defaults'
  answer_index: 3
  explanation: More specific scopes (task prompt, project rules) take precedence over general global defaults.
- question: What components constitute an Agent Skill directory?
  options:
  - 'A SKILL.md file'
  - Only a .jpg image
  - A compiled binary DLL
  - A git branch
  answer_index: 0
  explanation: Skills are modular packages containing `SKILL.md` instructions, executable scripts, and
    reference documentation.
- question: Why is recording persistent architectural memories (e.g. past post-mortems or tricky gotchas)
    beneficial for coding agents?
  options:
  - 'It makes the hard drive fill up much faster'
  - 'It stops the agent repeating solved mistakes'
  - It disables linter checks
  - It forces the agent to use C++
  answer_index: 1
  explanation: Persistent repository memory gives agents institutional knowledge, preventing repeated
    errors.
- question: How should dynamic on-demand skills be loaded into an agent's context to prevent token bloat?
  options:
  - Load all 500 skills into every prompt by default
  - Delete all skills after one use
  - 'Show summaries, and load the full file on demand'
  - Compress skills into zip files
  answer_index: 2
  explanation: Lazy-loading skills based on metadata summaries prevents prompt bloat while retaining rich
    capabilities.
