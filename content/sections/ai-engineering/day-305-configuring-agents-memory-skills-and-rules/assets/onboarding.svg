<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Forty-five minutes, or zero.">
  <title>Onboarding, with or without a handbook</title>
  <style>
    .onboarding-bg   { fill: #f8fafc; }
    .onboarding-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onboarding-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onboarding-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onboarding-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onboarding-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .onboarding-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .onboarding-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .onboarding-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .onboarding-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .onboarding-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .onboarding-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .onboarding-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .onboarding-row { opacity: 1; }
    .onboarding-r0 { animation-delay: 0.00s; }
    .onboarding-r1 { animation-delay: 0.45s; }
    .onboarding-r2 { animation-delay: 0.90s; }
    .onboarding-r3 { animation-delay: 1.35s; }
    .onboarding-r4 { animation-delay: 1.80s; }
    .onboarding-row { animation: onboarding-reveal 7.3s ease-in-out infinite; }
    @keyframes onboarding-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="onboarding-bg" width="980" height="390"/>
  <text class="onboarding-h1"  x="30" y="40">Onboarding, with or without a handbook</text>
  <text class="onboarding-sub" x="30" y="64">Forty-five minutes, or zero.</text>
  <rect class="onboarding-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="onboarding-name" x="46" y="122">Verbal onboarding</text>
  <text class="onboarding-desc" x="46" y="142">Repeated every time.</text>
  <text class="onboarding-desc onboarding-row onboarding-r0" x="46" y="182">Explaining the repo, the commands, the style</text>
  <text class="onboarding-desc onboarding-row onboarding-r1" x="46" y="216">Every session, from scratch</text>
  <text class="onboarding-desc onboarding-row onboarding-r2" x="46" y="250">Something is always forgotten</text>
  <text class="onboarding-desc onboarding-row onboarding-r3" x="46" y="284">The forgotten thing becomes a defect</text>
  <text class="onboarding-desc onboarding-row onboarding-r4" x="46" y="318">And nobody notices which</text>
  <rect class="onboarding-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="onboarding-name" x="526" y="122">A written handbook</text>
  <text class="onboarding-desc" x="526" y="142">Read automatically.</text>
  <text class="onboarding-desc onboarding-row onboarding-r0" x="526" y="182">AGENTS.md: how to build, test and commit</text>
  <text class="onboarding-desc onboarding-row onboarding-r1" x="526" y="216">Skills: labelled procedures with scripts</text>
  <text class="onboarding-desc onboarding-row onboarding-r2" x="526" y="250">Memory: "the March billing outage"</text>
  <text class="onboarding-desc onboarding-row onboarding-r3" x="526" y="284">Productive from minute one</text>
  <text class="onboarding-desc onboarding-row onboarding-r4" x="526" y="318">And consistent between sessions</text>
  <text class="onboarding-sub" x="30" y="372">The March outage line is the part that is impossible any other way: an incident's lesson is exactly the kind of knowledge that lives in one person's head and disappears when they are not in the conversation.</text>
</svg>
