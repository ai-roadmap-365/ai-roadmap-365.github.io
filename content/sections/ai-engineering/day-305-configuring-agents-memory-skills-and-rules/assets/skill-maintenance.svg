<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three maintenance practices.">
  <title>Skills rot like documentation</title>
  <style>
    .skill-maintenance-bg   { fill: #f8fafc; }
    .skill-maintenance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-maintenance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-maintenance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-maintenance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-maintenance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-maintenance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skill-maintenance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .skill-maintenance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .skill-maintenance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .skill-maintenance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .skill-maintenance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .skill-maintenance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .skill-maintenance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .skill-maintenance-stage { opacity: 1; }

    .skill-maintenance-s0 { animation-delay: 0.00s; }
    .skill-maintenance-e0 { animation-delay: 0.00s; }
    .skill-maintenance-s1 { animation-delay: 1.50s; }
    .skill-maintenance-e1 { animation-delay: 1.50s; }
    .skill-maintenance-s2 { animation-delay: 3.00s; }
    .skill-maintenance-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .skill-maintenance-conn  { animation: skill-maintenance-trace 6s ease-in-out infinite; }
      .skill-maintenance-stage { animation: skill-maintenance-arrive 6s ease-in-out infinite; }
    }
    @keyframes skill-maintenance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes skill-maintenance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .skill-maintenance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .skill-maintenance-stage { animation: skill-maintenance-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes skill-maintenance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="skill-maintenance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="skill-maintenance-bg" width="980" height="322"/>
  <text class="skill-maintenance-h1"  x="30" y="40">Skills rot like documentation</text>
  <text class="skill-maintenance-sub" x="30" y="64">Three maintenance practices.</text>
  <g class="skill-maintenance-stage skill-maintenance-s0">
    <rect class="skill-maintenance-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="skill-maintenance-step" x="44" y="142">01</text>
    <text class="skill-maintenance-name" x="70" y="142">Version and date the skill</text>
    <text class="skill-maintenance-desc" x="44" y="166">So a reader knows when it was last verified</text>
    <text class="skill-maintenance-desc" x="44" y="182">against the SDK.</text>
  </g>
  <line class="skill-maintenance-line skill-maintenance-conn skill-maintenance-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#skill-maintenance-tip)"/>
  <g class="skill-maintenance-stage skill-maintenance-s1">
    <rect class="skill-maintenance-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="skill-maintenance-step" x="359" y="142">02</text>
    <text class="skill-maintenance-name" x="385" y="142">Validate in CI</text>
    <text class="skill-maintenance-desc" x="359" y="166">Run the helper scripts periodically. A broken</text>
    <text class="skill-maintenance-desc" x="359" y="182">helper fails a job.</text>
  </g>
  <line class="skill-maintenance-line skill-maintenance-conn skill-maintenance-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#skill-maintenance-tip)"/>
  <g class="skill-maintenance-stage skill-maintenance-s2">
    <rect class="skill-maintenance-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="skill-maintenance-step" x="674" y="142">03</text>
    <text class="skill-maintenance-name" x="700" y="142">Delete retired skills</text>
    <text class="skill-maintenance-desc" x="674" y="166">A Flask migration skill after moving to</text>
    <text class="skill-maintenance-desc" x="674" y="182">FastAPI teaches an obsolete pattern.</text>
  </g>
  <text class="skill-maintenance-sub" x="30" y="304">The third is the one nobody does, and it has a worse failure mode than staleness: an obsolete skill is confidently followed, so the agent produces the wrong architecture correctly.</text>
</svg>
