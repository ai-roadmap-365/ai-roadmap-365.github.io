<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Retrieval, applied to your own tooling.">
  <title>Routing to the right skill</title>
  <style>
    .semantic-routing-bg   { fill: #f8fafc; }
    .semantic-routing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-routing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-routing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-routing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-routing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .semantic-routing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .semantic-routing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .semantic-routing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .semantic-routing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .semantic-routing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .semantic-routing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .semantic-routing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .semantic-routing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .semantic-routing-stage { opacity: 1; }

    .semantic-routing-s0 { animation-delay: 0.00s; }
    .semantic-routing-e0 { animation-delay: 0.00s; }
    .semantic-routing-s1 { animation-delay: 1.28s; }
    .semantic-routing-e1 { animation-delay: 1.28s; }
    .semantic-routing-s2 { animation-delay: 2.56s; }
    .semantic-routing-e2 { animation-delay: 2.56s; }
    .semantic-routing-s3 { animation-delay: 3.84s; }
    .semantic-routing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .semantic-routing-conn  { animation: semantic-routing-trace 6.4s ease-in-out infinite; }
      .semantic-routing-stage { animation: semantic-routing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes semantic-routing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes semantic-routing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .semantic-routing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .semantic-routing-stage { animation: semantic-routing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes semantic-routing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="semantic-routing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="semantic-routing-bg" width="980" height="322"/>
  <text class="semantic-routing-h1"  x="30" y="40">Routing to the right skill</text>
  <text class="semantic-routing-sub" x="30" y="64">Retrieval, applied to your own tooling.</text>
  <g class="semantic-routing-stage semantic-routing-s0">
    <rect class="semantic-routing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="semantic-routing-step" x="44" y="142">01</text>
    <text class="semantic-routing-name" x="70" y="142">Embed each skill's triggers</text>
    <text class="semantic-routing-desc" x="44" y="166">Once, at startup, with a</text>
    <text class="semantic-routing-desc" x="44" y="182">lightweight model.</text>
  </g>
  <line class="semantic-routing-line semantic-routing-conn semantic-routing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#semantic-routing-tip)"/>
  <g class="semantic-routing-stage semantic-routing-s1">
    <rect class="semantic-routing-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="semantic-routing-step" x="280" y="142">02</text>
    <text class="semantic-routing-name" x="306" y="142">Match the turn's prompt</text>
    <text class="semantic-routing-desc" x="280" y="166">Cosine similarity against the</text>
    <text class="semantic-routing-desc" x="280" y="182">skill index.</text>
    <text class="semantic-routing-edge" x="280" y="242">per turn</text>
  </g>
  <line class="semantic-routing-line semantic-routing-conn semantic-routing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#semantic-routing-tip)"/>
  <g class="semantic-routing-stage semantic-routing-s2">
    <rect class="semantic-routing-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="semantic-routing-step" x="516" y="142">03</text>
    <text class="semantic-routing-name" x="542" y="142">Inject the top match only</text>
    <text class="semantic-routing-desc" x="516" y="166">One skill, for this turn.</text>
  </g>
  <line class="semantic-routing-line semantic-routing-conn semantic-routing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#semantic-routing-tip)"/>
  <g class="semantic-routing-stage semantic-routing-s3">
    <rect class="semantic-routing-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="semantic-routing-step" x="752" y="142">04</text>
    <text class="semantic-routing-name" x="778" y="142">The other ninety-nine stay on disk</text>
    <text class="semantic-routing-desc" x="752" y="166">Zero baseline overhead.</text>
    <text class="semantic-routing-edge" x="752" y="242">dormant</text>
  </g>
  <text class="semantic-routing-sub" x="30" y="304">This is Day 299's tool pruning applied to skills, and the same observation holds: a catalogue is a corpus, the current prompt is a query, and retrieval is the right tool for both.</text>
</svg>
