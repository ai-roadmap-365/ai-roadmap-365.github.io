<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three parts, and two are executable.">
  <title>What a skill contains</title>
  <style>
    .skill-anatomy-bg   { fill: #f8fafc; }
    .skill-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skill-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skill-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .skill-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .skill-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .skill-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .skill-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .skill-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .skill-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .skill-anatomy-stage { opacity: 1; }

    .skill-anatomy-s0 { animation-delay: 0.00s; }
    .skill-anatomy-e0 { animation-delay: 0.00s; }
    .skill-anatomy-s1 { animation-delay: 1.50s; }
    .skill-anatomy-e1 { animation-delay: 1.50s; }
    .skill-anatomy-s2 { animation-delay: 3.00s; }
    .skill-anatomy-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .skill-anatomy-conn  { animation: skill-anatomy-trace 6s ease-in-out infinite; }
      .skill-anatomy-stage { animation: skill-anatomy-arrive 6s ease-in-out infinite; }
    }
    @keyframes skill-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes skill-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .skill-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .skill-anatomy-stage { animation: skill-anatomy-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes skill-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="skill-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="skill-anatomy-bg" width="980" height="322"/>
  <text class="skill-anatomy-h1"  x="30" y="40">What a skill contains</text>
  <text class="skill-anatomy-sub" x="30" y="64">Three parts, and two are executable.</text>
  <g class="skill-anatomy-stage skill-anatomy-s0">
    <rect class="skill-anatomy-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="skill-anatomy-step" x="44" y="142">01</text>
    <text class="skill-anatomy-name" x="70" y="142">The playbook</text>
    <text class="skill-anatomy-desc" x="44" y="166">Prerequisites, rules, edge cases and steps,</text>
    <text class="skill-anatomy-desc" x="44" y="182">in natural language.</text>
  </g>
  <line class="skill-anatomy-line skill-anatomy-conn skill-anatomy-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#skill-anatomy-tip)"/>
  <g class="skill-anatomy-stage skill-anatomy-s1">
    <rect class="skill-anatomy-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="skill-anatomy-step" x="359" y="142">02</text>
    <text class="skill-anatomy-name" x="385" y="142">Helper scripts</text>
    <text class="skill-anatomy-desc" x="359" y="166">Deterministic Python or bash the agent runs</text>
    <text class="skill-anatomy-desc" x="359" y="182">directly.</text>
    <text class="skill-anatomy-edge" x="359" y="242">executable</text>
  </g>
  <line class="skill-anatomy-line skill-anatomy-conn skill-anatomy-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#skill-anatomy-tip)"/>
  <g class="skill-anatomy-stage skill-anatomy-s2">
    <rect class="skill-anatomy-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="skill-anatomy-step" x="674" y="142">03</text>
    <text class="skill-anatomy-name" x="700" y="142">References</text>
    <text class="skill-anatomy-desc" x="674" y="166">API schemas and decision records providing</text>
    <text class="skill-anatomy-desc" x="674" y="182">ground truth.</text>
  </g>
  <text class="skill-anatomy-sub" x="30" y="304">The scripts are what separate a skill from a document: a validation step written as prose is advice, and the same step as a script the agent runs is a check that either passes or does not.</text>
</svg>
