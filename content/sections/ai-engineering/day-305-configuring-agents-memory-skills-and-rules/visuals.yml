visuals:
- id: hierarchical-agent-configuration-architecture
  file: assets/hierarchical-agent-configuration-architecture.svg
  type: diagram
  title: Hierarchical Agent Configuration Architecture
  alt: Hierarchical Agent Configuration Architecture showing Global Rules, Project AGENTS.md, Custom Skills
    On-Demand, Persistent Memory Store, and Task Prompt
  description: System architecture diagram illustrating hierarchical rule resolution and skill loading
    for coding agents.
- id: agent-skill-directory-structure-and-lifecycle
  file: assets/agent-skill-directory-structure-and-lifecycle.svg
  type: diagram
  title: Agent Skill Directory Structure and Lifecycle
  alt: Agent Skill Directory Structure and Lifecycle showing SKILL.md Frontmatter, Trigger Match, Lazy
    Load, Helper Script Execution, and Context Return
  description: Lifecycle diagram showing how modular agent skills are discovered, matched, and executed.
- id: config-layers
  file: assets/config-layers.svg
  type: diagram
  title: 'Three configuration subsystems'
  alt: 'Diagram: the three persistent configuration subsystems of a coding agent'
  description: 'A three-stage description of agent configuration covering repository rules, modular skills and persistent memory.'
- id: onboarding
  file: assets/onboarding.svg
  type: diagram
  title: 'Onboarding, with or without a handbook'
  alt: 'Diagram: onboarding a contractor with and without written standards'
  description: 'A two-column comparison of onboarding a new contributor verbally against providing written standards, skills and history.'
- id: config-lineage
  file: assets/config-lineage.svg
  type: diagram
  title: 'Three standardisations'
  alt: 'Diagram: the progression from editor dotfiles to the AGENTS.md standard'
  description: 'A three-stage progression of agent configuration from in-repo dotfiles through proprietary rule files to an open standard with skills.'
- id: config-benefits
  file: assets/config-benefits.svg
  type: diagram
  title: 'Four problems configuration solves'
  alt: 'Diagram: the four problems that persistent agent configuration solves'
  description: 'A four-stage description of configuration benefits covering prompt repetition, architectural invariants, lazy loading and institutional memory.'
- id: rule-precedence
  file: assets/rule-precedence.svg
  type: diagram
  title: 'Resolving conflicting rules'
  alt: 'Diagram: the precedence order for conflicting agent configuration rules'
  description: 'A two-column comparison of an explicit rule precedence hierarchy against unresolved conflicting directives.'
- id: skill-anatomy
  file: assets/skill-anatomy.svg
  type: diagram
  title: 'What a skill contains'
  alt: 'Diagram: the three components of a well-designed agent skill'
  description: 'A three-stage description of skill structure covering the playbook, helper scripts and reference material.'
- id: avionics
  file: assets/avionics.svg
  type: diagram
  title: 'A flight computer'
  alt: 'Diagram: avionics systems as an analogy for agent configuration layers'
  description: 'A two-column comparison mapping avionics components onto agent configuration subsystems.'
- id: semantic-routing
  file: assets/semantic-routing.svg
  type: diagram
  title: 'Routing to the right skill'
  alt: 'Diagram: how semantic routing selects one skill from a large catalogue'
  description: 'A four-stage description of semantic skill routing covering trigger embedding, similarity search, single-skill injection and dormant skills.'
- id: skill-maintenance
  file: assets/skill-maintenance.svg
  type: diagram
  title: 'Skills rot like documentation'
  alt: 'Diagram: the three practices that keep agent skills accurate over time'
  description: 'A three-stage description of skill maintenance covering version metadata, automated validation and pruning obsolete skills.'
- id: config-when
  file: assets/config-when.svg
  type: diagram
  title: 'When to configure, and how much'
  alt: 'Diagram: when agent rules and skills are worth authoring'
  description: 'A two-column comparison of situations warranting configuration and skills against those where they are overhead, and the hard limits.'
