terms:
- term: AGENTS.md
  definition: A standardized markdown file in a repo root specifying instructions, rules, and commands
    for coding agents.
- term: Hierarchical Rule Engine
  definition: A configuration system resolving rule precedence from global user settings down to task
    prompts.
- term: Agent Skill
  definition: A modular directory containing `SKILL.md` instructions, helper scripts, and domain knowledge
    loaded on-demand.
- term: Persistent Repo Memory
  definition: A structured knowledge store recording past architectural decisions, edge cases, and gotchas.
- term: Skill Frontmatter
  definition: YAML metadata at the top of a `SKILL.md` file specifying skill name, description, and triggers.
- term: Context Priming
  definition: Automatically injecting repository conventions into an agent's initial system prompt.
- term: Architectural Invariant
  definition: A strict structural rule (e.g. 'All database calls must use async sessions') enforced on
    the agent.
- term: Lazy Skill Activation
  definition: Reading full skill documentation only when the user's intent matches the skill's trigger
    description.
