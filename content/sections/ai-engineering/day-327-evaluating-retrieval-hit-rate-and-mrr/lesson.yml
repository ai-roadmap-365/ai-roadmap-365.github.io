week: 47
learning_promise: 'Master empirical evaluation metrics for RAG retrieval and generation: compute Hit Rate@k,
  Mean Reciprocal Rank (MRR@k), Context Precision, Context Recall, and Faithfulness in Python.'
objectives:
- 'Deconstruct the two distinct evaluation stages of RAG: Retrieval Evaluation (ranking metrics) vs Generation
  Evaluation (faithfulness/groundedness).'
- Implement Hit Rate@k (fraction of queries where ground-truth document is in top-k) and Mean Reciprocal
  Rank (MRR@k).
- Implement RAG Triad Metrics (Context Relevance, Faithfulness, Answer Relevance).
- Build a production-grade RAG Evaluation Suite in Python calculating Hit Rate, MRR, Precision, and Groundedness
  scores.
- Design automated CI/CD retrieval regression testing gates preventing RAG degradation on new document
  indexing.
