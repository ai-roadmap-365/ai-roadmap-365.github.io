<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Hit Rate vs MRR Ranking Comparison">
  <title>Hit Rate vs MRR Ranking Comparison</title>
  <defs>
    <style>
      .d327b-bg { fill: #f8fafc; }
      .d327b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d327b-hit { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d327b-mrr { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d327b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d327b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d327b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d327b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d327b-bg" />
  
  <text x="40" y="40" class="d327a-title">Ranking Sensitivity: Hit Rate@k vs MRR@k</text>
  <text x="40" y="65" class="d327a-subtitle">Hit Rate vs MRR Ranking Comparison comparing Binary Inclusion (Hit Rate@5 = 100%) with Reciprocal Rank Sensitivity (MRR = 1.00 at rank 1 vs 0.20 at rank 5)</text>
  
  <!-- Hit Rate Panel -->
  <rect x="40" y="110" width="390" height="270" class="d327b-hit" />
  <text x="60" y="145" class="d327b-header" fill="#1d4ed8">Hit Rate@k (Binary Measure)</text>
  <text x="60" y="180" class="d327b-text">• **Definition:** Is target doc in Top-k?</text>
  <text x="60" y="205" class="d327b-text">• Target at Rank 1 -> Hit = 1.0</text>
  <text x="60" y="230" class="d327b-text">• Target at Rank 5 -> Hit = 1.0 (Identical!)</text>
  <text x="60" y="255" class="d327b-text">• **Flaw:** Treats rank 1 and rank 5 identically</text>
  <text x="60" y="300" class="d327b-text" font-weight="600" fill="#1d4ed8">Use Case: Coarse Recall Measurement</text>
  
  <!-- MRR Panel -->
  <rect x="470" y="110" width="390" height="270" class="d327b-mrr" />
  <text x="490" y="145" class="d327b-header" fill="#7e22ce">Mean Reciprocal Rank (Position-Sensitive)</text>
  <text x="490" y="180" class="d327b-text">• **Definition:** Average of `1 / rank`</text>
  <text x="490" y="205" class="d327b-text">• Target at Rank 1 -> Score = 1.000 (1/1)</text>
  <text x="490" y="230" class="d327b-text">• Target at Rank 2 -> Score = 0.500 (1/2)</text>
  <text x="490" y="255" class="d327b-text">• Target at Rank 5 -> Score = 0.200 (1/5)</text>
  <text x="490" y="300" class="d327b-text" font-weight="600" fill="#7e22ce">Use Case: Precision &amp; Reranker Ranking Quality</text>
</svg>