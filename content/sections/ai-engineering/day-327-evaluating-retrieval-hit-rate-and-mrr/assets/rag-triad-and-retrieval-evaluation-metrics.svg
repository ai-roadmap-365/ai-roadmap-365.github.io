<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="RAG Triad and Retrieval Evaluation Metrics">
  <title>RAG Triad and Retrieval Evaluation Metrics</title>
  <defs>
    <style>
      .d327a-bg { fill: #f8fafc; }
      .d327a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d327a-q { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d327a-c { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d327a-r { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d327a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d327a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d327a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d327a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d327a-bg" />
  
  <text x="40" y="40" class="d327a-title">The RAG Triad Evaluation Framework</text>
  <text x="40" y="65" class="d327a-subtitle">RAG Triad and Retrieval Evaluation Metrics showing Query, Retrieved Context, and Generated Response connected by Context Relevance, Groundedness/Faithfulness, and Answer Relevance</text>
  
  <!-- Query Node -->
  <rect x="40" y="110" width="240" height="100" class="d327a-q" />
  <text x="60" y="145" class="d327a-header" fill="#1d4ed8">1. User Query</text>
  <text x="60" y="175" class="d327a-text">Input Question / Intent</text>
  
  <!-- Context Node -->
  <rect x="620" y="110" width="240" height="100" class="d327a-c" />
  <text x="640" y="145" class="d327a-header" fill="#7e22ce">2. Retrieved Context</text>
  <text x="640" y="175" class="d327a-text">Top-k Candidate Chunks</text>
  
  <!-- Response Node -->
  <rect x="330" y="290" width="240" height="100" class="d327a-r" />
  <text x="350" y="325" class="d327a-header" fill="#15803d">3. Generated Answer</text>
  <text x="350" y="355" class="d327a-text">Final LLM Response Text</text>
  
  <!-- Edge 1: Context Relevance -->
  <text x="360" y="130" class="d327a-header" fill="#3b82f6">Context Relevance</text>
  <text x="350" y="150" class="d327a-text">Is context pertinent to query?</text>
  <text x="375" y="170" class="d327a-text" font-weight="600">Hit Rate &amp; MRR</text>
  
  <!-- Edge 2: Faithfulness / Groundedness -->
  <text x="590" y="240" class="d327a-header" fill="#15803d">Faithfulness</text>
  <text x="580" y="260" class="d327a-text">Derived from context?</text>
  
  <!-- Edge 3: Answer Relevance -->
  <text x="140" y="240" class="d327a-header" fill="#a16207">Answer Relevance</text>
  <text x="130" y="260" class="d327a-text">Answers the query?</text>
</svg>