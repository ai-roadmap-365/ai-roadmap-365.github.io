questions:
- question: What is the difference between Hit Rate@k and Mean Reciprocal Rank (MRR@k)?
  options:
  - They are identical metrics
  - Hit Rate@k is a binary measure of whether the ground-truth document appears anywhere in the top-k
    results (0 or 1 per query), while MRR@k rewards higher ranking positions by averaging the reciprocal
    of the rank where the relevant document first appears (`1 / rank`)
  - Hit Rate is only for SQL databases
  - MRR is only for audio models
  answer_index: 1
  explanation: Hit Rate measures inclusion in top-k; MRR rewards top-ranking positions.
- question: What are the three core pillars of the 'RAG Triad' evaluation framework?
  options:
  - HTML, CSS, JavaScript
  - Context Relevance (is retrieved context pertinent to the query?), Groundedness / Faithfulness (is
    the generated answer strictly derived from the context?), and Answer Relevance (does the answer directly
    address the user's question?)
  - CPU, RAM, Disk
  - Input, Output, Network
  answer_index: 1
  explanation: The RAG Triad evaluates Context Relevance, Faithfulness, and Answer Relevance.
- question: If a retrieval engine returns the ground-truth document at rank 1 for query A, rank 2 for
    query B, and misses completely (rank > 10) for query C, what is the MRR@10?
  options:
  - '1.00'
  - '0.50 (calculation: `(1/1 + 1/2 + 0) / 3 = (1.0 + 0.5 + 0.0) / 3 = 1.5 / 3 = 0.50`)'
  - '0.75'
  - '0.33'
  answer_index: 1
  explanation: 'MRR is the mean of reciprocal ranks: `(1/1 + 1/2 + 0)/3 = 0.50`.'
- question: What does a low 'Faithfulness' score indicate in a RAG system?
  options:
  - The server is offline
  - The LLM hallucinated ungrounded facts or contradicted the retrieved context passages provided in the
    prompt
  - The vector database ran out of memory
  - The user wrote a long question
  answer_index: 1
  explanation: Faithfulness measures whether generated statements are grounded in the retrieved context.
- question: Why should retrieval evaluation be decoupled from generation evaluation in production CI pipelines?
  options:
  - Because retrieval metrics (Hit Rate, MRR) can be evaluated deterministically in sub-seconds over thousands
    of ground-truth test cases without incurring expensive LLM generation API costs
  - Because Python does not allow both in one file
  - Because retrieval only works on weekdays
  - To make the pipeline slower
  answer_index: 0
  explanation: Decoupling enables fast, deterministic, zero-cost retrieval regression testing in CI.
