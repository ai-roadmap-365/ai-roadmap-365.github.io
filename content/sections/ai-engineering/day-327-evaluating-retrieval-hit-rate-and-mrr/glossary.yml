terms:
- term: Hit Rate@k
  definition: The percentage of queries where the relevant ground-truth document appears in the top-k
    retrieved results.
- term: Mean Reciprocal Rank (MRR@k)
  definition: The average of reciprocal ranks (1/rank) of the first relevant document across a test query
    set.
- term: Context Relevance
  definition: The proportion of retrieved context sentences that are directly pertinent to answering the
    query.
- term: Faithfulness (Groundedness)
  definition: The degree to which claims in the generated response are factually derived from the retrieved
    context.
- term: Answer Relevance
  definition: How directly and completely the generated response addresses the user's inquiry.
- term: RAG Triad
  definition: The tripartite evaluation framework measuring Context Relevance, Groundedness, and Answer
    Relevance.
- term: Normalized Discounted Cumulative Gain (NDCG)
  definition: A graded relevance ranking metric that rewards placing highly relevant items at the top.
- term: Golden Evaluation Dataset
  definition: A curated benchmark set of (query, ground_truth_context, reference_answer) tuples.
