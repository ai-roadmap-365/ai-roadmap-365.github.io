terms:
- term: GraphRAG
  definition: A retrieval framework augmenting LLMs using knowledge graphs and hierarchical community
    summaries.
- term: Knowledge Graph (KG)
  definition: A network of entities (nodes) connected by labeled directed relationships (edges).
- term: Community Detection
  definition: Clustering graph nodes into densely connected modular communities using algorithms like
    Leiden.
- term: Community Summary
  definition: A pre-generated LLM executive summary synthesizing the entities and claims within a graph
    cluster.
- term: Local Graph Search
  definition: Traversing entity neighborhoods (1-2 hops) to retrieve granular relational context.
- term: Global Graph Search
  definition: Aggregating community summaries across the graph hierarchy to answer broad holistic questions.
- term: Multi-Hop Traversal
  definition: Following explicit relational edges across multiple intermediate nodes (A -> B -> C).
- term: Global Sensemaking
  definition: The ability of an AI system to synthesize high-level themes across an entire document corpus.
