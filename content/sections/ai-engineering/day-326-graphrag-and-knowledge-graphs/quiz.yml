questions:
- question: What is the primary failure mode of standard Vector RAG when answering global corpus-level
    inquiries (e.g. 'What are the main thematic themes across all 5,000 documents?')?
  options:
  - The database will run out of hard drive space
  - Standard vector search retrieves local chunks matching specific query keywords, but cannot perform
    holistic synthesis or global summarization across thousands of fragmented chunks scattered throughout
    the corpus
  - Vectors cannot store text
  - Vector databases crash on questions longer than 10 words
  answer_index: 1
  explanation: Vector RAG excels at localized needle-in-a-haystack retrieval but fails at holistic global
    corpus sensemaking.
- question: How does GraphRAG structure unstructured document collections to enable global sensemaking?
  options:
  - By extracting Entities and Relationships (Knowledge Graph), clustering related nodes into hierarchical
    communities (Leiden algorithm), and pre-generating thematic Community Summaries at multiple abstraction
    levels
  - By converting all text to CSV files
  - By sorting documents by creation date
  - By translating text into binary code
  answer_index: 0
  explanation: GraphRAG extracts entity graphs and synthesizes hierarchical community summaries for global
    reasoning.
- question: What is the difference between 'Local Search' and 'Global Search' in GraphRAG?
  options:
  - Local search is only for mobile phones
  - Local Search explores specific entities, their 1-hop and 2-hop graph neighbors, and associated raw
    text chunks for needle-in-a-haystack queries; Global Search aggregates pre-computed community summaries
    across the entire graph to answer broad thematic questions
  - Global search searches the public internet
  - They are identical
  answer_index: 1
  explanation: Local search traverses entity neighborhoods; Global search aggregates high-level community
    summaries.
- question: What graph clustering algorithm is commonly used in GraphRAG to identify modular communities
    of entities?
  options:
  - Leiden / Louvain community detection algorithm
  - Bubble sort
  - Linear regression
  - Binary search tree
  answer_index: 0
  explanation: The Leiden algorithm partitions knowledge graphs into dense, modular community clusters.
- question: Why is multi-hop graph traversal superior to standard vector search for relational queries
    (e.g. 'How is Company A connected to Vendor B through subsidiaries?')?
  options:
  - Because graphs use less memory
  - Because graph traversal follows explicit directed relationship edges across multiple intermediate
    entities, whereas vector search requires all relational links to happen to co-occur within a single
    500-token chunk
  - Because Python only supports graphs
  - To make the code look longer
  answer_index: 1
  explanation: Graph traversal connects facts across multiple documents via explicit entity relationship
    paths.
