<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="GraphRAG Knowledge Graph and Community Hierarchy">
  <title>GraphRAG Knowledge Graph and Community Hierarchy</title>
  <defs>
    <style>
      .d326a-bg { fill: #f8fafc; }
      .d326a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d326a-p1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d326a-p2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d326a-p3 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d326a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d326a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d326a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d326a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d326a-bg" />
  
  <text x="40" y="40" class="d326a-title">GraphRAG Indexing &amp; Community Extraction Pipeline</text>
  <text x="40" y="65" class="d326a-subtitle">GraphRAG Knowledge Graph and Community Hierarchy showing Raw Text Chunks, Entity &amp; Relationship Extraction, Leiden Community Clustering, and Hierarchical Community Summaries</text>
  
  <!-- Stage 1: Extraction -->
  <rect x="40" y="110" width="250" height="270" class="d326a-p1" />
  <text x="60" y="145" class="d326a-header" fill="#1d4ed8">1. Entity &amp; Relation Extraction</text>
  <text x="60" y="180" class="d326a-text">• Unstructured document chunks</text>
  <text x="60" y="205" class="d326a-text">• LLM extracts Entities (Nodes):</text>
  <text x="60" y="225" class="d326a-text">  [PostgreSQL], [WAL], [Replication]</text>
  <text x="60" y="255" class="d326a-text">• LLM extracts Relations (Edges):</text>
  <text x="60" y="275" class="d326a-text">  (PostgreSQL)-[WRITES_TO]->(WAL)</text>
  <text x="60" y="320" class="d326a-text" font-weight="600" fill="#1d4ed8">Result: Graph Network</text>
  
  <!-- Stage 2: Community Detection -->
  <rect x="325" y="110" width="250" height="270" class="d326a-p2" />
  <text x="345" y="145" class="d326a-header" fill="#7e22ce">2. Leiden Community Detection</text>
  <text x="345" y="180" class="d326a-text">• Graph modularity clustering</text>
  <text x="345" y="205" class="d326a-text">• Partitions graph into clusters</text>
  <text x="345" y="230" class="d326a-text">• **Community C0:** Database Engine</text>
  <text x="345" y="255" class="d326a-text">• **Community C1:** Cloud Infrastructure</text>
  <text x="345" y="280" class="d326a-text">• **Community C2:** Billing &amp; Auth</text>
  <text x="345" y="320" class="d326a-text" font-weight="600" fill="#7e22ce">Hierarchy: Multi-Level Clusters</text>
  
  <!-- Stage 3: Summary Synthesis -->
  <rect x="610" y="110" width="250" height="270" class="d326a-p3" />
  <text x="630" y="145" class="d326a-header" fill="#15803d">3. Pre-Generated Summaries</text>
  <text x="630" y="180" class="d326a-text">• LLM synthesizes each cluster</text>
  <text x="630" y="205" class="d326a-text">• Executive summary of key claims</text>
  <text x="630" y="230" class="d326a-text">• Embedded in vector index</text>
  <text x="630" y="255" class="d326a-text">• Enables Global Sensemaking</text>
  <text x="630" y="280" class="d326a-text">• Answers broad corpus inquiries</text>
  <text x="630" y="320" class="d326a-text" font-weight="600" fill="#15803d">Outcome: Global Synthesis</text>
</svg>