<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Local Entity Traversal vs Global Community Search">
  <title>Local Entity Traversal vs Global Community Search</title>
  <defs>
    <style>
      .d326b-bg { fill: #f8fafc; }
      .d326b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d326b-loc { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d326b-glob { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d326b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d326b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d326b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .d326b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d326b-bg" />
  
  <text x="40" y="40" class="d326a-title">GraphRAG Search Modes: Local vs Global</text>
  <text x="40" y="65" class="d326a-subtitle">Local Entity Traversal vs Global Community Search comparing 2-Hop Entity Neighborhood Traversal with Global Hierarchical Community Summary Aggregation</text>
  
  <!-- Local Search -->
  <rect x="40" y="110" width="390" height="270" class="d326b-loc" />
  <text x="60" y="145" class="d326b-header" fill="#1d4ed8">Local Graph Search (Entity-Focused)</text>
  <text x="60" y="180" class="d326b-text">• **Scope:** Specific entities &amp; relationships</text>
  <text x="60" y="205" class="d326b-text">• **Query Type:** "How is Entity A linked to Entity B?"</text>
  <text x="60" y="230" class="d326b-text">• **Traversal:** Explores 1-hop and 2-hop neighbor edges</text>
  <text x="60" y="255" class="d326b-text">• **Context:** Raw text chunks associated with matched nodes</text>
  <text x="60" y="300" class="d326b-text" font-weight="600" fill="#1d4ed8">Use Case: Needle-in-a-Haystack Relational Qs</text>
  
  <!-- Global Search -->
  <rect x="470" y="110" width="390" height="270" class="d326b-glob" />
  <text x="490" y="145" class="d326b-header" fill="#7e22ce">Global Graph Search (Corpus-Thematic)</text>
  <text x="490" y="180" class="d326b-text">• **Scope:** Entire dataset knowledge space</text>
  <text x="490" y="205" class="d326b-text">• **Query Type:** "What are the primary risk themes across all audits?"</text>
  <text x="490" y="230" class="d326b-text">• **Traversal:** Map-Reduce over hierarchical community summaries</text>
  <text x="490" y="255" class="d326b-text">• **Context:** High-level executive summaries</text>
  <text x="490" y="300" class="d326b-text" font-weight="600" fill="#7e22ce">Use Case: Holistic Corpus Sensemaking</text>
</svg>