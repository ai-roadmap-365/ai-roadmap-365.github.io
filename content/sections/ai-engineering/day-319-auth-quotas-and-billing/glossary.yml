terms:
- term: Credit Pre-Authorization
  definition: Reserving an estimated credit hold before LLM invocation to prevent unpaid token consumption.
- term: Settlement
  definition: Reconciling exact token counts, deducting final costs, and releasing unused reserved holds.
- term: Tokens Per Minute (TPM)
  definition: Rate limiting metric governing total token throughput per minute per tenant.
- term: Requests Per Minute (RPM)
  definition: Rate limiting metric governing total HTTP request frequency per minute.
- term: Metered Billing
  definition: Charging customers asynchronously based on actual units of consumption (tokens, tool calls).
- term: API Key Hashing
  definition: Storing one-way cryptographic hashes (SHA-256) of API secret keys in the database.
- term: Tenant Isolation
  definition: Partitioning data, memory, and billing records strictly by organization ID.
- term: Tiered Quota
  definition: Allocating different RPM, TPM, and model access limits based on subscription tier (Free,
    Pro, Enterprise).
