questions:
- question: Why is 'Credit Pre-Authorization' (Two-Phase Token Billing) necessary for generative AI API
    gateways?
  options:
  - 'Because SQL databases cannot store any numbers at all'
  - Because credit cards only work in integers
  - 'A hold stops a tenant spending beyond their balance'
  - Because LLMs do not accept US Dollars
  answer_index: 2
  explanation: Pre-authorizing funds prevents bankrupt or malicious tenants from incurring unrecoverable
    GPU costs.
- question: What is the difference between Requests Per Minute (RPM) and Tokens Per Minute (TPM) rate
    limiting?
  options:
  - They are identical metrics with different names
  - TPM is only used in cryptocurrency
  - RPM applies only to mobile apps
  - 'RPM caps calls; TPM caps tokens'
  answer_index: 3
  explanation: RPM protects network gateway connections while TPM governs actual computational token throughput.
- question: How should API keys be stored in a production AI SaaS database?
  options:
  - 'As one-way hashes, with only a prefix shown'
  - As plain text in a public table
  - In a browser cookie
  - In a git commit message
  answer_index: 0
  explanation: API keys must always be hashed before storage to prevent database leak exposure.
- question: What occurs during the 'Settlement Phase' of token billing?
  options:
  - The server deletes all user messages
  - 'Real usage is settled and the hold is released'
  - The user is logged out
  - The model is fine-tuned
  answer_index: 1
  explanation: Settlement reconciles exact token usage, releases holds, and records metered billing.
- question: What HTTP status code should an AI gateway return when a tenant exceeds their monthly token
    quota or runs out of credits?
  options:
  - 200 OK
  - '500 Internal Server Error only'
  - '402, or 429 with Retry-After'
  - 404 Not Found
  answer_index: 2
  explanation: HTTP 402 signals credit exhaustion while 429 signals rate limit exhaustion.
