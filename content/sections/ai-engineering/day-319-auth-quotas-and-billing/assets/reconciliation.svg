<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, all idempotent.">
  <title>Reconciling usage with the biller</title>
  <style>
    .reconciliation-bg   { fill: #f8fafc; }
    .reconciliation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconciliation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconciliation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconciliation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconciliation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reconciliation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reconciliation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reconciliation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reconciliation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reconciliation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reconciliation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reconciliation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reconciliation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reconciliation-stage { opacity: 1; }

    .reconciliation-s0 { animation-delay: 0.00s; }
    .reconciliation-e0 { animation-delay: 0.00s; }
    .reconciliation-s1 { animation-delay: 1.28s; }
    .reconciliation-e1 { animation-delay: 1.28s; }
    .reconciliation-s2 { animation-delay: 2.56s; }
    .reconciliation-e2 { animation-delay: 2.56s; }
    .reconciliation-s3 { animation-delay: 3.84s; }
    .reconciliation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reconciliation-conn  { animation: reconciliation-trace 6.4s ease-in-out infinite; }
      .reconciliation-stage { animation: reconciliation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reconciliation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reconciliation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reconciliation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reconciliation-stage { animation: reconciliation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reconciliation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reconciliation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reconciliation-bg" width="980" height="322"/>
  <text class="reconciliation-h1"  x="30" y="40">Reconciling usage with the biller</text>
  <text class="reconciliation-sub" x="30" y="64">Four steps, all idempotent.</text>
  <g class="reconciliation-stage reconciliation-s0">
    <rect class="reconciliation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reconciliation-step" x="44" y="142">01</text>
    <text class="reconciliation-name" x="70" y="142">Settlement produces an event</text>
    <text class="reconciliation-desc" x="44" y="166">Exact tokens, model, tenant,</text>
    <text class="reconciliation-desc" x="44" y="182">timestamp.</text>
  </g>
  <line class="reconciliation-line reconciliation-conn reconciliation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reconciliation-tip)"/>
  <g class="reconciliation-stage reconciliation-s1">
    <rect class="reconciliation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reconciliation-step" x="280" y="142">02</text>
    <text class="reconciliation-name" x="306" y="142">Enqueue durably</text>
    <text class="reconciliation-desc" x="280" y="166">A persistent queue, so a billing</text>
    <text class="reconciliation-desc" x="280" y="182">outage is not lost revenue.</text>
  </g>
  <line class="reconciliation-line reconciliation-conn reconciliation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reconciliation-tip)"/>
  <g class="reconciliation-stage reconciliation-s2">
    <rect class="reconciliation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reconciliation-step" x="516" y="142">03</text>
    <text class="reconciliation-name" x="542" y="142">Batch and dispatch</text>
    <text class="reconciliation-desc" x="516" y="166">Dedicated workers pushing usage</text>
    <text class="reconciliation-desc" x="516" y="182">records to the biller.</text>
  </g>
  <line class="reconciliation-line reconciliation-conn reconciliation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reconciliation-tip)"/>
  <g class="reconciliation-stage reconciliation-s3">
    <rect class="reconciliation-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reconciliation-step" x="752" y="142">04</text>
    <text class="reconciliation-name" x="778" y="142">With idempotency keys</text>
    <text class="reconciliation-desc" x="752" y="166">Daily keys, so a retry cannot</text>
    <text class="reconciliation-desc" x="752" y="182">create a duplicate line item.</text>
  </g>
  <text class="reconciliation-sub" x="30" y="304">Idempotency at this boundary matters more than most: a duplicated usage record is a customer overcharged, which is a support conversation rather than a log entry.</text>
</svg>
