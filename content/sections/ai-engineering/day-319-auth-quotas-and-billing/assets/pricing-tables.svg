<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Prices, expiry and anomaly alerts.">
  <title>Three things the accounting needs</title>
  <style>
    .pricing-tables-bg   { fill: #f8fafc; }
    .pricing-tables-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-tables-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-tables-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-tables-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-tables-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pricing-tables-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pricing-tables-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pricing-tables-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pricing-tables-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pricing-tables-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pricing-tables-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pricing-tables-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pricing-tables-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pricing-tables-stage { opacity: 1; }

    .pricing-tables-s0 { animation-delay: 0.00s; }
    .pricing-tables-e0 { animation-delay: 0.00s; }
    .pricing-tables-s1 { animation-delay: 1.50s; }
    .pricing-tables-e1 { animation-delay: 1.50s; }
    .pricing-tables-s2 { animation-delay: 3.00s; }
    .pricing-tables-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .pricing-tables-conn  { animation: pricing-tables-trace 6s ease-in-out infinite; }
      .pricing-tables-stage { animation: pricing-tables-arrive 6s ease-in-out infinite; }
    }
    @keyframes pricing-tables-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pricing-tables-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pricing-tables-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pricing-tables-stage { animation: pricing-tables-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pricing-tables-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pricing-tables-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pricing-tables-bg" width="980" height="322"/>
  <text class="pricing-tables-h1"  x="30" y="40">Three things the accounting needs</text>
  <text class="pricing-tables-sub" x="30" y="64">Prices, expiry and anomaly alerts.</text>
  <g class="pricing-tables-stage pricing-tables-s0">
    <rect class="pricing-tables-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="pricing-tables-step" x="44" y="142">01</text>
    <text class="pricing-tables-name" x="70" y="142">Versioned price tables</text>
    <text class="pricing-tables-desc" x="44" y="166">Per model, per token type, in micro-dollars.</text>
    <text class="pricing-tables-desc" x="44" y="182">Prices change.</text>
    <text class="pricing-tables-edge" x="44" y="242">versioned</text>
  </g>
  <line class="pricing-tables-line pricing-tables-conn pricing-tables-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#pricing-tables-tip)"/>
  <g class="pricing-tables-stage pricing-tables-s1">
    <rect class="pricing-tables-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="pricing-tables-step" x="359" y="142">02</text>
    <text class="pricing-tables-name" x="385" y="142">Holds expire automatically</text>
    <text class="pricing-tables-desc" x="359" y="166">After a couple of minutes, so a crash never</text>
    <text class="pricing-tables-desc" x="359" y="182">locks funds permanently.</text>
  </g>
  <line class="pricing-tables-line pricing-tables-conn pricing-tables-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#pricing-tables-tip)"/>
  <g class="pricing-tables-stage pricing-tables-s2">
    <rect class="pricing-tables-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="pricing-tables-step" x="674" y="142">03</text>
    <text class="pricing-tables-name" x="700" y="142">Anomaly alerts</text>
    <text class="pricing-tables-desc" x="674" y="166">80% of a daily allowance in five minutes:</text>
    <text class="pricing-tables-desc" x="674" y="182">alert, and consider throttling.</text>
  </g>
  <text class="pricing-tables-sub" x="30" y="304">Versioning the price table rather than hardcoding rates is what makes historical invoices reproducible: a provider's price change should not retroactively alter what last month cost.</text>
</svg>
