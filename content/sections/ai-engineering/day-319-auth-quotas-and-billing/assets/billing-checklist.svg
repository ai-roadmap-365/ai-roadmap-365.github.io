<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is a timing attack.">
  <title>Four billing infrastructure checks</title>
  <style>
    .billing-checklist-bg   { fill: #f8fafc; }
    .billing-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .billing-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .billing-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .billing-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .billing-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .billing-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .billing-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .billing-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .billing-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .billing-checklist-stage { opacity: 1; }

    .billing-checklist-s0 { animation-delay: 0.00s; }
    .billing-checklist-e0 { animation-delay: 0.00s; }
    .billing-checklist-s1 { animation-delay: 1.28s; }
    .billing-checklist-e1 { animation-delay: 1.28s; }
    .billing-checklist-s2 { animation-delay: 2.56s; }
    .billing-checklist-e2 { animation-delay: 2.56s; }
    .billing-checklist-s3 { animation-delay: 3.84s; }
    .billing-checklist-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .billing-checklist-conn  { animation: billing-checklist-trace 6.4s ease-in-out infinite; }
      .billing-checklist-stage { animation: billing-checklist-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes billing-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes billing-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .billing-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .billing-checklist-stage { animation: billing-checklist-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes billing-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="billing-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="billing-checklist-bg" width="980" height="322"/>
  <text class="billing-checklist-h1"  x="30" y="40">Four billing infrastructure checks</text>
  <text class="billing-checklist-sub" x="30" y="64">One is a timing attack.</text>
  <g class="billing-checklist-stage billing-checklist-s0">
    <rect class="billing-checklist-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="billing-checklist-step" x="44" y="142">01</text>
    <text class="billing-checklist-name" x="70" y="142">Constant-time key comparison</text>
    <text class="billing-checklist-desc" x="44" y="166">A naive equality check leaks key</text>
    <text class="billing-checklist-desc" x="44" y="182">material through timing.</text>
  </g>
  <line class="billing-checklist-line billing-checklist-conn billing-checklist-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#billing-checklist-tip)"/>
  <g class="billing-checklist-stage billing-checklist-s1">
    <rect class="billing-checklist-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="billing-checklist-step" x="280" y="142">02</text>
    <text class="billing-checklist-name" x="306" y="142">Atomic pre-authorisation</text>
    <text class="billing-checklist-desc" x="280" y="166">Single round trip. No</text>
    <text class="billing-checklist-desc" x="280" y="182">check-then-act.</text>
  </g>
  <line class="billing-checklist-line billing-checklist-conn billing-checklist-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#billing-checklist-tip)"/>
  <g class="billing-checklist-stage billing-checklist-s2">
    <rect class="billing-checklist-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="billing-checklist-step" x="516" y="142">03</text>
    <text class="billing-checklist-name" x="542" y="142">An immutable ledger</text>
    <text class="billing-checklist-desc" x="516" y="166">Every deduction, with a</text>
    <text class="billing-checklist-desc" x="516" y="182">timestamp and a prompt hash.</text>
  </g>
  <line class="billing-checklist-line billing-checklist-conn billing-checklist-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#billing-checklist-tip)"/>
  <g class="billing-checklist-stage billing-checklist-s3">
    <rect class="billing-checklist-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="billing-checklist-step" x="752" y="142">04</text>
    <text class="billing-checklist-name" x="778" y="142">Burst and steady-state limits</text>
    <text class="billing-checklist-desc" x="752" y="166">Separately configurable, per</text>
    <text class="billing-checklist-desc" x="752" y="182">tenant tier.</text>
  </g>
  <text class="billing-checklist-sub" x="30" y="304">The ledger is what makes a billing dispute resolvable: without an append-only record per deduction, reconciling a customer's invoice against their usage is reconstruction rather than lookup.</text>
</svg>
