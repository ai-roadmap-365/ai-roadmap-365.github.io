<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One prompt can cost more than a thousand.">
  <title>Requests per minute is not enough</title>
  <style>
    .rpm-and-tpm-bg   { fill: #f8fafc; }
    .rpm-and-tpm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-and-tpm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-and-tpm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-and-tpm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-and-tpm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rpm-and-tpm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rpm-and-tpm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rpm-and-tpm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rpm-and-tpm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rpm-and-tpm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rpm-and-tpm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rpm-and-tpm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rpm-and-tpm-row { opacity: 1; }
    .rpm-and-tpm-r0 { animation-delay: 0.00s; }
    .rpm-and-tpm-r1 { animation-delay: 0.45s; }
    .rpm-and-tpm-r2 { animation-delay: 0.90s; }
    .rpm-and-tpm-r3 { animation-delay: 1.35s; }
    .rpm-and-tpm-r4 { animation-delay: 1.80s; }
    .rpm-and-tpm-row { animation: rpm-and-tpm-reveal 7.3s ease-in-out infinite; }
    @keyframes rpm-and-tpm-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rpm-and-tpm-bg" width="980" height="390"/>
  <text class="rpm-and-tpm-h1"  x="30" y="40">Requests per minute is not enough</text>
  <text class="rpm-and-tpm-sub" x="30" y="64">One prompt can cost more than a thousand.</text>
  <rect class="rpm-and-tpm-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rpm-and-tpm-name" x="46" y="122">Requests only</text>
  <text class="rpm-and-tpm-desc" x="46" y="142">Passes the expensive attack.</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r0" x="46" y="182">Sixty requests a minute, enforced</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r1" x="46" y="216">One 100k-token prompt is one request</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r2" x="46" y="250">It costs more than a thousand small ones</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r3" x="46" y="284">And it saturates model capacity</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r4" x="46" y="318">The limiter reports normal traffic</text>
  <rect class="rpm-and-tpm-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rpm-and-tpm-name" x="526" y="122">Requests and tokens</text>
  <text class="rpm-and-tpm-desc" x="526" y="142">Both dimensions bounded.</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r0" x="526" y="182">RPM caps frequency</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r1" x="526" y="216">TPM caps volume</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r2" x="526" y="250">A huge prompt exhausts the token budget</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r3" x="526" y="284">Burst and steady-state limits separately</text>
  <text class="rpm-and-tpm-desc rpm-and-tpm-row rpm-and-tpm-r4" x="526" y="318">The expensive path is also limited</text>
  <text class="rpm-and-tpm-sub" x="30" y="372">This is the AI-specific version of a very old lesson: rate limiting has to bound the resource that actually costs money, and for generation that resource is tokens rather than requests.</text>
</svg>
