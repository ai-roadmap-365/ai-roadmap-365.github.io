questions:
- question: Why is synchronous document ingestion during user file upload an anti-pattern in production
    RAG systems?
  options:
  - Because Python cannot read files synchronously
  - Because parsing large PDFs, generating embeddings, and upserting vectors takes seconds or minutes,
    leading to HTTP client timeouts, thread blocking, and lost uploads upon transient API network blips
  - Because synchronous ingestion deletes old files
  - Because vector databases only accept batch sizes of 1
  answer_index: 1
  explanation: Synchronous ingestion blocks client threads and causes HTTP timeouts during heavy document
    embedding runs.
- question: How does Content Hashing (e.g. SHA-256) ensure idempotent document indexing?
  options:
  - By encrypting the database password
  - By computing a cryptographic hash of the document text and comparing it against the stored hash in
    database metadata; if the hash is identical, the system skips redundant embedding generation and vector
    upserts
  - By sorting words alphabetically
  - By deleting duplicate documents on disk
  answer_index: 1
  explanation: Content hashing skips expensive embedding computation when source document text has not
    changed.
- question: What is the primary challenge of document deletion in vector databases?
  options:
  - Vectors cannot be deleted
  - A single parent document is split into dozens of child vector chunks; deleting the document requires
    executing atomic cascade deletions across all associated chunk IDs to prevent 'ghost chunks' from
    polluting future searches
  - Deleting vectors requires restarting the operating system
  - Vector databases charge a fee for every delete call
  answer_index: 1
  explanation: Document deletions must cascade to all child chunks to prevent stale ghost chunks from
    polluting search.
- question: What is 'Change-Data-Capture (CDC)' in the context of enterprise RAG pipelines?
  options:
  - Taking webcam screenshots of users
  - Streaming real-time database insert, update, and delete events directly from database transaction
    logs (e.g. Debezium / Postgres WAL) into the vector ingestion queue to maintain sub-second index freshness
  - Recording mouse clicks on a webpage
  - A protocol for compressing images
  answer_index: 1
  explanation: CDC streams live database mutations into vector indexing queues for real-time synchronization.
- question: What role does a Dead-Letter Queue (DLQ) play in production ingestion pipelines?
  options:
  - It deletes unread emails
  - It isolates corrupted, unparseable, or malformed documents after a maximum retry threshold, allowing
    the rest of the batch queue to proceed while alerting engineers to inspect the failed payload
  - It shuts down the server on error
  - It translates documents into PDF format
  answer_index: 1
  explanation: A DLQ captures persistently failing ingestion jobs without blocking the main pipeline worker
    pool.
