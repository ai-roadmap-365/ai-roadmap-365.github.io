terms:
- term: Idempotent Indexing
  definition: Ensuring repeated ingestion runs with identical documents produce identical state without
    duplicate vectors.
- term: Content Hashing
  definition: Generating a cryptographic digest (SHA-256) of document text to detect content modifications.
- term: Incremental Indexing
  definition: Only parsing, embedding, and upserting documents that have been newly created or modified.
- term: Dead-Letter Queue (DLQ)
  definition: A secondary storage buffer capturing failed ingestion jobs that exceeded maximum retry limits.
- term: Ghost Chunks
  definition: Orphaned vector embeddings remaining in the index after their parent document has been deleted.
- term: Change-Data-Capture (CDC)
  definition: Streaming transactional database changes directly into asynchronous indexing queues.
- term: Vector Cascade Deletion
  definition: Atomically deleting all child chunk vectors associated with a deleted document ID.
- term: Ingestion Worker Pool
  definition: A background cluster of workers consuming document processing jobs from a message queue.
