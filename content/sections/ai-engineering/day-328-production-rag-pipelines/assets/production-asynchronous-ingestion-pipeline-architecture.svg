<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Production Asynchronous Ingestion Pipeline Architecture">
  <title>Production Asynchronous Ingestion Pipeline Architecture</title>
  <defs>
    <style>
      .d328a-bg { fill: #f8fafc; }
      .d328a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d328a-q { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d328a-w { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d328a-v { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d328a-dlq { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d328a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d328a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d328a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d328a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d328a-bg" />
  
  <text x="40" y="40" class="d328a-title">Asynchronous Production Ingestion Architecture</text>
  <text x="40" y="65" class="d328a-subtitle">Production Asynchronous Ingestion Pipeline Architecture showing Document Upload, RabbitMQ Queue, Worker Pool with SHA-256 Hash Check, Embedding Model, Vector DB Upsert, and Dead-Letter Queue</text>
  
  <!-- Ingestion Source & Queue -->
  <rect x="40" y="110" width="230" height="270" class="d328a-q" />
  <text x="55" y="145" class="d328a-header" fill="#1d4ed8">1. Upload &amp; Ingestion Queue</text>
  <text x="55" y="180" class="d328a-text">• Webhook / PDF Upload</text>
  <text x="55" y="205" class="d328a-text">• Immediate 202 Accepted</text>
  <text x="55" y="230" class="d328a-text">• Message Queue (RabbitMQ)</text>
  <text x="55" y="255" class="d328a-text">• Job payload with doc metadata</text>
  <text x="55" y="295" class="d328a-text" font-weight="600" fill="#1d4ed8">Decoupled Architecture</text>
  <text x="55" y="320" class="d328a-text">Zero web client timeouts</text>
  
  <!-- Worker Processing -->
  <rect x="300" y="110" width="260" height="270" class="d328a-w" />
  <text x="315" y="145" class="d328a-header" fill="#7e22ce">2. Pipeline Worker Pool</text>
  <text x="315" y="180" class="d328a-text">• Compute SHA-256 Content Hash</text>
  <text x="315" y="205" class="d328a-text">• Compare against Metadata Store</text>
  <text x="315" y="230" class="d328a-text">• **If Match:** Skip (Zero Cost)</text>
  <text x="315" y="255" class="d328a-text">• **If Changed:** Markdown Parsing</text>
  <text x="315" y="280" class="d328a-text">• Hierarchical Child Chunking</text>
  <text x="315" y="320" class="d328a-text" font-weight="600" fill="#7e22ce">Batch Vector Embeddings</text>
  
  <!-- Storage & DLQ -->
  <rect x="590" y="110" width="270" height="130" class="d328a-v" />
  <text x="605" y="140" class="d328a-header" fill="#15803d">3. Vector &amp; Document Upsert</text>
  <text x="605" y="170" class="d328a-text">• Qdrant / Pinecone Vector Store</text>
  <text x="605" y="195" class="d328a-text">• Atomic Parent Doc S3 storage</text>
  <text x="605" y="220" class="d328a-text">• Updated document metadata index</text>
  
  <rect x="590" y="260" width="270" height="120" class="d328a-dlq" />
  <text x="605" y="290" class="d328a-header" fill="#b91c1c">Dead-Letter Queue (DLQ)</text>
  <text x="605" y="320" class="d328a-text">• Catches corrupt PDFs / timeouts</text>
  <text x="605" y="345" class="d328a-text">• Max 3 retries -> Alert on-call</text>
</svg>