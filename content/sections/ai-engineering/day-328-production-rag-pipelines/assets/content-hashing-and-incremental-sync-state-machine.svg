<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Content Hashing and Incremental Sync State Machine">
  <title>Content Hashing and Incremental Sync State Machine</title>
  <defs>
    <style>
      .d328b-bg { fill: #f8fafc; }
      .d328b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d328b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d328b-match { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d328b-diff { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d328b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d328b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d328b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d328b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d328b-bg" />
  
  <text x="40" y="40" class="d328a-title">Content Hashing &amp; Incremental Sync Workflow</text>
  <text x="40" y="65" class="d328a-subtitle">Content Hashing and Incremental Sync State Machine showing Incoming Document Hash check against Metadata Store: Matches -> Skip Indexing (Idempotent); Changed -> Cascade Delete Old Chunks and Upsert New Vectors</text>
  
  <!-- Step 1: Ingest -->
  <rect x="40" y="110" width="220" height="270" class="d328b-step" />
  <text x="55" y="145" class="d328b-header" fill="#1d4ed8">1. Hash Calculation</text>
  <text x="55" y="180" class="d328b-text">• Ingest `doc_id: "sec_10k"`</text>
  <text x="55" y="205" class="d328b-text">• `hash = sha256(text)`</text>
  <text x="55" y="230" class="d328b-text">• Query metadata database</text>
  <text x="55" y="255" class="d328b-text">• Compare `new_hash` with `old_hash`</text>
  <text x="55" y="300" class="d328b-text" font-weight="600" fill="#1d4ed8">Check: Has text changed?</text>
  
  <!-- Step 2: Unchanged Branch -->
  <rect x="290" y="110" width="260" height="125" class="d328b-match" />
  <text x="305" y="140" class="d328b-header" fill="#15803d">Case A: Hash Matches (Unchanged)</text>
  <text x="305" y="170" class="d328b-text">• Document content is identical</text>
  <text x="305" y="195" class="d328b-text">• **Action: Skip indexing immediately**</text>
  <text x="305" y="220" class="d328b-text">• 0 API calls | 0 Vector operations</text>
  
  <!-- Step 3: Changed Branch -->
  <rect x="290" y="255" width="260" height="125" class="d328b-diff" />
  <text x="305" y="285" class="d328b-header" fill="#7e22ce">Case B: Hash Changed (Modified)</text>
  <text x="305" y="315" class="d328b-text">• 1. Cascade delete old child chunks</text>
  <text x="305" y="340" class="d328b-text">• 2. Chunk, embed &amp; upsert new vectors</text>
  <text x="305" y="365" class="d328b-text">• 3. Update metadata store with new hash</text>
  
  <!-- Outcomes -->
  <rect x="580" y="110" width="280" height="270" class="d328b-card" />
  <text x="600" y="145" class="d328b-header" fill="#0f172a">Production Ingestion Guarantees</text>
  <text x="600" y="180" class="d328b-text">• **100% Idempotency:** Safe to replay</text>
  <text x="600" y="205" class="d328b-text">• **Zero Ghost Chunks:** Cascade deletes</text>
  <text x="600" y="230" class="d328b-text">• **Cost Minimization:** 90% indexing skips</text>
  <text x="600" y="255" class="d328b-text">• **Sub-Minute Freshness:** Fast sync</text>
  <text x="600" y="295" class="d328b-text" font-weight="600" fill="#1d4ed8">Status: Enterprise Ready</text>
</svg>