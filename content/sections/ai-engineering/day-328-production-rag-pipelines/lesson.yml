learning_promise: 'Master production-grade ingestion pipelines: implement idempotent content hashing,
  document deduplication, change-data-capture (CDC) incremental indexing, and vector cache invalidation
  in Python.'
objectives:
- Architect asynchronous document ingestion queues decoupling webhooks/uploads from embedding computation
  and vector upsert.
- Implement Content Hashing (SHA-256) and Idempotent Deduplication eliminating redundant vector indexing
  runs.
- Design Incremental Indexing and Soft-Delete synchronization maintaining exact parity between source
  documents and vector stores.
- Build a production-grade Ingestion & Freshness Pipeline Engine in Python supporting batch processing,
  dead-letter queues, and status metrics.
- Evaluate vector index update latency, transaction safety, and rollback mechanisms.
