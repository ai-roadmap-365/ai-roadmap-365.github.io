terms:
- term: Headless Agent
  definition: A coding agent running autonomously in CLI/CI environments without a graphical user interface.
- term: Issue-to-Patch Pipeline
  definition: An automated workflow converting a GitHub issue description into a verified git pull request.
- term: Ephemeral Runner
  definition: A short-lived, disposable container or virtual machine spun up to execute a single CI job.
- term: Line-Level PR Comment
  definition: A GitHub review comment attached directly to a specific modified line in a diff hunk.
- term: Bug Reproduction Harness
  definition: An automated script that validates a bug exists by asserting test failure before patching.
- term: Webhook Dispatcher
  definition: A service receiving GitHub webhook events (issues, comments) and launching agent tasks.
- term: SWE-agent
  definition: An open-source headless agent architecture designed specifically for resolving GitHub issues.
- term: Sandboxed Execution
  definition: Isolating agent processes from local host filesystems and production network networks.
