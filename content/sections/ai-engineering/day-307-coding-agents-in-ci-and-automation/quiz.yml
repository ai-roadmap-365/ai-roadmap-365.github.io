questions:
- question: What is a 'Headless Coding Agent' in CI/CD automation?
  options:
  - A type of CSS framework
  - A computer without a monitor
  - A broken software program
  - 'A headless agent triggered by CI webhooks'
  answer_index: 3
  explanation: Headless agents operate asynchronously in CI/CD environments without human graphical UI
    interactions.
- question: What security isolation measure is mandatory when executing headless coding agents on untrusted
    open-source pull requests?
  options:
  - 'Run it in an isolated container with no secrets'
  - Running the agent with root permissions on production database servers
  - Deleting the git repository
  - Disabling all firewall rules
  answer_index: 0
  explanation: Ephemeral container sandboxes prevent malicious code execution or secret exfiltration during
    automated CI agent runs.
- question: How should an automated CI code review agent post findings to GitHub?
  options:
  - Post a 50-page unformatted email to all employees
  - 'Post line-level review comments on the diff'
  - Delete the pull request
  - Force merge the branch automatically
  answer_index: 1
  explanation: Line-level review comments anchored to diff hunks provide direct, actionable feedback to
    developers.
- question: What is the primary role of the 'Reproduce' step in an automated issue-to-patch pipeline?
  options:
  - To make the build slower
  - 'To duplicate all of the files in the repository first'
  - 'To reproduce the bug with a failing test first'
  - To restart the CI server
  answer_index: 2
  explanation: Reproducing the bug with a failing test ensures the agent has a verifiable target before
    writing fixes.
- question: Which GitHub Actions event trigger is most suitable for launching an autonomous issue-fixing
    agent?
  options:
  - '`watch: [started]`'
  - '`star: [created]`'
  - '`fork: [created]`'
  - 'On an issue being labelled'
  answer_index: 3
  explanation: Label-based triggers allow maintainers to selectively dispatch agents to well-scoped issues
    with human approval.
