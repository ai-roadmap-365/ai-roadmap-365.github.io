<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Automated Issue to PR Lifecycle">
  <title>Automated Issue to PR Lifecycle</title>
  <defs>
    <style>
      .d307f-bg { fill: #f8fafc; }
      .d307f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d307f-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d307f-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d307f-green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d307f-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d307f-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d307f-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d307f-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .d307f-arrow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d307f-bg" />
  
  <text x="40" y="40" class="d307a-title">Lifecycle: From GitHub Issue Description to Verified Pull Request</text>
  <text x="40" y="65" class="d307a-subtitle">Automated Issue to PR Lifecycle showing Issue Tagged, Git Branch Checkout, Bug Reproduction Test Red, Patch Application Green, and Draft PR Push</text>
  
  <!-- Step 1: Ingest Issue -->
  <rect x="40" y="110" width="180" height="260" class="d307f-step" />
  <text x="55" y="140" class="d307f-header" fill="#1d4ed8">1. Issue Ingestion</text>
  <text x="55" y="170" class="d307f-text">• Parses issue title</text>
  <text x="55" y="190" class="d307f-text">• Parses error logs</text>
  <text x="55" y="210" class="d307f-text">• Creates git branch</text>
  <text x="55" y="240" class="d307f-text" font-weight="600">Branch Name:</text>
  <text x="55" y="260" class="d307f-text">`ai-agent/issue-89`</text>
  
  <!-- Step 2: Reproduce Red -->
  <rect x="250" y="110" width="180" height="260" class="d307f-red" />
  <text x="265" y="140" class="d307f-header" fill="#b91c1c">2. Reproduce (Red)</text>
  <text x="265" y="170" class="d307f-text">• Writes repro test</text>
  <text x="265" y="190" class="d307f-text">• Runs `pytest tests/`</text>
  <text x="265" y="210" class="d307f-text">• Asserts test FAILS</text>
  <text x="265" y="240" class="d307f-text" font-weight="600">Verification:</text>
  <text x="265" y="260" class="d307f-text">Confirms bug is real</text>
  
  <!-- Step 3: Implement Green -->
  <rect x="460" y="110" width="180" height="260" class="d307f-green" />
  <text x="475" y="140" class="d307f-header" fill="#15803d">3. Patch (Green)</text>
  <text x="475" y="170" class="d307f-text">• Modifies source code</text>
  <text x="475" y="190" class="d307f-text">• Runs `pytest tests/`</text>
  <text x="475" y="210" class="d307f-text">• Asserts test PASSES</text>
  <text x="475" y="240" class="d307f-text" font-weight="600">Self-Heals:</text>
  <text x="475" y="260" class="d307f-text">Iterates if failed</text>
  
  <!-- Step 4: Submit PR -->
  <rect x="670" y="110" width="190" height="260" class="d307f-card" />
  <text x="685" y="140" class="d307f-header">4. Commit &amp; PR</text>
  <text x="685" y="170" class="d307f-text">• Generates commit msg</text>
  <text x="685" y="190" class="d307f-text">• Pushes branch to origin</text>
  <text x="685" y="210" class="d307f-text">• Opens PR with summary</text>
  <text x="685" y="240" class="d307f-text" font-weight="600">Summary Format:</text>
  <text x="685" y="260" class="d307f-text">Diffs, tests, rationale</text>
</svg>