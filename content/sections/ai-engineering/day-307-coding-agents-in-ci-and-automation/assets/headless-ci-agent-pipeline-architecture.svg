<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Headless CI Agent Pipeline Architecture">
  <title>Headless CI Agent Pipeline Architecture</title>
  <defs>
    <style>
      .d307a-bg { fill: #f8fafc; }
      .d307a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d307a-ev { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d307a-box { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d307a-test { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d307a-pr { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 8px; }
      .d307a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d307a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d307a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d307a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d307a-bg" />
  
  <text x="40" y="40" class="d307a-title">Headless CI/CD Autonomous Agent Architecture</text>
  <text x="40" y="65" class="d307a-subtitle">Headless CI Agent Pipeline Architecture showing GitHub Webhook Event, Ephemeral Sandbox Container, Agent Reasoning Loop, Test Verification Gate, and Pull Request Output</text>
  
  <!-- 1. Webhook Event -->
  <rect x="40" y="110" width="180" height="260" class="d307a-ev" />
  <text x="55" y="140" class="d307a-header" fill="#1d4ed8">1. Event Trigger</text>
  <text x="55" y="170" class="d307a-text">• Issue labeled: `ai-fix`</text>
  <text x="55" y="190" class="d307a-text">• PR opened for review</text>
  <text x="55" y="210" class="d307a-text">• Nightly bug triage</text>
  <text x="55" y="240" class="d307a-text" font-weight="600">Transport:</text>
  <text x="55" y="260" class="d307a-text">GitHub Actions Webhook</text>
  
  <!-- 2. Ephemeral Sandbox -->
  <rect x="250" y="110" width="180" height="260" class="d307a-box" />
  <text x="265" y="140" class="d307a-header" fill="#7e22ce">2. Ephemeral Sandbox</text>
  <text x="265" y="170" class="d307a-text">• Docker container spawn</text>
  <text x="265" y="190" class="d307a-text">• Git clone repo branch</text>
  <text x="265" y="210" class="d307a-text">• Install virtualenv</text>
  <text x="265" y="240" class="d307a-text" font-weight="600">Security:</text>
  <text x="265" y="260" class="d307a-text">No prod secret access</text>
  
  <!-- 3. Reasoning & Patch Loop -->
  <rect x="460" y="110" width="180" height="260" class="d307a-test" />
  <text x="475" y="140" class="d307a-header" fill="#15803d">3. ReAct Patch Loop</text>
  <text x="475" y="170" class="d307a-text">• Reproduces bug (Red)</text>
  <text x="475" y="190" class="d307a-text">• Synthesizes fix (Green)</text>
  <text x="475" y="210" class="d307a-text">• Runs full pytest suite</text>
  <text x="475" y="240" class="d307a-text" font-weight="600">Verification:</text>
  <text x="475" y="260" class="d307a-text">100% test pass required</text>
  
  <!-- 4. Emits PR / Review -->
  <rect x="670" y="110" width="190" height="260" class="d307a-pr" />
  <text x="685" y="140" class="d307a-header" fill="#a16207">4. Pull Request Output</text>
  <text x="685" y="170" class="d307a-text">• Git push `fix/issue-14`</text>
  <text x="685" y="190" class="d307a-text">• Opens Draft Pull Request</text>
  <text x="685" y="210" class="d307a-text">• Attaches test run logs</text>
  <text x="685" y="240" class="d307a-text" font-weight="600">Human Gate:</text>
  <text x="685" y="260" class="d307a-text">Maintainer reviews &amp; merges</text>
</svg>