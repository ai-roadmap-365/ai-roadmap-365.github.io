visuals:
- id: headless-ci-agent-pipeline-architecture
  file: assets/headless-ci-agent-pipeline-architecture.svg
  type: diagram
  title: Headless CI Agent Pipeline Architecture
  alt: Headless CI Agent Pipeline Architecture showing GitHub Webhook Event, Ephemeral Sandbox Container,
    Agent Reasoning Loop, Test Verification Gate, and Pull Request Output
  description: System architecture diagram illustrating the headless CI/CD coding agent execution pipeline.
- id: automated-issue-to-pr-lifecycle
  file: assets/automated-issue-to-pr-lifecycle.svg
  type: diagram
  title: Automated Issue to PR Lifecycle
  alt: Automated Issue to PR Lifecycle showing Issue Tagged, Git Branch Checkout, Bug Reproduction Test
    Red, Patch Application Green, and Draft PR Push
  description: Lifecycle flowchart showing an end-to-end automated issue-to-pull-request resolution pipeline.
- id: issue-to-pr
  file: assets/issue-to-pr.svg
  type: diagram
  title: 'The issue-to-PR pipeline'
  alt: 'Diagram: the five phases of an automated issue-to-pull-request pipeline'
  description: 'A five-stage description of a headless CI agent pipeline covering triage, reproduction, repair, regression and draft submission.'
- id: interactive-or-headless
  file: assets/interactive-or-headless.svg
  type: diagram
  title: 'Interactive, or headless'
  alt: 'Diagram: an interactive coding agent compared with a headless CI agent'
  description: 'A two-column comparison of an interactive IDE agent against a headless agent triggered by repository events.'
- id: ci-agent-lineage
  file: assets/ci-agent-lineage.svg
  type: diagram
  title: 'Three phases of CI automation'
  alt: 'Diagram: the progression from lint gates to autonomous CI coding agents'
  description: 'A three-stage progression of CI automation from test and lint pipelines through static analysis bots to LLM-powered headless agents.'
- id: sandbox-hardening
  file: assets/sandbox-hardening.svg
  type: diagram
  title: 'Treating the runtime as hostile'
  alt: 'Diagram: the three controls hardening a CI agent''s execution sandbox'
  description: 'A three-stage description of CI sandbox hardening covering ephemeral microVM isolation, egress filtering and least-privilege tokens.'
- id: pit-crew
  file: assets/pit-crew.svg
  type: diagram
  title: 'An automated pit stop'
  alt: 'Diagram: a Formula 1 pit stop as an analogy for a headless CI agent run'
  description: 'A two-column comparison of an instrumented pit stop against an ad-hoc repair.'
- id: ci-agent-benefits
  file: assets/ci-agent-benefits.svg
  type: diagram
  title: 'Three bottlenecks removed'
  alt: 'Diagram: the three engineering bottlenecks headless CI agents relieve'
  description: 'A three-stage description of CI agent benefits covering routine review fatigue, backlog resolution and bundled regression tests.'
- id: triage-scoring
  file: assets/triage-scoring.svg
  type: diagram
  title: 'Triaging before dispatch'
  alt: 'Diagram: how automated triage routes issues between agents and humans'
  description: 'A three-stage description of issue triage covering complexity scoring, impact analysis and flaky test quarantine.'
- id: ci-agent-scale
  file: assets/ci-agent-scale.svg
  type: diagram
  title: 'Running this at scale'
  alt: 'Diagram: the components of a distributed CI agent infrastructure'
  description: 'A two-column comparison of a single-runner CI agent against a distributed queue-backed architecture.'
- id: dependency-remediation
  file: assets/dependency-remediation.svg
  type: diagram
  title: 'Automated vulnerability patching'
  alt: 'Diagram: an automated dependency remediation pipeline and its measured effect'
  description: 'A four-stage description of automated vulnerability remediation covering alert ingestion, dependency bump, integration testing and the resulting dwell time.'
- id: ci-agent-when
  file: assets/ci-agent-when.svg
  type: diagram
  title: 'What to dispatch, and what not to'
  alt: 'Diagram: when to deploy a headless CI coding agent'
  description: 'A two-column comparison of tasks suited to headless CI agents against those requiring human pairing.'
