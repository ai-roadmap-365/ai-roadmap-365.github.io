learning_promise: 'Deploy autonomous coding agents in continuous integration and automation pipelines:
  build automated pull request review bots, automated issue-to-patch pipelines, and headless CI self-healing
  runners.'
objectives:
- Architect headless CI/CD agent workflows triggered by GitHub webhooks and issue events.
- Implement automated pull request code reviews generating contextual diff comments and security findings.
- Build an autonomous Issue Resolver that clones repositories, reproduces failing tests, applies patches,
  and pushes branch commits.
- Configure sandbox security constraints, ephemeral runner environments, and rate-limiting gates.
- Construct a Headless CI Coding Agent Runner in Python.
