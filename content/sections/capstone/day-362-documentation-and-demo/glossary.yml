terms:
  - term: Documentation Drift
    definition: The gradual divergence between what documentation says and what a system does, caused by
      changes that touch the code and not the prose.
  - term: Checkable Documentation
    definition: Documentation whose factual claims — commands, outputs, sections — can be verified by a
      program rather than trusted.
  - term: Claimed Output
    definition: Output a document says a command produces, which can be compared against what was
      actually captured from running it.
  - term: Placeholder Text
    definition: Unfinished writing such as "TBD" or "coming soon", which tells a reader the document was
      abandoned.
  - term: Known Limitation
    definition: A constraint the author is aware of. Valuable only when stated, since an unstated one is
      discovered by a reader at the worst moment.
  - term: Docs as Code
    definition: Keeping documentation in the repository, reviewed and built with the code. Makes it
      reviewable, but not verifiable.
  - term: Doctest
    definition: A documentation example that is executed as a test, so a wrong example fails a build.
      Covers code examples rather than commands or claims.
  - term: Warn versus Fail
    definition: The distinction between incompleteness, worth knowing, and wrongness, worth blocking on.
      Blocking on the former gets a gate disabled.
  - term: Reproducible Claim
    definition: A performance or capability statement with the machine, corpus and conditions attached,
      so a reader can compare it against their own situation.
  - term: Terminal Recording
    definition: A demo captured as text rather than video, so it is small, copy-pasteable and diffable.
