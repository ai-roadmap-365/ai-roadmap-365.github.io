<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them is checked.">
  <title>Why prose drifts and code does not</title>
  <style>
    .drift-has-a-cause-bg   { fill: #f8fafc; }
    .drift-has-a-cause-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-has-a-cause-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-has-a-cause-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-has-a-cause-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-has-a-cause-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .drift-has-a-cause-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-has-a-cause-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .drift-has-a-cause-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .drift-has-a-cause-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .drift-has-a-cause-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .drift-has-a-cause-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .drift-has-a-cause-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .drift-has-a-cause-row { opacity: 1; }
    .drift-has-a-cause-r0 { animation-delay: 0.00s; }
    .drift-has-a-cause-r1 { animation-delay: 0.45s; }
    .drift-has-a-cause-r2 { animation-delay: 0.90s; }
    .drift-has-a-cause-r3 { animation-delay: 1.35s; }
    .drift-has-a-cause-r4 { animation-delay: 1.80s; }
    .drift-has-a-cause-row { animation: drift-has-a-cause-reveal 7.3s ease-in-out infinite; }
    @keyframes drift-has-a-cause-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="drift-has-a-cause-bg" width="980" height="390"/>
  <text class="drift-has-a-cause-h1"  x="30" y="40">Why prose drifts and code does not</text>
  <text class="drift-has-a-cause-sub" x="30" y="64">One of them is checked.</text>
  <rect class="drift-has-a-cause-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="drift-has-a-cause-name" x="46" y="122">Code</text>
  <text class="drift-has-a-cause-desc" x="46" y="142">Checked continuously.</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r0" x="46" y="182">Tests fail when it is wrong</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r1" x="46" y="216">A rename breaks the build</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r2" x="46" y="250">Wrongness is loud and immediate</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r3" x="46" y="284">Nobody has to remember</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r4" x="46" y="318">Correctness is enforced</text>
  <rect class="drift-has-a-cause-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="drift-has-a-cause-name" x="526" y="122">Documentation</text>
  <text class="drift-has-a-cause-desc" x="526" y="142">Maintained by good intentions.</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r0" x="526" y="182">Nothing fails when it is wrong</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r1" x="526" y="216">A rename leaves the README behind</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r2" x="526" y="250">Wrongness is silent for months</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r3" x="526" y="284">Someone has to remember</text>
  <text class="drift-has-a-cause-desc drift-has-a-cause-row drift-has-a-cause-r4" x="526" y="318">The one person who would notice no longer reads it</text>
  <text class="drift-has-a-cause-sub" x="30" y="372">That last row is the mechanism: the author cannot see the drift because they stopped reading the document, and the reader cannot tell drift from a mistake of their own.</text>
</svg>
