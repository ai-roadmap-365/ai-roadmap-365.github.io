<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because an annoying gate gets disabled.">
  <title>Fail on wrong, warn on incomplete</title>
  <style>
    .fail-or-warn-bg   { fill: #f8fafc; }
    .fail-or-warn-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-or-warn-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-or-warn-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-or-warn-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-or-warn-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-or-warn-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fail-or-warn-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fail-or-warn-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fail-or-warn-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fail-or-warn-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fail-or-warn-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fail-or-warn-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fail-or-warn-row { opacity: 1; }
    .fail-or-warn-r0 { animation-delay: 0.00s; }
    .fail-or-warn-r1 { animation-delay: 0.45s; }
    .fail-or-warn-r2 { animation-delay: 0.90s; }
    .fail-or-warn-r3 { animation-delay: 1.35s; }
    .fail-or-warn-r4 { animation-delay: 1.80s; }
    .fail-or-warn-row { animation: fail-or-warn-reveal 7.3s ease-in-out infinite; }
    @keyframes fail-or-warn-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fail-or-warn-bg" width="980" height="390"/>
  <text class="fail-or-warn-h1"  x="30" y="40">Fail on wrong, warn on incomplete</text>
  <text class="fail-or-warn-sub" x="30" y="64">Because an annoying gate gets disabled.</text>
  <rect class="fail-or-warn-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fail-or-warn-name" x="46" y="122">Fail</text>
  <text class="fail-or-warn-desc" x="46" y="142">It will actively mislead.</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r0" x="46" y="182">A documented command that does not exist</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r1" x="46" y="216">A claimed output that no longer matches</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r2" x="46" y="250">A required section missing entirely</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r3" x="46" y="284">Placeholder text still in place</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r4" x="46" y="318">A known limitation left unstated</text>
  <rect class="fail-or-warn-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fail-or-warn-name" x="526" y="122">Warn</text>
  <text class="fail-or-warn-desc" x="526" y="142">Worth knowing, not worth blocking.</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r0" x="526" y="182">A provided command nobody documented</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r1" x="526" y="216">Incompleteness rather than wrongness</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r2" x="526" y="250">The reader is not misled by absence</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r3" x="526" y="284">Blocking here makes the gate annoying</text>
  <text class="fail-or-warn-desc fail-or-warn-row fail-or-warn-r4" x="526" y="318">And an annoying gate gets switched off</text>
  <text class="fail-or-warn-sub" x="30" y="372">This is the same design rule as yesterday's alerting: the cost of a false alarm is not the alarm, it is that people stop believing the channel it arrives on.</text>
</svg>
