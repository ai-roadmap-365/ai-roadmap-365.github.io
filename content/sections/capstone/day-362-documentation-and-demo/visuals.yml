visuals:
  - id: documentation-drift
    file: assets/documentation-drift.svg
    type: diagram
    title: What Documentation Drift Looks Like
    alt: What Documentation Drift Looks Like showing a README that was correct at write time diverging
      from a project that kept changing
    description: Two diverging lines over time, the project changing and the README not, with the point
      at which the gap stops being incompleteness and becomes wrongness.
  - id: six-questions
    file: assets/six-questions.svg
    type: diagram
    title: The Six Questions a Reader Has
    alt: The Six Questions a Reader Has showing the sections that answer them and which of those can be
      checked by a program
    description: Six reader questions in the order they arise, marking which answers a program can
      verify and which need a person.
  - id: six-questions-order
    file: assets/six-questions-order.svg
    type: diagram
    title: 'Six questions, in the order they arrive'
    alt: 'Diagram: the six questions a README answers, in the order a reader has them'
    description: 'A six-stage description of the questions a README must answer, from what the project does through to what to do when it breaks.'
  - id: drift-has-a-cause
    file: assets/drift-has-a-cause.svg
    type: diagram
    title: 'Why prose drifts and code does not'
    alt: 'Diagram: why code stays correct while documentation drifts'
    description: 'A two-column comparison of code, which is verified by tests, against documentation, which is maintained by intention alone.'
  - id: docs-eras
    file: assets/docs-eras.svg
    type: diagram
    title: 'Four attempts at keeping docs true'
    alt: 'Diagram: the progression from literate programming to executable documentation'
    description: 'A four-stage progression from literate programming through docs-as-code and doctests to README conventions, and what each did and did not solve.'
  - id: docs-are-not-code
    file: assets/docs-are-not-code.svg
    type: diagram
    title: 'Not a description of the code'
    alt: 'Diagram: what documentation is for compared with what it is often mistaken for'
    description: 'A two-column comparison of what documentation should provide against three common misconceptions about its purpose.'
  - id: checker-pipeline
    file: assets/checker-pipeline.svg
    type: diagram
    title: 'How the checker works'
    alt: 'Diagram: extracting project facts and checking the README against them'
    description: 'A five-stage description of a documentation checker covering command extraction from tagged blocks, output matching by convention, and the five checks it performs.'
  - id: fail-or-warn
    file: assets/fail-or-warn.svg
    type: diagram
    title: 'Fail on wrong, warn on incomplete'
    alt: 'Diagram: which documentation problems should block and which should only warn'
    description: 'A two-column comparison of documentation defects that should fail a check against gaps that should only produce a warning.'
  - id: recipe-analogy
    file: assets/recipe-analogy.svg
    type: diagram
    title: 'A recipe given to a friend'
    alt: 'Diagram: a recipe that assumes the author''s knowledge compared with one that does not'
    description: 'A two-column comparison of a recipe written from the author''s assumptions against one that states quantities, conditions and how to tell success.'
  - id: drifted-readme
    file: assets/drifted-readme.svg
    type: diagram
    title: 'Five ordinary failures'
    alt: 'Diagram: the five ways a drifted README misleads a reader'
    description: 'A five-stage walkthrough of a drifted README covering renamed commands, a stale claimed output, placeholder sections and a deleted limitations section.'
  - id: docs-implications
    file: assets/docs-implications.svg
    type: diagram
    title: 'Five things documentation leaks or claims'
    alt: 'Diagram: the security, privacy, performance, scalability and cost implications of documentation'
    description: 'A five-stage description of documentation implications covering accidental disclosure, demo data, attaching conditions to performance claims, stating what was tested, and publishing running cost.'
  - id: one-readme-or-a-site
    file: assets/one-readme-or-a-site.svg
    type: diagram
    title: 'One README, or a documentation site'
    alt: 'Diagram: a single README compared with a generated documentation site'
    description: 'A two-column comparison of keeping one Markdown README against building a generated documentation site, for a capstone-scale project.'
  - id: demo-versus-test
    file: assets/demo-versus-test.svg
    type: diagram
    title: 'A demo is not a test'
    alt: 'Diagram: a test compared with a demo'
    description: 'A two-column comparison of an automated test against a live demonstration, by audience, what each proves, and what happens when it is never run.'
  - id: when-to-document
    file: assets/when-to-document.svg
    type: diagram
    title: 'When to write it, and how much'
    alt: 'Diagram: when documentation and its checks are worth the effort'
    description: 'A two-column comparison of when to invest in documentation and checking against when a lighter treatment is proportionate.'
