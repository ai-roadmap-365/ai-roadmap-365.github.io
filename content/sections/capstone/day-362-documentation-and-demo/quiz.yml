questions:
  - question: Why does documentation drift, and why does the author rarely notice?
    options:
      - Because documentation formats change between tool versions
      - Because renaming a command or changing an output touches no test and no README, and the one
        person who could spot the divergence is the author — who no longer reads it
      - Because readers edit documentation without telling the author
      - Because Markdown does not support versioning
    answer_index: 1
    explanation: Code has tests; prose has good intentions. The fix is to make the prose checkable so
      drift fails a gate rather than accumulating silently.
  - question: Why must an untagged fenced block be treated as output rather than as a command?
    options:
      - Because untagged blocks are not rendered by most Markdown engines
      - Because otherwise the extractor reads captured output back as instructions, and the checker
        reports the document's own examples as commands that do not exist
      - Because shell commands require syntax highlighting to run
      - Because untagged blocks cannot contain shell syntax
    answer_index: 1
    explanation: This lab had exactly that bug before its tests caught it. A tagged block is an
      instruction someone will paste; an untagged one is what the instruction printed.
  - question: Why is an undocumented command a warning while a wrongly documented one is a failure?
    options:
      - Because warnings are easier to implement
      - Because an undocumented command is a gap — the reader simply does not learn about it — whereas a
        wrongly documented one actively misleads, and blocking on incompleteness makes the gate annoying
        enough to be disabled
      - Because undocumented commands are usually internal
      - Because failures require a remediation and warnings do not
    answer_index: 1
    explanation: Wrongness wastes the reader's time and teaches them not to trust the document.
      Incompleteness is worth knowing and not worth blocking on.
  - question: Why does a demo that hides its limitations cost more trust than it gains?
    options:
      - Because reviewers always ask about limitations
      - Because the person who discovers the limitation will discover it at the worst moment, and will
        then re-read everything else you wrote with suspicion
      - Because hiding limitations violates open-source licences
      - Because limitations sections improve search ranking
    answer_index: 1
    explanation: Stating limitations is what makes the rest of the document credible. It costs the least
      and buys the most.
  - question: What makes "answers in under a second" a weaker claim than a p95 figure?
    options:
      - It uses fewer words
      - Because it states no machine, no corpus size and no percentile, so it is an impression rather
        than a measurement a reader can compare against their own situation
      - Because a second is too long to be impressive
      - Because p95 is the only percentile anyone reports
    answer_index: 1
    explanation: A p95 of 840 ms over 200 requests on a 2023 laptop with a 5,000-document corpus is
      a claim someone can check against their own situation. The other is a feeling.
