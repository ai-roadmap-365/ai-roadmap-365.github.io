title: Documentation and Demo
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Make documentation checkable rather than merely reviewable — verify that every documented
  command exists, that every claimed output matches a real capture, that required sections are present
  and that known limitations are stated — so a README drifts into a failing gate rather than into
  quietly misleading every reader.'
objectives:
  - Identify the six questions a new reader has, and which of them a program can verify.
  - Explain why documentation drifts and why the author is the last to notice.
  - Extract commands and claimed outputs from a README, distinguishing instructions from output.
  - Justify treating an undocumented command as a warning and a wrongly documented one as a failure.
  - Argue why stating limitations makes the rest of a document credible.
