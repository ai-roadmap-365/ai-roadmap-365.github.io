title: Capstone Retrospective
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Extract findings from your capstone that transfer to the next project: compute how
  wrong your estimates were and in which direction, check whether that error is uniform or concentrated
  in one kind of work, rank every incident by where it was caught, and name the specific gate that
  would have caught each one that reached a user.'
objectives:
  - Compute a calibration ratio from a project record and explain why the median is used.
  - Distinguish a uniform estimation error from a concentrated one, and why the fix differs.
  - Explain why an overall median can be a poor predictor of the tasks it covers.
  - Rank incidents by detection stage and identify which ones escaped to production.
  - Turn each escaped incident into a named gate rather than a general intention.
