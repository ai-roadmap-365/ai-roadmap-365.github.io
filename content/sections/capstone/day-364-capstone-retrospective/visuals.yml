visuals:
  - id: where-the-error-was
    file: assets/where-the-error-was.svg
    type: diagram
    title: Where the Estimation Error Actually Was
    alt: Where the Estimation Error Actually Was showing a project median that looks acceptable while
      one area is well estimated and another is three times over
    description: The same project record read two ways — an overall median of 1.20x that looks like a
      well-run project, and the per-area medians of 1.15x and 3.33x that it is the average of.
  - id: where-incidents-were-caught
    file: assets/where-incidents-were-caught.svg
    type: diagram
    title: Where Incidents Were Caught
    alt: Where Incidents Were Caught showing five detection stages ordered by cost, with the two that
      reached production marked as where next project's effort belongs
    description: Five detection stages from review through to a user finding it, with the two escapes
      and the specific gate that would have caught each.
  - id: three-numbers
    file: assets/three-numbers.svg
    type: diagram
    title: 'Three numbers and one paragraph'
    alt: 'Diagram: the three measurements and the written finding a retrospective produces'
    description: 'A four-stage description of a retrospective producing a calibration ratio, a per-area spread, a detection ranking, and a written gate finding per escaped incident.'
  - id: transfers-or-not
    file: assets/transfers-or-not.svg
    type: diagram
    title: 'What transfers and what does not'
    alt: 'Diagram: retrospective findings that transfer to the next project compared with those that do not'
    description: 'A two-column comparison of retrospective findings that change a future decision against findings that describe the past without implying an action.'
  - id: retro-eras
    file: assets/retro-eras.svg
    type: diagram
    title: 'How reviews became usable'
    alt: 'Diagram: the progression from formal post-mortems to calibrated estimation'
    description: 'A four-stage progression from formal project post-mortems through blameless review and agile retrospectives to estimation calibration research.'
  - id: median-not-mean
    file: assets/median-not-mean.svg
    type: diagram
    title: 'Median, not mean'
    alt: 'Diagram: a median compared with a mean over task overrun ratios'
    description: 'A two-column comparison of using a median against a mean to summarise estimation error across tasks with one extreme value.'
  - id: retro-procedure
    file: assets/retro-procedure.svg
    type: diagram
    title: 'The procedure, in order'
    alt: 'Diagram: the six steps of computing a retrospective from project records'
    description: 'A six-stage procedure covering recording tasks, computing per-task and overall ratios, comparing areas, ranking incidents by detection stage, naming gates, and producing sentences.'
  - id: runner-splits
    file: assets/runner-splits.svg
    type: diagram
    title: 'A runner reviewing a race'
    alt: 'Diagram: reviewing a race by overall pace compared with reviewing it by split times'
    description: 'A two-column comparison of reviewing a race by its average pace against reviewing it by kilometre splits, as an analogy for per-area calibration.'
  - id: hidden-multiplier
    file: assets/hidden-multiplier.svg
    type: diagram
    title: 'The median that fits no task'
    alt: 'Diagram: how an acceptable overall calibration hides two very different areas'
    description: 'A four-stage walkthrough showing a project median of 1.20 concealing familiar work at 1.15 and unfamiliar work at 3.33, and what follows for future estimates.'
  - id: escape-to-backlog
    file: assets/escape-to-backlog.svg
    type: diagram
    title: 'From escape to backlog item'
    alt: 'Diagram: converting an escaped incident into a specific gate for the next project'
    description: 'A four-stage conversion of escaped incidents into concrete controls, showing two production escapes each mapped to a specific gate.'
  - id: retro-implications
    file: assets/retro-implications.svg
    type: diagram
    title: 'Five consequences of measuring'
    alt: 'Diagram: the security, privacy, performance, practice and cost implications of a retrospective'
    description: 'A five-stage description of retrospective implications covering escaped incidents as missing controls, quoting user data, not conflating schedule with system performance, the small cost of records, and attaching money to findings.'
  - id: retro-versus-postmortem
    file: assets/retro-versus-postmortem.svg
    type: diagram
    title: 'A retrospective is not a post-mortem'
    alt: 'Diagram: a project retrospective compared with an incident post-mortem'
    description: 'A two-column comparison of a project-wide retrospective against a single-incident post-mortem, by scope, timing and output.'
  - id: when-to-retro
    file: assets/when-to-retro.svg
    type: diagram
    title: 'When it is worth doing'
    alt: 'Diagram: when a retrospective earns its cost, and what not to skip'
    description: 'A two-column comparison of when to run a retrospective against when to skip it, and the two findings most often softened.'
