questions:
  - question: A project's median estimation ratio is 1.20x. Why might that number be useless as a
      prediction for the next task?
    options:
      - Because a sample of one project is never enough to predict anything
      - Because 1.20x is within normal variance and therefore not a finding
      - Because estimation ratios should always be reported as percentages
      - 'It can average two populations that behave differently'
    answer_index: 3
    explanation: The overall median is a real number about the project and a poor description of any
      task in it. Splitting by area is what shows whether the error is uniform.
  - question: Why does calibration use the median of the task ratios rather than the mean?
    options:
      - 'One eight-fold overrun would dominate a mean'
      - Because the median is faster to compute on large projects
      - Because means require a normal distribution and ratios are always normal
      - Because the mean cannot be computed when any estimate is zero
    answer_index: 0
    explanation: Duration ratios are skewed by a small number of very bad tasks. The median describes
      the typical task, which is what you are trying to predict.
  - question: Why rank incidents by where they were caught rather than simply counting them?
    options:
      - Because counting incidents is impossible without a tracker
      - 'The same defect costs more the further right it escapes'
      - Because incidents caught in review are not real incidents
      - Because a lower count is always the goal of a retrospective
    answer_index: 1
    explanation: Every incident was caught somewhere. A bug found in review and the same bug found by a
      user are identical in count and completely different in cost.
  - question: Why is "no gate would have caught this" a legitimate finding rather than a failure to
      analyse?
    options:
      - Because it means the incident was somebody else's fault
      - Because unknown incidents do not need to be recorded at all
      - 'An invented control prevents nothing'
      - Because it proves the existing gates are already sufficient
    answer_index: 2
    explanation: Hindsight makes almost everything look preventable. The honest test is what you would
      have needed to know at the time to justify building the gate before the incident.
  - question: Why is knowing how wrong your estimates are more useful than becoming a better estimator?
    options:
      - Because estimation skill cannot be improved by anyone
      - Because a calibrated estimate is guaranteed to be correct
      - Because managers only ever ask for the multiplier
      - 'Calibration is measurable now; intuition is slow'
    answer_index: 3
    explanation: Calibration turns your own history into a correction you can apply today. It does not
      require your next intuition to be any better than your last one.
