terms:
  - term: Retrospective
    definition: The extraction of transferable findings from a completed project. Distinct from a
      status report, which describes what happened without saying what it implies.
  - term: Calibration
    definition: How wrong your estimates are and in which direction, expressed as actual divided by
      estimated. Knowing it is a different skill from estimating accurately, and an easier one.
  - term: Estimation Ratio
    definition: Actual hours over estimated hours for one task. 1.0 is exact, 2.0 means the task took
      twice as long as predicted.
  - term: Uniform Error
    definition: An estimation error spread evenly across areas of work. It can be corrected with a
      single multiplier applied to the next estimate.
  - term: Concentrated Error
    definition: An estimation error that lives in one kind of work — typically the unfamiliar kind. The
      overall median hides it, and no single multiplier fixes it.
  - term: Detection Stage
    definition: Where an incident was caught — review, tests, staging, monitoring or a user — ordered
      by how much the fix cost at that point.
  - term: Escaped Incident
    definition: One that reached production, whether a signal or a person found it. These are the
      incidents worth spending the next project's effort on.
  - term: Preventable Escape
    definition: An escaped incident for which a specific gate can be named. Distinguishing these from
      genuine unknowns is what stops a retrospective becoming a list of intentions.
  - term: Blameless Review
    definition: A review that asks what made an outcome possible rather than who caused it. Naming
      individuals produces defensive accounts and therefore unreliable data.
  - term: Planning Fallacy
    definition: The systematic tendency to underestimate how long a task will take, identified by
      Kahneman and Tversky, and consistently worse for work you have not done before.
  - term: Hindsight Bias
    definition: The tendency to see an outcome as more predictable after it happened. In a
      retrospective it shows up as every escape looking preventable.
