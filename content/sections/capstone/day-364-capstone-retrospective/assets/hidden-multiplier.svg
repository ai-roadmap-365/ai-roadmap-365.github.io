<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="1.20x is an average of two populations.">
  <title>The median that fits no task</title>
  <style>
    .hidden-multiplier-bg   { fill: #f8fafc; }
    .hidden-multiplier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hidden-multiplier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hidden-multiplier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hidden-multiplier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hidden-multiplier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hidden-multiplier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hidden-multiplier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hidden-multiplier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hidden-multiplier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hidden-multiplier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hidden-multiplier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hidden-multiplier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hidden-multiplier-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hidden-multiplier-stage { opacity: 1; }

    .hidden-multiplier-s0 { animation-delay: 0.00s; }
    .hidden-multiplier-e0 { animation-delay: 0.00s; }
    .hidden-multiplier-s1 { animation-delay: 1.28s; }
    .hidden-multiplier-e1 { animation-delay: 1.28s; }
    .hidden-multiplier-s2 { animation-delay: 2.56s; }
    .hidden-multiplier-e2 { animation-delay: 2.56s; }
    .hidden-multiplier-s3 { animation-delay: 3.84s; }
    .hidden-multiplier-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hidden-multiplier-conn  { animation: hidden-multiplier-trace 6.4s ease-in-out infinite; }
      .hidden-multiplier-stage { animation: hidden-multiplier-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hidden-multiplier-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hidden-multiplier-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hidden-multiplier-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hidden-multiplier-stage { animation: hidden-multiplier-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hidden-multiplier-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hidden-multiplier-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hidden-multiplier-bg" width="980" height="322"/>
  <text class="hidden-multiplier-h1"  x="30" y="40">The median that fits no task</text>
  <text class="hidden-multiplier-sub" x="30" y="64">1.20x is an average of two populations.</text>
  <g class="hidden-multiplier-stage hidden-multiplier-s0">
    <rect class="hidden-multiplier-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hidden-multiplier-step" x="44" y="142">01</text>
    <text class="hidden-multiplier-name" x="70" y="142">Median 1.20x</text>
    <text class="hidden-multiplier-desc" x="44" y="166">Looks like a well-run project.</text>
    <text class="hidden-multiplier-desc" x="44" y="182">Twenty percent over is within</text>
    <text class="hidden-multiplier-desc" x="44" y="198">tolerance.</text>
    <text class="hidden-multiplier-edge" x="44" y="242">reassuring</text>
  </g>
  <line class="hidden-multiplier-line hidden-multiplier-conn hidden-multiplier-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hidden-multiplier-tip)"/>
  <g class="hidden-multiplier-stage hidden-multiplier-s1">
    <rect class="hidden-multiplier-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hidden-multiplier-step" x="280" y="142">02</text>
    <text class="hidden-multiplier-name" x="306" y="142">Familiar work: 1.15x</text>
    <text class="hidden-multiplier-desc" x="280" y="166">Genuinely well estimated.</text>
  </g>
  <line class="hidden-multiplier-line hidden-multiplier-conn hidden-multiplier-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hidden-multiplier-tip)"/>
  <g class="hidden-multiplier-stage hidden-multiplier-s2">
    <rect class="hidden-multiplier-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hidden-multiplier-step" x="516" y="142">03</text>
    <text class="hidden-multiplier-name" x="542" y="142">Unfamiliar work: 3.33x</text>
    <text class="hidden-multiplier-desc" x="516" y="166">There is no task for which 1.20x</text>
    <text class="hidden-multiplier-desc" x="516" y="182">was the right multiplier.</text>
    <text class="hidden-multiplier-edge" x="516" y="242">3x out</text>
  </g>
  <line class="hidden-multiplier-line hidden-multiplier-conn hidden-multiplier-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hidden-multiplier-tip)"/>
  <g class="hidden-multiplier-stage hidden-multiplier-s3">
    <rect class="hidden-multiplier-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hidden-multiplier-step" x="752" y="142">04</text>
    <text class="hidden-multiplier-name" x="778" y="142">So the finding is not "I underestimate"</text>
    <text class="hidden-multiplier-desc" x="752" y="166">It is: I estimate new work by a</text>
    <text class="hidden-multiplier-desc" x="752" y="182">factor of three.</text>
    <text class="hidden-multiplier-edge" x="752" y="242">actionable</text>
  </g>
  <text class="hidden-multiplier-sub" x="30" y="304">The projection table the tool prints is wrong for exactly the tasks you most need it for: applied to unfamiliar work it predicts 4.8 hours where the record says 13. The tool computes it; knowing when not to use it is the lesson.</text>
</svg>
