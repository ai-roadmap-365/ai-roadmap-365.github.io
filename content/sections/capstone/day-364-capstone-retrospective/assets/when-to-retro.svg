<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the part not to round off.">
  <title>When it is worth doing</title>
  <style>
    .when-to-retro-bg   { fill: #f8fafc; }
    .when-to-retro-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-retro-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-retro-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-retro-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-retro-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .when-to-retro-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-retro-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .when-to-retro-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .when-to-retro-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .when-to-retro-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .when-to-retro-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .when-to-retro-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .when-to-retro-row { opacity: 1; }
    .when-to-retro-r0 { animation-delay: 0.00s; }
    .when-to-retro-r1 { animation-delay: 0.45s; }
    .when-to-retro-r2 { animation-delay: 0.90s; }
    .when-to-retro-r3 { animation-delay: 1.35s; }
    .when-to-retro-r4 { animation-delay: 1.80s; }
    .when-to-retro-row { animation: when-to-retro-reveal 7.3s ease-in-out infinite; }
    @keyframes when-to-retro-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="when-to-retro-bg" width="980" height="390"/>
  <text class="when-to-retro-h1"  x="30" y="40">When it is worth doing</text>
  <text class="when-to-retro-sub" x="30" y="64">And the part not to round off.</text>
  <rect class="when-to-retro-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-retro-name" x="46" y="122">Do it</text>
  <text class="when-to-retro-desc" x="46" y="142">While details are available.</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r0" x="46" y="182">Actual hours decay within weeks</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r1" x="46" y="216">So does what you were thinking</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r2" x="46" y="250">Do it even when it went well</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r3" x="46" y="284">"Keep doing this" is a finding</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r4" x="46" y="318">Enough tasks for a median to mean something</text>
  <rect class="when-to-retro-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="when-to-retro-name" x="526" y="122">Do not soften</text>
  <text class="when-to-retro-desc" x="526" y="142">The two that matter most.</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r0" x="526" y="182">The escaped incidents</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r1" x="526" y="216">The concentrated estimation error</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r2" x="526" y="250">Both are uncomfortable</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r3" x="526" y="284">Both are easiest to round off</text>
  <text class="when-to-retro-desc when-to-retro-row when-to-retro-r4" x="526" y="318">Skip the ceremony for one afternoon's work</text>
  <text class="when-to-retro-sub" x="30" y="372">Below roughly five tasks the numbers are noise, which is the one legitimate reason to skip this — not that the project went well, and not that the findings are unflattering.</text>
</svg>
