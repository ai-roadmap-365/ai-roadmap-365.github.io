<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six steps, ending in sentences.">
  <title>The procedure, in order</title>
  <style>
    .retro-procedure-bg   { fill: #f8fafc; }
    .retro-procedure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-procedure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-procedure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-procedure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-procedure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retro-procedure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retro-procedure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retro-procedure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retro-procedure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retro-procedure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retro-procedure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retro-procedure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retro-procedure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retro-procedure-stage { opacity: 1; }

    .retro-procedure-s0 { animation-delay: 0.00s; }
    .retro-procedure-e0 { animation-delay: 0.00s; }
    .retro-procedure-s1 { animation-delay: 1.37s; }
    .retro-procedure-e1 { animation-delay: 1.37s; }
    .retro-procedure-s2 { animation-delay: 2.74s; }
    .retro-procedure-e2 { animation-delay: 2.74s; }
    .retro-procedure-s3 { animation-delay: 4.11s; }
    .retro-procedure-e3 { animation-delay: 4.11s; }
    .retro-procedure-s4 { animation-delay: 5.49s; }
    .retro-procedure-e4 { animation-delay: 5.49s; }
    .retro-procedure-s5 { animation-delay: 6.86s; }
    .retro-procedure-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .retro-procedure-conn  { animation: retro-procedure-trace 9.600000000000001s ease-in-out infinite; }
      .retro-procedure-stage { animation: retro-procedure-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes retro-procedure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retro-procedure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retro-procedure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retro-procedure-stage { animation: retro-procedure-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retro-procedure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retro-procedure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retro-procedure-bg" width="980" height="322"/>
  <text class="retro-procedure-h1"  x="30" y="40">The procedure, in order</text>
  <text class="retro-procedure-sub" x="30" y="64">Six steps, ending in sentences.</text>
  <g class="retro-procedure-stage retro-procedure-s0">
    <rect class="retro-procedure-warn" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="44" y="142">01</text>
    <text class="retro-procedure-name" x="70" y="142">Record the tasks</text>
    <text class="retro-procedure-desc" x="44" y="166">Name, area,</text>
    <text class="retro-procedure-desc" x="44" y="182">estimate, actual. No</text>
    <text class="retro-procedure-desc" x="44" y="198">estimates recorded</text>
  </g>
  <line class="retro-procedure-line retro-procedure-conn retro-procedure-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#retro-procedure-tip)"/>
  <g class="retro-procedure-stage retro-procedure-s1">
    <rect class="retro-procedure-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="201" y="142">02</text>
    <text class="retro-procedure-name" x="227" y="142">Ratio per task, median overall</text>
    <text class="retro-procedure-desc" x="201" y="166">Actual over</text>
    <text class="retro-procedure-desc" x="201" y="182">estimated.</text>
  </g>
  <line class="retro-procedure-line retro-procedure-conn retro-procedure-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#retro-procedure-tip)"/>
  <g class="retro-procedure-stage retro-procedure-s2">
    <rect class="retro-procedure-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="358" y="142">03</text>
    <text class="retro-procedure-name" x="384" y="142">Median per area, then compare</text>
    <text class="retro-procedure-desc" x="358" y="166">Within about 1.5x is</text>
    <text class="retro-procedure-desc" x="358" y="182">uniform. Wider than</text>
    <text class="retro-procedure-desc" x="358" y="198">that is</text>
    <text class="retro-procedure-edge" x="358" y="242">the test</text>
  </g>
  <line class="retro-procedure-line retro-procedure-conn retro-procedure-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#retro-procedure-tip)"/>
  <g class="retro-procedure-stage retro-procedure-s3">
    <rect class="retro-procedure-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="515" y="142">04</text>
    <text class="retro-procedure-name" x="541" y="142">Rank incidents by stage</text>
    <text class="retro-procedure-desc" x="515" y="166">Review, tests,</text>
    <text class="retro-procedure-desc" x="515" y="182">staging, monitoring,</text>
    <text class="retro-procedure-desc" x="515" y="198">user — increasing</text>
  </g>
  <line class="retro-procedure-line retro-procedure-conn retro-procedure-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#retro-procedure-tip)"/>
  <g class="retro-procedure-stage retro-procedure-s4">
    <rect class="retro-procedure-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="672" y="142">05</text>
    <text class="retro-procedure-name" x="698" y="142">Name the gate for each escape</text>
    <text class="retro-procedure-desc" x="672" y="166">"No gate would have</text>
    <text class="retro-procedure-desc" x="672" y="182">caught this" is a</text>
    <text class="retro-procedure-desc" x="672" y="198">legitimate finding.</text>
    <text class="retro-procedure-edge" x="672" y="242">honest</text>
  </g>
  <line class="retro-procedure-line retro-procedure-conn retro-procedure-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#retro-procedure-tip)"/>
  <g class="retro-procedure-stage retro-procedure-s5">
    <rect class="retro-procedure-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="retro-procedure-step" x="829" y="142">06</text>
    <text class="retro-procedure-name" x="855" y="142">Produce sentences, not scores</text>
    <text class="retro-procedure-desc" x="829" y="166">"Multiply the next</text>
    <text class="retro-procedure-desc" x="829" y="182">estimate by 1.20",</text>
    <text class="retro-procedure-desc" x="829" y="198">not "calibration:</text>
  </g>
  <text class="retro-procedure-sub" x="30" y="304">The first step is the one that cannot be repaired retrospectively: estimates take seconds to record and cannot be reconstructed afterwards, which makes them the only genuinely irreplaceable input here.</text>
</svg>
