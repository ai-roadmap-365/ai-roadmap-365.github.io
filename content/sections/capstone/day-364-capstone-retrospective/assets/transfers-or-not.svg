<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A feeling versus a multiplier.">
  <title>What transfers and what does not</title>
  <style>
    .transfers-or-not-bg   { fill: #f8fafc; }
    .transfers-or-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfers-or-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfers-or-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfers-or-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfers-or-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfers-or-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfers-or-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transfers-or-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transfers-or-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transfers-or-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transfers-or-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transfers-or-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfers-or-not-row { opacity: 1; }
    .transfers-or-not-r0 { animation-delay: 0.00s; }
    .transfers-or-not-r1 { animation-delay: 0.45s; }
    .transfers-or-not-r2 { animation-delay: 0.90s; }
    .transfers-or-not-r3 { animation-delay: 1.35s; }
    .transfers-or-not-r4 { animation-delay: 1.80s; }
    .transfers-or-not-row { animation: transfers-or-not-reveal 7.3s ease-in-out infinite; }
    @keyframes transfers-or-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="transfers-or-not-bg" width="980" height="390"/>
  <text class="transfers-or-not-h1"  x="30" y="40">What transfers and what does not</text>
  <text class="transfers-or-not-sub" x="30" y="64">A feeling versus a multiplier.</text>
  <rect class="transfers-or-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="transfers-or-not-name" x="46" y="122">Transfers</text>
  <text class="transfers-or-not-desc" x="46" y="142">Changes a decision.</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r0" x="46" y="182">"Multiply unfamiliar estimates by 3.3"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r1" x="46" y="216">"Split unfamiliar work until it is familiar"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r2" x="46" y="250">"Add a per-request spend cap"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r3" x="46" y="284">"Add a groundedness signal"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r4" x="46" y="318">Each names a specific next action</text>
  <rect class="transfers-or-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="transfers-or-not-name" x="526" y="122">Does not</text>
  <text class="transfers-or-not-desc" x="526" y="142">True, and inert.</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r0" x="526" y="182">"The agent work took longer than expected"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r1" x="526" y="216">"We should have tested more"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r2" x="526" y="250">"I should have known"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r3" x="526" y="284">"Calibration: 1.20"</text>
  <text class="transfers-or-not-desc transfers-or-not-row transfers-or-not-r4" x="526" y="318">A number on a dashboard is not an instruction</text>
  <text class="transfers-or-not-sub" x="30" y="372">The last row on each side is the same information: the difference is that one is phrased as a decision someone can take on Monday and the other is phrased as a measurement someone can look at.</text>
</svg>
