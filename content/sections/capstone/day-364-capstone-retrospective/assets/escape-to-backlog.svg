<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two incidents, two named controls.">
  <title>From escape to backlog item</title>
  <style>
    .escape-to-backlog-bg   { fill: #f8fafc; }
    .escape-to-backlog-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .escape-to-backlog-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .escape-to-backlog-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .escape-to-backlog-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .escape-to-backlog-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .escape-to-backlog-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .escape-to-backlog-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .escape-to-backlog-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .escape-to-backlog-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .escape-to-backlog-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .escape-to-backlog-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .escape-to-backlog-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .escape-to-backlog-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .escape-to-backlog-stage { opacity: 1; }

    .escape-to-backlog-s0 { animation-delay: 0.00s; }
    .escape-to-backlog-e0 { animation-delay: 0.00s; }
    .escape-to-backlog-s1 { animation-delay: 1.28s; }
    .escape-to-backlog-e1 { animation-delay: 1.28s; }
    .escape-to-backlog-s2 { animation-delay: 2.56s; }
    .escape-to-backlog-e2 { animation-delay: 2.56s; }
    .escape-to-backlog-s3 { animation-delay: 3.84s; }
    .escape-to-backlog-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .escape-to-backlog-conn  { animation: escape-to-backlog-trace 6.4s ease-in-out infinite; }
      .escape-to-backlog-stage { animation: escape-to-backlog-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes escape-to-backlog-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes escape-to-backlog-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .escape-to-backlog-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .escape-to-backlog-stage { animation: escape-to-backlog-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes escape-to-backlog-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="escape-to-backlog-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="escape-to-backlog-bg" width="980" height="322"/>
  <text class="escape-to-backlog-h1"  x="30" y="40">From escape to backlog item</text>
  <text class="escape-to-backlog-sub" x="30" y="64">Two incidents, two named controls.</text>
  <g class="escape-to-backlog-stage escape-to-backlog-s0">
    <rect class="escape-to-backlog-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="escape-to-backlog-step" x="44" y="142">01</text>
    <text class="escape-to-backlog-name" x="70" y="142">Two of five reached production</text>
    <text class="escape-to-backlog-desc" x="44" y="166">Forty percent escaped.</text>
    <text class="escape-to-backlog-desc" x="44" y="182">Everything from monitoring</text>
    <text class="escape-to-backlog-desc" x="44" y="198">onwards counts.</text>
    <text class="escape-to-backlog-edge" x="44" y="242">escaped</text>
  </g>
  <line class="escape-to-backlog-line escape-to-backlog-conn escape-to-backlog-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#escape-to-backlog-tip)"/>
  <g class="escape-to-backlog-stage escape-to-backlog-s1">
    <rect class="escape-to-backlog-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="escape-to-backlog-step" x="280" y="142">02</text>
    <text class="escape-to-backlog-name" x="306" y="142">A spend spike from a retry loop</text>
    <text class="escape-to-backlog-desc" x="280" y="166">A per-request cap would have</text>
    <text class="escape-to-backlog-desc" x="280" y="182">caught it.</text>
    <text class="escape-to-backlog-edge" x="280" y="242">Day 361</text>
  </g>
  <line class="escape-to-backlog-line escape-to-backlog-conn escape-to-backlog-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#escape-to-backlog-tip)"/>
  <g class="escape-to-backlog-stage escape-to-backlog-s2">
    <rect class="escape-to-backlog-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="escape-to-backlog-step" x="516" y="142">03</text>
    <text class="escape-to-backlog-name" x="542" y="142">Answers citing nothing after a rebuild</text>
    <text class="escape-to-backlog-desc" x="516" y="166">A groundedness signal would have</text>
    <text class="escape-to-backlog-desc" x="516" y="182">caught it.</text>
    <text class="escape-to-backlog-edge" x="516" y="242">Day 360</text>
  </g>
  <line class="escape-to-backlog-line escape-to-backlog-conn escape-to-backlog-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#escape-to-backlog-tip)"/>
  <g class="escape-to-backlog-stage escape-to-backlog-s3">
    <rect class="escape-to-backlog-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="escape-to-backlog-step" x="752" y="142">04</text>
    <text class="escape-to-backlog-name" x="778" y="142">Those two sentences are the backlog</text>
    <text class="escape-to-backlog-desc" x="752" y="166">Not "improve monitoring". Two</text>
    <text class="escape-to-backlog-desc" x="752" y="182">controls, each traceable to a</text>
    <text class="escape-to-backlog-desc" x="752" y="198">real incident.</text>
  </g>
  <text class="escape-to-backlog-sub" x="30" y="304">Both map onto checks that Day 361's review had already named, which is what it looks like when a review's findings are subsequently confirmed by events rather than argued about in the abstract.</text>
</svg>
