title: Portfolio, Resume, and Sharing Your Work
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Turn what you built into claims a stranger can assess: replace adjectives with
  measurements, give every figure the baseline it came from, separate your contribution from the
  team''s, and link to something a reader can actually open — then check your own portfolio against all
  four and rewrite what fails.'
objectives:
  - Identify the four properties of a claim a reader assesses without knowing you.
  - Explain why a number without a baseline is not yet a measurement.
  - Classify attribution, and argue why naming both your work and the team's is strongest.
  - Distinguish evidence a stranger can open from evidence only you can.
  - Produce a rewrite instruction rather than a grade, so a weak claim becomes actionable.
