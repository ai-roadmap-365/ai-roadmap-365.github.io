terms:
  - term: Checkable Claim
    definition: A statement in a form a reader can assess without knowing you. Distinct from a true
      claim, which is a property this checker cannot evaluate.
  - term: Baseline
    definition: The value a measurement started from. Without it a figure describes the present rather
      than a change.
  - term: Attribution
    definition: Whose work a claim describes. Strongest when it names your contribution and the team's
      separately.
  - term: Openable Evidence
    definition: A link a stranger can follow. A local path or a private host is evidence to the author
      alone.
  - term: Vague Wording
    definition: An adjective that occupies the position of a measurement — "significantly", "blazing" —
      and conveys nothing checkable.
  - term: Specificity
    definition: Stating what changed and by how much. A stronger claim than an adjective, not a more
      modest one.
  - term: Situation-Task-Action-Result
    definition: A structured way of describing work whose Action and Result steps are attribution and
      measurement under different names.
  - term: Working in Public
    definition: Writing up decisions, failures and measurements as you go, which is often stronger
      evidence than the artefact because it shows the reasoning.
  - term: Rewrite Hint
    definition: An instruction naming what a weak claim is missing, as distinct from a grade, which only
      says that something is wrong.
  - term: Manufactured Metric
    definition: A number invented to fill the gap where a measurement should be. The one failure in this
      area that cannot be recovered from.
