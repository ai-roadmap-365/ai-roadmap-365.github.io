visuals:
  - id: four-properties-of-a-claim
    file: assets/four-properties-of-a-claim.svg
    type: diagram
    title: Four Properties of a Claim a Reader Can Assess
    alt: Four Properties of a Claim a Reader Can Assess showing specificity, baseline, attribution and
      evidence, and the same claim rewritten to have all four
    description: The four properties with the failure each prevents, ending with one sentence that has
      all four and a note on why its extra words are facts rather than padding.
  - id: weak-to-strong-claim
    file: assets/weak-to-strong-claim.svg
    type: diagram
    title: Weak Claim to Strong Claim
    alt: Weak Claim to Strong Claim showing one sentence rewritten to add a measurement, a baseline,
      attribution and evidence
    description: One claim shown vague and then strong, annotated with what each added phrase buys the
      reader.
  - id: four-properties
    file: assets/four-properties.svg
    type: diagram
    title: 'Four properties a reader assesses'
    alt: 'Diagram: the four properties that make a portfolio claim assessable'
    description: 'A four-stage description of the properties a reader looks for in a claim: specificity, a baseline, attribution and openable evidence.'
  - id: adjectives-or-numbers
    file: assets/adjectives-or-numbers.svg
    type: diagram
    title: 'Specificity is the stronger claim'
    alt: 'Diagram: an adjective-based claim compared with a measured one'
    description: 'A two-column comparison of a portfolio claim built from adjectives against the same claim expressed with measurements and attribution.'
  - id: portfolio-eras
    file: assets/portfolio-eras.svg
    type: diagram
    title: 'How evidence changed'
    alt: 'Diagram: the progression from behavioural interviews to working in public'
    description: 'A four-stage progression from structured behavioural interviewing through resume conventions and open-source portfolios to writing up the work in public.'
  - id: not-a-tech-list
    file: assets/not-a-tech-list.svg
    type: diagram
    title: 'Three things a portfolio is not'
    alt: 'Diagram: what a portfolio is compared with three common substitutes for one'
    description: 'A two-column comparison of a portfolio that presents assessable claims against three common substitutes: a technology list, false modesty, and code with no explanation.'
  - id: four-checks
    file: assets/four-checks.svg
    type: diagram
    title: 'What the checker looks for'
    alt: 'Diagram: the four checks a claim checker performs on a portfolio sentence'
    description: 'A four-stage description of how measurement, baseline, attribution and evidence are each detected from a claim sentence without network access.'
  - id: weak-is-fixable
    file: assets/weak-is-fixable.svg
    type: diagram
    title: 'Weak is fixable; vague is not yet a claim'
    alt: 'Diagram: a weak claim compared with a vague one, and what each needs'
    description: 'A two-column comparison of a weak claim that is missing one property against a vague claim that contains no measurement at all.'
  - id: used-car-analogy
    file: assets/used-car-analogy.svg
    type: diagram
    title: 'Selling a used car'
    alt: 'Diagram: a vague used-car advertisement compared with a specific one'
    description: 'A two-column comparison of a used-car advertisement built from adjectives against one built from checkable specifics including an unflattering one.'
  - id: claim-grades
    file: assets/claim-grades.svg
    type: diagram
    title: 'Five claims, three grades'
    alt: 'Diagram: the graded output of a claim checker over five portfolio claims'
    description: 'A four-stage walkthrough of graded portfolio claims showing why a claim with a number can still be unassessable and why an unopenable link functions as no link.'
  - id: portfolio-implications
    file: assets/portfolio-implications.svg
    type: diagram
    title: 'What publishing costs'
    alt: 'Diagram: the security, privacy, contractual, attention and cost implications of publishing a portfolio'
    description: 'A five-stage description of the consequences of publishing work, covering accidental secret disclosure, real data in demos, employer obligations, reader attention and hosting cost.'
  - id: demo-or-recording
    file: assets/demo-or-recording.svg
    type: diagram
    title: 'A live demo, or a recording'
    alt: 'Diagram: a hosted live demo compared with a recorded one'
    description: 'A two-column comparison of hosting a live demo against publishing a recorded terminal session, in terms of impact, cost and risk.'
  - id: checkable-not-true
    file: assets/checkable-not-true.svg
    type: diagram
    title: 'Checkable is not the same as true'
    alt: 'Diagram: whether a claim is checkable compared with whether it is true'
    description: 'A two-column comparison of what a claim checker can determine against what it cannot, and why the checkable property is still worth enforcing.'
  - id: three-strong-claims
    file: assets/three-strong-claims.svg
    type: diagram
    title: 'Three strong claims beat twelve weak ones'
    alt: 'Diagram: when to write portfolio claims and what to avoid'
    description: 'A two-column comparison of practices that strengthen a portfolio against the one failure that cannot be recovered from.'
