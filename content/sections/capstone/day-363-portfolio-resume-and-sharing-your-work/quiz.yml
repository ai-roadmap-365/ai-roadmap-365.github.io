questions:
  - question: Why is "reduced answer latency to 840 ms" not yet a measurement?
    options:
      - Because milliseconds are too small a unit to be meaningful
      - Because without the value it started from, 840 ms could be an improvement, a regression, or no
        change at all — it is a fact about the present rather than a claim about your work
      - Because latency should be reported as a percentile
      - Because the sentence uses the passive voice
    answer_index: 1
    explanation: A number alone reads as rigorous and is unassessable. The baseline is what turns it
      into a result.
  - question: Why does the checker accept "from 0.71 to 0.94" as a measurement despite there being no
      unit?
    options:
      - Because decimals are always measurements
      - Because a stated change between two figures is a measurement regardless of units, and demanding
        one would push writers into padding sentences with units that do not fit the quantity
      - Because recall is a standard metric the checker recognises by name
      - Because two numbers are more convincing than one
    answer_index: 1
    explanation: Ratios, rates and scores are legitimate measurements without units. A checker that
      insists on units distorts the writing it is meant to improve.
  - question: Why is naming both your contribution and the team's treated as the strongest attribution?
    options:
      - Because it is longer and length signals effort
      - Because it separates what you did from what the group did, which is the question the reader
        actually has — and doing so is both more honest and more specific than either alone
      - Because teams prefer collective credit
      - Because it avoids the first person, which reads as arrogant
    answer_index: 1
    explanation: Claiming sole credit for shared work is dishonest, and using the plural for your own
      work undersells it. Naming both resolves the ambiguity in the direction of accuracy.
  - question: Why is a link to localhost treated as no evidence at all?
    options:
      - Because localhost links break in email clients
      - Because a reader cannot open it — evidence that only the author can reach functions exactly like
        an absent link, and that is decidable from the string without any network access
      - Because local servers are insecure
      - Because it implies the project was never deployed
    answer_index: 1
    explanation: The same applies to file paths and private hosts. The check stays offline precisely
      because the question is about the string rather than the destination.
  - question: Why is a claim with vague wording and no measurement graded worse than one merely missing a
      baseline?
    options:
      - Because vague wording is grammatically incorrect
      - Because it sounds like a result and contains none, so there is nothing for the reader to assess
        at all — whereas a missing baseline leaves a real figure that only needs context added
      - Because adjectives are always dishonest
      - Because missing baselines are harder to fix
    answer_index: 1
    explanation: One is unfixable without doing new work; the other is a sentence away from being
      strong. The grades reflect that difference.
