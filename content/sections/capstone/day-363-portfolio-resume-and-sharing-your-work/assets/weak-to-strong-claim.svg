<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" role="img" aria-label="Weak Claim to Strong Claim showing one sentence rewritten to add a measurement, a baseline, attribution and evidence">
  <title>Weak Claim to Strong Claim</title>
  <defs>
    <style>
      .d363b-bg { fill: #f8fafc; }
      .d363b-weak { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d363b-strong { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d363b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d363b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d363b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d363b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d363b-mono { font-family: ui-monospace, monospace; font-size: 12px; fill: #0f172a; }
      .d363b-add { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #166534; }
      .d363b-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d363b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d363b-bg"/>
  <text x="40" y="40" class="d363b-title">Weak Claim to Strong Claim</text>
  <text x="40" y="64" class="d363b-sub">The same work, described two ways. The second is longer and none of it is padding.</text>

  <rect x="40" y="96" width="820" height="56" rx="8" class="d363b-weak"/>
  <text x="60" y="120" class="d363b-h">VAGUE</text>
  <text x="60" y="142" class="d363b-mono">Significantly improved retrieval quality.</text>

  <path d="M 450 158 L 450 190" class="d363b-flow" marker-end="url(#d363b-a)"/>

  <rect x="40" y="196" width="820" height="76" rx="8" class="d363b-strong"/>
  <text x="60" y="220" class="d363b-h">STRONG</text>
  <text x="60" y="242" class="d363b-mono">I raised recall@10 from 0.71 to 0.94 by adding a reranking stage,</text>
  <text x="60" y="262" class="d363b-mono">measured over 200 held-out questions.</text>

  <text x="40" y="308" class="d363b-h">What each added word buys</text>
  <text x="60" y="330" class="d363b-add">I</text>
  <text x="130" y="330" class="d363b-t">attribution — a reader knows this was your work rather than the team's</text>
  <text x="60" y="348" class="d363b-add">from 0.71 to 0.94</text>
  <text x="230" y="348" class="d363b-t">measurement AND baseline — the size of the change is now assessable</text>
  <text x="60" y="366" class="d363b-add">a reranking stage</text>
  <text x="230" y="366" class="d363b-t">mechanism — shows it was a decision rather than luck</text>
  <text x="60" y="384" class="d363b-add">over 200 questions</text>
  <text x="230" y="384" class="d363b-t">sample size — the reader can judge whether the number means anything</text>
</svg>
