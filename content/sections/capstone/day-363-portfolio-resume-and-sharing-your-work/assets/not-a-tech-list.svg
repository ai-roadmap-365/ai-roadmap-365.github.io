<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each one is a common shape.">
  <title>Three things a portfolio is not</title>
  <style>
    .not-a-tech-list-bg   { fill: #f8fafc; }
    .not-a-tech-list-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tech-list-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tech-list-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tech-list-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tech-list-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tech-list-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-tech-list-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-tech-list-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-tech-list-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-tech-list-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-tech-list-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-tech-list-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-tech-list-row { opacity: 1; }
    .not-a-tech-list-r0 { animation-delay: 0.00s; }
    .not-a-tech-list-r1 { animation-delay: 0.45s; }
    .not-a-tech-list-r2 { animation-delay: 0.90s; }
    .not-a-tech-list-r3 { animation-delay: 1.35s; }
    .not-a-tech-list-r4 { animation-delay: 1.80s; }
    .not-a-tech-list-row { animation: not-a-tech-list-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-tech-list-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-tech-list-bg" width="980" height="390"/>
  <text class="not-a-tech-list-h1"  x="30" y="40">Three things a portfolio is not</text>
  <text class="not-a-tech-list-sub" x="30" y="64">Each one is a common shape.</text>
  <rect class="not-a-tech-list-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-tech-list-name" x="46" y="122">A portfolio</text>
  <text class="not-a-tech-list-desc" x="46" y="142">Claims a stranger can assess.</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r0" x="46" y="182">What you did, and what changed</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r1" x="46" y="216">Written for a reader with no context</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r2" x="46" y="250">Honest about team scope</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r3" x="46" y="284">Points at something openable</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r4" x="46" y="318">Accurate, in both directions</text>
  <rect class="not-a-tech-list-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-tech-list-name" x="526" y="122">Three substitutes</text>
  <text class="not-a-tech-list-desc" x="526" y="142">Common, and weaker.</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r0" x="526" y="182">A list of technologies you were near</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r1" x="526" y="216">A repository with no explanation</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r2" x="526" y="250">Understating measurable work</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r3" x="526" y="284">Asking the reader to do the understanding</text>
  <text class="not-a-tech-list-desc not-a-tech-list-row not-a-tech-list-r4" x="526" y="318">Modesty is not accuracy</text>
  <text class="not-a-tech-list-sub" x="30" y="372">Understating is treated as a virtue and is not one: a measurable result described vaguely is as inaccurate as an unmeasured result described confidently, and it costs you the same reader.</text>
</svg>
