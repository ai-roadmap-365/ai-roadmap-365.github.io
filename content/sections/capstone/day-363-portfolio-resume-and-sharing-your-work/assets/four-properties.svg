<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Visible in the sentence itself.">
  <title>Four properties a reader assesses</title>
  <style>
    .four-properties-bg   { fill: #f8fafc; }
    .four-properties-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-properties-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-properties-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-properties-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-properties-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-properties-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-properties-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-properties-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-properties-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-properties-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-properties-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-properties-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-properties-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-properties-stage { opacity: 1; }

    .four-properties-s0 { animation-delay: 0.00s; }
    .four-properties-e0 { animation-delay: 0.00s; }
    .four-properties-s1 { animation-delay: 1.28s; }
    .four-properties-e1 { animation-delay: 1.28s; }
    .four-properties-s2 { animation-delay: 2.56s; }
    .four-properties-e2 { animation-delay: 2.56s; }
    .four-properties-s3 { animation-delay: 3.84s; }
    .four-properties-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-properties-conn  { animation: four-properties-trace 6.4s ease-in-out infinite; }
      .four-properties-stage { animation: four-properties-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-properties-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-properties-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-properties-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-properties-stage { animation: four-properties-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-properties-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-properties-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-properties-bg" width="980" height="322"/>
  <text class="four-properties-h1"  x="30" y="40">Four properties a reader assesses</text>
  <text class="four-properties-sub" x="30" y="64">Visible in the sentence itself.</text>
  <g class="four-properties-stage four-properties-s0">
    <rect class="four-properties-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-properties-step" x="44" y="142">01</text>
    <text class="four-properties-name" x="70" y="142">Specific</text>
    <text class="four-properties-desc" x="44" y="166">A number with a unit beats an</text>
    <text class="four-properties-desc" x="44" y="182">adjective. "840 ms" is a fact.</text>
    <text class="four-properties-edge" x="44" y="242">a number</text>
  </g>
  <line class="four-properties-line four-properties-conn four-properties-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-properties-tip)"/>
  <g class="four-properties-stage four-properties-s1">
    <rect class="four-properties-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-properties-step" x="280" y="142">02</text>
    <text class="four-properties-name" x="306" y="142">Has a baseline</text>
    <text class="four-properties-desc" x="280" y="166">From what? Without it, 840 ms</text>
    <text class="four-properties-desc" x="280" y="182">could be an improvement or a</text>
    <text class="four-properties-desc" x="280" y="198">regression.</text>
    <text class="four-properties-edge" x="280" y="242">from x to y</text>
  </g>
  <line class="four-properties-line four-properties-conn four-properties-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-properties-tip)"/>
  <g class="four-properties-stage four-properties-s2">
    <rect class="four-properties-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-properties-step" x="516" y="142">03</text>
    <text class="four-properties-name" x="542" y="142">Attributed</text>
    <text class="four-properties-desc" x="516" y="166">What you did, distinct from what</text>
    <text class="four-properties-desc" x="516" y="182">the team did. The rarest of the</text>
    <text class="four-properties-desc" x="516" y="198">four.</text>
  </g>
  <line class="four-properties-line four-properties-conn four-properties-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-properties-tip)"/>
  <g class="four-properties-stage four-properties-s3">
    <rect class="four-properties-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-properties-step" x="752" y="142">04</text>
    <text class="four-properties-name" x="778" y="142">Evidenced</text>
    <text class="four-properties-desc" x="752" y="166">A link a stranger can open. A</text>
    <text class="four-properties-desc" x="752" y="182">local path is evidence to</text>
    <text class="four-properties-desc" x="752" y="198">nobody.</text>
    <text class="four-properties-edge" x="752" y="242">openable</text>
  </g>
  <text class="four-properties-sub" x="30" y="304">The third is rarest because it costs both words and honesty: naming your part separately from the team's requires deciding where the boundary actually was.</text>
</svg>
