questions:
  - question: Why is "discipline" usually the wrong diagnosis when a post-course learning plan dies in
      week three?
    options:
      - Because three weeks is too short a period for discipline to matter
      - Because the plan typically needed three to four times the available hours on the day it was
        written, so it was arithmetically impossible before any discipline was applied
      - Because learning plans should never have deadlines attached
      - Because motivation always declines after finishing a course
    answer_index: 1
    explanation: Six individually modest commitments routinely total seventeen hours a week against
      four or five available. The failure is arithmetic, and it presents as a motivation problem.
  - question: Why must "build up my understanding of evals" fail an actionability check despite
      starting with an action verb?
    options:
      - Because "evals" is jargon and should be spelled out
      - Because a topic verb anywhere in the sentence disqualifies it — this is a topic wearing an
        action's clothes, and a check that only inspects the first word waves it straight through
      - Because the sentence is too short to be a commitment
      - Because understanding cannot be measured in hours
    answer_index: 1
    explanation: It is the most common way a topic gets phrased as an action. Check for topic verbs
      first, then require an action verb at the start.
  - question: Why does the trim drop whole commitments rather than reducing every commitment's hours
      proportionally?
    options:
      - Because proportional reduction is harder to compute
      - Because six commitments at half the hours each is six things done badly, whereas two at full
        hours is two things done — the plan that fits is the plan that happens
      - Because low-priority commitments are never worth any hours at all
      - Because hours cannot be divided into fractions
    answer_index: 1
    explanation: This is a work-in-progress limit. Unfinished work has none of the value of finished
      work, so spreading the same hours across more commitments lowers throughput.
  - question: Why must a calibration ratio be applied before the load is measured rather than after?
    options:
      - Because floating-point rounding accumulates differently in the other order
      - Because the trim, the cut list and the fit decision must all be made against the re-costed
        plan; measuring the optimistic plan and then reporting a calibrated number is how a tool tells
        you something reassuring and wrong
      - Because the calibration ratio changes between commitments
      - Because the load must be an integer
    answer_index: 1
    explanation: Every downstream decision depends on the hours. Re-cost first, then measure
      everything against the re-costed plan.
  - question: The trim keeps a priority-5 commitment while cutting a priority-1 one that was too
      expensive to fit. Why is that a real property rather than a bug?
    options:
      - Because priority numbers are arbitrary and should be ignored
      - Because stopping at the first commitment that does not fit would waste every remaining hour,
        so the trim skips and carries on — though the right response is usually to split the expensive
        commitment rather than accept the substitution
      - Because cheaper commitments are always more valuable per hour
      - Because the trim is meant to maximise the number of commitments kept
    answer_index: 1
    explanation: The greedy behaviour is deliberate and its consequence should be visible rather than
      hidden. Deciding whether to split the expensive commitment is a judgement the tool cannot make.
