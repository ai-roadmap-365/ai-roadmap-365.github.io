<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" role="img" aria-label="What Survives Five Hours a Week showing six commitments trimmed to the two that fit, with the four cuts named">
  <title>What Survives Five Hours a Week</title>
  <defs>
    <style>
      .d365b-bg { fill: #f8fafc; }
      .d365b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d365b-keep { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d365b-cut { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d365b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d365b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d365b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d365b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d365b-arrow { stroke: #94a3b8; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d365b-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect class="d365b-bg" width="900" height="450" />
  <text class="d365b-title" x="30" y="38">What Survives Five Hours a Week</text>
  <text class="d365b-s" x="30" y="60">The trim drops whole commitments. Half of six is six things done badly.</text>

  <rect class="d365b-keep" x="30" y="84" width="380" height="86" rx="8" />
  <text class="d365b-h" x="48" y="110">Kept — 4.8h of 5.0</text>
  <text class="d365b-t" x="48" y="134">p1  3.6h/wk  evaluation harness</text>
  <text class="d365b-t" x="48" y="156">p2  1.2h/wk  writing about the work</text>

  <rect class="d365b-cut" x="440" y="84" width="430" height="130" rx="8" />
  <text class="d365b-h" x="458" y="110">Cut — named now, not lost later</text>
  <text class="d365b-t" x="458" y="134">p2  2.4h/wk  open-source contribution</text>
  <text class="d365b-t" x="458" y="156">p3  4.8h/wk  fine-tuning</text>
  <text class="d365b-t" x="458" y="178">p4  3.6h/wk  agent frameworks</text>
  <text class="d365b-t" x="458" y="200">p5  4.8h/wk  systems and scaling</text>

  <rect class="d365b-card" x="30" y="188" width="380" height="70" rx="8" />
  <text class="d365b-s" x="48" y="212">The open-source contribution is priority 2, the same</text>
  <text class="d365b-s" x="48" y="230">as the writing that survived. 3.6 + 2.4 exceeds 5.0;</text>
  <text class="d365b-s" x="48" y="248">3.6 + 1.2 does not. Consider splitting it instead.</text>

  <line class="d365b-arrow" x1="450" y1="292" x2="450" y2="330" marker-end="url(#d365b-head)" />

  <rect class="d365b-card" x="30" y="286" width="380" height="52" rx="8" />
  <text class="d365b-h" x="48" y="310">Cut deliberately, in week zero</text>
  <text class="d365b-s" x="48" y="330">You choose which four. Two things get done.</text>

  <rect class="d365b-cut" x="490" y="286" width="380" height="52" rx="8" />
  <text class="d365b-h" x="508" y="310">Cut by attrition, in week three</text>
  <text class="d365b-s" x="508" y="330">The busy week chooses. Nothing gets done.</text>

  <rect class="d365b-card" x="30" y="360" width="840" height="66" rx="6" />
  <text class="d365b-t" x="48" y="386">Three of the six also failed the wording check — and they are the same three with no artifact.</text>
  <text class="d365b-s" x="48" y="410">Not a coincidence. A commitment phrased as a topic has no artifact, because a topic does not produce one.</text>
</svg>
