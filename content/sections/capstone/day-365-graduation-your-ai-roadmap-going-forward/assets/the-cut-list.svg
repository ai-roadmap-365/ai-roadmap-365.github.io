<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And a cheaper commitment outlives a dearer one.">
  <title>Two of six survive</title>
  <style>
    .the-cut-list-bg   { fill: #f8fafc; }
    .the-cut-list-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-cut-list-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-cut-list-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-cut-list-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-cut-list-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-cut-list-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .the-cut-list-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .the-cut-list-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .the-cut-list-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .the-cut-list-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .the-cut-list-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .the-cut-list-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .the-cut-list-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .the-cut-list-stage { opacity: 1; }

    .the-cut-list-s0 { animation-delay: 0.00s; }
    .the-cut-list-e0 { animation-delay: 0.00s; }
    .the-cut-list-s1 { animation-delay: 1.28s; }
    .the-cut-list-e1 { animation-delay: 1.28s; }
    .the-cut-list-s2 { animation-delay: 2.56s; }
    .the-cut-list-e2 { animation-delay: 2.56s; }
    .the-cut-list-s3 { animation-delay: 3.84s; }
    .the-cut-list-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .the-cut-list-conn  { animation: the-cut-list-trace 6.4s ease-in-out infinite; }
      .the-cut-list-stage { animation: the-cut-list-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes the-cut-list-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes the-cut-list-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .the-cut-list-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .the-cut-list-stage { animation: the-cut-list-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes the-cut-list-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="the-cut-list-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="the-cut-list-bg" width="980" height="322"/>
  <text class="the-cut-list-h1"  x="30" y="40">Two of six survive</text>
  <text class="the-cut-list-sub" x="30" y="64">And a cheaper commitment outlives a dearer one.</text>
  <g class="the-cut-list-stage the-cut-list-s0">
    <rect class="the-cut-list-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="the-cut-list-step" x="44" y="142">01</text>
    <text class="the-cut-list-name" x="70" y="142">Keep: evals at 3.6h, writing at 1.2h</text>
    <text class="the-cut-list-desc" x="44" y="166">Priority 1 and priority 2.</text>
    <text class="the-cut-list-desc" x="44" y="182">Together, 4.8 of 5 hours.</text>
  </g>
  <line class="the-cut-list-line the-cut-list-conn the-cut-list-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#the-cut-list-tip)"/>
  <g class="the-cut-list-stage the-cut-list-s1">
    <rect class="the-cut-list-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="the-cut-list-step" x="280" y="142">02</text>
    <text class="the-cut-list-name" x="306" y="142">Cut: fine-tuning, open source, agents, systems</text>
    <text class="the-cut-list-desc" x="280" y="166">Four commitments, 15.6 hours,</text>
    <text class="the-cut-list-desc" x="280" y="182">gone.</text>
  </g>
  <line class="the-cut-list-line the-cut-list-conn the-cut-list-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#the-cut-list-tip)"/>
  <g class="the-cut-list-stage the-cut-list-s2">
    <rect class="the-cut-list-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="the-cut-list-step" x="516" y="142">03</text>
    <text class="the-cut-list-name" x="542" y="142">The open-source item was also priority 2</text>
    <text class="the-cut-list-desc" x="516" y="166">Cut because 3.6 + 2.4 exceeds</text>
    <text class="the-cut-list-desc" x="516" y="182">five, while 3.6 + 1.2 does not.</text>
    <text class="the-cut-list-edge" x="516" y="242">skip and continue</text>
  </g>
  <line class="the-cut-list-line the-cut-list-conn the-cut-list-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#the-cut-list-tip)"/>
  <g class="the-cut-list-stage the-cut-list-s3">
    <rect class="the-cut-list-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="the-cut-list-step" x="752" y="142">04</text>
    <text class="the-cut-list-name" x="778" y="142">Which is real, not a bug</text>
    <text class="the-cut-list-desc" x="752" y="166">Stopping at the first misfit</text>
    <text class="the-cut-list-desc" x="752" y="182">would waste the remaining hours</text>
    <text class="the-cut-list-desc" x="752" y="198">entirely.</text>
    <text class="the-cut-list-edge" x="752" y="242">but</text>
  </g>
  <text class="the-cut-list-sub" x="30" y="304">The right response to that substitution is usually to split the expensive commitment into a piece that fits rather than to accept the cheaper replacement — and no tool can make that call for you.</text>
</svg>
