<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same cut, made calmly.">
  <title>Weighing the bag at home</title>
  <style>
    .packing-analogy-bg   { fill: #f8fafc; }
    .packing-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packing-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packing-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packing-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packing-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packing-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packing-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packing-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packing-analogy-row { opacity: 1; }
    .packing-analogy-r0 { animation-delay: 0.00s; }
    .packing-analogy-r1 { animation-delay: 0.45s; }
    .packing-analogy-r2 { animation-delay: 0.90s; }
    .packing-analogy-r3 { animation-delay: 1.35s; }
    .packing-analogy-r4 { animation-delay: 1.80s; }
    .packing-analogy-row { animation: packing-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes packing-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="packing-analogy-bg" width="980" height="390"/>
  <text class="packing-analogy-h1"  x="30" y="40">Weighing the bag at home</text>
  <text class="packing-analogy-sub" x="30" y="64">The same cut, made calmly.</text>
  <rect class="packing-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="packing-analogy-name" x="46" y="122">At home</text>
  <text class="packing-analogy-desc" x="46" y="142">The whole bag is visible.</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r0" x="46" y="182">Same amount of stuff</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r1" x="46" y="216">Same cut, no time pressure</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r2" x="46" y="250">You remove what matters least</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r3" x="46" y="284">Nothing is decided at a desk</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r4" x="46" y="318">The scale is what makes it work</text>
  <rect class="packing-analogy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="packing-analogy-name" x="526" y="122">At the desk</text>
  <text class="packing-analogy-desc" x="526" y="142">Under time pressure.</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r0" x="526" y="182">Every item looked reasonable alone</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r1" x="526" y="216">Nobody weighed it until now</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r2" x="526" y="250">You remove whatever is on top</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r3" x="526" y="284">Decided badly, in public</text>
  <text class="packing-analogy-desc packing-analogy-row packing-analogy-r4" x="526" y="318">And you still cannot bring it</text>
  <text class="packing-analogy-sub" x="30" y="372">Nobody packs by bringing two-thirds of every item — you cannot bring two-thirds of a charger — which is exactly why the trim drops whole commitments instead of shaving hours off all of them.</text>
</svg>
