<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Six commitments is a WIP limit of six.">
  <title>A limit set by nobody</title>
  <style>
    .wip-limit-of-six-bg   { fill: #f8fafc; }
    .wip-limit-of-six-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wip-limit-of-six-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wip-limit-of-six-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wip-limit-of-six-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wip-limit-of-six-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wip-limit-of-six-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wip-limit-of-six-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .wip-limit-of-six-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .wip-limit-of-six-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .wip-limit-of-six-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .wip-limit-of-six-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .wip-limit-of-six-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .wip-limit-of-six-row { opacity: 1; }
    .wip-limit-of-six-r0 { animation-delay: 0.00s; }
    .wip-limit-of-six-r1 { animation-delay: 0.45s; }
    .wip-limit-of-six-r2 { animation-delay: 0.90s; }
    .wip-limit-of-six-r3 { animation-delay: 1.35s; }
    .wip-limit-of-six-r4 { animation-delay: 1.80s; }
    .wip-limit-of-six-row { animation: wip-limit-of-six-reveal 7.3s ease-in-out infinite; }
    @keyframes wip-limit-of-six-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="wip-limit-of-six-bg" width="980" height="390"/>
  <text class="wip-limit-of-six-h1"  x="30" y="40">A limit set by nobody</text>
  <text class="wip-limit-of-six-sub" x="30" y="64">Six commitments is a WIP limit of six.</text>
  <rect class="wip-limit-of-six-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="wip-limit-of-six-name" x="46" y="122">Chosen</text>
  <text class="wip-limit-of-six-desc" x="46" y="142">Two, because five hours.</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r0" x="46" y="182">The limit is a decision</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r1" x="46" y="216">Throughput is highest here</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r2" x="46" y="250">Switching cost is paid twice, not six times</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r3" x="46" y="284">Unfinished work is minimised</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r4" x="46" y="318">Finishing is what creates value</text>
  <rect class="wip-limit-of-six-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="wip-limit-of-six-name" x="526" y="122">Accidental</text>
  <text class="wip-limit-of-six-desc" x="526" y="142">Six, because six felt fine.</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r0" x="526" y="182">The limit is the plan's length</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r1" x="526" y="216">Throughput falls as it rises</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r2" x="526" y="250">Switching cost paid across six</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r3" x="526" y="284">Everything is in progress, nothing done</text>
  <text class="wip-limit-of-six-desc wip-limit-of-six-row wip-limit-of-six-r4" x="526" y="318">Unfinished work has none of the value</text>
  <text class="wip-limit-of-six-sub" x="30" y="372">Kanban reaches this from a factory floor and Gollwitzer reaches it from a psychology lab, which is worth noticing: the constraint is about how work behaves, not about how you feel about it.</text>
</svg>
