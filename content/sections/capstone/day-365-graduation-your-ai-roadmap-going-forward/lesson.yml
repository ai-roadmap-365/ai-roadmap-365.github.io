title: 'Graduation: Your AI Roadmap Going Forward'
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Write a forward plan you could actually execute: turn topics into next actions that
  produce artifacts, cost the plan at your own measured calibration rather than in optimistic hours,
  compare it against the hours you really have, and cut whole commitments deliberately in week zero
  instead of losing all of them to attrition by week three.'
objectives:
  - Distinguish a next action from a topic, including a topic dressed as an action.
  - Explain why an artifact is what makes progress checkable rather than merely felt.
  - Compute a plan's weekly load against measured available hours.
  - Apply a calibration ratio before measuring the load, and explain why the order matters.
  - Argue why cutting whole commitments beats reducing every commitment proportionally.
