visuals:
  - id: the-plan-you-will-write
    file: assets/the-plan-you-will-write.svg
    type: diagram
    title: The Plan You Will Write Today
    alt: The Plan You Will Write Today showing six modest commitments summing to more than three times
      the available hours
    description: Six individually reasonable commitments drawn against a five-hour weekly budget,
      totalling 17h as written and 20.4h once costed at the learner's own calibration.
  - id: what-survives
    file: assets/what-survives.svg
    type: diagram
    title: What Survives Five Hours a Week
    alt: What Survives Five Hours a Week showing six commitments trimmed to the two that fit, with the
      four cuts named
    description: The trim keeping two commitments and naming the four it cut, with the same-priority
      substitution explained and the choice between cutting in week zero and losing everything by
      week three.
  - id: three-properties-commitment
    file: assets/three-properties-commitment.svg
    type: diagram
    title: 'What makes a commitment'
    alt: 'Diagram: the three properties that turn a topic into a commitment'
    description: 'A four-stage description of the properties a commitment needs: a next action, an artifact, an honestly costed hour figure, and the arithmetic that follows.'
  - id: cut-or-shave
    file: assets/cut-or-shave.svg
    type: diagram
    title: 'Cut whole commitments, never shave'
    alt: 'Diagram: cutting whole commitments compared with reducing every commitment proportionally'
    description: 'A two-column comparison of dropping whole commitments from an over-budget plan against reducing the hours on all of them.'
  - id: planning-eras
    file: assets/planning-eras.svg
    type: diagram
    title: 'Four findings that explain week three'
    alt: 'Diagram: the research findings that explain why post-course plans fail'
    description: 'A four-stage progression through goal-setting research, implementation intentions, the planning fallacy and work-in-progress limits.'
  - id: why-next-action-wins
    file: assets/why-next-action-wins.svg
    type: diagram
    title: 'Why a next action outperforms a topic'
    alt: 'Diagram: how a next action removes the decision a topic leaves in place'
    description: 'A four-stage explanation of why a concrete next action is acted on more often than a stated intention, and what that implies for the actionability check.'
  - id: wip-limit-of-six
    file: assets/wip-limit-of-six.svg
    type: diagram
    title: 'A limit set by nobody'
    alt: 'Diagram: an explicit work-in-progress limit compared with one set by accident'
    description: 'A two-column comparison of choosing a work-in-progress limit deliberately against allowing one to be set by the length of a plan.'
  - id: plan-not-interests
    file: assets/plan-not-interests.svg
    type: diagram
    title: 'A plan is not a list of interests'
    alt: 'Diagram: a costed plan compared with a list of interests'
    description: 'A two-column comparison of a small costed plan against a list of interests, and against a curriculum.'
  - id: plan-procedure
    file: assets/plan-procedure.svg
    type: diagram
    title: 'The procedure, in order'
    alt: 'Diagram: the seven steps of checking and trimming a forward plan'
    description: 'A seven-stage procedure covering writing commitments, checking actionability and artifacts, measuring available hours, re-costing at calibration, totalling, and trimming.'
  - id: topic-dressed-as-action
    file: assets/topic-dressed-as-action.svg
    type: diagram
    title: 'The phrasing that fools a naive check'
    alt: 'Diagram: a genuine next action compared with a topic phrased as one'
    description: 'A two-column comparison of a genuine next action against a topic dressed in an action verb, and what distinguishes them.'
  - id: packing-analogy
    file: assets/packing-analogy.svg
    type: diagram
    title: 'Weighing the bag at home'
    alt: 'Diagram: weighing a bag before travelling compared with weighing it at the airport'
    description: 'A two-column comparison of checking a bag''s weight at home against discovering it at the check-in desk.'
  - id: four-times-over
    file: assets/four-times-over.svg
    type: diagram
    title: 'Seventeen hours against five'
    alt: 'Diagram: how six reasonable commitments total to four times the available hours'
    description: 'A four-stage walkthrough of a plan totalling seventeen hours a week against five available, rising to twenty and a half once calibration is applied.'
  - id: the-cut-list
    file: assets/the-cut-list.svg
    type: diagram
    title: 'Two of six survive'
    alt: 'Diagram: the two commitments that fit within five hours a week and the four that are cut'
    description: 'A four-stage reading of a trim result showing which commitments survive, why a lower-cost equal-priority item outlived a higher-cost one, and what the right response is.'
  - id: habits-that-survive
    file: assets/habits-that-survive.svg
    type: diagram
    title: 'Which habits survive without a course'
    alt: 'Diagram: the security and privacy habits worth keeping after the course ends'
    description: 'A four-stage ranking of habits worth keeping, from scanning repository history for secrets through spend caps to keeping untrusted input untrusted.'
  - id: plan-versus-backlog
    file: assets/plan-versus-backlog.svg
    type: diagram
    title: 'A plan is not a backlog'
    alt: 'Diagram: a plan compared with a backlog'
    description: 'A two-column comparison of a committed plan against a backlog of things you might do, and why separating them matters.'
  - id: do-not-tune-the-numbers
    file: assets/do-not-tune-the-numbers.svg
    type: diagram
    title: 'The one way to make this worse'
    alt: 'Diagram: using the plan check honestly compared with tuning it until the plan fits'
    description: 'A two-column comparison of applying the plan check honestly against adjusting available hours or calibration until the desired plan passes.'
