visuals:
  - id: the-plan-you-will-write
    file: assets/the-plan-you-will-write.svg
    type: diagram
    title: The Plan You Will Write Today
    alt: The Plan You Will Write Today showing six modest commitments summing to more than three times
      the available hours
    description: Six individually reasonable commitments drawn against a five-hour weekly budget,
      totalling 17h as written and 20.4h once costed at the learner's own calibration.
  - id: what-survives
    file: assets/what-survives.svg
    type: diagram
    title: What Survives Five Hours a Week
    alt: What Survives Five Hours a Week showing six commitments trimmed to the two that fit, with the
      four cuts named
    description: The trim keeping two commitments and naming the four it cut, with the same-priority
      substitution explained and the choice between cutting in week zero and losing everything by
      week three.
