terms:
  - term: Commitment
    definition: A next action, an artifact and a cost in hours. Distinct from an interest, which is
      free and unlimited, and from a goal, which describes a state rather than an action.
  - term: Next Action
    definition: Something you could begin within the hour. "Port the retrieval service to two replicas"
      is one; "get better at distributed systems" is not.
  - term: Topic Verb
    definition: A verb that names a state you would like to be in — learn, study, explore, understand.
      It disqualifies a next action even when an action verb also appears in the sentence.
  - term: Artifact
    definition: Something that exists afterwards and did not exist before — a repository, a merged pull
      request, a published post. What makes progress checkable rather than merely felt.
  - term: Weekly Load
    definition: The hours a plan needs each week, summed across every commitment. The number almost
      nobody computes before starting.
  - term: Available Hours
    definition: The hours you actually have, measured from what recent months contained rather than
      estimated from a good week.
  - term: Re-costing
    definition: Multiplying a plan's hours by your own calibration ratio, so it is priced in your hours
      rather than optimistic ones. Must happen before the load is measured.
  - term: Trim
    definition: Reducing a plan to what fits by dropping whole commitments, highest priority first.
      Deliberately not proportional.
  - term: Attrition
    definition: What happens to an over-budget plan that is never cut deliberately — commitments die by
      accident, and the ones that die are whichever fell in a busy week.
  - term: Work-in-Progress Limit
    definition: A cap on how many things are underway at once. Throughput falls as it rises, because
      unfinished work has none of the value of finished work.
  - term: Implementation Intention
    definition: A goal expressed as "when X, I will do Y". Acted on substantially more often than the
      same goal expressed as an intention, because it removes a decision at the moment of action.
