visuals:
- id: milestone-1-vertical-slice-audit-topology
  file: assets/milestone-1-vertical-slice-audit-topology.svg
  type: diagram
  title: Milestone 1 Vertical Slice Audit Topology
  alt: Milestone 1 Vertical Slice Audit Topology showing Ingress API, Hybrid Retrieval Layer, Core AI
    Router, Tool Sandbox, Pydantic Egress, and Audit Metrics
  description: System architecture diagram illustrating the end-to-end vertical slice audit topology.
- id: latency-budget-breakdown-and-profiling-waterfall
  file: assets/latency-budget-breakdown-and-profiling-waterfall.svg
  type: diagram
  title: Latency Budget Breakdown and Profiling Waterfall
  alt: Latency Budget Breakdown and Profiling Waterfall showing Ingress Parse 20ms, Vector Search 45ms,
    BM25 15ms, Model TTFT 350ms, Tool Exec 80ms, and Egress 15ms
  description: Component latency profiling waterfall chart.
- id: review-three-eras
  file: assets/review-three-eras.svg
  type: diagram
  title: 'Three traditions of the design review'
  alt: 'Diagram: the progression from critical design review to continuous audit'
  description: 'A three-stage progression of review practice from formal critical design reviews through agile sprint reviews to continuous audit gates for AI systems.'
- id: review-is-not
  file: assets/review-is-not.svg
  type: diagram
  title: 'What a milestone review is for'
  alt: 'Diagram: what a milestone review is and is not'
  description: 'A two-column comparison of the purpose of a milestone review against common misunderstandings of it.'
- id: vertical-slice-audit
  file: assets/vertical-slice-audit.svg
  type: diagram
  title: 'Audit the slice end to end'
  alt: 'Diagram: auditing a vertical slice from ingress to response'
  description: 'A five-stage audit of a working vertical slice covering ingress, retrieval, generation, response and the measurement taken at each stage.'
- id: latency-drag
  file: assets/latency-drag.svg
  type: diagram
  title: 'Latency accumulates without an owner'
  alt: 'Diagram: how small latency additions accumulate past a budget'
  description: 'A two-column comparison of unmonitored incremental latency growth against a system with an owned end-to-end budget.'
- id: profile-then-optimise
  file: assets/profile-then-optimise.svg
  type: diagram
  title: 'Profile before optimising'
  alt: 'Diagram: optimising by assumption compared with optimising after profiling'
  description: 'A four-stage sequence contrasting optimising a guessed bottleneck with measuring first, using a trace to locate the real cost.'
- id: cut-scope-decision
  file: assets/cut-scope-decision.svg
  type: diagram
  title: 'Cutting scope at the review'
  alt: 'Diagram: cutting scope at a milestone compared with cutting at the deadline'
  description: 'A two-column comparison of reducing scope at a milestone review against discovering at the deadline that the work cannot be completed.'
- id: review-checklist
  file: assets/review-checklist.svg
  type: diagram
  title: 'The five questions to answer honestly'
  alt: 'Diagram: the questions a milestone review must answer'
  description: 'A five-stage review checklist covering the working slice, measured latency, cost per request, remaining risk and the scope decision.'
- id: deadline-arithmetic
  file: assets/deadline-arithmetic.svg
  type: diagram
  title: 'Working backwards from the deadline'
  alt: 'Diagram: working backwards from a delivery deadline to today''s remaining capacity'
  description: 'A four-stage backwards calculation from the delivery date through documentation, freeze and integration time to the working days actually left for features.'
- id: review-pitfalls
  file: assets/review-pitfalls.svg
  type: diagram
  title: 'How a review fails'
  alt: 'Diagram: the ways a milestone review fails to produce a decision'
  description: 'A two-column comparison of failure modes in a milestone review against the practice that avoids each one.'
- id: review-versus-retro
  file: assets/review-versus-retro.svg
  type: diagram
  title: 'A review is not a retrospective'
  alt: 'Diagram: a milestone review compared with a retrospective'
  description: 'A two-column comparison distinguishing a milestone review from a retrospective by what each examines and what each produces.'
