terms:
- term: Milestone Review
  definition: A formal engineering gate auditing code quality, architecture, and performance before the
    next phase.
- term: Vertical Slice
  definition: A fully functional end-to-end path through all architectural layers of the application.
- term: Latency Budget
  definition: The allocated maximum permissible execution time for each pipeline component.
- term: Course Correction
  definition: Targeted architectural adjustments made to resolve bottlenecks or regressions identified
    during review.
- term: HNSW Index
  definition: Hierarchical Navigable Small World graph indexing for sub-millisecond vector similarity
    search.
- term: Scope Freezing
  definition: Locking product features to prevent scope creep and guarantee on-time production delivery.
- term: Bottleneck Profiling
  definition: Measuring execution durations of individual functions to isolate performance drags.
- term: Secrets Hygiene
  definition: Ensuring zero API keys or credentials exist in git history or client-side assets.
