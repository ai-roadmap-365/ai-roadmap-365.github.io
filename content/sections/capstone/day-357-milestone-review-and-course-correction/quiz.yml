questions:
- question: What is the primary objective of the Milestone 1 Review before proceeding to Week 52 deployment?
  options:
  - To celebrate and delete all source code
  - To rigorously validate the end-to-end working vertical slice against latency, accuracy, security,
    and schema compliance criteria, identifying and fixing technical debt before shipping to production
  - To rewrite the entire system in an unvetted framework
  - To disable all automated test suites
  answer_index: 1
  explanation: Milestone 1 reviews identify bottlenecks and lock down architectural stability.
- question: If latency profiling reveals that vector search consumes 450ms of a 600ms total budget, what
    course correction is recommended?
  options:
  - Switch from an unindexed flat array to an approximate nearest neighbor (HNSW) index or quantize vector
    embeddings to 8-bit precision
  - Delete the vector database completely
  - Increase the server CPU clock to 10GHz
  - Ask the user to write shorter queries
  answer_index: 0
  explanation: HNSW indexing and vector quantization dramatically reduce vector similarity search latency.
- question: What is the rule of thumb when dealing with Scope Creep during Capstone Milestone Review?
  options:
  - Add every new feature immediately
  - 'Strictly freeze the Core Vertical Slice: push nice-to-have features into post-graduation backlog
    items to guarantee a rock-solid, production-grade delivery'
  - Cancel the project
  - Remove unit tests to save time
  answer_index: 1
  explanation: Scope discipline ensures that the core AI application is completely polished and deployable.
- question: Why is an end-to-end integration audit performed across the entire system pipeline?
  options:
  - To verify that all components (Ingress -> Hybrid Retrieval -> Core LLM Router -> Sandboxed Tools ->
    Pydantic Output -> Evaluation) interoperate seamlessly without data loss or unhandled exceptions
  - To increase file sizes
  - To replace Python with C++
  - To make the code harder to read
  answer_index: 0
  explanation: End-to-end integration audits verify system-level cohesion and data integrity.
- question: What is the target end-to-end p95 response latency for an interactive RAG query in Milestone
    1?
  options:
  - 30 seconds
  - under 1,500 milliseconds (1.5 seconds) total latency
  - 1 hour
  - 5 minutes
  answer_index: 1
  explanation: Sub-1.5s total latency provides an excellent, responsive user experience.
