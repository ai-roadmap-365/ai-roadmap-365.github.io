<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Written down, with numbers.">
  <title>The five questions to answer honestly</title>
  <style>
    .review-checklist-bg   { fill: #f8fafc; }
    .review-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .review-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .review-checklist-stage { opacity: 1; }

    .review-checklist-s0 { animation-delay: 0.00s; }
    .review-checklist-e0 { animation-delay: 0.00s; }
    .review-checklist-s1 { animation-delay: 1.33s; }
    .review-checklist-e1 { animation-delay: 1.33s; }
    .review-checklist-s2 { animation-delay: 2.67s; }
    .review-checklist-e2 { animation-delay: 2.67s; }
    .review-checklist-s3 { animation-delay: 4.00s; }
    .review-checklist-e3 { animation-delay: 4.00s; }
    .review-checklist-s4 { animation-delay: 5.33s; }
    .review-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .review-checklist-conn  { animation: review-checklist-trace 8s ease-in-out infinite; }
      .review-checklist-stage { animation: review-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes review-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes review-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .review-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .review-checklist-stage { animation: review-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes review-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="review-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="review-checklist-bg" width="980" height="322"/>
  <text class="review-checklist-h1"  x="30" y="40">The five questions to answer honestly</text>
  <text class="review-checklist-sub" x="30" y="64">Written down, with numbers.</text>
  <g class="review-checklist-stage review-checklist-s0">
    <rect class="review-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="review-checklist-step" x="44" y="142">01</text>
    <text class="review-checklist-name" x="70" y="142">Does a slice work end to end?</text>
    <text class="review-checklist-desc" x="44" y="166">Demonstrably, on a real</text>
    <text class="review-checklist-desc" x="44" y="182">query. Yes or no.</text>
  </g>
  <line class="review-checklist-line review-checklist-conn review-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#review-checklist-tip)"/>
  <g class="review-checklist-stage review-checklist-s1">
    <rect class="review-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="review-checklist-step" x="233" y="142">02</text>
    <text class="review-checklist-name" x="259" y="142">What is the measured latency?</text>
    <text class="review-checklist-desc" x="233" y="166">Not an estimate. A p95</text>
    <text class="review-checklist-desc" x="233" y="182">from a trace.</text>
    <text class="review-checklist-edge" x="233" y="242">p95</text>
  </g>
  <line class="review-checklist-line review-checklist-conn review-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#review-checklist-tip)"/>
  <g class="review-checklist-stage review-checklist-s2">
    <rect class="review-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="review-checklist-step" x="422" y="142">03</text>
    <text class="review-checklist-name" x="448" y="142">What does a request cost?</text>
    <text class="review-checklist-desc" x="422" y="166">Tokens in, tokens out,</text>
    <text class="review-checklist-desc" x="422" y="182">times the price. A real</text>
    <text class="review-checklist-desc" x="422" y="198">number.</text>
    <text class="review-checklist-edge" x="422" y="242">per request</text>
  </g>
  <line class="review-checklist-line review-checklist-conn review-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#review-checklist-tip)"/>
  <g class="review-checklist-stage review-checklist-s3">
    <rect class="review-checklist-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="review-checklist-step" x="611" y="142">04</text>
    <text class="review-checklist-name" x="637" y="142">What is still unproven?</text>
    <text class="review-checklist-desc" x="611" y="166">Name the riskiest</text>
    <text class="review-checklist-desc" x="611" y="182">untested assumption. It</text>
    <text class="review-checklist-desc" x="611" y="198">will not improve by being</text>
  </g>
  <line class="review-checklist-line review-checklist-conn review-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#review-checklist-tip)"/>
  <g class="review-checklist-stage review-checklist-s4">
    <rect class="review-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="review-checklist-step" x="800" y="142">05</text>
    <text class="review-checklist-name" x="826" y="142">What are you cutting?</text>
    <text class="review-checklist-desc" x="800" y="166">Decide now, while there</text>
    <text class="review-checklist-desc" x="800" y="182">is time to finish what</text>
    <text class="review-checklist-desc" x="800" y="198">remains.</text>
    <text class="review-checklist-edge" x="800" y="242">decided</text>
  </g>
  <text class="review-checklist-sub" x="30" y="304">Answering the fourth honestly is what distinguishes a review from a status update, and it is the one that most often changes what happens in the second week.</text>
</svg>
