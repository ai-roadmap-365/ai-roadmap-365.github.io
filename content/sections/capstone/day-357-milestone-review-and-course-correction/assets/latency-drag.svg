<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each addition is small and nobody watches the total.">
  <title>Latency accumulates without an owner</title>
  <style>
    .latency-drag-bg   { fill: #f8fafc; }
    .latency-drag-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-drag-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-drag-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-drag-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-drag-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .latency-drag-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-drag-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .latency-drag-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .latency-drag-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .latency-drag-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .latency-drag-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .latency-drag-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .latency-drag-row { opacity: 1; }
    .latency-drag-r0 { animation-delay: 0.00s; }
    .latency-drag-r1 { animation-delay: 0.45s; }
    .latency-drag-r2 { animation-delay: 0.90s; }
    .latency-drag-r3 { animation-delay: 1.35s; }
    .latency-drag-r4 { animation-delay: 1.80s; }
    .latency-drag-row { animation: latency-drag-reveal 7.3s ease-in-out infinite; }
    @keyframes latency-drag-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="latency-drag-bg" width="980" height="390"/>
  <text class="latency-drag-h1"  x="30" y="40">Latency accumulates without an owner</text>
  <text class="latency-drag-sub" x="30" y="64">Each addition is small and nobody watches the total.</text>
  <rect class="latency-drag-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="latency-drag-name" x="46" y="122">Unowned</text>
  <text class="latency-drag-desc" x="46" y="142">Each change is defensible.</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r0" x="46" y="182">"Reranking adds only 140ms"</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r1" x="46" y="216">"Validation adds only 30ms"</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r2" x="46" y="250">"One more retrieval, only 90ms"</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r3" x="46" y="284">Each true, and the total is now 2.4s</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r4" x="46" y="318">Nobody was watching the sum</text>
  <rect class="latency-drag-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="latency-drag-name" x="526" y="122">Owned</text>
  <text class="latency-drag-desc" x="526" y="142">The total is a number someone holds.</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r0" x="526" y="182">The budget is stated and allocated</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r1" x="526" y="216">Each addition must fit its slice</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r2" x="526" y="250">A change that breaks it is a decision</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r3" x="526" y="284">Measured continuously, not at the end</text>
  <text class="latency-drag-desc latency-drag-row latency-drag-r4" x="526" y="318">The trade is explicit and recorded</text>
  <text class="latency-drag-sub" x="30" y="372">This is the Day 15 lesson at project scale: the individual numbers are all small and reasonable, and the only thing that catches the accumulation is a total that someone is responsible for.</text>
</svg>
