<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four ways to hold one and learn nothing.">
  <title>How a review fails</title>
  <style>
    .review-pitfalls-bg   { fill: #f8fafc; }
    .review-pitfalls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-pitfalls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-pitfalls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-pitfalls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-pitfalls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-pitfalls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-pitfalls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-pitfalls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-pitfalls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-pitfalls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-pitfalls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-pitfalls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-pitfalls-row { opacity: 1; }
    .review-pitfalls-r0 { animation-delay: 0.00s; }
    .review-pitfalls-r1 { animation-delay: 0.45s; }
    .review-pitfalls-r2 { animation-delay: 0.90s; }
    .review-pitfalls-r3 { animation-delay: 1.35s; }
    .review-pitfalls-r4 { animation-delay: 1.80s; }
    .review-pitfalls-row { animation: review-pitfalls-reveal 7.3s ease-in-out infinite; }
    @keyframes review-pitfalls-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-pitfalls-bg" width="980" height="390"/>
  <text class="review-pitfalls-h1"  x="30" y="40">How a review fails</text>
  <text class="review-pitfalls-sub" x="30" y="64">Four ways to hold one and learn nothing.</text>
  <rect class="review-pitfalls-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-pitfalls-name" x="46" y="122">The review that failed</text>
  <text class="review-pitfalls-desc" x="46" y="142">Held, and useless.</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r0" x="46" y="182">Demoing the parts that work</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r1" x="46" y="216">Estimates instead of measurements</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r2" x="46" y="250">No permission to cut scope</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r3" x="46" y="284">Risks named but not ranked</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r4" x="46" y="318">No written outcome</text>
  <rect class="review-pitfalls-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-pitfalls-name" x="526" y="122">The review that worked</text>
  <text class="review-pitfalls-desc" x="526" y="142">Produced a decision.</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r0" x="526" y="182">Demoing the riskiest path</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r1" x="526" y="216">A p95 from a trace</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r2" x="526" y="250">Cutting is an allowed outcome</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r3" x="526" y="284">One named biggest risk</text>
  <text class="review-pitfalls-desc review-pitfalls-row review-pitfalls-r4" x="526" y="318">A written decision with a date</text>
  <text class="review-pitfalls-sub" x="30" y="372">The middle row is the load-bearing one: if scope cannot change, everything else in the review is commentary on a plan that is going to be missed anyway.</text>
</svg>
