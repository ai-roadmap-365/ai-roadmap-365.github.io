<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One looks forward, one looks back.">
  <title>A review is not a retrospective</title>
  <style>
    .review-versus-retro-bg   { fill: #f8fafc; }
    .review-versus-retro-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-versus-retro-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-versus-retro-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-versus-retro-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-versus-retro-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-versus-retro-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-versus-retro-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-versus-retro-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-versus-retro-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-versus-retro-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-versus-retro-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-versus-retro-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-versus-retro-row { opacity: 1; }
    .review-versus-retro-r0 { animation-delay: 0.00s; }
    .review-versus-retro-r1 { animation-delay: 0.45s; }
    .review-versus-retro-r2 { animation-delay: 0.90s; }
    .review-versus-retro-r3 { animation-delay: 1.35s; }
    .review-versus-retro-r4 { animation-delay: 1.80s; }
    .review-versus-retro-row { animation: review-versus-retro-reveal 7.3s ease-in-out infinite; }
    @keyframes review-versus-retro-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-versus-retro-bg" width="980" height="390"/>
  <text class="review-versus-retro-h1"  x="30" y="40">A review is not a retrospective</text>
  <text class="review-versus-retro-sub" x="30" y="64">One looks forward, one looks back.</text>
  <rect class="review-versus-retro-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-versus-retro-name" x="46" y="122">Milestone review</text>
  <text class="review-versus-retro-desc" x="46" y="142">About the system.</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r0" x="46" y="182">Is it working, measurably?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r1" x="46" y="216">What is still unproven?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r2" x="46" y="250">What are we cutting?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r3" x="46" y="284">Output: a scope decision</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r4" x="46" y="318">Held at a fixed point in the plan</text>
  <rect class="review-versus-retro-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-versus-retro-name" x="526" y="122">Retrospective</text>
  <text class="review-versus-retro-desc" x="526" y="142">About the process.</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r0" x="526" y="182">How did we work?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r1" x="526" y="216">What slowed us down?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r2" x="526" y="250">What will we change?</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r3" x="526" y="284">Output: a process change</text>
  <text class="review-versus-retro-desc review-versus-retro-row review-versus-retro-r4" x="526" y="318">Held after a period of work</text>
  <text class="review-versus-retro-sub" x="30" y="372">Running them as one meeting reliably produces neither: the process discussion is more comfortable than the measurement, so it expands to fill the time.</text>
</svg>
