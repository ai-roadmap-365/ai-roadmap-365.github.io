<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Latency Budget Breakdown and Profiling Waterfall">
  <title>Latency Budget Breakdown and Profiling Waterfall</title>
  <defs>
    <style>
      .d357b-bg { fill: #f8fafc; }
      .d357b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d357b-bar { fill: #3b82f6; rx: 4px; }
      .d357b-bar-llm { fill: #22c55e; rx: 4px; }
      .d357b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d357b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d357b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; }
      .d357b-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d357b-bg" />
  
  <text x="40" y="40" class="d357a-title">Component Latency Waterfall (p95 = 525ms)</text>
  <text x="40" y="65" class="d357a-subtitle">Latency Budget Breakdown and Profiling Waterfall showing Ingress Parse 20ms, Vector Search 45ms, BM25 15ms, Model TTFT 350ms, Tool Exec 80ms, and Egress 15ms</text>
  
  <!-- Row 1: Ingress Parse (20ms) -->
  <text x="50" y="125" class="d357b-text">1. Ingress &amp; Auth Check</text>
  <rect x="220" y="110" width="30" height="22" class="d357b-bar" />
  <text x="260" y="125" class="d357b-num">20 ms</text>
  
  <!-- Row 2: Vector Search (45ms) -->
  <text x="50" y="165" class="d357b-text">2. Vector Dense Retrieval</text>
  <rect x="250" y="150" width="60" height="22" class="d357b-bar" />
  <text x="320" y="165" class="d357b-num">45 ms</text>
  
  <!-- Row 3: BM25 & RRF (15ms) -->
  <text x="50" y="205" class="d357b-text">3. BM25 Sparse &amp; RRF Fusion</text>
  <rect x="310" y="190" width="25" height="22" class="d357b-bar" />
  <text x="345" y="205" class="d357b-num">15 ms</text>
  
  <!-- Row 4: Model TTFT (350ms) -->
  <text x="50" y="245" class="d357b-text">4. Model Inference &amp; TTFT</text>
  <rect x="335" y="230" width="380" height="22" class="d357b-bar-llm" />
  <text x="725" y="245" class="d357b-num">350 ms</text>
  
  <!-- Row 5: Tool Exec (80ms) -->
  <text x="50" y="285" class="d357b-text">5. Sandboxed Tool Execution</text>
  <rect x="715" y="270" width="90" height="22" class="d357b-bar" />
  <text x="815" y="285" class="d357b-num">80 ms</text>
  
  <!-- Row 6: Egress & Validation (15ms) -->
  <text x="50" y="325" class="d357b-text">6. Pydantic Validate &amp; Egress</text>
  <rect x="805" y="310" width="25" height="22" class="d357b-bar" />
  <text x="840" y="325" class="d357b-num">15 ms</text>
  
  <!-- Total -->
  <line x1="50" y1="360" x2="850" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4" />
  <text x="50" y="390" class="d357b-num" font-size="14px">Total End-to-End Latency: 525 ms (Budget: 1,500 ms)</text>
  <text x="500" y="390" class="d357b-num" fill="#15803d">Status: 65% Latency Headroom Available</text>
</svg>