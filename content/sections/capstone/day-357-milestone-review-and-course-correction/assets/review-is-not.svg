<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Deciding what to cut, while cutting is still cheap.">
  <title>What a milestone review is for</title>
  <style>
    .review-is-not-bg   { fill: #f8fafc; }
    .review-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-is-not-row { opacity: 1; }
    .review-is-not-r0 { animation-delay: 0.00s; }
    .review-is-not-r1 { animation-delay: 0.45s; }
    .review-is-not-r2 { animation-delay: 0.90s; }
    .review-is-not-r3 { animation-delay: 1.35s; }
    .review-is-not-r4 { animation-delay: 1.80s; }
    .review-is-not-row { animation: review-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes review-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-is-not-bg" width="980" height="390"/>
  <text class="review-is-not-h1"  x="30" y="40">What a milestone review is for</text>
  <text class="review-is-not-sub" x="30" y="64">Deciding what to cut, while cutting is still cheap.</text>
  <rect class="review-is-not-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-is-not-name" x="46" y="122">It is</text>
  <text class="review-is-not-desc" x="46" y="142">A decision point.</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r0" x="46" y="182">An honest measurement of where things are</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r1" x="46" y="216">A comparison against the plan</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r2" x="46" y="250">A decision about what to cut</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r3" x="46" y="284">A check that the latency budget still holds</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r4" x="46" y="318">Cheap now, expensive at the deadline</text>
  <rect class="review-is-not-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-is-not-name" x="526" y="122">It is not</text>
  <text class="review-is-not-desc" x="526" y="142">Where reviews go wrong.</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r0" x="526" y="182">Not a demonstration that everything is fine</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r1" x="526" y="216">Not a status report nobody acts on</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r2" x="526" y="250">Not the place to add scope</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r3" x="526" y="284">Not optional because things feel on track</text>
  <text class="review-is-not-desc review-is-not-row review-is-not-r4" x="526" y="318">Feeling on track is not a measurement</text>
  <text class="review-is-not-sub" x="30" y="372">The review earns its place only if cutting scope is a permitted outcome. If the plan cannot change, the review is a status meeting with extra steps.</text>
</svg>
