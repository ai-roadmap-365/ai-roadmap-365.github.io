learning_promise: 'Perform a rigorous end-to-end architectural audit and performance profiling review
  of your Capstone Milestone 1 working vertical slice: measure component latencies, profile memory footprints,
  diagnose throughput bottlenecks, execute structured triage, and build an automated milestone review
  audit suite in Python.'
objectives:
- Audit the complete Capstone Milestone 1 vertical slice across retrieval, reasoning, tool execution,
  and evals.
- Profile component-level latency budgets (identifying p95 bottlenecks in vector search, model TTFT, and
  tool dispatch).
- Implement a structured Course Correction decision matrix for triaging accuracy regressions, latency
  spikes, and scope creep.
- Audit zero-trust security postures (prompt injection boundaries, tool sandboxing permissions, and secrets
  hygiene).
- Build a Milestone Review Audit Suite in Python with automated pass/fail verification.
