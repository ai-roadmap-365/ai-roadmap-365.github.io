terms:
- term: Architecture Design Document (ADD)
  definition: A formal technical blueprint describing system topologies, APIs, data models, and trade-offs.
- term: C4 Model
  definition: 'A hierarchical architectural visualization framework: Context, Containers, Components,
    Code.'
- term: OpenAPI 3.1
  definition: A standardized machine-readable specification for describing RESTful HTTP APIs.
- term: Failure Domain
  definition: A section of a system where an outage or fault is contained without cascading to other components.
- term: Circuit Breaker
  definition: A stability pattern that trips open after consecutive downstream errors, preventing cascade
    failures.
- term: Fallback Model Cascade
  definition: An automated failover mechanism routing queries to secondary models when the primary fails.
- term: Data Schema Specification
  definition: Formal definitions of relational tables, vector collection dimensions, and caching TTLs.
- term: Architecture Linter
  definition: An automated tool validating design documentation against architectural standards.
