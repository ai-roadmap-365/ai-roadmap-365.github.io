<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each corrected the previous one's failure mode.">
  <title>Three eras of AI application structure</title>
  <style>
    .architecture-three-eras-bg   { fill: #f8fafc; }
    .architecture-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architecture-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architecture-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .architecture-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .architecture-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .architecture-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .architecture-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .architecture-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .architecture-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .architecture-three-eras-stage { opacity: 1; }

    .architecture-three-eras-s0 { animation-delay: 0.00s; }
    .architecture-three-eras-e0 { animation-delay: 0.00s; }
    .architecture-three-eras-s1 { animation-delay: 1.50s; }
    .architecture-three-eras-e1 { animation-delay: 1.50s; }
    .architecture-three-eras-s2 { animation-delay: 3.00s; }
    .architecture-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .architecture-three-eras-conn  { animation: architecture-three-eras-trace 6s ease-in-out infinite; }
      .architecture-three-eras-stage { animation: architecture-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes architecture-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes architecture-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .architecture-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .architecture-three-eras-stage { animation: architecture-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes architecture-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="architecture-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="architecture-three-eras-bg" width="980" height="322"/>
  <text class="architecture-three-eras-h1"  x="30" y="40">Three eras of AI application structure</text>
  <text class="architecture-three-eras-sub" x="30" y="64">Each corrected the previous one's failure mode.</text>
  <g class="architecture-three-eras-stage architecture-three-eras-s0">
    <rect class="architecture-three-eras-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="architecture-three-eras-step" x="44" y="142">01</text>
    <text class="architecture-three-eras-name" x="70" y="142">The monolithic script, 2012-2018</text>
    <text class="architecture-three-eras-desc" x="44" y="166">One file, everything in it. Simple until two</text>
    <text class="architecture-three-eras-desc" x="44" y="182">people touch it.</text>
    <text class="architecture-three-eras-edge" x="44" y="242">one file</text>
  </g>
  <line class="architecture-three-eras-line architecture-three-eras-conn architecture-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#architecture-three-eras-tip)"/>
  <g class="architecture-three-eras-stage architecture-three-eras-s1">
    <rect class="architecture-three-eras-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="architecture-three-eras-step" x="359" y="142">02</text>
    <text class="architecture-three-eras-name" x="385" y="142">Microservice sprawl, 2019-2023</text>
    <text class="architecture-three-eras-desc" x="359" y="166">Every function its own service. The</text>
    <text class="architecture-three-eras-desc" x="359" y="182">complexity moved to the network.</text>
    <text class="architecture-three-eras-edge" x="359" y="242">sprawl</text>
  </g>
  <line class="architecture-three-eras-line architecture-three-eras-conn architecture-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#architecture-three-eras-tip)"/>
  <g class="architecture-three-eras-stage architecture-three-eras-s2">
    <rect class="architecture-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="architecture-three-eras-step" x="674" y="142">03</text>
    <text class="architecture-three-eras-name" x="700" y="142">Schema-first, 2024-</text>
    <text class="architecture-three-eras-desc" x="674" y="166">Few components, explicit contracts between</text>
    <text class="architecture-three-eras-desc" x="674" y="182">them, and the shape written down first.</text>
    <text class="architecture-three-eras-edge" x="674" y="242">contracts</text>
  </g>
  <text class="architecture-three-eras-sub" x="30" y="304">The lesson each era taught is the same one: complexity does not disappear when you move it, so the question is where you can afford to keep it and where it must be made explicit.</text>
</svg>
