<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is a starting point, not a contract with the future.">
  <title>Where the document stops</title>
  <style>
    .add-is-not-bg   { fill: #f8fafc; }
    .add-is-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-is-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-is-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-is-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-is-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .add-is-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .add-is-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .add-is-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .add-is-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .add-is-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .add-is-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .add-is-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .add-is-not-row { opacity: 1; }
    .add-is-not-r0 { animation-delay: 0.00s; }
    .add-is-not-r1 { animation-delay: 0.45s; }
    .add-is-not-r2 { animation-delay: 0.90s; }
    .add-is-not-r3 { animation-delay: 1.35s; }
    .add-is-not-r4 { animation-delay: 1.80s; }
    .add-is-not-row { animation: add-is-not-reveal 7.3s ease-in-out infinite; }
    @keyframes add-is-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="add-is-not-bg" width="980" height="390"/>
  <text class="add-is-not-h1"  x="30" y="40">Where the document stops</text>
  <text class="add-is-not-sub" x="30" y="64">It is a starting point, not a contract with the future.</text>
  <rect class="add-is-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="add-is-not-name" x="46" y="122">As a fixed plan</text>
  <text class="add-is-not-desc" x="46" y="142">Written once, defended forever.</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r0" x="46" y="182">Changes feel like failures</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r1" x="46" y="216">Reality diverges and the doc does not</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r2" x="46" y="250">It becomes fiction people stop reading</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r3" x="46" y="284">Arguments cite it as authority</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r4" x="46" y="318">The map is wrong and still consulted</text>
  <rect class="add-is-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="add-is-not-name" x="526" y="122">As a current description</text>
  <text class="add-is-not-desc" x="526" y="142">Updated when a decision changes.</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r0" x="526" y="182">A changed design updates the doc</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r1" x="526" y="216">The doc says what is true today</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r2" x="526" y="250">Superseded decisions are recorded as such</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r3" x="526" y="284">New people can trust it</text>
  <text class="add-is-not-desc add-is-not-row add-is-not-r4" x="526" y="318">Cheap, because it is short</text>
  <text class="add-is-not-sub" x="30" y="372">A design document that cannot change is a document that will be wrong, and being wrong is worse than being absent — an absent document sends people to the code, and a wrong one does not.</text>
</svg>
