questions:
- question: What is the primary purpose of an Architecture and Design Document (ADD) in an enterprise
    AI project?
  options:
  - To increase documentation file size
  - To serve as a user marketing manual
  - To replace writing unit tests
  - 'To settle topology, contracts, and SLAs before coding'
  answer_index: 3
  explanation: A design document serves as the single source of truth aligning engineering, security,
    and product requirements.
- question: In the C4 model for AI architectures, what does the Container level describe?
  options:
  - 'The deployable units and how they communicate'
  - Only physical shipping containers
  - 'Individual Python function signatures and their types'
  - The entire global internet
  answer_index: 0
  explanation: C4 Containers represent deployable executables and data stores in the system topology.
- question: Why must API contracts (OpenAPI 3.1) specify strict JSON schemas for LLM tool calling?
  options:
  - 'Because JSON is mandatory in Python programs'
  - 'To validate arguments before they reach a tool'
  - To increase payload size over HTTP
  - To disable type checking
  answer_index: 1
  explanation: Strict JSON schemas guarantee deterministic tool arguments and error handling.
- question: How does an architectural design document specify failure domain isolation for third-party
    LLMs?
  options:
  - By assuming external APIs will never fail
  - By deleting user requests when errors occur
  - 'Circuit breakers, backoff, caching, and fallbacks'
  - 'By infinite retry loops that lock up the whole server'
  answer_index: 2
  explanation: Circuit breakers and fallback cascades prevent third-party outages from crashing the application.
- question: What does an automated Architecture Schema Linter verify in CI/CD?
  options:
  - Spell checking only
  - The user's internet bandwidth
  - The speed of developer typing
  - 'That the document defines every required section'
  answer_index: 3
  explanation: An architecture linter ensures design specifications meet organizational quality standards.
