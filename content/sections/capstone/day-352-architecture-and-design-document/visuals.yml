visuals:
- id: c4-container-architecture-topology
  file: assets/c4-container-architecture-topology.svg
  type: diagram
  title: C4 Container Architecture Topology
  alt: C4 Container Architecture Topology showing Client Layer, Next.js Gateway, FastAPI Orchestrator,
    Qdrant Vector DB, PostgreSQL, and LLM Serving Cluster
  description: Comprehensive container-level architectural topology diagram for the Capstone system.
- id: end-to-end-request-execution-sequence-flow
  file: assets/end-to-end-request-execution-sequence-flow.svg
  type: diagram
  title: End-to-End Request Execution Sequence Flow
  alt: End-to-End Request Execution Sequence Flow showing Ingress Gateway, PII Vault, Vector Retrieval,
    Agent Reasoning, Tool Execution, and Egress Canary Monitor
  description: Sequence execution diagram detailing chronological request execution across microservices.
- id: architecture-three-eras
  file: assets/architecture-three-eras.svg
  type: diagram
  title: 'Three eras of AI application structure'
  alt: 'Diagram: the progression from monolithic scripts to schema-first AI architecture'
  description: 'A three-stage progression of application architecture from single scripts through microservice sprawl to schema-first designs with explicit contracts.'
- id: design-doc-is-not
  file: assets/design-doc-is-not.svg
  type: diagram
  title: 'What a design document is for'
  alt: 'Diagram: what an architecture design document is and is not'
  description: 'A two-column comparison of the purpose of an architecture document against common misconceptions about it.'
- id: latency-budget
  file: assets/latency-budget.svg
  type: diagram
  title: 'Allocate the latency before you spend it'
  alt: 'Diagram: allocating a latency budget across the stages of a request'
  description: 'A four-stage allocation of an end-to-end latency target across retrieval, generation, and overhead, showing how the budget constrains design choices.'
- id: contract-first
  file: assets/contract-first.svg
  type: diagram
  title: 'Agree the contract before the implementation'
  alt: 'Diagram: implementation-first development compared with contract-first'
  description: 'A two-column comparison of building components before agreeing their interface against defining the schema first.'
- id: failure-is-designed
  file: assets/failure-is-designed.svg
  type: diagram
  title: 'Decide what each failure does'
  alt: 'Diagram: the failure decisions an architecture must make in advance'
  description: 'A four-stage sequence of failure-handling decisions covering timeouts, retries, fallbacks and user-visible degradation.'
- id: c4-levels
  file: assets/c4-levels.svg
  type: diagram
  title: 'Draw two levels, not five'
  alt: 'Diagram: the levels of architectural detail worth drawing'
  description: 'A two-column comparison of the architectural views worth producing for a capstone against those that cost more than they return.'
- id: data-flow-first
  file: assets/data-flow-first.svg
  type: diagram
  title: 'Follow the data, not the components'
  alt: 'Diagram: tracing one request through an AI system''s components'
  description: 'A five-stage trace of a request through an AI application covering ingress, retrieval, prompt assembly, generation and response, naming what can fail at each.'
- id: add-is-not
  file: assets/add-is-not.svg
  type: diagram
  title: 'Where the document stops'
  alt: 'Diagram: treating a design document as fixed compared with as current'
  description: 'A two-column comparison of treating an architecture document as an immutable plan against maintaining it as a current description.'
- id: deterministic-recovery
  file: assets/deterministic-recovery.svg
  type: diagram
  title: 'Recovery has to be decided, not discovered'
  alt: 'Diagram: the four recovery decisions an AI service must make'
  description: 'A four-stage sequence of recovery decisions covering detection, the fallback response, state consistency and user-visible behaviour.'
- id: clarity-roi
  file: assets/clarity-roi.svg
  type: diagram
  title: 'What an hour of design buys'
  alt: 'Diagram: the cost of an architecture document against what it prevents'
  description: 'A two-column comparison of the effort spent on an architecture document against the integration and rework costs it avoids.'
