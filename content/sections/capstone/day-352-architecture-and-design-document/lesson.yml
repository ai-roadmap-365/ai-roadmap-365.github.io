learning_promise: 'Author an exhaustive, production-grade System Architecture and Design Document (ADD)
  for your Capstone: specify C4 model topologies, sequence execution diagrams, database schemas, API contracts,
  failure domain boundaries, and build an automated Architecture Schema Linter in Python.'
objectives:
- Structure a comprehensive AI System Design Document following industry C4 architectural standards (Context,
  Containers, Components, Code).
- Define concrete OpenAPI 3.1 REST contracts and async WebSocket streaming interfaces.
- Model relational, vector, and cache data schemas with precise indexing strategies.
- Establish failure domain isolation, fallback circuit breakers, and graceful degradation paths.
- Implement an automated System Design Document Linter in Python to validate architectural completeness.
