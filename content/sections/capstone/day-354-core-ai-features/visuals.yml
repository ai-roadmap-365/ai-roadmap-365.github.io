visuals:
- id: core-ai-reasoning-and-router-topology
  file: assets/core-ai-reasoning-and-router-topology.svg
  type: diagram
  title: Core AI Reasoning and Router Topology
  alt: Core AI Reasoning and Router Topology showing Prompt Synthesizer, Dynamic Model Router, Circuit
    Breaker, Primary Cloud LLM, Fallback Local LLM, and Pydantic Validator
  description: System architecture diagram illustrating the core AI reasoning and resilient model routing
    topology.
- id: structured-json-repair-and-validation-flow
  file: assets/structured-json-repair-and-validation-flow.svg
  type: diagram
  title: Structured JSON Repair and Validation Flow
  alt: Structured JSON Repair and Validation Flow showing Raw Token Generation, JSON Parsing, Pydantic
    Schema Validation, Error Extraction, and Automated Correction Re-Prompt
  description: Process workflow diagram illustrating the self-healing structured output validation loop.
- id: structured-three-eras
  file: assets/structured-three-eras.svg
  type: diagram
  title: 'Three eras of getting data out of a model'
  alt: 'Diagram: the progression from string interpolation to schema-first model output'
  description: 'A three-stage progression of model output handling from raw string prompts through brittle parsing to schema-constrained structured output.'
- id: valid-or-correct
  file: assets/valid-or-correct.svg
  type: diagram
  title: 'Parsing and validating are two steps'
  alt: 'Diagram: parsing model output compared with validating it against a schema'
  description: 'A two-column comparison of parsing JSON from a model against validating the parsed object, covering what each step catches.'
- id: repair-then-fail
  file: assets/repair-then-fail.svg
  type: diagram
  title: 'Repair once, then fail honestly'
  alt: 'Diagram: the sequence for handling malformed model output'
  description: 'A four-stage sequence for handling unparseable model output covering fence stripping, a single repair attempt, validation, and an honest failure.'
- id: circuit-breaker
  file: assets/circuit-breaker.svg
  type: diagram
  title: 'A circuit breaker stops a failure spreading'
  alt: 'Diagram: a circuit breaker''s three states around a failing dependency'
  description: 'A two-column comparison of calling a failing dependency repeatedly against opening a circuit breaker, covering latency, cost and recovery.'
- id: citations-traceable
  file: assets/citations-traceable.svg
  type: diagram
  title: 'A citation makes an answer checkable'
  alt: 'Diagram: how a cited answer lets a reader verify it'
  description: 'A four-stage sequence connecting a retrieved passage to a generated claim and back, so a reader can verify the source of each statement.'
- id: schema-first-flow
  file: assets/schema-first-flow.svg
  type: diagram
  title: 'The path from prompt to trusted object'
  alt: 'Diagram: the pipeline from prompt to validated structured output'
  description: 'A five-stage sequence from prompt assembly through generation, fence stripping, parsing and schema validation to a trusted object.'
- id: engine-is-not
  file: assets/engine-is-not.svg
  type: diagram
  title: 'What the core engine owns'
  alt: 'Diagram: the responsibilities of the core AI engine'
  description: 'A two-column comparison of the core engine''s responsibilities against those of the retrieval and interface layers.'
- id: token-budget-truncation
  file: assets/token-budget-truncation.svg
  type: diagram
  title: 'The silent failure of a full context window'
  alt: 'Diagram: how context truncation silently drops the relevant passage'
  description: 'A four-stage sequence showing retrieved context exceeding the token budget and being truncated, removing the passage containing the answer without any error.'
- id: fallback-model
  file: assets/fallback-model.svg
  type: diagram
  title: 'A fallback is a design decision'
  alt: 'Diagram: fallback strategies when the primary model is unavailable'
  description: 'A two-column comparison of fallback options when a primary model fails, covering a smaller model against an honest refusal.'
- id: engine-checklist
  file: assets/engine-checklist.svg
  type: diagram
  title: 'Before the engine is done'
  alt: 'Diagram: the checklist for a production AI engine'
  description: 'A five-stage completion checklist for a core AI engine covering schema validation, fence handling, timeouts, repair limits and logging.'
