questions:
- question: Why is strict Pydantic structured output parsing preferred over raw markdown generation in
    production AI?
  options:
  - To make the output file larger
  - It guarantees that model outputs adhere to exact JSON schemas, preventing downstream crashes in web
    frontends, database writes, and automated workflows
  - Because Python only supports JSON
  - To prevent the LLM from generating numbers
  answer_index: 1
  explanation: Structured output parsing transforms unstructured LLM text into validated, type-safe data
    objects.
- question: What is the primary function of a Fallback Model Router with circuit breaker protection?
  options:
  - To shut down the server when errors happen
  - To automatically detect transient timeouts or 503 outages on the primary model, trip the circuit breaker,
    and immediately reroute queries to a secondary fallback model without dropping user requests
  - To double the cost of every API request
  - To translate text into random languages
  answer_index: 1
  explanation: Fallback routers ensure high availability and resilient uptime during external API degradations.
- question: How do XML delimiters (e.g. <context> and <user_query>) improve core AI reasoning in RAG systems?
  options:
  - They increase prompt token count
  - They provide clear structural boundaries separating instructions from untrusted external context,
    mitigating indirect prompt injection and reducing hallucination
  - They turn the LLM into a web browser
  - They disable model safety guardrails
  answer_index: 1
  explanation: XML delimiters isolate context data and enforce strict prompt hierarchy.
- question: What happens when an LLM produces a malformed JSON response that fails schema validation?
  options:
  - The system immediately crashes
  - The validation engine catches the exception and triggers an automatic schema repair re-prompt with
    the error message, recovering valid structured data
  - The user's account is suspended
  - The database is deleted
  answer_index: 1
  explanation: Self-healing repair loops allow LLMs to fix schema validation errors dynamically.
- question: What is the target p95 Time to First Token (TTFT) for an interactive production AI copilot?
  options:
  - 15 seconds
  - under 400 milliseconds
  - 1 minute
  - 0 milliseconds
  answer_index: 1
  explanation: Sub-400ms TTFT ensures a responsive, instantaneous conversational user experience.
