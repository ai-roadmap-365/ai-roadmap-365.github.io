terms:
- term: Structured Output
  definition: Constraining an LLM to generate valid JSON strictly conforming to a Pydantic schema.
- term: Model Router
  definition: An architectural component dynamically selecting the optimal LLM based on task complexity,
    cost, and availability.
- term: Schema Repair Loop
  definition: An automated re-prompting mechanism feeding JSON validation errors back to the model for
    correction.
- term: Context Enclosure
  definition: Wrapping retrieved documents in structural XML tags to prevent context leakage and injection.
- term: Time to First Token (TTFT)
  definition: The latency between client request dispatch and the receipt of the first generated token.
- term: Server-Sent Events (SSE)
  definition: A lightweight unidirectional HTTP streaming protocol for real-time text token delivery.
- term: Grounded Synthesis
  definition: Generating answers strictly anchored in retrieved reference citations.
- term: Resilient Failover
  definition: Switching traffic to backup models when primary endpoints exceed error thresholds.
