learning_promise: 'Implement the core AI reasoning and generation pipeline for your Capstone: build structured
  JSON schema output parsing, dynamic prompt composition with XML delimiters, fallback model routers with
  circuit breakers, and a production reasoning engine in Python.'
objectives:
- Enforce deterministic structured JSON outputs from LLMs using Pydantic schema validation.
- Implement dynamic system prompt synthesis integrating retrieved context, conversation history, and security
  delimiters.
- Deploy a resilient Multi-Model Router with circuit breaker fallback (Primary Cloud LLM -> Local Quantized
  Fallback).
- Implement token streaming generators with Server-Sent Events (SSE) formatting.
- Build a Production Core AI Reasoning Engine in Python with automated schema compliance tests.
