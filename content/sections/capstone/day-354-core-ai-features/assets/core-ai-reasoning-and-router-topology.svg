<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Core AI Reasoning and Router Topology">
  <title>Core AI Reasoning and Router Topology</title>
  <defs>
    <style>
      .d354a-bg { fill: #f8fafc; }
      .d354a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d354a-syn { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d354a-rou { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d354a-val { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d354a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d354a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d354a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d354a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d354a-bg" />
  
  <text x="40" y="40" class="d354a-title">Core AI Reasoning &amp; Model Router Architecture</text>
  <text x="40" y="65" class="d354a-subtitle">Core AI Reasoning and Router Topology showing Prompt Synthesizer, Dynamic Model Router, Circuit Breaker, Primary Cloud LLM, Fallback Local LLM, and Pydantic Validator</text>
  
  <!-- Prompt Synthesis -->
  <rect x="40" y="110" width="250" height="280" class="d354a-syn" />
  <text x="55" y="145" class="d354a-header" fill="#1d4ed8">1. Prompt Synthesizer</text>
  <text x="55" y="180" class="d354a-text">• XML Delimiter Packaging</text>
  <text x="55" y="205" class="d354a-text">• Retrieved Context Injection</text>
  <text x="55" y="230" class="d354a-text">• System Role &amp; Grounding</text>
  <text x="55" y="255" class="d354a-text">• Dynamic Schema Constraints</text>
  <text x="55" y="300" class="d354a-text" font-weight="600" fill="#1d4ed8">Zero-Injection Context</text>
  
  <!-- Router & Circuit Breaker -->
  <rect x="315" y="110" width="270" height="280" class="d354a-rou" />
  <text x="330" y="145" class="d354a-header" fill="#15803d">2. Resilient Model Router</text>
  <text x="330" y="180" class="d354a-text">• Primary: Cloud High-Perf LLM</text>
  <text x="330" y="205" class="d354a-text">• Circuit Breaker (Timeout 2.5s)</text>
  <text x="330" y="230" class="d354a-text">• Fallback: Local Quantized Pod</text>
  <text x="330" y="255" class="d354a-text">• SSE Stream Token Generator</text>
  <text x="330" y="300" class="d354a-text" font-weight="600" fill="#15803d">99.99% Availability</text>
  
  <!-- Validation & Repair -->
  <rect x="610" y="110" width="250" height="280" class="d354a-val" />
  <text x="625" y="145" class="d354a-header" fill="#7e22ce">3. Output Validator &amp; Repair</text>
  <text x="625" y="180" class="d354a-text">• Pydantic Schema Validator</text>
  <text x="625" y="205" class="d354a-text">• Citation Extractor &amp; Check</text>
  <text x="625" y="230" class="d354a-text">• Self-Healing JSON Loop</text>
  <text x="625" y="255" class="d354a-text">• Type-Safe Object Emit</text>
  <text x="625" y="300" class="d354a-text" font-weight="600" fill="#7e22ce">100% Type-Safe APIs</text>
</svg>