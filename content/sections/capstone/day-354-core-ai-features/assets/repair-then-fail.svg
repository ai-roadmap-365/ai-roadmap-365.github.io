<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An unbounded repair loop is an unbounded bill.">
  <title>Repair once, then fail honestly</title>
  <style>
    .repair-then-fail-bg   { fill: #f8fafc; }
    .repair-then-fail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-then-fail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-then-fail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-then-fail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-then-fail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .repair-then-fail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .repair-then-fail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .repair-then-fail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .repair-then-fail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .repair-then-fail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .repair-then-fail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .repair-then-fail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .repair-then-fail-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .repair-then-fail-stage { opacity: 1; }

    .repair-then-fail-s0 { animation-delay: 0.00s; }
    .repair-then-fail-e0 { animation-delay: 0.00s; }
    .repair-then-fail-s1 { animation-delay: 1.28s; }
    .repair-then-fail-e1 { animation-delay: 1.28s; }
    .repair-then-fail-s2 { animation-delay: 2.56s; }
    .repair-then-fail-e2 { animation-delay: 2.56s; }
    .repair-then-fail-s3 { animation-delay: 3.84s; }
    .repair-then-fail-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .repair-then-fail-conn  { animation: repair-then-fail-trace 6.4s ease-in-out infinite; }
      .repair-then-fail-stage { animation: repair-then-fail-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes repair-then-fail-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes repair-then-fail-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .repair-then-fail-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .repair-then-fail-stage { animation: repair-then-fail-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes repair-then-fail-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="repair-then-fail-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="repair-then-fail-bg" width="980" height="322"/>
  <text class="repair-then-fail-h1"  x="30" y="40">Repair once, then fail honestly</text>
  <text class="repair-then-fail-sub" x="30" y="64">An unbounded repair loop is an unbounded bill.</text>
  <g class="repair-then-fail-stage repair-then-fail-s0">
    <rect class="repair-then-fail-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="repair-then-fail-step" x="44" y="142">01</text>
    <text class="repair-then-fail-name" x="70" y="142">Strip the fence</text>
    <text class="repair-then-fail-desc" x="44" y="166">Markdown code fences are the</text>
    <text class="repair-then-fail-desc" x="44" y="182">commonest cause, and are not a</text>
    <text class="repair-then-fail-desc" x="44" y="198">model error.</text>
    <text class="repair-then-fail-edge" x="44" y="242">```json</text>
  </g>
  <line class="repair-then-fail-line repair-then-fail-conn repair-then-fail-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#repair-then-fail-tip)"/>
  <g class="repair-then-fail-stage repair-then-fail-s1">
    <rect class="repair-then-fail-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="repair-then-fail-step" x="280" y="142">02</text>
    <text class="repair-then-fail-name" x="306" y="142">Try to parse</text>
    <text class="repair-then-fail-desc" x="280" y="166">If it parses, validate it and</text>
    <text class="repair-then-fail-desc" x="280" y="182">you are done.</text>
  </g>
  <line class="repair-then-fail-line repair-then-fail-conn repair-then-fail-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#repair-then-fail-tip)"/>
  <g class="repair-then-fail-stage repair-then-fail-s2">
    <rect class="repair-then-fail-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="repair-then-fail-step" x="516" y="142">03</text>
    <text class="repair-then-fail-name" x="542" y="142">One repair attempt</text>
    <text class="repair-then-fail-desc" x="516" y="166">Reprompt with the error. ONE</text>
    <text class="repair-then-fail-desc" x="516" y="182">attempt — a loop here bills</text>
    <text class="repair-then-fail-desc" x="516" y="198">forever.</text>
    <text class="repair-then-fail-edge" x="516" y="242">once</text>
  </g>
  <line class="repair-then-fail-line repair-then-fail-conn repair-then-fail-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#repair-then-fail-tip)"/>
  <g class="repair-then-fail-stage repair-then-fail-s3">
    <rect class="repair-then-fail-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="repair-then-fail-step" x="752" y="142">04</text>
    <text class="repair-then-fail-name" x="778" y="142">Then fail honestly</text>
    <text class="repair-then-fail-desc" x="752" y="166">A clear error beats a silent</text>
    <text class="repair-then-fail-desc" x="752" y="182">fallback that returns something</text>
    <text class="repair-then-fail-desc" x="752" y="198">wrong.</text>
  </g>
  <text class="repair-then-fail-sub" x="30" y="304">The cap is the important part. An automatic repair loop against a metered model is Day 27's uncapped retry with a per-call price attached, and it fails in exactly the same shape.</text>
</svg>
