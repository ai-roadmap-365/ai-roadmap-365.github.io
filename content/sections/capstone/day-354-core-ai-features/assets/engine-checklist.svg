<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six checks, all cheap.">
  <title>Before the engine is done</title>
  <style>
    .engine-checklist-bg   { fill: #f8fafc; }
    .engine-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .engine-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .engine-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .engine-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .engine-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .engine-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .engine-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .engine-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .engine-checklist-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .engine-checklist-stage { opacity: 1; }

    .engine-checklist-s0 { animation-delay: 0.00s; }
    .engine-checklist-e0 { animation-delay: 0.00s; }
    .engine-checklist-s1 { animation-delay: 1.33s; }
    .engine-checklist-e1 { animation-delay: 1.33s; }
    .engine-checklist-s2 { animation-delay: 2.67s; }
    .engine-checklist-e2 { animation-delay: 2.67s; }
    .engine-checklist-s3 { animation-delay: 4.00s; }
    .engine-checklist-e3 { animation-delay: 4.00s; }
    .engine-checklist-s4 { animation-delay: 5.33s; }
    .engine-checklist-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .engine-checklist-conn  { animation: engine-checklist-trace 8s ease-in-out infinite; }
      .engine-checklist-stage { animation: engine-checklist-arrive 8s ease-in-out infinite; }
    }
    @keyframes engine-checklist-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes engine-checklist-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .engine-checklist-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .engine-checklist-stage { animation: engine-checklist-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes engine-checklist-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="engine-checklist-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="engine-checklist-bg" width="980" height="322"/>
  <text class="engine-checklist-h1"  x="30" y="40">Before the engine is done</text>
  <text class="engine-checklist-sub" x="30" y="64">Six checks, all cheap.</text>
  <g class="engine-checklist-stage engine-checklist-s0">
    <rect class="engine-checklist-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="engine-checklist-step" x="44" y="142">01</text>
    <text class="engine-checklist-name" x="70" y="142">Every response validated</text>
    <text class="engine-checklist-desc" x="44" y="166">Against a schema, before</text>
    <text class="engine-checklist-desc" x="44" y="182">any code acts on it.</text>
  </g>
  <line class="engine-checklist-line engine-checklist-conn engine-checklist-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#engine-checklist-tip)"/>
  <g class="engine-checklist-stage engine-checklist-s1">
    <rect class="engine-checklist-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="engine-checklist-step" x="233" y="142">02</text>
    <text class="engine-checklist-name" x="259" y="142">Fences stripped</text>
    <text class="engine-checklist-desc" x="233" y="166">And a test that proves</text>
    <text class="engine-checklist-desc" x="233" y="182">it, with a fenced sample.</text>
  </g>
  <line class="engine-checklist-line engine-checklist-conn engine-checklist-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#engine-checklist-tip)"/>
  <g class="engine-checklist-stage engine-checklist-s2">
    <rect class="engine-checklist-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="engine-checklist-step" x="422" y="142">03</text>
    <text class="engine-checklist-name" x="448" y="142">Every call has a timeout</text>
    <text class="engine-checklist-desc" x="422" y="166">And a fallback that</text>
    <text class="engine-checklist-desc" x="422" y="182">satisfies the same</text>
    <text class="engine-checklist-desc" x="422" y="198">schema.</text>
    <text class="engine-checklist-edge" x="422" y="242">timeout</text>
  </g>
  <line class="engine-checklist-line engine-checklist-conn engine-checklist-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#engine-checklist-tip)"/>
  <g class="engine-checklist-stage engine-checklist-s3">
    <rect class="engine-checklist-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="engine-checklist-step" x="611" y="142">04</text>
    <text class="engine-checklist-name" x="637" y="142">Repairs are capped</text>
    <text class="engine-checklist-desc" x="611" y="166">One attempt, then an</text>
    <text class="engine-checklist-desc" x="611" y="182">honest failure.</text>
    <text class="engine-checklist-edge" x="611" y="242">capped</text>
  </g>
  <line class="engine-checklist-line engine-checklist-conn engine-checklist-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#engine-checklist-tip)"/>
  <g class="engine-checklist-stage engine-checklist-s4">
    <rect class="engine-checklist-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="engine-checklist-step" x="800" y="142">05</text>
    <text class="engine-checklist-name" x="826" y="142">Every call is logged</text>
    <text class="engine-checklist-desc" x="800" y="166">Model, tokens, latency,</text>
    <text class="engine-checklist-desc" x="800" y="182">outcome. Day 40's</text>
    <text class="engine-checklist-desc" x="800" y="198">structured fields.</text>
  </g>
  <text class="engine-checklist-sub" x="30" y="304">The last one is what makes the rest measurable: without per-call model, token and latency fields you cannot attribute cost, compare the fallback, or notice quality drifting.</text>
</svg>
