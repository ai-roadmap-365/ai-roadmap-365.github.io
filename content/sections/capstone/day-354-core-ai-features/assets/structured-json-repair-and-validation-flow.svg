<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Structured JSON Repair and Validation Flow">
  <title>Structured JSON Repair and Validation Flow</title>
  <defs>
    <style>
      .d354b-bg { fill: #f8fafc; }
      .d354b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d354b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d354b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d354b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d354b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d354b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d354b-bg" />
  
  <text x="40" y="40" class="d354a-title">Self-Healing Structured Output Flow</text>
  <text x="40" y="65" class="d354a-subtitle">Structured JSON Repair and Validation Flow showing Raw Token Generation, JSON Parsing, Pydantic Schema Validation, Error Extraction, and Automated Correction Re-Prompt</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d354b-step" />
  <text x="55" y="145" class="d354b-header" fill="#1d4ed8">1. LLM Generation</text>
  <text x="55" y="180" class="d354b-text">• Generate raw output</text>
  <text x="55" y="205" class="d354b-text">• Markdown code blocks</text>
  <text x="55" y="230" class="d354b-text">• Unstructured tokens</text>
  <text x="55" y="300" class="d354b-text" font-weight="600">Raw Stream</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d354b-step" />
  <text x="265" y="145" class="d354b-header" fill="#1d4ed8">2. Schema Validate</text>
  <text x="265" y="180" class="d354b-text">• Parse JSON payload</text>
  <text x="265" y="205" class="d354b-text">• Execute Pydantic check</text>
  <text x="265" y="230" class="d354b-text">• Validate data types</text>
  <text x="265" y="300" class="d354b-text" font-weight="600">Type Checking</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d354b-step" />
  <text x="475" y="145" class="d354b-header" fill="#1d4ed8">3. Error Repair</text>
  <text x="475" y="180" class="d354b-text">• Extract parse error</text>
  <text x="475" y="205" class="d354b-text">• Build repair prompt</text>
  <text x="475" y="230" class="d354b-text">• Re-prompt model</text>
  <text x="475" y="300" class="d354b-text" font-weight="600">Self-Healing Loop</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d354b-step" />
  <text x="685" y="145" class="d354b-header" fill="#1d4ed8">4. Validated Output</text>
  <text x="685" y="180" class="d354b-text">• Valid Python model</text>
  <text x="685" y="205" class="d354b-text">• Grounded citations</text>
  <text x="685" y="230" class="d354b-text">• Emit to API caller</text>
  <text x="685" y="300" class="d354b-text" font-weight="600">100% Deterministic</text>
</svg>