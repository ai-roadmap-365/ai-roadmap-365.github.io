terms:
  - term: Security Posture
    definition: A description of how a system is configured, reviewable before any code exists — which
      is when changes are cheapest.
  - term: Prompt Injection
    definition: Instructions introduced through data the system consumes. Not patchable, because
      instructions and data share one channel by construction.
  - term: Insecure Output Handling
    definition: Treating model output as trusted — rendering it as markup or executing it as code.
  - term: Excessive Agency
    definition: Granting an agent more authority than its task requires, so a persuaded model can act
      beyond what was intended.
  - term: Unbounded Consumption
    definition: An uncapped spend or request path. The cheapest available attack, needing no
      vulnerability at all.
  - term: Blast Radius
    definition: How much damage a weakness permits. The correct basis for severity, rather than how
      sophisticated the flaw is.
  - term: Least Privilege
    definition: Granting the narrowest capability that accomplishes the task, so a compromise achieves
      less.
  - term: Defence in Depth
    definition: Layering controls so no single failure is sufficient. The realistic posture against
      prompt injection, which has no complete fix.
  - term: Remediation
    definition: The fix attached to a finding. A finding without one is a complaint rather than a review.
  - term: Threat Modelling
    definition: Asking what could go wrong at the point a design decision is made, rather than after
      code exists.
