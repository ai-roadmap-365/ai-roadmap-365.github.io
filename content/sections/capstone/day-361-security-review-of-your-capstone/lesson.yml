id: D361
day: 361
slug: security-review-of-your-capstone
title: Security Review of Your Capstone
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Review an AI application against the seven failure classes a capstone can realistically
  get wrong — untrusted content boundaries, output handling, tool scope, spend bounds, secret handling,
  trace retention and supply-chain pinning — weighting each by blast radius rather than by how
  interesting it is, and proving the review can fail before trusting a clean result.'
objectives:
  - Describe a system as a reviewable posture that can be assessed before any code exists.
  - Explain why prompt injection cannot be patched, and why the mitigation is the permission model.
  - Rate findings by consequence rather than sophistication, and show how severity accumulates.
  - Attach a remediation to every finding, so a review produces action rather than complaint.
  - Demonstrate that a review can fail, and why a clean report is otherwise meaningless.
