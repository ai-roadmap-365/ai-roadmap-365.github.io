<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The composition is the finding.">
  <title>Six defensible decisions, one broken system</title>
  <style>
    .weak-posture-composition-bg   { fill: #f8fafc; }
    .weak-posture-composition-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-posture-composition-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-posture-composition-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-posture-composition-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-posture-composition-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weak-posture-composition-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weak-posture-composition-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weak-posture-composition-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weak-posture-composition-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weak-posture-composition-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weak-posture-composition-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weak-posture-composition-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .weak-posture-composition-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .weak-posture-composition-stage { opacity: 1; }

    .weak-posture-composition-s0 { animation-delay: 0.00s; }
    .weak-posture-composition-e0 { animation-delay: 0.00s; }
    .weak-posture-composition-s1 { animation-delay: 1.33s; }
    .weak-posture-composition-e1 { animation-delay: 1.33s; }
    .weak-posture-composition-s2 { animation-delay: 2.67s; }
    .weak-posture-composition-e2 { animation-delay: 2.67s; }
    .weak-posture-composition-s3 { animation-delay: 4.00s; }
    .weak-posture-composition-e3 { animation-delay: 4.00s; }
    .weak-posture-composition-s4 { animation-delay: 5.33s; }
    .weak-posture-composition-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .weak-posture-composition-conn  { animation: weak-posture-composition-trace 8s ease-in-out infinite; }
      .weak-posture-composition-stage { animation: weak-posture-composition-arrive 8s ease-in-out infinite; }
    }
    @keyframes weak-posture-composition-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes weak-posture-composition-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .weak-posture-composition-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .weak-posture-composition-stage { animation: weak-posture-composition-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes weak-posture-composition-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="weak-posture-composition-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="weak-posture-composition-bg" width="980" height="322"/>
  <text class="weak-posture-composition-h1"  x="30" y="40">Six defensible decisions, one broken system</text>
  <text class="weak-posture-composition-sub" x="30" y="64">The composition is the finding.</text>
  <g class="weak-posture-composition-stage weak-posture-composition-s0">
    <rect class="weak-posture-composition-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="weak-posture-composition-step" x="44" y="142">01</text>
    <text class="weak-posture-composition-name" x="70" y="142">Retrieved content is concatenated</text>
    <text class="weak-posture-composition-desc" x="44" y="166">Simplest thing that</text>
    <text class="weak-posture-composition-desc" x="44" y="182">worked. Now a document</text>
    <text class="weak-posture-composition-desc" x="44" y="198">can issue instructions.</text>
  </g>
  <line class="weak-posture-composition-line weak-posture-composition-conn weak-posture-composition-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#weak-posture-composition-tip)"/>
  <g class="weak-posture-composition-stage weak-posture-composition-s1">
    <rect class="weak-posture-composition-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="weak-posture-composition-step" x="233" y="142">02</text>
    <text class="weak-posture-composition-name" x="259" y="142">The agent can delete</text>
    <text class="weak-posture-composition-desc" x="233" y="166">Read-only would have</text>
    <text class="weak-posture-composition-desc" x="233" y="182">needed a second</text>
    <text class="weak-posture-composition-desc" x="233" y="198">credential.</text>
    <text class="weak-posture-composition-edge" x="233" y="242">authority</text>
  </g>
  <line class="weak-posture-composition-line weak-posture-composition-conn weak-posture-composition-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#weak-posture-composition-tip)"/>
  <g class="weak-posture-composition-stage weak-posture-composition-s2">
    <rect class="weak-posture-composition-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="weak-posture-composition-step" x="422" y="142">03</text>
    <text class="weak-posture-composition-name" x="448" y="142">Output is rendered unescaped</text>
    <text class="weak-posture-composition-desc" x="422" y="166">It looked fine in</text>
    <text class="weak-posture-composition-desc" x="422" y="182">testing, because nothing</text>
    <text class="weak-posture-composition-desc" x="422" y="198">hostile was in the</text>
  </g>
  <line class="weak-posture-composition-line weak-posture-composition-conn weak-posture-composition-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#weak-posture-composition-tip)"/>
  <g class="weak-posture-composition-stage weak-posture-composition-s3">
    <rect class="weak-posture-composition-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="weak-posture-composition-step" x="611" y="142">04</text>
    <text class="weak-posture-composition-name" x="637" y="142">There is no spend cap</text>
    <text class="weak-posture-composition-desc" x="611" y="166">It never came up. The</text>
    <text class="weak-posture-composition-desc" x="611" y="182">resulting loop is</text>
    <text class="weak-posture-composition-desc" x="611" y="198">unbounded.</text>
    <text class="weak-posture-composition-edge" x="611" y="242">availability</text>
  </g>
  <line class="weak-posture-composition-line weak-posture-composition-conn weak-posture-composition-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#weak-posture-composition-tip)"/>
  <g class="weak-posture-composition-stage weak-posture-composition-s4">
    <rect class="weak-posture-composition-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="weak-posture-composition-step" x="800" y="142">05</text>
    <text class="weak-posture-composition-name" x="826" y="142">And it is all logged forever</text>
    <text class="weak-posture-composition-desc" x="800" y="166">Debugging was easier that</text>
    <text class="weak-posture-composition-desc" x="800" y="182">way.</text>
    <text class="weak-posture-composition-edge" x="800" y="242">permanent</text>
  </g>
  <text class="weak-posture-composition-sub" x="30" y="304">No single decision here is negligent, and each has a defensible local reason. The system is negligent, which is why the review examines the posture as a whole rather than one choice at a time.</text>
</svg>
