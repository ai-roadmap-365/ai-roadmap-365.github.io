<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The first is stronger.">
  <title>Remove the capability, or add a human</title>
  <style>
    .privilege-or-confirmation-bg   { fill: #f8fafc; }
    .privilege-or-confirmation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privilege-or-confirmation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privilege-or-confirmation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privilege-or-confirmation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privilege-or-confirmation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privilege-or-confirmation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privilege-or-confirmation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privilege-or-confirmation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privilege-or-confirmation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privilege-or-confirmation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privilege-or-confirmation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privilege-or-confirmation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privilege-or-confirmation-row { opacity: 1; }
    .privilege-or-confirmation-r0 { animation-delay: 0.00s; }
    .privilege-or-confirmation-r1 { animation-delay: 0.45s; }
    .privilege-or-confirmation-r2 { animation-delay: 0.90s; }
    .privilege-or-confirmation-r3 { animation-delay: 1.35s; }
    .privilege-or-confirmation-r4 { animation-delay: 1.80s; }
    .privilege-or-confirmation-row { animation: privilege-or-confirmation-reveal 7.3s ease-in-out infinite; }
    @keyframes privilege-or-confirmation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="privilege-or-confirmation-bg" width="980" height="390"/>
  <text class="privilege-or-confirmation-h1"  x="30" y="40">Remove the capability, or add a human</text>
  <text class="privilege-or-confirmation-sub" x="30" y="64">The first is stronger.</text>
  <rect class="privilege-or-confirmation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="privilege-or-confirmation-name" x="46" y="122">Least privilege</text>
  <text class="privilege-or-confirmation-desc" x="46" y="142">The capability is gone.</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r0" x="46" y="182">Nothing to persuade the model into</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r1" x="46" y="216">No human in the loop to tire</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r2" x="46" y="250">Scales to any volume</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r3" x="46" y="284">Needs a second credential, sometimes</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r4" x="46" y="318">Use whenever the capability is not needed</text>
  <rect class="privilege-or-confirmation-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="privilege-or-confirmation-name" x="526" y="122">Confirmation</text>
  <text class="privilege-or-confirmation-desc" x="526" y="142">The capability, gated.</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r0" x="526" y="182">The action remains possible</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r1" x="526" y="216">A person must approve each one</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r2" x="526" y="250">Does not scale to automation</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r3" x="526" y="284">People approve by reflex under load</text>
  <text class="privilege-or-confirmation-desc privilege-or-confirmation-row privilege-or-confirmation-r4" x="526" y="318">Use when the capability is genuinely needed</text>
  <text class="privilege-or-confirmation-sub" x="30" y="372">Confirmation fatigue is real and it is the same failure as alert fatigue from yesterday: a prompt that almost always says yes stops being a decision and becomes a keystroke.</text>
</svg>
