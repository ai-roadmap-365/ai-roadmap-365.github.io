<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="It follows from how the models work.">
  <title>Why injection is not a bug</title>
  <style>
    .injection-is-structural-bg   { fill: #f8fafc; }
    .injection-is-structural-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-is-structural-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-is-structural-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-is-structural-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-is-structural-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .injection-is-structural-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .injection-is-structural-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .injection-is-structural-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .injection-is-structural-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .injection-is-structural-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .injection-is-structural-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .injection-is-structural-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .injection-is-structural-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .injection-is-structural-stage { opacity: 1; }

    .injection-is-structural-s0 { animation-delay: 0.00s; }
    .injection-is-structural-e0 { animation-delay: 0.00s; }
    .injection-is-structural-s1 { animation-delay: 1.28s; }
    .injection-is-structural-e1 { animation-delay: 1.28s; }
    .injection-is-structural-s2 { animation-delay: 2.56s; }
    .injection-is-structural-e2 { animation-delay: 2.56s; }
    .injection-is-structural-s3 { animation-delay: 3.84s; }
    .injection-is-structural-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .injection-is-structural-conn  { animation: injection-is-structural-trace 6.4s ease-in-out infinite; }
      .injection-is-structural-stage { animation: injection-is-structural-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes injection-is-structural-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes injection-is-structural-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .injection-is-structural-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .injection-is-structural-stage { animation: injection-is-structural-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes injection-is-structural-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="injection-is-structural-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="injection-is-structural-bg" width="980" height="322"/>
  <text class="injection-is-structural-h1"  x="30" y="40">Why injection is not a bug</text>
  <text class="injection-is-structural-sub" x="30" y="64">It follows from how the models work.</text>
  <g class="injection-is-structural-stage injection-is-structural-s0">
    <rect class="injection-is-structural-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="injection-is-structural-step" x="44" y="142">01</text>
    <text class="injection-is-structural-name" x="70" y="142">Instructions arrive as text</text>
    <text class="injection-is-structural-desc" x="44" y="166">Your system prompt is a sequence</text>
    <text class="injection-is-structural-desc" x="44" y="182">of tokens.</text>
  </g>
  <line class="injection-is-structural-line injection-is-structural-conn injection-is-structural-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#injection-is-structural-tip)"/>
  <g class="injection-is-structural-stage injection-is-structural-s1">
    <rect class="injection-is-structural-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="injection-is-structural-step" x="280" y="142">02</text>
    <text class="injection-is-structural-name" x="306" y="142">Data arrives as text too</text>
    <text class="injection-is-structural-desc" x="280" y="166">A retrieved document is the same</text>
    <text class="injection-is-structural-desc" x="280" y="182">kind of thing, in the same</text>
    <text class="injection-is-structural-desc" x="280" y="198">channel.</text>
  </g>
  <line class="injection-is-structural-line injection-is-structural-conn injection-is-structural-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#injection-is-structural-tip)"/>
  <g class="injection-is-structural-stage injection-is-structural-s2">
    <rect class="injection-is-structural-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="injection-is-structural-step" x="516" y="142">03</text>
    <text class="injection-is-structural-name" x="542" y="142">No mechanism separates them</text>
    <text class="injection-is-structural-desc" x="516" y="166">The model has no privileged</text>
    <text class="injection-is-structural-desc" x="516" y="182">channel to trust over the other.</text>
    <text class="injection-is-structural-edge" x="516" y="242">structural</text>
  </g>
  <line class="injection-is-structural-line injection-is-structural-conn injection-is-structural-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#injection-is-structural-tip)"/>
  <g class="injection-is-structural-stage injection-is-structural-s3">
    <rect class="injection-is-structural-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="injection-is-structural-step" x="752" y="142">04</text>
    <text class="injection-is-structural-name" x="778" y="142">So the fix is architectural</text>
    <text class="injection-is-structural-desc" x="752" y="166">Delimit, treat as data, and</text>
    <text class="injection-is-structural-desc" x="752" y="182">grant no authority you do not</text>
    <text class="injection-is-structural-desc" x="752" y="198">need.</text>
    <text class="injection-is-structural-edge" x="752" y="242">permissions</text>
  </g>
  <text class="injection-is-structural-sub" x="30" y="304">This is why a filter is not a solution: filtering searches for phrasings you anticipated, and the property being exploited is not a phrasing but the absence of a trust boundary.</text>
</svg>
