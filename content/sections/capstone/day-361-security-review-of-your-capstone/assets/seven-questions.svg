<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them exotic.">
  <title>Seven questions, seven failures</title>
  <style>
    .seven-questions-bg   { fill: #f8fafc; }
    .seven-questions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seven-questions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seven-questions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seven-questions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seven-questions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seven-questions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seven-questions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .seven-questions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .seven-questions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .seven-questions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .seven-questions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .seven-questions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .seven-questions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .seven-questions-stage { opacity: 1; }

    .seven-questions-s0 { animation-delay: 0.00s; }
    .seven-questions-e0 { animation-delay: 0.00s; }
    .seven-questions-s1 { animation-delay: 1.40s; }
    .seven-questions-e1 { animation-delay: 1.40s; }
    .seven-questions-s2 { animation-delay: 2.80s; }
    .seven-questions-e2 { animation-delay: 2.80s; }
    .seven-questions-s3 { animation-delay: 4.20s; }
    .seven-questions-e3 { animation-delay: 4.20s; }
    .seven-questions-s4 { animation-delay: 5.60s; }
    .seven-questions-e4 { animation-delay: 5.60s; }
    .seven-questions-s5 { animation-delay: 7.00s; }
    .seven-questions-e5 { animation-delay: 7.00s; }
    .seven-questions-s6 { animation-delay: 8.40s; }
    .seven-questions-e6 { animation-delay: 8.40s; }
    @media (prefers-reduced-motion: no-preference) {
      .seven-questions-conn  { animation: seven-questions-trace 11.200000000000001s ease-in-out infinite; }
      .seven-questions-stage { animation: seven-questions-arrive 11.200000000000001s ease-in-out infinite; }
    }
    @keyframes seven-questions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes seven-questions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .seven-questions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .seven-questions-stage { animation: seven-questions-settle 11.200000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes seven-questions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="seven-questions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="seven-questions-bg" width="980" height="322"/>
  <text class="seven-questions-h1"  x="30" y="40">Seven questions, seven failures</text>
  <text class="seven-questions-sub" x="30" y="64">None of them exotic.</text>
  <g class="seven-questions-stage seven-questions-s0">
    <rect class="seven-questions-warn" x="30" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="44" y="142">01</text>
    <text class="seven-questions-name" x="70" y="142">Is retrieved content marked untrusted?</text>
    <text class="seven-questions-desc" x="44" y="166">Concatenated into</text>
    <text class="seven-questions-desc" x="44" y="182">one blob, a</text>
    <text class="seven-questions-desc" x="44" y="198">document can</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e0" x1="141" y1="170" x2="163" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s1">
    <rect class="seven-questions-box" x="165" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="179" y="142">02</text>
    <text class="seven-questions-name" x="205" y="142">Is output escaped, never executed?</text>
    <text class="seven-questions-desc" x="179" y="166">Model output is</text>
    <text class="seven-questions-desc" x="179" y="182">untrusted text</text>
    <text class="seven-questions-desc" x="179" y="198">from a very</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e1" x1="276" y1="170" x2="298" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s2">
    <rect class="seven-questions-box" x="300" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="314" y="142">03</text>
    <text class="seven-questions-name" x="340" y="142">Do tools have the narrowest scope?</text>
    <text class="seven-questions-desc" x="314" y="166">An agent with</text>
    <text class="seven-questions-desc" x="314" y="182">write access can</text>
    <text class="seven-questions-desc" x="314" y="198">write, including</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e2" x1="411" y1="170" x2="433" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s3">
    <rect class="seven-questions-box" x="435" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="449" y="142">04</text>
    <text class="seven-questions-name" x="475" y="142">Is spend bounded?</text>
    <text class="seven-questions-desc" x="449" y="166">An uncapped path</text>
    <text class="seven-questions-desc" x="449" y="182">is an</text>
    <text class="seven-questions-desc" x="449" y="198">availability</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e3" x1="546" y1="170" x2="568" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s4">
    <rect class="seven-questions-box" x="570" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="584" y="142">05</text>
    <text class="seven-questions-name" x="610" y="142">Are secrets outside image and repo?</text>
    <text class="seven-questions-desc" x="584" y="166">Both are</text>
    <text class="seven-questions-desc" x="584" y="182">distributable</text>
    <text class="seven-questions-desc" x="584" y="198">artefacts, and</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e4" x1="681" y1="170" x2="703" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s5">
    <rect class="seven-questions-box" x="705" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="719" y="142">06</text>
    <text class="seven-questions-name" x="745" y="142">Are traces bounded and deletable?</text>
    <text class="seven-questions-desc" x="719" y="166">The most</text>
    <text class="seven-questions-desc" x="719" y="182">sensitive store</text>
    <text class="seven-questions-desc" x="719" y="198">you keep, and the</text>
  </g>
  <line class="seven-questions-line seven-questions-conn seven-questions-e5" x1="816" y1="170" x2="838" y2="170" marker-end="url(#seven-questions-tip)"/>
  <g class="seven-questions-stage seven-questions-s6">
    <rect class="seven-questions-good" x="840" y="118" width="109" height="104" rx="10"/>
    <text class="seven-questions-step" x="854" y="142">07</text>
    <text class="seven-questions-name" x="880" y="142">Is the supply chain pinned?</text>
    <text class="seven-questions-desc" x="854" y="166">A mutable tag is</text>
    <text class="seven-questions-desc" x="854" y="182">a decision</text>
    <text class="seven-questions-desc" x="854" y="198">someone else can</text>
  </g>
  <text class="seven-questions-sub" x="30" y="304">Each check owns exactly one failure, which is what makes the findings prioritisable: a review where one bad decision lights up four checks cannot tell you what to fix first.</text>
</svg>
