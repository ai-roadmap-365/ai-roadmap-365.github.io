<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" role="img" aria-label="Severity is Blast Radius showing a dull finding with a large consequence outranking an interesting finding with a small one">
  <title>Severity is Blast Radius</title>
  <defs>
    <style>
      .d361b-bg { fill: #f8fafc; }
      .d361b-big { fill: #fecaca; stroke: #ef4444; stroke-width: 2px; }
      .d361b-small { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2px; }
      .d361b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d361b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d361b-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d361b-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d361b-t { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
      .d361b-key { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d361b-bg"/>
  <text x="40" y="40" class="d361b-title">Severity is Blast Radius</text>
  <text x="40" y="64" class="d361b-sub">Weight the consequence, not how interesting the flaw is. The dull findings are the ones that take services down.</text>

  <rect x="40" y="100" width="390" height="150" rx="8" class="d361b-card"/>
  <text x="235" y="126" class="d361b-h" text-anchor="middle">"No spend cap"</text>
  <text x="235" y="146" class="d361b-t" text-anchor="middle">Dull. Obvious. Nobody writes a talk about it.</text>
  <circle cx="235" cy="196" r="42" class="d361b-big"/>
  <text x="235" y="200" class="d361b-t" text-anchor="middle">HIGH</text>
  <text x="235" y="232" class="d361b-t" text-anchor="middle">service can be taken down by anyone</text>

  <rect x="465" y="100" width="395" height="150" rx="8" class="d361b-card"/>
  <text x="662" y="126" class="d361b-h" text-anchor="middle">"Dependency not pinned"</text>
  <text x="662" y="146" class="d361b-t" text-anchor="middle">Interesting. Supply chain. Worth discussing.</text>
  <circle cx="662" cy="196" r="22" class="d361b-small"/>
  <text x="662" y="200" class="d361b-t" text-anchor="middle">MED</text>
  <text x="662" y="232" class="d361b-t" text-anchor="middle">real, narrower, needs a second failure</text>

  <text x="40" y="296" class="d361b-h">Severity accumulates, because consequences do</text>
  <text x="40" y="318" class="d361b-t">Indefinite trace retention on its own is MEDIUM. Add no deletion path and no redaction and it becomes HIGH — the same</text>
  <text x="40" y="336" class="d361b-t">store, three missing controls, and now the content is unbounded, unremovable and unredacted.</text>
  <text x="40" y="366" class="d361b-key">A review that has never found anything is not evidence of safety.</text>
  <text x="40" y="388" class="d361b-t">Unless you know it can fail, a clean report and a review that checks nothing look identical from the outside.</text>
</svg>
