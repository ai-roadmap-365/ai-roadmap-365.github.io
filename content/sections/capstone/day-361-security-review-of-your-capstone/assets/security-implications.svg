<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them contradicts a common instinct.">
  <title>Five consequences worth stating</title>
  <style>
    .security-implications-bg   { fill: #f8fafc; }
    .security-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .security-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .security-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .security-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .security-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .security-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .security-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .security-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .security-implications-stage { opacity: 1; }

    .security-implications-s0 { animation-delay: 0.00s; }
    .security-implications-e0 { animation-delay: 0.00s; }
    .security-implications-s1 { animation-delay: 1.33s; }
    .security-implications-e1 { animation-delay: 1.33s; }
    .security-implications-s2 { animation-delay: 2.67s; }
    .security-implications-e2 { animation-delay: 2.67s; }
    .security-implications-s3 { animation-delay: 4.00s; }
    .security-implications-e3 { animation-delay: 4.00s; }
    .security-implications-s4 { animation-delay: 5.33s; }
    .security-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .security-implications-conn  { animation: security-implications-trace 8s ease-in-out infinite; }
      .security-implications-stage { animation: security-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes security-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes security-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .security-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .security-implications-stage { animation: security-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes security-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="security-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="security-implications-bg" width="980" height="322"/>
  <text class="security-implications-h1"  x="30" y="40">Five consequences worth stating</text>
  <text class="security-implications-sub" x="30" y="64">One of them contradicts a common instinct.</text>
  <g class="security-implications-stage security-implications-s0">
    <rect class="security-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="security-implications-step" x="44" y="142">01</text>
    <text class="security-implications-name" x="70" y="142">Defence in depth, not a fix</text>
    <text class="security-implications-desc" x="44" y="166">Assume the model may be</text>
    <text class="security-implications-desc" x="44" y="182">persuaded. The permission</text>
    <text class="security-implications-desc" x="44" y="198">model is the mitigation.</text>
    <text class="security-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="security-implications-line security-implications-conn security-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#security-implications-tip)"/>
  <g class="security-implications-stage security-implications-s1">
    <rect class="security-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="security-implications-step" x="233" y="142">02</text>
    <text class="security-implications-name" x="259" y="142">Traces are the risk store</text>
    <text class="security-implications-desc" x="233" y="166">Two of three retention</text>
    <text class="security-implications-desc" x="233" y="182">sub-checks are deletion</text>
    <text class="security-implications-desc" x="233" y="198">and redaction, not</text>
    <text class="security-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="security-implications-line security-implications-conn security-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#security-implications-tip)"/>
  <g class="security-implications-stage security-implications-s2">
    <rect class="security-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="security-implications-step" x="422" y="142">03</text>
    <text class="security-implications-name" x="448" y="142">Every control here is microseconds</text>
    <text class="security-implications-desc" x="422" y="166">There is no performance</text>
    <text class="security-implications-desc" x="422" y="182">argument against any of</text>
    <text class="security-implications-desc" x="422" y="198">them.</text>
    <text class="security-implications-edge" x="422" y="242">performance</text>
  </g>
  <line class="security-implications-line security-implications-conn security-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#security-implications-tip)"/>
  <g class="security-implications-stage security-implications-s3">
    <rect class="security-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="security-implications-step" x="611" y="142">04</text>
    <text class="security-implications-name" x="637" y="142">Confirmation does not scale</text>
    <text class="security-implications-desc" x="611" y="166">Narrow the scope further</text>
    <text class="security-implications-desc" x="611" y="182">instead. An agent that</text>
    <text class="security-implications-desc" x="611" y="198">cannot delete needs no</text>
    <text class="security-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="security-implications-line security-implications-conn security-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#security-implications-tip)"/>
  <g class="security-implications-stage security-implications-s4">
    <rect class="security-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="security-implications-step" x="800" y="142">05</text>
    <text class="security-implications-name" x="826" y="142">A spend cap is a security control</text>
    <text class="security-implications-desc" x="800" y="166">Unbounded consumption</text>
    <text class="security-implications-desc" x="800" y="182">needs no vulnerability at</text>
    <text class="security-implications-desc" x="800" y="198">all.</text>
    <text class="security-implications-edge" x="800" y="242">cost</text>
  </g>
  <text class="security-implications-sub" x="30" y="304">The fourth is the tension that matters in practice: automation and confirmation pull against each other, and the resolution is almost always to remove the capability rather than to remove the prompt.</text>
</svg>
