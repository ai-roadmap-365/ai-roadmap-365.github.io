<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each step moved security earlier.">
  <title>From threat modelling to the LLM list</title>
  <style>
    .security-eras-bg   { fill: #f8fafc; }
    .security-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .security-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .security-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .security-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .security-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .security-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .security-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .security-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .security-eras-stage { opacity: 1; }

    .security-eras-s0 { animation-delay: 0.00s; }
    .security-eras-e0 { animation-delay: 0.00s; }
    .security-eras-s1 { animation-delay: 1.28s; }
    .security-eras-e1 { animation-delay: 1.28s; }
    .security-eras-s2 { animation-delay: 2.56s; }
    .security-eras-e2 { animation-delay: 2.56s; }
    .security-eras-s3 { animation-delay: 3.84s; }
    .security-eras-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .security-eras-conn  { animation: security-eras-trace 6.4s ease-in-out infinite; }
      .security-eras-stage { animation: security-eras-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes security-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes security-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .security-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .security-eras-stage { animation: security-eras-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes security-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="security-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="security-eras-bg" width="980" height="322"/>
  <text class="security-eras-h1"  x="30" y="40">From threat modelling to the LLM list</text>
  <text class="security-eras-sub" x="30" y="64">Each step moved security earlier.</text>
  <g class="security-eras-stage security-eras-s0">
    <rect class="security-eras-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="security-eras-step" x="44" y="142">01</text>
    <text class="security-eras-name" x="70" y="142">Threat modelling, 1999</text>
    <text class="security-eras-desc" x="44" y="166">STRIDE. Security becomes a</text>
    <text class="security-eras-desc" x="44" y="182">design activity, not a testing</text>
    <text class="security-eras-desc" x="44" y="198">one.</text>
    <text class="security-eras-edge" x="44" y="242">design time</text>
  </g>
  <line class="security-eras-line security-eras-conn security-eras-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#security-eras-tip)"/>
  <g class="security-eras-stage security-eras-s1">
    <rect class="security-eras-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="security-eras-step" x="280" y="142">02</text>
    <text class="security-eras-name" x="306" y="142">OWASP Top 10, 2003</text>
    <text class="security-eras-desc" x="280" y="166">Ranked by what causes incidents,</text>
    <text class="security-eras-desc" x="280" y="182">not by what is interesting.</text>
  </g>
  <line class="security-eras-line security-eras-conn security-eras-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#security-eras-tip)"/>
  <g class="security-eras-stage security-eras-s2">
    <rect class="security-eras-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="security-eras-step" x="516" y="142">03</text>
    <text class="security-eras-name" x="542" y="142">Prompt injection, 2022</text>
    <text class="security-eras-desc" x="516" y="166">Named once instruction-following</text>
    <text class="security-eras-desc" x="516" y="182">models were widely available.</text>
  </g>
  <line class="security-eras-line security-eras-conn security-eras-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#security-eras-tip)"/>
  <g class="security-eras-stage security-eras-s3">
    <rect class="security-eras-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="security-eras-step" x="752" y="142">04</text>
    <text class="security-eras-name" x="778" y="142">OWASP for LLMs, 2023</text>
    <text class="security-eras-desc" x="752" y="166">Injection, output handling,</text>
    <text class="security-eras-desc" x="752" y="182">unbounded consumption, excessive</text>
    <text class="security-eras-desc" x="752" y="198">agency.</text>
    <text class="security-eras-edge" x="752" y="242">this list</text>
  </g>
  <text class="security-eras-sub" x="30" y="304">The first step is the one this lesson borrows most directly: the posture in today's lab is a description you can review before any code exists, which is when changing a decision is still cheap.</text>
</svg>
