questions:
  - question: Why is prompt injection not a bug that can be patched, and what follows for mitigation?
    options:
      - It is patchable; providers release filters that solve it
      - Because a language model receives instructions and data through the same channel with no
        mechanism to distinguish them, so the mitigation is architectural — mark untrusted content, grant
        minimal authority, and confirm consequential actions
      - Because models are trained on injected text and cannot unlearn it
      - Because it only affects retrieval systems, which cannot be secured
    answer_index: 1
    explanation: It follows from how the models work rather than from a defect. The defence is the
      permission model, not the prompt — assume the model may be persuaded and limit what that achieves.
  - question: Why is a missing spend cap rated as severely as unescaped output?
    options:
      - Because both are equally likely to occur
      - Because severity reflects blast radius rather than sophistication, and unbounded consumption is
        the cheapest available attack — it needs no vulnerability, only a request that costs you more
        than it costs the attacker
      - Because spend limits are required by most providers
      - Because unescaped output is not actually dangerous
    answer_index: 1
    explanation: Dull findings take services down. Rating by how interesting a flaw is puts the
      supply-chain finding above the one that can make the service unavailable today.
  - question: Why does committing a secret require rotation rather than deletion?
    options:
      - Because deletion requires administrator access
      - Because removing the file does not remove it from the repository's history, so the credential
        remains retrievable by anyone with the repository
      - Because rotation is faster than deletion
      - Because deleted files are restored by the next deployment
    answer_index: 1
    explanation: History is the artefact, not the working tree. The check's remediation names rotation
      first for exactly this reason.
  - question: Why does the lab ship a deliberately weak posture alongside a sound one?
    options:
      - To give learners a template to copy
      - Because a review that has never found anything is not evidence of safety — a clean report and a
        review that checks nothing are indistinguishable unless you know it can fail
      - Because the sound posture is too simple to test
      - To measure how long the review takes on a large input
    answer_index: 1
    explanation: The same argument as the broken assistant on Day 329. Demonstrating that a checker can
      fail is what makes its passing result mean something.
  - question: Indefinite trace retention alone is medium; with no deletion path and no redaction it is
      high. Why?
    options:
      - Because three findings are always worse than one
      - Because severity accumulates with consequence — the same store is now unbounded, unremovable and
        unredacted, so content grows forever, cannot be erased on request, and is stored in the clear
      - Because the check counts problems and scales severity by the count
      - Because redaction is a legal requirement and retention is not
    answer_index: 1
    explanation: Each control missing alone leaves a partial mitigation. All three missing removes every
      mitigation from the most sensitive store in the system.
