visuals:
  - id: the-seven-checks
    file: assets/the-seven-checks.svg
    type: diagram
    title: The Seven Checks and What Each One Owns
    alt: The Seven Checks and What Each One Owns showing the review areas from untrusted content through
      supply chain, with the failure each catches
    description: The seven review areas with the failure each owns, and how individually defensible
      decisions compose into a system where a document can direct a destructive action.
  - id: severity-is-blast-radius
    file: assets/severity-is-blast-radius.svg
    type: diagram
    title: Severity is Blast Radius
    alt: Severity is Blast Radius showing a dull finding with a large consequence outranking an
      interesting finding with a small one
    description: A missing spend cap rated above an unpinned dependency, with a note on how severity
      accumulates when several controls are missing from the same store.
  - id: seven-questions
    file: assets/seven-questions.svg
    type: diagram
    title: 'Seven questions, seven failures'
    alt: 'Diagram: the seven questions a security review of an AI application asks'
    description: 'A seven-stage description of the checks in an AI security review, from marking untrusted content through pinning the supply chain.'
  - id: severity-weighting
    file: assets/severity-weighting.svg
    type: diagram
    title: 'Severity is blast radius'
    alt: 'Diagram: weighting a finding by consequence rather than by cleverness'
    description: 'A two-column comparison of weighting security findings by consequence against weighting them by technical interest.'
  - id: security-eras
    file: assets/security-eras.svg
    type: diagram
    title: 'From threat modelling to the LLM list'
    alt: 'Diagram: the progression from threat modelling to the OWASP list for LLM applications'
    description: 'A four-stage progression from STRIDE threat modelling through the OWASP Top 10 and the naming of prompt injection to the OWASP list for LLM applications.'
  - id: injection-is-structural
    file: assets/injection-is-structural.svg
    type: diagram
    title: 'Why injection is not a bug'
    alt: 'Diagram: why instructions and data sharing one channel cannot be filtered apart'
    description: 'A four-stage explanation of prompt injection as a structural property of language models rather than a defect that can be patched.'
  - id: review-not-pentest
    file: assets/review-not-pentest.svg
    type: diagram
    title: 'A review is not a penetration test'
    alt: 'Diagram: a design posture review compared with a penetration test'
    description: 'A two-column comparison of a configuration posture review against a penetration test, by what each examines and when each is worth doing.'
  - id: severity-ladder
    file: assets/severity-ladder.svg
    type: diagram
    title: 'What makes a finding high'
    alt: 'Diagram: the severity ladder for security findings'
    description: 'A four-stage severity ladder defining high, medium and low findings by consequence, and the rule for aggregating them into a verdict.'
  - id: review-that-can-fail
    file: assets/review-that-can-fail.svg
    type: diagram
    title: 'Test the review itself'
    alt: 'Diagram: a review proven able to fail compared with one that has never failed'
    description: 'A two-column comparison of a review validated against a deliberately weak configuration against one that has only ever been run on the real system.'
  - id: inspection-analogy
    file: assets/inspection-analogy.svg
    type: diagram
    title: 'A safety inspection, not a burglary'
    alt: 'Diagram: a building safety inspection compared with attempting a break-in'
    description: 'A two-column comparison of a systematic building safety inspection against an attempt to break in, as an analogy for review versus penetration testing.'
  - id: weak-posture-composition
    file: assets/weak-posture-composition.svg
    type: diagram
    title: 'Six defensible decisions, one broken system'
    alt: 'Diagram: how six individually reasonable decisions compose into a critical failure'
    description: 'A five-stage walkthrough of how unmarked content, excessive scope, unescaped output, absent spend caps and permanent traces compose into a single exploitable path.'
  - id: security-implications
    file: assets/security-implications.svg
    type: diagram
    title: 'Five consequences worth stating'
    alt: 'Diagram: the security, privacy, performance, scalability and cost consequences of these controls'
    description: 'A five-stage description of the implications of AI security controls covering defence in depth, trace privacy, the negligible cost of the controls, the limits of confirmation, and spend caps as security.'
  - id: privilege-or-confirmation
    file: assets/privilege-or-confirmation.svg
    type: diagram
    title: 'Remove the capability, or add a human'
    alt: 'Diagram: least privilege compared with requiring confirmation'
    description: 'A two-column comparison of removing a capability entirely against retaining it behind a human confirmation step.'
  - id: when-to-review
    file: assets/when-to-review.svg
    type: diagram
    title: 'When to run the review'
    alt: 'Diagram: when a security review is worth running'
    description: 'A two-column comparison of the moments when a posture review earns its cost against those when re-running it adds little.'
