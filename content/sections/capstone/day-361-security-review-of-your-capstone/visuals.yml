visuals:
  - id: the-seven-checks
    file: assets/the-seven-checks.svg
    type: diagram
    title: The Seven Checks and What Each One Owns
    alt: The Seven Checks and What Each One Owns showing the review areas from untrusted content through
      supply chain, with the failure each catches
    description: The seven review areas with the failure each owns, and how individually defensible
      decisions compose into a system where a document can direct a destructive action.
  - id: severity-is-blast-radius
    file: assets/severity-is-blast-radius.svg
    type: diagram
    title: Severity is Blast Radius
    alt: Severity is Blast Radius showing a dull finding with a large consequence outranking an
      interesting finding with a small one
    description: A missing spend cap rated above an unpinned dependency, with a note on how severity
      accumulates when several controls are missing from the same store.
