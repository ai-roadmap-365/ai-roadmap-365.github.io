terms:
- term: ReAct Framework
  definition: An agent architecture interleaving Reasoning thoughts, Action tool calls, and Observations.
- term: Tool Registry
  definition: A centralized directory mapping tool names to schemas, handlers, and permission scopes.
- term: Sandboxed Dispatcher
  definition: An execution wrapper isolating tool calls with timeout limits and permission checks.
- term: Scratchpad Memory
  definition: A dynamic conversational buffer recording intermediate reasoning steps and tool responses.
- term: Max Turn Limit
  definition: A hard safety constraint bounding the maximum number of reasoning cycles per request.
- term: State Checkpointing
  definition: Persisting serializable agent execution snapshots for recovery and auditability.
- term: Human-in-the-Loop Gate
  definition: A pause mechanism requiring manual confirmation before executing high-stakes tools.
- term: Idempotent Tool
  definition: A tool function that produces identical system states when executed multiple times.
