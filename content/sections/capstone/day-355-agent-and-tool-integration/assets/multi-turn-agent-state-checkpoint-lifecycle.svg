<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Turn Agent State Checkpoint Lifecycle">
  <title>Multi-Turn Agent State Checkpoint Lifecycle</title>
  <defs>
    <style>
      .d355b-bg { fill: #f8fafc; }
      .d355b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d355b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d355b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d355b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d355b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d355b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d355b-bg" />
  
  <text x="40" y="40" class="d355a-title">Agent Execution Checkpoint Timeline</text>
  <text x="40" y="65" class="d355a-subtitle">Multi-Turn Agent State Checkpoint Lifecycle showing Turn 1 Thought/Action, Turn 2 Observation/Action, Checkpoint Snapshot, and Final Response</text>
  
  <!-- Turn 1 -->
  <rect x="40" y="110" width="185" height="270" class="d355b-step" />
  <text x="55" y="145" class="d355b-header" fill="#1d4ed8">Turn 1: Plan &amp; Search</text>
  <text x="55" y="180" class="d355b-text">• Thought: Need SQL query</text>
  <text x="55" y="205" class="d355b-text">• Action: run_sql_query</text>
  <text x="55" y="230" class="d355b-text">• Args: {"table": "users"}</text>
  <text x="55" y="255" class="d355b-text">• Status: Dispatched</text>
  <text x="55" y="300" class="d355b-text" font-weight="600">Checkpoint 1</text>
  
  <!-- Turn 2 -->
  <rect x="250" y="110" width="185" height="270" class="d355b-step" />
  <text x="265" y="145" class="d355b-header" fill="#1d4ed8">Turn 2: Analyze Output</text>
  <text x="265" y="180" class="d355b-text">• Observation: 50 records</text>
  <text x="265" y="205" class="d355b-text">• Thought: Need calculator</text>
  <text x="265" y="230" class="d355b-text">• Action: calculate_metric</text>
  <text x="265" y="255" class="d355b-text">• Args: {"formula": "sum"}</text>
  <text x="265" y="300" class="d355b-text" font-weight="600">Checkpoint 2</text>
  
  <!-- Turn 3 -->
  <rect x="460" y="110" width="185" height="270" class="d355b-step" />
  <text x="475" y="145" class="d355b-header" fill="#1d4ed8">Turn 3: Human Gate</text>
  <text x="475" y="180" class="d355b-text">• Action: send_email_alert</text>
  <text x="475" y="205" class="d355b-text">• Policy: High Stakes</text>
  <text x="475" y="230" class="d355b-text">• Gate: PAUSE for Human</text>
  <text x="475" y="255" class="d355b-text">• Approval: CONFIRMED</text>
  <text x="475" y="300" class="d355b-text" font-weight="600">Approved Action</text>
  
  <!-- Turn 4 -->
  <rect x="670" y="110" width="190" height="270" class="d355b-step" />
  <text x="685" y="145" class="d355b-header" fill="#1d4ed8">Turn 4: Final Synthesis</text>
  <text x="685" y="180" class="d355b-text">• Thought: All data ready</text>
  <text x="685" y="205" class="d355b-text">• Action: FINAL_ANSWER</text>
  <text x="685" y="230" class="d355b-text">• Synthesize response</text>
  <text x="685" y="255" class="d355b-text">• Emit structured JSON</text>
  <text x="685" y="300" class="d355b-text" font-weight="600">Execution Complete</text>
</svg>