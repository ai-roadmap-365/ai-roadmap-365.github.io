<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Even when the tool is yours.">
  <title>A tool result is untrusted input</title>
  <style>
    .prompt-injection-via-tools-bg   { fill: #f8fafc; }
    .prompt-injection-via-tools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-injection-via-tools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-injection-via-tools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-injection-via-tools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-injection-via-tools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-injection-via-tools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-injection-via-tools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-injection-via-tools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-injection-via-tools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-injection-via-tools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-injection-via-tools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-injection-via-tools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .prompt-injection-via-tools-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .prompt-injection-via-tools-stage { opacity: 1; }

    .prompt-injection-via-tools-s0 { animation-delay: 0.00s; }
    .prompt-injection-via-tools-e0 { animation-delay: 0.00s; }
    .prompt-injection-via-tools-s1 { animation-delay: 1.28s; }
    .prompt-injection-via-tools-e1 { animation-delay: 1.28s; }
    .prompt-injection-via-tools-s2 { animation-delay: 2.56s; }
    .prompt-injection-via-tools-e2 { animation-delay: 2.56s; }
    .prompt-injection-via-tools-s3 { animation-delay: 3.84s; }
    .prompt-injection-via-tools-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .prompt-injection-via-tools-conn  { animation: prompt-injection-via-tools-trace 6.4s ease-in-out infinite; }
      .prompt-injection-via-tools-stage { animation: prompt-injection-via-tools-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes prompt-injection-via-tools-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes prompt-injection-via-tools-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .prompt-injection-via-tools-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .prompt-injection-via-tools-stage { animation: prompt-injection-via-tools-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes prompt-injection-via-tools-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="prompt-injection-via-tools-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="prompt-injection-via-tools-bg" width="980" height="322"/>
  <text class="prompt-injection-via-tools-h1"  x="30" y="40">A tool result is untrusted input</text>
  <text class="prompt-injection-via-tools-sub" x="30" y="64">Even when the tool is yours.</text>
  <g class="prompt-injection-via-tools-stage prompt-injection-via-tools-s0">
    <rect class="prompt-injection-via-tools-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-injection-via-tools-step" x="44" y="142">01</text>
    <text class="prompt-injection-via-tools-name" x="70" y="142">The agent calls a tool</text>
    <text class="prompt-injection-via-tools-desc" x="44" y="166">Fetch a page, read a document,</text>
    <text class="prompt-injection-via-tools-desc" x="44" y="182">query a store.</text>
  </g>
  <line class="prompt-injection-via-tools-line prompt-injection-via-tools-conn prompt-injection-via-tools-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#prompt-injection-via-tools-tip)"/>
  <g class="prompt-injection-via-tools-stage prompt-injection-via-tools-s1">
    <rect class="prompt-injection-via-tools-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-injection-via-tools-step" x="280" y="142">02</text>
    <text class="prompt-injection-via-tools-name" x="306" y="142">The result enters the next prompt</text>
    <text class="prompt-injection-via-tools-desc" x="280" y="166">That is how the loop works. It</text>
    <text class="prompt-injection-via-tools-desc" x="280" y="182">is now indistinguishable from</text>
    <text class="prompt-injection-via-tools-desc" x="280" y="198">your instructions.</text>
  </g>
  <line class="prompt-injection-via-tools-line prompt-injection-via-tools-conn prompt-injection-via-tools-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#prompt-injection-via-tools-tip)"/>
  <g class="prompt-injection-via-tools-stage prompt-injection-via-tools-s2">
    <rect class="prompt-injection-via-tools-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-injection-via-tools-step" x="516" y="142">03</text>
    <text class="prompt-injection-via-tools-name" x="542" y="142">So content can instruct</text>
    <text class="prompt-injection-via-tools-desc" x="516" y="166">A document containing "ignore</text>
    <text class="prompt-injection-via-tools-desc" x="516" y="182">previous instructions" is an</text>
    <text class="prompt-injection-via-tools-desc" x="516" y="198">attack, not a curiosity.</text>
    <text class="prompt-injection-via-tools-edge" x="516" y="242">injection</text>
  </g>
  <line class="prompt-injection-via-tools-line prompt-injection-via-tools-conn prompt-injection-via-tools-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#prompt-injection-via-tools-tip)"/>
  <g class="prompt-injection-via-tools-stage prompt-injection-via-tools-s3">
    <rect class="prompt-injection-via-tools-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="prompt-injection-via-tools-step" x="752" y="142">04</text>
    <text class="prompt-injection-via-tools-name" x="778" y="142">Contain it</text>
    <text class="prompt-injection-via-tools-desc" x="752" y="166">Delimit and label untrusted</text>
    <text class="prompt-injection-via-tools-desc" x="752" y="182">content; never let it widen the</text>
    <text class="prompt-injection-via-tools-desc" x="752" y="198">agent's permissions.</text>
    <text class="prompt-injection-via-tools-edge" x="752" y="242">contain</text>
  </g>
  <text class="prompt-injection-via-tools-sub" x="30" y="304">There is no complete defence at the prompt level, which is why the durable control is capability: an agent that cannot delete cannot be talked into deleting, whatever a document tells it.</text>
</svg>
