<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Turns, tokens, and wall-clock.">
  <title>Every agent needs three caps</title>
  <style>
    .bounded-cost-bg   { fill: #f8fafc; }
    .bounded-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounded-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounded-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounded-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounded-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bounded-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bounded-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bounded-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bounded-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bounded-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bounded-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bounded-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bounded-cost-row { opacity: 1; }
    .bounded-cost-r0 { animation-delay: 0.00s; }
    .bounded-cost-r1 { animation-delay: 0.45s; }
    .bounded-cost-r2 { animation-delay: 0.90s; }
    .bounded-cost-r3 { animation-delay: 1.35s; }
    .bounded-cost-r4 { animation-delay: 1.80s; }
    .bounded-cost-row { animation: bounded-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes bounded-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bounded-cost-bg" width="980" height="390"/>
  <text class="bounded-cost-h1"  x="30" y="40">Every agent needs three caps</text>
  <text class="bounded-cost-sub" x="30" y="64">Turns, tokens, and wall-clock.</text>
  <rect class="bounded-cost-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bounded-cost-name" x="46" y="122">Uncapped</text>
  <text class="bounded-cost-desc" x="46" y="142">A billing incident waiting to happen.</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r0" x="46" y="182">A loop that cannot converge runs forever</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r1" x="46" y="216">Each turn costs tokens, in and out</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r2" x="46" y="250">Two agents calling each other compound it</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r3" x="46" y="284">Nobody notices until the invoice</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r4" x="46" y="318">Day 27's uncapped retry, with a price</text>
  <rect class="bounded-cost-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bounded-cost-name" x="526" y="122">Capped</text>
  <text class="bounded-cost-desc" x="526" y="142">Bounded worst case, by construction.</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r0" x="526" y="182">Maximum turns, checked each iteration</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r1" x="526" y="216">A token budget for the whole run</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r2" x="526" y="250">A wall-clock deadline</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r3" x="526" y="284">Hitting a cap is a defined outcome, logged</text>
  <text class="bounded-cost-desc bounded-cost-row bounded-cost-r4" x="526" y="318">Worst case is known before you ship</text>
  <text class="bounded-cost-sub" x="30" y="372">State what happens at the cap as part of the design: returning the best partial answer, or refusing honestly, are both defensible — silently truncating and presenting the result as complete is not.</text>
</svg>
