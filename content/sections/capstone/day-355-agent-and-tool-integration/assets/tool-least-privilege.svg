<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The agent's blast radius is the union of its tools.">
  <title>Scope each tool as narrowly as it can work</title>
  <style>
    .tool-least-privilege-bg   { fill: #f8fafc; }
    .tool-least-privilege-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-least-privilege-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-least-privilege-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-least-privilege-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-least-privilege-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tool-least-privilege-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tool-least-privilege-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tool-least-privilege-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tool-least-privilege-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tool-least-privilege-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tool-least-privilege-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tool-least-privilege-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tool-least-privilege-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tool-least-privilege-stage { opacity: 1; }

    .tool-least-privilege-s0 { animation-delay: 0.00s; }
    .tool-least-privilege-e0 { animation-delay: 0.00s; }
    .tool-least-privilege-s1 { animation-delay: 1.28s; }
    .tool-least-privilege-e1 { animation-delay: 1.28s; }
    .tool-least-privilege-s2 { animation-delay: 2.56s; }
    .tool-least-privilege-e2 { animation-delay: 2.56s; }
    .tool-least-privilege-s3 { animation-delay: 3.84s; }
    .tool-least-privilege-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tool-least-privilege-conn  { animation: tool-least-privilege-trace 6.4s ease-in-out infinite; }
      .tool-least-privilege-stage { animation: tool-least-privilege-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tool-least-privilege-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tool-least-privilege-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tool-least-privilege-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tool-least-privilege-stage { animation: tool-least-privilege-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tool-least-privilege-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tool-least-privilege-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tool-least-privilege-bg" width="980" height="322"/>
  <text class="tool-least-privilege-h1"  x="30" y="40">Scope each tool as narrowly as it can work</text>
  <text class="tool-least-privilege-sub" x="30" y="64">The agent's blast radius is the union of its tools.</text>
  <g class="tool-least-privilege-stage tool-least-privilege-s0">
    <rect class="tool-least-privilege-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tool-least-privilege-step" x="44" y="142">01</text>
    <text class="tool-least-privilege-name" x="70" y="142">"Run any query"</text>
    <text class="tool-least-privilege-desc" x="44" y="166">Maximum flexibility, maximum</text>
    <text class="tool-least-privilege-desc" x="44" y="182">blast radius.</text>
    <text class="tool-least-privilege-edge" x="44" y="242">anything</text>
  </g>
  <line class="tool-least-privilege-line tool-least-privilege-conn tool-least-privilege-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tool-least-privilege-tip)"/>
  <g class="tool-least-privilege-stage tool-least-privilege-s1">
    <rect class="tool-least-privilege-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tool-least-privilege-step" x="280" y="142">02</text>
    <text class="tool-least-privilege-name" x="306" y="142">Read-only</text>
    <text class="tool-least-privilege-desc" x="280" y="166">Nothing can be destroyed,</text>
    <text class="tool-least-privilege-desc" x="280" y="182">whatever the model proposes.</text>
    <text class="tool-least-privilege-edge" x="280" y="242">read</text>
  </g>
  <line class="tool-least-privilege-line tool-least-privilege-conn tool-least-privilege-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tool-least-privilege-tip)"/>
  <g class="tool-least-privilege-stage tool-least-privilege-s2">
    <rect class="tool-least-privilege-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tool-least-privilege-step" x="516" y="142">03</text>
    <text class="tool-least-privilege-name" x="542" y="142">One table, one schema</text>
    <text class="tool-least-privilege-desc" x="516" y="166">Scope beyond the operation to</text>
    <text class="tool-least-privilege-desc" x="516" y="182">the data itself.</text>
  </g>
  <line class="tool-least-privilege-line tool-least-privilege-conn tool-least-privilege-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tool-least-privilege-tip)"/>
  <g class="tool-least-privilege-stage tool-least-privilege-s3">
    <rect class="tool-least-privilege-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tool-least-privilege-step" x="752" y="142">04</text>
    <text class="tool-least-privilege-name" x="778" y="142">A named query with parameters</text>
    <text class="tool-least-privilege-desc" x="752" y="166">The agent chooses arguments,</text>
    <text class="tool-least-privilege-desc" x="752" y="182">never the statement.</text>
    <text class="tool-least-privilege-edge" x="752" y="242">parameterised</text>
  </g>
  <text class="tool-least-privilege-sub" x="30" y="304">The last step is Day 45's injection rule applied to agents: the model supplies values into a statement you wrote, and never composes the statement itself.</text>
</svg>
