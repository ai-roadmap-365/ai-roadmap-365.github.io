<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Five checks, all cheap, all load-bearing.">
  <title>Before an agent is safe to run</title>
  <style>
    .agent-checklist-bg   { fill: #f8fafc; }
    .agent-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .agent-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .agent-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .agent-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .agent-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .agent-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .agent-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .agent-checklist-row { opacity: 1; }
    .agent-checklist-r0 { animation-delay: 0.00s; }
    .agent-checklist-r1 { animation-delay: 0.45s; }
    .agent-checklist-r2 { animation-delay: 0.90s; }
    .agent-checklist-r3 { animation-delay: 1.35s; }
    .agent-checklist-r4 { animation-delay: 1.80s; }
    .agent-checklist-row { animation: agent-checklist-reveal 7.3s ease-in-out infinite; }
    @keyframes agent-checklist-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="agent-checklist-bg" width="980" height="390"/>
  <text class="agent-checklist-h1"  x="30" y="40">Before an agent is safe to run</text>
  <text class="agent-checklist-sub" x="30" y="64">Five checks, all cheap, all load-bearing.</text>
  <rect class="agent-checklist-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="agent-checklist-name" x="46" y="122">Ready</text>
  <text class="agent-checklist-desc" x="46" y="142">Bounded and auditable.</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r0" x="46" y="182">Turn, token and time caps enforced</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r1" x="46" y="216">Every tool argument schema-validated</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r2" x="46" y="250">Tool results treated as untrusted</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r3" x="46" y="284">Each tool has least-privilege access</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r4" x="46" y="318">Every turn logged and replayable</text>
  <rect class="agent-checklist-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="agent-checklist-name" x="526" y="122">Not ready</text>
  <text class="agent-checklist-desc" x="526" y="142">Each of these has caused an incident.</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r0" x="526" y="182">No cap — a loop bills until noticed</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r1" x="526" y="216">Arguments passed through unchecked</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r2" x="526" y="250">Fetched content trusted as instruction</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r3" x="526" y="284">One credential shared by every tool</text>
  <text class="agent-checklist-desc agent-checklist-row agent-checklist-r4" x="526" y="318">No log, so no post-mortem is possible</text>
  <text class="agent-checklist-sub" x="30" y="372">The caps and the log are the two that matter most in a capstone: one bounds the worst case, and the other is what lets you explain a failure to a reviewer rather than shrugging at it.</text>
</svg>
