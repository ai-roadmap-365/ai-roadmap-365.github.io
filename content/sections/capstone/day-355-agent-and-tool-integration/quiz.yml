questions:
- question: What is the primary role of the ReAct (Reason-Act-Observe) loop in an autonomous AI agent?
  options:
  - To loop infinitely until the server runs out of memory
  - 'To iteratively decompose complex user goals: the model reasons about what to do next, executes a
    specific tool action, observes the result, and repeats until the final answer is achieved'
  - To format HTML pages
  - To train neural network weights from scratch
  answer_index: 1
  explanation: The ReAct loop enables multi-step autonomous planning, execution, and observation.
- question: Why must external tools executed by an agent be strictly sandboxed with parameter validation?
  options:
  - To slow down tool execution
  - To prevent malicious prompt injection attacks from triggering unauthorized database mutations, remote
    code execution, or credential exfiltration
  - Because Python does not allow functions with more than 2 arguments
  - To disable internet access
  answer_index: 1
  explanation: Sandboxing ensures agent actions remain within safe architectural permissions.
- question: How does an agent avoid infinite execution loops when a tool returns an error?
  options:
  - By shutting down the operating system
  - By enforcing a strict maximum recursion depth (e.g. max_turns = 5) and feeding tool errors back into
    the scratchpad so the model can self-correct or cleanly abort
  - By ignoring errors and pretending the tool succeeded
  - By deleting the tool registry
  answer_index: 1
  explanation: Turn limits and error scratchpads prevent runaway recursive loops.
- question: Why should tool schemas be published to the LLM using standard JSON Schema definitions?
  options:
  - To make the prompt longer
  - JSON Schema allows the LLM to generate precise, structured argument payloads matching function signatures
    without ambiguity
  - Because XML cannot represent strings
  - To prevent the model from using numbers
  answer_index: 1
  explanation: Standard JSON Schemas enable deterministic function calling across all major model providers.
- question: What is the purpose of state checkpointing in agentic workflows?
  options:
  - To create a backup on floppy disk
  - To persist intermediate scratchpad states, enabling session recovery, time-travel debugging, and human-in-the-loop
    approval workflows
  - To speed up GPU clock frequencies
  - To encrypt the LLM weights
  answer_index: 1
  explanation: State checkpoints ensure resilience, audibility, and human oversight.
