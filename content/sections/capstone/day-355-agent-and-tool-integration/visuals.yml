visuals:
- id: react-agent-loop-and-tool-sandbox-topology
  file: assets/react-agent-loop-and-tool-sandbox-topology.svg
  type: diagram
  title: ReAct Agent Loop and Tool Sandbox Topology
  alt: ReAct Agent Loop and Tool Sandbox Topology showing User Ingress, Thought Planner, Tool Registry,
    Sandboxed Dispatcher, External APIs, and Final Synthesis
  description: System architecture diagram illustrating the ReAct agent loop and sandboxed tool execution
    engine.
- id: multi-turn-agent-state-checkpoint-lifecycle
  file: assets/multi-turn-agent-state-checkpoint-lifecycle.svg
  type: diagram
  title: Multi-Turn Agent State Checkpoint Lifecycle
  alt: Multi-Turn Agent State Checkpoint Lifecycle showing Turn 1 Thought/Action, Turn 2 Observation/Action,
    Checkpoint Snapshot, and Final Response
  description: Chronological lifecycle diagram detailing state checkpointing across multi-turn agent execution.
- id: agent-three-eras
  file: assets/agent-three-eras.svg
  type: diagram
  title: 'Three eras of agents'
  alt: 'Diagram: the progression from autonomous looping agents to deterministic tool calling'
  description: 'A three-stage progression of agent design from unbounded autonomous loops through brittle string parsing to schema-driven bounded execution.'
- id: agent-is-not
  file: assets/agent-is-not.svg
  type: diagram
  title: 'What an agent is, and is not'
  alt: 'Diagram: what an agent engine is and what it is not'
  description: 'A two-column comparison of an agent''s actual responsibilities against common misconceptions about autonomy.'
- id: tool-call-validation
  file: assets/tool-call-validation.svg
  type: diagram
  title: 'The model proposes; your code disposes'
  alt: 'Diagram: validating a proposed tool call before executing it'
  description: 'A four-stage sequence for handling a model-proposed tool call covering schema validation, authorisation, execution and returning the result as untrusted input.'
- id: bounded-cost
  file: assets/bounded-cost.svg
  type: diagram
  title: 'Every agent needs three caps'
  alt: 'Diagram: an uncapped agent loop compared with a bounded one'
  description: 'A two-column comparison of an agent loop without limits against one with turn, token and time budgets.'
- id: agent-audit-trail
  file: assets/agent-audit-trail.svg
  type: diagram
  title: 'An agent you cannot replay cannot be debugged'
  alt: 'Diagram: what to record for each agent turn'
  description: 'A four-stage record of what each agent turn should log to make a run reconstructable after the fact.'
- id: agent-or-sequence
  file: assets/agent-or-sequence.svg
  type: diagram
  title: 'When not to use an agent'
  alt: 'Diagram: a fixed pipeline compared with an agent loop'
  description: 'A two-column comparison of a hard-coded sequence of steps against an agent that selects its next action, covering predictability and cost.'
- id: prompt-injection-via-tools
  file: assets/prompt-injection-via-tools.svg
  type: diagram
  title: 'A tool result is untrusted input'
  alt: 'Diagram: how content returned by a tool can carry an injection'
  description: 'A four-stage sequence showing how untrusted content fetched by a tool enters the next prompt and can carry instructions.'
- id: agent-state
  file: assets/agent-state.svg
  type: diagram
  title: 'What an agent carries between turns'
  alt: 'Diagram: the state an agent carries from turn to turn'
  description: 'A four-stage description of agent state covering the goal, the accumulated observations, the budget consumed and the checkpoint that allows resumption.'
- id: agent-checklist
  file: assets/agent-checklist.svg
  type: diagram
  title: 'Before an agent is safe to run'
  alt: 'Diagram: the completion checklist for an agent implementation'
  description: 'A two-column checklist comparing an agent ready for use against the specific omissions that make one unsafe.'
- id: tool-least-privilege
  file: assets/tool-least-privilege.svg
  type: diagram
  title: 'Scope each tool as narrowly as it can work'
  alt: 'Diagram: broad tool permissions compared with narrow ones'
  description: 'A four-stage progression narrowing a tool''s capability from general access to the minimum required, and the effect on worst-case impact.'
