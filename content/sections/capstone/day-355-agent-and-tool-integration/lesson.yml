learning_promise: 'Implement the autonomous agent reasoning loop and external tool execution engine for
  your Capstone: engineer a deterministic ReAct state machine, schema-validated tool registries, sandboxed
  tool dispatchers, state checkpointing, and an autonomous agent orchestrator in Python.'
objectives:
- Construct a deterministic ReAct (Reason-Act-Observe) agent execution state machine with cycle limits.
- Implement a schema-driven Tool Registry with strict Pydantic argument validation and error recovery.
- Deploy a sandboxed Tool Dispatcher enforcing parameter permissions, read-only DB scoping, and rate limits.
- Maintain multi-turn conversation and tool execution state with JSON-serializable checkpoints.
- Build a Complete Capstone Agentic Tool Engine in Python with automated tool calling test suites.
