title: Monitoring and Cost Controls
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Instrument a running AI service across the four signals that matter — availability,
  latency percentiles, spend against a rolling baseline, and answer groundedness — and see why the
  fourth is the one conventional monitoring lacks: a window can show zero errors, good latency and
  normal cost while 40% of answers cite nothing at all.'
objectives:
  - Compute windowed metrics with nearest-rank percentiles, and explain why the mean misleads.
  - Identify the failure that only a quality signal catches, where every request succeeds.
  - Compare spend against a rolling median baseline rather than a fixed threshold.
  - Refuse to evaluate alerts on a sample too small to judge, and justify that as anti-fatigue.
  - Distinguish symptom alerts from cause alerts and explain why the latter cause harm.
