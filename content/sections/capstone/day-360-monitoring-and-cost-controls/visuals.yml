visuals:
  - id: what-to-measure
    file: assets/what-to-measure.svg
    type: diagram
    title: What to Measure for an AI Service
    alt: What to Measure for an AI Service showing availability, latency, cost and quality signals side
      by side, and which failures each one can and cannot see
    description: Four signal families with the failure each catches and the failure each is blind to,
      ending with the measured window where three signals were green and quality was not.
  - id: symptoms-versus-causes
    file: assets/symptoms-versus-causes.svg
    type: diagram
    title: Alerting on Symptoms versus Causes
    alt: Alerting on Symptoms versus Causes showing a symptom alert that reaches a user-visible problem
      and cause alerts that fire without anything being wrong
    description: A symptom alert leading to a real page beside cause alerts that fire harmlessly and
      produce alert fatigue, with the small-sample rule as the other half of the defence.
  - id: four-signal-families
    file: assets/four-signal-families.svg
    type: diagram
    title: 'Four families, four blind spots'
    alt: 'Diagram: the four signal families and the failure each one detects'
    description: 'A four-stage description of availability, latency, cost and quality signals, with the class of failure each one is able to detect.'
  - id: symptom-or-cause
    file: assets/symptom-or-cause.svg
    type: diagram
    title: 'Alert on symptoms, not causes'
    alt: 'Diagram: symptom-based alerts compared with cause-based alerts'
    description: 'A two-column comparison of alerting on user-visible symptoms against alerting on internal causes, and the effect each has on trust in the alert channel.'
  - id: monitoring-eras
    file: assets/monitoring-eras.svg
    type: diagram
    title: 'From binary checks to LLM traces'
    alt: 'Diagram: the progression from binary service checks to LLM observability'
    description: 'A four-stage progression of monitoring practice from scheduled binary checks through time series, golden signals and error budgets to LLM-specific observability.'
  - id: metrics-not-logs
    file: assets/metrics-not-logs.svg
    type: diagram
    title: 'Metrics are not logs'
    alt: 'Diagram: metrics compared with logs and dashboards'
    description: 'A two-column comparison of metrics against logs, distinguishing noticing an unknown problem from investigating a known one.'
  - id: window-pipeline
    file: assets/window-pipeline.svg
    type: diagram
    title: 'Five rules for judging a window'
    alt: 'Diagram: the five rules governing how a monitoring window is evaluated'
    description: 'A five-stage description of windowed monitoring covering bucketing, nearest-rank percentiles, minimum sample size, budget evaluation and median baselines.'
  - id: percentile-resolution
    file: assets/percentile-resolution.svg
    type: diagram
    title: 'A percentile cannot see rare events'
    alt: 'Diagram: why a p95 over twenty samples cannot see a single slow request'
    description: 'A four-stage explanation of percentile resolution showing that a percentile only sees events more frequent than one minus p, using twenty samples as the worked case.'
  - id: car-instruments
    file: assets/car-instruments.svg
    type: diagram
    title: 'The instruments in a car'
    alt: 'Diagram: car instruments as an analogy for the four monitoring signals'
    description: 'A two-column comparison mapping car instruments onto monitoring signals, and identifying the signal for which no instrument exists.'
  - id: three-hidden-problems
    file: assets/three-hidden-problems.svg
    type: diagram
    title: 'Three problems, zero errors'
    alt: 'Diagram: three production problems each detected by a different monitoring signal'
    description: 'A four-stage walkthrough of three problems hidden in twenty-five minutes of traffic, each detected by a different signal while the error rate stayed at zero.'
  - id: monitoring-implications
    file: assets/monitoring-implications.svg
    type: diagram
    title: 'Five consequences of instrumenting'
    alt: 'Diagram: the security, privacy, performance, scalability and cost consequences of monitoring'
    description: 'A five-stage description of monitoring consequences covering spend as an abuse signal, trace privacy, keeping collection off the request path, metric cardinality, and retention cost.'
  - id: build-or-buy-monitoring
    file: assets/build-or-buy-monitoring.svg
    type: diagram
    title: 'Roll your own, or adopt a backend'
    alt: 'Diagram: computing metrics yourself compared with adopting an observability backend'
    description: 'A two-column comparison of aggregating structured request records yourself against adopting a metrics or LLM-observability backend.'
  - id: slo-versus-sla
    file: assets/slo-versus-sla.svg
    type: diagram
    title: 'An objective is not an agreement'
    alt: 'Diagram: a service level objective compared with a service level agreement'
    description: 'A two-column comparison of an internal service level objective against a contractual service level agreement.'
  - id: instrument-now-or-later
    file: assets/instrument-now-or-later.svg
    type: diagram
    title: 'How much to instrument'
    alt: 'Diagram: full instrumentation compared with the minimum worth doing'
    description: 'A two-column comparison of full four-signal instrumentation against a minimal approach for a demonstration system.'
