visuals:
  - id: what-to-measure
    file: assets/what-to-measure.svg
    type: diagram
    title: What to Measure for an AI Service
    alt: What to Measure for an AI Service showing availability, latency, cost and quality signals side
      by side, and which failures each one can and cannot see
    description: Four signal families with the failure each catches and the failure each is blind to,
      ending with the measured window where three signals were green and quality was not.
  - id: symptoms-versus-causes
    file: assets/symptoms-versus-causes.svg
    type: diagram
    title: Alerting on Symptoms versus Causes
    alt: Alerting on Symptoms versus Causes showing a symptom alert that reaches a user-visible problem
      and cause alerts that fire without anything being wrong
    description: A symptom alert leading to a real page beside cause alerts that fire harmlessly and
      produce alert fatigue, with the small-sample rule as the other half of the defence.
