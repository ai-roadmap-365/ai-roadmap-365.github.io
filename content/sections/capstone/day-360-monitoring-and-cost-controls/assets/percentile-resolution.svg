<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Choose it to match what you must catch.">
  <title>A percentile cannot see rare events</title>
  <style>
    .percentile-resolution-bg   { fill: #f8fafc; }
    .percentile-resolution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .percentile-resolution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .percentile-resolution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .percentile-resolution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .percentile-resolution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .percentile-resolution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .percentile-resolution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .percentile-resolution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .percentile-resolution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .percentile-resolution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .percentile-resolution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .percentile-resolution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .percentile-resolution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .percentile-resolution-stage { opacity: 1; }

    .percentile-resolution-s0 { animation-delay: 0.00s; }
    .percentile-resolution-e0 { animation-delay: 0.00s; }
    .percentile-resolution-s1 { animation-delay: 1.28s; }
    .percentile-resolution-e1 { animation-delay: 1.28s; }
    .percentile-resolution-s2 { animation-delay: 2.56s; }
    .percentile-resolution-e2 { animation-delay: 2.56s; }
    .percentile-resolution-s3 { animation-delay: 3.84s; }
    .percentile-resolution-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .percentile-resolution-conn  { animation: percentile-resolution-trace 6.4s ease-in-out infinite; }
      .percentile-resolution-stage { animation: percentile-resolution-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes percentile-resolution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes percentile-resolution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .percentile-resolution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .percentile-resolution-stage { animation: percentile-resolution-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes percentile-resolution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="percentile-resolution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="percentile-resolution-bg" width="980" height="322"/>
  <text class="percentile-resolution-h1"  x="30" y="40">A percentile cannot see rare events</text>
  <text class="percentile-resolution-sub" x="30" y="64">Choose it to match what you must catch.</text>
  <g class="percentile-resolution-stage percentile-resolution-s0">
    <rect class="percentile-resolution-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="percentile-resolution-step" x="44" y="142">01</text>
    <text class="percentile-resolution-name" x="70" y="142">Twenty samples</text>
    <text class="percentile-resolution-desc" x="44" y="166">One of them is nine seconds. The</text>
    <text class="percentile-resolution-desc" x="44" y="182">other nineteen are fast.</text>
  </g>
  <line class="percentile-resolution-line percentile-resolution-conn percentile-resolution-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#percentile-resolution-tip)"/>
  <g class="percentile-resolution-stage percentile-resolution-s1">
    <rect class="percentile-resolution-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="percentile-resolution-step" x="280" y="142">02</text>
    <text class="percentile-resolution-name" x="306" y="142">p95 is the nineteenth value</text>
    <text class="percentile-resolution-desc" x="280" y="166">ceil(0.95 x 20) = 19. The slow</text>
    <text class="percentile-resolution-desc" x="280" y="182">one is the twentieth.</text>
    <text class="percentile-resolution-edge" x="280" y="242">rank 19</text>
  </g>
  <line class="percentile-resolution-line percentile-resolution-conn percentile-resolution-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#percentile-resolution-tip)"/>
  <g class="percentile-resolution-stage percentile-resolution-s2">
    <rect class="percentile-resolution-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="percentile-resolution-step" x="516" y="142">03</text>
    <text class="percentile-resolution-name" x="542" y="142">So p95 reports a fast number</text>
    <text class="percentile-resolution-desc" x="516" y="166">The outlier sits above the</text>
    <text class="percentile-resolution-desc" x="516" y="182">percentile entirely, and is</text>
    <text class="percentile-resolution-desc" x="516" y="198">invisible.</text>
    <text class="percentile-resolution-edge" x="516" y="242">missed</text>
  </g>
  <line class="percentile-resolution-line percentile-resolution-conn percentile-resolution-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#percentile-resolution-tip)"/>
  <g class="percentile-resolution-stage percentile-resolution-s3">
    <rect class="percentile-resolution-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="percentile-resolution-step" x="752" y="142">04</text>
    <text class="percentile-resolution-name" x="778" y="142">p99 over the same twenty sees it</text>
    <text class="percentile-resolution-desc" x="752" y="166">A percentile only sees events</text>
    <text class="percentile-resolution-desc" x="752" y="182">more frequent than 1 - p.</text>
    <text class="percentile-resolution-edge" x="752" y="242">rank 20</text>
  </g>
  <text class="percentile-resolution-sub" x="30" y="304">This is worth knowing before an incident rather than during one, because the natural response to "p95 looks fine" is to stop looking, and the window may simply be too small to contain the event.</text>
</svg>
