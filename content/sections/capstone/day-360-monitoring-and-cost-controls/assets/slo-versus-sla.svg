<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One you decide with; one you are held to.">
  <title>An objective is not an agreement</title>
  <style>
    .slo-versus-sla-bg   { fill: #f8fafc; }
    .slo-versus-sla-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-versus-sla-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-versus-sla-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-versus-sla-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-versus-sla-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-versus-sla-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slo-versus-sla-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slo-versus-sla-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slo-versus-sla-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slo-versus-sla-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slo-versus-sla-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slo-versus-sla-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slo-versus-sla-row { opacity: 1; }
    .slo-versus-sla-r0 { animation-delay: 0.00s; }
    .slo-versus-sla-r1 { animation-delay: 0.45s; }
    .slo-versus-sla-r2 { animation-delay: 0.90s; }
    .slo-versus-sla-r3 { animation-delay: 1.35s; }
    .slo-versus-sla-r4 { animation-delay: 1.80s; }
    .slo-versus-sla-row { animation: slo-versus-sla-reveal 7.3s ease-in-out infinite; }
    @keyframes slo-versus-sla-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="slo-versus-sla-bg" width="980" height="390"/>
  <text class="slo-versus-sla-h1"  x="30" y="40">An objective is not an agreement</text>
  <text class="slo-versus-sla-sub" x="30" y="64">One you decide with; one you are held to.</text>
  <rect class="slo-versus-sla-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="slo-versus-sla-name" x="46" y="122">Objective (SLO)</text>
  <text class="slo-versus-sla-desc" x="46" y="142">Internal, and stricter.</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r0" x="46" y="182">A target you set for yourself</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r1" x="46" y="216">Used to decide whether to act</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r2" x="46" y="250">Breaching it triggers work</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r3" x="46" y="284">Should be tighter than the contract</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r4" x="46" y="318">So you notice before anyone claims</text>
  <rect class="slo-versus-sla-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="slo-versus-sla-name" x="526" y="122">Agreement (SLA)</text>
  <text class="slo-versus-sla-desc" x="526" y="142">External, with consequences.</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r0" x="526" y="182">A contract with a customer</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r1" x="526" y="216">Breaching it costs money</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r2" x="526" y="250">Looser, because it is a promise</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r3" x="526" y="284">Measured the same way, judged differently</text>
  <text class="slo-versus-sla-desc slo-versus-sla-row slo-versus-sla-r4" x="526" y="318">Not a monitoring threshold</text>
  <text class="slo-versus-sla-sub" x="30" y="372">Setting the objective equal to the agreement removes the only margin you have: by the time you notice, the thing you would have wanted to prevent has already happened.</text>
</svg>
