<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two of them are not about monitoring at all.">
  <title>Five consequences of instrumenting</title>
  <style>
    .monitoring-implications-bg   { fill: #f8fafc; }
    .monitoring-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .monitoring-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .monitoring-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .monitoring-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .monitoring-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .monitoring-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .monitoring-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .monitoring-implications-stage { opacity: 1; }

    .monitoring-implications-s0 { animation-delay: 0.00s; }
    .monitoring-implications-e0 { animation-delay: 0.00s; }
    .monitoring-implications-s1 { animation-delay: 1.33s; }
    .monitoring-implications-e1 { animation-delay: 1.33s; }
    .monitoring-implications-s2 { animation-delay: 2.67s; }
    .monitoring-implications-e2 { animation-delay: 2.67s; }
    .monitoring-implications-s3 { animation-delay: 4.00s; }
    .monitoring-implications-e3 { animation-delay: 4.00s; }
    .monitoring-implications-s4 { animation-delay: 5.33s; }
    .monitoring-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .monitoring-implications-conn  { animation: monitoring-implications-trace 8s ease-in-out infinite; }
      .monitoring-implications-stage { animation: monitoring-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes monitoring-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes monitoring-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .monitoring-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .monitoring-implications-stage { animation: monitoring-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes monitoring-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="monitoring-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="monitoring-implications-bg" width="980" height="322"/>
  <text class="monitoring-implications-h1"  x="30" y="40">Five consequences of instrumenting</text>
  <text class="monitoring-implications-sub" x="30" y="64">Two of them are not about monitoring at all.</text>
  <g class="monitoring-implications-stage monitoring-implications-s0">
    <rect class="monitoring-implications-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="monitoring-implications-step" x="44" y="142">01</text>
    <text class="monitoring-implications-name" x="70" y="142">Spend is a detection control</text>
    <text class="monitoring-implications-desc" x="44" y="166">Abuse, a leaked key or</text>
    <text class="monitoring-implications-desc" x="44" y="182">injected recursive tool</text>
    <text class="monitoring-implications-desc" x="44" y="198">calls show here first.</text>
    <text class="monitoring-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="monitoring-implications-line monitoring-implications-conn monitoring-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#monitoring-implications-tip)"/>
  <g class="monitoring-implications-stage monitoring-implications-s1">
    <rect class="monitoring-implications-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="monitoring-implications-step" x="233" y="142">02</text>
    <text class="monitoring-implications-name" x="259" y="142">Traces are personal data</text>
    <text class="monitoring-implications-desc" x="233" y="166">Full prompts and</text>
    <text class="monitoring-implications-desc" x="233" y="182">completions, retained</text>
    <text class="monitoring-implications-desc" x="233" y="198">longest, examined least.</text>
    <text class="monitoring-implications-edge" x="233" y="242">privacy</text>
  </g>
  <line class="monitoring-implications-line monitoring-implications-conn monitoring-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#monitoring-implications-tip)"/>
  <g class="monitoring-implications-stage monitoring-implications-s2">
    <rect class="monitoring-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="monitoring-implications-step" x="422" y="142">03</text>
    <text class="monitoring-implications-name" x="448" y="142">Keep collection off the path</text>
    <text class="monitoring-implications-desc" x="422" y="166">Aggregate per window</text>
    <text class="monitoring-implications-desc" x="422" y="182">rather than storing every</text>
    <text class="monitoring-implications-desc" x="422" y="198">observation.</text>
    <text class="monitoring-implications-edge" x="422" y="242">performance</text>
  </g>
  <line class="monitoring-implications-line monitoring-implications-conn monitoring-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#monitoring-implications-tip)"/>
  <g class="monitoring-implications-stage monitoring-implications-s3">
    <rect class="monitoring-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="monitoring-implications-step" x="611" y="142">04</text>
    <text class="monitoring-implications-name" x="637" y="142">Cardinality kills backends</text>
    <text class="monitoring-implications-desc" x="611" y="166">A label per user is</text>
    <text class="monitoring-implications-desc" x="611" y="182">millions of series and an</text>
    <text class="monitoring-implications-desc" x="611" y="198">unusable bill.</text>
    <text class="monitoring-implications-edge" x="611" y="242">scalability</text>
  </g>
  <line class="monitoring-implications-line monitoring-implications-conn monitoring-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#monitoring-implications-tip)"/>
  <g class="monitoring-implications-stage monitoring-implications-s4">
    <rect class="monitoring-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="monitoring-implications-step" x="800" y="142">05</text>
    <text class="monitoring-implications-name" x="826" y="142">Choose retention deliberately</text>
    <text class="monitoring-implications-desc" x="800" y="166">Not the default that</text>
    <text class="monitoring-implications-desc" x="800" y="182">keeps full traces for a</text>
    <text class="monitoring-implications-desc" x="800" y="198">year.</text>
    <text class="monitoring-implications-edge" x="800" y="242">money</text>
  </g>
  <text class="monitoring-implications-sub" x="30" y="304">The first is the one that surprises people: cost monitoring is usually justified as budgeting, and it will more often earn its place by being the first thing to notice an attack.</text>
</svg>
