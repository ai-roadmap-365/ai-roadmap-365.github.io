<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The signals matter more than the tool.">
  <title>Roll your own, or adopt a backend</title>
  <style>
    .build-or-buy-monitoring-bg   { fill: #f8fafc; }
    .build-or-buy-monitoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-or-buy-monitoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-or-buy-monitoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-or-buy-monitoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-or-buy-monitoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .build-or-buy-monitoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-or-buy-monitoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .build-or-buy-monitoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .build-or-buy-monitoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .build-or-buy-monitoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .build-or-buy-monitoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .build-or-buy-monitoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .build-or-buy-monitoring-row { opacity: 1; }
    .build-or-buy-monitoring-r0 { animation-delay: 0.00s; }
    .build-or-buy-monitoring-r1 { animation-delay: 0.45s; }
    .build-or-buy-monitoring-r2 { animation-delay: 0.90s; }
    .build-or-buy-monitoring-r3 { animation-delay: 1.35s; }
    .build-or-buy-monitoring-r4 { animation-delay: 1.80s; }
    .build-or-buy-monitoring-row { animation: build-or-buy-monitoring-reveal 7.3s ease-in-out infinite; }
    @keyframes build-or-buy-monitoring-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="build-or-buy-monitoring-bg" width="980" height="390"/>
  <text class="build-or-buy-monitoring-h1"  x="30" y="40">Roll your own, or adopt a backend</text>
  <text class="build-or-buy-monitoring-sub" x="30" y="64">The signals matter more than the tool.</text>
  <rect class="build-or-buy-monitoring-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="build-or-buy-monitoring-name" x="46" y="122">Aggregate it yourself</text>
  <text class="build-or-buy-monitoring-desc" x="46" y="142">Right for a capstone.</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r0" x="46" y="182">Structured request records you already log</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r1" x="46" y="216">All four signals from a dict and a sort</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r2" x="46" y="250">No backend, no ingestion bill</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r3" x="46" y="284">You define what quality means</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r4" x="46" y="318">Enough for the volume a capstone sees</text>
  <rect class="build-or-buy-monitoring-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="build-or-buy-monitoring-name" x="526" y="122">Adopt a backend</text>
  <text class="build-or-buy-monitoring-desc" x="526" y="142">Right once volume justifies it.</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r0" x="526" y="182">Prometheus and Grafana for metrics</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r1" x="526" y="216">OpenTelemetry to avoid vendor lock-in</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r2" x="526" y="250">Langfuse or Phoenix for LLM traces</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r3" x="526" y="284">Managed tiers adequate for a capstone</text>
  <text class="build-or-buy-monitoring-desc build-or-buy-monitoring-row build-or-buy-monitoring-r4" x="526" y="318">Retention and cardinality become your bill</text>
  <text class="build-or-buy-monitoring-sub" x="30" y="372">Instrumenting to OpenTelemetry is the useful hedge: it is a standard rather than a product, so the decision about which backend stores the data can be made later and changed.</text>
</svg>
