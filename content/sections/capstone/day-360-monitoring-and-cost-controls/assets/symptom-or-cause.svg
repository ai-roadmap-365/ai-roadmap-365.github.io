<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because causes are numerous and mostly harmless.">
  <title>Alert on symptoms, not causes</title>
  <style>
    .symptom-or-cause-bg   { fill: #f8fafc; }
    .symptom-or-cause-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptom-or-cause-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptom-or-cause-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptom-or-cause-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptom-or-cause-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .symptom-or-cause-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .symptom-or-cause-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .symptom-or-cause-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .symptom-or-cause-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .symptom-or-cause-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .symptom-or-cause-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .symptom-or-cause-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .symptom-or-cause-row { opacity: 1; }
    .symptom-or-cause-r0 { animation-delay: 0.00s; }
    .symptom-or-cause-r1 { animation-delay: 0.45s; }
    .symptom-or-cause-r2 { animation-delay: 0.90s; }
    .symptom-or-cause-r3 { animation-delay: 1.35s; }
    .symptom-or-cause-r4 { animation-delay: 1.80s; }
    .symptom-or-cause-row { animation: symptom-or-cause-reveal 7.3s ease-in-out infinite; }
    @keyframes symptom-or-cause-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="symptom-or-cause-bg" width="980" height="390"/>
  <text class="symptom-or-cause-h1"  x="30" y="40">Alert on symptoms, not causes</text>
  <text class="symptom-or-cause-sub" x="30" y="64">Because causes are numerous and mostly harmless.</text>
  <rect class="symptom-or-cause-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="symptom-or-cause-name" x="46" y="122">Symptoms</text>
  <text class="symptom-or-cause-desc" x="46" y="142">Things a user feels.</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r0" x="46" y="182">p95 latency exceeds four seconds</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r1" x="46" y="216">Error rate above the budget</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r2" x="46" y="250">40% of answers cited nothing</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r3" x="46" y="284">Spend is 13x the recent norm</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r4" x="46" y="318">Every firing means something is wrong</text>
  <rect class="symptom-or-cause-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="symptom-or-cause-name" x="526" y="122">Causes</text>
  <text class="symptom-or-cause-desc" x="526" y="142">Mostly harmless on their own.</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r0" x="526" y="182">Cache hit rate dropped</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r1" x="526" y="216">CPU is at 80 percent</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r2" x="526" y="250">A retry happened</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r3" x="526" y="284">Queue depth rose briefly</text>
  <text class="symptom-or-cause-desc symptom-or-cause-row symptom-or-cause-r4" x="526" y="318">Fires when nothing is wrong</text>
  <text class="symptom-or-cause-sub" x="30" y="372">An alert that fires when nothing is wrong is worse than no alert, because it trains people to ignore the channel — and the channel is the same one the real page arrives on.</text>
</svg>
