questions:
  - question: A window shows zero errors, good latency and normal spend, and the system is broken. What
      signal is missing?
    options:
      - Saturation — the server is out of memory
      - Disk usage on the metrics backend
      - Traffic volume, which would show the drop
      - 'A quality signal such as groundedness'
    answer_index: 3
    explanation: This is the failure unique to AI services. In the measured lab window the error rate was
      zero and 40 percent of answers cited nothing at all.
  - question: Why does p95 over twenty samples fail to see a single slow request?
    options:
      - 'A percentile cannot see events rarer than one minus p'
      - Because percentiles discard the largest observation by design
      - Because twenty samples is too few to compute any percentile
      - Because the slow request is treated as an error rather than a latency
    answer_index: 0
    explanation: p99 over the same twenty would see it. Choose the percentile to match what you need to
      catch, and make the window large enough to contain enough of those events.
  - question: Why should a spend baseline be a median of recent windows rather than a mean?
    options:
      - Because medians are cheaper to compute
      - 'One spike raises the mean and hides the next one'
      - Because means require storing every observation
      - Because medians are less sensitive to missing data
    answer_index: 1
    explanation: The failure is self-concealing — the first spike raises the bar so the second looks
      normal. A median is unmoved by a single outlier.
  - question: Why refuse to evaluate alerts on a window with very few requests?
    options:
      - Because small windows are cheaper to skip
      - Because percentiles are undefined below ten samples
      - 'One in three is a 33 percent rate; paging on it trains neglect'
      - Because the metrics backend rejects small batches
    answer_index: 2
    explanation: An alert that fires when nothing is wrong is worse than no alert. A minimum sample count
      is the cheapest anti-fatigue measure available.
  - question: Why is alerting on cache hit rate usually a mistake?
    options:
      - Because cache hit rate is expensive to measure
      - Because hit rate cannot be expressed as a percentage
      - Because caches are not part of the request path
      - 'It is a cause, not a symptom, so it fires benignly'
    answer_index: 3
    explanation: Alert on what a user would feel; keep causes on a dashboard for diagnosis after a
      symptom alert fires.
