terms:
  - term: Golden Signals
    definition: Latency, traffic, errors and saturation — the conventional set for a user-facing service,
      which for AI systems needs cost and quality added.
  - term: Symptom Alert
    definition: An alert on something a user would notice. The kind worth paging on.
  - term: Cause Alert
    definition: An alert on an internal mechanism such as cache hit rate, which can move harmlessly and
      so produces noise rather than signal.
  - term: Alert Fatigue
    definition: The state in which a channel is ignored because it fires too often, at which point real
      alerts are missed too.
  - term: Percentile
    definition: The value below which a given share of observations fall. Can only see events more
      frequent than one minus the percentile.
  - term: Error Budget
    definition: An agreed allowance of failure over a period, which turns "is this bad enough to act on"
      into arithmetic decided in advance.
  - term: Rolling Baseline
    definition: A median of recent windows used as the comparison for anomaly detection, rather than a
      fixed threshold that normal variation would breach.
  - term: Groundedness
    definition: Whether an answer is supported by retrieved context. A quality signal that fails on
      requests which otherwise succeed entirely.
  - term: Cardinality
    definition: The number of distinct label combinations in a metrics system. Unbounded cardinality —
      a label per user, say — makes a backend unusable and expensive.
  - term: Trace
    definition: A record following one request through every stage. The highest-risk store in most AI
      systems, since it captures full prompts and completions.
