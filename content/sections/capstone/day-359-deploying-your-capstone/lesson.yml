title: Deploying Your Capstone
section: capstone
subsection: capstone-project
week: 52
learning_promise:
  'Ship the capstone behind gates that can each refuse: preflight checks that cost nothing
  to fail, a health check that separates "the process started" from "it can serve", a canary that risks
  a fraction of traffic and decides on error rate rather than elapsed time, and a rollback that swaps a
  pointer instead of rebuilding.'
objectives:
  - Build a preflight gate that reports every blocker at once and deploys nothing when it fails.
  - Distinguish liveness from readiness, and explain why one probe cannot answer both questions.
  - Decide a canary on an error budget rather than on elapsed time.
  - Implement rollback as a reversible pointer swap rather than a rebuild.
  - Explain why an irreversible migration blocks the whole release path.
