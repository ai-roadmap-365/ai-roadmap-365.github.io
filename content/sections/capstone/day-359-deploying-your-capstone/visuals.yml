visuals:
  - id: the-release-path
    file: assets/the-release-path.svg
    type: diagram
    title: The Release Path
    alt: The Release Path showing preflight, deploy, health check, canary and promotion, with the point
      at which each gate can refuse and what it costs to fail there
    description: The four release gates in sequence with the failure outcome and blast radius at each,
      showing how the cost of the same defect rises at every step.
  - id: rollback-pointer-versus-rebuild
    file: assets/rollback-pointer-versus-rebuild.svg
    type: diagram
    title: Rollback as a Pointer Swap versus a Rebuild
    alt: Rollback as a Pointer Swap versus a Rebuild showing the elapsed time of each while an incident
      is ongoing
    description: Timeline comparison showing that an incident lasts exactly as long as the rollback,
      making rollback speed a design decision.
  - id: gate-cost-gradient
    file: assets/gate-cost-gradient.svg
    type: diagram
    title: 'The cost of failing at each gate'
    alt: 'Diagram: the rising cost of catching a defect at each successive deployment gate'
    description: 'A four-stage cost gradient showing what it costs to catch the same defect at preflight, health check, canary and after promotion.'
  - id: deploy-eras
    file: assets/deploy-eras.svg
    type: diagram
    title: 'From quarterly event to continuous gate'
    alt: 'Diagram: the progression from quarterly manual releases to progressive delivery'
    description: 'A five-stage progression of deployment practice from manual quarterly releases through continuous delivery, blue-green, error budgets and AI-specific production concerns.'
  - id: ai-deploy-differences
    file: assets/ai-deploy-differences.svg
    type: diagram
    title: 'Four ways AI deployments differ'
    alt: 'Diagram: the four properties that make AI deployments differ from web services'
    description: 'A four-stage description of AI deployment differences covering slow startup, probabilistic failure, per-request cost, and dependence on external model providers.'
  - id: deploy-properties
    file: assets/deploy-properties.svg
    type: diagram
    title: 'Three properties of a deployment path'
    alt: 'Diagram: the three properties a deployment path must have'
    description: 'A three-stage description of deployment as a sequence of evidence-based decisions, reversible by construction, and routine rather than exceptional.'
  - id: deploy-versus-release
    file: assets/deploy-versus-release.svg
    type: diagram
    title: 'Deploying is not releasing'
    alt: 'Diagram: what deployment is not, against what each misconception costs'
    description: 'A two-column comparison of common misconceptions about deployment against the practices that correct each one.'
  - id: error-budget-decision
    file: assets/error-budget-decision.svg
    type: diagram
    title: 'Deciding by arithmetic'
    alt: 'Diagram: deciding a release by judgement compared with deciding by error budget'
    description: 'A two-column comparison of deciding whether a release is healthy by judgement under pressure against deciding by a threshold agreed in advance.'
  - id: preflight-checks
    file: assets/preflight-checks.svg
    type: diagram
    title: 'What preflight must refuse'
    alt: 'Diagram: the preflight checks that block a release before anything ships'
    description: 'A five-stage preflight checklist covering tests, migration reversibility, secrets, a pinned image digest and a cost check, with the reason each blocks a release.'
  - id: menu-change-analogy
    file: assets/menu-change-analogy.svg
    type: diagram
    title: 'Changing a restaurant menu'
    alt: 'Diagram: replacing a menu all at once compared with staging the change'
    description: 'A two-column comparison of replacing every menu at once against checking suppliers, cooking for staff and trialling on a few tables first.'
  - id: live-but-not-ready
    file: assets/live-but-not-ready.svg
    type: diagram
    title: 'Green, and completely broken'
    alt: 'Diagram: a process that is live compared with one that is ready to serve'
    description: 'A two-column comparison of a liveness check against a readiness check, and what each one can and cannot detect.'
  - id: deploy-implications
    file: assets/deploy-implications.svg
    type: diagram
    title: 'Five things a deployment changes'
    alt: 'Diagram: the security, privacy, performance, scalability and cost effects of a deployment'
    description: 'A five-stage description of deployment consequences covering image pinning, changed logging, slow model startup, canary sample size, and the cost of running two versions.'
  - id: platform-choice
    file: assets/platform-choice.svg
    type: diagram
    title: 'Choosing what runs the gates'
    alt: 'Diagram: a managed platform compared with self-operated orchestration'
    description: 'A two-column comparison of managed deployment platforms against self-operated orchestrators, for a capstone-scale system.'
  - id: blue-green-versus-canary
    file: assets/blue-green-versus-canary.svg
    type: diagram
    title: 'Blue-green or canary'
    alt: 'Diagram: blue-green deployment compared with a canary release'
    description: 'A two-column comparison of blue-green deployment against canary release in terms of exposure, cost and what each detects.'
  - id: rollback-versus-forward
    file: assets/rollback-versus-forward.svg
    type: diagram
    title: 'During an incident, roll back'
    alt: 'Diagram: rolling back during an incident compared with fixing forward'
    description: 'A two-column comparison of rolling back to a known-good version during an incident against fixing the defect and deploying again.'
