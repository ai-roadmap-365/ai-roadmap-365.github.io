terms:
  - term: Preflight Gate
    definition: Checks run before anything ships — tests, reversible migrations, present secrets, a
      pinned image. The cheapest place to fail.
  - term: Liveness
    definition: Whether a process is running. Answers "should this be restarted?" and nothing more.
  - term: Readiness
    definition: Whether a process can actually serve — model loaded, index warm, dependencies reachable.
      Answers "should this receive traffic?"
  - term: Canary Release
    definition: Routing a small fraction of real traffic to a new version and deciding on measured
      evidence before promoting.
  - term: Error Budget
    definition: An agreed threshold of acceptable failure, which turns a release decision into
      arithmetic rather than a judgement made under pressure.
  - term: Blue-Green Deployment
    definition: Two complete environments with one live, switching all traffic at once. Simple, with no
      partial exposure.
  - term: Rollback
    definition: Returning to the last known-good version. A data operation — swapping which artefact is
      live — not a rebuild.
  - term: Roll-Forward
    definition: Fixing and deploying again rather than returning. Slower during an incident, because the
      fix is unproven.
  - term: Image Digest Pinning
    definition: Referring to a container image by its content hash rather than a mutable tag, so what
      deploys cannot change underneath you.
  - term: Deployment versus Release
    definition: Deploying puts code in production; releasing exposes it to users. Feature flags separate
      the two, which is what makes frequent deployment safe.
