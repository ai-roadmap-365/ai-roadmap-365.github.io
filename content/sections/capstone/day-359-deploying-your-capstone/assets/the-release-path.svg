<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" role="img" aria-label="The Release Path showing preflight, deploy, health check, canary and promotion, with the point at which each gate can refuse and what it costs to fail there">
  <title>The Release Path</title>
  <defs>
    <style>
      .d359a-bg { fill: #f8fafc; }
      .d359a-gate { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d359a-ok { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d359a-stop { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d359a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d359a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d359a-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d359a-t { font-family: system-ui, sans-serif; font-size: 10px; fill: #334155; }
      .d359a-cost { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
      .d359a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d359a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d359a-bg"/>
  <text x="40" y="40" class="d359a-title">The Release Path</text>
  <text x="40" y="64" class="d359a-sub">Each gate can refuse. Catch a defect at the earliest one that could — the cost of the same defect rises sharply at every step.</text>

  <rect x="40" y="105" width="150" height="66" rx="8" class="d359a-gate"/>
  <text x="115" y="131" class="d359a-h" text-anchor="middle">PREFLIGHT</text>
  <text x="115" y="150" class="d359a-t" text-anchor="middle">tests, reversible</text>
  <text x="115" y="164" class="d359a-t" text-anchor="middle">migration, secrets, digest</text>

  <rect x="235" y="105" width="150" height="66" rx="8" class="d359a-gate"/>
  <text x="310" y="131" class="d359a-h" text-anchor="middle">HEALTH</text>
  <text x="310" y="150" class="d359a-t" text-anchor="middle">liveness AND readiness</text>
  <text x="310" y="164" class="d359a-t" text-anchor="middle">+ dependencies</text>

  <rect x="430" y="105" width="150" height="66" rx="8" class="d359a-gate"/>
  <text x="505" y="131" class="d359a-h" text-anchor="middle">CANARY</text>
  <text x="505" y="150" class="d359a-t" text-anchor="middle">10% of traffic</text>
  <text x="505" y="164" class="d359a-t" text-anchor="middle">decide on error rate</text>

  <rect x="625" y="105" width="150" height="66" rx="8" class="d359a-ok"/>
  <text x="700" y="131" class="d359a-h" text-anchor="middle">PROMOTED</text>
  <text x="700" y="150" class="d359a-t" text-anchor="middle">100% of traffic</text>
  <text x="700" y="164" class="d359a-t" text-anchor="middle">previous version kept</text>

  <path d="M 190 138 L 229 138" class="d359a-flow" marker-end="url(#d359a-a)"/>
  <path d="M 385 138 L 424 138" class="d359a-flow" marker-end="url(#d359a-a)"/>
  <path d="M 580 138 L 619 138" class="d359a-flow" marker-end="url(#d359a-a)"/>

  <rect x="40" y="215" width="150" height="56" rx="6" class="d359a-stop"/>
  <text x="115" y="238" class="d359a-t" text-anchor="middle">BLOCKED</text>
  <text x="115" y="258" class="d359a-cost" text-anchor="middle">nothing deployed</text>

  <rect x="235" y="215" width="150" height="56" rx="6" class="d359a-stop"/>
  <text x="310" y="238" class="d359a-t" text-anchor="middle">ROLLED BACK</text>
  <text x="310" y="258" class="d359a-cost" text-anchor="middle">no user saw it</text>

  <rect x="430" y="215" width="150" height="56" rx="6" class="d359a-stop"/>
  <text x="505" y="238" class="d359a-t" text-anchor="middle">ROLLED BACK</text>
  <text x="505" y="258" class="d359a-cost" text-anchor="middle">10% saw errors</text>

  <rect x="625" y="215" width="150" height="56" rx="6" class="d359a-stop"/>
  <text x="700" y="238" class="d359a-t" text-anchor="middle">INCIDENT</text>
  <text x="700" y="258" class="d359a-cost" text-anchor="middle">everyone saw errors</text>

  <path d="M 115 175 L 115 211" class="d359a-flow" marker-end="url(#d359a-a)"/>
  <path d="M 310 175 L 310 211" class="d359a-flow" marker-end="url(#d359a-a)"/>
  <path d="M 505 175 L 505 211" class="d359a-flow" marker-end="url(#d359a-a)"/>
  <path d="M 700 175 L 700 211" class="d359a-flow" marker-end="url(#d359a-a)"/>

  <text x="40" y="320" class="d359a-h">Why "is the migration reversible?" blocks everything</text>
  <text x="40" y="344" class="d359a-t">Every gate after preflight assumes rollback is available — a failed health check rolls back, a failed canary rolls back. A</text>
  <text x="40" y="362" class="d359a-t">migration that drops a column removes that assumption, so the safety of every later step disappears with it.</text>
  <text x="40" y="392" class="d359a-h">Liveness is not readiness</text>
  <text x="40" y="416" class="d359a-t">Liveness answers "should this be restarted?". Readiness answers "should this receive traffic?". A process can start</text>
  <text x="40" y="434" class="d359a-t">perfectly and still be unable to serve — model not loaded, index cold, dependency unreachable. One probe cannot say both.</text>
</svg>
