<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Report all of them, not the first.">
  <title>What preflight must refuse</title>
  <style>
    .preflight-checks-bg   { fill: #f8fafc; }
    .preflight-checks-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preflight-checks-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preflight-checks-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preflight-checks-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preflight-checks-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preflight-checks-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preflight-checks-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preflight-checks-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preflight-checks-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preflight-checks-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preflight-checks-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preflight-checks-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .preflight-checks-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .preflight-checks-stage { opacity: 1; }

    .preflight-checks-s0 { animation-delay: 0.00s; }
    .preflight-checks-e0 { animation-delay: 0.00s; }
    .preflight-checks-s1 { animation-delay: 1.33s; }
    .preflight-checks-e1 { animation-delay: 1.33s; }
    .preflight-checks-s2 { animation-delay: 2.67s; }
    .preflight-checks-e2 { animation-delay: 2.67s; }
    .preflight-checks-s3 { animation-delay: 4.00s; }
    .preflight-checks-e3 { animation-delay: 4.00s; }
    .preflight-checks-s4 { animation-delay: 5.33s; }
    .preflight-checks-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .preflight-checks-conn  { animation: preflight-checks-trace 8s ease-in-out infinite; }
      .preflight-checks-stage { animation: preflight-checks-arrive 8s ease-in-out infinite; }
    }
    @keyframes preflight-checks-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes preflight-checks-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .preflight-checks-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .preflight-checks-stage { animation: preflight-checks-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes preflight-checks-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="preflight-checks-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="preflight-checks-bg" width="980" height="322"/>
  <text class="preflight-checks-h1"  x="30" y="40">What preflight must refuse</text>
  <text class="preflight-checks-sub" x="30" y="64">Report all of them, not the first.</text>
  <g class="preflight-checks-stage preflight-checks-s0">
    <rect class="preflight-checks-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="preflight-checks-step" x="44" y="142">01</text>
    <text class="preflight-checks-name" x="70" y="142">Tests pass</text>
    <text class="preflight-checks-desc" x="44" y="166">The cheapest possible</text>
    <text class="preflight-checks-desc" x="44" y="182">refusal. Nothing has</text>
    <text class="preflight-checks-desc" x="44" y="198">shipped.</text>
  </g>
  <line class="preflight-checks-line preflight-checks-conn preflight-checks-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#preflight-checks-tip)"/>
  <g class="preflight-checks-stage preflight-checks-s1">
    <rect class="preflight-checks-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="preflight-checks-step" x="233" y="142">02</text>
    <text class="preflight-checks-name" x="259" y="142">The migration is reversible</text>
    <text class="preflight-checks-desc" x="233" y="166">A dropped column removes</text>
    <text class="preflight-checks-desc" x="233" y="182">the assumption every</text>
    <text class="preflight-checks-desc" x="233" y="198">later gate relies on.</text>
    <text class="preflight-checks-edge" x="233" y="242">blocking</text>
  </g>
  <line class="preflight-checks-line preflight-checks-conn preflight-checks-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#preflight-checks-tip)"/>
  <g class="preflight-checks-stage preflight-checks-s2">
    <rect class="preflight-checks-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="preflight-checks-step" x="422" y="142">03</text>
    <text class="preflight-checks-name" x="448" y="142">Secrets are present</text>
    <text class="preflight-checks-desc" x="422" y="166">In the environment being</text>
    <text class="preflight-checks-desc" x="422" y="182">deployed to, not the one</text>
    <text class="preflight-checks-desc" x="422" y="198">you tested.</text>
  </g>
  <line class="preflight-checks-line preflight-checks-conn preflight-checks-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#preflight-checks-tip)"/>
  <g class="preflight-checks-stage preflight-checks-s3">
    <rect class="preflight-checks-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="preflight-checks-step" x="611" y="142">04</text>
    <text class="preflight-checks-name" x="637" y="142">The image is pinned to a digest</text>
    <text class="preflight-checks-desc" x="611" y="166">A mutable tag can point</text>
    <text class="preflight-checks-desc" x="611" y="182">at something you did not</text>
    <text class="preflight-checks-desc" x="611" y="198">build.</text>
    <text class="preflight-checks-edge" x="611" y="242">supply chain</text>
  </g>
  <line class="preflight-checks-line preflight-checks-conn preflight-checks-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#preflight-checks-tip)"/>
  <g class="preflight-checks-stage preflight-checks-s4">
    <rect class="preflight-checks-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="preflight-checks-step" x="800" y="142">05</text>
    <text class="preflight-checks-name" x="826" y="142">Cost has not jumped</text>
    <text class="preflight-checks-desc" x="800" y="166">A context-length change</text>
    <text class="preflight-checks-desc" x="800" y="182">doubles the bill</text>
    <text class="preflight-checks-desc" x="800" y="198">silently.</text>
    <text class="preflight-checks-edge" x="800" y="242">per request</text>
  </g>
  <text class="preflight-checks-sub" x="30" y="304">Collect every failure and report them together. A build with three problems should tell you three things, not send you round the loop three separate times.</text>
</svg>
