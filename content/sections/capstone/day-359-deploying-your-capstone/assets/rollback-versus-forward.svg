<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Fix forward afterwards.">
  <title>During an incident, roll back</title>
  <style>
    .rollback-versus-forward-bg   { fill: #f8fafc; }
    .rollback-versus-forward-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-versus-forward-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-versus-forward-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-versus-forward-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-versus-forward-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollback-versus-forward-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollback-versus-forward-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollback-versus-forward-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollback-versus-forward-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollback-versus-forward-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollback-versus-forward-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollback-versus-forward-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollback-versus-forward-row { opacity: 1; }
    .rollback-versus-forward-r0 { animation-delay: 0.00s; }
    .rollback-versus-forward-r1 { animation-delay: 0.45s; }
    .rollback-versus-forward-r2 { animation-delay: 0.90s; }
    .rollback-versus-forward-r3 { animation-delay: 1.35s; }
    .rollback-versus-forward-r4 { animation-delay: 1.80s; }
    .rollback-versus-forward-row { animation: rollback-versus-forward-reveal 7.3s ease-in-out infinite; }
    @keyframes rollback-versus-forward-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="rollback-versus-forward-bg" width="980" height="390"/>
  <text class="rollback-versus-forward-h1"  x="30" y="40">During an incident, roll back</text>
  <text class="rollback-versus-forward-sub" x="30" y="64">Fix forward afterwards.</text>
  <rect class="rollback-versus-forward-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="rollback-versus-forward-name" x="46" y="122">Roll back</text>
  <text class="rollback-versus-forward-desc" x="46" y="142">During the incident.</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r0" x="46" y="182">Returns to a state you know works</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r1" x="46" y="216">Seconds, not a build cycle</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r2" x="46" y="250">No new code written under pressure</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r3" x="46" y="284">The incident ends, then you investigate</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r4" x="46" y="318">Reversible again if it was the mistake</text>
  <rect class="rollback-versus-forward-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="rollback-versus-forward-name" x="526" y="122">Fix forward</text>
  <text class="rollback-versus-forward-desc" x="526" y="142">After it has ended.</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r0" x="526" y="182">Requires diagnosing correctly first</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r1" x="526" y="216">As long as a full deployment</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r2" x="526" y="250">Written by tired people at speed</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r3" x="526" y="284">The incident runs the whole time</text>
  <text class="rollback-versus-forward-desc rollback-versus-forward-row rollback-versus-forward-r4" x="526" y="318">Right when rollback is genuinely impossible</text>
  <text class="rollback-versus-forward-sub" x="30" y="372">A deployment you cannot reverse is not a deployment; it is a commitment. Rollback is the cheapest control in this lesson and the one that decides how bad a bad day gets.</text>
</svg>
