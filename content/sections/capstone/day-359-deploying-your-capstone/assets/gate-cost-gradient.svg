<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="This gradient is the whole argument.">
  <title>The cost of failing at each gate</title>
  <style>
    .gate-cost-gradient-bg   { fill: #f8fafc; }
    .gate-cost-gradient-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-cost-gradient-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-cost-gradient-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-cost-gradient-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-cost-gradient-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-cost-gradient-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gate-cost-gradient-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gate-cost-gradient-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gate-cost-gradient-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gate-cost-gradient-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gate-cost-gradient-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gate-cost-gradient-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gate-cost-gradient-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gate-cost-gradient-stage { opacity: 1; }

    .gate-cost-gradient-s0 { animation-delay: 0.00s; }
    .gate-cost-gradient-e0 { animation-delay: 0.00s; }
    .gate-cost-gradient-s1 { animation-delay: 1.28s; }
    .gate-cost-gradient-e1 { animation-delay: 1.28s; }
    .gate-cost-gradient-s2 { animation-delay: 2.56s; }
    .gate-cost-gradient-e2 { animation-delay: 2.56s; }
    .gate-cost-gradient-s3 { animation-delay: 3.84s; }
    .gate-cost-gradient-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gate-cost-gradient-conn  { animation: gate-cost-gradient-trace 6.4s ease-in-out infinite; }
      .gate-cost-gradient-stage { animation: gate-cost-gradient-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gate-cost-gradient-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gate-cost-gradient-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gate-cost-gradient-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gate-cost-gradient-stage { animation: gate-cost-gradient-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gate-cost-gradient-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gate-cost-gradient-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gate-cost-gradient-bg" width="980" height="322"/>
  <text class="gate-cost-gradient-h1"  x="30" y="40">The cost of failing at each gate</text>
  <text class="gate-cost-gradient-sub" x="30" y="64">This gradient is the whole argument.</text>
  <g class="gate-cost-gradient-stage gate-cost-gradient-s0">
    <rect class="gate-cost-gradient-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gate-cost-gradient-step" x="44" y="142">01</text>
    <text class="gate-cost-gradient-name" x="70" y="142">Preflight</text>
    <text class="gate-cost-gradient-desc" x="44" y="166">Nothing shipped. Tests,</text>
    <text class="gate-cost-gradient-desc" x="44" y="182">migrations, secrets, a pinned</text>
    <text class="gate-cost-gradient-desc" x="44" y="198">digest.</text>
    <text class="gate-cost-gradient-edge" x="44" y="242">free</text>
  </g>
  <line class="gate-cost-gradient-line gate-cost-gradient-conn gate-cost-gradient-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gate-cost-gradient-tip)"/>
  <g class="gate-cost-gradient-stage gate-cost-gradient-s1">
    <rect class="gate-cost-gradient-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gate-cost-gradient-step" x="280" y="142">02</text>
    <text class="gate-cost-gradient-name" x="306" y="142">Health check</text>
    <text class="gate-cost-gradient-desc" x="280" y="166">A rollout and a rollback. No</text>
    <text class="gate-cost-gradient-desc" x="280" y="182">user saw anything.</text>
    <text class="gate-cost-gradient-edge" x="280" y="242">a rollback</text>
  </g>
  <line class="gate-cost-gradient-line gate-cost-gradient-conn gate-cost-gradient-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gate-cost-gradient-tip)"/>
  <g class="gate-cost-gradient-stage gate-cost-gradient-s2">
    <rect class="gate-cost-gradient-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gate-cost-gradient-step" x="516" y="142">03</text>
    <text class="gate-cost-gradient-name" x="542" y="142">Canary</text>
    <text class="gate-cost-gradient-desc" x="516" y="166">A fraction of real traffic saw</text>
    <text class="gate-cost-gradient-desc" x="516" y="182">errors before it was caught.</text>
    <text class="gate-cost-gradient-edge" x="516" y="242">some users</text>
  </g>
  <line class="gate-cost-gradient-line gate-cost-gradient-conn gate-cost-gradient-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gate-cost-gradient-tip)"/>
  <g class="gate-cost-gradient-stage gate-cost-gradient-s3">
    <rect class="gate-cost-gradient-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gate-cost-gradient-step" x="752" y="142">04</text>
    <text class="gate-cost-gradient-name" x="778" y="142">After promotion</text>
    <text class="gate-cost-gradient-desc" x="752" y="166">An incident. Which is why the</text>
    <text class="gate-cost-gradient-desc" x="752" y="182">three earlier gates exist.</text>
    <text class="gate-cost-gradient-edge" x="752" y="242">everyone</text>
  </g>
  <text class="gate-cost-gradient-sub" x="30" y="304">The same defect costs a different amount at each row, and none of the gates is redundant: each catches a class of problem the earlier one structurally cannot see.</text>
</svg>
