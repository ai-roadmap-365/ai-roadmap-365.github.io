questions:
  - question: Why does an irreversible migration block the entire release path rather than only its own
      step?
    options:
      - Because migrations always run last and would fail anyway
      - Because every gate after preflight assumes rollback is available — a failed health check rolls
        back, a failed canary rolls back — and a migration that cannot be undone removes that assumption
        for all of them
      - Because irreversible migrations are slower to apply
      - Because the orchestrator refuses to schedule them
    answer_index: 1
    explanation: The later gates are only safe because they can retreat. Removing the retreat removes
      their safety, which is why reversibility is a release-blocking question.
  - question: A container starts and the orchestrator reports it healthy, but every request fails. Which
      check was missing?
    options:
      - A liveness probe
      - A readiness check — liveness only says the process is alive, while readiness asks whether it can
        actually serve, with the model loaded and dependencies reachable
      - A disk-space check
      - A version check
    answer_index: 1
    explanation: One probe cannot answer both questions. Liveness decides whether to restart; readiness
      decides whether to send traffic, and conflating them is why broken systems keep receiving requests.
  - question: Why should a canary decide on error rate rather than on elapsed time?
    options:
      - Because measuring time requires a synchronised clock
      - Because "it has been up for ten minutes" is a claim about duration, not correctness; an error
        budget makes the decision arithmetic rather than a judgement made under pressure
      - Because error rates are cheaper to compute
      - Because elapsed time varies between environments
    answer_index: 1
    explanation: The point of agreeing a budget in advance is that nobody makes good judgements during an
      incident. The threshold is decided when it is calm.
  - question: Why must rollback swap versions rather than discard the one being replaced?
    options:
      - To save storage on the registry
      - Because keeping both makes the rollback itself reversible, which matters on the day the rollback
        turns out to have been the mistake and the real fault was elsewhere
      - Because discarding requires a rebuild of the old version
      - Because orchestrators refuse to delete a running image
    answer_index: 1
    explanation: A one-way rollback is another irreversible operation performed under pressure, which is
      exactly the situation the whole lesson is trying to avoid.
  - question: Why is a canary close to meaningless on a low-traffic service, and what should you rely on
      instead?
    options:
      - Because low-traffic services do not fail; rely on monitoring
      - Because ten percent of a small volume may be a handful of requests, which cannot distinguish a
        two percent error rate from a nine percent one — rely on a fast rollback instead
      - Because canaries need a load balancer, which small services lack
      - Because error budgets only apply above a certain request rate
    answer_index: 1
    explanation: Below a certain scale the sample simply is not there, however carefully the threshold is
      chosen. Speed of recovery becomes the real control.
