questions:
- question: What is the RAG Triad of metrics and why is it essential for evaluating AI retrieval systems?
  options:
  - Measuring server CPU, memory, and disk usage
  - 'Three orthogonal metrics: (1) Context Recall (did we find the right context?), (2) Faithfulness (is
    the answer grounded strictly in the context?), and (3) Answer Relevance (does the answer address the
    user query?)'
  - A triad of database tables
  - Three Python packages required for web development
  answer_index: 1
  explanation: The RAG Triad isolates retrieval failures from generation hallucinations.
- question: How does the Faithfulness metric mathematically quantify hallucination in an AI response?
  options:
  - By counting the number of words in the response
  - Faithfulness = (Number of claims supported by retrieved context) / (Total claims made in the answer);
    any score below 1.0 indicates unsupported or hallucinated content
  - By multiplying response latency by cosine similarity
  - By checking if the response is in uppercase
  answer_index: 1
  explanation: Faithfulness measures the exact proportion of generated claims grounded in the retrieved
    context.
- question: Why is a version-controlled 'Golden Evaluation Dataset' mandatory before deploying changes
    to prompts or retrieval parameters?
  options:
  - To make the git repository larger
  - To provide a reproducible, deterministic benchmark suite that detects subtle accuracy regressions
    before code merges into production
  - Because cloud LLMs do not allow testing without datasets
  - To replace writing application source code
  answer_index: 1
  explanation: Golden datasets provide ground-truth benchmarks to prevent regressions.
- question: How does an LLM-as-a-Judge avoid scoring bias when evaluating subjective answers?
  options:
  - By always returning a score of 10/10
  - By utilizing structured multi-criteria grading rubrics, chain-of-thought reasoning steps, and strict
    numerical scoring anchors
  - By randomly selecting numbers between 1 and 5
  - By asking the user to manually grade every response
  answer_index: 1
  explanation: Structured rubrics and chain-of-thought explanations normalize judge evaluations.
- question: What CI/CD quality gate threshold is standard for RAG Faithfulness in enterprise applications?
  options:
  - '0.20'
  - 0.90 (minimum 90% of claims must be fully supported by context to pass build)
  - '0.00'
  - '-1.00'
  answer_index: 1
  explanation: Enterprise grade systems require >= 0.90 Faithfulness to prevent dangerous hallucinations.
