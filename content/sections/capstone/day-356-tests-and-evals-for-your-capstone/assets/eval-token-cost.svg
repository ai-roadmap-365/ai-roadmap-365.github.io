<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is why the set stays small and the ordering stays cheap-first.">
  <title>Evaluation costs tokens too</title>
  <style>
    .eval-token-cost-bg   { fill: #f8fafc; }
    .eval-token-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-token-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-token-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-token-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-token-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-token-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-token-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-token-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-token-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-token-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-token-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-token-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-token-cost-row { opacity: 1; }
    .eval-token-cost-r0 { animation-delay: 0.00s; }
    .eval-token-cost-r1 { animation-delay: 0.45s; }
    .eval-token-cost-r2 { animation-delay: 0.90s; }
    .eval-token-cost-r3 { animation-delay: 1.35s; }
    .eval-token-cost-r4 { animation-delay: 1.80s; }
    .eval-token-cost-row { animation: eval-token-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes eval-token-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eval-token-cost-bg" width="980" height="390"/>
  <text class="eval-token-cost-h1"  x="30" y="40">Evaluation costs tokens too</text>
  <text class="eval-token-cost-sub" x="30" y="64">Which is why the set stays small and the ordering stays cheap-first.</text>
  <rect class="eval-token-cost-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eval-token-cost-name" x="46" y="122">Unbounded</text>
  <text class="eval-token-cost-desc" x="46" y="142">Expensive enough to get switched off.</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r0" x="46" y="182">500 queries on every commit</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r1" x="46" y="216">Judge calls on top of generation calls</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r2" x="46" y="250">Minutes of wall-clock per push</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r3" x="46" y="284">A real line on the invoice</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r4" x="46" y="318">So someone disables it on the busy week</text>
  <rect class="eval-token-cost-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eval-token-cost-name" x="526" y="122">Tiered</text>
  <text class="eval-token-cost-desc" x="526" y="142">Cheap always, thorough sometimes.</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r0" x="526" y="182">20 queries on every pull request</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r1" x="526" y="216">The full set nightly, or before a release</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r2" x="526" y="250">Unit tests run first and fail cheaper</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r3" x="526" y="284">Cost is predictable and small</text>
  <text class="eval-token-cost-desc eval-token-cost-row eval-token-cost-r4" x="526" y="318">So it never gets switched off</text>
  <text class="eval-token-cost-sub" x="30" y="372">A gate is only useful while it is enabled, and the commonest reason a quality gate is removed is that it became slow or expensive enough to be resented.</text>
</svg>
