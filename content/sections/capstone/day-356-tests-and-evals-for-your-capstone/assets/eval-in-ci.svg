<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A gate, not a report nobody opens.">
  <title>Evaluation belongs in the pipeline</title>
  <style>
    .eval-in-ci-bg   { fill: #f8fafc; }
    .eval-in-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-in-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-in-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-in-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-in-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eval-in-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eval-in-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eval-in-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eval-in-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eval-in-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eval-in-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eval-in-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .eval-in-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .eval-in-ci-stage { opacity: 1; }

    .eval-in-ci-s0 { animation-delay: 0.00s; }
    .eval-in-ci-e0 { animation-delay: 0.00s; }
    .eval-in-ci-s1 { animation-delay: 1.28s; }
    .eval-in-ci-e1 { animation-delay: 1.28s; }
    .eval-in-ci-s2 { animation-delay: 2.56s; }
    .eval-in-ci-e2 { animation-delay: 2.56s; }
    .eval-in-ci-s3 { animation-delay: 3.84s; }
    .eval-in-ci-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .eval-in-ci-conn  { animation: eval-in-ci-trace 6.4s ease-in-out infinite; }
      .eval-in-ci-stage { animation: eval-in-ci-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes eval-in-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes eval-in-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .eval-in-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .eval-in-ci-stage { animation: eval-in-ci-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes eval-in-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="eval-in-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="eval-in-ci-bg" width="980" height="322"/>
  <text class="eval-in-ci-h1"  x="30" y="40">Evaluation belongs in the pipeline</text>
  <text class="eval-in-ci-sub" x="30" y="64">A gate, not a report nobody opens.</text>
  <g class="eval-in-ci-stage eval-in-ci-s0">
    <rect class="eval-in-ci-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="eval-in-ci-step" x="44" y="142">01</text>
    <text class="eval-in-ci-name" x="70" y="142">Run on every pull request</text>
    <text class="eval-in-ci-desc" x="44" y="166">The same queries, the same</text>
    <text class="eval-in-ci-desc" x="44" y="182">scoring, every time.</text>
    <text class="eval-in-ci-edge" x="44" y="242">automatic</text>
  </g>
  <line class="eval-in-ci-line eval-in-ci-conn eval-in-ci-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#eval-in-ci-tip)"/>
  <g class="eval-in-ci-stage eval-in-ci-s1">
    <rect class="eval-in-ci-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="eval-in-ci-step" x="280" y="142">02</text>
    <text class="eval-in-ci-name" x="306" y="142">Compare against the baseline</text>
    <text class="eval-in-ci-desc" x="280" y="166">Not an absolute score — the</text>
    <text class="eval-in-ci-desc" x="280" y="182">change relative to main.</text>
    <text class="eval-in-ci-edge" x="280" y="242">delta</text>
  </g>
  <line class="eval-in-ci-line eval-in-ci-conn eval-in-ci-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#eval-in-ci-tip)"/>
  <g class="eval-in-ci-stage eval-in-ci-s2">
    <rect class="eval-in-ci-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="eval-in-ci-step" x="516" y="142">03</text>
    <text class="eval-in-ci-name" x="542" y="142">Fail below the threshold</text>
    <text class="eval-in-ci-desc" x="516" y="166">A drop blocks the merge. This is</text>
    <text class="eval-in-ci-desc" x="516" y="182">what makes it a gate.</text>
    <text class="eval-in-ci-edge" x="516" y="242">blocked</text>
  </g>
  <line class="eval-in-ci-line eval-in-ci-conn eval-in-ci-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#eval-in-ci-tip)"/>
  <g class="eval-in-ci-stage eval-in-ci-s3">
    <rect class="eval-in-ci-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="eval-in-ci-step" x="752" y="142">04</text>
    <text class="eval-in-ci-name" x="778" y="142">Record the new baseline on merge</text>
    <text class="eval-in-ci-desc" x="752" y="166">So tomorrow's comparison is</text>
    <text class="eval-in-ci-desc" x="752" y="182">against today's truth.</text>
  </g>
  <text class="eval-in-ci-sub" x="30" y="304">Cheap-first ordering from Day 41 applies: run the fast unit tests before the evaluation, because an evaluation run costs tokens and there is no point spending them on code that does not compile.</text>
</svg>
