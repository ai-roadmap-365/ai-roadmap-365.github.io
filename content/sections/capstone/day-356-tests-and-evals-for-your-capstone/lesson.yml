learning_promise: 'Construct the comprehensive automated testing and quantitative evaluation harness for
  your Capstone: engineer RAG Triad evaluators (Faithfulness, Context Recall, Answer Relevance), LLM-as-a-Judge
  grading rubrics, deterministic golden benchmarks, regression assertion gates, and an automated evaluation
  platform in Python.'
objectives:
- Curate a representative Golden Evaluation Benchmark dataset with diverse domain queries and ground-truth
  answers.
- 'Implement programmatic RAG Triad metrics: Faithfulness, Context Recall, and Answer Relevance.'
- Deploy an LLM-as-a-Judge evaluation engine with multi-criteria rubrics and chain-of-thought grading.
- Integrate automated evaluation assertions into CI/CD quality gates (blocking PRs if Faithfulness < 0.90).
- Build an End-to-End Capstone Evaluation Platform in Python with quantitative markdown scorecard reporting.
