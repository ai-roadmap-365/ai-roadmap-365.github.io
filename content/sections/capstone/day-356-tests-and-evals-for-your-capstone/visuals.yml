visuals:
- id: rag-triad-evaluation-topology
  file: assets/rag-triad-evaluation-topology.svg
  type: diagram
  title: RAG Triad Evaluation Topology
  alt: RAG Triad Evaluation Topology showing User Query, Retrieved Context, Generated Answer, Context
    Recall, Faithfulness, and Answer Relevance
  description: System evaluation diagram illustrating the RAG Triad metric relationships.
- id: automated-ci-cd-evaluation-regression-gate
  file: assets/automated-ci-cd-evaluation-regression-gate.svg
  type: diagram
  title: Automated CI/CD Evaluation Regression Gate
  alt: Automated CI/CD Evaluation Regression Gate showing Git Push, Golden Dataset Evaluation, Metric
    Assertion Gate, and Deployment Block on Regression
  description: CI/CD pipeline workflow diagram illustrating automated evaluation quality gates.
- id: eval-three-eras
  file: assets/eval-three-eras.svg
  type: diagram
  title: 'Three eras of evaluating generated text'
  alt: 'Diagram: the progression of generated-text evaluation methods'
  description: 'A three-stage progression of evaluation from n-gram overlap metrics through uncalibrated model judges to grounded rubric-based assessment.'
- id: eval-platform-is-not
  file: assets/eval-platform-is-not.svg
  type: diagram
  title: 'What an evaluation set is for'
  alt: 'Diagram: what an evaluation set can and cannot tell you'
  description: 'A two-column comparison of the questions an evaluation set answers against those it cannot.'
- id: silent-regression
  file: assets/silent-regression.svg
  type: diagram
  title: 'The failure mode with no error'
  alt: 'Diagram: a silent quality regression compared with a detected one'
  description: 'A two-column comparison of a system without evaluation against one with a scored set, when a change degrades answer quality.'
- id: eval-in-ci
  file: assets/eval-in-ci.svg
  type: diagram
  title: 'Evaluation belongs in the pipeline'
  alt: 'Diagram: an evaluation gate in a continuous integration pipeline'
  description: 'A four-stage sequence placing an evaluation run inside CI as a merge gate, with a threshold and a recorded baseline.'
- id: rag-triad
  file: assets/rag-triad.svg
  type: diagram
  title: 'Three questions locate the failure'
  alt: 'Diagram: the three checks of the RAG evaluation triad'
  description: 'A three-stage evaluation covering context relevance, groundedness of the answer in that context, and relevance of the answer to the question.'
- id: judge-calibration
  file: assets/judge-calibration.svg
  type: diagram
  title: 'A judge must be calibrated against people'
  alt: 'Diagram: an uncalibrated model judge compared with a calibrated one'
  description: 'A two-column comparison of using a model as a judge without validation against calibrating it against human labels first.'
- id: eval-set-curation
  file: assets/eval-set-curation.svg
  type: diagram
  title: 'Building the first evaluation set'
  alt: 'Diagram: how to build a first evaluation set'
  description: 'A four-stage procedure for curating an initial evaluation set from real queries, expected sources and known failures.'
- id: eval-token-cost
  file: assets/eval-token-cost.svg
  type: diagram
  title: 'Evaluation costs tokens too'
  alt: 'Diagram: managing the token cost of continuous evaluation'
  description: 'A two-column comparison of an unbounded evaluation suite against a budgeted one that runs a small set frequently and a larger set rarely.'
- id: eval-scorecard
  file: assets/eval-scorecard.svg
  type: diagram
  title: 'What a scorecard should carry'
  alt: 'Diagram: the contents of an evaluation scorecard'
  description: 'A four-stage description of an evaluation scorecard covering retrieval, grounding, relevance and cost, each compared with a baseline.'
- id: eval-enforce-or-spot
  file: assets/eval-enforce-or-spot.svg
  type: diagram
  title: 'When automated evaluation earns its cost'
  alt: 'Diagram: when to automate evaluation and when to check by hand'
  description: 'A two-column comparison of situations requiring automated evaluation against those where manual spot-checking is proportionate.'
- id: failure-attribution
  file: assets/failure-attribution.svg
  type: diagram
  title: 'Attributing a bad answer'
  alt: 'Diagram: attributing an answer failure to retrieval or generation'
  description: 'A four-stage diagnostic procedure attributing a poor answer to retrieval, context assembly, or generation.'
