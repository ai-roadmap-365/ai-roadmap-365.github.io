terms:
- term: RAG Triad
  definition: 'A tripartite evaluation framework: Context Recall, Faithfulness, and Answer Relevance.'
- term: Faithfulness
  definition: The ratio of verified factual claims in an answer supported by the retrieved context.
- term: Context Recall
  definition: The proportion of ground-truth reference information successfully retrieved by search.
- term: Answer Relevance
  definition: The degree to which the generated answer directly addresses the user query.
- term: LLM-as-a-Judge
  definition: Using an advanced reasoning model to systematically evaluate and score generated responses.
- term: Golden Evaluation Dataset
  definition: A curated benchmark of diverse queries, contexts, and verified ground-truth answers.
- term: Regression Quality Gate
  definition: A CI/CD automated test asserting that model updates do not degrade evaluation metrics.
- term: Claim Decomposition
  definition: Breaking a generated response into discrete atomic factual propositions for verification.
