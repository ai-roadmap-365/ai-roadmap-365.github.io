visuals:
- id: two-stage-hybrid-retrieval-and-reranking-pipeline
  file: assets/two-stage-hybrid-retrieval-and-reranking-pipeline.svg
  type: diagram
  title: Two-Stage Hybrid Retrieval and Reranking Pipeline
  alt: Two-Stage Hybrid Retrieval and Reranking Pipeline showing Document Ingestion, Dense/Sparse Indexing,
    Reciprocal Rank Fusion, Cross-Encoder Scoring, and Top-K Context Selection
  description: Comprehensive pipeline diagram illustrating the two-stage hybrid retrieval architecture.
- id: rrf-score-fusion-distribution-matrix
  file: assets/rrf-score-fusion-distribution-matrix.svg
  type: diagram
  title: RRF Score Fusion Distribution Matrix
  alt: RRF Score Fusion Distribution Matrix comparing Dense Vector ranks, Sparse BM25 ranks, and fused
    composite RRF scores
  description: Mathematical rank fusion diagram illustrating the RRF calculation.
- id: retrieval-three-eras
  file: assets/retrieval-three-eras.svg
  type: diagram
  title: 'Three eras of retrieval for AI answers'
  alt: 'Diagram: the progression from dense-only retrieval to two-stage hybrid ranking'
  description: 'A three-stage progression of retrieval architecture from dense-only search through uncalibrated hybrid search to two-stage fusion with reranking.'
- id: dense-or-keyword
  file: assets/dense-or-keyword.svg
  type: diagram
  title: 'What each retriever is good at'
  alt: 'Diagram: dense vector search compared with keyword search'
  description: 'A two-column comparison of dense embedding search and lexical keyword search, covering the queries each handles well and where each fails.'
- id: rrf-fusion
  file: assets/rrf-fusion.svg
  type: diagram
  title: 'Fuse by rank, not by score'
  alt: 'Diagram: how reciprocal rank fusion combines two rankers'
  description: 'A four-stage explanation of reciprocal rank fusion showing why combining positions rather than raw scores avoids the incompatible-scale problem.'
- id: chunking-decides
  file: assets/chunking-decides.svg
  type: diagram
  title: 'Chunking decides what can be found'
  alt: 'Diagram: how chunk size affects what retrieval can return'
  description: 'A two-column comparison of small and large retrieval chunks, covering precision, context sufficiency and the failure each produces.'
- id: two-stage-cost
  file: assets/two-stage-cost.svg
  type: diagram
  title: 'Why reranking is a second stage'
  alt: 'Diagram: why reranking runs on a shortlist rather than the whole corpus'
  description: 'A four-stage explanation of two-stage retrieval covering cheap wide recall, the shortlist, expensive precise reranking, and the latency this buys.'
- id: retrieval-is-not
  file: assets/retrieval-is-not.svg
  type: diagram
  title: 'What retrieval does not do'
  alt: 'Diagram: what a retrieval layer is responsible for and what it is not'
  description: 'A two-column comparison of the retrieval layer''s responsibilities against those belonging to generation and evaluation.'
- id: vector-bloat
  file: assets/vector-bloat.svg
  type: diagram
  title: 'Embeddings are large, and they accumulate'
  alt: 'Diagram: how embedding storage grows with corpus and dimension'
  description: 'A four-stage explanation of vector storage growth covering per-vector size, corpus multiplication, index overhead, and the levers that reduce it.'
- id: keyword-suffices
  file: assets/keyword-suffices.svg
  type: diagram
  title: 'When you do not need embeddings at all'
  alt: 'Diagram: when keyword search alone is sufficient'
  description: 'A two-column comparison of workloads where lexical search alone suffices against those that justify the cost of a hybrid retrieval stack.'
- id: evaluate-retrieval-alone
  file: assets/evaluate-retrieval-alone.svg
  type: diagram
  title: 'Measure retrieval before measuring answers'
  alt: 'Diagram: evaluating the retrieval stage independently of generation'
  description: 'A four-stage evaluation procedure for retrieval covering a labelled query set, recall at k, precision after reranking, and comparison against a baseline.'
- id: embedding-versioning
  file: assets/embedding-versioning.svg
  type: diagram
  title: 'Embeddings are versioned data'
  alt: 'Diagram: what happens when an embedding model changes'
  description: 'A two-column comparison of treating embeddings as durable data against recognising them as model-version-dependent artefacts.'
