week: 51
learning_promise: 'Engineer the production data ingestion, chunking, embedding, vector storage, and hybrid
  retrieval engine for your Capstone: implement recursive semantic chunking, dual BM25 + dense indexing,
  Reciprocal Rank Fusion (RRF), cross-encoder reranking, and build a unified retrieval pipeline in Python.'
objectives:
- Implement a fault-tolerant document ingestion pipeline supporting Markdown, PDF, and JSON schemas with
  SHA256 content hashing.
- Configure recursive semantic text chunking with dynamic sentence boundary preservation and sliding token
  overlaps.
- Deploy a high-performance in-memory hybrid search index combining sparse BM25 token frequencies with
  dense vector cosine similarity.
- Fuse retrieval rankings using Reciprocal Rank Fusion (RRF) and apply cross-encoder reranking to maximize
  NDCG@10 and Recall@5.
- Build an End-to-End Capstone Hybrid Retrieval Engine in Python with automated retrieval latency benchmarking.
