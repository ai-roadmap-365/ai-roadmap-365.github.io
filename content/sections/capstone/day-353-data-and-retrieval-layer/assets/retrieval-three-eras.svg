<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each fixed a specific failure of the last.">
  <title>Three eras of retrieval for AI answers</title>
  <style>
    .retrieval-three-eras-bg   { fill: #f8fafc; }
    .retrieval-three-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-three-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-three-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-three-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-three-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .retrieval-three-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .retrieval-three-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .retrieval-three-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .retrieval-three-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .retrieval-three-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .retrieval-three-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .retrieval-three-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .retrieval-three-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .retrieval-three-eras-stage { opacity: 1; }

    .retrieval-three-eras-s0 { animation-delay: 0.00s; }
    .retrieval-three-eras-e0 { animation-delay: 0.00s; }
    .retrieval-three-eras-s1 { animation-delay: 1.50s; }
    .retrieval-three-eras-e1 { animation-delay: 1.50s; }
    .retrieval-three-eras-s2 { animation-delay: 3.00s; }
    .retrieval-three-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .retrieval-three-eras-conn  { animation: retrieval-three-eras-trace 6s ease-in-out infinite; }
      .retrieval-three-eras-stage { animation: retrieval-three-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes retrieval-three-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes retrieval-three-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .retrieval-three-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .retrieval-three-eras-stage { animation: retrieval-three-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes retrieval-three-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="retrieval-three-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="retrieval-three-eras-bg" width="980" height="322"/>
  <text class="retrieval-three-eras-h1"  x="30" y="40">Three eras of retrieval for AI answers</text>
  <text class="retrieval-three-eras-sub" x="30" y="64">Each fixed a specific failure of the last.</text>
  <g class="retrieval-three-eras-stage retrieval-three-eras-s0">
    <rect class="retrieval-three-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="retrieval-three-eras-step" x="44" y="142">01</text>
    <text class="retrieval-three-eras-name" x="70" y="142">Dense only, 2022-2023</text>
    <text class="retrieval-three-eras-desc" x="44" y="166">Embeddings for everything. Semantically</text>
    <text class="retrieval-three-eras-desc" x="44" y="182">strong, and blind to exact terms.</text>
    <text class="retrieval-three-eras-edge" x="44" y="242">blind spots</text>
  </g>
  <line class="retrieval-three-eras-line retrieval-three-eras-conn retrieval-three-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#retrieval-three-eras-tip)"/>
  <g class="retrieval-three-eras-stage retrieval-three-eras-s1">
    <rect class="retrieval-three-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="retrieval-three-eras-step" x="359" y="142">02</text>
    <text class="retrieval-three-eras-name" x="385" y="142">Naive hybrid, 2023-2024</text>
    <text class="retrieval-three-eras-desc" x="359" y="166">Keyword and dense combined by adding scores</text>
    <text class="retrieval-three-eras-desc" x="359" y="182">from incompatible scales.</text>
    <text class="retrieval-three-eras-edge" x="359" y="242">distorted</text>
  </g>
  <line class="retrieval-three-eras-line retrieval-three-eras-conn retrieval-three-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#retrieval-three-eras-tip)"/>
  <g class="retrieval-three-eras-stage retrieval-three-eras-s2">
    <rect class="retrieval-three-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="retrieval-three-eras-step" x="674" y="142">03</text>
    <text class="retrieval-three-eras-name" x="700" y="142">Two-stage with fusion, 2025-</text>
    <text class="retrieval-three-eras-desc" x="674" y="166">Rank fusion to combine, then a cross-encoder</text>
    <text class="retrieval-three-eras-desc" x="674" y="182">to rerank the top few.</text>
    <text class="retrieval-three-eras-edge" x="674" y="242">precise</text>
  </g>
  <text class="retrieval-three-eras-sub" x="30" y="304">The middle era is the instructive one: combining two rankers by summing their scores looks reasonable and fails, because a cosine similarity and a keyword score do not live on the same scale.</text>
</svg>
