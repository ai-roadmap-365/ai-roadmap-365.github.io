<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cross-encoders are accurate and too slow for everything.">
  <title>Why reranking is a second stage</title>
  <style>
    .two-stage-cost-bg   { fill: #f8fafc; }
    .two-stage-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-stage-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-stage-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-stage-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-stage-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-stage-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-stage-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-stage-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .two-stage-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .two-stage-cost-stage { opacity: 1; }

    .two-stage-cost-s0 { animation-delay: 0.00s; }
    .two-stage-cost-e0 { animation-delay: 0.00s; }
    .two-stage-cost-s1 { animation-delay: 1.28s; }
    .two-stage-cost-e1 { animation-delay: 1.28s; }
    .two-stage-cost-s2 { animation-delay: 2.56s; }
    .two-stage-cost-e2 { animation-delay: 2.56s; }
    .two-stage-cost-s3 { animation-delay: 3.84s; }
    .two-stage-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .two-stage-cost-conn  { animation: two-stage-cost-trace 6.4s ease-in-out infinite; }
      .two-stage-cost-stage { animation: two-stage-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes two-stage-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes two-stage-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .two-stage-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .two-stage-cost-stage { animation: two-stage-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes two-stage-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="two-stage-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="two-stage-cost-bg" width="980" height="322"/>
  <text class="two-stage-cost-h1"  x="30" y="40">Why reranking is a second stage</text>
  <text class="two-stage-cost-sub" x="30" y="64">Cross-encoders are accurate and too slow for everything.</text>
  <g class="two-stage-cost-stage two-stage-cost-s0">
    <rect class="two-stage-cost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-cost-step" x="44" y="142">01</text>
    <text class="two-stage-cost-name" x="70" y="142">Stage one: cheap and wide</text>
    <text class="two-stage-cost-desc" x="44" y="166">Vector plus keyword over the</text>
    <text class="two-stage-cost-desc" x="44" y="182">whole corpus. Milliseconds.</text>
    <text class="two-stage-cost-edge" x="44" y="242">~50ms</text>
  </g>
  <line class="two-stage-cost-line two-stage-cost-conn two-stage-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#two-stage-cost-tip)"/>
  <g class="two-stage-cost-stage two-stage-cost-s1">
    <rect class="two-stage-cost-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-cost-step" x="280" y="142">02</text>
    <text class="two-stage-cost-name" x="306" y="142">Take a shortlist</text>
    <text class="two-stage-cost-desc" x="280" y="166">The top 50. Recall matters here;</text>
    <text class="two-stage-cost-desc" x="280" y="182">precision does not yet.</text>
    <text class="two-stage-cost-edge" x="280" y="242">top 50</text>
  </g>
  <line class="two-stage-cost-line two-stage-cost-conn two-stage-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#two-stage-cost-tip)"/>
  <g class="two-stage-cost-stage two-stage-cost-s2">
    <rect class="two-stage-cost-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-cost-step" x="516" y="142">03</text>
    <text class="two-stage-cost-name" x="542" y="142">Stage two: expensive and precise</text>
    <text class="two-stage-cost-desc" x="516" y="166">A cross-encoder scores query and</text>
    <text class="two-stage-cost-desc" x="516" y="182">document TOGETHER, 50 times.</text>
    <text class="two-stage-cost-edge" x="516" y="242">~150ms</text>
  </g>
  <line class="two-stage-cost-line two-stage-cost-conn two-stage-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#two-stage-cost-tip)"/>
  <g class="two-stage-cost-stage two-stage-cost-s3">
    <rect class="two-stage-cost-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="two-stage-cost-step" x="752" y="142">04</text>
    <text class="two-stage-cost-name" x="778" y="142">Return the top few</text>
    <text class="two-stage-cost-desc" x="752" y="166">High precision, and the budget</text>
    <text class="two-stage-cost-desc" x="752" y="182">spent only where it changes the</text>
    <text class="two-stage-cost-desc" x="752" y="198">answer.</text>
    <text class="two-stage-cost-edge" x="752" y="242">top 5</text>
  </g>
  <text class="two-stage-cost-sub" x="30" y="304">Running the cross-encoder over the whole corpus would be far more accurate and take minutes. The two-stage shape exists entirely to buy most of that accuracy inside a latency budget.</text>
</svg>
