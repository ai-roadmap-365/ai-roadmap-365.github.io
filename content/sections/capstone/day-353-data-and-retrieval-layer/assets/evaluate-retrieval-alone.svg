<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Otherwise you cannot tell which half failed.">
  <title>Measure retrieval before measuring answers</title>
  <style>
    .evaluate-retrieval-alone-bg   { fill: #f8fafc; }
    .evaluate-retrieval-alone-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-retrieval-alone-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-retrieval-alone-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-retrieval-alone-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-retrieval-alone-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .evaluate-retrieval-alone-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .evaluate-retrieval-alone-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .evaluate-retrieval-alone-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .evaluate-retrieval-alone-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .evaluate-retrieval-alone-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .evaluate-retrieval-alone-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .evaluate-retrieval-alone-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .evaluate-retrieval-alone-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .evaluate-retrieval-alone-stage { opacity: 1; }

    .evaluate-retrieval-alone-s0 { animation-delay: 0.00s; }
    .evaluate-retrieval-alone-e0 { animation-delay: 0.00s; }
    .evaluate-retrieval-alone-s1 { animation-delay: 1.28s; }
    .evaluate-retrieval-alone-e1 { animation-delay: 1.28s; }
    .evaluate-retrieval-alone-s2 { animation-delay: 2.56s; }
    .evaluate-retrieval-alone-e2 { animation-delay: 2.56s; }
    .evaluate-retrieval-alone-s3 { animation-delay: 3.84s; }
    .evaluate-retrieval-alone-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .evaluate-retrieval-alone-conn  { animation: evaluate-retrieval-alone-trace 6.4s ease-in-out infinite; }
      .evaluate-retrieval-alone-stage { animation: evaluate-retrieval-alone-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes evaluate-retrieval-alone-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes evaluate-retrieval-alone-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .evaluate-retrieval-alone-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .evaluate-retrieval-alone-stage { animation: evaluate-retrieval-alone-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes evaluate-retrieval-alone-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="evaluate-retrieval-alone-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="evaluate-retrieval-alone-bg" width="980" height="322"/>
  <text class="evaluate-retrieval-alone-h1"  x="30" y="40">Measure retrieval before measuring answers</text>
  <text class="evaluate-retrieval-alone-sub" x="30" y="64">Otherwise you cannot tell which half failed.</text>
  <g class="evaluate-retrieval-alone-stage evaluate-retrieval-alone-s0">
    <rect class="evaluate-retrieval-alone-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-retrieval-alone-step" x="44" y="142">01</text>
    <text class="evaluate-retrieval-alone-name" x="70" y="142">Write a query set with known answers</text>
    <text class="evaluate-retrieval-alone-desc" x="44" y="166">Twenty is enough to start. Which</text>
    <text class="evaluate-retrieval-alone-desc" x="44" y="182">document SHOULD be returned?</text>
    <text class="evaluate-retrieval-alone-edge" x="44" y="242">20 queries</text>
  </g>
  <line class="evaluate-retrieval-alone-line evaluate-retrieval-alone-conn evaluate-retrieval-alone-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#evaluate-retrieval-alone-tip)"/>
  <g class="evaluate-retrieval-alone-stage evaluate-retrieval-alone-s1">
    <rect class="evaluate-retrieval-alone-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-retrieval-alone-step" x="280" y="142">02</text>
    <text class="evaluate-retrieval-alone-name" x="306" y="142">Measure recall at k</text>
    <text class="evaluate-retrieval-alone-desc" x="280" y="166">Is the right document in the top</text>
    <text class="evaluate-retrieval-alone-desc" x="280" y="182">50 at all? If not, nothing</text>
    <text class="evaluate-retrieval-alone-desc" x="280" y="198">downstream can fix it.</text>
    <text class="evaluate-retrieval-alone-edge" x="280" y="242">recall</text>
  </g>
  <line class="evaluate-retrieval-alone-line evaluate-retrieval-alone-conn evaluate-retrieval-alone-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#evaluate-retrieval-alone-tip)"/>
  <g class="evaluate-retrieval-alone-stage evaluate-retrieval-alone-s2">
    <rect class="evaluate-retrieval-alone-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-retrieval-alone-step" x="516" y="142">03</text>
    <text class="evaluate-retrieval-alone-name" x="542" y="142">Measure precision after rerank</text>
    <text class="evaluate-retrieval-alone-desc" x="516" y="166">Is it in the top 5? This is what</text>
    <text class="evaluate-retrieval-alone-desc" x="516" y="182">the reranker buys.</text>
    <text class="evaluate-retrieval-alone-edge" x="516" y="242">precision</text>
  </g>
  <line class="evaluate-retrieval-alone-line evaluate-retrieval-alone-conn evaluate-retrieval-alone-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#evaluate-retrieval-alone-tip)"/>
  <g class="evaluate-retrieval-alone-stage evaluate-retrieval-alone-s3">
    <rect class="evaluate-retrieval-alone-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="evaluate-retrieval-alone-step" x="752" y="142">04</text>
    <text class="evaluate-retrieval-alone-name" x="778" y="142">Compare against the simplest baseline</text>
    <text class="evaluate-retrieval-alone-desc" x="752" y="166">Keyword alone. If hybrid does</text>
    <text class="evaluate-retrieval-alone-desc" x="752" y="182">not beat it, do not ship hybrid.</text>
  </g>
  <text class="evaluate-retrieval-alone-sub" x="30" y="304">This is the number that makes a capstone credible: "reranking moved precision at 5 from 0.61 to 0.78 for 140ms" is a claim a reviewer can check and an engineer can act on.</text>
</svg>
