terms:
- term: Hybrid Retrieval
  definition: A search architecture combining dense vector embeddings with sparse lexical BM25 matching.
- term: Reciprocal Rank Fusion (RRF)
  definition: An algorithm merging ranked retrieval lists using reciprocal position weighting.
- term: Cross-Encoder Reranker
  definition: A neural model computing joint cross-attention over query and passage text to score relevance.
- term: Semantic Chunking
  definition: Splitting text into coherent passages based on natural linguistic boundaries rather than
    fixed token counts.
- term: Idempotent Ingestion
  definition: Ensuring repeated document uploads produce identical index states without creating duplicate
    chunks.
- term: Context Precision
  definition: The proportion of retrieved chunks that are genuinely relevant to answering the user query.
- term: HNSW (Hierarchical Navigable Small World)
  definition: An approximate nearest neighbor graph index providing logarithmic vector search scaling.
- term: Content Hashing
  definition: Generating cryptographic SHA256 signatures of document chunks to detect duplicates.
