questions:
- question: Why is pure dense vector retrieval insufficient for enterprise technical documents?
  options:
  - Because vectors require too much hard drive space
  - Dense vector embeddings struggle with exact keyword lookups (SKUs, UUIDs, error codes, legal clause
    identifiers), whereas sparse BM25 excels at exact keyword matching
  - Dense vectors only work in Python 2
  - Because embeddings cannot be stored in RAM
  answer_index: 1
  explanation: Hybrid search combines semantic understanding with exact lexical matching for maximum retrieval
    recall.
- question: What is the formula and purpose of Reciprocal Rank Fusion (RRF)?
  options:
  - Adding vector norms together
  - RRF score = sum(1 / (k + rank_i)) across sparse and dense ranking lists; it normalizes arbitrary score
    distributions without requiring calibrated probability scores
  - Multiplying raw cosine similarity by word count
  - Subtracting the BM25 score from the dense distance
  answer_index: 1
  explanation: RRF provides robust, scale-invariant rank combination across heterogeneous search engines.
- question: Why is SHA256 content hashing applied to document chunks during ingestion?
  options:
  - To compress the text file
  - To detect duplicate chunks and enable idempotent upserts, preventing vector index bloat and redundant
    re-embedding compute costs
  - To encrypt the database
  - Because vector databases require 256-bit keys
  answer_index: 1
  explanation: Content hashing ensures idempotent ingestion and prevents duplicate chunks in the vector
    index.
- question: What role does a Cross-Encoder Reranker play in the two-stage retrieval pipeline?
  options:
  - It deletes low-scoring documents from the database
  - It jointly computes cross-attention over query-document pairs on the top-50 candidates, scoring fine-grained
    relevance that bi-encoder cosine similarity misses
  - It translates English text into French
  - It compresses vectors from 1536 down to 128 dimensions
  answer_index: 1
  explanation: Cross-encoders perform full token-level cross-attention, significantly improving Context
    Precision.
- question: What retrieval latency budget is typically allocated to the hybrid retrieval stage in a real-time
    AI assistant?
  options:
  - 5,000 milliseconds
  - under 80 milliseconds (parallel BM25 + dense search under 35ms, RRF fusion under 5ms, cross-encoder
    rerank top-10 under 40ms)
  - 10 seconds
  - 0 milliseconds
  answer_index: 1
  explanation: Sub-80ms retrieval preserves sufficient headroom for LLM time-to-first-token generation.
