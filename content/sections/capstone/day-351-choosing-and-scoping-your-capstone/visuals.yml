visuals:
- id: capstone-project-archetypes-and-pillars
  file: assets/capstone-project-archetypes-and-pillars.svg
  type: diagram
  title: Capstone Project Archetypes and Pillars
  alt: Capstone Project Archetypes and Pillars showing 3 Candidate Archetypes (Enterprise RAG Copilot,
    Autonomous Multi-Agent System, Real-Time Multimodal Assistant) and 6 Required Engineering Pillars
  description: System architecture diagram illustrating the capstone project options and mandatory engineering
    pillars.
- id: two-week-capstone-milestone-execution-timeline
  file: assets/two-week-capstone-milestone-execution-timeline.svg
  type: diagram
  title: Two-Week Capstone Milestone Execution Timeline
  alt: Two-Week Capstone Milestone Execution Timeline showing Week 51 Foundation (Days 351-357) and Week
    52 Delivery (Days 358-365)
  description: Chronological timeline detailing daily milestones across the two-week capstone build.
- id: scope-three-eras
  file: assets/scope-three-eras.svg
  type: diagram
  title: 'Three eras of what counted as an AI project'
  alt: 'Diagram: how the bar for an AI portfolio project moved between 2015 and today'
  description: 'A three-stage progression of AI project expectations from algorithm-focused work through thin wrapper demos to production systems judged on reliability and cost.'
- id: scope-in-or-out
  file: assets/scope-in-or-out.svg
  type: diagram
  title: 'What a capstone is, and is not'
  alt: 'Diagram: what belongs in a capstone and what does not'
  description: 'A two-column comparison of appropriate capstone scope against work that belongs outside it, covering system integration versus novel research.'
- id: smart-boundaries
  file: assets/smart-boundaries.svg
  type: diagram
  title: 'Scope creep has a shape, and a defence'
  alt: 'Diagram: how an unbounded project grows and how a written scope stops it'
  description: 'A four-stage sequence showing how a project without a written boundary accretes features, and the effect of a specific measurable scope statement.'
- id: cost-and-time-box
  file: assets/cost-and-time-box.svg
  type: diagram
  title: 'Budget money and time before building'
  alt: 'Diagram: an unbudgeted project compared with one with a cost and time box'
  description: 'A two-column comparison of building without explicit cost and time limits against setting both in advance, covering how each fails.'
- id: vertical-slice-first
  file: assets/vertical-slice-first.svg
  type: diagram
  title: 'Build a thin vertical slice first'
  alt: 'Diagram: building a project layer by layer compared with a thin end-to-end slice'
  description: 'A four-stage sequence contrasting horizontal layer-by-layer construction with a thin vertical slice that exercises every layer early.'
- id: portfolio-evidence
  file: assets/portfolio-evidence.svg
  type: diagram
  title: 'What a reviewer can actually assess'
  alt: 'Diagram: what a portfolio reviewer looks for in a capstone'
  description: 'A two-column comparison of a capstone judged on its concept against one judged on demonstrable engineering evidence.'
- id: charter-signoff
  file: assets/charter-signoff.svg
  type: diagram
  title: 'The five things to write down before day one'
  alt: 'Diagram: the contents of a capstone charter'
  description: 'A five-stage checklist of what a project charter must state before work begins: the problem, the user, the success measure, the boundary and the budget.'
- id: archetype-choice
  file: assets/archetype-choice.svg
  type: diagram
  title: 'Choosing an archetype'
  alt: 'Diagram: comparing capstone project archetypes by what each demonstrates'
  description: 'A two-column comparison of retrieval-centred and agent-centred capstone archetypes, covering what each exercises and where each is difficult.'
- id: milestone-cadence
  file: assets/milestone-cadence.svg
  type: diagram
  title: 'Two weeks, in checkable pieces'
  alt: 'Diagram: a two-week capstone milestone cadence'
  description: 'A four-stage milestone plan across two weeks covering the vertical slice, depth, hardening and delivery, with a demonstrable artefact at each point.'
- id: scope-lightweight
  file: assets/scope-lightweight.svg
  type: diagram
  title: 'When full scoping rigour is not worth it'
  alt: 'Diagram: when to apply full project scoping and when to keep it light'
  description: 'A two-column comparison of projects warranting a full charter against smaller efforts where lighter scoping is appropriate.'
