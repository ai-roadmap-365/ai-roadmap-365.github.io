title: Choosing and Scoping Your Capstone
section: capstone
subsection: capstone-project
week: 51
learning_promise: 'Select, scope, and define a defensible production-grade Capstone AI project that synthesizes
  all 50 weeks of engineering discipline: data ingestion, vector retrieval, agent tool execution, automated
  evals, containerization, observability, and security hardening.'
objectives:
- Select a high-impact AI product domain (Enterprise Knowledge Assistant, Autonomous Agentic Workflow,
  or Real-Time Multi-Modal Copilot).
- Define non-negotiable architectural boundaries, SLAs, and technical constraints using the SMART scoping
  framework.
- Establish quantitative baseline evaluation targets (p95 latency, RAG triad scores, tool calling accuracy,
  and cost budgets).
- Construct a Project Charter and Milestone Roadmap spanning data ingestion, backend serving, frontend
  UI, CI/CD, and security reviews.
- Implement an automated Project Scoping and Feasibility Scorer in Python to mathematically validate project
  scope before building.
