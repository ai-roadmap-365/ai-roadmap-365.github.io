questions:
- question: What is the primary danger when selecting a capstone project scope?
  options:
  - 'Scope creep, leaving an unfinished prototype'
  - Using open-source software
  - Writing too many unit tests
  - Using Python instead of C++
  answer_index: 0
  explanation: A focused, deep, and fully verified vertical slice is vastly superior to a shallow, buggy
    demo.
- question: Which set of core technical capabilities must every AI Capstone demonstrate?
  options:
  - Only HTML and CSS styling
  - 'Ingest, reason, evaluate, serve, observe, harden'
  - A PowerPoint presentation with zero working code
  - Running on 100 GPUs simultaneously
  answer_index: 1
  explanation: The capstone proves full-stack AI engineering competence across the entire lifecycle.
- question: How does the SMART scoping framework apply to AI evaluation metrics?
  options:
  - 'Setting vague goals such as ''the AI should just be smart'''
  - Disabling evaluation in production
  - 'Specific, measurable targets with numbers and deadlines'
  - Relying solely on subjective vibes
  answer_index: 2
  explanation: SMART scoping grounds AI engineering in quantifiable SLAs and benchmarks.
- question: Why is a 'walking skeleton' vertical slice built in Week 51 before adding advanced features?
  options:
  - To make the code look longer
  - To spend all cloud budget in one day
  - Because Python requires it
  - 'To flush out integration risk early'
  answer_index: 3
  explanation: A walking skeleton proves that the end-to-end pipeline connects successfully before adding
    complexity.
- question: What is the output of the automated Capstone Scoping & Feasibility Scorer?
  options:
  - 'A feasibility score and a project charter'
  - A binary executable
  - A random number between 1 and 10
  - An audio file
  answer_index: 0
  explanation: The scoping tool validates technical balance, SLA realism, and risk mitigations.
