terms:
- term: Capstone Project
  definition: A comprehensive end-to-end production AI system synthesizing all 50 weeks of technical curriculum.
- term: Vertical Slice
  definition: A complete, working end-to-end implementation of a single core user workflow through all
    architectural layers.
- term: Scope Creep
  definition: The uncontrolled expansion of project requirements without corresponding adjustments to
    time and resources.
- term: Project Charter
  definition: A formal document defining the project problem statement, architecture, constraints, SLAs,
    and deliverables.
- term: SMART Criteria
  definition: Specific, Measurable, Achievable, Relevant, and Time-bound metric targets.
- term: Walking Skeleton
  definition: A minimal end-to-end system implementation connecting all architectural components with
    trivial logic.
- term: Technical SLA
  definition: Service Level Agreements defining quantitative latency, throughput, accuracy, and cost limits.
- term: Feasibility Audit
  definition: A quantitative evaluation verifying that required compute, data, and APIs are realistically
    accessible.
