<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each milestone produces something demonstrable.">
  <title>Two weeks, in checkable pieces</title>
  <style>
    .milestone-cadence-bg   { fill: #f8fafc; }
    .milestone-cadence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .milestone-cadence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .milestone-cadence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .milestone-cadence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .milestone-cadence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .milestone-cadence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .milestone-cadence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .milestone-cadence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .milestone-cadence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .milestone-cadence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .milestone-cadence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .milestone-cadence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .milestone-cadence-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .milestone-cadence-stage { opacity: 1; }

    .milestone-cadence-s0 { animation-delay: 0.00s; }
    .milestone-cadence-e0 { animation-delay: 0.00s; }
    .milestone-cadence-s1 { animation-delay: 1.28s; }
    .milestone-cadence-e1 { animation-delay: 1.28s; }
    .milestone-cadence-s2 { animation-delay: 2.56s; }
    .milestone-cadence-e2 { animation-delay: 2.56s; }
    .milestone-cadence-s3 { animation-delay: 3.84s; }
    .milestone-cadence-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .milestone-cadence-conn  { animation: milestone-cadence-trace 6.4s ease-in-out infinite; }
      .milestone-cadence-stage { animation: milestone-cadence-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes milestone-cadence-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes milestone-cadence-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .milestone-cadence-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .milestone-cadence-stage { animation: milestone-cadence-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes milestone-cadence-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="milestone-cadence-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="milestone-cadence-bg" width="980" height="322"/>
  <text class="milestone-cadence-h1"  x="30" y="40">Two weeks, in checkable pieces</text>
  <text class="milestone-cadence-sub" x="30" y="64">Each milestone produces something demonstrable.</text>
  <g class="milestone-cadence-stage milestone-cadence-s0">
    <rect class="milestone-cadence-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="milestone-cadence-step" x="44" y="142">01</text>
    <text class="milestone-cadence-name" x="70" y="142">Days 1-2: the thin slice</text>
    <text class="milestone-cadence-desc" x="44" y="166">One query end to end. Ugly, and</text>
    <text class="milestone-cadence-desc" x="44" y="182">working.</text>
    <text class="milestone-cadence-edge" x="44" y="242">integrated</text>
  </g>
  <line class="milestone-cadence-line milestone-cadence-conn milestone-cadence-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#milestone-cadence-tip)"/>
  <g class="milestone-cadence-stage milestone-cadence-s1">
    <rect class="milestone-cadence-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="milestone-cadence-step" x="280" y="142">02</text>
    <text class="milestone-cadence-name" x="306" y="142">Days 3-7: depth</text>
    <text class="milestone-cadence-desc" x="280" y="166">Retrieval quality, evaluation,</text>
    <text class="milestone-cadence-desc" x="280" y="182">the real feature. Each lands in</text>
    <text class="milestone-cadence-desc" x="280" y="198">a running system.</text>
  </g>
  <line class="milestone-cadence-line milestone-cadence-conn milestone-cadence-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#milestone-cadence-tip)"/>
  <g class="milestone-cadence-stage milestone-cadence-s2">
    <rect class="milestone-cadence-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="milestone-cadence-step" x="516" y="142">03</text>
    <text class="milestone-cadence-name" x="542" y="142">Days 8-11: hardening</text>
    <text class="milestone-cadence-desc" x="516" y="166">Failure paths, cost controls,</text>
    <text class="milestone-cadence-desc" x="516" y="182">monitoring, security review.</text>
    <text class="milestone-cadence-edge" x="516" y="242">production</text>
  </g>
  <line class="milestone-cadence-line milestone-cadence-conn milestone-cadence-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#milestone-cadence-tip)"/>
  <g class="milestone-cadence-stage milestone-cadence-s3">
    <rect class="milestone-cadence-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="milestone-cadence-step" x="752" y="142">04</text>
    <text class="milestone-cadence-name" x="778" y="142">Days 12-14: delivery</text>
    <text class="milestone-cadence-desc" x="752" y="166">Documentation, demo, and the</text>
    <text class="milestone-cadence-desc" x="752" y="182">buffer every project needs.</text>
    <text class="milestone-cadence-edge" x="752" y="242">buffer</text>
  </g>
  <text class="milestone-cadence-sub" x="30" y="304">The buffer at the end is not slack — it is the part that gets consumed by whatever went wrong, and a plan without it delivers late by construction.</text>
</svg>
