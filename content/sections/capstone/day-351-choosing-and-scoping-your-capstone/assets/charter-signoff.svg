<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One page, and it settles the arguments later.">
  <title>The five things to write down before day one</title>
  <style>
    .charter-signoff-bg   { fill: #f8fafc; }
    .charter-signoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .charter-signoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .charter-signoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .charter-signoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .charter-signoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .charter-signoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .charter-signoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .charter-signoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .charter-signoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .charter-signoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .charter-signoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .charter-signoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .charter-signoff-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .charter-signoff-stage { opacity: 1; }

    .charter-signoff-s0 { animation-delay: 0.00s; }
    .charter-signoff-e0 { animation-delay: 0.00s; }
    .charter-signoff-s1 { animation-delay: 1.33s; }
    .charter-signoff-e1 { animation-delay: 1.33s; }
    .charter-signoff-s2 { animation-delay: 2.67s; }
    .charter-signoff-e2 { animation-delay: 2.67s; }
    .charter-signoff-s3 { animation-delay: 4.00s; }
    .charter-signoff-e3 { animation-delay: 4.00s; }
    .charter-signoff-s4 { animation-delay: 5.33s; }
    .charter-signoff-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .charter-signoff-conn  { animation: charter-signoff-trace 8s ease-in-out infinite; }
      .charter-signoff-stage { animation: charter-signoff-arrive 8s ease-in-out infinite; }
    }
    @keyframes charter-signoff-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes charter-signoff-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .charter-signoff-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .charter-signoff-stage { animation: charter-signoff-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes charter-signoff-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="charter-signoff-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="charter-signoff-bg" width="980" height="322"/>
  <text class="charter-signoff-h1"  x="30" y="40">The five things to write down before day one</text>
  <text class="charter-signoff-sub" x="30" y="64">One page, and it settles the arguments later.</text>
  <g class="charter-signoff-stage charter-signoff-s0">
    <rect class="charter-signoff-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="charter-signoff-step" x="44" y="142">01</text>
    <text class="charter-signoff-name" x="70" y="142">The problem</text>
    <text class="charter-signoff-desc" x="44" y="166">One sentence, in the</text>
    <text class="charter-signoff-desc" x="44" y="182">user's words rather than</text>
    <text class="charter-signoff-desc" x="44" y="198">the technology's.</text>
  </g>
  <line class="charter-signoff-line charter-signoff-conn charter-signoff-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#charter-signoff-tip)"/>
  <g class="charter-signoff-stage charter-signoff-s1">
    <rect class="charter-signoff-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="charter-signoff-step" x="233" y="142">02</text>
    <text class="charter-signoff-name" x="259" y="142">The user</text>
    <text class="charter-signoff-desc" x="233" y="166">Who specifically.</text>
    <text class="charter-signoff-desc" x="233" y="182">"Everyone" means the</text>
    <text class="charter-signoff-desc" x="233" y="198">scope is undefined.</text>
    <text class="charter-signoff-edge" x="233" y="242">one user</text>
  </g>
  <line class="charter-signoff-line charter-signoff-conn charter-signoff-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#charter-signoff-tip)"/>
  <g class="charter-signoff-stage charter-signoff-s2">
    <rect class="charter-signoff-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="charter-signoff-step" x="422" y="142">03</text>
    <text class="charter-signoff-name" x="448" y="142">The success measure</text>
    <text class="charter-signoff-desc" x="422" y="166">A number you can compute.</text>
    <text class="charter-signoff-desc" x="422" y="182">Not "works well".</text>
    <text class="charter-signoff-edge" x="422" y="242">measurable</text>
  </g>
  <line class="charter-signoff-line charter-signoff-conn charter-signoff-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#charter-signoff-tip)"/>
  <g class="charter-signoff-stage charter-signoff-s3">
    <rect class="charter-signoff-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="charter-signoff-step" x="611" y="142">04</text>
    <text class="charter-signoff-name" x="637" y="142">The boundary</text>
    <text class="charter-signoff-desc" x="611" y="166">What is explicitly NOT in</text>
    <text class="charter-signoff-desc" x="611" y="182">this project. The hardest</text>
    <text class="charter-signoff-desc" x="611" y="198">and most valuable line.</text>
  </g>
  <line class="charter-signoff-line charter-signoff-conn charter-signoff-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#charter-signoff-tip)"/>
  <g class="charter-signoff-stage charter-signoff-s4">
    <rect class="charter-signoff-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="charter-signoff-step" x="800" y="142">05</text>
    <text class="charter-signoff-name" x="826" y="142">The budget</text>
    <text class="charter-signoff-desc" x="800" y="166">Money and hours, both</text>
    <text class="charter-signoff-desc" x="800" y="182">capped, both decided now.</text>
    <text class="charter-signoff-edge" x="800" y="242">capped</text>
  </g>
  <text class="charter-signoff-sub" x="30" y="304">Written down, these take fifteen minutes and end every later disagreement about whether something belongs. Undocumented, each of the five gets renegotiated silently and continuously.</text>
</svg>
