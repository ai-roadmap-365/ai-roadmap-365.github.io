<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Capstone Project Archetypes and Pillars">
  <title>Capstone Project Archetypes and Pillars</title>
  <defs>
    <style>
      .d351a-bg { fill: #f8fafc; }
      .d351a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d351a-arch { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d351a-pil { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d351a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d351a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d351a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d351a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d351a-bg" />
  
  <text x="40" y="40" class="d351a-title">Capstone Project Scope: Archetypes &amp; Pillars</text>
  <text x="40" y="65" class="d351a-subtitle">Capstone Project Archetypes and Pillars showing 3 Candidate Archetypes (Enterprise RAG Copilot, Autonomous Multi-Agent System, Real-Time Multimodal Assistant) and 6 Required Engineering Pillars</text>
  
  <!-- Archetypes -->
  <rect x="40" y="100" width="260" height="300" class="d351a-arch" />
  <text x="55" y="130" class="d351a-header" fill="#1d4ed8">Select 1 Project Archetype</text>
  <text x="55" y="165" class="d351a-text" font-weight="600">A. Enterprise RAG Assistant</text>
  <text x="55" y="185" class="d351a-text">Hybrid BM25 + Vector, GraphRAG</text>
  <text x="55" y="215" class="d351a-text" font-weight="600">B. Autonomous Agent Platform</text>
  <text x="55" y="235" class="d351a-text">ReAct loop, tool calling, sandbox</text>
  <text x="55" y="265" class="d351a-text" font-weight="600">C. Real-Time Multimodal Copilot</text>
  <text x="55" y="285" class="d351a-text">Audio/vision streaming, fast LLM</text>
  <text x="55" y="330" class="d351a-text" fill="#1e40af" font-weight="600">Vertical Slice Focus:</text>
  <text x="55" y="355" class="d351a-text">Deep, working feature set</text>
  
  <!-- Pillars -->
  <rect x="330" y="100" width="530" height="300" class="d351a-pil" />
  <text x="350" y="130" class="d351a-header" fill="#15803d">6 Mandatory Engineering Pillars</text>
  
  <rect x="350" y="150" width="230" height="65" class="d351a-card" />
  <text x="360" y="175" class="d351a-text" font-weight="600">1. Data Ingestion &amp; Indexing</text>
  <text x="360" y="195" class="d351a-text">Chunking, embedding, vector DB</text>
  
  <rect x="610" y="150" width="230" height="65" class="d351a-card" />
  <text x="620" y="175" class="d351a-text" font-weight="600">2. Core Reasoning &amp; Tools</text>
  <text x="620" y="195" class="d351a-text">Structured outputs, fallback router</text>
  
  <rect x="350" y="230" width="230" height="65" class="d351a-card" />
  <text x="360" y="255" class="d351a-text" font-weight="600">3. Automated Evals &amp; Triad</text>
  <text x="360" y="275" class="d351a-text">Faithfulness, answer relevancy</text>
  
  <rect x="610" y="230" width="230" height="65" class="d351a-card" />
  <text x="620" y="255" class="d351a-text" font-weight="600">4. Containerized Cloud API</text>
  <text x="620" y="275" class="d351a-text">FastAPI, Docker, health probes</text>
  
  <rect x="350" y="310" width="230" height="65" class="d351a-card" />
  <text x="360" y="335" class="d351a-text" font-weight="600">5. Observability &amp; Costs</text>
  <text x="360" y="355" class="d351a-text">OpenTelemetry, token budgets</text>
  
  <rect x="610" y="310" width="230" height="65" class="d351a-card" />
  <text x="620" y="335" class="d351a-text" font-weight="600">6. Security &amp; PII Vault</text>
  <text x="620" y="355" class="d351a-text">Delimiters, canary, red teaming</text>
</svg>