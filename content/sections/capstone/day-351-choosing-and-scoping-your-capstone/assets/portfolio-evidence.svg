<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not the idea. The evidence around it.">
  <title>What a reviewer can actually assess</title>
  <style>
    .portfolio-evidence-bg   { fill: #f8fafc; }
    .portfolio-evidence-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-evidence-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-evidence-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-evidence-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-evidence-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .portfolio-evidence-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-evidence-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .portfolio-evidence-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .portfolio-evidence-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .portfolio-evidence-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .portfolio-evidence-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .portfolio-evidence-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .portfolio-evidence-row { opacity: 1; }
    .portfolio-evidence-r0 { animation-delay: 0.00s; }
    .portfolio-evidence-r1 { animation-delay: 0.45s; }
    .portfolio-evidence-r2 { animation-delay: 0.90s; }
    .portfolio-evidence-r3 { animation-delay: 1.35s; }
    .portfolio-evidence-r4 { animation-delay: 1.80s; }
    .portfolio-evidence-row { animation: portfolio-evidence-reveal 7.3s ease-in-out infinite; }
    @keyframes portfolio-evidence-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="portfolio-evidence-bg" width="980" height="390"/>
  <text class="portfolio-evidence-h1"  x="30" y="40">What a reviewer can actually assess</text>
  <text class="portfolio-evidence-sub" x="30" y="64">Not the idea. The evidence around it.</text>
  <rect class="portfolio-evidence-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="portfolio-evidence-name" x="46" y="122">What does not persuade</text>
  <text class="portfolio-evidence-desc" x="46" y="142">Common, and weak.</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r0" x="46" y="182">"It uses a large language model"</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r1" x="46" y="216">A screenshot of one good answer</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r2" x="46" y="250">A README describing intentions</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r3" x="46" y="284">No numbers anywhere</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r4" x="46" y="318">No evidence it ever failed</text>
  <rect class="portfolio-evidence-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="portfolio-evidence-name" x="526" y="122">What does</text>
  <text class="portfolio-evidence-desc" x="526" y="142">Checkable claims.</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r0" x="526" y="182">An evaluation set, with before and after</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r1" x="526" y="216">A latency number, and where it goes</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r2" x="526" y="250">A cost per request, measured</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r3" x="526" y="284">A failure mode handled, and shown</text>
  <text class="portfolio-evidence-desc portfolio-evidence-row portfolio-evidence-r4" x="526" y="318">A commit history someone can read</text>
  <text class="portfolio-evidence-sub" x="30" y="372">The distinguishing evidence is almost always a number attached to a decision. "Reranking raised precision from 0.61 to 0.78 and cost 140ms" is a sentence a reviewer can trust.</text>
</svg>
