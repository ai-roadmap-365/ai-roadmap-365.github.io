visuals:
  - id: streaming-response-state-machine
    file: assets/streaming-response-state-machine.svg
    type: diagram
    title: The Streaming Response State Machine
    alt: The Streaming Response State Machine showing transitions from idle through waiting and
      streaming to done, error or cancelled, with what the user sees in each state
    description: State diagram of a streaming response with three distinct terminal states, and what an
      interface should render in each.
  - id: perceived-wait-versus-total-duration
    file: assets/perceived-wait-versus-total-duration.svg
    type: diagram
    title: Perceived Wait versus Total Duration
    alt: Perceived Wait versus Total Duration comparing a streaming run and a blocking run of the same
      answer, showing the same content with very different waits
    description: Measured comparison of a streaming and a blocking run delivering identical content,
      with perceived wait of four ticks against twelve.
  - id: response-not-page-load
    file: assets/response-not-page-load.svg
    type: diagram
    title: 'An AI response is not a page load'
    alt: 'Diagram: a page load compared with a streaming AI response'
    description: 'A two-column comparison of a conventional page load against a streaming AI response, in terms of duration, states and what the interface must render.'
  - id: ttft-eras
    file: assets/ttft-eras.svg
    type: diagram
    title: 'Four decades of showing something sooner'
    alt: 'Diagram: the progression from response-time research to AI streaming as a default'
    description: 'A four-stage progression from response-time thresholds through progressive rendering and optimistic UI to token streaming as the expected shape of an AI interface.'
  - id: miller-thresholds
    file: assets/miller-thresholds.svg
    type: diagram
    title: 'Three thresholds, unchanged since 1968'
    alt: 'Diagram: the three response-time thresholds and what each one governs'
    description: 'A four-stage description of response-time thresholds at 100 milliseconds, one second and ten seconds, and what each means for an AI interface.'
  - id: three-properties
    file: assets/three-properties.svg
    type: diagram
    title: 'Three things the interface owes the user'
    alt: 'Diagram: the three properties of a well-built AI interface'
    description: 'A three-stage description of AI frontend design as a state machine, an exercise in perceived time, and respect for output the user has already read.'
  - id: streaming-tradeoff
    file: assets/streaming-tradeoff.svg
    type: diagram
    title: 'What streaming costs'
    alt: 'Diagram: what streaming provides compared with what it makes harder'
    description: 'A two-column comparison of the benefits streaming provides against the validation and safety problems it introduces.'
  - id: render-loop
    file: assets/render-loop.svg
    type: diagram
    title: 'The five rules of the render loop'
    alt: 'Diagram: the five rules governing a streaming render loop'
    description: 'A five-stage description of the streaming render loop covering entering the waiting state, appending tokens, cancellation, partial retention on error, and enforced terminality.'
  - id: counter-analogy
    file: assets/counter-analogy.svg
    type: diagram
    title: 'Two counters, identical food'
    alt: 'Diagram: an unacknowledged counter order compared with an acknowledged one'
    description: 'A two-column comparison of ordering at a counter without acknowledgement against one where the order is repeated back and items arrive as they are ready.'
  - id: ttft-versus-total
    file: assets/ttft-versus-total.svg
    type: diagram
    title: 'The measured gap'
    alt: 'Diagram: the measured perceived wait of a streaming run compared with a blocking run'
    description: 'A two-column comparison of a streaming and a blocking run of the same answer, showing total duration and the time the user spends with nothing to read.'
  - id: streaming-implications
    file: assets/streaming-implications.svg
    type: diagram
    title: 'Four consequences of streaming'
    alt: 'Diagram: the security, privacy, scalability and cost consequences of streaming'
    description: 'A four-stage description of the consequences of streaming covering incremental escaping, retention of partial output, connection-bound concurrency, and whether cancellation saves money.'
  - id: cancel-versus-timeout
    file: assets/cancel-versus-timeout.svg
    type: diagram
    title: 'Cancellation is not a timeout'
    alt: 'Diagram: user cancellation compared with a system timeout'
    description: 'A two-column comparison distinguishing user-initiated cancellation from a system timeout by cause, meaning and what the interface should show.'
  - id: stream-or-not
    file: assets/stream-or-not.svg
    type: diagram
    title: 'When streaming is right'
    alt: 'Diagram: when to stream output and when to withhold it until complete'
    description: 'A two-column comparison of situations where streaming improves the experience against those where a complete validated response is better.'
