week: 52
learning_promise:
  'Build the state machine behind a streaming AI interface and measure what each decision
  costs the person waiting: an explicit waiting state, incremental delivery, cancellation as its own
  ending rather than an error, and partial text kept when a stream breaks — then show that perceived
  wait is a different quantity from total duration.'
objectives:
  - Model an AI response as a five-state machine and enforce that terminal states are terminal.
  - Measure time to first token and perceived wait, and explain why neither is total duration.
  - Keep partial output when a stream fails, and justify that against discarding it.
  - Treat cancellation as a distinct terminal state rather than an error.
  - Identify where streaming makes output escaping and whole-response validation harder.
