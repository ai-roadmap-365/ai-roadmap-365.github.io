<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each one is testable.">
  <title>The five rules of the render loop</title>
  <style>
    .render-loop-bg   { fill: #f8fafc; }
    .render-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .render-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .render-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .render-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .render-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .render-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .render-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .render-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .render-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .render-loop-stage { opacity: 1; }

    .render-loop-s0 { animation-delay: 0.00s; }
    .render-loop-e0 { animation-delay: 0.00s; }
    .render-loop-s1 { animation-delay: 1.33s; }
    .render-loop-e1 { animation-delay: 1.33s; }
    .render-loop-s2 { animation-delay: 2.67s; }
    .render-loop-e2 { animation-delay: 2.67s; }
    .render-loop-s3 { animation-delay: 4.00s; }
    .render-loop-e3 { animation-delay: 4.00s; }
    .render-loop-s4 { animation-delay: 5.33s; }
    .render-loop-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .render-loop-conn  { animation: render-loop-trace 8s ease-in-out infinite; }
      .render-loop-stage { animation: render-loop-arrive 8s ease-in-out infinite; }
    }
    @keyframes render-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes render-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .render-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .render-loop-stage { animation: render-loop-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes render-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="render-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="render-loop-bg" width="980" height="322"/>
  <text class="render-loop-h1"  x="30" y="40">The five rules of the render loop</text>
  <text class="render-loop-sub" x="30" y="64">Each one is testable.</text>
  <g class="render-loop-stage render-loop-s0">
    <rect class="render-loop-good" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="render-loop-step" x="44" y="142">01</text>
    <text class="render-loop-name" x="70" y="142">Enter waiting immediately</text>
    <text class="render-loop-desc" x="44" y="166">The instant the request</text>
    <text class="render-loop-desc" x="44" y="182">leaves, show that it</text>
    <text class="render-loop-desc" x="44" y="198">left. The cheapest fix</text>
  </g>
  <line class="render-loop-line render-loop-conn render-loop-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#render-loop-tip)"/>
  <g class="render-loop-stage render-loop-s1">
    <rect class="render-loop-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="render-loop-step" x="233" y="142">02</text>
    <text class="render-loop-name" x="259" y="142">Append on every token</text>
    <text class="render-loop-desc" x="233" y="166">Text only grows, and</text>
    <text class="render-loop-desc" x="233" y="182">every frame differs from</text>
    <text class="render-loop-desc" x="233" y="198">the last. Both are</text>
    <text class="render-loop-edge" x="233" y="242">monotonic</text>
  </g>
  <line class="render-loop-line render-loop-conn render-loop-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#render-loop-tip)"/>
  <g class="render-loop-stage render-loop-s2">
    <rect class="render-loop-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="render-loop-step" x="422" y="142">03</text>
    <text class="render-loop-name" x="448" y="142">Cancellation is a state</text>
    <text class="render-loop-desc" x="422" y="166">The user asked it to</text>
    <text class="render-loop-desc" x="422" y="182">stop, not to undo. The</text>
    <text class="render-loop-desc" x="422" y="198">partial text stays.</text>
  </g>
  <line class="render-loop-line render-loop-conn render-loop-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#render-loop-tip)"/>
  <g class="render-loop-stage render-loop-s3">
    <rect class="render-loop-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="render-loop-step" x="611" y="142">04</text>
    <text class="render-loop-name" x="637" y="142">Keep the partial on error</text>
    <text class="render-loop-desc" x="611" y="166">Mark the answer</text>
    <text class="render-loop-desc" x="611" y="182">incomplete rather than</text>
    <text class="render-loop-desc" x="611" y="198">replacing it with a red</text>
  </g>
  <line class="render-loop-line render-loop-conn render-loop-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#render-loop-tip)"/>
  <g class="render-loop-stage render-loop-s4">
    <rect class="render-loop-warn" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="render-loop-step" x="800" y="142">05</text>
    <text class="render-loop-name" x="826" y="142">Terminality is enforced</text>
    <text class="render-loop-desc" x="800" y="166">After done, error or</text>
    <text class="render-loop-desc" x="800" y="182">cancelled: no further</text>
    <text class="render-loop-desc" x="800" y="198">frames, ever.</text>
    <text class="render-loop-edge" x="800" y="242">no late frames</text>
  </g>
  <text class="render-loop-sub" x="30" y="304">The last rule catches the bug that produces text appearing inside a response the user already stopped — a late token from a generator that was never actually told to stop.</text>
</svg>
