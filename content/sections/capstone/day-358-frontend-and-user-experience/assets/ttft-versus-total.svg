<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same 47 characters, two very different waits.">
  <title>The measured gap</title>
  <style>
    .ttft-versus-total-bg   { fill: #f8fafc; }
    .ttft-versus-total-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-versus-total-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-versus-total-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-versus-total-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-versus-total-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ttft-versus-total-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-versus-total-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ttft-versus-total-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ttft-versus-total-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ttft-versus-total-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ttft-versus-total-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ttft-versus-total-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ttft-versus-total-row { opacity: 1; }
    .ttft-versus-total-r0 { animation-delay: 0.00s; }
    .ttft-versus-total-r1 { animation-delay: 0.45s; }
    .ttft-versus-total-r2 { animation-delay: 0.90s; }
    .ttft-versus-total-r3 { animation-delay: 1.35s; }
    .ttft-versus-total-r4 { animation-delay: 1.80s; }
    .ttft-versus-total-row { animation: ttft-versus-total-reveal 7.3s ease-in-out infinite; }
    @keyframes ttft-versus-total-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ttft-versus-total-bg" width="980" height="390"/>
  <text class="ttft-versus-total-h1"  x="30" y="40">The measured gap</text>
  <text class="ttft-versus-total-sub" x="30" y="64">Same 47 characters, two very different waits.</text>
  <rect class="ttft-versus-total-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-versus-total-name" x="46" y="122">Streaming</text>
  <text class="ttft-versus-total-desc" x="46" y="142">12 ticks total.</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r0" x="46" y="182">First token at tick 4</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r1" x="46" y="216">Perceived wait: 4 ticks</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r2" x="46" y="250">Reading starts while writing continues</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r3" x="46" y="284">Cancellation possible from tick 4</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r4" x="46" y="318">47 characters delivered</text>
  <rect class="ttft-versus-total-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ttft-versus-total-name" x="526" y="122">Blocking</text>
  <text class="ttft-versus-total-desc" x="526" y="142">20 ticks total.</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r0" x="526" y="182">First output at tick 12</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r1" x="526" y="216">Perceived wait: 12 ticks</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r2" x="526" y="250">Nothing to read until the end</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r3" x="526" y="284">Nothing to cancel, only to abandon</text>
  <text class="ttft-versus-total-desc ttft-versus-total-row ttft-versus-total-r4" x="526" y="318">The same 47 characters</text>
  <text class="ttft-versus-total-sub" x="30" y="372">Note what the numbers do not say: streaming is not faster per token. The gap is entirely in when the user's first useful moment arrives, which is the only duration they experience.</text>
</svg>
