<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" role="img" aria-label="The Streaming Response State Machine showing transitions from idle through waiting and streaming to done, error or cancelled, with what the user sees in each state">
  <title>The Streaming Response State Machine</title>
  <defs>
    <style>
      .d358a-bg { fill: #f8fafc; }
      .d358a-s { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; }
      .d358a-ok { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d358a-err { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d358a-cancel { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2px; }
      .d358a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d358a-sub { font-family: system-ui, sans-serif; font-size: 13px; fill: #475569; }
      .d358a-h { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .d358a-t { font-family: system-ui, sans-serif; font-size: 10px; fill: #334155; }
      .d358a-flow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d358a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="100%" height="100%" class="d358a-bg"/>
  <text x="40" y="40" class="d358a-title">The Streaming Response State Machine</text>
  <text x="40" y="64" class="d358a-sub">Every quality problem in a slow AI interface is a missing state or a bad transition — not a styling problem.</text>

  <rect x="40" y="150" width="120" height="72" rx="8" class="d358a-s"/>
  <text x="100" y="180" class="d358a-h" text-anchor="middle">IDLE</text>
  <text x="100" y="202" class="d358a-t" text-anchor="middle">nothing asked</text>

  <rect x="205" y="150" width="140" height="72" rx="8" class="d358a-s"/>
  <text x="275" y="176" class="d358a-h" text-anchor="middle">WAITING</text>
  <text x="275" y="196" class="d358a-t" text-anchor="middle">shows a signal —</text>
  <text x="275" y="212" class="d358a-t" text-anchor="middle">an empty screen reads as broken</text>

  <rect x="390" y="150" width="140" height="72" rx="8" class="d358a-s"/>
  <text x="460" y="176" class="d358a-h" text-anchor="middle">STREAMING</text>
  <text x="460" y="196" class="d358a-t" text-anchor="middle">text only grows;</text>
  <text x="460" y="212" class="d358a-t" text-anchor="middle">every frame differs</text>

  <path d="M 160 186 L 199 186" class="d358a-flow" marker-end="url(#d358a-a)"/>
  <path d="M 345 186 L 384 186" class="d358a-flow" marker-end="url(#d358a-a)"/>

  <rect x="620" y="90" width="200" height="60" rx="8" class="d358a-ok"/>
  <text x="720" y="115" class="d358a-h" text-anchor="middle">DONE</text>
  <text x="720" y="135" class="d358a-t" text-anchor="middle">complete answer</text>

  <rect x="620" y="166" width="200" height="60" rx="8" class="d358a-err"/>
  <text x="720" y="191" class="d358a-h" text-anchor="middle">ERROR</text>
  <text x="720" y="211" class="d358a-t" text-anchor="middle">KEEP what arrived, mark incomplete</text>

  <rect x="620" y="242" width="200" height="60" rx="8" class="d358a-cancel"/>
  <text x="720" y="267" class="d358a-h" text-anchor="middle">CANCELLED</text>
  <text x="720" y="287" class="d358a-t" text-anchor="middle">the user stopped it — not a failure</text>

  <path d="M 530 172 L 614 120" class="d358a-flow" marker-end="url(#d358a-a)"/>
  <path d="M 530 190 L 614 196" class="d358a-flow" marker-end="url(#d358a-a)"/>
  <path d="M 530 210 L 614 268" class="d358a-flow" marker-end="url(#d358a-a)"/>

  <text x="40" y="340" class="d358a-h">Three endings, not two — and all three are terminal</text>
  <text x="40" y="364" class="d358a-t">Collapsing CANCELLED into ERROR tells the user something broke when they were the one who stopped it. Collapsing it into</text>
  <text x="40" y="382" class="d358a-t">DONE tells them the answer is complete when it is not.</text>
  <text x="40" y="408" class="d358a-t">Terminal must be ENFORCED, not assumed. A late token that appends after CANCELLED makes a stopped response start</text>
  <text x="40" y="426" class="d358a-t">writing again, which is the bug that most undermines trust in a stop button.</text>
</svg>
