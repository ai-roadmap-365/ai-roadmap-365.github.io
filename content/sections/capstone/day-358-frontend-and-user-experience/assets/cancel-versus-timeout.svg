<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is a decision; the other is a failure.">
  <title>Cancellation is not a timeout</title>
  <style>
    .cancel-versus-timeout-bg   { fill: #f8fafc; }
    .cancel-versus-timeout-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cancel-versus-timeout-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cancel-versus-timeout-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cancel-versus-timeout-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cancel-versus-timeout-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cancel-versus-timeout-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cancel-versus-timeout-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cancel-versus-timeout-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cancel-versus-timeout-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cancel-versus-timeout-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cancel-versus-timeout-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cancel-versus-timeout-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cancel-versus-timeout-row { opacity: 1; }
    .cancel-versus-timeout-r0 { animation-delay: 0.00s; }
    .cancel-versus-timeout-r1 { animation-delay: 0.45s; }
    .cancel-versus-timeout-r2 { animation-delay: 0.90s; }
    .cancel-versus-timeout-r3 { animation-delay: 1.35s; }
    .cancel-versus-timeout-r4 { animation-delay: 1.80s; }
    .cancel-versus-timeout-row { animation: cancel-versus-timeout-reveal 7.3s ease-in-out infinite; }
    @keyframes cancel-versus-timeout-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cancel-versus-timeout-bg" width="980" height="390"/>
  <text class="cancel-versus-timeout-h1"  x="30" y="40">Cancellation is not a timeout</text>
  <text class="cancel-versus-timeout-sub" x="30" y="64">One is a decision; the other is a failure.</text>
  <rect class="cancel-versus-timeout-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cancel-versus-timeout-name" x="46" y="122">Cancellation</text>
  <text class="cancel-versus-timeout-desc" x="46" y="142">The user's decision.</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r0" x="46" y="182">Initiated by the person reading</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r1" x="46" y="216">Nothing went wrong</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r2" x="46" y="250">Keep the partial, mark it stopped</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r3" x="46" y="284">No retry offered — they chose this</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r4" x="46" y="318">Terminal state: cancelled</text>
  <rect class="cancel-versus-timeout-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cancel-versus-timeout-name" x="526" y="122">Timeout</text>
  <text class="cancel-versus-timeout-desc" x="526" y="142">The system giving up.</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r0" x="526" y="182">Initiated by a deadline</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r1" x="526" y="216">Something did go wrong</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r2" x="526" y="250">Keep the partial, mark it failed</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r3" x="526" y="284">Retry is a reasonable offer</text>
  <text class="cancel-versus-timeout-desc cancel-versus-timeout-row cancel-versus-timeout-r4" x="526" y="318">Terminal state: error</text>
  <text class="cancel-versus-timeout-sub" x="30" y="372">Rendering these identically tells the user something broke when in fact they stopped it — a small misinformation that makes an interface feel unreliable for no reason at all.</text>
</svg>
