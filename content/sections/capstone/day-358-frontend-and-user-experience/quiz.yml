questions:
  - question: A streaming run and a blocking run deliver identical text. Why does the streaming one feel
      faster?
    options:
      - Because streaming reduces the total work the model does
      - Because streamed text renders in a lighter font
      - 'Perceived wait is not the same as total duration'
      - Because blocking requests are queued behind other traffic
    answer_index: 2
    explanation: In the measured lab run both deliver 47 characters; the streaming run has a perceived
      wait of 4 ticks against 12. Streaming is not less work, it is an earlier first moment.
  - question: Why should a failed stream keep the text that already arrived?
    options:
      - Because discarding text is technically harder
      - Because keeping it avoids a second request
      - Because partial text is always more accurate than none
      - 'Replacing read text discards work the user relied on'
    answer_index: 3
    explanation: Both runs fail at the same moment. The only difference is whether the interface also
      takes away what the user had. Marking the answer incomplete is the honest option.
  - question: Why must cancellation be a distinct terminal state rather than an error?
    options:
      - 'They stopped it deliberately; neither label is true'
      - Because errors are logged and cancellations are not
      - Because cancellation is always faster than an error
      - Because errors cannot retain partial text
    answer_index: 0
    explanation: Three endings rather than two. Collapsing cancelled into either of the others
      misinforms the user about what actually happened.
  - question: What bug does enforcing terminality prevent?
    options:
      - Duplicate requests being sent when a user clicks twice
      - 'A late token appending after a terminal frame'
      - The waiting state being skipped entirely
      - Memory growth from retaining every frame
    answer_index: 1
    explanation: A stop button that does not stop is the fastest way to lose a user's trust in an
      interface, and it comes from treating terminality as an assumption rather than a rule.
  - question: Why does streaming make output escaping harder to get right?
    options:
      - Because streamed content arrives in a different character encoding
      - Because streaming disables the browser's built-in escaping
      - 'A partial tag can slip past a whole-document sanitiser'
      - It does not; escaping is unaffected by delivery method
    answer_index: 2
    explanation: The same reason applies to safety checks — streaming makes it hard to validate a
      whole response before showing any of it, which is a real trade-off for moderated content.
