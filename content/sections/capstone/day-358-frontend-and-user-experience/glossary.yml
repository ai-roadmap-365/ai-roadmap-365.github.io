terms:
  - term: Time to First Token
    definition: How long a user waits before any output appears. The measurement that correlates with an
      interface feeling fast.
  - term: Perceived Wait
    definition: Time spent with nothing to read. Equal to time to first token when there is one, and the
      whole run when there is not.
  - term: Streaming
    definition: Delivering a response incrementally as it is produced, so the user reads while the model
      writes.
  - term: Terminal State
    definition: An ending a response cannot leave — done, error or cancelled. Must be enforced, or a late
      token can append to a finished response.
  - term: Partial Output
    definition: Text received before a stream failed or was stopped. Keeping it respects reading the user
      has already done.
  - term: Cancellation
    definition: The user deliberately stopping a response. A distinct ending, not a failure.
  - term: Server-Sent Events
    definition: A web standard for one-way server-to-client streaming over HTTP, with automatic
      reconnection. The usual transport for token streaming.
  - term: Optimistic UI
    definition: Rendering a predicted result before confirmation, then reconciling. Distinct from
      streaming, which shows real partial results and needs no reconciliation.
  - term: Progressive Rendering
    definition: Showing something incomplete immediately rather than something complete later. The
      principle streaming inherits from interlaced images and incremental HTML.
  - term: Structured Streaming
    definition: Streaming a machine-readable payload such as JSON, where partial output may be
      meaningless until complete — the main case where blocking is the better choice.
