visuals:
  - id: time-representations-architecture
    file: assets/time-representations-architecture.svg
    type: diagram
    title: 'One instant in five representations, and what each one can answer'
    alt: 'Diagram: one instant drawn in five representations at once — epoch seconds, UTC ISO 8601 text, an aware datetime in Europe/London, an aware datetime in America/New_York, and a naive datetime whose offset is a question mark — with a table of what each can and cannot answer and a warning that two instants an hour apart render as the same London wall clock'
    description: 'A static architecture diagram of one instant — the moment London had already put its clocks back on 25 October 2026 — drawn simultaneously in five representations, with a blue band across the top labelled THE INSTANT and wires running down to five cards. Card one is the epoch count 1792891800, described as seconds since 1970-01-01T00:00:00Z with no zone, no offset and no wall clock anywhere in it. Card two is the UTC ISO 8601 text 2026-10-25T01:30:00Z, described as fixed width and most significant first, so that text order equals chronological order. Card three is the aware datetime in Europe/London, 2026-10-25T01:30:00+00:00 marked GMT and fold equals one, described as a wall clock plus the offset that was in force, so the instant survives. Card four is the aware datetime in America/New_York, 2026-10-24T21:30:00-04:00 marked EDT, noted as a different date and a different day of the week for the same instant. Card five is drawn in amber rather than blue: a naive datetime reading 2026-10-25 01:30:00 with its offset shown as a question mark, described as a wall clock and nothing else, naming no instant at all. Below the cards is a five-row table of what each representation can answer — which of two rows happened first, whether it sorts correctly as plain text with no parsing, whether a person can read it in a log, what time the user own clock showed, and whether it survives a government moving the clocks — with yes in green and no in amber for each of the four representations and a short note on each row. Two panels close the diagram. The first, outlined in red, is the collision on this exact night: epoch 1792888200 renders in London as 2026-10-25 01:30 at plus one hour and epoch 1792891800 renders as 2026-10-25 01:30 at zero, two instants 3600 seconds apart and one wall-clock string, so that dropping the offset makes them the same row and the information is gone at the moment of writing. The second states the rule the whole day reduces to: store the instant, store the zone name too if and only if you will later need the wall clock somebody actually saw, and render local time at the edge on the way out to a human being and nowhere else — because a naive datetime is not a time but a rumour with good formatting.'
  - id: dst-transition-flow
    file: assets/dst-transition-flow.svg
    type: flow-animated
    title: 'The autumn-back hour: two instants, one wall clock, one job firing twice'
    alt: 'Animated diagram: the autumn-back transition of 25 October 2026 in Europe/London hour by hour, with a UTC timeline above and the local wall clock below reading 01:00, 01:30, 01:00, 01:30, 02:00 — the two 01:30 readings marked fold zero and fold one, their epoch seconds shown 3600 apart, and a job scheduled at 01:30 local firing twice from one schedule entry'
    description: 'An animated flow diagram of the night of 25 October 2026 in Europe/London, laid out as four stacked rows and readable in full as a still image. The top row is the UTC axis, drawn as a marching-dashed blue arrow captioned "the ruler that never moves", with five ticks at 00:00Z, 00:30Z, 01:00Z, 01:30Z and 02:00Z, and a red marker at 01:00Z labelled "the clocks go back". The second row drops a dashed line from each tick to a box holding the London wall-clock reading at that instant: 01:00 BST at plus one hour with fold zero, then 01:30 BST at plus one hour marked in red as fold zero and the first one, then 01:00 GMT at zero with fold one, then 01:30 GMT at zero marked in red as fold one and the second, then 02:00 GMT which happens only once. A red line beneath states that the wall clock ran 01:00, 01:30, 01:00, 01:30, 02:00 — it went backwards, and no error was raised anywhere. The third row shows the same two 01:30 readings as epoch seconds, 1792888200 and 1792891800, joined by a green rule labelled exactly 3600 seconds apart, which is where the difference the wall clock hides becomes visible. The fourth row is the schedule entry "run at 01:30, Europe/London": two red badges sit under the two repeated readings, labelled FIRES run one and FIRES run two, annotated charges every card and charges every card again. Two panels close the diagram: the mirror image on 29 March 2026, where the clocks jump from 01:00 to 02:00, the wall clock never reads 01:30, the same entry fires zero times, nothing errors and the partition is simply missing; and the fix, which is to schedule in UTC, because 01:30Z happens exactly once on both nights and on every other night of the year. The animation runs an eight-second cycle: a blue token walks the UTC axis from left to right at constant speed while the axis dashes march, the two repeated wall-clock boxes brighten in turn as the token reaches each of them, and the two FIRES badges swell in turn at the same moments, so the eye sees one schedule entry triggering twice as real time passes once. A prefers-reduced-motion block disables every animation and restores the resting state, in which the axis is a solid arrow, both repeated readings are shaded, both badges are fully opaque and the token sits at 00:00Z — every label, instant, offset and epoch value is present in the still frame.'
