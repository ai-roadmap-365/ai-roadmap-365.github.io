<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Instant or wall clock.">
  <title>Scheduling across places</title>
  <style>
    .meeting-times-bg   { fill: #f8fafc; }
    .meeting-times-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .meeting-times-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .meeting-times-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .meeting-times-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .meeting-times-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .meeting-times-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .meeting-times-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .meeting-times-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .meeting-times-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .meeting-times-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .meeting-times-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .meeting-times-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .meeting-times-row { opacity: 1; }
    .meeting-times-r0 { animation-delay: 0.00s; }
    .meeting-times-r1 { animation-delay: 0.45s; }
    .meeting-times-r2 { animation-delay: 0.90s; }
    .meeting-times-r3 { animation-delay: 1.35s; }
    .meeting-times-r4 { animation-delay: 1.80s; }
    .meeting-times-row { animation: meeting-times-reveal 7.3s ease-in-out infinite; }
    @keyframes meeting-times-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="meeting-times-bg" width="980" height="390"/>
  <text class="meeting-times-h1"  x="30" y="40">Scheduling across places</text>
  <text class="meeting-times-sub" x="30" y="64">Instant or wall clock.</text>
  <rect class="meeting-times-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="meeting-times-name" x="46" y="122">By instant</text>
  <text class="meeting-times-desc" x="46" y="142">Same moment.</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r0" x="46" y="182">'This exact moment'</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r1" x="46" y="216">Everyone converts to their own clock</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r2" x="46" y="250">Correct across zone changes</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r3" x="46" y="284">A call, a deadline, a log entry</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r4" x="46" y="318">This is an instant</text>
  <rect class="meeting-times-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="meeting-times-name" x="526" y="122">By wall clock</text>
  <text class="meeting-times-desc" x="526" y="142">Same reading.</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r0" x="526" y="182">'Nine in the morning, locally'</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r1" x="526" y="216">Different moments in each place</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r2" x="526" y="250">Follows the local rules as they change</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r3" x="526" y="284">An alarm, an opening time</text>
  <text class="meeting-times-desc meeting-times-row meeting-times-r4" x="526" y="318">This is a local time</text>
  <text class="meeting-times-sub" x="30" y="372">Both are legitimate and they are not interchangeable: an alarm should follow the local clock, and a deadline should not move because a government changed the rules.</text>
</svg>
