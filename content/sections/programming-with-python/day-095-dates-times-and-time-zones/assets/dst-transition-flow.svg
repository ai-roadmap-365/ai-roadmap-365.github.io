<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" role="img" aria-labelledby="d095f-title d095f-desc" width="1180" height="780">
  <title id="d095f-title">The autumn-back hour: two instants, one wall clock, one job firing twice</title>
  <desc id="d095f-desc">A timeline of 25 October 2026 in Europe/London, drawn in UTC along the top and in local wall-clock readings below it, showing the wall clock reading 01:30 twice — once at 00:30 UTC with offset plus one hour and fold zero, and once at 01:30 UTC with offset zero and fold one — and a job scheduled at 01:30 local time firing at both, an hour apart, from a single schedule entry.</desc>

  <style>
    .d095f-bg { fill: #f8fafc; }
    .d095f-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d095f-h1 { font-size: 25px; font-weight: 700; }
    .d095f-h2 { font-size: 18px; font-weight: 700; }
    .d095f-lbl { font-size: 15px; font-weight: 700; }
    .d095f-b { font-size: 15px; }
    .d095f-s { font-size: 14px; }
    .d095f-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #1a202c; }
    .d095f-mono-s { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d095f-axis { stroke: #1a202c; stroke-width: 2.5; fill: none; }
    .d095f-tick { stroke: #1a202c; stroke-width: 2; }
    .d095f-drop { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .d095f-box { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d095f-box-hot { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2.5; }
    .d095f-note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .d095f-warn { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
    .d095f-red { fill: #b91c1c; }
    .d095f-green { fill: #047857; }
    .d095f-rule { stroke: #cbd5e1; stroke-width: 1; }

    /* the token walking real time along the UTC axis */
    .d095f-token { animation: d095f-walk 8s linear infinite; }
    @keyframes d095f-walk {
      0%   { transform: translateX(0px) }
      100% { transform: translateX(920px) }
    }

    /* the two repeated readings light up as the token passes each of them */
    .d095f-pulse { animation: d095f-lift 8s ease-in-out infinite; }
    .d095f-p1 { animation-delay: 0s }
    .d095f-p2 { animation-delay: 4s }
    @keyframes d095f-lift {
      0%, 18%, 32%, 100% { fill: #fef2f2 }
      23%, 27%           { fill: #fecaca }
    }

    /* the scheduler badge fires twice per cycle */
    .d095f-fire { animation: d095f-flash 8s ease-in-out infinite; }
    .d095f-f1 { animation-delay: 0s }
    .d095f-f2 { animation-delay: 4s }
    @keyframes d095f-flash {
      0%, 18%, 34%, 100% { opacity: 0.9; r: 13 }
      24%, 28%           { opacity: 1;   r: 18 }
    }

    /* the flowing UTC axis, marched to say "real time never stops" */
    .d095f-flow {
      stroke: #1d4ed8; stroke-width: 3; fill: none;
      stroke-dasharray: 12 8;
      animation: d095f-march 1.8s linear infinite;
    }
    @keyframes d095f-march { to { stroke-dashoffset: -20 } }

    @media (prefers-reduced-motion: reduce) {
      .d095f-token { animation: none; transform: translateX(0px) }
      .d095f-pulse { animation: none; fill: #fef2f2 }
      .d095f-fire  { animation: none; opacity: 1; r: 15 }
      .d095f-flow  { animation: none; stroke-dasharray: none }
    }
  </style>

  <rect class="d095f-bg" x="0" y="0" width="1180" height="780" />

  <text class="d095f-t d095f-h1" x="30" y="42">25 October 2026, Europe/London: the hour that happened twice</text>
  <text class="d095f-t d095f-b" x="30" y="68">Real time runs left to right and never repeats. The wall clock below it does — and one schedule entry, "01:30 local", fires on both.</text>

  <!-- UTC axis -->
  <text class="d095f-t d095f-h2" x="30" y="128">UTC — the ruler that never moves</text>
  <path class="d095f-flow" d="M 140 160 L 1060 160" />
  <path class="d095f-axis" d="M 1060 160 l -12 -6 l 0 12 z" />

  <g>
    <line class="d095f-tick" x1="140" y1="150" x2="140" y2="172" />
    <line class="d095f-tick" x1="370" y1="150" x2="370" y2="172" />
    <line class="d095f-tick" x1="600" y1="150" x2="600" y2="172" />
    <line class="d095f-tick" x1="830" y1="150" x2="830" y2="172" />
    <line class="d095f-tick" x1="1060" y1="150" x2="1060" y2="172" />
    <text class="d095f-mono" x="140" y="196" text-anchor="middle">00:00Z</text>
    <text class="d095f-mono" x="370" y="196" text-anchor="middle">00:30Z</text>
    <text class="d095f-mono" x="600" y="196" text-anchor="middle">01:00Z</text>
    <text class="d095f-mono" x="830" y="196" text-anchor="middle">01:30Z</text>
    <text class="d095f-mono" x="1060" y="196" text-anchor="middle">02:00Z</text>
  </g>

  <!-- travelling token, resting visibly at the first tick -->
  <circle class="d095f-token" cx="140" cy="160" r="9" fill="#1d4ed8" />

  <!-- the transition marker -->
  <line class="d095f-tick" x1="600" y1="140" x2="600" y2="118" stroke="#b91c1c" />
  <text class="d095f-t d095f-lbl d095f-red" x="600" y="110" text-anchor="middle">01:00Z — the clocks go back</text>

  <!-- drop lines to the wall-clock row -->
  <line class="d095f-drop" x1="140" y1="206" x2="140" y2="246" />
  <line class="d095f-drop" x1="370" y1="206" x2="370" y2="246" />
  <line class="d095f-drop" x1="600" y1="206" x2="600" y2="246" />
  <line class="d095f-drop" x1="830" y1="206" x2="830" y2="246" />
  <line class="d095f-drop" x1="1060" y1="206" x2="1060" y2="246" />

  <!-- wall clock row -->
  <text class="d095f-t d095f-h2" x="30" y="272">The London wall clock — what a person in the room saw</text>

  <rect class="d095f-box" x="52" y="288" width="176" height="86" rx="8" />
  <text class="d095f-mono" x="140" y="316" text-anchor="middle">01:00</text>
  <text class="d095f-t d095f-s" x="140" y="338" text-anchor="middle">BST, +01:00</text>
  <text class="d095f-t d095f-s" x="140" y="358" text-anchor="middle">fold = 0</text>

  <rect class="d095f-box-hot d095f-pulse d095f-p1" x="282" y="288" width="176" height="86" rx="8" />
  <text class="d095f-mono" x="370" y="316" text-anchor="middle" font-weight="700">01:30</text>
  <text class="d095f-t d095f-s" x="370" y="338" text-anchor="middle">BST, +01:00</text>
  <text class="d095f-t d095f-s d095f-red" x="370" y="358" text-anchor="middle" font-weight="700">fold = 0  (the first one)</text>

  <rect class="d095f-box" x="512" y="288" width="176" height="86" rx="8" />
  <text class="d095f-mono" x="600" y="316" text-anchor="middle">01:00</text>
  <text class="d095f-t d095f-s" x="600" y="338" text-anchor="middle">GMT, +00:00</text>
  <text class="d095f-t d095f-s" x="600" y="358" text-anchor="middle">fold = 1</text>

  <rect class="d095f-box-hot d095f-pulse d095f-p2" x="742" y="288" width="176" height="86" rx="8" />
  <text class="d095f-mono" x="830" y="316" text-anchor="middle" font-weight="700">01:30</text>
  <text class="d095f-t d095f-s" x="830" y="338" text-anchor="middle">GMT, +00:00</text>
  <text class="d095f-t d095f-s d095f-red" x="830" y="358" text-anchor="middle" font-weight="700">fold = 1  (the second)</text>

  <rect class="d095f-box" x="972" y="288" width="176" height="86" rx="8" />
  <text class="d095f-mono" x="1060" y="316" text-anchor="middle">02:00</text>
  <text class="d095f-t d095f-s" x="1060" y="338" text-anchor="middle">GMT, +00:00</text>
  <text class="d095f-t d095f-s" x="1060" y="358" text-anchor="middle">only once</text>

  <text class="d095f-t d095f-b d095f-red" x="30" y="404">The wall clock ran 01:00, 01:30, 01:00, 01:30, 02:00. It went backwards, and no error was raised anywhere.</text>

  <!-- epoch row -->
  <text class="d095f-t d095f-h2" x="30" y="448">The same two readings, as epoch seconds — where the difference is visible</text>
  <rect class="d095f-note" x="282" y="462" width="176" height="48" rx="6" />
  <text class="d095f-mono-s" x="370" y="492" text-anchor="middle">1792888200</text>
  <rect class="d095f-note" x="742" y="462" width="176" height="48" rx="6" />
  <text class="d095f-mono-s" x="830" y="492" text-anchor="middle">1792891800</text>
  <path class="d095f-axis" d="M 470 486 L 730 486" stroke="#047857" stroke-width="2" />
  <text class="d095f-t d095f-lbl d095f-green" x="600" y="480" text-anchor="middle">exactly 3600 seconds apart</text>

  <!-- scheduler row -->
  <text class="d095f-t d095f-h2" x="30" y="562">The schedule entry: run at 01:30, Europe/London</text>
  <line class="d095f-rule" x1="30" y1="574" x2="1150" y2="574" />

  <circle class="d095f-fire d095f-f1" cx="370" cy="612" r="13" fill="#b91c1c" opacity="0.9" />
  <circle class="d095f-fire d095f-f2" cx="830" cy="612" r="13" fill="#b91c1c" opacity="0.9" />
  <text class="d095f-t d095f-lbl d095f-red" x="370" y="650" text-anchor="middle">FIRES — run 1</text>
  <text class="d095f-t d095f-lbl d095f-red" x="830" y="650" text-anchor="middle">FIRES — run 2</text>
  <text class="d095f-t d095f-s" x="370" y="670" text-anchor="middle">charges every card</text>
  <text class="d095f-t d095f-s" x="830" y="670" text-anchor="middle">charges every card again</text>

  <!-- closing panels -->
  <rect class="d095f-warn" x="30" y="692" width="548" height="72" rx="8" />
  <text class="d095f-t d095f-lbl" x="48" y="718" fill="#b91c1c">The mirror image, 29 March 2026</text>
  <text class="d095f-t d095f-s" x="48" y="740">The clocks jump 01:00 to 02:00, the wall clock never reads 01:30, and the</text>
  <text class="d095f-t d095f-s" x="48" y="758">same entry fires zero times. Nothing errors. The partition is simply missing.</text>

  <rect class="d095f-note" x="600" y="692" width="550" height="72" rx="8" />
  <text class="d095f-t d095f-lbl" x="618" y="718">The fix, and it is one line</text>
  <text class="d095f-t d095f-s" x="618" y="740">Schedule in UTC. 01:30Z happens exactly once on both nights, and on every</text>
  <text class="d095f-t d095f-s" x="618" y="758">other night of the year. That is what "daily at 01:30" always meant.</text>
</svg>
