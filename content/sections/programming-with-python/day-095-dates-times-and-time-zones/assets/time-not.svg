<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things time handling is not</title>
  <style>
    .time-not-bg   { fill: #f8fafc; }
    .time-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-not-row { opacity: 1; }
    .time-not-r0 { animation-delay: 0.00s; }
    .time-not-r1 { animation-delay: 0.45s; }
    .time-not-r2 { animation-delay: 0.90s; }
    .time-not-r3 { animation-delay: 1.35s; }
    .time-not-r4 { animation-delay: 1.80s; }
    .time-not-row { animation: time-not-reveal 7.3s ease-in-out infinite; }
    @keyframes time-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="time-not-bg" width="980" height="390"/>
  <text class="time-not-h1"  x="30" y="40">Four things time handling is not</text>
  <text class="time-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="time-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="time-not-name" x="46" y="122">The misconception</text>
  <text class="time-not-desc" x="46" y="142">Commonly held.</text>
  <text class="time-not-desc time-not-row time-not-r0" x="46" y="182">A day is always the same length</text>
  <text class="time-not-desc time-not-row time-not-r1" x="46" y="216">An offset identifies a time zone</text>
  <text class="time-not-desc time-not-row time-not-r2" x="46" y="250">Every day has twenty-four hours</text>
  <text class="time-not-desc time-not-row time-not-r3" x="46" y="284">Storing local time is fine</text>
  <text class="time-not-desc time-not-row time-not-r4" x="46" y="318">The server's zone is a safe default</text>
  <rect class="time-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="time-not-name" x="526" y="122">What is true</text>
  <text class="time-not-desc" x="526" y="142">Actually.</text>
  <text class="time-not-desc time-not-row time-not-r0" x="526" y="182">Transition days are shorter or longer</text>
  <text class="time-not-desc time-not-row time-not-r1" x="526" y="216">Zones have rules that change</text>
  <text class="time-not-desc time-not-row time-not-r2" x="526" y="250">Two days a year do not</text>
  <text class="time-not-desc time-not-row time-not-r3" x="526" y="284">It is ambiguous twice a year</text>
  <text class="time-not-desc time-not-row time-not-r4" x="526" y="318">It differs by deployment, silently</text>
  <text class="time-not-sub" x="30" y="372">The server's zone being a silent variable is why the same code produces different results in two environments, with nothing in the code to explain it.</text>
</svg>
