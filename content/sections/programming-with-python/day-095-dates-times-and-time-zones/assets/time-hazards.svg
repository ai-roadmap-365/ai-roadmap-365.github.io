<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four hazards.">
  <title>Where time goes wrong</title>
  <style>
    .time-hazards-bg   { fill: #f8fafc; }
    .time-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-hazards-stage { opacity: 1; }

    .time-hazards-s0 { animation-delay: 0.00s; }
    .time-hazards-e0 { animation-delay: 0.00s; }
    .time-hazards-s1 { animation-delay: 1.28s; }
    .time-hazards-e1 { animation-delay: 1.28s; }
    .time-hazards-s2 { animation-delay: 2.56s; }
    .time-hazards-e2 { animation-delay: 2.56s; }
    .time-hazards-s3 { animation-delay: 3.84s; }
    .time-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-hazards-conn  { animation: time-hazards-trace 6.4s ease-in-out infinite; }
      .time-hazards-stage { animation: time-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-hazards-stage { animation: time-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-hazards-bg" width="980" height="322"/>
  <text class="time-hazards-h1"  x="30" y="40">Where time goes wrong</text>
  <text class="time-hazards-sub" x="30" y="64">Four hazards.</text>
  <g class="time-hazards-stage time-hazards-s0">
    <rect class="time-hazards-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-hazards-step" x="44" y="142">01</text>
    <text class="time-hazards-name" x="70" y="142">When clocks go forward, an hour does not exist</text>
    <text class="time-hazards-desc" x="44" y="166">A time in it is invalid.</text>
  </g>
  <line class="time-hazards-line time-hazards-conn time-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-hazards-tip)"/>
  <g class="time-hazards-stage time-hazards-s1">
    <rect class="time-hazards-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-hazards-step" x="280" y="142">02</text>
    <text class="time-hazards-name" x="306" y="142">When they go back, an hour happens twice</text>
    <text class="time-hazards-desc" x="280" y="166">A time in it is ambiguous.</text>
  </g>
  <line class="time-hazards-line time-hazards-conn time-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-hazards-tip)"/>
  <g class="time-hazards-stage time-hazards-s2">
    <rect class="time-hazards-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-hazards-step" x="516" y="142">03</text>
    <text class="time-hazards-name" x="542" y="142">Adding a day is not always adding a fixed span</text>
    <text class="time-hazards-desc" x="516" y="166">On transition days it is not.</text>
  </g>
  <line class="time-hazards-line time-hazards-conn time-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-hazards-tip)"/>
  <g class="time-hazards-stage time-hazards-s3">
    <rect class="time-hazards-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-hazards-step" x="752" y="142">04</text>
    <text class="time-hazards-name" x="778" y="142">And some years have an extra day</text>
    <text class="time-hazards-desc" x="752" y="166">Which breaks fixed-length</text>
    <text class="time-hazards-desc" x="752" y="182">assumptions.</text>
  </g>
  <text class="time-hazards-sub" x="30" y="304">The repeated hour is the more dangerous of the two, since a program can process the same hour of records twice without any error being raised.</text>
</svg>
