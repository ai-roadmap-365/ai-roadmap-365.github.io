<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four of them.">
  <title>The rules that avoid time bugs</title>
  <style>
    .time-rules-bg   { fill: #f8fafc; }
    .time-rules-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-rules-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-rules-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-rules-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-rules-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-rules-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-rules-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-rules-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-rules-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-rules-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-rules-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-rules-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-rules-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-rules-stage { opacity: 1; }

    .time-rules-s0 { animation-delay: 0.00s; }
    .time-rules-e0 { animation-delay: 0.00s; }
    .time-rules-s1 { animation-delay: 1.28s; }
    .time-rules-e1 { animation-delay: 1.28s; }
    .time-rules-s2 { animation-delay: 2.56s; }
    .time-rules-e2 { animation-delay: 2.56s; }
    .time-rules-s3 { animation-delay: 3.84s; }
    .time-rules-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-rules-conn  { animation: time-rules-trace 6.4s ease-in-out infinite; }
      .time-rules-stage { animation: time-rules-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-rules-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-rules-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-rules-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-rules-stage { animation: time-rules-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-rules-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-rules-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-rules-bg" width="980" height="322"/>
  <text class="time-rules-h1"  x="30" y="40">The rules that avoid time bugs</text>
  <text class="time-rules-sub" x="30" y="64">Four of them.</text>
  <g class="time-rules-stage time-rules-s0">
    <rect class="time-rules-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-rules-step" x="44" y="142">01</text>
    <text class="time-rules-name" x="70" y="142">Store instants in a single reference zone</text>
    <text class="time-rules-desc" x="44" y="166">Convert only for display.</text>
  </g>
  <line class="time-rules-line time-rules-conn time-rules-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-rules-tip)"/>
  <g class="time-rules-stage time-rules-s1">
    <rect class="time-rules-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-rules-step" x="280" y="142">02</text>
    <text class="time-rules-name" x="306" y="142">Attach a zone to every value that has one</text>
    <text class="time-rules-desc" x="280" y="166">Never rely on the machine's</text>
    <text class="time-rules-desc" x="280" y="182">default.</text>
  </g>
  <line class="time-rules-line time-rules-conn time-rules-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-rules-tip)"/>
  <g class="time-rules-stage time-rules-s2">
    <rect class="time-rules-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-rules-step" x="516" y="142">03</text>
    <text class="time-rules-name" x="542" y="142">Use zone names, not fixed offsets</text>
    <text class="time-rules-desc" x="516" y="166">Offsets change twice a year.</text>
  </g>
  <line class="time-rules-line time-rules-conn time-rules-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-rules-tip)"/>
  <g class="time-rules-stage time-rules-s3">
    <rect class="time-rules-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-rules-step" x="752" y="142">04</text>
    <text class="time-rules-name" x="778" y="142">And keep the zone database updated</text>
    <text class="time-rules-desc" x="752" y="166">Because governments change the</text>
    <text class="time-rules-desc" x="752" y="182">rules.</text>
  </g>
  <text class="time-rules-sub" x="30" y="304">Zone names rather than fixed offsets is the rule that catches people out, because an offset that is correct in January is wrong in July for most of the world.</text>
</svg>
