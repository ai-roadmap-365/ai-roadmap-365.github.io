questions:
  - question: 'Your code calls `requests.get(url, timeout=(3.05, 10.0))` and the server replies with status 500. What happened in Python?'
    options:
      - '`requests.exceptions.HTTPError` was raised at the call site'
      - 'The call returned a Response object normally; no exception was raised'
      - '`requests.exceptions.ConnectionError` was raised, because 5xx means the server is unreachable'
      - 'The call returned `None`, which is why 5xx handling needs a null check'
    answer_index: 1
    explanation: 'This is the distinction the whole lesson turns on. A 500 means the conversation succeeded perfectly and the news is bad: DNS resolved, the connection opened, your request was delivered, and a complete, well-formed response came back. `requests` returns it. Nothing raises unless you call `raise_for_status()` yourself, and `bool(response)` being False for 4xx and 5xx is the only hint you get for free. Contrast that with a `ConnectionError` or a `Timeout`, where no response exists at all — different situations needing different handling, because one is usually worth retrying and a 400 never is.'

  - question: 'A call has `timeout=10` and takes 45 seconds without raising. How?'
    options:
      - 'The timeout applies only to the connection phase, never to reading'
      - 'Redirects reset the timer, so each hop gets its own 10 seconds'
      - 'The read timeout limits the gap between bytes, not the total'
      - 'A timeout below 30 seconds is silently raised to the operating system minimum'
    answer_index: 2
    explanation: 'A single number applies to both phases, so the connect phase was covered too — but the read timeout is a per-gap limit, not a deadline for the whole call. A server that dribbles one byte every nine seconds keeps a ten-second read timeout satisfied indefinitely, which is exactly how a slow-loris style response ties up a client. If you need a bound on total elapsed time you must enforce it yourself, and the extension challenge has you build a server that demonstrates the problem.'

  - question: 'After a timeout on a POST that creates an order, why is retrying risky?'
    options:
      - 'POST bodies cannot be re-sent once the socket has closed'
      - 'requests refuses to retry a POST, so the retry silently does nothing'
      - 'Servers reject a repeated POST with 409 by specification'
      - 'The first attempt may have succeeded and only the reply was lost'
    answer_index: 3
    explanation: 'A timeout tells you nothing about whether the server did the work — it tells you only that you stopped waiting. POST is neither safe nor idempotent, so a duplicate is a real second effect. GET, PUT and DELETE are idempotent: repeating them leaves the same state, which is why a client, a proxy or a browser prefetcher can repeat them freely. The industry fix for POST is an idempotency key: a unique value you generate and send in a header so the server can recognise a repeat and return the original result. Most payment APIs require one, and this is why.'

  - question: 'A station name is the literal string `ALPHA ONE&station=BRAVO`. You build the URL with an f-string instead of `params=`. What does the server receive?'
    options:
      - 'Two parameters — the unencoded ampersand acted as a delimiter'
      - 'A 400, because the URL is syntactically invalid'
      - 'Nothing — requests refuses to send a URL containing a raw space'
      - 'One parameter whose value is the whole string, because the client escapes it automatically'
    answer_index: 0
    explanation: 'This is captured output from the lab, not a hypothetical: the f-string produced `?station=ALPHA%20ONE&station=BRAVO` and the server parsed `{"station": ["ALPHA ONE", "BRAVO"]}`. The space was encoded because requests tidies the URL, but the ampersand inside the value was not, so it acted as a separator and smuggled in a parameter you never meant to send. `params={"station": value}` percent-encodes the ampersand as `%26` and the equals as `%3D`, and the server receives one value. When the value comes from user input, the f-string version is an injection vulnerability rather than merely a wrong answer.'

  - question: 'Which set is worth retrying?'
    options:
      - '400, 401, 403, 404 — client errors are usually transient'
      - '429, 500, 502, 503, 504, plus transport failures'
      - 'Every 4xx and 5xx, since both indicate failure'
      - 'Only 5xx; a 4xx of any kind is always permanent'
    answer_index: 1
    explanation: 'The rule is about whether asking again could plausibly produce a different answer. A 500, 502, 503 or 504 says something on their side failed or was overloaded, which may well be over in two seconds. A transport failure — ConnectionError, Timeout — means no response existed at all, and is the classic transient case. 429 is the one member of the 4xx family on the list, because it explicitly means "not now" rather than "not ever", and it usually carries a Retry-After telling you exactly how long. Everything else in 4xx — 400, 401, 403, 404, 409, 422 — will give the identical answer on the tenth attempt, so retrying is pure noise in somebody else''s log.'

  - question: 'Why does a backoff schedule multiply each wait by a random factor?'
    options:
      - 'To make the retry timing harder for a rate limiter to fingerprint'
      - 'Because time.sleep is imprecise, so the randomness corrects for drift'
      - 'To spread out clients that all failed at the same moment'
      - 'To ensure each retry lands on a different connection in the pool'
    answer_index: 2
    explanation: 'Jitter is a load-shaping device, not an obfuscation one. Picture a thousand clients that all saw the same outage: without jitter they all retry at 0.5s, then 1s, then 2s, in lockstep, and the server that was just coming back up is knocked over again by the thundering herd. Randomising each wait between half and all of the computed delay turns a spike into a trickle. It matters most at exactly the moment things are already going badly, which is why it is easy to omit in testing with one client and expensive to omit in production with a thousand.'

  - question: 'Five requests to the same host through one `requests.Session`, versus five calls to `requests.get`. What did the lab''s server count?'
    options:
      - '5 versus 1; a Session opens a fresh connection per request for isolation'
      - '5 versus 5 — pooling only helps across threads'
      - '1 versus 1; requests pools globally either way'
      - '1 TCP connection versus 5'
    answer_index: 3
    explanation: 'Captured from the server''s own accept counter: `5 calls, one Session : 1 TCP connection(s)` and `5 calls, requests.get() : 5 TCP connection(s)`. The module-level functions create and discard a Session per call, so the pool is thrown away every time. Over loopback the saving is small; against a host 100 ms away it is one round trip per request saved on plain HTTP and two or three on HTTPS, which is usually most of the elapsed time. A Session is a connection pool first and a header bag second.'

  - question: 'Your `fetch_readings` takes `session` as a keyword-only parameter. What does that buy, and what can those tests NOT prove?'
    options:
      - 'Tests with a fake session, not proof your model is right'
      - 'It buys type safety; it cannot prove anything about behaviour at run time'
      - 'It buys faster requests through connection reuse; it cannot prove the retry policy'
      - 'It buys nothing testing-wise — patching `requests.get` gives exactly the same result'
    answer_index: 0
    explanation: 'This is Day 74 applied to the network. A forty-line FakeSession lets you script a 429, a 503, a ConnectionError or a malformed body on demand, record every URL, param and timeout, and run twenty tests in forty milliseconds with no socket — the lab proves it by copying three files into an empty directory with no server module and running them there. What a fake cannot do is check that your beliefs about the real server are right: if you assumed the readings live under a "readings" key and they do not, the fake agrees with you happily. That is what the server-backed tests are for. Keep both. Patching is not equivalent: it needs an unchecked target string and yields a mock that accepts any misspelled attribute.'
