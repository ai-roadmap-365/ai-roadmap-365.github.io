<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the workload.">
  <title>Which client pattern when</title>
  <style>
    .http-when-bg   { fill: #f8fafc; }
    .http-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .http-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .http-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .http-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .http-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .http-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .http-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .http-when-row { opacity: 1; }
    .http-when-r0 { animation-delay: 0.00s; }
    .http-when-r1 { animation-delay: 0.45s; }
    .http-when-r2 { animation-delay: 0.90s; }
    .http-when-r3 { animation-delay: 1.35s; }
    .http-when-r4 { animation-delay: 1.80s; }
    .http-when-row { animation: http-when-reveal 7.3s ease-in-out infinite; }
    @keyframes http-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="http-when-bg" width="980" height="390"/>
  <text class="http-when-h1"  x="30" y="40">Which client pattern when</text>
  <text class="http-when-sub" x="30" y="64">By the workload.</text>
  <rect class="http-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="http-when-name" x="46" y="122">The workload</text>
  <text class="http-when-desc" x="46" y="142">What you are doing.</text>
  <text class="http-when-desc http-when-row http-when-r0" x="46" y="182">A single occasional call</text>
  <text class="http-when-desc http-when-row http-when-r1" x="46" y="216">Many calls to one service</text>
  <text class="http-when-desc http-when-row http-when-r2" x="46" y="250">Hundreds of concurrent calls</text>
  <text class="http-when-desc http-when-row http-when-r3" x="46" y="284">A long-running download</text>
  <text class="http-when-desc http-when-row http-when-r4" x="46" y="318">Calls to a metered API</text>
  <rect class="http-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="http-when-name" x="526" y="122">The pattern</text>
  <text class="http-when-desc" x="526" y="142">What to use.</text>
  <text class="http-when-desc http-when-row http-when-r0" x="526" y="182">A plain request, with a timeout</text>
  <text class="http-when-desc http-when-row http-when-r1" x="526" y="216">A session, reused</text>
  <text class="http-when-desc http-when-row http-when-r2" x="526" y="250">An async client with bounded concurrency</text>
  <text class="http-when-desc http-when-row http-when-r3" x="526" y="284">Streaming, rather than loading it whole</text>
  <text class="http-when-desc http-when-row http-when-r4" x="526" y="318">Retries with backoff, and a spend cap</text>
  <text class="http-when-sub" x="30" y="372">Bounded concurrency in the third row matters as much as the concurrency itself, since an unbounded parallel loop is how a client gets itself rate limited.</text>
</svg>
