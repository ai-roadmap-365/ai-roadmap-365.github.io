<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you should do.">
  <title>Reading status codes</title>
  <style>
    .status-codes-bg   { fill: #f8fafc; }
    .status-codes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .status-codes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .status-codes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .status-codes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .status-codes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .status-codes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .status-codes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .status-codes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .status-codes-row { opacity: 1; }
    .status-codes-r0 { animation-delay: 0.00s; }
    .status-codes-r1 { animation-delay: 0.45s; }
    .status-codes-r2 { animation-delay: 0.90s; }
    .status-codes-r3 { animation-delay: 1.35s; }
    .status-codes-r4 { animation-delay: 1.80s; }
    .status-codes-row { animation: status-codes-reveal 7.3s ease-in-out infinite; }
    @keyframes status-codes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="status-codes-bg" width="980" height="390"/>
  <text class="status-codes-h1"  x="30" y="40">Reading status codes</text>
  <text class="status-codes-sub" x="30" y="64">By what you should do.</text>
  <rect class="status-codes-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="status-codes-name" x="46" y="122">The class</text>
  <text class="status-codes-desc" x="46" y="142">What it says.</text>
  <text class="status-codes-desc status-codes-row status-codes-r0" x="46" y="182">Two hundreds — it worked</text>
  <text class="status-codes-desc status-codes-row status-codes-r1" x="46" y="216">Three hundreds — it moved</text>
  <text class="status-codes-desc status-codes-row status-codes-r2" x="46" y="250">Four hundreds — your request was wrong</text>
  <text class="status-codes-desc status-codes-row status-codes-r3" x="46" y="284">Five hundreds — their server failed</text>
  <text class="status-codes-desc status-codes-row status-codes-r4" x="46" y="318">Four twenty-nine — you are being rate limited</text>
  <rect class="status-codes-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="status-codes-name" x="526" y="122">What to do</text>
  <text class="status-codes-desc" x="526" y="142">The response.</text>
  <text class="status-codes-desc status-codes-row status-codes-r0" x="526" y="182">Proceed</text>
  <text class="status-codes-desc status-codes-row status-codes-r1" x="526" y="216">Follow it, usually automatically</text>
  <text class="status-codes-desc status-codes-row status-codes-r2" x="526" y="250">Fix the request; never retry blindly</text>
  <text class="status-codes-desc status-codes-row status-codes-r3" x="526" y="284">Retry with backoff</text>
  <text class="status-codes-desc status-codes-row status-codes-r4" x="526" y="318">Wait as instructed, then retry</text>
  <text class="status-codes-sub" x="30" y="372">Never retrying a four-hundred error is the rule that separates a sensible client from one that hammers a service with a request that can never succeed.</text>
</svg>
