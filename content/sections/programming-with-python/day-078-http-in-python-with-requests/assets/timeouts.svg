<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Timeouts, retries and backoff</title>
  <style>
    .timeouts-bg   { fill: #f8fafc; }
    .timeouts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeouts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeouts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeouts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeouts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .timeouts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .timeouts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .timeouts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .timeouts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .timeouts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .timeouts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .timeouts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .timeouts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .timeouts-stage { opacity: 1; }

    .timeouts-s0 { animation-delay: 0.00s; }
    .timeouts-e0 { animation-delay: 0.00s; }
    .timeouts-s1 { animation-delay: 1.28s; }
    .timeouts-e1 { animation-delay: 1.28s; }
    .timeouts-s2 { animation-delay: 2.56s; }
    .timeouts-e2 { animation-delay: 2.56s; }
    .timeouts-s3 { animation-delay: 3.84s; }
    .timeouts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .timeouts-conn  { animation: timeouts-trace 6.4s ease-in-out infinite; }
      .timeouts-stage { animation: timeouts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes timeouts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes timeouts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .timeouts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .timeouts-stage { animation: timeouts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes timeouts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="timeouts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="timeouts-bg" width="980" height="322"/>
  <text class="timeouts-h1"  x="30" y="40">Timeouts, retries and backoff</text>
  <text class="timeouts-sub" x="30" y="64">Four rules.</text>
  <g class="timeouts-stage timeouts-s0">
    <rect class="timeouts-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="timeouts-step" x="44" y="142">01</text>
    <text class="timeouts-name" x="70" y="142">Always set a timeout</text>
    <text class="timeouts-desc" x="44" y="166">There is no default; a call can</text>
    <text class="timeouts-desc" x="44" y="182">hang forever.</text>
  </g>
  <line class="timeouts-line timeouts-conn timeouts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#timeouts-tip)"/>
  <g class="timeouts-stage timeouts-s1">
    <rect class="timeouts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="timeouts-step" x="280" y="142">02</text>
    <text class="timeouts-name" x="306" y="142">Retry only transient failures</text>
    <text class="timeouts-desc" x="280" y="166">Timeouts, rate limits, server</text>
    <text class="timeouts-desc" x="280" y="182">errors.</text>
  </g>
  <line class="timeouts-line timeouts-conn timeouts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#timeouts-tip)"/>
  <g class="timeouts-stage timeouts-s2">
    <rect class="timeouts-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="timeouts-step" x="516" y="142">03</text>
    <text class="timeouts-name" x="542" y="142">Waiting longer after each attempt, with jitter</text>
    <text class="timeouts-desc" x="516" y="166">Or every client retries in</text>
    <text class="timeouts-desc" x="516" y="182">unison.</text>
  </g>
  <line class="timeouts-line timeouts-conn timeouts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#timeouts-tip)"/>
  <g class="timeouts-stage timeouts-s3">
    <rect class="timeouts-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="timeouts-step" x="752" y="142">04</text>
    <text class="timeouts-name" x="778" y="142">And bound the attempts</text>
    <text class="timeouts-desc" x="752" y="166">Then fail with the underlying</text>
    <text class="timeouts-desc" x="752" y="182">error.</text>
  </g>
  <text class="timeouts-sub" x="30" y="304">No default timeout is the detail that catches people: a hung call holds a thread or a process indefinitely, and nothing reports it.</text>
</svg>
