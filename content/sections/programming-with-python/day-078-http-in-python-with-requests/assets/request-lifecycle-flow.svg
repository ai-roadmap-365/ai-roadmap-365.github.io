<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" role="img" aria-labelledby="flowTitle flowDesc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="flowTitle">One request, step by step, with the retry branch and the do-not-retry branch</title>
  <desc id="flowDesc">A vertical flow from building the URL and parameters, through connecting, sending, waiting, receiving, checking the status, and decoding, to either a returned value or a raised error — with an explicit retry branch for 429 and 5xx and an explicit do-not-retry branch for 4xx.</desc>

  <rect x="0" y="0" width="1180" height="1120" fill="#f8fafc"/>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
    <marker id="fc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#166534"/>
    </marker>
  </defs>

  <text x="590" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">The life of one call to session.get</text>
  <text x="590" y="62" text-anchor="middle" font-size="15" fill="#475569">Ten steps, two branches, and exactly two ways to leave</text>

  <!-- 1 -->
  <rect x="360" y="90" width="460" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="115" font-size="15" font-weight="700" fill="#1d4ed8">1 · Build the URL and the parameters</text>
  <text x="376" y="137" font-size="14" fill="#1a202c">params={"station": s} — requests percent-encodes the value</text>
  <line x1="590" y1="156" x2="590" y2="176" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <!-- 2 -->
  <rect x="360" y="180" width="460" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="205" font-size="15" font-weight="700" fill="#1d4ed8">2 · Resolve the name, open a connection</text>
  <text x="376" y="227" font-size="14" fill="#1a202c">DNS, TCP, TLS — or reuse one the Session already has open</text>
  <line x1="590" y1="246" x2="590" y2="266" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>
  <text x="836" y="217" font-size="13" fill="#b45309">connect timeout applies here</text>

  <!-- 3 -->
  <rect x="360" y="270" width="460" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="295" font-size="15" font-weight="700" fill="#1d4ed8">3 · Send the request</text>
  <text x="376" y="317" font-size="14" fill="#1a202c">request line, headers, blank line, body if there is one</text>
  <line x1="590" y1="336" x2="590" y2="356" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <!-- 4 -->
  <rect x="360" y="360" width="460" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="385" font-size="15" font-weight="700" fill="#1d4ed8">4 · Wait for bytes to come back</text>
  <text x="376" y="407" font-size="14" fill="#1a202c">the read timeout is the gap between bytes, not a total deadline</text>
  <text x="836" y="397" font-size="13" fill="#b45309">read timeout applies here</text>

  <!-- transport failure branch -->
  <line x1="360" y1="393" x2="290" y2="393" stroke="#b45309" stroke-width="2" marker-end="url(#fb)"/>
  <rect x="30" y="356" width="250" height="112" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="46" y="380" font-size="15" font-weight="700" fill="#b45309">No response at all</text>
  <text x="46" y="402" font-size="13" fill="#1a202c">ConnectionError · Timeout</text>
  <text x="46" y="422" font-size="13" fill="#1a202c">TooManyRedirects · SSLError</text>
  <text x="46" y="442" font-size="13" fill="#475569">all subclass RequestException</text>
  <text x="46" y="460" font-size="13" fill="#166534">RETRYABLE — go to step 8</text>

  <line x1="590" y1="426" x2="590" y2="446" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <!-- 5 -->
  <rect x="360" y="450" width="460" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="475" font-size="15" font-weight="700" fill="#1d4ed8">5 · Receive the status line and the headers</text>
  <text x="376" y="497" font-size="14" fill="#1a202c">a response exists now — the call has SUCCEEDED at this layer</text>
  <line x1="590" y1="516" x2="590" y2="540" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <!-- 6 decision -->
  <polygon points="590,540 880,610 590,680 300,610" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="590" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">6 · Which status code?</text>
  <text x="590" y="624" text-anchor="middle" font-size="14" fill="#475569">the only place this decision can be made</text>

  <!-- branch left: 4xx do not retry -->
  <line x1="300" y1="610" x2="200" y2="610" stroke="#b45309" stroke-width="2" marker-end="url(#fb)"/>
  <text x="204" y="600" font-size="13" font-weight="700" fill="#b45309">4xx (not 429)</text>
  <rect x="30" y="640" width="250" height="150" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="46" y="665" font-size="15" font-weight="700" fill="#b45309">DO NOT RETRY</text>
  <text x="46" y="688" font-size="13" fill="#1a202c">400 malformed · 401 not signed in</text>
  <text x="46" y="708" font-size="13" fill="#1a202c">403 signed in, not allowed</text>
  <text x="46" y="728" font-size="13" fill="#1a202c">404 no such thing · 409 conflict</text>
  <text x="46" y="748" font-size="13" fill="#1a202c">422 shape fine, values wrong</text>
  <text x="46" y="772" font-size="13" fill="#475569">Asking again gets the same answer.</text>
  <line x1="155" y1="790" x2="155" y2="900" stroke="#b45309" stroke-width="2" marker-end="url(#fb)"/>

  <!-- branch right: 429/5xx retry -->
  <line x1="880" y1="610" x2="960" y2="610" stroke="#166534" stroke-width="2" marker-end="url(#fc)"/>
  <text x="884" y="600" font-size="13" font-weight="700" fill="#166534">429 or 5xx</text>
  <rect x="900" y="640" width="260" height="150" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="916" y="665" font-size="15" font-weight="700" fill="#166534">RETRY — step 8</text>
  <text x="916" y="688" font-size="13" fill="#1a202c">429 too many requests</text>
  <text x="916" y="708" font-size="13" fill="#1a202c">500 · 502 · 503 · 504</text>
  <text x="916" y="730" font-size="13" fill="#475569">wait 0.5, 1, 2, 4, 8 — capped</text>
  <text x="916" y="750" font-size="13" fill="#475569">× jitter of 0.5 to 1.0</text>
  <text x="916" y="772" font-size="13" fill="#1a202c">honour Retry-After if sent</text>
  <line x1="1030" y1="790" x2="1030" y2="830" stroke="#166534" stroke-width="2" marker-end="url(#fc)"/>
  <rect x="900" y="834" width="260" height="60" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="916" y="857" font-size="14" font-weight="700" fill="#166534">8 · Attempts left?</text>
  <text x="916" y="878" font-size="13" fill="#475569">yes → sleep, then back to step 2</text>
  <path d="M900,864 L860,864 L860,110 L826,110" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fc)"/>
  <text x="866" y="140" font-size="13" font-weight="700" fill="#166534">retry loop</text>
  <line x1="1030" y1="894" x2="1030" y2="928" stroke="#166534" stroke-width="2" marker-end="url(#fc)"/>
  <text x="1044" y="915" font-size="13" fill="#475569">no attempts left</text>

  <!-- centre: 2xx / 3xx -->
  <line x1="590" y1="680" x2="590" y2="704" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>
  <text x="600" y="700" font-size="13" font-weight="700" fill="#1d4ed8">2xx / 3xx</text>
  <rect x="360" y="708" width="460" height="76" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="732" font-size="15" font-weight="700" fill="#1d4ed8">7 · Decode the body</text>
  <text x="376" y="754" font-size="14" fill="#1a202c">.content is bytes · .text is str · .json() parses</text>
  <text x="376" y="774" font-size="13" fill="#475569">a 3xx was already followed unless allow_redirects=False</text>
  <line x1="590" y1="784" x2="590" y2="808" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="360" y="812" width="460" height="76" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="376" y="836" font-size="15" font-weight="700" fill="#1d4ed8">9 · Or stream it, if it is large</text>
  <text x="376" y="858" font-size="14" fill="#1a202c">stream=True, then iter_content(chunk_size=8192)</text>
  <text x="376" y="878" font-size="13" fill="#475569">one chunk in memory at a time, never the whole body</text>
  <line x1="590" y1="888" x2="590" y2="928" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fa)"/>

  <!-- exits -->
  <rect x="360" y="932" width="460" height="76" rx="8" fill="#ffffff" stroke="#166534" stroke-width="3"/>
  <text x="590" y="958" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">10a · RETURN a value</text>
  <text x="590" y="982" text-anchor="middle" font-size="14" fill="#1a202c">a list of objects your own code defined —</text>
  <text x="590" y="1000" text-anchor="middle" font-size="14" fill="#1a202c">not a Response, which would leak HTTP upward</text>

  <rect x="30" y="904" width="250" height="104" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="155" y="930" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">10b · RAISE</text>
  <text x="46" y="954" font-size="13" fill="#1a202c">your own exception type,</text>
  <text x="46" y="974" font-size="13" fill="#1a202c">with a sentence a human</text>
  <text x="46" y="994" font-size="13" fill="#1a202c">can act on — no traceback</text>

  <rect x="900" y="932" width="260" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <text x="1030" y="958" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">10c · GIVE UP</text>
  <text x="916" y="980" font-size="13" fill="#1a202c">raise, naming the attempt</text>
  <text x="916" y="998" font-size="13" fill="#1a202c">count and the last failure</text>

  <!-- footnote -->
  <rect x="30" y="1030" width="1130" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="46" y="1055" font-size="15" font-weight="700" fill="#1d4ed8">The reason every step above is testable</text>
  <text x="46" y="1080" font-size="14" fill="#1a202c">The session, the sleep and the jitter all arrive as parameters. Swap in a fake and every branch on this page can be exercised in microseconds, with no server.</text>
</svg>
