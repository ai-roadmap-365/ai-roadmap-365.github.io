id: D078
day: 78
slug: http-in-python-with-requests
title: 'HTTP in Python with requests'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to read an HTTP request and response as the plain bytes they are; name what a method promises and why a proxy or a retry loop depends on that promise; recognise the status codes that matter individually and say which of them are worth retrying; build a query string with params= rather than string concatenation, and explain what an unencoded ampersand does to a request; use requests properly — Session, timeout, .text versus .content versus .json(), raise_for_status, streaming; implement retry with exponential backoff and jitter that honours Retry-After; tell a network-level exception apart from a perfectly successful response carrying a 500; and write every networked function so it takes its session as a parameter, which is what lets you test the whole client with a fake and no server at all.'
objectives:
  - 'Trace what actually happens when one machine asks another for something — DNS, the TCP handshake, the TLS handshake, the request, the wait, the response — and say which phase each half of a timeout tuple governs'
  - 'Read the anatomy of a request and a response from real captured bytes: request line, headers, blank line, body; status line, headers, blank line, body'
  - 'State what each HTTP method promises about safety and idempotence, explain why a timed-out POST is dangerous to retry when a GET is not, and describe what an idempotency key is for'
  - 'Classify status codes by family and name the individually important ones — 200, 201, 204, 301 versus 302, 304, 400, 401 versus 403, 404, 409, 422, 429, 500, 502, 503, 504 — with the correct client response to each'
  - 'Use Content-Type, Accept, User-Agent and Authorization correctly, and pass query parameters with params= so that values containing spaces and ampersands are percent-encoded rather than silently changing the meaning of the request'
  - 'Apply the operational rules that separate a script from something you can leave running: always set a timeout, use a Session for connection reuse and shared headers, retry only 429 and 5xx with exponential backoff and jitter, stream large bodies instead of loading them, and read credentials from the environment'
  - 'Distinguish a network-level exception, where no response arrived, from a successful response carrying a failure status, and handle both — including turning a 404 into one sentence a human can act on rather than a traceback'
  - 'Compare requests, urllib.request, http.client and httpx on what each does for you and what each costs, having seen all four run against the same server'
  - 'Apply Day 74''s boundary argument to the network: a function that takes a session parameter can be tested with a hand-written fake and no server at all, while one that calls requests.get directly cannot'
prerequisites:
  - 'Day 74: boundaries, test doubles, and the argument that you inject a boundary rather than patch it — the backbone of this lesson'
  - 'Days 71 to 73: pytest, fixtures, pytest.raises and parametrization'
  - 'Day 66: exception hierarchies and raising your own exception types on purpose'
  - 'Day 65: reading and writing JSON'
  - 'Day 69: dataclasses and type hints'
  - 'Day 43: creating a virtual environment with python3 -m venv'
  - 'Days 1 to 40: addresses, ports, TCP, and what a network layer is'
