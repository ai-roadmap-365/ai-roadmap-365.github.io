terms:
  - term: 'HTTP'
    definition: 'The HyperText Transfer Protocol: a set of rules for one machine to ask another for something and get an answer. Invented by Tim Berners-Lee at CERN around 1989-1991, and remarkable for being plain text — a request is a line, some headers, a blank line, and optionally a body, all of which you can type by hand. Its meaning is defined today by RFC 9110, deliberately separated from the wire formats of HTTP/1.1, HTTP/2 and HTTP/3 so that a GET is a GET on all three.'
  - term: 'Request'
    definition: 'The message a client sends: a request line naming the method, path and version; then headers; then a blank line; then a body if the method has one. The blank line is not decoration — it is the delimiter that tells the server the headers have finished.'
  - term: 'Response'
    definition: 'The message a server sends back: a status line with the version, the three-digit status code and a human-readable reason phrase; then headers; then a blank line; then the body. Never parse the reason phrase — servers may write anything there. Parse the code.'
  - term: 'Status code'
    definition: 'The three-digit machine-readable verdict on a request. The first digit gives the family: 1xx informational, 2xx it worked, 3xx look elsewhere, 4xx you were wrong, 5xx they were wrong. A response arriving at all is a success at the transport layer, which is why a 500 raises no exception in requests.'
  - term: 'Header'
    definition: 'A name-colon-value line carrying metadata about a request or response. The ones worth memorising: Content-Type (what the body is), Accept (what you would like back), User-Agent (who you are), Authorization (your credentials), Content-Length (how many bytes the body is) and Retry-After (how long to wait). Names are case-insensitive and order is not significant.'
  - term: 'Query string'
    definition: 'The part of a URL after the question mark, carrying parameters as name=value pairs separated by ampersands. Because those characters are delimiters, any that appear inside a value must be percent-encoded — which is why you pass params= and let the library encode, rather than building the string with an f-string and silently changing what you asked for.'
  - term: 'Idempotence'
    definition: 'The property that doing something twice has the same effect on the server as doing it once. GET, HEAD, PUT and DELETE are idempotent; POST is not, and PATCH need not be. This is the property that makes retrying a timed-out request safe or dangerous, and it is why an idempotency key exists: a unique value you send so the server can recognise a repeat and return the original result instead of doing the work again.'
  - term: 'Safe method'
    definition: 'A method that is not supposed to change anything — a read. GET and HEAD are safe. Safety is what lets a proxy cache a response and a browser prefetch a link without asking anyone''s permission.'
  - term: 'Timeout'
    definition: 'The limit on how long a client will wait. In requests it is two numbers: a connect timeout covering DNS, TCP and TLS, and a read timeout covering the gap between bytes arriving — not the total duration of the call. There is no default at all, so a call with no timeout= against a socket that never answers waits for as long as the operating system allows, which can be hours.'
  - term: 'Retry'
    definition: 'Asking again after a failure that might not repeat. Worth doing for 429, 500, 502, 503 and 504, and for transport failures where no response arrived. Never worth doing for 400, 401, 403, 404, 409 or 422, because the answer will not change. A retry against a metered API is a second charge, which is a further reason to be strict about which statuses qualify.'
  - term: 'Exponential backoff'
    definition: 'Doubling the wait between successive retries — 0.5s, 1s, 2s, 4s, 8s — usually with a cap, so that a client which is failing repeatedly asks progressively less often instead of hammering. The alternative, a fixed short delay, is indistinguishable from an attack when a service is already struggling.'
  - term: 'Jitter'
    definition: 'A random factor applied to each backoff delay, so clients that failed simultaneously do not retry simultaneously. Without it, a thousand clients that saw one outage all return at exactly 0.5s, 1s and 2s, and knock over the server that was just recovering. It is the cheapest reliability control in this lesson and the one most often left out.'
  - term: 'Session'
    definition: 'In requests, an object that carries configuration shared by many requests — headers, cookies, authentication — and, more valuably, a pool of open connections. Using one is usually worth more than every other optimisation in a client combined, especially over HTTPS.'
  - term: 'Connection reuse'
    definition: 'Sending several requests down one already-open TCP connection instead of opening a new one each time. Default behaviour in HTTP/1.1, and what a Session gives you: five requests through one Session opened one connection in this lab, where five bare calls opened five. Each connection avoided is one TCP round trip, plus one or two more for TLS.'
  - term: 'Rate limiting'
    definition: 'A server restricting how often a client may ask. Signalled with status 429 and usually a Retry-After header giving the delay in seconds or as a date. Honouring it is both polite and the fastest route back to being served; ignoring it typically escalates to a longer block. Model APIs rate-limit tightly, so this is the status code you will meet most in Course 07.'
  - term: 'Streaming response'
    definition: 'Consuming a response body incrementally rather than loading it all at once. In requests, stream=True returns as soon as the headers arrive and iter_content pulls the body a chunk at a time, so a four-gigabyte download needs one chunk of memory rather than four gigabytes. It is also how token-by-token model output reaches a screen.'
  - term: 'TLS'
    definition: 'Transport Layer Security: encryption and server identity verification layered over TCP. HTTPS is HTTP inside TLS. The handshake costs one or two extra round trips, which is why connection reuse matters more over HTTPS than over plain HTTP. requests verifies certificates by default; verify=False reduces HTTPS to obfuscation, because the traffic is then encrypted to whoever answered.'
  - term: 'User-Agent'
    definition: 'The header saying who is making the request. Identify yourself honestly with a tool name, a version and ideally a contact address; some services block empty or default agents outright. Impersonating a browser to evade a block is the subject of the next lesson''s ethics section, and it is not a technical question.'
  - term: 'RequestException'
    definition: 'The base class of every exception requests raises for a failure at the transport layer — ConnectionError, Timeout with ConnectTimeout and ReadTimeout beneath it, SSLError, TooManyRedirects. Catching this one class catches the whole family. It is raised when NO response arrived, which is what distinguishes it from a response carrying a 500.'
