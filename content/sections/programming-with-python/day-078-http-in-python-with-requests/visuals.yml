visuals:
  - id: http-request-architecture
    file: assets/http-request-architecture.svg
    type: diagram
    title: 'The architecture of one HTTP call, from client to server'
    alt: 'Diagram: the architecture of one HTTP call — your process holding the session, its shared headers and its retry loop, then DNS, then the TCP and TLS handshake, then the request message with its method, path, query and headers, an intermediary proxy or CDN that may cache a GET and may itself return a 502, the origin server that alone chooses the status code, and the response message with its status line, headers and body — with a band showing that a timeout is two numbers, connect and read, and two panels showing where a status code lives and where a retry lives'
    description: 'An architecture diagram of a single HTTP request laid out left to right in six numbered stages. On the left, a box labelled YOUR PROCESS shows the call site with params and an explicit timeout tuple highlighted, and lists what a Session holds: shared headers, a pool of open connections, and cookies, with the note that the retry lives here. Stage 1 is DNS, turning a name into an address, cached and often instant, whose failure surfaces as a ConnectionError. Stage 2 is TCP plus TLS — SYN, SYN-ACK, ACK, then the TLS handshake — annotated with the connect timeout and the note that a Session reuses this. Stage 3 is the request message, showing the request line GET /api/readings?station=A HTTP/1.1 labelled method, path plus query and version, then the Host, User-Agent, Accept and Authorization headers, then the blank line and the note that a body appears only for POST and PUT. Stage 4 is a dashed box for a proxy or CDN, which may be several or none, caches a GET because a GET is safe and idempotent, never caches a POST, may answer 304 by itself, and may return 502, 503 or 504 on its own account. Stage 5 is the origin server, which routes the path, reads the headers, does the work, and is the only place a status code is ever chosen. Stage 6 is the response message, showing the status line HTTP/1.1 200 OK labelled version, status code and reason phrase, then Content-Type, Content-Length and Retry-After, then the blank line and the body. Beneath the flow, a band shows that a timeout is two numbers rather than one: a short connect bar covering stages 1 and 2, and a long read bar labelled as the gap between any two bytes arriving and explicitly not a deadline for the whole call, both noted as having no default in requests. Two panels close the diagram. The left panel, where a status code lives, lists the five families with their individual codes and the warning that a response arriving is success at the transport layer, so a 500 is a perfectly successful delivery of bad news. The right panel, where a retry lives, states that a retry lives in your client and nowhere else, lists 429 and the 5xx family as retryable and 400, 401, 403, 404, 409 and 422 as never retryable, gives the doubling capped schedule and the jitter range, and notes that a POST is not safe to retry blindly because the first attempt may have succeeded and lost only its reply.'
  - id: request-lifecycle-flow
    file: assets/request-lifecycle-flow.svg
    type: flowchart
    title: 'One request, step by step, with the retry branch and the do-not-retry branch'
    alt: 'Flowchart: the life of one call to session.get, step by step — building the URL and parameters, resolving the name and opening a connection, sending the request, waiting for bytes, receiving the status line and headers, deciding on the status code, decoding or streaming the body, and leaving by exactly one of three doors — returning a value, raising a domain error on a 4xx that must never be retried, or giving up after the retry branch for 429 and 5xx has exhausted its attempts'
    description: 'A vertical ten-step flowchart with two labelled branches and a loop. Step 1 builds the URL and parameters, noting that params percent-encodes the value. Step 2 resolves the name and opens a connection through DNS, TCP and TLS, or reuses one the Session already holds, annotated that the connect timeout applies here. Step 3 sends the request line, headers, blank line and body. Step 4 waits for bytes, annotated that the read timeout is the gap between bytes rather than a total deadline; a side branch leaves step 4 to a box headed no response at all, listing ConnectionError, Timeout, TooManyRedirects and SSLError as subclasses of RequestException and marking them retryable. Step 5 receives the status line and headers, with the note that a response now exists so the call has succeeded at this layer. Step 6 is a decision diamond asking which status code, described as the only place this decision can be made, with three exits. The left exit, labelled 4xx other than 429, leads to a do-not-retry box listing 400 malformed, 401 not signed in, 403 signed in but not allowed, 404 no such thing, 409 conflict and 422 shape fine but values wrong, with the observation that asking again gets the same answer. The right exit, labelled 429 or 5xx, leads to a retry box listing 429 and 500, 502, 503, 504, the waits of 0.5, 1, 2, 4 and 8 seconds capped, the jitter multiplier of 0.5 to 1.0, and the instruction to honour Retry-After; it flows into step 8, attempts left, whose yes path is a dashed loop returning to step 2 and whose no path leads to giving up. The centre exit, labelled 2xx or 3xx, leads to step 7, decoding the body, distinguishing content as bytes, text as a string and json as a parsed structure and noting that a 3xx was already followed unless allow_redirects was false; then step 9, streaming with stream true and iter_content at a chunk size of 8192 so that one chunk rather than the whole body is in memory. Three terminal boxes end the diagram: 10a returns a value, specifically a list of objects your own code defined rather than a Response, which would leak HTTP upward; 10b raises your own exception type carrying a sentence a human can act on and no traceback; and 10c gives up, raising and naming the attempt count and the last failure. A closing panel states the reason every step is testable: the session, the sleep and the jitter all arrive as parameters, so swapping in a fake exercises every branch on the page in microseconds with no server.'
