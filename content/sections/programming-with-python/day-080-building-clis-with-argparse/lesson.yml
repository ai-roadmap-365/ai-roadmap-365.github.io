id: D080
day: 80
slug: building-clis-with-argparse
title: 'Building CLIs with argparse'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to treat a command line as the user interface it is: build an argparse parser whose help output is the documentation, split a tool into subcommands dispatched by set_defaults with no branch on the command name anywhere, convert and validate every value at the parser with custom type callables that raise ArgumentTypeError, follow the exit-code convention that automation depends on, keep results on standard output and diagnostics on standard error so the tool composes in a pipeline, read from standard input when an argument is a lone dash, make --dry-run a guarantee you can prove by hashing the file, resolve configuration by the precedence users expect, and test the whole thing both in-process and as a subprocess.'
objectives:
  - 'Explain why hand-parsing sys.argv starts producing silently wrong answers at about the second optional flag, using a working demonstration rather than an assertion'
  - 'Distinguish positional arguments, options, flags and subcommands, and follow the conventions users already expect — -h, --help, --version, -v, --quiet, --dry-run, and the bare -- that ends option parsing'
  - 'Build an ArgumentParser with prog, description, epilog and per-argument help, and treat the generated help output as a deliverable rather than a side effect'
  - 'Use add_subparsers with set_defaults(func=...) as the dispatch pattern, so adding a verb touches one add_parser block and one function and nothing else'
  - 'Write custom type= callables that convert and validate, raising argparse.ArgumentTypeError so a bad value becomes a usage message and exit 2 instead of a traceback'
  - 'Apply choices, default, required, nargs, action="store_true", action="append", argument groups and mutually exclusive groups, and say what each one buys'
  - 'Follow the exit-code convention — 0 success, 1 refusal, 2 usage error — and use parser.error() for usage problems only detectable at run time'
  - 'Separate results on standard output from diagnostics on standard error, read from standard input on a lone dash, detect a terminal so the tool explains itself instead of hanging, and flush between streams'
  - 'Implement --dry-run as a real guarantee — validated for real, written never — and resolve configuration by the precedence of defaults, config file, environment, then flags'
  - 'Make a parser testable by having parse_args take an explicit argument list, and explain what a subprocess test proves that an in-process test cannot, and the reverse'
  - 'Compare argparse, click, typer, docopt and plain sys.argv on install cost, style, features and maintenance, and choose deliberately between them'
prerequisites:
  - 'Day 56: building a data-driven CLI with sys.argv — this lesson is its direct sequel'
  - 'Days 8-14: the command line itself, including pipes, redirection, and what a well-made tool feels like from the outside'
  - 'Days 64-66: reading and writing files, JSON, and exception-handling strategy'
  - 'Days 71-74: pytest, and Day 74''s argument for injecting a boundary rather than reaching for it — which is exactly what parse_args(argv) and an injected Streams object are'
  - 'Day 69 and Day 75: type hints on public functions, which the typer comparison builds on'
  - 'A terminal, a text editor, and Python 3'
reading_time_minutes: 40
