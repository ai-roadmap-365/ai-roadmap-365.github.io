visuals:
  - id: cli-architecture
    file: assets/cli-architecture.svg
    type: diagram
    title: 'Anatomy of a command-line tool'
    alt: 'Diagram: the architecture of a command-line tool — one ArgumentParser at the top declaring the whole interface, dispatching through set_defaults to one handler function per subcommand, surrounded by the six surfaces the program stands on, standard input, standard output, standard error, the exit code, the environment and a config file, with the four-step configuration precedence stack running from built-in defaults up to command-line flags'
    description: 'An architecture diagram in three bands. At the top, a command line arrives from the shell and enters a single ArgumentParser box that lists everything declared in one place: prog, description, epilog, the automatic help and version options, the add_argument keywords (type, choices, nargs, action), argument groups, mutually exclusive groups, and add_subparsers. A labelled arrow marked set_defaults(func=...) leads down to a row of five subcommand boxes — add, list, search, export and remove — each paired with the handler function it dispatches to, with a caption noting that no if-statement anywhere chooses between them because the parser already did. The lower band shows the six surfaces the program stands on, arranged as inputs on the left (standard input read when an argument is a lone dash, the environment, a config file loaded through set_defaults) and outputs in the middle (standard output carrying the result, standard error carrying diagnostics, and the exit code with its 0, 1 and 2 convention). On the right sits the configuration precedence stack drawn as four stacked bars with upward arrows: built-in defaults at the bottom as the weakest, then the config file, then environment variables, and command-line flags highlighted at the top as the winner, under the rule that the most specific statement of intent wins and the most specific is always the one the user just typed.'
  - id: argument-parsing-flow
    file: assets/argument-parsing-flow.svg
    type: flowchart
    title: 'One command line, from the shell to an exit code'
    alt: "Flowchart: the journey of one command line through argparse in six steps — the shell tokenizes the string into a list, argparse matches options and positionals, each type callable converts and validates, the subcommand selects its handler, the handler runs, and the program leaves by one of three doors, a result on standard output with exit 0, a refusal on standard error with exit 1, or argparse's own usage message on standard error with exit 2"
    description: 'A six-step vertical flow, each step annotated with a worked example drawn from the command line "notes add buy milk --on 2026-03-01". Step one: the shell tokenizes, with quoting and globbing happening before Python starts, producing the sys.argv list. Step two: options and positionals are matched, covering short and long forms, the flag-equals-value form, and the bare double dash that ends option parsing — with a note that an unknown option here means exit 2. Step three: each type callable converts and validates, and choices is checked, turning the string 2026-03-01 into a real date object. Step four: the subcommand selects its handler, because set_defaults already put the function on the namespace, so args.func is cmd_add. Step five: the handler runs, receiving values that are already the right type, and returns an integer rather than calling sys.exit. Step six: the program leaves by one of three doors, drawn as three boxes across the bottom — exit 0 with the result on standard output where a pipeline can consume it, exit 1 with a refusal message on standard error meaning the tool understood and said no, and exit 2 with argparse printing usage on standard error before the handler ever ran. Two dashed branches run from steps two and three directly to the exit 2 box, labelled with the three things that land there: an unknown option, a value outside choices, and a type callable raising ArgumentTypeError. A closing caption notes that this dashed branch is the one people forget to test and also the one that runs most often, because users mistype far more than they succeed.'
