questions:
  - question: 'A user types `mytool add "buy milk" --tag=shopping` at a hand-rolled parser that only checks for `--tag` as a separate token. What is the worst thing about the result?'
    options:
      - 'It fails silently: the tag is dropped, the command succeeds, and nothing tells the user'
      - 'It crashes with an IndexError, which is confusing'
      - 'It is slow, because the argument list is scanned twice'
      - 'It works, but only on Linux'
    answer_index: 0
    explanation: 'Silence is the worst failure mode a user interface can have. The `--flag=value` form is standard on every Unix system, so the user has no reason to suspect anything went wrong — the command exited 0 and printed a success message, and the tag simply is not there. A crash would at least be a signal. This is the specific failure `examples/by_hand.py` demonstrates, and it is why the break-even point for argparse is roughly the second optional flag.'

  - question: 'What does `subparser.set_defaults(func=cmd_add)` make possible?'
    options:
      - 'It sets the default value of the --func option'
      - 'It makes cmd_add run automatically during parsing'
      - 'It stores the handler function on the parsed namespace, so dispatch is `args.func(args)` with no branch on the command name'
      - 'It marks cmd_add as the fallback when no subcommand is given'
    answer_index: 2
    explanation: 'set_defaults puts arbitrary values on the namespace that parsing produces, and storing the function itself means `args.func` IS the right handler after parsing. Dispatch collapses to one line and adding a sixth verb touches one add_parser block and one function — nothing else in the program learns that the set of commands grew. It does not run anything during parsing, and it is not a fallback: making a missing subcommand an error is what `required=True` on add_subparsers does.'

  - question: 'Why should a custom `type=` callable raise `argparse.ArgumentTypeError` rather than letting a `ValueError` escape from your handler?'
    options:
      - 'ArgumentTypeError is faster to construct'
      - 'ValueError cannot carry a message string'
      - 'Handlers are not allowed to raise exceptions in argparse'
      - 'argparse converts it into a usage message on standard error and exits 2, instead of showing the user a traceback'
    answer_index: 3
    explanation: 'A traceback is a bug report addressed to the wrong person. Raising ArgumentTypeError inside a type= callable makes argparse print the usage line, name the exact argument, quote the exact value, and exit 2 — which tells the user what to do. Letting the conversion happen in your handler instead gives them fifteen lines of stack trace. Note that argparse also converts TypeError and ValueError raised inside a type= callable; the point stands about where the conversion happens.'

  - question: 'Your tool writes a JSON result and also a progress message. A user runs `mytool > result.json`. What must be true for `result.json` to be valid JSON?'
    options:
      - 'The progress message must go to standard error, not standard output'
      - 'The progress message must be written last'
      - 'The tool must exit 0'
      - 'The progress message must be a JSON comment'
    answer_index: 0
    explanation: 'Standard output carries the RESULT; standard error carries DIAGNOSTICS. Redirection with `>` captures only standard output, so anything written there ends up in the file. A progress message printed to standard output lands in the middle of the JSON and produces a file that looks like JSON, is not JSON, and fails downstream with an error naming nothing useful. Ordering does not help, the exit code is unrelated, and JSON has no comment syntax.'

  - question: 'Why does the lab declare `--store` with `default=None` rather than `default="notes.json"`?'
    options:
      - 'Because None is faster to compare than a string'
      - 'Because argparse rejects string defaults on options with metavar'
      - 'So the code can tell "the user did not say" apart from "the user said the default", which is what makes the environment-variable fallback possible'
      - 'Because a default of None makes the option required'
    answer_index: 2
    explanation: 'The precedence rule is flag, then $NOTES_STORE, then ./notes.json. With `default="notes.json"` the value is never None, so `store_path` can never tell whether the user typed `--store notes.json` or said nothing at all — and the environment variable could never be consulted. None is the sentinel for "unstated". It does not make the option required; that is `required=True`.'

  - question: 'A command fails. When should it exit 1 rather than 2?'
    options:
      - 'Whenever the message is short enough to fit on one line'
      - 'When the command line was well formed but the tool refused the request — no such note, an unreadable file'
      - 'Whenever the failure happened after any file was opened'
      - 'Exit 1 and exit 2 are interchangeable; only zero versus non-zero matters'
    answer_index: 1
    explanation: 'The convention this course follows: 2 means the command line itself was wrong, which argparse detects and reports before your code runs; 1 means the command line was fine and the tool understood the request but refused it. The distinction matters to whatever is calling you — a script can retry after a refusal but should never retry after a usage error, because the command line will be just as wrong the second time.'

  - question: 'Which pair of properties makes `--dry-run` a guarantee rather than a claim?'
    options:
      - 'It prints in a different colour and asks for confirmation'
      - 'It runs the command twice and compares the results'
      - 'It skips all validation to be fast, and logs what it skipped'
      - 'It performs the reads and checks for real, and returns before ever reaching the write'
    answer_index: 3
    explanation: 'Both halves are needed. Skipping validation would let a dry run cheerfully promise an impossible deletion, so the checks must be genuine — `remove 999 --dry-run` still exits 1. And it must return before the save, which is the half people get wrong by falling through. The way you prove both is to hash the target file before and after and demand the hashes match, paired with a control that runs the same command WITHOUT --dry-run and demands the hash changes.'

  - question: 'What can a subprocess test of a CLI prove that an in-process test calling `main(argv, streams)` cannot?'
    options:
      - 'That the parser assigns the right values to the namespace'
      - 'That a custom type= callable raises ArgumentTypeError'
      - 'The actual process exit code, and that standard output and standard error are genuinely separate streams'
      - 'Nothing — a subprocess test is strictly slower and weaker'
    answer_index: 2
    explanation: 'An exit code is a property of a process, so only a process can report one; and only capturing the two streams to two different destinations can prove a program did not simply print everything to standard output. Both are the contract a SHELL sees. The in-process test proves the complementary things — it can assert on the parsed Namespace, which a subprocess can never observe, and it is far faster with real tracebacks. A serious suite has both, which is why the lab ships both.'
