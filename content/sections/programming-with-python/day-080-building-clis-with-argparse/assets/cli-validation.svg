<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Validating input at the edge</title>
  <style>
    .cli-validation-bg   { fill: #f8fafc; }
    .cli-validation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-validation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-validation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-validation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-validation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-validation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-validation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-validation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-validation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-validation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-validation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-validation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cli-validation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cli-validation-stage { opacity: 1; }

    .cli-validation-s0 { animation-delay: 0.00s; }
    .cli-validation-e0 { animation-delay: 0.00s; }
    .cli-validation-s1 { animation-delay: 1.28s; }
    .cli-validation-e1 { animation-delay: 1.28s; }
    .cli-validation-s2 { animation-delay: 2.56s; }
    .cli-validation-e2 { animation-delay: 2.56s; }
    .cli-validation-s3 { animation-delay: 3.84s; }
    .cli-validation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cli-validation-conn  { animation: cli-validation-trace 6.4s ease-in-out infinite; }
      .cli-validation-stage { animation: cli-validation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cli-validation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cli-validation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cli-validation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cli-validation-stage { animation: cli-validation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cli-validation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cli-validation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cli-validation-bg" width="980" height="322"/>
  <text class="cli-validation-h1"  x="30" y="40">Validating input at the edge</text>
  <text class="cli-validation-sub" x="30" y="64">Four steps.</text>
  <g class="cli-validation-stage cli-validation-s0">
    <rect class="cli-validation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cli-validation-step" x="44" y="142">01</text>
    <text class="cli-validation-name" x="70" y="142">Declare the type, so conversion happens once</text>
    <text class="cli-validation-desc" x="44" y="166">And the program receives a</text>
    <text class="cli-validation-desc" x="44" y="182">number, not a string.</text>
  </g>
  <line class="cli-validation-line cli-validation-conn cli-validation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cli-validation-tip)"/>
  <g class="cli-validation-stage cli-validation-s1">
    <rect class="cli-validation-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cli-validation-step" x="280" y="142">02</text>
    <text class="cli-validation-name" x="306" y="142">Constrain ranges and allowed values</text>
    <text class="cli-validation-desc" x="280" y="166">So impossible input never</text>
    <text class="cli-validation-desc" x="280" y="182">reaches the logic.</text>
  </g>
  <line class="cli-validation-line cli-validation-conn cli-validation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cli-validation-tip)"/>
  <g class="cli-validation-stage cli-validation-s2">
    <rect class="cli-validation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cli-validation-step" x="516" y="142">03</text>
    <text class="cli-validation-name" x="542" y="142">Fail before doing any work</text>
    <text class="cli-validation-desc" x="516" y="166">With a message naming the</text>
    <text class="cli-validation-desc" x="516" y="182">offending argument.</text>
  </g>
  <line class="cli-validation-line cli-validation-conn cli-validation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cli-validation-tip)"/>
  <g class="cli-validation-stage cli-validation-s3">
    <rect class="cli-validation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cli-validation-step" x="752" y="142">04</text>
    <text class="cli-validation-name" x="778" y="142">And exit non-zero, so a script notices</text>
    <text class="cli-validation-desc" x="752" y="166">Rather than continuing with bad</text>
    <text class="cli-validation-desc" x="752" y="182">input.</text>
  </g>
  <text class="cli-validation-sub" x="30" y="304">Failing before any work begins is what makes a tool safe to invoke from a script: a partial run on bad input is worse than no run at all.</text>
</svg>
