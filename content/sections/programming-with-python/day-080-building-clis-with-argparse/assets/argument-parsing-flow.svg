<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" role="img" font-family="system-ui, sans-serif">
  <title>The journey of one command line through argparse in six steps: the shell tokenizes the string into a list, argparse matches options and positionals, each type callable converts and validates, the subcommand chooses a handler, the handler runs, and the program leaves by one of three doors — a result on standard output with exit 0, a refusal on standard error with exit 1, or argparse's own usage message on standard error with exit 2</title>
  <rect x="0" y="0" width="900" height="860" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One command line, from the shell to an exit code</text>

  <!-- Step 1 -->
  <rect x="60" y="56" width="420" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="82" font-size="15" font-weight="bold" fill="#1a202c">1. The shell tokenizes</text>
  <text x="80" y="104" font-size="14" fill="#1a202c">quoting and globbing happen here, before Python starts</text>
  <text x="500" y="82" font-size="14" fill="#1d4ed8">notes add "buy milk" --on 2026-03-01</text>
  <text x="500" y="104" font-size="14" fill="#1d4ed8">sys.argv = 'add', 'buy milk', '--on', '2026-03-01'</text>
  <line x1="270" y1="120" x2="270" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,144 264,130 276,130" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="60" y="146" width="420" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="172" font-size="15" font-weight="bold" fill="#1a202c">2. Options and positionals are matched</text>
  <text x="80" y="194" font-size="14" fill="#1a202c">short and long forms, --flag=value, "--" ends option parsing</text>
  <text x="500" y="184" font-size="14" fill="#1d4ed8">unknown option here means exit 2</text>
  <line x1="270" y1="210" x2="270" y2="230" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,234 264,220 276,220" fill="#1a202c"/>

  <!-- Step 3 -->
  <rect x="60" y="236" width="420" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="262" font-size="15" font-weight="bold" fill="#1a202c">3. Each type= callable converts and validates</text>
  <text x="80" y="284" font-size="14" fill="#1a202c">choices= is checked here too</text>
  <text x="500" y="274" font-size="14" fill="#1d4ed8">'2026-03-01' becomes date(2026, 3, 1)</text>
  <line x1="270" y1="300" x2="270" y2="320" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,324 264,310 276,310" fill="#1a202c"/>

  <!-- Step 4 -->
  <rect x="60" y="326" width="420" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="352" font-size="15" font-weight="bold" fill="#1a202c">4. The subcommand selects its handler</text>
  <text x="80" y="374" font-size="14" fill="#1a202c">set_defaults put the function on the namespace</text>
  <text x="500" y="364" font-size="14" fill="#1d4ed8">args.func is cmd_add</text>
  <line x1="270" y1="390" x2="270" y2="410" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,414 264,400 276,400" fill="#1a202c"/>

  <!-- Step 5 -->
  <rect x="60" y="416" width="420" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="442" font-size="15" font-weight="bold" fill="#1a202c">5. The handler runs</text>
  <text x="80" y="464" font-size="14" fill="#1a202c">every value it receives is already the right type</text>
  <text x="500" y="454" font-size="14" fill="#1d4ed8">return an int; do not call sys.exit</text>
  <line x1="270" y1="480" x2="270" y2="500" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,504 264,490 276,490" fill="#1a202c"/>

  <!-- Step 6 -->
  <rect x="60" y="506" width="420" height="50" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="270" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">6. The program leaves by one of three doors</text>

  <!-- Three exits -->
  <line x1="150" y1="556" x2="150" y2="600" stroke="#1a202c" stroke-width="2"/>
  <polygon points="150,604 144,590 156,590" fill="#1a202c"/>
  <line x1="390" y1="556" x2="390" y2="600" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,604 384,590 396,590" fill="#1a202c"/>

  <rect x="40" y="606" width="220" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="150" y="632" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exit 0 — success</text>
  <text x="56" y="656" font-size="14" fill="#1a202c">result on standard output</text>
  <text x="56" y="676" font-size="14" fill="#1a202c">a pipeline can consume it</text>

  <rect x="280" y="606" width="220" height="90" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="390" y="632" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exit 1 — refusal</text>
  <text x="296" y="656" font-size="14" fill="#1a202c">message on standard error</text>
  <text x="296" y="676" font-size="14" fill="#1a202c">the tool understood, and said no</text>

  <!-- The exit-2 branch, fed by steps 2 and 3 -->
  <rect x="560" y="606" width="300" height="90" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="710" y="632" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">exit 2 — usage error</text>
  <text x="576" y="656" font-size="14" fill="#1a202c">argparse prints usage on standard error</text>
  <text x="576" y="676" font-size="14" fill="#1a202c">and exits before your code ever runs</text>

  <path d="M 480 178 L 620 178 L 620 600" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="620,604 614,590 626,590" fill="#1d4ed8"/>
  <path d="M 480 268 L 660 268 L 660 600" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="660,604 654,590 666,590" fill="#1d4ed8"/>
  <text x="676" y="300" font-size="14" fill="#1d4ed8">an unknown option, a value</text>
  <text x="676" y="320" font-size="14" fill="#1d4ed8">outside choices=, or a type=</text>
  <text x="676" y="340" font-size="14" fill="#1d4ed8">callable raising</text>
  <text x="676" y="360" font-size="14" fill="#1d4ed8">ArgumentTypeError — all of</text>
  <text x="676" y="380" font-size="14" fill="#1d4ed8">them land here</text>

  <text x="450" y="740" text-anchor="middle" font-size="15" fill="#1a202c">The dashed branch is the one people forget to test. It is also the one that</text>
  <text x="450" y="762" text-anchor="middle" font-size="15" fill="#1a202c">runs most often, because users mistype far more than they succeed.</text>

  <text x="450" y="806" text-anchor="middle" font-size="14" fill="#1d4ed8">Steps 1 to 4 happen before a single line of your own logic executes.</text>
  <text x="450" y="828" text-anchor="middle" font-size="14" fill="#1d4ed8">That is the whole benefit: bad input never reaches your program.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 480 178 L 620 178 L 620 600" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 480 268 L 660 268 L 660 600" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 150 556 L 150 600" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 390 556 L 390 600" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
