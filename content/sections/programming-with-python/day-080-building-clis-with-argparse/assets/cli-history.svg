<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward generated help.">
  <title>Four steps in command-line design</title>
  <style>
    .cli-history-bg   { fill: #f8fafc; }
    .cli-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cli-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cli-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cli-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cli-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cli-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cli-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cli-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cli-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cli-history-stage { opacity: 1; }

    .cli-history-s0 { animation-delay: 0.00s; }
    .cli-history-e0 { animation-delay: 0.00s; }
    .cli-history-s1 { animation-delay: 1.28s; }
    .cli-history-e1 { animation-delay: 1.28s; }
    .cli-history-s2 { animation-delay: 2.56s; }
    .cli-history-e2 { animation-delay: 2.56s; }
    .cli-history-s3 { animation-delay: 3.84s; }
    .cli-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .cli-history-conn  { animation: cli-history-trace 6.4s ease-in-out infinite; }
      .cli-history-stage { animation: cli-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes cli-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cli-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cli-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cli-history-stage { animation: cli-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cli-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cli-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cli-history-bg" width="980" height="322"/>
  <text class="cli-history-h1"  x="30" y="40">Four steps in command-line design</text>
  <text class="cli-history-sub" x="30" y="64">Toward generated help.</text>
  <g class="cli-history-stage cli-history-s0">
    <rect class="cli-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="cli-history-step" x="44" y="142">01</text>
    <text class="cli-history-name" x="70" y="142">Positional arguments only</text>
    <text class="cli-history-desc" x="44" y="166">Order-dependent, and easy to get</text>
    <text class="cli-history-desc" x="44" y="182">wrong.</text>
  </g>
  <line class="cli-history-line cli-history-conn cli-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#cli-history-tip)"/>
  <g class="cli-history-stage cli-history-s1">
    <rect class="cli-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="cli-history-step" x="280" y="142">02</text>
    <text class="cli-history-name" x="306" y="142">Then flag conventions emerged</text>
    <text class="cli-history-desc" x="280" y="166">Short and long forms, widely</text>
    <text class="cli-history-desc" x="280" y="182">shared.</text>
  </g>
  <line class="cli-history-line cli-history-conn cli-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#cli-history-tip)"/>
  <g class="cli-history-stage cli-history-s2">
    <rect class="cli-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="cli-history-step" x="516" y="142">03</text>
    <text class="cli-history-name" x="542" y="142">Then parsing libraries that generated help</text>
    <text class="cli-history-desc" x="516" y="166">Which kept documentation in</text>
    <text class="cli-history-desc" x="516" y="182">step.</text>
  </g>
  <line class="cli-history-line cli-history-conn cli-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#cli-history-tip)"/>
  <g class="cli-history-stage cli-history-s3">
    <rect class="cli-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="cli-history-step" x="752" y="142">04</text>
    <text class="cli-history-name" x="778" y="142">And subcommand suites for larger tools</text>
    <text class="cli-history-desc" x="752" y="166">Which is how a whole toolkit</text>
    <text class="cli-history-desc" x="752" y="182">fits one command.</text>
  </g>
  <text class="cli-history-sub" x="30" y="304">Generated help was the step that mattered most for usability, because hand-written usage text drifts from the code within a release or two.</text>
</svg>
