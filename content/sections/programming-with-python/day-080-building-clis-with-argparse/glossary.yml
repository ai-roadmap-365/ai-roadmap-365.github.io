terms:
  - term: 'Command-line interface'
    definition: 'A user interface made of text: the program receives a list of strings when it starts, and returns text plus a number when it finishes. It is a screen with no pixels, and it deserves the same care as one — clear labels, sensible defaults, validation at entry, and a confirmation before anything irreversible.'
  - term: 'Positional argument'
    definition: 'An argument identified by where it appears rather than by a name. In `cp source.txt backup.txt` the first path is the source because it is first. Usually required, and there should be very few — a user cannot reliably remember an order longer than about two.'
  - term: 'Option'
    definition: 'An argument identified by name, so it can appear in any order: `--store notes.json`. Conventionally offered in a long form (`--store`) and often a short one (`-s`). The long form is for scripts, where readability matters six months later; the short form is for typing.'
  - term: 'Flag'
    definition: 'An option that takes no value and simply turns something on, such as `--dry-run` or `-v`. Declared with `action="store_true"`, so its presence means True and its absence means False.'
  - term: 'Subcommand'
    definition: 'A first positional argument that selects an entire second interface, as in `git commit` versus `git log`. Built with `add_subparsers` and `add_parser`, and the way any tool with more than about three verbs stays comprehensible.'
  - term: 'Dispatch'
    definition: 'Routing a parsed subcommand to the function that implements it. The argparse pattern is `subparser.set_defaults(func=cmd_add)`, which puts the handler on the namespace so `args.func(args)` is the whole of dispatch and no branch on the command name exists anywhere in the program.'
  - term: 'Exit code'
    definition: 'The single number a program hands back to whatever launched it. Zero means success and anything else means failure. This is the mechanism `&&` in a shell and every scheduler and CI system reads — a tool that always exits 0 cannot be automated at all.'
  - term: 'Standard output'
    definition: 'The stream carrying the program''s RESULT — the thing the caller actually wanted. Redirected by `>` and consumed by the next program in a pipeline, which is why nothing but the result may go here.'
  - term: 'Standard error'
    definition: 'The stream carrying DIAGNOSTICS: progress notes, warnings, error messages. Keeping it separate from standard output is what lets `mytool > results.json` produce a clean file while the tool chatters on screen, and what stops an error message from being fed to a downstream program as if it were data.'
  - term: 'Standard input'
    definition: 'The stream a value can arrive on from another program instead of from the command line. By a convention older than Python, an argument of a lone `-` means "read this from standard input" — which is how a tool joins a pipeline, and also how a secret is kept out of the process list and the shell history.'
  - term: 'Pipeline'
    definition: 'Several programs joined so that each one''s standard output becomes the next one''s standard input, as in `notes export --format json | python3 -m json.tool`. A tool composes in a pipeline only if its result is machine-readable and its diagnostics are somewhere else.'
  - term: 'Dry run'
    definition: 'A mode, conventionally `--dry-run`, in which a destructive command reports exactly what it would do and changes nothing. It must still perform its reads and checks for real — otherwise it can promise an impossible deletion — and must return before ever reaching the write. Prove it by hashing the target before and after.'
  - term: 'Usage message'
    definition: 'The short synopsis argparse prints when a command line is malformed, showing the shape of a correct invocation followed by the specific error, on standard error, with exit code 2. It is generated from the same declarations that do the parsing, so it cannot drift out of date with the behaviour.'
  - term: 'Argument parsing'
    definition: 'Turning the list of strings a program receives into structured, typed values: matching options and positionals, converting through `type=`, checking `choices=`, applying defaults, and refusing anything that does not fit. In argparse all of it happens before a single line of your own logic runs.'
  - term: 'Configuration precedence'
    definition: 'The order in which competing sources of a setting override one another: built-in defaults, then a config file, then environment variables, then command-line flags. It is the order of increasing specificity, and users expect it because the most specific statement of intent is always the one they just typed.'
  - term: 'Terminal detection'
    definition: 'Asking, with `isatty()`, whether a stream is connected to a terminal or to a pipe or file. Checking it on standard input before reading is what stops `mytool add -` from silently hanging forever when nothing was piped in; checking it on standard output is how tools decide whether to emit colour.'
  - term: 'ArgumentTypeError'
    definition: 'The exception a custom `type=` callable raises to reject a value. argparse catches it and turns it into a usage message on standard error with exit code 2, naming the argument and quoting the offending value — rather than the traceback a bare ValueError would produce.'
  - term: 'Mutually exclusive group'
    definition: 'A set of options of which at most one may be given, created with `add_mutually_exclusive_group()`. argparse both enforces it — passing two is exit 2 with a message naming both — and documents it, showing `-v | -q` in the usage line, neither of which a hand-written check would do.'
