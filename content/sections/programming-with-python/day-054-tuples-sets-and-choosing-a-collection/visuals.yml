visuals:
  - id: collection-chooser
    file: assets/collection-chooser.svg
    type: diagram
    title: 'Choosing a collection'
    alt: 'Diagram: a decision map for choosing a Python collection — list, tuple, set, or dict — by key lookup, uniqueness, and mutability'
    description: 'A top-to-bottom decision map. Starting from "you have some data", three yes/no questions branch to a collection: look a value up by a key? -> dict; only unique items or fast membership? -> set; will it change after you build it? -> list (yes) or tuple (no). A side legend lists the four deciding questions: mutable, ordered, unique, and fast lookup.'
  - id: set-operations-flow
    file: assets/set-operations-flow.svg
    type: flowchart
    title: 'Set algebra on two example sets'
    alt: 'Flowchart: set operations on two example sets A and B — union, intersection, difference, and symmetric difference'
    description: 'Two overlapping circles show set A = {apple, banana, cherry} and set B = {banana, cherry, date}, with banana and cherry in the overlap. Four result boxes below give union (apple, banana, cherry, date), intersection (banana, cherry), difference A minus B (apple), and symmetric difference (apple, date).'
  - id: four-collections
    file: assets/four-collections.svg
    type: diagram
    title: 'Four collections'
    alt: 'Diagram: the four built-in collections and the properties that distinguish them'
    description: 'A four-stage description of the collections covering lists, tuples, sets and dictionaries.'
  - id: set-ops
    file: assets/set-ops.svg
    type: diagram
    title: 'Set operations'
    alt: 'Diagram: the four set operations and what each answers'
    description: 'A four-stage description of set operations covering union, intersection, difference and symmetric difference.'
  - id: mutable-immutable
    file: assets/mutable-immutable.svg
    type: diagram
    title: 'Mutable against immutable'
    alt: 'Diagram: mutable collections compared with immutable ones'
    description: 'A two-column comparison of mutable collections against immutable ones.'
  - id: membership-cost
    file: assets/membership-cost.svg
    type: diagram
    title: 'The cost that decides the container'
    alt: 'Diagram: the cost of membership testing across containers'
    description: 'A four-stage description of membership costs covering lists, sets, dictionaries and the practical consequence.'
  - id: collections-history
    file: assets/collections-history.svg
    type: diagram
    title: 'Four steps in collection types'
    alt: 'Diagram: the historical progression of collection types'
    description: 'A four-stage description of collection history covering the single array, distinct types, hash-based containers and specialised variants.'
  - id: toolbox
    file: assets/toolbox.svg
    type: diagram
    title: 'The right tool'
    alt: 'Diagram: using one general tool for everything compared with choosing the right one'
    description: 'A two-column comparison of a single general tool against purpose-chosen tools.'
  - id: collections-scale
    file: assets/collections-scale.svg
    type: diagram
    title: 'Collections at scale'
    alt: 'Diagram: four scaling considerations for in-memory collections'
    description: 'A four-stage description of collection scaling covering memory overhead, growth, alternatives and the boundary.'
  - id: collections-when
    file: assets/collections-when.svg
    type: diagram
    title: 'Which collection when'
    alt: 'Diagram: choosing a collection by access pattern'
    description: 'A two-column comparison of access patterns against the collection each requires.'
