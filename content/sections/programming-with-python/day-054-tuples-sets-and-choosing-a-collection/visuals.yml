visuals:
  - id: collection-chooser
    file: assets/collection-chooser.svg
    type: diagram
    title: 'Choosing a collection'
    alt: 'Diagram: a decision map for choosing a Python collection — list, tuple, set, or dict — by key lookup, uniqueness, and mutability'
    description: 'A top-to-bottom decision map. Starting from "you have some data", three yes/no questions branch to a collection: look a value up by a key? -> dict; only unique items or fast membership? -> set; will it change after you build it? -> list (yes) or tuple (no). A side legend lists the four deciding questions: mutable, ordered, unique, and fast lookup.'
  - id: set-operations-flow
    file: assets/set-operations-flow.svg
    type: flowchart
    title: 'Set algebra on two example sets'
    alt: 'Flowchart: set operations on two example sets A and B — union, intersection, difference, and symmetric difference'
    description: 'Two overlapping circles show set A = {apple, banana, cherry} and set B = {banana, cherry, date}, with banana and cherry in the overlap. Four result boxes below give union (apple, banana, cherry, date), intersection (banana, cherry), difference A minus B (apple), and symmetric difference (apple, date).'
