terms:
  - term: tuple
    definition: 'An ordered, immutable sequence of items, written with commas and usually parentheses, e.g. `(3, 4)`. It supports indexing and iteration like a list but cannot be changed after creation, which makes it a safe fixed record and lets it serve as a dict key or set member.'
  - term: immutability
    definition: 'The property of a value that cannot be changed after it is created. Tuples, strings, numbers, and frozensets are immutable; lists, dicts, and sets are mutable. Immutability is what makes a value hashable.'
  - term: tuple unpacking
    definition: 'Assigning the items of a tuple to several names at once, e.g. `row, col = (2, 5)`. It also powers the clean swap `a, b = b, a` and the way a function returns multiple values.'
  - term: namedtuple
    definition: 'A tuple with named fields, created via `collections.namedtuple`, so you can read an item by name (`city.name`) instead of by position (`city[0]`) while it stays an immutable, hashable tuple underneath.'
  - term: set
    definition: 'An unordered collection of unique, hashable items, written with braces, e.g. `{"a", "b"}` (but the empty set is `set()`, since `{}` is an empty dict). It removes duplicates automatically and answers membership in roughly constant time.'
  - term: frozenset
    definition: 'An immutable set. Because it cannot change, it is hashable and can therefore be a member of another set or a dictionary key, unlike an ordinary mutable set.'
  - term: union
    definition: 'The set operation `a | b` that returns every item appearing in either set, with duplicates collapsed — e.g. `{1, 2} | {2, 3}` is `{1, 2, 3}`.'
  - term: intersection
    definition: 'The set operation `a & b` that returns only the items appearing in both sets — e.g. `{1, 2, 3} & {2, 3, 4}` is `{2, 3}`.'
  - term: difference
    definition: 'The set operation `a - b` that returns the items in the first set but not the second — e.g. `{1, 2, 3} - {2, 3, 4}` is `{1}`.'
  - term: symmetric difference
    definition: 'The set operation `a ^ b` that returns the items in exactly one of the two sets, excluding those in both — e.g. `{1, 2, 3} ^ {2, 3, 4}` is `{1, 4}`.'
  - term: hashable
    definition: 'A value for which Python can compute a stable fingerprint (a hash), which is required to store it in a set or use it as a dict key. Immutable values (numbers, strings, tuples, frozensets) are hashable; mutable ones (lists, dicts, sets) are not.'
  - term: deduplication
    definition: 'Removing duplicate items so that each value appears once. Building a set from a sequence deduplicates it in a single pass, far faster than repeatedly checking a growing list.'
