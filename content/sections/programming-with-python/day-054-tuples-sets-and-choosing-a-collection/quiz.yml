questions:
  - question: 'What is the defining difference between a tuple and a list?'
    options:
      - 'A tuple can only hold numbers, while a list can hold anything'
      - 'A tuple is immutable; a list is mutable'
      - 'A tuple is always faster to iterate than a list'
      - 'A tuple cannot be indexed by position, but a list can'
    answer_index: 1
    explanation: 'Both are ordered sequences you index by position. The defining difference is immutability: a tuple cannot be changed after creation (no adding, removing, or replacing items), which is what makes it a safe fixed record and lets it serve as a dict key or set member. A list is mutable.'

  - question: 'Why can a tuple be used as a dictionary key but a list cannot?'
    options:
      - 'A tuple uses less memory than a list'
      - 'Dictionary keys must be numbers, and tuples convert to numbers'
      - 'A tuple is hashable because immutable; a list is not'
      - 'It is an arbitrary rule with no underlying reason'
    answer_index: 2
    explanation: 'A dict key (and a set member) must be hashable, meaning Python can compute a stable fingerprint for it. Only immutable values are hashable, because a value that could change would break the fingerprint. A tuple is immutable and therefore hashable; a list is mutable and therefore unhashable.'

  - question: 'Given `a = {1, 2, 3}` and `b = {2, 3, 4}`, what is `a & b`?'
    options:
      - '{1, 2, 3, 4}'
      - '{1, 4}'
      - '{1}'
      - '{2, 3}'
    answer_index: 3
    explanation: '`&` is intersection: the items in BOTH sets. Only 2 and 3 appear in both `a` and `b`, so `a & b` is `{2, 3}`. (For contrast: `a | b` is the union `{1,2,3,4}`, and `a ^ b` is the symmetric difference `{1, 4}`.)'

  - question: 'You must remove duplicates from a list of one million records and then check "have I seen this?" many times. Which collection fits best, and why?'
    options:
      - 'A set — one pass to dedupe, O(1) membership'
      - 'A list, because it preserves order'
      - 'A tuple, because it is immutable'
      - 'A dict, because it stores key-value pairs'
    answer_index: 0
    explanation: 'A set removes duplicates in a single pass and answers membership in roughly constant time regardless of size. A list would make each "have I seen this?" check O(n) and deduping O(n squared) — far too slow at a million records.'

  - question: 'What does the literal `{}` create in Python?'
    options:
      - 'An empty set'
      - 'An empty dictionary'
      - 'An empty tuple object'
      - 'A syntax error'
    answer_index: 1
    explanation: '`{}` is an empty dictionary, not an empty set — a common trap. To make an empty set you must write `set()`. A non-empty `{1, 2}` is a set, and `{"a": 1}` is a dict.'

  - question: 'What is the value of `{"cat", "dog"} ^ {"dog", "bird"}` (symmetric difference)?'
    options:
      - '{"dog"}'
      - '{"cat", "dog", "bird"}'
      - '{"cat", "bird"}'
      - '{}'
    answer_index: 2
    explanation: 'Symmetric difference (`^`) keeps the items in exactly one of the two sets, not in both. "dog" is in both, so it is excluded; "cat" (only in the first) and "bird" (only in the second) remain, giving `{"cat", "bird"}`.'

  - question: 'What is the main advantage of a `namedtuple` over a plain tuple?'
    options:
      - 'It is mutable, so you can change its fields'
      - 'It is hashable, whereas a plain tuple is not'
      - 'It can hold more items than a plain tuple'
      - 'It adds named fields while staying an immutable tuple'
    answer_index: 3
    explanation: 'A namedtuple is still an immutable, hashable tuple, but it adds names to its positions so you can write `city.name` instead of `city[0]`. It improves readability of records without giving up immutability. (A plain tuple is already hashable.)'

  - question: 'Which statement about choosing a collection is correct?'
    options:
      - 'dict to look up, set for uniqueness, list for order'
      - 'Always use a list; the others are rarely needed'
      - 'Use a set whenever order matters'
      - 'Use a tuple whenever the collection needs to grow'
    answer_index: 0
    explanation: 'The four-question checklist maps cleanly: key lookup -> dict; uniqueness or fast membership -> set; will it change -> list; otherwise a small fixed record -> tuple. A set forgets order and duplicates, and a tuple cannot grow, so the last two options are wrong.'
