<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What each permits.">
  <title>Mutable against immutable</title>
  <style>
    .mutable-immutable-bg   { fill: #f8fafc; }
    .mutable-immutable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-immutable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-immutable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-immutable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-immutable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mutable-immutable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutable-immutable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mutable-immutable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mutable-immutable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mutable-immutable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mutable-immutable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mutable-immutable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mutable-immutable-row { opacity: 1; }
    .mutable-immutable-r0 { animation-delay: 0.00s; }
    .mutable-immutable-r1 { animation-delay: 0.45s; }
    .mutable-immutable-r2 { animation-delay: 0.90s; }
    .mutable-immutable-r3 { animation-delay: 1.35s; }
    .mutable-immutable-r4 { animation-delay: 1.80s; }
    .mutable-immutable-row { animation: mutable-immutable-reveal 7.3s ease-in-out infinite; }
    @keyframes mutable-immutable-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mutable-immutable-bg" width="980" height="390"/>
  <text class="mutable-immutable-h1"  x="30" y="40">Mutable against immutable</text>
  <text class="mutable-immutable-sub" x="30" y="64">What each permits.</text>
  <rect class="mutable-immutable-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mutable-immutable-name" x="46" y="122">Mutable</text>
  <text class="mutable-immutable-desc" x="46" y="142">Can change in place.</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r0" x="46" y="182">Lists, dictionaries, sets</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r1" x="46" y="216">Convenient for building up</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r2" x="46" y="250">Cannot be a dictionary key</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r3" x="46" y="284">Sharing one means sharing changes</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r4" x="46" y="318">Unsafe as a default argument</text>
  <rect class="mutable-immutable-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mutable-immutable-name" x="526" y="122">Immutable</text>
  <text class="mutable-immutable-desc" x="526" y="142">Fixed once created.</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r0" x="526" y="182">Tuples, strings, frozensets</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r1" x="526" y="216">Safe to share freely</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r2" x="526" y="250">Can be a key, being hashable</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r3" x="526" y="284">No surprise changes from elsewhere</text>
  <text class="mutable-immutable-desc mutable-immutable-row mutable-immutable-r4" x="526" y="318">Safe as a default argument</text>
  <text class="mutable-immutable-sub" x="30" y="372">Immutability being what makes something hashable is the connection that links this lesson to the previous one: the key restriction is not arbitrary.</text>
</svg>
