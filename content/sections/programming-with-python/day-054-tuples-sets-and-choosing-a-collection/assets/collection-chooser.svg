<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" role="img" font-family="system-ui, sans-serif">
  <title>A decision map for choosing a Python collection — list, tuple, set, or dict — by asking about key lookup, uniqueness, and mutability</title>
  <rect x="0" y="0" width="820" height="580" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Which collection? Ask three questions, top to bottom</text>

  <!-- Start -->
  <rect x="320" y="56" width="180" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="410" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">You have some data</text>
  <line x1="410" y1="102" x2="410" y2="128" stroke="#1a202c" stroke-width="2"/>
  <polygon points="410,128 404,116 416,116" fill="#1a202c"/>

  <!-- Q1: key -> value? -->
  <polygon points="410,136 560,186 410,236 260,186" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Look up a value</text>
  <text x="410" y="202" text-anchor="middle" font-size="15" fill="#1a202c">by a key?</text>
  <!-- yes -> dict -->
  <text x="588" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="560" y1="186" x2="660" y2="186" stroke="#1a202c" stroke-width="2"/>
  <polygon points="660,186 648,180 648,192" fill="#1a202c"/>
  <rect x="660" y="160" width="130" height="52" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="725" y="184" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">dict</text>
  <text x="725" y="203" text-anchor="middle" font-size="14" fill="#1a202c">key -&gt; value</text>
  <!-- no -->
  <text x="428" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="410" y1="236" x2="410" y2="266" stroke="#1a202c" stroke-width="2"/>
  <polygon points="410,266 404,254 416,254" fill="#1a202c"/>

  <!-- Q2: unique / fast membership? -->
  <polygon points="410,274 560,324 410,374 260,324" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Only unique items,</text>
  <text x="410" y="336" text-anchor="middle" font-size="15" fill="#1a202c">or fast "is it in?"</text>
  <!-- yes -> set -->
  <text x="588" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="560" y1="324" x2="660" y2="324" stroke="#1a202c" stroke-width="2"/>
  <polygon points="660,324 648,318 648,330" fill="#1a202c"/>
  <rect x="660" y="298" width="130" height="52" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="725" y="322" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">set</text>
  <text x="725" y="341" text-anchor="middle" font-size="14" fill="#1a202c">unique, O(1) in</text>
  <!-- no -->
  <text x="428" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="410" y1="374" x2="410" y2="404" stroke="#1a202c" stroke-width="2"/>
  <polygon points="410,404 404,392 416,392" fill="#1a202c"/>

  <!-- Q3: will it change? -->
  <polygon points="410,412 560,462 410,512 260,462" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Will it change</text>
  <text x="410" y="478" text-anchor="middle" font-size="15" fill="#1a202c">after you build it?</text>
  <!-- yes -> list -->
  <text x="588" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="560" y1="462" x2="660" y2="462" stroke="#1a202c" stroke-width="2"/>
  <polygon points="660,462 648,456 648,468" fill="#1a202c"/>
  <rect x="660" y="436" width="130" height="52" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="725" y="460" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">list</text>
  <text x="725" y="479" text-anchor="middle" font-size="14" fill="#1a202c">ordered, mutable</text>
  <!-- no -> tuple -->
  <text x="360" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="410" y1="512" x2="410" y2="536" stroke="#1a202c" stroke-width="2"/>
  <polygon points="410,536 404,524 416,524" fill="#1a202c"/>
  <rect x="345" y="536" width="130" height="40" fill="#bbf7d0" stroke="#166534" stroke-width="2" rx="6"/>
  <text x="410" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">tuple</text>
  <text x="410" y="572" text-anchor="middle" font-size="13" fill="#1a202c">ordered, immutable</text>

  <!-- Legend of the four deciding properties -->
  <rect x="24" y="150" width="200" height="180" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="124" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">The four questions</text>
  <text x="40" y="204" font-size="14" fill="#1a202c">Mutable? can it change</text>
  <text x="40" y="230" font-size="14" fill="#1a202c">Ordered? keep position</text>
  <text x="40" y="256" font-size="14" fill="#1a202c">Unique? drop duplicates</text>
  <text x="40" y="282" font-size="14" fill="#1a202c">Fast lookup? O(1) by key</text>
  <text x="40" y="312" font-size="13" fill="#1a202c">Answer these before coding.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 410 102 L 410 128" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 560 186 L 660 186" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 410 236 L 410 266" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 560 324 L 660 324" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 410 374 L 410 404" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 560 462 L 660 462" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
