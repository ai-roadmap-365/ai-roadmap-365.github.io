title: 'Tuples, Sets, and Choosing a Collection'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to use tuples for immutable records and sets for uniqueness and fast membership, compute set algebra between two collections, and choose confidently among list, tuple, set, and dict using a four-question checklist.'
objectives:
  - 'Describe a tuple as an ordered, immutable sequence and use tuple unpacking and multiple return values to hand back a fixed record'
  - 'Use a namedtuple to give a tuple readable named fields while keeping it immutable and hashable'
  - 'Use a set to remove duplicates in one pass and to test membership in roughly constant time, and explain why a list is O(n) for the same job'
  - 'Compute union, intersection, difference, and symmetric difference between two sets and read the result correctly'
  - 'Explain hashability — why tuples and frozensets can be set members or dict keys and lists cannot'
  - 'Choose among list, tuple, set, and dict by asking four questions: key lookup, uniqueness/fast membership, mutability, and otherwise a fixed record'
  - 'Connect collection choice to AI data pipelines — sets for dedupe and stop-word filtering, tuples for safe records — and recognise it as a real performance lever'
prerequisites:
  - 'Day 52 (lists) and Day 53 (dictionaries): creating, indexing, and iterating over the two most common collections'
  - 'Day 49 program structure: functions, a main entry point, the main guard, and input validation'
  - 'Comfort running a Python script from the terminal with `python3 file.py` and editing a text file'
