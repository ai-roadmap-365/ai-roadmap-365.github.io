<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Boundaries first, details later.">
  <title>Designing a building</title>
  <style>
    .building-design-bg   { fill: #f8fafc; }
    .building-design-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-design-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-design-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-design-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-design-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .building-design-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .building-design-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .building-design-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .building-design-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .building-design-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .building-design-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .building-design-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .building-design-row { opacity: 1; }
    .building-design-r0 { animation-delay: 0.00s; }
    .building-design-r1 { animation-delay: 0.45s; }
    .building-design-r2 { animation-delay: 0.90s; }
    .building-design-r3 { animation-delay: 1.35s; }
    .building-design-r4 { animation-delay: 1.80s; }
    .building-design-row { animation: building-design-reveal 7.3s ease-in-out infinite; }
    @keyframes building-design-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="building-design-bg" width="980" height="390"/>
  <text class="building-design-h1"  x="30" y="40">Designing a building</text>
  <text class="building-design-sub" x="30" y="64">Boundaries first, details later.</text>
  <rect class="building-design-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="building-design-name" x="46" y="122">Structure first</text>
  <text class="building-design-desc" x="46" y="142">Hard to change later.</text>
  <text class="building-design-desc building-design-row building-design-r0" x="46" y="182">Where the load-bearing walls go</text>
  <text class="building-design-desc building-design-row building-design-r1" x="46" y="216">Where the services run</text>
  <text class="building-design-desc building-design-row building-design-r2" x="46" y="250">Decided early, deliberately</text>
  <text class="building-design-desc building-design-row building-design-r3" x="46" y="284">Expensive to change afterwards</text>
  <text class="building-design-desc building-design-row building-design-r4" x="46" y="318">This is the boundaries in a program</text>
  <rect class="building-design-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="building-design-name" x="526" y="122">Details later</text>
  <text class="building-design-desc" x="526" y="142">Cheap to change.</text>
  <text class="building-design-desc building-design-row building-design-r0" x="526" y="182">Finishes, fittings, colours</text>
  <text class="building-design-desc building-design-row building-design-r1" x="526" y="216">Decided as you go</text>
  <text class="building-design-desc building-design-row building-design-r2" x="526" y="250">Changed without consequence</text>
  <text class="building-design-desc building-design-row building-design-r3" x="526" y="284">Cheap at any point</text>
  <text class="building-design-desc building-design-row building-design-r4" x="526" y="318">This is the implementation</text>
  <text class="building-design-sub" x="30" y="372">Knowing which decisions are load-bearing is the design skill, because those are the ones worth deliberating and the rest are not.</text>
</svg>
