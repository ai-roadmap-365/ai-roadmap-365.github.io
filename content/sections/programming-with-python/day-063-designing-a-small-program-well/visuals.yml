visuals:
  - id: program-design
    file: assets/program-design.svg
    type: diagram
    title: 'Functional core, imperative shell'
    alt: 'Diagram: a well-designed small program — the outside world enters a thin imperative shell that does all I/O, wrapping a pure functional core of small single-responsibility functions, with results leaving as stdout, stderr, and an exit code, and tests calling the core directly'
    description: 'The outside world (a file, standard input, arguments) enters a thin imperative shell (summary.py) that performs all input and output. Inside the shell sits the pure functional core (summary_core.py) — parse_numbers, summarize, and format_summary — each a single-responsibility function with no I/O. Results leave through the shell as standard output, standard error, and an exit code. Tests point directly at the pure core, calling its functions with example values and checking the returns, with no files to set up and no output to capture.'
  - id: design-loop-flow
    file: assets/design-loop-flow.svg
    type: flowchart
    title: 'The design loop: spec to refactor'
    alt: 'Flowchart: the design loop for a small program — spec and examples, decompose into functions, design signatures and docstrings, implement the pure core, add the thin shell, test, then refactor and loop back to grow it incrementally'
    description: 'A seven-step loop: start from a spec and examples; decompose the work into small single-responsibility functions; design their signatures and docstrings before any body; implement the pure core; add the thin imperative shell for I/O; test the core directly and the shell end to end; then refactor with the tests holding, looping back to grow the program one working slice at a time and stopping when it is good enough (YAGNI).'
  - id: design-idea
    file: assets/design-idea.svg
    type: diagram
    title: 'What design buys'
    alt: 'Diagram: the four things good program design provides'
    description: 'A four-stage description of design benefits covering comprehension, testability, change and reuse.'
  - id: cohesion-coupling
    file: assets/cohesion-coupling.svg
    type: diagram
    title: 'Cohesion and coupling'
    alt: 'Diagram: the two properties that describe how well code is separated'
    description: 'A four-stage description of separation covering cohesion, coupling, the goal and the symptom.'
  - id: functional-core
    file: assets/functional-core.svg
    type: diagram
    title: 'Functional core, imperative shell'
    alt: 'Diagram: how pure logic is separated from effects at the edges'
    description: 'A four-stage description of the pattern covering the effects at the edge, the pure core, the return path and the testability.'
  - id: signatures-first
    file: assets/signatures-first.svg
    type: diagram
    title: 'Signatures first'
    alt: 'Diagram: designing the interface before the implementation'
    description: 'A four-stage description of signature-first design covering the names, the inputs and outputs, the docstring and the implementation.'
  - id: grow-incrementally
    file: assets/grow-incrementally.svg
    type: diagram
    title: 'Growing incrementally'
    alt: 'Diagram: the four steps of growing a program incrementally'
    description: 'A four-stage description of incremental growth covering the smallest version, the working state, the next need and the stopping point.'
  - id: design-not
    file: assets/design-not.svg
    type: diagram
    title: 'Four things design is not'
    alt: 'Diagram: four misconceptions about program design'
    description: 'A two-column comparison of misconceptions about design against what is true.'
  - id: design-history
    file: assets/design-history.svg
    type: diagram
    title: 'Four steps in design thinking'
    alt: 'Diagram: the historical progression of software design practice'
    description: 'A four-stage description of design history covering big up-front design, structured programming, patterns and incremental design.'
  - id: building-design
    file: assets/building-design.svg
    type: diagram
    title: 'Designing a building'
    alt: 'Diagram: deciding structure before detail compared with deciding detail first'
    description: 'A two-column comparison of structural decisions against detail decisions.'
  - id: design-implications
    file: assets/design-implications.svg
    type: diagram
    title: 'Four consequences of design'
    alt: 'Diagram: the change, testing, onboarding and over-engineering implications of design'
    description: 'A four-stage description of design implications covering change cost, testability, onboarding and over-engineering risk.'
  - id: design-when
    file: assets/design-when.svg
    type: diagram
    title: 'How much design'
    alt: 'Diagram: how much design investment a program warrants'
    description: 'A two-column comparison of programs warranting deliberate design against those that do not.'
