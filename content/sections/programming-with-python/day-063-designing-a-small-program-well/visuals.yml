visuals:
  - id: program-design
    file: assets/program-design.svg
    type: diagram
    title: 'Functional core, imperative shell'
    alt: 'Diagram: a well-designed small program — the outside world enters a thin imperative shell that does all I/O, wrapping a pure functional core of small single-responsibility functions, with results leaving as stdout, stderr, and an exit code, and tests calling the core directly'
    description: 'The outside world (a file, standard input, arguments) enters a thin imperative shell (summary.py) that performs all input and output. Inside the shell sits the pure functional core (summary_core.py) — parse_numbers, summarize, and format_summary — each a single-responsibility function with no I/O. Results leave through the shell as standard output, standard error, and an exit code. Tests point directly at the pure core, calling its functions with example values and checking the returns, with no files to set up and no output to capture.'
  - id: design-loop-flow
    file: assets/design-loop-flow.svg
    type: flowchart
    title: 'The design loop: spec to refactor'
    alt: 'Flowchart: the design loop for a small program — spec and examples, decompose into functions, design signatures and docstrings, implement the pure core, add the thin shell, test, then refactor and loop back to grow it incrementally'
    description: 'A seven-step loop: start from a spec and examples; decompose the work into small single-responsibility functions; design their signatures and docstrings before any body; implement the pure core; add the thin imperative shell for I/O; test the core directly and the shell end to end; then refactor with the tests holding, looping back to grow the program one working slice at a time and stopping when it is good enough (YAGNI).'
