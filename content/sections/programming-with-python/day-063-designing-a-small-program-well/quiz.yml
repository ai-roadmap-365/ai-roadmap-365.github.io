questions:
  - question: 'What is the recommended first step when designing a small program?'
    options:
      - 'Open an editor and start writing the main loop'
      - 'Choose a testing framework and a project template'
      - 'Write a one-sentence spec and two or three examples'
      - 'Add configuration options so the tool is flexible from the start'
    answer_index: 2
    explanation: 'Design starts from the problem, not the code: a one-sentence spec and a few concrete examples (including a bad input) give you a target to build toward and to check against, before any function body exists.'

  - question: 'In the "functional core, imperative shell" design, what belongs in the functional core?'
    options:
      - 'Only the main() entry point and the argument parser'
      - 'The code that opens files and reads command-line arguments'
      - 'Everything that prints to the screen and sets the exit code'
      - 'Pure functions that take values and return values'
    answer_index: 3
    explanation: 'The functional core is the pure logic: functions that take values in and return values out with no I/O and no side effects. All the reading, printing, files, and exit codes live in the thin imperative shell at the edges.'

  - question: 'Why is a pure functional core so easy to test?'
    options:
      - 'You can call it with a value and check what comes back'
      - 'Because the test framework skips functions that do I/O'
      - 'Because pure functions run faster than impure ones'
      - 'Because pure functions never raise exceptions'
    answer_index: 0
    explanation: 'A pure function has no I/O and no hidden state, so a test just calls it with an input and asserts on the return value. There is nothing to set up (no files) and nothing to capture (no printing) — the whole logic can be checked without running the program.'

  - question: 'You want high ____ and low ____ in a good decomposition.'
    options:
      - 'coupling; cohesion'
      - 'cohesion; coupling'
      - 'nesting; recursion'
      - 'coupling; nesting'
    answer_index: 1
    explanation: 'Cohesion (how well the parts inside one function belong together) should be high; coupling (how much functions depend on each other) should be low. High cohesion and low coupling is the classic definition of a good decomposition.'

  - question: 'What does "docstring-driven design" mean in this lesson?'
    options:
      - 'Generating documentation automatically after the code is written'
      - 'Replacing all comments with docstrings'
      - 'Writing each function''s name, arguments, and promise first'
      - 'Requiring a docstring on every line of code'
    answer_index: 2
    explanation: 'Docstring-driven design means deciding the interface first: the signature and the docstring contract come before the body. Fixing the seams between pieces before writing the parts is where the design actually happens, and it guarantees the parts fit.'

  - question: 'Which practice describes "make it work on the simplest case first, then grow, testing as you go"?'
    options:
      - 'Speculative generality'
      - 'Big-bang development'
      - 'Premature optimization'
      - 'Incremental development'
    answer_index: 3
    explanation: 'Incremental development builds and tests one small working slice at a time, so you are never far from a version you trust. Writing everything at once and testing at the end (big-bang) leaves you debugging blindly.'

  - question: 'A colleague adds three abstraction layers and a plugin system to a script that summarizes one file. Which principle warns against this?'
    options:
      - 'YAGNI ("you aren''t gonna need it")'
      - 'The single-responsibility principle'
      - 'Information hiding between modules'
      - 'Separation of concerns in design'
    answer_index: 0
    explanation: 'YAGNI says to build only what the spec asks for now. Adding machinery for futures that may never come is over-engineering — a design flaw that makes simple programs harder, just as costly as tangled code.'

  - question: 'How does this design approach connect to building maintainable AI systems?'
    options:
      - 'It does not; program design is unrelated to machine learning'
      - 'It splits a system into testable pieces, keeping logic from I/O'
      - 'It makes models more accurate by changing the training algorithm'
      - 'It replaces the need for testing by making the code shorter'
    answer_index: 1
    explanation: 'A maintainable AI system is not one script but separate single-responsibility pieces — data loading, model definition, training, serving — with pure logic kept apart from I/O. That separation is exactly the functional-core/single-responsibility habit, and it is what lets a project grow without collapsing.'
