slug: designing-a-small-program-well
title: 'Designing a Small Program Well'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to design a small program well: start from a spec and examples, decompose the work into small single-responsibility functions, separate a pure functional core from a thin imperative shell, design signatures and docstrings before bodies, grow the program in tested increments, and stop when it is good enough (YAGNI) instead of over-engineering it.'
objectives:
  - 'Start from a spec and concrete examples, then design function signatures and docstrings before writing any bodies (docstring-driven design)'
  - 'Decompose a program into small, single-responsibility functions with high cohesion and low coupling (separation of concerns)'
  - 'Separate a pure functional core (logic, no I/O) from a thin imperative shell (argv, files, stdout, exit code), and explain why the core is easy to test'
  - 'Develop incrementally: make the simplest case work, test it, then grow — never writing more than you can immediately check'
  - 'Recognise when a design is good enough versus over-engineered, applying YAGNI to build only what the spec asks'
  - 'Walk one small program end to end — spec, decompose, signatures, core, shell, test, refactor — and connect the approach to how maintainable AI systems (data, model, train, serve) are structured'
prerequisites:
  - 'Days 57-62 of this course: functions and return values, scope and *args/**kwargs, modules and imports, the standard library, readable code, and recursion'
  - 'Day 56: the shape of a data-driven program — named functions, a main(), exit codes, and validation at the boundary'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
