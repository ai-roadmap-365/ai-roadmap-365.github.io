terms:
  - term: separation of concerns
    definition: 'The design principle that each distinct aspect of a program — parsing, computing, formatting, input/output — should live in its own place, so you can think about, test, and change one concern without disturbing the others. Named by Edsger Dijkstra in 1974.'
  - term: single responsibility
    definition: 'The principle that a function or module should do one nameable thing and have one reason to change. A test of it: if you cannot describe what a function does in a single "it ..." sentence without an "and," it has more than one responsibility.'
  - term: cohesion
    definition: 'A measure of how well the parts inside one function or module belong together and serve a single purpose. High cohesion is good: everything inside summarize() is about computing the summary and nothing else.'
  - term: coupling
    definition: 'A measure of how much one function or module depends on another. Low coupling is good: functions that interact only through small, clear interfaces (values in, values out) can be changed and tested independently.'
  - term: interface
    definition: 'The visible contract of a piece of code — its name, parameters, return value, and the promises it makes (including how it fails) — as opposed to how it is implemented inside. Designing the interface first is where most of the design work happens.'
  - term: module boundary
    definition: 'The line between two parts of a program (often two files) across which they communicate only through a defined interface, each hiding its internal details from the other. Rooted in David Parnas''s 1972 idea of information hiding.'
  - term: functional core / imperative shell
    definition: 'A way of structuring a program so that all pure logic (values in, values out, no side effects) forms a testable core, while all input/output — files, arguments, printing, the network — is pushed to a thin outer shell. The name was popularised by Gary Bernhardt in 2012.'
  - term: docstring-driven design
    definition: 'Designing a function by writing its signature and docstring — the contract of what it takes, returns, and promises — before writing its body. Fixing the interface first ensures the pieces fit and turns each body into a small, well-targeted task.'
  - term: incremental development
    definition: 'Building a program one small, working, tested slice at a time — make the simplest case work, check it, then grow — so you are never far from a version you trust, instead of writing everything at once and debugging blindly at the end.'
  - term: YAGNI
    definition: 'Short for "You Aren''t Gonna Need It": build only what the current spec requires, and resist adding options, layers, or abstractions for futures that may never arrive. A guard against over-engineering, from the Extreme Programming movement of the late 1990s.'
  - term: testability
    definition: 'How easily a piece of code can be checked automatically. Pure functions are highly testable — a single call and an assertion suffice — which is the practical reason for keeping logic in a functional core and I/O in a thin shell.'
  - term: decomposition
    definition: 'The act of breaking a program''s work into smaller parts — functions and modules — each with a single responsibility and a clear interface. Good decomposition maximises cohesion within parts and minimises coupling between them.'
  - term: over-engineering
    definition: 'Adding more structure, configurability, or abstraction than the problem needs — the opposite failure from tangled code, and just as costly, because the extra machinery must be built, understood, and maintained forever. YAGNI is the habit that prevents it.'
