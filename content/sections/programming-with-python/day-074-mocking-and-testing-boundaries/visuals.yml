visuals:
  - id: boundaries-architecture
    file: assets/boundaries-architecture.svg
    type: diagram
    title: 'The core and its boundaries — where a test double attaches'
    alt: 'Diagram: the architecture of a testable program — a pure core in the middle holding the logic, surrounded by the five boundaries that make tests slow, flaky or non-deterministic (the clock, the network, the filesystem, randomness, and the environment and other processes), each one arriving as a parameter with a hand-written test double attached where the arrow enters the core'
    description: 'An architecture diagram drawn as a pure core inside a band labelled "the world — slow, unreliable, different every time, sometimes metered". The middle holds the pure core, report_v2.py, containing summarise, build_report and the DailyReport value, with the notes that it imports only datetime and dataclasses, that every boundary arrives as a parameter, and that it is therefore testable from an empty directory. Five boundary boxes surround it. Along the top: the clock (datetime.date.today, non-deterministic, injected as clock() and stubbed with frozen_clock); the network (client.fetch_readings, slow, flaky and sometimes billed, injected as a client and faked with FakeSensorClient); and the filesystem (Path.write_text, shared and stateful, removed entirely by returning a value an adapter writes). Along the bottom: randomness (random.random and uuid4, injected as a generator or seeded) and the environment and other processes (os.environ, subprocess and sleep, passed in as values or handled with monkeypatch at the edge). An arrow runs inward from every box to the core, and the legend states that each arrow is a value passed in, that the test attaches its double at the arrow head with no patching required, and that hard-coding a boundary instead leaves patch() and its unchecked target string as the only way in.'
  - id: patch-resolution-flow
    file: assets/patch-resolution-flow.svg
    type: flowchart
    title: 'How patch() resolves a target — and why the wrong one fails silently'
    alt: 'Flowchart: how patch resolves a target, step by step — at import time a from-import binds one function object to two names; patch splits its target string at the last dot and replaces an attribute on the named module; naming the module where the function was defined reaches nobody and the real function still runs, while naming the module that looks the name up replaces what the code under test actually calls; on exit the original attribute is always put back'
    description: 'A five-step vertical flow with one branch. Step one: at import time, report_v1.py executes "from sensor_service import fetch_readings", which copies a reference into report_v1''s own namespace. Step two: two names now point at one function object, and the code under test only ever looks up the second. Step three: patch("a.b.c") splits the string at the last dot, imports a.b, and calls setattr on it, requiring the attribute to already exist or raising AttributeError. Step four is a decision diamond asking which module you named, with two outgoing branches. The "defined" branch leads to patch("sensor_service.fetch_readings"): the attribute on sensor_service is replaced, report_v1 still holds the original reference, the real function runs, it takes 0.40 seconds and returns random values, no error is raised, and the test fails or worse passes by luck — the tell being that a stub is instant. The "looked up" branch leads to patch("report_v1.fetch_readings"): the attribute on report_v1 is replaced, the call inside report_v1 finds the double, it takes 0.00 seconds and returns the same values every run, and the test asserts what it meant to assert, provided the double was built with autospec. Both branches converge on step five: on exit from the with block or the decorated test, setattr puts the original object back even if the test raised, while patcher.start() with no stop() skips this and leaks into every later test. A closing note observes that if report_v1 had said "import sensor_service" instead, the two branches would swap places.'
