terms:
  - term: 'Boundary'
    definition: 'A place where code reaches outside its own process — the clock, the network, the filesystem, randomness, the environment, or another process. Every boundary makes a test slower, less reliable, or less predictable, and the six of them are the whole subject of this lesson.'
  - term: 'Test double'
    definition: 'Any object substituted for a real dependency during a test. The umbrella term was coined by Gerard Meszaros in xUnit Test Patterns (2007), explicitly by analogy with a stunt double, because "mock" had already been claimed for something narrower.'
  - term: 'Dummy'
    definition: 'A test double passed only to fill a parameter slot on a path that must never use it. A good dummy raises AssertionError if it is ever called, turning a silent assumption about which branch ran into a loud failure.'
  - term: 'Stub'
    definition: 'A test double that returns canned answers and records nothing. `frozen_clock(day)` returning `lambda: day` is a complete stub in one line; most tests need nothing more.'
  - term: 'Spy'
    definition: 'A test double that answers like a stub and additionally records how it was used, leaving the assertion to the test. A recording sleep collects the requested waits, so a retry test can prove the backoff schedule while nothing ever waits.'
  - term: 'Mock'
    definition: 'Strictly, a test double that carries an expectation and fails the test when the expectation is not met — in Python, any unittest.mock object you finish with assert_called_once_with. Colloquially the word is used for all five kinds of double, which is why conversations about mocking so often go wrong.'
  - term: 'Fake'
    definition: 'A real, working implementation, simplified: an in-memory repository instead of a database, a dictionary instead of a filesystem, a scripted client instead of a service. A fake answers the stub, spy and mock questions at once, in code a reader can understand without knowing a mocking library.'
  - term: 'Patching'
    definition: 'Temporarily rebinding a name inside another module so it points at your double, and putting it back afterwards. `patch("a.b.c")` splits at the last dot, imports `a.b`, and does the equivalent of setattr — it is setattr with an undo, and nothing more.'
  - term: 'Autospec'
    definition: 'Building a double by inspecting the real object, so it has exactly the real attributes with exactly the real signatures. `create_autospec(SomeClass)` or `patch(..., autospec=True)` refuses a misspelled method name and a call with arguments the real method would reject; `spec=` catches only the first of those.'
  - term: 'Side effect'
    definition: 'The unittest.mock attribute that decides what a call does beyond returning a fixed value. Assign a list and successive calls return successive elements; assign an exception and the call raises it — the best way to exercise error handling; assign a callable and it is invoked with the same arguments.'
  - term: 'Seam'
    definition: 'A place where a test can substitute one implementation for another without editing the code under test. A parameter is a seam checked by the interpreter and visible in the signature; a patch target is a seam expressed as a string that nothing checks until the test runs.'
  - term: 'Dependency injection'
    definition: 'Handing a piece of code its collaborators instead of letting it reach out for them — which in Python usually means nothing more elaborate than passing them as arguments. It is the alternative to mocking, and the one this lesson argues for, because it improves the design rather than working around it.'
  - term: 'Monkeypatch'
    definition: 'pytest''s fixture for setting and deleting environment variables, object attributes, the working directory and the import path, with every change undone automatically when the test ends. Smaller than unittest.mock — it sets values rather than building recording doubles — and safer where it fits.'
  - term: 'Contract test'
    definition: 'One set of assertions run against both a real dependency and the double that stands in for it, so the double cannot silently drift away from the thing it doubles. It is the honest fix for mocking what you do not own, and the real half is normally run deliberately rather than on every commit.'
  - term: 'Determinism'
    definition: 'The property that the same inputs always produce the same outputs. A test can only assert equality against a deterministic value, which is why the clock, randomness and a language model''s sampling must be replaced or injected before a meaningful assertion is possible.'
  - term: 'Flaky test'
    definition: 'A test that passes and fails on unchanged code. It is uniquely corrosive because it makes the correct response to a red build — stop and investigate — irrational: people rerun, then ignore, and eventually ignore a real failure too. A single unreliable dependency reached through a test is enough to start that spiral.'
