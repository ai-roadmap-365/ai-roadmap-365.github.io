slug: mocking-and-testing-boundaries
title: 'Mocking and Testing Boundaries'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to see the six boundaries that make a test slow, flaky or non-deterministic; name and write all five kinds of test double; use unittest.mock properly — return_value, side_effect, call_args, the assertion helpers, and spec/autospec; aim patch at the name a module looks up rather than where the function was defined; use pytest''s monkeypatch for environment variables, attributes and the working directory; and — the real point — refactor a function so its boundaries arrive as parameters, so the logic can be tested with hand-written fakes, no patching, and no files present at all.'
objectives:
  - 'Identify the six boundaries a unit test must not cross — the clock, the network, the filesystem, randomness, the environment, and other processes — and say for each whether it makes a test slow, non-deterministic, or both'
  - 'Distinguish the five kinds of test double (dummy, stub, spy, mock, fake), write each one by hand in a few lines, and explain why everyday speech calls all five "mock"'
  - 'Use unittest.mock in depth: Mock versus MagicMock, return_value, side_effect for sequences, exceptions and callables, call_args and call_args_list, and the assert_called_* family'
  - 'Demonstrate why an un-specced Mock is dangerous — it accepts a misspelled method name so a test passes while production raises AttributeError — and fix it with spec= and create_autospec, including the signature mistake only autospec catches'
  - 'Aim patch at where a name is looked up rather than where it was defined, explain how the import style decides the target, and use patch as a decorator, a context manager and via pytest''s monkeypatch fixture with its automatic undo'
  - 'Refactor a function so the clock, the client and the sleep arrive as parameters, and test the result with hand-written fakes — no patching, no fixtures, and the core running from an empty directory as Day 70''s domain core did'
  - 'Recognise and avoid the three anti-patterns — mocking what you do not own, asserting on call sequences, and the mock-heavy suite that is green while the system is broken — and use a contract test as the honest fix for the first'
  - 'Test code that calls a language model without calling one: inject the model at a boundary, script its replies, and assert deterministically on your prompt building, parsing, retry and error handling, leaving the model''s behaviour to a separate evaluation suite'
prerequisites:
  - 'Day 71: what a test is, writing assertions, running pytest and reading its output and exit code'
  - 'Day 72: fixtures and parametrization — tmp_path and monkeypatch in particular'
  - 'Day 73: test-driven development, and the habit of writing the failing test first'
  - 'Day 70: the pure domain core, the adapter ring, and the proof by running the core from an empty directory — the architecture this lesson applies to testing'
  - 'Day 66 (exception hierarchies), Day 69 (dataclasses and type hints), and Day 43 (creating a virtual environment)'
