questions:
  - question: 'A module begins with `from sensor_service import fetch_readings` and calls `fetch_readings(...)`. Which patch target replaces the function the code actually calls?'
    options:
      - 'patch("report_v1.fetch_readings") — the name in the module that looks it up'
      - 'patch("sensor_service.fetch_readings") — the module where the function is defined'
      - 'Either works, because both names refer to the same function object'
      - 'Neither; a from-import cannot be patched and the code must be changed first'
    answer_index: 0
    explanation: '`patch("a.b.c")` splits at the last dot and does the equivalent of `setattr(a.b, "c", double)`. The from-import ran once at import time and copied a reference into `report_v1`, so `report_v1.fetch_readings` is the name the call looks up. Patching `sensor_service` succeeds and reaches nobody — the real, slow, random function still runs, and the tell is that a "unit test" suddenly takes 0.4 seconds. If the module had said `import sensor_service` instead, the answer would flip.'

  - question: 'What does a bare `Mock()` do when the code under test calls `client.fetch_radings(...)` — a method the real class does not have?'
    options:
      - 'It raises AttributeError, matching what the real object would do'
      - 'It invents the attribute, so the test passes and production fails'
      - 'It emits a warning and returns None'
      - 'It fails only if the test later calls an assert_ method on it'
    answer_index: 1
    explanation: 'This is the most expensive mistake in the subject. A bare Mock answers yes to every question: any attribute you touch is created on demand. A test author who reads the buggy code and stubs the same misspelled name gets a green test, while the first production request raises `AttributeError: ''SensorClient'' object has no attribute ''fetch_radings''`. The fix costs one line: `create_autospec(SensorClient, instance=True)`. Note the one exception — a misspelled `assert_` method does raise, because Python special-cases it.'

  - question: 'What extra protection does `create_autospec(SomeClass)` give over `Mock(spec=SomeClass)`?'
    options:
      - 'It records call arguments, which spec= does not'
      - 'It automatically undoes itself at the end of the test'
      - 'It also checks each call''s signature, raising TypeError'
      - 'It makes the double raise on any call that was not configured in advance'
    answer_index: 2
    explanation: '`spec=` restricts which attributes exist; a call with a keyword the real method has never heard of still sails through. `create_autospec` (and `patch(..., autospec=True)`) builds the double by inspecting the real object, so `fetch_readings("ALPHA")` gives `TypeError: missing a required argument: ''day''` and `retries=3` gives `TypeError: got an unexpected keyword argument ''retries''`. Both variants record calls, and neither has anything to do with teardown.'

  - question: 'You assign a list to `side_effect` and the mock raises `StopIteration`. What has happened?'
    options:
      - 'The list contained a value the mock could not serialise'
      - 'side_effect only accepts exceptions, never lists'
      - 'The patch leaked out of its block and was reused by a later test'
      - 'The code called the double more times than you scripted'
    answer_index: 3
    explanation: 'A list assigned to `side_effect` is consumed one element per call, which is how you script a sequence of responses. Running out raises `StopIteration`, and that is a message about the code under test rather than a defect in the double — usually a retry loop running more times than you expected. Count the calls with `call_count` and script that many. `side_effect` also accepts an exception (raised) and a callable (invoked with the same arguments).'

  - question: 'Which double records how it was used but leaves the assertion to the test that created it?'
    options:
      - 'A spy'
      - 'A stub'
      - 'A dummy'
      - 'A mock'
    answer_index: 0
    explanation: 'A spy answers like a stub and keeps a record — `RecordingSleep` collects the requested waits, so a retry test can assert `waits == [0.5, 1.0]` while nothing ever sleeps. A mock also records, but carries the expectation itself and fails at the moment of the mismatch. A stub answers and remembers nothing; a dummy exists to fill an argument slot and should raise loudly if it is ever called.'

  - question: 'Why does this lesson argue that a hand-written fake is often better than a mock?'
    options:
      - 'A fake runs faster, because mocks add measurable overhead per call'
      - 'A fake asserts on results, so it survives refactors'
      - 'A fake is checked by the type system, so mistakes are caught before the test runs'
      - 'A fake cannot drift away from the real dependency, whereas a mock can'
    answer_index: 1
    explanation: 'A fifteen-line fake answers the stub question (what does it return?), the spy question (what was it asked?) and the mock question (was it called correctly?) at once, in ordinary Python anyone can read. Because the tests then assert on the value that came out rather than on the sequence of calls, an internal refactor does not turn them red. Speed is not the reason, and nothing here is type-checked. Note the honest caveat: a fake CAN drift from the real dependency, which is exactly what a contract test is for.'

  - question: 'Why does pytest''s `monkeypatch` fixture need no teardown code?'
    options:
      - 'It only changes values that Python restores automatically at the end of a module'
      - 'It copies the whole process environment and restores it after the whole session'
      - 'It records every change and undoes them at teardown'
      - 'It applies changes to a sandboxed copy, so the real objects were never modified'
    answer_index: 2
    explanation: '`monkeypatch` keeps a list of the changes it made — `setenv`, `delenv`, `setattr`, `delattr`, `chdir`, `syspath_prepend` — and reverses them during teardown, at the end of the test that used it. Nothing in Python restores it for you, and the real objects genuinely are modified for the duration. That automatic undo is why it is safer than `patcher.start()` without a matching `stop()`, which leaks into every later test.'

  - question: 'You are unit-testing a function that sends a prompt to a language model. Which assertion does NOT belong in that unit test?'
    options:
      - 'That a malformed reply causes exactly one retry with the same prompt'
      - 'That the prompt contains the station name and the mean from the report'
      - 'That a confidence value outside 0.0 to 1.0 is refused with a clear error'
      - 'That the model classifies a 17.0-degree day as "mild" rather than "cold"'
    answer_index: 3
    explanation: 'The first three are your code — prompt building, retry policy, and parsing — and all are deterministic, free, and testable in milliseconds against a scripted stand-in. The fourth is a claim about the model''s behaviour, which is slow, metered, and different on every call; asserting it in a unit test produces a flaky suite that fails for reasons nobody controls. That question is real and belongs in an evaluation suite: run deliberately, against a dataset, reporting a score rather than pass or fail.'
