<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Once, or before every experiment.">
  <title>Preparing a workspace</title>
  <style>
    .lab-setup-bg   { fill: #f8fafc; }
    .lab-setup-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-setup-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-setup-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-setup-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-setup-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lab-setup-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lab-setup-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lab-setup-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lab-setup-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lab-setup-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lab-setup-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lab-setup-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lab-setup-row { opacity: 1; }
    .lab-setup-r0 { animation-delay: 0.00s; }
    .lab-setup-r1 { animation-delay: 0.45s; }
    .lab-setup-r2 { animation-delay: 0.90s; }
    .lab-setup-r3 { animation-delay: 1.35s; }
    .lab-setup-r4 { animation-delay: 1.80s; }
    .lab-setup-row { animation: lab-setup-reveal 7.3s ease-in-out infinite; }
    @keyframes lab-setup-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lab-setup-bg" width="980" height="390"/>
  <text class="lab-setup-h1"  x="30" y="40">Preparing a workspace</text>
  <text class="lab-setup-sub" x="30" y="64">Once, or before every experiment.</text>
  <rect class="lab-setup-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lab-setup-name" x="46" y="122">Fresh each time</text>
  <text class="lab-setup-desc" x="46" y="142">Slower, and clean.</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r0" x="46" y="182">Clean surface for every experiment</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r1" x="46" y="216">No contamination from the last</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r2" x="46" y="250">Slower to set up repeatedly</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r3" x="46" y="284">Results are independent</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r4" x="46" y="318">This is function scope</text>
  <rect class="lab-setup-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lab-setup-name" x="526" y="122">Prepared once</text>
  <text class="lab-setup-desc" x="526" y="142">Faster, and shared.</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r0" x="526" y="182">One preparation for the session</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r1" x="526" y="216">Residue from earlier work remains</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r2" x="526" y="250">Much faster overall</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r3" x="526" y="284">Results can influence each other</text>
  <text class="lab-setup-desc lab-setup-row lab-setup-r4" x="526" y="318">This is session scope</text>
  <text class="lab-setup-sub" x="30" y="372">Contamination between experiments is exactly what order-dependent test failures are, and the remedy in both settings is a fresh surface.</text>
</svg>
