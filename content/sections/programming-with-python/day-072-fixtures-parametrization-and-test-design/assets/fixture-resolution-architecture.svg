<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of fixture resolution: three layers of conftest.py — the project root, the tests package, and the test module itself — each contributing named fixtures to a registry, with a test function's parameter names resolved against that registry from the nearest layer outward, and each fixture carrying one of the four scopes that decide how often its body runs</title>
  <rect x="0" y="0" width="880" height="620" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How a parameter name becomes a fixture</text>
  <text x="440" y="57" text-anchor="middle" font-size="14" fill="#1a202c">pytest searches upward from the test file; the nearest definition wins</text>

  <!-- Layer 3: root conftest -->
  <rect x="40" y="78" width="380" height="122" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="60" y="102" font-size="15" font-weight="bold" fill="#1a202c">tests/conftest.py — outermost layer</text>
  <text x="60" y="124" font-size="14" fill="#1a202c">visible to every test file below it</text>
  <text x="60" y="150" font-size="14" fill="#1d4ed8">sample_sessions   scope=session</text>
  <text x="60" y="172" font-size="14" fill="#1d4ed8">store_path   scope=function</text>
  <text x="60" y="192" font-size="14" fill="#1a202c">built on the built-in tmp_path</text>

  <!-- Layer 2: package conftest -->
  <rect x="70" y="212" width="350" height="112" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="90" y="236" font-size="15" font-weight="bold" fill="#1a202c">tests/store/conftest.py — directory layer</text>
  <text x="90" y="258" font-size="14" fill="#1a202c">visible only inside this directory</text>
  <text x="90" y="284" font-size="14" fill="#1d4ed8">empty_store   scope=function</text>
  <text x="90" y="306" font-size="14" fill="#1d4ed8">loaded_store   scope=function</text>

  <!-- Layer 1: module -->
  <rect x="100" y="336" width="320" height="112" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="10"/>
  <text x="120" y="360" font-size="15" font-weight="bold" fill="#1a202c">test_store.py — the module itself</text>
  <text x="120" y="382" font-size="14" fill="#1a202c">a fixture here is visible only here</text>
  <text x="120" y="408" font-size="14" fill="#1d4ed8">audited_store   scope=function</text>
  <text x="120" y="430" font-size="14" fill="#1a202c">plus every built-in pytest ships</text>

  <!-- Built-ins -->
  <rect x="40" y="464" width="380" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="60" y="488" font-size="15" font-weight="bold" fill="#1a202c">Built in — always available, never defined</text>
  <text x="60" y="512" font-size="14" fill="#1d4ed8">tmp_path   a fresh empty directory per test</text>
  <text x="60" y="534" font-size="14" fill="#1d4ed8">capsys   captured stdout and stderr</text>
  <text x="60" y="556" font-size="14" fill="#1d4ed8">monkeypatch   changes that undo themselves</text>
  <text x="60" y="576" font-size="14" fill="#1a202c">list them all with pytest --fixtures</text>

  <!-- Registry -->
  <rect x="470" y="78" width="370" height="180" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="10"/>
  <text x="655" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The fixture registry for this file</text>
  <text x="490" y="130" font-size="14" fill="#1a202c">one flat table of name to factory,</text>
  <text x="490" y="152" font-size="14" fill="#1a202c">assembled from every layer above</text>
  <text x="490" y="180" font-size="14" fill="#1d4ed8">name  -&gt;  function + scope</text>
  <text x="490" y="204" font-size="14" fill="#1d4ed8">a nearer layer shadows a farther one</text>
  <text x="490" y="228" font-size="14" fill="#1a202c">an unknown name is an error, never</text>
  <text x="490" y="248" font-size="14" fill="#1a202c">a silently missing argument</text>

  <!-- Test function -->
  <rect x="470" y="286" width="370" height="150" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="655" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The test that asks</text>
  <text x="490" y="340" font-size="14" fill="#1a202c">def test_topics(loaded_store, capsys):</text>
  <text x="490" y="366" font-size="14" fill="#1d4ed8">parameter names ARE the request</text>
  <text x="490" y="390" font-size="14" fill="#1a202c">no import, no decorator, no self</text>
  <text x="490" y="414" font-size="14" fill="#1a202c">rename the parameter and the test breaks</text>

  <!-- Scope panel -->
  <rect x="470" y="464" width="370" height="118" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="10"/>
  <text x="655" y="488" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Scope decides how often the body runs</text>
  <text x="490" y="512" font-size="14" fill="#1d4ed8">function  once per test  (the default)</text>
  <text x="490" y="534" font-size="14" fill="#1d4ed8">class  once per test class</text>
  <text x="490" y="554" font-size="14" fill="#1d4ed8">module  once per test file</text>
  <text x="490" y="574" font-size="14" fill="#1d4ed8">session  once per pytest run</text>

  <!-- Arrows: layers into registry -->
  <line x1="420" y1="139" x2="464" y2="139" stroke="#1a202c" stroke-width="2"/>
  <polygon points="470,139 456,133 456,145" fill="#1a202c"/>
  <line x1="420" y1="268" x2="450" y2="268" stroke="#1a202c" stroke-width="2"/>
  <line x1="450" y1="268" x2="450" y2="170" stroke="#1a202c" stroke-width="2"/>
  <polygon points="450,164 444,178 456,178" fill="#1a202c"/>
  <line x1="420" y1="392" x2="440" y2="392" stroke="#1a202c" stroke-width="2"/>
  <line x1="440" y1="392" x2="440" y2="200" stroke="#1a202c" stroke-width="2"/>
  <polygon points="440,194 434,208 446,208" fill="#1a202c"/>
  <line x1="420" y1="523" x2="430" y2="523" stroke="#1a202c" stroke-width="2"/>
  <line x1="430" y1="523" x2="430" y2="230" stroke="#1a202c" stroke-width="2"/>
  <polygon points="430,224 424,238 436,238" fill="#1a202c"/>

  <!-- Arrow: test asks registry -->
  <line x1="655" y1="286" x2="655" y2="264" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="655,258 649,272 661,272" fill="#1d4ed8"/>
  <text x="668" y="278" font-size="14" fill="#1d4ed8">resolved by name</text>

  <!-- Arrow: registry to scope -->
  <line x1="655" y1="436" x2="655" y2="458" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="655,464 649,450 661,450" fill="#1d4ed8"/>
</svg>
