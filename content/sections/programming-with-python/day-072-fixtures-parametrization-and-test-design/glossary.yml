terms:
  - term: 'Fixture'
    definition: 'A function decorated with @pytest.fixture that produces something a test needs. It is the arrange step, extracted and given a name; a test uses it by writing that name as one of its parameters. Fixtures compose — one can request another — and only the tests that ask for a fixture pay for it.'
  - term: 'Fixture scope'
    definition: 'How often a fixture body actually runs: function (once per test, the default), class (once per test class), module (once per test file), or session (once per pytest run). Scope is not documentation but an observable count, and the rule for widening it is mutability, not speed.'
  - term: 'conftest.py'
    definition: 'A file pytest finds by location rather than by import, whose fixtures become available to every test file in that directory and below. Nearer definitions shadow farther ones, and visibility flows downward only, so a fixture in a subdirectory is invisible above it. It is executable code that runs automatically before any test.'
  - term: 'Dependency injection'
    definition: 'A design in which a component declares what it needs and something else supplies it, rather than constructing its own dependencies. pytest''s version is unusual in that the key is an identifier in a function signature: the parameter name is the request, which is why fixtures need no configuration and why a misspelled name is an error rather than a None.'
  - term: 'Teardown'
    definition: 'Cleanup that runs after a test: closing a handle, removing a directory, restoring a setting. In pytest it is the code after a fixture''s yield, and pytest runs it whether the test passed, failed, or raised — which is precisely what cleanup at the end of a test body cannot promise.'
  - term: 'Yield fixture'
    definition: 'A fixture written as a generator: everything before the yield is setup, the yielded value is what the test receives, and everything after it is teardown. Since pytest 3.0 this is the ordinary way to write any fixture that needs cleanup.'
  - term: 'Parametrization'
    definition: 'Supplying one test function with several sets of arguments via @pytest.mark.parametrize, so that pytest expands it at collection time into one independent test item per set. It is not a loop: N cases become N items that each run to completion and each report separately.'
  - term: 'Test id'
    definition: 'The name pytest gives a collected test item — the file, the function, and for a parametrized case a label in square brackets, as in test_refuses_a_bad_value[minutes-zero]. Ids are what -k matches against and what a failure report names, which is why hand-written ids= labels are worth the typing.'
  - term: 'Marker'
    definition: 'A label attached to a test with @pytest.mark.<name>. A marker does nothing by itself; it exists so that -m can select or deselect the tests carrying it. Markers should be registered in configuration, and with --strict-markers a mistyped one becomes an error instead of a silent no-op.'
  - term: 'xfail'
    definition: 'A marker recording that a test is expected to fail, with a written reason. The test still runs, is reported as xfailed rather than failed, and does not turn the suite red. With strict=True, an unexpected pass fails the run — so the day somebody fixes the gap, the stale marker cannot survive unnoticed.'
  - term: 'tmp_path'
    definition: 'A built-in pytest fixture that hands a test a fresh, empty pathlib.Path directory unique to that test, retained for the last few runs so a failure can be inspected. It is a security control as much as a convenience: a test that writes to a hard-coded path can clobber real data or collide with a parallel run.'
  - term: 'monkeypatch'
    definition: 'A built-in pytest fixture that changes something about the environment — an environment variable, an attribute, a dictionary entry — for the duration of one test and undoes it afterwards. The automatic undo is containment, not tidiness: a hand-rolled patch survives the test that made it and can silently change what a later test talks to.'
  - term: 'Test pyramid'
    definition: 'Mike Cohn''s 2009 model of a suite: many fast unit tests at the base, fewer service tests above, very few slow end-to-end tests at the top. Its economics are real and its shape is contested — critics note that all-green unit tests can sit on top of broken wiring, and that cheap in-memory integration tests justify a much fatter middle layer.'
  - term: 'Test independence'
    definition: 'The property that every test gives the same answer whether it runs alone, first, last, or in a shuffled order. It is violated almost entirely by accident, through shared mutable state introduced to make a suite faster. Suppressing an order-shuffling plugin because it turns the suite red hides the defect rather than fixing it.'
  - term: 'Cross product'
    definition: 'The set of all combinations of two or more lists of values, produced by stacking @pytest.mark.parametrize decorators — three topics and three durations give nine test items. Worth reaching for when the *combination* is what might break, and worth avoiding when it multiplies into a hundred items that all say the same thing.'
