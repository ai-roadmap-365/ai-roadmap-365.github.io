visuals:
  - id: fixture-resolution-architecture
    file: assets/fixture-resolution-architecture.svg
    type: diagram
    title: 'How a parameter name becomes a fixture'
    alt: 'Diagram: how a parameter name becomes a fixture — three conftest.py layers from the project root down to the test module, each contributing named fixtures to a registry, the built-in fixtures pytest always provides, a test function whose parameter names are the request, and the four scopes that decide how often each fixture body runs'
    description: 'A layered architecture drawn as a left column of nested definition sites feeding a right column of resolution. On the left, three progressively indented boxes show the conftest.py layers: the outermost tests/conftest.py contributing sample_sessions at session scope and store_path at function scope; tests/store/conftest.py, visible only inside that directory, contributing empty_store and loaded_store; and test_store.py itself, whose fixtures are visible only there, contributing audited_store. Below them sits a box of built-in fixtures pytest always provides — tmp_path, capsys and monkeypatch — with the note that pytest --fixtures lists them all. On the right, arrows from every layer converge on the fixture registry for that file: one flat table of name to factory and scope, assembled from every layer, in which a nearer layer shadows a farther one and an unknown name is an error rather than a silently missing argument. Below the registry, a test function box shows that the parameter names in def test_topics(loaded_store, capsys) are themselves the request — no import, no decorator, no self — and that renaming a parameter breaks the test. A final panel lists the four scopes and what each one counts: function once per test and the default, class once per test class, module once per test file, session once per pytest run.'
  - id: parametrize-expansion-flow
    file: assets/parametrize-expansion-flow.svg
    type: flowchart
    title: 'One function in, N independent tests out'
    alt: 'Flowchart: one parametrized test function expanding into six independent test items — what you write, collection pairing every case with the body, the six named items, each running alone with fresh fixtures, and each reported separately so one failing case does not hide the other five'
    description: 'A five-step vertical flow following one parametrized test from source to report. Step one shows what you write: a single @pytest.mark.parametrize decorator naming three parameters, a list of cases and an ids list, above a single test function body that contains no loop. Step two is collection, where pytest pairs every case with the body, turning six tuples of values and one function into six separate test items, each given an id made of the function name plus its label from ids — visible without running anything via pytest --collect-only -q. Step three shows the six resulting items laid out in a grid by their real ids: ref-without-prefix, ref-too-short, topic-not-lower-case, topic-padded, minutes-zero drawn with a heavier border because it is the case that fails when the implementation is damaged, and minutes-over-the-cap. Step four shows each item running alone through fresh fixtures, arrange, act, assert and teardown, with a function-scoped fixture rebuilt for every one of the six so that nothing one case does can be seen by the next. Step five is the report: one failed and thirty-eight passed, with the failure naming minutes-zero while the other five cases still ran.'
