questions:
  - question: 'How does pytest decide which fixture to hand a test function?'
    options:
      - 'By matching the name of a test parameter against the names of registered fixtures'
      - 'By matching the type annotation on the test parameter against each fixture''s return type'
      - 'By running every fixture defined in the nearest conftest.py before each test'
      - 'By reading the imports at the top of the test module'
    answer_index: 0
    explanation: 'The lookup key is a plain Python identifier: the parameter name in the test signature must equal the fixture function''s name. That is why you never import a fixture, why a typo produces `fixture ''x'' not found` rather than a silent None, and why fixture names are effectively part of your suite''s interface. Type annotations play no part, and — unlike setUp — a fixture runs only for tests that actually request it.'

  - question: 'A fixture builds a mutable object that is expensive to create. What is the correct reason to leave it at the default function scope?'
    options:
      - 'Function scope is faster, because pytest can cache the result more aggressively'
      - 'A wider scope would share one mutable object between tests, so a test''s result could depend on which tests ran before it'
      - 'Only function-scoped fixtures are allowed to request other fixtures'
      - 'Session-scoped fixtures cannot use yield, so teardown would be impossible'
    answer_index: 1
    explanation: 'Mutability is the deciding test, not cost. Widening a scope shares one object across tests, and the moment a test can change it, results start depending on execution order — the exact defect that makes a suite untrustworthy. Speed is a reason to *want* a wider scope; immutability is the only thing that makes one *safe*. Fixtures of every scope can compose and can use yield.'

  - question: 'A colleague replaces five near-identical tests with one test containing a for loop over five inputs. What have they lost?'
    options:
      - 'Nothing of substance — the assertions are identical, so the coverage is the same'
      - 'The ability to use fixtures, since a loop and a fixture cannot appear in the same test'
      - 'Only the readability of the source; the report is unchanged'
      - 'Four independent results: the loop stops at the first failure and reports one broken test, with no information about the inputs it never reached'
    answer_index: 3
    explanation: 'A loop produces one test item. When the second input fails, the loop raises, and inputs three, four and five never run — so you learn that "the test" is broken and nothing about the rest. Parametrization produces five items that each run to completion and each report by id. You can see the difference before running anything: `pytest --collect-only -q` prints 5 for the parametrized version and 1 for the loop.'

  - question: 'What does the `ids=` argument to @pytest.mark.parametrize change?'
    options:
      - 'It selects which of the listed cases actually run'
      - 'It changes the order the cases are executed in'
      - 'It replaces the auto-generated labels in each test id with names you chose, so failures are self-describing'
      - 'It registers the cases as markers so they can be selected with -m'
    answer_index: 2
    explanation: 'Each expanded item is named `function[label]`. Without `ids=`, pytest derives the label from the values where it can and falls back to `[ref0]`, `[ref1]` where it cannot — so a failure report reads `[ref4]`, which tells you nothing until you go and count entries in a list. With `ids=`, it reads `[minutes-zero]`. The suite runs identically either way; only the report changes, and the report is most of the value.'

  - question: 'Two stacked @pytest.mark.parametrize decorators, one with 3 values and one with 4, produce how many test items?'
    options:
      - '7, because the two lists are concatenated'
      - '12, because stacking produces the cross product of the two lists'
      - '4, because the outer decorator overrides the inner one'
      - '1, because a single function can only ever be one test item'
    answer_index: 1
    explanation: 'Stacking multiplies: every value from one decorator is combined with every value from the other, so 3 and 4 give 12 items. The bottom decorator''s parameter varies slowest and appears first in the id. This is powerful and easy to overuse — three stacked lists of five values is 125 items from a dozen lines. Use the cross product when the *combination* is what might break; otherwise list hand-chosen tuples.'

  - question: 'Why does teardown written after a `yield` in a fixture matter more than cleanup written at the end of the test body?'
    options:
      - 'Because pytest runs it whether the test passed, failed, or raised, while code at the end of a failing test body is skipped'
      - 'Because code after yield runs before the test, so the resource is ready earlier'
      - 'Because only yield fixtures are allowed to touch the file system'
      - 'Because it makes the fixture eligible for session scope'
    answer_index: 0
    explanation: 'A failing assertion raises, so anything below it in the test body never executes — which leaves the temporary directory, the open handle or the changed environment variable behind, and the *next* test then fails for reasons unrelated to itself. Everything after `yield` is teardown and pytest runs it regardless of outcome. You can watch this in the lab: the function-scoped fixture prints four setup lines and four teardown lines, and the fourth test is the one that fails on purpose.'

  - question: 'You add @pytest.mark.slwo to a test by mistake. What does --strict-markers do about it?'
    options:
      - 'It silently registers the new marker so the run continues'
      - 'It renames the marker to the closest registered one'
      - 'It runs the test but excludes it from every -m selection'
      - 'It fails the run, because the marker is not listed in the markers section of the configuration'
    answer_index: 3
    explanation: 'Without strict markers, an unregistered marker is only a warning — so `@pytest.mark.slwo` marks nothing, `pytest -m slow` quietly collects zero tests, and the run reports success while exercising nothing. `--strict-markers` turns that into an error at collection time. The general principle is worth carrying beyond pytest: a warning inside a hundred lines of output is a warning nobody reads.'

  - question: 'When is a plain helper function the better choice than a fixture?'
    options:
      - 'Whenever the arrangement involves a file, since fixtures cannot touch the file system'
      - 'When it is used by one test, takes arguments that differ per test, and reading it beside the assertion is what matters most'
      - 'Never — a fixture is always the more idiomatic pytest answer'
      - 'Only in unittest-style test classes, where fixtures are unavailable'
    answer_index: 1
    explanation: 'A fixture used by exactly one test is a helper function with its definition moved to another file and its call replaced by a parameter name — indirection with nothing to show for it. Prefer a fixture when several files need the arrangement, when there is teardown, when it must compose, or when it needs a scope. Prefer a helper when it is local, parameterised per test, or when a reader''s ability to see the setup beside the assertion is the most valuable property of the test. Over-fixturing is genuinely worse than the duplication it removes, because nobody can tell what a test sets up.'
