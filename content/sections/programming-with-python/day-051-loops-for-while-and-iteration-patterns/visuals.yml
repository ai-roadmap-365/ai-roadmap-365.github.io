visuals:
  - id: iteration-model
    file: assets/iteration-model.svg
    type: diagram
    title: 'The iteration model: iterable, iterator, loop body'
    alt: 'Diagram: the iteration model — an iterable produces an iterator that hands one item at a time to the loop body, shown for a for loop and compared with a while loop'
    description: 'Two panels. The top panel shows a for loop: an iterable (a list) has iter() called on it to produce an iterator, which on each next() call hands one item to the loop body; an arrow loops back to fetch the next item until the iterator is exhausted, ending the loop. The bottom panel shows a while loop: a condition is checked, the body runs and makes progress, then the condition is re-checked, looping until it becomes false and the loop ends.'
  - id: loop-control-flow
    file: assets/loop-control-flow.svg
    type: flowchart
    title: 'Loop control flow: break, continue, and else'
    alt: 'Flowchart: control flow inside one loop showing where continue jumps back, where break exits, and how the else clause runs only when the loop finishes without breaking'
    description: 'A single loop traced top to bottom: a decision asks whether another item exists; if none remain the flow enters the else block. If an item exists, a continue decision can jump back to the top for the next item; otherwise the body does its work, then a break decision can either loop back for more items or exit the loop entirely, skipping the else block. The break exit arrow leaps past the else, while natural exhaustion flows into it.'
