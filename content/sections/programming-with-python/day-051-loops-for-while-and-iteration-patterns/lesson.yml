title: 'Loops: for, while, and Iteration Patterns'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to choose between a for loop and a while loop, walk any iterable, use range, enumerate, and zip, control a loop with break, continue, and the loop-else clause, and apply the five core iteration patterns — accumulate, filter, transform, search, and nest — while avoiding infinite loops and off-by-one errors.'
objectives:
  - 'Choose correctly between a for loop (definite iteration over a collection) and a while loop (indefinite iteration until a condition is false), and state the progress responsibility a while loop places on you'
  - 'Explain the iteration model — an iterable produces an iterator that hands one item at a time to the loop body — and why the same for loop works over lists, strings, ranges, and files'
  - 'Use range, enumerate, and zip idiomatically instead of hand-managing an index with range(len(...))'
  - 'Control a loop with break (exit now), continue (skip this pass), and the loop-else clause (runs only when no break happened), and place a search-and-report loop correctly'
  - 'Apply the five iteration patterns — accumulate a running result, filter, transform, search with early exit, and nested loops — and trace an accumulator step by step'
  - 'Reason about loop cost with the outer-times-inner rule, and avoid infinite loops and off-by-one errors'
  - 'Connect iteration to AI practice: training epochs and batches, data-pipeline passes, and agent step-loops are all loops'
prerequisites:
  - 'Days 43-50 of this course: a working Python 3 install, variables and types, strings, numbers, input/output, reading error messages, program structure, and conditionals with boolean logic'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
