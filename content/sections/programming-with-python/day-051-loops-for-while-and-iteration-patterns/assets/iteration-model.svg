<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>The iteration model: an iterable produces an iterator, which hands one item at a time to the loop body, shown for a for loop and compared with a while loop</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How a loop sees your data</text>

  <!-- FOR loop panel -->
  <text x="30" y="76" font-size="16" font-weight="bold" fill="#1d4ed8">for loop — walk a known collection</text>

  <!-- iterable -->
  <rect x="30" y="92" width="150" height="96" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="105" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Iterable</text>
  <text x="105" y="136" text-anchor="middle" font-size="14" fill="#1a202c">[10, 20, 30]</text>
  <text x="105" y="156" text-anchor="middle" font-size="14" fill="#1a202c">a list, string,</text>
  <text x="105" y="174" text-anchor="middle" font-size="14" fill="#1a202c">range, file…</text>

  <line x1="180" y1="140" x2="222" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="222,140 210,134 210,146" fill="#1a202c"/>
  <text x="201" y="130" text-anchor="middle" font-size="13" fill="#1a202c">iter()</text>

  <!-- iterator -->
  <rect x="224" y="92" width="150" height="96" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="299" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Iterator</text>
  <text x="299" y="136" text-anchor="middle" font-size="14" fill="#1a202c">remembers the</text>
  <text x="299" y="154" text-anchor="middle" font-size="14" fill="#1a202c">place; next()</text>
  <text x="299" y="172" text-anchor="middle" font-size="14" fill="#1a202c">yields one item</text>

  <line x1="374" y1="140" x2="416" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="416,140 404,134 404,146" fill="#1a202c"/>
  <text x="395" y="130" text-anchor="middle" font-size="13" fill="#1a202c">next()</text>

  <!-- loop body -->
  <rect x="418" y="92" width="150" height="96" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="493" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Loop body</text>
  <text x="493" y="136" text-anchor="middle" font-size="14" fill="#1a202c">runs once per</text>
  <text x="493" y="154" text-anchor="middle" font-size="14" fill="#1a202c">item, with item</text>
  <text x="493" y="172" text-anchor="middle" font-size="14" fill="#1a202c">bound to a name</text>

  <!-- loop-back arrow -->
  <path d="M 493 188 L 493 214 L 299 214 L 299 190" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="299,190 293,202 305,202" fill="#1d4ed8"/>
  <text x="396" y="232" text-anchor="middle" font-size="13" fill="#1a202c">ask for the next item, repeat</text>

  <!-- StopIteration -->
  <rect x="596" y="108" width="140" height="64" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="666" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">No items left?</text>
  <text x="666" y="152" text-anchor="middle" font-size="14" fill="#1a202c">loop ends.</text>
  <line x1="568" y1="140" x2="594" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="594,140 582,134 582,146" fill="#1a202c"/>

  <!-- divider -->
  <line x1="30" y1="266" x2="730" y2="266" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- WHILE loop panel -->
  <text x="30" y="298" font-size="16" font-weight="bold" fill="#1d4ed8">while loop — repeat until a condition turns false</text>

  <rect x="300" y="316" width="160" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Check condition</text>
  <text x="380" y="358" text-anchor="middle" font-size="14" fill="#1a202c">is it still true?</text>

  <line x1="380" y1="368" x2="380" y2="392" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,392 374,380 386,380" fill="#1a202c"/>
  <text x="470" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">true</text>

  <rect x="300" y="394" width="160" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="417" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Run body</text>
  <text x="380" y="436" text-anchor="middle" font-size="14" fill="#1a202c">and make progress</text>

  <!-- back up arrow -->
  <path d="M 300 420 L 250 420 L 250 342 L 298 342" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="298,342 286,336 286,348" fill="#1d4ed8"/>
  <text x="250" y="470" text-anchor="middle" font-size="13" fill="#1a202c">update, then re-check</text>

  <!-- false exit -->
  <line x1="460" y1="342" x2="560" y2="342" stroke="#1a202c" stroke-width="2"/>
  <polygon points="560,342 548,336 548,348" fill="#1a202c"/>
  <text x="510" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">false</text>
  <rect x="562" y="316" width="150" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="637" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">loop ends</text>

  <text x="380" y="502" text-anchor="middle" font-size="14" fill="#1a202c">A for loop counts its own steps; a while loop trusts you to make the condition eventually false.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 180 140 L 222 140" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 374 140 L 416 140" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 568 140 L 594 140" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 493 188 L 493 214 L 299 214 L 299 190" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 460 342 L 560 342" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 300 420 L 250 420 L 250 342 L 298 342" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
