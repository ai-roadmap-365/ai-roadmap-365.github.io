<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" font-family="system-ui, sans-serif">
  <title>Control flow inside one loop showing where continue jumps back, where break exits, and how the else clause runs only when the loop finishes without breaking</title>
  <rect x="0" y="0" width="780" height="560" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Loop control flow: break, continue, and else</text>

  <!-- start -->
  <rect x="300" y="56" width="180" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Start the loop</text>

  <line x1="390" y1="102" x2="390" y2="126" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,126 384,114 396,114" fill="#1a202c"/>

  <!-- more items? -->
  <polygon points="390,132 500,180 390,228 280,180" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Another item?</text>
  <text x="390" y="196" text-anchor="middle" font-size="13" fill="#1a202c">(condition still true?)</text>

  <!-- no -> else -->
  <line x1="500" y1="180" x2="612" y2="180" stroke="#1a202c" stroke-width="2"/>
  <polygon points="612,180 600,174 600,186" fill="#1a202c"/>
  <text x="556" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">no (exhausted)</text>
  <rect x="614" y="152" width="150" height="56" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="689" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">else: block</text>
  <text x="689" y="196" text-anchor="middle" font-size="13" fill="#1a202c">ran to completion</text>

  <!-- yes down -->
  <text x="408" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="390" y1="228" x2="390" y2="256" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,256 384,244 396,244" fill="#1a202c"/>

  <!-- body top: continue? -->
  <polygon points="390,262 500,306 390,350 280,306" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">skip this one?</text>
  <text x="390" y="321" text-anchor="middle" font-size="13" fill="#1a202c">continue</text>

  <!-- continue jumps back to 'another item?' -->
  <path d="M 280 306 L 180 306 L 180 180 L 278 180" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="278,180 266,174 266,186" fill="#1d4ed8"/>
  <text x="180" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">continue:</text>
  <text x="180" y="266" text-anchor="middle" font-size="13" fill="#1a202c">back to top,</text>
  <text x="180" y="284" text-anchor="middle" font-size="13" fill="#1a202c">next item</text>

  <!-- no continue, down to work/break? -->
  <line x1="390" y1="350" x2="390" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,376 384,364 396,364" fill="#1a202c"/>

  <rect x="300" y="378" width="180" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">do the work on the item</text>
  <text x="390" y="420" text-anchor="middle" font-size="13" fill="#1a202c">(accumulate, transform…)</text>

  <line x1="390" y1="430" x2="390" y2="454" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,454 384,442 396,454" fill="#1a202c"/>

  <!-- break? -->
  <polygon points="390,458 500,500 390,542 280,500" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">found it / done?</text>
  <text x="390" y="515" text-anchor="middle" font-size="13" fill="#1a202c">break</text>

  <!-- no break -> loop back to another item -->
  <path d="M 500 500 L 610 500 L 610 400 L 610 306 L 502 306" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polygon points="502,306 514,300 514,312" fill="#1a202c"/>
  <text x="656" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">no:</text>
  <text x="656" y="458" text-anchor="middle" font-size="13" fill="#1a202c">keep looping</text>

  <!-- break yes -> exits past the else -->
  <path d="M 390 542 L 210 542 L 210 236 L 689 236 L 689 210" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="689,210 683,222 695,222" fill="#dc2626"/>
  <text x="300" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">break: exit now — the else block is skipped</text>
</svg>
