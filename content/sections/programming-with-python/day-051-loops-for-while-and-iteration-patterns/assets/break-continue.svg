<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One is unusual.">
  <title>Three loop controls</title>
  <style>
    .break-continue-bg   { fill: #f8fafc; }
    .break-continue-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .break-continue-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .break-continue-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .break-continue-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .break-continue-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .break-continue-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .break-continue-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .break-continue-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .break-continue-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .break-continue-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .break-continue-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .break-continue-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .break-continue-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .break-continue-stage { opacity: 1; }

    .break-continue-s0 { animation-delay: 0.00s; }
    .break-continue-e0 { animation-delay: 0.00s; }
    .break-continue-s1 { animation-delay: 1.50s; }
    .break-continue-e1 { animation-delay: 1.50s; }
    .break-continue-s2 { animation-delay: 3.00s; }
    .break-continue-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .break-continue-conn  { animation: break-continue-trace 6s ease-in-out infinite; }
      .break-continue-stage { animation: break-continue-arrive 6s ease-in-out infinite; }
    }
    @keyframes break-continue-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes break-continue-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .break-continue-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .break-continue-stage { animation: break-continue-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes break-continue-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="break-continue-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="break-continue-bg" width="980" height="322"/>
  <text class="break-continue-h1"  x="30" y="40">Three loop controls</text>
  <text class="break-continue-sub" x="30" y="64">One is unusual.</text>
  <g class="break-continue-stage break-continue-s0">
    <rect class="break-continue-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="break-continue-step" x="44" y="142">01</text>
    <text class="break-continue-name" x="70" y="142">Break leaves the loop immediately</text>
    <text class="break-continue-desc" x="44" y="166">Skipping everything remaining.</text>
  </g>
  <line class="break-continue-line break-continue-conn break-continue-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#break-continue-tip)"/>
  <g class="break-continue-stage break-continue-s1">
    <rect class="break-continue-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="break-continue-step" x="359" y="142">02</text>
    <text class="break-continue-name" x="385" y="142">Continue skips to the next iteration</text>
    <text class="break-continue-desc" x="359" y="166">Without leaving the loop.</text>
  </g>
  <line class="break-continue-line break-continue-conn break-continue-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#break-continue-tip)"/>
  <g class="break-continue-stage break-continue-s2">
    <rect class="break-continue-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="break-continue-step" x="674" y="142">03</text>
    <text class="break-continue-name" x="700" y="142">And the else clause runs only if no break occurred</text>
    <text class="break-continue-desc" x="674" y="166">Which is unique to Python, and widely</text>
    <text class="break-continue-desc" x="674" y="182">misread.</text>
  </g>
  <text class="break-continue-sub" x="30" y="304">The else clause reads as though it pairs with the loop body, and it actually pairs with break — which is why most style guides suggest a flag variable instead.</text>
</svg>
