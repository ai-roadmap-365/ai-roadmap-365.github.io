terms:
  - term: iterable
    definition: 'Anything you can loop over — a list, string, range, dictionary, or file. A for loop asks an iterable for an iterator and then visits its items one at a time.'
  - term: iterator
    definition: 'A one-use helper a loop obtains from an iterable: it remembers the current position and returns the next item each time the loop asks, signalling when the items are exhausted.'
  - term: for loop
    definition: 'A loop that visits each item produced by an iterable exactly once and stops on its own when the items run out; the tool for definite iteration over a known collection.'
  - term: while loop
    definition: 'A loop that repeats its body as long as a condition is true and stops when the condition becomes false; the tool for indefinite iteration, where the number of repetitions is not known in advance.'
  - term: range
    definition: 'A built-in that lazily produces a sequence of whole numbers — range(stop) gives 0 to stop-1 — used to repeat a fixed number of times or to generate numeric sequences without building a list in memory.'
  - term: enumerate
    definition: 'A built-in that pairs each item of an iterable with its position, so a for loop can read both index and value at once (for i, x in enumerate(items):), replacing the error-prone range(len(...)) pattern.'
  - term: zip
    definition: 'A built-in that walks two or more iterables in lockstep, handing one item from each per pass and stopping when the shortest runs out; used to march related sequences together.'
  - term: break
    definition: 'A statement that immediately exits the innermost loop it is in, jumping to the first line after the loop; the mechanism behind stopping a search as soon as it succeeds.'
  - term: continue
    definition: 'A statement that abandons the rest of the current loop pass and jumps straight to the next item, leaving the loop running; used to skip items that do not qualify.'
  - term: loop else
    definition: 'An optional else clause on a for or while loop that runs only if the loop finished without ever hitting a break — the natural home for a "searched everything and never found it" branch.'
  - term: accumulator
    definition: 'A variable that starts at a neutral value (0 for a sum, an empty list for a build) and folds in one item per loop pass to build up a running total, count, or collection.'
  - term: infinite loop
    definition: 'A loop whose stopping condition never becomes true, so it runs forever — usually a while loop whose body fails to make progress toward the condition becoming false; a bug that freezes a program and can run up cloud cost.'
  - term: off-by-one error
    definition: 'A mistake in which a loop runs one time too many or too few — often from hand-managed indices or boundary conditions — producing a wrong result that still looks plausible.'
  - term: nested loop
    definition: 'A loop placed inside another loop; the inner body runs the product of the two loop counts (outer x inner), which is the most common source of code that is fast on small input and slow on large.'
