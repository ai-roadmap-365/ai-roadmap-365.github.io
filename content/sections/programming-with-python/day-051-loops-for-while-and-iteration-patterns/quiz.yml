questions:
  - question: 'You have a list of filenames and want to do the same thing to each one, exactly once. Which loop fits best, and why?'
    options:
      - 'A while loop, because you never know how many files there are'
      - 'A for loop, because you are visiting each item of a known collection once and it stops on its own'
      - 'A for loop with range(len(files)) and indexing, because you need the position'
      - 'Either one works identically, so it does not matter'
    answer_index: 1
    explanation: 'This is definite iteration: a known collection, each item visited once. A for loop walks the collection directly (`for name in files:`) and stops automatically when the items run out. You only need range/indexing if you truly need the position, and even then enumerate is better.'

  - question: 'In the iteration model, what is the role of the iterator that a for loop obtains from an iterable?'
    options:
      - 'It sorts the items before the loop begins'
      - 'It copies the whole collection into memory so the loop can scan it'
      - 'It remembers the current position and hands back the next item each time the loop asks, signalling when none are left'
      - 'It is the loop variable that holds the final item after the loop'
    answer_index: 2
    explanation: 'A for loop calls iter() on the iterable to get an iterator — a bookmark that remembers where you are and returns the next item on each next() call, signalling exhaustion when the items run out. This is why the same for loop works over lists, strings, ranges, and files.'

  - question: 'What is the difference between break and continue inside a loop?'
    options:
      - 'break leaves the loop entirely; continue skips the rest of the current pass and moves to the next item'
      - 'break skips one item; continue exits the loop'
      - 'break ends the whole program; continue restarts it'
      - 'They are interchangeable ways to end a loop early'
    answer_index: 0
    explanation: 'break exits the innermost loop immediately and jumps to the code after it. continue abandons only the current pass and jumps straight to the next item, leaving the loop running. Neither affects the program beyond the loop they are in.'

  - question: 'When does the else block of a `for ... else` loop run?'
    options:
      - 'Every time the loop finishes, no matter what'
      - 'Only if the loop body never executed'
      - 'Only if the loop finished without ever hitting a break'
      - 'Only if a break was executed'
    answer_index: 2
    explanation: 'A loop-else runs only when the loop completed normally without a break. Read it as "for each item ... and if we never broke out, do this." It is the natural home for the "we searched everything and never found it" case.'

  - question: 'You want to print each name in `names` alongside its 1-based position. Which is the idiomatic tool?'
    options:
      - 'zip(names, names)'
      - 'range(len(names)) and index into the list'
      - 'enumerate(names, start=1)'
      - 'a while loop with a manual counter'
    answer_index: 2
    explanation: 'enumerate pairs each item with its position without a hand-managed counter: `for rank, name in enumerate(names, start=1):`. The start argument sets the first number. This replaces the error-prone range(len(...)) pattern.'

  - question: 'A while loop is written `while count < 10:` but the loop never ends. What is the most likely cause?'
    options:
      - 'The condition should use <= instead of <'
      - 'Nothing in the loop body increases count, so the condition never becomes false'
      - 'while loops always run forever unless you add a for loop inside'
      - 'The condition is checked only once, so the loop can never stop'
    answer_index: 1
    explanation: 'A while loop places one responsibility on you: make progress toward the condition becoming false. If nothing in the body increases count, the condition stays true forever — an infinite loop. The fix is to ensure count advances (e.g. `count += 1`).'

  - question: 'A nested loop runs over 1,000 items and, inside, loops over the same 1,000 items. Roughly how many times does the inner body run, and why does it matter?'
    options:
      - 'About 2,000 times — the two loops add up'
      - 'About 1,000 times — nesting does not change the count'
      - 'About 1,000,000 times — the counts multiply, so cost explodes as the input grows'
      - 'It cannot be predicted without running it'
    answer_index: 2
    explanation: 'Nested loops multiply: the inner body runs outer x inner times, so 1,000 x 1,000 is about a million. This multiplication is the most common reason code is instant on small input and unusable on large input, which is why you flatten nesting and stop early where you can.'

  - question: 'Which statement about choosing loops versus built-ins is correct?'
    options:
      - 'You should always hand-write a for loop; built-ins are for experts only'
      - 'To sum, count, or check "do any/all pass?", the built-ins sum/any/all are clearer and faster than a hand-rolled accumulator loop'
      - 'A list comprehension can replace every loop with no loss of clarity'
      - 'while loops are always faster than for loops'
    answer_index: 1
    explanation: 'For common accumulations — summing, finding a max, or asking any()/all() — the built-ins are clearer and faster than a manual loop. Comprehensions are ideal for building one list by filtering/transforming, but a plain loop is still right when the body has side effects, several accumulators, or an early break.'
