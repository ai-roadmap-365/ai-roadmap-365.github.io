visuals:
  - id: sqlite-architecture
    file: assets/sqlite-architecture.svg
    type: diagram
    title: 'Inside SQLite: one library, seven layers, one file'
    alt: 'Diagram: the architecture of SQLite — an application calling the library in its own process, the tokenizer, parser and code generator turning SQL text into a bytecode program, a virtual machine running it, and beneath them the B-tree layer, the pager and the OS interface reaching one database file and its rollback journal or write-ahead log'
    description: 'A static architecture diagram read top to bottom. At the top, the application — a Python program or the sqlite3 shell — calls into the library, annotated to note that this is one process and the database code is a function call away rather than a network hop. Below it, a dashed outline encloses the SQLite library itself, linked into that same process. The first box inside is the C interface offering prepare, bind, step and finalize, noted as what Python''s sqlite3 module and every other language binding actually calls. Beneath it a shaded band groups the front end, in which SQL text becomes a program: a tokenizer that splits text into keywords, names and literals; a parser that builds a tree and rejects anything that is not valid SQL; and a code generator and query planner that choose which index to use and in which order, annotated as the point where declarative becomes procedural and noting that EXPLAIN QUERY PLAN prints the choice. The front end produces a highlighted bytecode program, described as the prepared statement — reusable and bindable. Below that, a bytecode virtual machine runs the instructions one at a time, annotated that one step yields one row; then a B-tree layer holding tables and indexes as ordered trees of pages, annotated that ordering makes a lookup a descent rather than a scan and that this is what an index really is. Beneath the machine sits a highlighted pager holding the page cache, locking and rollback, marked as the place where every ACID guarantee is made and where nothing above it knows what a transaction is; then an OS interface performing open, read, write, fsync and lock. Two green arrows lead down to the two artefacts on disk: library.db, the whole database in one file, and a journal or write-ahead log file described as how a crash is survived. A left-hand rail lists what is deliberately absent — no server process, no network socket, no port number, no user accounts, no password, no configuration file — records SQLite''s own position that it competes with fopen rather than with a client-server database, notes that everything runs at the privilege of the calling program so filesystem permissions are the access control, and explains that the two SQLite version numbers on one machine come from two separate copies of this whole stack, one linked into the shell and one into Python, both writing the same file format.'
  - id: query-lifecycle-flow
    file: assets/query-lifecycle-flow.svg
    type: flow-animated
    title: 'The life of one SELECT, from text to result rows'
    alt: 'Flowchart: the life of one SELECT — SQL text tokenized and parsed into a tree, planned into a choice of index or scan, compiled to bytecode, run by a virtual machine that asks the page cache for pages and the database file on a miss, and result rows returning to the caller one step at a time'
    description: 'An animated left-to-right pipeline for a single statement, readable in full as a still picture. Five stages run across the top: SQL text, described as a string with no promise of validity; tokenize and parse, where text becomes tokens and then a tree and where a syntax error stops; plan, choosing index or full scan and which order; bytecode, the prepared statement, reusable with new values; and the virtual machine, running the instructions with one step yielding one row. Marching-dash wires connect them and a token carrying the literal statement SELECT title, author, year FROM books WHERE year under 1980 ORDER BY year travels the pipeline, resting visible at the first stage. Printed beneath the plan stage are two real EXPLAIN QUERY PLAN outputs: with no index on year the planner chooses SCAN books plus a temporary B-tree for the sort, and with an index it chooses SEARCH books USING INDEX books_year — with a note that the same four rows come back either way and only the work changed. Below the virtual machine a violet path descends through the storage layers: a request for a page goes to the page cache, which answers immediately if the page is already in memory; only on a miss does the request continue down to the B-tree pages, read four thousand and ninety-six bytes at a time from library.db, described as one ordinary file, and the page then travels back up. A green path carries result rows back to the caller, into a box showing the four real rows the query returns, with a note that each step returns one row and nothing materialises the whole answer unless asked. A left-hand note observes that the reader wrote only the first stage and that stages two to seven are the loop they would otherwise have written by hand, which the engine may write differently tomorrow. Two closing lines state the resting state explicitly — all seven stages shaded, every arrow drawn, the statement at stage one, all labels present — and confirm that with reduced motion requested the animation stops and that resting state is the whole diagram. The file carries a prefers-reduced-motion media query that disables every animation and restores the resting appearance.'
