terms:
  - term: 'Relational model'
    definition: 'The way of organising data that Edgar F. Codd published in Communications of the ACM in June 1970: data held as relations rather than reached by following pointers, and queries expressed as operations on sets. Its central promise is data independence — you can change how data is stored without rewriting the programs that use it.'
  - term: 'Relation'
    definition: 'The formal name for a table: a set of tuples, each drawn from the same named columns. Two consequences follow from the word "set". A relation has no duplicate rows if a key is enforced, and it has no order — a table has no first row until a query supplies one with ORDER BY. "Relational" refers to this mathematical relation, not to tables relating to each other.'
  - term: 'Tuple'
    definition: 'One row, in the vocabulary of the relational model: a fixed sequence of values, one per column, each drawn from that column''s domain. "Row" and "tuple" name the same thing from two traditions; a tuple is usually thought of as ordered by position, a row as addressed by column name.'
  - term: 'Schema'
    definition: 'The written-down structure of a database — its tables, their columns and types, and the constraints on them. The important word is "written down": a schema is enforced by the engine on every write from every program, including programs that do not exist yet, which is what makes it different in kind from validation code.'
  - term: 'Primary key'
    definition: 'The column or columns chosen to identify each row. It guarantees two things on every write: no two rows share the value, and no row leaves it empty. It is a statement of identity rather than merely a uniqueness rule, and a good one names something that never needs to change.'
  - term: 'Candidate key'
    definition: 'Any column or set of columns that uniquely identifies a row. A table may have several; the primary key is the one you chose. In the lab, both member_id and email are candidate keys for members, and member_id is the primary key — because an address can change and everything referring to a row would have to change with it.'
  - term: 'Foreign key'
    definition: 'A column declared to REFERENCES a key in another table, so the engine refuses a row pointing at something that does not exist. In SQLite it is enforced only when PRAGMA foreign_keys is ON, which is OFF by default, per connection — so a REFERENCES clause on a connection that has not asked for it enforces nothing.'
  - term: 'SQL'
    definition: 'The language for querying and modifying relational data, designed at IBM as SEQUEL by Donald D. Chamberlin and Raymond F. Boyce and renamed after a trademark conflict. It became an ANSI standard in 1986 and an ISO standard the following year. In practice it is a family rather than one language: every engine implements the core and then diverges.'
  - term: 'Declarative query'
    definition: 'A statement of the result you want rather than the steps to produce it. Writing SELECT ... WHERE ... ORDER BY says nothing about whether to use an index, in what order to test conditions, or how to sort. The engine decides, decides again as the data changes, and may reach a different conclusion tomorrow while returning identical rows.'
  - term: 'Query planner'
    definition: 'The part of the engine that turns a parsed statement into a strategy — which index to use, which order to join, whether to sort with a temporary structure. EXPLAIN QUERY PLAN prints the choice it made. Its output is a description for humans, not an interface, and it may legitimately change between versions.'
  - term: 'Bytecode program'
    definition: 'What SQLite compiles a statement into: a small program in its own instruction set, executed by a virtual machine. This is what a prepared statement actually is, which is why preparing once and running many times with different bound values skips the tokenizer, parser, planner and code generator on every repeat.'
  - term: 'Type affinity'
    definition: 'A column''s declared type in SQLite, understood correctly: a preference the engine applies when a conversion is lossless and abandons when it is not. Insert the text ''1970'' into an INTEGER column and it becomes the integer 1970; insert ''not-a-number'' and it is stored as text, in that same column, with no error.'
  - term: 'Storage class'
    definition: 'What a value in SQLite actually is, as opposed to what its column asked for. There are five: NULL, INTEGER, REAL, TEXT and BLOB. The typeof() function reports the storage class, which is the tool for diagnosing a query that silently returns fewer rows than you expect.'
  - term: 'STRICT table'
    definition: 'A table declared with the STRICT keyword, added in SQLite 3.37.0, in which every column must be one of INT, INTEGER, REAL, TEXT, BLOB or ANY and the engine enforces it. It refuses values that genuinely are not the declared type; it still permits the lossless conversion, so ''1970'' remains acceptable in an INTEGER column.'
  - term: 'NULL'
    definition: 'The absence of a value — not zero, not an empty string, and not equal to anything including itself. That last property is why you write IS NULL rather than = NULL, and why sorting has to decide where NULLs go: SQLite places them first in an ascending sort, and a hand-written sort must choose deliberately.'
  - term: 'ACID'
    definition: 'The four guarantees a transaction makes. Atomicity: the group of writes happens entirely or not at all. Consistency: every constraint holds before and after. Isolation: concurrent transactions do not see each other''s partial work. Durability: once committed, it survives a crash. In SQLite all four are implemented by the pager.'
  - term: 'Transaction'
    definition: 'A group of statements treated as one indivisible act, opened with BEGIN and ended with COMMIT or ROLLBACK. Borrowing a book is a new loan row and one fewer copy on the shelf, and neither is true alone. In Python, "with connection:" commits on success and rolls back on any exception.'
  - term: 'Page'
    definition: 'The fixed-size unit a database engine reads and writes — 4,096 bytes on both SQLite builds used for this lesson. A row lives inside a page and a page usually holds many rows, which is why changing one field rewrites four kilobytes rather than the whole file. Bytes 16 and 17 of the file header record the size.'
  - term: 'B-tree'
    definition: 'The ordered, page-based tree structure in which SQLite stores both tables and indexes. Because it is ordered and arranged in pages, finding a row by key is a short descent reading a handful of pages rather than a walk through everything — which is what an index actually is, underneath the word.'
  - term: 'Pager'
    definition: 'The SQLite layer that caches pages in memory, takes locks, decides what is written when, and implements rollback. Every ACID guarantee is made here; nothing above it knows what a transaction is. It is also where SQLite''s concurrency model lives: many readers at once, one writer at a time.'
  - term: 'Rollback journal'
    definition: 'SQLite''s default crash-recovery file, written beside the database as name-journal. Before changing a page, the engine copies the ORIGINAL page into the journal, so an interrupted commit can be undone. It is part of the database: copying the database file and leaving the journal behind can lose data.'
  - term: 'Write-ahead log'
    definition: 'The alternative crash-recovery mode, enabled with PRAGMA journal_mode = WAL and stored beside the database as name-wal. It inverts the journal: new page content is appended to the log first and folded into the database later, which lets readers carry on while one writer works. It does not permit two writers.'
  - term: 'Full table scan'
    definition: 'Reading every row to answer a query, because no index applies. Its cost grows with the size of the table whether one row matches or all of them do. Writing restrict() by hand in the lab makes this concrete: the predicate is called once per row, always. EXPLAIN QUERY PLAN reports it as SCAN.'
  - term: 'Parameterised query'
    definition: 'A statement compiled with placeholders — ? in Python''s sqlite3 module — to which values are bound afterwards. Because the statement is compiled before any value is present, a value cannot become part of the statement. This is the whole of SQL injection defence; it applies to values only, never to table or column names.'
