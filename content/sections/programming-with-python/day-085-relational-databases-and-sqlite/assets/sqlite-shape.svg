<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>How an embedded database works</title>
  <style>
    .sqlite-shape-bg   { fill: #f8fafc; }
    .sqlite-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sqlite-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sqlite-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sqlite-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sqlite-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sqlite-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sqlite-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sqlite-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sqlite-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sqlite-shape-stage { opacity: 1; }

    .sqlite-shape-s0 { animation-delay: 0.00s; }
    .sqlite-shape-e0 { animation-delay: 0.00s; }
    .sqlite-shape-s1 { animation-delay: 1.28s; }
    .sqlite-shape-e1 { animation-delay: 1.28s; }
    .sqlite-shape-s2 { animation-delay: 2.56s; }
    .sqlite-shape-e2 { animation-delay: 2.56s; }
    .sqlite-shape-s3 { animation-delay: 3.84s; }
    .sqlite-shape-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sqlite-shape-conn  { animation: sqlite-shape-trace 6.4s ease-in-out infinite; }
      .sqlite-shape-stage { animation: sqlite-shape-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sqlite-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sqlite-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sqlite-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sqlite-shape-stage { animation: sqlite-shape-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sqlite-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sqlite-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sqlite-shape-bg" width="980" height="322"/>
  <text class="sqlite-shape-h1"  x="30" y="40">How an embedded database works</text>
  <text class="sqlite-shape-sub" x="30" y="64">Four properties.</text>
  <g class="sqlite-shape-stage sqlite-shape-s0">
    <rect class="sqlite-shape-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sqlite-shape-step" x="44" y="142">01</text>
    <text class="sqlite-shape-name" x="70" y="142">The engine is a library inside your process</text>
    <text class="sqlite-shape-desc" x="44" y="166">Not a separate server.</text>
  </g>
  <line class="sqlite-shape-line sqlite-shape-conn sqlite-shape-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sqlite-shape-tip)"/>
  <g class="sqlite-shape-stage sqlite-shape-s1">
    <rect class="sqlite-shape-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sqlite-shape-step" x="280" y="142">02</text>
    <text class="sqlite-shape-name" x="306" y="142">The whole database is one file</text>
    <text class="sqlite-shape-desc" x="280" y="166">Copyable, and easy to back up.</text>
  </g>
  <line class="sqlite-shape-line sqlite-shape-conn sqlite-shape-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sqlite-shape-tip)"/>
  <g class="sqlite-shape-stage sqlite-shape-s2">
    <rect class="sqlite-shape-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sqlite-shape-step" x="516" y="142">03</text>
    <text class="sqlite-shape-name" x="542" y="142">Many readers concurrently, one writer at a time</text>
    <text class="sqlite-shape-desc" x="516" y="166">Which is the main limit.</text>
  </g>
  <line class="sqlite-shape-line sqlite-shape-conn sqlite-shape-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sqlite-shape-tip)"/>
  <g class="sqlite-shape-stage sqlite-shape-s3">
    <rect class="sqlite-shape-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sqlite-shape-step" x="752" y="142">04</text>
    <text class="sqlite-shape-name" x="778" y="142">And nothing to install, configure or operate</text>
    <text class="sqlite-shape-desc" x="752" y="166">Which is why it is everywhere.</text>
    <text class="sqlite-shape-edge" x="752" y="242">free</text>
  </g>
  <text class="sqlite-shape-sub" x="30" y="304">Being everywhere is not an exaggeration: an embedded database ships inside browsers, phones and aircraft, which makes its file format unusually durable.</text>
</svg>
