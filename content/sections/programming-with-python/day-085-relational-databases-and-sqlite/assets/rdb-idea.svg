<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four guarantees.">
  <title>What a relational database gives you</title>
  <style>
    .rdb-idea-bg   { fill: #f8fafc; }
    .rdb-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rdb-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rdb-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rdb-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rdb-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rdb-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rdb-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rdb-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rdb-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rdb-idea-stage { opacity: 1; }

    .rdb-idea-s0 { animation-delay: 0.00s; }
    .rdb-idea-e0 { animation-delay: 0.00s; }
    .rdb-idea-s1 { animation-delay: 1.28s; }
    .rdb-idea-e1 { animation-delay: 1.28s; }
    .rdb-idea-s2 { animation-delay: 2.56s; }
    .rdb-idea-e2 { animation-delay: 2.56s; }
    .rdb-idea-s3 { animation-delay: 3.84s; }
    .rdb-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rdb-idea-conn  { animation: rdb-idea-trace 6.4s ease-in-out infinite; }
      .rdb-idea-stage { animation: rdb-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rdb-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rdb-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rdb-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rdb-idea-stage { animation: rdb-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rdb-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rdb-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rdb-idea-bg" width="980" height="322"/>
  <text class="rdb-idea-h1"  x="30" y="40">What a relational database gives you</text>
  <text class="rdb-idea-sub" x="30" y="64">Four guarantees.</text>
  <g class="rdb-idea-stage rdb-idea-s0">
    <rect class="rdb-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-idea-step" x="44" y="142">01</text>
    <text class="rdb-idea-name" x="70" y="142">Structure: named columns with declared types</text>
    <text class="rdb-idea-desc" x="44" y="166">Which a file does not have.</text>
  </g>
  <line class="rdb-idea-line rdb-idea-conn rdb-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rdb-idea-tip)"/>
  <g class="rdb-idea-stage rdb-idea-s1">
    <rect class="rdb-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-idea-step" x="280" y="142">02</text>
    <text class="rdb-idea-name" x="306" y="142">Constraints the database itself enforces</text>
    <text class="rdb-idea-desc" x="280" y="166">So invalid rows cannot be</text>
    <text class="rdb-idea-desc" x="280" y="182">written.</text>
  </g>
  <line class="rdb-idea-line rdb-idea-conn rdb-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rdb-idea-tip)"/>
  <g class="rdb-idea-stage rdb-idea-s2">
    <rect class="rdb-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-idea-step" x="516" y="142">03</text>
    <text class="rdb-idea-name" x="542" y="142">A query language, so you say what, not how</text>
    <text class="rdb-idea-desc" x="516" y="166">And the engine picks the method.</text>
  </g>
  <line class="rdb-idea-line rdb-idea-conn rdb-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rdb-idea-tip)"/>
  <g class="rdb-idea-stage rdb-idea-s3">
    <rect class="rdb-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rdb-idea-step" x="752" y="142">04</text>
    <text class="rdb-idea-name" x="778" y="142">And transactions, so changes are all or nothing</text>
    <text class="rdb-idea-desc" x="752" y="166">Even across a crash.</text>
  </g>
  <text class="rdb-idea-sub" x="30" y="304">The constraints being enforced by the database rather than the application is what makes the data trustworthy no matter which program wrote it.</text>
</svg>
