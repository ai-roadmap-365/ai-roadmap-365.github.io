slug: relational-databases-and-sqlite
title: 'Relational Databases and SQLite'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to say precisely why a JSON file stops being an adequate store — measured in bytes rewritten, constraints absent, updates lost and scans repeated — and replace it with a real database: a schema whose primary keys, foreign keys, NOT NULL, UNIQUE and CHECK constraints the engine enforces on every write from every program; SQL as a declarative language whose plan the engine chooses and may change without changing your answers; SQLite end to end from the tokenizer, parser and code generator through the bytecode virtual machine to the B-tree, the pager and the single database file with its journal or write-ahead log; SQLite''s dynamic typing, type affinity and the STRICT tables that fix it; what each letter of ACID actually buys you and which failure an atomic file write could never prevent; when SQLite is the right answer and when PostgreSQL, MySQL, MariaDB, DuckDB or a managed service is; and a query engine you have written yourself in twelve lines, so that SELECT is a request for a loop you already understand.'
objectives:
  - 'Measure rather than assert the four points at which a JSON file stops paying — whole-file rewrites for a one-field change, no constraint on a typo''d foreign key, two atomic writers losing an update, and a question that costs a full parse and scan every time'
  - 'Define the relational model precisely: a relation as a set of tuples, rows and typed columns, primary and candidate keys, and what a key actually guarantees — then explain why "relational" does not mean "tables relate to each other"'
  - 'Write a schema as a promise the engine keeps, using PRIMARY KEY, NOT NULL, UNIQUE, CHECK and REFERENCES, and watch each one refuse a bad write while leaving the data untouched'
  - 'Explain SQL as a declarative language by naming what you did not write, read EXPLAIN QUERY PLAN, and show the planner choosing differently for the same query while returning identical rows'
  - 'Trace SQLite''s architecture from your program to the disk — interface, tokenizer, parser, code generator and planner, bytecode, virtual machine, B-tree, pager, OS interface — and name the layer where every ACID guarantee is made'
  - 'Prove a database is one ordinary file by reading the documented 16-byte header, the page size and the page count, and checking they agree with the engine and the file length'
  - 'Describe SQLite''s type system honestly — five storage classes, affinity as a preference rather than a rule, a TEXT value living in an INTEGER column, and the silent comparison failure that follows — then fix it with a STRICT table and say exactly what STRICT does not change'
  - 'State what each letter of ACID buys you, and identify the failure isolation prevents that Day 84''s atomic file write could not'
  - 'Turn PRAGMA foreign_keys on in every connection, and explain why a REFERENCES clause without it is a comment'
  - 'Pass values as parameters rather than building SQL strings, and state the two precisions that half-understood injection advice leaves out'
  - 'Build a query engine from first principles — restrict, project and order_by over a list of dicts — and assert mechanically that the equivalent SELECT returns exactly the same rows in the same order'
  - 'Choose between SQLite, PostgreSQL, MySQL or MariaDB, DuckDB and the commercial or managed tier on the real deciding questions — how many writers, where they run, who operates it — rather than on data volume'
prerequisites:
  - 'Days 64-66 of this course: reading and writing files, JSON, and an exception-handling strategy. The JSON file this lesson dismantles is the one you have been writing since then'
  - 'Day 70: modelling a domain with objects. A table is that model, written down somewhere the engine can enforce it'
  - 'Day 84: the automation toolkit and its atomically written JSON state file — this lesson is the direct answer to that lab''s fifth extension exercise'
  - 'Comfort at a terminal, and enough Python to read a loop, a dict comprehension and a context manager'
  - 'No installation and no account: Python 3.11 or newer with its standard-library sqlite3 module, and the sqlite3 command-line shell'
reading_time_minutes: 40
