terms:
  - term: 'Boundary'
    definition: 'The line where data crosses from somewhere you do not control into somewhere you do — an HTTP body, a CSV row, an environment variable, a config file, a message off a queue, a language model''s reply. On one side it is somebody else''s problem; on the other it is your responsibility. Validation is what you do at that line, and the practical rule is that there should be a small number of such lines and each should have a name.'
  - term: 'Validation'
    definition: 'Checking, at runtime, that a value satisfies the rules you declared for it, and refusing it when it does not. Distinct from parsing, which turns bytes into objects and asks nothing about whether the objects make sense, and from type checking, which happens before the program runs and never sees a byte of real data.'
  - term: 'Coercion'
    definition: 'Converting a value to the declared type rather than refusing it — accepting the string "42" where an int was asked for. Convenient at a boundary where everything arrives as text, and dangerous when the conversion could be wrong in a way nobody notices. Every coercion rule is a judgement call about which mistakes are more likely than which inconveniences.'
  - term: 'Lax mode'
    definition: 'pydantic v2''s default. Conversions that are unambiguous and lossless are performed: "42" becomes 42, "14.8" becomes 14.8, 3 becomes 3.0, a tuple becomes a list. Conversions that would lose information are refused: 42.7 as an int fails with int_from_float rather than silently truncating. Verified in pydantic 2.13.4 by asking, not by reading.'
  - term: 'Strict mode'
    definition: 'The opposite policy, requested per call with strict=True, per field with Field(strict=True), or per model with ConfigDict(strict=True). No conversions are attempted; a value must already be the declared type. In pydantic 2.13.4 the one exception observed is int to float, which is still accepted. Reach for it when a wrong guess is worse than a rejection — money, identifiers, anything from a source that is supposed to be well typed already.'
  - term: 'Field validator'
    definition: 'A function attached to one field with @field_validator("name"), running either before pydantic''s own parsing (mode="before", where the value is still whatever arrived) or after it (mode="after", where the value is already the declared type). It raises a plain ValueError, which pydantic folds into the ValidationError as an entry of type value_error located at that field.'
  - term: 'Model validator'
    definition: 'A function attached to the whole model with @model_validator, for a rule no single field can express — the record is valid only if two fields agree, or if one is present when another has a particular value. In mode="after" it receives the built object and returns it; in mode="before" it receives the raw input. Its errors carry an empty loc, because no one field is at fault.'
  - term: 'ValidationError'
    definition: 'The exception pydantic raises when input does not satisfy a model. Its defining property is that it reports every problem it found in one pass rather than the first, so a caller fixes a file in one round trip instead of ten. exc.errors() returns a list of entries, each carrying loc, type, msg and input.'
  - term: 'loc'
    definition: 'A tuple locating one error inside the input: ("humidity_pct",) for a top-level field, ("station", "code") for a field of a nested model, (1, "station") for the second element of a validated list. It uses the alias when the field has one, because the report has to name the key the caller actually sent. Together with type it forms the part of a ValidationError that is safe to write tests against.'
  - term: 'Error type'
    definition: 'A short machine-readable string naming the rule that was broken — missing, float_parsing, less_than_equal, extra_forbidden, string_pattern_mismatch, datetime_from_date_parsing, value_error, frozen_instance. Stable within a major version and intended to be branched on. Its counterpart msg is human prose, is free to be reworded in any release, and is therefore the one field nothing should ever assert on.'
  - term: 'Alias'
    definition: 'A second name for a field: the name the data uses on the wire, as distinct from the name your code prefers. Field(alias="pm2_5") lets a vendor export be read into a field called pm25. The alias is what appears in an error''s loc, and by default it is not what appears in model_dump output — you ask for that with by_alias=True.'
  - term: 'Serialization'
    definition: 'Turning a validated object back into transportable data. model_dump() produces Python objects and leaves a datetime as a datetime; model_dump_json() produces a JSON string and renders it as ISO 8601 text. Both take exclude, include, by_alias and exclude_none, which is where you decide what an outward-facing extract may contain.'
  - term: 'Round-trip asymmetry'
    definition: 'The fact that Model.model_validate(instance.model_dump()) is not guaranteed to work, for three ordinary reasons: computed fields are written on the way out but refused on the way in under extra="forbid"; aliases mean the default dump uses field names while validation expects wire names; and a validator that normalises a value means the object is not identical to what arrived. All three are correct behaviours; the bug is assuming they compose.'
  - term: 'TypeAdapter'
    definition: 'Validation and serialization for a type that is not a BaseModel — list[int], dict[str, Reading], a Union, a plain datetime. TypeAdapter(list[Reading]).validate_python(rows) validates a whole batch in one call, and the errors it raises carry the element index as the first component of loc, so the report names which row failed.'
  - term: 'Computed field'
    definition: 'A property decorated with @computed_field, so that it appears in the model''s serialized output and in its JSON Schema while never being an input. Useful for a value derived from other fields that consumers want and nobody should be able to set. It is the most common cause of a surprising round-trip failure.'
  - term: 'Discriminated union'
    definition: 'A union of several models where one field decides which member applies, declared with Field(discriminator="kind"). Without it, pydantic tries every member and reports errors from all of them, which is slow and produces an unreadable report; with it, the discriminator is read first and only the matching model is tried, so the errors name the right branch.'
  - term: 'Data-quality gate'
    definition: 'The place in a pipeline where every incoming record is validated, the valid ones continue, and the invalid ones are collected, counted and reported rather than crashing the run. Its defining property is what it does NOT do: it does not raise on the first bad record. A gate that stops at the first problem processes nothing and tells you about one thing.'
  - term: 'Quarantine'
    definition: 'Writing rejected records somewhere durable rather than discarding them, so the source can be repaired and the batch re-run. The counterpart of the reject report: the report says what was wrong, the quarantine holds what was wrong with it. Both raise a disclosure question, because a rejected record''s contents are exactly the data you were not able to vet.'
  - term: 'extra="forbid"'
    definition: 'The model_config setting that turns an unexpected key from a silent discard into a refusal of type extra_forbidden. It is what catches a misspelled field name, which the default extra="ignore" loses without a sound. It is also a security control: whether an unexpected key is ignored or forbidden decides whether a model built from user-supplied data can be mass-assigned a field the user should not control.'
  - term: 'validate_assignment'
    definition: 'The model_config setting that re-runs validation when a field is assigned after construction, so an object that was legal when built cannot be made illegal afterwards. Off by default, because it costs a validation on every write. frozen=True is the stronger version: no assignment at all, reported as frozen_instance.'
  - term: 'Annotated type'
    definition: 'typing.Annotated[T, ...] carrying pydantic constraints alongside the base type, so a constrained value can be named once and reused — Percent = Annotated[int, Field(ge=0, le=100)]. It is the modern way to avoid repeating ge=0, le=100 on nine fields and then getting it wrong on the tenth, and it works with static type checkers, which see only the T.'
  - term: 'JSON Schema'
    definition: 'A standard vocabulary for describing the shape of JSON data. model_json_schema() generates one from your annotations for free. It is what FastAPI publishes as OpenAPI, and it is what you hand a language model when you want structured output back — which is why the same schema can serve as documentation, as request validation and as a generation constraint.'
  - term: 'Structured output'
    definition: 'Asking a language model for JSON matching a schema rather than for prose. The model returns text claiming to be JSON; a parse and a validation decide whether it is usable. This is exactly the boundary problem of this lesson, with a particularly unreliable source on the other side, and it is why the retry loop that feeds the validation errors back to the model is the standard pattern rather than a hack.'
