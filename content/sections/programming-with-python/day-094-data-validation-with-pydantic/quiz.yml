questions:
  - question: 'You are writing a test that a bad request is rejected for the right reason. Which part of a ValidationError entry should the assertion read?'
    options:
      - 'msg, because it is the only part a human can understand, and a test is read by humans'
      - 'The str() of the whole exception, because it contains everything and so cannot miss anything'
      - 'loc and type, because they are the machine-readable parts pydantic treats as an interface'
      - 'input, because it is the actual offending value and therefore the most specific thing available'
    answer_index: 2
    explanation: 'Each entry carries four things, and they are not equal. `type` is a short symbolic name for the rule that was broken — `float_parsing`, `less_than_equal`, `extra_forbidden` — and `loc` is a tuple locating it in the input. Both are meant to be branched on, and both are stable within a major version. `msg` is English prose, and a library is entitled to improve a sentence in any release; a suite that greps it passes until the day somebody rewords "Input should be a valid number" and then fails for a reason that has nothing to do with your code. This is not a pydantic quirk: it is the same argument Day 82 made about a FastAPI 422 body, which is literally the same structure serialised to JSON. Option 3 is a subtler trap — `input` is genuinely useful in a report a human reads, but asserting on it tests your fixture rather than your schema, and on a `missing` error the `input` is the entire record rather than the field, which is rarely what the assertion meant. Option 1 is the worst of both: it matches on prose while looking rigorous.'

  - question: 'A model declares `operator: str | None` and `notes: str | None = None`. A record arrives with neither key present. What happens?'
    options:
      - 'Both are accepted and both become None, because both annotations permit None'
      - 'Both are rejected, because neither key was supplied and both fields declare a type'
      - 'operator is accepted as None and notes is rejected, because a default is not the same as a value'
      - 'operator is rejected with a missing error and notes is accepted as None'
    answer_index: 3
    explanation: 'Required, optional and nullable are three separate facts and only two of them are visible in the type. **Nullable** is about the type: both fields say `str | None`, so both may hold `None`. **Required** is about the default: `operator` has none, so the key must be present; `notes` has `= None`, so the key may be absent. **Optional** is that second property and nothing else — it is not a statement about `None` at all, which is why the older `Optional[str]` spelling caused so much confusion by appearing to say the opposite. So `operator` is required-and-nullable: you may send `null`, but you must send something. `notes` is optional-and-nullable: you may leave it out. You can settle this without arguing, from the schema pydantic generates: `Reading.model_json_schema()["required"]` lists `operator` and does not list `notes`. And the fourth combination exists too — a field can be optional and not nullable, such as `retries: int = 3`, where the key may be absent but `null` is refused.'

  - question: 'In pydantic v2''s default mode, which of these is refused rather than converted?'
    options:
      - '42.7 validated as an int'
      - 'The string "42" validated as an int'
      - 'The integer 3 validated as a float'
      - 'The boolean True validated as an int'
    answer_index: 0
    explanation: 'The rule behind lax mode is not "convert anything plausible" — it is closer to "convert when the conversion is unambiguous and loses nothing". `"42"` to `42` loses nothing. `3` to `3.0` loses nothing. `True` to `1` loses nothing either, and is accepted because `bool` genuinely is a subclass of `int` in Python; whether that is a good idea is a separate argument, but it is what was observed in pydantic 2.13.4 and it is a real source of surprise. `42.7` to `42` would silently discard the `.7`, so it is refused with the error type `int_from_float`. That distinction is worth internalising, because it is the shape of the whole policy: the library will do work for you, and it will not make a decision on your behalf that quietly destroys information. Notice also that `"42.0"` as an int IS accepted, for the same reason — the fractional part is zero, so nothing is lost. If you want none of this, `strict=True` refuses every one of these except `3` to `3.0`.'

  - question: 'Your pipeline validates ten thousand records a night. Tonight forty of them are malformed. What should the pipeline do?'
    options:
      - 'Raise on the first bad record so the problem is impossible to ignore'
      - 'Process all ten thousand, emit the 9,960 valid records, and write a report naming each of the 40 with its loc and type'
      - 'Silently skip the bad records so the run is never interrupted'
      - 'Coerce the bad records into something valid using sensible defaults, so nothing is lost'
    answer_index: 1
    explanation: 'Option 0 is the instinct, and it costs you the night: the run processes nothing, and you learn about exactly one of the forty problems. Tomorrow you fix it and learn about the second. Option 2 is worse in a quieter way — the run looks healthy, the count is short by forty, and nobody notices until a number downstream is wrong. Option 3 is the most dangerous of all, because inventing data is not repairing it; a defaulted humidity of 50 is indistinguishable from a measured one the moment it is written down. The gate does the third thing: it never lets one bad record end the run, it keeps the good ones moving, and it produces a report that is specific enough for whoever owns the source to fix it — which record, which field, which rule, which value. The counts matter as much as the details, because "40 rejected" is a number you can trend, alert on, and put a threshold under. That threshold is the missing piece in the question: a gate should also be able to fail the build when the reject rate crosses a line you chose, because a gate that can never fail is a log line.'

  - question: 'A record must carry an explanatory note whenever its pm25 reading exceeds 500. Where does that rule belong?'
    options:
      - 'On the pm25 field, as Field(le=500)'
      - 'On the notes field, as a field_validator that checks pm25'
      - 'Nowhere in the model — it is business logic and belongs in the calling code'
      - 'On the model, as a model_validator(mode="after")'
    answer_index: 3
    explanation: 'The question to ask is: how many fields does this rule need to see at once? A constraint like `ge=0` or `max_length=60` concerns one value, so it goes on the field, and `Annotated` lets you name it once and reuse it. This rule concerns two values together — a reading above 500 is fine if there is a note and not fine if there is not — so no per-field constraint can express it. Option 0 misreads the rule entirely: 612.5 is a legal measurement, not an illegal one. Option 1 is closer but fights the machinery: a `field_validator` on `notes` receives only that field''s value, and reaching for another field''s value from inside it means depending on validation order, which is a fragile thing to depend on. `model_validator(mode="after")` runs once the object exists with every field already validated, takes `self`, and returns `self`; raising a plain `ValueError` inside it produces an entry with type `value_error` and an **empty** `loc`, which is exactly right, because no single field is at fault. Option 2 is the position worth arguing with rather than dismissing: it is defensible when the rule genuinely varies by caller, and indefensible when the rule is a property of the data itself, because then it will be enforced in four of the five places that construct the record.'

  - question: 'You validate a record, call model_dump() on the result, and pass that straight back to model_validate(). It fails. What is the most likely reason?'
    options:
      - 'The dump contains a computed field, which the model refuses as an input under extra="forbid"'
      - 'model_dump() is lossy and should never be used; only model_dump_json() round-trips correctly'
      - 'Validation is not idempotent in pydantic v2, so a second pass always fails'
      - 'The datetime was serialised to a string, which no longer validates as a datetime'
    answer_index: 0
    explanation: 'This surprises people because both halves are behaving correctly. A `computed_field` is serialised on the way out — that is its entire purpose, since consumers want the derived value — and it is refused on the way in, because `extra="forbid"` is doing its job and nothing computed is an input. The bug is assuming the two compose. Two other asymmetries lurk in the same place and are worth knowing: `model_dump()` uses **field names** by default while validation expects **alias names**, so an aliased field breaks the trip unless you pass `by_alias=True`; and any validator that normalises a value — trimming whitespace, turning a blank string into `None` — means the object is deliberately not identical to what arrived. Option 3 is a real hazard in the general case but not here: `model_dump()` leaves a `datetime` as a `datetime`, and even the ISO 8601 string that `model_dump_json()` produces would validate back happily. The working round trip in the lab is `Reading.model_validate(reading.model_dump(by_alias=True, exclude={"band"}))`, and the fact that it needs two arguments is the lesson.'

  - question: 'Your ORM model already declares NOT NULL and a CHECK constraint for the same rules your pydantic model enforces. Should you drop one?'
    options:
      - 'Yes — drop the database constraints, since the model already guarantees the data is valid before it is stored'
      - 'No — they catch different things, because the constraint sees every path to the table and the model only sees the path through your application'
      - 'Yes — drop the pydantic model, since the database is the last word and enforcing it twice is duplication'
      - 'It does not matter, because a CHECK constraint and a Field constraint compile to the same thing at runtime'
    answer_index: 1
    explanation: 'They look redundant and they guard different territory, which is the whole reason the three-layer picture is worth carrying. The type checker runs before the program does and catches code that could never work — passing a `str` where an `int` was declared — and it never sees a single byte of real data. The validator runs as data arrives and catches data that is wrong now, with a field-level report you can hand back to a caller, which is something no database will ever give you. The database constraint runs as data is stored and catches anything that reached the table **by any route**: a migration, a manual UPDATE at 2am, a second service written by another team, a bug that bypassed your gate entirely. Option 0 assumes your application is the only writer, which is true right up until it is not, and the failure is silent. Option 2 throws away the ability to reject a request with a useful message and forces every error to arrive as an opaque integrity violation. Option 3 is simply wrong — one runs in the database engine, the other in your process, and they can disagree.'

  - question: 'A vendor feed sends a field called pm2_5, and your codebase calls it pm25. You declare `pm25: float = Field(alias="pm2_5")`. A record arrives with pm2_5 set to "not-measured". What loc does the error carry?'
    options:
      - '("pm25",), because loc always names the model field'
      - 'An empty tuple, because the failure is a parsing failure rather than a field failure'
      - '("pm2_5",), because loc names the key the caller actually sent'
      - 'Both names, since pydantic reports the field and the alias as two separate entries'
    answer_index: 2
    explanation: 'The report exists to be handed to whoever owns the source data, and telling them that `pm25` is wrong when their file contains no such key is useless. So `loc` uses the alias — the name on the wire — and this is one of the small design decisions that shows pydantic was built for boundaries rather than for internal bookkeeping. It also means a test asserting `("pm25",)` will fail, which is a good early lesson in reading the actual error rather than the one you expected. The symmetry runs the other way on output and catches people a second time: `model_dump()` gives you `pm25` by default and `model_dump(by_alias=True)` gives you `pm2_5`, so the direction has to be chosen at each end. If the thing consuming your output is the same vendor system, you almost certainly want `by_alias=True`. And `populate_by_name=True` is the escape hatch that lets the field be filled by either name on the way in, which is useful when the same model serves an external feed and your own internal callers.'
