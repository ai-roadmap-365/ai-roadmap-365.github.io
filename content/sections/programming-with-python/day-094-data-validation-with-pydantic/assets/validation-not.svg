<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things validation is not</title>
  <style>
    .validation-not-bg   { fill: #f8fafc; }
    .validation-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .validation-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .validation-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .validation-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .validation-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .validation-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .validation-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .validation-not-row { opacity: 1; }
    .validation-not-r0 { animation-delay: 0.00s; }
    .validation-not-r1 { animation-delay: 0.45s; }
    .validation-not-r2 { animation-delay: 0.90s; }
    .validation-not-r3 { animation-delay: 1.35s; }
    .validation-not-r4 { animation-delay: 1.80s; }
    .validation-not-row { animation: validation-not-reveal 7.3s ease-in-out infinite; }
    @keyframes validation-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="validation-not-bg" width="980" height="390"/>
  <text class="validation-not-h1"  x="30" y="40">Four things validation is not</text>
  <text class="validation-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="validation-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="validation-not-name" x="46" y="122">The misconception</text>
  <text class="validation-not-desc" x="46" y="142">Commonly held.</text>
  <text class="validation-not-desc validation-not-row validation-not-r0" x="46" y="182">Type hints alone validate at runtime</text>
  <text class="validation-not-desc validation-not-row validation-not-r1" x="46" y="216">Validation is only for web input</text>
  <text class="validation-not-desc validation-not-row validation-not-r2" x="46" y="250">Coercion is always desirable</text>
  <text class="validation-not-desc validation-not-row validation-not-r3" x="46" y="284">Validated means safe</text>
  <text class="validation-not-desc validation-not-row validation-not-r4" x="46" y="318">It replaces the database schema</text>
  <rect class="validation-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="validation-not-name" x="526" y="122">What is true</text>
  <text class="validation-not-desc" x="526" y="142">Actually.</text>
  <text class="validation-not-desc validation-not-row validation-not-r0" x="526" y="182">Hints are ignored unless something checks</text>
  <text class="validation-not-desc validation-not-row validation-not-r1" x="526" y="216">Files and interfaces need it equally</text>
  <text class="validation-not-desc validation-not-row validation-not-r2" x="526" y="250">Silent coercion can hide real errors</text>
  <text class="validation-not-desc validation-not-row validation-not-r3" x="526" y="284">Shape is checked; meaning is not</text>
  <text class="validation-not-desc validation-not-row validation-not-r4" x="526" y="318">Both exist, at different boundaries</text>
  <text class="validation-not-sub" x="30" y="372">Shape being checked but not meaning is the distinction to keep: a well-formed value can still be nonsense, and business rules remain your responsibility.</text>
</svg>
