slug: data-validation-with-pydantic
title: 'Data Validation with pydantic'
section: programming-with-python
subsection: data-and-databases
week: 14
learning_promise: 'After this lesson you will be able to treat your program''s boundary as a place with a name and a rule rather than a hopeful assumption — declaring what "valid" means once, in the annotations you were already writing, and having it enforced on every record that crosses; building a miniature validator from __annotations__ first, so you can see exactly which decisions pydantic made on your behalf and why collecting every error rather than raising on the first is harder than it looks; stating precisely which conversions pydantic v2 performs in its default lax mode and which it refuses, and switching to strict mode when guessing is worse than failing; distinguishing required, optional and nullable, which are three separate facts routinely collapsed into one; reading a ValidationError properly, using its loc and type and never its msg, for the same reason a FastAPI 422 body''s msg is not an API; expressing a rule that no single field can carry with model_validator, and a derived value with computed_field; serializing with model_dump and model_dump_json and saying exactly where the round trip stops being symmetric; using TypeAdapter on things that are not models at all; and finally building the thing the rest of the week depends on — a data-quality gate that meets a two-thirds-bad batch, keeps what is good, refuses what is not, counts both, and reports every refusal well enough for somebody to go and fix the source, all without the run ever crashing.'
objectives:
  - 'Explain why hand-written validation rots, by comparing a longhand validator against the same rules declared once as annotations, and naming the four things the longhand version structurally cannot do'
  - 'Build a miniature validator from __annotations__ that distinguishes absent from null with a sentinel, applies an explicit coercion policy, recurses into nested models, and collects every error rather than raising on the first'
  - 'Declare a schema with BaseModel, Field constraints, and Annotated types that name a constrained value once and reuse it, including nested models and lists of models'
  - 'State which conversions pydantic v2 performs in lax mode and which it refuses, demonstrate the difference with strict=True, and choose between them by asking whether guessing is worse than failing'
  - 'Distinguish required, optional and nullable as three separate facts, and prove the distinction from the generated JSON Schema rather than from memory'
  - 'Read a ValidationError: find every problem in one pass, and use each entry''s loc, type and input — never its msg — as the interface tests and reports are written against'
  - 'Write field_validator and model_validator functions in before and after modes, and choose between them by whether the rule concerns one field or the combination'
  - 'Serialize with model_dump and model_dump_json, control the output with by_alias, exclude and exclude_none, and identify the three ways the validate-then-dump round trip is not symmetric'
  - 'Use TypeAdapter to validate and serialize types that are not models, and read the leading index in a list error''s loc'
  - 'Choose the model_config options that change behaviour rather than style — extra, frozen, str_strip_whitespace, validate_assignment — and justify extra="forbid" as a security setting rather than a preference'
  - 'Build a data-quality gate that processes a whole batch without crashing, emits the valid records, and writes a report naming every rejected record with its loc and type'
  - 'Place validation as the middle of three layers — the type checker before the program runs, the validator as data arrives, the database constraint as data is stored — and say what each catches that the others structurally cannot'
  - 'Compare pydantic against dataclasses with manual validation, attrs, marshmallow, cerberus, jsonschema and TypedDict with a static checker, with when to choose each, and state which of them were actually run'
  - 'Connect the day to AI practice: a language model''s structured output is untrusted text claiming to be JSON, a tool call is a validated argument object, and every dataset reaching training passes a gate like this one or fails silently'
prerequisites:
  - 'Day 75 — type hints and static checking; the annotations you already write are exactly what pydantic reads at runtime'
  - 'Day 82 — a first web API with FastAPI, where a 422 body was your first ValidationError rendered as JSON, and where loc and type were already the parts worth reading'
  - 'Day 88 — INSERT, UPDATE, CHECK and UNIQUE constraints; the third of the three layers this lesson places validation among'
  - 'Day 92 — JSON and serialization formats; a record only becomes a problem once it has been parsed into Python objects'
  - 'Day 55 — exceptions, try/except, and the difference between an error that should end a run and one that should be collected'
  - 'Day 43 — a working python3 on your PATH; the lab installs two pinned packages into its own virtual environment'
