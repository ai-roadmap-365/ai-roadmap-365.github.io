visuals:
  - id: validation-layers-architecture
    file: assets/validation-layers-architecture.svg
    type: diagram
    title: 'The three layers guarding one program: type checker, validator, database constraint'
    alt: 'Diagram: three layers guarding one program — the type checker before it runs, the validator at the boundary as data arrives, and the database constraint as data is stored — each shown with one mistake it catches and one that slips past it to be caught by the next layer'
    description: 'A static architecture diagram of three stacked layer panels, each carrying a green box naming a mistake it catches and an amber box naming a mistake that slips past it, with amber connector arrows carrying the escaped mistake down to the next layer. The top panel is the type checker, which runs before the program does (Day 75). It catches adding an int and a str — reading.pm25 plus the string "12" — which is wrong no matter what data ever arrives. It misses a JSON body in which pm2_5 is the string "not-measured": the annotation says float, and the checker never sees the file. The middle panel is the validator at the boundary, as data arrives (Day 94, pydantic). It catches that same pm2_5 value with error type float_parsing at loc pm2_5, and catches humidity_pct of 118 with error type less_than_equal. It misses a duplicate reading_id written straight to the table by a migration script that never called the model. The bottom panel is the database constraint, as data is stored (Day 88). It catches the second RD-0001 with UNIQUE on reading_id, and catches an out-of-range humidity with CHECK humidity_pct BETWEEN 0 AND 100. What it cannot do is anything about data it never receives: it cannot see a request that was rejected upstream, and it cannot hand a caller a field-level error report. A closing caption reads that each layer catches what the others structurally cannot.'
  - id: validation-flow
    file: assets/validation-flow.svg
    type: flow-animated
    title: 'A batch of twelve records through the gate: four accepted, eight rejected, the run continues'
    alt: 'Diagram: twelve raw records entering a validation gate, four passing through as typed objects and eight stopped with an error carrying loc, type and input, while the run continues with a count of accepted and rejected instead of crashing'
    description: 'An animated flow diagram, readable in full as a still image. On the left is a stack of twelve record cards labelled raw-readings.json — 12 records. In the middle is the boundary itself, drawn as a box labelled Reading.model_validate(raw). On the right are the two outcomes. The upper one, outlined in green, is accepted.jsonl, holding four typed Reading objects, with one written out concretely: reading_id RD-0001, pm25 12.4, band "moderate". The lower one, outlined in amber, is rejects.json, holding eight rejections, with one written out as a real JSON error entry — loc humidity_pct, type less_than_equal, input 118 — labelled record 4, RD-0005, so the still frame teaches the shape of an error rather than merely mentioning that one exists. Across the foot runs a counter strip reading seen 12, accepted 4, rejected 8, run continues, which is the point of the whole diagram: a batch that is two-thirds bad produces a report and a count rather than a traceback. Two tokens travel the diagram on a five-second loop — a blue one from the stack into the gate and onward to accepted, and an amber one that peels away from the gate down to rejects — while marching dashes flow along all three wires and the gate box lifts in colour as each token arrives. A prefers-reduced-motion block disables every animation and restores the resting state: the dashes become solid lines, the gate returns to its base shade, and both tokens rest visible at the start of their paths, with every label, value and number still present.'
