slug: web-scraping-responsibly
title: 'Web Scraping Responsibly'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to decide whether to scrape a site at all — checking for an API, a data dump, a feed or a sitemap first — honour robots.txt in code with urllib.robotparser rather than in a comment, rate-limit and identify yourself honestly, reason clearly about terms of service, personal data and copyright without pretending to legal certainty, extract data from messy real HTML with BeautifulSoup and CSS selectors, handle a missing element without crashing, follow pagination to its end, cache responses so a re-run costs the source nothing, and write the result to CSV with its provenance intact.'
objectives:
  - 'Explain why web scraping exists — the data is visible to a human but not offered in a machine-readable form — and why that framing makes an API, a data dump, an RSS feed or a sitemap the better answer whenever one exists'
  - 'Fetch and apply robots.txt with urllib.robotparser, including per-User-Agent rules, the crawl delay, and the correct handling of a 401, 403 or 404 response for the robots file itself'
  - 'Rate-limit a scraper, back off on 429 and Retry-After, and send a User-Agent that names the program and gives a contact address — and explain why forging headers or rotating addresses changes the character of what you are doing'
  - 'Reason clearly about terms of service as a contract question, about personal data (publicly visible is not the same as free to collect, store and republish), and about copyright in extracted content — while stating plainly that the legal position varies by jurisdiction and by case and that this is not legal advice'
  - 'Demonstrate on valid HTML three distinct ways a regular expression fails where an HTML parser succeeds — a class list, a nested tag and an HTML entity — and explain why the regex fails silently'
  - 'Extract data with BeautifulSoup using both find/find_all and CSS selectors, navigate the tree, read text and attributes, and resolve relative links with urljoin'
  - 'Handle a missing element as an ordinary None rather than an AttributeError, follow pagination until the site says there is no next page, and guard the loop against cycles and off-site links'
  - 'Cache responses on disk so a second run makes zero page requests, explain why robots.txt is the one response you never cache, and record provenance alongside the extracted data'
  - 'Argue the maintenance case: a scraper reads a user interface that changes without notice, so scrape the minimum you need and make it fail loudly'
  - 'Connect scraping provenance, licensing and consent to the dataset-governance questions that reappear later in the course, where training corpora and retrieval indexes are assembled by crawling'
prerequisites:
  - 'Day 78: HTTP itself — methods, status codes, headers, timeouts, raise_for_status, Session and connection reuse, and retries with backoff'
  - 'Day 74: testing at a boundary by injecting it, which is why this lesson passes the network session and the clock as parameters'
  - 'Days 71-73: pytest, fixtures and reading a failing test'
  - 'Day 65: the csv module, newline="", and why a CSV is written rather than joined'
  - 'Days 66 and 69: exceptions and error-handling strategy, dataclasses and type hints'
  - 'Day 43: creating and using a virtual environment'
