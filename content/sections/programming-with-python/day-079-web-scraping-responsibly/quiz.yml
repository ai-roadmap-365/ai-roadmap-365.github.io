questions:
  - question: 'A site has no robots.txt at all. What does that mean for you?'
    options:
      - 'Nothing may be fetched, because permission was never granted'
      - 'The site has opted out of the Robots Exclusion Protocol, so its terms of service no longer apply either'
      - 'No crawl preferences are published, so nothing is disallowed'
      - 'You should fall back to the robots.txt of the parent domain'
    answer_index: 2
    explanation: 'A missing robots.txt means the operator published no crawl preferences, which under RFC 9309 permits access on that basis. It says nothing whatsoever about the other three constraints, which is the trap: people treat a missing file as a green light for everything, when it is only a silence about one narrow question. There is no fallback to a parent domain; robots.txt is per host, always at the root.'

  - question: 'Why does the lab fetch robots.txt with its own requests Session rather than calling RobotFileParser.read()?'
    options:
      - 'To avoid an extra request, since the session has already fetched the file'
      - 'Because read() does not work on ports other than 80 and 443'
      - 'Because read() cannot parse a Crawl-delay directive'
      - 'So the request carries the scraper''s own honest User-Agent'
    answer_index: 3
    explanation: 'read() opens its own connection with urllib''s default headers, so the very first request you make to a site — the one asking permission — is the one that does not identify you. Fetching it yourself and passing the lines to parser.parse() keeps one honest identity across every request. read() works on any port and handles Crawl-delay perfectly well, and it is a separate request either way.'

  - question: 'Your scraper''s fetch function checks robots.txt, checks the cache, sleeps for the crawl delay, then makes the request. Why is the sleep placed after the cache check rather than before it?'
    options:
      - 'A cache hit makes no request, so there is nobody to be polite to'
      - 'Because sleeping first would make the cache lookup return stale data'
      - 'Because RobotFileParser cannot report a delay until a page has been fetched'
      - 'Because the crawl delay only applies to the first request of a session'
    answer_index: 0
    explanation: 'The crawl delay exists to limit the rate at which you contact the server. A cache hit never touches the server, so waiting before returning one protects nobody and costs you a second per page. In the lab this is directly observable: the second run reports zero sleeps and zero page requests. The other options describe behaviour that does not exist.'

  - question: 'A page contains the cell <td class="name featured">Mariner Astrolabe</td>. Why does the regular expression <td class="name">([^<]*)</td> miss it, while the selector td.name finds it?'
    options:
      - 'Because the regular expression is not compiled with re.DOTALL'
      - 'class holds a list, so the literal string never appears'
      - 'Because the word "featured" is a reserved attribute value in HTML'
      - 'Because BeautifulSoup silently rewrites multi-class attributes when it parses'
    answer_index: 1
    explanation: 'The class attribute is a space-separated list, and the selector .name asks whether "name" is one of its members. The regular expression asks whether the exact byte sequence class="name" appears, and it does not. The failure is silent — the row simply disappears from your results with no error — which is the deeper reason to use a parser. DOTALL is irrelevant here, nothing is reserved, and BeautifulSoup rewrites nothing.'

  - question: 'What do select_one and select return when nothing matches, and what is the bug that follows?'
    options:
      - 'An empty Tag and an empty list — and the bug is that get_text() on the empty Tag silently returns an empty string'
      - 'They raise ElementNotFound, and the bug is catching it too broadly'
      - 'None and an empty list — the bug is chaining onto them'
      - 'None and None respectively — and the bug is iterating over the None returned by select'
    answer_index: 2
    explanation: 'Neither raises. select_one gives None, select gives an empty list, and both let you carry on as though everything were fine until you touch the result. Chaining .get_text() onto an unchecked select_one is the single most common scraping crash, and it typically appears thousands of rows into a long run. The fix is to check for None and return None, letting the caller decide what a missing field means.'

  - question: 'You add a disk cache so a second run of your scraper makes zero requests — including for robots.txt. What is wrong with that?'
    options:
      - 'Nothing; caching robots.txt is the standard practice for a polite crawler'
      - 'It breaks RobotFileParser, which refuses to parse text it did not fetch itself'
      - 'It wastes disk space, since robots.txt is small relative to the pages'
      - 'Permission is a current intention; a cached one is stale'
    answer_index: 3
    explanation: 'Everything else in the cache is content, which does not change its meaning by ageing. robots.txt is a live instruction. Re-fetching it each run is why the lab''s second run makes exactly one request rather than none, and that one request is the point. RobotFileParser is perfectly happy to parse lines you hand it, and disk space is not the issue.'

  - question: 'Which of these is the strongest argument for extracting only the fields you actually need?'
    options:
      - 'Each extra field is another selector, and another legal question'
      - 'Smaller CSV files load faster into a spreadsheet'
      - 'BeautifulSoup slows down noticeably once you select more than about ten fields per row'
      - 'Sites commonly block clients that request more than a set number of elements per page'
    answer_index: 0
    explanation: 'Minimalism here pays in four currencies at the same time: maintenance, because a selector you did not write cannot break; storage; copyright, because a narrow factual extract raises fewer questions than a broad expressive one; and privacy, because the cheapest control over personal data is not collecting it. File size is trivial, BeautifulSoup does not slow down that way, and servers cannot see which elements you selected from a page they already sent.'

  - question: 'The lab''s harness proves the disallowed path was never requested by counting requests on the fixture SERVER. Why is the scraper''s own log not enough?'
    options:
      - 'Because the scraper''s log is written after the request, so it can miss the last entry'
      - 'The scraper''s own account is what is under test'
      - 'Because requests does not expose the URLs a Session has fetched'
      - 'Because robots.txt compliance is defined by RFC 9309 as a server-side measurement'
    answer_index: 1
    explanation: 'The claim being tested is "my scraper did not do this". Evidence produced by the thing under test is weak evidence for exactly that claim — a scraper that describes good behaviour in a comment and does the opposite would still write whatever its own log says. Counting on the server side measures the behaviour independently. Extension exercise 5 asks you to add the client-side proof as well, because two independent measurements of the same claim is how you catch a test that has quietly stopped testing anything.'
