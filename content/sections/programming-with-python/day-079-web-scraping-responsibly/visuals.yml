visuals:
  - id: scraping-pipeline-architecture
    file: assets/scraping-pipeline-architecture.svg
    type: diagram
    title: 'The architecture of a responsible scraper'
    alt: 'Diagram: the architecture of a responsible scraper, with three permission gates before the fetch stage, a local response cache, and the parse, extract, validate and store stages downstream of the cache'
    description: 'A vertical architecture diagram. At the top, a URL you want data from, annotated as visible to a human but not offered to a machine. Below it a blue permission band holds three gates that must all pass before any socket opens: robots.txt applied with urllib.robotparser can_fetch per User-Agent and per path; terms of service, labelled a contract question that no library can answer and that a person must read; and a rate limit taken from Crawl-delay or chosen conservatively, with the note that other people are sharing that server. Below the band sits the fetch stage — the only stage that touches the site — using a requests Session, a timeout and an honest User-Agent with a contact address, annotated as running once per page ever. Directly under it, drawn with a heavier border, is the local response cache: one file per URL on your own disk, described as the boundary between their cost and yours. Below the cache a grey band holds the four downstream stages in a row — parse with BeautifulSoup, extract with CSS selectors where a missing element becomes None, validate types and ranges and ask whether half the rows vanished, and store to CSV, JSON or a database with its provenance. A dashed blue arrow loops from the parse stage back up into the cache, captioned that every parser fix re-reads the cache rather than the site. Two closing notes state that robots.txt is the one thing never cached because permission is re-checked each run, and that provenance — which URL, which day, under which rules — travels with the data.'
  - id: scrape-decision-flow
    file: assets/scrape-decision-flow.svg
    type: flowchart
    title: 'The decision procedure before writing a scraper'
    alt: 'Flowchart: the decision procedure before writing a scraper, checking for an API, a data dump or a feed, then robots.txt, then the rate limit, then personal data, before reaching scrape politely and the extraction loop that treats a missing element as an ordinary None'
    description: 'A flowchart in two halves. The upper half is four questions asked in sequence, each with a branch that ends the project. Question one asks whether an API, a data dump or a feed exists, checking robots.txt for a Sitemap line, the page head for an RSS link, and a downloads page — or simply asking; yes leads to a terminal box reading use it and stop here, stable, permitted, cheaper. Question two asks whether robots.txt allows this exact path, using can_fetch with the User-Agent and the URL, and reminds the reader to read the terms of service themselves because no library can; no leads to a terminal box reading do not scrape, ask the owner instead. Question three asks what rate the site permits, taking Crawl-delay when declared and otherwise choosing a slow number and backing off on 429 and 5xx, noting that the site''s other users share that server; too slow to be useful leads to a terminal box reading do not scrape, ask for a bulk export. Question four asks whether personal data is involved — names, photos, profiles, reviews, posts — with the statement that publicly visible is not the same as free to collect, store and republish; yes leads to a terminal box reading stop, get advice, before the loop rather than after. Only a clear run through all four reaches the highlighted box scrape politely, listing an honest User-Agent with a contact address, a timeout, a cache, and the smallest set of fields actually needed. The lower half is the extraction loop: fetch this page from the cache if it is there, otherwise wait the crawl delay and request it once; for each row call select_one; found it leads to get_text and conversion with whitespace stripped and badges dropped; found nothing leads to a highlighted box stating that this is None and not a crash, so the field is recorded as missing and the loop carries on. A next-page check feeds a dashed arrow back to the fetch step, labelled same site only and stop if you have seen this URL before. Three closing lines note that the output is written with its provenance, that the page is a user interface that will change without notice, and that scraping the minimum you need is the way to limit what can break.'
