<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Parsing what you fetched</title>
  <style>
    .parsing-bg   { fill: #f8fafc; }
    .parsing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parsing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parsing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parsing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parsing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parsing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parsing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parsing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parsing-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parsing-stage { opacity: 1; }

    .parsing-s0 { animation-delay: 0.00s; }
    .parsing-e0 { animation-delay: 0.00s; }
    .parsing-s1 { animation-delay: 1.28s; }
    .parsing-e1 { animation-delay: 1.28s; }
    .parsing-s2 { animation-delay: 2.56s; }
    .parsing-e2 { animation-delay: 2.56s; }
    .parsing-s3 { animation-delay: 3.84s; }
    .parsing-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parsing-conn  { animation: parsing-trace 6.4s ease-in-out infinite; }
      .parsing-stage { animation: parsing-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parsing-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parsing-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parsing-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parsing-stage { animation: parsing-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parsing-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parsing-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parsing-bg" width="980" height="322"/>
  <text class="parsing-h1"  x="30" y="40">Parsing what you fetched</text>
  <text class="parsing-sub" x="30" y="64">Four steps.</text>
  <g class="parsing-stage parsing-s0">
    <rect class="parsing-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-step" x="44" y="142">01</text>
    <text class="parsing-name" x="70" y="142">Parse the markup with a real parser</text>
    <text class="parsing-desc" x="44" y="166">Never with regular expressions.</text>
  </g>
  <line class="parsing-line parsing-conn parsing-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parsing-tip)"/>
  <g class="parsing-stage parsing-s1">
    <rect class="parsing-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-step" x="280" y="142">02</text>
    <text class="parsing-name" x="306" y="142">Select the elements you need</text>
    <text class="parsing-desc" x="280" y="166">By structure, or by stable</text>
    <text class="parsing-desc" x="280" y="182">attributes.</text>
  </g>
  <line class="parsing-line parsing-conn parsing-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parsing-tip)"/>
  <g class="parsing-stage parsing-s2">
    <rect class="parsing-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-step" x="516" y="142">03</text>
    <text class="parsing-name" x="542" y="142">Knowing the structure will change without warning</text>
    <text class="parsing-desc" x="516" y="166">Which is the defining fragility.</text>
  </g>
  <line class="parsing-line parsing-conn parsing-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parsing-tip)"/>
  <g class="parsing-stage parsing-s3">
    <rect class="parsing-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parsing-step" x="752" y="142">04</text>
    <text class="parsing-name" x="778" y="142">So validate what you extracted</text>
    <text class="parsing-desc" x="752" y="166">And fail loudly when the shape</text>
    <text class="parsing-desc" x="752" y="182">changes.</text>
  </g>
  <text class="parsing-sub" x="30" y="304">Failing loudly on a shape change is what prevents the worst outcome: a scraper that quietly collects empty strings for weeks.</text>
</svg>
