<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to scrape</title>
  <style>
    .scrape-when-bg   { fill: #f8fafc; }
    .scrape-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scrape-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scrape-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scrape-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scrape-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scrape-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-when-row { opacity: 1; }
    .scrape-when-r0 { animation-delay: 0.00s; }
    .scrape-when-r1 { animation-delay: 0.45s; }
    .scrape-when-r2 { animation-delay: 0.90s; }
    .scrape-when-r3 { animation-delay: 1.35s; }
    .scrape-when-r4 { animation-delay: 1.80s; }
    .scrape-when-row { animation: scrape-when-reveal 7.3s ease-in-out infinite; }
    @keyframes scrape-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scrape-when-bg" width="980" height="390"/>
  <text class="scrape-when-h1"  x="30" y="40">When to scrape</text>
  <text class="scrape-when-sub" x="30" y="64">And when not to.</text>
  <rect class="scrape-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-when-name" x="46" y="122">Scrape</text>
  <text class="scrape-when-desc" x="46" y="142">Four cases.</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r0" x="46" y="182">No API exists and the terms permit it</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r1" x="46" y="216">Public factual data</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r2" x="46" y="250">Modest volume, politely fetched</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r3" x="46" y="284">With provenance recorded</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r4" x="46" y="318">And with maintenance budgeted</text>
  <rect class="scrape-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-when-name" x="526" y="122">Do not</text>
  <text class="scrape-when-desc" x="526" y="142">Also four.</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r0" x="526" y="182">An API exists — use it</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r1" x="526" y="216">The terms prohibit it</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r2" x="526" y="250">Personal data without a lawful basis</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r3" x="526" y="284">Behind a login or a paywall</text>
  <text class="scrape-when-desc scrape-when-row scrape-when-r4" x="526" y="318">Where the volume would burden the host</text>
  <text class="scrape-when-sub" x="30" y="372">An API existing is the first thing to check and the most often skipped, because it is usually faster to use than a scraper is to write.</text>
</svg>
