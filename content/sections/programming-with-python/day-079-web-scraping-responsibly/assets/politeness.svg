<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Fetching politely</title>
  <style>
    .politeness-bg   { fill: #f8fafc; }
    .politeness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .politeness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .politeness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .politeness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .politeness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .politeness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .politeness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .politeness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .politeness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .politeness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .politeness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .politeness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .politeness-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .politeness-stage { opacity: 1; }

    .politeness-s0 { animation-delay: 0.00s; }
    .politeness-e0 { animation-delay: 0.00s; }
    .politeness-s1 { animation-delay: 1.28s; }
    .politeness-e1 { animation-delay: 1.28s; }
    .politeness-s2 { animation-delay: 2.56s; }
    .politeness-e2 { animation-delay: 2.56s; }
    .politeness-s3 { animation-delay: 3.84s; }
    .politeness-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .politeness-conn  { animation: politeness-trace 6.4s ease-in-out infinite; }
      .politeness-stage { animation: politeness-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes politeness-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes politeness-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .politeness-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .politeness-stage { animation: politeness-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes politeness-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="politeness-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="politeness-bg" width="980" height="322"/>
  <text class="politeness-h1"  x="30" y="40">Fetching politely</text>
  <text class="politeness-sub" x="30" y="64">Four rules.</text>
  <g class="politeness-stage politeness-s0">
    <rect class="politeness-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="politeness-step" x="44" y="142">01</text>
    <text class="politeness-name" x="70" y="142">Identify yourself in the user agent</text>
    <text class="politeness-desc" x="44" y="166">With a way to contact you.</text>
  </g>
  <line class="politeness-line politeness-conn politeness-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#politeness-tip)"/>
  <g class="politeness-stage politeness-s1">
    <rect class="politeness-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="politeness-step" x="280" y="142">02</text>
    <text class="politeness-name" x="306" y="142">Rate limit deliberately</text>
    <text class="politeness-desc" x="280" y="166">One request at a time, with a</text>
    <text class="politeness-desc" x="280" y="182">delay.</text>
  </g>
  <line class="politeness-line politeness-conn politeness-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#politeness-tip)"/>
  <g class="politeness-stage politeness-s2">
    <rect class="politeness-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="politeness-step" x="516" y="142">03</text>
    <text class="politeness-name" x="542" y="142">Cache, so a rerun does not refetch</text>
    <text class="politeness-desc" x="516" y="166">Which is both polite and faster.</text>
  </g>
  <line class="politeness-line politeness-conn politeness-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#politeness-tip)"/>
  <g class="politeness-stage politeness-s3">
    <rect class="politeness-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="politeness-step" x="752" y="142">04</text>
    <text class="politeness-name" x="778" y="142">And honour the signals you are given</text>
    <text class="politeness-desc" x="752" y="166">Retry-after headers, robots</text>
    <text class="politeness-desc" x="752" y="182">directives.</text>
  </g>
  <text class="politeness-sub" x="30" y="304">Caching is the rule that helps both sides: development involves many reruns, and a cache turns hundreds of requests into one.</text>
</svg>
