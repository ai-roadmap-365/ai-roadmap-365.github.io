<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things scraping is not</title>
  <style>
    .scrape-not-bg   { fill: #f8fafc; }
    .scrape-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scrape-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scrape-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scrape-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scrape-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scrape-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-not-row { opacity: 1; }
    .scrape-not-r0 { animation-delay: 0.00s; }
    .scrape-not-r1 { animation-delay: 0.45s; }
    .scrape-not-r2 { animation-delay: 0.90s; }
    .scrape-not-r3 { animation-delay: 1.35s; }
    .scrape-not-r4 { animation-delay: 1.80s; }
    .scrape-not-row { animation: scrape-not-reveal 7.3s ease-in-out infinite; }
    @keyframes scrape-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scrape-not-bg" width="980" height="390"/>
  <text class="scrape-not-h1"  x="30" y="40">Four things scraping is not</text>
  <text class="scrape-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="scrape-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-not-name" x="46" y="122">The misconception</text>
  <text class="scrape-not-desc" x="46" y="142">Commonly held.</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r0" x="46" y="182">Public means free to use</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r1" x="46" y="216">Robots directives are legally binding</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r2" x="46" y="250">Scraping is a one-off task</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r3" x="46" y="284">Regular expressions can parse markup</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r4" x="46" y="318">Faster collection is better</text>
  <rect class="scrape-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-not-name" x="526" y="122">What is true</text>
  <text class="scrape-not-desc" x="526" y="142">Actually.</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r0" x="526" y="182">Public to read is not public to republish</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r1" x="526" y="216">They are a signal; terms and law bind</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r2" x="526" y="250">Sites change; scrapers need maintenance</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r3" x="526" y="284">Use a parser; markup is not regular</text>
  <text class="scrape-not-desc scrape-not-row scrape-not-r4" x="526" y="318">Politeness keeps you unblocked</text>
  <text class="scrape-not-sub" x="30" y="372">Public to read not being public to republish is the distinction that matters most for training data, and it is the one most often glossed over.</text>
</svg>
