<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four considerations.">
  <title>What decides whether you may</title>
  <style>
    .scrape-legal-bg   { fill: #f8fafc; }
    .scrape-legal-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-legal-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-legal-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-legal-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-legal-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scrape-legal-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-legal-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scrape-legal-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scrape-legal-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scrape-legal-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scrape-legal-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scrape-legal-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scrape-legal-row { opacity: 1; }
    .scrape-legal-r0 { animation-delay: 0.00s; }
    .scrape-legal-r1 { animation-delay: 0.45s; }
    .scrape-legal-r2 { animation-delay: 0.90s; }
    .scrape-legal-r3 { animation-delay: 1.35s; }
    .scrape-legal-r4 { animation-delay: 1.80s; }
    .scrape-legal-row { animation: scrape-legal-reveal 7.3s ease-in-out infinite; }
    @keyframes scrape-legal-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scrape-legal-bg" width="980" height="390"/>
  <text class="scrape-legal-h1"  x="30" y="40">What decides whether you may</text>
  <text class="scrape-legal-sub" x="30" y="64">Four considerations.</text>
  <rect class="scrape-legal-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-legal-name" x="46" y="122">The question</text>
  <text class="scrape-legal-desc" x="46" y="142">What to check.</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r0" x="46" y="182">Is there an API?</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r1" x="46" y="216">What do the robots directives say?</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r2" x="46" y="250">What do the terms of service say?</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r3" x="46" y="284">Is the content copyrighted?</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r4" x="46" y="318">Is any of it personal data?</text>
  <rect class="scrape-legal-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scrape-legal-name" x="526" y="122">What it governs</text>
  <text class="scrape-legal-desc" x="526" y="142">Why it matters.</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r0" x="526" y="182">Using one is faster and clearly permitted</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r1" x="526" y="216">A technical signal about crawling</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r2" x="526" y="250">A contractual restriction</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r3" x="526" y="284">What you may store and republish</text>
  <text class="scrape-legal-desc scrape-legal-row scrape-legal-r4" x="526" y="318">Data protection law applies regardless</text>
  <text class="scrape-legal-sub" x="30" y="372">The last row applies whatever the site permits: personal data carries obligations that no terms of service can waive on your behalf.</text>
</svg>
