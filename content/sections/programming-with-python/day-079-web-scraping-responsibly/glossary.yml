terms:
  - term: 'Web scraping'
    definition: 'Writing a program that reads a web page and extracts structured data from it. It exists because the data is visible to a human but is not offered in a machine-readable form — it is a workaround for a missing interface, not a right and not a technique of first resort.'
  - term: 'Crawler'
    definition: 'A program that discovers and follows links across a site or the wider web. Crawling finds pages; scraping pulls fields out of them. Most real jobs are a small crawl feeding a focused scrape, and each has its own failure mode: a bad crawler goes where it should not, a bad scraper produces wrong data quietly.'
  - term: 'robots.txt'
    definition: 'A plain-text file at the root of a host, at the fixed path /robots.txt, in which the operator states which paths automated clients should not fetch, grouped by User-agent. Proposed by Martijn Koster in 1994 and formalised as RFC 9309 in 2022. It is a published preference honoured by clients that choose to, never an access control.'
  - term: 'Crawl delay'
    definition: 'A widely-supported robots.txt directive asking clients to wait a given number of seconds between consecutive requests. It is an extension rather than part of RFC 9309 proper. Python exposes it as RobotFileParser.crawl_delay, which accepts only whole numbers and returns None when nothing is declared — in which case you choose a conservative default yourself.'
  - term: 'Rate limiting'
    definition: 'Deliberately restricting how fast your program makes requests, so that a shared server keeps working for everybody else using it. In practice: a delay between requests, one request at a time per host, and backing off when the server answers 429 Too Many Requests or sends a Retry-After header.'
  - term: 'User-Agent'
    definition: 'The HTTP header identifying the client making a request. An honest one names your program and gives a way to contact you, so an operator who notices you can send an email rather than a block. Copying a browser''s string to disguise a scraper tells the operator something about your intentions, and it is not the something you want.'
  - term: 'HTML parser'
    definition: 'A library that turns markup into a navigable tree, handling nested tags, attribute lists, entities and broken markup correctly. BeautifulSoup with the html.parser backend is Python''s default choice; lxml and selectolax are faster alternatives. A parser is the reason you never match HTML with a regular expression.'
  - term: 'DOM'
    definition: 'The Document Object Model — the tree of elements a document becomes once it is parsed, with parents, children and siblings. BeautifulSoup builds one from HTML text; a browser builds one and then lets JavaScript modify it, which is why some pages contain no data until their scripts have run.'
  - term: 'CSS selector'
    definition: 'The pattern language used to address elements in a stylesheet, and in BeautifulSoup''s select and select_one. Selectors such as table.catalogue tr.item match on structure rather than on literal text, which is why a cell with class="name featured" is still found by td.name while the obvious regular expression misses it entirely.'
  - term: 'XPath'
    definition: 'A query language for tree documents, available in Python through lxml. It can express things CSS selectors cannot — selecting an element by its text content, and walking back up or sideways in the tree — which makes it the right tool for label-and-value layouts where the value cell has no class of its own.'
  - term: 'Pagination'
    definition: 'Splitting a long listing across several pages. The robust way to follow it is to follow the next link until there is not one, because the last page typically renders the control as disabled text rather than an anchor. Stopping on a fixed page count or a fixed item count works today and silently misses tomorrow''s new page.'
  - term: 'Response cache'
    definition: 'Storing fetched page bodies on your own disk, keyed by URL, so that re-running your parser makes no new requests. Primarily an ethical control rather than a performance one: it is what makes your twentieth parser fix cost the source nothing. The one response you never cache is robots.txt, because permission is a current intention rather than a fact.'
  - term: 'Brittleness'
    definition: 'The property that makes scrapers break: you are reading a user interface, not a data source, and nobody sends a deprecation notice before renaming a div. A redesign, a class rename, a field moving into JavaScript or a new cookie banner will each break a working scraper without warning.'
  - term: 'Terms of service'
    definition: 'The prose conditions under which a site permits use, frequently addressing automated access explicitly. They are a contract question rather than a technical one: no library can read them for you, they live in a different place from robots.txt, and honouring one document says nothing about the other.'
  - term: 'Personal data'
    definition: 'Information about identifiable people — names, photographs, profiles, reviews, posts, addresses. The rule to hold onto is that publicly visible is not the same as free to collect, store and republish, because those are three separate acts that data-protection regimes treat separately. Aggregation changes the character of the data: a hundred unremarkable public facts about one person become a profile.'
  - term: 'Provenance'
    definition: 'The record of where a piece of data came from: the source URL, the date it was fetched, and the rules in force at the time. Cheap to record while scraping and impossible to reconstruct afterwards. It is the same question that reappears later as dataset governance, when a training corpus or a retrieval index has to answer for its contents.'
