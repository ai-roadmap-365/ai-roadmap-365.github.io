slug: beyond-tables-nosql-and-key-value
title: 'Beyond Tables: NoSQL and Key-Value Stores'
section: programming-with-python
subsection: data-and-databases
week: 14
learning_promise: 'After this lesson you will be able to treat "NoSQL" as what it actually is — four largely unrelated families of store, each of which drops one guarantee the relational model gives you in exchange for something else — and choose between them by answering two questions in order: which guarantee am I giving up, and do I need it. You will name the four strains that genuinely justify leaving the relational model and reject the ones that do not; measure a key-value store''s central trade by counting keys examined for a lookup by key against a lookup by anything else; build a secondary index by hand and watch it go stale with no error raised; state schema-on-write against schema-on-read in terms of who pays and when, and say where the schema goes when you stop declaring it; do a join in application code and price both the round trip and the denormalization that avoids it; state the CAP theorem correctly as a choice that exists only during a partition, and give the concrete operational consequence of each branch; build a document store from first principles over sqlite3 with put, get, delete, find-by-field and an index on an extracted expression that turns a SCAN into a SEARCH; name the four things that store does not give you; use SQLite''s json_extract, -> , ->> and json_each as the pragmatic middle path most teams should try first; and demonstrate schema-on-read by writing one document with a misspelled field name, proving it was stored and proving the query cannot see it — because either half alone proves nothing.'
objectives:
  - 'State why "NoSQL" is not one thing and not the opposite of SQL, name the four families, and replace the question "SQL or NoSQL?" with the two questions that actually decide it'
  - 'Name the four workload properties that genuinely strain the relational model — per-record schema variation, access by one key only, write volume beyond one machine, and documents whose shape is the record — and reject the common reasons that are not among them'
  - 'Measure a key-value store''s defining trade in a real run: one key examined for a lookup by key against every key examined for a lookup by anything else, with the loop written in your own process'
  - 'Build a secondary index by hand over a key-value store, demonstrate it going stale after a delete with no error raised, and identify which relational feature exists to prevent exactly that'
  - 'Explain schema-on-write against schema-on-read in terms of who pays and when, and state where the schema goes when you stop declaring it in the database'
  - 'Price the loss of joins both ways — the N+1 round trip in application code, and the denormalization that avoids it at the cost of one fact living in many places with no cascade and no error when you miss one'
  - 'State the CAP theorem correctly as a claim about behaviour during a network partition, give the three reasons "pick two of three" is wrong, and give the concrete operational consequence of refusing the write against accepting it'
  - 'Build a document store from first principles over sqlite3 — put, get, delete, find by field — and add an index on an extracted expression that changes the query plan from SCAN to SEARCH'
  - 'Name the four guarantees that from-scratch store does not provide, and explain why its one atomic-transaction capability was inherited from the relational engine underneath rather than designed in'
  - 'Query inside a JSON document from SQL with json_extract, json_each and the -> and ->> operators, state what the two operators return differently, and explain why an expression index helps only the exact expression it indexes'
  - 'Demonstrate schema-on-read by writing a document with one misspelled field name, then assert both halves: the document is stored, and the query for that field cannot see it'
  - 'Give five jobs a key-value store is exactly right for — caching, sessions, rate limiting, feature flags and work lists — with the access pattern that makes each one fit'
  - 'Compare each leading store honestly — SQLite and PostgreSQL with JSON, Redis, Memcached, MongoDB, CouchDB, Cassandra, HBase, Neo4j and DynamoDB — with when to choose it, how it is used, one concrete example, and its free-versus-paid shape, while stating plainly which ones were actually run'
  - 'Interpolate a field name into SQL safely through an allow-list, and explain why the value is a bound parameter while the JSON path cannot be if the expression index is to remain usable'
  - 'Explain how the document model relocates sensitive fields out of columns you can grant, revoke and enumerate, and why that is a data-protection consequence rather than a database one'
  - 'Connect the day to AI practice concretely: a vector database as a key-value store keyed by an embedding with nearest-neighbour lookup, a feature store as a key-value store with time semantics, and retrieval metadata as an unenforced document'
prerequisites:
  - 'Day 85 — the relational model, tables and types, and SQLite from the shell and from Python'
  - 'Day 86 — SELECT with WHERE, GROUP BY and aggregates, and NULL''s three-valued logic, which is why a query on a missing field returns silence rather than an error'
  - 'Day 87 — primary and foreign keys, joins, and referential integrity, which is the guarantee three of today''s four shapes give up'
  - 'Day 88 — constraints, normalization and the update anomaly, which denormalization reintroduces on purpose'
  - 'Day 89 — indexes and EXPLAIN QUERY PLAN; today''s index sits on an extracted expression rather than a column, and reading the plan is how you confirm it worked'
  - 'Day 90 — SQLite from Python, bound parameters, and the repository pattern the document store is built on'
  - 'Day 91 — the library schema this lesson remodels four ways; the comparison is direct because the domain is the same'
  - 'Days 43 to 60 — Python dictionaries, functions, classes, and the json module'
