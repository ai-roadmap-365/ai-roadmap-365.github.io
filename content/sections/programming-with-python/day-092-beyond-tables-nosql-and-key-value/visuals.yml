visuals:
  - id: store-families-architecture
    file: assets/store-families-architecture.svg
    type: diagram
    title: 'One record in four shapes: relational rows, a key and an opaque value, a nested document, and a graph of nodes and edges'
    alt: 'Diagram: one record — The C Programming Language, published 1978, shelf A3, credited to Kernighan and Ritchie — drawn four ways as relational rows with a foreign key, as a key addressing an opaque value, as one nested document, and as a graph of nodes and edges, with a table comparing what each shape can be asked'
    description: 'A static architecture diagram in four columns, showing the same library record — The C Programming Language, book_id 101, published 1978, shelf A3, credited to Brian W. Kernighan and Dennis M. Ritchie — modelled four ways, above a comparison table. Column one, relational, shows three white boxes joined by foreign-key arrows: a books table holding 101 with the title, 1978 and A3; a book_authors junction drawn with a heavier blue outline, labelled as keyed on the pair and holding the rows 101 to 1 and 101 to 2; and an authors table holding Kernighan and Ritchie, with a caption noting that a column holds one value so the author list needs a third table. Column two, key-value, shows the single key book:101 in a blue-outlined box, an arrow down to a grey box labelled the value, containing three lines of hexadecimal bytes and the note that it is 130 bytes and opaque, with captions saying the store never looks inside, that JSON here is the author choice rather than the store requirement since a pickle or a JPEG would do as well, and that both the shelf and the authors are inside the blob and invisible until you decode it. Column three, document, shows one blue-outlined box keyed book:101 containing the whole JSON document across ten lines with the authors as a nested list, and captions noting that the list which could not live on a row is simply a field, that the store can filter on any field it can parse and index one if you name the exact expression, and that nothing checks the field names. Column four, graph, shows a Book node with the title and year, two CREDITED edges down to two Author nodes for Kernighan and Ritchie, and one SHELVED_ON edge to a Shelf A3 node, with captions noting that the edge itself is stored and named and can carry its own properties such as credit order, and that a graph is built for hops rather than bulk scans. Across the foot a five-column table asks the same six questions of all four shapes. Getting book 101 is one lookup everywhere. Every book on shelf A3 is a WHERE clause relationally, a scan of every key in your own code for key-value, an indexable field query for a document, and a walk of the SHELVED_ON edges for a graph. Finding who wrote it is two JOINs inside the engine, a decode and your own loop, a field read, or one hop per edge. A field typed titel is REFUSED immediately and by name relationally, and accepted silently by all three of the others. What each gave up is: nothing for relational, which is the baseline; every query except the one by key; schema enforcement and joins across documents; and schema plus easy splitting across machines. What each got for it is: integrity, joins and any question you think of later; the simplest contract there is and easy splitting; the record own shape stored and fetched whole; and relationships as first-class things you can traverse. A closing line directs the reader to the fourth row, noting that only one shape had anything to say about the typo and that it said it at the moment of the mistake.'
  - id: partition-choice-flow
    file: assets/partition-choice-flow.svg
    type: flow-animated
    title: 'The CAP choice drawn as what it actually is: what a replicated store does with a write while the link between its replicas is broken'
    alt: 'Diagram: a write arriving at one replica of a catalogue while the network link to the other replica is broken, and the two branches available — refuse the write and keep every reader agreeing, or accept it and reconcile the two versions after the link heals — with the operational consequence written out at the end of each path'
    description: 'An animated flow diagram, readable in full as a still image, showing the CAP theorem as the operational choice it actually is. Along the top, a London desk writes that book 101 moves from shelf A3 to B7; the write travels along a marching-dash wire into Replica A in London, which now has shelf equal to B7. To its right the link is drawn as two broken amber segments with a lightning break between them, labelled network partition, under the note that A and B cannot reach each other and neither knows whether the other is dead or merely unreachable. Beyond the break sits Replica B in Mumbai, still holding shelf equal to A3, being read by a Mumbai desk asking where book 101 is. From the two replicas the diagram splits into two branches. The left branch, outlined in green, is Choice 1, refuse the write: replica A will not accept a change it cannot confirm with B, the librarian gets an error rather than a receipt, and the note records that this is called a CP system and that majority-quorum stores behave this way. Its consequence box states that no reader anywhere is ever told a different answer from another reader, that there is one truth about book 101, that the London desk cannot issue the book until the link heals so the queue waits on a network cable, and that you did not lose the data, you lost the minutes. Its verdict strip reads consistency kept, availability given up. The right branch, outlined in amber, is Choice 2, accept the write: each side serves whoever can reach it and records what it did, everyone gets a receipt, and the note records that this is called an AP system and that eventually-consistent stores behave this way. Its consequence box states that both desks keep working and nobody is turned away, that for as long as the link is down London says B7 and Mumbai says A3 and both are answering honestly, and that when the link heals something must merge them by last-write-wins, a version vector, or a person deciding. Its verdict strip reads availability kept, consistency deferred to a repair. A panel across the foot states what the theorem actually claims: that when a partition occurs a distributed store cannot be both consistent and available and must give up one of them for as long as the partition lasts; that it does not say pick two of three, because nobody chooses partition tolerance since networks fail whether or not you agreed to it, making P a condition rather than an option; and that when there is no partition, which is nearly always, a well-built store gives you consistency and availability at the same time with no trade to make. The animation carries a blue token from the desk into replica A, marches the dashes along the healthy wires, pulses the severed link so the eye finds the cause, lights the two replicas in turn, and brings the two outcome branches to full emphasis one after the other rather than both at once. A prefers-reduced-motion block disables every animation and restores the resting state, in which both replicas are shaded, the severed link is fully drawn, the token sits at the desk, and both branches and every label are shown at full opacity.'
