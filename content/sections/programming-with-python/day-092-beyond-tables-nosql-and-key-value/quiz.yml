questions:
  - question: 'A cataloguer stores a book document whose title field is spelled "titel". What happens in a document store, and what is the characteristic symptom?'
    options:
      - 'The write is rejected, because the store validates documents against the shape of the documents already in the collection'
      - 'The write succeeds and a warning is logged, so the mistake is visible in monitoring'
      - 'The write succeeds but the document is unreadable, so the next get() for that key raises'
      - 'The write succeeds and every title query returns one row fewer'
    answer_index: 3
    explanation: 'This is the day''s central demonstration, and it was run in four stores. The relational table refused the write immediately with "table books has no column named titel". The dbm store, the JSON-in-SQLite table and the from-scratch document store all accepted it — five documents stored in each — and in every one of them a query for that title returned zero rows. Notice why: json_extract returns SQL NULL for a field that does not exist, and NULL = ''anything'' is never true, so the comparison is simply not satisfied. Nothing has gone wrong from the store''s point of view. Option 0 describes a validation feature some products offer if you configure it, but it is not what a document store does by default, and the whole point of schema-on-read is that no shape was declared to validate against. Option 1 is wishful: there is no signal, which is precisely what makes this expensive. Option 3 confuses a malformed field name with malformed JSON — the document parses perfectly, which is why the CHECK (json_valid(body)) constraint passes too.'

  - question: 'You have four million records in a key-value store, keyed as book:{id}. You need to answer "every book on shelf A3". What does this cost, and where does the work happen?'
    options:
      - 'Four million key reads and four million JSON decodes, in your own process, in a loop you write yourself'
      - 'One index lookup, because the store maintains a secondary index on every field automatically'
      - 'One scan inside the store''s engine, which is slower than an index but still much faster than doing it in application code'
      - 'It is impossible: a key-value store cannot return more than one value per request'
    answer_index: 0
    explanation: 'The lab measures exactly this on a small scale: "keys examined: 1" for a lookup by key, and "keys examined: 4 of 4 (every key in the store)" plus "json.loads calls: 4" for a filter on published_year. Scale that to four million and the shape is unchanged. Two things make it worse than a relational scan, and both are worth internalising. First, the loop runs in your process rather than in a tuned engine next to the disk, so every value crosses a process or network boundary. Second, you decode every value on the way past, matching or not, because the store cannot tell you which ones match — it never looked inside them. Option 0 is the opposite of the key-value contract: the value is opaque, so there is nothing to index. Option 2 describes a relational or document store''s scan, which is a genuinely different and much better thing. Option 3 is wrong — you can iterate the keys — but it is wrong in an instructive direction, because the iteration is the problem.'

  - question: 'Which statement of the CAP theorem is correct?'
    options:
      - 'A distributed store may provide any two of consistency, availability and partition tolerance, but never all three'
      - 'Under a partition, you must give up consistency or availability'
      - 'A distributed store must always choose between being consistent and being available, whether or not the network is healthy'
      - 'Consistency and availability are impossible to achieve together in any system that replicates data'
    answer_index: 1
    explanation: 'Option 0 is the theorem: Brewer stated it as a conjecture at the 2000 Symposium on Principles of Distributed Computing, and Gilbert and Lynch proved it in 2002. Option 1 is the popular framing and it is wrong for a reason Brewer himself set out in 2012 — you do not choose P. Networks drop and delay messages whether or not you agreed to it, so partition tolerance is a condition you are subjected to rather than one of three options on a menu; a system that "chose CA" has merely chosen to be broken when the network is. Option 2 misses the entire force of the result: the trade exists only during a partition, and since partitions are rare, a well-built store gives you consistency and availability at the same time essentially all the time. Option 3 overstates it into something false. The practical version is the operational one: when the link between London and Mumbai is down, either refuse the write and make the desk wait for a cable, or accept it and reconcile two versions later — and which is right depends on whether the record is a shopping cart or a seat on an aircraft.'

  - question: 'You are storing user sessions: read on every page view by session id, written on login, expired after an hour, never queried any other way. Which store fits, and why?'
    options:
      - 'A graph database, because sessions connect users to activity and traversal is the natural operation'
      - 'A wide-column store, because session volume is high and writes must be spread across machines'
      - 'A key-value store — one access pattern, and expiry is built in'
      - 'A document store, because a session holds nested data and its shape varies between users'
    answer_index: 2
    explanation: 'The test for a key-value store is one sentence, and this workload satisfies it exactly: there is exactly one access pattern and you always know the key. Nothing ever asks "which sessions started before noon" — that question is meaningless to the application — so every index, constraint and join capability of a richer store is machinery you would pay for in memory and write latency and never use. Expiry seals it: a key with a time-to-live is the logout, handled by the store rather than by a cleanup job you have to write and monitor. Option 3 is the most tempting wrong answer, and it fails on the second half of the test rather than the first: a session may well hold nested data, but you never filter on any field inside it, so the ability to query inside the value buys you nothing. Option 0 has no traversal question to answer. Option 2 reaches for distribution before measuring, which is the single most common error in this area — the four strains that justify leaving the relational model are specific, and "it feels like a lot of traffic" is not among them.'

  - question: 'You create an index with CREATE INDEX idx ON documents (json_extract(body, ''$.shelf'')), then run a query filtering on body ->> ''$.shelf''. EXPLAIN QUERY PLAN still says SCAN. Why?'
    options:
      - 'Expression indexes are advisory in SQLite and the planner ignores them for JSON paths'
      - 'The index has not finished building; run ANALYZE and the plan will change'
      - 'The -> and ->> operators cannot be used in a WHERE clause at all'
      - 'An expression index matches only the exact expression indexed'
    answer_index: 3
    explanation: 'This was observed while writing the lesson and is a numbered step in the lab, because it costs people real time. The planner is matching expressions syntactically, not reasoning about intent. Both spellings return the same value, and the index is useless for the second one. The fix is boring and effective: pick one spelling and use it in the index and in every query that should benefit. The same trap catches a query written with a different JSON path, a cast around the extraction, or a function wrapped over it. Option 0 is invented. Option 1 is a plausible-sounding non-answer — SQLite builds the index synchronously in the CREATE INDEX statement, and ANALYZE gathers statistics rather than completing an index. Option 2 is false; the operators work fine in a WHERE clause, which is exactly why this is a trap rather than an error. The general habit to take away is the Day 89 one: after creating any index, read the plan and confirm SEARCH rather than assuming.'

  - question: 'What is the most accurate description of what a document store gives up compared with a relational schema?'
    options:
      - 'It gives up schema enforcement at write time, and joins'
      - 'It gives up the schema entirely, so validation becomes impossible and no shape can be relied upon'
      - 'Nothing is given up: it enforces the same constraints, just without requiring you to declare columns in advance'
      - 'It gives up transactions, which is why document stores can never write two records atomically'
    answer_index: 0
    explanation: 'Option 2 is the honest accounting, and the from-scratch store in the lab demonstrates each part by running it: the misspelled document is accepted; a loan referencing book 999 is accepted although no such book exists; and relating a loan to its book is a second round trip in Python rather than a join. The schema did not disappear — it relocated from a place that enforces to a place that hopes, which is why teams five years into a document store are usually writing a validation layer that reimplements schema-on-write, badly and in one language. Option 1 overstates this into something false and unhelpfully fatalistic: you can absolutely validate, and you should, and the lab''s exercise 4 has you write the check. Option 0 is the marketing version. Option 3 is a common half-truth: cross-document atomicity is genuinely hard in a distributed store and was among the last features such systems gained, but it is not impossible — and note the twist in the lab, where the store rolls back a partial write successfully only because it is built on a relational engine that already had transactions. That capability was inherited, not designed in.'

  - question: 'Your team proposes copying each book''s title into every loan document so the loan report needs no join. What is the specific cost you are accepting?'
    options:
      - 'A larger database, which is the only real consequence since storage is cheap'
      - 'One fact now lives in many places, with no cascade'
      - 'Slower reads, because the store must now parse a larger document on every fetch'
      - 'Loss of the ability to query loans by book, since the relationship is no longer recorded'
    answer_index: 1
    explanation: 'Denormalization is a real technique with a real payoff — the read becomes one lookup instead of two — and it should be chosen knowingly rather than drifted into. The cost is precisely the update anomaly that Codd''s normalization work was written to eliminate in the early 1970s: change one book''s title and you must find every loan document that copied it. There is no UPDATE ... WHERE across documents, no foreign key, no cascade, and crucially no error if you miss one. You are simply left with two spellings of the same book and no way to tell which is current. Option 0 treats the only cost as disk, which is the cheap part. Option 2 gets the direction wrong: reads get faster, which is the entire reason to do it. Option 3 is false — the book_id is still there — and it hides the real problem, which is not that the relationship is lost but that the copied value can silently diverge from its source. The mitigation, when you do this, is to make one place authoritative and treat every copy as a cache with a documented refresh path.'

  - question: 'A team stores per-chunk metadata beside the embeddings in a retrieval system — source, page_number, ingested_at. A scraper begins writing "pageno" instead of "page_number". What happens?'
    options:
      - 'Ingestion fails for those chunks, so they are simply missing and the gap is visible in the ingestion logs'
      - 'The embeddings are unaffected but the vector index rejects the malformed metadata, raising at query time'
      - 'The chunks store, but every page-number filter stops matching'
      - 'Nothing at all: metadata field names are normalised automatically by every vector store'
    answer_index: 2
    explanation: 'This is the day''s AI thread, and it is the titel document wearing different clothes. Metadata beside a chunk is a document, and nothing enforces its shape, because the store you chose does not enforce shapes. So the chunks embed fine, store fine and are retrievable by similarity — they are simply invisible to any filter naming page_number. The failure has no error, no exception and no log line; it shows up as a retrieval quality metric drifting down, which is the hardest kind of problem to attribute, and it is why teams spend weeks tuning a reranker to compensate for a spelling mistake. Option 0 describes what a schema-on-write system would have done, and is exactly the outcome you have given up. Option 1 invents a validation step that does not exist. Option 2 is comfortable and false. The defence is the one from the lab: write the required-fields check yourself at ingestion, and run the audit query — find every record where the field IS NULL — regularly, because the records written before you added the check are still there.'
