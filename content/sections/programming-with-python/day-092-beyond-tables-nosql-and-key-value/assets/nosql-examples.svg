<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cases.">
  <title>Where each family fits</title>
  <style>
    .nosql-examples-bg   { fill: #f8fafc; }
    .nosql-examples-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-examples-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-examples-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-examples-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-examples-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-examples-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-examples-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-examples-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-examples-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-examples-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-examples-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-examples-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nosql-examples-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nosql-examples-stage { opacity: 1; }

    .nosql-examples-s0 { animation-delay: 0.00s; }
    .nosql-examples-e0 { animation-delay: 0.00s; }
    .nosql-examples-s1 { animation-delay: 1.28s; }
    .nosql-examples-e1 { animation-delay: 1.28s; }
    .nosql-examples-s2 { animation-delay: 2.56s; }
    .nosql-examples-e2 { animation-delay: 2.56s; }
    .nosql-examples-s3 { animation-delay: 3.84s; }
    .nosql-examples-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nosql-examples-conn  { animation: nosql-examples-trace 6.4s ease-in-out infinite; }
      .nosql-examples-stage { animation: nosql-examples-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nosql-examples-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nosql-examples-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nosql-examples-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nosql-examples-stage { animation: nosql-examples-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nosql-examples-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nosql-examples-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nosql-examples-bg" width="980" height="322"/>
  <text class="nosql-examples-h1"  x="30" y="40">Where each family fits</text>
  <text class="nosql-examples-sub" x="30" y="64">Four cases.</text>
  <g class="nosql-examples-stage nosql-examples-s0">
    <rect class="nosql-examples-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-examples-step" x="44" y="142">01</text>
    <text class="nosql-examples-name" x="70" y="142">Caching and sessions: key-value</text>
    <text class="nosql-examples-desc" x="44" y="166">Where lookup by key is</text>
    <text class="nosql-examples-desc" x="44" y="182">everything.</text>
  </g>
  <line class="nosql-examples-line nosql-examples-conn nosql-examples-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nosql-examples-tip)"/>
  <g class="nosql-examples-stage nosql-examples-s1">
    <rect class="nosql-examples-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-examples-step" x="280" y="142">02</text>
    <text class="nosql-examples-name" x="306" y="142">Content with varying fields: document</text>
    <text class="nosql-examples-desc" x="280" y="166">Where records genuinely differ.</text>
  </g>
  <line class="nosql-examples-line nosql-examples-conn nosql-examples-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nosql-examples-tip)"/>
  <g class="nosql-examples-stage nosql-examples-s2">
    <rect class="nosql-examples-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-examples-step" x="516" y="142">03</text>
    <text class="nosql-examples-name" x="542" y="142">Very high write volume: wide-column</text>
    <text class="nosql-examples-desc" x="516" y="166">Where a single machine cannot</text>
    <text class="nosql-examples-desc" x="516" y="182">cope.</text>
  </g>
  <line class="nosql-examples-line nosql-examples-conn nosql-examples-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nosql-examples-tip)"/>
  <g class="nosql-examples-stage nosql-examples-s3">
    <rect class="nosql-examples-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-examples-step" x="752" y="142">04</text>
    <text class="nosql-examples-name" x="778" y="142">Networks and paths: graph</text>
    <text class="nosql-examples-desc" x="752" y="166">Where relationship depth is the</text>
    <text class="nosql-examples-desc" x="752" y="182">question.</text>
  </g>
  <text class="nosql-examples-sub" x="30" y="304">Depth is the distinguishing feature for graphs: a relational join handles one or two hops well, and arbitrary-depth traversal is where it stops being natural.</text>
</svg>
