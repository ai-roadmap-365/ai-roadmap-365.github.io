<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By how you retrieve them.">
  <title>Storing possessions</title>
  <style>
    .storage-choice-bg   { fill: #f8fafc; }
    .storage-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .storage-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .storage-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .storage-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .storage-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .storage-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .storage-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .storage-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .storage-choice-row { opacity: 1; }
    .storage-choice-r0 { animation-delay: 0.00s; }
    .storage-choice-r1 { animation-delay: 0.45s; }
    .storage-choice-r2 { animation-delay: 0.90s; }
    .storage-choice-r3 { animation-delay: 1.35s; }
    .storage-choice-r4 { animation-delay: 1.80s; }
    .storage-choice-row { animation: storage-choice-reveal 7.3s ease-in-out infinite; }
    @keyframes storage-choice-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="storage-choice-bg" width="980" height="390"/>
  <text class="storage-choice-h1"  x="30" y="40">Storing possessions</text>
  <text class="storage-choice-sub" x="30" y="64">By how you retrieve them.</text>
  <rect class="storage-choice-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="storage-choice-name" x="46" y="122">Labelled boxes</text>
  <text class="storage-choice-desc" x="46" y="142">Retrieved whole.</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r0" x="46" y="182">Fetch a box by its label</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r1" x="46" y="216">Contents can be anything</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r2" x="46" y="250">Very fast, if you know the label</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r3" x="46" y="284">Cannot ask 'which boxes contain wool?'</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r4" x="46" y="318">This is a key-value store</text>
  <rect class="storage-choice-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="storage-choice-name" x="526" y="122">A filing system</text>
  <text class="storage-choice-desc" x="526" y="142">Queried.</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r0" x="526" y="182">Everything catalogued by attribute</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r1" x="526" y="216">Contents follow a known form</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r2" x="526" y="250">Slower to file</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r3" x="526" y="284">Can ask any question</text>
  <text class="storage-choice-desc storage-choice-row storage-choice-r4" x="526" y="318">This is a relational database</text>
  <text class="storage-choice-sub" x="30" y="372">The question you cannot ask is what decides the choice: if you will ever need to search by content, storing opaque boxes will not survive contact with that need.</text>
</svg>
