<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And back again.">
  <title>Four steps in the non-relational turn</title>
  <style>
    .nosql-history-bg   { fill: #f8fafc; }
    .nosql-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nosql-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nosql-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nosql-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nosql-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nosql-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nosql-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nosql-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nosql-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nosql-history-stage { opacity: 1; }

    .nosql-history-s0 { animation-delay: 0.00s; }
    .nosql-history-e0 { animation-delay: 0.00s; }
    .nosql-history-s1 { animation-delay: 1.28s; }
    .nosql-history-e1 { animation-delay: 1.28s; }
    .nosql-history-s2 { animation-delay: 2.56s; }
    .nosql-history-e2 { animation-delay: 2.56s; }
    .nosql-history-s3 { animation-delay: 3.84s; }
    .nosql-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nosql-history-conn  { animation: nosql-history-trace 6.4s ease-in-out infinite; }
      .nosql-history-stage { animation: nosql-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nosql-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nosql-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nosql-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nosql-history-stage { animation: nosql-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nosql-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nosql-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nosql-history-bg" width="980" height="322"/>
  <text class="nosql-history-h1"  x="30" y="40">Four steps in the non-relational turn</text>
  <text class="nosql-history-sub" x="30" y="64">And back again.</text>
  <g class="nosql-history-stage nosql-history-s0">
    <rect class="nosql-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-history-step" x="44" y="142">01</text>
    <text class="nosql-history-name" x="70" y="142">Early key-value stores, for caching</text>
    <text class="nosql-history-desc" x="44" y="166">Simple, and narrow.</text>
  </g>
  <line class="nosql-history-line nosql-history-conn nosql-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nosql-history-tip)"/>
  <g class="nosql-history-stage nosql-history-s1">
    <rect class="nosql-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-history-step" x="280" y="142">02</text>
    <text class="nosql-history-name" x="306" y="142">Then a wave of systems built for web scale</text>
    <text class="nosql-history-desc" x="280" y="166">Trading guarantees for</text>
    <text class="nosql-history-desc" x="280" y="182">availability.</text>
  </g>
  <line class="nosql-history-line nosql-history-conn nosql-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nosql-history-tip)"/>
  <g class="nosql-history-stage nosql-history-s2">
    <rect class="nosql-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-history-step" x="516" y="142">03</text>
    <text class="nosql-history-name" x="542" y="142">Then maturation, as guarantees were added back</text>
    <text class="nosql-history-desc" x="516" y="166">Transactions, and stronger</text>
    <text class="nosql-history-desc" x="516" y="182">consistency.</text>
  </g>
  <line class="nosql-history-line nosql-history-conn nosql-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nosql-history-tip)"/>
  <g class="nosql-history-stage nosql-history-s3">
    <rect class="nosql-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nosql-history-step" x="752" y="142">04</text>
    <text class="nosql-history-name" x="778" y="142">And convergence: relational engines gained document types</text>
    <text class="nosql-history-desc" x="752" y="166">And document stores gained</text>
    <text class="nosql-history-desc" x="752" y="182">transactions.</text>
  </g>
  <text class="nosql-history-sub" x="30" y="304">The convergence is the practical outcome: most modern engines now offer both models, which makes the original either-or framing largely historical.</text>
</svg>
