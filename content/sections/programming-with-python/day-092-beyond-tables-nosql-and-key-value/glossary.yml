terms:
  - term: 'NoSQL'
    definition: 'A label attached to four largely unrelated families of database — key-value, document, wide-column and graph — whose only shared property is not being the relational model. Carlo Strozzi used the name in 1998 for a database that was still relational but exposed no SQL interface; Johan Oskarsson reintroduced it in early 2009 for an event about open-source distributed non-relational databases. Because the word covers such different things, "should we use NoSQL?" is not a question that can be answered.'
  - term: 'Key-value store'
    definition: 'A database whose entire contract is: given a key, store these bytes; given the key again, return them. It never parses, validates or indexes the value. Lookup by the key is the fastest operation available; lookup by anything else is a scan of every key, written by you, in your own process. Redis and Memcached are the well-known ones; Python''s dbm is a real one that ships with the standard library.'
  - term: 'Document store'
    definition: 'A key-value store that agrees to look inside the value. The value must be in a format the store can parse, usually JSON or a binary encoding of it, and in exchange the store can filter and index on fields inside it. MongoDB and CouchDB are the well-known ones. It still does not check what the fields are called.'
  - term: 'Wide-column store'
    definition: 'A store whose unit is a row identified by a partition key, where the columns present may differ per row and rows are grouped physically by that key. Cassandra and HBase are the well-known ones. Its distinguishing design rule is that you model the table around the query rather than around the data — so two query patterns mean writing the same data twice, on purpose.'
  - term: 'Graph database'
    definition: 'A store that holds nodes and edges as first-class objects, so following a relationship is a pointer hop rather than an index lookup into a junction table. Neo4j is the well-known one, queried with Cypher. It is the right shape when the questions are about paths and connections, and the wrong one when they are bulk aggregates, which is the opposite trade from a wide-column store.'
  - term: 'Schema-on-write'
    definition: 'The shape of a record is declared once, in the database, and checked by the engine on every write without exception. A mistake is refused at the moment it is made, with the offending field named. The cost is that adding a field is a migration — planned, reviewed and deployed. The pain is concentrated, visible, and happens on a day of your choosing.'
  - term: 'Schema-on-read'
    definition: 'The shape of a record is not declared to the store, so it is interpreted by whatever code reads it. Adding a field costs nothing; having added one costs every reader forever, because both shapes now exist and nothing lists which shapes there are. The schema did not go away — it moved from a place that enforces it to a place that hopes. Its characteristic failure is a query that silently returns nothing rather than raising an error.'
  - term: 'Denormalization'
    definition: 'Deliberately storing the same fact in more than one place so that a read needs no join — for example copying a book''s title into every loan document. Reads become one lookup. The bill arrives when the fact changes: there is no cascade, no UPDATE across documents and no error if you miss a copy, so the update anomaly that normalization was invented to prevent returns through a different door.'
  - term: 'CAP theorem'
    definition: 'The result that when a network partition occurs, a distributed data store cannot provide both consistency and availability, and must give up one of them for as long as the partition lasts. Formulated by Eric Brewer in autumn 1998, published as a principle in 1999, presented as a conjecture at the 2000 Symposium on Principles of Distributed Computing, and proved by Seth Gilbert and Nancy Lynch in 2002. It is not "pick two of three": nobody chooses partition tolerance, and with no partition a well-built store gives consistency and availability at once.'
  - term: 'Partition tolerance'
    definition: 'The property that a system continues to operate despite an arbitrary number of messages being dropped or delayed by the network. It is not a design option you select — cables are cut and switches reboot whether or not you agreed to it — which is why it is a condition of the problem rather than one of three things to choose between.'
  - term: 'Consistency (in CAP)'
    definition: 'Every read receives the most recent write, or an error. Note that this is a different word from the C in ACID, which is about a transaction leaving the database satisfying its declared constraints. Confusing the two is one of the commonest sources of muddle in this area.'
  - term: 'Availability (in CAP)'
    definition: 'Every request received by a non-failing node results in a response, with no guarantee that the response reflects the most recent write. A store that returns a slightly stale answer is available; a store that returns an error because it cannot confirm the value with its partner is not.'
  - term: 'Eventual consistency'
    definition: 'The guarantee that if writes stop, all replicas will converge on the same value — with no promise about when, and no promise that a read in the meantime sees the latest write. It is the practical shape of choosing availability during a partition, and it makes reconciliation a normal event: last-write-wins, a version vector, or a person deciding.'
  - term: 'Sharding'
    definition: 'Splitting a dataset across machines by a key, so each machine holds a slice of the whole. It increases capacity for both reads and writes, and it is what turns a join across the split into a network operation and a foreign key across the split into a distributed transaction. Distinct from replication, which solves a different problem.'
  - term: 'Replication'
    definition: 'Keeping copies of the same data on several machines. It increases read capacity and survives the loss of a machine, and it is what creates the CAP choice, because two copies can disagree only if there are two copies. A single-machine database has no partitions and therefore no CAP trade-off at all.'
  - term: 'Cache eviction'
    definition: 'The policy a cache uses to decide what to discard when it runs out of room — least recently used being the most familiar. It is a property that only makes sense for a store you are allowed to lose: eviction is a correct outcome for a cache and a data-loss incident for a database, and the defining question is which of the two you have built.'
  - term: 'Secondary index'
    definition: 'Any index on something other than the primary key, letting you find records by a field you did not key on. In a relational engine you declare one and the engine maintains it inside every transaction. Over a key-value store you build it as extra keys and maintain it yourself — and when a delete forgets to repair it, the index points at a key that no longer exists, with no error raised. That is an orphaned reference, recreated by hand.'
  - term: 'Expression index'
    definition: 'An index built on the result of an expression rather than on a bare column — for example on json_extract(body, ''$.shelf''). It is what makes querying inside a JSON document fast, and it matches the exact expression it indexes rather than the question being asked: the same filter written with the ->> operator will not use it. Confirm it applied by reading EXPLAIN QUERY PLAN for SEARCH rather than SCAN.'
  - term: 'json_extract'
    definition: 'SQLite''s function for reading a value out of a JSON document by path, as in json_extract(body, ''$.title''). It returns SQL NULL for a field that does not exist, which is why a misspelled field name produces a query that silently returns nothing rather than an error — and why the audit for such documents is written WHERE json_extract(body, ''$.title'') IS NULL.'
  - term: 'The -> and ->> operators'
    definition: 'SQLite''s shorthand for reaching into JSON, added in release 3.38.0 in February 2022 alongside making the JSON functions built-in, and deliberately compatible with MySQL and PostgreSQL. The arrow returns JSON, so a number comes back as JSON text and a string stays quoted; the double arrow returns a typed SQL value. Use the double arrow when you want to compare, sort or aggregate.'
  - term: 'Vector database'
    definition: 'A specialised key-value store in which the key is an embedding and the lookup is nearest-neighbour rather than exact match. Everything true of key-value stores transfers: it is excellent at the one question it was built for, and any other question — such as filtering by publication date — is a secondary concern that must be bolted on, which is why metadata filtering interacts awkwardly with the index.'
  - term: 'Feature store'
    definition: 'A key-value store with time semantics: the key is an entity, the value is its features, and the extra requirement is "as of when". The time dimension exists to prevent training a model on values that were not yet known at prediction time, which produces a model that evaluates beautifully and fails in production.'
