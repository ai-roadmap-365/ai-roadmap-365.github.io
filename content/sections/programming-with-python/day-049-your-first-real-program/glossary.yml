terms:
  - term: program
    definition: 'A complete piece of software that does one useful job end to end: it reads input, processes it, produces clear output, handles bad input gracefully, and is organized so it can be read and tested.'
  - term: function
    definition: 'A named, reusable unit of code that does one job, defined in Python with `def`; it has its own local variables and can return a value, which makes it testable in isolation.'
  - term: main guard
    definition: 'The line `if __name__ == "__main__":` at the bottom of a file, which runs the program''s startup code only when the file is executed directly, not when it is imported.'
  - term: __name__
    definition: 'A built-in variable Python sets for every module: it equals the string `"__main__"` when the file is run directly, and the module''s own name when the file is imported by another.'
  - term: docstring
    definition: 'A string literal placed as the first line inside a function, class, or module that documents what it does; tools and the built-in help system read it.'
  - term: edge case
    definition: 'An input at the boundary of what a program expects — empty input, the wrong type, or an out-of-range or impossible value — that must be handled deliberately rather than assumed away.'
  - term: input validation
    definition: 'Checking input at the boundary of a program to confirm it meets expectations, and refusing bad input with a clear message instead of crashing or computing a wrong answer.'
  - term: module
    definition: 'A single Python `.py` file, which can be run as a program or imported by other files to reuse its functions and variables.'
  - term: script
    definition: 'A Python file meant to be run start-to-finish from the command line to do one job, as opposed to a notebook (interactive cells) or a package (a directory of modules).'
  - term: return value
    definition: 'The value a function hands back to its caller with the `return` statement; testing a function means calling it and checking that its return value is what you expected.'
  - term: PEP 8
    definition: 'The official style guide for Python code, which codifies conventions such as `lower_case_with_underscores` names, four-space indentation, and short lines to keep code readable and consistent.'
  - term: exit code
    definition: 'A small integer a program returns to the operating system when it ends: 0 conventionally means success, and any non-zero value means an error occurred, so other programs can detect failure.'
