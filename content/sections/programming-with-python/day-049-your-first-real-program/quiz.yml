questions:
  - question: 'Which of the following best describes what makes a program "real" in this lesson''s sense?'
    options:
      - 'It is at least a few hundred lines long'
      - 'It does one useful job, handles input and errors, gives clear output, and is readable and testable'
      - 'It uses advanced language features and clever one-liners'
      - 'It runs correctly the first time you type sensible input'
    answer_index: 1
    explanation: 'A real program is defined by properties, not size: it does one useful thing, takes input and handles bad input gracefully, produces clear output, and is readable and testable. Forty well-structured lines qualify; thousands of tangled ones may not.'

  - question: 'What does the line `if __name__ == "__main__":` actually do?'
    options:
      - 'It defines the main function that Python runs first'
      - 'It imports the standard library so the program can start'
      - 'It runs the code beneath it only when the file is executed directly, not when it is imported'
      - 'It marks the file as the most important module in the project'
    answer_index: 2
    explanation: 'Python sets a file''s `__name__` to `"__main__"` only when that file is run directly. When the file is imported, `__name__` is the module name instead. The guard therefore runs the program''s startup code only on direct execution — which is what lets a test import the file''s functions without launching the whole program.'

  - question: 'Why is the main-guard idiom what makes your program testable?'
    options:
      - 'It automatically generates test cases for every function'
      - 'It lets another file import your functions without running the whole program'
      - 'It speeds the program up so tests finish faster'
      - 'It prevents the program from ever crashing'
    answer_index: 1
    explanation: 'Because the guard holds back execution on import, a test file can do `from converter import celsius_to_fahrenheit` and check that function in isolation. Without the guard, importing the file would run all of its top-level code — printing, prompting, and exiting.'

  - question: 'You design a program before coding by writing three lists. What are they?'
    options:
      - 'Variables, loops, and functions'
      - 'Imports, comments, and tests'
      - 'Inputs, processing, and outputs'
      - 'Bugs, fixes, and releases'
    answer_index: 2
    explanation: 'The lightweight design step is to list the inputs (what the program needs and from where), the processing (what it does with them, including validation), and the outputs (what it produces and where, including failure behavior) — then write the code.'

  - question: 'A user runs `python3 converter.py hot C`. In the well-structured version, what happens?'
    options:
      - 'The program crashes with a raw traceback and exit code 0'
      - '`parse_args` raises a ValueError; `main` prints a clear error to standard error and returns exit code 1'
      - 'The program silently converts 0 degrees and prints a result'
      - 'The program asks the user to type the value again'
    answer_index: 1
    explanation: 'Input is validated at the boundary. `float("hot")` fails, so `parse_args` raises a `ValueError` with a readable message; `main` catches it, prints the message and a usage line to `sys.stderr`, and returns a non-zero exit code so callers know it failed.'

  - question: 'Why should error messages be printed to standard error (`sys.stderr`) rather than standard output?'
    options:
      - 'Standard error is faster than standard output'
      - 'It keeps successful results separate from diagnostics, so piping the output stays clean'
      - 'Standard output cannot display error text'
      - 'It hides the error from the user entirely'
    answer_index: 1
    explanation: 'Sending diagnostics to `stderr` and results to `stdout` means a program that pipes the converter''s output elsewhere receives only the clean result on success, while error messages travel on a separate stream — a standard convention for command-line tools.'

  - question: 'Which statement about `eval()` and user input is correct?'
    options:
      - '`eval()` is the recommended way to turn user text into a number'
      - '`eval()` executes whatever string it is given as Python code, so it must never touch untrusted input'
      - '`eval()` is safer than `float()` because it validates types'
      - '`eval()` only works on numbers, so it is harmless'
    answer_index: 1
    explanation: '`eval()` runs its argument as Python code, which means a malicious string could do real damage. To turn text into a number safely, use `float()` (or `int()`), which can only produce a number or raise an error — never run code.'

  - question: 'When is it reasonable NOT to add a main guard, validation, and functions?'
    options:
      - 'When the program will be given to other people to run'
      - 'When the program must run unattended on a schedule'
      - 'During throwaway exploration in an interactive session or notebook, used once by only you'
      - 'Whenever you are in a hurry'
    answer_index: 2
    explanation: 'Genuine throwaway exploration — poking at data in a notebook or the interactive prompt, for your eyes only, with no future — does not need the full structure. But the moment code becomes a tool someone relies on, or must run more than once, it deserves the structure.'
