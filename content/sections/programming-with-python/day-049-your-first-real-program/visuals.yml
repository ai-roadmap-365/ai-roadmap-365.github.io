visuals:
  - id: program-anatomy
    file: assets/program-anatomy.svg
    type: diagram
    title: 'Anatomy of a small program'
    alt: 'Diagram: the anatomy of a small Python program — imports, functions, the main function, and the entry-point guard'
    description: 'A single file read top to bottom: imports at the top, then small named functions each with a docstring (parse and validate, do the work, format output), then a main function that orchestrates them and returns an exit code, and at the bottom the entry-point guard that runs main only when the file is executed directly. Side arrows show input arriving from command-line arguments and output leaving on stdout and stderr.'
  - id: design-flow
    file: assets/design-flow.svg
    type: flowchart
    title: 'A program''s runtime flow'
    alt: 'Flowchart: a program''s runtime flow from input through validation and processing to output, with a branch to error handling'
    description: 'Input (a value and a unit) flows into a validation decision. If the input is not valid, the flow branches to an error handler that prints to standard error and exits with a non-zero code. If it is valid, the flow continues to process, format, and output the result before exiting with code zero — two clean exits, success and failure.'
  - id: design-three-lines
    file: assets/design-three-lines.svg
    type: diagram
    title: 'Three lines before any code'
    alt: 'Diagram: the four questions to answer before writing a program'
    description: 'A four-stage design checklist covering inputs and their preconditions, the transformation, the outputs and their destination, and the failure modes.'
  - id: run-me-or-import-me
    file: assets/run-me-or-import-me.svg
    type: diagram
    title: 'Why a file needs the guard to be both'
    alt: 'Diagram: a script with and without a main guard'
    description: 'A two-column comparison of a script whose work sits at module level against one whose work is inside a main function called by the entry-point guard.'
  - id: exit-status-contract
    file: assets/exit-status-contract.svg
    type: diagram
    title: 'Return a status; let the guard exit'
    alt: 'Diagram: how a program''s exit status reaches the caller'
    description: 'A four-stage sequence following a program''s outcome from a returned integer through the entry-point guard to the shell''s status variable and an automation pipeline.'
  - id: notebook-or-module
    file: assets/notebook-or-module.svg
    type: diagram
    title: 'Notebook or module'
    alt: 'Diagram: a notebook compared with an importable module'
    description: 'A two-column comparison of notebooks and modules covering execution order, hidden state, testability and reuse.'
  - id: pure-and-impure
    file: assets/pure-and-impure.svg
    type: diagram
    title: 'Separate the logic from the I/O'
    alt: 'Diagram: separating pure computation from input and output'
    description: 'A four-stage explanation of separating pure functions from side-effecting ones, and the testing consequence of doing so.'
  - id: names-carry-meaning
    file: assets/names-carry-meaning.svg
    type: diagram
    title: 'Names are the documentation that cannot go stale'
    alt: 'Diagram: unclear variable names compared with descriptive ones'
    description: 'A two-column comparison of terse and descriptive naming in a data-processing script, covering readability months later.'
  - id: validate-at-the-boundary
    file: assets/validate-at-the-boundary.svg
    type: diagram
    title: 'Validate once, at the edge'
    alt: 'Diagram: validating input at a single boundary compared with checking everywhere'
    description: 'A four-stage explanation of boundary validation showing untrusted input checked once on entry so that internal functions can trust their arguments.'
  - id: structure-costs-nothing
    file: assets/structure-costs-nothing.svg
    type: diagram
    title: 'Structure is not overhead'
    alt: 'Diagram: the real cost of splitting a program into functions'
    description: 'A two-column comparison of the runtime cost of function calls against the comprehension cost of an unstructured program.'
  - id: docstring-what-not-how
    file: assets/docstring-what-not-how.svg
    type: diagram
    title: 'A docstring says what and why'
    alt: 'Diagram: a docstring restating the code compared with one explaining intent'
    description: 'A two-column comparison of docstrings that paraphrase the implementation against those that state purpose, constraints and the reason for a decision.'
