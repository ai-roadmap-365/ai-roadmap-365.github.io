visuals:
  - id: program-anatomy
    file: assets/program-anatomy.svg
    type: diagram
    title: 'Anatomy of a small program'
    alt: 'Diagram: the anatomy of a small Python program — imports, functions, the main function, and the entry-point guard'
    description: 'A single file read top to bottom: imports at the top, then small named functions each with a docstring (parse and validate, do the work, format output), then a main function that orchestrates them and returns an exit code, and at the bottom the entry-point guard that runs main only when the file is executed directly. Side arrows show input arriving from command-line arguments and output leaving on stdout and stderr.'
  - id: design-flow
    file: assets/design-flow.svg
    type: flowchart
    title: 'A program''s runtime flow'
    alt: 'Flowchart: a program''s runtime flow from input through validation and processing to output, with a branch to error handling'
    description: 'Input (a value and a unit) flows into a validation decision. If the input is not valid, the flow branches to an error handler that prints to standard error and exits with a non-zero code. If it is valid, the flow continues to process, format, and output the result before exiting with code zero — two clean exits, success and failure.'
