id: D049
day: 49
slug: your-first-real-program
title: 'Your First Real Program'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will be able to assemble a complete, small Python program from named functions, a main entry point, and the main-guard idiom — one that reads input, validates it, does one useful job, handles bad input gracefully, and can be tested.'
objectives:
  - 'List the five properties that make a program "real" — does one useful thing, handles input and errors, gives clear output, is readable, and is testable — and check them against a program'
  - 'Explain what `if __name__ == "__main__":` does and why it lets a file be both a runnable program and an importable, testable module'
  - 'Design a small program before coding it by listing its inputs, processing steps, outputs, and edge cases'
  - 'Structure a program as small named functions with docstrings plus a `main()` that orchestrates them and returns an exit code'
  - 'Validate input at the boundary and report bad input with a clear message and a non-zero exit code, never with a raw traceback or a silent wrong answer'
  - 'Test a program the built-in way by importing a function and asserting its return value, and run a file as a module with `python -m`'
  - 'Apply basic PEP 8 readability — meaningful names and small functions — and explain why user input must never be passed to `eval()`'
prerequisites:
  - 'Days 43-48 of this course: a working Python 3 install, plus variables and types, strings, numbers, input/output with f-strings, and reading error messages'
  - 'Comfort running a script from the terminal with `python3 file.py` and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
