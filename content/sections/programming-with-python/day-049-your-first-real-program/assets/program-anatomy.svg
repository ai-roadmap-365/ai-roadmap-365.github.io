<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a small Python program, read top to bottom: imports, functions, the main function, and the entry-point guard</title>
  <rect x="0" y="0" width="720" height="540" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a small program (one file, top to bottom)</text>

  <!-- File outline -->
  <rect x="150" y="60" width="420" height="420" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="360" y="82" text-anchor="middle" font-size="14" fill="#1a202c">converter.py</text>

  <!-- Imports -->
  <rect x="176" y="96" width="368" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Imports</text>
  <text x="360" y="138" text-anchor="middle" font-size="14" fill="#1a202c">import sys — borrow standard-library tools</text>

  <!-- Functions -->
  <rect x="176" y="158" width="368" height="122" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Functions (each one job, with a docstring)</text>
  <text x="360" y="204" text-anchor="middle" font-size="14" fill="#1a202c">parse_args() — validate input at the boundary</text>
  <text x="360" y="226" text-anchor="middle" font-size="14" fill="#1a202c">celsius_to_fahrenheit() / convert() — do the work</text>
  <text x="360" y="248" text-anchor="middle" font-size="14" fill="#1a202c">format_result() — build the output line</text>
  <text x="360" y="270" text-anchor="middle" font-size="14" fill="#1a202c">small, named, reusable, testable</text>

  <!-- main -->
  <rect x="176" y="290" width="368" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">main(argv) — orchestrates the pieces</text>
  <text x="360" y="334" text-anchor="middle" font-size="14" fill="#1a202c">gather input, call workers in order,</text>
  <text x="360" y="356" text-anchor="middle" font-size="14" fill="#1a202c">print result, return an exit code (0 or 1)</text>

  <!-- guard -->
  <rect x="176" y="390" width="368" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="360" y="414" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Entry-point guard</text>
  <text x="360" y="436" text-anchor="middle" font-size="14" fill="#1a202c">if __name__ == "__main__":</text>
  <text x="360" y="454" text-anchor="middle" font-size="14" fill="#1a202c">sys.exit(main(sys.argv)) — run only if executed directly</text>

  <!-- I/O side annotations -->
  <text x="30" y="120" font-size="14" font-weight="bold" fill="#1d4ed8">INPUT</text>
  <text x="30" y="140" font-size="14" fill="#1a202c">command-line</text>
  <text x="30" y="158" font-size="14" fill="#1a202c">arguments</text>
  <line x1="120" y1="122" x2="172" y2="122" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="172,122 160,116 160,128" fill="#1d4ed8"/>

  <text x="600" y="330" font-size="14" font-weight="bold" fill="#1d4ed8">OUTPUT</text>
  <text x="600" y="350" font-size="14" fill="#1a202c">stdout (result)</text>
  <text x="600" y="368" font-size="14" fill="#1a202c">stderr (errors)</text>
  <line x1="548" y1="335" x2="595" y2="335" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="595,335 583,329 583,341" fill="#1d4ed8"/>

  <text x="360" y="506" text-anchor="middle" font-size="14" fill="#1a202c">The guard lets the file be both a program you run and a module a test can import.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 120 122 L 172 122" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 548 335 L 595 335" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
