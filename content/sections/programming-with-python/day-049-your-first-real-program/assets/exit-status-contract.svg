<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Deep exits make a function unusable as a library.">
  <title>Return a status; let the guard exit</title>
  <style>
    .exit-status-contract-bg   { fill: #f8fafc; }
    .exit-status-contract-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-status-contract-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-status-contract-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-status-contract-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-status-contract-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-status-contract-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exit-status-contract-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exit-status-contract-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exit-status-contract-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exit-status-contract-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exit-status-contract-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exit-status-contract-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exit-status-contract-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exit-status-contract-stage { opacity: 1; }

    .exit-status-contract-s0 { animation-delay: 0.00s; }
    .exit-status-contract-e0 { animation-delay: 0.00s; }
    .exit-status-contract-s1 { animation-delay: 1.28s; }
    .exit-status-contract-e1 { animation-delay: 1.28s; }
    .exit-status-contract-s2 { animation-delay: 2.56s; }
    .exit-status-contract-e2 { animation-delay: 2.56s; }
    .exit-status-contract-s3 { animation-delay: 3.84s; }
    .exit-status-contract-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exit-status-contract-conn  { animation: exit-status-contract-trace 6.4s ease-in-out infinite; }
      .exit-status-contract-stage { animation: exit-status-contract-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exit-status-contract-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exit-status-contract-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exit-status-contract-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exit-status-contract-stage { animation: exit-status-contract-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exit-status-contract-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exit-status-contract-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exit-status-contract-bg" width="980" height="322"/>
  <text class="exit-status-contract-h1"  x="30" y="40">Return a status; let the guard exit</text>
  <text class="exit-status-contract-sub" x="30" y="64">Deep exits make a function unusable as a library.</text>
  <g class="exit-status-contract-stage exit-status-contract-s0">
    <rect class="exit-status-contract-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exit-status-contract-step" x="44" y="142">01</text>
    <text class="exit-status-contract-name" x="70" y="142">main returns an integer</text>
    <text class="exit-status-contract-desc" x="44" y="166">0 for success, non-zero for</text>
    <text class="exit-status-contract-desc" x="44" y="182">failure. It does not exit.</text>
  </g>
  <line class="exit-status-contract-line exit-status-contract-conn exit-status-contract-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exit-status-contract-tip)"/>
  <g class="exit-status-contract-stage exit-status-contract-s1">
    <rect class="exit-status-contract-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exit-status-contract-step" x="280" y="142">02</text>
    <text class="exit-status-contract-name" x="306" y="142">The guard exits with it</text>
    <text class="exit-status-contract-desc" x="280" y="166">sys.exit(main()) turns the value</text>
    <text class="exit-status-contract-desc" x="280" y="182">into the process status.</text>
    <text class="exit-status-contract-edge" x="280" y="242">sys.exit</text>
  </g>
  <line class="exit-status-contract-line exit-status-contract-conn exit-status-contract-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exit-status-contract-tip)"/>
  <g class="exit-status-contract-stage exit-status-contract-s2">
    <rect class="exit-status-contract-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exit-status-contract-step" x="516" y="142">03</text>
    <text class="exit-status-contract-name" x="542" y="142">The shell sees it</text>
    <text class="exit-status-contract-desc" x="516" y="166">echo $? — Day 12's exit codes,</text>
    <text class="exit-status-contract-desc" x="516" y="182">from a Python program.</text>
    <text class="exit-status-contract-edge" x="516" y="242">$?</text>
  </g>
  <line class="exit-status-contract-line exit-status-contract-conn exit-status-contract-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exit-status-contract-tip)"/>
  <g class="exit-status-contract-stage exit-status-contract-s3">
    <rect class="exit-status-contract-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exit-status-contract-step" x="752" y="142">04</text>
    <text class="exit-status-contract-name" x="778" y="142">Automation reads it</text>
    <text class="exit-status-contract-desc" x="752" y="166">cron, CI, a pipeline stage. Day</text>
    <text class="exit-status-contract-desc" x="752" y="182">41 depends entirely on this</text>
    <text class="exit-status-contract-desc" x="752" y="198">number.</text>
  </g>
  <text class="exit-status-contract-sub" x="30" y="304">Calling sys.exit deep inside a helper works when the program is run and is a disaster when the helper is imported: it terminates the caller's process. Return a value and let the top level decide.</text>
</svg>
