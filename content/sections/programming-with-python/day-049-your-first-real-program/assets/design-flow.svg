<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" font-family="system-ui, sans-serif">
  <title>A program's runtime flow: input, then validate, then either the error branch or process, format, output, with two exits</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A program's runtime flow (design this before you code)</text>

  <!-- Input -->
  <rect x="300" y="60" width="160" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Input</text>
  <text x="380" y="101" text-anchor="middle" font-size="14" fill="#1a202c">value + unit from argv</text>

  <line x1="380" y1="112" x2="380" y2="140" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,140 374,128 386,128" fill="#1a202c"/>

  <!-- Validate (decision) -->
  <polygon points="380,150 480,205 380,260 280,205" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Validate</text>
  <text x="380" y="220" text-anchor="middle" font-size="14" fill="#1a202c">input OK?</text>

  <!-- No branch -->
  <text x="235" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="280" y1="205" x2="150" y2="205" stroke="#1a202c" stroke-width="2"/>
  <polygon points="150,205 162,199 162,211" fill="#1a202c"/>

  <rect x="30" y="180" width="120" height="70" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="90" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Handle error</text>
  <text x="90" y="225" text-anchor="middle" font-size="14" fill="#1a202c">print to stderr,</text>
  <text x="90" y="242" text-anchor="middle" font-size="14" fill="#1a202c">exit code 1</text>

  <!-- Yes branch down -->
  <text x="398" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="380" y1="260" x2="380" y2="292" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,292 374,280 386,280" fill="#1a202c"/>

  <!-- Process -->
  <rect x="300" y="302" width="160" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Process</text>
  <text x="380" y="343" text-anchor="middle" font-size="14" fill="#1a202c">apply conversion</text>

  <line x1="380" y1="354" x2="380" y2="382" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,382 374,370 386,370" fill="#1a202c"/>

  <!-- Output -->
  <rect x="300" y="392" width="160" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Output</text>
  <text x="380" y="433" text-anchor="middle" font-size="14" fill="#1a202c">print result, exit code 0</text>

  <!-- Two exits annotation -->
  <line x1="90" y1="250" x2="90" y2="418" stroke="#1a202c" stroke-width="2"/>
  <line x1="90" y1="418" x2="298" y2="418" stroke="#1a202c" stroke-width="2"/>
  <polygon points="298,418 286,412 286,424" fill="#1a202c"/>
  <text x="150" y="410" font-size="14" fill="#1a202c">both paths end the program cleanly</text>

  <text x="600" y="150" font-size="14" font-weight="bold" fill="#1d4ed8">Two exits:</text>
  <text x="600" y="172" font-size="14" fill="#1a202c">success (0) and</text>
  <text x="600" y="190" font-size="14" fill="#1a202c">failure (non-zero).</text>
  <text x="600" y="214" font-size="14" fill="#1a202c">Write the error</text>
  <text x="600" y="232" font-size="14" fill="#1a202c">branch on purpose.</text>
</svg>
