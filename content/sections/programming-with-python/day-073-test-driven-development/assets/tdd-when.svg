<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to work test-first</title>
  <style>
    .tdd-when-bg   { fill: #f8fafc; }
    .tdd-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tdd-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tdd-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tdd-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tdd-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tdd-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tdd-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tdd-when-row { opacity: 1; }
    .tdd-when-r0 { animation-delay: 0.00s; }
    .tdd-when-r1 { animation-delay: 0.45s; }
    .tdd-when-r2 { animation-delay: 0.90s; }
    .tdd-when-r3 { animation-delay: 1.35s; }
    .tdd-when-r4 { animation-delay: 1.80s; }
    .tdd-when-row { animation: tdd-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tdd-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tdd-when-bg" width="980" height="390"/>
  <text class="tdd-when-h1"  x="30" y="40">When to work test-first</text>
  <text class="tdd-when-sub" x="30" y="64">And when not to.</text>
  <rect class="tdd-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-when-name" x="46" y="122">Work test-first</text>
  <text class="tdd-when-desc" x="46" y="142">Four cases.</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r0" x="46" y="182">Well-specified logic</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r1" x="46" y="216">Fixing a reproducible bug</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r2" x="46" y="250">Refactoring existing behaviour</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r3" x="46" y="284">Designing a new interface</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r4" x="46" y="318">Anything with tricky edge cases</text>
  <rect class="tdd-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tdd-when-name" x="526" y="122">Do not</text>
  <text class="tdd-when-desc" x="526" y="142">Also four.</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r0" x="526" y="182">Exploring an unfamiliar problem</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r1" x="526" y="216">Visual or interactive work</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r2" x="526" y="250">Spiking a prototype you will discard</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r3" x="526" y="284">Where the requirement is still moving</text>
  <text class="tdd-when-desc tdd-when-row tdd-when-r4" x="526" y="318">But write the tests before you ship</text>
  <text class="tdd-when-sub" x="30" y="372">The last row is the compromise worth naming: explore freely, then write the tests before the code is merged, which captures most of the benefit.</text>
</svg>
