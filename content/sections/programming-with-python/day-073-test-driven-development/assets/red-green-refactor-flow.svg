<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1080" width="880" height="1080" role="img" aria-labelledby="rgrFlowTitle rgrFlowDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="rgrFlowTitle">The red-green-refactor cycle, step by step, including the right-reason check</title>
  <desc id="rgrFlowDesc">A vertical flowchart running from picking the next behaviour, through writing one failing test and running the suite, to a decision diamond asking whether it failed for the predicted reason, with a branch back to fix the test when it did not; then writing the least code, a second decision asking whether everything is green, a branch back when an earlier behaviour broke, then the refactor step and a return arrow to the first step.</desc>

  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1080" fill="#f8fafc"/>

  <text x="60" y="42" font-size="22" font-weight="700" fill="#1a202c">Red · green · refactor, one behaviour at a time</text>
  <text x="60" y="68" font-size="15" fill="#1a202c">The two diamonds are the whole discipline. Everything else is ordinary programming.</text>

  <!-- 1 -->
  <rect x="60" y="90" width="440" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="118" font-size="16" font-weight="700" fill="#1a202c">1 · Pick the next behaviour</text>
  <text x="80" y="140" font-size="15" fill="#1a202c">the smallest one the code cannot do yet</text>
  <line x1="280" y1="152" x2="280" y2="188" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- 2 -->
  <rect x="60" y="190" width="440" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="218" font-size="16" font-weight="700" fill="#1a202c">2 · Write ONE failing test for it</text>
  <text x="80" y="240" font-size="15" fill="#1a202c">name the call and the answer before either exists</text>
  <line x1="280" y1="252" x2="280" y2="288" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- 3 -->
  <rect x="60" y="290" width="440" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="318" font-size="16" font-weight="700" fill="#1a202c">3 · Run the suite and READ the failure</text>
  <text x="80" y="340" font-size="15" fill="#1a202c">not the colour — the message</text>
  <line x1="280" y1="352" x2="280" y2="386" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- diamond 1 -->
  <path d="M 280 388 L 470 468 L 280 548 L 90 468 Z" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="455" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Did it fail — and for</text>
  <text x="280" y="477" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">the reason you</text>
  <text x="280" y="499" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">predicted?</text>

  <!-- no branch 1 -->
  <line x1="470" y1="468" x2="536" y2="468" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <text x="484" y="458" font-size="15" font-weight="700" fill="#1d4ed8">no</text>
  <rect x="538" y="408" width="290" height="120" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="556" y="436" font-size="16" font-weight="700" fill="#1a202c">Fix the TEST, not the code</text>
  <text x="556" y="460" font-size="15" fill="#1a202c">A typo, the wrong import, an assertion</text>
  <text x="556" y="482" font-size="15" fill="#1a202c">that can never be false, or a green run</text>
  <text x="556" y="504" font-size="15" fill="#1a202c">where you expected red. Then run again.</text>
  <path d="M 683 408 L 683 321 L 508 321" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <text x="292" y="572" font-size="15" font-weight="700" fill="#1d4ed8">yes</text>
  <line x1="280" y1="548" x2="280" y2="588" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- 4 -->
  <rect x="60" y="590" width="440" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="618" font-size="16" font-weight="700" fill="#1a202c">4 · RED confirmed</text>
  <text x="80" y="640" font-size="15" fill="#1a202c">the test is provably wired to what it claims to test</text>
  <line x1="280" y1="652" x2="280" y2="688" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- 5 -->
  <rect x="60" y="690" width="440" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="718" font-size="16" font-weight="700" fill="#1a202c">5 · Write the least code that turns it green</text>
  <text x="80" y="740" font-size="15" fill="#1a202c">a constant is allowed; the next test removes it</text>
  <line x1="280" y1="752" x2="280" y2="786" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- diamond 2 -->
  <path d="M 280 788 L 470 856 L 280 924 L 90 856 Z" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="850" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Run the suite.</text>
  <text x="280" y="872" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">Is everything green?</text>

  <!-- no branch 2 -->
  <line x1="470" y1="856" x2="536" y2="856" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
  <text x="484" y="846" font-size="15" font-weight="700" fill="#1d4ed8">no</text>
  <rect x="538" y="798" width="290" height="118" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="556" y="826" font-size="16" font-weight="700" fill="#1a202c">An earlier behaviour broke</text>
  <text x="556" y="850" font-size="15" fill="#1a202c">That is the safety net doing its one job.</text>
  <text x="556" y="872" font-size="15" fill="#1a202c">Fix it now. Never disable the red test</text>
  <text x="556" y="894" font-size="15" fill="#1a202c">to reach the next cycle.</text>
  <path d="M 683 798 L 683 721 L 508 721" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <text x="292" y="948" font-size="15" font-weight="700" fill="#1d4ed8">yes</text>
  <line x1="280" y1="924" x2="280" y2="964" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- 6 -->
  <rect x="60" y="966" width="440" height="70" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="994" font-size="16" font-weight="700" fill="#1a202c">6 · REFACTOR, then start again at step 1</text>
  <text x="80" y="1016" font-size="15" fill="#1a202c">improve the structure, change no behaviour, and confirm</text>
  <text x="80" y="1034" font-size="15" fill="#1a202c">the same number of tests still pass</text>

  <!-- return to step 1 -->
  <path d="M 60 1001 L 30 1001 L 30 121 L 52 121" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowFlow)"/>
  <text x="38" y="560" font-size="15" font-weight="700" fill="#1d4ed8" transform="rotate(-90 38 560)" text-anchor="middle">with a wider safety net each lap</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.26s}.dx-f2{animation-delay:0.51s}.dx-f3{animation-delay:0.77s}.dx-f4{animation-delay:1.03s}.dx-f5{animation-delay:1.29s}.dx-f6{animation-delay:1.54s}.dx-f7{animation-delay:1.80s}.dx-f8{animation-delay:2.06s}.dx-f9{animation-delay:2.31s}.dx-f10{animation-delay:2.57s}.dx-f11{animation-delay:2.83s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 280 152 L 280 188" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 280 252 L 280 288" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 280 352 L 280 386" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 683 408 L 683 321 L 508 321" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 470 468 L 536 468" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 280 548 L 280 588" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 280 652 L 280 688" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f7" d="M 280 752 L 280 786" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f8" d="M 683 798 L 683 721 L 508 721" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f9" d="M 470 856 L 536 856" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f10" d="M 280 924 L 280 964" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f11" d="M 60 1001 L 30 1001 L 30 121 L 52 121" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
