<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" role="img" aria-labelledby="tddArchTitle tddArchDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="tddArchTitle">The four pieces in play during one red-green-refactor cycle</title>
  <desc id="tddArchDesc">Four panels arranged in a rectangle — the failing test, the implementation under construction, the refactor step, and the regression suite — each labelled with the guarantee it provides, with arrows running clockwise between them and a band underneath stating the invariant the loop preserves.</desc>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="660" fill="#f8fafc"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#1a202c">One cycle: the four pieces, and what each one guarantees</text>
  <text x="40" y="72" font-size="15" fill="#1a202c">Read the arrows clockwise. Nothing here is optional; drop a piece and the guarantee under it goes with it.</text>

  <!-- 1. The failing test -->
  <rect x="40" y="96" width="380" height="160" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="126" font-size="18" font-weight="700" fill="#1d4ed8">1 · The failing test</text>
  <text x="60" y="152" font-size="15" fill="#1a202c">Written before the code it calls. Names the</text>
  <text x="60" y="174" font-size="15" fill="#1a202c">function, its arguments and its answer while</text>
  <text x="60" y="196" font-size="15" fill="#1a202c">none of the three exists yet.</text>
  <text x="60" y="224" font-size="15" font-weight="700" fill="#1a202c">Guarantees: the contract was authored</text>
  <text x="60" y="244" font-size="15" font-weight="700" fill="#1a202c">deliberately, not read back off the code.</text>

  <!-- 2. The implementation -->
  <rect x="500" y="96" width="380" height="160" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="126" font-size="18" font-weight="700" fill="#1d4ed8">2 · The implementation under construction</text>
  <text x="520" y="152" font-size="15" fill="#1a202c">Grows only in answer to a test that is red</text>
  <text x="520" y="174" font-size="15" fill="#1a202c">right now, and only by the least code that</text>
  <text x="520" y="196" font-size="15" fill="#1a202c">turns that one test green.</text>
  <text x="520" y="224" font-size="15" font-weight="700" fill="#1a202c">Guarantees: no branch exists that no test</text>
  <text x="520" y="244" font-size="15" font-weight="700" fill="#1a202c">ever asked for.</text>

  <!-- 3. The refactor step -->
  <rect x="500" y="330" width="380" height="160" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="360" font-size="18" font-weight="700" fill="#1d4ed8">3 · The refactor step</text>
  <text x="520" y="386" font-size="15" fill="#1a202c">Structure changes; behaviour does not. The</text>
  <text x="520" y="408" font-size="15" fill="#1a202c">same tests pass before and after, in the same</text>
  <text x="520" y="430" font-size="15" fill="#1a202c">number, or it was not a refactor.</text>
  <text x="520" y="458" font-size="15" font-weight="700" fill="#1a202c">Guarantees: the design can improve without</text>
  <text x="520" y="478" font-size="15" font-weight="700" fill="#1a202c">a fresh round of checking by hand.</text>

  <!-- 4. The regression suite -->
  <rect x="40" y="330" width="380" height="160" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="360" font-size="18" font-weight="700" fill="#1d4ed8">4 · The regression suite — the safety net</text>
  <text x="60" y="386" font-size="15" fill="#1a202c">Every test that has ever gone green, re-run</text>
  <text x="60" y="408" font-size="15" fill="#1a202c">on every single cycle. It is the accumulated</text>
  <text x="60" y="430" font-size="15" fill="#1a202c">output of every earlier lap of this loop.</text>
  <text x="60" y="458" font-size="15" font-weight="700" fill="#1a202c">Guarantees: this change did not quietly</text>
  <text x="60" y="478" font-size="15" font-weight="700" fill="#1a202c">undo a behaviour decided last week.</text>

  <!-- arrows, clockwise -->
  <line x1="428" y1="176" x2="492" y2="176" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="690" y1="264" x2="690" y2="322" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="492" y1="410" x2="428" y2="410" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="230" y1="322" x2="230" y2="264" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <text x="700" y="298" font-size="14" fill="#1a202c">then tidy</text>
  <text x="440" y="404" font-size="14" fill="#1a202c">the run that proves it</text>
  <text x="128" y="298" font-size="14" fill="#1a202c">next behaviour</text>

  <!-- the invariant band -->
  <rect x="40" y="528" width="840" height="104" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="558" font-size="17" font-weight="700" fill="#1d4ed8">The invariant that makes the loop worth the trouble</text>
  <text x="60" y="586" font-size="15" fill="#1a202c">Every test in the suite has been watched failing for a stated reason, and then watched passing.</text>
  <text x="60" y="612" font-size="15" fill="#1a202c">A test that has only ever been green is evidence of nothing — it may be wired to nothing at all.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 428 176 L 492 176" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 690 264 L 690 322" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 230 322 L 230 264" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 492 410 L 428 410" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
