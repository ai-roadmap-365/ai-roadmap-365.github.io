<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Inside-out against outside-in.">
  <title>Two schools</title>
  <style>
    .classic-london-bg   { fill: #f8fafc; }
    .classic-london-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classic-london-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classic-london-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classic-london-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classic-london-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classic-london-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classic-london-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .classic-london-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .classic-london-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .classic-london-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .classic-london-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .classic-london-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classic-london-row { opacity: 1; }
    .classic-london-r0 { animation-delay: 0.00s; }
    .classic-london-r1 { animation-delay: 0.45s; }
    .classic-london-r2 { animation-delay: 0.90s; }
    .classic-london-r3 { animation-delay: 1.35s; }
    .classic-london-r4 { animation-delay: 1.80s; }
    .classic-london-row { animation: classic-london-reveal 7.3s ease-in-out infinite; }
    @keyframes classic-london-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="classic-london-bg" width="980" height="390"/>
  <text class="classic-london-h1"  x="30" y="40">Two schools</text>
  <text class="classic-london-sub" x="30" y="64">Inside-out against outside-in.</text>
  <rect class="classic-london-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="classic-london-name" x="46" y="122">Inside-out</text>
  <text class="classic-london-desc" x="46" y="142">Build up from the core.</text>
  <text class="classic-london-desc classic-london-row classic-london-r0" x="46" y="182">Start with the domain logic</text>
  <text class="classic-london-desc classic-london-row classic-london-r1" x="46" y="216">Real objects, few test doubles</text>
  <text class="classic-london-desc classic-london-row classic-london-r2" x="46" y="250">Tests survive refactoring well</text>
  <text class="classic-london-desc classic-london-row classic-london-r3" x="46" y="284">The design emerges from the bottom</text>
  <text class="classic-london-desc classic-london-row classic-london-r4" x="46" y="318">Slower to reach a working whole</text>
  <rect class="classic-london-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="classic-london-name" x="526" y="122">Outside-in</text>
  <text class="classic-london-desc" x="526" y="142">Work down from the interface.</text>
  <text class="classic-london-desc classic-london-row classic-london-r0" x="526" y="182">Start at the entry point</text>
  <text class="classic-london-desc classic-london-row classic-london-r1" x="526" y="216">Mock collaborators that do not exist yet</text>
  <text class="classic-london-desc classic-london-row classic-london-r2" x="526" y="250">Tests couple to the interaction shape</text>
  <text class="classic-london-desc classic-london-row classic-london-r3" x="526" y="284">The design is driven by the caller</text>
  <text class="classic-london-desc classic-london-row classic-london-r4" x="526" y="318">A working whole appears sooner</text>
  <text class="classic-london-sub" x="30" y="372">The coupling difference is the practical one: outside-in tests break more often on refactoring because they assert how objects talk, not just what they produce.</text>
</svg>
