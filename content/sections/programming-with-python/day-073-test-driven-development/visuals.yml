visuals:
  - id: tdd-loop-architecture
    file: assets/tdd-loop-architecture.svg
    type: diagram
    title: 'The four pieces in play during one cycle'
    alt: 'Diagram: the four pieces in play during one red-green-refactor cycle — the failing test, the implementation under construction, the refactor step and the regression suite arranged clockwise, each labelled with the guarantee it provides, above a band stating that every test in the suite has been watched failing and then watched passing'
    description: 'Four white panels arranged as a rectangle and connected clockwise by arrows. Top left, the failing test: written before the code it calls, naming the function, its arguments and its answer while none of the three exists yet, guaranteeing that the contract was authored deliberately rather than read back off the code. Top right, the implementation under construction: it grows only in answer to a test that is red right now, and only by the least code that turns that one test green, guaranteeing that no branch exists which no test asked for. Bottom right, the refactor step: structure changes and behaviour does not, the same tests passing in the same number before and after, guaranteeing that the design can improve without a fresh round of checking by hand. Bottom left, the regression suite as safety net: every test that has ever gone green, re-run on every cycle, guaranteeing that this change did not quietly undo a behaviour decided last week. A band underneath states the invariant that makes the loop worth the trouble — every test has been watched failing for a stated reason and then watched passing, because a test that has only ever been green is evidence of nothing.'
  - id: red-green-refactor-flow
    file: assets/red-green-refactor-flow.svg
    type: flowchart
    title: 'The cycle step by step, with the right-reason check'
    alt: 'Flowchart: the red-green-refactor cycle step by step — pick the next behaviour, write one failing test, run the suite and read the failure, decide whether it failed for the predicted reason and branch back to fix the test if it did not, confirm red, write the least code that turns it green, check that everything is green and branch back if an earlier behaviour broke, then refactor and start again'
    description: 'A vertical flow of six numbered steps with two decision diamonds. Step one, pick the next behaviour — the smallest one the code cannot do yet. Step two, write one failing test for it, naming the call and the answer before either exists. Step three, run the suite and read the failure, not the colour but the message. The first diamond asks whether it failed, and for the reason you predicted; a no branches right to a box saying fix the test rather than the code — a typo, the wrong import, an assertion that can never be false, or a green run where you expected red — and returns to step three. A yes continues to step four, red confirmed, meaning the test is provably wired to what it claims to test. Step five, write the least code that turns it green, where a constant is allowed because the next test removes it. The second diamond runs the suite and asks whether everything is green; a no branches right to a box explaining that an earlier behaviour broke, that this is the safety net doing its one job, and that it must be fixed now rather than by disabling the red test, returning to step five. A yes continues to step six, refactor and start again at step one, improving structure without changing behaviour and confirming the same number of tests still pass. A dashed arrow returns from step six to step one, labelled with a wider safety net each lap.'
