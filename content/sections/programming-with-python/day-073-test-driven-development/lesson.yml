title: 'Test-Driven Development'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to work test-first: state the red-green-refactor loop precisely, write one small failing test at a time and read its failure to confirm it failed for the reason you predicted, write the least code that turns it green, refactor against a safety net and prove the count did not move, use triangulation and fake-it-till-you-make-it deliberately rather than as theatre, break your own code on purpose to test a test that has never been red, and judge honestly which code is worth driving test-first and which is not.'
objectives:
  - 'State the red-green-refactor loop precisely — one small failing test, watched failing for the right reason, then the least code that passes, then a structural change that leaves the passing count untouched — and perform eight cycles of it end to end'
  - 'Explain why watching a test fail is the only moment at which evidence exists that the test is wired to the behaviour it names, and connect that directly to Day 71''s always-passing-test anti-pattern'
  - 'Read a pytest failure well enough to distinguish a right-reason red (a missing name, a wrong number, a refusal that did not happen, a crash that should have been a refusal) from a boring one (a typo, a wrong import, an assertion that can never be false)'
  - 'Place the practice historically — Kent Beck and Extreme Programming in the late 1990s reviving a much older test-first habit — and describe it honestly as a contested technique with mixed empirical support rather than a professional obligation'
  - 'Argue the strongest genuine case for test-first: the test is the first consumer of your API, so an awkward interface is exposed while it is still free to change'
  - 'Use triangulation and fake it till you make it as deliberate techniques, and recognise when each has become theatre that adds runs without adding information'
  - 'Name the work test-first is bad at — spikes, code whose shape is unknown, user interfaces, performance, anything where writing the assertion is the hard part — and choose test-first, test-after or no test on those grounds'
  - 'Compare classic (Chicago) TDD, London-school mockist TDD, test-after development, behaviour-driven development, property-based development with Hypothesis and type-driven development with mypy, and say when each is the right choice'
  - 'Explain why, when an implementation is generated rather than typed, the failing test written first is the part of the contract you can be certain you authored — and how that instinct becomes an eval-first workflow later in this course'
prerequisites:
  - 'Day 71: why we test, pytest discovery and naming, plain assert with pytest''s assertion introspection, and the always-passing-test anti-pattern this lesson answers'
  - 'Day 72: fixtures, parametrization, and designing a test with one clear reason to fail'
  - 'Day 66: raising exceptions on purpose and designing a module-specific exception type'
  - 'Day 43: creating a virtual environment with python3 -m venv and installing a pinned dependency into it'
  - 'Comfort running a command from the terminal and editing two files side by side'
