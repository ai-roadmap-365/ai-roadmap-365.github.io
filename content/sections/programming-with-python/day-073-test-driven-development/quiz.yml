questions:
  - question: 'Why is "watch it fail" treated as non-negotiable rather than as a formality?'
    options:
      - 'Because it is the only moment at which you get evidence that the test is wired to the behaviour it claims to test'
      - 'Because pytest caches results and will not re-run a test that has only ever passed'
      - 'Because a test that has not failed cannot be counted toward code coverage'
      - 'Because the red colour in the terminal is what tells pytest to collect the test on the next run'
    answer_index: 0
    explanation: 'A passing test looks identical whether it is exercising your code or nothing at all — a vacuous assertion, a wrong import, a file pytest never collected. The one moment the difference is visible is the moment it fails for a reason you predicted. After that the evidence is gone. The other three options describe machinery that does not exist: pytest has no such cache, coverage is measured by execution, and the terminal colour is output, not input.'

  - question: 'Cycle 1 of the bowling kata produced `AttributeError: module ''bowling'' has no attribute ''score''`. Why is that the right reason to fail?'
    options:
      - 'It is not — a red should always be an AssertionError, so the test needs fixing'
      - 'Because AttributeError is the only exception pytest treats as a genuine failure'
      - 'Because the test reached the real module and asked it for a name the module genuinely has not got yet'
      - 'Because it proves the module has no syntax errors, which is what cycle 1 is really checking'
    answer_index: 2
    explanation: 'The failure says the test is talking to the intended module and that module is incomplete — which is exactly true at cycle 1, since the implementation does not exist. A wrong reason would have been `ModuleNotFoundError: No module named ''bowlingg''`, a typo in the test itself. Reds come in many shapes: this kata alone produced a missing name, two wrong numbers, a `DID NOT RAISE`, and an `IndexError`.'

  - question: 'After cycle 1, `score` was literally `return 0`. What is the name of that move, and what removes it?'
    options:
      - 'It is called stubbing, and it is removed by the refactor step at the end of the cycle'
      - 'It is called fake it till you make it, and cycle 2''s second example — triangulation — is what makes the constant untenable'
      - 'It is called a spike, and it is removed by deleting the file and starting again'
      - 'It is called a placeholder, and it is removed once type hints are added to the signature'
    answer_index: 1
    explanation: 'One example cannot distinguish a constant from a calculation, so a constant is exactly as much code as one example justifies. Beck named the move fake it till you make it. Cycle 2 asserts `score([1] * 20) == 20`, and no single constant satisfies both examples — that second data point is triangulation, and it forces the fake to become an expression. A spike is exploratory code written to answer a question; refactoring changes structure without changing behaviour, so it could never remove the fake.'

  - question: 'In cycle 8 two new tests passed on their very first run. What did that establish?'
    options:
      - 'That the implementation is correct for perfect games and real games'
      - 'That the two tests can safely be marked as regression tests'
      - 'That the earlier seven cycles produced a general solution, which is the goal of the kata'
      - 'Nothing at all about those two tests, until they were run against a deliberately broken copy and seen to fail'
    answer_index: 3
    explanation: 'A green with no prior red is exactly the situation the day warns about: the tests are indistinguishable from tests wired to nothing. The kata resolves it by mutation — replacing `if _is_strike(rolls, roll):` with `if False:` in a copy and re-running, which turned three tests red including both new ones. Only then had those two tests earned the same evidence every other test in the suite had.'

  - question: 'What is the strongest genuine design argument for writing the test before the implementation?'
    options:
      - 'Test-first code is measurably faster at runtime because it contains fewer branches'
      - 'The test is the first consumer of your API, so an awkward interface shows up while it is still free to change'
      - 'Writing tests first guarantees the implementation will be correct for inputs you did not think of'
      - 'It is the only way to reach full statement coverage of a module'
    answer_index: 1
    explanation: 'Design the implementation first and you design the interface from the inside, where every awkwardness is invisible because you already hold all the context. Writing the call first makes you the caller at the one moment the signature costs nothing to change — cycle 5 decided, in one line of a test file, that bad input raises a module-specific `ScoringError` rather than returning None. Runtime speed is unrelated; no technique covers inputs you did not think of; and coverage is a separate measurement that TDD tends to raise as a by-product rather than guarantee.'

  - question: 'Which of these is the clearest case where writing the test first is a poor choice?'
    options:
      - 'A pure function that converts an integer to a Roman numeral'
      - 'A pricing rule with a table of thresholds stated by the finance team'
      - 'An exploratory spike to find out whether an unfamiliar library can do the job at all'
      - 'A validator that must refuse three specific kinds of malformed input'
    answer_index: 2
    explanation: 'A spike is code written to answer a question, and the answer, not the code, is the deliverable — driving it with tests means specifying behaviour you have not decided on. The other three all have knowable contracts: you can write down the expected answer before the code exists, which is precisely the condition under which test-first costs almost nothing and pays immediately. Spike freely, delete the spike, then drive the real thing.'

  - question: 'What distinguishes London-school (mockist) TDD from classic (Chicago) TDD, and what does the London school trade away?'
    options:
      - 'London school drives outside-in and asserts on interactions between doubles; the trade is that such tests are coupled to how the code works and break under refactoring'
      - 'London school forbids all test doubles; the trade is that its suites run much more slowly'
      - 'London school writes tests after the code; the trade is that its tests have never been seen to fail'
      - 'London school only applies to user interfaces; the trade is that it cannot test pure functions'
    answer_index: 0
    explanation: 'Classic TDD drives inside-out with real collaborators and asserts on state and return values, which is why extracting `_is_strike` in cycle 4 broke no test. London school starts at the entry point, replaces collaborators with doubles, and asserts on which calls were made — genuine design pressure on interfaces, at the cost of tests that know how the code works and so break when you change it, and of suites that can go green while the assembled system does not run. Both schools write tests first; both use doubles, just in very different quantities.'

  - question: 'A colleague says "the suite is green, so this change is safe." What is the most precise fair correction?'
    options:
      - 'Nothing — a green suite does mean the change is safe, which is the point of having one'
      - 'They are wrong because green suites are usually the result of tests that were never watched failing'
      - 'The suite being green means every stated example still holds; the cases nobody wrote a test for are exactly the ones a green run says nothing about'
      - 'They should run the suite three times, because a single green run is not statistically meaningful'
    answer_index: 2
    explanation: 'Be fair and be precise: a green suite is real evidence about the behaviours it states, and that is worth a great deal. It is not evidence about unstated behaviours. The extension challenge makes this concrete — nine carefully driven tests still leave mutations of the bowling scorer that survive, and each survivor marks a behaviour no test has decided. Accusing the suite of being fraudulent is unfair, and re-running a deterministic suite adds no information.'
