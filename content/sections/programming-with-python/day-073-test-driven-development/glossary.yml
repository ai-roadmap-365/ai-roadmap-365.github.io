terms:
  - term: 'Test-driven development'
    definition: 'The practice of writing a small failing test for each behaviour before writing the code that provides it, and letting the implementation grow only in response to a test that is currently red. It is a design technique whose by-product is a test suite, not a testing technique that happens to affect design.'
  - term: 'Red-green-refactor'
    definition: 'The three-step loop of test-driven development: write one small failing test and watch it fail for the reason you predicted (red), write the least code that makes it pass (green), then improve the structure without changing behaviour and confirm the same tests still pass (refactor). Then repeat with the next behaviour.'
  - term: 'Watch it fail'
    definition: 'The rule that a test must be seen failing, for a stated reason, before it is trusted. It is the only moment at which evidence exists that the test is connected to the behaviour it names; after it passes, a well-wired test and a vacuous one look identical.'
  - term: 'Regression suite'
    definition: 'The accumulated body of tests re-run on every change, so that behaviour which used to work and no longer does is reported immediately rather than discovered later. In the loop it is the safety net the refactor step leans on, and it grows by exactly one test per cycle.'
  - term: 'Safety net'
    definition: 'The everyday name for a regression suite when it is being used to make a change feel affordable. Its value is proportional to how fast it runs and how often it is run: the bowling suite finishes in 0.01 seconds, which is what makes running it on every save realistic.'
  - term: 'Refactoring'
    definition: 'Changing the structure of code without changing its behaviour — renaming, extracting a helper, removing duplication. The definition is operational, not aspirational: if the passing count or any output moves, it was not a refactor but an untested edit with a flattering name.'
  - term: 'Triangulation'
    definition: 'Deliberately adding a second (or third) example specifically to make an over-simple implementation untenable, so the code is forced to generalise. It is theatre when no possible implementation passes the existing tests but fails the new one — then the extra test is padding, not a second bearing.'
  - term: 'Fake it till you make it'
    definition: 'Returning a constant or otherwise obviously insufficient code to reach green quickly, and generalising under the pressure of the next test. Its honest purpose is to separate "is my test wired up?" from "what is the algorithm?" so that a hard algorithm is debugged alone.'
  - term: 'Kata'
    definition: 'A small exercise repeated to practise a technique rather than to produce a useful artefact — the word borrowed from martial arts, the programming usage from Dave Thomas''s code-kata writing in the early 2000s. Scoring a game of ten-pin bowling is the most-performed kata for test-driven development.'
  - term: 'Chicago school'
    definition: 'Also called classic or inside-out TDD. You start with the domain logic, use real collaborating objects, and assert on state and return values, using test doubles only where the real thing is genuinely unavailable. Its tests survive refactoring because they say what the code does rather than how.'
  - term: 'London school'
    definition: 'Also called mockist or outside-in TDD. You start at the entry point, replace every collaborator with a test double, and assert on interactions — which methods were called with which arguments. It applies strong design pressure to interfaces at the cost of tests coupled to how the code works.'
  - term: 'Behaviour-driven development'
    definition: 'A reframing of TDD around examples written in near-English Given/When/Then form, bound to Python step functions, so that a non-programmer can read and argue about the specification. Free tools include pytest-bdd and behave. Without such a reader, the extra layer is cost with no payer.'
  - term: 'Specification'
    definition: 'A statement of what a system must do. In test-driven development the test is the specification, and the difference from a document is that this one is executable and fails loudly the moment the code stops matching it.'
  - term: 'Emergent design'
    definition: 'The idea that a good design can arrive through many small, test-forced changes rather than being drawn up in advance. Cycle 3 of the bowling kata is a real instance — the frame walk appeared because a strike test made summing rolls impossible. How far this scales is one of the genuinely contested claims about TDD.'
  - term: 'Test-after'
    definition: 'Writing the code first and the tests afterwards — the most common practice in the industry, and not a sin. It is only honest when it includes the extra step test-first gets for free: break the code on purpose, watch the new test go red, and put the code back.'
  - term: 'Mutation testing'
    definition: 'Deliberately changing the code to see whether the suite notices — the general form of "watch it fail". A mutation the suite catches is a behaviour the suite pins down; a mutation that survives marks a behaviour no test has decided. The Day 73 lab performs four mutations automatically.'
