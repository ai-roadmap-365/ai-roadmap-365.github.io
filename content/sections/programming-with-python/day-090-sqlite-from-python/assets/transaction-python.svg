<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Managing transactions from Python</title>
  <style>
    .transaction-python-bg   { fill: #f8fafc; }
    .transaction-python-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transaction-python-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transaction-python-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transaction-python-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transaction-python-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transaction-python-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transaction-python-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transaction-python-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transaction-python-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transaction-python-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transaction-python-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transaction-python-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transaction-python-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transaction-python-stage { opacity: 1; }

    .transaction-python-s0 { animation-delay: 0.00s; }
    .transaction-python-e0 { animation-delay: 0.00s; }
    .transaction-python-s1 { animation-delay: 1.28s; }
    .transaction-python-e1 { animation-delay: 1.28s; }
    .transaction-python-s2 { animation-delay: 2.56s; }
    .transaction-python-e2 { animation-delay: 2.56s; }
    .transaction-python-s3 { animation-delay: 3.84s; }
    .transaction-python-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .transaction-python-conn  { animation: transaction-python-trace 6.4s ease-in-out infinite; }
      .transaction-python-stage { animation: transaction-python-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes transaction-python-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transaction-python-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transaction-python-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transaction-python-stage { animation: transaction-python-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transaction-python-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transaction-python-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transaction-python-bg" width="980" height="322"/>
  <text class="transaction-python-h1"  x="30" y="40">Managing transactions from Python</text>
  <text class="transaction-python-sub" x="30" y="64">Four steps.</text>
  <g class="transaction-python-stage transaction-python-s0">
    <rect class="transaction-python-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="transaction-python-step" x="44" y="142">01</text>
    <text class="transaction-python-name" x="70" y="142">A transaction begins with the first write</text>
    <text class="transaction-python-desc" x="44" y="166">Whether or not you asked.</text>
  </g>
  <line class="transaction-python-line transaction-python-conn transaction-python-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#transaction-python-tip)"/>
  <g class="transaction-python-stage transaction-python-s1">
    <rect class="transaction-python-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="transaction-python-step" x="280" y="142">02</text>
    <text class="transaction-python-name" x="306" y="142">Related changes accumulate</text>
    <text class="transaction-python-desc" x="280" y="166">Visible only to this connection.</text>
  </g>
  <line class="transaction-python-line transaction-python-conn transaction-python-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#transaction-python-tip)"/>
  <g class="transaction-python-stage transaction-python-s2">
    <rect class="transaction-python-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="transaction-python-step" x="516" y="142">03</text>
    <text class="transaction-python-name" x="542" y="142">A commit makes them permanent and visible</text>
    <text class="transaction-python-desc" x="516" y="166">All at once.</text>
  </g>
  <line class="transaction-python-line transaction-python-conn transaction-python-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#transaction-python-tip)"/>
  <g class="transaction-python-stage transaction-python-s3">
    <rect class="transaction-python-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="transaction-python-step" x="752" y="142">04</text>
    <text class="transaction-python-name" x="778" y="142">And an exception must roll back</text>
    <text class="transaction-python-desc" x="752" y="166">Or the connection holds locks</text>
    <text class="transaction-python-desc" x="752" y="182">open.</text>
  </g>
  <text class="transaction-python-sub" x="30" y="304">Forgetting to roll back on an exception is the classic leak here, and a context manager handles it correctly without anyone having to remember.</text>
</svg>
