<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four objects.">
  <title>How Python talks to a database</title>
  <style>
    .dbapi-idea-bg   { fill: #f8fafc; }
    .dbapi-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbapi-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dbapi-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dbapi-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dbapi-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dbapi-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dbapi-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dbapi-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dbapi-idea-stage { opacity: 1; }

    .dbapi-idea-s0 { animation-delay: 0.00s; }
    .dbapi-idea-e0 { animation-delay: 0.00s; }
    .dbapi-idea-s1 { animation-delay: 1.28s; }
    .dbapi-idea-e1 { animation-delay: 1.28s; }
    .dbapi-idea-s2 { animation-delay: 2.56s; }
    .dbapi-idea-e2 { animation-delay: 2.56s; }
    .dbapi-idea-s3 { animation-delay: 3.84s; }
    .dbapi-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dbapi-idea-conn  { animation: dbapi-idea-trace 6.4s ease-in-out infinite; }
      .dbapi-idea-stage { animation: dbapi-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dbapi-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dbapi-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dbapi-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dbapi-idea-stage { animation: dbapi-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dbapi-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dbapi-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dbapi-idea-bg" width="980" height="322"/>
  <text class="dbapi-idea-h1"  x="30" y="40">How Python talks to a database</text>
  <text class="dbapi-idea-sub" x="30" y="64">Four objects.</text>
  <g class="dbapi-idea-stage dbapi-idea-s0">
    <rect class="dbapi-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dbapi-idea-step" x="44" y="142">01</text>
    <text class="dbapi-idea-name" x="70" y="142">A connection, representing the session</text>
    <text class="dbapi-idea-desc" x="44" y="166">And the transaction boundary.</text>
  </g>
  <line class="dbapi-idea-line dbapi-idea-conn dbapi-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dbapi-idea-tip)"/>
  <g class="dbapi-idea-stage dbapi-idea-s1">
    <rect class="dbapi-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dbapi-idea-step" x="280" y="142">02</text>
    <text class="dbapi-idea-name" x="306" y="142">A cursor, used to run statements</text>
    <text class="dbapi-idea-desc" x="280" y="166">And to walk results.</text>
  </g>
  <line class="dbapi-idea-line dbapi-idea-conn dbapi-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dbapi-idea-tip)"/>
  <g class="dbapi-idea-stage dbapi-idea-s2">
    <rect class="dbapi-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dbapi-idea-step" x="516" y="142">03</text>
    <text class="dbapi-idea-name" x="542" y="142">Execution, with parameters passed separately</text>
    <text class="dbapi-idea-desc" x="516" y="166">Never interpolated into the</text>
    <text class="dbapi-idea-desc" x="516" y="182">statement.</text>
  </g>
  <line class="dbapi-idea-line dbapi-idea-conn dbapi-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dbapi-idea-tip)"/>
  <g class="dbapi-idea-stage dbapi-idea-s3">
    <rect class="dbapi-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dbapi-idea-step" x="752" y="142">04</text>
    <text class="dbapi-idea-name" x="778" y="142">And results fetched as rows</text>
    <text class="dbapi-idea-desc" x="752" y="166">One at a time, or in batches.</text>
  </g>
  <text class="dbapi-idea-sub" x="30" y="304">The same four objects appear across every database driver in Python, which is why switching engines rarely means rewriting the access code.</text>
</svg>
