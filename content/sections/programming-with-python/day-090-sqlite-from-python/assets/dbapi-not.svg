<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the database interface is not</title>
  <style>
    .dbapi-not-bg   { fill: #f8fafc; }
    .dbapi-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dbapi-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbapi-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dbapi-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dbapi-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dbapi-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dbapi-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dbapi-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dbapi-not-row { opacity: 1; }
    .dbapi-not-r0 { animation-delay: 0.00s; }
    .dbapi-not-r1 { animation-delay: 0.45s; }
    .dbapi-not-r2 { animation-delay: 0.90s; }
    .dbapi-not-r3 { animation-delay: 1.35s; }
    .dbapi-not-r4 { animation-delay: 1.80s; }
    .dbapi-not-row { animation: dbapi-not-reveal 7.3s ease-in-out infinite; }
    @keyframes dbapi-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dbapi-not-bg" width="980" height="390"/>
  <text class="dbapi-not-h1"  x="30" y="40">Four things the database interface is not</text>
  <text class="dbapi-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="dbapi-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dbapi-not-name" x="46" y="122">The misconception</text>
  <text class="dbapi-not-desc" x="46" y="142">Commonly held.</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r0" x="46" y="182">Escaping values by hand is enough</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r1" x="46" y="216">Every statement commits immediately</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r2" x="46" y="250">Fetching everything is fine</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r3" x="46" y="284">A connection is thread-safe by default</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r4" x="46" y="318">Row objects are tuples of strings</text>
  <rect class="dbapi-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dbapi-not-name" x="526" y="122">What is true</text>
  <text class="dbapi-not-desc" x="526" y="142">Actually.</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r0" x="526" y="182">Use parameters; escaping misses cases</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r1" x="526" y="216">Writes open a transaction until committed</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r2" x="526" y="250">Large results should be iterated</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r3" x="526" y="284">Check the driver's threading rules</text>
  <text class="dbapi-not-desc dbapi-not-row dbapi-not-r4" x="526" y="318">Types are converted; check which</text>
  <text class="dbapi-not-sub" x="30" y="372">Iterating rather than fetching everything is what keeps memory flat, and it is the difference between a query that scales and one that fails at ten million rows.</text>
</svg>
