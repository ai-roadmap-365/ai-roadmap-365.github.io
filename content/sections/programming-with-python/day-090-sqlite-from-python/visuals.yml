visuals:
  - id: python-sqlite-architecture
    file: assets/python-sqlite-architecture.svg
    type: diagram
    title: 'Your program, the module, the library, the file — and the one band where SQL is allowed'
    alt: 'Diagram: the layers between a Python program and a SQLite file — application code and domain objects that never import sqlite3, the repository where every SQL statement lives, the connection and cursor, the sqlite3 module, the SQLite C library, and one database file, with the four per-connection decisions and the boundary where storage errors become domain errors'
    description: 'A static architecture diagram read from top to bottom, with every layer inside one operating-system process: no server, no port, no network hop. At the top, application code — the reporting module — asks for objects, formats them and prints them, and is drawn with a dashed outline and annotated as importing no sqlite3. Below it, the domain objects: Book, Member and Loan with their rules, also dashed and also importing no sqlite3, with an arrow noting that Book objects travel down and Book objects travel back up. Beneath those, highlighted and enclosed in a shaded dashed band labelled "SQL lives here and nowhere above it — every statement a literal, every value bound", sits the repository: the connection factory, the transaction context manager, the row-to-object mapping function and the two repository classes, showing one real statement with a question-mark placeholder and its bound value. Below the repository the diagram splits into a connection, described as one open database holding one transaction at a time, and a cursor, described as one running statement and a position in its rows. Under them the sqlite3 module is named as Python''s DB-API 2.0 wrapper that converts Python values to SQLite ones, binds them to the prepared statement, manages or delegates transactions, and raises IntegrityError, OperationalError and ProgrammingError. Below that the SQLite C library, linked into this same process, listing tokenizer, parser, planner, bytecode virtual machine, B-tree, pager and OS interface, and annotated that the parser only ever sees the statement and never the values that were bound. A green arrow leads down to the single database file with its rollback journal or write-ahead log. A left-hand rail lists the four decisions the connection factory makes — PRAGMA foreign_keys ON, which is off by default and a silent no-op inside a transaction; a row factory so rows are addressed by column name; an isolation level of None so nothing opens a transaction behind your back; and a busy timeout so a locked database waits rather than failing — and notes that a connection is not thread-safe by default. A second left-hand panel describes what crosses the boundary: statements and bound values downwards, rows turned into domain objects upwards, and storage errors translated on the way up so that an IntegrityError becomes a DuplicateTitle and no schema detail leaks to the caller. A right-hand rail states the rule — never build a statement out of a string, because a value inside the string is already part of the statement before the parser starts, whereas a bound value is attached to a statement that is already compiled — and adds that placeholders stand in for values only, so a column name that varies is chosen from an allow-list you wrote. A final right-hand panel lists what is deliberately absent: no server process, no socket, port or hostname, no user account or password, no configuration file, and the note that your process''s privileges are the database''s privileges.'
  - id: parameter-binding-flow
    file: assets/parameter-binding-flow.svg
    type: flow-animated
    title: 'The same value, twice: once as code, once as data'
    alt: 'Flowchart: one crafted input travelling two paths — concatenated into the SQL string, where it reaches the parser as code and turns the WHERE clause into one that is true for every row and leaks three private records; and bound as a parameter, where it stops at the boundary, the parser compiles only the statement with a question-mark placeholder, and the value arrives as data that matches nothing'
    description: 'An animated two-lane diagram, readable in full as a still picture. On the left, one input box holds the literal crafted value Ada apostrophe space OR space quote one quote equals quote one, with a note that it might arrive from a search box, a CSV column, a query string or a model asked to name an author, and that it is text either way. The upper lane, drawn in red and labelled "concatenated into the SQL string", runs through three stages that light up in turn: Build, showing the concatenation of a quote, the value and a quote; Parse, noting that the parser reads the whole string with the value included; and Plan and run, noting that the WHERE clause is now true for every row. It ends in a red result box reading three rows — every member, with address and PIN. Printed beneath that lane is the exact statement the parser receives, SELECT name, email, pin FROM members WHERE name equals quote Ada quote OR quote one quote equals quote one quote, with a monospaced caret pointing at the apostrophe inside the value that closed the string early, and two lines explaining that the value did not escape anything but was inside the statement before the parser started, and that nothing here is a bug in SQLite, in Python or in the schema — the program handed the engine a different question. The lower lane, drawn in blue and green and labelled "passed as a parameter", runs through execute called with the statement and a one-item tuple; a dashed green vertical wall labelled "the boundary"; Compile, noting that the parser sees the statement only and never the value; and Bind and run, noting that the value is attached to an already-compiled statement. It ends in a green result box reading zero rows — no member is called that, and nothing changed. Beneath it the statement the parser receives is printed, SELECT name, email, pin FROM members WHERE name equals question mark, with a caret under the placeholder and the note that it was compiled before any value existed. A separate amber track runs below the parser carrying the value around it and up into the bind stage, labelled as the value going round the parser and arriving as data. Marching-dash wires connect every stage and three tokens travel their paths, each resting visible at its start. Two closing lines state the resting state explicitly — both lanes drawn in full, all six stages shaded, both statements and both results printed, each token at the start of its path — and confirm that with reduced motion requested the animation stops and that resting state is the whole diagram. A final line adds that placeholders stand in for values only, and that a column or table name which has to vary is chosen from an allow-list you wrote rather than bound. The file carries a prefers-reduced-motion media query that disables every animation and restores the resting appearance.'
