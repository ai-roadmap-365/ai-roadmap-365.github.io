terms:
  - term: 'DB-API 2.0'
    definition: 'The Python Database API Specification version 2.0, written by Marc-André Lemburg and adopted as PEP 249 in 1999. It standardises the shape of a database driver rather than hiding the differences between databases: connections, cursors, execute, the fetch methods, the exception hierarchy, and a module attribute naming which parameter style the driver uses. Learning it once transfers to almost every Python database driver.'
  - term: 'Connection'
    definition: 'One open database. It holds the file, the transaction state, the settings chosen when it was opened, and the write lock while you are writing. It is not a network connection — there is no server — but it is a resource with state, so it is closed when you are finished with it, and it belongs to the thread that created it.'
  - term: 'Cursor'
    definition: 'One running statement plus a position in its results. connection.execute returns one, which is why the result of execute can be iterated directly. connection.cursor() makes your own when two statements must be in flight at once; several cursors share one connection and therefore one transaction.'
  - term: 'Placeholder'
    definition: 'The marker in a SQL statement where a value will go: ? in qmark style, which takes a sequence, or :name in named style, which takes a mapping. Python''s sqlite3 module declares qmark in sqlite3.paramstyle. A placeholder can stand in for a value only — never for a table or column name.'
  - term: 'Parameter binding'
    definition: 'Attaching values to a statement that has already been compiled. Because compilation happens before any value exists, a bound value cannot change what the statement means: it arrives at the engine as a value of a storage class and is compared to a column. This is the entire defence against SQL injection, and it costs one character.'
  - term: 'SQL injection'
    definition: 'What happens when a value becomes part of a statement instead of an argument to it. Given the input Ada'' OR ''1''=''1, a concatenated lookup becomes WHERE name = ''Ada'' OR ''1''=''1'', which is true for every row. Nothing malfunctions; the engine answers the question it was actually asked. Escaping is not an equivalent fix, and the module''s refusal to run two statements in one execute is a limit rather than a defence.'
  - term: 'Row factory'
    definition: 'A callable taking (cursor, row) that decides what a row looks like in Python. The default is a tuple, addressed by position. sqlite3.Row gives access by column name as well, plus keys(). A three-line dict factory built over cursor.description returns real dicts, which is what you need when a row has to be serialised as JSON.'
  - term: 'sqlite3.Row'
    definition: 'The row type that supports both row["title"] and row[1], along with keys() and len(). It is deliberately not a dict: it has no .get, it is immutable, and json.dumps refuses it. dict(row) converts one when you need the real thing. Using it removes a whole class of bug in which adding a column to a SELECT list silently shifts every positional index.'
  - term: 'Transaction'
    definition: 'A group of statements treated as one indivisible act: BEGIN, then COMMIT or ROLLBACK. Two writes that are only true together — a loan row and one fewer copy on the shelf — belong in one. If anything at all is raised in between, including a KeyboardInterrupt, the group must be undone, which is why a hand-written transaction context manager catches BaseException rather than Exception.'
  - term: 'Context manager (for a connection)'
    definition: 'Two different things that are easy to confuse. "with connection:" commits at the end of the block or rolls back if it raised, and leaves the connection OPEN. contextlib.closing(connection) closes it. The honest full form nests them, because a connection''s lifetime and a transaction''s lifetime are different questions.'
  - term: 'isolation_level'
    definition: 'The connection attribute controlling the module''s implicit transaction handling. The default, an empty string, means the module opens a transaction for you before a data-modifying statement — but not before DDL — and keeps it open until you commit. Setting it to None turns that machinery off entirely, so BEGIN, COMMIT and ROLLBACK are yours to issue. A string such as "IMMEDIATE" changes which kind of BEGIN is emitted.'
  - term: 'autocommit'
    definition: 'The explicit transaction control added to Connection in Python 3.12, with three states. True commits every statement immediately, so another connection sees the write at once. False keeps a transaction permanently open, which means a long-lived connection holds a lock until it commits. sqlite3.LEGACY_TRANSACTION_CONTROL restores the older behaviour and makes isolation_level meaningful again. Setting autocommit causes isolation_level to be ignored.'
  - term: 'PRAGMA foreign_keys'
    definition: 'The per-connection switch that decides whether REFERENCES clauses are enforced. It is OFF by default in SQLite for backward compatibility, it is not a property of the file, and — the trap that catches people twice — setting it inside an open transaction is a silent no-op with no error and no warning. Run it in the connection factory, the instant the connection exists.'
  - term: 'executemany'
    definition: 'Compiling one statement once and stepping it once per row with new bindings each time. It is the tidy way to express a batch, and on the measurements in this lab it was worth about a factor of two — while wrapping the equivalent loop in a single transaction was worth about three orders of magnitude. Batching your writes matters far more than which method issues them.'
  - term: 'executescript'
    definition: 'The method that runs several statements from one string, used for schema scripts. Two properties make it dangerous with anything variable: it takes no parameters at all, so a value could only get in by being pasted into the string, and it issues an implicit COMMIT before it runs, so it can never be nested inside a transaction. In this lab it is what turns an injected DROP from a blocked attempt into a destroyed table.'
  - term: 'IntegrityError'
    definition: 'The exception raised when the data broke a rule written in the schema: UNIQUE, NOT NULL, CHECK, FOREIGN KEY, and — mildly surprisingly given the class names — a type violation in a STRICT table. It is a fact about somebody''s input rather than a bug, which is why a data layer usually translates it into a domain error the rest of the program can act on.'
  - term: 'OperationalError'
    definition: 'The exception raised when the database could not do the thing at all: no such table, no such column, a syntax error, a locked file, a full disk. It sits between IntegrityError, which is about the data, and ProgrammingError, which is about your code.'
  - term: 'ProgrammingError'
    definition: 'The exception raised when your code misused the module: the wrong number of bindings, named placeholders given a sequence, two statements in one execute, a connection used after close. It is always a bug and should never be caught and ignored. The most common instance by far is a missing comma — (value) is not a tuple, (value,) is.'
  - term: 'Repository'
    definition: 'One class that owns every SQL statement about one kind of thing, taking a connection rather than a path so that a test can hand it a database in a temporary directory. Rows go in as bound values and come out as domain objects through a single mapping function, and storage errors are translated into domain errors at its edge — so nothing above it needs to import sqlite3 to find out that a title was taken.'
  - term: 'Data-access layer'
    definition: 'The module in which SQL is allowed to exist, and outside which it is not. Here it is a connection factory, a transaction context manager, one row-to-object mapping function per entity, and one repository class per aggregate. The rule is worth checking mechanically rather than promising: this lab parses every file with ast and fails if a statement reaching execute was built with an f-string, +, % or .format.'
  - term: 'Adapter and converter'
    definition: 'The two halves of automatic type conversion in sqlite3: an adapter turns a Python object into a SQLite value on the way in, a converter turns a value back into a Python object on the way out, and converters run only when detect_types is passed. The module''s default adapters for datetime.date and datetime.datetime are deprecated as of Python 3.12; the alternatives are to store ISO-8601 text or to register your own explicitly.'
  - term: 'lastrowid'
    definition: 'The rowid of the last successful INSERT on a particular cursor — which is why the cursor that execute returned is worth keeping rather than discarding. It coincides with your primary key when the column is declared INTEGER PRIMARY KEY, and does not otherwise.'
  - term: 'rowcount'
    definition: 'The number of rows a statement changed. After an UPDATE or DELETE it is how you tell "changed nothing" from "changed something", which is the honest way to raise a not-found error. After a SELECT it is -1, because SQLite cannot know how many rows a query will produce until it has produced them.'
  - term: 'check_same_thread'
    definition: 'The connect() argument that controls whether the module enforces its rule that a connection is used only by the thread that created it. Passing False removes the exception and does not remove the problem: you must then serialise access yourself. One connection per thread, built by the same factory, is the answer that keeps working. sqlite3.threadsafety describes what the underlying C library supports, not what your object lifetimes do.'
