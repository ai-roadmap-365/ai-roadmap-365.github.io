terms:
  - term: variable
    definition: 'A name that refers (is bound) to an object. In Python a variable is a tag on an object, not a box that stores a value.'
  - term: object
    definition: 'A thing in memory that carries a type, a value, and an identity. In Python everything — numbers, text, lists, even types — is an object.'
  - term: binding
    definition: 'The link between a name and the object it refers to, created by assignment (name = object). Re-binding moves the name to a different object.'
  - term: aliasing
    definition: 'The situation where two or more names refer to the same object, so a change made through one name is visible through the others (relevant for mutable objects).'
  - term: dynamic typing
    definition: 'The rule that a value''s type belongs to the object and is checked at run time, so a name may be re-bound to a value of any type at any point.'
  - term: static typing
    definition: 'The alternative approach, used by languages like Java, where a variable''s type is declared in advance and checked before the program runs.'
  - term: int
    definition: 'The integer type: whole numbers of unlimited size, such as 42, 0, and -7. Immutable.'
  - term: float
    definition: 'The floating-point type: real numbers with a fractional part, such as 3.14 and 2.0. Immutable, and distinct from int even when the value looks whole.'
  - term: bool
    definition: 'The boolean type with the two values True and False. A subtype of int, so True behaves as 1 and False as 0 in arithmetic. Immutable.'
  - term: str
    definition: 'The string type: text as a sequence of characters, such as "hello". Immutable, so "changing" a string produces a new object.'
  - term: NoneType
    definition: 'The type of the single object None, which represents the deliberate absence of a value — distinct from 0, "", and False.'
  - term: mutable
    definition: 'Describes an object that can be changed in place after creation, keeping the same identity. list, dict, and set are mutable.'
  - term: immutable
    definition: 'Describes an object that cannot be changed after creation; "modifying" it creates a new object. int, float, bool, str, and tuple are immutable.'
  - term: truthiness
    definition: 'The rule that any object can be treated as true or false in a condition. Falsy values are False, None, any zero, and any empty container; everything else is truthy.'
  - term: type conversion
    definition: 'Turning a value of one type into another by calling the target type, such as int("42"), float("3.14"), or str(42). Can raise ValueError on invalid input.'
  - term: identity
    definition: 'A permanent, per-object marker of "which object is this," returned by id(). In the standard interpreter it is essentially the object''s memory address; the is operator compares it.'
