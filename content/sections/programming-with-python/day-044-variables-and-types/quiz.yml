questions:
  - question: 'In Python, what is a variable such as x after you write x = 5?'
    options:
      - 'A name bound to the integer object 5, which lives in memory'
      - 'A box in memory that stores the value 5 inside it'
      - 'A reserved slot that can only ever hold integers from now on'
      - 'A copy of the number 5 that is separate from the original'
    answer_index: 0
    explanation: 'A Python variable is a name bound to an object, not a container. Writing x = 5 ties the name x to the already-existing integer object 5; the object holds the type, value, and identity, while the name is just a tag.'

  - question: 'After a = [1, 2, 3] and b = a, you run b.append(4). What does a now refer to?'
    options:
      - '[1, 2, 3] — a is an independent copy and is unaffected'
      - '[1, 2, 3, 4] — a and b are two names for the same list object'
      - '[4] — appending replaces the contents'
      - 'It raises an error because you cannot change a shared list'
    answer_index: 1
    explanation: 'b = a makes a second name for the same object (aliasing), it does not copy. Because the list is mutable, appending through b changes the one shared object, so a sees [1, 2, 3, 4] too.'

  - question: 'Which statement best describes dynamic typing in Python?'
    options:
      - 'Every variable must be declared with its type before use'
      - 'Types are checked by the compiler before the program runs'
      - 'The type belongs to the object and is checked at run time'
      - 'A variable keeps the type of the first value assigned to it forever'
    answer_index: 2
    explanation: 'Python is dynamically typed: the type lives on the object, not the name, and is checked as the program runs. A name like x can be re-bound from an int to a str to a list freely — the name itself is untyped.'

  - question: 'Which of these groups lists only IMMUTABLE Python types?'
    options:
      - 'list, dict, set'
      - 'dict, tuple, float'
      - 'int, list, str'
      - 'int, str, tuple'
    answer_index: 3
    explanation: 'int, str, and tuple are all immutable — once created, their value cannot change in place. list, dict, and set are mutable. "Changing" an immutable object always produces a new object and re-points the name.'

  - question: 'What does int("3.5") do in Python?'
    options:
      - 'Raises ValueError; "3.5" is not an integer string'
      - 'Returns the integer 4 by rounding'
      - 'Returns the integer 3 by truncating'
      - 'Returns the float 3.5 unchanged'
    answer_index: 0
    explanation: 'int() on a string only accepts a valid whole-number string, so int("3.5") raises ValueError. To truncate you must go through the float first: int(float("3.5")) gives 3. (int(3.9) on a float does truncate to 3.)'

  - question: 'Which list contains only FALSY values?'
    options:
      - '1, "a", [0], True'
      - '0, "", [], None'
      - '"False", -1, [None], {0: 0}'
      - '0.1, " ", (0,), {None}'
    answer_index: 1
    explanation: 'The falsy values are False, None, any zero (0, 0.0), and any empty container ("", [], {}, (), set()). Note that "False" is a non-empty string and therefore truthy, and (0,) is a non-empty tuple and also truthy.'

  - question: 'Why should you usually prefer isinstance(x, int) over type(x) == int for type checks?'
    options:
      - 'isinstance is faster in every case'
      - 'type() does not exist in modern Python'
      - 'isinstance understands subtypes and accepts a tuple of types'
      - 'type() returns a string while isinstance returns a real type'
    answer_index: 2
    explanation: 'isinstance() returns True for subtypes (for example isinstance(True, int) is True because bool is a subtype of int) and accepts a tuple like (int, float) to test several types at once. type() reports only the exact type and is best reserved for exploration and printing.'

  - question: 'You need to tell "no value was provided" apart from "the value is zero." Which test is correct?'
    options:
      - 'if value: — because zero counts as no value'
      - 'if type(value) == int: — because only integers can be present'
      - 'if value == "": — because absent values are empty strings'
      - 'if value is not None: — None means absent, 0 is present'
    answer_index: 3
    explanation: 'Because 0 is falsy, if value: cannot distinguish a genuine 0 from an absent value. None is the object that means "no value," and there is exactly one of it, so if value is not None: is the correct and idiomatic test for presence.'
