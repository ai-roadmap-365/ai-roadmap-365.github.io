visuals:
  - id: name-object
    file: assets/name-object.svg
    type: architecture
    title: 'Names are tags tied to objects'
    alt: 'Diagram: two names bound to the same object in memory, illustrating aliasing in Python'
    description: 'An architecture diagram showing names (a and b) on the left bound by arrows to objects on the right in memory, with both a and b pointing at one shared list object to illustrate aliasing, and a separate int object, each object labelled with its type, identity, and mutability.'
  - id: type-map
    file: assets/type-map.svg
    type: diagram
    title: 'The core Python types grouped by mutability'
    alt: 'Diagram: the core Python built-in types grouped by mutability and by category'
    description: 'A two-column map of the core built-in types: an immutable column (int, float, bool, str, NoneType, tuple) and a mutable column (list, dict, set), each grouped by category, showing which objects can change in place and which cannot.'
