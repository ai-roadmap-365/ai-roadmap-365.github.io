visuals:
  - id: name-object
    file: assets/name-object.svg
    type: architecture
    title: 'Names are tags tied to objects'
    alt: 'Diagram: two names bound to the same object in memory, illustrating aliasing in Python'
    description: 'An architecture diagram showing names (a and b) on the left bound by arrows to objects on the right in memory, with both a and b pointing at one shared list object to illustrate aliasing, and a separate int object, each object labelled with its type, identity, and mutability.'
  - id: type-map
    file: assets/type-map.svg
    type: diagram
    title: 'The core Python types grouped by mutability'
    alt: 'Diagram: the core Python built-in types grouped by mutability and by category'
    description: 'A two-column map of the core built-in types: an immutable column (int, float, bool, str, NoneType, tuple) and a mutable column (list, dict, set), each grouped by category, showing which objects can change in place and which cannot.'
  - id: label-not-box
    file: assets/label-not-box.svg
    type: diagram
    title: 'A name is a label, not a box'
    alt: 'Diagram: variables as boxes compared with variables as labels'
    description: 'A two-column comparison of the box model of variables used by languages like C against Python''s label-and-object model, and the different behaviour each produces on assignment.'
  - id: three-steps-of-assignment
    file: assets/three-steps-of-assignment.svg
    type: diagram
    title: 'What a = [1, 2, 3] actually does'
    alt: 'Diagram: the three steps of a Python assignment'
    description: 'A three-stage sequence showing object creation, name creation and binding, as the distinct operations performed by a single assignment statement.'
  - id: mutate-or-rebind
    file: assets/mutate-or-rebind.svg
    type: diagram
    title: 'Mutating and rebinding look similar and are not'
    alt: 'Diagram: mutating an object compared with rebinding a name'
    description: 'A two-column comparison of mutating a shared object against rebinding one of the names pointing at it, and what each does to the other name.'
  - id: truthiness-edge
    file: assets/truthiness-edge.svg
    type: diagram
    title: 'The values that are falsy'
    alt: 'Diagram: which Python values are falsy'
    description: 'A four-stage reference to Python truthiness covering the falsy values, the truthy default, the idiomatic use in conditions, and the case where the idiom fails.'
  - id: immutable-or-mutable
    file: assets/immutable-or-mutable.svg
    type: diagram
    title: 'Sort types by whether they can change'
    alt: 'Diagram: immutable Python types compared with mutable ones'
    description: 'A two-column comparison of immutable and mutable Python types, covering what each is safe for and how change behaves for each.'
  - id: mutable-default
    file: assets/mutable-default.svg
    type: diagram
    title: 'The mutable default argument'
    alt: 'Diagram: how a mutable default argument shares state between calls'
    description: 'A four-stage sequence showing a default list argument being created once at definition time and shared across every call that does not supply one.'
  - id: is-or-equals
    file: assets/is-or-equals.svg
    type: diagram
    title: 'is and == answer different questions'
    alt: 'Diagram: identity comparison compared with equality comparison'
    description: 'A two-column comparison of the is and equality operators, covering what each tests and when each is appropriate.'
  - id: hints-are-optional
    file: assets/hints-are-optional.svg
    type: diagram
    title: 'Type hints do not change how the code runs'
    alt: 'Diagram: how Python type hints are checked'
    description: 'A two-column comparison of what the Python interpreter does with type hints against what a static checker does with them.'
  - id: copy-depth
    file: assets/copy-depth.svg
    type: diagram
    title: 'Three depths of copying'
    alt: 'Diagram: assignment compared with shallow and deep copying'
    description: 'A three-stage progression from assignment through shallow copy to deep copy, describing what each duplicates and what remains shared.'
  - id: id-tells-you
    file: assets/id-tells-you.svg
    type: diagram
    title: 'Using id() to see what happened'
    alt: 'Diagram: how id() reveals whether an object was mutated or replaced'
    description: 'A four-stage diagnostic using the id built-in to distinguish mutation from rebinding by observing whether an object''s identity changes.'
