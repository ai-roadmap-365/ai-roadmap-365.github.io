title: 'Variables and Types'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will be able to explain what a Python variable really is — a name bound to an object — name the core built-in types, tell mutable from immutable, and convert between types safely, so type confusion never silently breaks your data or model code.'
objectives:
  - 'Explain the name-object model of variables (names are tags bound to objects, not boxes that hold values) and connect it to bytes in memory from Day 4'
  - 'Identify the core built-in types — int, float, bool, str, NoneType, list, tuple, dict, set — and give a literal and use for each'
  - 'Distinguish dynamic typing (types live on objects, checked at run time) from static typing (types declared on names, checked before running)'
  - 'Use type() and isinstance() to inspect and test an object''s type, and explain when to prefer isinstance'
  - 'Predict truthiness for values including the falsy set (None, False, 0, empty containers) and distinguish absent from present-but-empty with is None'
  - 'Distinguish mutable from immutable objects using id(), and convert between types safely with int(), float(), and str() while handling ValueError'
  - 'Apply PEP 8 snake_case naming conventions and connect clean typing to reliable data pipelines and typed AI inputs and outputs'
prerequisites:
  - 'Day 43 — Python installed and runnable (python3 launches the interpreter and REPL)'
  - 'Day 4 — data is bytes in memory (this lesson builds the object layer on top of that)'
  - 'A terminal and any text editor; no prior Python programming required'
