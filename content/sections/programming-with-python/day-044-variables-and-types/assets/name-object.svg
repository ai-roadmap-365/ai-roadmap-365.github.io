<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="system-ui, sans-serif">
  <title>Two names bound to the same object in memory, illustrating aliasing in Python</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Names are tags tied to objects — not boxes that hold values</text>

  <!-- Names column -->
  <text x="150" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Names (in your code)</text>
  <rect x="70" y="110" width="160" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="144" text-anchor="middle" font-size="18" fill="#1a202c">a</text>
  <rect x="70" y="210" width="160" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="150" y="244" text-anchor="middle" font-size="18" fill="#1a202c">b</text>

  <!-- Objects column -->
  <text x="540" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Objects (in memory)</text>
  <rect x="420" y="120" width="240" height="120" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="540" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">list object</text>
  <text x="540" y="176" text-anchor="middle" font-size="16" fill="#1a202c">[1, 2, 3]</text>
  <text x="540" y="204" text-anchor="middle" font-size="13" fill="#1a202c">type: list &#183; id: 0x10a3f</text>
  <text x="540" y="226" text-anchor="middle" font-size="13" fill="#1a202c">mutable: contents can change</text>

  <rect x="420" y="300" width="240" height="90" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="540" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">int object</text>
  <text x="540" y="356" text-anchor="middle" font-size="16" fill="#1a202c">7</text>
  <text x="540" y="378" text-anchor="middle" font-size="13" fill="#1a202c">type: int &#183; immutable</text>

  <!-- Arrows: a and b both point to the list (aliasing) -->
  <line x1="230" y1="138" x2="412" y2="160" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="420,163 405,158 409,172" fill="#1d4ed8"/>
  <line x1="230" y1="238" x2="412" y2="185" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="420,182 406,182 412,196" fill="#1d4ed8"/>

  <text x="315" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">a = [1, 2, 3]</text>
  <text x="315" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">b = a  (same object!)</text>

  <!-- Aliasing note -->
  <rect x="40" y="330" width="330" height="80" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="205" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Aliasing</text>
  <text x="205" y="378" text-anchor="middle" font-size="13" fill="#1a202c">Because a and b tag one object,</text>
  <text x="205" y="396" text-anchor="middle" font-size="13" fill="#1a202c">b.append(4) also changes a.</text>
</svg>
