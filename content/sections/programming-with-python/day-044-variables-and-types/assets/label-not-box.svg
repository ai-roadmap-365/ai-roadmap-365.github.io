<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The mental model that decides everything else.">
  <title>A name is a label, not a box</title>
  <style>
    .label-not-box-bg   { fill: #f8fafc; }
    .label-not-box-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-not-box-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-not-box-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-not-box-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-not-box-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label-not-box-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .label-not-box-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .label-not-box-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .label-not-box-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .label-not-box-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .label-not-box-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .label-not-box-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .label-not-box-row { opacity: 1; }
    .label-not-box-r0 { animation-delay: 0.00s; }
    .label-not-box-r1 { animation-delay: 0.45s; }
    .label-not-box-r2 { animation-delay: 0.90s; }
    .label-not-box-r3 { animation-delay: 1.35s; }
    .label-not-box-r4 { animation-delay: 1.80s; }
    .label-not-box-row { animation: label-not-box-reveal 7.3s ease-in-out infinite; }
    @keyframes label-not-box-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="label-not-box-bg" width="980" height="390"/>
  <text class="label-not-box-h1"  x="30" y="40">A name is a label, not a box</text>
  <text class="label-not-box-sub" x="30" y="64">The mental model that decides everything else.</text>
  <rect class="label-not-box-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="label-not-box-name" x="46" y="122">The box model</text>
  <text class="label-not-box-desc" x="46" y="142">The variable holds the value.</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r0" x="46" y="182">Assignment copies bytes into storage</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r1" x="46" y="216">b = a duplicates the value</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r2" x="46" y="250">Changing b cannot affect a</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r3" x="46" y="284">Each variable has its own space</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r4" x="46" y="318">True in C, and not in Python</text>
  <rect class="label-not-box-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="label-not-box-name" x="526" y="122">The label model</text>
  <text class="label-not-box-desc" x="526" y="142">The variable points at an object.</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r0" x="526" y="182">Assignment binds a name to an object</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r1" x="526" y="216">b = a adds a second label</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r2" x="526" y="250">Mutating through b IS visible through a</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r3" x="526" y="284">One object, any number of names</text>
  <text class="label-not-box-desc label-not-box-row label-not-box-r4" x="526" y="318">This is Python</text>
  <text class="label-not-box-sub" x="30" y="372">Almost every aliasing surprise comes from carrying the box model into Python. Once the label model lands, the surprising behaviour becomes the obviously predicted one.</text>
</svg>
