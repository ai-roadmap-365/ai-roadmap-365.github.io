<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The interpreter ignores them entirely.">
  <title>Type hints do not change how the code runs</title>
  <style>
    .hints-are-optional-bg   { fill: #f8fafc; }
    .hints-are-optional-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hints-are-optional-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hints-are-optional-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hints-are-optional-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hints-are-optional-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hints-are-optional-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hints-are-optional-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hints-are-optional-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hints-are-optional-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hints-are-optional-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hints-are-optional-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hints-are-optional-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hints-are-optional-row { opacity: 1; }
    .hints-are-optional-r0 { animation-delay: 0.00s; }
    .hints-are-optional-r1 { animation-delay: 0.45s; }
    .hints-are-optional-r2 { animation-delay: 0.90s; }
    .hints-are-optional-r3 { animation-delay: 1.35s; }
    .hints-are-optional-r4 { animation-delay: 1.80s; }
    .hints-are-optional-row { animation: hints-are-optional-reveal 7.3s ease-in-out infinite; }
    @keyframes hints-are-optional-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hints-are-optional-bg" width="980" height="390"/>
  <text class="hints-are-optional-h1"  x="30" y="40">Type hints do not change how the code runs</text>
  <text class="hints-are-optional-sub" x="30" y="64">The interpreter ignores them entirely.</text>
  <rect class="hints-are-optional-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hints-are-optional-name" x="46" y="122">The interpreter</text>
  <text class="hints-are-optional-desc" x="46" y="142">Reads them, ignores them.</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r0" x="46" y="182">x: int = 42 runs identically to x = 42</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r1" x="46" y="216">Rebinding x to a string still works</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r2" x="46" y="250">No runtime cost, no runtime check</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r3" x="46" y="284">Hints are stored, and not enforced</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r4" x="46" y="318">The program's behaviour is unchanged</text>
  <rect class="hints-are-optional-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hints-are-optional-name" x="526" y="122">A checker like mypy</text>
  <text class="hints-are-optional-desc" x="526" y="142">Reads them and objects.</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r0" x="526" y="182">Runs separately, before the program</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r1" x="526" y="216">Reports the assignment as an error</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r2" x="526" y="250">Catches whole classes of mistake early</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r3" x="526" y="284">Adopt it gradually, module by module</text>
  <text class="hints-are-optional-desc hints-are-optional-row hints-are-optional-r4" x="526" y="318">This is Day 37's argument, in Python</text>
  <text class="hints-are-optional-sub" x="30" y="372">This design was deliberate: real static typing would have broken the language, and optional annotations gave most of the benefit to anyone who wants it without imposing it on anyone who does not.</text>
</svg>
