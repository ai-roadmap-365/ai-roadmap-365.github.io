questions:
  - question: 'Why do experienced developers deliberately optimise code for readability?'
    options:
      - 'Because Python executes readable code faster than terse code'
      - 'Because the interpreter refuses to run code that violates PEP 8'
      - 'Because code is read far more often than it is written, so the time spent reading and changing it dominates the cost of software'
      - 'Because readable code always uses less memory'
    answer_index: 2
    explanation: 'Readability is an economic argument, not an aesthetic one: over a program''s life it is read and modified many more times than it is first written, so anything that makes reading faster pays off repeatedly. PEP 8 is guidance, not something the interpreter enforces, and formatting does not change speed or memory.'

  - question: 'Which name follows PEP 8''s convention for a module-level constant?'
    options:
      - 'MAX_RETRIES = 5'
      - 'maxRetries = 5'
      - 'maxretries = 5'
      - 'Max_Retries = 5'
    answer_index: 0
    explanation: 'PEP 8 uses UPPER_CASE_WITH_UNDERSCORES for constants, snake_case for variables and functions, and CapWords for classes. `maxRetries` is camelCase (a JavaScript/Java habit), `maxretries` is unreadable, and `Max_Retries` matches no Python convention.'

  - question: 'How does a docstring differ from a comment?'
    options:
      - 'A docstring is simply faster to type than a comment'
      - 'Comments are shown by help() but docstrings are not'
      - 'They are identical; the two words are interchangeable'
      - 'A docstring is a string literal kept at runtime (via __doc__ and help()), while a comment is only visible in the source and is ignored by the interpreter'
    answer_index: 3
    explanation: 'A docstring is the first string literal in a module, function, or class and becomes that object''s __doc__, which help() and editors display. A comment (a # line) is guidance for whoever reads the source and is discarded by the interpreter — it is never available at runtime.'

  - question: 'What should a good comment or docstring mainly explain?'
    options:
      - 'What each line does, step by step, in plain English'
      - 'Why the code exists, or a non-obvious decision — the reasoning a reader cannot recover from the code itself'
      - 'Which version of Python is required to run the file'
      - 'Who wrote the code and on what date'
    answer_index: 1
    explanation: 'Good documentation says WHY, not what: the code already shows what it does, so a comment that restates it adds noise and rots when the code changes. The valuable comment captures intent, trade-offs, and surprises a future reader could not infer.'

  - question: 'What do Python type hints do at runtime, by default?'
    options:
      - 'They convert each value to the annotated type automatically'
      - 'They stop the program with an error whenever a value has the wrong type'
      - 'Nothing — they are not enforced at runtime; they document intent for readers and are checked by separate tools such as a type checker'
      - 'They make annotated functions run measurably faster'
    answer_index: 2
    explanation: 'Type hints are annotations, not runtime checks: Python does not convert or validate values based on them. Their value is documentation that a reader and a separate type checker (or an editor) can use to catch mismatches before the code ever runs.'

  - question: 'What is the difference between a formatter like Black and a linter like Ruff or flake8?'
    options:
      - 'A formatter rewrites the code''s layout into a consistent style; a linter analyses the code and reports likely problems and style violations, but generally does not rewrite it'
      - 'A formatter finds bugs, while a linter only fixes indentation'
      - 'They are the same kind of tool under two different names'
      - 'A linter runs the program, while a formatter compiles it to machine code'
    answer_index: 0
    explanation: 'A formatter (Black) automatically standardises layout — spacing, quotes, line wrapping — so style is applied by machine. A linter (Ruff, flake8) reads the code without running it and flags issues such as unused imports, undefined names, and PEP 8 violations; it reports rather than rewrites (though some, like Ruff, can auto-fix a subset).'

  - question: 'What is the safest way to refactor a working function?'
    options:
      - 'Rewrite the whole file at once, then run it to see if it still works'
      - 'Change names, structure, and types all together in a single large edit'
      - 'Delete the tests first so they do not get in the way'
      - 'Make one small change, run the tests, and continue only when they still pass'
    answer_index: 3
    explanation: 'Refactoring means improving structure without changing behaviour, so a passing test suite is your safety net. Small steps — rename, test; extract a function, test — localise any mistake to the last change, which is why it is far safer than one big rewrite.'

  - question: 'Your test suite can optionally run a formatter that is not installed on this machine. What should a well-designed suite do?'
    options:
      - 'Fail the entire suite, because a tool it mentioned is missing'
      - 'Skip that one check cleanly and still pass, since the tool is optional'
      - 'Download and install the tool automatically over the network'
      - 'Silently report every check as passed without actually running anything'
    answer_index: 1
    explanation: 'An optional tool should degrade gracefully: skip its check and report the skip, so a missing convenience never turns the suite red or forces a network install. Silently passing everything (option 3) hides real failures, and hard-failing (option 1) punishes people for not installing an optional extra.'
