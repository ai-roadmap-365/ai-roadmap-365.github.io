terms:
  - term: readability
    definition: 'The quality of code that lets a human understand what it does and why with the least effort — driven by clear names, small functions, consistent layout, and explanations of intent. Code is read far more often than it is written, so readability is a first-class goal, not a finishing touch.'
  - term: style guide
    definition: 'A shared set of conventions for how code should look and be organised, so a team''s code reads as if one careful person wrote it. For Python the canonical style guide is PEP 8.'
  - term: PEP 8
    definition: 'Python''s official Style Guide for Python Code: conventions for naming (snake_case for functions and variables, CapWords for classes, UPPER_CASE for constants), indentation (4 spaces), spacing around operators, line length, and import order. It is guidance for readability, applied with judgement rather than pedantry.'
  - term: PEP 257
    definition: 'Python''s Docstring Conventions: how to write the triple-quoted string that documents a module, function, class, or method — a one-line summary in the imperative, a blank line, then any detail — describing what the object does and why, not a line-by-line account of how.'
  - term: PEP 20 (the Zen of Python)
    definition: 'A short list of guiding aphorisms for Python design — "Readability counts", "Explicit is better than implicit", "Simple is better than complex", "There should be one obvious way to do it" — printed by running `import this`. It is a set of tie-breakers for choosing between competing designs.'
  - term: naming convention
    definition: 'An agreed pattern for choosing identifiers so their form signals their role: in Python, snake_case for variables and functions, CapWords (PascalCase) for classes, and UPPER_CASE for module-level constants. Following the convention lets a reader guess what a name is before reading its definition.'
  - term: docstring
    definition: 'A string literal written as the first statement of a module, function, class, or method, accessible at runtime as the object''s `__doc__` and by `help()`. Unlike a comment, it is part of the program''s data and is what documentation tools and IDEs display.'
  - term: comment vs docstring
    definition: 'A comment (a line starting with #) is a note to whoever reads the source, ideally explaining WHY a piece of code exists or a non-obvious decision; a docstring is structured documentation of an object''s purpose and interface, readable at runtime. Rule of thumb: docstrings say what and why for the caller; comments explain why for the maintainer; neither should merely restate what the code plainly does.'
  - term: type hint
    definition: 'An optional annotation stating the expected type of a variable, parameter, or return value, such as `def mean(scores: list[float]) -> float:`. Python does not enforce hints at runtime, but they document intent for readers and let tools (type checkers, editors) catch mismatches before the code runs.'
  - term: linter
    definition: 'A tool that analyses source code without running it and reports likely problems and style violations — unused imports, undefined names, shadowed variables, lines that break PEP 8. In Python, Ruff and flake8 are popular linters; a linter finds issues but generally does not rewrite your code.'
  - term: formatter
    definition: 'A tool that automatically rewrites code into a consistent layout — indentation, spacing, quote style, line wrapping — so style is machine-applied rather than argued over. Black is the widely used Python formatter; it is deliberately opinionated and has few options.'
  - term: refactoring
    definition: 'Changing the internal structure of code to make it clearer or simpler without changing its external behaviour. Done well, it proceeds in small steps, each verified by tests, so that improved readability never comes at the cost of a hidden bug.'
