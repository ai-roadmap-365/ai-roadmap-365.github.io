visuals:
  - id: readability-pillars
    file: assets/readability-pillars.svg
    type: diagram
    title: 'The five pillars of readable code'
    alt: 'Diagram: the five pillars of readable code — meaningful names, small functions, docstrings and comments, PEP 8 formatting, and type hints — holding up readable code on a foundation of PEP 8, PEP 257, and PEP 20'
    description: 'Five pillars — meaningful names, small single-purpose functions, docstrings and comments that say why, PEP 8 formatting, and type hints that tools can check — hold up a roof labelled readable code, which supports work that is reviewable, reproducible, and AI-friendly. All five stand on a shared foundation of PEP 8 (style), PEP 257 (docstrings), and PEP 20 (the Zen of Python).'
  - id: refactor-flow
    file: assets/refactor-flow.svg
    type: flowchart
    title: 'Refactoring for readability in safe steps'
    alt: 'Flowchart: refactoring for readability in safe steps — messy but working, rename, decompose, document and type, lint and format, ending in clean reviewable code, with tests staying green after every step'
    description: 'A vertical flow from a messy but working script through five safe steps — rename for clear names, decompose into small single-purpose functions, add docstrings and type hints, and lint and format with Ruff and Black — ending in clean, reviewable code. After every step the tests are run and stay green, so behaviour never changes while readability improves.'
  - id: readable-idea
    file: assets/readable-idea.svg
    type: diagram
    title: 'Why readability is a correctness concern'
    alt: 'Diagram: why readable code is more correct code'
    description: 'A four-stage description of readability covering the reading ratio, comprehension, defect discovery and change.'
  - id: naming
    file: assets/naming.svg
    type: diagram
    title: 'Naming'
    alt: 'Diagram: the four rules of useful naming'
    description: 'A four-stage description of naming covering intent, length, consistency and conventions.'
  - id: small-functions
    file: assets/small-functions.svg
    type: diagram
    title: 'Small functions'
    alt: 'Diagram: the four properties of a well-sized function'
    description: 'A four-stage description of function sizing covering single purpose, the name test, the level of abstraction and the length.'
  - id: docstrings
    file: assets/docstrings.svg
    type: diagram
    title: 'Docstrings against comments'
    alt: 'Diagram: docstrings compared with inline comments'
    description: 'A two-column comparison of docstrings against inline comments.'
  - id: type-hints-61
    file: assets/type-hints-61.svg
    type: diagram
    title: 'Type hints'
    alt: 'Diagram: the four benefits of type annotations'
    description: 'A four-stage description of type hints covering documentation, checking, tooling and design pressure.'
  - id: readable-not
    file: assets/readable-not.svg
    type: diagram
    title: 'Four things readability is not'
    alt: 'Diagram: four misconceptions about readable code'
    description: 'A two-column comparison of misconceptions about readability against what is true.'
  - id: readable-history
    file: assets/readable-history.svg
    type: diagram
    title: 'Four steps in readability practice'
    alt: 'Diagram: the historical progression of code readability practice'
    description: 'A four-stage description of readability history covering personal style, style guides, linters and formatters.'
  - id: technical-writing
    file: assets/technical-writing.svg
    type: diagram
    title: 'Writing for a reader'
    alt: 'Diagram: writing that assumes context compared with writing that supplies it'
    description: 'A two-column comparison of writing for oneself against writing for a reader.'
  - id: readable-implications
    file: assets/readable-implications.svg
    type: diagram
    title: 'Four consequences of readability'
    alt: 'Diagram: the review, defect, onboarding and change implications of readable code'
    description: 'A four-stage description of readability implications covering review effectiveness, defect discovery, onboarding and change cost.'
  - id: readable-when
    file: assets/readable-when.svg
    type: diagram
    title: 'How much polish'
    alt: 'Diagram: how much readability investment code warrants'
    description: 'A two-column comparison of code lifetimes against the readability investment each warrants.'
