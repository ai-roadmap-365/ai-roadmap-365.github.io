<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why readability is a correctness concern</title>
  <style>
    .readable-idea-bg   { fill: #f8fafc; }
    .readable-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readable-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readable-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readable-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readable-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readable-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readable-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readable-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .readable-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .readable-idea-stage { opacity: 1; }

    .readable-idea-s0 { animation-delay: 0.00s; }
    .readable-idea-e0 { animation-delay: 0.00s; }
    .readable-idea-s1 { animation-delay: 1.28s; }
    .readable-idea-e1 { animation-delay: 1.28s; }
    .readable-idea-s2 { animation-delay: 2.56s; }
    .readable-idea-e2 { animation-delay: 2.56s; }
    .readable-idea-s3 { animation-delay: 3.84s; }
    .readable-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .readable-idea-conn  { animation: readable-idea-trace 6.4s ease-in-out infinite; }
      .readable-idea-stage { animation: readable-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes readable-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes readable-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .readable-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .readable-idea-stage { animation: readable-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes readable-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="readable-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="readable-idea-bg" width="980" height="322"/>
  <text class="readable-idea-h1"  x="30" y="40">Why readability is a correctness concern</text>
  <text class="readable-idea-sub" x="30" y="64">Four steps.</text>
  <g class="readable-idea-stage readable-idea-s0">
    <rect class="readable-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="readable-idea-step" x="44" y="142">01</text>
    <text class="readable-idea-name" x="70" y="142">Code is read far more often than written</text>
    <text class="readable-idea-desc" x="44" y="166">Including by its author, later.</text>
  </g>
  <line class="readable-idea-line readable-idea-conn readable-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#readable-idea-tip)"/>
  <g class="readable-idea-stage readable-idea-s1">
    <rect class="readable-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="readable-idea-step" x="280" y="142">02</text>
    <text class="readable-idea-name" x="306" y="142">A reader who cannot follow it cannot verify it</text>
    <text class="readable-idea-desc" x="280" y="166">So defects survive review.</text>
  </g>
  <line class="readable-idea-line readable-idea-conn readable-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#readable-idea-tip)"/>
  <g class="readable-idea-stage readable-idea-s2">
    <rect class="readable-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="readable-idea-step" x="516" y="142">03</text>
    <text class="readable-idea-name" x="542" y="142">And cannot change it safely</text>
    <text class="readable-idea-desc" x="516" y="166">Which is where most bugs are</text>
    <text class="readable-idea-desc" x="516" y="182">introduced.</text>
  </g>
  <line class="readable-idea-line readable-idea-conn readable-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#readable-idea-tip)"/>
  <g class="readable-idea-stage readable-idea-s3">
    <rect class="readable-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="readable-idea-step" x="752" y="142">04</text>
    <text class="readable-idea-name" x="778" y="142">So readability is a correctness property</text>
    <text class="readable-idea-desc" x="752" y="166">Not a matter of taste.</text>
  </g>
  <text class="readable-idea-sub" x="30" y="304">Framing it as correctness rather than style is what makes it arguable: unreadable code is code whose defects cannot be found by inspection.</text>
</svg>
