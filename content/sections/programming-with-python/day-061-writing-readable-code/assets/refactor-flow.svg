<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" font-family="system-ui, sans-serif">
  <title>Refactoring for readability in safe steps: start from a messy but working script, then rename for clear names, decompose into small single-purpose functions, add docstrings and type hints, and finally lint and format with Ruff and Black — running the tests after every step so behaviour never changes and the result is clean, reviewable code</title>
  <rect x="0" y="0" width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Refactor for readability, one safe step at a time</text>

  <!-- Step 1 -->
  <rect x="290" y="56" width="180" height="56" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Messy but working</text>
  <text x="380" y="100" text-anchor="middle" font-size="14" fill="#1a202c">poor names, one giant function</text>

  <line x1="380" y1="112" x2="380" y2="150" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,150 374,138 386,138" fill="#1a202c"/>
  <text x="560" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">tests stay green</text>

  <!-- Step 2 -->
  <rect x="290" y="150" width="180" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. Rename</text>
  <text x="380" y="194" text-anchor="middle" font-size="14" fill="#1a202c">meaningful, searchable names</text>

  <line x1="380" y1="206" x2="380" y2="244" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,244 374,232 386,232" fill="#1a202c"/>
  <text x="560" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">tests stay green</text>

  <!-- Step 3 -->
  <rect x="290" y="244" width="180" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. Decompose</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" fill="#1a202c">small single-purpose functions</text>

  <line x1="380" y1="300" x2="380" y2="338" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,338 374,326 386,326" fill="#1a202c"/>
  <text x="560" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">tests stay green</text>

  <!-- Step 4 -->
  <rect x="290" y="338" width="180" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. Document + type</text>
  <text x="380" y="382" text-anchor="middle" font-size="14" fill="#1a202c">docstrings, type hints</text>

  <line x1="380" y1="394" x2="380" y2="432" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,432 374,420 386,420" fill="#1a202c"/>
  <text x="560" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">tests stay green</text>

  <!-- Step 5 -->
  <rect x="290" y="432" width="180" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. Lint + format</text>
  <text x="380" y="476" text-anchor="middle" font-size="14" fill="#1a202c">Ruff checks, Black formats</text>

  <line x1="380" y1="488" x2="380" y2="526" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,526 374,514 386,514" fill="#1a202c"/>
  <text x="560" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">tests stay green</text>

  <!-- Result -->
  <rect x="290" y="526" width="180" height="60" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Clean, reviewable code</text>
  <text x="380" y="572" text-anchor="middle" font-size="14" fill="#1a202c">same behaviour, easy to read</text>

  <!-- Left rail note -->
  <text x="150" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Behaviour never</text>
  <text x="150" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">changes — only</text>
  <text x="150" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">readability does.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 380 112 L 380 150" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 380 206 L 380 244" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 380 300 L 380 338" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 380 394 L 380 432" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 380 488 L 380 526" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
