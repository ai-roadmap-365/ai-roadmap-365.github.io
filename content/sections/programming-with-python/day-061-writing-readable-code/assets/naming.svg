<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>Naming</title>
  <style>
    .naming-bg   { fill: #f8fafc; }
    .naming-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .naming-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .naming-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .naming-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .naming-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .naming-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .naming-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .naming-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .naming-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .naming-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .naming-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .naming-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .naming-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .naming-stage { opacity: 1; }

    .naming-s0 { animation-delay: 0.00s; }
    .naming-e0 { animation-delay: 0.00s; }
    .naming-s1 { animation-delay: 1.28s; }
    .naming-e1 { animation-delay: 1.28s; }
    .naming-s2 { animation-delay: 2.56s; }
    .naming-e2 { animation-delay: 2.56s; }
    .naming-s3 { animation-delay: 3.84s; }
    .naming-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .naming-conn  { animation: naming-trace 6.4s ease-in-out infinite; }
      .naming-stage { animation: naming-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes naming-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes naming-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .naming-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .naming-stage { animation: naming-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes naming-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="naming-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="naming-bg" width="980" height="322"/>
  <text class="naming-h1"  x="30" y="40">Naming</text>
  <text class="naming-sub" x="30" y="64">Four rules.</text>
  <g class="naming-stage naming-s0">
    <rect class="naming-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="naming-step" x="44" y="142">01</text>
    <text class="naming-name" x="70" y="142">The name should say what it is or does</text>
    <text class="naming-desc" x="44" y="166">Not how it is implemented.</text>
  </g>
  <line class="naming-line naming-conn naming-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#naming-tip)"/>
  <g class="naming-stage naming-s1">
    <rect class="naming-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="naming-step" x="280" y="142">02</text>
    <text class="naming-name" x="306" y="142">Longer names for wider scopes</text>
    <text class="naming-desc" x="280" y="166">A loop index can be one letter;</text>
    <text class="naming-desc" x="280" y="182">a module constant cannot.</text>
  </g>
  <line class="naming-line naming-conn naming-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#naming-tip)"/>
  <g class="naming-stage naming-s2">
    <rect class="naming-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="naming-step" x="516" y="142">03</text>
    <text class="naming-name" x="542" y="142">Consistent vocabulary across the codebase</text>
    <text class="naming-desc" x="516" y="166">One word per concept,</text>
    <text class="naming-desc" x="516" y="182">everywhere.</text>
  </g>
  <line class="naming-line naming-conn naming-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#naming-tip)"/>
  <g class="naming-stage naming-s3">
    <rect class="naming-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="naming-step" x="752" y="142">04</text>
    <text class="naming-name" x="778" y="142">And follow the language's conventions</text>
    <text class="naming-desc" x="752" y="166">So a reader's expectations are</text>
    <text class="naming-desc" x="752" y="182">met.</text>
  </g>
  <text class="naming-sub" x="30" y="304">One word per concept is the rule that pays most in a growing codebase: fetch, get, load and retrieve meaning the same thing forces the reader to check every time.</text>
</svg>
