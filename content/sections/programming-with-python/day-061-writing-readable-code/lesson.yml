slug: writing-readable-code
title: 'Writing Readable Code'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to write and refactor Python that other people (and your future self) can read: PEP 8 naming and layout, meaningful names and small single-purpose functions, docstrings that say why (PEP 257), type hints as checkable documentation, the Zen of Python (PEP 20) as guiding principles, and the tools that automate style — a formatter (Black) and a linter (Ruff or flake8).'
objectives:
  - 'Apply PEP 8 essentials without pedantry: naming conventions, spacing, line length, and import order, and explain what they buy a reader'
  - 'Choose meaningful, searchable names and split a large function into small, single-purpose functions'
  - 'Use the Zen of Python (PEP 20) as practical guidance for choosing between competing designs'
  - 'Write docstrings (PEP 257) and comments that explain WHY, not what, and tell the two apart'
  - 'Add type hints as documentation that tools can check, and describe how a type checker uses them'
  - 'Refactor working code in small, safe steps proven by tests, changing readability without changing behaviour'
  - 'Run a formatter (Black) and a linter (Ruff or flake8), read their output, and know when a missing optional tool should degrade gracefully'
prerequisites:
  - 'Days 57-60 of this course: functions, modules and imports, project layout, and the standard library'
  - 'Day 49: the shape of a real program — named functions, a main(), the main-guard idiom, and input validation'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
