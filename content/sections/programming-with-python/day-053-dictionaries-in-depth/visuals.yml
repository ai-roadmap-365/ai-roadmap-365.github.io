visuals:
  - id: hash-table-model
    file: assets/hash-table-model.svg
    type: diagram
    title: 'Inside a dictionary: key to hash to bucket to value'
    alt: 'Diagram: how a dictionary finds a value — a key is hashed to a number, the number picks a bucket, and the bucket holds the value, giving average O(1) lookup'
    description: 'A left-to-right pipeline: the key "cat" enters a hash(key) box that turns it into a big number reduced by the number of buckets, producing a bucket index (#2). An array of buckets is shown with bucket #2 highlighted; a dashed arrow drops from the index into that bucket, and below it the stored pair ("cat", 4) yields the value 4. A side panel notes average O(1) — one hash and one jump, the same speed at ten or ten million keys — and a red panel explains that a collision (two keys in one bucket) is handled by checking them one by one, and that a bad hash sending everything to one bucket degrades lookup toward O(n).'
  - id: dict-lookup-flow
    file: assets/dict-lookup-flow.svg
    type: flowchart
    title: 'Which dictionary access pattern to use'
    alt: 'Flowchart: choosing a dictionary access pattern — whether the key might be missing decides between square-bracket lookup, get with a default, and setdefault, and whether you are reading or writing'
    description: 'Starting from a key and a dictionary, the flow first asks whether you are reading or writing. Reading branches on whether the key might be missing: if it must exist, use d[key] (fast, raises KeyError if absent); if it might be missing, use d.get(key, default) (returns the default, no KeyError). Writing branches on whether you are grouping into a possibly-missing key: if just setting, use d[key] = value (or d.update(other) for many); if grouping, use d.setdefault(k, []) then append, or d.get(k, 0) + 1 for counts. A footer gives rules of thumb: d[key] only when the key must be there, .get() to read safely, "key in d" for a yes/no check, and setdefault (or Counter / defaultdict) for counting and grouping.'
  - id: dict-idea
    file: assets/dict-idea.svg
    type: diagram
    title: 'What a dictionary is'
    alt: 'Diagram: the four defining properties of a dictionary'
    description: 'A four-stage description of dictionaries covering key-value pairs, constant-time lookup, key requirements and insertion order.'
  - id: hashable
