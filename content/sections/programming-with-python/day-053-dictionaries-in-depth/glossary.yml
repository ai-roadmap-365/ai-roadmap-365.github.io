terms:
  - term: dictionary
    definition: 'Python''s built-in mapping type: a mutable collection of key-value pairs in which each key is unique and maps to one value, offering fast lookup, insertion, and deletion by key, and (since 3.7) preserved insertion order. Written with braces, e.g. {"cat": 4}.'
  - term: key
    definition: 'The label under which a value is stored in a dictionary. Keys are unique and must be hashable (immutable), such as a string, number, or tuple of those; you fetch a value by giving its key.'
  - term: value
    definition: 'The data stored under a key in a dictionary. Values can be any Python object at all — including a list or another dictionary — and, unlike keys, may repeat.'
  - term: hashable
    definition: 'A property of an object whose hash value stays fixed over its lifetime (and where equal objects share a hash), which is what lets it serve as a dictionary key. Immutable built-ins qualify; mutable ones (lists, sets, dicts) do not.'
  - term: get
    definition: 'The dictionary method d.get(key, default) that returns the value for key, or the given default (or None if none is given) when the key is absent — a safe read that does not raise KeyError.'
  - term: setdefault
    definition: 'The dictionary method d.setdefault(key, default) that returns the value for key, inserting default first if the key is missing. It is the standard tool for grouping, because a per-key collection is created exactly once.'
  - term: items/keys/values
    definition: 'The three dictionary view methods used to iterate: .items() yields each (key, value) pair, .keys() yields the keys, and .values() yields the values, all in insertion order.'
  - term: KeyError
    definition: 'The exception Python raises when you read a key that is not present using square brackets, e.g. d["missing"]. It signals a genuinely absent key; avoid it for optional keys with .get() or an "in" check.'
  - term: dict comprehension
    definition: 'A compact expression that builds a new dictionary from an iterable in one line, of the form {key: value for item in iterable if condition} — the dictionary counterpart of a list comprehension.'
  - term: nested dict
    definition: 'A dictionary whose values are themselves dictionaries, used to model structured records with named fields — the shape of a JSON payload, a config object, or a feature record.'
  - term: hash table
    definition: 'The data structure underneath a dictionary: it hashes a key to a number, reduces it to a bucket (array slot), and stores the pair there, giving average O(1) lookup by jumping straight to the bucket instead of scanning.'
  - term: membership
    definition: 'Testing whether a key is present with the expression key in d, which returns True or False. It is itself an O(1) hash lookup and the safe way to check before reading with square brackets.'
  - term: collision
    definition: 'When two different keys reduce to the same bucket in the hash table. Python keeps such pairs together and compares them one by one; collisions are normally rare and cheap, but a pathological hash that clusters keys degrades lookup toward O(n).'
