<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a dictionary is not</title>
  <style>
    .dict-not-bg   { fill: #f8fafc; }
    .dict-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dict-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dict-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dict-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dict-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dict-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dict-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dict-not-row { opacity: 1; }
    .dict-not-r0 { animation-delay: 0.00s; }
    .dict-not-r1 { animation-delay: 0.45s; }
    .dict-not-r2 { animation-delay: 0.90s; }
    .dict-not-r3 { animation-delay: 1.35s; }
    .dict-not-r4 { animation-delay: 1.80s; }
    .dict-not-row { animation: dict-not-reveal 7.3s ease-in-out infinite; }
    @keyframes dict-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dict-not-bg" width="980" height="390"/>
  <text class="dict-not-h1"  x="30" y="40">Four things a dictionary is not</text>
  <text class="dict-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="dict-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dict-not-name" x="46" y="122">The misconception</text>
  <text class="dict-not-desc" x="46" y="142">Commonly held.</text>
  <text class="dict-not-desc dict-not-row dict-not-r0" x="46" y="182">Lookup is fast because it searches cleverly</text>
  <text class="dict-not-desc dict-not-row dict-not-r1" x="46" y="216">Any object can be a key</text>
  <text class="dict-not-desc dict-not-row dict-not-r2" x="46" y="250">Order was always guaranteed</text>
  <text class="dict-not-desc dict-not-row dict-not-r3" x="46" y="284">Iterating gives the values</text>
  <text class="dict-not-desc dict-not-row dict-not-r4" x="46" y="318">Two equal keys can coexist</text>
  <rect class="dict-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dict-not-name" x="526" y="122">What is true</text>
  <text class="dict-not-desc" x="526" y="142">Actually.</text>
  <text class="dict-not-desc dict-not-row dict-not-r0" x="526" y="182">It computes the location directly; it does not search</text>
  <text class="dict-not-desc dict-not-row dict-not-r1" x="526" y="216">Only hashable, effectively immutable ones</text>
  <text class="dict-not-desc dict-not-row dict-not-r2" x="526" y="250">It became a language guarantee only recently</text>
  <text class="dict-not-desc dict-not-row dict-not-r3" x="526" y="284">It gives the keys unless you ask otherwise</text>
  <text class="dict-not-desc dict-not-row dict-not-r4" x="526" y="318">Equal keys are the same key</text>
  <text class="dict-not-sub" x="30" y="372">Computing the location rather than searching for it is the idea worth holding: there is no scan to speed up, which is why size does not matter.</text>
</svg>
