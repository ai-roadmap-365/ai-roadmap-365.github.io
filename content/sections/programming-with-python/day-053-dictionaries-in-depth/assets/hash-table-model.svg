<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" font-family="system-ui, sans-serif">
  <title>How a dictionary finds a value: a key is hashed to a number, the number picks a bucket, and the bucket holds the value — average O(1) lookup</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Inside a dictionary: key to hash to bucket to value</text>

  <!-- Key -->
  <rect x="30" y="90" width="150" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="105" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Key</text>
  <text x="105" y="136" text-anchor="middle" font-size="14" fill="#1a202c">"cat"</text>

  <line x1="180" y1="120" x2="228" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="228,120 216,114 216,126" fill="#1d4ed8"/>

  <!-- Hash function -->
  <rect x="230" y="86" width="160" height="68" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="310" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">hash(key)</text>
  <text x="310" y="133" text-anchor="middle" font-size="14" fill="#1a202c">big number, then</text>
  <text x="310" y="149" text-anchor="middle" font-size="14" fill="#1a202c">% number_of_buckets</text>

  <line x1="390" y1="120" x2="438" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="438,120 426,114 426,126" fill="#1d4ed8"/>

  <!-- Index -->
  <rect x="440" y="90" width="130" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="505" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">bucket #2</text>
  <text x="505" y="136" text-anchor="middle" font-size="14" fill="#1a202c">jump straight there</text>

  <!-- Bucket table -->
  <text x="380" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The buckets (a plain array in memory)</text>

  <rect x="180" y="230" width="400" height="40" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="280" y1="230" x2="280" y2="270" stroke="#1a202c" stroke-width="1"/>
  <line x1="380" y1="230" x2="380" y2="270" stroke="#1a202c" stroke-width="1"/>
  <line x1="480" y1="230" x2="480" y2="270" stroke="#1a202c" stroke-width="1"/>
  <text x="230" y="255" text-anchor="middle" font-size="14" fill="#1a202c">#0</text>
  <text x="330" y="255" text-anchor="middle" font-size="14" fill="#1a202c">#1</text>
  <rect x="380" y="230" width="100" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="430" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">#2</text>
  <text x="530" y="255" text-anchor="middle" font-size="14" fill="#1a202c">#3</text>

  <line x1="430" y1="150" x2="430" y2="228" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="430,228 424,216 436,216" fill="#1d4ed8"/>

  <!-- Value -->
  <line x1="430" y1="270" x2="430" y2="308" stroke="#1a202c" stroke-width="2"/>
  <polygon points="430,308 424,296 436,296" fill="#1a202c"/>
  <rect x="330" y="310" width="200" height="56" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">stored pair</text>
  <text x="430" y="354" text-anchor="middle" font-size="14" fill="#1a202c">("cat", 4)  ->  value 4</text>

  <!-- O(1) note -->
  <rect x="600" y="230" width="140" height="136" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="670" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Average O(1)</text>
  <text x="670" y="280" text-anchor="middle" font-size="14" fill="#1a202c">One hash, one</text>
  <text x="670" y="298" text-anchor="middle" font-size="14" fill="#1a202c">jump — not a</text>
  <text x="670" y="316" text-anchor="middle" font-size="14" fill="#1a202c">scan of every</text>
  <text x="670" y="334" text-anchor="middle" font-size="14" fill="#1a202c">item. Same speed</text>
  <text x="670" y="352" text-anchor="middle" font-size="14" fill="#1a202c">at 10 or 10M keys.</text>

  <!-- Collision note -->
  <rect x="30" y="400" width="700" height="72" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">What breaks O(1): a collision</text>
  <text x="380" y="446" text-anchor="middle" font-size="14" fill="#1a202c">If two keys land in the same bucket, Python checks them one by one. Rare and cheap normally;</text>
  <text x="380" y="464" text-anchor="middle" font-size="14" fill="#1a202c">a bad hash that sends everything to one bucket degrades lookup toward O(n) — a slow scan.</text>
</svg>
