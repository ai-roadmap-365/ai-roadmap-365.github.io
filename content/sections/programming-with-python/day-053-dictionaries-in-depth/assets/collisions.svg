<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Collisions</title>
  <style>
    .collisions-bg   { fill: #f8fafc; }
    .collisions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collisions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collisions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collisions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collisions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collisions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collisions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collisions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collisions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collisions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collisions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collisions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collisions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collisions-stage { opacity: 1; }

    .collisions-s0 { animation-delay: 0.00s; }
    .collisions-e0 { animation-delay: 0.00s; }
    .collisions-s1 { animation-delay: 1.28s; }
    .collisions-e1 { animation-delay: 1.28s; }
    .collisions-s2 { animation-delay: 2.56s; }
    .collisions-e2 { animation-delay: 2.56s; }
    .collisions-s3 { animation-delay: 3.84s; }
    .collisions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collisions-conn  { animation: collisions-trace 6.4s ease-in-out infinite; }
      .collisions-stage { animation: collisions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collisions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collisions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collisions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collisions-stage { animation: collisions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collisions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collisions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collisions-bg" width="980" height="322"/>
  <text class="collisions-h1"  x="30" y="40">Collisions</text>
  <text class="collisions-sub" x="30" y="64">Four steps.</text>
  <g class="collisions-stage collisions-s0">
    <rect class="collisions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collisions-step" x="44" y="142">01</text>
    <text class="collisions-name" x="70" y="142">Two keys can hash to the same bucket</text>
    <text class="collisions-desc" x="44" y="166">Which is expected, not</text>
    <text class="collisions-desc" x="44" y="182">exceptional.</text>
  </g>
  <line class="collisions-line collisions-conn collisions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collisions-tip)"/>
  <g class="collisions-stage collisions-s1">
    <rect class="collisions-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collisions-step" x="280" y="142">02</text>
    <text class="collisions-name" x="306" y="142">So the table probes onward until it finds the right one</text>
    <text class="collisions-desc" x="280" y="166">Comparing keys as it goes.</text>
  </g>
  <line class="collisions-line collisions-conn collisions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collisions-tip)"/>
  <g class="collisions-stage collisions-s2">
    <rect class="collisions-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collisions-step" x="516" y="142">03</text>
    <text class="collisions-name" x="542" y="142">With a good hash this is one or two steps</text>
    <text class="collisions-desc" x="516" y="166">Which is why lookup counts as</text>
    <text class="collisions-desc" x="516" y="182">constant.</text>
  </g>
  <line class="collisions-line collisions-conn collisions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collisions-tip)"/>
  <g class="collisions-stage collisions-s3">
    <rect class="collisions-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collisions-step" x="752" y="142">04</text>
    <text class="collisions-name" x="778" y="142">With adversarial keys it degrades to a linear scan</text>
    <text class="collisions-desc" x="752" y="166">Which is a denial-of-service</text>
    <text class="collisions-desc" x="752" y="182">vector.</text>
  </g>
  <text class="collisions-sub" x="30" y="304">Python randomises string hashing per process precisely to prevent the adversarial case, which is why hash values differ between runs.</text>
</svg>
