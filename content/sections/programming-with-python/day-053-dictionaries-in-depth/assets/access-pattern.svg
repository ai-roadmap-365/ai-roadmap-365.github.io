<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what a missing key should do.">
  <title>Four ways to read a key</title>
  <style>
    .access-pattern-bg   { fill: #f8fafc; }
    .access-pattern-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .access-pattern-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .access-pattern-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .access-pattern-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .access-pattern-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .access-pattern-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .access-pattern-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .access-pattern-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .access-pattern-row { opacity: 1; }
    .access-pattern-r0 { animation-delay: 0.00s; }
    .access-pattern-r1 { animation-delay: 0.45s; }
    .access-pattern-r2 { animation-delay: 0.90s; }
    .access-pattern-r3 { animation-delay: 1.35s; }
    .access-pattern-r4 { animation-delay: 1.80s; }
    .access-pattern-row { animation: access-pattern-reveal 7.3s ease-in-out infinite; }
    @keyframes access-pattern-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="access-pattern-bg" width="980" height="390"/>
  <text class="access-pattern-h1"  x="30" y="40">Four ways to read a key</text>
  <text class="access-pattern-sub" x="30" y="64">By what a missing key should do.</text>
  <rect class="access-pattern-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="access-pattern-name" x="46" y="122">The access</text>
  <text class="access-pattern-desc" x="46" y="142">How you read it.</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r0" x="46" y="182">Square brackets</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r1" x="46" y="216">The get method</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r2" x="46" y="250">The get method with a default</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r3" x="46" y="284">setdefault</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r4" x="46" y="318">A defaultdict</text>
  <rect class="access-pattern-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="access-pattern-name" x="526" y="122">On a missing key</text>
  <text class="access-pattern-desc" x="526" y="142">What happens.</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r0" x="526" y="182">Raises, which is right when absence is a bug</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r1" x="526" y="216">Returns None quietly</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r2" x="526" y="250">Returns your default</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r3" x="526" y="284">Inserts the default and returns it</text>
  <text class="access-pattern-desc access-pattern-row access-pattern-r4" x="526" y="318">Creates the default on first access</text>
  <text class="access-pattern-sub" x="30" y="372">Choosing the one whose failure mode you want is the whole decision: silently returning None where the key should have existed hides a bug rather than handling it.</text>
</svg>
