<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why some objects cannot be keys</title>
  <style>
    .hashable-bg   { fill: #f8fafc; }
    .hashable-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hashable-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hashable-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hashable-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hashable-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hashable-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hashable-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hashable-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hashable-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hashable-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hashable-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hashable-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hashable-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hashable-stage { opacity: 1; }

    .hashable-s0 { animation-delay: 0.00s; }
    .hashable-e0 { animation-delay: 0.00s; }
    .hashable-s1 { animation-delay: 1.28s; }
    .hashable-e1 { animation-delay: 1.28s; }
    .hashable-s2 { animation-delay: 2.56s; }
    .hashable-e2 { animation-delay: 2.56s; }
    .hashable-s3 { animation-delay: 3.84s; }
    .hashable-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hashable-conn  { animation: hashable-trace 6.4s ease-in-out infinite; }
      .hashable-stage { animation: hashable-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hashable-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hashable-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hashable-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hashable-stage { animation: hashable-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hashable-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hashable-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hashable-bg" width="980" height="322"/>
  <text class="hashable-h1"  x="30" y="40">Why some objects cannot be keys</text>
  <text class="hashable-sub" x="30" y="64">Four steps.</text>
  <g class="hashable-stage hashable-s0">
    <rect class="hashable-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hashable-step" x="44" y="142">01</text>
    <text class="hashable-name" x="70" y="142">A key's hash decides where it is stored</text>
    <text class="hashable-desc" x="44" y="166">Computed once, at insertion.</text>
  </g>
  <line class="hashable-line hashable-conn hashable-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hashable-tip)"/>
  <g class="hashable-stage hashable-s1">
    <rect class="hashable-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hashable-step" x="280" y="142">02</text>
    <text class="hashable-name" x="306" y="142">Lookup recomputes the hash to find it again</text>
    <text class="hashable-desc" x="280" y="166">Which requires the same answer.</text>
  </g>
  <line class="hashable-line hashable-conn hashable-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hashable-tip)"/>
  <g class="hashable-stage hashable-s2">
    <rect class="hashable-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hashable-step" x="516" y="142">03</text>
    <text class="hashable-name" x="542" y="142">If the key were mutated, its hash would change</text>
    <text class="hashable-desc" x="516" y="166">And the entry would become</text>
    <text class="hashable-desc" x="516" y="182">unreachable.</text>
  </g>
  <line class="hashable-line hashable-conn hashable-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hashable-tip)"/>
  <g class="hashable-stage hashable-s3">
    <rect class="hashable-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hashable-step" x="752" y="142">04</text>
    <text class="hashable-name" x="778" y="142">So mutable types are rejected as keys</text>
    <text class="hashable-desc" x="752" y="166">Which is a guarantee, not an</text>
    <text class="hashable-desc" x="752" y="182">inconvenience.</text>
  </g>
  <text class="hashable-sub" x="30" y="304">The restriction protects you from an entry that exists and cannot be found, which is a far worse failure than the error you get instead.</text>
</svg>
