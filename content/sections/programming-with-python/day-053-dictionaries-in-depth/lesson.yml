id: D053
day: 53
slug: dictionaries-in-depth
title: 'Dictionaries in Depth'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to use Python dictionaries fluently and safely — mapping keys to values, choosing the right access pattern for present or missing keys, counting and grouping with the standard idioms, writing dict comprehensions and nested records — and explain the hash table underneath that makes lookup average O(1).'
objectives:
  - 'Create dictionaries and access values by key, choosing correctly between `d[key]`, `d.get(key, default)`, and `key in d` depending on whether a key might be missing'
  - 'Explain what "hashable" means and why immutable objects (strings, numbers, tuples) can be keys while lists, sets, and dicts cannot'
  - 'Add, update, and delete pairs, and iterate a dictionary with `.items()`, `.keys()`, and `.values()`, relying on the Python 3.7+ insertion-order guarantee'
  - 'Write the counting idiom with `.get()` and the grouping idiom with `setdefault`, and recognise when `collections.Counter` and `defaultdict` make them plainer'
  - 'Build a new dictionary with a dict comprehension and model structured data as nested dictionaries (records)'
  - 'Describe the hash-table mechanism — hash the key, pick a bucket, average O(1) lookup — and what a collision is and what degrades the speed toward O(n)'
  - 'Connect dictionaries to AI practice: config objects, JSON API payloads, feature dictionaries, token-to-id vocabularies, and word counts'
prerequisites:
  - 'Days 43-52 of this course: a working Python 3 install, variables and types, strings, numbers, input/output, reading errors, assembling a small program, and lists'
  - 'Comfort running a script from the terminal with `python3 file.py` and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
