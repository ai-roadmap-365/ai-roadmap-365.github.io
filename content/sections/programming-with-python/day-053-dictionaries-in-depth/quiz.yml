questions:
  - question: 'What is a Python dictionary, at its core?'
    options:
      - 'An ordered list of values you access by their integer position'
      - 'Key-value pairs, each unique key mapping to one value'
      - 'A sorted set of unique values with no associated data'
      - 'A text format for sending data over a network'
    answer_index: 1
    explanation: 'A dictionary is a mapping: a collection of key-value pairs in which each key is unique and maps to exactly one value, and you retrieve a value by giving its key. Lists are accessed by position; sets store values with no mapping; JSON is a text format a dict can convert to.'

  - question: 'Why can a list not be used as a dictionary key, while a tuple of numbers can?'
    options:
      - 'Lists are too large to fit in a bucket'
      - 'Lists are slower to compare than tuples'
      - 'Keys must be hashable; lists are mutable'
      - 'Python simply has not implemented list keys yet'
    answer_index: 2
    explanation: 'The hash table files each pair under a bucket computed from the key''s hash, so that hash must never change while the key is in the dictionary. Immutable objects (strings, numbers, tuples of those) have stable hashes and qualify; mutable ones (lists, sets, dicts) do not, and Python raises TypeError: unhashable type.'

  - question: 'Reading `settings["timeout"]` when the key is absent does what?'
    options:
      - 'Returns None silently'
      - 'Returns 0'
      - 'Creates the key with an empty value'
      - 'Raises KeyError'
    answer_index: 3
    explanation: 'The square-bracket read raises KeyError on a missing key. That is the right behaviour when the key must exist (a missing one is a real bug). When a key might legitimately be absent, use d.get(key, default) or check key in d first.'

  - question: 'Which line correctly counts words, adding 1 for each occurrence without crashing on a first-seen word?'
    options:
      - 'counts[word] = counts.get(word, 0) + 1'
      - 'counts[word] = counts[word] + 1'
      - 'counts[word] += counts[word]'
      - 'counts[word] = counts.get(word, 1) + 1'
    answer_index: 0
    explanation: 'counts.get(word, 0) returns the running count, or 0 the first time the word is seen, so adding 1 and storing it back never raises KeyError. counts[word] + 1 crashes on the first occurrence of each word because the key does not exist yet.'

  - question: 'What does `d.setdefault(k, [])` do, and why is it used for grouping?'
    options:
      - 'It deletes key k if its value is an empty list'
      - 'It returns d[k], inserting an empty list first if k is absent'
      - 'It sets every key in d to an empty list'
      - 'It checks whether k is in d and returns True or False'
    answer_index: 1
    explanation: 'setdefault returns the existing value for k, or installs the given default (here an empty list) and returns that if k is missing. Grouping then appends to whatever it returns, so each per-key list is created only once — the natural idiom for building lists per key.'

  - question: 'What does the Python 3.7 language guarantee about dictionary order mean?'
    options:
      - 'Keys are always returned sorted alphabetically'
      - 'Keys are returned in random order for security'
      - 'Iteration returns keys in insertion order'
      - 'The dictionary keeps values sorted by size'
    answer_index: 2
    explanation: 'Since Python 3.7, dictionaries preserve insertion order: iterating yields keys in the order they were added. This is not the same as sorted order — for alphabetical or numeric order you must call sorted() explicitly.'

  - question: 'Why is dictionary lookup described as "O(1) on average" rather than O(n)?'
    options:
      - 'Because dictionaries are always small'
      - 'Because the keys are kept sorted so a binary search is fast'
      - 'Because the operating system caches the whole dictionary'
      - 'Python hashes the key and jumps straight to its bucket'
    answer_index: 3
    explanation: 'A dictionary hashes the key to a number, reduces it to a bucket index, and goes directly to that bucket — work that does not grow with the number of keys, hence constant time on average. A list must scan its items to find a value, which is O(n).'

  - question: 'A dictionary whose values are themselves dictionaries — such as {"u1": {"name": "Ada"}} — is commonly used to model what, and why does it matter for AI work?'
    options:
      - 'Structured records, like JSON payloads and config objects'
      - 'A set of unique numbers, used for fast membership only'
      - 'A sorted index that must be searched by range'
      - 'A queue processed strictly front to back'
    answer_index: 0
    explanation: 'Nested dictionaries model records with named fields, which is exactly the shape of a JSON API response, a configuration object, and a feature dictionary. Since model I/O and config are dictionaries end to end, this pattern is the backbone of the data-wrangling and model-I/O work ahead.'
