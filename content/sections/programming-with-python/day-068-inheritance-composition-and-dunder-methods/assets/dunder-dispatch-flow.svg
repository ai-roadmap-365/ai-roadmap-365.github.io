<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" font-family="system-ui, sans-serif">
  <title>How the interpreter turns ordinary syntax into dunder method calls: len(menu) looks up __len__ on the type and calls it, menu[2] looks up __getitem__, a for loop over menu looks up __iter__ and then calls __next__ repeatedly, and a == b looks up __eq__ on the left operand, falling back to the reflected __eq__ on the right operand and finally to identity comparison when NotImplemented is returned</title>
  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Dunder dispatch: syntax &#8594; lookup on the type &#8594; call &#8594; result</text>

  <!-- column headers -->
  <text x="110" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">1. You write</text>
  <text x="330" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">2. Python looks up on type(x)</text>
  <text x="558" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">3. Python calls</text>
  <text x="782" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">4. You get back</text>

  <!-- row 1: len -->
  <rect x="24" y="84" width="172" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="110" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">len(menu)</text>
  <line x1="196" y1="110" x2="240" y2="110" stroke="#1a202c" stroke-width="2"/>
  <polygon points="240,110 227,104 227,116" fill="#1a202c"/>
  <rect x="240" y="84" width="180" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="116" text-anchor="middle" font-size="15" fill="#1a202c">Menu.__len__</text>
  <line x1="420" y1="110" x2="464" y2="110" stroke="#1a202c" stroke-width="2"/>
  <polygon points="464,110 451,104 451,116" fill="#1a202c"/>
  <rect x="464" y="84" width="188" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="558" y="116" text-anchor="middle" font-size="15" fill="#1a202c">menu.__len__()</text>
  <line x1="652" y1="110" x2="696" y2="110" stroke="#1a202c" stroke-width="2"/>
  <polygon points="696,110 683,104 683,116" fill="#1a202c"/>
  <rect x="696" y="84" width="180" height="52" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="786" y="116" text-anchor="middle" font-size="15" fill="#1a202c">an int: 3</text>

  <!-- row 2: getitem -->
  <rect x="24" y="152" width="172" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="110" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">menu[2]</text>
  <line x1="196" y1="178" x2="240" y2="178" stroke="#1a202c" stroke-width="2"/>
  <polygon points="240,178 227,172 227,184" fill="#1a202c"/>
  <rect x="240" y="152" width="180" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="184" text-anchor="middle" font-size="15" fill="#1a202c">Menu.__getitem__</text>
  <line x1="420" y1="178" x2="464" y2="178" stroke="#1a202c" stroke-width="2"/>
  <polygon points="464,178 451,172 451,184" fill="#1a202c"/>
  <rect x="464" y="152" width="188" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="558" y="184" text-anchor="middle" font-size="15" fill="#1a202c">menu.__getitem__(2)</text>
  <line x1="652" y1="178" x2="696" y2="178" stroke="#1a202c" stroke-width="2"/>
  <polygon points="696,178 683,172 683,184" fill="#1a202c"/>
  <rect x="696" y="152" width="180" height="52" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="786" y="184" text-anchor="middle" font-size="15" fill="#1a202c">the third Dish</text>

  <!-- row 3: for loop -->
  <rect x="24" y="220" width="172" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="110" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">for d in menu:</text>
  <text x="110" y="272" text-anchor="middle" font-size="14" fill="#1a202c">(one item at a time)</text>
  <line x1="196" y1="255" x2="240" y2="255" stroke="#1a202c" stroke-width="2"/>
  <polygon points="240,255 227,249 227,261" fill="#1a202c"/>
  <rect x="240" y="220" width="180" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="248" text-anchor="middle" font-size="15" fill="#1a202c">Menu.__iter__</text>
  <text x="330" y="272" text-anchor="middle" font-size="14" fill="#1a202c">then __next__ on the</text>
  <line x1="420" y1="255" x2="464" y2="255" stroke="#1a202c" stroke-width="2"/>
  <polygon points="464,255 451,249 451,261" fill="#1a202c"/>
  <rect x="464" y="220" width="188" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="558" y="248" text-anchor="middle" font-size="15" fill="#1a202c">it = menu.__iter__()</text>
  <text x="558" y="272" text-anchor="middle" font-size="15" fill="#1a202c">it.__next__() ...</text>
  <line x1="652" y1="255" x2="696" y2="255" stroke="#1a202c" stroke-width="2"/>
  <polygon points="696,255 683,249 683,261" fill="#1a202c"/>
  <rect x="696" y="220" width="180" height="70" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="786" y="248" text-anchor="middle" font-size="15" fill="#1a202c">each Dish, then</text>
  <text x="786" y="272" text-anchor="middle" font-size="15" fill="#1a202c">StopIteration ends it</text>

  <!-- row 4: eq with fallback -->
  <rect x="24" y="322" width="172" height="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="110" y="354" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">a == b</text>
  <line x1="196" y1="348" x2="240" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="240,348 227,342 227,354" fill="#1a202c"/>
  <rect x="240" y="322" width="180" height="52" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="330" y="354" text-anchor="middle" font-size="15" fill="#1a202c">type(a).__eq__</text>
  <line x1="420" y1="348" x2="464" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="464,348 451,342 451,354" fill="#1a202c"/>
  <rect x="464" y="322" width="188" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="558" y="354" text-anchor="middle" font-size="15" fill="#1a202c">a.__eq__(b)</text>
  <line x1="652" y1="348" x2="696" y2="348" stroke="#1a202c" stroke-width="2"/>
  <polygon points="696,348 683,342 683,354" fill="#1a202c"/>
  <rect x="696" y="322" width="180" height="52" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="786" y="354" text-anchor="middle" font-size="15" fill="#1a202c">True / False</text>

  <!-- NotImplemented fallback path -->
  <rect x="24" y="410" width="852" height="262" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="450" y="438" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">The NotImplemented fallback path for a == b</text>

  <rect x="52" y="458" width="230" height="58" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="167" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">a.__eq__(b)</text>
  <text x="167" y="504" text-anchor="middle" font-size="14" fill="#1a202c">returns NotImplemented</text>
  <line x1="282" y1="487" x2="330" y2="487" stroke="#1a202c" stroke-width="2"/>
  <polygon points="330,487 317,481 317,493" fill="#1a202c"/>

  <rect x="330" y="458" width="250" height="58" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="455" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Python tries the reflection</text>
  <text x="455" y="504" text-anchor="middle" font-size="15" fill="#1a202c">b.__eq__(a)</text>
  <line x1="580" y1="487" x2="628" y2="487" stroke="#1a202c" stroke-width="2"/>
  <polygon points="628,487 615,481 615,493" fill="#1a202c"/>

  <rect x="628" y="458" width="222" height="58" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="739" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">it answers</text>
  <text x="739" y="504" text-anchor="middle" font-size="14" fill="#1a202c">that answer is the result</text>

  <line x1="739" y1="516" x2="739" y2="556" stroke="#1a202c" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="739,556 732,542 746,542" fill="#1a202c"/>
  <text x="739" y="546" text-anchor="start" font-size="14" fill="#1a202c"> </text>

  <rect x="330" y="556" width="520" height="58" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="590" y="580" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">both returned NotImplemented?</text>
  <text x="590" y="602" text-anchor="middle" font-size="14" fill="#1a202c">Python falls back to identity: a is b</text>

  <text x="450" y="646" text-anchor="middle" font-size="14" fill="#1a202c">Returning NotImplemented is how you say "I do not know how to compare with that type" —</text>
  <text x="450" y="666" text-anchor="middle" font-size="14" fill="#1a202c">never return False for an unknown type, or you silently block the other object's answer.</text>
</svg>
