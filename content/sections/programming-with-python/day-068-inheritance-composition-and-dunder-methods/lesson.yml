id: D068
day: 68
slug: inheritance-composition-and-dunder-methods
title: 'Inheritance, Composition, and Dunder Methods'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will be able to choose deliberately between inheritance and composition instead of reaching for whichever comes first: state the is-a and has-a tests, predict where a missing super().__init__() will actually blow up, derive a diamond hierarchy''s method resolution order by hand from the two C3 rules and check it against __mro__, and then implement enough of Python''s data model — __len__, __getitem__, __iter__, __contains__, __eq__ with __hash__, __lt__, and __enter__/__exit__ — that len(), indexing, for, in, sorted(), max(), set() and with all work on a class you wrote, with none of those builtins modified.'
objectives:
  - 'State the is-a and has-a tests for choosing between inheritance and composition, and name the three concrete costs of choosing inheritance wrongly: the fragile base class problem, tight coupling, and deep hierarchies'
  - 'Explain that a subclass __init__ replaces rather than extends the parent''s, and predict that a missing super().__init__() surfaces as an AttributeError in a later method rather than in the constructor'
  - 'Derive the method resolution order of a four-class diamond from C3 linearization''s local precedence and monotonicity rules, verify it against Class.__mro__, and show that super() reaches the next class in the instance''s MRO rather than the parent'
  - 'Model one domain both ways and identify a concrete base-class change that breaks the inherited version while leaving the composed version untouched'
  - 'Define an abstract base class with abc.ABC and @abstractmethod so an incomplete subclass is refused at construction, and contrast that enforcement with duck typing and typing.Protocol''s structural checks'
  - 'Map ordinary Python syntax onto the dunder methods it calls — len(x) to __len__, x[k] to __getitem__, for i in x to __iter__, k in x to __contains__, x == y to __eq__, with x to __enter__/__exit__'
  - 'Implement __eq__ correctly, returning NotImplemented for unknown types rather than False, and restore the __hash__ that defining __eq__ sets to None'
  - 'Build a container class supporting length, indexing, iteration, membership, equality and ordering, and prove that unmodified builtins such as sorted() and max() operate on it'
  - 'Write a context manager whose __exit__ guarantees cleanup even when the block raises, and explain why returning True from it would silently swallow the exception'
prerequisites:
  - 'Day 67: classes and objects — __init__, self, instance and class attributes, methods, @property, @classmethod/@staticmethod, and __repr__/__str__'
  - 'Day 66: exceptions and error-handling strategy, including raising your own and Python''s exception hierarchy'
  - 'Day 64: reading and writing files, and the with statement whose protocol this lesson implements from scratch'
  - 'Days 57-63: functions, scope, modules and imports, the standard library, and designing a small program well'
  - 'Comfort running a script from the terminal with python3'
reading_time_minutes: 40
