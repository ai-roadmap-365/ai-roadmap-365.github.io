visuals:
  - id: inheritance-vs-composition
    file: assets/inheritance-vs-composition.svg
    type: diagram
    title: 'One domain, two structures: inheritance and composition side by side'
    alt: 'Diagram: the same kitchen-appliance domain modelled two ways side by side — on the left an inheritance hierarchy from Appliance to HeatingAppliance to Oven and Toaster with the method resolution order shown, on the right a composition object graph where Oven and Toaster hold HeatingElement and Timer objects and delegate to them'
    description: 'The architecture diagram, showing both designs of one domain at once so they can be compared structurally rather than described in prose. On the left, an inheritance hierarchy: Appliance at the root, HeatingAppliance beneath it, and Oven and Toaster as its subclasses, with an arrow tracing the method resolution order Oven, HeatingAppliance, Appliance, object. Behaviour arrives implicitly by walking that chain, and a change at the root reaches every class below it. On the right, the same domain as an object graph: Oven holds its own HeatingElement and Timer, Toaster holds a HeatingElement, and each forwards work to them explicitly. Nothing is inherited and the wiring is visible. Placing them side by side makes the trade concrete — the left costs no forwarding code but fixes the relationship at class-definition time, while the right costs explicit delegation but lets any collaborator be swapped at runtime.'
  - id: dunder-dispatch-flow
    file: assets/dunder-dispatch-flow.svg
    type: flowchart
    title: 'How ordinary syntax becomes a dunder method call'
    alt: 'Flowchart: how the interpreter dispatches ordinary syntax to dunder methods — len of a menu looks up and calls __len__, indexing calls __getitem__, a for loop calls __iter__ then __next__, and equality calls __eq__ on the left operand with a NotImplemented fallback to the reflected call on the right operand and finally to identity comparison'
    description: 'The flow diagram tracing four dispatch paths from written syntax to the method the interpreter actually calls, which is the mechanism behind every protocol in the lesson. Calling len on a menu looks up __len__ on the type and calls it. Subscripting with square brackets looks up __getitem__, passing whatever is inside them, including a slice object. A for loop looks up __iter__ once and then calls __next__ on the result repeatedly until StopIteration. Equality is the most involved path and is drawn in full: __eq__ is tried on the left operand first, and if it returns NotImplemented the reflected __eq__ on the right operand gets its chance, with identity comparison as the final fallback when both decline. Showing that fallback chain is the point — it is why returning NotImplemented rather than False from __eq__ matters, and why the lookup happens on the type rather than on the instance.'
