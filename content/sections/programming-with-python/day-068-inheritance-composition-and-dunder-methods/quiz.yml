questions:
  - question: 'A subclass defines its own `__init__` and never calls `super().__init__(...)`. What actually happens?'
    options:
      - 'The object is built incompletely; it fails later as AttributeError'
      - 'The parent''s `__init__` still runs automatically, just after the child''s'
      - 'The class definition is rejected, because Python requires the call'
      - 'Construction raises `TypeError` immediately, naming the parent'
    answer_index: 0
    explanation: 'Defining `__init__` in a subclass REPLACES the parent''s; nothing calls it for you. Construction therefore succeeds and hands you an object missing whatever the parent would have set. The error waits until some later method reads one of those attributes, which is why the traceback blames `describe` rather than the constructor that actually failed you. That displacement is what makes this the most common inheritance bug.'

  - question: 'For `class ToasterOven(Heater, Timer)`, where `Heater` and `Timer` both inherit from `Appliance`, what is the method resolution order?'
    options:
      - 'ToasterOven, Heater, Appliance, Timer, Appliance, object'
      - 'ToasterOven, Heater, Timer, Appliance, object'
      - 'ToasterOven, Timer, Heater, Appliance, object'
      - 'ToasterOven, Appliance, Heater, Timer, object'
    answer_index: 1
    explanation: 'C3 linearization guarantees two things you can re-derive by hand. Local precedence puts a class before its parents, and monotonicity preserves the order the bases were listed in — so `Heater` comes before `Timer`. `Appliance` cannot appear after `Heater` even though it is Heater''s parent, because `Timer` also inherits from it and must precede its own parent. Hence Heater, Timer, then Appliance. Note that `Appliance` appears exactly once, which is precisely what stops it being initialised twice.'

  - question: 'Inside `Heater.power_on`, the call `super().power_on()` reaches `Timer.power_on` — even though `Heater` does not inherit from `Timer`. Why?'
    options:
      - 'Because `Timer` was defined after `Heater` in the source file'
      - 'Because `super()` searches every class in the program until it finds a match'
      - 'Because `super()` means "the next class in THIS instance''s MRO", not "my parent class"'
      - 'Because Python silently added `Timer` to Heater''s bases when the diamond was built'
    answer_index: 2
    explanation: '`super()` is bound to the instance, not to the class it is written in. It walks to whatever comes next in that instance''s MRO, which for a `ToasterOven` instance is `Timer`. `Heater.__bases__` is still just `(Appliance,)` — nothing was added. This cooperative chaining is what makes multiple inheritance work, and it is also exactly why it is hard to read: you cannot tell where a `super()` call lands by looking at one class in isolation.'

  - question: 'You add `__eq__` to a class and later get `TypeError: unhashable type`. What happened, and what is the fix?'
    options:
      - 'Equality is only allowed on immutable classes; remove `__eq__`'
      - '`__eq__` must return `NotImplemented` for every type, which restores hashing'
      - 'The class needs `__lt__` before `__eq__` will work in a set'
      - 'Defining `__eq__` sets `__hash__` to None; define it too'
    answer_index: 3
    explanation: 'Objects that compare equal must hash equal, and Python will not guess which fields you meant. Rather than let you build a subtly broken set, it sets `__hash__` to `None` the moment you define `__eq__`, making instances unhashable. The fix is to hash a tuple of the same identifying fields — `hash((self.name, self.minutes))`. Leaving it unhashable is also legitimate for genuinely mutable objects, but it should be a decision rather than an accident.'

  - question: 'Why should `__eq__` return `NotImplemented` rather than `False` for a type it does not recognise?'
    options:
      - '`NotImplemented` lets Python try the reflected `__eq__`'
      - 'Because `False` would raise a `TypeError` in Python 3'
      - 'It makes the comparison faster by skipping the reflected lookup'
      - 'There is no difference; `NotImplemented` is just a stylistic convention'
    answer_index: 0
    explanation: 'Returning `False` is a confident, final answer. Returning `NotImplemented` says "I do not know — ask the other side," and Python then tries `other.__eq__(self)`. In the lesson''s worked example, `Grams` bows out, `Ounces` knows the conversion, and the pair produces a correct `True` that neither class could have produced alone. Only when both operands decline does Python fall back to identity comparison and yield `False`.'

  - question: 'Which single statement best captures why "prefer composition over inheritance" is the default advice?'
    options:
      - 'Inheritance is slower at runtime because attribute lookup walks the MRO'
      - 'A subclass depends on parent internals; composition on an interface'
      - 'Inheritance is deprecated in modern Python and should be avoided entirely'
      - 'Composition uses less memory than inheritance for the same behaviour'
    answer_index: 1
    explanation: 'This is the fragile base class problem, and it is about coupling rather than performance. The MRO walk does cost a little, but that is almost never a bottleneck and is a bad reason to change a design; memory is not the issue either; and inheritance is certainly not deprecated — frameworks require it, and small stable hierarchies like Python''s own exception tree are a good use of it. The real cost is that a subclass cannot be understood, tested, or reused without its entire ancestry.'

  - question: 'What is the practical difference between `abc.ABC` and `typing.Protocol`?'
    options:
      - '`abc.ABC` works at runtime while `typing.Protocol` exists only in documentation and is never checkable'
      - 'They are interchangeable; `typing.Protocol` is simply the newer spelling of `abc.ABC`'
      - 'An ABC needs inheritance; a Protocol matches structurally'
      - 'A Protocol enforces its methods at instantiation, while an ABC is only checked by external type checkers'
    answer_index: 2
    explanation: 'An ABC is nominal typing: you must be in the family, and Python refuses to construct an incomplete member. A Protocol is structural typing — duck typing written down — and a class satisfies it purely by having the right methods, which is why you can apply one to classes other people wrote. Marking a Protocol `runtime_checkable` does make `isinstance` work on it, so it is not documentation-only. Choose an ABC when you own the hierarchy and want the enforcement; choose a Protocol when you are consuming code you cannot change.'

  - question: 'A `with` block''s body raises an exception. What does the object''s `__exit__` do, and what does its return value control?'
    options:
      - '`__exit__` is skipped when the body raises; only a `finally` clause would run'
      - '`__exit__` runs and always suppresses the exception, which is why cleanup is guaranteed'
      - '`__exit__` runs only if `__enter__` returned a non-None value'
      - '`__exit__` runs either way; a truthy return suppresses'
    answer_index: 3
    explanation: 'The guarantee is that `__exit__` runs on the way out of the block whether it completed or blew up — that is the whole reason the protocol exists, and it is what made `with open(...)` trustworthy on Day 64. Its three parameters are all `None` on a clean exit. The return value is a separate decision: `True` tells Python the exception has been handled and it vanishes, which is how errors silently disappear, so return `False` unless you have a very good reason not to.'
