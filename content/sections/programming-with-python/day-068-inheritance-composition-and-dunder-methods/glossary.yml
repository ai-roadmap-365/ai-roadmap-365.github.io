terms:
  - term: inheritance
    definition: 'A mechanism for one class to acquire the attributes and methods of another and to override or extend them. Written by naming the parent in parentheses. It expresses an "is-a" relationship, and its real purpose is substitutability — a subclass should be usable anywhere the parent is — with code reuse as a side effect.'
  - term: base class
    definition: 'The class being inherited from, also called the superclass or parent. Every Python class ultimately has `object` as a base, which is where the default `__repr__`, `__eq__`, and `__hash__` come from.'
  - term: composition
    definition: 'Building a class out of other objects held as attributes rather than inheriting from them. It expresses a "has-a" relationship. An Oven does not need to BE a Timer in order to hold one.'
  - term: delegation
    definition: 'Passing a call through to a stored collaborator object — the forwarding method that makes composition work. More typing than inheritance, and far more visible, because the wiring is written out rather than found by walking a hierarchy.'
  - term: method resolution order (MRO)
    definition: 'The fixed, ordered list of classes Python searches when looking up an attribute on an instance. Readable as `SomeClass.__mro__`. Attribute lookup checks the instance first, then walks this list until it finds the name.'
  - term: C3 linearization
    definition: 'The algorithm Python has used since version 2.3 to compute the MRO. It guarantees local precedence — a class always precedes its parents — and monotonicity — the order bases are listed in is preserved. If no consistent order exists it raises TypeError at class-definition time rather than guessing.'
  - term: diamond problem
    definition: 'The ambiguity that arises when a class inherits from two classes that share a common ancestor: in what order should the interpreter search? C3 answers it deterministically and lists the shared ancestor exactly once, so it is never initialised or executed twice.'
  - term: super()
    definition: 'A call that dispatches to the NEXT class in this instance''s MRO — which under multiple inheritance is often not the parent you would guess, and may be a class the current one does not inherit from at all. Conventionally called first inside a subclass ``__init__``.'
  - term: overriding
    definition: 'Defining a method in a subclass that replaces the parent''s version entirely. The parent''s implementation does not run.'
  - term: extending
    definition: 'Overriding a method but still calling the original through `super()`, so both run. The distinction from plain overriding is the difference between replacing a behaviour and adding to it.'
  - term: fragile base class problem
    definition: 'The failure mode where a seemingly safe change to a base class breaks subclasses written by people who never read it, because subclasses depend on the parent''s internal behaviour rather than only its public surface. Named as class libraries grew in the 1990s, and the main reason composition is the default advice.'
  - term: dunder method
    definition: 'A method whose name begins and ends with double underscores, such as `__len__` or `__eq__`, which the interpreter calls on your behalf when you use ordinary syntax. Short for "double underscore". They are the language''s public protocol, not private helpers — though inventing new dunder names of your own is discouraged, since those are reserved.'
  - term: data model
    definition: 'Python''s complete system of special method names — the set of hooks that connects syntax to behaviour, so that `len(x)` becomes `type(x).__len__(x)` and `x[k]` becomes `type(x).__getitem__(x, k)`. Implementing them is how a class you wrote joins the language rather than sitting beside it.'
  - term: protocol
    definition: 'An informal interface defined by which methods an object has rather than by what it inherits from. Implementing a protocol is what lets builtins and library code written years earlier — `sorted`, `max`, a DataLoader — operate on a class you wrote this afternoon.'
  - term: duck typing
    definition: 'Treating an object as usable because it has the required methods, not because of its ancestry: if it walks like a duck, it is treated like one. It is why a function that only calls `.read()` should accept a file, a socket wrapper, or a test double equally.'
  - term: abstract base class
    definition: 'A class built with `abc.ABC` that cannot be instantiated and that names methods subclasses must implement, using the `@abstractmethod` decorator. An incomplete subclass is refused at construction, naming the missing method, rather than failing mysteriously much later.'
  - term: structural typing
    definition: 'Checking that an object has the right shape rather than the right ancestry — duck typing written down. Provided by `typing.Protocol` since Python 3.8, and useful precisely when you consume objects other people wrote and cannot demand they inherit from you.'
  - term: mixin
    definition: 'A small class providing one orthogonal capability, never instantiated on its own, added to unrelated classes through multiple inheritance. If it starts holding state or growing methods, it wants to be a collaborator object instead.'
  - term: NotImplemented
    definition: 'A special value RETURNED from a comparison dunder to mean "I do not know how to compare against this type — ask the other operand." Distinct from `NotImplementedError`, which is an exception you RAISE from an unfinished method. Returning `False` instead is how comparisons become silently wrong.'
  - term: hashable
    definition: 'An object usable as a dict key or set element, because it has a `__hash__` returning a stable integer. Defining `__eq__` sets `__hash__` to `None`, so the two must be defined together — and only over fields that do not change, since a mutated object is lost in its set.'
  - term: context manager
    definition: 'An object implementing `__enter__` and `__exit__`, usable with the `with` statement. `__exit__` runs on the way out of the block whether it succeeded or raised, receiving the exception type, value, and traceback; returning a truthy value from it suppresses the exception.'
  - term: template method
    definition: 'The shape where a concrete method in a base class calls an abstract one that subclasses fill in — the framework calls your code rather than the other way round. It is exactly how a PyTorch `nn.Module` calls the `forward` you wrote.'
