questions:
  - question: 'You run `s = "river"; s.upper()` and then print `s`. What does it show, and why?'
    options:
      - '"RIVER", because upper() changes the string in place'
      - 'An error, because strings have no upper() method'
      - '"river", because upper() returns a new string and the original is unchanged'
      - '"River", because upper() only capitalizes the first letter'
    answer_index: 2
    explanation: 'Strings are immutable, so `upper()` returns a brand-new upper-cased string and leaves `s` untouched. To keep the result you must assign it: `s = s.upper()`.'

  - question: 'What is `len("café")` in Python 3, and what does the number count?'
    options:
      - '5, because it counts the bytes needed to store the text'
      - 'It depends on the operating system'
      - '3, because accented letters are not counted'
      - '4, because it counts characters (code points), not bytes'
    answer_index: 3
    explanation: 'A Python 3 `str` is a sequence of Unicode characters, so `len` counts characters: "café" has 4. Its UTF-8 encoding happens to take 5 bytes because `é` needs two, but `len` on the string counts characters.'

  - question: 'Given `s = "PYTHON"`, what is `s[1:4]`?'
    options:
      - '"YTH"'
      - '"PYT"'
      - '"YTHO"'
      - '"YTHON"'
    answer_index: 0
    explanation: 'A slice `s[start:stop]` includes `start` but excludes `stop`, so `s[1:4]` takes indices 1, 2, and 3 — "YTH" — which is `4 - 1 = 3` characters long.'

  - question: 'Which formatting style is the recommended default for new Python code?'
    options:
      - 'The `%` operator, e.g. `"Total: %.2f" % price`'
      - 'The f-string, e.g. `f"Total: {price:.2f}"`'
      - 'Manual concatenation with `+` and `str()`'
      - 'The `%` operator for numbers and `+` for text'
    answer_index: 1
    explanation: 'Introduced in Python 3.6 (PEP 498), f-strings are the modern default: they embed the expression inline, read clearly, and are fast. `%` and `str.format()` still work but are preferred mainly for older code.'

  - question: 'Which operation turns a `str` into `bytes`, and what must you always supply?'
    options:
      - '`decode`, always supplying a file path'
      - '`str()`, which needs nothing'
      - '`encode`, always supplying the encoding'
      - '`bytes()` with no arguments'
    answer_index: 2
    explanation: 'Text is turned into bytes with `encode` (`s.encode("utf-8")`) and bytes back into text with `decode`. You should always name the encoding explicitly rather than rely on the platform default, which is a common cause of `UnicodeDecodeError`.'

  - question: 'What does `"-".join(["a", "b", "c"])` produce?'
    options:
      - '["a", "-", "b", "-", "c"]'
      - '"abc"'
      - '"-a-b-c-"'
      - '"a-b-c"'
    answer_index: 3
    explanation: '`join` is a method on the separator: it glues the list elements into one string with the separator placed *between* them, giving "a-b-c". It is the inverse of `split`.'

  - question: 'What is the value of `"river"[::-1]`?'
    options:
      - '"revir"'
      - '"rev ir"'
      - '"river"'
      - '"revir" reversed to "rivre"'
    answer_index: 0
    explanation: 'A slice with a step of `-1`, `s[::-1]`, walks the string backwards and returns a new reversed string, so "river" becomes "revir".'

  - question: 'For which task is a plain string method the better choice over a regular expression?'
    options:
      - 'Matching any run of one or more digits anywhere in the text'
      - 'Checking whether a filename ends with the fixed suffix ".txt"'
      - 'Extracting every email-shaped token from a document'
      - 'Matching whitespace of any kind, including tabs and newlines'
    answer_index: 1
    explanation: 'A fixed-substring test like "ends with .txt" is exactly what `str.endswith(".txt")` is for — simple and readable. The other three involve variable patterns, which are where regular expressions (Day 38) earn their added complexity.'
