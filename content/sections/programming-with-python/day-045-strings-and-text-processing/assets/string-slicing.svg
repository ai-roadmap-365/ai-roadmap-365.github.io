<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" font-family="system-ui, sans-serif">
  <title>How indexing and slicing map onto the characters of the string "PYTHON"</title>
  <rect x="0" y="0" width="680" height="440" fill="#f8fafc"/>
  <text x="340" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Indexing and slicing the string "PYTHON"</text>

  <!-- Positive index row -->
  <text x="40" y="112" text-anchor="middle" font-size="14" fill="#1a202c">index</text>
  <text x="120" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">0</text>
  <text x="200" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1</text>
  <text x="280" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2</text>
  <text x="360" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3</text>
  <text x="440" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4</text>
  <text x="520" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5</text>

  <!-- Highlight behind the slice s[1:4] -->
  <rect x="162" y="128" width="240" height="84" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" rx="8"/>

  <!-- Character boxes -->
  <rect x="82"  y="130" width="76" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <rect x="162" y="130" width="76" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <rect x="242" y="130" width="76" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <rect x="322" y="130" width="76" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <rect x="402" y="130" width="76" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <rect x="482" y="130" width="76" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>

  <text x="120" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">P</text>
  <text x="200" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">Y</text>
  <text x="280" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">T</text>
  <text x="360" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">H</text>
  <text x="440" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">O</text>
  <text x="520" y="184" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">N</text>

  <!-- Negative index row -->
  <text x="40" y="244" text-anchor="middle" font-size="14" fill="#1a202c">from end</text>
  <text x="120" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-6</text>
  <text x="200" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-5</text>
  <text x="280" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-4</text>
  <text x="360" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-3</text>
  <text x="440" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-2</text>
  <text x="520" y="244" text-anchor="middle" font-size="15" fill="#1d4ed8">-1</text>

  <!-- Slice annotation -->
  <text x="282" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">s[1:4]  →  "YTH"</text>
  <text x="282" y="308" text-anchor="middle" font-size="14" fill="#1a202c">start 1 is included, stop 4 is not (4 − 1 = 3 characters)</text>

  <!-- Examples box -->
  <rect x="60" y="336" width="560" height="84" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="80" y="362" font-size="15" fill="#1a202c">s[0] = "P"  (first)      s[-1] = "N"  (last)      s[:3] = "PYT"</text>
  <text x="80" y="386" font-size="15" fill="#1a202c">s[3:] = "HON"            s[::-1] = "NOHTYP"  (reversed)</text>
  <text x="80" y="410" font-size="14" fill="#1a202c">A slice always returns a NEW string; the original s is never changed.</text>
</svg>
