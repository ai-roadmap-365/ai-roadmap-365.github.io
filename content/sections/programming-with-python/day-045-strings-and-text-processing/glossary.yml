terms:
  - term: string
    definition: 'A piece of text in Python: an ordered, immutable sequence of Unicode characters, written between quotes and represented by the built-in type str.'
  - term: immutable
    definition: 'Unable to be changed in place. A string never changes; every operation that seems to modify it actually returns a new string and leaves the original untouched.'
  - term: index
    definition: 'The position of a single character in a string, counted from 0 at the left; negative indices count from the right, so s[-1] is the last character.'
  - term: slice
    definition: 'A run of characters copied out of a string with s[start:stop], returning a new string that includes start but excludes stop (stop − start characters).'
  - term: method
    definition: 'A named action called on a string with a dot, such as s.lower() or s.split(); because strings are immutable, transforming methods return a new string.'
  - term: f-string
    definition: 'A string literal prefixed with f whose {...} braces embed expressions evaluated at run time, the modern default for formatting (added in Python 3.6 via PEP 498).'
  - term: format spec
    definition: 'The part of an f-string field after the colon that controls display, such as :.2f for two decimal places or :>10 to right-align in a 10-character field.'
  - term: split
    definition: 'A string method that breaks text into a list of pieces on a separator; with no argument it splits on any run of whitespace.'
  - term: join
    definition: 'A string method called on a separator that glues a list of strings into one, placing the separator between the pieces; the inverse of split.'
  - term: encode
    definition: 'The operation that turns a str into bytes using a named encoding such as UTF-8, done at the boundary where text is written to a file or network.'
  - term: decode
    definition: 'The operation that turns bytes back into a str using a named encoding; the reverse of encode.'
  - term: escape sequence
    definition: 'A backslash followed by a code that represents a single character hard to type directly, such as \n for a newline or \t for a tab.'
  - term: raw string
    definition: 'A string literal prefixed with r in which backslashes are treated literally rather than as escapes, useful for file paths and regular-expression patterns.'
