title: 'Strings and Text Processing'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will handle text in Python with confidence — creating, slicing, cleaning, and formatting strings — and understand why strings are immutable Unicode sequences and how they become the bytes that travel to files and services.'
objectives:
  - 'Explain what a string is in Python — an immutable, ordered sequence of Unicode characters — and connect its immutability to what you learned about tuples on Day 44'
  - 'Create strings with single, double, and triple quotes, use escape sequences, and know when a raw string is the right choice'
  - 'Index and slice strings with positive and negative positions, including reversal with s[::-1], and state why the stop index is excluded'
  - 'Apply the essential string methods — lower, upper, strip, split, join, replace, find, startswith, count — and remember that each returns a new string'
  - 'Format text three ways (%, str.format, f-strings), choose f-strings as the modern default, and use format specs for alignment and precision'
  - 'Convert between text and bytes with encode and decode, always naming the encoding, and connect this to the data representation you met on Day 5'
  - 'Decide when a plain string method is enough and when a task calls for a regular expression (Day 38)'
prerequisites:
  - 'Day 44 (Variables and Types) — this lesson builds on Python types and the idea of immutability'
  - 'Day 5 (Text, Images, and Sound as Data) — helpful background for the Unicode and encoding section'
  - 'Python 3 installed and the ability to run a script from the terminal'
