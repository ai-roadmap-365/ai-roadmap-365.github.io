visuals:
  - id: string-slicing
    file: assets/string-slicing.svg
    type: diagram
    title: 'Indexing and slicing a Python string'
    alt: 'Diagram: indexing and slicing a Python string with positive and negative positions and one slice highlighted'
    description: 'The word PYTHON laid out as six character boxes, with positive indices 0 to 5 above and negative indices -6 to -1 below, the slice s[1:4] highlighted to show it yields "YTH", and worked examples of s[0], s[-1], s[:3], s[3:], and s[::-1].'
  - id: fstring-anatomy
    file: assets/fstring-anatomy.svg
    type: flowchart
    title: 'The anatomy of an f-string'
    alt: 'Flowchart: an f-string broken into literal text, an embedded expression, and a format spec producing formatted output'
    description: 'The f-string f"Total: {price * qty:.2f}" broken into its parts — literal text, the embedded expression price * qty, and the format spec .2f — flowing to the formatted output "Total: 25.00" for price 5.0 and quantity 5.'
