visuals:
  - id: string-slicing
    file: assets/string-slicing.svg
    type: diagram
    title: 'Indexing and slicing a Python string'
    alt: 'Diagram: indexing and slicing a Python string with positive and negative positions and one slice highlighted'
    description: 'The word PYTHON laid out as six character boxes, with positive indices 0 to 5 above and negative indices -6 to -1 below, the slice s[1:4] highlighted to show it yields "YTH", and worked examples of s[0], s[-1], s[:3], s[3:], and s[::-1].'
  - id: fstring-anatomy
    file: assets/fstring-anatomy.svg
    type: flowchart
    title: 'The anatomy of an f-string'
    alt: 'Flowchart: an f-string broken into literal text, an embedded expression, and a format spec producing formatted output'
    description: 'The f-string f"Total: {price * qty:.2f}" broken into its parts — literal text, the embedded expression price * qty, and the format spec .2f — flowing to the formatted output "Total: 25.00" for price 5.0 and quantity 5.'
  - id: str-versus-bytes
    file: assets/str-versus-bytes.svg
    type: diagram
    title: 'Text and bytes are different types'
    alt: 'Diagram: str compared with bytes in Python'
    description: 'A two-column comparison of the str and bytes types in Python, covering what each holds, how they convert, and what len reports for each.'
  - id: half-open-slicing
    file: assets/half-open-slicing.svg
    type: diagram
    title: 'Why a slice excludes its end'
    alt: 'Diagram: why Python slices are half-open'
    description: 'A four-stage explanation of half-open slice semantics showing that excluding the end index makes adjacent slices tile exactly and makes lengths trivial to compute.'
  - id: join-not-plus
    file: assets/join-not-plus.svg
    type: diagram
    title: 'Why building a string in a loop is slow'
    alt: 'Diagram: string concatenation in a loop compared with join'
    description: 'A two-column comparison of accumulating a string with repeated concatenation against collecting parts and joining once, covering the number of objects created.'
  - id: fstring-spec
    file: assets/fstring-spec.svg
    type: diagram
    title: 'What comes after the colon'
    alt: 'Diagram: the parts of an f-string format specification'
    description: 'A four-stage breakdown of the f-string format specifier covering fill and alignment, width, precision, and the type character.'
  - id: method-or-regex
    file: assets/method-or-regex.svg
    type: diagram
    title: 'Reach for a method before a pattern'
    alt: 'Diagram: string methods compared with regular expressions'
    description: 'A two-column comparison of using built-in string methods against regular expressions for common text tasks, covering readability and risk.'
  - id: encoding-boundary
    file: assets/encoding-boundary.svg
    type: diagram
    title: 'Where text becomes bytes'
    alt: 'Diagram: encoding and decoding between str and bytes'
    description: 'A four-stage sequence following text through encoding to bytes for storage or transmission, and decoding back, noting where a wrong choice produces mojibake.'
  - id: injection-by-concatenation
    file: assets/injection-by-concatenation.svg
    type: diagram
    title: 'Never build a command from a string'
    alt: 'Diagram: string concatenation compared with parameterised input'
    description: 'A two-column comparison of building queries or commands by concatenating untrusted text against passing it as separate parameters or arguments.'
  - id: strip-returns
    file: assets/strip-returns.svg
    type: diagram
    title: 'Why .strip() on its own line does nothing'
    alt: 'Diagram: why string methods must have their result assigned'
    description: 'A four-stage explanation of why string methods return new strings rather than modifying in place, and what happens when the result is discarded.'
  - id: split-variants
    file: assets/split-variants.svg
    type: diagram
    title: 'Four ways to split, and they differ'
    alt: 'Diagram: the differences between Python''s string splitting methods'
    description: 'A four-stage comparison of split with no argument, split on an explicit separator, splitlines, and partition, describing the different results each produces.'
