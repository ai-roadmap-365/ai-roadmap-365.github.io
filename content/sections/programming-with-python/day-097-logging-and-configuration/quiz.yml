questions:
  - question: 'You set `logging.getLogger("job").setLevel(logging.DEBUG)`, add one StreamHandler, and call `log.debug("here")`. Nothing appears, and no error is raised. What is the most likely cause?'
    options:
      - 'The handler''s own level is higher than DEBUG, and a record must pass the logger''s level AND each handler''s level'
      - 'DEBUG messages are always suppressed outside a debugger'
      - 'The logger name "job" is not registered, so the call was a no-op'
      - 'setLevel only takes effect after the first WARNING has been emitted'
    answer_index: 0
    explanation: 'This is the two-level trap, and it is the most common logging question there is. A record is gated twice by two different objects. The logger''s level decides whether a LogRecord is created at all — that is the cheap exit, and it is why lazy formatting saves anything. Each handler then applies its own level independently, which is exactly what makes it possible to send DEBUG to a file while the console stays at INFO. Setting only the logger''s level leaves the second gate wherever it happened to be. Nothing errors, because a logging call that raised would take your program down at the worst possible moment, so silence is the design rather than the bug. The three-line diagnostic is worth memorising: print `log.level`, `[h.level for h in log.handlers]` and `log.propagate` together. Option 3 gets the model backwards — `getLogger` creates the logger on first use and returns the same object every time afterwards, from a module-level registry, which is what makes configuring "myapp" configure "myapp.loader" too.'

  - question: 'A single `logging.getLogger("myapp.loader").info("loaded")` call produces two identical lines. There is one handler on `myapp` and one on the root logger. What is happening?'
    options:
      - 'getLogger returned two different logger objects for the same name'
      - 'The record propagates up the dotted hierarchy and every handler it passes emits it, so two handlers means two lines'
      - 'INFO records are emitted twice by design, once for the console and once for the file'
      - 'The formatter is being applied twice, producing a duplicate of the rendered text'
    answer_index: 1
    explanation: 'A record travels up the hierarchy — myapp.loader, then myapp, then root — and every handler on the way emits it. That is not a bug; it is the price of the design that lets an application catch a library''s records at the root without knowing which libraries exist. The usual cause of the surprise is `logging.basicConfig()`, which quietly attaches a handler to the root logger, so adding one of your own gives you two. Two things about the walk upwards catch people: the ancestors'' LEVELS are not re-checked, and the ancestors'' FILTERS are not applied at all. Both lines still carry the name `myapp.loader`, because the record keeps the name of the logger it was created on. There are two fixes and they are not equivalent. `propagate = False` is right for a library whose records must not escape into an application it knows nothing about. Attaching handlers in exactly one place is right for an application, because the alternative is a tree of loggers each with an opinion about where its output goes and no single place to change any of it.'

  - question: 'Inside an `except ValueError as error:` block, what does `log.exception("could not parse")` give you that `log.error("could not parse: %s", str(error))` does not?'
    options:
      - 'A higher severity level, since exception() logs at CRITICAL'
      - 'Automatic retry of the failed operation'
      - 'The full traceback and the exception type — which line of which function was called with what, and by whom'
      - 'Nothing; they are aliases for each other'
    answer_index: 2
    explanation: '`log.exception(msg)` is exactly `log.error(msg, exc_info=True)` — same ERROR level, so option 0 is wrong — and it reads the exception currently being handled out of the interpreter, which is why it takes no exception argument and why it must be called inside the except block. What it adds is the traceback, and the traceback is the whole value: on a machine you cannot attach a debugger to, "which line of which function, called by whom" is the difference between a fix and a guess. `str(e)` also silently discards the exception TYPE. The lesson''s example happens to have an informative message, but plenty of exceptions have empty ones, and `str(e)` then logs an empty string next to your text, which reads as a bug in your logging rather than in your program. Outside an except block, pass it explicitly with `exc_info=error`.'

  - question: 'What does `log.debug("summary: %s", expensive_object)` save over `log.debug(f"summary: {expensive_object}")` when the DEBUG level is suppressed?'
    options:
      - 'Nothing measurable; the two forms compile to the same bytecode'
      - 'The cost of rendering the argument — the lab measures 0 renders against 1000 for a thousand suppressed calls'
      - 'The cost of opening the log file, which the f-string version forces'
      - 'Disk space, because the f-string version writes the line anyway'
    answer_index: 1
    explanation: 'The f-string is evaluated before `debug` is even called, because that is what an argument is: Python builds the string, calling the object''s __str__, and hands the finished text to a function that then throws it away. The percent-s form hands logging the template and the object separately, and logging joins them only if a handler is actually going to emit the record. The lab counts this with a class that increments a counter in __str__: a thousand suppressed calls render the argument zero times with percent-s and a thousand times with an f-string. Be honest about the size of the win — on a small integer it is nearly nothing, and selling lazy formatting as a general performance technique is overstating it. The reason to use it everywhere is the second one, which applies even when the record IS emitted: the unformatted template survives onto the record as `record.msg`, so a structured backend can group every occurrence of "batch complete: %d records" as one event with varying arguments. An f-string bakes the number into the text and destroys that grouping.'

  - question: 'You attach a RedactingFilter to `logging.getLogger("myapp")`. A module does `logging.getLogger(__name__)` — resolving to `myapp.loader` — and logs the API key. The key appears in the output. Why?'
    options:
      - 'Filters only run on records whose level is WARNING or above'
      - 'The filter must be registered with logging.config.dictConfig before it takes effect anywhere'
      - 'The key was cached by the formatter from an earlier call'
      - 'A logger''s filters run only for calls made on that logger object; a record propagating up from a descendant skips every ancestor''s filters'
    answer_index: 3
    explanation: 'This was measured while the lesson was written, and the lab asserts it so that a future change in Python fails the build rather than quietly making the lesson wrong. Propagation walks the ancestors'' HANDLERS; it does not run the ancestors'' FILTERS. So a filter on the top-level logger protects only calls made directly on that logger — and since every well-behaved module calls getLogger(__name__) and is therefore a descendant, essentially every record in a real application is a propagated one. The arrangement looks like whole-application protection and is close to none. Attach redaction to each HANDLER instead: a handler sees everything that reaches its destination, from anywhere in the tree. In dictConfig that is a "filters" entry on each handler rather than on the logger. And note the second hole the lab measures: a secret inside an exception MESSAGE survives even a correctly placed filter, because the traceback is rendered by the formatter after every filter has already run.'

  - question: 'Put the four configuration layers in order from lowest precedence to highest, and give the reason for that ordering.'
    options:
      - 'Command-line flag, environment, config file, default — because the default is the most carefully considered value'
      - 'Config file, default, command-line flag, environment — because the environment is set last, at run time'
      - 'Default, config file, environment, command-line flag — because each layer is more specific than the one below it'
      - 'Environment, config file, command-line flag, default — because a default should never be overridden silently'
    answer_index: 2
    explanation: 'Default, then config file, then environment, then command-line flag. The justification is specificity, and it is worth being able to state rather than merely remember: a default is what everybody gets; a file is what this deployment gets; an environment variable is what this process gets; a flag is what THIS INVOCATION gets, typed by a person who is looking at the problem right now. The more specific statement wins — the same rule CSS uses and the same rule your shell uses. The lab makes it concrete by giving one setting a different value in all four layers at once and adding them one at a time: batch_size resolves to 32, then 64, then 128, then 256. Note the practical trap in implementing this: argparse must be given no `default=` of its own, or "not passed" and "passed the default" become the same value and the resolver can no longer tell whether the top layer said anything at all.'

  - question: '`APP_DRY_RUN=false` is set in the environment. Your code does `dry_run = bool(os.environ.get("APP_DRY_RUN"))`. What happens, and what should the code do?'
    options:
      - 'dry_run becomes True, because every non-empty string is truthy; use an explicit table of words and refuse anything ambiguous'
      - 'dry_run becomes False, because Python parses the word "false" specially'
      - 'A ValueError is raised, so the mistake is caught immediately'
      - 'dry_run becomes None, because bool() cannot convert a string'
    answer_index: 0
    explanation: 'bool("false") is True. Every non-empty string is truthy in Python, so the naive conversion turns the word false into on — silently, with no error and no warning, and the feature you switched off stays switched on. It is the single most expensive one-line bug in configuration handling, and its whole danger is the silence. The fix is a function with an explicit table: {"1", "true", "yes", "on"} is True, {"0", "false", "no", "off"} is False, case-insensitively and ignoring surrounding whitespace, and ANYTHING else raises rather than guessing — including "", "maybe" and "2". This is also the concrete advantage a typed config file has over the environment: TOML has real types, so `dry_run = false` in the file arrives as a Python bool with no conversion at all. Everything from the environment is a string, because that is what the operating system stores, and a string is not a type.'

  - question: 'A validation message reads "batch_size: 0 is below the minimum of 1". What is it missing, and why does that matter?'
    options:
      - 'The current time, so you know when the failure happened'
      - 'The provenance — which of the four layers supplied the 0 — because otherwise you have four places to search'
      - 'The stack trace of the validation call'
      - 'Nothing; it already names the setting and the constraint'
    answer_index: 1
    explanation: 'The message correctly names the setting and the constraint, so it tells you WHAT is wrong. What it does not tell you is WHERE to go and change it, and that is the expensive half: the 0 could have come from a default in the code, a TOML file, an environment variable set by a deployment manifest, or a flag in a shell wrapper. "batch_size: 0 is below the minimum of 1 (from flag:--batch-size)" costs one extra field on a dataclass and removes the search entirely. That is the same argument the provenance table makes: the failure that costs the most time in practice is not "the value is wrong", which you notice quickly, but "the value is not what I set it to, and I have four places to look". Two other decisions belong in the same validator: report every problem at once rather than one per run, because fixing configuration one error at a time pushes people towards guessing; and never put a secret''s VALUE in a message — name the setting, say ***redacted***, and still print where it came from, because "is the key set, and did it come from the environment?" is a safe question and "what is the key?" is not.'
