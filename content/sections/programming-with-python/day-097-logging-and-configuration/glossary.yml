terms:
  - term: 'Logger'
    definition: 'The object you call. It has a dotted name, so myapp.loader is a child of myapp which is a child of the root, and configuring an ancestor configures everything beneath it. It has a level, which is the FIRST of two gates a record must pass. Always obtained with logging.getLogger(name), never constructed: getLogger returns the same object for the same name from a module-level registry, which is what makes the hierarchy work at all.'
  - term: 'Handler'
    definition: 'A destination — standard output, a file, a rotating file, a syslog socket, a queue. A logger may have several, and each carries its OWN level, its own filters and its own formatter. That independence is the point: the same call can be dropped by one handler, written as prose by a second and written as JSON by a third.'
  - term: 'Formatter'
    definition: 'The object that turns a LogRecord into text. It belongs to a handler rather than to a logger, which is why the same records can appear as a friendly console line and as a JSON object at the same moment with no change to any call site. It is also where the traceback is rendered — after every filter has already run, which is why a secret inside an exception message survives redaction.'
  - term: 'Filter'
    definition: 'An object with one method that returns True to keep a record and False to drop it, and which is explicitly allowed to EDIT the record on the way through. That permission is what makes redaction possible. Filters can be attached to loggers and to handlers, and the two are not equivalent: a logger''s filters run only for calls made on that logger object.'
  - term: 'LogRecord'
    definition: 'The object created when a call passes the logger''s level: the unformatted template, the arguments, the level, the logger''s name, the creation time, the file and line, the exception information, and anything supplied through extra=. Note what it is not — it is not a string yet. Nothing has been formatted.'
  - term: 'Log level'
    definition: 'A severity, both a name and a number: DEBUG 10, INFO 20, WARNING 30, ERROR 40, CRITICAL 50, with NOTSET at 0 meaning "ask my parent". The numbers rise in tens so a custom level can be inserted between two of them. Note that syslog, where the idea comes from, numbers them the other way round: there a lower number is more severe.'
  - term: 'The two-level rule'
    definition: 'A record must pass the LOGGER''s level and then EACH HANDLER''s level, and they belong to two different objects. A logger at DEBUG whose handler is at WARNING emits no debug output and raises no error. This is the single most common logging question there is, and the silence is deliberate: a logging call that raised would take the program down at the worst possible moment.'
  - term: 'Propagation'
    definition: 'The record''s journey up the dotted hierarchy after the logger it was created on has handled it — myapp.loader, then myapp, then root — with every handler it passes emitting it. Two things surprise people: the ancestors'' levels are not re-checked, and the ancestors'' filters are not applied at all. It is why one call can produce two lines, and it is also the mechanism that lets an application collect a library''s records without knowing the library exists.'
  - term: 'Level inflation'
    definition: 'The failure mode where routine events are logged at WARNING because they felt important while being written, until the warnings stop being read and the one that mattered is invisible. A level is a promise to the reader about what it costs them to ignore the line; break it often enough and the levels carry no information at all.'
  - term: 'Lazy formatting'
    definition: 'Passing the template and the arguments separately — log.info("saw %s", n) — so that the joining happens inside the handler only if a record will actually be emitted. Measured here: a thousand suppressed DEBUG calls render the argument zero times this way and a thousand times with an f-string. The second and better reason applies even when the record IS emitted — the unformatted template survives as record.msg, so a structured backend can group every occurrence of one event.'
  - term: 'Structured logging'
    definition: 'Emitting each event as a machine-parseable object with named fields — usually one JSON object per line — rather than as a sentence. It turns "read the log" into "query the log", which is the only thing that scales past one file on one machine. The honest cost is that JSON is unpleasant to read with your eyes, which is why the usual arrangement is JSON to the collector and a human formatter on the console: the same records, two handlers, two formatters.'
  - term: 'Run identifier'
    definition: 'A value unique to one execution — a scheduler job id, a CI run number, a uuid4 — stamped onto every line so that two runs of the same program in one file are separable. It belongs on the formatter as a static field rather than at every call site, because a value that must appear everywhere should be attached once.'
  - term: 'Log rotation'
    definition: 'Bounding a log file so it cannot fill the disk. RotatingFileHandler renames by size — app.log becomes app.log.1, .1 becomes .2, and the file that would have become .4 is DELETED, because backupCount is how much history you keep. TimedRotatingFileHandler does the same on the clock, naming the rolled file by date. Size-based rotation bounds your disk; time-based rotation bounds your search.'
  - term: 'dictConfig'
    definition: 'Configuring the whole logging system from one dictionary — formatters, filters, handlers, loggers and the root — rather than from a sequence of calls. Because it is data, it can be loaded from the same TOML file as the rest of your configuration, kept in version control and diffed in review. Its trap is disable_existing_loggers, which defaults to True and silences every logger that already existed, including those libraries create at import time.'
  - term: 'basicConfig'
    definition: 'The one-line convenience that quietly attaches a handler to the ROOT logger. Two behaviours worth knowing: it is why every module''s getLogger(__name__) suddenly produces output, and it does nothing at all if the root already has a handler unless you pass force=True — which is why a second call appears to be ignored, and why a library must never call it.'
  - term: 'Redacting filter'
    definition: 'A filter that replaces known secret VALUES wherever they appear — in the message, in the arguments, in a field passed through extra=, in a value nested inside a dict. Redaction by value rather than by key name, because key-name redaction misses log.info("calling %s", url_with_token), which is how secrets actually escape. It belongs on each HANDLER, and it is a seatbelt rather than permission to log the secret.'
  - term: 'Configuration precedence'
    definition: 'The order in which layers override one another: default, then config file, then environment, then command-line flag. The justification is specificity — a default is what everybody gets, a file is what this deployment gets, a variable is what this process gets, a flag is what this invocation gets, typed by a person looking at the problem right now.'
  - term: 'Provenance'
    definition: 'The record of WHICH layer supplied a value, carried alongside the value itself and printable as a table. It exists because the expensive failure is not "the value is wrong", which you notice quickly, but "the value is not what I set it to and I have four places to look". It also makes a validation message actionable: "batch_size: 0 is below the minimum of 1 (from flag:--batch-size)" names the fault and the one place to fix it.'
  - term: 'Environment variable'
    definition: 'A key and a string value held by the operating system for a process and inherited by its children. The Twelve-Factor App argues configuration belongs here because it is set outside the code, per deployment, and is never committed. Its limits are equally real: the values are flat, so nesting has to be faked with prefixes; they are all strings, so every type problem applies; and there is no file to diff in review.'
  - term: 'The empty-string distinction'
    definition: 'A variable that was never set and one that was set to "" are different states, and os.environ.get collapses them — None and "" both fall to the default under the usual `or default` idiom. Ask `"NAME" in environ` instead. It matters because an empty variable is almost never an accident: it is a deployment template that filled in nothing, a secret injection that failed, or somebody who meant to clear a value.'
  - term: 'tomllib'
    definition: 'The standard library''s TOML reader, added in Python 3.11 and deliberately READ-ONLY — there is no tomllib.dump. Its load function requires a BINARY file object, which catches everybody exactly once. Its advantage over the environment is that TOML has real types, so batch_size = 64 arrives as an int and dry_run = false arrives as a bool, with no conversion and no chance of believing that the string "false" is true.'
  - term: 'Startup validation'
    definition: 'Checking every configuration value before any work begins, so that a bad value fails when somebody deployed it rather than at 03:00 when the code path is finally reached. Two design decisions go with it: report every problem at once, because fixing configuration one error per run pushes people towards guessing; and name the provenance in each message, because that is what turns "what is wrong" into "where to fix it".'
  - term: 'Secret'
    definition: 'A value that grants access — an API key, a token, a password. It belongs in the environment or a secret manager, never in a file in the repository, where deleting the line does not remove it from the history, and never as a command-line flag, where it is visible in `ps` to every other user and lands in the shell history file. Its presence and its provenance may be printed; its value may not.'
  - term: 'Run manifest'
    definition: 'The first line of a run''s log: the resolved configuration and the provenance of every value, with secrets replaced by a placeholder. It is what makes a run reproducible from its own record rather than from anybody''s memory, and it is the difference between a result and an anecdote — the seed, the data version, the model name and the hyperparameters are all configuration, and nothing else records them.'
