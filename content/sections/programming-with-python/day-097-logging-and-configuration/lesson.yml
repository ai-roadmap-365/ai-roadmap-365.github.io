title: 'Logging and Configuration'
section: programming-with-python
subsection: data-and-databases
week: 14
learning_promise: 'After this lesson you will be able to take a script whose every line of commentary is a print statement and turn it into a program whoever is awake when it breaks can actually read — naming the four objects the logging module is built from and saying which of them can drop a record and why nothing errors when one does; diagnosing the two-level trap where a logger at DEBUG and a handler at WARNING silently swallow every debug line; reproducing the duplicate-message problem propagation causes and fixing it two ways, knowing which fix belongs in a library and which in an application; choosing between the five levels by asking who the line is for rather than how alarming it feels; using exception() inside an except block and stating exactly what error(str(e)) throws away; using lazy percent-s formatting and measuring what it saves; writing a JSON formatter and querying the result with nothing but the standard library; writing a redacting filter, attaching it where it actually works rather than where it looks right, and proving the secret appears nowhere in captured output — including the two holes measured while this lesson was written, that a filter on a logger does not protect records from child loggers and that a secret inside an exception message survives every filter; configuring the lot from one dictConfig dictionary; rotating files by size and by time while being able to argue why stdout plus a supervisor is usually better; and then building, from scratch, a four-layer configuration resolver — defaults, TOML file, environment, command-line flags — in which every setting reports both its value and the layer it came from, telling a missing environment variable from an empty one, refusing to believe that the string "false" is true, keeping every secret out of the log and off the command line, and validating the whole thing at startup with messages that name both the setting and the one of four places to go and fix it.'
objectives:
  - 'Name the four objects the logging module is built from — logger, handler, formatter, filter — say what each one does, and trace one call through all of them'
  - 'Diagnose the two-level trap, in which a record must pass the logger''s level AND each handler''s level, and explain why a logger left at NOTSET is effectively at the root''s WARNING'
  - 'Reproduce the duplicate-message problem caused by propagation up the dotted hierarchy, fix it two ways, and say which fix belongs in a library and which in an application'
  - 'Choose between DEBUG, INFO, WARNING, ERROR and CRITICAL by asking who the line is for and what they do about it, and name the failure mode called level inflation'
  - 'Use exception() inside an except block, and state the two things error(str(e)) throws away — the traceback and the exception type'
  - 'Use lazy percent-s formatting, measure what it saves for a suppressed record, and give the second reason that applies even when the record is emitted'
  - 'Write a JSON formatter as a subclass with one method, and query the resulting log with nothing but the json module and a loop'
  - 'Write a redacting filter that scrubs by value across the message, the arguments and nested extra fields, and attach it to each handler rather than to a logger — with the measurement that explains why'
  - 'Explain why a secret inside an exception message survives a redacting filter, and give both the rendering-level fix and the better source-level one'
  - 'Configure logging from a single dictConfig dictionary with two handlers and two formatters, and avoid the disable_existing_loggers trap'
  - 'Use RotatingFileHandler and TimedRotatingFileHandler, say what backupCount actually deletes, and argue honestly for stdout plus a supervisor as the usual better answer'
  - 'Build a four-layer configuration resolver — default, config file, environment, flag — and justify that ordering by specificity'
  - 'Record the provenance of every resolved value and print it as a table, so that "why is it doing that?" takes five seconds'
  - 'Read TOML with tomllib in binary mode, and explain what a typed file format gives you that the environment cannot'
  - 'Convert environment strings to real types with an explicit word table, having seen that bool("false") is True, and distinguish a missing variable from an empty one'
  - 'Validate configuration at startup, reporting every problem at once with messages that name both the setting and the layer its value came from'
  - 'Keep a secret out of the log, out of the provenance table, out of the validation messages and off the command line, and say why a command-line flag is the wrong place for one'
  - 'Compare the stdlib against structlog, loguru, python-json-logger, pydantic-settings, python-dotenv and dynaconf with when to choose each — and say which were actually run here and which were only described'
prerequisites:
  - 'Day 43 — a working python3 on your PATH; Python 3.11 or newer, because the configuration half reads TOML with tomllib'
  - 'Day 59 — modules, imports and __name__, which is exactly what logging.getLogger(__name__) depends on and what makes the dotted hierarchy line up with your package layout'
  - 'Day 65 — JSON, which is what a structured log line is made of'
  - 'Day 66 — exceptions and try/except, without which exception() and exc_info have nothing to attach'
  - 'Day 68 — inheritance and dunder methods; a formatter and a filter are each one subclass overriding one method'
  - 'Day 69 — dataclasses and type hints, used for the Setting and Resolved records'
  - 'Day 80 — argparse, which supplies the highest-precedence configuration layer'
  - 'Day 81 — scheduling and background jobs, where the argument for logging to stdout and letting the supervisor collect it was first made'
  - 'Day 84 — the automation toolkit, which is the program this day''s configuration resolver was missing'
  - 'Day 91 — ISO 8601 as a text format that sorts chronologically, reused here for every timestamp'
  - 'Day 94 — pydantic, which is the foundation pydantic-settings builds the configuration answer on'
  - 'Day 95 — dates, times and time zones, which is why every timestamp in this lesson is UTC'
