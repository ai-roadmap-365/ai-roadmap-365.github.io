visuals:
  - id: logging-architecture
    file: assets/logging-architecture.svg
    type: diagram
    title: 'A log record''s journey through the four objects, showing every place it can be dropped and why it can appear twice'
    alt: 'Diagram: a log record''s journey through the four logging objects — the logger with its level and filters, propagation up the dotted hierarchy, and each handler with its own level, filters and formatter — marking the five places a record can disappear with no error raised and why the same message can appear twice'
    description: 'A static architecture diagram of the Python logging module, laid out in three bands with two explanatory panels across the foot, and a colour convention stated in the subtitle: red marks a point at which the record disappears and no error is raised. The first band, on the left, follows one call into the logger it was made on. The call is shown as logging.getLogger of dunder name followed by log.info of a template and two arguments. Gate one is the logger''s level, with a note that the level is inherited from the nearest ancestor that sets one, that NOTSET means ask my parent, and that the root''s default is WARNING; a red branch leads to a box saying the record was dropped and no record was even built, which is the cheapest exit. Next the LogRecord is created, and its contents are listed: the template, the arguments, the level number, the name, the creation time, the file and line, the exception information and anything from extra. Gate two is this logger''s own filters, with a note that returning False drops the record and that editing the record on the way through is allowed, which is what makes redaction possible; a second red branch leads to a box saying the record was dropped because a filter said no. The band closes with a warning that these filters run only for calls made on this logger and that a record arriving from a child logger skips them entirely. The second band, across the lower middle, walks the record up the dotted hierarchy: myapp.loader has no handlers so nothing is written there; propagation carries it to myapp, drawn in green, which has one handler and writes a line, annotated that its level is not re-checked and its filters are not run; propagation carries it again to root, also green, which has one handler and writes the same line a second time, annotated that basicConfig put that handler there quietly. A line beneath states that one call has produced two lines and that this is the duplicate-message problem. The third band, on the right, opens one handler and shows that every handler the record passes runs all of it independently with its own settings: gate three is the handler''s level, described as the second of the two level checks and the one people forget, with a red branch to a box saying the record was dropped by this handler while others may still emit it; gate four is the handler''s filters, noted as seeing everything that reaches this destination from anywhere in the tree and therefore as the correct place for a redacting filter; then the formatter renders the line, with the note that the percent-formatting of the message happens here rather than at the call site, which is what lazy formatting buys, and that the traceback is rendered here too, after every filter has already run; then the record reaches a destination, listed as stdout, a rotating file, syslog, a queue, an SMTP server or anything you subclass. The left foot panel lists the five places a line disappears in order — the logger''s level, a filter on that logger, an ancestor with propagate set to False, the handler''s own level, a filter on that handler — plus a sixth case in which there is no handler anywhere and the last-resort handler prints WARNING and above to stderr while silently dropping the rest; and it gives the two fixes for the duplicate, propagate set to False for a library and handlers in one place only for an application. The right foot panel states the rule the diagram exists to make obvious: levels are checked twice on two different objects and both must pass, filters are checked twice as well but the two are not equivalent, because a filter on a logger runs only for calls made on that logger and never for records propagating up from a child — so a redacting filter on the top logger protects almost nothing while looking like it protects everything, and belongs on each handler. It closes by noting where the traceback is rendered and that a secret inside an exception message therefore walks past a filter untouched. A final line records that both surprising behaviours were measured on Python 3.14.0 while the lesson was written and that the lab''s test suite asserts them, so a future change fails the build rather than quietly making the picture wrong.'
  - id: config-precedence-flow
    file: assets/config-precedence-flow.svg
    type: flow-animated
    title: 'One setting resolved through four layers, each overriding the last, with the provenance printed at the end'
    alt: 'Diagram: one setting resolved through four layers — default 32, config file 64, environment 128, command-line flag 256 — each overriding the last, with the provenance string recorded at every step and the flag winning'
    description: 'An animated flow diagram in four stages laid out left to right, readable in full as a still image. One setting, batch_size, is given a different value in every layer, so the still frame teaches the whole idea on its own. Stage one is the default written in the code: the value 32, the line batch_size equals 32, the provenance string "source: default", and the caption "what everybody gets". Stage two is the config file, read with tomllib: the value 64, the provenance string "source: file:config.toml", and the caption "what this deployment gets". Stage three is the environment, annotated that values arrive as text: the value 128, the variable APP_BATCH_SIZE set to the string "128", the provenance string "source: env:APP_BATCH_SIZE", and the caption "what this process gets". Stage four is the command line, annotated that argparse is given no defaults of its own: the value 256, the flag dash dash batch dash size 256, the provenance string "source: flag:--batch-size", and the caption "what THIS invocation gets". A green result panel below prints the resolved answer in large figures — 256, batch_size equals 256, from flag colon dash dash batch dash size — beside a note that without provenance the question "why is batch_size 256?" means reading a TOML file, a deployment manifest, a shell wrapper and an argparse definition in the dark. A panel across the foot gives the justification for the ordering, namely that each layer is more specific than the one below it, and the two things the design buys: printing the table answers "why is it doing that?" in five seconds, and a startup validator can say that batch_size 0 is below the minimum of 1 and that the value came from the flag, naming not just the fault but the one of four places to go and fix it. A closing line notes the setting deliberately missing from the picture — the API key, which has no flag, because a secret on a command line is visible in the process table and lands in the shell history file. The animation is a blue token travelling left to right along a marching-dash wire beneath the four stages, with each stage lighting up briefly as the token reaches it and the result panel emphasised last. A prefers-reduced-motion block stops every animation and restores the resting state, in which all four stages are shaded, the wire is a solid arrow, every value and provenance string is written out, and the token sits at the first stage.'
