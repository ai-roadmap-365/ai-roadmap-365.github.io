<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>A small project's layout: a package directory holding modules organized by responsibility, an __init__.py that defines the public API, a __main__.py entry point run with python -m, and a separate tests directory that imports the package</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A sane small-project layout</text>

  <!-- Project root box -->
  <rect x="24" y="58" width="712" height="322" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="44" y="84" font-size="15" font-weight="bold" fill="#1a202c">wordstats-project/  (the project root)</text>

  <!-- Package directory -->
  <rect x="48" y="100" width="392" height="200" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="68" y="124" font-size="15" font-weight="bold" fill="#1a202c">wordstats/  — the package (a directory)</text>

  <!-- __init__.py -->
  <rect x="68" y="136" width="352" height="34" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" rx="4"/>
  <text x="80" y="158" font-size="14" fill="#1a202c">__init__.py  — marks the package, defines the public API</text>

  <!-- tokens.py -->
  <rect x="68" y="176" width="352" height="34" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="4"/>
  <text x="80" y="198" font-size="14" fill="#1a202c">tokens.py  — responsibility: text -&gt; list of words</text>

  <!-- stats.py -->
  <rect x="68" y="216" width="352" height="34" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="4"/>
  <text x="80" y="238" font-size="14" fill="#1a202c">stats.py  — responsibility: words -&gt; frequency numbers</text>

  <!-- __main__.py -->
  <rect x="68" y="256" width="352" height="34" fill="#dcfce7" stroke="#1d4ed8" stroke-width="1.5" rx="4"/>
  <text x="80" y="278" font-size="14" fill="#1a202c">__main__.py  — entry point: python3 -m wordstats</text>

  <!-- tests directory -->
  <rect x="464" y="100" width="248" height="120" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="484" y="124" font-size="15" font-weight="bold" fill="#1a202c">tests/</text>
  <rect x="484" y="136" width="208" height="34" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="4"/>
  <text x="496" y="158" font-size="14" fill="#1a202c">test_wordstats.py</text>
  <text x="484" y="196" font-size="13" fill="#1a202c">imports the package and</text>
  <text x="484" y="212" font-size="13" fill="#1a202c">asserts what it returns</text>

  <!-- README / pyproject -->
  <rect x="464" y="232" width="248" height="58" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="484" y="256" font-size="14" fill="#1a202c">README.md, pyproject.toml</text>
  <text x="484" y="278" font-size="13" fill="#1a202c">docs and packaging metadata</text>

  <!-- arrow: tests import package -->
  <line x1="464" y1="153" x2="440" y2="153" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="440,153 452,147 452,159" fill="#1d4ed8"/>
  <text x="452" y="118" text-anchor="end" font-size="12" font-weight="bold" fill="#1d4ed8">import wordstats</text>

  <!-- caption -->
  <text x="380" y="326" text-anchor="middle" font-size="14" fill="#1a202c">Each module owns one responsibility; __init__.py is the front desk; __main__.py is how you run it;</text>
  <text x="380" y="346" text-anchor="middle" font-size="14" fill="#1a202c">tests live outside the package and import it — the same shape AI projects use for data / model / train / serve.</text>
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#1d4ed8">One responsibility per file. Dependencies point one way, never in a loop.</text>

  <text x="380" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Run it:  python3 -m wordstats sample.txt      Reuse it:  from wordstats import tokenize, top_n</text>
  <text x="380" y="440" text-anchor="middle" font-size="13" fill="#1a202c">A package is a directory of modules; a module is a single .py file.</text>
</svg>
