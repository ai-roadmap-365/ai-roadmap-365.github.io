<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="When each fits.">
  <title>Absolute against relative imports</title>
  <style>
    .absolute-relative-bg   { fill: #f8fafc; }
    .absolute-relative-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-relative-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-relative-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-relative-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-relative-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .absolute-relative-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .absolute-relative-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .absolute-relative-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .absolute-relative-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .absolute-relative-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .absolute-relative-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .absolute-relative-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .absolute-relative-row { opacity: 1; }
    .absolute-relative-r0 { animation-delay: 0.00s; }
    .absolute-relative-r1 { animation-delay: 0.45s; }
    .absolute-relative-r2 { animation-delay: 0.90s; }
    .absolute-relative-r3 { animation-delay: 1.35s; }
    .absolute-relative-r4 { animation-delay: 1.80s; }
    .absolute-relative-row { animation: absolute-relative-reveal 7.3s ease-in-out infinite; }
    @keyframes absolute-relative-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="absolute-relative-bg" width="980" height="390"/>
  <text class="absolute-relative-h1"  x="30" y="40">Absolute against relative imports</text>
  <text class="absolute-relative-sub" x="30" y="64">When each fits.</text>
  <rect class="absolute-relative-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="absolute-relative-name" x="46" y="122">Absolute</text>
  <text class="absolute-relative-desc" x="46" y="142">Full path from the root.</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r0" x="46" y="182">Names the package from the top</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r1" x="46" y="216">Unambiguous wherever it appears</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r2" x="46" y="250">Survives moving the importing file</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r3" x="46" y="284">Longer to write</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r4" x="46" y="318">The recommended default</text>
  <rect class="absolute-relative-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="absolute-relative-name" x="526" y="122">Relative</text>
  <text class="absolute-relative-desc" x="526" y="142">Relative to this module.</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r0" x="526" y="182">Uses dots to walk up</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r1" x="526" y="216">Shorter within a package</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r2" x="526" y="250">Breaks if the module is run directly</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r3" x="526" y="284">Ambiguous to a reader</text>
  <text class="absolute-relative-desc absolute-relative-row absolute-relative-r4" x="526" y="318">For tight intra-package imports</text>
  <text class="absolute-relative-sub" x="30" y="372">The failure when a module is run directly is the common confusion: relative imports assume the file was imported as part of a package, not executed as a script.</text>
</svg>
