<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, sans-serif">
  <title>How Python resolves an import statement: first it checks the sys.modules cache and reuses the module if present; otherwise it searches sys.path for the file, executes the module once, stores it in the cache, and finally binds the name in the importing file</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">What import wordstats.tokens really does</text>

  <!-- Start -->
  <rect x="280" y="56" width="200" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">import statement runs</text>
  <text x="380" y="96" text-anchor="middle" font-size="14" fill="#1a202c">import wordstats.tokens</text>

  <line x1="380" y1="104" x2="380" y2="128" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,128 374,116 386,116" fill="#1a202c"/>

  <!-- Cache decision -->
  <polygon points="380,136 512,192 380,248 248,192" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Already in</text>
  <text x="380" y="208" text-anchor="middle" font-size="14" fill="#1a202c">sys.modules cache?</text>

  <!-- Yes branch: reuse -->
  <text x="556" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="512" y1="192" x2="600" y2="192" stroke="#1a202c" stroke-width="2"/>
  <polygon points="600,192 588,186 588,198" fill="#1a202c"/>
  <rect x="600" y="166" width="150" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="675" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Reuse the</text>
  <text x="675" y="208" text-anchor="middle" font-size="14" fill="#1a202c">cached module</text>

  <!-- No branch down -->
  <text x="402" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="380" y1="248" x2="380" y2="272" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,272 374,260 386,260" fill="#1a202c"/>

  <!-- Search sys.path -->
  <rect x="264" y="272" width="232" height="58" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Search sys.path in order</text>
  <text x="380" y="318" text-anchor="middle" font-size="14" fill="#1a202c">cwd, then installed locations</text>

  <line x1="380" y1="330" x2="380" y2="354" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,354 374,342 386,342" fill="#1a202c"/>

  <!-- Found decision -->
  <polygon points="380,362 500,410 380,458 260,410" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Found the file?</text>

  <!-- No: error -->
  <text x="196" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="260" y1="410" x2="176" y2="410" stroke="#1a202c" stroke-width="2"/>
  <polygon points="176,410 188,404 188,416" fill="#1a202c"/>
  <rect x="26" y="384" width="150" height="52" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="101" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">ModuleNotFound-</text>
  <text x="101" y="426" text-anchor="middle" font-size="14" fill="#1a202c">Error</text>

  <!-- Yes: execute + cache -->
  <text x="402" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="380" y1="458" x2="380" y2="482" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,482 374,470 386,470" fill="#1a202c"/>
  <rect x="238" y="482" width="284" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="380" y="507" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Execute module once, store in sys.modules</text>

  <!-- Bind name -->
  <line x1="522" y1="502" x2="600" y2="502" stroke="#1a202c" stroke-width="2"/>
  <polygon points="600,502 588,496 588,508" fill="#1a202c"/>
  <rect x="600" y="482" width="150" height="40" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="675" y="507" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Bind the name</text>

  <!-- caption -->
  <text x="380" y="548" text-anchor="middle" font-size="13" fill="#1a202c">The cache is why a module's top-level code runs only once, no matter how many files import it.</text>
</svg>
