<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a module is found</title>
  <style>
    .import-resolution-bg   { fill: #f8fafc; }
    .import-resolution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .import-resolution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .import-resolution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .import-resolution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .import-resolution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .import-resolution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .import-resolution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .import-resolution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .import-resolution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .import-resolution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .import-resolution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .import-resolution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .import-resolution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .import-resolution-stage { opacity: 1; }

    .import-resolution-s0 { animation-delay: 0.00s; }
    .import-resolution-e0 { animation-delay: 0.00s; }
    .import-resolution-s1 { animation-delay: 1.28s; }
    .import-resolution-e1 { animation-delay: 1.28s; }
    .import-resolution-s2 { animation-delay: 2.56s; }
    .import-resolution-e2 { animation-delay: 2.56s; }
    .import-resolution-s3 { animation-delay: 3.84s; }
    .import-resolution-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .import-resolution-conn  { animation: import-resolution-trace 6.4s ease-in-out infinite; }
      .import-resolution-stage { animation: import-resolution-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes import-resolution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes import-resolution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .import-resolution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .import-resolution-stage { animation: import-resolution-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes import-resolution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="import-resolution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="import-resolution-bg" width="980" height="322"/>
  <text class="import-resolution-h1"  x="30" y="40">How a module is found</text>
  <text class="import-resolution-sub" x="30" y="64">Four steps.</text>
  <g class="import-resolution-stage import-resolution-s0">
    <rect class="import-resolution-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="import-resolution-step" x="44" y="142">01</text>
    <text class="import-resolution-name" x="70" y="142">Check whether it is already imported</text>
    <text class="import-resolution-desc" x="44" y="166">In which case nothing is re-run.</text>
  </g>
  <line class="import-resolution-line import-resolution-conn import-resolution-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#import-resolution-tip)"/>
  <g class="import-resolution-stage import-resolution-s1">
    <rect class="import-resolution-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="import-resolution-step" x="280" y="142">02</text>
    <text class="import-resolution-name" x="306" y="142">Otherwise search the path, in order</text>
    <text class="import-resolution-desc" x="280" y="166">Which is why the current</text>
    <text class="import-resolution-desc" x="280" y="182">directory can shadow a library.</text>
  </g>
  <line class="import-resolution-line import-resolution-conn import-resolution-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#import-resolution-tip)"/>
  <g class="import-resolution-stage import-resolution-s2">
    <rect class="import-resolution-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="import-resolution-step" x="516" y="142">03</text>
    <text class="import-resolution-name" x="542" y="142">Execute the module's code, once</text>
    <text class="import-resolution-desc" x="516" y="166">Top to bottom, on first import.</text>
  </g>
  <line class="import-resolution-line import-resolution-conn import-resolution-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#import-resolution-tip)"/>
  <g class="import-resolution-stage import-resolution-s3">
    <rect class="import-resolution-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="import-resolution-step" x="752" y="142">04</text>
    <text class="import-resolution-name" x="778" y="142">And cache the result for every later import</text>
    <text class="import-resolution-desc" x="752" y="166">So module-level code runs</text>
    <text class="import-resolution-desc" x="752" y="182">exactly once.</text>
  </g>
  <text class="import-resolution-sub" x="30" y="304">Module code running exactly once is what makes import-time side effects surprising: they happen at an unpredictable moment and never again.</text>
</svg>
