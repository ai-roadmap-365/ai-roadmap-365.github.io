<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Structure makes things findable.">
  <title>A filing system</title>
  <style>
    .filing-system-bg   { fill: #f8fafc; }
    .filing-system-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-system-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-system-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-system-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-system-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .filing-system-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-system-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .filing-system-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .filing-system-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .filing-system-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .filing-system-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .filing-system-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .filing-system-row { opacity: 1; }
    .filing-system-r0 { animation-delay: 0.00s; }
    .filing-system-r1 { animation-delay: 0.45s; }
    .filing-system-r2 { animation-delay: 0.90s; }
    .filing-system-r3 { animation-delay: 1.35s; }
    .filing-system-r4 { animation-delay: 1.80s; }
    .filing-system-row { animation: filing-system-reveal 7.3s ease-in-out infinite; }
    @keyframes filing-system-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="filing-system-bg" width="980" height="390"/>
  <text class="filing-system-h1"  x="30" y="40">A filing system</text>
  <text class="filing-system-sub" x="30" y="64">Structure makes things findable.</text>
  <rect class="filing-system-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="filing-system-name" x="46" y="122">One pile</text>
  <text class="filing-system-desc" x="46" y="142">Everything together.</text>
  <text class="filing-system-desc filing-system-row filing-system-r0" x="46" y="182">Every document in one place</text>
  <text class="filing-system-desc filing-system-row filing-system-r1" x="46" y="216">Names must be globally unique</text>
  <text class="filing-system-desc filing-system-row filing-system-r2" x="46" y="250">Finding anything means searching</text>
  <text class="filing-system-desc filing-system-row filing-system-r3" x="46" y="284">Growth makes it worse</text>
  <text class="filing-system-desc filing-system-row filing-system-r4" x="46" y="318">This is one long file</text>
  <rect class="filing-system-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="filing-system-name" x="526" y="122">Organised folders</text>
  <text class="filing-system-desc" x="526" y="142">Grouped and named.</text>
  <text class="filing-system-desc filing-system-row filing-system-r0" x="526" y="182">Related documents together</text>
  <text class="filing-system-desc filing-system-row filing-system-r1" x="526" y="216">Names need only be unique within a folder</text>
  <text class="filing-system-desc filing-system-row filing-system-r2" x="526" y="250">Location tells you what it is</text>
  <text class="filing-system-desc filing-system-row filing-system-r3" x="526" y="284">Growth is absorbed</text>
  <text class="filing-system-desc filing-system-row filing-system-r4" x="526" y="318">This is a package</text>
  <text class="filing-system-sub" x="30" y="372">Names needing to be unique only within a folder is exactly the namespacing benefit, and it is why two modules can both define a function called parse.</text>
</svg>
