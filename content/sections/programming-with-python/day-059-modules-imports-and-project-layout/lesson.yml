slug: modules-imports-and-project-layout
title: 'Modules, Imports, and Project Layout'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to grow a program beyond one file: split a script into modules by responsibility, organize them into a package with an __init__.py and a __main__.py entry point, use import, from-import, and import-as (absolute and relative), explain how Python finds and caches modules via sys.path and sys.modules, use the __name__ == "__main__" guard so a file can be both run and imported, and lay out a small project that can be reused and tested.'
objectives:
  - 'Define a module as a single .py file and a package as a directory of modules marked by __init__.py, and split a program by responsibility'
  - 'Use the three import forms — import, from ... import, and import ... as — and choose absolute imports from outside a package versus relative imports between siblings inside it'
  - 'Explain what if __name__ == "__main__": does and why it lets one file be both a runnable program and an importable module'
  - 'Describe how Python resolves an import: check the sys.modules cache, search sys.path in order, execute the module once, and bind the name'
  - 'Use __init__.py to define a package public API and run a package as an entry point with python3 -m'
  - 'Lay out a small project (package of responsibility modules, an entry point, a tests directory) and avoid circular imports by keeping dependencies one-directional'
  - 'Connect multi-module layout to AI projects, where data, model, training, and serving live as separate importable, testable modules'
prerequisites:
  - 'Days 57-58 of this course: functions with arguments and return values, and scope'
  - 'Day 56: a data-driven program with named functions, a main(), and the main-guard idiom'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
