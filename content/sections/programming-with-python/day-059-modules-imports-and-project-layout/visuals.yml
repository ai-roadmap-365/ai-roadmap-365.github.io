visuals:
  - id: package-layout
    file: assets/package-layout.svg
    type: diagram
    title: 'A sane small-project layout'
    alt: 'Diagram: a small project''s layout — a wordstats package directory of modules by responsibility, an __init__.py public API, a __main__.py entry point, and a separate tests directory that imports the package'
    description: 'Nested boxes: the project root contains the wordstats package, whose modules each own one responsibility — tokens.py (text to a list of words), stats.py (words to frequency numbers), __init__.py (marks the package and defines the public API), and __main__.py (the entry point run with python3 -m wordstats). Alongside the package, not inside it, a tests directory holds test_wordstats.py, which imports the package and asserts what it returns, plus README and packaging metadata. It is the same shape AI projects use for data, model, train, and serve.'
  - id: import-resolution-flow
    file: assets/import-resolution-flow.svg
    type: flowchart
    title: 'How Python resolves an import statement'
    alt: 'Flowchart: how Python resolves an import — check the sys.modules cache, else search sys.path, execute the module once, cache it, and bind the name, with a ModuleNotFoundError branch'
    description: 'An import statement runs, then a decision: is the module already in the sys.modules cache? If yes, reuse the cached module. If no, search sys.path in order (current directory first, then installed locations); another decision asks whether the file was found. If not found, raise ModuleNotFoundError. If found, execute the module once, store it in sys.modules, and bind the name in the importing file. The cache is why a module''s top-level code runs only once no matter how many files import it.'
  - id: module-idea
    file: assets/module-idea.svg
    type: diagram
    title: 'What a module gives you'
    alt: 'Diagram: the four things a module provides'
    description: 'A four-stage description of modules covering the namespace, reuse, organisation and the interface.'
  - id: file-to-package
    file: assets/file-to-package.svg
    type: diagram
    title: 'From file to package'
    alt: 'Diagram: how a script grows into a package'
    description: 'A four-stage description of project growth covering the single file, several modules, the package and the installable distribution.'
  - id: absolute-relative
    file: assets/absolute-relative.svg
    type: diagram
    title: 'Absolute against relative imports'
