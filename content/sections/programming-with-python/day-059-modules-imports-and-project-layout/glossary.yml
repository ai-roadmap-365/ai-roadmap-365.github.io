terms:
  - term: module
    definition: 'A single .py file of Python code, importable by other files; its name is the filename without the extension. Importing a module runs it once and gives you an object through which you reach the functions, classes, and variables it defined.'
  - term: package
    definition: 'A directory of modules that Python treats as one importable name, marked by an __init__.py file. A package groups related modules under a shared name — for example wordstats/ containing tokens.py and stats.py, imported as wordstats.tokens.'
  - term: import
    definition: 'The statement that loads a module (running its top-level code once, then caching it) and binds a name so you can use its contents. `import stats` binds the whole module, reached as stats.top_n.'
  - term: from-import
    definition: 'The `from module import name` form, which reaches inside a module and binds just the chosen name, so you can use it directly — `from stats import top_n` lets you call top_n(...) without the module prefix.'
  - term: import as
    definition: 'The `import module as alias` form, which binds a module (or `from module import name as alias` a name) under a different, usually shorter name — the reason data-science files begin `import numpy as np`.'
  - term: __name__
    definition: 'A built-in variable every module has. Python sets it to the module''s dotted name (such as "wordstats.tokens") when the module is imported, and to the special string "__main__" when the file is run directly — the switch the main guard reads.'
  - term: __main__
    definition: 'The value Python assigns to __name__ in the file that was launched directly (via python3 script.py or python3 -m package). Code under `if __name__ == "__main__":` therefore runs only when the file is run, not when it is imported.'
  - term: __init__.py
    definition: 'The file that marks a directory as a package and, by convention, defines the package''s public API by re-exporting names from its submodules, so callers can write `from wordstats import tokenize` without knowing which module tokenize lives in.'
  - term: sys.path
    definition: 'The ordered list of directories Python searches to find a module to import. For a `python3 -m` run the current directory comes first, followed by the standard library and installed-package locations; Python imports the first match it finds, which is why file names can shadow standard-library modules.'
  - term: module cache
    definition: 'The dictionary sys.modules holding every module already imported in the current process. Python checks it before searching sys.path, so a module is imported (and its top-level code run) only once no matter how many files import it; later imports reuse the cached object.'
  - term: absolute import
    definition: 'An import that names a module by its full path from the top of the package tree, such as `from wordstats.tokens import tokenize`. Preferred from outside a package because it is explicit and unambiguous about exactly which module is meant.'
  - term: relative import
    definition: 'An import that uses a leading dot to name a module relative to the current package, such as `from .tokens import tokenize` ("the tokens module in this same package"). Used between siblings inside a package; it works only when the file is imported as part of a package.'
  - term: circular import
    definition: 'A situation where two modules each import the other, so neither can finish loading — Python cannot complete module A while it waits on module B, which in turn waits on A. The fix is to keep dependencies pointing one way, or to extract the shared code into a third module both import.'
