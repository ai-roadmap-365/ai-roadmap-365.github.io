questions:
  - question: 'In Python, what exactly is a "module"?'
    options:
      - 'A function that is imported from the standard library'
      - 'A directory that contains an __init__.py file'
      - 'A single .py file you can import into another'
      - 'Any block of code inside an if __name__ == "__main__": guard'
    answer_index: 2
    explanation: 'A module is simply one .py file; its name is the filename without the extension. A directory of modules marked by __init__.py is a package, which is the next unit up, not a module.'

  - question: 'What turns an ordinary directory of .py files into an importable package?'
    options:
      - 'Naming the directory in all lowercase'
      - 'Adding a requirements.txt to the directory'
      - 'Running python3 -m on the directory once'
      - 'Including an __init__.py file'
    answer_index: 3
    explanation: 'An __init__.py marks a directory as a package and is the natural place to re-export the public API. The other options do nothing to make a directory importable as a package.'

  - question: 'You write `import wordstats.stats as st`. Which name do you then use to call `top_n`?'
    options:
      - 'st.top_n(...), because import-as binds the module under the alias st'
      - 'top_n(...) directly, because import-as brings the function into scope'
      - 'wordstats.top_n(...), ignoring the alias'
      - 'stats.top_n(...), because the alias applies only to the package'
    answer_index: 0
    explanation: '`import module as alias` binds the whole module under the alias, so you reach its contents as `st.top_n(...)`. To call `top_n` with no prefix you would need a from-import: `from wordstats.stats import top_n`.'

  - question: 'A module prints "loading" at its top level (outside any function). You import it three times in one program. How many times is "loading" printed, and why?'
    options:
      - 'Three times — each import re-runs the file'
      - 'Once — it is cached in sys.modules'
      - 'Three times — imports are not cached'
      - 'Zero times — top-level code never runs on import'
    answer_index: 1
    explanation: 'The first import runs the module top to bottom and stores it in the sys.modules cache; later imports return the cached module without re-running it. So top-level code runs exactly once per process.'

  - question: 'Inside a package, one module contains `from .tokens import tokenize`. What does the leading dot mean?'
    options:
      - 'It imports from the current working directory on disk'
      - 'It imports every name from tokens, like a wildcard'
      - 'A relative import: the tokens module in this package'
      - 'It is a syntax error in modern Python'
    answer_index: 2
    explanation: 'A leading dot marks a relative import — "the tokens module in this same package." Relative imports let siblings refer to each other without naming the whole package, which keeps the package movable.'

  - question: 'Running `python3 -m wordstats` from the wrong directory gives `ModuleNotFoundError`. What does that actually mean?'
    options:
      - 'Python only allows one module to be imported per program'
      - 'The wordstats files have been deleted from the disk'
      - 'The package has a syntax error that hides it'
      - 'Python searched sys.path and did not find the package'
    answer_index: 3
    explanation: 'ModuleNotFoundError means Python did not find the module on sys.path, not that the file is missing. For a -m run the current directory is searched first, so running from the directory that contains the package fixes it.'

  - question: 'Why put a program''s run behaviour behind `if __name__ == "__main__":`?'
    options:
      - 'So it can be run and imported, staying testable'
      - 'It is required or the file will not compile at all'
      - 'It hides the code from other developers'
      - 'It makes the program run faster'
    answer_index: 0
    explanation: 'When a file is run directly, its __name__ is "__main__" and the guarded code runs; when it is imported, __name__ is the module name and the guard is skipped. That lets you import the file''s functions for testing without launching the program.'

  - question: 'When should you split a single-file script into a package?'
    options:
      - 'Always, even for a ten-line throwaway script'
      - 'When responsibilities mix or you want to test a piece'
      - 'Never — one file is always simpler and better'
      - 'Only when the file exceeds exactly one thousand lines'
    answer_index: 1
    explanation: 'Mixed responsibilities, the need to reuse, and the need to test in isolation are the signals to split. A genuine throwaway script needs no package, and there is no magic line count — match the structure to what the program has earned.'
