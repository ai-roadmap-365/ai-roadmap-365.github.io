visuals:
  - id: orm-layers-architecture
    file: assets/orm-layers-architecture.svg
    type: diagram
    title: 'The SQLAlchemy stack: seven layers from a Python object down to a row, and what each one hands to the layer below'
    alt: 'Diagram: the seven layers between a domain object and a database row — your domain objects, declarative models, the Session with its identity map and unit of work, Core''s expression language, the engine and its connection pool, the DBAPI driver, and the database — with what each layer is responsible for and what it hands down, plus the return path that turns rows back into objects'
    description: 'A static architecture diagram drawn as a vertical stack of seven layers, each stating its responsibility and what it hands to the layer beneath. Layer one is your domain objects, a plain Python Member constructed with a name, which knows nothing about SQL and should not, and which hands down an object with attributes set and no identity yet. Layer two is the declarative models — the mapping itself — where a class extends Base and its attributes are declared with Mapped and mapped_column, establishing which class is which table, which attribute is which column, and which attribute is a relationship rather than a column; it hands down a mapped class plus one shared MetaData holding every Table it described. Layer three is the Session, drawn as the tallest box and labelled a unit of work: it holds the identity map of one object per primary key per session, tracks pending, dirty and deleted objects, and decides when work happens through autoflush before a query, flush on demand, and a commit that ends the transaction; it hands down an ordered batch of INSERT, UPDATE and DELETE sorted so foreign keys resolve, plus the SELECTs the queries asked for. Layer four is Core, the SQL expression language, with a select on Book.title filtered by copies, providing Table, MetaData, select, insert and update, and compiling an expression tree into SQL for one dialect with the values pulled out as bound parameters rather than pasted in; it hands down SQL text with question-mark or percent-s placeholders and a separate tuple of parameter values. Layer five is the engine and its connection pool, holding open connections so each unit of work does not pay to open one and owning the dialect that decided the SQL above; it hands down one checked-out DBAPI connection and its cursor. Layer six is the DBAPI driver calling cursor.execute or executemany, which hands down the statement at last. Layer seven, in green, is the database — rows, and only rows. A dashed green return path runs up the right-hand side from the database back to the Session, annotated that Core turns rows into tuples and the Session turns those into objects, checking the identity map first so a row you already hold returns the object you already have. Two blue brackets down the left edge mark layers two to three as the ORM and layers four to five as Core. Two yellow callouts sit on the right: one headed "Two layers, and the order matters", explaining that Core is a complete library on its own usable with no models and no Session, that the ORM cannot exist without Core because it emits its work as Core expressions, and that dropping down is normal; the other headed "echo=True taps here", noting that create_engine with echo set to True prints every statement at layer five with its parameters, that it is the best learning tool the library has, and that it is a data leak in production.'
  - id: unit-of-work-flow
    file: assets/unit-of-work-flow.svg
    type: flow-animated
    title: 'One Session''s lifetime: open, add, change, autoflush, commit, close — and the attribute access that then fails'
    alt: 'Diagram: one SQLAlchemy Session followed through six stages — opening with an empty identity map, an added object becoming pending, a loaded object becoming dirty, a query forcing an autoflush that emits an UPDATE and an INSERT before the SELECT that triggered it, the commit that ends the transaction and expires every attribute, and the close that detaches every object so reading one raises DetachedInstanceError — with the statement count under each stage reading zero, zero, zero, three, zero, zero'
    description: 'An animated flow diagram following a single Session through six stages laid out left to right along a marching-dash wire, readable in full as a still image. Stage one is open: constructing Session(engine) leaves the identity map empty, starts no transaction and takes no connection, and sends zero statements, because a Session is lazy about everything including this. Stage two is add: session.add(member) moves the object from transient to pending, member.id is still None because nobody has chosen it, and zero statements are sent — add() is a note to self, not an INSERT. Stage three is change: assigning book.copies leaves the object persistent but now dirty, the Session having noticed the attribute was set, and still zero statements are sent, because it was a plain assignment and no save() call exists. Stage four is autoflush: a query on the Session must be able to see your pending work, so the Session flushes first, and three statements are emitted of which you wrote one. Stage five is commit: the transaction ends, other connections can finally see the rows, every loaded attribute is now expired, and the member has been given id 7. Stage six is close: the object moves from persistent to detached, there is no session and therefore no connection, and reading member.name now raises because nothing is left to read. A row of chips beneath the stages tracks the state at each step — no objects yet, pending, persistent and dirty, persistent with id set, persistent but expired, and detached. A green panel headed "What the flush emitted at stage 4 — captured, not imagined" lists the three statements in the order they were actually sent: an UPDATE of books setting copies where books.id matches, an INSERT into members of name and email, and then the SELECT of members filtered by a LIKE on name. It notes that only the third line is the query you wrote, that the first two are your pending work flushed so the third could see it, and that the UPDATE went before the INSERT because the unit of work chose the order rather than you. A red panel headed "And then, at stage 6" shows the DetachedInstanceError text saying the Member is not bound to a Session and an attribute refresh operation cannot proceed, explains that commit expired it and close removed the connection that would have refreshed it, and gives the fix as expire_on_commit set to False. A footer reads the counts across the top row as zero, zero, zero, three, zero, zero, observes that an ORM does not spread its work evenly over the lines you wrote but saves it up and spends it all at once at a moment the unit of work picks, and concludes that this is why a query count rather than a stopwatch is the instrument that finds the problem; it then adds that a relationship raises a different DetachedInstanceError mentioning a lazy load operation of an attribute, which expire_on_commit will not fix because there was never a loaded value to keep, and which must be eager-loaded at stage four with selectinload or joinedload instead. A blue token travels the wire from stage one to stage six and each stage lights up in turn as it arrives, the flush panel is emphasised as the token reaches stage four and the error panel as it reaches stage six. A prefers-reduced-motion block disables every animation and restores the resting state, in which all six stages are shaded, the wire is a solid arrow, the token sits at stage one, and every label, statement and number is present.'
