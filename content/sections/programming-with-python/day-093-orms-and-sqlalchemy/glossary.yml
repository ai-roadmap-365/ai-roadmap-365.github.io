terms:
  - term: 'Object-relational mapping (ORM)'
    definition: 'A technique for moving data between a relational database and objects in a programming language, so that rows become instances and columns become attributes. The mapping is never one-to-one, and every difficulty an ORM has comes from the two sides disagreeing about identity, about lifecycle, and about when work happens. An ORM is not a way to avoid learning SQL — it is a way to stop writing the boring ninety per cent of it, which only works if you can read the ten per cent that matters.'
  - term: 'Object-relational impedance mismatch'
    definition: 'The collection of structural disagreements between the object model and the relational model. Identity: two objects with equal contents are two objects, while two rows with the same primary key are one row. Granularity: an object graph loaded in full may span a dozen tables. Associations: object references point one way and are directional, while a foreign key is a fact both sides can be queried through. Inheritance: the relational model has none, so a class hierarchy must be flattened into one table, split across several, or given a table per class. Lifecycle: an object exists when constructed, while a row exists when committed.'
  - term: 'Declarative model'
    definition: 'A Python class that both describes a table and is the type its rows are loaded into. In SQLAlchemy 2.0 it subclasses DeclarativeBase and declares its columns with Mapped annotations and mapped_column(). The 1.x declarative_base() factory and the Query object are legacy: they still work and you will meet them in old code, but nothing modern needs them.'
  - term: 'SQLAlchemy Core'
    definition: 'The lower of SQLAlchemy''s two layers: an SQL expression language with Table, MetaData, select(), insert() and update(), plus the engine, the dialects and the connection pool. It is a complete library on its own — you can use it with no models and no Session at all. Knowing the two layers are separate is what makes dropping from the ORM to Core a normal move rather than an admission of defeat.'
  - term: 'SQLAlchemy ORM'
    definition: 'The upper layer, built on Core: declarative models, relationships, and the Session. It does not bypass Core — it emits its work AS Core expressions, which is exactly why you can mix the two in one transaction without ceremony.'
  - term: 'Engine'
    definition: 'The object that owns a database URL, a dialect and a connection pool. Created once per application with create_engine(), not once per request — it is a factory and a pool, not a connection. Passing echo=True makes it print every statement it sends, with parameters, which is the single best learning tool the library has and a disclosure risk in production.'
  - term: 'Connection pool'
    definition: 'A set of already-open database connections the engine hands out and takes back, so that a unit of work does not pay the cost of opening one. For a server-backed database that cost is a network round trip and an authentication handshake, which is why pooling matters far more against PostgreSQL than against a local SQLite file.'
  - term: 'Session'
    definition: 'The ORM''s unit of work. It holds an identity map, tracks which objects are pending, dirty and deleted, decides when to flush that work to the database, and owns a transaction while it does. Nearly every confusing ORM error is really a question about which state an object is in, when the flush happened, or whether the Session that loaded the object is still open.'
  - term: 'Unit of work'
    definition: 'The pattern the Session implements: accumulate every change an operation makes, then write them all at once, in an order the pattern works out for you so that foreign keys resolve. It is why there is no save() method to call — you change objects, and the Session decides what SQL that implies and when to send it.'
  - term: 'Identity map'
    definition: 'A dictionary inside the Session mapping (class, primary key) to the one object representing that row. It guarantees that fetching row 1 twice in one Session returns the same Python object, which is what stops two copies of a row drifting apart and one edit silently overwriting the other. It also means a repeat lookup of an already-loaded row emits no SQL at all.'
  - term: 'Flush'
    definition: 'Sending the Session''s pending INSERT, UPDATE and DELETE statements to the database, inside the open transaction. After a flush the SQL has been executed and the database has assigned any generated keys — and no other connection can see any of it, because the transaction has not ended.'
  - term: 'Commit'
    definition: 'Ending the transaction, making everything flushed inside it visible to every other connection. commit() flushes first, so the two are often confused; they are different verbs and the difference is exactly one afternoon of debugging, exactly once. By default a commit also expires every loaded attribute, so the next read is fresh — which is the direct cause of the most common DetachedInstanceError.'
  - term: 'Autoflush'
    definition: 'The Session''s default behaviour of flushing pending changes before it runs any query, so the query can see work you have not committed yet. It is almost always what you want, and it is why SQL appears in the log at lines where you wrote no query. session.no_autoflush suspends it for a block; reach for that rarely and comment why.'
  - term: 'Object states'
    definition: 'The four conditions a mapped object can be in. Transient: constructed, in no Session, no row. Pending: added to a Session, still no row. Persistent: has a row and a Session, the normal working state. Detached: has a row but no Session, so anything needing the database — including refreshing an expired attribute or loading a lazy relationship — will fail. inspect(obj) reports which.'
  - term: 'Lazy loading'
    definition: 'The default strategy for a relationship: the related rows are not fetched until the attribute is touched, and touching it issues a SELECT then and there. It makes member.loans look like a list attribute when it is a query in disguise, which is convenient exactly until it is inside a loop.'
  - term: 'Eager loading'
    definition: 'Deciding in advance, per query, which related rows you will need, so they are fetched with the parent rather than one at a time. It is a per-relationship, per-query decision rather than a global setting, because whether you need a relationship depends on what the caller is about to do with it.'
  - term: 'N+1 problem'
    definition: 'Issuing one query to fetch N parent rows and then one more per parent to fetch its children — 1 + N queries where two would do. It is not a bug in the ORM; it is the direct consequence of a relationship attribute being a query in disguise. Nothing in the Python source hints at the cost, which is why you count statements rather than read code. It is also a denial-of-service vector: if a client controls the page size, a client controls how many queries your database runs.'
  - term: 'selectinload'
    definition: 'An eager-loading strategy that issues a second SELECT with an IN clause listing the parent keys. Two statements, always, whatever N is. No join, so no row duplication — which makes it the right default for a one-to-many collection.'
  - term: 'joinedload'
    definition: 'An eager-loading strategy that adds an OUTER JOIN to the same query. One statement, at the cost of repeating every parent column once per child row — in the lab, 24 rows returned to build 6 objects. Right for many-to-one, where each child has exactly one parent and no multiplication can occur; on a collection it requires .unique() on the result, and SQLAlchemy raises if you forget, because the driver really did return those duplicate rows.'
  - term: 'DetachedInstanceError'
    definition: 'The error raised when you touch an attribute of an object whose Session has closed. It has two distinct causes with two distinct fixes, and the message tells you which. "Attribute refresh operation cannot proceed" means commit() expired a loaded column and close() removed the connection that would refresh it — fix with expire_on_commit=False. "Lazy load operation of attribute" means a relationship was never loaded at all — expire_on_commit will not help, because there is nothing to keep; eager-load it while the Session is open instead.'
  - term: 'Secondary table'
    definition: 'The junction table behind a many-to-many relationship, passed to relationship() as secondary=. SQLAlchemy wants it as a Core Table rather than a mapped class precisely because it is not an entity — it carries nothing but the two foreign keys and has no identity worth talking about. The moment it acquires an attribute of its own it stops being secondary and becomes a mapped class, which is the Day 91 lesson restated in ORM terms.'
  - term: 'back_populates'
    definition: 'The declaration that two relationship attributes are the two directions of one relationship, so that appending to one side updates the other in Python before any SQL is emitted. Without it you get two independent relationships over the same foreign key, and the in-memory graph can disagree with itself until the next reload quietly resolves the argument.'
  - term: 'Cursor execution versus parameter set'
    definition: 'Two different numbers that a careless benchmark conflates. A cursor execution is one statement handed to the driver — the round-trip count, and what people mean by "number of queries". A parameter set is one row it carried: a single executemany is ONE execution carrying five hundred rows. Counting only executions makes a batched insert look free; counting only rows makes it look expensive. The lab records both.'
  - term: 'Session per request'
    definition: 'The standard lifecycle for a Session in a server: begin one at the start of a request, commit or roll back at the end, close it, and never share it between threads or requests. It matches a Session''s transaction to a unit of user intent. A global Session accumulates every object ever loaded and never lets go of a transaction; a Session per query throws away the identity map that makes the ORM worth having.'
