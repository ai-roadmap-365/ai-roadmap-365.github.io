questions:
  - question: 'You call `session.add(member)` and then, on the next line, print `member.id`. It prints `None`. Nothing has gone wrong. Why not?'
    options:
      - 'Because `add()` makes the object pending — it records an intention and emits no SQL, so nothing has assigned a key yet'
      - 'Because the primary key is only readable after `session.close()`'
      - 'Because SQLAlchemy assigns primary keys in Python and this one has not been generated yet'
      - 'Because `add()` failed silently and the object was never registered'
    answer_index: 0
    explanation: 'This is the first surprise every ORM hands a beginner, and it is worth being precise about. `add()` does exactly one thing: it moves the object from transient to pending, which means the Session has written down that it intends to insert this row. No statement is sent. The lab counts it and gets zero. The key is `None` because keys of this kind are chosen by the *database*, at INSERT time, and no INSERT has happened — `flush()` is what sends it, and the moment it does, `member.id` becomes 7 in the captured run. Option 1 has it backwards: after `close()` the object is detached and reading attributes is more likely to raise than to work. Option 2 is wrong for an autoincrement key, though it would be true if you used a client-side default such as a UUID — which is a genuine reason some teams prefer them, because the key exists before the row does. Option 3 is the wrong instinct: SQLAlchemy is loud about failures, and silence here is the design rather than a fault.'

  - question: 'A colleague says "flush and commit are basically the same thing — commit just also flushes". What is the difference that actually matters?'
    options:
      - 'Flush is faster because it batches, whereas commit sends one statement at a time'
      - 'Flush sends the SQL inside the open transaction; commit ends the transaction, which is what makes the rows visible to every other connection'
      - 'Flush writes to a Python-side cache and commit is what first sends SQL to the database'
      - 'They are identical in SQLite and differ only on PostgreSQL'
    answer_index: 1
    explanation: 'The distinction is a transaction question before it is an ORM question, and the lab makes it observable rather than arguing it: `demo_unit_of_work.py` opens a second, genuinely independent sqlite3 connection that SQLAlchemy knows nothing about, and asks it what it can see. After the flush, the INSERT has demonstrably been sent — you can read it in the statement log — and that outside connection still counts **7** members. After the commit it counts **8**. So flush is about *when the SQL goes*, and commit is about *when the world is allowed to know*. Option 2 is the most common wrong model and it is worth killing explicitly: a flush is not a cache write, it really does execute statements, which is why a constraint violation can be raised by a flush long before you commit. Option 0 has the batching backwards. Option 3 is wrong — this is what a transaction means everywhere, and SQLite is a full transactional database, not a simplified one.'

  - question: 'You load six members and loop over them reading `member.loans`. The query counter reports seven statements. What fixes it, and what count should you then expect?'
    options:
      - 'Add an index on `loans.member_id`; the count stays at 7 but each query is faster'
      - 'Wrap the loop in a transaction; the count drops to 1'
      - 'Eager-load the relationship with `selectinload(Member.loans)`; the count drops to 2 and stays at 2 however many members there are'
      - 'Call `session.flush()` before the loop; the count drops to 2'
    answer_index: 2
    explanation: 'Seven is 1 + 6: one query for the members, then one lazy load per member issued the first time `.loans` is touched. That is the N+1 problem, and the fix is to decide in advance that you need the relationship. `selectinload` issues a second SELECT with an IN clause listing the six member keys, so the total is 1 + 1 = 2 — and, critically, it is still 2 when there are 36 members, which the lab proves by running exactly that comparison: lazy goes 7 → 37 while eager stays 2 → 2. Option 0 is the seductive wrong answer, because it is genuinely good advice for a different problem: an index makes each of the seven queries cheaper and leaves you making seven round trips, and round trips are what hurt. Option 1 confuses transactions with round trips. Option 3 confuses flushing pending writes with loading related reads. `joinedload` would also fix it, at one statement rather than two — but that is a different trade, not a better one.'

  - question: 'Why does `joinedload` on a one-to-many collection require `.unique()` on the result, when `joinedload` on a many-to-one does not?'
    options:
      - 'Because `.unique()` is always required with `joinedload` and the many-to-one case merely tolerates its absence'
      - 'Because SQLAlchemy cannot sort a collection without it'
      - 'Because the identity map is disabled during a joinedload'
      - 'Because an OUTER JOIN to a collection returns one row per child, so six members with 24 loans come back as 24 rows that must be collapsed into 6 objects'
    answer_index: 3
    explanation: 'This is the concrete cost of `joinedload`, and the lab prints both numbers so it is arithmetic rather than assertion: the JOIN really returns **24 rows**, which collapse to **6 distinct Member objects**. Every member''s columns are repeated once per loan, and that duplication is paid in bytes over the wire — with a wide parent row and a large collection it is the whole reason `selectinload` exists. SQLAlchemy refuses to guess whether you wanted 6 objects or 24, so it raises `InvalidRequestError` naming `unique()`, which is one of the better error messages in the library. The many-to-one case needs no such call because each loan has exactly one book: no multiplication can occur, which is precisely why `joinedload` is the right tool there and the lab uses it for `Loan.book`. Option 2 is backwards — the identity map is what makes the collapse possible in the first place.'

  - question: 'You read `member.name` after the session closed and get `DetachedInstanceError: ... attribute refresh operation cannot proceed`. You add `expire_on_commit=False` and it works. You then read `member.loans` the same way, still get a `DetachedInstanceError`, and `expire_on_commit=False` does not help. Why not?'
    options:
      - 'Because relationships require `expire_on_commit=None` rather than `False`'
      - 'Because `expire_on_commit` only applies to the first attribute read after a commit'
      - 'Because the relationship was never loaded, so there is no retained value for the setting to preserve — it has to be fetched, and there is no session left to fetch it'
      - 'Because collections are always expired regardless of the setting'
    answer_index: 2
    explanation: 'These are two different failures wearing the same exception name, and telling them apart from the message is the single most useful diagnostic skill this day teaches. The column case: the value *was* loaded, `commit()` expired it so the next read would be fresh, and `close()` removed the connection that read needed. `expire_on_commit=False` fixes it by never throwing the value away. The relationship case is genuinely different: a lazy relationship is a SELECT waiting to happen, and it never happened. There is nothing to preserve, so preserving harder cannot help. The fix is to decide in advance — `selectinload(Member.loans)` while the session is open — which is the same eager-loading decision as the N+1 question, arriving from a different direction. Read the message: "attribute refresh operation cannot proceed" and "lazy load operation of attribute ''loans''" are pointing at the two different causes.'

  - question: 'What is the strongest reason to know that SQLAlchemy Core and the SQLAlchemy ORM are separate layers?'
    options:
      - 'Because Core is faster and should therefore be preferred for everything'
      - 'Because dropping from the ORM to Core for a bulk update or a gnarly report is a normal, supported move rather than an admission that the ORM failed'
      - 'Because they are separate installations and Core can be installed without the ORM'
      - 'Because Core queries bypass the connection pool and are therefore cheaper'
    answer_index: 1
    explanation: 'The layering is not trivia; it is what makes the honest advice possible. The ORM is built on Core and emits its work *as* Core expressions, so mixing them inside one transaction needs no ceremony — `session.execute(update(Loan)...)` sits happily beside object manipulation. That is what turns "the ORM is the wrong shape for this" from a defeat into a one-line change. It also explains the price: a Core UPDATE changes rows without loading them, so no Python-level default, validator or event of yours runs, because no object was ever created. That is a design decision to make deliberately. Option 0 overreaches, and this lesson''s own measurement is the reason: on SQLAlchemy 2.0.51 a batched ORM insert and a Core insert issue the *same* single cursor execution for 500 rows, so "Core is faster" is not what the counter shows for that case. Option 2 is factually wrong — they ship in one package. Option 3 is wrong: both go through the same engine and pool.'

  - question: 'Where should a Session begin and end in a web application, and why?'
    options:
      - 'One global Session created at startup and shared by every request, so the identity map is reused'
      - 'A new Session for each query, so nothing is ever stale'
      - 'One Session per request, begun at the start and committed or rolled back and closed at the end'
      - 'One Session per database table, so different tables never contend'
    answer_index: 2
    explanation: 'A Session is a unit of work, and the unit of work you want is the unit of user intent — which in a server is one request. Beginning one at the start and closing it at the end means the whole request either happens or does not, the identity map is warm for the duration, and nothing leaks into the next request. The two wrong answers fail in opposite directions and are worth naming. A **global** Session (option 0) never lets go: it accumulates every object ever loaded, holds a transaction open indefinitely, and is not safe to share between threads — its identity map becomes an unbounded cache that also blocks other writers. A Session **per query** (option 1) throws away the identity map that makes the ORM worth having, so the same row loaded twice becomes two objects that can disagree, and every object is detached the moment you try to use it — which is where most `DetachedInstanceError` reports actually come from. Option 3 misunderstands what a Session contends over: the transaction, not the table.'

  - question: 'The lesson measured 500 rows inserted three ways and reported: a flush per row costs 500 cursor executions, `add_all()` with one flush costs 1, and Core `insert()` costs 1. What is the honest conclusion?'
    options:
      - 'Core is dramatically fewer statements than the ORM, as usually claimed'
      - 'The big win is moving the flush out of the loop; on this version a batched ORM insert costs the same executions as Core, and Core''s advantage here is the Python objects it never builds'
      - 'Statement counting is unreliable and timings should be used instead'
      - 'The ORM should never be used for more than a handful of rows'
    answer_index: 1
    explanation: 'This is the day''s clearest case of the measurement beating the folklore, and it is reported that way rather than smoothed over. "Drop to Core for bulk inserts, it is far fewer queries" is repeated everywhere, and on SQLAlchemy 2.0.51 the counter does not support it: the unit of work batches the pending inserts into a single `executemany`, exactly as Core does, so both are one cursor execution carrying 500 parameter sets. The 500-to-1 gap is entirely about whether the `flush()` sits inside the loop. Core''s real advantage in the insert case is Python-side work the counter cannot see — no `Loan` instances constructed, nothing entering the identity map, no dependency graph to sort — which is a memory and CPU argument, and the lesson says so rather than dressing it up as a round-trip number it did not measure. Where Core genuinely wins on the count is the bulk **UPDATE**: the ORM must SELECT rows to change them and Core does not, so at 1013 matching rows it is 2 executions and 1013 objects against 1 execution and none. Option 2 draws the wrong lesson: the count was reliable — it was the folklore that was wrong, and the count is what exposed it.'
