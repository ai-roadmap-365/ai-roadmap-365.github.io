<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a mapper</title>
  <style>
    .orm-when-bg   { fill: #f8fafc; }
    .orm-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-when-row { opacity: 1; }
    .orm-when-r0 { animation-delay: 0.00s; }
    .orm-when-r1 { animation-delay: 0.45s; }
    .orm-when-r2 { animation-delay: 0.90s; }
    .orm-when-r3 { animation-delay: 1.35s; }
    .orm-when-r4 { animation-delay: 1.80s; }
    .orm-when-row { animation: orm-when-reveal 7.3s ease-in-out infinite; }
    @keyframes orm-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="orm-when-bg" width="980" height="390"/>
  <text class="orm-when-h1"  x="30" y="40">When to use a mapper</text>
  <text class="orm-when-sub" x="30" y="64">And when not to.</text>
  <rect class="orm-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="orm-when-name" x="46" y="122">Use one</text>
  <text class="orm-when-desc" x="46" y="142">Four cases.</text>
  <text class="orm-when-desc orm-when-row orm-when-r0" x="46" y="182">An application with many entities</text>
  <text class="orm-when-desc orm-when-row orm-when-r1" x="46" y="216">Lots of ordinary create and update code</text>
  <text class="orm-when-desc orm-when-row orm-when-r2" x="46" y="250">A team wanting one access pattern</text>
  <text class="orm-when-desc orm-when-row orm-when-r3" x="46" y="284">Migrations to manage</text>
  <text class="orm-when-desc orm-when-row orm-when-r4" x="46" y="318">Where object identity matters</text>
  <rect class="orm-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="orm-when-name" x="526" y="122">Do not</text>
  <text class="orm-when-desc" x="526" y="142">Also four.</text>
  <text class="orm-when-desc orm-when-row orm-when-r0" x="526" y="182">Analysis scripts</text>
  <text class="orm-when-desc orm-when-row orm-when-r1" x="526" y="216">Bulk loading — use the engine's tools</text>
  <text class="orm-when-desc orm-when-row orm-when-r2" x="526" y="250">Complex reporting queries</text>
  <text class="orm-when-desc orm-when-row orm-when-r3" x="526" y="284">Performance-critical paths</text>
  <text class="orm-when-desc orm-when-row orm-when-r4" x="526" y="318">Where the query is the interesting part</text>
  <text class="orm-when-sub" x="30" y="372">Bulk loading is worth calling out separately, since a mapper inserting a million rows one object at a time can be hundreds of times slower than the bulk path.</text>
</svg>
