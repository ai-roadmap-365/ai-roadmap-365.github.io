<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four jobs.">
  <title>What an object mapper does</title>
  <style>
    .orm-idea-bg   { fill: #f8fafc; }
    .orm-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .orm-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .orm-idea-stage { opacity: 1; }

    .orm-idea-s0 { animation-delay: 0.00s; }
    .orm-idea-e0 { animation-delay: 0.00s; }
    .orm-idea-s1 { animation-delay: 1.28s; }
    .orm-idea-e1 { animation-delay: 1.28s; }
    .orm-idea-s2 { animation-delay: 2.56s; }
    .orm-idea-e2 { animation-delay: 2.56s; }
    .orm-idea-s3 { animation-delay: 3.84s; }
    .orm-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .orm-idea-conn  { animation: orm-idea-trace 6.4s ease-in-out infinite; }
      .orm-idea-stage { animation: orm-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes orm-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes orm-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .orm-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .orm-idea-stage { animation: orm-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes orm-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="orm-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="orm-idea-bg" width="980" height="322"/>
  <text class="orm-idea-h1"  x="30" y="40">What an object mapper does</text>
  <text class="orm-idea-sub" x="30" y="64">Four jobs.</text>
  <g class="orm-idea-stage orm-idea-s0">
    <rect class="orm-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="orm-idea-step" x="44" y="142">01</text>
    <text class="orm-idea-name" x="70" y="142">Maps classes to tables and attributes to columns</text>
    <text class="orm-idea-desc" x="44" y="166">Declared once.</text>
  </g>
  <line class="orm-idea-line orm-idea-conn orm-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#orm-idea-tip)"/>
  <g class="orm-idea-stage orm-idea-s1">
    <rect class="orm-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="orm-idea-step" x="280" y="142">02</text>
    <text class="orm-idea-name" x="306" y="142">Builds statements from expressions in your language</text>
    <text class="orm-idea-desc" x="280" y="166">Rather than strings.</text>
  </g>
  <line class="orm-idea-line orm-idea-conn orm-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#orm-idea-tip)"/>
  <g class="orm-idea-stage orm-idea-s2">
    <rect class="orm-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="orm-idea-step" x="516" y="142">03</text>
    <text class="orm-idea-name" x="542" y="142">Tracks which object corresponds to which row</text>
    <text class="orm-idea-desc" x="516" y="166">So one row is one object.</text>
  </g>
  <line class="orm-idea-line orm-idea-conn orm-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#orm-idea-tip)"/>
  <g class="orm-idea-stage orm-idea-s3">
    <rect class="orm-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="orm-idea-step" x="752" y="142">04</text>
    <text class="orm-idea-name" x="778" y="142">And writes changed objects back on flush</text>
    <text class="orm-idea-desc" x="752" y="166">In dependency order.</text>
  </g>
  <text class="orm-idea-sub" x="30" y="304">Identity tracking is the feature that distinguishes a mapper from a query builder, and it is also the source of most of its surprising behaviour.</text>
</svg>
