<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 648" width="1060" height="648" role="img" aria-labelledby="d093f-title d093f-desc">
  <title id="d093f-title">One Session's lifetime: open, add, change, autoflush, commit, close — and the attribute access that then fails</title>
  <desc id="d093f-desc">An animated flow diagram following a single SQLAlchemy Session through six stages. The Session opens with an empty identity map and sends nothing. An added object becomes pending and still sends nothing. A loaded object is changed and becomes dirty, and still nothing is sent. A query then forces an autoflush, and the flush emits an UPDATE and an INSERT before the SELECT that triggered it, in an order the unit of work chose rather than the order the edits were made. The commit ends the transaction, making the rows visible to other connections and expiring every loaded attribute. The close detaches every object, and reading an attribute then raises DetachedInstanceError. A panel shows the three statements the flush actually emitted, and a second panel shows the error text with its two different fixes. A token travels the stages and each lights up in turn; with motion disabled every label, statement and number is still shown.</desc>

  <style>
    .d093f-bg     { fill: #f8fafc; }
    .d093f-title  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d093f-sub    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #334155; }
    .d093f-head   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .d093f-label  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d093f-small  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d093f-mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #1a202c; }
    .d093f-count  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #047857; }
    .d093f-warn   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b91c1c; }
    .d093f-state  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }

    .d093f-panel  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d093f-chip   { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.2; }
    .d093f-errbox { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d093f-sqlbox { fill: #dcfce7; stroke: #047857; stroke-width: 2; }

    /* Stages light up in order. The resting fill is the readable state. */
    .d093f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5;
                   animation: d093f-lift 8s ease-in-out infinite; }
    .d093f-s1 { animation-delay: 0.2s; }
    .d093f-s2 { animation-delay: 1.5s; }
    .d093f-s3 { animation-delay: 2.8s; }
    .d093f-s4 { animation-delay: 4.1s; }
    .d093f-s5 { animation-delay: 5.4s; }
    .d093f-s6 { animation-delay: 6.7s; }
    @keyframes d093f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      4%, 11%       { fill: #bfdbfe; }
    }

    /* The wire flows. Reduced motion turns it into a clean solid arrow. */
    .d093f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d093f-march 1.6s linear infinite; }
    @keyframes d093f-march { to { stroke-dashoffset: -18; } }

    /* A token travels the whole lifetime, resting visible at the first stage. */
    .d093f-token { fill: #1d4ed8; animation: d093f-travel 8s ease-in-out infinite; }
    @keyframes d093f-travel {
      0%   { transform: translateX(0); }
      6%   { transform: translateX(0); }
      94%  { transform: translateX(840px); }
      100% { transform: translateX(840px); }
    }

    /* The flush panel is emphasised as the token reaches the autoflush stage. */
    .d093f-sqlbox { animation: d093f-glow 8s ease-in-out infinite; }
    @keyframes d093f-glow {
      0%, 46%, 66%, 100% { stroke-width: 2; opacity: 0.92; }
      52%, 60%           { stroke-width: 4; opacity: 1; }
    }

    /* The error is emphasised last, once the session has closed. */
    .d093f-errbox { animation: d093f-alarm 8s ease-in-out infinite; }
    @keyframes d093f-alarm {
      0%, 82%, 100% { stroke-width: 2; opacity: 0.92; }
      88%, 96%      { stroke-width: 4; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d093f-stage  { animation: none; fill: #e0e7ff; }
      .d093f-wire   { animation: none; stroke-dasharray: none; }
      .d093f-token  { animation: none; transform: none; }
      .d093f-sqlbox { animation: none; stroke-width: 2; opacity: 1; }
      .d093f-errbox { animation: none; stroke-width: 2; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d093f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d093f-bg" x="0" y="0" width="1060" height="648" />
  <text class="d093f-title" x="34" y="40">One Session, from open to close — and where the SQL actually happens</text>
  <text class="d093f-sub" x="34" y="66">Five of the six stages send nothing at all. Everything arrives at stage 4, at a line that contains no query you wrote.</text>

  <!-- Spine -->
  <path class="d093f-wire" d="M 110 90 L 944 90" marker-end="url(#d093f-arrow)" />
  <circle class="d093f-token" cx="110" cy="90" r="9" />

  <!-- Stage 1 -->
  <rect class="d093f-stage d093f-s1" x="34" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="46" y="128">1 · open</text>
  <text class="d093f-mono" x="46" y="150">Session(engine)</text>
  <text class="d093f-small" x="46" y="174">identity map: empty</text>
  <text class="d093f-small" x="46" y="194">no transaction yet</text>
  <text class="d093f-small" x="46" y="214">no connection taken</text>
  <text class="d093f-count" x="46" y="244">0 statements</text>
  <text class="d093f-small" x="46" y="268">A Session is lazy about</text>
  <text class="d093f-small" x="46" y="282">everything, including this.</text>

  <!-- Stage 2 -->
  <rect class="d093f-stage d093f-s2" x="202" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="214" y="128">2 · add</text>
  <text class="d093f-mono" x="214" y="150">session.add(member)</text>
  <text class="d093f-small" x="214" y="174">transient → pending</text>
  <text class="d093f-small" x="214" y="194">member.id is None</text>
  <text class="d093f-small" x="214" y="214">nobody has chosen it</text>
  <text class="d093f-count" x="214" y="244">0 statements</text>
  <text class="d093f-small" x="214" y="268">add() is a note to self,</text>
  <text class="d093f-small" x="214" y="282">not an INSERT.</text>

  <!-- Stage 3 -->
  <rect class="d093f-stage d093f-s3" x="370" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="382" y="128">3 · change</text>
  <text class="d093f-mono" x="382" y="150">book.copies = 9</text>
  <text class="d093f-small" x="382" y="174">persistent, now dirty</text>
  <text class="d093f-small" x="382" y="194">the Session noticed</text>
  <text class="d093f-small" x="382" y="214">the attribute was set</text>
  <text class="d093f-count" x="382" y="244">0 statements</text>
  <text class="d093f-small" x="382" y="268">Plain assignment. No</text>
  <text class="d093f-small" x="382" y="282">save() call exists.</text>

  <!-- Stage 4 -->
  <rect class="d093f-stage d093f-s4" x="538" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="550" y="128">4 · autoflush</text>
  <text class="d093f-mono" x="550" y="150">session.scalars(</text>
  <text class="d093f-mono" x="550" y="166">  select(Member)…)</text>
  <text class="d093f-small" x="550" y="190">A query must see your</text>
  <text class="d093f-small" x="550" y="210">pending work, so the</text>
  <text class="d093f-small" x="550" y="230">Session flushes first.</text>
  <text class="d093f-count" x="550" y="256">3 statements ↓</text>
  <text class="d093f-small" x="550" y="278">You wrote one of them.</text>

  <!-- Stage 5 -->
  <rect class="d093f-stage d093f-s5" x="706" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="718" y="128">5 · commit</text>
  <text class="d093f-mono" x="718" y="150">session.commit()</text>
  <text class="d093f-small" x="718" y="174">transaction ends</text>
  <text class="d093f-small" x="718" y="194">other connections</text>
  <text class="d093f-small" x="718" y="214">can finally see it</text>
  <text class="d093f-warn" x="718" y="240">every attribute</text>
  <text class="d093f-warn" x="718" y="258">is now expired</text>
  <text class="d093f-small" x="718" y="280">member.id = 7</text>

  <!-- Stage 6 -->
  <rect class="d093f-stage d093f-s6" x="874" y="104" width="152" height="182" rx="8" />
  <text class="d093f-head" x="886" y="128">6 · close</text>
  <text class="d093f-mono" x="886" y="150">session.close()</text>
  <text class="d093f-small" x="886" y="174">persistent → detached</text>
  <text class="d093f-small" x="886" y="194">no session, and so</text>
  <text class="d093f-small" x="886" y="214">no connection either</text>
  <text class="d093f-warn" x="886" y="242">member.name</text>
  <text class="d093f-warn" x="886" y="260">now raises →</text>
  <text class="d093f-small" x="886" y="282">Nothing left to read.</text>

  <!-- State track -->
  <rect class="d093f-chip" x="34" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="110" y="316" text-anchor="middle">no objects yet</text>
  <rect class="d093f-chip" x="202" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="278" y="316" text-anchor="middle">pending</text>
  <rect class="d093f-chip" x="370" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="446" y="316" text-anchor="middle">persistent + dirty</text>
  <rect class="d093f-chip" x="538" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="614" y="316" text-anchor="middle">persistent, id set</text>
  <rect class="d093f-chip" x="706" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="782" y="316" text-anchor="middle">persistent, expired</text>
  <rect class="d093f-chip" x="874" y="298" width="152" height="26" rx="6" />
  <text class="d093f-state" x="950" y="316" text-anchor="middle">detached</text>

  <!-- The flush panel -->
  <rect class="d093f-sqlbox" x="34" y="348" width="616" height="176" rx="8" />
  <text class="d093f-head" x="50" y="374">What the flush emitted at stage 4 — captured, not imagined</text>
  <text class="d093f-mono" x="50" y="400">1.  UPDATE books SET copies=? WHERE books.id = ?</text>
  <text class="d093f-mono" x="50" y="422">2.  INSERT INTO members (name, email) VALUES (?, ?)</text>
  <text class="d093f-mono" x="50" y="444">3.  SELECT members.id, members.name, members.email</text>
  <text class="d093f-mono" x="50" y="462">      FROM members WHERE members.name LIKE ?</text>
  <text class="d093f-small" x="50" y="488">Only line 3 is the query you wrote. Lines 1 and 2 are your pending work,</text>
  <text class="d093f-small" x="50" y="506">flushed first so line 3 could see it — and the UPDATE went BEFORE the</text>
  <text class="d093f-small" x="50" y="518">INSERT, because the unit of work chose the order, not you.</text>

  <!-- The error panel -->
  <rect class="d093f-errbox" x="666" y="348" width="360" height="176" rx="8" />
  <text class="d093f-head" x="682" y="374">And then, at stage 6</text>
  <text class="d093f-warn" x="682" y="398">DetachedInstanceError</text>
  <text class="d093f-mono" x="682" y="420">&lt;Member&gt; is not bound to a</text>
  <text class="d093f-mono" x="682" y="438">Session; attribute refresh</text>
  <text class="d093f-mono" x="682" y="456">operation cannot proceed</text>
  <text class="d093f-small" x="682" y="480">commit() expired it; close() removed the</text>
  <text class="d093f-small" x="682" y="498">connection that would have refreshed it.</text>
  <text class="d093f-small" x="682" y="516">Fix: expire_on_commit=False.</text>

  <!-- Footer -->
  <text class="d093f-small" x="34" y="556">Read the counts across the top row: 0, 0, 0, 3, 0, 0. An ORM does not spread its work evenly over the lines you wrote — it saves it up and</text>
  <text class="d093f-small" x="34" y="576">spends it all at once, at a moment the unit of work picks. That is why a query count and not a stopwatch is the instrument that finds the problem.</text>
  <text class="d093f-small" x="34" y="602">A relationship raises a DIFFERENT DetachedInstanceError at stage 6 — "lazy load operation of attribute" — and expire_on_commit=False will</text>
  <text class="d093f-small" x="34" y="622">not fix that one, because there was never a loaded value to keep. Eager-load it at stage 4 instead, with selectinload or joinedload.</text>
</svg>
