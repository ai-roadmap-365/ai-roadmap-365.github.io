<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Lazy loading, and the query it hides</title>
  <style>
    .orm-lazy-bg   { fill: #f8fafc; }
    .orm-lazy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-lazy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-lazy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-lazy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-lazy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .orm-lazy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .orm-lazy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .orm-lazy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .orm-lazy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .orm-lazy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .orm-lazy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .orm-lazy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .orm-lazy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .orm-lazy-stage { opacity: 1; }

    .orm-lazy-s0 { animation-delay: 0.00s; }
    .orm-lazy-e0 { animation-delay: 0.00s; }
    .orm-lazy-s1 { animation-delay: 1.28s; }
    .orm-lazy-e1 { animation-delay: 1.28s; }
    .orm-lazy-s2 { animation-delay: 2.56s; }
    .orm-lazy-e2 { animation-delay: 2.56s; }
    .orm-lazy-s3 { animation-delay: 3.84s; }
    .orm-lazy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .orm-lazy-conn  { animation: orm-lazy-trace 6.4s ease-in-out infinite; }
      .orm-lazy-stage { animation: orm-lazy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes orm-lazy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes orm-lazy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .orm-lazy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .orm-lazy-stage { animation: orm-lazy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes orm-lazy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="orm-lazy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="orm-lazy-bg" width="980" height="322"/>
  <text class="orm-lazy-h1"  x="30" y="40">Lazy loading, and the query it hides</text>
  <text class="orm-lazy-sub" x="30" y="64">Four steps.</text>
  <g class="orm-lazy-stage orm-lazy-s0">
    <rect class="orm-lazy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="orm-lazy-step" x="44" y="142">01</text>
    <text class="orm-lazy-name" x="70" y="142">One query loads a collection of objects</text>
    <text class="orm-lazy-desc" x="44" y="166">Which looks efficient.</text>
  </g>
  <line class="orm-lazy-line orm-lazy-conn orm-lazy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#orm-lazy-tip)"/>
  <g class="orm-lazy-stage orm-lazy-s1">
    <rect class="orm-lazy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="orm-lazy-step" x="280" y="142">02</text>
    <text class="orm-lazy-name" x="306" y="142">A loop touches a related attribute on each</text>
    <text class="orm-lazy-desc" x="280" y="166">Which was not loaded.</text>
  </g>
  <line class="orm-lazy-line orm-lazy-conn orm-lazy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#orm-lazy-tip)"/>
  <g class="orm-lazy-stage orm-lazy-s2">
    <rect class="orm-lazy-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="orm-lazy-step" x="516" y="142">03</text>
    <text class="orm-lazy-name" x="542" y="142">So each access issues its own query</text>
    <text class="orm-lazy-desc" x="516" y="166">One query per row.</text>
  </g>
  <line class="orm-lazy-line orm-lazy-conn orm-lazy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#orm-lazy-tip)"/>
  <g class="orm-lazy-stage orm-lazy-s3">
    <rect class="orm-lazy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="orm-lazy-step" x="752" y="142">04</text>
    <text class="orm-lazy-name" x="778" y="142">Loading the relation eagerly collapses it back to one</text>
    <text class="orm-lazy-desc" x="752" y="166">Which is the fix.</text>
  </g>
  <text class="orm-lazy-sub" x="30" y="304">This pattern is the single most common performance failure in mapper-based applications, and it is invisible unless you look at the queries being issued.</text>
</svg>
