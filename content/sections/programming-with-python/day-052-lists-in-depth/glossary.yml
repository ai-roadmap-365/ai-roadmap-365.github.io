terms:
  - term: list
    definition: 'An ordered, mutable sequence of items written with square brackets, e.g. `[10, 20, 30]`; Python''s default container for holding several things in order, implemented under the hood as a dynamic array of references.'
  - term: index
    definition: 'The position of an item in a list, counted from zero: `nums[0]` is the first item. Indexing a list is O(1) because the items sit in one contiguous block and Python jumps straight to the slot.'
  - term: negative index
    definition: 'An index counted from the end of the list rather than the start: `-1` is the last item, `-2` the second-to-last, and so on — a convenient way to reach the back without knowing the length.'
  - term: slice
    definition: 'A sub-sequence taken with `list[start:stop:step]`, which returns a NEW list of the items from `start` (included) up to `stop` (excluded), stepping by `step`. Examples: `a[1:3]`, `a[::2]` (every other), `a[::-1]` (reversed).'
  - term: mutability
    definition: 'The property of being changeable after creation. Lists are mutable — you can add, remove, replace, or reorder items in place — which is powerful but also the source of aliasing and mutation-surprise bugs.'
  - term: append/extend
    definition: '`append(x)` adds a single item to the end of a list in place; `extend(other)` adds every item from another iterable to the end. Both mutate the list and return None. Appending is O(1) amortized.'
  - term: sort vs sorted
    definition: '`list.sort()` orders the list in place and returns None; `sorted(list)` returns a NEW sorted list and leaves the original untouched. Both accept a `key=` function and are stable. Confusing the two causes the `a = a.sort()` bug.'
  - term: aliasing
    definition: 'Two or more names referring to the same list object, created by plain assignment (`b = a`). A change made through one name is visible through the others, because there is only one underlying list.'
  - term: shallow copy
    definition: 'A copy that duplicates the outer list but shares the objects it references, made with `a[:]`, `list(a)`, or `a.copy()`. The two outer lists are independent, but nested lists are still shared between them.'
  - term: deep copy
    definition: 'A copy that duplicates a list and everything it contains, recursively, made with `copy.deepcopy(a)`. The result is fully independent — mutating a nested list in one does not affect the other.'
  - term: list method
    definition: 'A function attached to a list object and called with dot notation, such as `a.append()`, `a.sort()`, or `a.pop()`. Most list methods mutate the list in place; the ones that are not retrievals return None.'
  - term: dynamic array
    definition: 'The data structure underneath a Python list: a contiguous block of references that over-allocates a little spare capacity so most appends are instant, and grows by allocating a bigger block and copying references when the spare runs out.'
  - term: stable sort
    definition: 'A sort that preserves the original relative order of items that compare equal. Python''s sort (Timsort) is stable, which lets you sort by two keys in turn — sort by the minor key first, then the major key.'
  - term: membership test
    definition: 'Checking whether a value is in a list with `x in a`. On a list it scans item by item and costs O(n); sets and dictionaries offer O(1) membership when you test often.'
