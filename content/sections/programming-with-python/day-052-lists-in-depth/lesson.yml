title: 'Lists in Depth'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to work with Python lists fluently — index and slice them, tell in-place methods from functions that return new lists, reason about aliasing and shallow versus deep copies, sort with a key, nest lists into matrices, and choose the right operation for the performance you need — so your data code never suffers a silent mutation bug.'
objectives:
  - 'Index and slice a list with start, stop, and step, including negative indices, and predict every result by hand'
  - 'Distinguish in-place methods (append, extend, insert, remove, pop, sort, reverse) that mutate and return None from functions (sorted, reversed, slices) that return a new list'
  - 'Explain the reference model — a list as a dynamic array of references — and how aliasing (b = a) differs from a copy (a[:]), including shallow versus deep copy'
  - 'Sort a list with a key= function and rely on Python''s stable sort to break ties by input order'
  - 'Build and iterate nested lists (matrices), and flatten and deduplicate a list into a new list'
  - 'State the performance shape of lists — index and append cheap, insert/remove/membership O(n), append amortized O(1) — and connect the dynamic-array idea to why NumPy exists'
  - 'Apply the copy-before-you-mutate discipline to prevent silent data-corruption bugs in data and machine-learning code'
prerequisites:
  - 'Days 49-51 of this course: a first real program with functions and the main guard, conditionals and boolean logic, and loops and iteration patterns'
  - 'Comfort running a script from the terminal with `python3 file.py` and editing a text file'
reading_time_minutes: 40
