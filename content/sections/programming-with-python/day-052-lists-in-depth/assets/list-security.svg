<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three concerns.">
  <title>Lists and security</title>
  <style>
    .list-security-bg   { fill: #f8fafc; }
    .list-security-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-security-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-security-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-security-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-security-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-security-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-security-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .list-security-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .list-security-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .list-security-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .list-security-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .list-security-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .list-security-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .list-security-stage { opacity: 1; }

    .list-security-s0 { animation-delay: 0.00s; }
    .list-security-e0 { animation-delay: 0.00s; }
    .list-security-s1 { animation-delay: 1.50s; }
    .list-security-e1 { animation-delay: 1.50s; }
    .list-security-s2 { animation-delay: 3.00s; }
    .list-security-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .list-security-conn  { animation: list-security-trace 6s ease-in-out infinite; }
      .list-security-stage { animation: list-security-arrive 6s ease-in-out infinite; }
    }
    @keyframes list-security-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes list-security-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .list-security-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .list-security-stage { animation: list-security-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes list-security-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="list-security-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="list-security-bg" width="980" height="322"/>
  <text class="list-security-h1"  x="30" y="40">Lists and security</text>
  <text class="list-security-sub" x="30" y="64">Three concerns.</text>
  <g class="list-security-stage list-security-s0">
    <rect class="list-security-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="list-security-step" x="44" y="142">01</text>
    <text class="list-security-name" x="70" y="142">A list that grows on untrusted input</text>
    <text class="list-security-desc" x="44" y="166">Is a memory exhaustion vector.</text>
  </g>
  <line class="list-security-line list-security-conn list-security-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#list-security-tip)"/>
  <g class="list-security-stage list-security-s1">
    <rect class="list-security-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="list-security-step" x="359" y="142">02</text>
    <text class="list-security-name" x="385" y="142">A shared mutable list crosses trust boundaries</text>
    <text class="list-security-desc" x="359" y="166">One caller's change is another's surprise.</text>
  </g>
  <line class="list-security-line list-security-conn list-security-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#list-security-tip)"/>
  <g class="list-security-stage list-security-s2">
    <rect class="list-security-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="list-security-step" x="674" y="142">03</text>
    <text class="list-security-name" x="700" y="142">And a list holding secrets stays in memory</text>
    <text class="list-security-desc" x="674" y="166">Until it is overwritten or collected.</text>
  </g>
  <text class="list-security-sub" x="30" y="304">Bounding the size when accumulating from an external source is the practical control, and it is a single check in the accumulation loop.</text>
</svg>
