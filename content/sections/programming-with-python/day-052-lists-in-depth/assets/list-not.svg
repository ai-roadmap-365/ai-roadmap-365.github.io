<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things a list is not</title>
  <style>
    .list-not-bg   { fill: #f8fafc; }
    .list-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .list-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .list-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .list-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .list-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .list-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .list-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .list-not-row { opacity: 1; }
    .list-not-r0 { animation-delay: 0.00s; }
    .list-not-r1 { animation-delay: 0.45s; }
    .list-not-r2 { animation-delay: 0.90s; }
    .list-not-r3 { animation-delay: 1.35s; }
    .list-not-r4 { animation-delay: 1.80s; }
    .list-not-row { animation: list-not-reveal 7.3s ease-in-out infinite; }
    @keyframes list-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="list-not-bg" width="980" height="390"/>
  <text class="list-not-h1"  x="30" y="40">Four things a list is not</text>
  <text class="list-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="list-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="list-not-name" x="46" y="122">The misconception</text>
  <text class="list-not-desc" x="46" y="142">Commonly held.</text>
  <text class="list-not-desc list-not-row list-not-r0" x="46" y="182">A list is an array</text>
  <text class="list-not-desc list-not-row list-not-r1" x="46" y="216">Copying a list copies its contents</text>
  <text class="list-not-desc list-not-row list-not-r2" x="46" y="250">Membership testing is fast</text>
  <text class="list-not-desc list-not-row list-not-r3" x="46" y="284">Sorting returns a sorted list</text>
  <text class="list-not-desc list-not-row list-not-r4" x="46" y="318">A list as a default argument is safe</text>
  <rect class="list-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="list-not-name" x="526" y="122">What is true</text>
  <text class="list-not-desc" x="526" y="142">Actually.</text>
  <text class="list-not-desc list-not-row list-not-r0" x="526" y="182">It stores references, of mixed types</text>
  <text class="list-not-desc list-not-row list-not-r1" x="526" y="216">A slice is shallow; nested objects are shared</text>
  <text class="list-not-desc list-not-row list-not-r2" x="526" y="250">It scans linearly; a set does not</text>
  <text class="list-not-desc list-not-row list-not-r3" x="526" y="284">The method sorts in place and returns None</text>
  <text class="list-not-desc list-not-row list-not-r4" x="526" y="318">It is created once and shared across calls</text>
  <text class="list-not-sub" x="30" y="372">The mutable default argument is the language's most notorious trap, and it appears precisely because the default is evaluated once at definition time.</text>
</svg>
