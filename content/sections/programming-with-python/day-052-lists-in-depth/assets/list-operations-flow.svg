<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>A list-processing pipeline: build a list, slice it, sort it with a key, then transform it, with a branch showing in-place methods that change the list versus functions that return a new list</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">A list-processing pipeline: build → slice → sort → transform</text>

  <!-- Build -->
  <rect x="40" y="70" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="115" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Build</text>
  <text x="115" y="118" text-anchor="middle" font-size="14" fill="#1a202c">[] , append,</text>
  <text x="115" y="135" text-anchor="middle" font-size="14" fill="#1a202c">extend</text>

  <line x1="190" y1="103" x2="228" y2="103" stroke="#1a202c" stroke-width="2"/>
  <polygon points="228,103 216,97 216,109" fill="#1a202c"/>

  <!-- Slice -->
  <rect x="230" y="70" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="305" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Slice</text>
  <text x="305" y="118" text-anchor="middle" font-size="14" fill="#1a202c">a[start:stop:step],</text>
  <text x="305" y="135" text-anchor="middle" font-size="14" fill="#1a202c">a[-1], a[::2]</text>

  <line x1="380" y1="103" x2="418" y2="103" stroke="#1a202c" stroke-width="2"/>
  <polygon points="418,103 406,97 406,109" fill="#1a202c"/>

  <!-- Sort -->
  <rect x="420" y="70" width="150" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="495" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Sort</text>
  <text x="495" y="118" text-anchor="middle" font-size="14" fill="#1a202c">sorted(a, key=len),</text>
  <text x="495" y="135" text-anchor="middle" font-size="14" fill="#1a202c">stable order</text>

  <line x1="570" y1="103" x2="608" y2="103" stroke="#1a202c" stroke-width="2"/>
  <polygon points="608,103 596,97 596,109" fill="#1a202c"/>

  <!-- Transform -->
  <rect x="610" y="70" width="120" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="670" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Transform</text>
  <text x="670" y="118" text-anchor="middle" font-size="14" fill="#1a202c">dedupe,</text>
  <text x="670" y="135" text-anchor="middle" font-size="14" fill="#1a202c">flatten</text>

  <!-- The central question -->
  <line x1="380" y1="136" x2="380" y2="184" stroke="#1a202c" stroke-width="2"/>
  <polygon points="380,184 374,172 386,172" fill="#1a202c"/>
  <polygon points="380,196 500,246 380,296 260,246" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Change in place</text>
  <text x="380" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">or return new?</text>

  <!-- In-place branch (left) -->
  <text x="222" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">in place</text>
  <line x1="260" y1="246" x2="180" y2="246" stroke="#1a202c" stroke-width="2"/>
  <polygon points="180,246 192,240 192,252" fill="#1a202c"/>
  <rect x="30" y="316" width="150" height="86" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="105" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">In-place methods</text>
  <text x="105" y="362" text-anchor="middle" font-size="14" fill="#1a202c">a.sort(), a.append(),</text>
  <text x="105" y="380" text-anchor="middle" font-size="14" fill="#1a202c">a.reverse() — mutate a,</text>
  <text x="105" y="398" text-anchor="middle" font-size="14" fill="#1a202c">return None</text>
  <line x1="180" y1="246" x2="105" y2="246" stroke="#1a202c" stroke-width="2"/>
  <line x1="105" y1="246" x2="105" y2="314" stroke="#1a202c" stroke-width="2"/>
  <polygon points="105,314 99,302 111,302" fill="#1a202c"/>

  <!-- Return-new branch (right) -->
  <text x="545" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">return new</text>
  <line x1="500" y1="246" x2="580" y2="246" stroke="#1a202c" stroke-width="2"/>
  <line x1="580" y1="246" x2="655" y2="246" stroke="#1a202c" stroke-width="2"/>
  <line x1="655" y1="246" x2="655" y2="314" stroke="#1a202c" stroke-width="2"/>
  <polygon points="655,314 649,302 661,302" fill="#1a202c"/>
  <rect x="580" y="316" width="150" height="86" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="655" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">New-list functions</text>
  <text x="655" y="362" text-anchor="middle" font-size="14" fill="#1a202c">sorted(a), reversed(a),</text>
  <text x="655" y="380" text-anchor="middle" font-size="14" fill="#1a202c">a[:] — leave a intact,</text>
  <text x="655" y="398" text-anchor="middle" font-size="14" fill="#1a202c">hand back a new list</text>

  <text x="380" y="360" text-anchor="middle" font-size="15" fill="#1a202c">Know which one you</text>
  <text x="380" y="380" text-anchor="middle" font-size="15" fill="#1a202c">called — it decides</text>
  <text x="380" y="400" text-anchor="middle" font-size="15" fill="#1a202c">whether the original changes.</text>

  <text x="380" y="440" text-anchor="middle" font-size="14" fill="#1a202c">Copy before you mutate when the caller's list must be protected: result = a[:]</text>
</svg>
