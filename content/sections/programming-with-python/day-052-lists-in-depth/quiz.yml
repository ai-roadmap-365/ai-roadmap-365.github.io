questions:
  - question: 'Given `nums = [5, 10, 15, 20, 25]`, what does `nums[1:4]` evaluate to?'
    options:
      - '[5, 10, 15, 20]'
      - '[5, 10, 15]'
      - '[10, 15, 20, 25]'
      - '[10, 15, 20]'
    answer_index: 3
    explanation: 'A slice `start:stop` includes the start index and excludes the stop index, so `nums[1:4]` takes indices 1, 2, and 3 — the values 10, 15, and 20. That is three items, not four, because index 4 (the value 25) is excluded.'

  - question: 'What is the difference between `a.sort()` and `sorted(a)`?'
    options:
      - '`a.sort()` sorts in place and returns None; `sorted(a)` returns new'
      - 'They are identical; both return a new sorted list'
      - '`sorted(a)` sorts in place; `a.sort()` returns a copy'
      - '`a.sort()` only works on numbers, `sorted(a)` works on anything'
    answer_index: 0
    explanation: '`a.sort()` mutates the list in place and returns `None`, which is why `a = a.sort()` is a bug that leaves you holding `None`. `sorted(a)` builds and returns a brand-new sorted list while leaving the original `a` untouched.'

  - question: 'After `a = [1, 2, 3]; b = a; b.append(4)`, what is the value of `a`?'
    options:
      - '[1, 2, 3]'
      - '[1, 2, 3, 4]'
      - '[4, 1, 2, 3]'
      - 'None'
    answer_index: 1
    explanation: '`b = a` does not copy the list; it gives the one list a second name (aliasing). Both names refer to the same list object, so `b.append(4)` changes that single list and `a` is now `[1, 2, 3, 4]` too. To keep them independent, write `b = a[:]` or `b = list(a)`.'

  - question: 'Why is appending to a list described as "O(1) amortized" rather than simply "O(1)"?'
    options:
      - 'Because appending is actually always slow'
      - 'Because appending depends on the size of the item being added'
      - 'A list over-allocates, so most appends are instant but some resize'
      - 'Because the first append is free and the rest cost O(n)'
    answer_index: 2
    explanation: 'A list is a dynamic array with a little spare capacity reserved at the end. Most appends just drop a reference into a free slot (instant), but when the spare runs out Python allocates a bigger block and copies the references across. Averaged over many appends, that rare cost is small — "amortized O(1)."'

  - question: 'Which of these operations on a list is O(n) — its cost grows with the length of the list?'
    options:
      - 'Indexing `a[i]`'
      - 'Reading `len(a)`'
      - 'Appending `a.append(x)`'
      - 'Membership with `x in a`'
    answer_index: 3
    explanation: 'Membership testing scans the list item by item until it finds `x` or reaches the end, so it costs O(n). Indexing and `len` are O(1) (the block is contiguous and the length is stored), and appending is O(1) amortized. When you test membership often, a set or dictionary — O(1) membership — is the better tool.'

  - question: 'What does `sorted(words, key=len)` do, and why does Python''s stability matter here?'
    options:
      - 'Sorts by word length, stably'
      - 'Sorts the words alphabetically, ignoring length'
      - 'Removes words longer than a given length'
      - 'Sorts the letters inside each word'
    answer_index: 0
    explanation: 'The `key=len` argument tells `sorted` to order the words by the number `len(word)` computes for each, shortest first, without changing the words. Python''s sort (Timsort) is stable, so any words that tie on length stay in the order they appeared — which lets you sort by two keys in turn.'

  - question: 'A shallow copy of a nested list `grid = [[1, 2], [3, 4]]` is made with `shallow = grid[:]`. You then run `grid[0].append(99)`. What happens to `shallow`?'
    options:
      - '`shallow` is unaffected because it is a copy'
      - 'It also changes; inner lists are shared'
      - 'The program raises an error'
      - '`shallow` becomes `None`'
    answer_index: 1
    explanation: 'A shallow copy duplicates only the outer list; its slots still reference the *same* inner lists as the original. Mutating an inner list (`grid[0].append(99)`) therefore shows through both. To make the inner lists independent too, use `copy.deepcopy(grid)`.'

  - question: 'You write a function that must not change the list it is given. What is the correct pattern?'
    options:
      - 'Call `.sort()` and `.append()` directly on the argument'
      - 'Return the argument unchanged and hope the caller does not mind'
      - 'Copy the list first, then modify and return the copy'
      - 'Use a mutable default argument like `def f(items=[])`'
    answer_index: 2
    explanation: 'Copy at the boundary — `result = items[:]` (or `list(items)`) — then mutate and return the copy, leaving the caller''s list untouched. Mutating the argument directly is the silent-corruption bug this lesson warns about, and a mutable default argument (`items=[]`) is a separate classic trap because the one list is shared across calls.'
