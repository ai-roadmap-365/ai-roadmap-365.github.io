visuals:
  - id: list-memory-model
    file: assets/list-memory-model.svg
    type: diagram
    title: 'A list as a dynamic array of references'
    alt: 'Diagram: a Python list as a dynamic array of references, with aliasing sharing one list and a copy making a second list'
    description: 'Three panels. The top shows a variable `nums` referring to a contiguous block of slots (indices 0, 1, 2, plus spare capacity), each slot holding a reference (arrow) to a value object (10, 20, 30) — the dynamic-array model. The middle panel shows aliasing: names `a` and `b` both point to one shared list, so `b.append(4)` changes it for both. The bottom panel shows a copy: `c = a[:]` makes a second, independent outer list, with a note that a slice copy is shallow and still shares nested lists.'
  - id: list-operations-flow
    file: assets/list-operations-flow.svg
    type: flowchart
    title: 'A list-processing pipeline'
    alt: 'Flowchart: a list-processing pipeline — build, slice, sort, transform — branching on whether an operation changes the list in place or returns a new list'
    description: 'A left-to-right pipeline of four stages — Build ([], append, extend), Slice (start:stop:step, negative index, stride), Sort (sorted with key, stable order), and Transform (dedupe, flatten) — feeds a central decision: change the list in place or return a new one? The in-place branch lists a.sort(), a.append(), a.reverse() (mutate, return None); the new-list branch lists sorted(a), reversed(a), a[:] (leave the original intact). A footnote reminds the reader to copy before mutating when the caller''s list must be protected.'
