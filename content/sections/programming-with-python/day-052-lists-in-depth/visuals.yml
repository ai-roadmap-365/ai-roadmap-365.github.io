visuals:
  - id: list-memory-model
    file: assets/list-memory-model.svg
    type: diagram
    title: 'A list as a dynamic array of references'
    alt: 'Diagram: a Python list as a dynamic array of references, with aliasing sharing one list and a copy making a second list'
    description: 'Three panels. The top shows a variable `nums` referring to a contiguous block of slots (indices 0, 1, 2, plus spare capacity), each slot holding a reference (arrow) to a value object (10, 20, 30) — the dynamic-array model. The middle panel shows aliasing: names `a` and `b` both point to one shared list, so `b.append(4)` changes it for both. The bottom panel shows a copy: `c = a[:]` makes a second, independent outer list, with a note that a slice copy is shallow and still shares nested lists.'
  - id: list-operations-flow
    file: assets/list-operations-flow.svg
    type: flowchart
    title: 'A list-processing pipeline'
    alt: 'Flowchart: a list-processing pipeline — build, slice, sort, transform — branching on whether an operation changes the list in place or returns a new list'
    description: 'A left-to-right pipeline of four stages — Build ([], append, extend), Slice (start:stop:step, negative index, stride), Sort (sorted with key, stable order), and Transform (dedupe, flatten) — feeds a central decision: change the list in place or return a new one? The in-place branch lists a.sort(), a.append(), a.reverse() (mutate, return None); the new-list branch lists sorted(a), reversed(a), a[:] (leave the original intact). A footnote reminds the reader to copy before mutating when the caller''s list must be protected.'
  - id: list-idea
    file: assets/list-idea.svg
    type: diagram
    title: 'What a list is'
    alt: 'Diagram: the four defining properties of a list'
    description: 'A four-stage description of lists covering ordering, mutability, mixed types and dynamic sizing.'
  - id: slicing
    file: assets/slicing.svg
    type: diagram
    title: 'Slicing'
    alt: 'Diagram: the four properties of list slicing'
    description: 'A four-stage description of slicing covering the half-open range, the copy, negative indices and the step.'
  - id: inplace-new
    file: assets/inplace-new.svg
    type: diagram
    title: 'In place against returning new'
    alt: 'Diagram: methods that modify a list compared with functions that return a new one'
    description: 'A two-column comparison of in-place methods against functions returning new lists.'
  - id: list-costs
    file: assets/list-costs.svg
    type: diagram
    title: 'What each operation costs'
    alt: 'Diagram: the cost of four common list operations'
    description: 'A four-stage description of list operation costs covering indexing, appending, inserting at the front and membership testing.'
  - id: list-not
    file: assets/list-not.svg
    type: diagram
    title: 'Four things a list is not'
    alt: 'Diagram: four misconceptions about lists'
    description: 'A two-column comparison of misconceptions about lists against what is true.'
  - id: list-history
    file: assets/list-history.svg
    type: diagram
    title: 'Four steps for sequence types'
    alt: 'Diagram: the historical progression of sequence containers'
    description: 'A four-stage description of sequence history covering fixed arrays, dynamic arrays, the general list and specialised containers.'
  - id: filing-drawer
    file: assets/filing-drawer.svg
    type: diagram
    title: 'A drawer of numbered slots'
    alt: 'Diagram: adding to the end of an ordered set of slots compared with adding to the front'
    description: 'A two-column comparison of appending against inserting at the front.'
  - id: list-security
    file: assets/list-security.svg
    type: diagram
    title: 'Lists and security'
    alt: 'Diagram: three security concerns involving lists'
    description: 'A three-stage description of list security concerns covering unbounded growth, shared mutable state and sensitive contents.'
  - id: list-when
