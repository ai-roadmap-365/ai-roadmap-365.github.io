slug: exceptions-and-error-handling-strategy
title: 'Exceptions and Error Handling Strategy'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will treat error handling as a design decision rather than a syntax feature: you will read any traceback frame by frame, place handlers at the level that can actually decide, use try/except/else/finally for what each block is for, catch narrowly and never swallow, chain translated errors with raise ... from err so the cause survives, choose EAFP or LBYL for stated reasons, and build a retry decorator with backoff that gives up honestly.'
objectives:
  - 'Explain why error handling is a design problem, and compare return codes with raised exceptions by naming each strategy''s specific failure mode'
  - 'Describe what the interpreter does on a raise — constructing the exception, searching each frame for a matching handler, recording and abandoning frames that do not match — and read a real traceback in the correct order'
  - 'Use all four blocks of try/except/else/finally for their intended purpose, and state why finally still runs when the try block returns'
  - 'Navigate the built-in exception hierarchy, order except clauses specific-first, and explain why KeyboardInterrupt and SystemExit sit outside Exception'
  - 'Distinguish raise, raise X, and raise X from err, and read the difference between the implicit-context and direct-cause lines in a chained traceback'
  - 'Define a minimal custom exception and justify when one earns its place over a built-in'
  - 'Choose between EAFP and LBYL for a stated reason, including the race condition that makes an exists-then-open check insufficient'
  - 'Apply a placement strategy — fail fast at the boundary, propagate through the middle, handle where you can act — and log with logging.exception rather than print'
  - 'Build a retry decorator with exponential backoff from scratch, retry only errors a later attempt might survive, and re-raise with the cause chained'
prerequisites:
  - 'Day 64 and Day 65: reading and writing files, and CSV/JSON in the real world — the two days that generate the failures this lesson gives a policy to'
  - 'Day 58: functions returning functions — closures and decorators, which the retry helper is built from'
  - 'Day 63: designing a small program well — the pure core and thin shell this lesson places handlers within'
  - 'Days 51-57: control flow, collections, functions, modules, and the standard library'
  - 'Comfort running a script from the terminal with python3 and reading its exit code'
