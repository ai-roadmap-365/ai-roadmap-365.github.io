terms:
  - term: exception
    definition: 'An object a piece of code raises to say it cannot do the job it was asked to do. Unlike a return code it travels outward on its own, so ignoring it takes effort rather than inattention.'
  - term: raise
    definition: 'The statement that starts an exception on its journey. A bare raise inside a handler re-raises the exception currently being handled, with its traceback completely intact.'
  - term: return code
    definition: 'The older error strategy, still used throughout C and the operating system interfaces beneath Python: a function signals failure with a sentinel value such as -1 or NULL. Its failure mode is that nothing forces the caller to look.'
  - term: call stack
    definition: 'The chain of function calls currently in progress, each one a frame holding its own local variables and position in the code. A raised exception unwinds this chain outward, frame by frame.'
  - term: frame
    definition: 'One function call''s private workspace: its local variables and where it is in the code. When no handler in a frame matches, the interpreter records the frame in the traceback and abandons it.'
  - term: unwinding
    definition: 'The interpreter''s outward walk from the raising frame toward the top of the stack, asking each frame in turn whether it has a matching handler and running each abandoned frame''s finally block on the way.'
  - term: traceback
    definition: 'The call stack printed as text when an exception goes unhandled, one block per frame. Frames print outermost first and innermost last — hence "most recent call last" — so the useful lines are at the bottom.'
  - term: handler
    definition: 'An except clause plus its body. It matches if the raised exception is an instance of the named class or any subclass of it, and clauses are tested top to bottom, which is why specific types must come first.'
  - term: exception hierarchy
    definition: 'The tree of built-in exception classes rooted at BaseException. It is not trivia: it is the mechanism by which an except clause decides whether to fire, and it lets you catch at exactly the width you can act on.'
  - term: BaseException
    definition: 'The root of the hierarchy. SystemExit, KeyboardInterrupt, and GeneratorExit hang directly off it, deliberately outside Exception, because they are control-flow signals rather than errors.'
  - term: bare except
    definition: 'Writing "except:" with no type. It sits at BaseException level, so it catches Ctrl-C and sys.exit() along with everything else — which is why a program containing one inside a loop cannot be stopped from the keyboard. There is no situation in which it is correct.'
  - term: swallowing
    definition: 'Catching an exception and doing nothing useful with it, classically "except Exception: pass". It guarantees the program never crashes and guarantees it never tells you anything, which is how a pipeline reports success while producing half a dataset.'
  - term: else block
    definition: 'The part of a try statement that runs only when the try body raised nothing. It exists to keep the try block small, so an error raised by the success path can never be mistaken for one raised by the risky call.'
  - term: finally block
    definition: 'The part of a try statement that runs on every path out — normal completion, a handled exception, an exception travelling through, a break, or a return. It is the only construct that makes that promise, and the "with" statement is built on it.'
  - term: exception chaining
    definition: 'Keeping the original exception attached when a new one is raised during the handling of it. Introduced by PEP 3134 in Python 3.0, it is the difference between a log line that explains a failure and one that wastes an afternoon.'
  - term: __cause__
    definition: 'The attribute set by "raise X from err" — an explicit claim by the author that err caused X. The traceback prints "The above exception was the direct cause of the following exception".'
  - term: __context__
    definition: 'The attribute Python sets automatically when a new exception is raised while another is being handled, with no "from". The traceback prints "During handling of the above exception, another exception occurred", which reads as an accident rather than a decision.'
  - term: custom exception
    definition: 'An exception class you define yourself, in its minimal form a two-line class inheriting from Exception. It earns its place when callers need to catch your failure by name rather than guessing at the four built-in types your implementation happens to raise.'
  - term: EAFP
    definition: '"Easier to ask forgiveness than permission" — attempt the operation and handle the failure. Python''s default style, because it has one code path and no window between checking and acting.'
  - term: LBYL
    definition: '"Look before you leap" — test a precondition before acting. Genuinely better when the check is cheap and the failure common in a hot loop, or when a value must be validated for policy reasons rather than mechanical ones.'
  - term: race condition
    definition: 'A bug caused by time passing between two operations that were assumed to be simultaneous. It is the concrete argument against exists-then-open: the file can be deleted or made unreadable in the gap, so the handler is required regardless.'
  - term: fail fast
    definition: 'Validating at the boundary and stopping immediately when the program cannot do its job. A malformed input that reaches the middle of a program has already cost you the ability to report it clearly.'
  - term: retry with backoff
    definition: 'Attempting a failed operation again after a delay that grows with each attempt, capped at a fixed number of tries. Only worth doing for errors a later attempt might survive; retrying a deterministic failure just fails more slowly.'
  - term: jitter
    definition: 'A small random offset added to each retry delay so that many clients recovering from the same outage do not retry in lockstep and knock the service over again.'
  - term: logging.exception
    definition: 'The logging call that records a message plus the full chained traceback at ERROR level. It reads the exception currently being handled, so it is only ever called from inside an except block.'
  - term: contextlib.suppress
    definition: 'A context manager that discards the exception types you name. Functionally the same as "except X: pass" for a named X, but it makes the deliberateness syntactically obvious and cannot drift into a bare except. Never pass Exception to it.'
  - term: assert
    definition: 'A statement that raises AssertionError when its condition is false — and that is removed entirely when Python runs with -O. Use it for internal invariants and tests, never for validating anything a user or a file can supply.'
