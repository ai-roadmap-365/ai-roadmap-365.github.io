visuals:
  - id: exception-hierarchy
    file: assets/exception-hierarchy.svg
    type: diagram
    title: 'The built-in exception hierarchy'
    alt: 'Diagram: the Python built-in exception hierarchy drawn as a labelled tree, with BaseException at the root, the SystemExit, KeyboardInterrupt and GeneratorExit branch called out as sitting deliberately outside Exception, and Exception itself branching into ValueError, TypeError, LookupError with KeyError and IndexError beneath it, OSError with FileNotFoundError and PermissionError beneath it, ArithmeticError with ZeroDivisionError beneath it, and a custom exception of your own'
    description: 'A labelled tree of the built-in exception classes, drawn because the tree is the mechanism by which an except clause decides whether to fire: a clause matches the named class and every subclass beneath it. BaseException is the root. A dashed callout box holds SystemExit, KeyboardInterrupt, and GeneratorExit, which hang directly off BaseException beside Exception rather than under it — they are control-flow signals rather than errors, so a broad "except Exception" cannot trap a Ctrl-C, while a bare "except:" can and does. Under Exception sit the classes ordinary code raises: ValueError with JSONDecodeError beneath it, TypeError, LookupError with KeyError and IndexError, OSError with FileNotFoundError and PermissionError, ArithmeticError with ZeroDivisionError, and a custom exception such as RecordError defined by the reader.'
  - id: exception-unwinding-flow
    file: assets/exception-unwinding-flow.svg
    type: flowchart
    title: 'A raise unwinding three stack frames'
    alt: 'Diagram: how a raised exception unwinds the call stack — parse_record raises, finds no matching handler in its own frame and is abandoned, load_records is checked next and its except RecordError clause matches so the search stops and the handler runs, main is never reached by that exception, and an inset shows the try, except, else, finally execution order for both the raising and the non-raising path'
    description: 'Three stack frames stacked innermost-at-top, each paired with what the interpreter does when it reaches that frame. In frame 3, parse_record constructs and raises a RecordError; the frame has no matching handler, so it is recorded in the traceback and abandoned and the search moves outward. In frame 2, load_records has an "except RecordError as err" clause, so the search stops there, the handler runs, the exception travels no further, and the frame''s finally block still closes the file on the way out. Frame 1, main, is drawn greyed and dashed because this exception never reaches it — though a FileNotFoundError from open() would find no match in frame 2, unwind past it, and be caught in main instead: the same walk with a different match. A note explains what happens when no frame matches: the walk reaches the top, Python prints the collected frames as a traceback, and the process exits with status 1. An inset panel shows the execution order inside one try statement for both paths — try body then else then finally when nothing raised, and try body then except then finally when something did — with the reminder that finally runs on every path out, including a return or a break.'
