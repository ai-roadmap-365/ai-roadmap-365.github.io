questions:
  - question: 'A traceback fills your terminal. Which line do you read first, and why?'
    options:
      - 'The last line — it carries the exception type and message'
      - 'The "Traceback (most recent call last):" header, because it names the failing module'
      - 'The first line, because frames print innermost-first and the topmost frame is where the error happened'
      - 'Any line containing your own filename, because the standard library is never at fault'
    answer_index: 0
    explanation: 'Frames print outermost first and innermost last — that is exactly what "most recent call last" means. The final line gives the type and message (the what), the frame directly above it is where the raise happened (the where), and the frames above that are the call path (the how you got here). Reading top-down is the classic beginner error and leads people to blame whichever function happened to start the program.'

  - question: 'Why do KeyboardInterrupt and SystemExit sit outside Exception in the class hierarchy?'
    options:
      - 'Because they are raised by the operating system rather than by Python, and therefore cannot inherit from a Python class'
      - 'They are control-flow signals, so a broad except must not trap them'
      - 'Because they are deprecated and kept only for backward compatibility with Python 2'
      - 'Because they carry no message, and Exception requires every subclass to carry one'
    answer_index: 1
    explanation: 'You can verify the placement directly: issubclass(KeyboardInterrupt, Exception) returns False. The design lets a program put a broad "except Exception" at its top level to log and continue without swallowing the user pressing Ctrl-C or a call to sys.exit(). A bare "except:" sits at BaseException level and catches them all, which is precisely why a bare except inside a loop makes a program impossible to interrupt from the keyboard.'

  - question: 'A function opens a file inside a try block and returns a value from inside that same try block. When does the finally block run?'
    options:
      - 'It is skipped, because the return leaves the function before finally is reached'
      - 'Only if an exception was raised; a clean return bypasses it'
      - 'After the return value is evaluated, before the function returns'
      - 'Before the try block, as setup rather than cleanup'
    answer_index: 2
    explanation: 'This is the guarantee that makes finally worth having. Python evaluates the return expression, runs the finally block, and only then hands the value back to the caller. The same holds for break, for a handled exception, and for an unhandled one travelling through. It is also the mechanism the "with" statement is built on — "with open(...)" is a finally-close you did not have to write.'

  - question: 'You write "except ValueError:" above "except json.JSONDecodeError:". What happens?'
    options:
      - 'Both clauses fire, in order, so the error is handled twice'
      - 'The clauses are automatically reordered from most specific to least specific'
      - 'Python raises a SyntaxError at import time for the overlapping clauses'
      - 'It is unreachable: JSONDecodeError subclasses ValueError'
    answer_index: 3
    explanation: 'Except clauses are tested top to bottom, and a clause matches the named class or any of its subclasses. Since JSONDecodeError inherits from ValueError, the ValueError clause matches first and the specific one below it is dead code — silently, with no warning of any kind. The rule is absolute: specific first, general last.'

  - question: 'Why is "if os.path.exists(path): open(path)" insufficient, even though the check looks correct?'
    options:
      - 'Time passes between check and open, so it can change'
      - 'Because the check is slower than simply opening the file'
      - 'Because exists() cannot see files whose names contain non-ASCII characters'
      - 'Because os.path.exists returns True for directories as well as files'
    answer_index: 0
    explanation: 'This is a race condition. The check tells you the truth about a moment that has already ended by the time you act on it, so the handler is still required — and now the same failure has two code paths, only one of which anyone tests. That is the concrete argument behind Python''s preference for asking forgiveness rather than permission: one path, no race, and the failure is handled where it actually occurs.'

  - question: 'What is the difference between "raise RecordError(...) from err" and raising RecordError inside a handler without "from"?'
    options:
      - 'With "from", the original exception is discarded to keep the traceback short'
      - '"from" sets __cause__ and claims causation; without it, context'
      - 'Without "from", the original exception is lost entirely and cannot be recovered'
      - 'They are identical; "from" is a readability convention with no runtime effect'
    answer_index: 1
    explanation: 'Python tracks the relationship either way — nothing is lost without "from" — but it tells the reader two different stories. "During handling of the above exception, another exception occurred" means the two are related in time and Python does not know whether that was intentional; it is what you see when the second error is a bug in your handler. "The above exception was the direct cause of the following exception" is a statement you made on purpose, and it is the one you want whenever you are deliberately translating a low-level error into a meaningful one.'

  - question: 'Which statement about "assert" is correct?'
    options:
      - 'It is the recommended way to validate arguments that came from a file or a user'
      - 'It raises ValueError, which makes it interchangeable with an explicit raise'
      - 'It is removed entirely under -O, so the validation vanishes'
      - 'It runs only in test files and is ignored everywhere else'
    answer_index: 2
    explanation: 'Under -O the assertion is not merely skipped at runtime — it is not compiled into the program at all. A script whose assert fails with AssertionError under "python3 a.py" runs straight through and prints the invalid value under "python3 -O a.py". Validation that can vanish is not validation. Use assert for internal invariants you are documenting for yourself, and for tests; for anything a user or a file can cause, raise ValueError explicitly.'

  - question: 'Your retry decorator wraps a call that raises ValueError because a field says "high" where an integer belongs. What does retrying three times achieve?'
    options:
      - 'It gives the value time to be corrected upstream, which is why retries default to catching everything'
      - 'It succeeds roughly a third of the time, because the parser''s internal state is reset between attempts'
      - 'It converts the ValueError into a TimeoutError, which is easier to handle at the boundary'
      - 'Nothing but a slower failure — the input is unchanged'
    answer_index: 3
    explanation: 'A retry is a bet that conditions will differ next time. That bet is sound for a ConnectionError or a TimeoutError, which may well succeed 200 milliseconds later, and worthless for a deterministic failure on unchanged input. This is why the retry policy is expressed as a tuple of types rather than a blanket catch: retrying the wrong error wastes wall-clock time, and against a paid API it can be billed once per attempt.'
