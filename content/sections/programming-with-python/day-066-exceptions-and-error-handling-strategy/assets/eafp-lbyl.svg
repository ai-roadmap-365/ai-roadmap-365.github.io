<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two styles.">
  <title>Try it, or check first</title>
  <style>
    .eafp-lbyl-bg   { fill: #f8fafc; }
    .eafp-lbyl-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eafp-lbyl-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eafp-lbyl-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eafp-lbyl-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eafp-lbyl-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .eafp-lbyl-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eafp-lbyl-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .eafp-lbyl-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .eafp-lbyl-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .eafp-lbyl-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .eafp-lbyl-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .eafp-lbyl-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .eafp-lbyl-row { opacity: 1; }
    .eafp-lbyl-r0 { animation-delay: 0.00s; }
    .eafp-lbyl-r1 { animation-delay: 0.45s; }
    .eafp-lbyl-r2 { animation-delay: 0.90s; }
    .eafp-lbyl-r3 { animation-delay: 1.35s; }
    .eafp-lbyl-r4 { animation-delay: 1.80s; }
    .eafp-lbyl-row { animation: eafp-lbyl-reveal 7.3s ease-in-out infinite; }
    @keyframes eafp-lbyl-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="eafp-lbyl-bg" width="980" height="390"/>
  <text class="eafp-lbyl-h1"  x="30" y="40">Try it, or check first</text>
  <text class="eafp-lbyl-sub" x="30" y="64">Two styles.</text>
  <rect class="eafp-lbyl-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="eafp-lbyl-name" x="46" y="122">Try it and handle failure</text>
  <text class="eafp-lbyl-desc" x="46" y="142">The Python default.</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r0" x="46" y="182">Attempt the operation directly</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r1" x="46" y="216">Handle the exception if it fails</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r2" x="46" y="250">One operation, no race window</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r3" x="46" y="284">Cheap when failure is rare</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r4" x="46" y="318">Idiomatic in this language</text>
  <rect class="eafp-lbyl-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="eafp-lbyl-name" x="526" y="122">Check, then act</text>
  <text class="eafp-lbyl-desc" x="526" y="142">The alternative.</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r0" x="526" y="182">Test the precondition first</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r1" x="526" y="216">Then perform the operation</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r2" x="526" y="250">Two operations, with a gap between</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r3" x="526" y="284">Cheap when failure is common</text>
  <text class="eafp-lbyl-desc eafp-lbyl-row eafp-lbyl-r4" x="526" y="318">A race condition on files and shared state</text>
  <text class="eafp-lbyl-sub" x="30" y="372">The race window is the decisive argument for files: a file that exists when you check can be gone by the time you open it.</text>
</svg>
