<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each with one job.">
  <title>Four clauses</title>
  <style>
    .try-else-finally-bg   { fill: #f8fafc; }
    .try-else-finally-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .try-else-finally-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .try-else-finally-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .try-else-finally-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .try-else-finally-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .try-else-finally-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .try-else-finally-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .try-else-finally-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .try-else-finally-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .try-else-finally-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .try-else-finally-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .try-else-finally-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .try-else-finally-row { opacity: 1; }
    .try-else-finally-r0 { animation-delay: 0.00s; }
    .try-else-finally-r1 { animation-delay: 0.45s; }
    .try-else-finally-r2 { animation-delay: 0.90s; }
    .try-else-finally-r3 { animation-delay: 1.35s; }
    .try-else-finally-r4 { animation-delay: 1.80s; }
    .try-else-finally-row { animation: try-else-finally-reveal 7.3s ease-in-out infinite; }
    @keyframes try-else-finally-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="try-else-finally-bg" width="980" height="390"/>
  <text class="try-else-finally-h1"  x="30" y="40">Four clauses</text>
  <text class="try-else-finally-sub" x="30" y="64">Each with one job.</text>
  <rect class="try-else-finally-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="try-else-finally-name" x="46" y="122">The clause</text>
  <text class="try-else-finally-desc" x="46" y="142">What it holds.</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r0" x="46" y="182">try — the risky operation</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r1" x="46" y="216">except — the recovery</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r2" x="46" y="250">else — what runs only on success</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r3" x="46" y="284">finally — cleanup, always</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r4" x="46" y="318">Four distinct jobs</text>
  <rect class="try-else-finally-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="try-else-finally-name" x="526" y="122">When it runs</text>
  <text class="try-else-finally-desc" x="526" y="142">And why it matters.</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r0" x="526" y="182">Keep it as small as possible</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r1" x="526" y="216">Only for exceptions you can handle</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r2" x="526" y="250">Keeps success-path code out of the try</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r3" x="526" y="284">On every exit path, including a raise</text>
  <text class="try-else-finally-desc try-else-finally-row try-else-finally-r4" x="526" y="318">So the try stays narrow</text>
  <text class="try-else-finally-sub" x="30" y="372">Keeping the try block narrow is the practical rule: a wide try catches exceptions from lines you never meant to guard, hiding unrelated bugs.</text>
</svg>
