<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things exceptions are not</title>
  <style>
    .exception-not-bg   { fill: #f8fafc; }
    .exception-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exception-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exception-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exception-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exception-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exception-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exception-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exception-not-row { opacity: 1; }
    .exception-not-r0 { animation-delay: 0.00s; }
    .exception-not-r1 { animation-delay: 0.45s; }
    .exception-not-r2 { animation-delay: 0.90s; }
    .exception-not-r3 { animation-delay: 1.35s; }
    .exception-not-r4 { animation-delay: 1.80s; }
    .exception-not-row { animation: exception-not-reveal 7.3s ease-in-out infinite; }
    @keyframes exception-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exception-not-bg" width="980" height="390"/>
  <text class="exception-not-h1"  x="30" y="40">Four things exceptions are not</text>
  <text class="exception-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="exception-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exception-not-name" x="46" y="122">The misconception</text>
  <text class="exception-not-desc" x="46" y="142">Commonly held.</text>
  <text class="exception-not-desc exception-not-row exception-not-r0" x="46" y="182">Catching everything is defensive</text>
  <text class="exception-not-desc exception-not-row exception-not-r1" x="46" y="216">An exception means the program is broken</text>
  <text class="exception-not-desc exception-not-row exception-not-r2" x="46" y="250">Logging the error counts as handling it</text>
  <text class="exception-not-desc exception-not-row exception-not-r3" x="46" y="284">Exceptions are for errors only</text>
  <text class="exception-not-desc exception-not-row exception-not-r4" x="46" y="318">A bare except is a safe fallback</text>
  <rect class="exception-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exception-not-name" x="526" y="122">What is true</text>
  <text class="exception-not-desc" x="526" y="142">Actually.</text>
  <text class="exception-not-desc exception-not-row exception-not-r0" x="526" y="182">It hides bugs you needed to see</text>
  <text class="exception-not-desc exception-not-row exception-not-r1" x="526" y="216">Some are expected and recoverable</text>
  <text class="exception-not-desc exception-not-row exception-not-r2" x="526" y="250">Handling means deciding what happens next</text>
  <text class="exception-not-desc exception-not-row exception-not-r3" x="526" y="284">Iteration ends with one, by design</text>
  <text class="exception-not-desc exception-not-row exception-not-r4" x="526" y="318">It catches interrupts and system exits too</text>
  <text class="exception-not-sub" x="30" y="372">A bare except catching keyboard interrupts is the concrete harm: a program that cannot be stopped by the user is worse than one that crashes.</text>
</svg>
