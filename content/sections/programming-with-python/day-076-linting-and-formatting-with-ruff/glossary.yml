terms:
  - term: 'Linter'
    definition: 'A program that reads your source code without running it and reports patterns that are usually mistakes — an unused import, a variable assigned and never read, a mutable default argument. Named after Stephen Johnson''s `lint` for C in 1978, itself named after the fluff a dryer''s lint trap catches. A linter recognises shapes; it does not understand your problem.'
  - term: 'Formatter'
    definition: 'A program that rewrites your source into a canonical layout — quotes, whitespace, line breaks. It parses the code into a tree, discards your whitespace, and prints the tree back out by fixed rules, which is why it is trustworthy: it re-prints structure rather than editing text. It changes how code looks and never what it does.'
  - term: 'Static analysis'
    definition: 'Examining a program without executing it. Linters, formatters and type checkers are all static; a test suite is not. The trade is exact: static tools are fast and safe to run on every keystroke, and they are blind to anything that is only knowable at runtime.'
  - term: 'Rule code'
    definition: 'The short identifier attached to every linter finding, such as `F401` or `B006`. The letter prefix names the tool family the rule came from — `E`/`W` pycodestyle, `F` pyflakes, `I` isort, `B` bugbear, `SIM` simplify, `UP` pyupgrade, `N` naming, `S` bandit-style security — and the number identifies the rule within it. Select, ignore and suppress by code, never by the wording of the message.'
  - term: 'Autofix'
    definition: 'A machine-applicable rewrite that a linter can perform for you, applied with `ruff check --fix`. In a Ruff report, the `[*]` marker next to a finding means a fix is available and considered safe. Autofix is a convenience, not an authority: the interesting findings are deliberately left for a person.'
  - term: 'Safe fix'
    definition: 'An autofix the tool can argue preserves what the program does and discards nothing — no comment, no code you might have meant. Deleting an import that provably nothing references, or sorting an import block, is safe. These are what plain `--fix` applies.'
  - term: 'Unsafe fix'
    definition: 'An autofix that might change behaviour or discard something, so it is opt-in behind `--unsafe-fixes`. "Unsafe" does not mean "wrong": rewriting `basket=[]` into `basket=None` plus a guard is the correct fix precisely because it changes behaviour — the old behaviour was the bug. Preview with `--diff` before applying, and re-run your tests after.'
  - term: 'Suppression comment'
    definition: 'A comment that tells the linter to be quiet about one line, written `# noqa: F401 — reason`. Naming the code and the reason lets a reviewer check it in five seconds. A bare `# noqa` silences every rule on that line forever, including rules that did not exist when it was written and including security rules; Ruff''s `PGH004` flags those and `RUF100` flags suppressions that no longer suppress anything.'
  - term: 'Per-file ignore'
    definition: 'A configuration entry that relaxes specific rules for a pattern of files, written under `[tool.ruff.lint.per-file-ignores]`. The classic case is `"test_*.py" = ["S101"]`: `assert` is the mechanism of a test, so the security rule distrusting it is noise there and only there. Preferred to a global ignore, which stops the rule protecting the code where it still applied.'
  - term: 'Idempotence'
    definition: 'The property that applying an operation twice gives the same result as applying it once. For a formatter it means formatting already-formatted code changes nothing — the second `ruff format` run reports `1 file left unchanged`. It is what makes a formatter safe to put in a commit hook, because the hook cannot fight itself.'
  - term: 'Style guide'
    definition: 'A written document stating how code in a language or a project should be laid out and named. It is written for humans, contains judgement calls, and cannot be executed. A formatter implements one specific consistent interpretation of a subset of a style guide; the two are not substitutes.'
  - term: 'PEP 8'
    definition: 'The Style Guide for Python Code, introduced in 2001 and authored by Guido van Rossum, Barry Warsaw and Nick Coghlan. It gives Python its naming conventions (`snake_case`, `CapWords`, `UPPER_CASE`), four-space indentation, spacing and import-grouping rules — and it explicitly instructs you to break its own rules when following them would hurt readability. The `E` and `W` rule codes descend from a checker written against it.'
  - term: 'Import sorting'
    definition: 'Ordering and grouping import statements into standard library, third party and first party blocks, each alphabetised. Solved narrowly by the isort tool and reimplemented in Ruff as `I001`. Its real value is that it removes a whole category of pointless diff noise: two people adding an import no longer conflict over where it goes.'
  - term: 'Cyclomatic complexity'
    definition: 'A count of the independent paths through a function — roughly, one plus the number of branch points. Ruff exposes it as `C901`, which fails a function above a configured ceiling. It is a genuine signal that a function is doing too much, and it is also the rule most likely to fire on the one function that legitimately has to be complicated, which makes it a good example of a rule needing judgement rather than obedience.'
  - term: 'Pre-commit hook'
    definition: 'A program git runs before a commit is created, which can refuse the commit. The `pre-commit` framework manages these from a `.pre-commit-config.yaml` file naming hook repositories and the revisions they are pinned to. It is what makes "we run the formatter" true rather than aspirational — and because it downloads and executes those repositories, the pinned revision is a security decision.'
  - term: 'False positive'
    definition: 'A finding that is correct as a general rule and wrong for this particular code. False positives are unavoidable — a tool that is never wrong about anything is checking nothing interesting — and they are why suppression comments exist. The failure mode is not having them; it is leaving them on the screen undecided until the whole report becomes scenery.'
  - term: 'Abstract syntax tree'
    definition: 'The structured representation a parser builds from source text, in which `if match == None:` is a comparison node rather than a string of characters. Both halves of Ruff work on it: the formatter prints it back out with canonical whitespace, and the linter walks it asking each enabled rule''s question. Python exposes its own version through the standard-library `ast` module.'
