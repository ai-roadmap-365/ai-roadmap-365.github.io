questions:
  - question: 'A formatter and a linter both read your code without running it. What is the difference in what they decide?'
    options:
      - 'The formatter decides how the code looks; the linter flags patterns that are usually mistakes'
      - 'The formatter runs first and the linter re-runs the same rules with stricter settings'
      - 'The formatter checks correctness and the linter checks layout'
      - 'The formatter works on one file at a time and the linter works across the whole project'
    answer_index: 0
    explanation: 'The formatter owns appearance — quotes, spacing, line breaks — and has no opinion about whether the code is right. The linter owns patterns: an unused import, a mutable default argument, a comparison to None with ==. The lab demonstrates the split by running `ruff format` on the messy module and then re-linting it: B006 and both F401 findings survive the formatting untouched, because a formatter fixes no lint findings. Both are static; neither reads the whole project by nature.'

  - question: 'Ruff''s default rule selection reports five findings on the lab''s messy module, while `--select E,F,I,B,SIM,UP` reports ten. Why is B006 — the only real bug in the file — outside the default set?'
    options:
      - 'B006 is a formatter rule and only appears once `ruff format` has been run'
      - 'The default selection is deliberately small, so adoption is easy'
      - 'B006 requires type annotations, which the messy module does not have'
      - 'B006 is disabled by default because its fix is unsafe'
    answer_index: 1
    explanation: 'Ruff''s defaults are E4, E7, E9 and F — a small set chosen so a first run on an existing project does not print thousands of findings and get the tool uninstalled. Everything from the bugbear, simplify, pyupgrade and isort families is opt-in. That is a real design trade-off with a real cost: the one genuine defect in this file is invisible until you widen the selection, which is exactly why choosing your rule set is a decision rather than a default.'

  - question: 'In a Ruff report, `receipts.py:13:8: F401 [*] json imported but unused` carries a `[*]` and `B006` does not. What does the marker mean?'
    options:
      - 'The finding is a warning rather than an error'
      - 'The rule came from a third-party plugin rather than from Ruff itself'
      - 'Ruff has a fix for it that it considers safe, and `--fix` will apply it'
      - 'The finding appears more than once in the file'
    answer_index: 2
    explanation: 'The `[*]` marks a safe autofix — one Ruff can argue preserves behaviour and discards nothing. Its absence on B006 is the tool being correct: rewriting a mutable default changes what the program does, so it is classified unsafe and left behind `--unsafe-fixes`. Severity, rule origin and repetition are all shown elsewhere in the output, not by that marker.'

  - question: 'After `ruff check --fix --unsafe-fixes` rewrites `basket=[]` into `basket=None` plus a guard, one test fails. What is the correct response?'
    options:
      - 'Revert the fix, because a passing test suite is the definition of working code'
      - 'Delete the test, since the linter has now made it redundant'
      - 'Add `# noqa: B006` to the function and revert the fix'
      - 'Confirm the new behaviour is what you want, then rewrite the test to assert it'
    answer_index: 3
    explanation: 'That test was written to record the bug — it asserted `first is second`, which was true only because two callers shared one default list. The fix is correct, so the test is now wrong. The judgement Ruff cannot make for you is whether the new behaviour is the behaviour you want; once you have decided it is, you rewrite the assertion to `first is not second` and update the docstring. Reverting keeps the defect, suppressing hides it, and deleting the test throws away the coverage.'

  - question: 'What does it mean to say `ruff format` is idempotent, and what output demonstrates it?'
    options:
      - 'Formatting formatted code changes nothing on a second run'
      - 'It produces the same output on macOS, Linux and Windows'
      - 'It never changes behaviour, only appearance'
      - 'It can be undone with `ruff format --revert`'
    answer_index: 0
    explanation: 'Idempotence means applying the operation twice gives the same result as applying it once, and the visible proof is the second run reporting `1 file left unchanged`. That property is what makes a formatter safe in a commit hook, because the hook cannot end up fighting itself. Producing identical output everywhere is determinism — a different and also valuable property — and behaviour preservation is a third claim again. There is no revert flag; version control is the undo.'

  - question: 'Why is `import config  # noqa` worse than `import config  # noqa: F401 — re-exported for compatibility`?'
    options:
      - 'The bare form is slower for Ruff to parse'
      - 'The bare form silences every rule on that line, forever'
      - 'The bare form is ignored by Ruff entirely, so the finding still fires'
      - 'The bare form only works on the first line of a file'
    answer_index: 1
    explanation: 'A bare suppression is a permanent, unauditable blind spot: it covers every current rule on that line and every future one, security rules included. Naming the code and the reason narrows it to one rule and lets a reviewer verify it in seconds. Ruff can police this for you — `PGH004` flags blanket directives and `RUF100` flags suppressions that no longer suppress anything. Bare `# noqa` is honoured, not ignored, which is precisely the problem.'

  - question: 'A reference configuration has `select = ["E", "W", "F", "I", "B", "SIM", "UP", "N", "S"]` and `ignore = ["E501"]`. What is the defensible one-sentence justification for ignoring the line-length rule while selecting its whole family?'
    options:
      - 'E501 is a warning rather than an error, so it does not belong in a build gate'
      - 'E501 conflicts with the `S` family and cannot be enabled alongside it'
      - 'Once the formatter owns width, the rest are things it cannot split'
      - 'Line length is measured differently on Windows, so the rule is not portable'
    answer_index: 2
    explanation: 'This is the standard every ignore entry should meet: one sentence you would defend out loud. `ruff format` wraps everything it is permitted to wrap, so a surviving E501 is a single long literal or a URL, and hand-breaking those makes them less readable rather than more. Ruff''s own documentation recommends disabling E501 when the formatter is in use. An entry you cannot justify like this is a rule you should either obey or remove from `select`.'

  - question: 'What is the failure mode of a lint configuration with too many rule families enabled on an existing codebase?'
    options:
      - 'The tool becomes too slow to run in an editor'
      - 'Rules from different families contradict each other and the run never terminates'
      - 'Autofixes start applying to each other and corrupt the file'
      - 'A wall of findings teaches everyone that red is normal'
    answer_index: 3
    explanation: 'A configuration everyone has learned to ignore is worse than no linter at all: it costs the same to run, it fails builds for reasons nobody reads, and it makes a red check unremarkable. The defence is to keep the set small enough that a clean run means something, grow it one family at a time with a reason recorded next to each addition, and treat every persistent finding as a decision — fix it, suppress it with a reason, or remove the rule. Ruff is fast enough that speed is not the constraint, and it resolves rule interactions rather than looping.'
