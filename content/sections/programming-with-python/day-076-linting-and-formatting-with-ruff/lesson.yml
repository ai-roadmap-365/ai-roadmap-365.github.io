slug: linting-and-formatting-with-ruff
title: 'Linting and Formatting with Ruff'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to place four quality gates over a Python codebase and say exactly what each one proves: a formatter that decides how the code looks, a linter that flags suspicious patterns by rule code, a type checker that proves the type claims, and a test suite that checks behaviour. You will run Ruff as both formatter and linter, read a finding down to its rule code and column, tell a safe autofix from an unsafe one and know why the distinction exists, suppress a rule surgically instead of blanketly, write a pyproject.toml whose every entry you can defend in one sentence, and judge which rules are worth enabling — because a lint configuration everyone has learned to ignore is worse than no linter at all.'
objectives:
  - 'Distinguish the four static and dynamic gates — formatter, linter, type checker, test suite — by the question each answers and by one bug class that only it catches, and explain why no gate can do another gate''s job'
  - 'Explain what static analysis is, how a formatter reprints an abstract syntax tree rather than editing text, and what determinism and idempotence guarantee in practice'
  - 'Read a Ruff finding completely: file, line, column, rule-code prefix and its originating tool family (E/W pycodestyle, F pyflakes, I isort, B bugbear, SIM simplify, UP pyupgrade, N naming, S bandit-style security), and the [*] safe-fix marker'
  - 'Run ruff format and ruff check in their working, preview and continuous-integration forms (--diff, --check, --no-fix) and choose correctly between them'
  - 'Apply autofixes deliberately: use --fix for safe fixes, preview unsafe fixes with --diff before opting in with --unsafe-fixes, and recognise that a test failing after an unsafe fix is a human decision rather than a tool error'
  - 'Configure Ruff in pyproject.toml with select, ignore, extend-select and per-file-ignores, and justify every entry in one sentence — including why ignoring E501 is correct once a formatter owns line length'
  - 'Suppress a finding surgically with a noqa comment naming a specific code and a reason, explain why a bare noqa is a permanent unauditable blind spot, and name the rules that police suppression comments'
  - 'Judge which rule families are worth enabling for a given project, describe the failure mode of a configuration everyone ignores, and design an incremental adoption plan for an existing codebase'
  - 'Connect the mechanical gate to code review and to AI-assisted development: explain why a reviewer''s leverage moves from reading every line to owning the gate every line must pass, and why consistent formatting is what keeps diffs reviewable at volume'
prerequisites:
  - 'Day 61: writing readable code — PEP 8, meaningful names, small functions, docstrings and type hints. Today mechanises the judgements that lesson made by hand'
  - 'Days 71-74: pytest, writing tests that fail for the right reason, and running a suite from the terminal. The test suite is the evidence that the tools changed how the code reads and not what it does'
  - 'Day 75: type checking with mypy, which is the third of the four gates this lesson arranges'
  - 'Day 43: creating a virtual environment with python3 -m venv and installing a pinned dependency with pip'
  - 'Comfort reading a unified diff and editing a text file from the terminal'
