<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to leave.">
  <title>What to enforce</title>
  <style>
    .lint-when-bg   { fill: #f8fafc; }
    .lint-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lint-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lint-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lint-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lint-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lint-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lint-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lint-when-row { opacity: 1; }
    .lint-when-r0 { animation-delay: 0.00s; }
    .lint-when-r1 { animation-delay: 0.45s; }
    .lint-when-r2 { animation-delay: 0.90s; }
    .lint-when-r3 { animation-delay: 1.35s; }
    .lint-when-r4 { animation-delay: 1.80s; }
    .lint-when-row { animation: lint-when-reveal 7.3s ease-in-out infinite; }
    @keyframes lint-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lint-when-bg" width="980" height="390"/>
  <text class="lint-when-h1"  x="30" y="40">What to enforce</text>
  <text class="lint-when-sub" x="30" y="64">And what to leave.</text>
  <rect class="lint-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lint-when-name" x="46" y="122">Enforce</text>
  <text class="lint-when-desc" x="46" y="142">Four kinds.</text>
  <text class="lint-when-desc lint-when-row lint-when-r0" x="46" y="182">Formatting, automatically applied</text>
  <text class="lint-when-desc lint-when-row lint-when-r1" x="46" y="216">Likely-bug rules</text>
  <text class="lint-when-desc lint-when-row lint-when-r2" x="46" y="250">Unused imports and variables</text>
  <text class="lint-when-desc lint-when-row lint-when-r3" x="46" y="284">Import ordering</text>
  <text class="lint-when-desc lint-when-row lint-when-r4" x="46" y="318">Anything with an unambiguous fix</text>
  <rect class="lint-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lint-when-name" x="526" y="122">Leave advisory</text>
  <text class="lint-when-desc" x="526" y="142">Also four.</text>
  <text class="lint-when-desc lint-when-row lint-when-r0" x="526" y="182">Complexity thresholds</text>
  <text class="lint-when-desc lint-when-row lint-when-r1" x="526" y="216">Naming conventions with exceptions</text>
  <text class="lint-when-desc lint-when-row lint-when-r2" x="526" y="250">Docstring requirements on everything</text>
  <text class="lint-when-desc lint-when-row lint-when-r3" x="526" y="284">Line length in generated code</text>
  <text class="lint-when-desc lint-when-row lint-when-r4" x="526" y="318">Anything needing judgment</text>
  <text class="lint-when-sub" x="30" y="372">Enforcing only the unambiguous rules is what keeps the build trustworthy: a gate that fails on matters of taste gets disabled rather than obeyed.</text>
</svg>
