visuals:
  - id: static-analysis-architecture
    file: assets/static-analysis-architecture.svg
    type: diagram
    title: 'Four quality gates over one source file'
    alt: 'Diagram: one source file feeding four independent gates — a formatter that decides how the code looks, a linter that flags suspicious patterns, a type checker that proves the type claims, and a test suite that checks behaviour — each labelled with what it proves and what it cannot prove, all four reading their settings from one shared pyproject.toml'
    description: 'An architecture diagram. A single source file, receipts.py, fans out to four gate panels arranged left to right. The formatter panel (ruff format) decides how the code looks: it rewrites quotes, spacing and line breaks, deterministically and idempotently, and cannot tell you whether the code is right about anything. The linter panel (ruff check) flags suspicious patterns such as an unused import (F401) or a mutable argument default (B006), and cannot tell you whether the answer it computes is correct. The type checker panel (mypy, introduced on Day 75) proves that every call agrees with every annotation on every path, and cannot tell you whether a well-typed total is the right total. The test suite panel (pytest, Days 71 to 74) runs the code on real inputs and compares the answers, and cannot tell you about the inputs you never thought to try. Beneath the four panels a band names the bug class each one catches: an unreadable diff, a shared basket, cents passed as euros, and a tax rate of 21% where the law says 20%. Dashed lines run from all four panels down to a single pyproject.toml box holding the shared configuration: the tool.ruff table with line-length, target-version and extend-exclude; the tool.ruff.lint table with select, ignore and extend-select; a per-file-ignores table relaxing S101 for test files; and the format, mypy and pytest tables alongside them.'
  - id: lint-fix-flow
    file: assets/lint-fix-flow.svg
    type: flowchart
    title: 'The life of a lint finding'
    alt: 'Flowchart: a file moving through a linter — detect a finding, classify it by rule code, then take one of four routes (a safe automatic fix, an unsafe fix a human approves, a manual rewrite, or an explicit suppression comment naming the code), re-check, and arrive clean, with a separate continuous-integration branch where check mode fails the build instead of fixing anything'
    description: 'A flowchart in four stages. Stage one, detect: ruff check runs over receipts.py. Stage two, classify by rule code: each finding carries a code such as F401 unused-import or B006 mutable-argument-default, and a [*] marker means Ruff considers its fix safe. Stage three fans out to four exits. The safe autofix exit uses --fix, applied when Ruff can prove the rewrite preserves behaviour, as with F401 and I001. The unsafe fix exit previews with --diff and then applies --fix --unsafe-fixes, used when the rewrite may change what the program does and a human reads it and says yes, as with B006 and E711. The manual rewrite exit covers findings with no offered fix, or where the offered fix is wrong for this code, and the author edits both the file and the test that pinned the old behaviour. The suppression exit writes a noqa comment naming one code and giving a reason, with the warning that a bare noqa hides every rule including ones not yet written. All four exits converge on stage four: re-check and re-test with ruff check, ruff format and pytest, looping back to classification while findings remain, and otherwise arriving at a clean run reporting All checks passed. A side panel shows the continuous-integration branch, where ruff format --check and ruff check --no-fix edit nothing and exit 1 to fail the build instead. A second side panel states the one rule of the loop: run the test suite before and after every pass, because a green suite is the only evidence nothing moved.'
