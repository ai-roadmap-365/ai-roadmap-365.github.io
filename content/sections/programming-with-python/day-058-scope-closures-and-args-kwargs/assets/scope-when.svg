<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to reach outward</title>
  <style>
    .scope-when-bg   { fill: #f8fafc; }
    .scope-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scope-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scope-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scope-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scope-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scope-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scope-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scope-when-row { opacity: 1; }
    .scope-when-r0 { animation-delay: 0.00s; }
    .scope-when-r1 { animation-delay: 0.45s; }
    .scope-when-r2 { animation-delay: 0.90s; }
    .scope-when-r3 { animation-delay: 1.35s; }
    .scope-when-r4 { animation-delay: 1.80s; }
    .scope-when-row { animation: scope-when-reveal 7.3s ease-in-out infinite; }
    @keyframes scope-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scope-when-bg" width="980" height="390"/>
  <text class="scope-when-h1"  x="30" y="40">When to reach outward</text>
  <text class="scope-when-sub" x="30" y="64">And when not to.</text>
  <rect class="scope-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scope-when-name" x="46" y="122">Reach outward</text>
  <text class="scope-when-desc" x="46" y="142">Narrowly.</text>
  <text class="scope-when-desc scope-when-row scope-when-r0" x="46" y="182">Module-level constants, read only</text>
  <text class="scope-when-desc scope-when-row scope-when-r1" x="46" y="216">A deliberate memoisation cache</text>
  <text class="scope-when-desc scope-when-row scope-when-r2" x="46" y="250">A closure holding small state</text>
  <text class="scope-when-desc scope-when-row scope-when-r3" x="46" y="284">Framework-required patterns</text>
  <text class="scope-when-desc scope-when-row scope-when-r4" x="46" y="318">And document why, each time</text>
  <rect class="scope-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scope-when-name" x="526" y="122">Pass and return instead</text>
  <text class="scope-when-desc" x="526" y="142">Almost always.</text>
  <text class="scope-when-desc scope-when-row scope-when-r0" x="526" y="182">Anything the caller should know about</text>
  <text class="scope-when-desc scope-when-row scope-when-r1" x="526" y="216">Anything that needs testing</text>
  <text class="scope-when-desc scope-when-row scope-when-r2" x="526" y="250">Anything shared between modules</text>
  <text class="scope-when-desc scope-when-row scope-when-r3" x="526" y="284">Anything that changes</text>
  <text class="scope-when-desc scope-when-row scope-when-r4" x="526" y="318">Which is nearly everything</text>
  <text class="scope-when-sub" x="30" y="372">Reading module-level constants is the one uncontroversial case, and even there a name in capitals signals to the reader that it will not change.</text>
</svg>
