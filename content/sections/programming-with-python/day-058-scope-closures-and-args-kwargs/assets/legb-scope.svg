<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The LEGB name-resolution rule: to resolve a name Python searches the Local scope first, then the Enclosing function scope, then the Global module scope, then the Built-in scope, stopping at the first match — drawn as four nested boxes from innermost Local to outermost Built-in with a lookup arrow pointing outward</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">LEGB: how Python resolves a name</text>

  <!-- Built-in (outermost) -->
  <rect x="40" y="56" width="680" height="380" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="60" y="82" font-size="16" font-weight="bold" fill="#1a202c">B — Built-in scope</text>
  <text x="60" y="104" font-size="14" fill="#1a202c">names Python always provides: print, len, sum, range, max ...</text>

  <!-- Global -->
  <rect x="80" y="120" width="600" height="290" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="100" y="146" font-size="16" font-weight="bold" fill="#1a202c">G — Global (module) scope</text>
  <text x="100" y="168" font-size="14" fill="#1a202c">names defined at the top level of the file: DEFAULTS, functions ...</text>

  <!-- Enclosing -->
  <rect x="120" y="184" width="520" height="200" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="140" y="210" font-size="16" font-weight="bold" fill="#1a202c">E — Enclosing function scope</text>
  <text x="140" y="232" font-size="14" fill="#1a202c">names in an outer function: make_counter's count, step ...</text>

  <!-- Local (innermost) -->
  <rect x="160" y="248" width="440" height="118" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="10"/>
  <text x="180" y="274" font-size="16" font-weight="bold" fill="#1a202c">L — Local scope</text>
  <text x="180" y="296" font-size="14" fill="#1a202c">names inside the running function: parameters,</text>
  <text x="180" y="316" font-size="14" fill="#1a202c">and variables it assigns. Searched first.</text>
  <text x="180" y="344" font-size="14" font-weight="bold" fill="#1d4ed8">a name is looked up here first</text>

  <!-- outward lookup arrow -->
  <line x1="628" y1="307" x2="700" y2="307" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="700,307 686,300 686,314" fill="#1d4ed8"/>
  <text x="664" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">search</text>
  <text x="664" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">outward</text>

  <text x="380" y="458" text-anchor="middle" font-size="14" fill="#1a202c">Search L, then E, then G, then B; stop at the first match. If no scope has the name, raise NameError.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 628 307 L 700 307" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
