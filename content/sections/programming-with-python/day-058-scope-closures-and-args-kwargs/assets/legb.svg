<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levels.">
  <title>The lookup order</title>
  <style>
    .legb-bg   { fill: #f8fafc; }
    .legb-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legb-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legb-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legb-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legb-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .legb-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .legb-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .legb-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .legb-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .legb-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .legb-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .legb-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .legb-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .legb-stage { opacity: 1; }

    .legb-s0 { animation-delay: 0.00s; }
    .legb-e0 { animation-delay: 0.00s; }
    .legb-s1 { animation-delay: 1.28s; }
    .legb-e1 { animation-delay: 1.28s; }
    .legb-s2 { animation-delay: 2.56s; }
    .legb-e2 { animation-delay: 2.56s; }
    .legb-s3 { animation-delay: 3.84s; }
    .legb-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .legb-conn  { animation: legb-trace 6.4s ease-in-out infinite; }
      .legb-stage { animation: legb-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes legb-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes legb-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .legb-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .legb-stage { animation: legb-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes legb-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="legb-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="legb-bg" width="980" height="322"/>
  <text class="legb-h1"  x="30" y="40">The lookup order</text>
  <text class="legb-sub" x="30" y="64">Four levels.</text>
  <g class="legb-stage legb-s0">
    <rect class="legb-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="legb-step" x="44" y="142">01</text>
    <text class="legb-name" x="70" y="142">Local: names assigned in this function</text>
    <text class="legb-desc" x="44" y="166">Searched first.</text>
  </g>
  <line class="legb-line legb-conn legb-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#legb-tip)"/>
  <g class="legb-stage legb-s1">
    <rect class="legb-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="legb-step" x="280" y="142">02</text>
    <text class="legb-name" x="306" y="142">Enclosing: any function this one is nested inside</text>
    <text class="legb-desc" x="280" y="166">Which is what closures use.</text>
  </g>
  <line class="legb-line legb-conn legb-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#legb-tip)"/>
  <g class="legb-stage legb-s2">
    <rect class="legb-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="legb-step" x="516" y="142">03</text>
    <text class="legb-name" x="542" y="142">Global: names at the module's top level</text>
    <text class="legb-desc" x="516" y="166">Shared across the whole file.</text>
  </g>
  <line class="legb-line legb-conn legb-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#legb-tip)"/>
  <g class="legb-stage legb-s3">
    <rect class="legb-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="legb-step" x="752" y="142">04</text>
    <text class="legb-name" x="778" y="142">And built-in: the language's own names</text>
    <text class="legb-desc" x="752" y="166">Which is why shadowing one is</text>
    <text class="legb-desc" x="752" y="182">possible.</text>
  </g>
  <text class="legb-sub" x="30" y="304">Shadowing a built-in name is legal and quiet: assigning to a name like list or sum inside a function makes the original unavailable for the rest of it.</text>
</svg>
