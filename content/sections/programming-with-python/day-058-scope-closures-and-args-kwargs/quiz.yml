questions:
  - question: 'In what order does Python search scopes to resolve a name (the LEGB rule)?'
    options:
      - 'Global, Enclosing, Local, Built-in'
      - 'Local, Enclosing, Global, Built-in'
      - 'Built-in, Global, Enclosing, Local'
      - 'Local, Global, Built-in, Enclosing'
    answer_index: 1
    explanation: 'Python searches Local first (the running function), then Enclosing (an outer function), then Global (the module top level), then Built-in (names like print and len), stopping at the first match. If no scope has the name, it raises NameError.'

  - question: 'Why does `total = total + n` inside a function raise UnboundLocalError when a module-level `total` exists?'
    options:
      - 'Because `+` is not allowed between a global and a parameter'
      - 'Because module-level variables cannot be read inside functions at all'
      - 'Assigning to `total` makes it local, so reading it fails first'
      - 'Because functions must declare every variable they use'
    answer_index: 2
    explanation: 'An assignment to a name inside a function makes that name local for the whole function body. So `total` on the right-hand side refers to the not-yet-assigned local, not the global. Declaring `global total` (or passing it in and returning the result) fixes it.'

  - question: 'What is the difference between the `global` and `nonlocal` keywords?'
    options:
      - 'They are interchangeable; both rebind any outer variable'
      - '`global` works only in the main module; `nonlocal` works only in imported modules'
      - '`nonlocal` creates a new variable while `global` reads an existing one'
      - '`global` rebinds a module name; `nonlocal` an enclosing one'
    answer_index: 3
    explanation: '`global x` tells a function that `x` refers to the module-level `x`, so assignment updates it. `nonlocal x` tells a nested function that `x` refers to a variable in the enclosing function, so it can rebind that captured variable instead of shadowing it with a new local.'

  - question: 'A closure captures an enclosing variable. What exactly does it capture?'
    options:
      - 'The variable itself, so later changes are visible'
      - 'Nothing — it copies the function body only'
      - 'A frozen snapshot of the value at the moment the closure is created'
      - 'Only variables explicitly marked with `global`'
    answer_index: 0
    explanation: 'A closure captures the variable, not a frozen value. This is why building closures in a loop that all reference the loop variable makes them share its final value — the classic closure trap. To freeze a value, bind it as a default argument or use a factory.'

  - question: 'Given `def f(a, *args, sep="-", **kwargs)`, what does `f(1, 2, 3, sep="+", color="red")` bind?'
    options:
      - 'a=1, args=[2, 3], sep="-", kwargs={"color": "red", "sep": "+"}'
      - 'a=1, args=(2, 3), sep="+", kwargs={"color": "red"}'
      - 'a=1, args=(2, 3, "+"), kwargs={"color": "red"}'
      - 'a=1, args=(2, 3, "red"), sep="+", kwargs={}'
    answer_index: 1
    explanation: '`a` takes the first positional (1); `*args` gathers the remaining positionals into the tuple (2, 3); `sep` is keyword-only (it sits after *args) and gets "+"; and `**kwargs` gathers the leftover keyword argument into {"color": "red"}.'

  - question: 'How do you make an argument keyword-only, so it must be passed by name?'
    options:
      - 'Give it a default value of None'
      - 'Prefix its name with two underscores'
      - 'Place it after a bare `*` in the signature'
      - 'There is no way to force keyword-only arguments in Python'
    answer_index: 2
    explanation: 'Any parameter that appears after a bare `*` (or after a `*args` parameter) becomes keyword-only and can only be supplied by name. This keeps important options explicit and prevents a positional value from being mistaken for them.'

  - question: 'In `config = {**DEFAULTS, **kwargs}`, why do the caller''s values win over the defaults?'
    options:
      - 'Because kwargs is always alphabetically sorted after DEFAULTS'
      - 'Because ** only works on the last dictionary in the expression'
      - 'Because DEFAULTS is read-only and cannot overwrite anything'
      - 'Later keys overwrite earlier ones, and kwargs is spread last'
    answer_index: 3
    explanation: 'Spreading dictionaries into a new dict applies keys left to right, so a key appearing in a later dict overwrites the same key from an earlier one. Because `**kwargs` is spread after `**DEFAULTS`, the caller''s options override the defaults — the standard config-merge pattern.'

  - question: 'Why does `**kwargs` appear at the end of so many machine-learning function signatures?'
    options:
      - 'It forwards arbitrary options without listing every one'
      - 'It makes the function run faster by skipping argument checks'
      - 'It forces the caller to pass every option explicitly'
      - 'It is required syntax for any function that uses a neural network'
    answer_index: 0
    explanation: 'A high-level helper takes **kwargs and forwards them (with **kwargs) to the real model or training call, so generation and training options pass straight through and new options work without updating the wrapper. The risk is forwarding untrusted keys blindly, so real code often validates or allow-lists them.'
