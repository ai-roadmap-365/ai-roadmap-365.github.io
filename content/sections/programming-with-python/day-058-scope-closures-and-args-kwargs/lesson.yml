title: 'Scope, Closures, and *args/**kwargs'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to reason about where a name lives using the LEGB rule, use global and nonlocal deliberately, build closures that capture private state (counters and factories), and write flexible functions with *args, **kwargs, unpacking, and keyword-only arguments — the exact machinery ML and LLM libraries use to pass configuration and register callbacks.'
objectives:
  - 'Resolve any name with the LEGB rule (Local, Enclosing, Global, Built-in) and explain why assignment defaults to creating a local'
  - 'Use the global and nonlocal keywords to rebind outer names deliberately, and explain why mutating globals is usually the wrong default'
  - 'Build closures — inner functions that capture enclosing variables — and use them as factories and stateful helpers with private, remembered state'
  - 'Write functions with *args and **kwargs to accept any number of positional and keyword arguments, and unpack sequences and dicts with * and ** at call sites'
  - 'Define keyword-only arguments with a bare * so important options must be passed by name'
  - 'Explain how **kwargs underpins configuration in ML/LLM APIs and how closures underpin callbacks, hooks, and decorators, and forward arguments with *args/**kwargs'
prerequisites:
  - 'Day 57: defining functions, parameters and arguments, return values, and default arguments'
  - 'Days 50-56: conditionals and loops, lists, dictionaries, comprehensions, and building a small program'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
