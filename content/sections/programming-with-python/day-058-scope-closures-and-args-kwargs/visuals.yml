visuals:
  - id: legb-scope
    file: assets/legb-scope.svg
    type: diagram
    title: 'The LEGB name-resolution rule'
    alt: 'Diagram: the LEGB name-resolution rule — Local, Enclosing, Global, then Built-in scopes as nested boxes, searched from the inside out'
    description: 'Four nested boxes from innermost to outermost: Local (the running function''s parameters and assignments), Enclosing (an outer function''s variables), Global (the module top level), and Built-in (names Python always provides). A name is resolved by searching outward from Local and stopping at the first box that defines it; if none does, Python raises NameError.'
  - id: closure-capture-flow
    file: assets/closure-capture-flow.svg
    type: flowchart
    title: 'A closure capturing enclosing state'
    alt: 'Flowchart: a closure capturing an enclosing variable — make_counter creates a frame holding count, the inner counter captures it, make_counter returns, but the closure keeps count alive so each call updates the same value'
    description: 'Five steps: calling make_counter creates an enclosing frame holding count; the inner counter function captures a reference to count via nonlocal; make_counter returns counter and its frame would normally be discarded; but the closure keeps count alive in a captured cell; so each later call to counter reads and updates the same count, while a second make_counter call has its own independent count.'
  - id: scope-idea
    file: assets/scope-idea.svg
    type: diagram
    title: 'What scope decides'
    alt: 'Diagram: what a name''s scope determines'
    description: 'A four-stage description of scope covering the lookup, the isolation, the lifetime and the consequence.'
  - id: legb
    file: assets/legb.svg
    type: diagram
    title: 'The lookup order'
    alt: 'Diagram: the four scopes searched when resolving a name'
    description: 'A four-stage description of name resolution covering local, enclosing, global and built-in scopes.'
  - id: global-nonlocal
    file: assets/global-nonlocal.svg
    type: diagram
    title: 'Two escape hatches'
    alt: 'Diagram: the two keywords that let a function assign to an outer name'
    description: 'A four-stage description of the escape hatches covering the default, the global keyword, the nonlocal keyword and the recommendation.'
  - id: closures
    file: assets/closures.svg
    type: diagram
    title: 'Closures'
    alt: 'Diagram: how a closure captures its enclosing scope'
    description: 'A four-stage description of closures covering the inner function, the captured names, the survival and the late-binding trap.'
  - id: variadic
    file: assets/variadic.svg
    type: diagram
    title: 'Flexible arguments'
    alt: 'Diagram: how variadic parameters and unpacking work'
    description: 'A four-stage description of variadic arguments covering extra positional arguments, extra keyword arguments, unpacking and the use.'
  - id: scope-not
    file: assets/scope-not.svg
    type: diagram
    title: 'Four things scope is not'
    alt: 'Diagram: four misconceptions about scope'
    description: 'A two-column comparison of misconceptions about scope against what is true.'
  - id: scope-history
    file: assets/scope-history.svg
    type: diagram
    title: 'Four steps in scoping'
    alt: 'Diagram: the historical progression of variable scoping'
    description: 'A four-stage description of scoping history covering global names, local scopes, lexical nesting and explicit rebinding.'
  - id: nested-rooms
    file: assets/nested-rooms.svg
    type: diagram
    title: 'Rooms inside rooms'
    alt: 'Diagram: searching outward through nested spaces for a named item'
    description: 'A two-column comparison of searching outward against searching inward.'
  - id: scope-implications
