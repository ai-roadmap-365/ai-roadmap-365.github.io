visuals:
  - id: legb-scope
    file: assets/legb-scope.svg
    type: diagram
    title: 'The LEGB name-resolution rule'
    alt: 'Diagram: the LEGB name-resolution rule — Local, Enclosing, Global, then Built-in scopes as nested boxes, searched from the inside out'
    description: 'Four nested boxes from innermost to outermost: Local (the running function''s parameters and assignments), Enclosing (an outer function''s variables), Global (the module top level), and Built-in (names Python always provides). A name is resolved by searching outward from Local and stopping at the first box that defines it; if none does, Python raises NameError.'
  - id: closure-capture-flow
    file: assets/closure-capture-flow.svg
    type: flowchart
    title: 'A closure capturing enclosing state'
    alt: 'Flowchart: a closure capturing an enclosing variable — make_counter creates a frame holding count, the inner counter captures it, make_counter returns, but the closure keeps count alive so each call updates the same value'
    description: 'Five steps: calling make_counter creates an enclosing frame holding count; the inner counter function captures a reference to count via nonlocal; make_counter returns counter and its frame would normally be discarded; but the closure keeps count alive in a captured cell; so each later call to counter reads and updates the same count, while a second make_counter call has its own independent count.'
