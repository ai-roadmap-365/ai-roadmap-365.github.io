terms:
  - term: scope
    definition: 'The region of a program where a given name is visible and can be used. Python decides which variable a name refers to by searching scopes in a fixed order (the LEGB rule) and stopping at the first match.'
  - term: local (scope)
    definition: 'The innermost scope: the names inside the function currently running, including its parameters and any variables it assigns. Assigning to a name inside a function creates a local by default, keeping the function''s bookkeeping private.'
  - term: enclosing (scope)
    definition: 'The scope of an outer function that wraps a nested function. A nested function can read the enclosing function''s variables, and with nonlocal can rebind them — the mechanism behind closures.'
  - term: global (scope)
    definition: 'The top level of a module (a .py file): names defined outside any function, such as constants and function definitions. It is searched after local and enclosing scopes and before the built-in scope.'
  - term: built-in (scope)
    definition: 'The outermost scope, holding names Python always provides without any import — print, len, sum, range, max, and the rest. Every name search eventually reaches it, which is why these names work anywhere.'
  - term: LEGB rule
    definition: 'The order in which Python resolves a name: Local, then Enclosing, then Global, then Built-in, taking the first scope that defines the name. If no scope has it, Python raises NameError.'
  - term: global keyword
    definition: 'A statement (global name) inside a function declaring that a name refers to the module-level variable, so assigning to it updates the global rather than creating a new local. Used sparingly, because widely mutated globals make programs hard to reason about.'
  - term: nonlocal
    definition: 'A statement (nonlocal name) inside a nested function declaring that a name refers to a variable in the nearest enclosing function, so the inner function can rebind that captured variable instead of shadowing it with a new local. Central to stateful closures.'
  - term: closure
    definition: 'A nested function together with the enclosing variables it has captured, such that it keeps seeing and using those variables even after the enclosing function has returned. Used for factories, stateful helpers like counters, callbacks, and decorators.'
  - term: '*args'
    definition: 'A parameter written with one star that gathers all extra positional arguments into a tuple, letting a function accept any number of positional inputs. At a call site, one star spreads a sequence back out into positional arguments.'
  - term: '**kwargs'
    definition: 'A parameter written with two stars that gathers all extra keyword arguments into a dictionary, letting a function accept and forward arbitrary named options — the pattern ML and LLM libraries use to pass configuration. At a call site, two stars spread a dict into keyword arguments.'
  - term: keyword-only argument
    definition: 'A parameter that must be passed by name rather than by position, created by placing it after a bare * (or after *args) in the signature. It keeps important options explicit and prevents a positional value from being mistaken for them.'
