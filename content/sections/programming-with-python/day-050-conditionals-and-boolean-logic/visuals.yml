visuals:
  - id: boolean-logic-map
    file: assets/boolean-logic-map.svg
    type: diagram
    title: 'The boolean logic map'
    alt: 'Diagram: how comparison operators produce booleans that logical operators combine into a decision'
    description: 'A left-to-right system in three stages: comparison operators (==, !=, <, <=, >, >=, and chained comparisons) turn values into booleans; logical operators (and, or, not) combine those booleans, short-circuiting once the answer is known; and the result selects a branch (if/elif/else, or a ternary). Below the stages sit the three truth tables for and, or, and not, with a note on De Morgan''s law.'
  - id: decision-flow
    file: assets/decision-flow.svg
    type: flowchart
    title: 'Classifying a prediction: accept, review, or reject'
    alt: 'Flowchart: an if/elif/else path that classifies a model prediction into accept, review, or reject'
    description: 'A score and a verified flag enter at the top. A guard diamond checks that the input is valid (0.0 <= score <= 1.0); invalid input branches to an error printed on standard error with exit code 2. Valid input flows through a guard clause (score < 0.5 returns REJECT), then a combined test (score >= 0.9 and verified returns AUTO_ACCEPT), and finally falls through to REVIEW as the else. Each input takes exactly one path.'
  - id: truthy-or-present
    file: assets/truthy-or-present.svg
    type: diagram
    title: 'Empty and absent are different questions'
    alt: 'Diagram: testing truthiness compared with testing for None'
    description: 'A two-column comparison of a truthiness test against an explicit None check, covering the values each accepts and when each is correct.'
  - id: short-circuit-order
    file: assets/short-circuit-order.svg
    type: diagram
    title: 'Why the order of a compound condition matters'
    alt: 'Diagram: how short-circuit evaluation makes a compound condition safe'
    description: 'A four-stage explanation of short-circuit evaluation showing that and stops at the first falsy operand, which is what allows a guard and its use to sit in one expression.'
  - id: guard-or-nest
    file: assets/guard-or-nest.svg
    type: diagram
    title: 'A pyramid, or a list of rejections'
    alt: 'Diagram: nested conditionals compared with guard clauses'
    description: 'A two-column comparison of deeply nested conditional blocks against early-return guard clauses, covering indentation and how much a reader must hold in mind.'
  - id: chained-comparison
    file: assets/chained-comparison.svg
    type: diagram
    title: 'Chained comparisons mean what they look like'
    alt: 'Diagram: how Python evaluates a chained comparison'
    description: 'A three-stage explanation of chained comparison showing that Python expands it to an and-joined pair with the middle operand evaluated once.'
  - id: chain-or-dict
    file: assets/chain-or-dict.svg
    type: diagram
    title: 'A long elif chain wants to be a dictionary'
    alt: 'Diagram: an elif chain compared with a dictionary lookup'
    description: 'A two-column comparison of mapping values to results with a long conditional chain against using a dictionary lookup.'
  - id: fail-closed
    file: assets/fail-closed.svg
    type: diagram
    title: 'A permission decision must fail closed'
    alt: 'Diagram: failing open compared with failing closed in an authorisation check'
    description: 'A four-stage explanation of fail-closed authorisation logic, contrasting a default-allow structure with a default-deny one when an unanticipated case arrives.'
  - id: first-match-wins
    file: assets/first-match-wins.svg
    type: diagram
    title: 'Exactly one branch runs'
    alt: 'Diagram: how an if-elif-else chain selects a single branch'
    description: 'A four-stage explanation of conditional chain evaluation covering top-to-bottom testing, the first true branch winning, the remainder being skipped, and the role of else.'
  - id: named-predicate
    file: assets/named-predicate.svg
    type: diagram
    title: 'A condition that needs a comment wants a name'
    alt: 'Diagram: a complex inline condition compared with a named predicate function'
    description: 'A two-column comparison of a long inline boolean expression against extracting it into a named function, covering readability and testability.'
  - id: ternary-shape
    file: assets/ternary-shape.svg
    type: diagram
    title: 'When a conditional should be an expression'
    alt: 'Diagram: a conditional statement compared with a conditional expression'
    description: 'A two-column comparison of assigning a value with an if statement against using a conditional expression, and the point at which the expression form stops being clearer.'
