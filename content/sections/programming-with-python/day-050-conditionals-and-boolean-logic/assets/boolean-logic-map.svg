<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, sans-serif">
  <title>How comparison operators produce booleans that logical operators combine into a decision</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The boolean logic map</text>

  <!-- Stage 1: comparisons produce booleans -->
  <rect x="30" y="60" width="210" height="200" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="135" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Comparisons</text>
  <text x="135" y="108" text-anchor="middle" font-size="14" fill="#1a202c">produce a boolean</text>
  <text x="50" y="140" font-size="14" fill="#1a202c">score == 0.9   equal</text>
  <text x="50" y="164" font-size="14" fill="#1a202c">score != 0.9   not equal</text>
  <text x="50" y="188" font-size="14" fill="#1a202c">score &lt; 0.5     less than</text>
  <text x="50" y="212" font-size="14" fill="#1a202c">score &gt;= 0.9   at least</text>
  <text x="50" y="236" font-size="14" fill="#1a202c">0.5 &lt;= s &lt; 0.9  chained</text>

  <!-- Stage 2: logical operators combine booleans -->
  <rect x="275" y="60" width="210" height="200" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Logical operators</text>
  <text x="380" y="108" text-anchor="middle" font-size="14" fill="#1a202c">combine booleans</text>
  <text x="295" y="140" font-size="14" fill="#1a202c">A and B  both true</text>
  <text x="295" y="164" font-size="14" fill="#1a202c">A or B   at least one</text>
  <text x="295" y="188" font-size="14" fill="#1a202c">not A    flips it</text>
  <text x="295" y="220" font-size="13" fill="#1d4ed8" font-weight="bold">short-circuit: stop early</text>
  <text x="295" y="240" font-size="13" fill="#1a202c">once the answer is known</text>

  <!-- Stage 3: outcome -->
  <rect x="520" y="60" width="210" height="200" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="625" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Branch</text>
  <text x="625" y="108" text-anchor="middle" font-size="14" fill="#1a202c">choose one path</text>
  <text x="540" y="140" font-size="14" fill="#1a202c">if  &#8594; one block</text>
  <text x="540" y="164" font-size="14" fill="#1a202c">elif &#8594; another</text>
  <text x="540" y="188" font-size="14" fill="#1a202c">else &#8594; the rest</text>
  <text x="540" y="220" font-size="13" fill="#1a202c">ternary: value chosen</text>
  <text x="540" y="240" font-size="13" fill="#1a202c">inline in one line</text>

  <!-- Arrows between stages -->
  <line x1="240" y1="160" x2="272" y2="160" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="280,160 266,153 266,167" fill="#1d4ed8"/>
  <line x1="485" y1="160" x2="517" y2="160" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="525,160 511,153 511,167" fill="#1d4ed8"/>

  <!-- Truth tables -->
  <text x="380" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The three truth tables (T = True, F = False)</text>

  <!-- and table -->
  <rect x="60" y="326" width="180" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="150" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">and</text>
  <text x="80" y="372" font-size="14" fill="#1a202c">A</text>
  <text x="130" y="372" font-size="14" fill="#1a202c">B</text>
  <text x="190" y="372" font-size="14" fill="#1a202c">A and B</text>
  <text x="80" y="396" font-size="14" fill="#1a202c">T</text><text x="130" y="396" font-size="14" fill="#1a202c">T</text><text x="205" y="396" font-size="14" fill="#1a202c">T</text>
  <text x="80" y="418" font-size="14" fill="#1a202c">T</text><text x="130" y="418" font-size="14" fill="#1a202c">F</text><text x="205" y="418" font-size="14" fill="#1a202c">F</text>
  <text x="80" y="440" font-size="14" fill="#1a202c">F</text><text x="130" y="440" font-size="14" fill="#1a202c">T</text><text x="205" y="440" font-size="14" fill="#1a202c">F</text>
  <text x="80" y="462" font-size="14" fill="#1a202c">F</text><text x="130" y="462" font-size="14" fill="#1a202c">F</text><text x="205" y="462" font-size="14" fill="#1a202c">F</text>

  <!-- or table -->
  <rect x="290" y="326" width="180" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="380" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">or</text>
  <text x="310" y="372" font-size="14" fill="#1a202c">A</text>
  <text x="360" y="372" font-size="14" fill="#1a202c">B</text>
  <text x="420" y="372" font-size="14" fill="#1a202c">A or B</text>
  <text x="310" y="396" font-size="14" fill="#1a202c">T</text><text x="360" y="396" font-size="14" fill="#1a202c">T</text><text x="432" y="396" font-size="14" fill="#1a202c">T</text>
  <text x="310" y="418" font-size="14" fill="#1a202c">T</text><text x="360" y="418" font-size="14" fill="#1a202c">F</text><text x="432" y="418" font-size="14" fill="#1a202c">T</text>
  <text x="310" y="440" font-size="14" fill="#1a202c">F</text><text x="360" y="440" font-size="14" fill="#1a202c">T</text><text x="432" y="440" font-size="14" fill="#1a202c">T</text>
  <text x="310" y="462" font-size="14" fill="#1a202c">F</text><text x="360" y="462" font-size="14" fill="#1a202c">F</text><text x="432" y="462" font-size="14" fill="#1a202c">F</text>

  <!-- not table -->
  <rect x="520" y="326" width="180" height="150" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="610" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">not</text>
  <text x="560" y="372" font-size="14" fill="#1a202c">A</text>
  <text x="620" y="372" font-size="14" fill="#1a202c">not A</text>
  <text x="560" y="400" font-size="14" fill="#1a202c">T</text><text x="632" y="400" font-size="14" fill="#1a202c">F</text>
  <text x="560" y="428" font-size="14" fill="#1a202c">F</text><text x="632" y="428" font-size="14" fill="#1a202c">T</text>
  <text x="610" y="462" text-anchor="middle" font-size="12" fill="#1a202c">De Morgan: not(A and B)</text>
</svg>
