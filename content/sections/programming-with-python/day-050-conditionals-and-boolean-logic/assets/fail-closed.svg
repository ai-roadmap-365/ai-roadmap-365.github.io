<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="So a case nobody anticipated is refused.">
  <title>A permission decision must fail closed</title>
  <style>
    .fail-closed-bg   { fill: #f8fafc; }
    .fail-closed-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-closed-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-closed-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-closed-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-closed-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fail-closed-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fail-closed-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fail-closed-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fail-closed-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fail-closed-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fail-closed-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fail-closed-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fail-closed-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fail-closed-stage { opacity: 1; }

    .fail-closed-s0 { animation-delay: 0.00s; }
    .fail-closed-e0 { animation-delay: 0.00s; }
    .fail-closed-s1 { animation-delay: 1.28s; }
    .fail-closed-e1 { animation-delay: 1.28s; }
    .fail-closed-s2 { animation-delay: 2.56s; }
    .fail-closed-e2 { animation-delay: 2.56s; }
    .fail-closed-s3 { animation-delay: 3.84s; }
    .fail-closed-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fail-closed-conn  { animation: fail-closed-trace 6.4s ease-in-out infinite; }
      .fail-closed-stage { animation: fail-closed-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fail-closed-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fail-closed-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fail-closed-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fail-closed-stage { animation: fail-closed-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fail-closed-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fail-closed-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fail-closed-bg" width="980" height="322"/>
  <text class="fail-closed-h1"  x="30" y="40">A permission decision must fail closed</text>
  <text class="fail-closed-sub" x="30" y="64">So a case nobody anticipated is refused.</text>
  <g class="fail-closed-stage fail-closed-s0">
    <rect class="fail-closed-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fail-closed-step" x="44" y="142">01</text>
    <text class="fail-closed-name" x="70" y="142">Enumerate what is allowed</text>
    <text class="fail-closed-desc" x="44" y="166">Explicitly. Each permitted case,</text>
    <text class="fail-closed-desc" x="44" y="182">named.</text>
  </g>
  <line class="fail-closed-line fail-closed-conn fail-closed-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fail-closed-tip)"/>
  <g class="fail-closed-stage fail-closed-s1">
    <rect class="fail-closed-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fail-closed-step" x="280" y="142">02</text>
    <text class="fail-closed-name" x="306" y="142">Deny in the else</text>
    <text class="fail-closed-desc" x="280" y="166">Not allow. The default branch is</text>
    <text class="fail-closed-desc" x="280" y="182">the one you did not think about.</text>
    <text class="fail-closed-edge" x="280" y="242">deny</text>
  </g>
  <line class="fail-closed-line fail-closed-conn fail-closed-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fail-closed-tip)"/>
  <g class="fail-closed-stage fail-closed-s2">
    <rect class="fail-closed-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fail-closed-step" x="516" y="142">03</text>
    <text class="fail-closed-name" x="542" y="142">A new role appears</text>
    <text class="fail-closed-desc" x="516" y="166">Nobody updated the check. It</text>
    <text class="fail-closed-desc" x="516" y="182">falls through to else.</text>
  </g>
  <line class="fail-closed-line fail-closed-conn fail-closed-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fail-closed-tip)"/>
  <g class="fail-closed-stage fail-closed-s3">
    <rect class="fail-closed-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fail-closed-step" x="752" y="142">04</text>
    <text class="fail-closed-name" x="778" y="142">Failing closed refuses it</text>
    <text class="fail-closed-desc" x="752" y="166">Someone complains, and you fix</text>
    <text class="fail-closed-desc" x="752" y="182">it. Failing open grants it, and</text>
    <text class="fail-closed-desc" x="752" y="198">nobody notices.</text>
  </g>
  <text class="fail-closed-sub" x="30" y="304">And do not rely on truthiness in that check: if user: is true for any object at all, including one whose permissions were never loaded. The question is if user.is_admin:, and the difference is not stylistic.</text>
</svg>
