<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And truthiness cannot tell them apart.">
  <title>Empty and absent are different questions</title>
  <style>
    .truthy-or-present-bg   { fill: #f8fafc; }
    .truthy-or-present-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .truthy-or-present-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .truthy-or-present-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .truthy-or-present-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .truthy-or-present-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .truthy-or-present-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .truthy-or-present-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .truthy-or-present-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .truthy-or-present-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .truthy-or-present-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .truthy-or-present-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .truthy-or-present-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .truthy-or-present-row { opacity: 1; }
    .truthy-or-present-r0 { animation-delay: 0.00s; }
    .truthy-or-present-r1 { animation-delay: 0.45s; }
    .truthy-or-present-r2 { animation-delay: 0.90s; }
    .truthy-or-present-r3 { animation-delay: 1.35s; }
    .truthy-or-present-r4 { animation-delay: 1.80s; }
    .truthy-or-present-row { animation: truthy-or-present-reveal 7.3s ease-in-out infinite; }
    @keyframes truthy-or-present-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="truthy-or-present-bg" width="980" height="390"/>
  <text class="truthy-or-present-h1"  x="30" y="40">Empty and absent are different questions</text>
  <text class="truthy-or-present-sub" x="30" y="64">And truthiness cannot tell them apart.</text>
  <rect class="truthy-or-present-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="truthy-or-present-name" x="46" y="122">if value:</text>
  <text class="truthy-or-present-desc" x="46" y="142">Asks: is there anything here?</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r0" x="46" y="182">False for 0, 0.0, "", [], {}, None</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r1" x="46" y="216">Idiomatic for "is the list non-empty"</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r2" x="46" y="250">Reads beautifully when that IS the question</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r3" x="46" y="284">Cannot distinguish 0 from missing</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r4" x="46" y="318">The commonest source of silent skips</text>
  <rect class="truthy-or-present-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="truthy-or-present-name" x="526" y="122">if value is not None:</text>
  <text class="truthy-or-present-desc" x="526" y="142">Asks: was anything supplied?</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r0" x="526" y="182">True for 0, 0.0, "", [], {}</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r1" x="526" y="216">Only None is treated as absent</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r2" x="526" y="250">Correct when zero is a legitimate value</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r3" x="526" y="284">Explicit about what is being asked</text>
  <text class="truthy-or-present-desc truthy-or-present-row truthy-or-present-r4" x="526" y="318">Use it for optional parameters</text>
  <text class="truthy-or-present-sub" x="30" y="372">Both are right, for different questions. The bug is using the first when you meant the second, and it is silent: an order with quantity zero is simply skipped, and nothing raises.</text>
</svg>
