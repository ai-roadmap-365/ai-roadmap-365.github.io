<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which is unusual, and worth knowing.">
  <title>Chained comparisons mean what they look like</title>
  <style>
    .chained-comparison-bg   { fill: #f8fafc; }
    .chained-comparison-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-comparison-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-comparison-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-comparison-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-comparison-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-comparison-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chained-comparison-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chained-comparison-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chained-comparison-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chained-comparison-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chained-comparison-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chained-comparison-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chained-comparison-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chained-comparison-stage { opacity: 1; }

    .chained-comparison-s0 { animation-delay: 0.00s; }
    .chained-comparison-e0 { animation-delay: 0.00s; }
    .chained-comparison-s1 { animation-delay: 1.50s; }
    .chained-comparison-e1 { animation-delay: 1.50s; }
    .chained-comparison-s2 { animation-delay: 3.00s; }
    .chained-comparison-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .chained-comparison-conn  { animation: chained-comparison-trace 6s ease-in-out infinite; }
      .chained-comparison-stage { animation: chained-comparison-arrive 6s ease-in-out infinite; }
    }
    @keyframes chained-comparison-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chained-comparison-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chained-comparison-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chained-comparison-stage { animation: chained-comparison-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chained-comparison-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chained-comparison-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chained-comparison-bg" width="980" height="322"/>
  <text class="chained-comparison-h1"  x="30" y="40">Chained comparisons mean what they look like</text>
  <text class="chained-comparison-sub" x="30" y="64">Which is unusual, and worth knowing.</text>
  <g class="chained-comparison-stage chained-comparison-s0">
    <rect class="chained-comparison-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="chained-comparison-step" x="44" y="142">01</text>
    <text class="chained-comparison-name" x="70" y="142">0 &lt;= x &lt; 10</text>
    <text class="chained-comparison-desc" x="44" y="166">Reads as the mathematics does. Most languages</text>
    <text class="chained-comparison-desc" x="44" y="182">cannot do this.</text>
  </g>
  <line class="chained-comparison-line chained-comparison-conn chained-comparison-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#chained-comparison-tip)"/>
  <g class="chained-comparison-stage chained-comparison-s1">
    <rect class="chained-comparison-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="chained-comparison-step" x="359" y="142">02</text>
    <text class="chained-comparison-name" x="385" y="142">Expands to 0 &lt;= x and x &lt; 10</text>
    <text class="chained-comparison-desc" x="359" y="166">With short-circuiting, so the second half may</text>
    <text class="chained-comparison-desc" x="359" y="182">not run.</text>
    <text class="chained-comparison-edge" x="359" y="242">and</text>
  </g>
  <line class="chained-comparison-line chained-comparison-conn chained-comparison-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#chained-comparison-tip)"/>
  <g class="chained-comparison-stage chained-comparison-s2">
    <rect class="chained-comparison-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="chained-comparison-step" x="674" y="142">03</text>
    <text class="chained-comparison-name" x="700" y="142">And x is evaluated ONCE</text>
    <text class="chained-comparison-desc" x="674" y="166">Which matters if it is a function call with a</text>
    <text class="chained-comparison-desc" x="674" y="182">side effect.</text>
    <text class="chained-comparison-edge" x="674" y="242">once</text>
  </g>
  <text class="chained-comparison-sub" x="30" y="304">In most languages this parses as (0 &lt;= x) &lt; 10, comparing a boolean with a number — which is usually legal and always wrong. Python's version is the one that matches the notation.</text>
</svg>
