<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Move the explanation into the code.">
  <title>A condition that needs a comment wants a name</title>
  <style>
    .named-predicate-bg   { fill: #f8fafc; }
    .named-predicate-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .named-predicate-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .named-predicate-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .named-predicate-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .named-predicate-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .named-predicate-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .named-predicate-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .named-predicate-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .named-predicate-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .named-predicate-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .named-predicate-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .named-predicate-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .named-predicate-row { opacity: 1; }
    .named-predicate-r0 { animation-delay: 0.00s; }
    .named-predicate-r1 { animation-delay: 0.45s; }
    .named-predicate-r2 { animation-delay: 0.90s; }
    .named-predicate-r3 { animation-delay: 1.35s; }
    .named-predicate-r4 { animation-delay: 1.80s; }
    .named-predicate-row { animation: named-predicate-reveal 7.3s ease-in-out infinite; }
    @keyframes named-predicate-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="named-predicate-bg" width="980" height="390"/>
  <text class="named-predicate-h1"  x="30" y="40">A condition that needs a comment wants a name</text>
  <text class="named-predicate-sub" x="30" y="64">Move the explanation into the code.</text>
  <rect class="named-predicate-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="named-predicate-name" x="46" y="122">Inline, with a comment</text>
  <text class="named-predicate-desc" x="46" y="142">The comment explains the expression.</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r0" x="46" y="182">Four clauses joined by and/or</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r1" x="46" y="216">A comment above saying what it means</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r2" x="46" y="250">The comment can drift from the code</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r3" x="46" y="284">Cannot be tested on its own</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r4" x="46" y="318">Repeated wherever the rule applies</text>
  <rect class="named-predicate-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="named-predicate-name" x="526" y="122">A named predicate</text>
  <text class="named-predicate-desc" x="526" y="142">The name explains it.</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r0" x="526" y="182">if is_eligible(order):</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r1" x="526" y="216">The name is the documentation</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r2" x="526" y="250">It cannot drift — it is the code</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r3" x="526" y="284">Testable directly, with a table of cases</text>
  <text class="named-predicate-desc named-predicate-row named-predicate-r4" x="526" y="318">Written once, used everywhere</text>
  <text class="named-predicate-sub" x="30" y="372">This is Day 49's naming argument arriving in conditionals: the name is used, so it either stays true or fails loudly, where a comment can quietly stop describing what the expression does.</text>
</svg>
