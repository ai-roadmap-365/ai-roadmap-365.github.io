<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The guard has to come first.">
  <title>Why the order of a compound condition matters</title>
  <style>
    .short-circuit-order-bg   { fill: #f8fafc; }
    .short-circuit-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .short-circuit-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .short-circuit-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .short-circuit-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .short-circuit-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .short-circuit-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .short-circuit-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .short-circuit-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .short-circuit-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .short-circuit-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .short-circuit-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .short-circuit-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .short-circuit-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .short-circuit-order-stage { opacity: 1; }

    .short-circuit-order-s0 { animation-delay: 0.00s; }
    .short-circuit-order-e0 { animation-delay: 0.00s; }
    .short-circuit-order-s1 { animation-delay: 1.28s; }
    .short-circuit-order-e1 { animation-delay: 1.28s; }
    .short-circuit-order-s2 { animation-delay: 2.56s; }
    .short-circuit-order-e2 { animation-delay: 2.56s; }
    .short-circuit-order-s3 { animation-delay: 3.84s; }
    .short-circuit-order-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .short-circuit-order-conn  { animation: short-circuit-order-trace 6.4s ease-in-out infinite; }
      .short-circuit-order-stage { animation: short-circuit-order-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes short-circuit-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes short-circuit-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .short-circuit-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .short-circuit-order-stage { animation: short-circuit-order-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes short-circuit-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="short-circuit-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="short-circuit-order-bg" width="980" height="322"/>
  <text class="short-circuit-order-h1"  x="30" y="40">Why the order of a compound condition matters</text>
  <text class="short-circuit-order-sub" x="30" y="64">The guard has to come first.</text>
  <g class="short-circuit-order-stage short-circuit-order-s0">
    <rect class="short-circuit-order-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="short-circuit-order-step" x="44" y="142">01</text>
    <text class="short-circuit-order-name" x="70" y="142">and stops at the first falsy</text>
    <text class="short-circuit-order-desc" x="44" y="166">The right-hand side is never</text>
    <text class="short-circuit-order-desc" x="44" y="182">evaluated if the left is false.</text>
    <text class="short-circuit-order-edge" x="44" y="242">stops</text>
  </g>
  <line class="short-circuit-order-line short-circuit-order-conn short-circuit-order-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#short-circuit-order-tip)"/>
  <g class="short-circuit-order-stage short-circuit-order-s1">
    <rect class="short-circuit-order-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="short-circuit-order-step" x="280" y="142">02</text>
    <text class="short-circuit-order-name" x="306" y="142">So the guard can come first</text>
    <text class="short-circuit-order-desc" x="280" y="166">user is not None and</text>
    <text class="short-circuit-order-desc" x="280" y="182">user.is_active — safe, always.</text>
  </g>
  <line class="short-circuit-order-line short-circuit-order-conn short-circuit-order-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#short-circuit-order-tip)"/>
  <g class="short-circuit-order-stage short-circuit-order-s2">
    <rect class="short-circuit-order-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="short-circuit-order-step" x="516" y="142">03</text>
    <text class="short-circuit-order-name" x="542" y="142">Reversed, it raises</text>
    <text class="short-circuit-order-desc" x="516" y="166">user.is_active and user is not</text>
    <text class="short-circuit-order-desc" x="516" y="182">None — the attribute access</text>
    <text class="short-circuit-order-desc" x="516" y="198">happens first.</text>
    <text class="short-circuit-order-edge" x="516" y="242">AttributeError</text>
  </g>
  <line class="short-circuit-order-line short-circuit-order-conn short-circuit-order-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#short-circuit-order-tip)"/>
  <g class="short-circuit-order-stage short-circuit-order-s3">
    <rect class="short-circuit-order-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="short-circuit-order-step" x="752" y="142">04</text>
    <text class="short-circuit-order-name" x="778" y="142">or is the mirror</text>
    <text class="short-circuit-order-desc" x="752" y="166">It stops at the first TRUTHY</text>
    <text class="short-circuit-order-desc" x="752" y="182">operand, which is what makes x</text>
    <text class="short-circuit-order-desc" x="752" y="198">or default work.</text>
    <text class="short-circuit-order-edge" x="752" y="242">or</text>
  </g>
  <text class="short-circuit-order-sub" x="30" y="304">Neither operator returns a boolean: they return the operand they stopped on. That is the whole mechanism behind the default idiom, and also its trap when the supplied value is 0 or an empty string.</text>
</svg>
