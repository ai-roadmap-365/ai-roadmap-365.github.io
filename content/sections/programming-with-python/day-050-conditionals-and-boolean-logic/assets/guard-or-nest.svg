<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same logic, at very different reading cost.">
  <title>A pyramid, or a list of rejections</title>
  <style>
    .guard-or-nest-bg   { fill: #f8fafc; }
    .guard-or-nest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guard-or-nest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guard-or-nest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guard-or-nest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guard-or-nest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .guard-or-nest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .guard-or-nest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .guard-or-nest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .guard-or-nest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .guard-or-nest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .guard-or-nest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .guard-or-nest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .guard-or-nest-row { opacity: 1; }
    .guard-or-nest-r0 { animation-delay: 0.00s; }
    .guard-or-nest-r1 { animation-delay: 0.45s; }
    .guard-or-nest-r2 { animation-delay: 0.90s; }
    .guard-or-nest-r3 { animation-delay: 1.35s; }
    .guard-or-nest-r4 { animation-delay: 1.80s; }
    .guard-or-nest-row { animation: guard-or-nest-reveal 7.3s ease-in-out infinite; }
    @keyframes guard-or-nest-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="guard-or-nest-bg" width="980" height="390"/>
  <text class="guard-or-nest-h1"  x="30" y="40">A pyramid, or a list of rejections</text>
  <text class="guard-or-nest-sub" x="30" y="64">The same logic, at very different reading cost.</text>
  <rect class="guard-or-nest-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="guard-or-nest-name" x="46" y="122">Nested</text>
  <text class="guard-or-nest-desc" x="46" y="142">The real work is deepest.</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r0" x="46" y="182">Four levels of indentation</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r1" x="46" y="216">The main path is hardest to find</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r2" x="46" y="250">Each level roughly doubles the paths</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r3" x="46" y="284">You must track which case you are in</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r4" x="46" y="318">Adding a condition indents everything again</text>
  <rect class="guard-or-nest-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="guard-or-nest-name" x="526" y="122">Guard clauses</text>
  <text class="guard-or-nest-desc" x="526" y="142">The real work is last, and flat.</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r0" x="526" y="182">Each rejection is one line, then return</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r1" x="526" y="216">The main path sits at the lowest indent</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r2" x="526" y="250">Each guard reads independently</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r3" x="526" y="284">No case-tracking required</text>
  <text class="guard-or-nest-desc guard-or-nest-row guard-or-nest-r4" x="526" y="318">Adding a condition adds one line</text>
  <text class="guard-or-nest-sub" x="30" y="372">The rule of thumb: more than two levels of nesting in a function is a signal, not a style preference. Inverting the conditions and returning early is a mechanical transformation that almost always improves it.</text>
</svg>
