title: 'Conditionals and Boolean Logic'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to write clear decision code in Python: produce booleans with comparison operators, combine them with and/or/not (using short-circuit evaluation deliberately), and choose a path with if/elif/else, the conditional expression, and guard clauses that keep logic flat and correct.'
objectives:
  - 'Define a boolean and list Python''s falsy values, and explain why any value can serve as a condition through truthiness'
  - 'Use the six comparison operators and chained comparisons (e.g. 0.0 <= x <= 1.0) to produce booleans that read the way a mathematician would say them'
  - 'Combine booleans with and, or, and not, and explain short-circuit evaluation as both a speed and a correctness tool'
  - 'Write if/elif/else ladders whose branches are mutually exclusive and correctly ordered, and use the conditional (ternary) expression for two-way value choices'
  - 'Refactor deeply nested conditionals into flat guard clauses, and simplify negated conditions with De Morgan''s laws'
  - 'Identify and avoid the common conditional bugs: = versus ==, unreachable branch order, comparing floats for exact equality, and is versus =='
  - 'Connect readable boolean logic to AI practice — model-serving routes, data-cleaning rules, and agent control loops are all trees of conditions'
prerequisites:
  - 'Days 43-49 of this course: a working Python 3 install, variables and types, strings, numbers, input/output, reading error messages, and assembling a small program with functions and a main guard'
  - 'Comfort running a script from the terminal with python3 file.py and editing a text file'
