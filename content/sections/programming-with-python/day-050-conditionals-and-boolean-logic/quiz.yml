questions:
  - question: 'Which of the following is NOT one of Python''s falsy values?'
    options:
      - 'The empty string ""'
      - 'The string "0"'
      - 'The integer 0'
      - 'The empty list []'
    answer_index: 1
    explanation: 'The falsy values are False, None, numeric zero (0 and 0.0), and every empty container ("", [], {}, (), set()). The string "0" is a non-empty string, so it is truthy — a classic trap when checking user input, because "0" passes an "if value:" test even though it looks like zero.'

  - question: 'What does the expression `0.0 <= score <= 1.0` do?'
    options:
      - 'It compares 0.0 <= score, then compares the resulting boolean to 1.0'
      - 'It is a syntax error; Python does not allow two comparisons in one expression'
      - 'It is a chained comparison meaning score is between 0.0 and 1.0 inclusive, evaluating score once'
      - 'It only checks the lower bound and ignores the upper one'
    answer_index: 2
    explanation: 'Python supports chained comparisons: `0.0 <= score <= 1.0` means exactly what it reads as — score is in the range 0.0 to 1.0 inclusive — and score is evaluated only once. It is more readable and less error-prone than writing `score >= 0.0 and score <= 1.0` by hand.'

  - question: 'In the expression `user is not None and user.is_active`, why does the order of the two sides matter?'
    options:
      - 'It does not matter; `and` evaluates both sides regardless'
      - 'Python evaluates `and` from right to left, so the second side runs first'
      - 'The order only affects performance, never correctness'
      - 'Short-circuiting skips the second side when the first is False'
    answer_index: 3
    explanation: 'Because `and` short-circuits, if `user is not None` is False the whole expression is already False and `user.is_active` is never evaluated — which prevents an AttributeError when user is None. Swap the two sides and accessing `.is_active` on None would crash. Short-circuiting is a correctness tool, not just a speed trick.'

  - question: 'What do the operators `and` and `or` actually return in Python?'
    options:
      - 'One of their operands, not necessarily a bool'
      - 'Always the literal value True or False'
      - 'The integer 1 for true and 0 for false'
      - 'A new boolean object created each time'
    answer_index: 0
    explanation: '`and` and `or` return one of their operands, not a fresh boolean. `"" or "default"` returns "default"; `"a" and "b"` returns "b". The result is still truthy or falsy, which is why it usually behaves like a boolean — and why `name or "anonymous"` is a common idiom for supplying a default.'

  - question: 'Given `if score >= 0.5: category = "medium"` followed by `elif score >= 0.9: category = "high"`, what happens for score = 0.95?'
    options:
      - 'category becomes "high" because 0.95 >= 0.9'
      - 'category is "medium" — the first true branch wins'
      - 'Both branches run, so category ends up "high"'
      - 'Python raises an error about overlapping conditions'
    answer_index: 1
    explanation: 'An if/elif ladder runs the block under the FIRST true condition and skips the rest. For 0.95 the first test `score >= 0.5` is already True, so category becomes "medium" and the `elif score >= 0.9` is never checked. The high branch is unreachable — a branch-ordering bug fixed by testing the most specific condition (>= 0.9) first.'

  - question: 'Which rewrite of `not (verified and score >= 0.9)` is correct by De Morgan''s laws?'
    options:
      - '`not verified and score < 0.9`'
      - '`verified or score >= 0.9`'
      - '`not verified or score < 0.9`'
      - '`not verified and score >= 0.9`'
    answer_index: 2
    explanation: 'De Morgan''s law says `not (A and B)` equals `not A or not B`. Here A is `verified` and B is `score >= 0.9`, so the result is `not verified or not (score >= 0.9)`, and `not (score >= 0.9)` is `score < 0.9`. The `and` becomes `or` and each part is negated.'

  - question: 'What is the difference between the `if`/`else` statement and the conditional (ternary) expression `x if cond else y`?'
    options:
      - 'The ternary evaluates both branches and returns both values'
      - 'They are identical; the ternary is only shorter'
      - 'The ternary can run multiple statements in each branch'
      - 'The statement runs blocks; the ternary produces a value'
    answer_index: 3
    explanation: 'The `if`/`else` statement chooses which BLOCK of code runs; the ternary `x if cond else y` is an expression that evaluates to a single VALUE (either x or y). Use the ternary for a clean two-way value choice; use a full if when a branch does more than pick one value.'

  - question: 'Why should you avoid testing floating-point numbers for exact equality, as in `if 0.1 + 0.2 == 0.3:`?'
    options:
      - '0.1 is not exact in binary, so the sum differs; use a tolerance'
      - 'Floats are always equal to each other, so the test is meaningless'
      - 'The `==` operator does not work on floats at all'
      - 'Float equality is banned by Python and raises an error'
    answer_index: 0
    explanation: 'Numbers like 0.1 and 0.2 have no exact binary representation, so `0.1 + 0.2` is 0.30000000000000004, and `== 0.3` is False. Never test floats for exact equality; instead check that they are close enough, e.g. `abs(a - b) < 1e-9`.'
