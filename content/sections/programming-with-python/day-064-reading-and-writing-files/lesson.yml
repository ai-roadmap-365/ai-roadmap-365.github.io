id: D064
day: 64
slug: reading-and-writing-files
title: 'Reading and Writing Files'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will be able to read and write files without losing or corrupting data: open files with the right mode and an explicit encoding, use `with` so they always close, choose a reading strategy whose memory cost you have measured rather than guessed, understand the two buffers between a returned write and a durable byte, replace important files atomically so a crash can never leave a fragment, and use pathlib for every path you touch.'
objectives:
  - 'Explain what a file is (a named byte sequence) and what the cursor is, and predict where the cursor sits after each read or write'
  - 'Choose the correct mode from r, w, a, x and their + and b variants, and explain exactly when mode w destroys an existing file'
  - 'Always open files with `with` and an explicit encoding, and explain what a context manager guarantees when an exception fires mid-write'
  - 'Compare whole-file and streaming reads by measured peak memory, and explain why only streaming scales to files larger than RAM'
  - 'Distinguish flush() from os.fsync() and describe what state the data is in between them'
  - 'Implement the atomic-write pattern (temp file in the same directory, flush, fsync, os.replace) and explain why each step is required'
  - 'Use pathlib for joining, testing, creating, and searching paths, and connect safe file handling to AI work — datasets, checkpoints, prompt logs, and eval results'
prerequisites:
  - 'Days 57-63 of this course: functions, scope, modules and imports, the standard library, readable code, recursion, and designing a small program well'
  - 'Days 50-56: control flow, lists, dictionaries, comprehensions, and building a data-driven CLI'
  - 'Course 01: the difference between volatile RAM and durable disk storage'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
