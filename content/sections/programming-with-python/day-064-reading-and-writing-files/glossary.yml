terms:
  - term: file
    definition: 'A named sequence of bytes that lives on a disk and survives the program that wrote it. A file has no built-in notion of lines, records, or columns — any structure beyond "bytes in a row with a name" is a convention that programs agree to read into and out of those bytes.'
  - term: file object
    definition: 'The object `open()` returns. It knows which file it is attached to, what you are allowed to do with it, how to translate between characters and bytes, and where the cursor currently sits. It also holds a buffer of bytes not yet handed to the operating system.'
  - term: file descriptor
    definition: 'The small integer the operating system kernel uses as a handle to an open file. It comes from the Unix design of the early 1970s, and Python still exposes it: `handle.fileno()` returns the descriptor that `os.fsync()` needs.'
  - term: cursor
    definition: 'The single remembered position within an open file, also called the file position. Reading and writing move it forward; nothing rewinds it on its own. `tell()` reports it and `seek()` moves it — which is why a second `read()` returns an empty string until you `seek(0)`.'
  - term: mode string
    definition: 'The short string passed to `open()` declaring intent: `r` read, `w` write (truncating at open time), `a` append, `x` exclusive creation (fails if the file exists), plus `+` to add the other capability and `b` for bytes instead of text.'
  - term: context manager
    definition: 'An object that is entered at the top of a `with` block and exited at the bottom no matter how the block ends — clean finish, `return`, or an exception thrown three functions deep. For a file, exiting means flushed and closed, which makes closing structural rather than remembered.'
  - term: encoding
    definition: 'The rulebook mapping characters to bytes and back. Python cannot infer it, because a file is only bytes. Naming it explicitly (`encoding="utf-8"`) is what makes the same code produce the same bytes on every machine.'
  - term: UTF-8
    definition: 'The dominant character encoding of the web, designed by Ken Thompson and Rob Pike in September 1992. The 128 ASCII characters keep their single-byte values, so every ASCII file is already valid UTF-8, while other characters expand to two, three, or four bytes — which is why "café" is 4 characters but 5 bytes.'
  - term: UnicodeDecodeError
    definition: 'The error raised when bytes on disk are not valid under the encoding you asked for. It is a feature, not a nuisance: it is the file telling you it is not what you assumed, usually that an older program wrote it in Latin-1.'
  - term: buffering
    definition: 'The batching of small reads and writes into a few large operations, because a system call per character would be catastrophically slow. Its cost is that a write which has returned successfully may still be nowhere near the disk.'
  - term: flush
    definition: 'The call that pushes Python''s own buffer out to the operating system. After it, every other program can see the new bytes — but they are still only in RAM, in the page cache, and a power cut still loses them.'
  - term: fsync
    definition: '`os.fsync(handle.fileno())` — the call that forces bytes from the operating system page cache onto the physical disk. It is the only step that makes data genuinely durable, and it is slow enough that you reserve it for checkpoints and record stores rather than ordinary output.'
  - term: atomic write
    definition: 'The pattern for replacing a file safely: write the complete new content to a temporary file in the same directory, flush, fsync, then `os.replace` it over the target in a single uninterruptible rename. A reader at any instant gets either the complete old file or the complete new one — never a fragment.'
  - term: pathlib
    definition: 'The standard-library module, added in Python 3.4 through PEP 428, that represents paths as objects rather than strings. `Path` joins with the `/` operator using the correct separator for the platform, and offers `exists`, `mkdir`, `read_text`, `iterdir`, `glob`, and `rglob`.'
  - term: absolute path
    definition: 'A path starting from the root of the filesystem, such as `/home/ada/data/train.txt`. It means the same thing no matter which directory the process is running in.'
  - term: relative path
    definition: 'A path interpreted from the process''s current working directory, such as `data/train.txt`. It means different things depending on where the program was launched, which is a leading cause of "where did my output go?".'
  - term: record terminator
    definition: 'The byte that marks the end of one record — a newline, in a line-oriented store. It is what makes a torn write recoverable: a record is only complete once its terminator is on disk, so a reader that stops at the first line without one can never half-parse a truncated record.'
