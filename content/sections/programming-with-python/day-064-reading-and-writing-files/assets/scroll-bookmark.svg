<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The position is the state.">
  <title>A scroll with one bookmark</title>
  <style>
    .scroll-bookmark-bg   { fill: #f8fafc; }
    .scroll-bookmark-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scroll-bookmark-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scroll-bookmark-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scroll-bookmark-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scroll-bookmark-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scroll-bookmark-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scroll-bookmark-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scroll-bookmark-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scroll-bookmark-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scroll-bookmark-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scroll-bookmark-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scroll-bookmark-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scroll-bookmark-row { opacity: 1; }
    .scroll-bookmark-r0 { animation-delay: 0.00s; }
    .scroll-bookmark-r1 { animation-delay: 0.45s; }
    .scroll-bookmark-r2 { animation-delay: 0.90s; }
    .scroll-bookmark-r3 { animation-delay: 1.35s; }
    .scroll-bookmark-r4 { animation-delay: 1.80s; }
    .scroll-bookmark-row { animation: scroll-bookmark-reveal 7.3s ease-in-out infinite; }
    @keyframes scroll-bookmark-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scroll-bookmark-bg" width="980" height="390"/>
  <text class="scroll-bookmark-h1"  x="30" y="40">A scroll with one bookmark</text>
  <text class="scroll-bookmark-sub" x="30" y="64">The position is the state.</text>
  <rect class="scroll-bookmark-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scroll-bookmark-name" x="46" y="122">One bookmark</text>
  <text class="scroll-bookmark-desc" x="46" y="142">It moves as you read.</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r0" x="46" y="182">Reading advances it past what you read</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r1" x="46" y="216">Reading again continues from there</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r2" x="46" y="250">Going back means moving it deliberately</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r3" x="46" y="284">There is only one</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r4" x="46" y="318">This is the file cursor</text>
  <rect class="scroll-bookmark-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scroll-bookmark-name" x="526" y="122">Expecting a book</text>
  <text class="scroll-bookmark-desc" x="526" y="142">Random access.</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r0" x="526" y="182">Assuming you can glance anywhere</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r1" x="526" y="216">Assuming a second read repeats the first</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r2" x="526" y="250">Forgetting the position moved</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r3" x="526" y="284">Surprised by an empty second read</text>
  <text class="scroll-bookmark-desc scroll-bookmark-row scroll-bookmark-r4" x="526" y="318">This is the common misunderstanding</text>
  <text class="scroll-bookmark-sub" x="30" y="372">The empty second read is the most common file confusion, and the bookmark explains it in one sentence.</text>
</svg>
