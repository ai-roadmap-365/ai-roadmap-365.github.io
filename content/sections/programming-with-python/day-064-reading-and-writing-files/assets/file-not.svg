<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things files are not</title>
  <style>
    .file-not-bg   { fill: #f8fafc; }
    .file-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-not-row { opacity: 1; }
    .file-not-r0 { animation-delay: 0.00s; }
    .file-not-r1 { animation-delay: 0.45s; }
    .file-not-r2 { animation-delay: 0.90s; }
    .file-not-r3 { animation-delay: 1.35s; }
    .file-not-r4 { animation-delay: 1.80s; }
    .file-not-row { animation: file-not-reveal 7.3s ease-in-out infinite; }
    @keyframes file-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="file-not-bg" width="980" height="390"/>
  <text class="file-not-h1"  x="30" y="40">Four things files are not</text>
  <text class="file-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="file-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="file-not-name" x="46" y="122">The misconception</text>
  <text class="file-not-desc" x="46" y="142">Commonly held.</text>
  <text class="file-not-desc file-not-row file-not-r0" x="46" y="182">Writing means the data is on disk</text>
  <text class="file-not-desc file-not-row file-not-r1" x="46" y="216">The default encoding is fine</text>
  <text class="file-not-desc file-not-row file-not-r2" x="46" y="250">Reading twice gives the same data</text>
  <text class="file-not-desc file-not-row file-not-r3" x="46" y="284">Closing is optional in short scripts</text>
  <text class="file-not-desc file-not-row file-not-r4" x="46" y="318">A file path is just a string</text>
  <rect class="file-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="file-not-name" x="526" y="122">What is true</text>
  <text class="file-not-desc" x="526" y="142">Actually.</text>
  <text class="file-not-desc file-not-row file-not-r0" x="526" y="182">It is buffered until flushed or closed</text>
  <text class="file-not-desc file-not-row file-not-r1" x="526" y="216">It differs by platform and breaks portability</text>
  <text class="file-not-desc file-not-row file-not-r2" x="526" y="250">The cursor is at the end after the first read</text>
  <text class="file-not-desc file-not-row file-not-r3" x="526" y="284">An unflushed buffer is lost data</text>
  <text class="file-not-desc file-not-row file-not-r4" x="526" y="318">Path objects handle separators and platforms</text>
  <text class="file-not-sub" x="30" y="372">The buffering row explains a whole category of confusion: a file that looks empty while the program is running is usually a buffer that has not been flushed.</text>
</svg>
