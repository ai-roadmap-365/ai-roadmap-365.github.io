<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward safety by default.">
  <title>Four steps in file handling</title>
  <style>
    .file-history-bg   { fill: #f8fafc; }
    .file-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .file-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .file-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .file-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .file-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .file-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .file-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .file-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .file-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .file-history-stage { opacity: 1; }

    .file-history-s0 { animation-delay: 0.00s; }
    .file-history-e0 { animation-delay: 0.00s; }
    .file-history-s1 { animation-delay: 1.28s; }
    .file-history-e1 { animation-delay: 1.28s; }
    .file-history-s2 { animation-delay: 2.56s; }
    .file-history-e2 { animation-delay: 2.56s; }
    .file-history-s3 { animation-delay: 3.84s; }
    .file-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .file-history-conn  { animation: file-history-trace 6.4s ease-in-out infinite; }
      .file-history-stage { animation: file-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes file-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes file-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .file-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .file-history-stage { animation: file-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes file-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="file-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="file-history-bg" width="980" height="322"/>
  <text class="file-history-h1"  x="30" y="40">Four steps in file handling</text>
  <text class="file-history-sub" x="30" y="64">Toward safety by default.</text>
  <g class="file-history-stage file-history-s0">
    <rect class="file-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="file-history-step" x="44" y="142">01</text>
    <text class="file-history-name" x="70" y="142">Open and close by hand</text>
    <text class="file-history-desc" x="44" y="166">With leaks whenever a path was</text>
    <text class="file-history-desc" x="44" y="182">missed.</text>
  </g>
  <line class="file-history-line file-history-conn file-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#file-history-tip)"/>
  <g class="file-history-stage file-history-s1">
    <rect class="file-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="file-history-step" x="280" y="142">02</text>
    <text class="file-history-name" x="306" y="142">Exceptions made the leaks worse</text>
    <text class="file-history-desc" x="280" y="166">Since they skipped the close</text>
    <text class="file-history-desc" x="280" y="182">entirely.</text>
  </g>
  <line class="file-history-line file-history-conn file-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#file-history-tip)"/>
  <g class="file-history-stage file-history-s2">
    <rect class="file-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="file-history-step" x="516" y="142">03</text>
    <text class="file-history-name" x="542" y="142">Context managers made closing automatic</text>
    <text class="file-history-desc" x="516" y="166">On every exit path.</text>
  </g>
  <line class="file-history-line file-history-conn file-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#file-history-tip)"/>
  <g class="file-history-stage file-history-s3">
    <rect class="file-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="file-history-step" x="752" y="142">04</text>
    <text class="file-history-name" x="778" y="142">And path objects removed the string manipulation</text>
    <text class="file-history-desc" x="752" y="166">Along with its portability bugs.</text>
  </g>
  <text class="file-history-sub" x="30" y="304">Both improvements work the same way: they make the correct behaviour the default rather than something the programmer has to remember.</text>
</svg>
