<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" font-family="system-ui, sans-serif">
  <title>The safe write sequence step by step: open a temporary file in the same directory as the target, write the new content into it, flush Python's buffer, call os.fsync to force the bytes onto the disk, then call os.replace to rename the temporary file over the target in one atomic step — with annotations showing that a crash at any point before the rename leaves the old file complete and untouched, and a crash after it leaves the new file complete</title>
  <rect x="0" y="0" width="880" height="660" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The atomic write: five steps, no half-written file</text>

  <!-- column headers -->
  <text x="250" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">what your code does</text>
  <text x="690" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">if the power fails right here</text>

  <!-- Step 1 -->
  <rect x="60" y="80" width="380" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. open the TEMP file, same directory</text>
  <text x="250" y="128" text-anchor="middle" font-size="14" fill="#1a202c">temp = path.with_name(path.name + ".tmp")</text>
  <text x="250" y="144" text-anchor="middle" font-size="14" fill="#1a202c">same directory ⇒ same filesystem ⇒ rename is atomic</text>
  <rect x="480" y="80" width="340" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="112" text-anchor="middle" font-size="14" fill="#1a202c">config.txt is untouched and complete.</text>
  <text x="650" y="134" text-anchor="middle" font-size="14" fill="#1a202c">An empty stray .tmp may remain.</text>

  <line x1="250" y1="150" x2="250" y2="176" stroke="#1a202c" stroke-width="2"/>
  <polygon points="250,176 244,164 256,164" fill="#1a202c"/>

  <!-- Step 2 -->
  <rect x="60" y="176" width="380" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. write the new content into TEMP</text>
  <text x="250" y="224" text-anchor="middle" font-size="14" fill="#1a202c">handle.write(text)</text>
  <text x="250" y="240" text-anchor="middle" font-size="14" fill="#1a202c">the real file is never opened for writing</text>
  <rect x="480" y="176" width="340" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="208" text-anchor="middle" font-size="14" fill="#1a202c">config.txt is untouched and complete.</text>
  <text x="650" y="230" text-anchor="middle" font-size="14" fill="#1a202c">The half-written bytes are in the .tmp.</text>

  <line x1="250" y1="246" x2="250" y2="272" stroke="#1a202c" stroke-width="2"/>
  <polygon points="250,272 244,260 256,260" fill="#1a202c"/>

  <!-- Step 3 -->
  <rect x="60" y="272" width="380" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. flush() — Python buffer to the OS</text>
  <text x="250" y="320" text-anchor="middle" font-size="14" fill="#1a202c">handle.flush()</text>
  <text x="250" y="336" text-anchor="middle" font-size="14" fill="#1a202c">other programs can now read the temp file</text>
  <rect x="480" y="272" width="340" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="304" text-anchor="middle" font-size="14" fill="#1a202c">config.txt is untouched and complete.</text>
  <text x="650" y="326" text-anchor="middle" font-size="14" fill="#1a202c">The .tmp may or may not be on disk yet.</text>

  <line x1="250" y1="342" x2="250" y2="368" stroke="#1a202c" stroke-width="2"/>
  <polygon points="250,368 244,356 256,356" fill="#1a202c"/>

  <!-- Step 4 -->
  <rect x="60" y="368" width="380" height="70" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4. os.fsync() — OS cache to the disk</text>
  <text x="250" y="416" text-anchor="middle" font-size="14" fill="#1a202c">os.fsync(handle.fileno())</text>
  <text x="250" y="432" text-anchor="middle" font-size="14" fill="#1a202c">the temp file is now durable</text>
  <rect x="480" y="368" width="340" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="400" text-anchor="middle" font-size="14" fill="#1a202c">config.txt is untouched and complete.</text>
  <text x="650" y="422" text-anchor="middle" font-size="14" fill="#1a202c">A complete .tmp sits beside it.</text>

  <line x1="250" y1="438" x2="250" y2="464" stroke="#1a202c" stroke-width="2"/>
  <polygon points="250,464 244,452 256,452" fill="#1a202c"/>

  <!-- Step 5 -->
  <rect x="60" y="464" width="380" height="70" fill="#fef9c3" stroke="#1d4ed8" stroke-width="3" rx="6"/>
  <text x="250" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">5. os.replace(temp, path) — the switch</text>
  <text x="250" y="512" text-anchor="middle" font-size="14" fill="#1a202c">one atomic rename; no in-between state exists</text>
  <text x="250" y="528" text-anchor="middle" font-size="14" fill="#1a202c">this is the instant the change becomes visible</text>
  <rect x="480" y="464" width="340" height="70" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="650" y="496" text-anchor="middle" font-size="14" fill="#1a202c">Either the OLD config.txt, whole,</text>
  <text x="650" y="518" text-anchor="middle" font-size="14" fill="#1a202c">or the NEW config.txt, whole. Never both.</text>

  <line x1="250" y1="534" x2="250" y2="560" stroke="#1a202c" stroke-width="2"/>
  <polygon points="250,560 244,548 256,548" fill="#1a202c"/>

  <rect x="60" y="560" width="380" height="52" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="250" y="592" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Done — readers only ever saw a complete file</text>

  <text x="440" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Contrast: open(path, "w") truncates the real file at step 1, so every later crash destroys it.</text>
</svg>
