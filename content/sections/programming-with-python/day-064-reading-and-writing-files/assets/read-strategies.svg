<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By memory.">
  <title>Three ways to read</title>
  <style>
    .read-strategies-bg   { fill: #f8fafc; }
    .read-strategies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-strategies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-strategies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-strategies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-strategies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .read-strategies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .read-strategies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .read-strategies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .read-strategies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .read-strategies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .read-strategies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .read-strategies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .read-strategies-row { opacity: 1; }
    .read-strategies-r0 { animation-delay: 0.00s; }
    .read-strategies-r1 { animation-delay: 0.45s; }
    .read-strategies-r2 { animation-delay: 0.90s; }
    .read-strategies-r3 { animation-delay: 1.35s; }
    .read-strategies-r4 { animation-delay: 1.80s; }
    .read-strategies-row { animation: read-strategies-reveal 7.3s ease-in-out infinite; }
    @keyframes read-strategies-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="read-strategies-bg" width="980" height="390"/>
  <text class="read-strategies-h1"  x="30" y="40">Three ways to read</text>
  <text class="read-strategies-sub" x="30" y="64">By memory.</text>
  <rect class="read-strategies-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="read-strategies-name" x="46" y="122">The strategy</text>
  <text class="read-strategies-desc" x="46" y="142">How you read.</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r0" x="46" y="182">Read the whole file into a string</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r1" x="46" y="216">Read a list of all lines</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r2" x="46" y="250">Iterate line by line</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r3" x="46" y="284">Read fixed-size chunks</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r4" x="46" y="318">Which the file object supports directly</text>
  <rect class="read-strategies-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="read-strategies-name" x="526" y="122">What it costs</text>
  <text class="read-strategies-desc" x="526" y="142">In memory.</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r0" x="526" y="182">The whole file, in memory</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r1" x="526" y="216">The whole file, plus list overhead</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r2" x="526" y="250">One line at a time</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r3" x="526" y="284">One chunk at a time</text>
  <text class="read-strategies-desc read-strategies-row read-strategies-r4" x="526" y="318">So iteration handles any size</text>
  <text class="read-strategies-sub" x="30" y="372">Iterating the file object directly is both the simplest form and the one that handles a file larger than memory, which is an unusually happy coincidence.</text>
</svg>
