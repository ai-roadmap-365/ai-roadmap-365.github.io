<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" role="img" font-family="system-ui, sans-serif">
  <title>The layers between your program and the disk: your Python code holds strings and calls read and write on a file object, which encodes and decodes text through UTF-8 and keeps the file position (the cursor); the file object holds a small buffer of bytes, hands them to the operating system's page cache, and only fsync forces the page cache out to the physical disk</title>
  <rect x="0" y="0" width="860" height="620" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">What sits between your program and the disk</text>

  <!-- Layer 1: your program -->
  <rect x="120" y="60" width="620" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Your Python program — works in str (characters)</text>
  <text x="430" y="108" text-anchor="middle" font-size="14" fill="#1a202c">handle.write("café\n")  ·  text = handle.read()  ·  for line in handle:</text>
  <text x="430" y="124" text-anchor="middle" font-size="14" fill="#1a202c">4 characters in memory, no bytes in sight yet</text>

  <line x1="430" y1="130" x2="430" y2="160" stroke="#1a202c" stroke-width="2"/>
  <polygon points="430,160 424,148 436,148" fill="#1a202c"/>

  <!-- Layer 2: the file object -->
  <rect x="60" y="160" width="740" height="150" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The file object returned by open() — created and closed by `with`</text>

  <rect x="86" y="200" width="220" height="94" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="196" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">encode / decode layer</text>
  <text x="196" y="246" text-anchor="middle" font-size="14" fill="#1a202c">encoding='utf-8'</text>
  <text x="196" y="266" text-anchor="middle" font-size="14" fill="#1a202c">"café" ↔ b'caf\xc3\xa9'</text>
  <text x="196" y="286" text-anchor="middle" font-size="14" fill="#1a202c">strict, or errors='replace'</text>

  <rect x="322" y="200" width="216" height="94" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">the cursor (file position)</text>
  <text x="430" y="246" text-anchor="middle" font-size="14" fill="#1a202c">one sliding bookmark</text>
  <text x="430" y="266" text-anchor="middle" font-size="14" fill="#1a202c">tell() reads it</text>
  <text x="430" y="286" text-anchor="middle" font-size="14" fill="#1a202c">seek() moves it</text>

  <rect x="554" y="200" width="220" height="94" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="664" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">the buffer (bytes)</text>
  <text x="664" y="246" text-anchor="middle" font-size="14" fill="#1a202c">a few KB held back</text>
  <text x="664" y="266" text-anchor="middle" font-size="14" fill="#1a202c">flush() empties it</text>
  <text x="664" y="286" text-anchor="middle" font-size="14" fill="#1a202c">close() flushes too</text>

  <line x1="430" y1="310" x2="430" y2="342" stroke="#1a202c" stroke-width="2"/>
  <polygon points="430,342 424,330 436,330" fill="#1a202c"/>
  <text x="446" y="330" font-size="14" fill="#1a202c">flush() — bytes leave Python</text>

  <!-- Layer 3: operating system -->
  <rect x="120" y="342" width="620" height="86" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Operating system — the page cache (RAM)</text>
  <text x="430" y="390" text-anchor="middle" font-size="14" fill="#1a202c">write() has returned and every other program can read the new bytes,</text>
  <text x="430" y="410" text-anchor="middle" font-size="14" fill="#1a202c">but they are still only in memory — a power cut here loses them</text>

  <line x1="430" y1="428" x2="430" y2="460" stroke="#1a202c" stroke-width="2"/>
  <polygon points="430,460 424,448 436,448" fill="#1a202c"/>
  <text x="446" y="448" font-size="14" fill="#1a202c">os.fsync() — bytes leave RAM</text>

  <!-- Layer 4: disk -->
  <rect x="120" y="460" width="620" height="80" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="430" y="486" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The disk — durable storage</text>
  <text x="430" y="508" text-anchor="middle" font-size="14" fill="#1a202c">a named sequence of bytes that survives the power going off;</text>
  <text x="430" y="528" text-anchor="middle" font-size="14" fill="#1a202c">this is the only layer that is still there tomorrow</text>

  <text x="430" y="572" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Reading runs the same four layers upward: disk → page cache → buffer → decode → str</text>
  <text x="430" y="596" text-anchor="middle" font-size="14" fill="#1a202c">The cursor moves every time you read or write; it never rewinds unless you tell it to.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 430 130 L 430 160" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 430 310 L 430 342" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 430 428 L 430 460" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
