questions:
  - question: 'What does `open("data.txt", "w")` do to an existing data.txt, and when?'
    options:
      - 'Nothing until you call write(); the old content stays until then'
      - 'It appends to the end of the existing content'
      - 'It truncates the file to zero bytes at the moment it opens, before any write'
      - 'It raises FileExistsError so you cannot destroy the file by accident'
    answer_index: 2
    explanation: 'Mode w truncates at open time. By the time you notice the mistake the old content is already gone — you have written nothing yet, but the file is empty. Mode a appends, and mode x is the one that refuses to touch an existing file.'

  - question: 'After `text = handle.read()` on an open file, a second `handle.read()` returns an empty string. Why?'
    options:
      - 'The cursor is now at the end of the file, and nothing rewinds it automatically'
      - 'The file was closed by the first read'
      - 'read() may only be called once per file object'
      - 'The buffer was emptied and must be refilled with flush()'
    answer_index: 0
    explanation: 'There is exactly one cursor per open file object and it only moves forward unless you move it. read() consumed everything, so the cursor sits at the end. handle.seek(0) rewinds it — or better, read once and keep the value.'

  - question: 'Why should `encoding="utf-8"` always be stated explicitly?'
    options:
      - 'It makes reading measurably faster'
      - 'Without it Python uses a platform-dependent default, so the same code can produce different bytes on different machines'
      - 'Python cannot open a text file at all without it'
      - 'It is required whenever the file contains non-ASCII characters'
    answer_index: 1
    explanation: 'A file is bytes; the encoding is a rulebook Python cannot infer. Leaving it off falls back to a platform-dependent default, so identical code behaves differently on a laptop and a server — a silent, portable-looking bug.'

  - question: 'On a 2 GB log, which reading strategies have a peak memory cost that scales with the size of the file?'
    options:
      - 'Only readlines()'
      - 'None of them — Python streams everything by default'
      - 'Only read()'
      - 'Both read() and readlines(); the line-by-line forms stay flat'
    answer_index: 3
    explanation: 'read() and readlines() both hold the whole file (measured at 3.17x and 2.22x the file size respectively on an 8.2 MB log), so a file larger than RAM cannot be read at all. Iterating with `for line in handle:` peaks at roughly the longest line plus a buffer — about 150 KB whether the file is 8 MB or 2 GB.'

  - question: 'What is the difference between `flush()` and `os.fsync()`?'
    options:
      - 'flush() moves bytes from Python''s buffer to the operating system; fsync() forces them from the operating system onto the physical disk'
      - 'They are aliases; fsync() is the older spelling'
      - 'flush() writes to disk; fsync() only closes the file descriptor'
      - 'flush() applies to text mode and fsync() to binary mode'
    answer_index: 0
    explanation: 'There are two caches between you and permanence. After flush() the bytes are visible to every other program but still only in the operating system page cache, so a power cut loses them. os.fsync(handle.fileno()) is what forces them onto the physical device.'

  - question: 'In the atomic-write pattern, why must the temporary file be created in the same directory as the target?'
    options:
      - 'So that a reader can find both files while the write is in progress'
      - 'Because os.replace refuses to accept absolute paths'
      - 'Because a rename is only atomic within a single filesystem, and another directory may be a different mount'
      - 'To keep the temporary file hidden from other users'
    answer_index: 2
    explanation: 'The guarantee rests on the rename being a single uninterruptible operation, and that only holds within one filesystem. A temp file in /tmp may sit on a different mount, which turns the atomic rename into a copy — losing the guarantee and possibly failing outright.'

  - question: 'A `with open(...) as f:` block raises an exception halfway through writing. What happens to the file?'
    options:
      - 'The write is rolled back and the file is restored to its previous content'
      - 'The file is left open until the process exits'
      - 'The exception is suppressed and the block finishes normally'
      - 'The file is flushed and closed on the way out, and the exception still propagates'
    answer_index: 3
    explanation: 'A context manager guarantees the exit step runs however the block ends. For a file that means flushed and closed, so already-written data reaches the operating system rather than dying in a buffer. `with` does not roll anything back and does not swallow the exception.'

  - question: 'What does `write()` add to the end of the string you give it?'
    options:
      - 'Nothing at all — every newline in the file is one you typed'
      - 'A newline, exactly like print()'
      - 'A newline only in text mode'
      - 'A platform-appropriate line ending unless newline="" was passed'
    answer_index: 0
    explanation: 'handle.write("abc") puts exactly three bytes on disk. This is the opposite of print(), which appends a newline for you, and forgetting it is what produces a file that is one enormous line.'
