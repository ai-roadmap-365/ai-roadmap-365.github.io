visuals:
  - id: file-io-architecture
    file: assets/file-io-architecture.svg
    type: diagram
    title: 'The layers between your program and the disk'
    alt: 'Diagram: the layers between a Python program and the disk — the program works in characters, the file object encodes and decodes through UTF-8 while tracking the cursor and holding a byte buffer, the operating system holds the bytes in its page cache, and only fsync forces them onto the physical disk'
    description: 'Four stacked layers. At the top, your program works in str — characters. Below it, the file object returned by open() does three jobs: it encodes and decodes between characters and bytes through UTF-8, it tracks the single cursor position, and it holds a buffer of bytes not yet handed on. Below that, the operating system page cache holds bytes in RAM that other programs can already see but that the disk does not yet have. At the bottom is the physical disk, the only layer still there tomorrow. flush() moves data from the file object buffer to the page cache; os.fsync() moves it from the page cache to the disk. Reading traverses the same four layers upward.'
  - id: atomic-write-flow
    file: assets/atomic-write-flow.svg
    type: flowchart
    title: 'The atomic write, step by step'
    alt: 'Flowchart: the safe write sequence — open a temporary file in the same directory, write the new content, flush, fsync, then os.replace it over the target, with annotations showing that a crash anywhere before the rename leaves the old file complete and a crash after it leaves the new file complete'
    description: 'A five-step sequence with crash annotations beside each step. Open a temporary file in the same directory as the target; write the complete new content into it; flush() to push Python buffers to the operating system; os.fsync() to force the bytes onto the physical disk; then os.replace() the temp file over the target in a single uninterruptible rename. The right-hand column shows what a power cut at each step would leave behind: a crash at any point before the rename leaves the original file complete and untouched plus a stray temp file, and a crash after the rename leaves the new file complete. There is no intermediate state in which a reader can observe half of either file.'
