<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img"
     aria-labelledby="d098f-title d098f-desc">
  <title id="d098f-title">One pipeline run end to end, with the real counts, and what changes on the second run</title>
  <desc id="d098f-desc">Three sources are fetched. Alpha answers at once with five records. Bravo returns 500 twice and 200 on the third attempt, so its four records arrive after a retry loop. Charlie returns 500 three times and is skipped. Nine records reach the validation gate, which splits them into seven accepted and two rejected, naming the field and the reason for each rejection. The store inserts six on the first run and skips one in-payload duplicate; on the second run it inserts none and skips seven, and the table still holds six rows. The report is built at a fixed instant and finds five readings in the window and one implausible jump, which it flags rather than deletes. The exit code is 3, partial success, on both runs.</desc>

  <style>
    .d098f-bg     { fill: #f8fafc; }
    .d098f-h1     { font: 600 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098f-h2     { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d4ed8; }
    .d098f-lead   { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098f-t      { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; }
    .d098f-mono   { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a202c; }
    .d098f-note   { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .d098f-big    { font: 600 26px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d4ed8; }
    .d098f-bigred { font: 600 26px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; }
    .d098f-biggrn { font: 600 26px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #15803d; }
    .d098f-ok     { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .d098f-bad    { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .d098f-box    { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d098f-plain  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d098f-amber  { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }

    .d098f-wire   { stroke: #1d4ed8; stroke-width: 2.5; fill: none;
                    stroke-dasharray: 10 8; animation: d098f-march 1.6s linear infinite; }
    .d098f-wireok { stroke: #15803d; stroke-width: 2.5; fill: none;
                    stroke-dasharray: 10 8; animation: d098f-march 1.6s linear infinite; }
    .d098f-wirex  { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
    .d098f-retry  { stroke: #b45309; stroke-width: 2.5; fill: none;
                    stroke-dasharray: 8 6; animation: d098f-marchback 1.2s linear infinite; }

    @keyframes d098f-march     { to { stroke-dashoffset: -18 } }
    @keyframes d098f-marchback { to { stroke-dashoffset: 14 } }

    .d098f-stage { animation: d098f-lift 8s ease-in-out infinite; }
    .d098f-s1 { animation-delay: 0s }
    .d098f-s2 { animation-delay: 1.6s }
    .d098f-s3 { animation-delay: 3.2s }
    .d098f-s4 { animation-delay: 4.8s }
    .d098f-s5 { animation-delay: 6.4s }
    @keyframes d098f-lift {
      0%, 20%, 100% { fill: #e0e7ff }
      5%, 15%       { fill: #bfdbfe }
    }

    .d098f-token { animation: d098f-slide 8s ease-in-out infinite; }
    @keyframes d098f-slide {
      0%   { transform: translateX(0)     }
      18%  { transform: translateX(258px) }
      38%  { transform: translateX(516px) }
      58%  { transform: translateX(774px) }
      78%  { transform: translateX(1032px)}
      100% { transform: translateX(1032px)}
    }

    .d098f-pulse { animation: d098f-glow 8s ease-in-out infinite; }
    @keyframes d098f-glow {
      0%, 74%, 100% { stroke-width: 2 }
      82%, 92%      { stroke-width: 4 }
    }

    @media (prefers-reduced-motion: reduce) {
      .d098f-wire, .d098f-wireok { animation: none; stroke-dasharray: none }
      .d098f-retry               { animation: none }
      .d098f-stage               { animation: none; fill: #e0e7ff }
      .d098f-token               { animation: none; transform: none }
      .d098f-pulse               { animation: none; stroke-width: 2 }
    }
  </style>

  <rect class="d098f-bg" x="0" y="0" width="1400" height="900"/>

  <defs>
    <marker id="d098f-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="d098f-arrowok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="d098f-arrowx" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="d098f-arrowr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text class="d098f-h1" x="24" y="40">One run, end to end — and the second run, which changes nothing</text>
  <text class="d098f-note" x="24" y="66">Every number below is captured from a real run: 9 fetched, 7 accepted, 6 stored, 5 in window, exit 3.</text>

  <!-- Sources -->
  <text class="d098f-lead" x="24" y="108">SOURCES</text>
  <rect class="d098f-ok"  x="24" y="122" width="200" height="66" rx="6"/>
  <text class="d098f-mono" x="38" y="146">alpha   200 first try</text>
  <text class="d098f-t"    x="38" y="170">5 records, 2 of them bad</text>

  <rect class="d098f-amber" x="24" y="200" width="200" height="86" rx="6"/>
  <text class="d098f-mono" x="38" y="224">bravo   500, 500, 200</text>
  <text class="d098f-t"    x="38" y="248">4 records, after 3 attempts</text>
  <text class="d098f-note" x="38" y="272">retryable, so it was retried</text>

  <rect class="d098f-bad" x="24" y="298" width="200" height="86" rx="6"/>
  <text class="d098f-mono" x="38" y="322">charlie 500, 500, 500</text>
  <text class="d098f-t"    x="38" y="346">0 records, skipped</text>
  <text class="d098f-note" x="38" y="370">the run continues without it</text>

  <path class="d098f-retry" d="M 214 268 C 250 268 250 214 214 214" marker-end="url(#d098f-arrowr)"/>
  <text class="d098f-note" x="256" y="248">retry &#215;2</text>

  <!-- Stage 1 -->
  <rect class="d098f-box d098f-stage d098f-s1" x="340" y="122" width="230" height="150" rx="8"/>
  <text class="d098f-h2"  x="356" y="150">1. INGEST</text>
  <text class="d098f-big" x="356" y="188">9 records</text>
  <text class="d098f-t"   x="356" y="214">2 sources answered</text>
  <text class="d098f-t"   x="356" y="236">1 source dark</text>
  <text class="d098f-note" x="356" y="260">7 HTTP attempts in total</text>

  <path class="d098f-wireok" d="M 224 155 L 340 175" marker-end="url(#d098f-arrowok)"/>
  <path class="d098f-wireok" d="M 224 240 L 340 205" marker-end="url(#d098f-arrowok)"/>
  <path class="d098f-wirex"  d="M 224 340 L 320 340 L 320 250 L 340 240" marker-end="url(#d098f-arrowx)"/>

  <!-- Stage 2 -->
  <rect class="d098f-box d098f-stage d098f-s2" x="640" y="122" width="230" height="150" rx="8"/>
  <text class="d098f-h2"  x="656" y="150">2. VALIDATE</text>
  <text class="d098f-biggrn" x="656" y="188">7 accepted</text>
  <text class="d098f-bigred" x="656" y="222">2 rejected</text>
  <text class="d098f-note" x="656" y="250">the run did not stop</text>
  <path class="d098f-wire" d="M 570 197 L 640 197" marker-end="url(#d098f-arrow)"/>

  <rect class="d098f-bad" x="640" y="288" width="380" height="96" rx="6"/>
  <text class="d098f-lead" x="654" y="312">Rejected, with the reason a source owner can act on</text>
  <text class="d098f-mono" x="654" y="338">a-3  temperature_c: not a valid number</text>
  <text class="d098f-mono" x="654" y="362">a-5  humidity_pct: must be &#8804; 100</text>
  <path class="d098f-wirex" d="M 755 272 L 755 288" marker-end="url(#d098f-arrowx)"/>

  <!-- Stage 3 -->
  <rect class="d098f-box d098f-stage d098f-s3" x="940" y="122" width="230" height="150" rx="8"/>
  <text class="d098f-h2"  x="956" y="150">3. STORE</text>
  <text class="d098f-big" x="956" y="188">6 inserted</text>
  <text class="d098f-t"   x="956" y="216">1 duplicate skipped</text>
  <text class="d098f-t"   x="956" y="238">(a-4 repeats a-2)</text>
  <text class="d098f-note" x="956" y="262">table now holds 6 rows</text>
  <path class="d098f-wire" d="M 870 197 L 940 197" marker-end="url(#d098f-arrow)"/>

  <!-- Stage 4 -->
  <rect class="d098f-box d098f-stage d098f-s4" x="1170" y="420" width="215" height="180" rx="8"/>
  <text class="d098f-h2"  x="1186" y="448">4. REPORT</text>
  <text class="d098f-t"   x="1186" y="474">as of 2026-08-16T12:00Z</text>
  <text class="d098f-big" x="1186" y="508">5 in window</text>
  <text class="d098f-t"   x="1186" y="534">of 6 stored</text>
  <text class="d098f-t"   x="1186" y="558">1 suspect, flagged</text>
  <text class="d098f-note" x="1186" y="582">not deleted</text>

  <!-- Stage 5 -->
  <rect class="d098f-box d098f-stage d098f-s5 d098f-pulse" x="1170" y="628" width="215" height="150" rx="8"/>
  <text class="d098f-h2"  x="1186" y="656">5. OBSERVE</text>
  <text class="d098f-t"   x="1186" y="682">5 stage lines, 1 run id</text>
  <text class="d098f-t"   x="1186" y="706">secret redacted</text>
  <text class="d098f-bigred" x="1186" y="742">exit 3</text>
  <text class="d098f-note" x="1186" y="768">partial success</text>

  <!-- The store, and the two runs -->
  <rect class="d098f-plain" x="340" y="420" width="780" height="358" rx="8"/>
  <text class="d098f-h2" x="356" y="448">THE STORE, AND WHAT THE SECOND RUN DOES TO IT</text>
  <text class="d098f-lead" x="356" y="476">UNIQUE (station_id, reading_id) &#8212; the idempotence key</text>

  <rect class="d098f-ok" x="356" y="494" width="360" height="150" rx="6"/>
  <text class="d098f-lead" x="372" y="518">RUN 1 &#183; run-cli000001</text>
  <text class="d098f-mono" x="372" y="544">considered  7</text>
  <text class="d098f-mono" x="372" y="568">inserted    6</text>
  <text class="d098f-mono" x="372" y="592">duplicates  1</text>
  <text class="d098f-mono" x="372" y="616">total_rows  6</text>

  <rect class="d098f-ok" x="740" y="494" width="360" height="150" rx="6"/>
  <text class="d098f-lead" x="756" y="518">RUN 2 &#183; run-cli000002</text>
  <text class="d098f-mono" x="756" y="544">considered  7</text>
  <text class="d098f-mono" x="756" y="568">inserted    0</text>
  <text class="d098f-mono" x="756" y="592">duplicates  7</text>
  <text class="d098f-mono" x="756" y="616">total_rows  6</text>

  <text class="d098f-t" x="356" y="676">Same fetch. Same validation. Same report, byte for byte. Same exit code.</text>
  <text class="d098f-lead" x="356" y="702">Nothing had to be cleaned up first, and nothing was stored twice.</text>
  <text class="d098f-note" x="356" y="730">That is what makes &#8220;run it again&#8221; a complete remedy for a network blip, a source</text>
  <text class="d098f-note" x="356" y="752">outage, a bad deploy or a schedule that was missed while the machine was asleep.</text>

  <path class="d098f-wire" d="M 1055 272 L 1055 420" marker-end="url(#d098f-arrow)"/>
  <path class="d098f-wire" d="M 1120 500 L 1170 500" marker-end="url(#d098f-arrow)"/>
  <path class="d098f-wire" d="M 1277 600 L 1277 628" marker-end="url(#d098f-arrow)"/>

  <!-- Travelling token -->
  <circle class="d098f-token" cx="290" cy="197" r="10" fill="#1d4ed8"/>

  <text class="d098f-note" x="24" y="838">Exit 3, not 0: one source is dark and two records were rejected. Exit 3, not 1: five stages ran and six rows are stored.</text>
  <text class="d098f-note" x="24" y="862">Collapsing 3 into 0 lets a source go dark for a month. Collapsing 3 into 1 trains everyone to ignore the alert.</text>
</svg>
