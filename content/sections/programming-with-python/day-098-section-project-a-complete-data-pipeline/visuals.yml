visuals:
  - id: pipeline-architecture
    file: assets/pipeline-architecture.svg
    type: diagram
    title: 'The five stages of the pipeline, the promise each one guarantees, and the day it comes from'
    alt: 'Diagram: the five pipeline stages — ingest, validate, store, report and observe — each labelled with the promise it guarantees and the earlier day that taught it, with configuration entering from the left through four ordered layers, the store beneath holding a readings table keyed on a unique idempotence key, and a structured log lane below ending in the exit code a scheduler reads'
    description: 'A static architecture diagram of the whole pipeline. On the far left, a configuration panel labelled Day 97 lists the four layers in precedence order — defaults, a TOML file, the environment, and the command line — and notes that each resolved value remembers which layer won it and that secrets print redacted. An arrow runs from it into the stage band. Five stage boxes run left to right, each carrying a number, a name, the earlier days it draws on in orange, the promise it guarantees, and the tools it uses. Stage one, INGEST, Days 78 and 84: every fetch has a deadline, only failures worth retrying are retried, and a source that never answers does not take the run down with it, built on urllib.request with a timeout and exponential backoff. Stage two, VALIDATE, Day 94: every bad record is collected, counted and explained well enough to fix the source, never the first one only, built on pydantic with extra forbidden, range constraints and timezone-aware timestamps. Stage three, STORE, Days 88, 91 and 93: running the pipeline twice stores the data once, enforced by the schema and counted honestly by the application, built on SQLAlchemy 2.0 with a UNIQUE constraint and ON CONFLICT DO NOTHING. Stage four, REPORT, Days 86, 91 and 95: the report instant is a parameter rather than a clock reading, so the answer is testable, backfillable and the same tomorrow, built on a select over a window with ISO 8601 in UTC. Stage five, OBSERVE, Days 81 and 97: one structured line per stage, one run id through all of them, and an exit code a scheduler can act on without reading English, with JSON per line and secrets redacted in the logger. Beneath the stages, a green store panel shows the SQLite schema reached through SQLAlchemy — a readings table with its columns, the UNIQUE constraint on station id and reading id annotated as the idempotence key that makes a rerun safe, two CHECK constraints, an index on the observed-at column, and a runs table with one row per run — noting that every row names the run that wrote it so undoing one run is a single DELETE rather than a guess. A green arrow runs down from the store stage labelled writes only what is new, and another runs back up to the report stage labelled reads the window. Below that, an amber log lane shows one JSON object per line on stderr with a sample line, lists the five stage events plus run start and run end and a warning per rejected record, and states that the report goes to stdout while the log goes to stderr because they are two different audiences, and that a secret an upstream echoes back is redacted once where nobody can forget it. Amber arrows fall from every stage into the log lane. At the right of the lane, an exit-code box gives 0 for success, 3 for partial success and 1 for failure, described as the only sentence the scheduler can read.'
  - id: pipeline-run-flow
    file: assets/pipeline-run-flow.svg
    type: flow-animated
    title: 'One pipeline run end to end, with the real counts, and what changes on the second run'
    alt: 'Diagram: one pipeline run end to end with real counts — three sources fetched with one retried twice and one skipped permanently, nine records reaching the validation gate which accepts seven and rejects two by name and reason, six rows stored on the first run and none on the second while the table still holds six, a report built at a fixed instant finding five readings in the window and one implausible jump flagged rather than deleted, and an exit code of 3 for partial success'
    description: 'An animated flow diagram of a single pipeline run, readable in full as a still image. On the left, three source boxes: alpha in green answering 200 on the first try with five records of which two are bad; bravo in amber answering 500, 500 and then 200, delivering four records after three attempts, annotated as retryable and therefore retried, with an amber looping arrow labelled retry twice; and charlie in red answering 500 three times, delivering nothing, annotated that the run continues without it. Green marching-dash wires carry alpha and bravo into stage one; a red dashed wire carries charlie in as a failure. Stage one, INGEST, reports nine records, two sources answered, one source dark, and seven HTTP attempts in total. A blue marching-dash wire leads to stage two, VALIDATE, which reports seven accepted in green and two rejected in red, with a note that the run did not stop; a red wire drops from it into a rejection panel naming a-3 for a temperature that is not a valid number and a-5 for a humidity that must be at most 100, headed as the reason a source owner can act on. Another wire leads to stage three, STORE, which reports six inserted, one duplicate skipped because a-4 repeats a-2, and a table now holding six rows. Below the stage band sits a wide panel titled the store and what the second run does to it, headed by the UNIQUE constraint on station id and reading id described as the idempotence key, containing two green run boxes side by side: run one considered 7, inserted 6, duplicates 1, total rows 6; run two considered 7, inserted 0, duplicates 7, total rows 6. Underneath, three lines state that the fetch, the validation, the report byte for byte and the exit code were all the same, that nothing had to be cleaned up first and nothing was stored twice, and that this is what makes running it again a complete remedy for a network blip, a source outage, a bad deploy or a schedule missed while the machine was asleep. To the right, stage four, REPORT, gives the fixed instant of 2026-08-16 at 12:00 UTC, five readings in window of six stored, and one suspect reading flagged rather than deleted; below it stage five, OBSERVE, gives five stage lines carrying one run id, the secret redacted, and an exit code of 3 for partial success. A blue token travels along the stage band from the sources through ingest, validate and store, and each stage lights up briefly in turn on an eight-second cycle, with the observe box pulsing last as the exit code is set. Two closing lines explain the exit code: 3 rather than 0 because one source is dark and two records were rejected, 3 rather than 1 because five stages ran and six rows are stored, and that collapsing 3 into 0 lets a source go dark for a month while collapsing 3 into 1 trains everyone to ignore the alert. A prefers-reduced-motion block stops every animation and restores the resting state, in which all five stages are shaded, every wire is drawn solid, every count is written out and the token sits at the start of the band.'
