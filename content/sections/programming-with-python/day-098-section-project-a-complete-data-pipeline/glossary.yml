terms:
  - term: 'Pipeline'
    definition: 'A program that moves data from where it is produced to where it is asked questions, in stages. The word is misleading if you hear it as plumbing: the code that moves the data is the easy half. A pipeline is defined by its behaviour when a stage fails — which is why it is more useful to think of it as a set of promises about what happens when something goes wrong than as a sequence of transformations.'
  - term: 'Stage'
    definition: 'One step of a pipeline with a single responsibility and a single promise. This day uses five — ingest, validate, store, report, observe. The value of the division is not tidiness: it is that when a run goes wrong, the stage boundary tells you where to look, and each stage can be tested on its own because its inputs and outputs are ordinary values.'
  - term: 'Ingest'
    definition: 'The stage that brings data in from somewhere you do not control. Its whole design problem is that the source is allowed to be slow, wrong, absent or hostile, and none of those may end the run. Three defences: a timeout on every call, a bounded retry for failures that describe a moment rather than a mistake, and a result type that can represent failure instead of raising.'
  - term: 'Idempotence'
    definition: 'The property that doing something twice has the same effect as doing it once. For a pipeline it is the single most valuable property available, because it converts almost every failure into the same remedy — run it again. A run that crashed halfway, a source that was down, a deploy that went out wrong, a schedule missed while the machine was asleep: all of them are fixed by rerunning, and none of them are if the rerun doubles your data.'
  - term: 'Idempotence key'
    definition: 'The column or set of columns that identifies a record by what it *is* rather than by when it arrived — here the pair (station_id, reading_id) assigned by the source. Declared UNIQUE, it is what makes a second run store nothing. Choosing it is a modelling decision, not a technical one: it is an answer to the question "what would make two arriving records the same record?"'
  - term: 'Data-quality gate'
    definition: 'A validation boundary placed where untrusted data enters, which decides record by record what is allowed to go further. Two properties separate a gate from a type annotation: it collects every failure rather than stopping at the first, and each rejection carries enough detail — the field path and the reason — for somebody who owns the source to fix it. In this day it is a pydantic model with ranges, forbidden extra fields, and a requirement that timestamps carry an offset.'
  - term: 'Partial success'
    definition: 'A run that did its job for some of its inputs and not for others: four sources answered and one did not, or 9,996 records were good and four were not. It is a third outcome, not a rounding error on the other two, and it needs its own exit code. Reporting it as success is how a source goes dark for a month unnoticed; reporting it as failure trains everyone to ignore the alert.'
  - term: 'Valid but wrong'
    definition: 'A record that satisfies every rule the gate can express and is nonetheless untrue — 41.3 Celsius five minutes after 15.0 Celsius from a station that has not moved. No field-level rule catches it, because every field is legal; only a rule about the sequence or the context can. The right response is to store it and flag it, never to drop it: a visible anomaly somebody must look at is strictly better than an invisible gap nobody will.'
  - term: 'Backfill'
    definition: 'Running a pipeline for a period in the past — usually because a scheduled run was missed, a source was down, or a bug meant the data you stored was wrong. It is only cheap if two things are already true: the report instant is a parameter rather than a clock reading, so you can ask about last Tuesday; and the store is idempotent, so a backfill that overlaps data you already hold changes nothing.'
  - term: 'Run id'
    definition: 'A single identifier generated once per execution and carried on every log line and, here, on every stored row. It is what turns a pile of log lines into a story: without it, a system with two concurrent runs can tell you that something failed but not which run it was. Stored alongside the data, it also makes an undo possible — deleting exactly what one run wrote is one statement rather than a reconstruction.'
  - term: 'Structured log'
    definition: 'A log where each line is a machine-parseable object — here one JSON object per line — rather than a sentence. The difference matters on the day you need it: a prose line has to be parsed with a regular expression that breaks the first time somebody adds a word, while a JSON line can be filtered, counted and joined. Structure also makes redaction possible in one place, because the logger can walk the values before writing them.'
  - term: 'Provenance (of configuration)'
    definition: 'The record of which layer supplied each resolved setting — a default, a file, an environment variable or a command-line flag. Knowing that the timeout is three seconds is half an answer at three in the morning; knowing it is three seconds *because the deployment config file says so, and nobody overrode it* is the whole answer. A configuration system that cannot print its own provenance is a configuration system you debug by guessing.'
  - term: 'Exit code'
    definition: 'The integer a process returns to whatever started it, and the only thing cron, launchd, systemd and every CI runner knows about your program. Zero conventionally means success and any non-zero value means something else; the choice of *which* non-zero value is yours, and using distinct codes for "could not run at all" and "ran, stored what it could, one source is dark" is what lets a scheduler react differently to the two.'
  - term: 'Fixture server'
    definition: 'A small HTTP server run locally that stands in for a real API during development and testing. Binding 127.0.0.1 on port 0 lets the kernel pick a free port, which avoids collisions with whatever else is running. Its real value is that it can be hostile on demand — failing twice and then recovering, failing permanently, echoing your token back inside an error body — which a real API will do eventually and never when you are watching.'
  - term: 'Retryable failure'
    definition: 'A failure that describes a moment rather than a mistake, and might therefore not recur: a 500, a 502, a 503, a 504, a 429, a connection reset, a timeout. Retrying anything else — a 404, a 401, a 400 — spends round trips to learn what the first attempt already told you, and delays every source behind it. The distinction is a policy decision you write down, not something the HTTP library decides for you.'
  - term: 'Exponential backoff'
    definition: 'Waiting longer between each successive retry, usually by doubling — 50 milliseconds, then 100, then 200. It exists because a service that just failed is often a service under load, and a client that retries immediately three times is three times the load at the worst possible moment. In production, add jitter so that a fleet of clients does not retry in lockstep, and honour Retry-After when the server sends one.'
  - term: 'Orchestrator'
    definition: 'A system that runs pipelines rather than being one: it schedules tasks, tracks dependencies between them, retries individual tasks, records the history of every run, and gives you a user interface to inspect and rerun. Airflow, Dagster and Prefect are the widely used open-source ones. An orchestrator supplies none of the five promises in this lesson — it would run this same program — and it starts earning its keep when you have dependencies between tasks, per-task retry, backfill as a first-class operation, or more than one machine.'
  - term: 'Dead-letter store'
    definition: 'A place where rejected records are kept, with their reason and their original payload, instead of being logged and forgotten. It turns "we dropped 3,942 records last Tuesday" from an archaeological problem into a replay: fix the source, replay the queue. It is the piece this day''s pipeline deliberately does not have, and the extension exercise that most changes how the validation stage feels.'
