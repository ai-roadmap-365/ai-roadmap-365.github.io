title: 'Section Project: A Complete Data Pipeline'
section: programming-with-python
subsection: data-and-databases
week: 14
learning_promise: 'After this lesson you will be able to design and build a data pipeline as a set of promises rather than as a sequence of transformations — fetching with a deadline and retrying only failures that describe a moment rather than a mistake; putting a validation gate at the boundary that collects every bad record with a field path and a reason instead of dying on the first; choosing an idempotence key, enforcing it in the schema and pre-checking it in the application, and saying exactly which of those two keeps the data right and which keeps the report honest; building a report at a parameterised instant so its numbers are testable, backfillable and reproducible; emitting one structured log line per stage with a run id threaded through and a redaction filter that catches a secret an upstream service echoed back; resolving configuration through four ordered layers and printing where every value came from; returning three different exit codes for success, partial success and failure, and stating what each collapse costs; recognising a record that is valid but wrong and arguing for flagging it rather than dropping it; placing concurrency where it pays and saying why it does not pay elsewhere; and naming honestly the point at which this design stops being enough and Airflow, Dagster, Prefect or dbt starts earning its keep.'
objectives:
  - 'Describe a pipeline as five stages each carrying one promise about what happens when something goes wrong, and name which earlier day supplies each promise'
  - 'Fetch from an unreliable source with a timeout on every call and a bounded retry, and decide from a status code whether a failure describes a moment or a mistake'
  - 'Design an ingest stage that reports partial success as a value rather than raising, so one dark source does not discard four working ones'
  - 'Build a pydantic validation gate that collects every rejection with a field path and a reason, counts the reasons per field, and never ends the run for one bad record'
  - 'Choose an idempotence key by asking what would make two arriving records the same record, and declare it as a UNIQUE constraint'
  - 'Explain why idempotence needs two layers — a schema constraint that keeps the data right and an application pre-check that keeps the reported count honest — using the observed failure where the table holds six rows and the log claims six inserts'
  - 'Demonstrate that running a pipeline twice stores the data once, with the report and the exit code identical both times'
  - 'Build a report at a parameterised instant and state the three things that buys: a testable number, a backfill, and an incident timeline'
  - 'Recognise a record that is valid but wrong, explain why no field-level rule can catch it, and argue for storing and flagging it rather than dropping it'
  - 'Emit one structured JSON log line per stage with a run id on every line, and place secret redaction inside the logger where it cannot be forgotten'
  - 'Resolve configuration through defaults, a file, the environment and the command line, and print the provenance of every resolved value'
  - 'Assign three distinct exit codes to success, partial success and failure, and state the specific cost of collapsing either pair'
  - 'Place concurrency where it pays in a pipeline — the fetch is waiting work, the validation is not, the SQLite writer is single by design — and justify each placement rather than reciting it'
  - 'Plan a backfill and explain why it is only cheap when the report instant is a parameter and the store is idempotent'
  - 'Compare a scheduled Python process against Airflow, Dagster, Prefect, dbt and a cron job with a shell script, with when to choose each and free versus paid stated'
prerequisites:
  - 'Day 78 — HTTP in Python, status codes, timeouts, and retry with backoff; stage one is that lesson with a budget'
  - 'Day 80 — argparse, so the pipeline can be an ordinary command-line program'
  - 'Day 81 — scheduling, exit codes, and the requirement that a scheduled job be safe to run twice'
  - 'Day 84 — the automation toolkit: partial success as a design, configuration precedence, and a local fixture server standing in for a real API'
  - 'Days 85 to 91 — the relational model, SELECT, constraints, indexes and schema design; the store stage is Day 88 and Day 91 applied without ceremony'
  - 'Day 92 — the non-relational trade-offs, which is why this pipeline stores in a relational table and can say what it gave up'
  - 'Day 93 — SQLAlchemy 2.0 declarative models, the Session, and the cost of an ORM you cannot see through'
  - 'Day 94 — pydantic models, Field constraints, validators and ValidationError'
  - 'Day 95 — timezone-aware datetimes, ISO 8601 in UTC, and the difference between an instant and a calendar date'
  - 'Day 96 — the difference between waiting work and computing work, which decides where concurrency belongs here'
  - 'Day 97 — structured logging, configuration precedence and redaction'
  - 'Day 43 — python3 -m venv; the lab installs three pinned packages into a lab-local virtual environment'
