<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four uses.">
  <title>Post-initialisation</title>
  <style>
    .post-init-bg   { fill: #f8fafc; }
    .post-init-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-init-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-init-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-init-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-init-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .post-init-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .post-init-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .post-init-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .post-init-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .post-init-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .post-init-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .post-init-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .post-init-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .post-init-stage { opacity: 1; }

    .post-init-s0 { animation-delay: 0.00s; }
    .post-init-e0 { animation-delay: 0.00s; }
    .post-init-s1 { animation-delay: 1.28s; }
    .post-init-e1 { animation-delay: 1.28s; }
    .post-init-s2 { animation-delay: 2.56s; }
    .post-init-e2 { animation-delay: 2.56s; }
    .post-init-s3 { animation-delay: 3.84s; }
    .post-init-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .post-init-conn  { animation: post-init-trace 6.4s ease-in-out infinite; }
      .post-init-stage { animation: post-init-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes post-init-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes post-init-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .post-init-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .post-init-stage { animation: post-init-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes post-init-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="post-init-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="post-init-bg" width="980" height="322"/>
  <text class="post-init-h1"  x="30" y="40">Post-initialisation</text>
  <text class="post-init-sub" x="30" y="64">Four uses.</text>
  <g class="post-init-stage post-init-s0">
    <rect class="post-init-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="post-init-step" x="44" y="142">01</text>
    <text class="post-init-name" x="70" y="142">Validate the fields once they are all set</text>
    <text class="post-init-desc" x="44" y="166">Raising if the combination is</text>
    <text class="post-init-desc" x="44" y="182">invalid.</text>
  </g>
  <line class="post-init-line post-init-conn post-init-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#post-init-tip)"/>
  <g class="post-init-stage post-init-s1">
    <rect class="post-init-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="post-init-step" x="280" y="142">02</text>
    <text class="post-init-name" x="306" y="142">Compute derived fields from the given ones</text>
    <text class="post-init-desc" x="280" y="166">Which the generated initialiser</text>
    <text class="post-init-desc" x="280" y="182">cannot.</text>
  </g>
  <line class="post-init-line post-init-conn post-init-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#post-init-tip)"/>
  <g class="post-init-stage post-init-s2">
    <rect class="post-init-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="post-init-step" x="516" y="142">03</text>
    <text class="post-init-name" x="542" y="142">Normalise values into a canonical form</text>
    <text class="post-init-desc" x="516" y="166">Trimming, lowercasing,</text>
    <text class="post-init-desc" x="516" y="182">converting.</text>
  </g>
  <line class="post-init-line post-init-conn post-init-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#post-init-tip)"/>
  <g class="post-init-stage post-init-s3">
    <rect class="post-init-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="post-init-step" x="752" y="142">04</text>
    <text class="post-init-name" x="778" y="142">And it runs after every field is assigned</text>
    <text class="post-init-desc" x="752" y="166">So the object is complete when</text>
    <text class="post-init-desc" x="752" y="182">it sees it.</text>
  </g>
  <text class="post-init-sub" x="30" y="304">Validating the combination rather than each field individually is what this hook is for, since cross-field rules cannot be expressed on a single field.</text>
</svg>
