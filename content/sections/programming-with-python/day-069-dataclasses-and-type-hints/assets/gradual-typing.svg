<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where they do not.">
  <title>Where hints pay</title>
  <style>
    .gradual-typing-bg   { fill: #f8fafc; }
    .gradual-typing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-typing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradual-typing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradual-typing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradual-typing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradual-typing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradual-typing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradual-typing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradual-typing-row { opacity: 1; }
    .gradual-typing-r0 { animation-delay: 0.00s; }
    .gradual-typing-r1 { animation-delay: 0.45s; }
    .gradual-typing-r2 { animation-delay: 0.90s; }
    .gradual-typing-r3 { animation-delay: 1.35s; }
    .gradual-typing-r4 { animation-delay: 1.80s; }
    .gradual-typing-row { animation: gradual-typing-reveal 7.3s ease-in-out infinite; }
    @keyframes gradual-typing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gradual-typing-bg" width="980" height="390"/>
  <text class="gradual-typing-h1"  x="30" y="40">Where hints pay</text>
  <text class="gradual-typing-sub" x="30" y="64">And where they do not.</text>
  <rect class="gradual-typing-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gradual-typing-name" x="46" y="122">Worth annotating</text>
  <text class="gradual-typing-desc" x="46" y="142">Four places.</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r0" x="46" y="182">Public function signatures</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r1" x="46" y="216">Module boundaries and interfaces</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r2" x="46" y="250">Anything a checker runs over</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r3" x="46" y="284">Data structures and records</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r4" x="46" y="318">Where the type is not obvious</text>
  <rect class="gradual-typing-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gradual-typing-name" x="526" y="122">Usually noise</text>
  <text class="gradual-typing-desc" x="526" y="142">Also four.</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r0" x="526" y="182">Obvious local variables</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r1" x="526" y="216">Short internal helpers</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r2" x="526" y="250">Throwaway scripts</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r3" x="526" y="284">Where the annotation restates the assignment</text>
  <text class="gradual-typing-desc gradual-typing-row gradual-typing-r4" x="526" y="318">Where it is longer than the code</text>
  <text class="gradual-typing-sub" x="30" y="372">Annotating boundaries and leaving internals bare captures most of the benefit for a fraction of the effort, which is what gradual typing is for.</text>
</svg>
