<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use a dataclass</title>
  <style>
    .dataclass-when-bg   { fill: #f8fafc; }
    .dataclass-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dataclass-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataclass-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dataclass-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dataclass-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dataclass-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dataclass-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dataclass-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dataclass-when-row { opacity: 1; }
    .dataclass-when-r0 { animation-delay: 0.00s; }
    .dataclass-when-r1 { animation-delay: 0.45s; }
    .dataclass-when-r2 { animation-delay: 0.90s; }
    .dataclass-when-r3 { animation-delay: 1.35s; }
    .dataclass-when-r4 { animation-delay: 1.80s; }
    .dataclass-when-row { animation: dataclass-when-reveal 7.3s ease-in-out infinite; }
    @keyframes dataclass-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dataclass-when-bg" width="980" height="390"/>
  <text class="dataclass-when-h1"  x="30" y="40">When to use a dataclass</text>
  <text class="dataclass-when-sub" x="30" y="64">And when not to.</text>
  <rect class="dataclass-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dataclass-when-name" x="46" y="122">Use one</text>
  <text class="dataclass-when-desc" x="46" y="142">Four cases.</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r0" x="46" y="182">A record with named fields</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r1" x="46" y="216">Configuration objects</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r2" x="46" y="250">Anything compared by value</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r3" x="46" y="284">Structured data passed between functions</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r4" x="46" y="318">Where a dictionary is losing its shape</text>
  <rect class="dataclass-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dataclass-when-name" x="526" y="122">Use something else</text>
  <text class="dataclass-when-desc" x="526" y="142">Also four.</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r0" x="526" y="182">Behaviour-rich objects — a plain class</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r1" x="526" y="216">Runtime validation needed — a validating model</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r2" x="526" y="250">Truly dynamic keys — a dictionary</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r3" x="526" y="284">Fixed, tiny and immutable — a named tuple</text>
  <text class="dataclass-when-desc dataclass-when-row dataclass-when-r4" x="526" y="318">Where no structure is needed at all</text>
  <text class="dataclass-when-sub" x="30" y="372">A dictionary losing its shape is the clearest signal to reach for this: once you are guessing which keys exist, a declared record is overdue.</text>
</svg>
