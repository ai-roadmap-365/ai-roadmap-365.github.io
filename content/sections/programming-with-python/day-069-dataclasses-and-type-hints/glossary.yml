terms:
  - term: dataclass
    definition: 'An ordinary class whose boilerplate methods were generated for you from annotated field declarations. The `@dataclass` decorator reads the class''s annotations at class-creation time and attaches `__init__`, `__repr__` and `__eq__` — and, on request, comparison and hashing methods too.'
  - term: annotation
    definition: 'A recorded claim about what a name is supposed to hold, written as `score: float`. Python evaluates it once, stores it in `__annotations__`, and never compares any value against it. It is the label printed beside a blank on a form: useful, checkable by tools, and powerless on its own.'
  - term: '__annotations__'
    definition: 'The dictionary Python builds on a class or function holding every annotated name in declaration order. It is what makes annotations useful at runtime to tools rather than to the interpreter — and it is precisely what `@dataclass` reads to work out what the fields are.'
  - term: type hint
    definition: 'An annotation used to describe types, in the sense standardised by PEP 484. Its audience is offline checkers, editors and human readers; the PEP states explicitly that Python will not enforce it at runtime.'
  - term: static type checker
    definition: 'A separate program that reads your source without executing it, models every annotation, and reports where an expression contradicts what the annotations promise. mypy and pyright are the two mainstream ones; both are free and open source. The clerk who reads the filled form before it is filed.'
  - term: gradual typing
    definition: 'PEP 484''s design principle that you may annotate as much or as little of a codebase as you like, with unannotated code simply going unchecked. It is what makes it reasonable to annotate boundaries and data models while leaving obvious locals alone.'
  - term: field()
    definition: 'The `dataclasses` function that specifies one field in more detail than a bare default allows — supplying `default_factory`, or setting `init=False`, `repr=False`, and similar per-field options.'
  - term: default_factory
    definition: 'A callable stored on a field and invoked once per instance to produce that instance''s default value. It is the only correct way to default a list, dict or set, because a plain default object would be created once and shared by every instance.'
  - term: mutable default trap
    definition: 'The bug where a mutable default value is created once and silently shared. In a plain function signature (`def f(bucket=[])`) Python permits it and the sharing goes unnoticed; in a dataclass it is refused outright with a `ValueError` at class creation that names `default_factory` as the fix.'
  - term: '__post_init__'
    definition: 'A method the generated `__init__` calls after assigning the fields. It is where validation and derived fields belong, and — unlike an annotation — it actually runs and can raise, making it the only enforcement in a plain dataclass.'
  - term: derived field
    definition: 'A field computed from the others rather than passed in, declared with `field(init=False, ...)` so it is not a constructor parameter, and filled in by `__post_init__`.'
  - term: frozen dataclass
    definition: 'A dataclass declared `frozen=True`, whose generated `__setattr__` raises `FrozenInstanceError` on assignment. Because the field values can then never change, a generated `__hash__` can never go stale — which is what makes frozen instances usable as dictionary keys and set members.'
  - term: 'dataclasses.fields()'
    definition: 'A function returning the `Field` objects a dataclass was built from, each recording a name, a type, and a default or default factory. It is how you inspect the result of the code generation instead of taking it on trust.'
  - term: asdict
    definition: 'A `dataclasses` function that walks an instance recursively and returns plain dicts and lists — exactly what `json.dumps` accepts. There is deliberately no automatic reverse: rebuilding objects from parsed data is code you write.'
  - term: replace
    definition: 'A `dataclasses` function returning a copy of an instance with some fields changed. It works by calling the class''s `__init__`, so `__post_init__` runs and the new values are revalidated — which makes it the correct way to "modify" a frozen instance.'
  - term: builtin generic
    definition: 'The modern spelling for a parameterised container type, written with the builtin itself: `list[int]`, `dict[str, float]`, `tuple[int, ...]`. Older code imports capitalised equivalents from `typing` and means the same thing.'
  - term: Any
    definition: 'The typing escape hatch meaning "stop checking here" rather than "some type". A value typed `Any` may be passed anywhere and have anything called on it, so it silently disables checking for everything downstream — deliberate at a genuinely dynamic boundary, a bad habit elsewhere.'
  - term: Literal
    definition: 'An annotation restricting a value to a fixed set of constants, such as `Literal["train", "test"]`. It lets a checker catch a misspelled mode string that a plain `str` annotation would wave through.'
  - term: TypedDict
    definition: 'An annotation describing a dictionary with known keys and a type per key. It is how you type JSON-shaped data that must stay a dict rather than becoming a class.'
  - term: Protocol
    definition: 'The typing form of duck typing: a declaration that any object with the right methods satisfies the type, with no inheritance and no registration. Structural typing — the shape is the type — as against the nominal typing of a base class.'
  - term: type alias
    definition: 'A name bound to a type expression, such as `Scores = dict[str, list[float]]`. Written once, it replaces a repeated and unreadable expression across many signatures, and is among the cheapest readability wins available.'
  - term: pydantic
    definition: 'A free, open-source library that reads the same annotated declarations as a dataclass but validates and coerces values against them at runtime, raising when input does not match. In one line: dataclasses plus the clerk built in — which is why it underpins most structured-output and tool-calling interfaces.'
  - term: attrs
    definition: 'The third-party library that inspired PEP 557 and still offers more than the standard library — inline per-field converters and validators among them. Free and open source; `@dataclass` is the deliberately smaller version of the same idea.'
  - term: 'typing.NamedTuple'
    definition: 'An annotated, immutable tuple subclass. It unpacks and indexes like a tuple and compares equal to a plain tuple with the same values — convenient in some code, confusing in others. A frozen dataclass gives immutability without the tuple-ness.'
  - term: slots
    definition: 'The `slots=True` option, which generates a class using `__slots__` so instances carry no per-instance dictionary. It saves memory when you hold very many small records, at the cost of forbidding attributes that were not declared as fields.'
  - term: kw_only
    definition: 'The `kw_only=True` option, making every field keyword-only in the generated `__init__`. It earns its place on records with many fields, where positional construction becomes unreadable and reordering the declarations would silently change what a call site means.'
