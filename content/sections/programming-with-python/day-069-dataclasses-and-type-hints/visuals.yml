visuals:
  - id: dataclass-generation
    file: assets/dataclass-generation.svg
    type: diagram
    title: 'What @dataclass generates, and what it reads to do it'
    alt: 'Diagram: how @dataclass turns annotated field declarations into a working class — the decorator reads the class''s __annotations__ dictionary and the values beside each name, turns each annotated name into a Field object recording its name, type, and default or default_factory, generates __init__, __repr__ and __eq__ from that ordered list and attaches them to the class, and the finished class then builds instances that each get their own value for every field, with default_factory called once per instance so no two instances share a mutable default'
    description: 'A five-stage architecture diagram read left to right and then downward. Stage one is what you write: a class body containing only annotated field declarations, including a plain default (score: float = 0.0) and a field() specification with default_factory. Stage two is what the decorator reads at class-creation time — the class''s __annotations__ dictionary, in declaration order, plus whatever value sits beside each name in the class body. Stage three is the ordered list of Field objects it derives, each recording name, type, default and default_factory, and each readable afterwards through dataclasses.fields(). Stage four is the code generation: __init__ with one parameter per field in declaration order and defaults last, ending in a call to __post_init__; __repr__ printing every field not marked repr=False; and __eq__ comparing the tuple of field values only against the same class. A dashed side panel lists what is generated only on request — frozen=True adding __setattr__ and __hash__, order=True adding the four comparison methods. Stage five shows two constructed instances side by side, each with its own empty tags list, illustrating that default_factory is called once per instance rather than shared.'
  - id: type-checking-flow
    file: assets/type-checking-flow.svg
    type: flowchart
    title: 'One annotated file, two paths that never meet'
    alt: 'Flowchart: the two separate paths one annotated source file takes — on the static path a type checker reads the file without executing it, builds a model of every annotation, compares each expression and call against what those annotations promise, and reports contradictions before anything runs; on the runtime path the interpreter executes the file, evaluates each annotation and stores it in __annotations__ where tools such as @dataclass can read it, but never compares a value against one, so a function annotated to return a string can return a float and the program carries on until the failure surfaces somewhere else entirely'
    description: 'A single annotated source file at the top — a function declared to return str whose body returns a float — splits into two parallel vertical paths separated by a dashed divider. The left, static path: a type checker (mypy, pyright, or an editor running one) parses the file without executing it, builds a model of every annotation, compares every expression, call and return against what those annotations promise, and reports the contradictions before anything runs, with nothing executed and no data touched. The right, runtime path: the interpreter executes the file, evaluates each annotation and stores it in __annotations__ where tools can read it — which is exactly how @dataclass finds its fields — but never compares a value against one, so the float is returned, nothing raises, and the program continues with the wrong type until the failure surfaces somewhere else entirely. A closing note records that only __post_init__ or an explicit isinstance check enforces a type at runtime.'
