id: D069
day: 69
slug: dataclasses-and-type-hints
title: 'Dataclasses and Type Hints'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will be able to replace hand-written record classes with dataclasses and read annotations for what they really are: you will declare fields once and have __init__, __repr__ and __eq__ generated for you, choose frozen, order, slots and kw_only on purpose, escape the mutable default trap with field(default_factory=...), validate and derive fields in __post_init__, round-trip records through JSON with asdict and replace, write modern type-hint syntax, explain precisely why Python stores annotations without ever enforcing them, and prove it by rebuilding @dataclass yourself from __annotations__ in about forty lines.'
objectives:
  - 'Explain the boilerplate problem by comparing a hand-written record class with its dataclass equivalent line for line, and count the repetition the decorator removes'
  - 'Describe how @dataclass actually works — reading __annotations__ at class creation and code-generating methods — and inspect the result with dataclasses.fields()'
  - 'Choose the dataclass parameters that matter (frozen, order, slots, kw_only, eq, repr) on purpose, and explain why frozen=True is what makes instances hashable'
  - 'Diagnose the mutable default trap in both its forms: silently shared in a plain function signature, and refused outright with a ValueError in a dataclass — and fix it with field(default_factory=list)'
  - 'Use __post_init__ for validation and derived fields, and explain why it is the only thing on the page that enforces anything at runtime'
  - 'Serialise and copy records with asdict, astuple and replace, and build a lossless JSON round trip on top of the generated __eq__'
  - 'Write modern type-hint syntax — builtin generics, X | None, tuple[int, ...], Callable, type aliases, Literal, Any, TypedDict and Protocol — and say where hints pay off versus where they add noise'
  - 'State precisely why annotations are stored but never enforced, and demonstrate it at runtime with __annotations__ and a deliberately contradicted function'
  - 'Build a mini_dataclass decorator from scratch that reads __annotations__ and generates __init__, __repr__ and __eq__, and compare it against the real @dataclass'
prerequisites:
  - 'Day 68: inheritance, composition, and dunder methods — especially __eq__, __hash__, and why defining __eq__ removes the inherited hash'
  - 'Day 67: classes, __init__, attributes, properties, and classmethods'
  - 'Day 66: exceptions and error-handling strategy — raising ValueError and TypeError deliberately'
  - 'Day 65: CSV and JSON in the real world, and Day 64: reading and writing files'
  - 'Days 57-63: functions, closures, decorators, modules, and designing a small program well'
reading_time_minutes: 40
practical_time_minutes: 30
