questions:
  - question: 'What does `@dataclass` read in order to decide what a class''s fields are, and when does it read it?'
    options:
      - 'The class''s `__annotations__` dictionary, once, at class creation time'
      - 'The arguments passed to `__init__`, each time an instance is made'
      - 'A hidden `__fields__` attribute that Python maintains for every class'
      - 'The type of each value assigned in the class body, inferred at runtime'
    answer_index: 0
    explanation: 'When Python finishes executing a class body it collects every annotated name into `__annotations__`, in declaration order. `@dataclass` reads exactly that dictionary, plus any value sitting beside each name, and does so once — when the class is created, not when instances are built. That is why the whole thing is inspectable rather than magical: `dataclasses.fields()` hands you the result.'

  - question: 'A field is declared `tags: list[str] = []`. What happens?'
    options:
      - 'Each instance quietly receives the same shared list'
      - 'The annotation makes Python copy the list for each instance'
      - 'A `ValueError` is raised when the class is created, naming `default_factory` as the fix'
      - 'Nothing happens until you append to one instance''s tags'
    answer_index: 2
    explanation: 'A dataclass inspects its defaults and refuses mutable ones outright: `mutable default <class ''list''> for field tags is not allowed: use default_factory`. Crucially the error arrives at class creation, before any instance exists. This is a rescue — the identical mistake in a plain function signature (`def f(bucket=[])`) raises nothing at all and silently shares one list across every call.'

  - question: 'Why is a plain `@dataclass` instance unhashable, and what fixes it?'
    options:
      - 'Dataclasses are never hashable; you must write `__hash__` by hand'
      - 'It generates `__eq__`, and defining `__eq__` removes the inherited `__hash__`; `frozen=True` restores a generated one'
      - 'It is hashable already; the error comes from an unhashable field value'
      - 'Only `order=True` generates a hash, because hashing requires an ordering'
    answer_index: 1
    explanation: 'Python''s rule from Day 68 applies: a class that defines `__eq__` loses the inherited `__hash__`, because two objects that compare equal must hash equal and the default identity hash cannot promise that. `frozen=True` blocks attribute assignment, so the field values can never change, so a generated hash can never go stale — and `@dataclass` supplies one. That is why the lab''s `RunKey` is frozen: it is used as a dictionary key.'

  - question: 'A function is annotated `def double(number: int) -> int:` and its body is `return number * 2`. You call `double(''ab'')`. What happens?'
    options:
      - 'A `TypeError` is raised because a string was passed where an int was annotated'
      - 'Python coerces the string to an integer before the call'
      - 'The call is refused unless a type checker is installed'
      - 'It returns the string `''abab''` and nothing raises'
    answer_index: 3
    explanation: 'This is the lab''s captured output: `double(''ab'') -> ''abab''`. PEP 484 deliberately declined runtime enforcement — annotations are recorded in `__annotations__` for offline checkers and tools, and no value is ever compared against one. The annotation is the label printed beside the blank on a form; the interpreter is the paper, and paper does not read.'

  - question: 'Where does validation belong in a dataclass, and why can a static type checker not do that job?'
    options:
      - 'In the annotations; a checker enforces them when the module is imported'
      - 'In `__post_init__`, because a checker reasons about your source code rather than about runtime values'
      - 'In `__init__`, which you must write yourself to get any validation at all'
      - 'In `dataclasses.fields()`, which raises when a value contradicts its field spec'
    answer_index: 1
    explanation: '`@dataclass` generates no checks whatsoever, so `score: float` will happily hold 3.0 or a string. The generated `__init__` calls `__post_init__` at the end, which is where rules and derived fields belong — and it is the only thing that actually runs and raises. A checker reads source without executing it, so it can never see the value that arrived from a file or a network response at runtime.'

  - question: 'Which statement about `dataclasses.replace(record, score=0.9)` is correct?'
    options:
      - 'It mutates the record in place, bypassing `frozen=True`'
      - 'It returns a shallow copy without re-running any validation'
      - 'It only works on frozen dataclasses'
      - 'It returns a new instance by calling the class''s `__init__`, so `__post_init__` runs and revalidates'
    answer_index: 3
    explanation: '`replace` merges the changed fields with the existing ones and calls the constructor, which means `__post_init__` runs again and the new value is validated for free. That makes it the correct way to "modify" a frozen instance, and a safer habit than direct mutation even when the class is not frozen — the lab tests exactly this by confirming `rescore(record, 4.0)` still raises.'

  - question: 'What does `typing.Any` do to a value in a type-checked codebase?'
    options:
      - 'It disables checking for that value and everything downstream of it'
      - 'It asks the checker to infer the most specific type it can'
      - 'It behaves exactly like `object`, permitting assignment but not attribute access'
      - 'It causes the checker to emit a warning at every use'
    answer_index: 0
    explanation: '`Any` is not "some type" — it is "stop checking here". A value typed `Any` may be passed anywhere and have anything called on it, so it silently switches off verification for every expression it flows into. That makes it the right tool at a genuinely dynamic boundary and a bad habit when used to make an error message go away. `object`, by contrast, permits assignment but not arbitrary attribute access, so it stays checked.'

  - question: 'How does pydantic differ from a standard-library dataclass, given both declare fields the same way?'
    options:
      - 'pydantic generates faster methods by compiling them ahead of time'
      - 'pydantic uses a different declaration syntax that checkers cannot read'
      - 'pydantic validates and coerces values against the annotations at runtime, raising when input does not match'
      - 'pydantic is a paid library, while dataclasses are free'
    answer_index: 2
    explanation: 'The declarations look alike; the behaviour at the boundary does not. `EvalRecord(prompt="2+2?", score="not a number")` succeeds in a dataclass and stores the string, and raises a validation error in pydantic. Conceptually pydantic is dataclasses plus the clerk built in — which is why it powers most structured-output and tool-calling interfaces, where the whole job is turning untrusted JSON into objects you can trust. It is free and open source.'
