learning_promise: 'After this lesson you will be able to look at a slow piece of code and answer the one question that decides everything about making it concurrent — is this work waiting, or is it computing? — and then pick the model that suits it rather than the one you used last time: threads and an event loop for waiting work, processes for computing work, and nothing at all when the honest answer is that concurrency will not help. You will be able to state precisely what the global interpreter lock protects (the interpreter own state, not your data) and why I/O releasing it is the reason threads help with waiting; report the GIL status of the interpreter in front of you rather than the one in a book; use concurrent.futures as one interface over both kinds of pool; explain asyncio from first principles as coroutines that pause, await as the pause point and the event loop as a scheduler; recognise and repair the single most expensive mistake in async Python, a blocking call inside a coroutine, having measured both the collapse and the fix; apply timeouts and describe cancellation accurately as an exception delivered inside the task so that finally blocks still run; reproduce a lost-update race, fix it with a lock, and explain why a queue is usually the better answer; produce and remove a deadlock; build a cooperative scheduler out of generators so that async and await stop being magic; and report every performance claim the way this lesson does — several runs, the spread stated, the machine named, and a ratio rather than a stopwatch reading.'
objectives:
  - 'Distinguish concurrency (a property of program structure: several things in progress) from parallelism (a property of hardware: several things executing at one instant), and say which one a given problem actually requires'
  - 'Classify a workload as waiting or computing, and select threads, processes or an event loop from that classification rather than from familiarity'
  - 'State accurately what the global interpreter lock does — it must be held to execute Python bytecode, it protects interpreter state rather than your data structures, and it is released during I/O — and derive from those three facts why threads help with waiting and not with computing'
  - 'Check the GIL status of the interpreter actually in use with sysconfig.get_config_var("Py_GIL_DISABLED"), and describe what PEP 703 changed and what it did not'
  - 'Use concurrent.futures as one interface over both pool kinds, swapping ThreadPoolExecutor for ProcessPoolExecutor in a single word, and name the four behaviours that matter: input-order results from map, deferred exceptions, the waiting shutdown, and the picklability requirement for process targets'
  - 'Explain asyncio from first principles — a coroutine is a function that can pause, await is the only pause point, the event loop is a scheduler, and async def alone makes nothing concurrent — and drive coroutines with asyncio.run, asyncio.gather and asyncio.TaskGroup'
  - 'Choose between asyncio.gather with return_exceptions and asyncio.TaskGroup on the question of whether partial success is a real answer, and read an ExceptionGroup with except*'
  - 'Recognise a blocking call inside a coroutine, measure both the serialisation it causes and the starvation it inflicts on unrelated tasks, and repair it with await asyncio.sleep or asyncio.to_thread'
  - 'Apply asyncio.timeout, and describe cancellation precisely as a CancelledError raised inside the task at its next suspension point — so finally blocks run, resources are released, and swallowing the exception produces a task that cannot be stopped'
  - 'Reproduce a lost-update race on a shared counter, repair it with a threading.Lock, and argue why per-worker locals handed down a queue.Queue is usually the better answer than any lock'
  - 'Produce a deadlock from two locks taken in opposite orders, detect it with a timeout, and remove it with a consistent global lock ordering'
  - 'Build a cooperative scheduler from generators — a ready queue, a sleeping list and a loop that advances each task one step — and map every part of it onto what asyncio does for you'
  - 'Report a performance measurement honestly: several runs, the median rather than the mean, the spread printed, the machine and interpreter named, and the claim stated as a ratio because a millisecond figure is a fact about one machine on one day'
  - 'Write tests for concurrent code that assert shapes rather than durations, and explain why a passing race-condition test is evidence rather than assurance'
  - 'Compare threading, multiprocessing, concurrent.futures and asyncio against trio, anyio, gevent and a distributed task queue, and identify the boundary at which in-process concurrency stops being the right subject'
prerequisites:
  - 'Day 43 — a working python3 on your PATH; the lab needs the standard library only'
  - 'Day 63 onwards — functions, generators and yield, which the from-scratch event loop is built out of'
  - 'Day 70 — how a measurement can mislead, which is why every number here is run more than once and reported with its spread'
  - 'Day 82 — a first web API, and the local fixture-server pattern that stands in for the internet here'
  - 'Day 84 — running a fixture server inside a test harness and shutting it down cleanly'
  - 'Day 90 — SQLite from Python, which supplies this lesson concrete example of a library object that refuses to be shared across threads'
