terms:
  - term: 'Concurrency'
    definition: 'A property of a program structure: several pieces of work are in progress at the same time. It says nothing about how many are executing at any given instant. Cooking rice while the oven heats and you chop is concurrency with one cook. It is a way of organising work, not a performance technique — it sometimes yields performance and sometimes does not, and which it is depends entirely on whether the work waits or computes.'
  - term: 'Parallelism'
    definition: 'A property of the hardware: several pieces of work are executing at the same instant, which requires several execution units. Two cooks at two boards. In CPython you get it from processes and not from threads, because a thread must hold the interpreter lock to execute Python bytecode. Concurrency without parallelism is normal and often ideal; an event loop is exactly that, by design.'
  - term: 'Thread'
    definition: 'An independent sequence of execution inside one process, scheduled preemptively by the operating system, which may interrupt it between any two bytecodes. Threads in a process share all memory — the same objects, the same module globals — which is what makes them cheap and what makes every shared mutation something you must reason about. In CPython they overlap WAITING perfectly and cannot overlap Python bytecode execution.'
  - term: 'Process'
    definition: 'An independent program image with its own memory, its own interpreter and — the point — its own interpreter lock. Two processes share nothing by default, so anything passed between them is serialised with pickle and copied. That isolation is the source of both its value (true parallelism) and its costs (start-up time, copying, and targets that must be importable by name).'
  - term: 'GIL (global interpreter lock)'
    definition: 'A mutex inside CPython that a thread must hold in order to execute Python bytecode. Three facts define its behaviour and every consequence follows from them: it protects the INTERPRETER own state — reference counts, the allocator, interpreter structures — and not your data structures; it is RELEASED while a thread waits on I/O, which is why threads help with waiting; and a thread doing pure computation HOLDS it, which is why threads do not help with computing. It is not a thread-safety guarantee for your code, and believing it is one is how races get shipped.'
  - term: 'Free-threaded build'
    definition: 'An optional CPython build, available from Python 3.13 following PEP 703, in which the global interpreter lock is disabled so threads can execute Python bytecode in parallel. It is a build-time option rather than a runtime flag, and it is not the default. Check which one you have with sysconfig.get_config_var("Py_GIL_DISABLED"): 0 means the lock is present. Every measurement in this lesson was made on a build reporting 0, and says so.'
  - term: 'Coroutine'
    definition: 'A function that can suspend itself and be resumed later, keeping its local state across the suspension. Written with async def in Python. Calling one does not run it — it builds a coroutine object, which is why "coroutine was never awaited" is such a common first error. The mechanism underneath is the same one generators have had since Python 2.2: a function that runs to a pause point, hands control back, and remembers where it stopped.'
  - term: 'Event loop'
    definition: 'A scheduler: a single thread holding a queue of ready tasks and a set of suspended ones, which takes the front ready task, runs it until it suspends, parks it, and takes the next. When the operating system reports a socket ready, the loop moves the task waiting on it back to the ready queue. asyncio.run creates one, runs a coroutine to completion and closes it, and is the boundary between synchronous code and the loop.'
  - term: 'await'
    definition: 'The pause point, and the only one. When a coroutine reaches await it hands the thread back to the loop and asks to be resumed when the awaited thing is done. Between two awaits a coroutine cannot be interrupted, which is the property that makes async code so much easier to reason about than threads: every place another task could run is visible in your source. It is not an accelerator, and a coroutine containing no await is an ordinary function wearing a keyword.'
  - term: 'Blocking call'
    definition: 'A function that does not return until its work is finished and that does not yield to any scheduler while it waits. time.sleep, a synchronous HTTP client, a synchronous database driver, a read from a slow filesystem. Inside a coroutine it is the single most expensive mistake in async Python: it holds the loop only thread, so every other task stops, nothing is raised, and every result is still correct. Measured here at five times slower with 211 milliseconds of starvation inflicted on an unrelated task. The repair for code you do not own is asyncio.to_thread.'
  - term: 'Race condition'
    definition: 'A bug whose outcome depends on the relative timing of concurrent operations. The classic instance is a lost update: two threads read a counter, both add one, one write overwrites the other. Its defining and dangerous property is that its VISIBILITY is a timing matter rather than a correctness one — this lesson unprotected counter lost nothing in 20 trials at the interpreter default switch interval and roughly 70% of its increments at a shorter one, with not one character of the code changed. You cannot test your way to confidence about one.'
  - term: 'Lock'
    definition: 'A mutual-exclusion primitive that makes a critical section indivisible: only one thread may be inside it at a time. threading.Lock, used as a context manager, is the direct fix for a lost-update race. It is also a claim you have to maintain everywhere and forever, because a single code path that touches the shared state without taking the lock reintroduces the bug silently — which is why a queue is usually the better answer.'
  - term: 'Deadlock'
    definition: 'A cycle of waiting from which nothing can escape: thread one holds lock A and wants B, thread two holds B and wants A. Nothing is busy, nothing errors, and the program simply stops. A timeout on acquisition detects it but does not fix it — in production it converts a hang into a mysterious slow path. The fix is a rule rather than a mechanism: every thread takes locks in the same global order, so a cycle cannot form.'
  - term: 'Task'
    definition: 'A coroutine that the event loop has taken responsibility for running, created with asyncio.create_task or TaskGroup.create_task. Creating one SCHEDULES it; it does not start it. Nothing on a loop starts until the currently running coroutine gives the thread back at an await — a subtlety that produces silent no-op bugs, since unlike a forgotten await there is no warning for it.'
  - term: 'Future'
    definition: 'A placeholder for a result that is not available yet, together with the machinery to wait for it and to carry an exception if the work failed. It is what an executor hands back from submit, and what a task is built on in asyncio. The practical consequence worth remembering: a worker exception is stored in its future rather than raised at submission time, so a map whose results you never consume can hide a failure completely.'
  - term: 'Executor'
    definition: 'A pool of workers plus a queue, presented through one small interface: give me a callable, take back a future. concurrent.futures provides ThreadPoolExecutor and ProcessPoolExecutor behind the identical API, which is the module central insight — "run this over these inputs" is one problem whether the workers are threads or processes, so choosing between them should be a one-word edit rather than a rewrite.'
  - term: 'Waiting work versus computing work'
    definition: 'The classification that decides everything on this day. Work that WAITS — on a socket, a disk, a database, a subprocess, a human — leaves the CPU idle, so overlapping it is nearly free: use threads or an event loop. Work that COMPUTES — arithmetic, parsing, encoding, CPU inference — occupies the CPU fully, so there is no idleness to overlap and the only route to speed is more CPUs: use processes. Measured here: the same three-line change gave 12.2x on the first and 1.01x on the second.'
  - term: 'Structured concurrency'
    definition: 'The principle that a concurrent task must not outlive the lexical scope that created it, so concurrency has the same block structure as ordinary control flow. asyncio.TaskGroup implements it: the async with block does not exit until every child has finished, a child that raises causes its siblings to be cancelled, and failures arrive together in an ExceptionGroup. The idea came from the trio library, where the same construct is called a nursery.'
  - term: 'Cancellation'
    definition: 'In asyncio, stopping a task by raising CancelledError inside it at its next suspension point. It is an exception rather than a kill, which is why ordinary Python cleanup still works — finally blocks run, context managers exit, sockets close. Two consequences: a task that never awaits cannot be cancelled, because there is nowhere to deliver the exception; and catching CancelledError without re-raising it produces a task that refuses to stop.'
  - term: 'Cooperative versus preemptive scheduling'
    definition: 'Preemptive means the scheduler can interrupt you anywhere, which is what threads get from the operating system and why every shared mutation in threaded code needs a story. Cooperative means you are interrupted only where you say, which is what coroutines get at await. Cooperative scheduling does not remove interleaving; it makes every interleaving point visible in the source, which is a large reduction in what you must hold in your head — and the reason one task that never yields stops everything.'
  - term: 'Switch interval'
    definition: 'How long CPython lets a thread run before considering handing execution to another, controlled by sys.setswitchinterval and defaulting to 0.005 seconds. It is process-wide, so anything that changes it must restore it in a finally block. This lesson lowers it to 1 microsecond in order to make a latent lost-update race land on every run rather than once in a very long while — a diagnostic technique, not a fix, and one that changes nothing about the buggy code itself.'
  - term: 'asyncio.to_thread'
    definition: 'A coroutine that runs a blocking function in a worker thread and can be awaited, propagating the current context variables to that thread. It is the standard repair for a synchronous library you cannot rewrite: the blocking still happens, it simply happens somewhere that is allowed to block, so the event loop keeps its thread. Measured here at 4.9 times faster than calling the same function inline in a coroutine. It is a repair, not a licence to keep adding synchronous calls.'
  - term: 'Pickling (in the concurrency sense)'
    definition: 'The serialisation that every value crossing a process boundary must undergo. It has two practical consequences that catch people. Functions are pickled by module and qualified name rather than by code, so a process pool target must be a module-level function — a lambda, a closure or a nested function raises. And arguments and results are COPIED, so sending large data to a worker and getting large data back can cost more than the computation you were parallelising.'
  - term: 'Shape versus duration (in a performance claim)'
    definition: 'The distinction that makes a measurement portable. A duration — "it took 172 milliseconds" — is a fact about one machine on one day and is worthless to a reader and flaky in a test. A shape — "threaded I/O is at least four times faster than sequential; threaded CPU work is not meaningfully faster" — is a fact about the program and reproduces elsewhere. This lesson tests assert only shapes, with wide margins, and every reported figure names the machine, the number of runs and the spread.'
