<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" role="img" aria-labelledby="d096f-title d096f-desc">
  <title id="d096f-title">An event loop scheduling three tasks, and the same loop stalled behind one blocking call</title>
  <desc id="d096f-desc">An animated flow diagram in two halves, readable in full as a still image. The upper half shows a healthy event loop: three tasks named fetch-A, fetch-B and render-C sit on a ready queue, the loop takes fetch-A and runs it until it reaches an await on a socket read, at which point fetch-A leaves the queue and joins a waiting set while the loop picks up fetch-B; when the operating system reports fetch-A's socket readable, fetch-A is woken and put back on the ready queue. A timeline underneath shows the three tasks interleaving and all finishing at about 210 milliseconds. The lower half shows the same three tasks where render-C calls time.sleep, a blocking function, instead of awaiting: the loop enters render-C and does not come back for 200 milliseconds, the ready queue cannot be serviced, fetch-A and fetch-B sit ready but unrun, and the timeline shows everything finishing at about 610 milliseconds instead. A token travels the healthy loop and a red bar shows the stall in the broken one. With motion disabled every task, label, arrow, queue and timing figure is still drawn.</desc>

  <style>
    .d096f-bg    { fill: #f8fafc; }
    .d096f-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d096f-h2    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d096f-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d096f-lbl   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d096f-val   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d096f-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d096f-good  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #047857; }
    .d096f-bad   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b91c1c; }
    .d096f-box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d096f-loop  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2; }
    .d096f-okbox { fill: #ffffff; stroke: #047857; stroke-width: 2; }
    .d096f-badbox{ fill: #ffffff; stroke: #b91c1c; stroke-width: 2; }
    .d096f-tick  { stroke: #cbd5e1; stroke-width: 1; }
    .d096f-barA  { fill: #1d4ed8; }
    .d096f-barB  { fill: #6366f1; }
    .d096f-barC  { fill: #0f766e; }
    .d096f-barX  { fill: #b91c1c; }
    .d096f-idle  { fill: #e2e8f0; }

    /* Motion 2 — the wires between loop stages flow while the loop is healthy. */
    .d096f-wire { fill: none; stroke: #1d4ed8; stroke-width: 2.5;
                  stroke-dasharray: 10 8; animation: d096f-march 1.6s linear infinite; }
    @keyframes d096f-march { to { stroke-dashoffset: -18; } }

    /* Motion 3 — each stage of the healthy loop lights up in turn. */
    .d096f-stage { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 2;
                   animation: d096f-lift 8s ease-in-out infinite; }
    .d096f-s1 { animation-delay: 0.0s; }
    .d096f-s2 { animation-delay: 1.1s; }
    .d096f-s3 { animation-delay: 2.2s; }
    .d096f-s4 { animation-delay: 3.3s; }
    @keyframes d096f-lift {
      0%, 16%, 100% { fill: #e0e7ff; }
      4%, 11%       { fill: #bfdbfe; }
    }

    /* Motion 1 — the loop's attention travels its four stages and returns. */
    .d096f-token { animation: d096f-travel 8s ease-in-out infinite; }
    @keyframes d096f-travel {
      0%,  10% { transform: translate(0, 0); }
      14%, 24% { transform: translate(286px, 0); }
      28%, 38% { transform: translate(572px, 0); }
      42%, 52% { transform: translate(858px, 0); }
      58%      { transform: translate(858px, 62px); }
      66%      { transform: translate(0, 62px); }
      72%,100% { transform: translate(0, 0); }
    }

    /* The stalled loop: a red bar grows across the blocked interval, resting
       fully drawn so the still frame shows the whole 200 ms stall. */
    .d096f-stall { animation: d096f-pulse 8s ease-in-out infinite; }
    @keyframes d096f-pulse {
      0%, 46%   { opacity: 0.85; }
      54%, 78%  { opacity: 1; }
      86%, 100% { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d096f-wire  { animation: none; stroke-dasharray: none; }
      .d096f-stage { animation: none; fill: #e0e7ff; }
      .d096f-token { animation: none; transform: none; }
      .d096f-stall { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <marker id="d096f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect class="d096f-bg" x="0" y="0" width="1240" height="940" />

  <text class="d096f-h1"  x="32" y="38">One thread, three tasks &#8212; and the one call that stops all of them</text>
  <text class="d096f-sub" x="32" y="62">An event loop is a single thread running one callback at a time. It gets that thread back at every await, and at no other moment.</text>

  <!-- =========================================================== -->
  <!-- HEALTHY LOOP                                                -->
  <!-- =========================================================== -->
  <text class="d096f-h2"   x="32" y="98">A. The healthy loop &#8212; every task pauses at an await</text>
  <text class="d096f-note" x="32" y="120">fetch-A waits 200 ms on a socket &#183; fetch-B waits 150 ms on a socket &#183; render-C computes for 10 ms</text>

  <!-- the loop's four stages -->
  <path class="d096f-wire" d="M 268 168 L 500 168" marker-end="url(#d096f-arrow)" />
  <path class="d096f-wire" d="M 554 168 L 786 168" marker-end="url(#d096f-arrow)" />
  <path class="d096f-wire" d="M 840 168 L 1072 168" marker-end="url(#d096f-arrow)" />
  <path class="d096f-wire" d="M 1126 196 L 1126 230 L 140 230 L 140 196" marker-end="url(#d096f-arrow)" />

  <rect class="d096f-stage d096f-s1" x="32" y="140" width="236" height="56" rx="8" />
  <text class="d096f-val" x="48" y="164">1. Take the front task</text>
  <text class="d096f-note" x="48" y="185">off the ready queue</text>

  <rect class="d096f-stage d096f-s2" x="500" y="140" width="236" height="56" rx="8" />
  <text class="d096f-val" x="516" y="164">2. Run it until it awaits</text>
  <text class="d096f-note" x="516" y="185">this is the only step that runs code</text>

  <rect class="d096f-stage d096f-s3" x="840" y="140" width="236" height="56" rx="8" />
  <text class="d096f-val" x="856" y="164">3. Park it in the waiting set</text>
  <text class="d096f-note" x="856" y="185">the OS now owns that socket</text>

  <rect class="d096f-stage d096f-s4" x="1076" y="252" width="132" height="56" rx="8" />
  <text class="d096f-val" x="1090" y="276">4. Wake it</text>
  <text class="d096f-note" x="1090" y="297">when ready</text>

  <!-- the travelling token, resting at stage 1 -->
  <circle class="d096f-token" cx="150" cy="168" r="9" fill="#1d4ed8" />

  <!-- ready queue and waiting set -->
  <rect class="d096f-box" x="32" y="252" width="472" height="112" rx="8" />
  <text class="d096f-lbl" x="48" y="276">READY QUEUE  (can run now)</text>
  <rect class="d096f-loop" x="48" y="288" width="132" height="34" rx="6" />
  <text class="d096f-val" x="62" y="311">fetch-A</text>
  <rect class="d096f-loop" x="192" y="288" width="132" height="34" rx="6" />
  <text class="d096f-val" x="206" y="311">fetch-B</text>
  <rect class="d096f-loop" x="336" y="288" width="132" height="34" rx="6" />
  <text class="d096f-val" x="350" y="311">render-C</text>
  <text class="d096f-note" x="48" y="345">The loop always takes the front one. Nothing here is running yet.</text>

  <rect class="d096f-box" x="536" y="252" width="472" height="112" rx="8" />
  <text class="d096f-lbl" x="552" y="276">WAITING SET  (parked at an await)</text>
  <rect class="d096f-box" x="552" y="288" width="200" height="34" rx="6" />
  <text class="d096f-val" x="566" y="311">fetch-A &#8592; socket read</text>
  <rect class="d096f-box" x="764" y="288" width="200" height="34" rx="6" />
  <text class="d096f-val" x="778" y="311">fetch-B &#8592; socket read</text>
  <text class="d096f-note" x="552" y="345">Costs nothing while parked. The operating system reports readiness.</text>

  <!-- healthy timeline -->
  <rect class="d096f-okbox" x="32" y="380" width="1176" height="156" rx="8" />
  <text class="d096f-lbl" x="48" y="404">Timeline &#8212; what the single thread is doing, millisecond by millisecond</text>

  <line class="d096f-tick" x1="180" y1="414" x2="180" y2="512" />
  <line class="d096f-tick" x1="420" y1="414" x2="420" y2="512" />
  <line class="d096f-tick" x1="660" y1="414" x2="660" y2="512" />
  <line class="d096f-tick" x1="900" y1="414" x2="900" y2="512" />
  <line class="d096f-tick" x1="1140" y1="414" x2="1140" y2="512" />

  <text class="d096f-val" x="48" y="437">fetch-A</text>
  <rect class="d096f-barA" x="180" y="424" width="8" height="18" />
  <rect class="d096f-idle" x="188" y="428" width="952" height="10" />
  <rect class="d096f-barA" x="1140" y="424" width="8" height="18" />

  <text class="d096f-val" x="48" y="465">fetch-B</text>
  <rect class="d096f-barB" x="188" y="452" width="8" height="18" />
  <rect class="d096f-idle" x="196" y="456" width="718" height="10" />
  <rect class="d096f-barB" x="914" y="452" width="8" height="18" />

  <text class="d096f-val" x="48" y="493">render-C</text>
  <rect class="d096f-barC" x="196" y="480" width="46" height="18" />

  <text class="d096f-note" x="180" y="528">0 ms</text>
  <text class="d096f-note" x="404" y="528">50 ms</text>
  <text class="d096f-note" x="640" y="528">100 ms</text>
  <text class="d096f-note" x="880" y="528">150 ms</text>
  <text class="d096f-note" x="1116" y="528">200 ms</text>
  <text class="d096f-good" x="700" y="404">All three finish by about 210 ms &#8212; the longest single wait, not the sum</text>

  <!-- =========================================================== -->
  <!-- BLOCKED LOOP                                                -->
  <!-- =========================================================== -->
  <text class="d096f-h2"   x="32" y="580">B. The same three tasks, where render-C calls a blocking function</text>
  <text class="d096f-note" x="32" y="602">One line changed: render-C now calls time.sleep(0.2) instead of awaiting. Nothing raises. Every result is still correct.</text>

  <rect class="d096f-badbox" x="32" y="618" width="472" height="112" rx="8" />
  <text class="d096f-lbl" x="48" y="642">READY QUEUE  (can run &#8212; but nothing is servicing it)</text>
  <rect class="d096f-loop" x="48" y="654" width="132" height="34" rx="6" />
  <text class="d096f-val" x="62" y="677">fetch-A</text>
  <rect class="d096f-loop" x="192" y="654" width="132" height="34" rx="6" />
  <text class="d096f-val" x="206" y="677">fetch-B</text>
  <text class="d096f-bad" x="48" y="711">Both are ready. Neither runs. The loop is inside render-C and has not returned.</text>

  <rect class="d096f-badbox" x="536" y="618" width="672" height="112" rx="8" />
  <text class="d096f-lbl" x="552" y="642">INSIDE THE LOOP&#8217;S ONE THREAD</text>
  <text class="d096f-val" x="552" y="666">async def render_c():</text>
  <text class="d096f-bad" x="572" y="688">time.sleep(0.2)   &#8592; no await. The thread does not come back.</text>
  <text class="d096f-note" x="552" y="711">`async def` alone makes nothing concurrent. `await` is the pause point, and there is not one here.</text>

  <!-- blocked timeline -->
  <rect class="d096f-badbox" x="32" y="746" width="1176" height="156" rx="8" />
  <text class="d096f-lbl" x="48" y="770">The same timeline, same scale</text>
  <text class="d096f-bad" x="700" y="770">All three now finish at about 610 ms &#8212; the sum, not the maximum</text>

  <line class="d096f-tick" x1="180" y1="780" x2="180" y2="878" />
  <line class="d096f-tick" x1="420" y1="780" x2="420" y2="878" />
  <line class="d096f-tick" x1="660" y1="780" x2="660" y2="878" />
  <line class="d096f-tick" x1="900" y1="780" x2="900" y2="878" />
  <line class="d096f-tick" x1="1140" y1="780" x2="1140" y2="878" />

  <text class="d096f-val" x="48" y="803">render-C</text>
  <g class="d096f-stall">
    <rect class="d096f-barX" x="180" y="790" width="960" height="18" />
    <text class="d096f-val" x="420" y="804" fill="#ffffff">blocking &#8212; the loop is stuck here for 200 ms</text>
  </g>

  <text class="d096f-val" x="48" y="831">fetch-A</text>
  <rect class="d096f-idle" x="180" y="822" width="960" height="10" />
  <text class="d096f-bad" x="500" y="835">not started: the loop never got its thread back</text>

  <text class="d096f-val" x="48" y="859">fetch-B</text>
  <rect class="d096f-idle" x="180" y="850" width="960" height="10" />
  <text class="d096f-bad" x="500" y="863">not started</text>

  <text class="d096f-note" x="180" y="894">0 ms</text>
  <text class="d096f-note" x="404" y="894">50 ms</text>
  <text class="d096f-note" x="640" y="894">100 ms</text>
  <text class="d096f-note" x="880" y="894">150 ms</text>
  <text class="d096f-note" x="1116" y="894">200 ms</text>
  <text class="d096f-good" x="700" y="894">The repair: await asyncio.to_thread(time.sleep, 0.2) &#8212; block somewhere allowed to block</text>
</svg>
