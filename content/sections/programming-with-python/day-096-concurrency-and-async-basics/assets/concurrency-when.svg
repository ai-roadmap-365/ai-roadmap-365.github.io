<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the work.">
  <title>Which model when</title>
  <style>
    .concurrency-when-bg   { fill: #f8fafc; }
    .concurrency-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .concurrency-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .concurrency-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .concurrency-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .concurrency-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .concurrency-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .concurrency-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .concurrency-when-row { opacity: 1; }
    .concurrency-when-r0 { animation-delay: 0.00s; }
    .concurrency-when-r1 { animation-delay: 0.45s; }
    .concurrency-when-r2 { animation-delay: 0.90s; }
    .concurrency-when-r3 { animation-delay: 1.35s; }
    .concurrency-when-r4 { animation-delay: 1.80s; }
    .concurrency-when-row { animation: concurrency-when-reveal 7.3s ease-in-out infinite; }
    @keyframes concurrency-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="concurrency-when-bg" width="980" height="390"/>
  <text class="concurrency-when-h1"  x="30" y="40">Which model when</text>
  <text class="concurrency-when-sub" x="30" y="64">By the work.</text>
  <rect class="concurrency-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-when-name" x="46" y="122">The work</text>
  <text class="concurrency-when-desc" x="46" y="142">What it does.</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r0" x="46" y="182">Many network calls</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r1" x="46" y="216">Heavy computation</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r2" x="46" y="250">Thousands of open connections</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r3" x="46" y="284">A handful of blocking calls</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r4" x="46" y="318">Work that is already fast enough</text>
  <rect class="concurrency-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="concurrency-when-name" x="526" y="122">The model</text>
  <text class="concurrency-when-desc" x="526" y="142">What to use.</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r0" x="526" y="182">Asynchronous, or a thread pool</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r1" x="526" y="216">Separate processes</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r2" x="526" y="250">Asynchronous</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r3" x="526" y="284">A thread pool — simpler</text>
  <text class="concurrency-when-desc concurrency-when-row concurrency-when-r4" x="526" y="318">None; do not add concurrency</text>
  <text class="concurrency-when-sub" x="30" y="372">The last row deserves saying plainly: concurrency is a substantial complexity cost, and adding it to code that is already fast enough buys nothing.</text>
</svg>
