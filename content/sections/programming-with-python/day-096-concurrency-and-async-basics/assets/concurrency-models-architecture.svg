<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-labelledby="d096a-title d096a-desc">
  <title id="d096a-title">The three concurrency models Python gives you, side by side: what each duplicates, what each shares, what a switch costs, and which workload it suits</title>
  <desc id="d096a-desc">A static comparison of threads, processes and the event loop. For each model the diagram gives the unit of execution, what is duplicated, what is shared, the cost of one switch, how many can truly execute Python at once, the workload it suits, its characteristic failure mode, and the speed-up measured in this day's lab. A banner across the top states the one question that decides between them: is this work waiting, or is it computing. A panel across the foot states what the global interpreter lock does and does not protect, and gives the decision rule.</desc>

  <style>
    .d096a-bg    { fill: #f8fafc; }
    .d096a-h1    { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #1a202c; }
    .d096a-sub   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d096a-ask   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #1d4ed8; }
    .d096a-name  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #1a202c; }
    .d096a-api   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d096a-lbl   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
    .d096a-val   { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #1a202c; }
    .d096a-warn  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #b45309; }
    .d096a-good  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #047857; }
    .d096a-note  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #334155; }
    .d096a-head  { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d096a-body  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .d096a-band  { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d096a-foot  { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .d096a-rule  { stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <rect class="d096a-bg" x="0" y="0" width="1240" height="900" />

  <text class="d096a-h1"  x="32" y="38">Threads, processes and the event loop &#8212; what each one actually costs</text>
  <text class="d096a-sub" x="32" y="62">All three give you concurrency. Only one of them gives you parallelism, and only one of them is free. Choose by the workload, never by the syntax.</text>

  <!-- the question that decides everything -->
  <rect class="d096a-band" x="32" y="82" width="1176" height="46" rx="8" />
  <text class="d096a-ask" x="52" y="112">The one question:  is this work WAITING (a socket, a disk, a database, a human) or COMPUTING (arithmetic, parsing, encoding, inference)?</text>

  <!-- ===================== column 1: threads ===================== -->
  <rect class="d096a-head" x="32" y="150" width="376" height="64" rx="8" />
  <text class="d096a-name" x="52" y="177">THREADS</text>
  <text class="d096a-api"  x="52" y="200">threading &#183; concurrent.futures.ThreadPoolExecutor</text>
  <rect class="d096a-body" x="32" y="222" width="376" height="546" rx="8" />

  <text class="d096a-lbl" x="52" y="250">The unit of execution</text>
  <text class="d096a-val" x="52" y="271">An operating-system thread.</text>
  <line class="d096a-rule" x1="52" y1="287" x2="388" y2="287" />

  <text class="d096a-lbl" x="52" y="311">What is DUPLICATED</text>
  <text class="d096a-val" x="52" y="332">A call stack, and thread-local data.</text>
  <text class="d096a-val" x="52" y="353">Nothing else.</text>
  <line class="d096a-rule" x1="52" y1="369" x2="388" y2="369" />

  <text class="d096a-lbl" x="52" y="393">What is SHARED</text>
  <text class="d096a-val" x="52" y="414">Everything. The same objects, the</text>
  <text class="d096a-val" x="52" y="435">same memory, one interpreter.</text>
  <line class="d096a-rule" x1="52" y1="451" x2="388" y2="451" />

  <text class="d096a-lbl" x="52" y="475">Cost of one switch</text>
  <text class="d096a-val" x="52" y="496">Cheap. No new memory image,</text>
  <text class="d096a-val" x="52" y="517">nothing copied, nothing pickled.</text>
  <line class="d096a-rule" x1="52" y1="533" x2="388" y2="533" />

  <text class="d096a-lbl" x="52" y="557">Truly running Python at once</text>
  <text class="d096a-warn" x="52" y="578">ONE. Many may be blocked in I/O;</text>
  <text class="d096a-warn" x="52" y="599">only one holds the interpreter lock.</text>
  <line class="d096a-rule" x1="52" y1="615" x2="388" y2="615" />

  <text class="d096a-lbl" x="52" y="639">Suits</text>
  <text class="d096a-good" x="52" y="660">WAITING work.</text>
  <line class="d096a-rule" x1="52" y1="676" x2="388" y2="676" />

  <text class="d096a-lbl" x="52" y="700">The failure mode</text>
  <text class="d096a-val" x="52" y="721">Races on shared state. Every</text>
  <text class="d096a-val" x="52" y="742">mutation is yours to reason about.</text>

  <!-- ===================== column 2: processes ===================== -->
  <rect class="d096a-head" x="432" y="150" width="376" height="64" rx="8" />
  <text class="d096a-name" x="452" y="177">PROCESSES</text>
  <text class="d096a-api"  x="452" y="200">multiprocessing &#183; ProcessPoolExecutor</text>
  <rect class="d096a-body" x="432" y="222" width="376" height="546" rx="8" />

  <text class="d096a-lbl" x="452" y="250">The unit of execution</text>
  <text class="d096a-val" x="452" y="271">An operating-system process.</text>
  <line class="d096a-rule" x1="452" y1="287" x2="788" y2="287" />

  <text class="d096a-lbl" x="452" y="311">What is DUPLICATED</text>
  <text class="d096a-val" x="452" y="332">Everything. Its own interpreter, its</text>
  <text class="d096a-val" x="452" y="353">own memory, its own lock.</text>
  <line class="d096a-rule" x1="452" y1="369" x2="788" y2="369" />

  <text class="d096a-lbl" x="452" y="393">What is SHARED</text>
  <text class="d096a-val" x="452" y="414">Nothing by default. Only what you</text>
  <text class="d096a-val" x="452" y="435">send &#8212; pickled, and copied.</text>
  <line class="d096a-rule" x1="452" y1="451" x2="788" y2="451" />

  <text class="d096a-lbl" x="452" y="475">Cost of one switch</text>
  <text class="d096a-warn" x="452" y="496">Expensive. Starting the process,</text>
  <text class="d096a-warn" x="452" y="517">and pickling every value both ways.</text>
  <line class="d096a-rule" x1="452" y1="533" x2="788" y2="533" />

  <text class="d096a-lbl" x="452" y="557">Truly running Python at once</text>
  <text class="d096a-good" x="452" y="578">As many as you have cores.</text>
  <text class="d096a-val"  x="452" y="599">This is parallelism, not merely</text>
  <text class="d096a-val"  x="452" y="620">concurrency.</text>
  <line class="d096a-rule" x1="452" y1="633" x2="788" y2="633" />

  <text class="d096a-lbl" x="452" y="657">Suits</text>
  <text class="d096a-good" x="452" y="678">COMPUTING work.</text>
  <line class="d096a-rule" x1="452" y1="694" x2="788" y2="694" />

  <text class="d096a-lbl" x="452" y="718">The failure mode</text>
  <text class="d096a-val" x="452" y="739">Unpicklable arguments; copies too</text>
  <text class="d096a-val" x="452" y="760">large; start-up eats small tasks.</text>

  <!-- ===================== column 3: event loop ===================== -->
  <rect class="d096a-head" x="832" y="150" width="376" height="64" rx="8" />
  <text class="d096a-name" x="852" y="177">EVENT LOOP</text>
  <text class="d096a-api"  x="852" y="200">asyncio &#183; async def &#183; await &#183; TaskGroup</text>
  <rect class="d096a-body" x="832" y="222" width="376" height="546" rx="8" />

  <text class="d096a-lbl" x="852" y="250">The unit of execution</text>
  <text class="d096a-val" x="852" y="271">A coroutine: a function that can</text>
  <text class="d096a-val" x="852" y="292">pause and be resumed.</text>
  <line class="d096a-rule" x1="852" y1="305" x2="1188" y2="305" />

  <text class="d096a-lbl" x="852" y="329">What is DUPLICATED</text>
  <text class="d096a-val" x="852" y="350">Nothing. One thread, one stack,</text>
  <text class="d096a-val" x="852" y="371">one interpreter, one loop.</text>
  <line class="d096a-rule" x1="852" y1="384" x2="1188" y2="384" />

  <text class="d096a-lbl" x="852" y="408">What is SHARED</text>
  <text class="d096a-val" x="852" y="429">Everything &#8212; but interleaved ONLY</text>
  <text class="d096a-val" x="852" y="450">at await. Between two awaits you</text>
  <text class="d096a-val" x="852" y="471">cannot be interrupted.</text>
  <line class="d096a-rule" x1="852" y1="484" x2="1188" y2="484" />

  <text class="d096a-lbl" x="852" y="508">Cost of one switch</text>
  <text class="d096a-good" x="852" y="529">The cheapest of the three: a</text>
  <text class="d096a-good" x="852" y="550">function resuming. No OS involved.</text>
  <line class="d096a-rule" x1="852" y1="563" x2="1188" y2="563" />

  <text class="d096a-lbl" x="852" y="587">Truly running Python at once</text>
  <text class="d096a-warn" x="852" y="608">ONE, by design. Concurrency</text>
  <text class="d096a-warn" x="852" y="629">without parallelism.</text>
  <line class="d096a-rule" x1="852" y1="642" x2="1188" y2="642" />

  <text class="d096a-lbl" x="852" y="666">Suits</text>
  <text class="d096a-good" x="852" y="687">WAITING work, at high fan-out.</text>
  <line class="d096a-rule" x1="852" y1="703" x2="1188" y2="703" />

  <text class="d096a-lbl" x="852" y="727">The failure mode</text>
  <text class="d096a-val" x="852" y="748">ONE blocking call stops every task.</text>

  <!-- ===================== measured band ===================== -->
  <rect class="d096a-band" x="32" y="782" width="376" height="46" rx="8" />
  <text class="d096a-lbl" x="52" y="801">Measured in this day&#8217;s lab</text>
  <text class="d096a-val" x="52" y="821">waiting 12.2x faster &#183; computing 1.01x</text>

  <rect class="d096a-band" x="432" y="782" width="376" height="46" rx="8" />
  <text class="d096a-lbl" x="452" y="801">Measured in this day&#8217;s lab</text>
  <text class="d096a-val" x="452" y="821">computing 2.89x faster, with 4 workers</text>

  <rect class="d096a-band" x="832" y="782" width="376" height="46" rx="8" />
  <text class="d096a-lbl" x="852" y="801">Measured in this day&#8217;s lab</text>
  <text class="d096a-val" x="852" y="821">waiting 17.9x faster &#183; computing 0.98x</text>

  <!-- ===================== footer ===================== -->
  <rect class="d096a-foot" x="32" y="842" width="1176" height="42" rx="8" />
  <text class="d096a-val" x="52" y="860">The interpreter lock protects the INTERPRETER&#8217;s own state, not your data. It is released while a thread waits on I/O, which is exactly why</text>
  <text class="d096a-val" x="52" y="878">threads help with waiting and not with computing. One machine, one day: the ratios are the claim, the seconds behind them are not.</text>
</svg>
