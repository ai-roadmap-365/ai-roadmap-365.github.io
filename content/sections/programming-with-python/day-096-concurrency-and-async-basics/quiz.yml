questions:
  - question: 'Your service resizes uploaded images. Profiling shows almost all the time inside a pure-Python resampling loop with no I/O in it at all. You want to use the four idle cores on the machine. Which model fits, and why?'
    options:
      - 'ThreadPoolExecutor — a pool of four threads will use the four cores, since threads are what the operating system schedules onto cores'
      - 'ProcessPoolExecutor — only separate processes have separate interpreters, and therefore separate interpreter locks, so only they can execute Python bytecode on four cores at once'
      - 'asyncio with a TaskGroup — an event loop schedules four tasks and the operating system spreads them across the cores'
      - 'Any of the three; they are three spellings of the same capability and the choice is a matter of taste'
    answer_index: 1
    explanation: 'The one question decides it: this work is COMPUTING, not waiting, so there is no idleness to overlap and the only route to going faster is more CPUs actually executing Python. In CPython a thread must hold the global interpreter lock to execute Python bytecode, so four threads doing pure-Python arithmetic take turns on one lock and finish in about the time one thread would have taken — this lesson measured exactly that, at 1.01x with four workers on a fourteen-core machine. Option 0 is the single most common concurrency mistake in Python and is wrong for that reason: the operating system will happily schedule four threads onto four cores, and three of them will be waiting for the lock. Option 2 is worse still, because an event loop is explicitly concurrency WITHOUT parallelism — it runs one task at a time on one thread, and this lesson measured asyncio on the same CPU-bound workload at 0.98x, marginally slower than plain sequential code. Processes win because each one has its own interpreter and therefore its own lock; the measured result was 2.89x, less than 4x because starting the processes and pickling arguments and results are real costs paid at the edges.'

  - question: 'Inside an async request handler, a developer calls a synchronous database driver: `rows = db.query(sql)`, with no `await`. The service returns correct results and raises nothing. What actually happens on the event loop?'
    options:
      - 'The loop detects the blocking call and automatically moves it to its default thread executor'
      - 'The coroutine is suspended at that call like any other, and other tasks run while the query is in flight'
      - 'Nothing raises, but the loop cannot run any other task until the query returns, so every other request on that worker is stalled for the duration'
      - 'The call raises RuntimeError, because blocking calls are not permitted inside a coroutine'
    answer_index: 2
    explanation: 'This is the one rule of async Python and the most expensive mistake in the subject, precisely because it is silent. An event loop is a single thread running one callback at a time, and it gets that thread back only at `await`. A call with no `await` in front of it does not suspend anything — it holds the only thread there is. The measurement in this lesson is unambiguous: five coroutines each waiting 0.2 seconds and handed to `asyncio.gather` took 1.019 seconds, which is exactly the serial floor of five times two tenths, while the awaiting version took 0.202 seconds. Worse, the damage reaches tasks that have nothing to do with the offender: an unrelated heartbeat asking to tick every 10 milliseconds was measured running 211.3 milliseconds late while a coroutine blocked, against 11.4 milliseconds on a healthy loop. Options 0 and 3 both describe a Python that would be much easier to use but does not exist — nothing detects this and nothing complains, which is why the bug survives code review and is found by a latency graph months later. Option 1 describes what `await` would have done. The repair when you own the code is an awaitable version; when you do not, it is `await asyncio.to_thread(db.query, sql)`, which was measured at 0.207 seconds — the blocking still happens, it just happens somewhere allowed to block.'

  - question: 'The global interpreter lock is often summarised as "the GIL makes Python thread-safe". What does it actually protect?'
    options:
      - 'The interpreter own internal state — reference counts, allocator and interpreter structures — so that CPython memory cannot be corrupted by two threads; it makes no promise about the consistency of your data structures'
      - 'Every Python object, so that any single statement operating on any object is atomic across threads'
      - 'Only objects that are explicitly shared between threads; thread-local objects are outside its scope'
      - 'Nothing at runtime; it is a compile-time check that rejects unsafe threaded code'
    answer_index: 0
    explanation: 'The distinction between the interpreter invariants and yours is the whole point, and confusing them is how people ship races believing they cannot have any. The lock exists so that CPython own memory management — reference counting in particular — cannot be corrupted when several threads run. It says nothing about whether YOUR multi-step update is indivisible. `total = total + 1` is a read, an addition and a write, and the lock does not weld those into one operation, which is why this lesson lost 290,878 of 400,000 increments from eight threads sharing one counter. Option 1 is the belief being corrected: statement-level atomicity is not what the lock provides, and relying on it is relying on an implementation detail of how a particular expression compiles. Option 2 inverts the situation — thread-local data needs no protection precisely because nobody else can see it, while shared data is exactly what the lock does not protect. Option 3 is simply not what it is; it is a runtime mutex. Two further facts complete the picture and explain the day measurements: the lock is RELEASED while a thread waits on I/O, which is why threads gave a 12.2x speed-up on waiting work; and a thread doing pure computation holds it, which is why the same code gave 1.01x on computing work.'

  - question: 'A developer converts every function in a data-processing module to `async def`, changes nothing else, and reports that the module is now asynchronous. What have they actually changed about how it runs?'
    options:
      - 'It now runs concurrently, because coroutines are scheduled cooperatively by the event loop'
      - 'It now runs in parallel across cores, because the event loop distributes coroutines to available CPUs'
      - 'It will now raise at import, because `async def` functions cannot be called from synchronous code'
      - 'Nothing useful: without several tasks AND `await` points inside them, each coroutine still runs start to finish before the next one begins, plus the overhead of running a loop'
    answer_index: 3
    explanation: 'Concurrency on an event loop needs two ingredients, and `async def` supplies neither on its own. You need SEVERAL TASKS in flight — one coroutine awaited after another is strictly sequential, so `a = await fetch(x)` followed by `b = await fetch(y)` does not overlap anything and `asyncio.gather` or a `TaskGroup` is what makes them concurrent. And you need PAUSE POINTS inside them: a coroutine with no `await` in its body runs to completion exactly like an ordinary function, because there is nowhere for the loop to take the thread back. This lesson measured that directly: four CPU-bound tasks run through `asyncio.run` came out at 0.98x of plain sequential code, marginally SLOWER, because an event loop that never gets an await is sequential execution plus the cost of running a loop. Option 1 misdescribes asyncio at the deepest level — it is concurrency without parallelism by design, one thread, one task executing at any instant. Option 2 is wrong but points at a real error nearby: calling a coroutine function does not raise, it quietly builds a coroutine object that never runs, which is why `RuntimeWarning: coroutine was never awaited` exists.'

  - question: 'You fetch nine independent data feeds concurrently. One of them is reliably broken and raises. You want the other eight results, and you want to know which one failed. Which construct fits, and what is the deciding question?'
    options:
      - 'asyncio.TaskGroup — it collects every failure into an ExceptionGroup, which is the structured way to report several errors'
      - 'asyncio.gather with return_exceptions=True — the failure comes back as a value in the results list, so the eight siblings run to completion; the deciding question is whether partial success is a real answer'
      - 'Neither; you must await the nine coroutines one at a time inside a try/except so that a failure cannot affect the others'
      - 'asyncio.TaskGroup wrapped in try/except, which behaves identically to gather but with better error messages'
    answer_index: 1
    explanation: 'The choice is a design decision with a one-line test: IS PARTIAL SUCCESS A REAL ANSWER? Here it plainly is — eight feeds out of nine is a useful result and you want to report the ninth as failed — so `gather(return_exceptions=True)` is right. It runs everything, and a raising task contributes its exception object to the results list as a value rather than propagating, so siblings are unaffected. The lesson measured that shape: with three tasks where the second raises, two of three finished and the failure came back as a ValueError sitting in the results. Option 0 is the right tool for the OPPOSITE requirement, and picking it here would be an active mistake: when a child of a TaskGroup raises, its siblings are CANCELLED, so a task that had asked for half a second was measured being cancelled mid-flight. That is exactly what you want for "do these four things or do none of them", and exactly what you do not want for "fetch nine and tell me which worked". Option 3 misstates that behaviour — wrapping a TaskGroup in try/except does not stop the sibling cancellation, which has already happened by the time the ExceptionGroup reaches you. Option 2 gives up concurrency entirely and takes the sum of the nine waits.'

  - question: 'An `asyncio.timeout` block expires while a task is mid-request. What has the runtime actually done to that task?'
    options:
      - 'Terminated its thread, so the task stops immediately wherever it was'
      - 'Marked it as abandoned and left it running in the background until it finishes on its own'
      - 'Discarded its result, but the task continues to completion and its finally blocks run afterwards'
      - 'Raised CancelledError inside the task at its next suspension point, so ordinary Python cleanup runs — finally blocks execute and context managers exit'
    answer_index: 3
    explanation: 'Cancellation in asyncio is an EXCEPTION, not a kill, and understanding that changes how you write cleanup code. When a timeout fires, `CancelledError` is raised inside the coroutine at its next `await`, and from there it propagates exactly like any other exception — so `finally` blocks run, `async with` blocks exit, and sockets get closed. This lesson captured that happening: a task cancelled at a 0.15 second budget against 0.40 seconds of work logged "received CancelledError" and then "cleaned up", and the run ended after 0.151 seconds rather than 0.40. Two consequences follow that the options above are designed to separate. Because it is delivered AT A SUSPENSION POINT, a task that never awaits cannot be cancelled at all — the same blocking-call failure wearing a different hat, since there is no moment at which to deliver the exception. And because it is an ordinary exception, you can catch it — which means you can also swallow it, and swallowing it produces a task that refuses to stop, an availability problem of its own. The correct pattern is to catch it only to clean up and then re-raise. Option 0 describes a thread kill, which Python does not offer and which would leave resources in an unknown state precisely because no cleanup would run.'

  - question: 'A team writes a stress test for a suspected race condition on a shared counter. It passes a thousand consecutive times. What can they legitimately conclude?'
    options:
      - 'The code is thread-safe; a thousand passes is well beyond any reasonable standard of evidence'
      - 'The race exists but is benign, since a thousand runs would have surfaced any consequence that mattered'
      - 'Very little about correctness: a race condition visibility is a property of TIMING, so a passing test says the window did not land under those conditions, not that there is no window'
      - 'The test is broken, because a genuine race condition fails deterministically once enough iterations are used'
    answer_index: 2
    explanation: 'This lesson demonstrates the point rather than asserting it, and the demonstration is the reason the question is here. Eight threads incrementing one unprotected shared counter fifty thousand times each lost ZERO increments across twenty dedicated trials at the interpreter default 5 millisecond thread switch interval — the classic textbook race, refusing to appear. The code was not safe. The read-modify-write window was always there; it was simply narrower than one thread time slice, so a switch rarely landed inside it. Changing one thing that is not the code — dropping the switch interval to 1 microsecond — made the same unmodified code lose roughly 70% of its increments on every single run, up to 290,878 of 400,000. Option 0 draws exactly the conclusion that ships the bug. Option 1 is worse, because "benign" is a claim about consequences on a machine you have not run on, under a load you have not seen. Option 3 has it backwards: determinism is what races lack. The practical consequence is the one to carry away — you cannot test your way to confidence here. You reason about the invariant, or, better, you remove the shared mutable state so there is nothing to reason about: per-worker locals handed down a queue.Queue beat a lock on both safety and speed in this lab.'

  - question: 'You switch a working ThreadPoolExecutor to a ProcessPoolExecutor and immediately get a pickling error on the function you are mapping. What is the cause?'
    options:
      - 'Child processes do not inherit your function — they import the module it lives in and look its name up — so the target must be a module-level function with a real name, not a lambda, a closure, or a function defined inside another function'
      - 'Process pools require every argument to be a primitive type, and your function takes an object'
      - 'ProcessPoolExecutor cannot be used with map; you must submit each call individually and collect the futures'
      - 'The pool was not given an explicit max_workers, so it could not decide how many copies of the function to serialise'
    answer_index: 0
    explanation: 'This is the most common first failure with process pools, and it follows directly from what a process IS. Threads share your memory, so a thread pool can call any callable you hand it, including a lambda defined two lines earlier. Processes share nothing: the target has to be reconstructed on the other side of the boundary, and the mechanism is pickle, which serialises a function by module and qualified name rather than by its code. A lambda has no importable name, a closure carries captured variables that live only in the parent, and a nested function cannot be found by name from the module top level — so all three fail. The lab is arranged around this deliberately: `count_primes` sits at module level in a shared module precisely so the one-word swap from ThreadPoolExecutor to ProcessPoolExecutor works, and the exercise notes say so. Option 1 overstates a real neighbouring constraint — arguments and results must be picklable, which most ordinary objects are, and the practical concern is their SIZE, since everything crossing the boundary is copied and a large copy can cost more than the computation. Options 2 and 3 describe restrictions that do not exist; `map` works identically on both pool types, which is the entire premise of concurrent.futures.'
