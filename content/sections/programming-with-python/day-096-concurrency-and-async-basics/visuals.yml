visuals:
  - id: event-loop-flow
    file: assets/event-loop-flow.svg
    type: flow-animated
    title: 'An event loop scheduling three tasks, and the same loop stalled behind one blocking call'
    alt: "Diagram: an event loop scheduling three tasks named fetch-A, fetch-B and render-C — the loop taking a task off the ready queue, running it until it awaits, parking it in the waiting set and waking it when its socket is ready, with a timeline showing all three finishing at about 210 milliseconds; and below it the same three tasks where render-C calls a blocking function instead, the ready queue unserviced and everything finishing at about 610 milliseconds"
    description: >-
      An animated flow diagram in two halves, laid out one above the other and readable in full as
      a still image. The upper half shows a healthy event loop. Four stages run left to right and
      wrap back to the first: take the front task off the ready queue, run it until it awaits (with
      the note that this is the only stage that runs any code), park it in the waiting set (with the
      note that the operating system now owns that socket), and wake it when ready. Below the stages
      sit two boxes. The ready queue holds fetch-A, fetch-B and render-C, captioned that the loop
      always takes the front one and that nothing there is running yet. The waiting set holds fetch-A
      and fetch-B each parked on a socket read, captioned that parking costs nothing and that the
      operating system reports readiness. Under those, a timeline drawn from zero to two hundred
      milliseconds shows fetch-A running briefly, idling and finishing at the far right; fetch-B the
      same but finishing earlier; and render-C computing for a short solid block near the start. The
      timeline is labelled that all three finish by about two hundred and ten milliseconds, which is
      the longest single wait rather than the sum. The lower half repeats the same three tasks with
      one line changed: render-C now calls time.sleep instead of awaiting. Its ready queue box is
      outlined in red and holds fetch-A and fetch-B, captioned that both are ready, neither runs, and
      the loop is inside render-C and has not returned. Beside it a box shows the offending coroutine
      with the blocking line marked as having no await, and the note that async def alone makes
      nothing concurrent because await is the pause point and there is not one here. The second
      timeline, drawn to the same scale, shows a red bar spanning the full two hundred milliseconds
      labelled that the loop is stuck there, with fetch-A and fetch-B drawn as empty tracks marked
      not started because the loop never got its thread back, and a heading stating that all three
      now finish at about six hundred and ten milliseconds, the sum rather than the maximum. A closing
      line gives the repair: await asyncio.to_thread of time.sleep, which blocks somewhere that is
      allowed to block. Animation adds only emphasis: the wires between the four loop stages flow as
      marching dashes, each stage lights up briefly in turn, a blue token travels the four stages and
      returns to the first, and the red stall bar pulses gently between full and near-full opacity. A
      prefers-reduced-motion block disables every animation and restores the resting state, in which
      all four stages are shaded, all wires are solid arrows, the token sits at stage one, and both
      timelines, both queues and every label and timing figure are fully drawn.
  - id: concurrency-models-architecture
    file: assets/concurrency-models-architecture.svg
    type: diagram
    title: 'The three concurrency models Python gives you: what each duplicates, what each shares, what a switch costs, and which workload it suits'
    alt: "Diagram: threads, processes and the event loop compared side by side — for each one the unit of execution, what is duplicated, what is shared, the cost of one switch, how many can truly run Python at once, the workload it suits, its characteristic failure mode, and the speed-up measured in this day's lab"
    description: >-
      A static three-column comparison. A banner across the top states the one question that decides
      between the three: is this work waiting (a socket, a disk, a database, a human) or computing
      (arithmetic, parsing, encoding, inference). Each column carries a header naming the model and
      its APIs, then eight labelled rows. The threads column, headed threading and
      concurrent.futures.ThreadPoolExecutor, gives the unit as an operating-system thread; what is
      duplicated as a call stack and thread-local data and nothing else; what is shared as everything,
      the same objects, the same memory and one interpreter; the switch cost as cheap, with no new
      memory image and nothing copied or pickled; the number truly running Python at once as one,
      marked in amber, with many possibly blocked in I/O but only one holding the interpreter lock;
      the workload it suits as waiting work, marked in green; and its failure mode as races on shared
      state, with every mutation left to the programmer to reason about. The processes column, headed
      multiprocessing and ProcessPoolExecutor, gives the unit as an operating-system process;
      duplicated as everything, its own interpreter, its own memory and its own lock; shared as
      nothing by default, only what you send, pickled and copied; the switch cost, marked in amber,
      as expensive — starting the process and pickling every value both ways; truly running at once,
      marked in green, as as many as you have cores, with the note that this is parallelism rather
      than merely concurrency; suits computing work; and its failure mode as unpicklable arguments,
      copies that are too large, and start-up cost eating small tasks. The event loop column, headed
      asyncio, async def, await and TaskGroup, gives the unit as a coroutine, a function that can
      pause and be resumed; duplicated as nothing, one thread, one stack, one interpreter and one
      loop; shared as everything but interleaved only at await, with the note that between two awaits
      you cannot be interrupted; the switch cost, marked in green, as the cheapest of the three, a
      function resuming with no operating system involved; truly running at once, marked in amber, as
      one by design, which is concurrency without parallelism; suits waiting work at high fan-out; and
      its failure mode as one blocking call stopping every task. Beneath each column a band records
      the speed-up measured in the day lab: threads twelve point two times faster on waiting work and
      one point zero one on computing work; processes two point eight nine times faster on computing
      work with four workers; the event loop seventeen point nine times faster on waiting work and
      zero point nine eight on computing work. A footer states that the interpreter lock protects the
      interpreter own state rather than your data, that it is released while a thread waits on I/O
      which is exactly why threads help with waiting and not with computing, and that the figures are
      one machine on one day so the ratios are the claim and the seconds behind them are not.
