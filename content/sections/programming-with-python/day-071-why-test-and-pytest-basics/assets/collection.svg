<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four rules.">
  <title>How tests are found</title>
  <style>
    .collection-bg   { fill: #f8fafc; }
    .collection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collection-stage { opacity: 1; }

    .collection-s0 { animation-delay: 0.00s; }
    .collection-e0 { animation-delay: 0.00s; }
    .collection-s1 { animation-delay: 1.28s; }
    .collection-e1 { animation-delay: 1.28s; }
    .collection-s2 { animation-delay: 2.56s; }
    .collection-e2 { animation-delay: 2.56s; }
    .collection-s3 { animation-delay: 3.84s; }
    .collection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collection-conn  { animation: collection-trace 6.4s ease-in-out infinite; }
      .collection-stage { animation: collection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collection-stage { animation: collection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collection-bg" width="980" height="322"/>
  <text class="collection-h1"  x="30" y="40">How tests are found</text>
  <text class="collection-sub" x="30" y="64">Four rules.</text>
  <g class="collection-stage collection-s0">
    <rect class="collection-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collection-step" x="44" y="142">01</text>
    <text class="collection-name" x="70" y="142">Search from the configured root</text>
    <text class="collection-desc" x="44" y="166">Recursively.</text>
  </g>
  <line class="collection-line collection-conn collection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collection-tip)"/>
  <g class="collection-stage collection-s1">
    <rect class="collection-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collection-step" x="280" y="142">02</text>
    <text class="collection-name" x="306" y="142">Files whose names begin or end with the test marker</text>
    <text class="collection-desc" x="280" y="166">By convention, not</text>
    <text class="collection-desc" x="280" y="182">configuration.</text>
  </g>
  <line class="collection-line collection-conn collection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collection-tip)"/>
  <g class="collection-stage collection-s2">
    <rect class="collection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collection-step" x="516" y="142">03</text>
    <text class="collection-name" x="542" y="142">Functions whose names begin with it</text>
    <text class="collection-desc" x="516" y="166">Which is why naming matters</text>
    <text class="collection-desc" x="516" y="182">here.</text>
  </g>
  <line class="collection-line collection-conn collection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collection-tip)"/>
  <g class="collection-stage collection-s3">
    <rect class="collection-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collection-step" x="752" y="142">04</text>
    <text class="collection-name" x="778" y="142">And classes with the marker, without an initialiser</text>
    <text class="collection-desc" x="752" y="166">Which is a common surprise.</text>
  </g>
  <text class="collection-sub" x="30" y="304">A test that silently never runs is worse than a failing one, and a misnamed file is the most common way that happens.</text>
</svg>
