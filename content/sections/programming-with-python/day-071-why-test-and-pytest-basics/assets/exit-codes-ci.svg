<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Exit codes and automation</title>
  <style>
    .exit-codes-ci-bg   { fill: #f8fafc; }
    .exit-codes-ci-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-ci-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-ci-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-ci-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-ci-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exit-codes-ci-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exit-codes-ci-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exit-codes-ci-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exit-codes-ci-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exit-codes-ci-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exit-codes-ci-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exit-codes-ci-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exit-codes-ci-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exit-codes-ci-stage { opacity: 1; }

    .exit-codes-ci-s0 { animation-delay: 0.00s; }
    .exit-codes-ci-e0 { animation-delay: 0.00s; }
    .exit-codes-ci-s1 { animation-delay: 1.28s; }
    .exit-codes-ci-e1 { animation-delay: 1.28s; }
    .exit-codes-ci-s2 { animation-delay: 2.56s; }
    .exit-codes-ci-e2 { animation-delay: 2.56s; }
    .exit-codes-ci-s3 { animation-delay: 3.84s; }
    .exit-codes-ci-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exit-codes-ci-conn  { animation: exit-codes-ci-trace 6.4s ease-in-out infinite; }
      .exit-codes-ci-stage { animation: exit-codes-ci-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exit-codes-ci-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exit-codes-ci-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exit-codes-ci-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exit-codes-ci-stage { animation: exit-codes-ci-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exit-codes-ci-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exit-codes-ci-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exit-codes-ci-bg" width="980" height="322"/>
  <text class="exit-codes-ci-h1"  x="30" y="40">Exit codes and automation</text>
  <text class="exit-codes-ci-sub" x="30" y="64">Four steps.</text>
  <g class="exit-codes-ci-stage exit-codes-ci-s0">
    <rect class="exit-codes-ci-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-ci-step" x="44" y="142">01</text>
    <text class="exit-codes-ci-name" x="70" y="142">The run ends with an exit code</text>
    <text class="exit-codes-ci-desc" x="44" y="166">Zero if everything passed.</text>
  </g>
  <line class="exit-codes-ci-line exit-codes-ci-conn exit-codes-ci-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exit-codes-ci-tip)"/>
  <g class="exit-codes-ci-stage exit-codes-ci-s1">
    <rect class="exit-codes-ci-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-ci-step" x="280" y="142">02</text>
    <text class="exit-codes-ci-name" x="306" y="142">Non-zero if anything failed or errored</text>
    <text class="exit-codes-ci-desc" x="280" y="166">Which is the machine-readable</text>
    <text class="exit-codes-ci-desc" x="280" y="182">result.</text>
  </g>
  <line class="exit-codes-ci-line exit-codes-ci-conn exit-codes-ci-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exit-codes-ci-tip)"/>
  <g class="exit-codes-ci-stage exit-codes-ci-s2">
    <rect class="exit-codes-ci-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-ci-step" x="516" y="142">03</text>
    <text class="exit-codes-ci-name" x="542" y="142">Automation checks that code, not the output</text>
    <text class="exit-codes-ci-desc" x="516" y="166">Which is why printing is not</text>
    <text class="exit-codes-ci-desc" x="516" y="182">enough.</text>
  </g>
  <line class="exit-codes-ci-line exit-codes-ci-conn exit-codes-ci-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exit-codes-ci-tip)"/>
  <g class="exit-codes-ci-stage exit-codes-ci-s3">
    <rect class="exit-codes-ci-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exit-codes-ci-step" x="752" y="142">04</text>
    <text class="exit-codes-ci-name" x="778" y="142">So a failing test blocks the change</text>
    <text class="exit-codes-ci-desc" x="752" y="166">Which is what makes it a gate.</text>
  </g>
  <text class="exit-codes-ci-sub" x="30" y="304">The exit code is what turns a test suite from a report into a gate, and it is the same mechanism as every other check in this curriculum.</text>
</svg>
