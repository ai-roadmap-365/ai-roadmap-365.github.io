terms:
  - term: 'Test'
    definition: 'A small program that runs another program and complains if the answer is wrong. It has three parts in a fixed order — arrange the inputs, act by calling the code, assert what must be true — and its result is a fact a machine can read, not an opinion.'
  - term: 'Unit test'
    definition: 'A test that exercises one function or one object in isolation, in milliseconds, with no files, network or clock involved. Contrast an integration test, which exercises several parts together and is slower and more fragile by nature.'
  - term: 'Assertion'
    definition: 'A statement of something that must be true at a point in the program. In Python, `assert expression` does nothing when the expression is true and raises `AssertionError` when it is false. Note that the `-O` flag strips assertions entirely, which is why they belong in tests and not in runtime validation of untrusted input.'
  - term: 'Arrange, act, assert'
    definition: 'The three-part shape of every test in every language: build the inputs, call the thing once, state what must be true. When the input is a literal, arrange and act share a line — that is normal, not a shortcut.'
  - term: 'Test runner'
    definition: 'A program that discovers tests by name, imports and executes them, records each outcome, prints a report, and exits with a status code describing the whole run. pytest, `unittest` and `doctest` are all runners; a plain script full of asserts is a minimal one.'
  - term: 'Collection'
    definition: 'The phase in which pytest works out what to run, before running anything: it fixes the rootdir, imports every `conftest.py` in scope, imports each file matching `test_*.py` or `*_test.py`, and gathers `test_*` functions and `Test*` classes into items with ids. `--collect-only` shows the result without executing a thing.'
  - term: 'Assertion rewriting'
    definition: 'pytest''s import hook, which rewrites a test module''s `assert` statements before compiling them so that a failure can report both sides of the comparison — `assert 4 == 3` plus a `where 4 = add(1, 2)` line. The source file is never modified; the rewriting happens in memory on the way to bytecode. It is why pytest needs no `assertEqual`.'
  - term: 'Test id'
    definition: 'The `path::Class::name` string that identifies one collected test, such as `test_textstats.py::TestTopWords::test_returns_exactly_n_items`. It appears in verbose output and in the short test summary, and it can be pasted back onto the command line to run exactly that test.'
  - term: 'Regression'
    definition: 'Code that used to work and now does not, broken by a change made somewhere else. The expensive part is never the fix — it is the search. A regression test is a test written to reproduce a bug before it is fixed, so that the bug can never return unnoticed.'
  - term: 'Fixture'
    definition: 'A named piece of prepared state that a test asks for by declaring a parameter of that name; pytest looks it up — usually in `conftest.py` — calls it, and hands the result over. A parameter that is a request rather than a value. The full subject of Day 72.'
  - term: 'conftest.py'
    definition: 'A file pytest imports automatically, by name alone, from the rootdir down to the directory being collected. Nothing imports it and no configuration names it. Whatever it defines is available to every test file beneath it — which also makes it the quietest place in a repository to hide code that runs on every test invocation, so review its diffs carefully.'
  - term: 'rootdir'
    definition: 'The directory pytest treats as the base of the run, found by walking upward from the paths you named to the first `pytest.ini`, `pyproject.toml`, `tox.ini` or `setup.cfg`. Every path in the report is printed relative to it, and it is printed in the header of every run — the first thing to read when pytest behaves unexpectedly.'
  - term: 'Exit code'
    definition: 'The single small integer a process returns when it ends — the entire interface between a test suite and any automation. For pytest: 0 all passed, 1 something failed, 2 interrupted (including a collection error), 3 internal error, 4 wrong command-line usage, 5 no tests collected. A build step should succeed if and only if the code was 0.'
  - term: 'Flaky test'
    definition: 'A test that gives different answers on the same code, usually because it depends on the clock, a random value, the network, the machine''s speed, or the order tests ran in. Worse than no test, because it trains everyone to re-run the suite instead of reading it — including on the day the failure is real.'
  - term: 'Vacuous test'
    definition: 'A test that passes no matter what the implementation does — `assert result is not None`, `assert isinstance(result, list)`, `assert True` after a call. It is the go/no-go gauge every part fits through: it documents a quality process that certifies nothing. The cure is to break the code on purpose and confirm the test goes red.'
  - term: 'Test double'
    definition: 'A stand-in object used in place of a real dependency so that a test stays fast and deterministic — a stub returning a canned answer, a fake with a simple working implementation, a mock that also records how it was called. The technique that makes non-deterministic boundaries such as a network call or a model API testable. The subject of Day 74.'
