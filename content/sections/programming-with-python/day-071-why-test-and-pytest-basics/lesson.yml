id: D071
day: 71
slug: why-test-and-pytest-basics
title: 'Why Test, and pytest Basics'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to say exactly what a test is and why a bare `assert` in a script already is one, write pytest tests as plain functions in arrange-act-assert form, explain every phase of a pytest run from rootdir discovery through collection, assertion rewriting, execution and reporting, read a failure report and the short test summary fluently, drive a run with -q, -v, -x, -k and --tb=short, treat the process exit code as the only thing a build may trust, and tell a test that pins a behaviour apart from one that passes no matter what the code does.'
objectives:
  - 'Explain in concrete terms why manual checking does not scale and what a regression actually costs, using the difference between a bug caught in the same minute and the same bug caught in production'
  - 'Write a test as arrange, act, assert, and explain why a bare `assert` statement in a plain Python script is already a complete test suite with a machine-readable result'
  - 'Describe every phase of a pytest run in order — configuration and rootdir discovery, conftest import, name-based collection into items with ids, assertion rewriting at import time, execution, and reporting'
  - 'Explain honestly why pytest uses the bare `assert` where `unittest` needs `assertEqual`, and read a real failure report including the `E   assert 4 == 3` explanation and its `where` line'
  - 'Read pytest output fluently: the progress characters, the short test summary, the final counts, and the effect of `-q`, `-v`, `-x`, `-k` and `--tb=short`'
  - 'Name pytest''s exit codes and explain why a build script that greps the output for a word rather than reading the exit code will one day ship untested code on exit 5'
  - 'Judge whether a test is worth having against four properties — fast, deterministic, independent, one reason to fail — and identify the vacuous test that passes whatever the implementation does'
  - 'Choose between pytest, `unittest`, `doctest` and Hypothesis for a given situation, and state what each costs and what each ships with'
prerequisites:
  - 'Day 70: modelling a domain with objects — the model this lesson argues you cannot re-check by hand'
  - 'Days 67-69: classes and objects, inheritance and dunder methods, dataclasses and type hints'
  - 'Day 66: raising and catching exceptions on purpose, which is what `pytest.raises` asserts about'
  - 'Day 63: designing a small program well — the pure core that makes testing cheap'
  - 'Day 43: creating a virtual environment with `python3 -m venv`, used here to install the first third-party dependency of the course'
  - 'Comfort running a command in a terminal and reading its exit status with `echo $?`'
reading_time_minutes: 40
practical_time_minutes: 30
