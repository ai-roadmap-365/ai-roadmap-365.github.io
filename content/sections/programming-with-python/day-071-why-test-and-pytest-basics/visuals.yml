visuals:
  - id: pytest-run-architecture
    file: assets/pytest-run-architecture.svg
    type: diagram
    title: 'Anatomy of a pytest run'
    alt: 'Diagram: the anatomy of a pytest run — one process moving through configuration and rootdir discovery, collection of conftest files and test modules, the assertion-rewriting import hook, the session that runs each item, and the reporter, ending in a process exit code that continuous integration reads'
    description: 'A single pytest process drawn as five stacked stages inside a process boundary, each with a panel on the right naming what feeds it. Stage one, configuration: pytest walks up from the paths it was given to the first pytest.ini, pyproject.toml, tox.ini or setup.cfg, and that directory becomes the rootdir every printed path is relative to; the panel names those four file types plus addopts and testpaths. Stage two, collection: every conftest.py from the rootdir down is imported first, then each matching module, and functions and classes become items with ids of the form file.py::Class::test_name; the panel gives the matching rules — files named test_*.py or *_test.py, functions named test_*, classes named Test* with no __init__. Stage three, assertion rewriting: an import hook compiles each test module with its assert statements expanded so a failure can show both sides, with the panel showing assert add(1, 2) == 3 becoming assert 4 == 3 with a where clause. Stage four, the session: each item runs in turn, its parameters resolved against fixtures of the same name from conftest.py. Stage five, the reporter: one progress character per test — dot for passed, F for failed, E for error, s for skipped, x for expected failure — then the failure bodies, the short test summary, and one final counting line. Below the process boundary sits the process exit code, highlighted as the only part a machine reads: 0 all passed, 1 a test failed, 2 interrupted, 5 nothing collected.'
  - id: test-lifecycle-flow
    file: assets/test-lifecycle-flow.svg
    type: flowchart
    title: 'The life of one test'
    alt: 'Flowchart: the life of one test in eight steps — collected as an item, module imported with assertions rewritten, fixtures resolved by name, arrange, act, assert, reported as a dot or an F with both sides of the comparison, and counted into the summary line and the process exit code'
    description: 'A vertical eight-step flow following one real test from the lab, test_word_count_of_the_sample_is_twelve, with a concrete annotation beside each step. Step one, collected: the name begins with test_, so it becomes an item with the id test_textstats.py::test_word_count_of_the_sample_is_twelve. Step two: the module is imported once with its assertions rewritten, before any test runs — import time is when assert gains its explanation. Step three: fixtures are resolved by name, so the sample_text parameter is looked up in conftest.py rather than passed in. Step four, arrange: the twelve-word sample sentence, counted by hand rather than taken from the code. Step five, act: exactly one call, word_count(sample_text), so only one thing can be wrong. Step six, assert: assert word_count(sample_text) == 12 — true means nothing happens, false raises AssertionError. Step seven, reported: a single dot on success, an F now and the full body at the end on failure, showing E assert 13 == 12 and the where line naming the call that produced the 13. Step eight: the test is counted into the summary line and the totals decide the exit code — 19 passed gives exit 0, 4 failed and 15 passed gives exit 1. A closing note observes that a test which cannot fail never reaches step seven with an F, and that a suite you have never seen go red is a suite you have never tested.'
