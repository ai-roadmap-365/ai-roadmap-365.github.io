questions:
  - question: 'A test file contains `assert word_count("The cat. The hat!") == 4`. Which part of arrange-act-assert is missing?'
    options:
      - 'The arrange step is missing — a literal argument is not an arrangement'
      - 'The act step is missing — there is no separate call'
      - 'Nothing — the literal arranges, the call acts, the compare asserts'
      - 'The assert step is missing — a bare `assert` is not a real assertion'
    answer_index: 2
    explanation: 'All three parts are present, and two of them share a line. When the input is a literal there is nothing to build, so arrange and act collapse into one expression — which is normal and good. The bare `assert` is a genuine assertion: it raises `AssertionError` when false, which is exactly what a test runner needs. This is why a plain Python script full of asserts is already a test suite.'

  - question: 'Mechanically, why can pytest print `assert 4 == 3` and `where 4 = add(1, 2)` when `unittest` cannot?'
    options:
      - 'pytest runs every test twice and compares the two runs'
      - 'pytest reads your source file from disk after the failure and re-evaluates the expression'
      - 'pytest replaces Python''s built-in `assert` keyword with its own function'
      - 'pytest rewrites assert statements at import time to save values'
    answer_index: 3
    explanation: 'pytest installs an import hook. When it imports a test module it rewrites the module''s assert statements before compiling them, storing intermediate values as the expression is evaluated so the explanation can be built if the result is false. Your source file is untouched — the rewriting happens on the way to bytecode. Nothing is re-evaluated after the fact, and `assert` remains the ordinary Python statement, which is why a bare assert in a file pytest did not rewrite reports nothing but `AssertionError`.'

  - question: 'What determines pytest''s rootdir?'
    options:
      - 'The directory of the first config file found walking upward'
      - 'The directory containing the first `conftest.py` pytest finds'
      - 'It is always the repository root, detected from version control'
      - 'The directory you were in when you ran the command'
    answer_index: 0
    explanation: 'pytest starts at the paths on the command line and walks upward looking for `pytest.ini`, `pyproject.toml`, `tox.ini` or `setup.cfg`; the directory holding the first one becomes the rootdir, and every path in the report is printed relative to it. This is why the lab ships a two-line `pytest.ini` in `examples/` and another in `starter/` — without them pytest keeps climbing and picks an ancestor directory you never chose. `conftest.py` is imported by collection but does not set the rootdir, and pytest knows nothing about version control.'

  - question: 'A build script runs `pytest tests/` and ships if the output does not contain the word `FAILED`. What is the specific circumstance in which it ships untested code?'
    options:
      - 'A test raises an error instead of failing an assertion, so it is reported as `E`'
      - 'The path matches no test files, so nothing is collected; exit 5'
      - 'A test is skipped, so it is reported as `s` rather than as a failure'
      - 'The suite passes but takes longer than the build timeout'
    answer_index: 1
    explanation: 'Exit code 5 means no tests were collected. A renamed directory or a typo in a path produces a run with zero failures and zero tests: `no tests ran in 0.00s`, no `FAILED` anywhere, exit 5. The script sees no failure and ships. The correct rule is one sentence long — a build step succeeds if and only if the process exited 0 — and every shell and CI system already works that way unless you go out of your way to break it.'

  - question: 'Which of these tests could still be green after `top_words` is broken so that it returns one item instead of two?'
    options:
      - '`assert top_words(text, 2) == [("a", 3), ("b", 2)]`'
      - '`assert len(top_words(text, 2)) == 2`'
      - '`assert isinstance(top_words(text, 2), list)`'
      - '`assert top_words(text, 2)[1] == ("b", 2)`'
    answer_index: 2
    explanation: 'A wrong list is still a list, so the `isinstance` check passes whatever the bug is. That is a vacuous test: it looks like quality assurance and certifies nothing — the go/no-go gauge that every part fits through. The other three all pin something the bug changes: full equality, the length, and the second element (which would raise `IndexError` and be reported as an error). The lab makes this concrete by shipping four vacuous tests and a script that breaks the function and watches them stay green.'

  - question: 'In pytest''s progress line, what is the difference between an `F` and an `E`?'
    options:
      - 'They are interchangeable — pytest picks whichever fits the terminal width'
      - '`F` means a fatal error that stops the run; `E` means a recoverable one'
      - '`F` means the test failed; `E` means it was deselected by `-k`'
      - '`F` is a false assertion; `E` means it never got that far'
    answer_index: 3
    explanation: 'The distinction is genuinely useful for triage. `F` means your code ran and produced the wrong answer, so go and read the logic. `E` means execution never reached the assertion — a bad import, a fixture that raised, a missing file — so go and read the setup. Neither stops the run (that is what `-x` is for), and deselected tests produce no character at all because they were filtered out before running.'

  - question: 'You run `pytest examples -k reading_time` and see `5 passed, 14 deselected`. What does "deselected" mean here?'
    options:
      - 'Fourteen tests were collected and then filtered out'
      - 'Fourteen tests ran and chose not to assert anything'
      - 'Fourteen tests failed to import and were excluded'
      - 'Fourteen tests were marked as expected failures'
    answer_index: 0
    explanation: 'Collection happens first and finds all nineteen; `-k` then filters, and the tests that do not match are deselected — never executed, never reported with a character. This is different from a skip, where the test was selected, started, and declined to run (reported as `s`). Confusing the two makes the counts lie to you, which matters when you are checking that a run really exercised what you think it did.'

  - question: 'Which situation is `doctest` the right tool for?'
    options:
      - 'Asserting that a function raises the correct exception with the correct message across ten input variations'
      - 'Keeping three short, exact examples in a docstring true, so the documentation cannot drift from the code'
      - 'Checking that a function returning a large dictionary produces the right contents'
      - 'Generating hundreds of random inputs to try to falsify a property'
    answer_index: 1
    explanation: '`doctest` compares the text after a `>>>` prompt with the following line character for character. That is unbeatable for short, exact, illustrative results — you get a documented example and a tested one for the price of one — and exactly wrong when the output is long, unordered, or contains anything that varies, such as a dictionary with an unstable print order or a repr with a memory address in it. Exhaustive exception testing is pytest''s `pytest.raises`; generating and shrinking random inputs is what Hypothesis does.'
