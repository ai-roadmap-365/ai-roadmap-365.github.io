id: D065
day: 65
slug: csv-and-json-in-the-real
title: 'CSV and JSON in the Real World'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will be able to read and write real-world CSV and JSON without silently corrupting data: parse messy CSV with the csv module rather than splitting on commas, survive embedded commas, quoted newlines, doubled quotes, byte-order marks and ragged rows, map JSON''s six types onto Python''s and know exactly what a round trip changes, choose between CSV, JSON and JSON Lines on purpose, and implement the RFC 4180 quoting state machine yourself.'
objectives:
  - 'Explain why data interchange formats exist and state the four RFC 4180 rules that govern CSV quoting'
  - 'Demonstrate how line.split(",") corrupts real data, including the case where the field count still looks correct'
  - 'Read messy CSV correctly with csv.DictReader, using encoding="utf-8-sig" and newline="" and explaining what each prevents'
  - 'Detect and handle ragged rows, whose missing fields DictReader fills with None rather than raising'
  - 'Map the JSON data model onto Python types and name what a round trip changes — tuples become lists, dict keys become strings, and there is no date type'
  - 'Choose between CSV, JSON, and JSON Lines for a given job, and explain why JSONL is what training data and evaluation records use'
  - 'Implement a CSV field parser from scratch as a quoting state machine and verify it agrees with the standard library'
prerequisites:
  - 'Day 64: reading and writing files, explicit encodings, streaming reads, and the atomic-write pattern'
  - 'Days 57-63: functions, modules and imports, the standard library, and designing a small program well'
  - 'Days 52-55: lists, dictionaries, and comprehensions — the structures these formats parse into'
  - 'Comfort running a script from the terminal with python3'
reading_time_minutes: 40
practical_time_minutes: 30
