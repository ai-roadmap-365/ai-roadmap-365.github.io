questions:
  - question: 'A CSV field contains a comma, so the row is parsed with `line.split(",")`. What is the most dangerous outcome?'
    options:
      - 'The row gains a field, so every later column shifts'
      - 'The parser raises a clear error naming the offending line'
      - 'Only the field containing the comma is affected; the rest of the row is fine'
      - 'The file cannot be opened at all'
    answer_index: 0
    explanation: 'Nothing raises. A comma inside a field adds a field and shifts every column after it, which a field-count check would at least notice. The worse case is a field with doubled quotes: it keeps the correct field count and still parses to the wrong value, so count-based validation waves it through.'

  - question: 'What does opening a CSV with `encoding="utf-8-sig"` do?'
    options:
      - 'Signs the file so its integrity can be verified later'
      - 'Strips a leading byte-order mark, else acts like utf-8'
      - 'Forces every field to be quoted on write'
      - 'Automatically detects the delimiter used by the file'
    answer_index: 1
    explanation: 'Spreadsheet exports often begin with a byte-order mark, which invisibly prefixes the first column name so no lookup matches it. utf-8-sig removes it when present and is harmless when absent, which makes it the right default for files that may have come from a spreadsheet.'

  - question: 'Why must a CSV file be opened with `newline=""`?'
    options:
      - 'Because csv.reader cannot accept a file object otherwise'
      - 'To strip trailing whitespace from every field'
      - 'So the csv module sees raw line endings inside quoted fields'
      - 'It only matters when writing, never when reading'
    answer_index: 2
    explanation: 'The csv module handles line endings itself, because a quoted field may legitimately contain one. Letting Python''s universal newline translation interfere produces spurious blank rows on some platforms — a bug that appears only on someone else''s machine.'

  - question: '`csv.DictReader` reads a row that supplied fewer fields than the header. What happens?'
    options:
      - 'It raises csv.Error naming the line number'
      - 'It skips the row silently'
      - 'It repeats the previous row''s values for the missing fields'
      - 'It parses successfully, filling the missing fields with None'
    answer_index: 3
    explanation: 'A ragged row is valid CSV, so nothing raises. DictReader pads the missing fields with None, and those None values flow onward into your arithmetic unless you check for them. This is why a None check is a required habit, not a defensive nicety.'

  - question: 'Which of these can JSON represent directly?'
    options:
      - 'A nested object with an array'
      - 'A date'
      - 'A Python tuple, preserved as a tuple'
      - 'A set'
    answer_index: 0
    explanation: 'JSON has exactly six types: object, array, string, number, true/false, and null. Nesting is its strength. Dates are a convention (an ISO 8601 string), tuples serialize to arrays and return as lists, and sets do not serialize at all without help.'

  - question: 'What changes when a Python dict `{1: "a"}` is dumped to JSON and loaded back?'
    options:
      - 'Nothing; the round trip is exact'
      - 'The key becomes the string "1"'
      - 'The value becomes a list'
      - 'json.dumps raises a TypeError on the integer key'
    answer_index: 1
    explanation: 'JSON object keys are always strings, so Python converts non-string keys on the way out and cannot know to convert them back. An integer-keyed lookup table silently becomes string-keyed — a favourite source of failed lookups after a round trip.'

  - question: 'Why is JSON Lines preferred over one large JSON array for training data and logs?'
    options:
      - 'JSON Lines files are always smaller on disk'
      - 'JSON Lines supports data types that JSON does not'
      - 'Each line is a complete object, so it streams'
      - 'A JSON array cannot contain objects'
    answer_index: 2
    explanation: 'A single array must be parsed whole before any record is available, so its ceiling is your RAM. JSONL gives constant peak memory with `for line in handle:`, appending is one write, and splitting on newlines parallelises trivially. It is actually slightly larger on disk, since every record repeats every key.'

  - question: 'Which `json.dumps` argument makes Python refuse to emit values that are not valid JSON?'
    options:
      - 'sort_keys=True'
      - 'indent=2'
      - 'ensure_ascii=False'
      - 'allow_nan=False'
    answer_index: 3
    explanation: 'By default Python happily writes bare NaN, Infinity, and -Infinity, none of which are valid JSON, producing a file that most non-Python parsers reject. allow_nan=False raises instead, so the problem surfaces where it was created rather than in whatever reads the file next.'
