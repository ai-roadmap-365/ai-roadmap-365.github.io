visuals:
  - id: data-formats-architecture
    file: assets/data-formats-architecture.svg
    type: diagram
    title: 'From bytes on disk to Python objects'
    alt: 'Diagram: how bytes on disk become Python objects — a file is a numbered run of bytes, open() decodes them into text using an encoding, a parser (the csv module, the json module, or json.loads once per line for JSON Lines) turns that text into structure, and the result is ordinary Python lists, dicts, strings, and numbers that your program works with'
    description: 'Four stages shown for three format families side by side. At the bottom, the file is a numbered run of bytes. open() with an explicit encoding decodes those bytes into text. A parser then turns the text into structure: the csv module for comma-separated text, the json module for a whole JSON document, or json.loads called once per line for JSON Lines. The output is ordinary Python objects — lists, dicts, strings, numbers — and only then does the program work with the data. Showing the three families through every stage makes the point that choosing a format is choosing a parser, and that every format failure happens at that single stage.'
  - id: csv-quoting-flow
    file: assets/csv-quoting-flow.svg
    type: flowchart
    title: 'The CSV quoting state machine'
    alt: 'Flowchart: the quoting state machine a CSV parser runs for every character — it begins in field-start, an ordinary character moves it to in-field where a delimiter or newline ends the field, a quote moves it to in-quoted where commas and newlines are ordinary data, and a quote seen while in-quoted moves it to quote-in-quoted where a second quote means one literal quote and anything else ends the field'
    description: 'A four-state machine evaluated once per character. It begins outside a field in the field-start state. An ordinary character moves it to in-field, where further characters are appended and a delimiter or newline ends the field. A quote character instead moves it to in-quoted, where commas and newlines are ordinary data and are appended rather than treated as separators. A quote seen while in-quoted is ambiguous, so it moves to quote-in-quoted to inspect the next character: a second quote means one literal quote and returns to in-quoted, while a delimiter or newline ends the field and returns to field-start. At the end of the text, whatever field and row are still in hand are flushed, which is what allows a ragged final row to be parsed rather than dropped.'
  - id: csv-rules
    file: assets/csv-rules.svg
    type: diagram
    title: 'The rules that matter'
    alt: 'Diagram: the four rules that make comma-separated data non-trivial'
    description: 'A four-stage description of the format''s rules covering separators, quoting, escaping and newlines.'
  - id: split-fails
    file: assets/split-fails.svg
    type: diagram
    title: 'Why splitting fails'
    alt: 'Diagram: why splitting a line on commas produces wrong fields'
    description: 'A four-stage description of the splitting failure covering the naive approach, the quoted comma, the misaligned fields and the silence.'
  - id: json-model
    file: assets/json-model.svg
    type: diagram
    title: 'The data model'
