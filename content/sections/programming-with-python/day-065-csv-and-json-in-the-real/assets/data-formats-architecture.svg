<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" font-family="system-ui, sans-serif">
  <title>How bytes on disk become Python objects: a file is a numbered run of bytes; open() decodes those bytes into text with an encoding; a parser — the csv module for comma-separated text, the json module for a JSON document, or json.loads once per line for JSON Lines — turns the text into structure; the result is ordinary Python objects (lists, dicts, strings, numbers); and only then does your program work with the data. The three format families are shown side by side through every stage.</title>
  <rect x="0" y="0" width="900" height="600" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">From bytes on disk to Python objects</text>

  <!-- Stage gutter labels -->
  <text x="85" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">1 · bytes</text>
  <text x="85" y="123" text-anchor="middle" font-size="14" fill="#1a202c">on disk</text>
  <text x="85" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">2 · decode</text>
  <text x="85" y="226" text-anchor="middle" font-size="14" fill="#1a202c">bytes to text</text>
  <text x="85" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">3 · parse</text>
  <text x="85" y="323" text-anchor="middle" font-size="14" fill="#1a202c">text to structure</text>
  <text x="85" y="415" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">4 · Python</text>
  <text x="85" y="433" text-anchor="middle" font-size="14" fill="#1a202c">objects</text>
  <text x="85" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">5 · your</text>
  <text x="85" y="543" text-anchor="middle" font-size="14" fill="#1a202c">program</text>

  <!-- Row A: bytes on disk -->
  <rect x="170" y="70" width="220" height="80" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="280" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">orders.csv</text>
  <text x="280" y="115" text-anchor="middle" font-size="14" fill="#1a202c">ef bb bf 6f 72 64 65 72</text>
  <text x="280" y="136" text-anchor="middle" font-size="14" fill="#1a202c">mark, then text</text>

  <rect x="410" y="70" width="220" height="80" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">config.json</text>
  <text x="520" y="115" text-anchor="middle" font-size="14" fill="#1a202c">7b 0a 20 20 22 69 6e 70</text>
  <text x="520" y="136" text-anchor="middle" font-size="14" fill="#1a202c">one whole document</text>

  <rect x="650" y="70" width="220" height="80" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="760" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">orders.jsonl</text>
  <text x="760" y="115" text-anchor="middle" font-size="14" fill="#1a202c">7b 22 6f 72 64 65 72 5f</text>
  <text x="760" y="136" text-anchor="middle" font-size="14" fill="#1a202c">one object per line</text>

  <line x1="280" y1="150" x2="280" y2="176" stroke="#1a202c" stroke-width="2"/>
  <polygon points="280,180 274,168 286,168" fill="#1a202c"/>
  <line x1="520" y1="150" x2="520" y2="176" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,180 514,168 526,168" fill="#1a202c"/>
  <line x1="760" y1="150" x2="760" y2="176" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,180 754,168 766,168" fill="#1a202c"/>

  <!-- Row B: decode -->
  <rect x="170" y="182" width="700" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">open(path, encoding=..., newline='')</text>
  <text x="520" y="228" text-anchor="middle" font-size="14" fill="#1a202c">utf-8-sig drops a byte-order mark · newline='' leaves line handling to the csv module</text>

  <line x1="280" y1="242" x2="280" y2="266" stroke="#1a202c" stroke-width="2"/>
  <polygon points="280,270 274,258 286,258" fill="#1a202c"/>
  <line x1="520" y1="242" x2="520" y2="266" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,270 514,258 526,258" fill="#1a202c"/>
  <line x1="760" y1="242" x2="760" y2="266" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,270 754,258 766,258" fill="#1a202c"/>

  <!-- Row C: parse -->
  <rect x="170" y="272" width="220" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="280" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">csv.DictReader</text>
  <text x="280" y="317" text-anchor="middle" font-size="14" fill="#1a202c">quoting state machine</text>
  <text x="280" y="338" text-anchor="middle" font-size="14" fill="#1a202c">plus a dialect</text>

  <rect x="410" y="272" width="220" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">json.load</text>
  <text x="520" y="317" text-anchor="middle" font-size="14" fill="#1a202c">whole document,</text>
  <text x="520" y="338" text-anchor="middle" font-size="14" fill="#1a202c">all in memory</text>

  <rect x="650" y="272" width="220" height="80" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="760" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">json.loads per line</text>
  <text x="760" y="317" text-anchor="middle" font-size="14" fill="#1a202c">one record at a time,</text>
  <text x="760" y="338" text-anchor="middle" font-size="14" fill="#1a202c">streamable</text>

  <line x1="280" y1="352" x2="280" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="280,380 274,368 286,368" fill="#1a202c"/>
  <line x1="520" y1="352" x2="520" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,380 514,368 526,368" fill="#1a202c"/>
  <line x1="760" y1="352" x2="760" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,380 754,368 766,368" fill="#1a202c"/>

  <!-- Row D: Python objects -->
  <rect x="170" y="382" width="220" height="80" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="280" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">list of dicts</text>
  <text x="280" y="427" text-anchor="middle" font-size="14" fill="#1a202c">every value a str —</text>
  <text x="280" y="448" text-anchor="middle" font-size="14" fill="#1a202c">you restore the types</text>

  <rect x="410" y="382" width="220" height="80" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">dict / list / str</text>
  <text x="520" y="427" text-anchor="middle" font-size="14" fill="#1a202c">int, float, bool, None</text>
  <text x="520" y="448" text-anchor="middle" font-size="14" fill="#1a202c">nesting preserved</text>

  <rect x="650" y="382" width="220" height="80" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="760" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">one dict per line</text>
  <text x="760" y="427" text-anchor="middle" font-size="14" fill="#1a202c">types preserved,</text>
  <text x="760" y="448" text-anchor="middle" font-size="14" fill="#1a202c">memory stays flat</text>

  <line x1="280" y1="462" x2="280" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="280,490 274,478 286,478" fill="#1a202c"/>
  <line x1="520" y1="462" x2="520" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="520,490 514,478 526,478" fill="#1a202c"/>
  <line x1="760" y1="462" x2="760" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="760,490 754,478 766,478" fill="#1a202c"/>

  <!-- Row E: your program -->
  <rect x="170" y="492" width="700" height="60" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="520" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">your program</text>
  <text x="520" y="538" text-anchor="middle" font-size="14" fill="#1a202c">one shape of data in memory, whatever shape the file on disk happened to be</text>

  <text x="450" y="578" text-anchor="middle" font-size="14" fill="#1a202c">Serializing runs the same five stages backwards: objects to text to bytes on disk.</text>
</svg>
