<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four facts.">
  <title>The data model</title>
  <style>
    .json-model-bg   { fill: #f8fafc; }
    .json-model-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-model-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-model-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-model-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-model-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .json-model-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .json-model-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .json-model-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .json-model-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .json-model-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .json-model-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .json-model-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .json-model-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .json-model-stage { opacity: 1; }

    .json-model-s0 { animation-delay: 0.00s; }
    .json-model-e0 { animation-delay: 0.00s; }
    .json-model-s1 { animation-delay: 1.28s; }
    .json-model-e1 { animation-delay: 1.28s; }
    .json-model-s2 { animation-delay: 2.56s; }
    .json-model-e2 { animation-delay: 2.56s; }
    .json-model-s3 { animation-delay: 3.84s; }
    .json-model-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .json-model-conn  { animation: json-model-trace 6.4s ease-in-out infinite; }
      .json-model-stage { animation: json-model-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes json-model-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes json-model-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .json-model-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .json-model-stage { animation: json-model-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes json-model-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="json-model-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="json-model-bg" width="980" height="322"/>
  <text class="json-model-h1"  x="30" y="40">The data model</text>
  <text class="json-model-sub" x="30" y="64">Four facts.</text>
  <g class="json-model-stage json-model-s0">
    <rect class="json-model-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="json-model-step" x="44" y="142">01</text>
    <text class="json-model-name" x="70" y="142">Six types: object, array, string, number, boolean, null</text>
    <text class="json-model-desc" x="44" y="166">And nothing else.</text>
  </g>
  <line class="json-model-line json-model-conn json-model-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#json-model-tip)"/>
  <g class="json-model-stage json-model-s1">
    <rect class="json-model-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="json-model-step" x="280" y="142">02</text>
    <text class="json-model-name" x="306" y="142">Object keys are always strings</text>
    <text class="json-model-desc" x="280" y="166">So integer keys become strings</text>
    <text class="json-model-desc" x="280" y="182">on the round trip.</text>
  </g>
  <line class="json-model-line json-model-conn json-model-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#json-model-tip)"/>
  <g class="json-model-stage json-model-s2">
    <rect class="json-model-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="json-model-step" x="516" y="142">03</text>
    <text class="json-model-name" x="542" y="142">Numbers have no declared integer or float distinction</text>
    <text class="json-model-desc" x="516" y="166">Which loses precision on very</text>
    <text class="json-model-desc" x="516" y="182">large integers.</text>
  </g>
  <line class="json-model-line json-model-conn json-model-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#json-model-tip)"/>
  <g class="json-model-stage json-model-s3">
    <rect class="json-model-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="json-model-step" x="752" y="142">04</text>
    <text class="json-model-name" x="778" y="142">And there is no date type</text>
    <text class="json-model-desc" x="752" y="166">So dates are strings, by</text>
    <text class="json-model-desc" x="752" y="182">convention.</text>
  </g>
  <text class="json-model-sub" x="30" y="304">Integer keys becoming strings is the round-trip surprise that catches people: a dictionary keyed by numbers does not come back the same shape.</text>
</svg>
