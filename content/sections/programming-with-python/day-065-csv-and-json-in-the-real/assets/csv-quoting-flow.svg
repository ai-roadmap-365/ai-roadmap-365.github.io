<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" font-family="system-ui, sans-serif">
  <title>The quoting state machine a CSV parser runs for every character: it begins outside a field in the field-start state; an ordinary character moves it to in-field, where more characters are appended and a delimiter or newline ends the field; a quote character moves it instead to in-quoted, where commas and newlines are ordinary data and are appended; a quote seen while in-quoted moves it to quote-in-quoted, where a second quote means one literal quote and returns to in-quoted, while a delimiter or newline ends the field and returns to field-start; at the end of the text whatever field and row are still in hand are flushed.</title>
  <rect x="0" y="0" width="960" height="720" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The CSV quoting state machine, one character at a time</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#1a202c">Four states. Every character read moves the parser along one of these arrows.</text>

  <!-- start marker -->
  <circle cx="26" cy="190" r="6" fill="#1d4ed8"/>
  <line x1="32" y1="190" x2="100" y2="190" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="106,190 94,184 94,196" fill="#1d4ed8"/>
  <text x="66" y="176" text-anchor="middle" font-size="14" fill="#1d4ed8">start of text</text>

  <!-- states -->
  <rect x="110" y="170" width="230" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="225" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">field-start</text>
  <text x="225" y="224" text-anchor="middle" font-size="14" fill="#1a202c">between fields</text>

  <rect x="620" y="170" width="230" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="735" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">in-field</text>
  <text x="735" y="224" text-anchor="middle" font-size="14" fill="#1a202c">unquoted field</text>

  <rect x="110" y="460" width="230" height="76" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="225" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">in-quoted</text>
  <text x="225" y="514" text-anchor="middle" font-size="14" fill="#1a202c">quoted field</text>

  <rect x="620" y="460" width="230" height="76" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="735" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">quote-in-quoted</text>
  <text x="735" y="514" text-anchor="middle" font-size="14" fill="#1a202c">was that quote an escape?</text>

  <!-- field-start self-loop -->
  <path d="M 160 170 C 160 128, 290 128, 290 166" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polygon points="290,170 284,158 296,158" fill="#1a202c"/>
  <text x="225" y="118" text-anchor="middle" font-size="14" fill="#1a202c">delimiter → an empty field · newline → end the row</text>

  <!-- in-field self-loop -->
  <path d="M 660 170 C 660 128, 790 128, 790 166" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polygon points="790,170 784,158 796,158" fill="#1a202c"/>
  <text x="735" y="118" text-anchor="middle" font-size="14" fill="#1a202c">any other character → append it</text>

  <!-- field-start -> in-field -->
  <line x1="340" y1="192" x2="612" y2="192" stroke="#1a202c" stroke-width="2"/>
  <polygon points="618,192 606,186 606,198" fill="#1a202c"/>
  <text x="478" y="180" text-anchor="middle" font-size="14" fill="#1a202c">any other character</text>

  <!-- in-field -> field-start -->
  <line x1="620" y1="228" x2="348" y2="228" stroke="#1a202c" stroke-width="2"/>
  <polygon points="342,228 354,222 354,234" fill="#1a202c"/>
  <text x="478" y="252" text-anchor="middle" font-size="14" fill="#1a202c">delimiter → emit the field</text>
  <text x="478" y="270" text-anchor="middle" font-size="14" fill="#1a202c">newline → emit the field and the row</text>

  <!-- field-start -> in-quoted -->
  <line x1="170" y1="246" x2="170" y2="452" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="170,458 164,446 176,446" fill="#1d4ed8"/>
  <text x="160" y="340" text-anchor="end" font-size="14" font-weight="bold" fill="#1d4ed8">a quote</text>
  <text x="160" y="358" text-anchor="end" font-size="14" font-weight="bold" fill="#1d4ed8">character</text>

  <!-- in-quoted self-loop (the important one) -->
  <path d="M 160 536 C 160 578, 290 578, 290 540" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="290,534 284,546 296,546" fill="#1d4ed8"/>
  <text x="225" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">any character, including a comma</text>
  <text x="225" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">or a newline, is data here → append it</text>

  <!-- in-quoted -> quote-in-quoted -->
  <line x1="340" y1="482" x2="612" y2="482" stroke="#1a202c" stroke-width="2"/>
  <polygon points="618,482 606,476 606,488" fill="#1a202c"/>
  <text x="478" y="470" text-anchor="middle" font-size="14" fill="#1a202c">a quote character</text>

  <!-- quote-in-quoted -> in-quoted -->
  <line x1="620" y1="518" x2="348" y2="518" stroke="#1a202c" stroke-width="2"/>
  <polygon points="342,518 354,512 354,524" fill="#1a202c"/>
  <text x="478" y="542" text-anchor="middle" font-size="14" fill="#1a202c">another quote → append</text>
  <text x="478" y="560" text-anchor="middle" font-size="14" fill="#1a202c">one literal quote</text>

  <!-- quote-in-quoted -> in-field -->
  <line x1="735" y1="460" x2="735" y2="256" stroke="#1a202c" stroke-width="2"/>
  <polygon points="735,250 729,262 741,262" fill="#1a202c"/>
  <text x="752" y="340" font-size="14" fill="#1a202c">any other</text>
  <text x="752" y="358" font-size="14" fill="#1a202c">character</text>

  <!-- quote-in-quoted -> field-start (around the bottom) -->
  <path d="M 700 536 V 648 H 30 V 226 H 100" fill="none" stroke="#1a202c" stroke-width="2"/>
  <polygon points="106,226 94,220 94,232" fill="#1a202c"/>
  <text x="400" y="670" text-anchor="middle" font-size="14" fill="#1a202c">delimiter or newline → the quoted field ended: emit the field (and the row)</text>

  <!-- end-of-text note -->
  <text x="760" y="600" text-anchor="middle" font-size="14" fill="#1a202c">At the end of the text, flush whatever</text>
  <text x="760" y="618" text-anchor="middle" font-size="14" fill="#1a202c">field and row are still in hand.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.30s}.dx-f2{animation-delay:0.60s}.dx-f3{animation-delay:0.90s}.dx-f4{animation-delay:1.20s}.dx-f5{animation-delay:1.50s}.dx-f6{animation-delay:1.80s}.dx-f7{animation-delay:2.10s}.dx-f8{animation-delay:2.40s}.dx-f9{animation-delay:2.70s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 160 170 C 160 128, 290 128, 290 166" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 660 170 C 660 128, 790 128, 790 166" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 32 190 L 100 190" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 340 192 L 612 192" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 170 246 L 170 452" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 620 228 L 348 228" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 340 482 L 612 482" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f7" d="M 735 460 L 735 256" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f8" d="M 160 536 C 160 578, 290 578, 290 540" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f9" d="M 620 518 L 348 518" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
