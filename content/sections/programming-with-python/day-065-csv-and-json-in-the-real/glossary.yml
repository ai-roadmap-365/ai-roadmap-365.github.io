terms:
  - term: data interchange format
    definition: 'An agreement about bytes between two programs that will never meet. One writes and one reads, and the format is the only thing they share — which is why structure cannot survive a trip through a file without one.'
  - term: CSV
    definition: 'Comma-separated values: one record per line, fields separated by a delimiter, usually with a header row naming the columns. Universal and compact, but untyped, flat, and never formally standardised before the fact.'
  - term: RFC 4180
    definition: 'The 2005 memo by Yakov Shafranovich describing what most CSV implementations actually do. It is explicitly informational rather than a binding standard, which is exactly why real files still violate it.'
  - term: delimiter
    definition: 'The character separating fields within a record — a comma by convention, but semicolons, tabs, and pipes are all common in the wild. Always check before parsing rather than assuming.'
  - term: quoting
    definition: 'Wrapping a field in double quotes so that characters which would otherwise be structural — a delimiter, a newline — are treated as data. RFC 4180 requires it for any field containing a comma, a quote, or a line break.'
  - term: escaped quote
    definition: 'A literal double quote inside a quoted CSV field, written as two consecutive double quotes. It is how the quoting mechanism escapes itself, and it is the case that keeps the right field count while still corrupting data under naive parsing.'
  - term: dialect
    definition: 'The particular combination of delimiter, quote character, and line ending a producer uses. The csv module lets you name one explicitly, and csv.Sniffer will guess one from a sample.'
  - term: header row
    definition: 'The first line of a CSV, naming the columns. DictReader uses it to key each record by column name, so your code stops depending on column order.'
  - term: DictReader
    definition: 'The csv module reader that yields each record as a dictionary keyed by header name. It pads a short row''s missing fields with None rather than raising — which is convenient and dangerous in equal measure.'
  - term: ragged row
    definition: 'A record supplying fewer fields than the header declares. It is valid CSV, so nothing raises; the missing values arrive as None and flow onward into your arithmetic unless you check for them.'
  - term: byte-order mark
    definition: 'An invisible byte sequence (EF BB BF in UTF-8) that some programs write at the start of a file. It silently prefixes the first column name, so lookups fail in a way that looks like missing data. Opening with encoding="utf-8-sig" strips it.'
  - term: JSON
    definition: 'JavaScript Object Notation: a minimal format with exactly six types — object, array, string, number, true/false, and null. It nests arbitrarily, which is its strength, and carries no date, comment, or integer/float distinction, which is its cost.'
  - term: serialization
    definition: 'Turning in-memory objects into a sequence of bytes that can be stored or transmitted — what json.dump and csv.DictWriter do.'
  - term: deserialization
    definition: 'The reverse: turning stored bytes back into in-memory objects, as json.load and csv.DictReader do. The round trip is not always exact, which is where tuples and non-string dict keys catch people out.'
  - term: JSON Lines
    definition: 'A convention rather than a standard: one complete JSON object per line, with no wrapping array. It combines JSON''s structure with CSV''s streamability, which is why training data, evaluation records, and logs use it.'
  - term: round trip
    definition: 'Writing data out and reading it back. A lossless round trip returns exactly what you put in; through JSON, tuples return as lists and non-string dict keys return as strings, so equality can fail even when nothing was lost.'
  - term: ensure_ascii
    definition: 'A json.dumps argument, defaulting to True, that escapes every non-ASCII character to a \\uXXXX sequence. Setting it to False writes the characters themselves, which is readable and perfectly safe when you are already writing UTF-8.'
  - term: state machine
    definition: 'A parser design that holds one piece of state — here, which of four quoting states it is in — and decides what to do with each character based on it. It is what makes correct CSV parsing possible and hand-rolled splitting impossible.'
