<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" role="img" aria-labelledby="flow-title flow-desc" width="1080" height="900">
  <title id="flow-title">One unattended run, from the schedule firing to the exit code</title>
  <desc id="flow-desc">A flowchart of a single automated run. The scheduler fires, configuration resolves, a lock is acquired or the run stops, state loads, each item is fetched with retry, skip and stop branches, results are transformed, the state is written atomically, a summary is emitted and an exit code is set. A separate watchdog path notices a run that never happened.</desc>

  <rect x="0" y="0" width="1080" height="900" fill="#f8fafc"/>

  <style>
    .h  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #1a202c; }
    .b  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #1a202c; }
    .t  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #1a202c; }
    .s  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
    .a  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #1d4ed8; }
    .box   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .step  { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    .stop  { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
    .good  { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
    .warn  { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
    .arrow { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#h2); }
    .side  { stroke: #b45309; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#h3); }
    .halt  { stroke: #b91c1c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#h4); }
  </style>

  <defs>
    <marker id="h2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/></marker>
    <marker id="h3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
    <marker id="h4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b91c1c"/></marker>
  </defs>

  <text x="30" y="42" class="h">One unattended run: every branch that is not the happy path</text>

  <!-- main column -->
  <rect x="60" y="70" width="300" height="52" rx="6" class="box"/>
  <text x="76" y="92" class="t">the schedule fires</text>
  <text x="76" y="111" class="s">nobody is watching; PATH is nearly empty</text>
  <path d="M210 124 L 210 146" class="arrow"/>

  <rect x="60" y="148" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="170" class="t">resolve configuration</text>
  <text x="76" y="189" class="s">default, file, environment, flag — in that order</text>
  <path d="M210 202 L 210 224" class="arrow"/>

  <rect x="60" y="226" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="248" class="t">acquire the lock</text>
  <text x="76" y="267" class="s">exclusive create; one run at a time</text>
  <path d="M210 280 L 210 302" class="arrow"/>
  <path d="M362 252 L 470 252" class="halt"/>
  <rect x="476" y="226" width="250" height="52" rx="6" class="stop"/>
  <text x="492" y="248" class="t">already held → stop</text>
  <text x="492" y="267" class="s">exit 75, and do nothing at all</text>

  <rect x="60" y="304" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="326" class="t">load the state</text>
  <text x="76" y="345" class="s">what has already been processed</text>
  <path d="M210 358 L 210 380" class="arrow"/>
  <path d="M362 330 L 470 330" class="halt"/>
  <rect x="476" y="304" width="250" height="52" rx="6" class="stop"/>
  <text x="492" y="326" class="t">unreadable → stop</text>
  <text x="492" y="345" class="s">exit 1; never overwrite it</text>

  <!-- per item loop -->
  <rect x="46" y="382" width="700" height="238" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="66" y="408" class="b">for each item</text>

  <rect x="60" y="420" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="442" class="t">fetch it, with a timeout</text>
  <text x="76" y="461" class="s">always a timeout — a hang is invisible</text>
  <path d="M210 474 L 210 496" class="arrow"/>

  <rect x="60" y="498" width="300" height="52" rx="6" class="warn"/>
  <text x="76" y="520" class="t">transient failure? retry</text>
  <text x="76" y="539" class="s">bounded, backing off: 0.5s, 1s, 2s</text>
  <path d="M210 552 L 210 574" class="arrow"/>
  <path d="M362 524 L 470 524" class="side"/>
  <rect x="476" y="470" width="250" height="52" rx="6" class="stop"/>
  <text x="492" y="492" class="t">permanent? do not retry</text>
  <text x="492" y="511" class="s">a 404 will be a 404 forever</text>
  <path d="M600 524 L 600 552" class="side"/>
  <rect x="476" y="554" width="250" height="52" rx="6" class="warn"/>
  <text x="492" y="576" class="a">SKIP and REPORT</text>
  <text x="492" y="595" class="s">the other items still run</text>

  <rect x="60" y="576" width="300" height="36" rx="6" class="good"/>
  <text x="76" y="600" class="t">validate the payload, select what is new</text>

  <path d="M210 622 L 210 648" class="arrow"/>

  <rect x="60" y="650" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="672" class="t">write the state atomically</text>
  <text x="76" y="691" class="s">temp file in the same directory, then replace</text>
  <path d="M362 676 L 470 676" class="side"/>
  <rect x="476" y="650" width="250" height="52" rx="6" class="box"/>
  <text x="492" y="672" class="t">dry run? skip the write</text>
  <text x="492" y="691" class="s">still say what would have changed</text>
  <path d="M210 704 L 210 726" class="arrow"/>

  <rect x="60" y="728" width="300" height="52" rx="6" class="step"/>
  <text x="76" y="750" class="t">emit the run summary</text>
  <text x="76" y="769" class="s">counts, every failure named, timestamp</text>
  <path d="M210 782 L 210 804" class="arrow"/>

  <rect x="60" y="806" width="300" height="66" rx="6" class="good"/>
  <text x="76" y="828" class="a">set the exit code</text>
  <text x="76" y="848" class="s">0 all worked · 2 partial · 1 nothing worked</text>
  <text x="76" y="866" class="s">partial success is the normal case — say so</text>

  <!-- watchdog band -->
  <rect x="760" y="70" width="290" height="540" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="780" y="100" class="b">the watchdog</text>
  <text x="780" y="124" class="s">a second, much simpler job,</text>
  <text x="780" y="142" class="s">on its own schedule</text>

  <rect x="778" y="162" width="254" height="76" rx="6" class="box"/>
  <text x="792" y="184" class="t">read last-success</text>
  <text x="792" y="204" class="s">from the state file the run</text>
  <text x="792" y="222" class="s">above wrote</text>

  <rect x="778" y="254" width="254" height="76" rx="6" class="good"/>
  <text x="792" y="276" class="t">recent enough?</text>
  <text x="792" y="296" class="s">exit 0 and stay quiet</text>
  <text x="792" y="314" class="s">no news is good news</text>

  <rect x="778" y="346" width="254" height="96" rx="6" class="stop"/>
  <text x="792" y="368" class="a">too old, or never?</text>
  <text x="792" y="390" class="s">exit non-zero and shout</text>
  <text x="792" y="410" class="s">this is the failure nothing</text>
  <text x="792" y="428" class="s">else can see</text>

  <text x="778" y="472" class="s">The supervisor tells you a run</text>
  <text x="778" y="492" class="s">FAILED. Nothing tells you a run</text>
  <text x="778" y="512" class="s">never HAPPENED — the plist was</text>
  <text x="778" y="532" class="s">unloaded, the laptop was shut,</text>
  <text x="778" y="552" class="s">the crontab went with the machine.</text>
  <text x="778" y="580" class="s">Alert on silence, not only on error.</text>

  <path d="M370 750 L 400 750 L 400 200 L 774 200" class="arrow"/>
</svg>
