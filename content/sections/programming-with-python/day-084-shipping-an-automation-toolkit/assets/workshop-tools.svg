<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Organised or not.">
  <title>A workshop</title>
  <style>
    .workshop-tools-bg   { fill: #f8fafc; }
    .workshop-tools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-tools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-tools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-tools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-tools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .workshop-tools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workshop-tools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .workshop-tools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .workshop-tools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .workshop-tools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .workshop-tools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .workshop-tools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .workshop-tools-row { opacity: 1; }
    .workshop-tools-r0 { animation-delay: 0.00s; }
    .workshop-tools-r1 { animation-delay: 0.45s; }
    .workshop-tools-r2 { animation-delay: 0.90s; }
    .workshop-tools-r3 { animation-delay: 1.35s; }
    .workshop-tools-r4 { animation-delay: 1.80s; }
    .workshop-tools-row { animation: workshop-tools-reveal 7.3s ease-in-out infinite; }
    @keyframes workshop-tools-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="workshop-tools-bg" width="980" height="390"/>
  <text class="workshop-tools-h1"  x="30" y="40">A workshop</text>
  <text class="workshop-tools-sub" x="30" y="64">Organised or not.</text>
  <rect class="workshop-tools-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="workshop-tools-name" x="46" y="122">Organised</text>
  <text class="workshop-tools-desc" x="46" y="142">Found in seconds.</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r0" x="46" y="182">Tools in one rack, labelled</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r1" x="46" y="216">Consistent handles and fittings</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r2" x="46" y="250">A newcomer finds what they need</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r3" x="46" y="284">Missing tools are obvious</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r4" x="46" y="318">This is a toolkit</text>
  <rect class="workshop-tools-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="workshop-tools-name" x="526" y="122">Scattered</text>
  <text class="workshop-tools-desc" x="526" y="142">Searched for.</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r0" x="526" y="182">Tools in drawers, on benches, in bags</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r1" x="526" y="216">Each one different to hold</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r2" x="526" y="250">A newcomer asks every time</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r3" x="526" y="284">Nobody notices a missing one</text>
  <text class="workshop-tools-desc workshop-tools-row workshop-tools-r4" x="526" y="318">This is a folder of scripts</text>
  <text class="workshop-tools-sub" x="30" y="372">A newcomer finding what they need is the practical test, and it is the difference between a toolkit that outlives its author and one that does not.</text>
</svg>
