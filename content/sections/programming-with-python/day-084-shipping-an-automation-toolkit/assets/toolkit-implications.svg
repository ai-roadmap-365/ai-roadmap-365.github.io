<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are obligations.">
  <title>Four consequences of shipping a toolkit</title>
  <style>
    .toolkit-implications-bg   { fill: #f8fafc; }
    .toolkit-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolkit-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .toolkit-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .toolkit-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .toolkit-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .toolkit-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .toolkit-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .toolkit-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .toolkit-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .toolkit-implications-stage { opacity: 1; }

    .toolkit-implications-s0 { animation-delay: 0.00s; }
    .toolkit-implications-e0 { animation-delay: 0.00s; }
    .toolkit-implications-s1 { animation-delay: 1.28s; }
    .toolkit-implications-e1 { animation-delay: 1.28s; }
    .toolkit-implications-s2 { animation-delay: 2.56s; }
    .toolkit-implications-e2 { animation-delay: 2.56s; }
    .toolkit-implications-s3 { animation-delay: 3.84s; }
    .toolkit-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .toolkit-implications-conn  { animation: toolkit-implications-trace 6.4s ease-in-out infinite; }
      .toolkit-implications-stage { animation: toolkit-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes toolkit-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes toolkit-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .toolkit-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .toolkit-implications-stage { animation: toolkit-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes toolkit-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="toolkit-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="toolkit-implications-bg" width="980" height="322"/>
  <text class="toolkit-implications-h1"  x="30" y="40">Four consequences of shipping a toolkit</text>
  <text class="toolkit-implications-sub" x="30" y="64">Two are obligations.</text>
  <g class="toolkit-implications-stage toolkit-implications-s0">
    <rect class="toolkit-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-implications-step" x="44" y="142">01</text>
    <text class="toolkit-implications-name" x="70" y="142">Repeated work becomes one command</text>
    <text class="toolkit-implications-desc" x="44" y="166">Which is the leverage.</text>
  </g>
  <line class="toolkit-implications-line toolkit-implications-conn toolkit-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#toolkit-implications-tip)"/>
  <g class="toolkit-implications-stage toolkit-implications-s1">
    <rect class="toolkit-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-implications-step" x="280" y="142">02</text>
    <text class="toolkit-implications-name" x="306" y="142">But colleagues start depending on it</text>
    <text class="toolkit-implications-desc" x="280" y="166">So its interface is now a</text>
    <text class="toolkit-implications-desc" x="280" y="182">promise.</text>
  </g>
  <line class="toolkit-implications-line toolkit-implications-conn toolkit-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#toolkit-implications-tip)"/>
  <g class="toolkit-implications-stage toolkit-implications-s2">
    <rect class="toolkit-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-implications-step" x="516" y="142">03</text>
    <text class="toolkit-implications-name" x="542" y="142">And it often runs with real credentials</text>
    <text class="toolkit-implications-desc" x="516" y="166">So least privilege and audit</text>
    <text class="toolkit-implications-desc" x="516" y="182">logging matter.</text>
  </g>
  <line class="toolkit-implications-line toolkit-implications-conn toolkit-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#toolkit-implications-tip)"/>
  <g class="toolkit-implications-stage toolkit-implications-s3">
    <rect class="toolkit-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="toolkit-implications-step" x="752" y="142">04</text>
    <text class="toolkit-implications-name" x="778" y="142">While it needs maintaining as things change</text>
    <text class="toolkit-implications-desc" x="752" y="166">Which someone must own.</text>
  </g>
  <text class="toolkit-implications-sub" x="30" y="304">Ownership is the part that gets left implicit, and an unowned internal tool that everyone depends on is a failure waiting for a quiet week.</text>
</svg>
