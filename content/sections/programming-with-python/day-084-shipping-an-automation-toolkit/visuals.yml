visuals:
  - id: toolkit-architecture
    file: assets/toolkit-architecture.svg
    type: diagram
    title: 'One installed package: a pure core, adapters at the edges, configuration in, logs and state out'
    alt: 'Diagram: the architecture of an installed automation toolkit — a pure core surrounded by adapters for HTTP, the filesystem and the clock, with two console entry points on one side and a scheduled invocation on the other, configuration flowing in by precedence from defaults, file, environment and flags, the secret arriving only from the environment, and structured logs, the state file and a run summary flowing out'
    description: 'An architecture diagram in three columns. On the left, configuration enters as four stacked layers, weakest first: defaults in the code so the tool runs with no setup, a configuration file holding this machine''s preferences, the environment holding deployment facts, and command-line flags for this run only, marked as strongest. Below them a separate highlighted panel marks the secret as arriving from the environment only, never from a file or a flag. Beneath that, two kinds of caller point into the package: a person at a terminal running the fetch, report and status subcommands, and a scheduler — cron, launchd or a systemd timer — running the scheduled entry point. The centre column is the installed package, noting that an editable install produces two console scripts. Inside it, an entry-points band sits above a grey ring labelled adapters, the only impure code, holding three boxes: HTTP with its timeout, retry and backoff; the filesystem with the atomic write and the run lock; and the clock, covering both the current time and sleeping. Dashed lines connect all three inward to a heavily outlined pure core listing its responsibilities — select what is new, validate the payload, merge the state, summarise the run, decide the exit code — under a note that the core touches no network, no clock and no disk, so the interesting decisions are testable with plain data. On the right, four outputs: structured logs on stdout as one JSON object per line carrying the run id, the item and the level with secrets redacted on the way out; the state file recording what has already been done, written whole or not at all; the run summary with its counts, named failures and last-success timestamp; and the exit code with its four values, zero for success, two for partial, one for total failure and three for a run already in progress. Two closing notes record that the supervisor captures stdout and reads the exit code so the program never handles log files or rotation, and that a separate watchdog reads the last-success timestamp because the failure a supervisor cannot see is the run that never happened.'
  - id: automation-run-flow
    file: assets/automation-run-flow.svg
    type: flowchart
    title: 'One unattended run, from the schedule firing to the exit code'
    alt: 'Flowchart: one unattended run end to end — triggered by the scheduler, configuration resolved, lock acquired, state loaded, each item fetched with retry, skip and stop branches, transform, atomic state write, run summary emitted and exit code set, with the partial-success path shown separately and a watchdog path that notices a run which never happened'
    description: 'A flowchart following one unattended run down the left, with failure branches to the right and a watchdog band on the far right. The run begins with the schedule firing, noted as happening when nobody is watching and with an almost empty PATH, then resolves configuration through default, file, environment and flag in that order, then acquires the lock. Two red branches leave the main line early: a lock already held stops the run with exit 75 and does nothing at all, and an unreadable state file stops with exit 1 and never overwrites it. Inside a shaded per-item band, each item is fetched with a timeout — annotated that a hang is invisible where a failure is not — then a transient failure is retried, bounded and backing off through half a second, one second and two seconds, while a permanent failure such as a 404 branches away without retrying and joins a skip-and-report box noting that the other items still run. Successful items are validated and filtered down to what is new. The main line then writes the state atomically, described as a temporary file in the same directory followed by a replace, with a side branch showing that a dry run skips the write while still saying what would have changed. Then the run summary is emitted with counts, every failure named and a timestamp, and finally the exit code is set: zero when everything worked, three for partial success, one when nothing worked, with a note that partial success is the normal case and must be said out loud. The watchdog band on the right runs on its own schedule: it reads the last-success timestamp from the state file the run wrote, exits zero and stays quiet when it is recent enough, and exits non-zero and shouts when it is too old or has never been set. A closing note explains that a supervisor can report a run that failed but never a run that never happened — because the plist was unloaded, the laptop was shut, or the crontab went with the machine — so the rule is to alert on silence, not only on error.'
