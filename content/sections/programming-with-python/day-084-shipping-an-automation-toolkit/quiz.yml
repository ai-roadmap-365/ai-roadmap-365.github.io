questions:
  - question: 'A nightly batch job processes forty items. Three fail; the other thirty-seven succeed and are saved. What exit code should it return, and why?'
    options:
      - '0, because the run completed and the failures are recorded in the log'
      - '1, because any failure means the run did not do what it was asked to do'
      - 'A distinct code such as 3 — partial success is neither'
      - 'Whatever code the first failing item produced, so the cause is visible'
    answer_index: 2
    explanation: 'Partial success is the normal case for a batch job, not an exception, and collapsing it into either success or failure throws away the only information that would tell you something is degrading. Returning 0 is the most consequential mistake in the lesson: the scheduler, the watchdog and you all believe everything is fine, potentially for months. Returning 1 is nearly as bad in the other direction — it hides that thirty-seven items were genuinely processed, and it trains you to ignore the alert. A distinct code lets the owner decide whether three out of forty matters, and the log is where the detail lives; the exit code is what the machine can act on.'

  - question: 'Your fetcher receives HTTP 404 for one item. What should it do?'
    options:
      - 'Retry with exponential backoff, like any other failure'
      - 'Retry once immediately, then skip if it fails again'
      - 'Stop the entire run, because a missing item means the configuration is wrong'
      - 'Skip it, record the failure, and continue — a 404 will not change'
    answer_index: 3
    explanation: 'The retry decision is about WHAT went wrong, not about how annoying it is. A 503 is the server saying "not now" and is worth another attempt; a 404 and a 401 are statements that will be just as true in three seconds, so retrying them wastes your time and adds noise to somebody else''s server logs. Skipping and reporting keeps the other items working — the naive loop that stops at the first exception means one broken source costs you every good one. Stopping everything is reserved for failures where continuing would mean guessing about something fundamental: an invalid configuration, an unreadable state file, or a lock held by another run.'

  - question: 'Why must the temporary file in an atomic state write live in the same directory as the file it will replace?'
    options:
      - 'os.replace is only atomic within one filesystem'
      - 'So that the two files sort next to each other and are easier to find when debugging'
      - 'Because Python refuses to move files between directories'
      - 'So the temporary file inherits the target file''s permissions'
    answer_index: 0
    explanation: 'os.replace is atomic within a single filesystem: any reader sees either the complete old file or the complete new one, never a mixture. Across filesystems the operation silently degrades to a copy followed by a delete, which is not atomic at all and can leave a half-written file — and nothing warns you, which is what makes this mistake so durable. Writing to /tmp and replacing into your home directory is the usual way it happens. The full recipe is: temporary file in the same directory, write, flush, fsync, then os.replace, cleaning up on any BaseException so a Ctrl-C does not leave debris.'

  - question: 'An argparse-based tool merges configuration from defaults, a file, the environment and flags. What goes wrong if the merge does not filter out flags whose value is None?'
    options:
      - 'The program crashes on startup with a TypeError'
      - 'Unpassed options overwrite the file with nothing'
      - 'The environment layer is skipped entirely'
      - 'Flags are applied twice, doubling numeric settings'
    answer_index: 1
    explanation: 'argparse leaves every unsupplied option as None. If None is treated as a value rather than as "this layer has no opinion", the flag layer overwrites everything beneath it for every option the user did not type — which is nearly all of them. The failure is invisible because the program still works: it just quietly runs on defaults while your carefully written configuration file does nothing. This is the single most common bug in hand-rolled configuration, and the fix is one filter expression applied before the merge.'

  - question: 'Your scheduled job has an error alert wired up: any run that fails sends you a message. What failure can this arrangement never detect?'
    options:
      - 'A run that fails on every single item'
      - 'A run that succeeded but collected nothing new'
      - 'A run that never happened at all'
      - 'A run that took longer than its interval'
    answer_index: 2
    explanation: 'Every supervisor can tell you a run failed, because a failure is an event. None of them can tell you a run was never triggered, because from the supervisor''s point of view nothing happened and nothing produces no event. The absence of bad news is not good news. The only way to detect it is to check, from somewhere else, that something did happen recently — which is what a last-success timestamp plus a watchdog on its own schedule does. The watchdog must not live inside the job it watches: one that shares a fate with the thing it is checking has told you nothing.'

  - question: 'Why is an access token read from an environment variable rather than from a command-line flag?'
    options:
      - 'Environment variables are encrypted by the operating system'
      - 'argparse cannot handle long string arguments reliably'
      - 'Flags are evaluated before the configuration file, which would break precedence'
      - 'A flag lands in shell history and in ps output'
    answer_index: 3
    explanation: 'Environment variables are not encrypted; the argument is about exposure, not cryptography. A credential passed as a flag is written into your shell history and is visible in the process table to anyone who can run ps on that machine. The other rejected option — a configuration file — leaks differently: it ends up in version control on the day somebody stages everything at once, and once a secret is in a repository''s history it is in every clone, fork and backup. The environment is also where every deployment mechanism already puts secrets, so the program needs to know about none of them.'

  - question: 'What must a --dry-run still do, if it is to be worth having?'
    options:
      - 'Everything but the writes, reporting what would change'
      - 'Write to a copy of the state file so the difference can be inspected afterwards'
      - 'Nothing at all beyond printing the command it would have run'
      - 'Skip the network entirely, so it is fast enough to run before every real invocation'
    answer_index: 0
    explanation: 'A dry run that skips the work tells you nothing, because the work is where the surprises are — the source that has changed shape, the item that now fails, the credential that has expired. The value of the mode is that it answers "what would you do to this real state, right now?" without doing it. That is also why a dry run is not a test: a test checks behaviour against fixtures, while a dry run reports on this invocation against the actual world. The right way to verify one is to hash the state file before and after and require the same hash.'

  - question: 'You spend fifteen minutes a week on a manual task and estimate five hours to automate it. What is missing from the naive twenty-week payback calculation?'
    options:
      - 'Nothing — twenty weeks is the correct break-even point'
      - 'The recurring maintenance cost, which arrives after the benefit'
      - 'Only the time spent learning the tools, which is a one-off cost'
      - 'The cost of the hosting, which every automation requires'
    answer_index: 1
    explanation: 'Maintenance is the term the naive calculation always omits, and it is the one that decides most of these questions. Sources change format, credentials expire, dependencies release breaking versions, machines get replaced and schedules do not come with them — none large, all unannounced, and each costing the context switch as well as the fix. Two adjustments then usually dominate: revise upward when the task is error-prone, must happen on a schedule you will not keep, or is one you avoid doing; revise downward when it is rare, needs a judgement you would encode badly, or the source is unstable enough that you will fix the automation more often than you would have done the task. And before any of that, ask whether the task needs doing at all.'
