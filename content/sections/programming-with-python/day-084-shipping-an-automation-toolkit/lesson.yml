id: D084
day: 84
slug: shipping-an-automation-toolkit
title: 'Shipping an Automation Toolkit'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to assemble a week of separate techniques — HTTP, responsible collection, argparse, scheduling, a service, and packaging — into one installable, configurable, observable automation that is safe to run twice: a pure core with every boundary pushed to the edges, configuration resolved through defaults, file, environment and flags, secrets read only from the environment and redacted on the way out, structured logs that name which run and which item, a failure policy that retries what is transient, skips and reports what is not, and stops for what makes continuing meaningless, an atomically written state file, a first-class dry run, and a watchdog that alerts on silence rather than only on error — plus the judgement to decide whether the automation was worth building at all.'
objectives:
  - 'Define what "shipping" means for a personal tool — installable, configurable, observable, and safe to run twice — and name the specific failure each property prevents'
  - 'Lay out a toolkit as one package with several commands over a shared pure core, pushing the network, the clock, the filesystem and subprocesses to the edges so the interesting decisions are testable without any of them'
  - 'Resolve configuration through four layers in a written-down order, filter unsupplied flags so they do not silently override a file, record the provenance of every setting, and place a configuration file where a user expects to find it'
  - 'Read secrets from the environment and nowhere else, justify rejecting both a configuration file and a command-line flag, redact credentials on the way out of the logger, and state the correct order of operations when a token leaks'
  - 'Emit structured logs on stdout with a run id and per-item context, choose the right level for each kind of event, and explain why letting the supervisor capture stdout is usually right'
  - 'Classify every failure as retry, skip-and-report, or stop-everything, and give partial success its own exit code rather than reporting 0 and hoping'
  - 'Make a job idempotent with a durable state file, write that file atomically so an interruption leaves the previous state intact, and prevent overlapping runs with an exclusive lock'
  - 'Treat a dry run as a first-class feature of anything that mutates the world, and explain why a dry run that skips the work tells you nothing'
  - 'Build the observability a personal tool actually needs — a run summary, a last-success timestamp, and a watchdog on a separate schedule that alerts on silence'
  - 'Package the toolkit with console entry points, write a schedule entry for cron, launchd or systemd, and name the three reasons a scheduled job that works by hand does nothing on a schedule'
  - 'Compare the ways people ship small automations — a script plus cron, a packaged CLI with pipx, a long-running service, a Makefile, a container image, and hosted platforms — and choose the simplest one that meets the need'
  - 'Judge whether to automate at all using arithmetic that includes maintenance, write a runbook somebody else can recover from, and recognise when the right move is to delete the automation'
prerequisites:
  - 'Days 78-83 of this course: HTTP with requests, responsible collection, argparse CLIs, scheduling and background jobs, a FastAPI service, and packaging with console entry points — this lesson assembles them and re-teaches none of them'
  - 'Week 11 (Days 71-77): pytest, fixtures, testing at boundaries, and the discipline of one command returning one exit code'
  - 'Days 64-66: reading and writing files, JSON, and an exception-handling strategy — the state file and its atomic write build directly on all three'
  - 'Day 69 (type hints), Day 70 (modelling a domain with objects), and Day 43 (virtual environments)'
  - 'Comfort running a bash script, editing a TOML file, and reading a crontab line'
reading_time_minutes: 40
