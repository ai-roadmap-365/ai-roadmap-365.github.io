terms:
  - term: 'Automation'
    definition: 'Something that runs unattended, on a schedule, when nobody is watching — as opposed to a script, which is something you run and observe. The difference is not size or sophistication: it is that everything an automation will ever be able to tell you must already have been designed into it before it ran.'
  - term: 'Toolkit'
    definition: 'One installed package providing several related commands over a shared core, configured from outside the code, with a durable record of what it has already done. The step up from a script that most personal automations should take once a second command needs to share logic with the first.'
  - term: 'Entry point'
    definition: 'A name declared under [project.scripts] in pyproject.toml that becomes a command on your PATH when the package is installed. It matters for automation because a command name survives you reorganising your directories, while the absolute path in a schedule entry does not.'
  - term: 'Configuration precedence'
    definition: 'The written-down order in which layers of settings override each other: defaults in the code, then a configuration file, then the environment, then command-line flags. Every program has one; the difference between a good tool and a confusing one is whether anybody can say what it is without reading the source.'
  - term: 'Provenance'
    definition: 'A record of which configuration layer supplied each setting, printable on demand. It turns "why is it doing that?" from an afternoon of reading code into a five-second question, and it is the part of a configuration system almost nobody builds.'
  - term: 'Secret'
    definition: 'A credential — a token, a password, a key. It is read from the environment and from nowhere else, because a command-line flag lands in your shell history and in ps output while a configuration file lands in version control. When one leaks, revoke it first and clean up second; a rewritten repository history does not un-publish anything already cloned.'
  - term: 'Structured logging'
    definition: 'Writing log records as data with named fields rather than as lines of prose — in practice, one JSON object per line. The idea descends from syslog, written by Eric Allman in the 1980s: a record has a severity, a timestamp and fields, so it can be filtered by run and by item months later.'
  - term: 'Log level'
    definition: 'The severity attached to a record, deciding what is shown and what is stored. Debug reconstructs one specific run; info records the beginning, the per-item outcomes and the end of every run; warning marks a retry or a skipped item; error marks an item that failed after every attempt; critical marks a run that cannot continue at all.'
  - term: 'Run id'
    definition: 'A short random label generated once per run and stamped on every log line and on the state record for that run. It is what lets you pull the lines belonging to one 03:00 run out of a month of output. Generating a different one in the logger and in the state file is a small bug that doubles the time an investigation takes.'
  - term: 'Idempotence'
    definition: 'The property that running an operation again does not change the outcome. The term comes from mathematics, coined by Benjamin Peirce in 1870. For a scheduled job it is the single most valuable property there is: it makes catch-up after downtime, manual re-runs during debugging, and overlapping runs into ordinary events rather than data-integrity incidents.'
  - term: 'State file'
    definition: 'The durable record of what an automation has already processed, read at the start of every run and written at the end. It is what makes idempotence possible, which makes it the most valuable file the tool owns: losing a cache costs time, while losing state costs correctness, because the next run cannot tell what it has already done.'
  - term: 'Atomic write'
    definition: 'Writing a whole new file to a temporary name in the same directory, flushing and fsyncing it, then replacing the old name with os.replace — so any reader sees either the complete old file or the complete new one, never a mixture. The naive alternative truncates the real file first, so one interruption destroys the record of everything ever processed.'
  - term: 'Lock file'
    definition: 'A file created with the O_CREAT and O_EXCL flags, which the operating system guarantees will succeed for exactly one caller, used to stop two runs of the same job overlapping. It holds the process id so a human can distinguish a live run from a lock left behind by a crash. It is reliable on one machine and one local filesystem, and it is not a distributed lock.'
  - term: 'Backoff'
    definition: 'Waiting longer before each successive retry, usually by doubling. Described by Robert Metcalfe and David Boggs in their 1976 Ethernet paper as the way stations recover from a collision without colliding again in lockstep — the same reason a hundred clients that all retry after exactly one second will all collide again after exactly one second.'
  - term: 'Partial success'
    definition: 'A run in which some items succeeded and some failed. It is the normal case for a batch job rather than an exception, and it needs its own exit code: returning 0 because most of it worked is the most common way an automation lies to the person who owns it, and the lie can go undetected for months.'
  - term: 'Exit code'
    definition: 'The number a process returns when it finishes: zero for success, anything else for a specific kind of failure. It is the machine-readable half of a run — the scheduler, the watchdog and any wrapping script read it and nothing else, so the vocabulary you choose for it is a real interface.'
  - term: 'Dry run'
    definition: 'A mode that does everything a real run does except the writes, and reports exactly what would have changed. It must still fetch, validate and compute, because the work is where the surprises are; a dry run that skips the work tells you nothing. It is not a test: a test checks behaviour against fixtures, while a dry run reports on this invocation against the actual world.'
  - term: 'Run summary'
    definition: 'A few lines printed at the end of every run: how many items succeeded, how many failed, how many were new, and every failure named with its cause. It is what a human reads in three seconds, as opposed to the log, which is what a human reads when something has gone wrong.'
  - term: 'Watchdog'
    definition: 'A second, much simpler scheduled check that reads the last-success timestamp and raises the alarm when it is too old — including when there has never been one. It catches the failure nothing else can: the run that never happened, which produces no event for any supervisor to report. It must run on its own schedule, because a watchdog that shares a fate with the thing it watches is not a watchdog.'
  - term: 'Adapter'
    definition: 'A small module wrapping one boundary — the network, the clock, the filesystem, a subprocess — so that everything inside it can be pure and testable. Injecting adapters rather than importing them is Day 74''s rule applied to a whole program; injecting the sleep function alongside them is what lets a test exercise three retries in microseconds.'
  - term: 'Runbook'
    definition: 'One page that lets somebody who is not you operate and fix the job: what it does and who would notice if it stopped, when and where it runs, what each exit code means, what to check first when it fails, how to run it by hand including the dry run, and how to turn it off. The test is not whether it is complete but whether somebody else can recover from a failure using only that page.'
  - term: 'Toil'
    definition: 'Repetitive manual operational work that produces no lasting value and grows with the size of what you run. The term was popularised by Google''s Site Reliability Engineering (2016). It is the thing automation is meant to remove — and the reason to check, before automating, that the task needs doing at all rather than merely needing doing faster.'
