terms:
  - term: 'Predicate'
    definition: 'An expression that evaluates to TRUE, FALSE or UNKNOWN — the thing a WHERE or HAVING clause tests. The rule that catches everyone is that these clauses keep a row or a group only when the predicate is TRUE, so UNKNOWN is discarded exactly like FALSE and nothing anywhere records that it happened.'
  - term: 'Projection'
    definition: 'What the SELECT list does: choosing which columns and computed values come out of the query. It is stage five of the evaluation, which is why an alias created in the projection is unavailable to WHERE, and why DISTINCT — which runs after it — de-duplicates the projected rows rather than the underlying ones.'
  - term: 'Logical evaluation order'
    definition: 'The order the engine conceptually runs the clauses: FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT and OFFSET. It is deliberately not the order you write them, and almost every confusing rule in SQL is a consequence of the gap. A query optimiser may reorder the physical work, but it must produce the result this order describes.'
  - term: 'Three-valued logic'
    definition: 'SQL has TRUE, FALSE and UNKNOWN rather than two truth values, because any comparison involving NULL yields UNKNOWN. It is not arbitrary: an expression gets a definite answer exactly when that answer would hold for every value the missing operand could have. So NULL AND 0 is FALSE and NULL OR 1 is TRUE, while NULL AND 1, NULL OR 0 and NOT NULL are all UNKNOWN.'
  - term: 'NULL'
    definition: 'A marker meaning there is no value here — not zero, not the empty string, not False. Two absences are not equal to each other because there is nothing to compare, which is why NULL = NULL is UNKNOWN and IS NULL is the only test for absence. Codd introduced it into the relational model; C. J. Date argued for decades that it was a mistake. The argument was never settled, and the traps you meet are the faithful behaviour of that unresolved design decision.'
  - term: 'Aggregate function'
    definition: 'A function that takes many rows and returns one value: COUNT, SUM, AVG, MIN, MAX, and SQLite''s TOTAL. Every one of them except COUNT(*) removes NULL inputs before doing any arithmetic — they are not treated as zero, they are removed. An aggregate is illegal in WHERE because WHERE runs before there is anything to aggregate, and an aggregate over zero rows still returns exactly one row.'
  - term: 'Scalar function'
    definition: 'A function that takes one row''s values and returns one value: UPPER, LENGTH, SUBSTR, ROUND, ABS, COALESCE, STRFTIME and the rest. Run it over 24 rows and you get 24 answers, which is why it is legal anywhere an expression is legal, including WHERE. Applied to NULL it almost always returns NULL, and that NULL then propagates through everything downstream.'
  - term: 'Grouping key'
    definition: 'The column or expression named in GROUP BY, whose distinct values decide the buckets. After grouping, the only things you may legitimately ask for are the grouping key itself and aggregates over the bucket, because a bucket of seven books has no single title to give you. GROUP BY is also the one place in SQL where all the NULLs are treated as equal and land in a single bucket — which is why grouping a column can produce one more bucket than COUNT(DISTINCT) on the same column reports.'
  - term: 'HAVING'
    definition: 'The clause that filters groups, using the same TRUE-only rule as WHERE but applied to buckets rather than rows. It exists because there is no other stage that runs after the buckets are built and before the output is projected, and because a fact like "this author has more than three titles" belongs to no individual row. It is not a second WHERE: when a condition really is about one row, put it in WHERE, which runs earlier and does less work.'
  - term: 'DISTINCT'
    definition: 'Removes duplicate output ROWS, not duplicate values in one column. SELECT DISTINCT author gives one row per author; SELECT DISTINCT author, genre gives one row per distinct pair, so adding a column to a DISTINCT query can only increase the number of rows returned. It runs after SELECT, which is why it de-duplicates the projection.'
  - term: 'Alias'
    definition: 'A name given to a column or expression with AS. It is created at the SELECT stage and not before, which is exactly why ORDER BY may use one — it runs later — while standard SQL forbids it in WHERE, which runs earlier. SQLite accepts an alias in WHERE anyway, as a documented extension; PostgreSQL rejects it, so portable code repeats the expression or wraps the query.'
  - term: 'Collation'
    definition: 'The rule deciding how text values compare and sort — whether case matters, how accents are handled, what order the characters take. SQLite''s default BINARY collation compares byte by byte, and its NOCASE collation folds only the 26 ASCII letters. This is why LIKE''s case-insensitivity does not extend to accented or non-Latin text, and why the same query can sort differently on MySQL, where case sensitivity is a property of the column''s collation rather than of the operator.'
  - term: 'Offset'
    definition: 'The number of rows LIMIT skips before it starts returning any. Its cost is proportional to its size, because the engine must produce and discard every skipped row in order — so page 5,000 costs five thousand times what page 1 cost. Fine for the first few pages of a user interface, hopeless for walking a large table; the alternative is keyset pagination, which remembers the last key seen and asks for what comes after it.'
  - term: 'Keyset pagination'
    definition: 'Paging by remembering the last key you saw and asking for what comes after it — WHERE id > :last_id ORDER BY id LIMIT 20 — instead of counting rows to skip. Every page costs the same, because an index can jump straight to the starting point rather than walking to it. It is the standard fix for OFFSET on any table large enough for the problem to matter.'
  - term: 'Cardinality'
    definition: 'How many rows there are, or how many distinct values a column holds. It is the quantity every stage of a SELECT changes or preserves: WHERE and HAVING can only reduce it, GROUP BY replaces a row count with a bucket count, SELECT never changes it, ORDER BY never changes it, and LIMIT truncates it. Low cardinality — few distinct values — is also what makes a column a good grouping key and a poor index.'
  - term: 'Bare column'
    definition: 'A column in the SELECT list of an aggregate query that is neither a grouping key nor inside an aggregate. There is no principled value for it, because the bucket holds many rows. PostgreSQL rejects such a query outright; SQLite picks an arbitrary row from the bucket and returns its value, with one documented meaningful exception alongside MIN or MAX. Outside that exception, treat a bare column as a bug that happens to run.'
  - term: 'COALESCE'
    definition: 'A function returning its first non-NULL argument; IFNULL is the two-argument form and NULLIF is the inverse, turning a sentinel value back into NULL. All three are legitimate for display. The hazard is arithmetic: AVG already ignores NULLs, so AVG(COALESCE(rating, 0)) does not handle the missing ratings — it invents ratings of zero and mixes them in, which in this lesson''s data moves the answer from 4.16 to 3.47 without a word of warning.'
