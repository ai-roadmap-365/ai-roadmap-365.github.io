slug: select-filtering-sorting-and-aggregating
title: 'SELECT: Filtering, Sorting, and Aggregating'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to read and write a full SELECT statement with the confidence that comes from knowing the order the engine actually runs it in — FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT — and to derive from that one ordering every rule that otherwise has to be memorised: why an aggregate is illegal in WHERE, why HAVING exists when WHERE already filters, and why ORDER BY may use an alias that WHERE cannot. You will filter rows with comparisons, boolean operators, IN and BETWEEN; match patterns with LIKE and GLOB knowing exactly how they differ on case; handle NULL correctly through three-valued logic, including the traps where a perfectly ordinary query silently discards the rows you most needed to see; sort on several keys and control where NULLs land; take a deterministic top-N and explain why OFFSET gets slow; tell COUNT(*) from COUNT(column) and read the gap between them as a missing-data report; group rows into buckets, including by an expression, and filter those buckets with HAVING; and build grouping and all five aggregates from scratch in plain Python so that the one line of SQL which replaces twenty lines of accumulator loop is no longer magic.'
objectives:
  - 'State the logical evaluation order of a SELECT and use it to predict which clause may refer to a stored column, an aggregate, a grouping key or a SELECT alias'
  - 'Filter rows with comparison and boolean operators, IN and BETWEEN, explaining what brackets change when AND meets OR and why BETWEEN includes both endpoints'
  - 'Choose correctly between LIKE and GLOB, naming the wildcard and case-sensitivity differences and recognising that a zero-row result from the wrong choice is silent'
  - 'Apply three-valued logic correctly: reproduce the AND, OR and NOT truth table for UNKNOWN, justify each cell without memorising it, and use IS NULL as the only test for absence'
  - 'Identify the three NULL traps — equality against NULL, negative filters and NOT IN on a nullable column, and substituting a value before deciding what the absence means — and write the honest form of each'
  - 'Sort on several keys with ASC and DESC, state where SQLite places NULLs in each direction, and force them to the other end in two ways, one of which is portable'
  - 'Take a deterministic top-N with ORDER BY and LIMIT, explain why OFFSET grows linearly more expensive, and name keyset pagination as the alternative'
  - 'Distinguish COUNT(*), COUNT(column) and COUNT(DISTINCT column), and use the gap between the first two as a one-line data-quality report'
  - 'Predict the effect of NULL on SUM, AVG, MIN and MAX, including that SUM over an empty set is NULL while TOTAL is 0.0, and that an aggregate over zero rows still returns one row'
  - 'Group rows into buckets by a column or an expression, explain why GROUP BY is the one place NULLs are treated as equal, and filter the buckets with HAVING rather than WHERE'
  - 'Implement GROUP BY and the five aggregates from scratch as a dictionary of accumulators in plain Python, and show that the result is identical to the equivalent SQL'
  - 'Compare SQLite, PostgreSQL, MySQL, DuckDB, the Python standard library and pandas for the same grouped query, naming when to choose each and where the syntax genuinely differs'
  - 'Recognise the two places SQLite is more permissive than standard SQL — a bare column in an aggregate query and a SELECT alias used in WHERE — and write the portable spelling instead'
  - 'Connect filtering and aggregation to dataset curation: class balance, per-slice evaluation, missing-data audits, and the disclosure risk in a grouped result with a small bucket'
prerequisites:
  - 'Day 85: the relational model, SQLite architecture, type affinity, CREATE TABLE, INSERT, and a first SELECT — this lesson assumes all of it and re-teaches none of it'
  - 'Days 64-66: reading and writing files, JSON, and an exception-handling strategy'
  - 'Day 61 and the collections work around it: dictionaries, and the habit of accumulating into one — the from-scratch GROUP BY is a dict of accumulators and nothing more'
  - 'Comfort running a bash script from a terminal and reading a Python for loop'
  - 'No knowledge of joins is required: every query in this lesson is over a single table'
