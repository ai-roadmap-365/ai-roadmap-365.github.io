visuals:
  - id: select-anatomy-architecture
    file: assets/select-anatomy-architecture.svg
    type: diagram
    title: 'The anatomy of a SELECT: the eight clauses in written order beside the same eight in evaluation order'
    alt: 'Diagram: the anatomy of a SELECT statement — the eight clauses in the order you type them on the left, the same eight renumbered into the order the engine evaluates them on the right, each labelled with what it contributes and what it is allowed to refer to, with the two crossing lines that carry the whole lesson picked out in red'
    description: 'A two-column architecture diagram. The left column lists the eight clauses of a SELECT in the order the grammar makes you type them, numbered one to eight in grey: SELECT (which columns and computed values come out), DISTINCT (drop duplicate output rows, not duplicate values), FROM (where the rows come from), WHERE (keep a ROW only when the predicate is TRUE), GROUP BY (collapse the surviving rows into buckets), HAVING (keep a BUCKET only when the predicate is TRUE), ORDER BY (put the finished rows into an order), and LIMIT with OFFSET (skip some, then take at most this many). The right column lists the same eight clauses renumbered one to eight in blue, in the order the engine evaluates them, each annotated with what it may refer to: FROM produces the raw rows and nothing exists before it; WHERE sees stored columns only, no aggregates and no SELECT aliases; GROUP BY is where buckets appear and individual rows stop existing; HAVING is the first stage that can see an aggregate, because now there is one; SELECT is the projection and where an alias is first created; DISTINCT de-duplicates the projected rows and so depends on the SELECT stage; ORDER BY runs after SELECT and so can use an alias, which is standard SQL on every engine; and LIMIT with OFFSET is last, meaningless without an ORDER BY because until then nothing has promised an order. Curved connectors join each clause on the left to its position on the right. Two of those connectors are drawn in red and cross each other in the middle of the picture: SELECT, typed first and evaluated fifth, and WHERE, typed fourth and evaluated second. A caption beside them reads that the two red lines are the whole lesson.'
  - id: select-evaluation-flow
    file: assets/select-evaluation-flow.svg
    type: flow-animated
    title: 'One query through the seven evaluation stages, with the real row count at every step'
    alt: 'Animated flow diagram: one query moving through the seven evaluation stages with the real row count at each step — 24 rows read by FROM, 20 surviving WHERE, collapsed into 6 buckets by GROUP BY, 3 buckets surviving HAVING, projected by SELECT, sorted unchanged by ORDER BY, and cut to 2 rows by LIMIT'
    description: 'An animated left-to-right pipeline of seven stages, carrying one real query from the lab database — SELECT genre, COUNT(*) FROM books WHERE published_year >= 2000 GROUP BY genre HAVING COUNT(*) >= 3 ORDER BY COUNT(*) DESC LIMIT 2 — with the row count printed large beneath each stage. FROM reads the table and emits 24 rows, every book. WHERE keeps the rows whose predicate is TRUE and emits 20, with a red note recording that 4 were dropped: three published too early, and one whose year is NULL and which therefore failed a test it was never really given. GROUP BY collapses those 20 rows into 6 buckets, noted as the one place where all the NULLs share a bucket. HAVING keeps the buckets whose predicate is TRUE and emits 3, with a red note that 3 were dropped for being too small. SELECT projects the 3 buckets into 3 rows of 2 columns and is annotated as the place aliases are born. ORDER BY sorts and emits 3, annotated that the count never changes. LIMIT 2 cuts the result to 2 rows. Three motions carry the animation: the seven stages light up in sequence on a seven-second loop, the arrows between them are marching dashes, and a marker labelled "the query" travels the length of the pipeline. Four closing notes draw out the shape rather than the numbers: two stages throw rows away and they are the two carrying a predicate; one stage changes what a row IS, so that after GROUP BY there are no longer 20 books but 6 buckets and no bucket has a single title to give you; SELECT changes the columns but never the count while ORDER BY changes neither, only the order; and LIMIT is last, which is why LIMIT without ORDER BY takes an arbitrary slice, because at that point nothing has promised an order at all. A prefers-reduced-motion block stops all three animations and restores the resting state, in which every stage, arrow, label and number is still shown.'
