questions:
  - question: 'In what order does a SQL engine logically evaluate the clauses of a SELECT statement?'
    options:
      - 'FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT'
      - 'SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT — the order you type them'
      - 'FROM, SELECT, WHERE, GROUP BY, ORDER BY, HAVING, LIMIT'
      - 'WHERE, FROM, GROUP BY, SELECT, HAVING, DISTINCT, LIMIT, ORDER BY'
    answer_index: 0
    explanation: 'The rows have to exist before anything can filter them, so FROM is first. WHERE filters individual rows, then GROUP BY replaces those rows with buckets, then HAVING filters the buckets — which is why HAVING is the first stage that can see an aggregate, because it is the first that runs after there is anything to aggregate. SELECT comes fifth, which is the fact that surprises people: it is written first and run fifth, and that inversion explains why an alias invented in SELECT is unavailable to WHERE but available to ORDER BY. DISTINCT operates on what SELECT projected, ORDER BY sorts the finished rows, and LIMIT takes a slice last of all — which is exactly why LIMIT without ORDER BY returns an arbitrary slice.'

  - question: 'A members table has 12 rows. Two of them have city = ''Pune'' and two have city set to NULL. What does SELECT COUNT(*) FROM members WHERE city <> ''Pune'' return?'
    options:
      - '10, because 12 minus the 2 in Pune is 10'
      - '8 — the NULL cities evaluate to UNKNOWN and are discarded'
      - '12, because <> matches everything that is not exactly the string Pune'
      - 'An error, because you cannot compare a NULL column with <>'
    answer_index: 1
    explanation: 'This is the most expensive habit in SQL and it never raises an error. NULL <> ''Pune'' is UNKNOWN, not TRUE, and WHERE keeps only rows where the predicate is TRUE — so UNKNOWN rows are discarded exactly like false ones. Two members from Pune are correctly excluded and two members who simply never told the library their city are silently excluded too, leaving 8. The number is plausible, nothing warns you, and if the column were license rather than city and the table were training data, you would have just dropped the rows you most needed to look at. The honest query is WHERE city IS NULL OR city <> ''Pune'', which returns 10.'

  - question: 'Which of these is FALSE rather than UNKNOWN?'
    options:
      - 'NULL OR 0'
      - 'NULL AND 1'
      - 'NULL AND 0'
      - 'NOT NULL'
    answer_index: 2
    explanation: 'Three-valued logic is not arbitrary: an expression gets a definite answer whenever that answer would be the same for every value the missing operand could turn out to have. FALSE AND anything is FALSE, so NULL AND 0 is FALSE without needing to know the missing value. By the mirror argument NULL OR 1 is TRUE. But NULL AND 1 depends entirely on the unknown operand, so it is UNKNOWN; NULL OR 0 likewise; and NOT NULL is UNKNOWN because the opposite of "I do not know" is still "I do not know". That last one is why negating a comparison does not rescue you from the trap in the previous question.'

  - question: 'Why is SELECT author, COUNT(*) FROM books WHERE COUNT(*) > 3 GROUP BY author rejected with "misuse of aggregate: COUNT()"?'
    options:
      - 'COUNT(*) may only appear in the SELECT list, never in a filter'
      - 'The GROUP BY has to be written before the WHERE for the count to be in scope'
      - 'COUNT(*) needs a column argument when it is used as a condition'
      - 'WHERE runs before groups exist, so COUNT has nothing yet'
    answer_index: 3
    explanation: 'The error is the evaluation order made audible. WHERE filters individual rows, and it runs before GROUP BY has built any buckets, so at that moment there is no group whose size COUNT(*) could report — no single row knows how many titles its author wrote. The clause that filters groups is HAVING, which runs at stage 4, after the buckets exist: HAVING COUNT(*) > 3. This is also why HAVING is not redundant with WHERE. They are not two ways of writing the same filter; they filter different kinds of object at different moments, and when a condition genuinely is about a single row you should put it in WHERE, because filtering earlier means fewer rows ever have to be grouped.'

  - question: 'A books table has 24 rows; 4 of them have a NULL rating. What do COUNT(*), COUNT(rating) and AVG(rating) report?'
    options:
      - '24, 20, and the sum of 20 ratings over 20 — NULLs removed'
      - '24, 24 and the average of all 24 values with the NULLs counted as zero'
      - '20, 20, and an average over 20, because rows with any NULL are excluded from the whole query'
      - '24, 20, and NULL, because an aggregate over a column containing any NULL is undefined'
    answer_index: 0
    explanation: 'COUNT(*) counts rows unconditionally; every other aggregate — COUNT(column), SUM, AVG, MIN, MAX — removes the NULLs before it starts. So AVG divides by the non-NULL count, not by the row count, and in the lab database that is 4.16 rather than the 3.47 you get from AVG(COALESCE(rating, 0.0)). The gap between COUNT(*) and COUNT(column) is the cheapest data-quality check that exists: it IS the number of missing values. Put both in every summary you write, because an average that does not say how many values it is based on is an average you cannot act on — 4.16 over twenty ratings and 4.16 over two are very different findings.'

  - question: 'Your query ends ORDER BY rating ASC LIMIT 1 and you expect the worst-rated book. In SQLite you get a book with no rating at all. Which fix is portable to any SQL engine and any version?'
    options:
      - 'ORDER BY rating ASC NULLS LAST'
      - 'ORDER BY rating IS NULL, rating ASC'
      - 'ORDER BY COALESCE(rating, 999) ASC'
      - 'Add DISTINCT, which removes the NULL row from the projection'
    answer_index: 1
    explanation: 'SQLite sorts NULL as smaller than everything, so ascending puts the unrated books first — and a NULL is not a low rating, it is no rating. rating IS NULL is a predicate that evaluates to 0 for rows that have a value and 1 for rows that do not, so sorting on it ascending pushes all the missing ones to the end, on every engine and every version. NULLS LAST is cleaner to read but arrived in SQLite 3.30 and its placement default differs between engines — PostgreSQL already sorts NULLs last ascending, the opposite of SQLite — so any query whose correctness depends on where NULLs land should say so explicitly. COALESCE to a sentinel works but corrupts the value if 999 is ever a real rating, and DISTINCT does not remove NULL rows at all.'

  - question: 'Which statement about LIKE and GLOB in SQLite is correct?'
    options:
      - 'Both use % and _ as wildcards; GLOB simply adds character classes'
      - 'GLOB is case-insensitive and LIKE is case-sensitive, which is the opposite of most engines'
      - 'LIKE is case-insensitive with % and _; GLOB is not, with * and ?'
      - 'They are aliases for the same operator and differ only in which one the query planner prefers'
    answer_index: 2
    explanation: 'LIKE comes from standard SQL, uses % for any run of characters and _ for exactly one, and in SQLite folds case for the 26 ASCII letters by default — but not for accented or non-Latin characters unless the build includes ICU. GLOB comes from Unix filename matching, uses * and ?, adds character classes such as A-M which LIKE has no equivalent for, and is always case-sensitive. In the lab, LIKE ''%archive%'' finds 2 titles and GLOB ''*archive*'' finds 0, and the second is not an error — it is a perfectly ordinary empty result that you have no particular reason to question. That silence is the whole hazard.'

  - question: 'You are reporting model accuracy per demographic slice. Which query shape is the responsible one?'
    options:
      - 'GROUP BY slice with AVG(correct), and publish every slice with its figure'
      - 'AVG(correct) with no GROUP BY, since the overall figure already accounts for every slice'
      - 'WHERE correct = 1 GROUP BY slice, so only the successful predictions are summarised'
      - 'GROUP BY slice with AVG and COUNT, checking the smallest bucket'
    answer_index: 3
    explanation: 'Two failures are being guarded against at once. The first is statistical: 61 percent over eleven examples and 61 percent over eleven thousand are different findings, so an accuracy without its denominator cannot be acted on — report COUNT(*) beside every aggregate, and consider HAVING COUNT(*) >= some floor before drawing conclusions. The second is disclosure: aggregation is routinely offered as a privacy measure, but a GROUP BY whose buckets are small anonymises nothing, since a count of one identifies exactly one person and two published aggregates differing by one row reveal what that row contained. Filtering to correct = 1 first is simply the wrong question — it throws away the denominator entirely — and an overall average hides precisely the per-slice gap that makes the report worth writing.'
