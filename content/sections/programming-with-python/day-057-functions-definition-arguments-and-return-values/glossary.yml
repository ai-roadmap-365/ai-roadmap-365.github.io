terms:
  - term: function
    definition: 'A named, reusable piece of a program that takes zero or more inputs, performs one job, and hands back a result; the fundamental unit of code organisation in Python and most languages.'
  - term: def
    definition: 'The Python keyword that begins a function definition, followed by the function name, a parenthesised parameter list, a colon, and an indented body — for example def mean(numbers):.'
  - term: parameter
    definition: 'A name listed in a function definition that stands for a value the function will receive; for example numbers in def mean(numbers):. Parameters live in the definition, arguments in the call.'
  - term: argument
    definition: 'An actual value supplied to a function when it is called; for example [2, 4, 6] in mean([2, 4, 6]). The argument is bound to the matching parameter for the duration of the call.'
  - term: positional argument
    definition: 'An argument matched to a parameter by its position in the call, in the order the parameters are listed — for example the "Ada" in greet("Ada", "Welcome") fills the first parameter.'
  - term: keyword argument
    definition: 'An argument that names the parameter it is for, such as punctuation="." in greet("Ada", punctuation="."), making it order-independent and letting the caller skip earlier optional parameters.'
  - term: default argument
    definition: 'A value given to a parameter in the function definition (greeting="Hello") that is used when the caller omits that argument, so the parameter becomes optional at the call site.'
  - term: return value
    definition: 'The value a function hands back to its caller with a return statement; the caller can store, compose, or test it. A function with no explicit return hands back None.'
  - term: None
    definition: 'Python''s special "nothing" value, returned by a function that has no return statement (or a bare return). Mistaking it for a real result — for example after forgetting to return — is a common source of bugs.'
  - term: docstring
    definition: 'A string literal placed as the first line of a function body that documents what the function returns and how to call it; accessible at runtime as the function''s __doc__ and read by help() and tools.'
  - term: side effect
    definition: 'Anything a function does beyond returning a value — printing, writing a file, making a network call, or mutating an object it was passed. Side effects are sometimes necessary but make a function harder to test.'
  - term: pure function
    definition: 'A function whose output depends only on its arguments and which affects the world only through its return value (no side effects). Pure functions are deterministic, easy to test, and safe to cache.'
  - term: DRY
    definition: '"Don''t repeat yourself" — the principle that each piece of logic should have a single home. When the same code appears twice, factor it into a function and call it, so a fix happens in one place.'
