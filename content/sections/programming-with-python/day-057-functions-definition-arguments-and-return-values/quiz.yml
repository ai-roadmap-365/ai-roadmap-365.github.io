questions:
  - question: 'What is the difference between a parameter and an argument?'
    options:
      - 'They are two words for the same thing'
      - 'A parameter is the name in the definition; an argument the value'
      - 'A parameter is only for numbers; an argument is only for strings'
      - 'A parameter is returned by the function; an argument is printed'
    answer_index: 1
    explanation: 'In def greet(name): the parameter is name (a placeholder in the definition). In greet("Ada") the argument is "Ada" (the actual value for this call). Definitions have parameters; calls have arguments.'

  - question: 'What does a function return if it finishes without hitting a return statement?'
    options:
      - '0'
      - 'It returns nothing at all, and the program stops'
      - 'None — a value later code may mistake for a result'
      - 'An empty string'
    answer_index: 2
    explanation: 'A function with no explicit return (or a bare return) hands back None. That is why x = a_function_that_forgot_to_return() sets x to None, which can then cause a confusing bug far from the real mistake.'

  - question: 'Which call to `def greet(name, greeting="Hello", punctuation="!")` uses a keyword argument to override only the punctuation, keeping the default greeting?'
    options:
      - 'greet("Ada", "Hello", ".")'
      - 'greet("Ada", ".")'
      - 'greet(name="Ada", greeting=".")'
      - 'greet("Ada", punctuation=".")'
    answer_index: 3
    explanation: 'greet("Ada", punctuation=".") passes name positionally and names punctuation by keyword, so greeting keeps its default "Hello". The result is "Hello, Ada.". greet("Ada", ".") would wrongly set greeting to ".".'

  - question: 'Why are pure functions the easy ones to test?'
    options:
      - 'They depend only on arguments and return a value, so tests are easy'
      - 'Because they are shorter than other functions'
      - 'Because they run faster than functions with side effects'
      - 'Because they always print their result to the screen'
    answer_index: 0
    explanation: 'A pure function takes input only from its arguments and affects the world only through its return value. A test can call it with known inputs and assert on the returned value, automatically and repeatably, without setting up or inspecting any outside state.'

  - question: 'How do you hand back several results from one function call?'
    options:
      - 'Call return several times in a row'
      - 'Return a tuple, which the caller unpacks'
      - 'Print each result instead of returning it'
      - 'You cannot; a function may only return one thing'
    answer_index: 1
    explanation: 'Return a tuple: return (count, total, mean). Python packs the values together and the caller unpacks them with the same number of names on the left. It is still one returned object (a tuple), so "a function returns one thing" still holds.'

  - question: 'Why does `def tally(items, counts={})` misbehave across calls?'
    options:
      - 'counts must be listed before items in the parameter list'
      - 'Dictionaries cannot be used as default arguments in Python'
      - 'The default dict is created once and shared by every call'
      - 'The function will raise a SyntaxError'
    answer_index: 2
    explanation: 'A default value is evaluated once, at definition time, not fresh on each call. A mutable default like {} is therefore shared across calls and remembers previous items. The fix is counts=None plus building a fresh dict inside the body.'

  - question: 'What is the difference between return and print?'
    options:
      - 'return is for numbers and print is for text'
      - 'print hands a value back to the caller; return shows it on screen'
      - 'They are interchangeable; both give the value back to the caller'
      - 'return hands a value back; print shows text and returns None'
    answer_index: 3
    explanation: 'return sends a value back so the program can store, compose, or test it. print writes text for a human and itself returns None. A function that prints its answer instead of returning it is a dead end for composition and testing.'

  - question: 'Which change best applies the DRY principle?'
    options:
      - 'Factor the repeated averaging into one mean() function'
      - 'Rename all your variables to shorter names'
      - 'Add more comments explaining the repeated code'
      - 'Copy the averaging code into every place that needs an average'
    answer_index: 0
    explanation: 'DRY — do not repeat yourself — means giving repeated logic a single home. Factoring the duplicated code into mean(numbers) means one place to read it, one place to fix a bug, and a name that documents intent. Copying it or commenting it does the opposite.'
