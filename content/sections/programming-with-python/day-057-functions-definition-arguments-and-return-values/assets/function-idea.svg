<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What a function gives you</title>
  <style>
    .function-idea-bg   { fill: #f8fafc; }
    .function-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .function-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .function-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .function-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .function-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .function-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .function-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .function-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .function-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .function-idea-stage { opacity: 1; }

    .function-idea-s0 { animation-delay: 0.00s; }
    .function-idea-e0 { animation-delay: 0.00s; }
    .function-idea-s1 { animation-delay: 1.28s; }
    .function-idea-e1 { animation-delay: 1.28s; }
    .function-idea-s2 { animation-delay: 2.56s; }
    .function-idea-e2 { animation-delay: 2.56s; }
    .function-idea-s3 { animation-delay: 3.84s; }
    .function-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .function-idea-conn  { animation: function-idea-trace 6.4s ease-in-out infinite; }
      .function-idea-stage { animation: function-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes function-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes function-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .function-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .function-idea-stage { animation: function-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes function-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="function-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="function-idea-bg" width="980" height="322"/>
  <text class="function-idea-h1"  x="30" y="40">What a function gives you</text>
  <text class="function-idea-sub" x="30" y="64">Four things.</text>
  <g class="function-idea-stage function-idea-s0">
    <rect class="function-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="function-idea-step" x="44" y="142">01</text>
    <text class="function-idea-name" x="70" y="142">A name for an operation</text>
    <text class="function-idea-desc" x="44" y="166">Which is documentation that</text>
    <text class="function-idea-desc" x="44" y="182">cannot drift.</text>
  </g>
  <line class="function-idea-line function-idea-conn function-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#function-idea-tip)"/>
  <g class="function-idea-stage function-idea-s1">
    <rect class="function-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="function-idea-step" x="280" y="142">02</text>
    <text class="function-idea-name" x="306" y="142">Reuse without duplication</text>
    <text class="function-idea-desc" x="280" y="166">So a fix happens in one place.</text>
  </g>
  <line class="function-idea-line function-idea-conn function-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#function-idea-tip)"/>
  <g class="function-idea-stage function-idea-s2">
    <rect class="function-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="function-idea-step" x="516" y="142">03</text>
    <text class="function-idea-name" x="542" y="142">An isolated scope</text>
    <text class="function-idea-desc" x="516" y="166">So its variables cannot disturb</text>
    <text class="function-idea-desc" x="516" y="182">anything else.</text>
  </g>
  <line class="function-idea-line function-idea-conn function-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#function-idea-tip)"/>
  <g class="function-idea-stage function-idea-s3">
    <rect class="function-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="function-idea-step" x="752" y="142">04</text>
    <text class="function-idea-name" x="778" y="142">And a unit that can be tested alone</text>
    <text class="function-idea-desc" x="752" y="166">Which is what makes a codebase</text>
    <text class="function-idea-desc" x="752" y="182">verifiable.</text>
    <text class="function-idea-edge" x="752" y="242">the payoff</text>
  </g>
  <text class="function-idea-sub" x="30" y="304">Testability is the property that compounds: code decomposed into functions can be verified piece by piece, and code that is not cannot.</text>
</svg>
