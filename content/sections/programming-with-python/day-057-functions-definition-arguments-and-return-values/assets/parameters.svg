<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How values are passed</title>
  <style>
    .parameters-bg   { fill: #f8fafc; }
    .parameters-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parameters-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parameters-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parameters-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parameters-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .parameters-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .parameters-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .parameters-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .parameters-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .parameters-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .parameters-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .parameters-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .parameters-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .parameters-stage { opacity: 1; }

    .parameters-s0 { animation-delay: 0.00s; }
    .parameters-e0 { animation-delay: 0.00s; }
    .parameters-s1 { animation-delay: 1.28s; }
    .parameters-e1 { animation-delay: 1.28s; }
    .parameters-s2 { animation-delay: 2.56s; }
    .parameters-e2 { animation-delay: 2.56s; }
    .parameters-s3 { animation-delay: 3.84s; }
    .parameters-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .parameters-conn  { animation: parameters-trace 6.4s ease-in-out infinite; }
      .parameters-stage { animation: parameters-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes parameters-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes parameters-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .parameters-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .parameters-stage { animation: parameters-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes parameters-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="parameters-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="parameters-bg" width="980" height="322"/>
  <text class="parameters-h1"  x="30" y="40">How values are passed</text>
  <text class="parameters-sub" x="30" y="64">Four steps.</text>
  <g class="parameters-stage parameters-s0">
    <rect class="parameters-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="parameters-step" x="44" y="142">01</text>
    <text class="parameters-name" x="70" y="142">The function receives a reference to the object</text>
    <text class="parameters-desc" x="44" y="166">Not a copy of it.</text>
  </g>
  <line class="parameters-line parameters-conn parameters-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#parameters-tip)"/>
  <g class="parameters-stage parameters-s1">
    <rect class="parameters-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="parameters-step" x="280" y="142">02</text>
    <text class="parameters-name" x="306" y="142">Rebinding the parameter affects only the local name</text>
    <text class="parameters-desc" x="280" y="166">The caller sees nothing.</text>
  </g>
  <line class="parameters-line parameters-conn parameters-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#parameters-tip)"/>
  <g class="parameters-stage parameters-s2">
    <rect class="parameters-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="parameters-step" x="516" y="142">03</text>
    <text class="parameters-name" x="542" y="142">But mutating the object is visible to the caller</text>
    <text class="parameters-desc" x="516" y="166">Because it is the same object.</text>
  </g>
  <line class="parameters-line parameters-conn parameters-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#parameters-tip)"/>
  <g class="parameters-stage parameters-s3">
    <rect class="parameters-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="parameters-step" x="752" y="142">04</text>
    <text class="parameters-name" x="778" y="142">So mutable arguments are a shared channel</text>
    <text class="parameters-desc" x="752" y="166">Which should be deliberate</text>
    <text class="parameters-desc" x="752" y="182">rather than accidental.</text>
  </g>
  <text class="parameters-sub" x="30" y="304">The distinction between rebinding and mutating is the whole model, and it explains behaviour that otherwise looks inconsistent between argument types.</text>
</svg>
