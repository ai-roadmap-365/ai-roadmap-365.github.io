<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" font-family="system-ui, sans-serif">
  <title>The call-and-return flow: the caller passes arguments into a function, the function binds them to its parameters and runs its body, then a return statement hands a value back that the caller uses; a function with no return hands back None</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How a call and its return value flow</text>

  <!-- Caller column -->
  <rect x="40" y="70" width="250" height="360" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="165" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The caller</text>

  <rect x="64" y="120" width="202" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="165" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">1. Build arguments</text>
  <text x="165" y="166" text-anchor="middle" font-size="14" fill="#1a202c">data = [2, 4, 6]</text>

  <rect x="64" y="330" width="202" height="76" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="165" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">4. Use the return value</text>
  <text x="165" y="378" text-anchor="middle" font-size="14" fill="#1a202c">result = summarize(data)</text>
  <text x="165" y="396" text-anchor="middle" font-size="14" fill="#1a202c">print(result[4])  # mean</text>

  <!-- Function column -->
  <rect x="470" y="70" width="250" height="360" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="595" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">The function</text>

  <rect x="494" y="120" width="202" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="595" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">2. Bind parameters</text>
  <text x="595" y="166" text-anchor="middle" font-size="14" fill="#1a202c">numbers = [2, 4, 6]</text>

  <rect x="494" y="210" width="202" height="60" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="595" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Run the body</text>
  <text x="595" y="256" text-anchor="middle" font-size="14" fill="#1a202c">count, total, ... </text>

  <rect x="494" y="300" width="202" height="60" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="595" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">3. return a value</text>
  <text x="595" y="346" text-anchor="middle" font-size="14" fill="#1a202c">return (3, 12, 2, 6, 4.0)</text>

  <!-- arguments arrow: caller -> function -->
  <line x1="266" y1="150" x2="490" y2="150" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="494,150 480,143 480,157" fill="#1d4ed8"/>
  <text x="380" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">arguments passed in</text>

  <!-- internal arrows -->
  <line x1="595" y1="180" x2="595" y2="206" stroke="#1a202c" stroke-width="2"/>
  <polygon points="595,206 589,194 601,194" fill="#1a202c"/>
  <line x1="595" y1="270" x2="595" y2="296" stroke="#1a202c" stroke-width="2"/>
  <polygon points="595,296 589,284 601,284" fill="#1a202c"/>

  <!-- return arrow: function -> caller -->
  <line x1="494" y1="345" x2="270" y2="370" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="266,370 280,367 279,353" fill="#1d4ed8"/>
  <text x="380" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">value returned out</text>

  <!-- None note -->
  <rect x="200" y="452" width="360" height="34" fill="#fee2e2" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="380" y="474" text-anchor="middle" font-size="14" fill="#1a202c">No return statement? The function hands back None.</text>
</svg>
