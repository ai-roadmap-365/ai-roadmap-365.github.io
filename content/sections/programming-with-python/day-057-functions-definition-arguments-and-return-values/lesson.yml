title: 'Functions: Definition, Arguments, and Return Values'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to define functions with def, use positional, keyword, and default arguments, return values (including a tuple of several results) and understand the implicit None, write clear docstrings, tell a pure function from a side effect and know why pure functions are easy to test, avoid the mutable-default-argument trap, and factor repeated code into functions (DRY).'
objectives:
  - 'Define a function with def: a name, a parameter list, an indented body, and a docstring whose first line says what it returns'
  - 'Distinguish a parameter (the name in the definition) from an argument (the value at the call), and pass arguments by position, by keyword, and via defaults'
  - 'Return a value the caller uses, return a tuple to hand back several results at once, and explain the implicit None a function returns without an explicit return'
  - 'Tell a pure function (input from arguments, a return value, no side effects) from a side-effecting one, and explain why pure functions are the easy ones to test'
  - 'Recognise and avoid the mutable-default-argument trap by defaulting to None and building a fresh container inside the function'
  - 'Apply DRY by factoring repeated code into a named function, and choose between def, lambda, methods, and functools helpers'
prerequisites:
  - 'Days 50-56 of this course: conditionals and loops, lists, dictionaries, sets and tuples, comprehensions, and building a data-driven CLI'
  - 'Comfort running a Python script from the terminal with python3 and editing a text file'
  - 'Familiarity with strings, numbers, and f-strings from earlier in the Python section'
