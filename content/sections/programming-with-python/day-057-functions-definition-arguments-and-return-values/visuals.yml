visuals:
  - id: function-anatomy
    file: assets/function-anatomy.svg
    type: diagram
    title: 'Anatomy of a Python function'
    alt: 'Diagram: the anatomy of a Python function — the def keyword, name, parameters, docstring, body, and the return value handed back to the caller'
    description: 'A labelled function definition: the def keyword, the function name, the parameter list in parentheses, the indented body with its docstring, and the return statement. Below it, a call (result = summarize(data)) passes arguments up into the definition, and the returned tuple flows back down into the caller''s variable — showing that a parameter is a name in the definition while an argument is the value passed at the call.'
  - id: call-return-flow
    file: assets/call-return-flow.svg
    type: flowchart
    title: 'The call-and-return flow'
    alt: 'Flowchart: the call-and-return flow — the caller passes arguments, the function binds parameters and runs its body, then returns a value the caller uses'
    description: 'Two columns, caller and function. The caller builds arguments and makes the call; the function binds those arguments to its parameters, runs its body, and returns a value; the value flows back to the caller, which uses it. A note records that a function with no return statement hands back None.'
  - id: function-idea
    file: assets/function-idea.svg
    type: diagram
    title: 'What a function gives you'
    alt: 'Diagram: the four things a function provides'
    description: 'A four-stage description of functions covering naming, reuse, isolation and testability.'
  - id: parameters
    file: assets/parameters.svg
    type: diagram
    title: 'How values are passed'
    alt: 'Diagram: how arguments are passed to a function'
    description: 'A four-stage description of argument passing covering the reference, rebinding, mutation and the consequence.'
  - id: return-values
    file: assets/return-values.svg
    type: diagram
    title: 'Return values'
    alt: 'Diagram: the four facts about function return values'
    description: 'A four-stage description of return values covering the implicit None, multiple values, unpacking and the convention.'
  - id: mutable-default
    file: assets/mutable-default.svg
    type: diagram
    title: 'The mutable default trap'
    alt: 'Diagram: why a mutable default argument is shared across calls'
    description: 'A four-stage description of the mutable default trap covering evaluation time, the shared object, accumulation and the fix.'
  - id: pure-impure
    file: assets/pure-impure.svg
    type: diagram
    title: 'Pure against impure'
    alt: 'Diagram: a pure function compared with one that has side effects'
    description: 'A two-column comparison of pure functions against impure ones.'
  - id: function-not
    file: assets/function-not.svg
    type: diagram
    title: 'Four things functions are not'
    alt: 'Diagram: four misconceptions about functions'
    description: 'A two-column comparison of misconceptions about functions against what is true.'
  - id: function-history
    file: assets/function-history.svg
    type: diagram
    title: 'Four steps in function design'
    alt: 'Diagram: the historical progression of the function concept'
    description: 'A four-stage description of function history covering reusable jumps, structured procedures, first-class functions and type-annotated signatures.'
  - id: recipe-function
    file: assets/recipe-function.svg
    type: diagram
    title: 'A named recipe'
    alt: 'Diagram: a repeated set of instructions compared with a named recipe'
    description: 'A two-column comparison of repeated instructions against a named, reusable recipe.'
  - id: function-implications
    file: assets/function-implications.svg
    type: diagram
    title: 'Four consequences of decomposition'
    alt: 'Diagram: the testability, reuse, readability and cost implications of functions'
    description: 'A four-stage description of function implications covering testability, reuse, readability and call overhead.'
  - id: function-when
    file: assets/function-when.svg
    type: diagram
    title: 'When to extract a function'
    alt: 'Diagram: when extracting a function is warranted'
    description: 'A two-column comparison of situations favouring extraction against leaving code inline.'
