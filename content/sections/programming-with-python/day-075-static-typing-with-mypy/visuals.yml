visuals:
  - id: type-checking-architecture
    file: assets/type-checking-architecture.svg
    type: diagram
    title: 'What a type checker reads, and the two outcomes it never mixes up'
    alt: 'Diagram: the architecture of a type check — mypy reads your annotated source, typeshed''s bundled stubs for the standard library, whatever type information third-party packages ship as a py.typed marker or a separate stub package, and the settings in the tool.mypy table, then parses each file into a syntax tree, builds the import graph and loads the stubs it needs, and infers a type for every expression before comparing each call, return and assignment against what the annotations promise, producing a report of file, line, message and bracketed error code with a non-zero exit status — while the entirely separate runtime path has the interpreter evaluate each annotation once into __annotations__ and never compare a value against one, so the program behaves identically whether or not the checker ever ran'
    description: 'A three-column architecture diagram with a separate band along the bottom. The left column is what the checker reads: your own source files with their annotations; typeshed, the bundled stubs covering the whole standard library; third-party type information, which is either a py.typed marker inside the package, a separate stub-only package of .pyi files, or nothing at all; and the pyproject.toml [tool.mypy] table whose settings — strict, disallow_untyped_defs, warn_return_any, warn_unused_ignores and per-module overrides — feed every stage by a dashed line. The middle column is the checker in three stages: parse, where each file becomes a syntax tree and nothing is executed; build, where every import is followed, the stubs the graph needs are loaded, and the result is cached; and infer-then-check, where every expression is given a type, including ones never annotated, and each call, return and assignment is compared against what the annotations promise. The right column is the first outcome, a report printed to the terminal showing real captured mypy output with union-attr and arg-type errors, labelled file, line, message and error code, with exit status 1 so a build step can fail, and the note that no code ran and no data was touched. The bottom band is the second, entirely separate outcome: whenever the file is actually run, the interpreter evaluates each annotation once and stores it in __annotations__ where tools such as @dataclass read it, never compares a value against one — exactly what Day 69 proved by inspection — and the program therefore behaves identically whether or not the checker was ever run.'
  - id: type-narrowing-flow
    file: assets/type-narrowing-flow.svg
    type: flowchart
    title: 'Narrowing: how a guard teaches the checker what it already told you'
    alt: 'Flowchart: one str or None value moving through two versions of the same function — both begin with the checker knowing only that name is str or None and therefore refusing string methods on it; on the unguarded path the function goes straight to name.upper() and the checker reports Item None of str or None has no attribute upper with the error code union-attr on that exact line, the use rather than the definition; on the guarded path an if name is None early return removes one possibility, so from the next line the checker knows name is str, accepts name.upper(), and reports success — with a closing note that assert isinstance and an early raise narrow in exactly the same way'
    description: 'A flow diagram that starts from a single shared box holding the signature def greet(name: str | None) -> str, annotated with what the checker knows about name at that point — str | None — and why a string method is therefore refused. The flow then splits into two parallel columns for two versions of the same function. The left, unguarded column goes straight to return name.upper() with nothing having taught the checker anything, so name is still str | None, and terminates in a highlighted error panel carrying the real captured message: Item "None" of "str | None" has no attribute "upper" with the error code union-attr, reported at the line of the use rather than the line of the definition, with the observation that the annotation was fine and the missing guard was not. The right, guarded column shows the if name is None early return removing one possibility, then a box recording that the checker now knows name is str on every line below, then the accepted return name.upper() and a success result — plus the point that the None case now has real behaviour. A full-width panel at the bottom records that the same mechanism is spelled three ways — an early return on None, an assert isinstance, and an isinstance check that raises — that each removes a possibility the checker follows through the control flow, and that the guard is not code written for the checker but the case the author forgot.'
