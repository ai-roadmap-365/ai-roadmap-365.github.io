terms:
  - term: static typing
    definition: 'Checking that values flow where their declared types allow, before the program runs, by reading the source rather than executing it. "Static" is the whole point: the analysis happens on the text, so it reaches every path in the file, including the ones no test walks and the one that would have crashed in production.'
  - term: gradual typing
    definition: 'PEP 484''s design principle that a codebase may be annotated as much or as little as you like, with annotated and unannotated code interoperating freely and unannotated functions simply going unchecked. It is what makes adopting types in an existing project possible at all — you type one module at a time — and it is also why a clean run on unannotated code means the checker did not look.'
  - term: type checker
    definition: 'A separate program that reads your annotated source without executing it and reports where an expression contradicts the annotations around it. mypy is the reference implementation; Pyright, ty and pyrefly are others. It produces a report and an exit status, and changes nothing about how your program behaves.'
  - term: annotation
    definition: 'A recorded claim about what a name is supposed to hold, written as `score: float` or `def find(name: str) -> Model | None`. Python evaluates it once at definition time, stores it in `__annotations__`, and never compares a value against it — which is exactly why a separate checker is needed for it to mean anything.'
  - term: type inference
    definition: 'The checker working out the type of an expression you never annotated. Write `total = 0` and mypy knows it is an `int`; write a comprehension over a `list[Model]` and it knows what comes out. Inference is why annotating function signatures buys checking of hundreds of lines you did not annotate.'
  - term: Optional
    definition: 'The type of a value that is either an `X` or nothing, written `Optional[X]` in older code and `X | None` in modern code — the same type, two spellings. Writing it down is what forces every use site to handle absence, and the missing check is the single most valuable thing a checker catches, because tests routinely miss it.'
  - term: union type
    definition: 'A type meaning "one of these", written `str | list[str]` or `Model | None`. Anything you do with a union must be valid for every member unless you narrow first, which is why unions and narrowing are always learned together.'
  - term: Any
    definition: 'The typing escape hatch that means "stop checking here" rather than "some type". A value typed `Any` may be passed anywhere and have anything called on it, and anything derived from it is itself `Any`, so the hole spreads downstream until something re-annotates it. Deliberate at a genuinely dynamic boundary; a way of hiding a real bug everywhere else.'
  - term: narrowing
    definition: 'The checker''s tracking of what a name can be as control flow proceeds. `if x is None: return`, `if not isinstance(x, dict): raise`, and `assert isinstance(x, str)` each remove a possibility, so on the lines below only the remaining members of the union are considered. The guard is not written for the checker — it is the case you forgot, and the checker noticed.'
  - term: Protocol
    definition: 'A declaration of a required shape — a set of methods and their signatures — that any object satisfies by having them, with no inheritance and no registration. It is how you type an injected dependency such as a clock or a repository, so a test double satisfies the same annotation as the real thing without sharing a base class.'
  - term: structural typing
    definition: 'Deciding type compatibility by shape: if it has the right methods with the right signatures, it fits. This is duck typing with the expectation written down, and `Protocol` is its form in Python. When it fails, mypy names the specific member that conflicts and shows both signatures.'
  - term: nominal typing
    definition: 'Deciding type compatibility by declared identity: a value fits because its class inherits from, or is, the named type. Ordinary Python class annotations are nominal; `Protocol` is the structural alternative, and the choice between them is really a choice about whether the two sides must know about each other.'
  - term: TypedDict
    definition: 'An annotation describing a dictionary with known keys and a type for each key — how you type JSON-shaped data that must stay a dict rather than becoming a class. Misspell a key and the checker reports both halves of the story: the required key that is missing and the unexpected key that appeared.'
  - term: TypeVar
    definition: 'A placeholder type variable meaning "whatever type came in, that same type goes out". It is what `Any` cannot express, because `Any` forgets: a function annotated with a TypeVar returns a known type that depends on its arguments, so the checker keeps tracking values through it.'
  - term: generic
    definition: 'A type or function parameterised by other types. `list[int]` and `dict[str, float]` are generic containers; a function written with a TypeVar is a generic function. The modern builtin spelling replaced the capitalised `List` and `Dict` imports from `typing`, which mean the same thing.'
  - term: stub file
    definition: 'A `.pyi` file containing signatures and no bodies — a header, or a data sheet for a component you cannot open. Stubs describe the types of code the checker cannot otherwise read, and are distributed either inside a package or as a separate stub-only package.'
  - term: typeshed
    definition: 'The community-maintained collection of stub files for the Python standard library and for third-party packages that ship none. It is bundled with mypy and read by every checker, and it is why `json.load` is known to return `Any` and `Path.read_text` is known to return `str` without you writing anything.'
  - term: py.typed
    definition: 'A marker file a third-party package includes, per PEP 561, to declare that its own inline annotations are complete enough to be used by type checkers. Its presence is the difference between a dependency you get checking for and one that arrives as `Any`.'
  - term: strict mode
    definition: 'mypy''s `--strict` flag, or `strict = true` in configuration — a bundle switching on roughly a dozen individual settings, including `disallow_untyped_defs` and `warn_return_any`. It is what turns "mypy found nothing" from a statement about your annotations into a statement about your code.'
  - term: error code
    definition: 'The bracketed identifier at the end of every mypy message — `[union-attr]`, `[arg-type]`, `[return-value]`, `[assignment]`, `[no-untyped-def]`. It is the stable, searchable, individually configurable identity of a check, it is what a `# type: ignore[code]` comment refers to, and it is what a test suite should assert on, because message wording changes between releases.'
  - term: 'type: ignore'
    definition: 'A comment suppressing a mypy error on one line. Always write it with its error code — `# type: ignore[union-attr]` — because a bare ignore silences every error on that line forever, including the different one that appears next year. mypy reports when the code you named does not cover the error found.'
  - term: warn_unused_ignores
    definition: 'The setting that reports an ignore comment which no longer suppresses anything, with the code `[unused-ignore]`. Without it, ignores written for real problems outlive those problems and accumulate for years until nobody dares remove one, because nobody can tell which still do something.'
  - term: per-module override
    definition: 'A `[[tool.mypy.overrides]]` block applying different settings to named modules. It is the mechanism for incremental adoption: strict everywhere, with a checked-in list of named exceptions that is visible to everyone and shrinks over time — a work queue that cannot be forgotten.'
  - term: cast
    definition: 'A function that asserts a type to the checker and does nothing whatsoever at runtime — no check, no conversion, no safety. Prefer `isinstance`, which narrows and checks; reach for `cast` only where you genuinely know something the checker cannot, and write a comment saying what.'
  - term: Literal
    definition: 'An annotation restricting a value to a fixed set of constants, such as `Literal["semantic", "keyword"]`. It turns a misspelled mode string from a shrug at runtime into an error before you run, and it expresses a constraint a plain `str` cannot communicate to anybody.'
  - term: Final
    definition: 'An annotation declaring that a name is never rebound after its first assignment. Assigning to it again is reported as an error, which makes a module-level constant genuinely constant as far as any reader or tool is concerned.'
  - term: NewType
    definition: 'A way of making a distinct type out of an existing one, so that two values which are both strings at runtime stop being interchangeable to the checker. It catches the argument-order mistake that a plain `(str, str)` signature can never see.'
  - term: mypy cache
    definition: 'The `.mypy_cache/` directory holding a processed representation of each module, so repeated runs rebuild only what changed. It appears wherever you ran mypy, belongs outside version control, and can be deleted at any time at the cost of one slower run.'
