questions:
  - question: 'Day 69 proved Python stores annotations and never enforces them. Given that, what does running mypy change about how your program behaves?'
    options:
      - 'Nothing at all — mypy reads your source without executing it and only produces a report and an exit status'
      - 'It installs runtime checks that raise a TypeError when an annotation is violated'
      - 'It rewrites your source to insert isinstance checks at each annotated boundary'
      - 'It changes behaviour only for functions annotated with strict types'
    answer_index: 0
    explanation: 'This is the two-worlds model and it is the single idea of the day. mypy parses your files into syntax trees, reasons about them, prints a report of file, line, message and error code, and exits non-zero on errors. The interpreter, separately and later, evaluates each annotation once into __annotations__ and never compares a value against one. Running the checker changes nothing about the program; not running it changes nothing either. The entire value is that a human reads the report and edits the code first.'

  - question: 'A module with no annotations anywhere reports `Success: no issues found in 1 source file`. What does that actually tell you?'
    options:
      - 'That every function in the module is type-correct'
      - 'That the module is too small for mypy to find anything wrong'
      - 'That mypy checked nothing, because an unannotated function is one it declines to check'
      - 'That mypy inferred all the types itself and they were consistent'
    answer_index: 2
    explanation: 'This is gradual typing working exactly as PEP 484 designed it, and it is the single most misleading result a newcomer can get: "mypy passes" on unannotated code means "mypy did not look". The lab proves it — `starter/untyped_first_run.py` is entirely unannotated and reports Success, and the same unchanged file under --strict reports six errors, four of them [no-untyped-def] or [no-untyped-call]. The setting that fixes it is `disallow_untyped_defs`, which `strict` includes.'

  - question: 'In `catalog.py:85: error: Argument 2 to "estimate_cost" has incompatible type "float"; expected "int"  [arg-type]`, why does the bracketed code matter more than the message?'
    options:
      - 'Because the message is only shown when show_error_codes is disabled'
      - 'Because the code names the line number, whereas the message does not'
      - 'Because the code indicates severity while the message is informational'
      - 'Because the code is stable across releases, searchable, individually configurable, and is what a type: ignore comment refers to'
    answer_index: 3
    explanation: 'Message wording is prose and gets reworded between mypy releases; the code is the check''s stable identity. Searching for the concept beats searching for your own variable names, a script or test suite can grep for `[arg-type]` and keep working across upgrades — which is exactly why the lab''s suite asserts on codes and never on message text — you can enable or disable an individual code by name in your settings, and `# type: ignore[arg-type]` suppresses that one code and nothing else.'

  - question: 'Why is the missing `None` check the bug class where a checker most clearly beats a test suite?'
    options:
      - 'Because None comparisons are unusually slow to test at runtime'
      - 'Because a test for the None case only exists if someone thought of it — and if they had, they would have handled it'
      - 'Because pytest cannot assert that a function returns None'
      - 'Because None is the only value mypy is able to track through a program'
    answer_index: 1
    explanation: 'The asymmetry is the whole argument. A test exercises the paths it walks; the None path is precisely the path nobody thought about, which is why the bug exists in the first place. The lab makes this concrete: eight perfectly reasonable tests pass over a module where `describe()` reads attributes off a `Model | None` without a guard, because every test uses a name that is in the catalogue. mypy reports it twice on line 63 with the code [union-attr], in under a second, having walked every path in the file.'

  - question: 'Two functions contain the identical bug — a call to a method that does not exist. One returns `dict[str, int]`, the other returns `Any`. mypy reports one error. What happened?'
    options:
      - 'Any made the second function correct by widening its return type'
      - 'mypy reports only the first error it finds in each file'
      - 'The Any version is checked more leniently but still reported as a warning'
      - 'Any means "stop checking here", so the second bug is invisible — and the hole spreads to every value that flows out of it'
    answer_index: 3
    explanation: 'This is the day''s cautionary demonstration and it is worth running rather than reading. In the captured output only line 13 is reported, `"dict[str, int]" has no attribute "total_count"  [attr-defined]`; line 17 is the same bug and goes unmentioned. Both raise AttributeError the moment they run. Any is not "some type" — it is an instruction to stop looking, and anything you get out of an Any is itself Any, so the hole propagates until something re-annotates it.'

  - question: 'What does the guard `if name is None: return "(anonymous)"` do for the checker?'
    options:
      - 'It narrows the union, so on every line below it the only remaining possibility is str'
      - 'It converts None into an empty string so string methods become valid'
      - 'It suppresses the [union-attr] error code for the rest of the function'
      - 'It tells mypy to treat the parameter as Any from that point on'
    answer_index: 0
    explanation: 'mypy follows the control flow of your function and updates what it knows about each name. Once one member of the union has been handled and returned, only `str` is left, so `.upper()` is accepted. The important framing: this is not code written to please the checker. It is the case you forgot, and the checker noticed it was missing — the guard gives the None path real behaviour, gives the reader a clear answer, and satisfies the checker, all at once. `assert isinstance(...)` and an early `raise` narrow in exactly the same way.'

  - question: 'What is the practical difference between a bare `# type: ignore` and `# type: ignore[union-attr]`?'
    options:
      - 'There is none; the bracketed form is a stylistic preference'
      - 'The bare form is checked at runtime, the coded form only by mypy'
      - 'The bare form suppresses every error on that line forever; the coded form suppresses one code, and mypy tells you when you named the wrong one'
      - 'The coded form is deprecated in favour of the bare form'
    answer_index: 2
    explanation: 'A bare ignore silences the completely different error that turns up on that line next year. A coded ignore is precise, and mypy will not silently obey a wrong one — the captured output shows the note `Error code "return-value" not covered by "type: ignore[arg-type]" comment`, which is the checker telling you that you silenced the wrong thing. Pair coded ignores with `warn_unused_ignores`, which reports an ignore that no longer suppresses anything as [unused-ignore] — the only thing that stops ignores accumulating for years until nobody dares remove one.'

  - question: 'Which statement correctly distinguishes mypy from pydantic?'
    options:
      - 'mypy validates values at runtime; pydantic checks annotations before you run'
      - 'They are competing implementations of the same static checking, and you should pick one'
      - 'mypy checks source before running and never sees a value; pydantic validates actual data at runtime and can reject it'
      - 'pydantic replaces mypy once a codebase is fully annotated'
    answer_index: 2
    explanation: 'They read similar declarations and do completely different jobs at completely different moments, which is why a serious project uses both. mypy catches the missing None check in code you wrote, before anything runs, without ever seeing data. pydantic catches the malformed record in data you received, while running, by holding the actual value. Only pydantic can address the limit this lesson keeps returning to: a `str` that must be an email address is, to mypy, exactly as good as any other `str`, at any strictness setting. Both are free and open source.'
