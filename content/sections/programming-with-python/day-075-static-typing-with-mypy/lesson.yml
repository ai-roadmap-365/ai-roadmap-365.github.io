title: 'Static Typing with mypy'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to run a real type checker over your own code and act on what it says: you will explain the two-worlds model that Day 69 set up — annotations are inert at runtime, and a separate program reads them before anything runs — install and run mypy, read an error by its file, line, message and bracketed error code, recognise and fix the missing-None bug that a green test suite routinely misses, use Optional, Union, TypeVar, Protocol, Literal, TypedDict, Final, NewType and cast at the depth real code needs them, narrow a union with a guard so the checker follows your reasoning, demonstrate for yourself that Any silently switches checking off, configure mypy in a pyproject.toml with strict mode and per-module overrides, use type: ignore responsibly with its error code, adopt the checker incrementally in an existing codebase, and state precisely which bug classes it cannot catch and why your tests are therefore not optional.'
objectives:
  - 'Explain the two-worlds model — that the interpreter evaluates annotations once and never compares a value against one, while a separate checker reads the same annotations before anything runs — and close the loop Day 69 deliberately left open'
  - 'Install mypy, run it over a file, and read an error correctly as file, line, message and bracketed error code, giving two reasons the code matters more than the prose'
  - 'Name and diagnose the five error codes that dominate real work — [union-attr], [arg-type], [return-value], [assignment] and [no-untyped-def] — from real captured output'
  - 'Recognise the Optional bug that a green test suite misses, and fix it by narrowing with a guard rather than by silencing the message'
  - 'Demonstrate that Any disables checking rather than describing a type, and explain why the hole spreads to every value that flows out of it'
  - 'Use builtin generics, unions, TypeVar generics, Protocol for structural typing of an injected dependency, Literal, TypedDict, Final, NewType and cast, each with a worked example'
  - 'Configure mypy in a [tool.mypy] table with strict, disallow_untyped_defs, warn_return_any and warn_unused_ignores, and use per-module overrides as a visible, shrinking adoption queue'
  - 'Use # type: ignore[code] responsibly, always with its error code, and explain what warn_unused_ignores protects a codebase from'
  - 'Explain how mypy gets type information for third-party code — typeshed, py.typed, stub packages — and why --ignore-missing-imports is a decision rather than a fix'
  - 'State the honest limits: mypy does not run your code, cannot catch a wrong algorithm, cannot verify values, and does not replace the tests of Days 071-074 — because types and tests catch different bug classes'
prerequisites:
  - 'Day 69: type annotations, X | None, builtin generics, and the proof that Python stores annotations without enforcing them'
  - 'Days 071-074: pytest, writing and running a test suite, fixtures and parametrization, and injecting dependencies to test at a boundary'
  - 'Day 70: modelling a domain with objects, including the value objects and repository shape this lab reuses'
  - 'Day 66: raising exceptions deliberately; Day 65: reading JSON with json.load'
  - 'Day 43: python3 -m venv and installing packages with pip'
