<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From optional to expected.">
  <title>Four steps in Python typing</title>
  <style>
    .typing-history-bg   { fill: #f8fafc; }
    .typing-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .typing-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .typing-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .typing-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .typing-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .typing-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .typing-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .typing-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .typing-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .typing-history-stage { opacity: 1; }

    .typing-history-s0 { animation-delay: 0.00s; }
    .typing-history-e0 { animation-delay: 0.00s; }
    .typing-history-s1 { animation-delay: 1.28s; }
    .typing-history-e1 { animation-delay: 1.28s; }
    .typing-history-s2 { animation-delay: 2.56s; }
    .typing-history-e2 { animation-delay: 2.56s; }
    .typing-history-s3 { animation-delay: 3.84s; }
    .typing-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .typing-history-conn  { animation: typing-history-trace 6.4s ease-in-out infinite; }
      .typing-history-stage { animation: typing-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes typing-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes typing-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .typing-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .typing-history-stage { animation: typing-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes typing-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="typing-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="typing-history-bg" width="980" height="322"/>
  <text class="typing-history-h1"  x="30" y="40">Four steps in Python typing</text>
  <text class="typing-history-sub" x="30" y="64">From optional to expected.</text>
  <g class="typing-history-stage typing-history-s0">
    <rect class="typing-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="typing-history-step" x="44" y="142">01</text>
    <text class="typing-history-name" x="70" y="142">Dynamically typed, with no annotations at all</text>
    <text class="typing-history-desc" x="44" y="166">Which suited scripts and hurt</text>
    <text class="typing-history-desc" x="44" y="182">large codebases.</text>
  </g>
  <line class="typing-history-line typing-history-conn typing-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#typing-history-tip)"/>
  <g class="typing-history-stage typing-history-s1">
    <rect class="typing-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="typing-history-step" x="280" y="142">02</text>
    <text class="typing-history-name" x="306" y="142">Then an annotation syntax with no semantics</text>
    <text class="typing-history-desc" x="280" y="166">Available for tools to use.</text>
  </g>
  <line class="typing-history-line typing-history-conn typing-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#typing-history-tip)"/>
  <g class="typing-history-stage typing-history-s2">
    <rect class="typing-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="typing-history-step" x="516" y="142">03</text>
    <text class="typing-history-name" x="542" y="142">Then checkers that gave it meaning</text>
    <text class="typing-history-desc" x="516" y="166">Optional, and gradual.</text>
  </g>
  <line class="typing-history-line typing-history-conn typing-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#typing-history-tip)"/>
  <g class="typing-history-stage typing-history-s3">
    <rect class="typing-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="typing-history-step" x="752" y="142">04</text>
    <text class="typing-history-name" x="778" y="142">And now most major libraries ship types</text>
    <text class="typing-history-desc" x="752" y="166">Which is what made it broadly</text>
    <text class="typing-history-desc" x="752" y="182">worthwhile.</text>
  </g>
  <text class="typing-history-sub" x="30" y="304">Library adoption was the tipping point: checking your own code is far less useful when every call into a dependency returns an unknown.</text>
</svg>
