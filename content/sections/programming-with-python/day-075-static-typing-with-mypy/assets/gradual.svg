<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How gradual typing works</title>
  <style>
    .gradual-bg   { fill: #f8fafc; }
    .gradual-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradual-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradual-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradual-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradual-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradual-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradual-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradual-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradual-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradual-stage { opacity: 1; }

    .gradual-s0 { animation-delay: 0.00s; }
    .gradual-e0 { animation-delay: 0.00s; }
    .gradual-s1 { animation-delay: 1.28s; }
    .gradual-e1 { animation-delay: 1.28s; }
    .gradual-s2 { animation-delay: 2.56s; }
    .gradual-e2 { animation-delay: 2.56s; }
    .gradual-s3 { animation-delay: 3.84s; }
    .gradual-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradual-conn  { animation: gradual-trace 6.4s ease-in-out infinite; }
      .gradual-stage { animation: gradual-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradual-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradual-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradual-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradual-stage { animation: gradual-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradual-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradual-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradual-bg" width="980" height="322"/>
  <text class="gradual-h1"  x="30" y="40">How gradual typing works</text>
  <text class="gradual-sub" x="30" y="64">Four steps.</text>
  <g class="gradual-stage gradual-s0">
    <rect class="gradual-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-step" x="44" y="142">01</text>
    <text class="gradual-name" x="70" y="142">Unannotated code is assumed to be anything</text>
    <text class="gradual-desc" x="44" y="166">So the checker stays silent.</text>
  </g>
  <line class="gradual-line gradual-conn gradual-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradual-tip)"/>
  <g class="gradual-stage gradual-s1">
    <rect class="gradual-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-step" x="280" y="142">02</text>
    <text class="gradual-name" x="306" y="142">Annotate a module and it is checked</text>
    <text class="gradual-desc" x="280" y="166">Without touching the rest.</text>
  </g>
  <line class="gradual-line gradual-conn gradual-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradual-tip)"/>
  <g class="gradual-stage gradual-s2">
    <rect class="gradual-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-step" x="516" y="142">03</text>
    <text class="gradual-name" x="542" y="142">Strictness can be raised per module</text>
    <text class="gradual-desc" x="516" y="166">Rather than repository-wide.</text>
  </g>
  <line class="gradual-line gradual-conn gradual-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradual-tip)"/>
  <g class="gradual-stage gradual-s3">
    <rect class="gradual-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradual-step" x="752" y="142">04</text>
    <text class="gradual-name" x="778" y="142">So start at the boundaries and work inward</text>
    <text class="gradual-desc" x="752" y="166">Where the return is highest.</text>
  </g>
  <text class="gradual-sub" x="30" y="304">Per-module strictness is what makes adoption practical in an existing codebase: you can require full annotation of new code without touching the old.</text>
</svg>
