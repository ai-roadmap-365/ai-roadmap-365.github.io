<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" font-family="system-ui, sans-serif">
  <title>How narrowing teaches a type checker, shown as one value moving through two versions of the same function. Both start from a parameter annotated str or None, about which the checker knows only that it is either a string or None, so it refuses any string method on it. On the left the guard is missing: the function goes straight to name.upper(), the checker's knowledge has not changed, and it reports an error on that exact line — Item None of str or None has no attribute upper, with the error code union-attr — pointing at the use, not at the definition. On the right the guard is present: an if name is None branch returns early, and from the line after it the checker knows the only possibility left is str, so name.upper() is accepted and the file checks clean. The bottom of the diagram records that assert isinstance and an early raise narrow in exactly the same way, and that narrowing is ordinary readable Python that also happens to be the proof the checker needs.</title>
  <rect x="0" y="0" width="1000" height="780" fill="#f8fafc"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">Narrowing: how a guard teaches the checker what it already told you</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#1a202c">The same value, the same annotation, two versions of one function.</text>

  <!-- shared start -->
  <rect x="270" y="84" width="460" height="112" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="500" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">def greet(name: str | None) -&gt; str:</text>
  <text x="500" y="140" text-anchor="middle" font-size="14" fill="#1a202c">what the checker knows about `name` right here:</text>
  <text x="500" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">str | None</text>
  <text x="500" y="188" text-anchor="middle" font-size="14" fill="#1a202c">so .upper() is refused — None does not have it</text>

  <line x1="400" y1="196" x2="270" y2="240" stroke="#1a202c" stroke-width="2"/>
  <polygon points="264,242 276,234 278,246" fill="#1a202c"/>
  <line x1="600" y1="196" x2="730" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="736,242 722,246 724,234" fill="#1d4ed8"/>

  <text x="255" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">NO GUARD</text>
  <text x="745" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">GUARDED</text>

  <!-- LEFT: no guard -->
  <rect x="40" y="262" width="410" height="82" fill="#fef9c3" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="245" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">line 8:  return name.upper()</text>
  <text x="245" y="316" text-anchor="middle" font-size="14" fill="#1a202c">nothing has taught the checker anything,</text>
  <text x="245" y="334" text-anchor="middle" font-size="14" fill="#1a202c">so `name` is still str | None here</text>

  <line x1="245" y1="344" x2="245" y2="376" stroke="#1a202c" stroke-width="2"/>
  <polygon points="245,382 239,370 251,370" fill="#1a202c"/>

  <rect x="40" y="392" width="410" height="176" fill="#fee2e2" stroke="#1a202c" stroke-width="3" rx="8"/>
  <text x="245" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">the error is reported HERE</text>
  <text x="56" y="450" font-size="14" fill="#1a202c">fin.py:8: error: Item "None" of</text>
  <text x="56" y="472" font-size="14" fill="#1a202c">"str | None" has no attribute</text>
  <text x="56" y="494" font-size="14" fill="#1a202c">"upper"  [union-attr]</text>
  <text x="245" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">line 8 — the use, not line 7, the definition</text>
  <text x="245" y="550" text-anchor="middle" font-size="14" fill="#1a202c">the annotation was fine; the missing guard was not</text>

  <!-- RIGHT: guarded -->
  <rect x="550" y="262" width="410" height="82" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="755" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">if name is None:</text>
  <text x="755" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">    return "(anonymous)"</text>
  <text x="755" y="336" text-anchor="middle" font-size="14" fill="#1a202c">one possibility is handled and left behind</text>

  <line x1="755" y1="344" x2="755" y2="376" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="755,382 749,370 761,370" fill="#1d4ed8"/>

  <rect x="550" y="392" width="410" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="755" y="420" text-anchor="middle" font-size="14" fill="#1a202c">what the checker knows on every line below:</text>
  <text x="755" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">str</text>
  <text x="755" y="470" text-anchor="middle" font-size="14" fill="#1a202c">the union has one member left</text>

  <line x1="755" y1="478" x2="755" y2="504" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="755,510 749,498 761,498" fill="#1d4ed8"/>

  <rect x="550" y="520" width="410" height="112" fill="#dcfce7" stroke="#1d4ed8" stroke-width="3" rx="8"/>
  <text x="755" y="548" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">return name.upper()</text>
  <text x="755" y="574" text-anchor="middle" font-size="14" fill="#1a202c">accepted, because .upper() exists on str</text>
  <text x="755" y="602" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Success: no issues found in 1 source file</text>
  <text x="755" y="622" text-anchor="middle" font-size="14" fill="#1a202c">and the None case now has real behaviour</text>

  <!-- bottom note -->
  <rect x="40" y="654" width="920" height="106" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="682" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The same mechanism, spelled three ways</text>
  <text x="500" y="708" text-anchor="middle" font-size="14" fill="#1a202c">if x is None: return · assert isinstance(x, str) · if not isinstance(x, dict): raise ValueError(...)</text>
  <text x="500" y="732" text-anchor="middle" font-size="14" fill="#1a202c">Each one removes a possibility, and the checker follows the control flow to see that it is gone.</text>
  <text x="500" y="752" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">You are not writing code for the checker. You are writing the case you forgot, and the checker noticed.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 400 196 L 270 240" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 600 196 L 730 240" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 245 344 L 245 376" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 755 344 L 755 376" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 755 478 L 755 504" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
