<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before building.">
  <title>Checking the drawings</title>
  <style>
    .blueprint-check-bg   { fill: #f8fafc; }
    .blueprint-check-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-check-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-check-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-check-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-check-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blueprint-check-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-check-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blueprint-check-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blueprint-check-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blueprint-check-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blueprint-check-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blueprint-check-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blueprint-check-row { opacity: 1; }
    .blueprint-check-r0 { animation-delay: 0.00s; }
    .blueprint-check-r1 { animation-delay: 0.45s; }
    .blueprint-check-r2 { animation-delay: 0.90s; }
    .blueprint-check-r3 { animation-delay: 1.35s; }
    .blueprint-check-r4 { animation-delay: 1.80s; }
    .blueprint-check-row { animation: blueprint-check-reveal 7.3s ease-in-out infinite; }
    @keyframes blueprint-check-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blueprint-check-bg" width="980" height="390"/>
  <text class="blueprint-check-h1"  x="30" y="40">Checking the drawings</text>
  <text class="blueprint-check-sub" x="30" y="64">Before building.</text>
  <rect class="blueprint-check-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-check-name" x="46" y="122">Checked beforehand</text>
  <text class="blueprint-check-desc" x="46" y="142">Cheap to fix.</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r0" x="46" y="182">Inconsistencies found on paper</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r1" x="46" y="216">Corrections cost minutes</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r2" x="46" y="250">Found before anything is built</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r3" x="46" y="284">Systematic, by rule</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r4" x="46" y="318">This is static checking</text>
  <rect class="blueprint-check-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blueprint-check-name" x="526" y="122">Found during building</text>
  <text class="blueprint-check-desc" x="526" y="142">Expensive to fix.</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r0" x="526" y="182">Inconsistencies found on site</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r1" x="526" y="216">Corrections cost days</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r2" x="526" y="250">Found after work has been done</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r3" x="526" y="284">Discovered by accident</text>
  <text class="blueprint-check-desc blueprint-check-row blueprint-check-r4" x="526" y="318">This is a runtime type error</text>
  <text class="blueprint-check-sub" x="30" y="372">The cost ratio between the columns is the whole argument, and it grows with how far the code has travelled before the error surfaces.</text>
</svg>
