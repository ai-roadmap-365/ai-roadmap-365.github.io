<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to the rules.">
  <title>How much modelling</title>
  <style>
    .domain-when-bg   { fill: #f8fafc; }
    .domain-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .domain-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .domain-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .domain-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .domain-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .domain-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .domain-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .domain-when-row { opacity: 1; }
    .domain-when-r0 { animation-delay: 0.00s; }
    .domain-when-r1 { animation-delay: 0.45s; }
    .domain-when-r2 { animation-delay: 0.90s; }
    .domain-when-r3 { animation-delay: 1.35s; }
    .domain-when-r4 { animation-delay: 1.80s; }
    .domain-when-row { animation: domain-when-reveal 7.3s ease-in-out infinite; }
    @keyframes domain-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="domain-when-bg" width="980" height="390"/>
  <text class="domain-when-h1"  x="30" y="40">How much modelling</text>
  <text class="domain-when-sub" x="30" y="64">Scaled to the rules.</text>
  <rect class="domain-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="domain-when-name" x="46" y="122">Model deliberately</text>
  <text class="domain-when-desc" x="46" y="142">Four signals.</text>
  <text class="domain-when-desc domain-when-row domain-when-r0" x="46" y="182">Real business rules that must hold</text>
  <text class="domain-when-desc domain-when-row domain-when-r1" x="46" y="216">Vocabulary the business already uses</text>
  <text class="domain-when-desc domain-when-row domain-when-r2" x="46" y="250">Rules that change over time</text>
  <text class="domain-when-desc domain-when-row domain-when-r3" x="46" y="284">Several people working on it</text>
  <text class="domain-when-desc domain-when-row domain-when-r4" x="46" y="318">Where invalid state would be costly</text>
  <rect class="domain-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="domain-when-name" x="526" y="122">Keep it light</text>
  <text class="domain-when-desc" x="526" y="142">Also four.</text>
  <text class="domain-when-desc domain-when-row domain-when-r0" x="526" y="182">Data passing through with no rules</text>
  <text class="domain-when-desc domain-when-row domain-when-r1" x="526" y="216">A script or a one-off</text>
  <text class="domain-when-desc domain-when-row domain-when-r2" x="526" y="250">Where records and functions suffice</text>
  <text class="domain-when-desc domain-when-row domain-when-r3" x="526" y="284">Where the domain is one person's head</text>
  <text class="domain-when-desc domain-when-row domain-when-r4" x="526" y="318">Structure you cannot justify is cost</text>
  <text class="domain-when-sub" x="30" y="372">Data passing through untouched needs no model at all, and building one for it adds indirection that every reader has to navigate for no return.</text>
</svg>
