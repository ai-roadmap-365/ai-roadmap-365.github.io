<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Identity decides.">
  <title>Entities against values</title>
  <style>
    .entity-value-bg   { fill: #f8fafc; }
    .entity-value-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entity-value-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entity-value-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entity-value-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entity-value-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entity-value-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .entity-value-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .entity-value-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .entity-value-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .entity-value-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .entity-value-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .entity-value-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .entity-value-row { opacity: 1; }
    .entity-value-r0 { animation-delay: 0.00s; }
    .entity-value-r1 { animation-delay: 0.45s; }
    .entity-value-r2 { animation-delay: 0.90s; }
    .entity-value-r3 { animation-delay: 1.35s; }
    .entity-value-r4 { animation-delay: 1.80s; }
    .entity-value-row { animation: entity-value-reveal 7.3s ease-in-out infinite; }
    @keyframes entity-value-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="entity-value-bg" width="980" height="390"/>
  <text class="entity-value-h1"  x="30" y="40">Entities against values</text>
  <text class="entity-value-sub" x="30" y="64">Identity decides.</text>
  <rect class="entity-value-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="entity-value-name" x="46" y="122">An entity</text>
  <text class="entity-value-desc" x="46" y="142">Has identity.</text>
  <text class="entity-value-desc entity-value-row entity-value-r0" x="46" y="182">The same thing over time, though it changes</text>
  <text class="entity-value-desc entity-value-row entity-value-r1" x="46" y="216">Equality is by identifier</text>
  <text class="entity-value-desc entity-value-row entity-value-r2" x="46" y="250">Usually mutable</text>
  <text class="entity-value-desc entity-value-row entity-value-r3" x="46" y="284">A customer, an order, an account</text>
  <text class="entity-value-desc entity-value-row entity-value-r4" x="46" y="318">Tracked and persisted</text>
  <rect class="entity-value-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="entity-value-name" x="526" y="122">A value object</text>
  <text class="entity-value-desc" x="526" y="142">Is its contents.</text>
  <text class="entity-value-desc entity-value-row entity-value-r0" x="526" y="182">Two with the same values are the same</text>
  <text class="entity-value-desc entity-value-row entity-value-r1" x="526" y="216">Equality is by value</text>
  <text class="entity-value-desc entity-value-row entity-value-r2" x="526" y="250">Ideally immutable</text>
  <text class="entity-value-desc entity-value-row entity-value-r3" x="526" y="284">A money amount, a date range, an address</text>
  <text class="entity-value-desc entity-value-row entity-value-r4" x="526" y="318">Freely copied and shared</text>
  <text class="entity-value-sub" x="30" y="372">Getting this distinction wrong produces the classic bug of two equal-looking records that are not equal, or one shared value object mutated in several places at once.</text>
</svg>
