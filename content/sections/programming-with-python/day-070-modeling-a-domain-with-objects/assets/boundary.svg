<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The boundary</title>
  <style>
    .boundary-bg   { fill: #f8fafc; }
    .boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boundary-stage { opacity: 1; }

    .boundary-s0 { animation-delay: 0.00s; }
    .boundary-e0 { animation-delay: 0.00s; }
    .boundary-s1 { animation-delay: 1.28s; }
    .boundary-e1 { animation-delay: 1.28s; }
    .boundary-s2 { animation-delay: 2.56s; }
    .boundary-e2 { animation-delay: 2.56s; }
    .boundary-s3 { animation-delay: 3.84s; }
    .boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boundary-conn  { animation: boundary-trace 6.4s ease-in-out infinite; }
      .boundary-stage { animation: boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boundary-stage { animation: boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boundary-bg" width="980" height="322"/>
  <text class="boundary-h1"  x="30" y="40">The boundary</text>
  <text class="boundary-sub" x="30" y="64">Four properties.</text>
  <g class="boundary-stage boundary-s0">
    <rect class="boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-step" x="44" y="142">01</text>
    <text class="boundary-name" x="70" y="142">The model holds the rules and the vocabulary</text>
    <text class="boundary-desc" x="44" y="166">And nothing about storage or</text>
    <text class="boundary-desc" x="44" y="182">transport.</text>
  </g>
  <line class="boundary-line boundary-conn boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boundary-tip)"/>
  <g class="boundary-stage boundary-s1">
    <rect class="boundary-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-step" x="280" y="142">02</text>
    <text class="boundary-name" x="306" y="142">With a small number of entry points</text>
    <text class="boundary-desc" x="280" y="166">Rather than every object</text>
    <text class="boundary-desc" x="280" y="182">reachable from outside.</text>
  </g>
  <line class="boundary-line boundary-conn boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boundary-tip)"/>
  <g class="boundary-stage boundary-s2">
    <rect class="boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-step" x="516" y="142">03</text>
    <text class="boundary-name" x="542" y="142">Persistence, serialisation and interfaces stay outside</text>
    <text class="boundary-desc" x="516" y="166">Which keeps the model portable.</text>
  </g>
  <line class="boundary-line boundary-conn boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boundary-tip)"/>
  <g class="boundary-stage boundary-s3">
    <rect class="boundary-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-step" x="752" y="142">04</text>
    <text class="boundary-name" x="778" y="142">So the rules can be tested with no infrastructure</text>
    <text class="boundary-desc" x="752" y="166">Which is the point.</text>
  </g>
  <text class="boundary-sub" x="30" y="304">Testing the rules with no database is the practical dividend, and it is what makes a domain model worth separating rather than merging into the storage layer.</text>
</svg>
