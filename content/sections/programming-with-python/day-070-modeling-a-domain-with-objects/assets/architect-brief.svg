<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Whose vocabulary wins.">
  <title>Describing a building, or its drawings</title>
  <style>
    .architect-brief-bg   { fill: #f8fafc; }
    .architect-brief-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architect-brief-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architect-brief-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architect-brief-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architect-brief-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .architect-brief-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architect-brief-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .architect-brief-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .architect-brief-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .architect-brief-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .architect-brief-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .architect-brief-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .architect-brief-row { opacity: 1; }
    .architect-brief-r0 { animation-delay: 0.00s; }
    .architect-brief-r1 { animation-delay: 0.45s; }
    .architect-brief-r2 { animation-delay: 0.90s; }
    .architect-brief-r3 { animation-delay: 1.35s; }
    .architect-brief-r4 { animation-delay: 1.80s; }
    .architect-brief-row { animation: architect-brief-reveal 7.3s ease-in-out infinite; }
    @keyframes architect-brief-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="architect-brief-bg" width="980" height="390"/>
  <text class="architect-brief-h1"  x="30" y="40">Describing a building, or its drawings</text>
  <text class="architect-brief-sub" x="30" y="64">Whose vocabulary wins.</text>
  <rect class="architect-brief-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="architect-brief-name" x="46" y="122">The domain's words</text>
  <text class="architect-brief-desc" x="46" y="142">Recognisable.</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r0" x="46" y="182">Order, invoice, shipment, refund</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r1" x="46" y="216">The business can read and correct it</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r2" x="46" y="250">Rules stated in their terms</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r3" x="46" y="284">Survives a change of technology</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r4" x="46" y="318">This is a domain model</text>
  <rect class="architect-brief-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="architect-brief-name" x="526" y="122">The implementation's words</text>
  <text class="architect-brief-desc" x="526" y="142">Opaque.</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r0" x="526" y="182">Record, row, handler, payload</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r1" x="526" y="216">Only programmers can check it</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r2" x="526" y="250">Rules buried in procedure</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r3" x="526" y="284">Changes when the storage does</text>
  <text class="architect-brief-desc architect-brief-row architect-brief-r4" x="526" y="318">This is a data-first model</text>
  <text class="architect-brief-sub" x="30" y="372">The business being able to read and correct the model is the test that matters, because they are the only people who know whether the rules are right.</text>
</svg>
