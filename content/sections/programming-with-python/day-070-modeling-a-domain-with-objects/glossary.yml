terms:
  - term: 'Domain'
    definition: 'The slice of the real world a program is about — gym memberships, spending, appointments, a document index. The domain is what the rules describe, before any decision about code.'
  - term: 'Domain model'
    definition: 'A set of objects and rules that mirror a domain closely enough that the code reads like the problem: meaningful types, rules living with the data they constrain, and a boundary separating them from files and screens.'
  - term: 'Ubiquitous language'
    definition: 'The shared vocabulary of the domain expert and the code. If the owner says member, plan, tier and check in, the code says Member, Plan, PlanTier and check_in — every translation between the two vocabularies is a place a misunderstanding can hide.'
  - term: 'Entity'
    definition: 'An object with an identity and a life cycle: it stays the same thing even after every one of its values changes. Identified by an identity field, compared on that field, and usually mutable — a Member, a Ledger.'
  - term: 'Value object'
    definition: 'An object defined entirely by its values, so two with identical values are interchangeable. Immutable (a frozen dataclass in Python), compared and hashed by value — Money, DateRange, a membership number.'
  - term: 'Invariant'
    definition: 'A sentence that must be true of a valid model at all times, such as "an expense amount is positive". Every invariant needs a named enforcement point; a rule with no enforcement point is a hope, not a rule.'
  - term: '__post_init__'
    definition: 'The method a dataclass calls after its generated initializer has assigned the fields. It is the standard place to validate a value object, raising a domain exception before any invalid instance can escape.'
  - term: 'Pure domain core'
    definition: 'The module holding the types and rules, importing nothing that performs input or output — no json, pathlib, open, print or input. Because it cannot touch the world, its rules can be tested from an empty directory.'
  - term: 'Adapter'
    definition: 'Code at the edge that connects the pure core to the outside world: a command-line front end, a repository, a report printer. Adapters import the core; the core imports no adapter, so every dependency points inward.'
  - term: 'Repository'
    definition: 'The one object that knows how a model is stored, with save and load as its public surface plus private translators between domain shape and file shape. Swapping CSV for JSON or SQLite means writing one new repository class.'
  - term: 'Domain exception hierarchy'
    definition: 'A family of exceptions with a single base class — for example SpendError — raised whenever a domain rule is refused, so an adapter can catch one type, know it is holding a broken rule rather than a bug, and translate it into a human message.'
  - term: 'Anemic domain model'
    definition: 'A design in which classes hold data only while every rule lives in loose functions elsewhere. Named by Martin Fowler in 2003; the harm is that each new caller can forget a check. Field classes plus pure functions are fine in Python provided invariants are still enforced at construction.'
  - term: 'Primitive obsession'
    definition: 'Representing domain concepts with built-in types — a float for money, a string for a date or a category — so there is nowhere to put validation and wrong values pass silently. The fix is one meaningful type per concept.'
  - term: 'Stringly typed'
    definition: 'Using plain strings for values that belong to a closed set, such as a status, a role or a tier, so a typo is accepted where it is written and fails somewhere far away. enum.Enum makes the typo impossible.'
  - term: 'God object'
    definition: 'A single class that parses, validates, calculates, formats and prints. It cannot be described in one sentence, cannot be tested in parts, and every change touches it. The remedy is to split by responsibility and push the world to the adapters.'
