visuals:
  - id: domain-model-architecture
    file: assets/domain-model-architecture.svg
    type: diagram
    title: 'A domain model and its boundaries'
    alt: 'Diagram: a domain model and its boundaries — a pure domain core of value objects, closed sets, entities and domain errors in the middle, surrounded by an adapter ring holding the command-line interface, the repository, its CSV, JSON and SQLite file formats, and the test harness, with every dependency arrow pointing inward'
    description: 'A layered architecture drawn as a ring around a core. The middle holds the pure domain core — value objects (Money, DateRange), closed sets (Category as an Enum), entities (Expense, Ledger) and the SpendError hierarchy — with the note that every invariant is enforced there and that the module imports nothing that performs input or output. Surrounding it is the adapter ring: a command-line adapter on the left edge that reads arguments, prints the report, picks the exit code and turns errors into words; a repository adapter on the right edge exposing save and load and rebuilding values through the core; the CSV, JSON and SQLite file formats one layer further out on that same edge; and a test harness on the bottom edge that calls the core and creates no files. Every dependency arrow points inward, because the core imports nothing from the ring.'
  - id: noun-to-model-flow
    file: assets/noun-to-model-flow.svg
    type: flowchart
    title: 'From sentences to a tested model'
    alt: 'Flowchart: the modelling method in seven steps — write the domain in plain sentences, underline the nouns and verbs, classify each noun as an entity or a value object, name every invariant and its enforcement point, draw the boundary between the pure core and its adapters, write the classes, and test the core with no files present'
    description: 'A seven-step vertical flow, each step annotated with a concrete example from the spending tracker. Step one: write the domain in plain sentences, in the expert''s own words. Step two: underline the nouns and the verbs, so nouns become types and verbs become methods. Step three: classify each noun as an entity or a value object by asking whether it has a life story or is only its values. Step four: name every invariant in one sentence and say exactly where it is enforced, such as an amount being positive enforced in __post_init__. Step five: draw the boundary, pure core inside and adapters outside, with the core importing no json, no pathlib and no print. Step six: write the classes as frozen dataclasses, enums and a small hierarchy — a transcript of steps one to five. Step seven: test the core with no files present; if that is hard, the boundary leaked.'
