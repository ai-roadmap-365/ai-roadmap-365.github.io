questions:
  - question: 'Which question best decides that a noun should be modelled as an entity rather than a value object?'
    options:
      - 'Does it have more than three fields?'
      - 'Will it ever be written to a file?'
      - 'Would it still be the same thing if every value changed?'
      - 'Does it appear more than once in the requirements list?'
    answer_index: 2
    explanation: 'Identity is the test. If a member keeps their name changed, their plan switched and fifty check-ins added and is still the same member, the thing has a life cycle and an identity — an entity. Field count, storage and frequency have nothing to do with it. The mirror question settles value objects: two of them with identical values would be interchangeable, so they are defined entirely by their values.'

  - question: 'Why does a value object such as Money get written as a frozen dataclass?'
    options:
      - 'Because freezing is required before an object can be written to JSON'
      - 'Because frozen dataclasses are faster to construct than mutable ones'
      - 'Because only frozen dataclasses can define __post_init__'
      - 'It must be compared by value and never drift after validation'
    answer_index: 3
    explanation: 'A value object IS its values, so it needs value equality — which a dataclass generates — and it must not change after construction, or the validation done in __post_init__ would no longer be true. Freezing gives both. It is not a speed feature, __post_init__ works on any dataclass, and JSON serialisation is entirely unrelated.'

  - question: 'A rule says "every expense in a ledger must be in the ledger''s currency." Where does that invariant belong?'
    options:
      - 'In Ledger.record — the only place that sees both'
      - 'In the command-line adapter, just before the expense is created'
      - 'In the CSV importer, because that is where most expenses come from'
      - 'In Money.__post_init__, because the rule mentions currency'
    answer_index: 0
    explanation: 'The rule spans two objects, so it must be enforced where both are visible — the service method on the object that owns the collection. Money cannot see the ledger. Enforcing it in an adapter or an importer means every other path into the ledger can bypass it, which is exactly how invariants quietly stop holding.'

  - question: 'What is the practical argument for storing money as whole integer cents rather than as a float?'
    options:
      - 'Summing floats always accumulates error, so float totals are always wrong'
      - 'You cannot predict which float sums drift; integers are exact'
      - 'Floats cannot represent values above about one million, so large totals overflow'
      - 'The dataclasses module refuses to store a float in a frozen field'
    answer_index: 1
    explanation: 'The honest version matters. Some float sums are exact: sum(0.10 for _ in range(10)) really is 1.0. But 0.1 + 0.2 is 0.30000000000000004, and you cannot tell in advance which of your users'' numbers will land badly. A representation whose correctness depends on which values arrive is indefensible in a financial report; integers add exactly, every time, so the question never comes up.'

  - question: 'What is an "anemic domain model"?'
    options:
      - 'A model with too few classes to express the problem'
      - 'A model whose classes all inherit from one abstract base'
      - 'Classes holding data only, with rules in loose functions'
      - 'A model that keeps its data in a database rather than in memory'
    answer_index: 2
    explanation: 'Martin Fowler named this in 2003: it looks object-oriented — there are classes with fields — but the objects hold no behaviour, so every rule sits in separate procedures and every new caller can forget one. Note the Python qualification: frozen dataclasses plus pure functions are a fine design, provided the invariants are still enforced at construction so an invalid object cannot exist at all.'

  - question: 'What does a repository object buy you?'
    options:
      - 'It guarantees that saving is faster than writing the file directly'
      - 'It makes the domain objects serialise themselves automatically'
      - 'It removes the need to validate data that is read back from disk'
      - 'Every storage decision lives in one class'
    answer_index: 3
    explanation: 'A repository is the single place that knows how the model is stored, with save and load as its whole public surface. Change the format and you rewrite one class. It does not remove the need for validation — quite the opposite: load rebuilds every value through the domain constructors, which is what makes a hand-edited file fail loudly instead of poisoning the model.'

  - question: 'Why should a closed set such as a plan tier or an expense category be an enum.Enum rather than a string?'
    options:
      - 'A typo raises at once, and legal values live in one place'
      - 'Only enums can be used as dictionary keys'
      - 'Enums use less memory than strings'
      - 'Enums serialise to JSON automatically while strings do not'
    answer_index: 0
    explanation: 'With a string, "groserys" is accepted, stored, written to the file, and surfaces months later as a category no report shows. With an enum, Category("groserys") raises ValueError at the moment the typo is written, and the set of legal values exists once instead of being scattered through comparisons. Strings are perfectly usable as dict keys, and enums need explicit conversion for JSON.'

  - question: 'Which of these is the clearest sign that the boundary between the domain core and its adapters has leaked?'
    options:
      - 'The core module is longer than the adapter modules'
      - 'A test of a domain rule cannot run without creating a file'
      - 'Two different classes both raise the same exception type'
      - 'A value object defines both __eq__ and __hash__'
    answer_index: 1
    explanation: 'The whole point of a pure core is that a rule can be exercised with one call in and one value or refusal out, from an empty directory. The moment a rule test needs a fixture on disk, some part of the core is touching the world — an import of json or pathlib, an open, or a print. Core length, shared exception types and value-object hashing are all normal and say nothing about the boundary.'
