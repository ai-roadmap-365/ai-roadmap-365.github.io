id: D091
day: 91
slug: designing-and-querying-a-real-schema
title: 'Designing and Querying a Real Schema'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to take a paragraph of prose from somebody who has never heard the word "schema" and turn it into a running database that answers real questions — mapping each phrase to an entity, an attribute, a relationship or something derived; choosing a surrogate primary key while keeping the natural key as a UNIQUE constraint, and naming the three failure modes of getting that backwards; recognising when a many-to-many junction table has earned columns of its own; storing dates as ISO 8601 text in UTC and money as integer minor units, and saying exactly what each choice buys; deciding between a CHECK constraint and a lookup table for an enumeration; making every nullable column a decision with a stated meaning; weighing soft delete against hard delete and paying its query cost honestly; refusing to store derived data, having watched a stored queue position break in three ordinary statements with no error raised; and then answering the questions the design exists for with scalar and correlated subqueries, EXISTS against IN against a join, common table expressions including a recursive one over a genuine hierarchy, window functions for the top-N-per-group problem that GROUP BY cannot solve, and views — before wrapping the whole thing in a repository class that prints a report a person would actually read.'
objectives:
  - 'Map a paragraph of requirements to entities, attributes, relationships and derived values, using the three-part test for whether something is an entity rather than an attribute'
  - 'Choose a surrogate primary key while keeping the natural key as a UNIQUE constraint, and argue both sides — including the three failure modes of a natural primary key: it changes, it is sometimes absent, and it is sometimes mistyped'
  - 'Recognise when a many-to-many junction table needs an attribute of its own, and the signal that tells you the junction has actually become an entity'
  - 'Store timestamps as ISO 8601 text in UTC in a database with no date type, name the three properties that earn the format, and use it to write an ordering CHECK constraint the format makes possible'
  - 'Store money as an integer count of minor units, demonstrate in SQLite why a float will not do, and place the division by 100 at the display edge and nowhere else'
  - 'Decide between a CHECK constraint and a lookup table for an enumeration, and justify using both in one schema for different sets of values'
  - 'Make every nullable column a decision with a stated meaning — unknown, not applicable, top of the tree, not yet — and reject the boolean that duplicates a date'
  - 'Implement soft delete, state its cost exactly as a per-query obligation, and show that which soft-delete filter applies is a property of the question rather than of the table'
  - 'Identify derived data and refuse to store it, having reproduced a stored queue position breaking silently in three ordinary statements, then revise the design to derive it with ROW_NUMBER'
  - 'Write scalar and correlated subqueries, and choose between EXISTS, IN and a join by what each returns, what each can multiply, and the NULL trap in NOT IN'
  - 'Use a common table expression to make an unreadable query readable, and a recursive CTE to answer a hierarchical question no fixed number of joins can reach'
  - 'Use ROW_NUMBER, RANK and SUM ... OVER, state precisely what a window function does that GROUP BY cannot, and explain why a top-N-per-group query has to be written in two steps'
  - 'Create a view and describe honestly what it buys — a name and consistency — and what it does not buy, which is speed'
  - 'Build the report through a repository class with every value bound, and make the report instant a parameter with a default rather than a clock reading, so the output is reproducible and testable'
  - 'Compare doing this work by hand, with a modelling tool, in PostgreSQL with real types, through an ORM, and by keeping the data in JSON files — with when to choose each and what each costs'
prerequisites:
  - 'Day 85 — the relational model, tables, types, and SQLite from the shell and from Python'
  - 'Day 86 — SELECT with WHERE, ORDER BY, GROUP BY, HAVING and aggregates, and NULL''s three-valued logic, which the NOT IN trap and the count(*) trap both depend on'
  - 'Day 87 — primary and foreign keys, one-to-many and many-to-many, LEFT JOIN, the anti-join idiom, and PRAGMA foreign_keys being off by default'
  - 'Day 88 — INSERT and UPDATE, transactions, CHECK and UNIQUE constraints, normalization, and migrations — which is what makes a schema changeable rather than permanent'
  - 'Day 89 — indexes, EXPLAIN QUERY PLAN, and the habit of measuring rather than guessing'
  - 'Day 90 — SQLite from Python, parameter binding, and the repository pattern the report is built on'
  - 'Day 70 — floating point, which is the reason money is an integer count of pence here'
  - 'Day 43 — a working python3 on your PATH; the lab needs the standard library only'
