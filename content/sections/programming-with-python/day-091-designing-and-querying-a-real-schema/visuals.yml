visuals:
  - id: requirements-to-report-flow
    file: assets/requirements-to-report-flow.svg
    type: flow-animated
    title: 'From a sentence of requirements to a row in a printed report, in six stages'
    alt: 'Diagram: one sentence of requirements travelling through six stages — the requirement in English, the entities it implies, the logical schema, the physical schema with constraints and indexes, the query that asks it back, and one row of the printed report — with the concrete artifact drawn at every stage'
    description: 'An animated flow diagram in six stages, laid out as two rows of three, and readable in full as a still image. One sentence from the library brief is carried the whole way, and the artifact it has become is written out concretely at every stage. Stage one is the requirement in English: some books have more than one author, the order matters because the cover credits them in a particular order, and it is noted that two facts are hiding in that sentence rather than one. Stage two names what it implies: BOOK is an entity, AUTHOR is an entity, credited-in is a relationship, the cardinality is many books to many authors, and the test for an entity is given — does it exist before, and after, the thing that mentions it. Stage three is the logical schema: books, authors, and a book_authors table holding book_id, author_id and author_position, with the note that the key is the pair and that the credit order is an attribute of the relationship rather than of either side. Stage four is the physical schema: PRIMARY KEY on the pair, author_position declared INTEGER NOT NULL with a check that it is at least one, a UNIQUE constraint on book and position, and a CREATE INDEX statement on the author column with the reminder that a foreign key creates no index. Stage five is the query: SELECT of the title, a count and group_concat of the names, joining books to book_authors to authors, grouped by book with HAVING count greater than one, annotated that a junction needs two JOINs because it is two relationships. Stage six is one row of the printed report, drawn in a green-outlined box: The C Programming Language, two authors, Brian W. Kernighan and Dennis M. Ritchie, with a note that the credit order in that line traces back to the column added at stage three because of the second half of stage one. A blue token travels along a marching-dash wire from stage one across the top row, down the right-hand side, back along the middle of the diagram and across the bottom row, and each stage lights up briefly as the token reaches it, with the report row emphasised last. A prefers-reduced-motion block stops every animation and restores the resting state, in which all six stages are shaded, all three wires are drawn, all six artifacts are written out and the token sits at stage one. Two closing lines give the review checklist: read it backwards, and every column at stage four should trace to a sentence at stage one while every question at stage six should be answerable from stage four alone.'
  - id: library-schema-architecture
    file: assets/library-schema-architecture.svg
    type: diagram
    title: 'The finished library schema: seven tables, their keys, constraints, indexes and cardinalities'
    alt: 'Diagram: the finished library schema with seven tables — categories referencing itself, books, authors, the book_authors junction keyed on the pair with its own author_position column, members, loans and reservations — showing primary keys, unique constraints, foreign keys, check constraints, nullable and soft-delete columns, the cardinality of every relationship, and the nine indexes'
    description: 'A static entity-relationship diagram of the schema the lesson designs from the Fenwick Road brief, with a legend stating that PK marks a primary key, UQ a unique constraint, FK a foreign key, CK a check constraint and IX an indexed column, and that orange marks a nullable column whose NULL means something specific. Across the top sit categories, with category_id, name and a nullable parent_id, and a green arrow looping from the table back into itself under a note explaining that parent_id points at another category, making a tree walked by a recursive CTE; and authors, with author_id, name and a nullable birth_year marked as meaning unknown. In the middle sit books — book_id marked as a surrogate key, isbn13 marked unique, checked and nullable because books printed before 1970 have none, title, published_year, an indexed category_id foreign key, acquisition_cost_pence declared INTEGER, and withdrawn_at marked as a soft delete — and the book_authors junction table, drawn with a heavier blue outline, listing book_id and author_id each marked both PK and FK and author_position marked unique per book. Arrows run from the junction table to books and to authors, each labelled many to one, under a caption saying that books and authors are many-to-many and that a junction table is two one-to-many relationships back to back, and two notes recording that the primary key is the pair so the same author cannot be credited twice, that author_position is the relationship own attribute, and that the delete behaviour is CASCADE towards books and RESTRICT towards authors. Along the bottom sit members — member_id, a unique email described as the natural key, full_name, a checked tier of three values, joined_at, and left_at marked as a soft delete — loans, with loan_id, indexed foreign keys to books and members both marked RESTRICT, borrowed_at and due_at in ISO 8601 UTC with a check that due_at is later, returned_at marked as meaning still out when NULL, and fine_pence declared INTEGER and checked non-negative — and reservations, with reservation_id, indexed cascading foreign keys to books and members, reserved_at, and a checked status of four values. Arrows run from loans to books and to members, and from reservations to books and to members, every one labelled many to one. A panel across the foot lists the nine indexes and explains that a foreign key creates none, naming the seven foreign-key indexes plus the partial index on outstanding loans and the partial unique index on waiting reservations; records that two views, current_collection and current_members, name the soft-delete filters and that a view stores the query text rather than its result; and states that reservations has no queue_position column because the position is derived at query time with ROW_NUMBER over reserved_at, a stored one having to be renumbered on every cancellation forever, in every code path, which is a promise the database cannot enforce and therefore not a promise.'
