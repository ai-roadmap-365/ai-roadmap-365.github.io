questions:
  - question: 'A library catalogue stores books, and the ISBN uniquely identifies an edition. Should the ISBN be the primary key of the books table?'
    options:
      - 'Yes — it is a genuine natural key assigned by an external authority, so it is exactly what a primary key is for'
      - 'No — use a surrogate key and keep the ISBN UNIQUE'
      - 'No — natural keys should never appear in a schema at all, so the ISBN should be dropped'
      - 'It makes no difference in SQLite, because every table has a rowid regardless'
    answer_index: 1
    explanation: 'The argument for the natural key is real: no extra column, child rows readable without a join, and uniqueness that exists in the world rather than merely being asserted. It loses anyway, for three reasons that recur in every domain. Natural keys change — a publisher reissues with a new ISBN, and every child row referencing the old one has to be updated in lockstep or the reference stops resolving. Natural keys are sometimes absent — Frankenstein was printed in 1818 and has no ISBN, and a primary key cannot be NULL, so one such book kills the design. And natural keys are sometimes wrong — catalogue staff mistype thirteen digits, and correcting one character becomes a cascade. The answer is not to discard the natural key, which is option 2 and throws away a real integrity guarantee: it is a surrogate primary key plus UNIQUE on the natural one, which gets stability and uniqueness both. Option 3 confuses storage with design — SQLite does alias INTEGER PRIMARY KEY to the rowid, but the choice of what other tables reference is entirely a design decision.'

  - question: 'You have books and authors in a many-to-many relationship, and the brief says the cover credits the authors in a particular order which you must preserve. Where does the credit order belong?'
    options:
      - 'On the authors table, as a position column'
      - 'On the books table, as a comma-separated list of author names in order'
      - 'On the book_authors junction table, as an author_position column'
      - 'Nowhere — the order can be recovered from the order the rows were inserted'
    answer_index: 2
    explanation: 'The test is: is this fact about the left thing, the right thing, or the pairing? Brian W. Kernighan is not "second" in any absolute sense — he is second on The C Programming Language and first on The Practice of Programming. The fact belongs to the pairing, so it has nowhere to live but the junction table. That is the whole point of the exercise: a junction table is not always a pure link of two foreign keys, and the moment the relationship itself acquires an attribute, the junction earns a column. Option 0 would give one author a single global position, which is meaningless. Option 1 destroys the relationship entirely and makes "which authors have never been borrowed?" unanswerable rather than merely slow. Option 2 is the most dangerous, because it appears to work: SQL makes no promise about the order rows come back in without an ORDER BY, and the first time a row is updated or the table is rebuilt the order can change with no error.'

  - question: 'SQLite has no date type. The lesson stores timestamps as ISO 8601 text in UTC — for example 2026-08-05T13:00:00Z. Which constraint does that format make possible?'
    options:
      - 'Automatic conversion to the reader''s local time zone on SELECT'
      - 'A foreign key from due_at to a calendar table'
      - 'An index on due_at, which text columns otherwise cannot have'
      - 'CHECK (due_at > borrowed_at) — the format sorts chronologically'
    answer_index: 3
    explanation: 'ISO 8601 puts the fields in most-significant-first order at fixed widths, so comparing two such strings character by character gives the same answer as comparing the two instants. That is a design choice in the standard, not a coincidence, and it is the property that makes a plain text column behave like a date for ordering, ranges, MIN, MAX and — as here — a table-level CHECK constraint that enforces chronology. The format decision therefore pays for itself immediately in integrity rather than being cosmetic. Option 2 is wrong: any column can be indexed. Option 3 is wrong and is the reason UTC matters — nothing converts anything, which is exactly why you store one unambiguous instant and convert only at the display edge. Time zones, daylight saving and the difference between an instant and a calendar date are genuinely harder than this, and Day 95 treats them properly; ISO 8601 in UTC is the right default, not the whole subject.'

  - question: 'A membership tier is one of standard, student or staff, and has been for a decade. Book categories are added, renamed and moved between parents several times a year. How should each be modelled?'
    options:
      - 'Tier as a CHECK constraint; categories as a table, and in fact as a self-referencing tree'
      - 'Both as lookup tables with foreign keys, since that is the normalized answer'
      - 'Tier as a lookup table; categories as a CHECK constraint listing every category name'
      - 'Both as CHECK constraints, since both are fixed sets of strings'
    answer_index: 0
    explanation: 'The rule is about how the set behaves rather than about what it looks like. Use a CHECK when the set is small, closed, and changes about as often as the code does — it costs one line and no join, and adding a value is a migration, which is fine when that happens once a decade. Use a lookup table when the set will grow, when values are chosen by an administrator at runtime rather than by a developer in a deployment, or when a value needs facts of its own such as a display label or a loan allowance. Three membership tiers are the first case. Categories are the second, and they go further: because a category can contain another category, they are not a flat lookup table but a tree, modelled with a nullable self-referencing parent_id and walked with a recursive CTE. Option 1 is the reflex answer that treats normalization as a score rather than a tool; option 2 has both backwards, and a CHECK listing every category name would need a migration every time somebody added a shelf.'

  - question: 'You need the two most active borrowers within each membership tier — names and counts, not just the maximum. Why can a plain GROUP BY not do this?'
    options:
      - 'GROUP BY cannot be combined with ORDER BY on an aggregate'
      - 'Aggregation collapses rows; a window function does not'
      - 'GROUP BY cannot be used with a LEFT JOIN, which this query needs'
      - 'It can, but only if you add HAVING count(*) <= 2'
    answer_index: 1
    explanation: 'This is the top-N-per-group problem, and it is the clearest single reason window functions exist. GROUP BY tier gives you one row per tier — the lab measures this: three rows, where the answer needs five. It can tell you the maximum loan count in each tier, but the rows that produced that count have already been collapsed, so there is no name attached to it and no way to ask for the second one as well. ROW_NUMBER() OVER (PARTITION BY tier ORDER BY loan_count DESC) computes a rank across the partition while leaving every row and every column intact, so the outer query can then filter to position <= 2. That filtering has to happen in an outer query rather than in WHERE, because a window function is computed after WHERE and after GROUP BY — which is why the query is written as two CTEs. Option 3 is a common guess and does nothing, since HAVING filters groups by aggregate value, not rows by rank.'

  - question: 'Members can reserve a book that is on loan, and are served in the order they asked. Should the reservations table store a queue_position column?'
    options:
      - 'Yes, and keep it correct by renumbering the remaining rows whenever a reservation is cancelled'
      - 'Yes, because deriving it on every query would be too slow to be practical'
      - 'No — it is derived from reserved_at and status, so compute it at query time with ROW_NUMBER'
      - 'No — store the reservations in insertion order instead and rely on rowid'
    answer_index: 2
    explanation: 'queue_position is a function of two columns that are already stored, which makes it derived data. Storing derived data means promising to recompute it everywhere either input changes, forever, in every code path that will ever exist — including ones written next year by somebody who has not read your schema. The database cannot enforce that promise, so it is not a promise, it is a hope. The lab demonstrates it breaking in three ordinary statements with no error raised: a member at position 2 cancels and is not renumbered, so the queue reads 1, 3; then a new member is appended at "count of waiting plus one", which is 3, and two people are now at position 3 with nobody at position 2. ROW_NUMBER() OVER (PARTITION BY book_id ORDER BY reserved_at) over the waiting rows is correct by construction, because there is nothing stored to be wrong. Option 0 is exactly the design that failed. Option 3 relies on rowid ordering, which SQL does not promise and which says nothing about cancelled rows.'

  - question: 'Which construct best answers "which current members have never borrowed anything", and why?'
    options:
      - 'WHERE member_id NOT IN (SELECT member_id FROM loans), because it reads most like the English'
      - 'An INNER JOIN to loans with a count of zero'
      - 'A CROSS JOIN filtered afterwards'
      - 'NOT EXISTS — it cannot multiply rows and ignores NULLs'
    answer_index: 3
    explanation: 'All of NOT EXISTS, NOT IN and the LEFT JOIN ... IS NULL idiom give the right answer on clean data, and the lab asserts that the first and third agree exactly. NOT EXISTS is the one to reach for by default. It expresses a boolean question rather than building a list, it stops at the first matching row, it brings back no columns to duplicate the outer row with, and — the decisive point — it is immune to the trap that Day 86 set. If the subquery in a NOT IN ever yields a single NULL, the whole NOT IN evaluates to unknown rather than true and the query returns no rows at all, silently. Option 1 is the classic mistake and is self-contradicting: an INNER JOIN removes precisely the rows you are looking for, because a member with no loans has no rows to join to. Option 3 would pair every member with every loan and is a different bug entirely.'

  - question: 'A schema uses soft delete: books have a withdrawn_at column, members have a left_at column. What is the actual cost of that decision?'
    options:
      - 'Every query must now state which rows it means'
      - 'Extra disk space, which is negligible at library scale'
      - 'Foreign keys stop working, because they cannot reference a withdrawn row'
      - 'Nothing, provided you create a view — the view removes the obligation entirely'
    answer_index: 0
    explanation: 'Soft delete buys exactly what the brief asked for: an old loan still resolves to a title, and a departed member''s outstanding fine survives their membership. The price is paid on every query afterwards. SELECT count(*) FROM books returns 8 in the lab while the collection contains 7, and nothing errors — the difference is one forgotten WHERE clause. The point that makes it a design cost rather than a coding one is that which filter applies depends on the question, not on the table: the lab''s fines query deliberately includes members who have left, because a debt does not stop existing when somebody cancels their membership, while the top-borrowers query deliberately excludes them. A view helps, and option 3 overstates it — a view gives the filter one definition and a name, so every report that uses it filters consistently, but nothing forces a query to use the view. Disk space, option 0, is the least interesting cost. And foreign keys are unaffected: the row is still there, which is the entire point.'
