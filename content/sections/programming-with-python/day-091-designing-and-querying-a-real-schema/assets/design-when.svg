<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the stakes.">
  <title>How much design up front</title>
  <style>
    .design-when-bg   { fill: #f8fafc; }
    .design-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .design-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .design-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .design-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .design-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .design-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .design-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .design-when-row { opacity: 1; }
    .design-when-r0 { animation-delay: 0.00s; }
    .design-when-r1 { animation-delay: 0.45s; }
    .design-when-r2 { animation-delay: 0.90s; }
    .design-when-r3 { animation-delay: 1.35s; }
    .design-when-r4 { animation-delay: 1.80s; }
    .design-when-row { animation: design-when-reveal 7.3s ease-in-out infinite; }
    @keyframes design-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="design-when-bg" width="980" height="390"/>
  <text class="design-when-h1"  x="30" y="40">How much design up front</text>
  <text class="design-when-sub" x="30" y="64">By the stakes.</text>
  <rect class="design-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="design-when-name" x="46" y="122">Design carefully</text>
  <text class="design-when-desc" x="46" y="142">Four cases.</text>
  <text class="design-when-desc design-when-row design-when-r0" x="46" y="182">Data that will outlive the application</text>
  <text class="design-when-desc design-when-row design-when-r1" x="46" y="216">Multiple writers or systems</text>
  <text class="design-when-desc design-when-row design-when-r2" x="46" y="250">Regulatory or financial records</text>
  <text class="design-when-desc design-when-row design-when-r3" x="46" y="284">Large volumes, where migration is costly</text>
  <text class="design-when-desc design-when-row design-when-r4" x="46" y="318">Where correctness matters most</text>
  <rect class="design-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="design-when-name" x="526" y="122">Keep it light</text>
  <text class="design-when-desc" x="526" y="142">Also four.</text>
  <text class="design-when-desc design-when-row design-when-r0" x="526" y="182">A prototype you will throw away</text>
  <text class="design-when-desc design-when-row design-when-r1" x="526" y="216">A one-off import</text>
  <text class="design-when-desc design-when-row design-when-r2" x="526" y="250">Small volumes, easily rewritten</text>
  <text class="design-when-desc design-when-row design-when-r3" x="526" y="284">Where the domain is not yet understood</text>
  <text class="design-when-desc design-when-row design-when-r4" x="526" y="318">But do not let a prototype become production</text>
  <text class="design-when-sub" x="30" y="372">The last line is the one that actually bites, because prototypes become production quietly, and the schema is never revisited afterwards.</text>
</svg>
