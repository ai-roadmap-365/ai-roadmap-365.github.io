<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before or after building.">
  <title>Planning a town</title>
  <style>
    .town-plan-bg   { fill: #f8fafc; }
    .town-plan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .town-plan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .town-plan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .town-plan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .town-plan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .town-plan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .town-plan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .town-plan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .town-plan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .town-plan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .town-plan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .town-plan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .town-plan-row { opacity: 1; }
    .town-plan-r0 { animation-delay: 0.00s; }
    .town-plan-r1 { animation-delay: 0.45s; }
    .town-plan-r2 { animation-delay: 0.90s; }
    .town-plan-r3 { animation-delay: 1.35s; }
    .town-plan-r4 { animation-delay: 1.80s; }
    .town-plan-row { animation: town-plan-reveal 7.3s ease-in-out infinite; }
    @keyframes town-plan-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="town-plan-bg" width="980" height="390"/>
  <text class="town-plan-h1"  x="30" y="40">Planning a town</text>
  <text class="town-plan-sub" x="30" y="64">Before or after building.</text>
  <rect class="town-plan-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="town-plan-name" x="46" y="122">Planned</text>
  <text class="town-plan-desc" x="46" y="142">Extendable.</text>
  <text class="town-plan-desc town-plan-row town-plan-r0" x="46" y="182">Streets laid out before building</text>
  <text class="town-plan-desc town-plan-row town-plan-r1" x="46" y="216">Room to add a district</text>
  <text class="town-plan-desc town-plan-row town-plan-r2" x="46" y="250">Everything findable by address</text>
  <text class="town-plan-desc town-plan-row town-plan-r3" x="46" y="284">Changes are local</text>
  <text class="town-plan-desc town-plan-row town-plan-r4" x="46" y="318">This is a designed schema</text>
  <rect class="town-plan-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="town-plan-name" x="526" y="122">Grown ad hoc</text>
  <text class="town-plan-desc" x="526" y="142">Constrained.</text>
  <text class="town-plan-desc town-plan-row town-plan-r0" x="526" y="182">Built wherever there was space</text>
  <text class="town-plan-desc town-plan-row town-plan-r1" x="526" y="216">No room left</text>
  <text class="town-plan-desc town-plan-row town-plan-r2" x="526" y="250">Addresses inconsistent</text>
  <text class="town-plan-desc town-plan-row town-plan-r3" x="526" y="284">Any change disturbs everything</text>
  <text class="town-plan-desc town-plan-row town-plan-r4" x="526" y="318">This is an accreted schema</text>
  <text class="town-plan-sub" x="30" y="372">Changes staying local is the property that matters most, and it is exactly what normalisation buys: one fact in one place means one place to change.</text>
</svg>
