terms:
  - term: 'Schema design'
    definition: 'The activity of deciding what tables exist, what columns they have, which values are legal and how the tables relate — so that the questions your users will ask are answerable and the states your data cannot legally be in are unrepresentable. It is judged by the questions it can answer cheaply, not by how normalized it is.'
  - term: 'Conceptual, logical and physical schema'
    definition: 'Three artifacts with three audiences, separated by the ANSI/SPARC committee in 1975. The conceptual model is entities and relationships in the language of the business; the logical schema is tables, columns and keys, independent of any engine; the physical schema is the CREATE TABLE statements for one specific database with its types, constraint syntax and indexes. Bad designs usually contain a conceptual mistake, and a conceptual mistake is invisible in a wall of DDL.'
  - term: 'Entity'
    definition: 'A thing with an independent existence, which therefore deserves a table. The three-part test: does it exist before and after the row that mentions it, does it have facts of its own, and is it referred to by more than one row? An author passes all three.'
  - term: 'Attribute'
    definition: 'A fact about one entity, which therefore becomes a column rather than a table. A published year is an attribute of a book: it has no life of its own and nothing else refers to it. The interesting case is an attribute of a RELATIONSHIP rather than of either side — such as the order an author is credited on a particular book — which belongs on the junction table.'
  - term: 'Surrogate key'
    definition: 'A primary key the database made up, carrying no meaning in the world — usually an integer. Chosen because it never changes, is never absent, and is never mistyped. In SQLite an INTEGER PRIMARY KEY is an alias for the internal rowid, so it costs nothing in storage.'
  - term: 'Natural key'
    definition: 'A value that already identifies the row in the world: an ISBN, an email address. Genuinely useful and still the wrong primary key, because natural keys change, are sometimes absent — a book printed in 1818 has no ISBN, and a primary key cannot be NULL — and are sometimes mistyped. The resolution is to keep it as a UNIQUE constraint alongside a surrogate primary key, which gets the integrity guarantee without the coupling.'
  - term: 'Junction table'
    definition: 'A table whose job is to record a many-to-many relationship, holding one foreign key to each side and keyed on the pair — which is what makes it impossible to record the same relationship twice. Also called a bridge, link or associative table. It earns columns of its own the moment the relationship itself has an attribute; and when the same pair can legitimately occur more than once, it has stopped being a junction table and become an entity.'
  - term: 'Derived data'
    definition: 'A value that is a function of other stored values — a queue position computed from a timestamp and a status, a cached count, a duplicated name. Storing it means promising to recompute it everywhere any input changes, forever, in every code path that will ever exist. The database cannot enforce that promise, so it is not a promise. Store what you are told; derive what follows from it.'
  - term: 'Soft delete'
    definition: 'Marking a row as removed with a column — withdrawn_at, left_at — instead of deleting it, so that history still resolves. The cost is exact and permanent: every present-tense query must now decide and state which rows it means, and the one that forgets returns a wrong number without erroring. Which filter applies is a property of the question rather than of the table.'
  - term: 'ISO 8601'
    definition: 'The international date and time notation first published in 1988, written here as YYYY-MM-DDTHH:MM:SSZ. Three properties earn it a place in a database with no date type: fields are fixed-width and most-significant-first, so text order is chronological order; it is unambiguous, unlike 01/08/2026; and it is readable by a human looking at the raw file. Because it sorts, a plain text column can carry a CHECK constraint that enforces chronology.'
  - term: 'Integer minor units'
    definition: 'Storing money as a whole number of the smallest unit — pence, cents — rather than as a floating-point number of the major unit. Binary floating point cannot represent 0.10 exactly, and in SQLite 0.1 + 0.2 = 0.3 evaluates to false. The integer stays an integer through every sum and comparison and is divided by 100 exactly once, at the point of display.'
  - term: 'CHECK constraint'
    definition: 'A rule the database enforces on every insert and update. A column-level CHECK can only see its own column, so a rule comparing two columns must be written at table level. It is also worth remembering that CHECK (x <> ''bad'') is unknown rather than false when x is NULL, and therefore lets the row through.'
  - term: 'Nullable column'
    definition: 'A column that may hold NULL, which should always be a decision with a stated meaning rather than an accident. The lesson''s four NULLs each mean something different: unknown (an unpublished birth year), does not apply (a book printed before ISBNs), a positive fact about the world (a top-level category has no parent), and not yet (an unreturned loan). Adding a boolean alongside a date that already encodes the same fact gives you two columns that can disagree.'
  - term: 'View'
    definition: 'A saved query, given a name. It buys a name for a piece of reasoning and consistency between reports that use it. It does not buy speed: it stores the query text, not the result, and is expanded into whatever query uses it and run afresh every time. A materialized view does store the result, and SQLite does not have them.'
  - term: 'Scalar subquery'
    definition: 'A subquery returning exactly one row and one column, which can therefore appear anywhere a value can — including in the SELECT list. Two independent scalar subqueries are how the lesson answers "how many books are on the shelves, and how many are out" in a single statement.'
  - term: 'Correlated subquery'
    definition: 'A subquery that refers to a column of the query containing it, and is therefore conceptually re-evaluated for each outer row. EXISTS and NOT EXISTS are the common form. It expresses a question about the existence of a row without bringing back any columns, so it cannot multiply the outer rows the way a join can.'
  - term: 'EXISTS versus IN versus a join'
    definition: 'Three ways to ask about a related table. Use a join when you need columns from the other table, and accept that it duplicates the left row once per match. Use EXISTS when you only need to know whether a row is there. Avoid NOT IN when the subquery can yield a NULL: x NOT IN (1, 2, NULL) is unknown rather than true, so the query silently returns nothing at all.'
  - term: 'Common table expression'
    definition: 'A named subquery written before the query that uses it, with WITH. It buys readability and the ability to refer to the same intermediate result more than once. It is also the only way to filter on a window function, since a window function cannot appear in a WHERE clause.'
  - term: 'Recursive CTE'
    definition: 'A common table expression that refers to itself, written WITH RECURSIVE. An anchor query selects the starting rows; the recursive part joins the table back to the CTE to find the children of everything found so far; the process stops when a pass adds no rows. It answers hierarchical questions no fixed number of joins can, because the number of joins you would need is the depth of the tree and you do not know the depth of the tree. Carry a depth column by hand, and guard against cycles.'
  - term: 'Window function'
    definition: 'A function that computes a value across a set of related rows WITHOUT collapsing them — which is the entire difference from an aggregate. It is computed after WHERE and after GROUP BY, so filtering on its result requires an outer query or a CTE. Standardised in SQL:2003; added to SQLite in version 3.25.0 (2018).'
  - term: 'Partition'
    definition: 'The set of rows a window function computes over, named by PARTITION BY — the tier, the book, the source document. It resembles a GROUP BY grouping except that the rows survive: each row in the partition still comes back, now carrying the computed value.'
  - term: 'ROW_NUMBER and RANK'
    definition: 'Two ranking window functions. ROW_NUMBER gives 1, 2, 3 with no gaps and breaks ties arbitrarily unless the ORDER BY makes them deterministic. RANK gives tied rows the same number and then skips — 1, 1, 3. Choose by what a tie should mean: a queue position must be unique, so ROW_NUMBER; a leaderboard should show a genuine tie, so RANK.'
  - term: 'Top-N-per-group'
    definition: 'The problem a plain GROUP BY cannot solve: the two most active borrowers in each tier, the most recent row per source, the best three results per query. Aggregation collapses the rows, so the identifying columns are gone by the time you know a value is a winner. The window-function answer computes ROW_NUMBER over a partition and filters it in an outer query.'
  - term: 'Repository pattern'
    definition: 'A class that owns the database connection and exposes one method per question, so that no other code holds a connection or writes SQL. Beyond tidiness it is a security property of the structure: the formatting code physically cannot build a query out of string concatenation, because it has no connection in scope to do it with.'
