<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Publishing a release</title>
  <style>
    .publish-flow-bg   { fill: #f8fafc; }
    .publish-flow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .publish-flow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .publish-flow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .publish-flow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .publish-flow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .publish-flow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .publish-flow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .publish-flow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .publish-flow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .publish-flow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .publish-flow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .publish-flow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .publish-flow-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .publish-flow-stage { opacity: 1; }

    .publish-flow-s0 { animation-delay: 0.00s; }
    .publish-flow-e0 { animation-delay: 0.00s; }
    .publish-flow-s1 { animation-delay: 1.28s; }
    .publish-flow-e1 { animation-delay: 1.28s; }
    .publish-flow-s2 { animation-delay: 2.56s; }
    .publish-flow-e2 { animation-delay: 2.56s; }
    .publish-flow-s3 { animation-delay: 3.84s; }
    .publish-flow-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .publish-flow-conn  { animation: publish-flow-trace 6.4s ease-in-out infinite; }
      .publish-flow-stage { animation: publish-flow-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes publish-flow-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes publish-flow-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .publish-flow-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .publish-flow-stage { animation: publish-flow-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes publish-flow-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="publish-flow-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="publish-flow-bg" width="980" height="322"/>
  <text class="publish-flow-h1"  x="30" y="40">Publishing a release</text>
  <text class="publish-flow-sub" x="30" y="64">Four steps.</text>
  <g class="publish-flow-stage publish-flow-s0">
    <rect class="publish-flow-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="publish-flow-step" x="44" y="142">01</text>
    <text class="publish-flow-name" x="70" y="142">Raise the version, and record what changed</text>
    <text class="publish-flow-desc" x="44" y="166">So users can decide whether to</text>
    <text class="publish-flow-desc" x="44" y="182">take it.</text>
  </g>
  <line class="publish-flow-line publish-flow-conn publish-flow-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#publish-flow-tip)"/>
  <g class="publish-flow-stage publish-flow-s1">
    <rect class="publish-flow-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="publish-flow-step" x="280" y="142">02</text>
    <text class="publish-flow-name" x="306" y="142">Build the artefacts from a clean tree</text>
    <text class="publish-flow-desc" x="280" y="166">So nothing local leaks in.</text>
  </g>
  <line class="publish-flow-line publish-flow-conn publish-flow-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#publish-flow-tip)"/>
  <g class="publish-flow-stage publish-flow-s2">
    <rect class="publish-flow-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="publish-flow-step" x="516" y="142">03</text>
    <text class="publish-flow-name" x="542" y="142">Install into a fresh environment and test</text>
    <text class="publish-flow-desc" x="516" y="166">Which catches missing files.</text>
  </g>
  <line class="publish-flow-line publish-flow-conn publish-flow-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#publish-flow-tip)"/>
  <g class="publish-flow-stage publish-flow-s3">
    <rect class="publish-flow-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="publish-flow-step" x="752" y="142">04</text>
    <text class="publish-flow-name" x="778" y="142">Then upload — and it cannot be unpublished</text>
    <text class="publish-flow-desc" x="752" y="166">Versions are permanent.</text>
    <text class="publish-flow-edge" x="752" y="242">one-way</text>
  </g>
  <text class="publish-flow-sub" x="30" y="304">The fresh-environment install is the step that catches the classic packaging bug: a module that works locally because it is on your path, not in the package.</text>
</svg>
