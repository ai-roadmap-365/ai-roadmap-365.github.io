<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levels.">
  <title>What a version number promises</title>
  <style>
    .versioning-bg   { fill: #f8fafc; }
    .versioning-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .versioning-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .versioning-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .versioning-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .versioning-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .versioning-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .versioning-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .versioning-stage { opacity: 1; }

    .versioning-s0 { animation-delay: 0.00s; }
    .versioning-e0 { animation-delay: 0.00s; }
    .versioning-s1 { animation-delay: 1.28s; }
    .versioning-e1 { animation-delay: 1.28s; }
    .versioning-s2 { animation-delay: 2.56s; }
    .versioning-e2 { animation-delay: 2.56s; }
    .versioning-s3 { animation-delay: 3.84s; }
    .versioning-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .versioning-conn  { animation: versioning-trace 6.4s ease-in-out infinite; }
      .versioning-stage { animation: versioning-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes versioning-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes versioning-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .versioning-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .versioning-stage { animation: versioning-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes versioning-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="versioning-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="versioning-bg" width="980" height="322"/>
  <text class="versioning-h1"  x="30" y="40">What a version number promises</text>
  <text class="versioning-sub" x="30" y="64">Four levels.</text>
  <g class="versioning-stage versioning-s0">
    <rect class="versioning-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-step" x="44" y="142">01</text>
    <text class="versioning-name" x="70" y="142">A patch change: a fix, nothing else</text>
    <text class="versioning-desc" x="44" y="166">Safe to take.</text>
  </g>
  <line class="versioning-line versioning-conn versioning-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#versioning-tip)"/>
  <g class="versioning-stage versioning-s1">
    <rect class="versioning-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-step" x="280" y="142">02</text>
    <text class="versioning-name" x="306" y="142">A minor change: something added</text>
    <text class="versioning-desc" x="280" y="166">Existing use keeps working.</text>
  </g>
  <line class="versioning-line versioning-conn versioning-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#versioning-tip)"/>
  <g class="versioning-stage versioning-s2">
    <rect class="versioning-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-step" x="516" y="142">03</text>
    <text class="versioning-name" x="542" y="142">A major change: something removed or altered</text>
    <text class="versioning-desc" x="516" y="166">Existing use may break.</text>
  </g>
  <line class="versioning-line versioning-conn versioning-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#versioning-tip)"/>
  <g class="versioning-stage versioning-s3">
    <rect class="versioning-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="versioning-step" x="752" y="142">04</text>
    <text class="versioning-name" x="778" y="142">And a pre-release: not yet promising anything</text>
    <text class="versioning-desc" x="752" y="166">Opt in deliberately.</text>
  </g>
  <text class="versioning-sub" x="30" y="304">The promise only holds if the author keeps it, which is why dependency ranges are a statement of trust rather than a technical guarantee.</text>
</svg>
