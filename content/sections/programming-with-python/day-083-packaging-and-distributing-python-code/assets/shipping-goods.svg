<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everything must be inside.">
  <title>Shipping something to a stranger</title>
  <style>
    .shipping-goods-bg   { fill: #f8fafc; }
    .shipping-goods-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-goods-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-goods-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-goods-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-goods-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-goods-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shipping-goods-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shipping-goods-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shipping-goods-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shipping-goods-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shipping-goods-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shipping-goods-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shipping-goods-row { opacity: 1; }
    .shipping-goods-r0 { animation-delay: 0.00s; }
    .shipping-goods-r1 { animation-delay: 0.45s; }
    .shipping-goods-r2 { animation-delay: 0.90s; }
    .shipping-goods-r3 { animation-delay: 1.35s; }
    .shipping-goods-r4 { animation-delay: 1.80s; }
    .shipping-goods-row { animation: shipping-goods-reveal 7.3s ease-in-out infinite; }
    @keyframes shipping-goods-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shipping-goods-bg" width="980" height="390"/>
  <text class="shipping-goods-h1"  x="30" y="40">Shipping something to a stranger</text>
  <text class="shipping-goods-sub" x="30" y="64">Everything must be inside.</text>
  <rect class="shipping-goods-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shipping-goods-name" x="46" y="122">Complete</text>
  <text class="shipping-goods-desc" x="46" y="142">Usable on arrival.</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r0" x="46" y="182">Everything needed is in the box</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r1" x="46" y="216">Labelled with contents and version</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r2" x="46" y="250">Instructions included</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r3" x="46" y="284">Works without the sender present</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r4" x="46" y="318">This is a well-formed package</text>
  <rect class="shipping-goods-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shipping-goods-name" x="526" y="122">Incomplete</text>
  <text class="shipping-goods-desc" x="526" y="142">Fails on arrival.</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r0" x="526" y="182">Parts left on the sender's bench</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r1" x="526" y="216">Unlabelled</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r2" x="526" y="250">No instructions</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r3" x="526" y="284">Only works where it was made</text>
  <text class="shipping-goods-desc shipping-goods-row shipping-goods-r4" x="526" y="318">This is 'it works on my machine'</text>
  <text class="shipping-goods-sub" x="30" y="372">Working without the sender present is the whole test, and it is exactly what installing into a clean environment checks.</text>
</svg>
