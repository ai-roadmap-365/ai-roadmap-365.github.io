terms:
  - term: 'Module'
    definition: 'A single Python file that can be imported — `core.py`, imported as `wordtally.core`. The smallest unit Python''s import system deals in, and the first of the three things the word "package" gets confused with.'
  - term: 'Package'
    definition: 'In the import sense, a directory of modules with an `__init__.py`, importable as one unit. This is what you write `import` in front of. It is not the same thing as a distribution package, and the two are not required to share a name.'
  - term: 'Distribution package'
    definition: 'The installable artifact — an archive plus its metadata, such as `wordtally_tools-0.3.1-py3-none-any.whl`. This is what an index lists, what `pip install` fetches, and what the word "package" means when a packaging document says it. The community shortens it to "distribution".'
  - term: 'Import name'
    definition: 'The name you type after `import`. It must be a valid Python identifier, and it is usually short. For this lesson''s package it is `wordtally`.'
  - term: 'Distribution name'
    definition: 'The name you type after `pip install`, and the name an index lists. It must be unique across the whole index and is often chosen for searchability rather than brevity. For this lesson''s package it is `wordtally-tools`. It differs from the import name constantly in real projects: `beautifulsoup4` installs `bs4`, `pillow` installs `PIL`, `scikit-learn` installs `sklearn`.'
  - term: 'sdist'
    definition: 'A source distribution: a gzipped tar archive of the project roughly as the maintainer has it — source with its directory layout intact, tests, licence, `pyproject.toml`, `MANIFEST.in` and a `PKG-INFO`. Installing one means building it first, which runs the publisher''s build backend on the installing machine.'
  - term: 'Wheel'
    definition: 'A built distribution: a zip archive with a defined layout, holding the importable package, its package data, and a `.dist-info` metadata directory. Installing one means unpacking it — no build, no compiler, and none of the publisher''s build code executed. Specified by PEP 427 in 2012, and the single largest improvement in the history of Python packaging.'
  - term: 'Build backend'
    definition: 'The component that actually turns a source tree into artifacts — setuptools, hatchling, flit_core, poetry-core. Named in `[build-system] build-backend`. It is distinct from the build FRONTEND (`python -m build`, or pip), which knows how to ask but builds nothing itself. PEP 517 defined the interface between them, which is why swapping backends is a two-line edit.'
  - term: 'Entry point'
    definition: 'A declaration in a package''s metadata that advertises an object under a named group, so that other software can discover it without importing the package first. Console scripts are the most familiar group; plugin systems use the same mechanism for their own groups.'
  - term: 'Console script'
    definition: 'An entry point in the `console_scripts` group, declared as `[project.scripts] name = "module.path:function"`. Installing the package writes a small executable of that name into the environment''s `bin/` directory, whose whole job is to import the function, call it, and exit with what it returns. This is how `pip install` gives a user a COMMAND rather than merely a module.'
  - term: 'Editable install'
    definition: '`pip install -e .` — installs the project into an environment without copying its code, by writing a path file that points back at your source tree. Edits take effect with no reinstall, which is right for development. It is not a test of your packaging: the import path never goes through the wheel, so an editable install can succeed while the wheel is broken.'
  - term: 'src layout'
    definition: 'Putting the importable package under `src/` rather than at the project root. The argument is not tidiness: Python puts the working directory near the front of its search path, so a flat layout lets an uninstalled working copy win over the installed one silently. With `src/` there is nothing importable in the working directory, so your tests exercise the installed package — the thing your users actually get.'
  - term: 'Semantic versioning'
    definition: 'The convention that a version is `MAJOR.MINOR.PATCH`, incremented respectively for a breaking change, a backwards-compatible addition, and a backwards-compatible fix. Published by Tom Preston-Werner, with version 2.0.0 of the specification dating from 2013. It is a real service to your users when you follow it — and many projects do not, so read changelogs rather than trusting the numbers.'
  - term: 'Dependency specifier'
    definition: 'A package name plus an optional version constraint, such as `requests>=2.31,<3` or `requests~=2.31.0`, optionally with extras and an environment marker. It states what your code is compatible with. A library should specify the widest range it genuinely works with; an application should pin exact versions in a lock file instead.'
  - term: 'Extras'
    definition: 'Named optional dependency groups, declared under `[project.optional-dependencies]` and installed with bracket syntax: `pip install "wordtally-tools[dev]"`. In the built metadata they appear as `Provides-Extra` plus `Requires-Dist` lines conditional on the extra, so a plain install genuinely skips them. Typical uses are development tooling, optional backends, and heavy dependencies most users do not want.'
  - term: 'Index'
    definition: 'A server that lists distributions and serves their files — the public Python Package Index, a separate test index used for rehearsal, or a private one inside an organisation. It is an OPTIONAL channel: a git URL, a local directory of wheels, or a wheel handed over directly are all complete distribution mechanisms that involve no index at all.'
  - term: 'Virtual environment'
    definition: 'An isolated directory with its own `site-packages` and its own `bin/`, created with `python3 -m venv`. Introduced on Day 43 as the place you install things into; today it is the place your package gets installed TO. Packaging and virtual environments are complements: one makes code installable, the other gives it somewhere to go.'
  - term: 'Reproducibility'
    definition: 'The property that a result can be rebuilt from a recorded description — the code at one commit, the exact dependency versions, the interpreter, the data. It is a packaging problem before it is a modelling problem: a machine-learning result nobody can rebuild because nobody recorded what produced it is an anecdote with a number attached. The rule that a published version can never be reused is what makes every lock file in the ecosystem mean anything.'
