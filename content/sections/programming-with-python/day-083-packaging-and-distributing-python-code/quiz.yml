questions:
  - question: 'You run `pip install beautifulsoup4` and then write `import bs4`. What is going on?'
    options:
      - '`beautifulsoup4` is the distribution name and `bs4` is the import name; the two are separate identifiers and are allowed to differ'
      - 'The package was installed incorrectly and the import should have been `beautifulsoup4`'
      - '`bs4` is an alias created by pip during installation'
      - 'The project renamed itself and the old import name is kept for compatibility'
    answer_index: 0
    explanation: 'The distribution name is what an index lists and what you type after `pip install`; it must be unique across the whole index and is often chosen for searchability. The import name must be a valid Python identifier and is usually chosen for brevity. Nothing requires them to match, and in practice they often do not: `pillow` gives you `PIL`, `scikit-learn` gives you `sklearn`, `python-dateutil` gives you `dateutil`. Today''s lab makes the split deliberate — you install `wordtally-tools` and import `wordtally`, and there is no module named `wordtally_tools` at all.'

  - question: 'What is the essential difference between an sdist and a wheel?'
    options:
      - 'The sdist is compressed and the wheel is not'
      - 'The wheel is already built, so installing it means unpacking it; the sdist must be built on the installing machine'
      - 'The sdist contains only source code and the wheel contains only compiled bytecode'
      - 'The wheel is for applications and the sdist is for libraries'
    answer_index: 1
    explanation: 'A wheel is a BUILT distribution — that is the whole distinction, and it is why `pip install numpy` takes seconds today and used to require a C compiler and twenty minutes. Both are compressed (a gzipped tar and a zip respectively). A wheel does not contain bytecode; for a pure-Python project it contains the same `.py` files, flattened out of `src/` and accompanied by a `.dist-info` metadata directory. Installing an sdist runs the publisher''s build backend on your machine, which is also a security difference worth knowing.'

  - question: 'Your package reads a `.txt` file that sits inside the package directory. It works perfectly for you and raises `FileNotFoundError` for the first person who installs it. What went wrong?'
    options:
      - 'The file needs to be added to `dependencies` in `pyproject.toml`'
      - '`importlib.resources` cannot read text files from an installed package'
      - 'The data file was never declared as package data, so the build did not put it in the wheel'
      - 'The file must be moved outside the package directory before building'
    answer_index: 2
    explanation: 'This is the most common packaging bug there is, and its signature is exactly that: perfect on your machine, broken for everyone else. A file inside your package directory is NOT included in the wheel just because it is there — you declare it, for setuptools with `[tool.setuptools.package-data]`. It works for you because Python is reading your source tree, where the file obviously exists. It fails after installation because the wheel never carried it. The lab''s starter project ships without the declaration on purpose so you can watch it happen, and the harness checks the built wheel for the file rather than trusting the source tree.'

  - question: 'Why does the `src` layout make your tests more trustworthy?'
    options:
      - 'It makes pytest collect tests faster because there are fewer directories to search'
      - 'It forces you to write tests before you write the package'
      - 'It allows the same package to be installed several times in one environment'
      - 'There is no importable package in the working directory, so `import yourpackage` resolves to the installed copy instead of your working copy'
    answer_index: 3
    explanation: 'Python puts the working directory near the front of its search path. In a flat layout that directory contains an importable copy of your package, so it wins over anything installed — and your suite then passes against source that has never been packaged, installed, or checked. Every packaging mistake becomes invisible: the missing data file, the subpackage the backend never found, the module you forgot to include. With `src/` there is nothing importable at the root, so the installed copy wins and your tests exercise what users get. The lab proves this by running the identical one-line command in both layouts with the same wheel installed, and getting two different answers.'

  - question: 'A colleague''s library declares `dependencies = ["requests==2.34.2"]`. What is the problem?'
    options:
      - 'Exact pins are invalid syntax in `[project] dependencies` and the build will fail'
      - 'A library is installed alongside other packages, so an exact pin can make a user''s environment unsolvable for no benefit'
      - 'Nothing — exact pins are the correct choice for a library'
      - 'It will silently install the newest version anyway, because libraries ignore pins'
    answer_index: 1
    explanation: 'The rule is: a library specifies ranges, an application pins exact versions. A library goes into an environment you do not control, alongside other libraries. If yours pins `requests==2.34.2` and another pins `requests==2.33.0`, the two cannot coexist and you have created an unsolvable problem for someone else. State the widest range you genuinely work with. An application is different — it is deployed rather than installed alongside anything, and it should know exactly what it runs, which is what the pinned `requirements.txt` in every lab of this course is for. The failure modes are asymmetric: an over-pinned library breaks other people, a loosely pinned application breaks itself, quietly, later.'

  - question: 'You installed your project with `pip install -e .`, and the whole test suite passes. What has that NOT proved?'
    options:
      - 'That the code in your source tree behaves as your tests assert'
      - 'That the package is importable from outside the project directory'
      - 'That your wheel is correct — an editable install imports your source tree and never goes through the wheel at all'
      - 'That your dependencies resolve, since editable installs skip dependency resolution'
    answer_index: 2
    explanation: 'An editable install writes a path file into `site-packages` pointing back at your `src/` directory; there is no copy of your code there. So imports resolve to your working tree, which is exactly what you want while developing — and exactly why it cannot verify packaging. A missing package-data declaration, a subpackage the backend never discovered, a broken `[project.scripts]` value: an editable install sails past all of them. Develop with `-e`; verify by installing a real wheel into a fresh environment, which is what the lab does. Editable installs do resolve dependencies normally.'

  - question: 'You published version 1.2.0 and immediately found a serious bug. Which option is NOT available to you?'
    options:
      - 'Publishing 1.2.1 with the fix'
      - 'Yanking 1.2.0 so that resolvers skip it unless something pins it exactly'
      - 'Documenting the bug and advising users to upgrade'
      - 'Uploading corrected files under the same version number, 1.2.0'
    answer_index: 3
    explanation: 'A published version can never be reused. You may be able to yank a release, and you may even be able to delete it, but you can never upload different bytes under the same name and version — and anyone who already installed it keeps what they got. This is not bureaucracy; it is the property that makes every lock file, reproducible build and deployment in the Python world mean anything. If `requests==2.34.2` could refer to different bytes on different days, a pin would be a wish rather than a guarantee. So the rule is simply: a bad release is fixed by publishing a new version, never by quietly replacing the old one.'

  - question: 'Which statement about `[build-system]` and `[project]` in `pyproject.toml` is correct?'
    options:
      - 'Both tables are specific to setuptools and mean nothing to other backends'
      - '`[build-system]` names who builds the project and is read by the frontend; `[project]` is standardised metadata that means the same thing to every backend'
      - '`[project]` configures the build tool while `[build-system]` describes the package'
      - 'Both are optional; a package with neither still builds and installs normally'
    answer_index: 1
    explanation: '`[build-system]` answers "who builds this and what do they need first" — `requires` lists what must exist before the build begins, `build-backend` names the object implementing the standard interface. It is read by the FRONTEND (`python -m build`, or pip), which then creates an isolated environment and calls the backend there. `[project]` is the standardised metadata table from PEP 621: name, version, dependencies, scripts and the rest, identical across backends. That is precisely why switching from setuptools to hatchling is a two-line edit. Tool-specific settings live in `[tool.<name>]` tables — the same mechanism Day 77 used for pytest and mypy — and those do not travel between backends.'
