visuals:
  - id: packaging-architecture
    file: assets/packaging-architecture.svg
    type: diagram
    title: 'From a source tree to something someone else can install'
    alt: 'Diagram: the architecture of a Python distribution — a source tree with a src layout and a pyproject.toml is read by a build frontend, which calls the build backend named in the build-system table; the backend writes two artifacts, an sdist holding the whole project and a wheel holding only the installable package plus its dist-info metadata; pip unpacks the wheel into a virtual environment''s site-packages and writes a console script into the environment''s bin directory; an index is an optional channel between the two artifacts and the installing environment'
    description: 'An architecture diagram in four columns. Column one is the source tree in a src layout: pyproject.toml with its build-system, project and project.scripts tables called out, then src/wordtally holding __init__.py, core.py, cli.py and data/stopwords.txt, then tests, README, LICENSE and MANIFEST.in, annotated with the note that nothing importable sits at the project root. An arrow leads to column two, the build, which stacks two boxes: the frontend, python -m build, described as reading the build-system table and building nothing itself, and below it the backend, setuptools.build_meta, with hatchling, flit_core and poetry-core named as swappable alternatives and the note that this one does the work. Two arrows fan out to column three, the artifacts: an sdist named name-0.3.1.tar.gz listing pyproject.toml, MANIFEST.in, src, tests, LICENSE, README and PKG-INFO, marked as needing to be built before use; and a wheel named name-0.3.1-py3-none-any.whl listing the wordtally modules, the packaged data file, dist-info/METADATA and dist-info/entry_points.txt, marked as a zip that installs by unpacking. An arrow from the wheel reaches column four, a virtual environment, showing site-packages holding wordtally with its modules and a dist-info directory, and bin holding an executable called wordtally described as a COMMAND, with the import name noted separately. Below, a dashed box shows an index as an optional channel — the public index, a test index for rehearsal, a private index, a git URL, a wheel handed over directly, or a local directory — carrying the warning that a published version can never be reused, replaced or taken back, and the note that this lab stops before that box. Two further panels run along the bottom: one listing the four things a user actually needs, the code, its dependencies, its metadata and an entry point, each mapped to where it is declared in pyproject.toml; and one contrasting the distribution name typed after pip install with the import name typed after import, with the closing reminders that the same split appears in beautifulsoup4 and bs4, and that a pure-Python project should ship both artifacts.'
  - id: build-install-flow
    file: assets/build-install-flow.svg
    type: flowchart
    title: 'One package, from edit to somebody else running the command'
    alt: 'Diagram: the flow from a source tree to a user running an installed command — edit the source tree, run python -m build to produce an sdist and a wheel, create a virtual environment, install the wheel with pip, let import resolution find the installed copy in site-packages rather than the working directory, and run the console script the installer placed on the path; a dashed development branch shows pip install -e as the editable shortcut that points imports back at the source tree instead'
    description: 'A six-step vertical flowchart with two side branches. Step one is the source tree with a complete pyproject.toml, listing name, version, requires-python, dependencies and project.scripts. Step two is python -m build, described as the frontend reading the build-system table and calling the backend it names, by default in a fresh isolated environment. It fans out to step three, which is two boxes side by side: the sdist, holding the whole project including tests, requiring a build before installation and therefore running the publisher''s build code; and the wheel, already built, a zip with a dist-info directory, installing by unpacking, described as fast and inert. Both converge on step four, pip install into a virtual environment, which unpacks into site-packages, resolves dependencies, reads entry_points.txt and writes a launcher into bin. Step five asks which copy wins when import wordtally runs, noting that Python searches the working directory before site-packages and that a src layout leaves nothing importable in the working directory, so the answer is the file in site-packages and the tests therefore exercise exactly what a user receives. Step six is the user typing wordtally count notes.txt, with the launcher importing wordtally.cli and exiting with what main returns. On the left, a dashed development-shortcut panel describes pip install -e as skipping steps two and three, writing a path file that points back at src, applying edits at once with no reinstall, and resolving imports to your tree rather than to a copy. On the right, a panel lists where the flow breaks: no name or version makes step two refuse, no project.scripts leaves step six with no command, undeclared data fails only for users, and a flat layout makes step five pick the wrong copy and say nothing. Two closing lines record that every step shown is offline and local, that publishing would sit after step three and is not performed in the lab, and that a published version is permanent so a bad release is fixed by publishing a new version.'
