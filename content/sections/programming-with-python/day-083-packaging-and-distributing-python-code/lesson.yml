id: D083
day: 83
slug: packaging-and-distributing-python-code
title: 'Packaging and Distributing Python Code'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to turn a directory of your own Python into something another person can install: a complete pyproject.toml with standardised metadata, a src layout that makes your tests exercise the installed package rather than your working directory, a console script that turns a function into a command, and two built artifacts — an sdist and a wheel — that you can open, read, and install into a fresh environment offline. You will also be able to describe publishing accurately, including the one rule with no exceptions: a published version can never be reused.'
objectives:
  - 'Use the packaging vocabulary precisely — module, package, distribution package, project, distribution name versus import name — and explain why the last pair differs constantly in real projects'
  - 'State what is inside an sdist and what is inside a wheel, why a wheel installs by unpacking while an sdist may need a build step, and why a pure-Python project should ship both'
  - 'Write a complete pyproject.toml field by field, distinguishing the standardised build-system and project tables from tool-specific tables, and declare a console entry point with project.scripts'
  - 'Explain the genuine argument for the src layout — that it makes it impossible to import your package from the working directory instead of the installed copy — and demonstrate it by comparing the resolved module file in both layouts'
  - 'Choose between an application pinning exact versions and a library specifying compatible ranges, and describe the asymmetric failure mode of getting each one backwards'
  - 'Single-source a version number, read it back with importlib.metadata, and describe semantic versioning honestly, including that many projects do not keep its promise'
  - 'Build both artifacts with python -m build, open the wheel as the zip archive it is, and read its METADATA, entry_points.txt and RECORD files'
  - 'Explain what an editable install actually puts into site-packages, and why a passing suite under an editable install is not evidence that a wheel is correct'
  - 'Describe publishing accurately without performing it — a test index as rehearsal, twine, API tokens kept in an environment variable or keyring rather than a repository, and the permanence of a published version'
  - 'Judge when not to publish, and name the legitimate alternatives: a private index, a git URL, a local directory of wheels, or a wheel handed over directly'
  - 'Connect the same metadata discipline to reproducibility in machine learning, where a model nobody can rebuild is an anecdote rather than a result'
prerequisites:
  - 'Day 43 — virtual environments and installing packages with pip, from the consumer side of the same transaction'
  - 'Day 59 — modules, imports and project layout, which the src layout answers properly'
  - 'Day 77 — the pyproject.toml you wrote to configure pytest, mypy, Ruff and coverage; today the same file carries package metadata'
  - 'Day 80 — argparse and the habit of writing main(argv) -> int, which is exactly what a console script calls'
  - 'Day 79 — where you installed beautifulsoup4 and imported bs4, the lesson''s running example of the two-name split'
  - 'Comfort running bash commands, editing a TOML file, and reading a directory listing'
reading_time_minutes: 40
