<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One environment variable, from Day 11.">
  <title>What activation actually does</title>
  <style>
    .activate-is-path-bg   { fill: #f8fafc; }
    .activate-is-path-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activate-is-path-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activate-is-path-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activate-is-path-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activate-is-path-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .activate-is-path-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .activate-is-path-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .activate-is-path-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .activate-is-path-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .activate-is-path-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .activate-is-path-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .activate-is-path-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .activate-is-path-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .activate-is-path-stage { opacity: 1; }

    .activate-is-path-s0 { animation-delay: 0.00s; }
    .activate-is-path-e0 { animation-delay: 0.00s; }
    .activate-is-path-s1 { animation-delay: 1.28s; }
    .activate-is-path-e1 { animation-delay: 1.28s; }
    .activate-is-path-s2 { animation-delay: 2.56s; }
    .activate-is-path-e2 { animation-delay: 2.56s; }
    .activate-is-path-s3 { animation-delay: 3.84s; }
    .activate-is-path-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .activate-is-path-conn  { animation: activate-is-path-trace 6.4s ease-in-out infinite; }
      .activate-is-path-stage { animation: activate-is-path-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes activate-is-path-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes activate-is-path-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .activate-is-path-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .activate-is-path-stage { animation: activate-is-path-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes activate-is-path-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="activate-is-path-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="activate-is-path-bg" width="980" height="322"/>
  <text class="activate-is-path-h1"  x="30" y="40">What activation actually does</text>
  <text class="activate-is-path-sub" x="30" y="64">One environment variable, from Day 11.</text>
  <g class="activate-is-path-stage activate-is-path-s0">
    <rect class="activate-is-path-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="activate-is-path-step" x="44" y="142">01</text>
    <text class="activate-is-path-name" x="70" y="142">Before</text>
    <text class="activate-is-path-desc" x="44" y="166">which python3 finds the system</text>
    <text class="activate-is-path-desc" x="44" y="182">interpreter, first on PATH.</text>
    <text class="activate-is-path-edge" x="44" y="242">/usr/bin</text>
  </g>
  <line class="activate-is-path-line activate-is-path-conn activate-is-path-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#activate-is-path-tip)"/>
  <g class="activate-is-path-stage activate-is-path-s1">
    <rect class="activate-is-path-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="activate-is-path-step" x="280" y="142">02</text>
    <text class="activate-is-path-name" x="306" y="142">activate prepends</text>
    <text class="activate-is-path-desc" x="280" y="166">It puts .venv/bin at the front</text>
    <text class="activate-is-path-desc" x="280" y="182">of PATH, and saves the old</text>
    <text class="activate-is-path-desc" x="280" y="198">value.</text>
    <text class="activate-is-path-edge" x="280" y="242">prepend</text>
  </g>
  <line class="activate-is-path-line activate-is-path-conn activate-is-path-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#activate-is-path-tip)"/>
  <g class="activate-is-path-stage activate-is-path-s2">
    <rect class="activate-is-path-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="activate-is-path-step" x="516" y="142">03</text>
    <text class="activate-is-path-name" x="542" y="142">Now the search finds yours</text>
    <text class="activate-is-path-desc" x="516" y="166">Same rule as always: leftmost</text>
    <text class="activate-is-path-desc" x="516" y="182">match wins.</text>
    <text class="activate-is-path-edge" x="516" y="242">.venv/bin</text>
  </g>
  <line class="activate-is-path-line activate-is-path-conn activate-is-path-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#activate-is-path-tip)"/>
  <g class="activate-is-path-stage activate-is-path-s3">
    <rect class="activate-is-path-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="activate-is-path-step" x="752" y="142">04</text>
    <text class="activate-is-path-name" x="778" y="142">deactivate restores</text>
    <text class="activate-is-path-desc" x="752" y="166">The saved PATH comes back.</text>
    <text class="activate-is-path-desc" x="752" y="182">Nothing was installed or</text>
    <text class="activate-is-path-desc" x="752" y="198">removed.</text>
    <text class="activate-is-path-edge" x="752" y="242">restored</text>
  </g>
  <text class="activate-is-path-sub" x="30" y="304">Open the activate script and read it — it is short, and it is almost entirely this. Knowing that removes the last of the mystery.</text>
</svg>
