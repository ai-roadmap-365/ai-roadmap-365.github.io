<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" font-family="system-ui, sans-serif">
  <title>How Python runs code: a source file passes through the interpreter to produce output, and the REPL feeds one line at a time through the same interpreter</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How Python runs your code</text>

  <!-- Row 1: script path -->
  <text x="40" y="74" font-size="15" font-weight="bold" fill="#1d4ed8">Running a script</text>

  <rect x="40" y="88" width="170" height="78" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="125" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Source file</text>
  <text x="125" y="140" text-anchor="middle" font-size="14" fill="#1a202c">hello.py</text>
  <text x="125" y="158" text-anchor="middle" font-size="14" fill="#1a202c">(text you wrote)</text>

  <rect x="275" y="88" width="170" height="78" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Python interpreter</text>
  <text x="360" y="136" text-anchor="middle" font-size="14" fill="#1a202c">python3</text>
  <text x="360" y="154" text-anchor="middle" font-size="14" fill="#1a202c">reads &amp; executes</text>

  <rect x="510" y="88" width="170" height="78" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="595" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Output</text>
  <text x="595" y="140" text-anchor="middle" font-size="14" fill="#1a202c">text on screen,</text>
  <text x="595" y="158" text-anchor="middle" font-size="14" fill="#1a202c">files, results</text>

  <line x1="210" y1="127" x2="267" y2="127" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="275,127 261,120 261,134" fill="#1d4ed8"/>
  <line x1="445" y1="127" x2="502" y2="127" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="510,127 496,120 496,134" fill="#1d4ed8"/>

  <!-- Row 2: REPL loop -->
  <text x="40" y="228" font-size="15" font-weight="bold" fill="#1d4ed8">The REPL (interactive prompt)</text>

  <rect x="40" y="244" width="150" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="115" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Read</text>
  <text x="115" y="296" text-anchor="middle" font-size="14" fill="#1a202c">one line you type</text>

  <rect x="240" y="244" width="150" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="315" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Eval</text>
  <text x="315" y="296" text-anchor="middle" font-size="14" fill="#1a202c">run it now</text>

  <rect x="440" y="244" width="150" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="515" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Print</text>
  <text x="515" y="296" text-anchor="middle" font-size="14" fill="#1a202c">show the result</text>

  <line x1="190" y1="279" x2="232" y2="279" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="240,279 226,272 226,286" fill="#1d4ed8"/>
  <line x1="390" y1="279" x2="432" y2="279" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="440,279 426,272 426,286" fill="#1d4ed8"/>

  <!-- Loop back -->
  <line x1="515" y1="314" x2="515" y2="344" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="515" y1="344" x2="115" y2="344" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="115" y1="344" x2="115" y2="322" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="115,314 108,328 122,328" fill="#1d4ed8"/>
  <text x="315" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Loop: read the next line and repeat until you quit</text>

  <!-- Shared-interpreter note -->
  <rect x="40" y="392" width="640" height="48" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="421" text-anchor="middle" font-size="14" fill="#1a202c">Both paths use the same interpreter: a script feeds the whole file at once; the REPL feeds one line at a time.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 210 127 L 267 127" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 445 127 L 502 127" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 190 279 L 232 279" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 390 279 L 432 279" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
