<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They should point into the same place.">
  <title>The two commands that end most confusion</title>
  <style>
    .which-python-which-pip-bg   { fill: #f8fafc; }
    .which-python-which-pip-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-python-which-pip-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-python-which-pip-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-python-which-pip-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-python-which-pip-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .which-python-which-pip-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-python-which-pip-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .which-python-which-pip-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .which-python-which-pip-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .which-python-which-pip-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .which-python-which-pip-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .which-python-which-pip-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .which-python-which-pip-row { opacity: 1; }
    .which-python-which-pip-r0 { animation-delay: 0.00s; }
    .which-python-which-pip-r1 { animation-delay: 0.45s; }
    .which-python-which-pip-r2 { animation-delay: 0.90s; }
    .which-python-which-pip-r3 { animation-delay: 1.35s; }
    .which-python-which-pip-r4 { animation-delay: 1.80s; }
    .which-python-which-pip-row { animation: which-python-which-pip-reveal 7.3s ease-in-out infinite; }
    @keyframes which-python-which-pip-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="which-python-which-pip-bg" width="980" height="390"/>
  <text class="which-python-which-pip-h1"  x="30" y="40">The two commands that end most confusion</text>
  <text class="which-python-which-pip-sub" x="30" y="64">They should point into the same place.</text>
  <rect class="which-python-which-pip-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="which-python-which-pip-name" x="46" y="122">Matched</text>
  <text class="which-python-which-pip-desc" x="46" y="142">Both inside the environment.</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r0" x="46" y="182">which python -&gt; .venv/bin/python</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r1" x="46" y="216">which pip    -&gt; .venv/bin/pip</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r2" x="46" y="250">pip installs where python looks</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r3" x="46" y="284">import works immediately</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r4" x="46" y="318">This is what activation produces</text>
  <rect class="which-python-which-pip-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="which-python-which-pip-name" x="526" y="122">Mismatched</text>
  <text class="which-python-which-pip-desc" x="526" y="142">Installing one place, looking in another.</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r0" x="526" y="182">which python -&gt; /usr/bin/python3</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r1" x="526" y="216">which pip    -&gt; .venv/bin/pip</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r2" x="526" y="250">pip installs into the venv</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r3" x="526" y="284">python looks at the system packages</text>
  <text class="which-python-which-pip-desc which-python-which-pip-row which-python-which-pip-r4" x="526" y="318">ModuleNotFoundError, right after success</text>
  <text class="which-python-which-pip-sub" x="30" y="372">Run both before believing anything else about a Python import problem. The pair takes two seconds and resolves the majority of them.</text>
</svg>
