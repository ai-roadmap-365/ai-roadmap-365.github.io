<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" font-family="system-ui, sans-serif">
  <title>Virtual environment isolation: one shared Python interpreter, but each project has its own virtual environment with its own separate packages, so their dependencies never collide</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Why each project gets its own virtual environment</text>

  <!-- Shared base Python -->
  <rect x="200" y="58" width="320" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Base Python interpreter (installed once)</text>
  <text x="360" y="108" text-anchor="middle" font-size="14" fill="#1a202c">shared by every project; the standard library lives here</text>

  <!-- arrows down to two venvs -->
  <line x1="300" y1="124" x2="215" y2="168" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="208,172 224,170 216,157" fill="#1d4ed8"/>
  <line x1="420" y1="124" x2="505" y2="168" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="512,172 504,157 496,170" fill="#1d4ed8"/>

  <!-- Project A venv -->
  <rect x="40" y="176" width="300" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="190" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Project A  ·  .venv</text>
  <text x="190" y="226" text-anchor="middle" font-size="14" fill="#1a202c">its own private packages folder</text>
  <rect x="64" y="240" width="252" height="96" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="190" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">installed here (example versions):</text>
  <text x="190" y="290" text-anchor="middle" font-size="14" fill="#1a202c">a data library, version 1.5</text>
  <text x="190" y="312" text-anchor="middle" font-size="14" fill="#1a202c">a plotting library, version 3.7</text>

  <!-- Project B venv -->
  <rect x="380" y="176" width="300" height="180" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="10"/>
  <text x="530" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Project B  ·  .venv</text>
  <text x="530" y="226" text-anchor="middle" font-size="14" fill="#1a202c">its own private packages folder</text>
  <rect x="404" y="240" width="252" height="96" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
  <text x="530" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">installed here (example versions):</text>
  <text x="530" y="290" text-anchor="middle" font-size="14" fill="#1a202c">the same data library, version 2.1</text>
  <text x="530" y="312" text-anchor="middle" font-size="14" fill="#1a202c">a web library, version 2.32</text>

  <!-- no-collision note -->
  <rect x="40" y="378" width="640" height="66" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Same library, two different versions, zero conflict.</text>
  <text x="360" y="428" text-anchor="middle" font-size="14" fill="#1a202c">Without venvs, both projects would share one global folder and the second install would overwrite the first.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 300 124 L 215 168" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 420 124 L 505 168" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
