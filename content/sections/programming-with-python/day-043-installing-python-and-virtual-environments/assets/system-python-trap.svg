<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The operating system is using it.">
  <title>Why not to install into the system Python</title>
  <style>
    .system-python-trap-bg   { fill: #f8fafc; }
    .system-python-trap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-python-trap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-python-trap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-python-trap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-python-trap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .system-python-trap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-python-trap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .system-python-trap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .system-python-trap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .system-python-trap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .system-python-trap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .system-python-trap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .system-python-trap-row { opacity: 1; }
    .system-python-trap-r0 { animation-delay: 0.00s; }
    .system-python-trap-r1 { animation-delay: 0.45s; }
    .system-python-trap-r2 { animation-delay: 0.90s; }
    .system-python-trap-r3 { animation-delay: 1.35s; }
    .system-python-trap-r4 { animation-delay: 1.80s; }
    .system-python-trap-row { animation: system-python-trap-reveal 7.3s ease-in-out infinite; }
    @keyframes system-python-trap-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="system-python-trap-bg" width="980" height="390"/>
  <text class="system-python-trap-h1"  x="30" y="40">Why not to install into the system Python</text>
  <text class="system-python-trap-sub" x="30" y="64">The operating system is using it.</text>
  <rect class="system-python-trap-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="system-python-trap-name" x="46" y="122">Into the system Python</text>
  <text class="system-python-trap-desc" x="46" y="142">Usually via sudo pip.</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r0" x="46" y="182">The OS uses this interpreter for its own tools</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r1" x="46" y="216">Its package manager believes it owns these files</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r2" x="46" y="250">Upgrading a shared library can break them</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r3" x="46" y="284">The error appears far from the cause</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r4" x="46" y="318">And affects every project at once</text>
  <rect class="system-python-trap-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="system-python-trap-name" x="526" y="122">Into an environment</text>
  <text class="system-python-trap-desc" x="526" y="142">A directory you own.</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r0" x="526" y="182">Nothing else depends on it</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r1" x="526" y="216">No elevated privileges needed</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r2" x="526" y="250">A mistake affects one project</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r3" x="526" y="284">Delete the folder to undo it entirely</text>
  <text class="system-python-trap-desc system-python-trap-row system-python-trap-r4" x="526" y="318">This is what the permission error was telling you</text>
  <text class="system-python-trap-sub" x="30" y="372">A permission error from pip is not an obstacle to get past with sudo. It is the system saying you are about to write somewhere that is not yours, and the correct response is to create an environment.</text>
</svg>
