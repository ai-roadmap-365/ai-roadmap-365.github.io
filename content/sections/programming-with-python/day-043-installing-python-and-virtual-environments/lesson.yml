title: 'Installing Python and Virtual Environments'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will have a working Python you can run from the terminal, and you will be able to create, activate, and reproduce an isolated virtual environment for any project — the foundation every reproducible AI project stands on.'
objectives:
  - 'Explain why Python is the dominant language for AI work: readability, a huge library ecosystem, and its role as a glue language'
  - 'Describe how Python runs code through the interpreter, distinguish a script from the REPL, and know why the course uses python3 rather than python'
  - 'Install Python by at least one method (python.org, an OS package manager, or pyenv for multiple versions) and use which python to confirm which interpreter runs'
  - 'Explain what a virtual environment is and why isolating each project''s packages prevents global pollution and version conflicts'
  - 'Create, activate, and deactivate a virtual environment with python -m venv, and install packages into it with pip'
  - 'Capture a project''s dependencies in a requirements.txt file and recreate the same environment elsewhere, connecting isolation to reproducible AI work'
prerequisites:
  - 'Course 1 fluency: comfort with the terminal, PATH (Day 11), and package managers (Day 13)'
  - 'A computer running macOS, Linux, or Windows with permission to open a terminal and install software'
