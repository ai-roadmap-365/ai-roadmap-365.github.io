visuals:
  - id: python-run
    file: assets/python-run.svg
    type: diagram
    title: 'How Python runs your code'
    alt: 'Diagram: how Python runs a script through the interpreter, and the read-eval-print loop of the REPL'
    description: 'An architecture diagram showing two paths into the same Python interpreter: a source file (hello.py) passing through python3 to produce output, and the REPL loop of read, evaluate, and print that feeds the interpreter one line at a time.'
  - id: venv-isolation
    file: assets/venv-isolation.svg
    type: diagram
    title: 'Why each project gets its own virtual environment'
    alt: 'Diagram: one shared Python with two projects that each keep their own packages in separate virtual environments'
    description: 'A flow diagram showing one shared base Python interpreter feeding two projects, each with its own .venv containing its own private packages — including the same library at two different versions — so their dependencies never collide the way they would in one shared global folder.'
  - id: shared-versus-isolated
    file: assets/shared-versus-isolated.svg
    type: diagram
    title: 'One shared package directory, or one per project'
    alt: 'Diagram: system-wide package installation compared with per-project environments'
    description: 'A two-column comparison of installing Python packages system-wide against installing them into per-project virtual environments, covering version conflicts and blast radius.'
  - id: three-steps-order
    file: assets/three-steps-order.svg
    type: diagram
    title: 'Create, activate, install — in that order'
    alt: 'Diagram: the three steps of setting up a virtual environment'
    description: 'A three-stage sequence covering creating a virtual environment, activating it in the current shell, and installing packages into it, emphasising that creation does not activate.'
  - id: activate-is-path
    file: assets/activate-is-path.svg
    type: diagram
    title: 'What activation actually does'
    alt: 'Diagram: how activating a virtual environment changes PATH'
    description: 'A four-stage explanation showing PATH before activation, the environment''s bin directory being prepended, the resulting change in which interpreter is found, and deactivation restoring the original value.'
  - id: which-python-which-pip
    file: assets/which-python-which-pip.svg
    type: diagram
    title: 'The two commands that end most confusion'
    alt: 'Diagram: diagnosing a mismatch between pip and python'
    description: 'A two-column comparison of a correctly activated environment against a mismatched one, showing how comparing the resolved paths of pip and python reveals the problem.'
  - id: pin-and-rebuild
    file: assets/pin-and-rebuild.svg
    type: diagram
    title: 'How an environment travels'
    alt: 'Diagram: pinning an environment and rebuilding it elsewhere'
    description: 'A four-stage sequence covering installing packages, freezing exact versions to a file, committing that file, and rebuilding an identical environment on another machine.'
  - id: system-python-trap
    file: assets/system-python-trap.svg
    type: diagram
    title: 'Why not to install into the system Python'
    alt: 'Diagram: the risk of installing packages into the system Python'
    description: 'A two-column comparison of installing into the system Python against installing into a virtual environment, covering what depends on the system interpreter and the consequences of changing it.'
  - id: venv-is-not-a-container
    file: assets/venv-is-not-a-container.svg
    type: diagram
    title: 'What a virtual environment does not isolate'
    alt: 'Diagram: what a virtual environment isolates and what it does not'
    description: 'A four-stage clarification of the scope of virtual environment isolation, covering Python packages, and the system libraries, drivers and interpreter that remain shared.'
  - id: version-or-packages
    file: assets/version-or-packages.svg
    type: diagram
    title: 'Two different problems, two different tools'
    alt: 'Diagram: managing Python versions compared with managing packages'
    description: 'A two-column comparison of tools that manage Python interpreter versions against tools that manage packages within one interpreter.'
  - id: first-checks
    file: assets/first-checks.svg
    type: diagram
    title: 'Four things to do in a new project'
    alt: 'Diagram: the setup checklist for a new Python project'
    description: 'A four-stage setup checklist for a new Python project covering environment creation, gitignore entries, activation habit, and pinning dependencies.'
