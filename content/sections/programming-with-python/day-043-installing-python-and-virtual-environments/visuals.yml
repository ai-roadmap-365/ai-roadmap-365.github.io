visuals:
  - id: python-run
    file: assets/python-run.svg
    type: diagram
    title: 'How Python runs your code'
    alt: 'Diagram: how Python runs a script through the interpreter, and the read-eval-print loop of the REPL'
    description: 'An architecture diagram showing two paths into the same Python interpreter: a source file (hello.py) passing through python3 to produce output, and the REPL loop of read, evaluate, and print that feeds the interpreter one line at a time.'
  - id: venv-isolation
    file: assets/venv-isolation.svg
    type: diagram
    title: 'Why each project gets its own virtual environment'
    alt: 'Diagram: one shared Python with two projects that each keep their own packages in separate virtual environments'
    description: 'A flow diagram showing one shared base Python interpreter feeding two projects, each with its own .venv containing its own private packages — including the same library at two different versions — so their dependencies never collide the way they would in one shared global folder.'
