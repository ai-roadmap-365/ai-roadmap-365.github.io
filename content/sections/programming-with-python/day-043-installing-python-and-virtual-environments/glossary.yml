terms:
  - term: interpreter
    definition: 'The program (run as python3) that reads Python code and executes it, either from a whole script file or one line at a time in the REPL.'
  - term: REPL
    definition: 'The read-eval-print loop: Python''s interactive prompt (>>>), where you type one line, it evaluates and prints the result, then waits for the next line.'
  - term: script
    definition: 'A file of Python code, run all at once with python3 filename.py, as opposed to typing lines interactively in the REPL.'
  - term: virtual environment
    definition: 'A lightweight, isolated folder that gives one project its own private set of installed packages, kept separate from the global Python and from other projects.'
  - term: venv
    definition: 'Python''s built-in module for creating virtual environments, used as python3 -m venv .venv; also a common name for the environment folder it creates.'
  - term: activate
    definition: 'To turn on a virtual environment (source .venv/bin/activate), which rewires the current shell so python and pip point inside that environment; deactivate turns it off.'
  - term: pip
    definition: 'Python''s package installer: the tool that downloads and installs libraries into whichever environment is active, by default from PyPI.'
  - term: PyPI
    definition: 'The Python Package Index, the public online repository of open-source Python libraries that pip downloads from by default.'
  - term: package
    definition: 'A reusable library of Python code, published on PyPI and installed with pip, that adds functionality beyond the standard library.'
  - term: dependency
    definition: 'A package that a project needs in order to run; a project''s dependencies (and their exact versions) are what a virtual environment isolates and requirements.txt records.'
  - term: requirements.txt
    definition: 'A plain-text file listing a project''s packages and their exact versions, used with pip install -r requirements.txt to recreate the same environment elsewhere.'
  - term: pyenv
    definition: 'A tool that installs and switches between multiple versions of Python on one machine; it manages Python versions and pairs with venv, which manages packages.'
  - term: standard library
    definition: 'The large set of modules that ships with Python itself, available without installing anything from PyPI.'
