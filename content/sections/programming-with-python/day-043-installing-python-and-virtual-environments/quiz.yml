questions:
  - question: 'What is the Python "interpreter"?'
    options:
      - 'A website that translates Python into other programming languages'
      - 'The program (run as python3) that reads your code and executes it'
      - 'A file that lists which packages a project needs'
      - 'The folder where installed packages are stored'
    answer_index: 1
    explanation: 'Python is both a language and the program that runs code written in it. That program is the interpreter, usually invoked as python3, and it can run a whole script file or accept lines interactively in the REPL.'

  - question: 'What is the difference between running a script and using the REPL?'
    options:
      - 'A script runs an entire file at once; the REPL evaluates one typed line at a time interactively'
      - 'A script needs a virtual environment but the REPL does not'
      - 'The REPL runs faster because it skips the interpreter'
      - 'Scripts use python3 while the REPL uses a completely different program'
    answer_index: 0
    explanation: 'Both feed the same interpreter. Handing it a file (python3 hello.py) runs the whole file top to bottom; starting python3 with no file gives the REPL — read, evaluate, print, loop — where you type one line at a time.'

  - question: 'Why does this course prefer the command python3 over python?'
    options:
      - 'python3 runs three times faster than python'
      - 'python is only available on Windows'
      - 'On many systems python historically meant Python 2, while python3 explicitly and portably names Python 3'
      - 'python cannot create virtual environments'
    answer_index: 2
    explanation: 'During the long overlap between Python 2 and Python 3, many machines shipped both, with python meaning the old Python 2. python3 removes the ambiguity and works portably across systems.'

  - question: 'What problem does a virtual environment primarily solve?'
    options:
      - 'It makes Python code run faster at runtime'
      - 'It lets different projects keep their own package versions so they do not conflict in one shared global location'
      - 'It encrypts your source code for security'
      - 'It replaces the need to install Python at all'
    answer_index: 1
    explanation: 'Without isolation, all projects share one global pile of packages, so one project needing a different version of a library breaks another. A venv gives each project a private package folder, ending those collisions.'

  - question: 'After running source .venv/bin/activate, how can you confirm the environment is active?'
    options:
      - 'Restart the computer and check again'
      - 'Run which python and see a path ending in .venv/bin/python (and often a (.venv) prompt marker)'
      - 'Check that the file requirements.txt exists'
      - 'Run python3 --version and confirm it prints 3.x'
    answer_index: 1
    explanation: 'Activation rewires the current shell so python and pip point inside the venv. which python then prints a path inside .venv, and most shells also show a (.venv) marker in the prompt. sys.prefix pointing inside .venv is the definitive proof.'

  - question: 'What is the relationship between pip and PyPI?'
    options:
      - 'They are two names for the same program'
      - 'pip is the online repository and PyPI is the installer'
      - 'pip is the installer program; PyPI (the Python Package Index) is the online repository it downloads packages from'
      - 'PyPI is a virtual environment manager and pip creates environments'
    answer_index: 2
    explanation: 'pip is the tool that installs packages, and by default it fetches them from PyPI, the public online index of open-source Python libraries — the Python-specific version of the package-manager idea from Day 13.'

  - question: 'What does a requirements.txt file give you?'
    options:
      - 'A backup copy of your source code'
      - 'A text recipe of the exact packages and versions, so the same environment can be recreated elsewhere'
      - 'A faster interpreter for large projects'
      - 'Automatic activation of the virtual environment'
    answer_index: 1
    explanation: 'pip freeze writes every installed package and its exact version to requirements.txt. Running pip install -r requirements.txt in a fresh venv rebuilds the identical set of packages, which is what makes an environment reproducible across machines and time.'

  - question: 'You need Python 3.11 for one project and Python 3.13 for another on the same machine. Which tool is designed for that?'
    options:
      - 'venv, by creating two environments'
      - 'pip, by installing both versions'
      - 'pyenv, which installs and switches between multiple Python versions'
      - 'requirements.txt, by listing both versions'
    answer_index: 2
    explanation: 'A venv isolates packages but shares one base interpreter. Switching between different Python versions is a separate job handled by a version manager like pyenv, which installs and selects among multiple Python versions and pairs with venv rather than replacing it.'
