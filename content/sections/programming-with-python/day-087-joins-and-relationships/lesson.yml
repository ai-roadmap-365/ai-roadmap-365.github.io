title: 'Joins and Relationships'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to say why data belongs in more than one table — by reproducing the update, insertion and deletion anomalies of a single wide table yourself — and then put the pieces back together on demand: modelling one-to-many with the key on the many side and many-to-many with a junction table keyed on the pair, writing inner, left outer, cross, self and multi-table joins while being able to state exactly which rows each keeps and which columns it fills with NULL, reaching for the LEFT JOIN plus IS NULL idiom whenever a question is about absence, avoiding the two separate mistakes that turn a per-group count of zero into a wrong answer, knowing why an outer join predicate belongs in ON rather than WHERE, proving for yourself that SQLite enforces no foreign key until PRAGMA foreign_keys = ON is issued on that connection, and implementing both a nested-loop and a hash join in plain Python so that the algorithm the query planner is choosing between is one you have written.'
objectives:
  - 'Reproduce the update, insertion and deletion anomalies of a single wide table mechanically, and explain why each disappears when the table is split into tables that are each about one kind of thing'
  - 'State what a foreign key actually promises and what it does not — that it creates no index, performs no join, and in SQLite enforces nothing until it is switched on'
  - 'Model a one-to-many relationship by putting the foreign key on the many side, and justify why it cannot go on the other side in terms of what a single column can hold'
  - 'Model a many-to-many relationship with a junction table keyed on the pair, and recognise it as two one-to-many relationships back to back'
  - 'Write INNER JOIN with an explicit ON clause, recognise the older comma-join-with-WHERE form, and give a concrete reason the explicit form is safer rather than merely more modern'
  - 'Say exactly which rows a LEFT OUTER JOIN keeps and which columns come back NULL, and explain that this NULL is manufactured by the join rather than stored in any table'
  - 'Use the LEFT JOIN plus IS NULL anti-join idiom to find rows with no match, and explain why it is the shape of every question about absence'
  - 'Recognise an accidental cartesian product from its row count and from its query plan, and apply the rule that N tables need at least N minus 1 join conditions'
  - 'Produce a per-group count that correctly shows zero, naming the two separate mistakes — an inner join, and count(*) instead of count of a right-hand column — that each silently break it'
  - 'Explain why an outer join predicate belongs in ON rather than WHERE, and demonstrate on real data that moving it wrongly drops one row and wrongly keeps another at the same time'
  - 'Write a self-join with two aliases, and a join across four tables, explaining the row duplication a many-to-many introduces rather than hiding it with SELECT DISTINCT'
  - 'Prove that SQLite leaves foreign-key enforcement off by default, enable it per connection, and avoid the documented trap that makes the pragma a silent no-op inside an open transaction'
  - 'Implement a nested-loop join and a hash join over lists of dictionaries, compare their cost as a product against a sum, and check both against the database for exact equality'
  - 'Compare how the same relationships are modelled and joined in PostgreSQL, MySQL, DuckDB and plain Python dictionaries, and judge the N+1 query pattern from measured numbers rather than from a slogan'
prerequisites:
  - 'Day 85 — the relational model, tables, rows, types, and working with SQLite from the shell and from Python'
  - 'Day 86 — SELECT with WHERE, ORDER BY, GROUP BY and aggregates, and especially NULL''s three-valued logic, which today''s outer joins lean on constantly'
  - 'Day 53 — dictionaries in depth; the hash join is a dictionary, and knowing that a lookup is roughly constant-time is what makes the cost comparison land'
  - 'Day 66 — exceptions, for reading the IntegrityError a rejected foreign key raises'
  - 'Day 43 — a working python3 on your PATH; the lab needs the standard library only'
