<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to join</title>
  <style>
    .join-when-bg   { fill: #f8fafc; }
    .join-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .join-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .join-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .join-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .join-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .join-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .join-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .join-when-row { opacity: 1; }
    .join-when-r0 { animation-delay: 0.00s; }
    .join-when-r1 { animation-delay: 0.45s; }
    .join-when-r2 { animation-delay: 0.90s; }
    .join-when-r3 { animation-delay: 1.35s; }
    .join-when-r4 { animation-delay: 1.80s; }
    .join-when-row { animation: join-when-reveal 7.3s ease-in-out infinite; }
    @keyframes join-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="join-when-bg" width="980" height="390"/>
  <text class="join-when-h1"  x="30" y="40">When to join</text>
  <text class="join-when-sub" x="30" y="64">And when not to.</text>
  <rect class="join-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="join-when-name" x="46" y="122">Join</text>
  <text class="join-when-desc" x="46" y="142">Four cases.</text>
  <text class="join-when-desc join-when-row join-when-r0" x="46" y="182">Related data in normalised tables</text>
  <text class="join-when-desc join-when-row join-when-r1" x="46" y="216">You need fields from both sides</text>
  <text class="join-when-desc join-when-row join-when-r2" x="46" y="250">Filtering one side by the other</text>
  <text class="join-when-desc join-when-row join-when-r3" x="46" y="284">Reporting across entities</text>
  <text class="join-when-desc join-when-row join-when-r4" x="46" y="318">Where keys are indexed</text>
  <rect class="join-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="join-when-name" x="526" y="122">Consider otherwise</text>
  <text class="join-when-desc" x="526" y="142">Also four.</text>
  <text class="join-when-desc join-when-row join-when-r0" x="526" y="182">Read-heavy analytics — pre-join once</text>
  <text class="join-when-desc join-when-row join-when-r1" x="526" y="216">Data in different systems</text>
  <text class="join-when-desc join-when-row join-when-r2" x="526" y="250">Very wide fan-out multiplying rows</text>
  <text class="join-when-desc join-when-row join-when-r3" x="526" y="284">A single lookup — a subquery is clearer</text>
  <text class="join-when-desc join-when-row join-when-r4" x="526" y="318">Where denormalising is measured and deliberate</text>
  <text class="join-when-sub" x="30" y="372">Deliberate denormalisation is a legitimate choice for analytics, provided the duplication is generated rather than maintained by hand.</text>
</svg>
