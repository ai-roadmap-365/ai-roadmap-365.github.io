visuals:
  - id: relationships-architecture
    file: assets/relationships-architecture.svg
    type: diagram
    title: 'The library schema: five tables, their keys, and the cardinality of every relationship'
    alt: 'Diagram: the library schema with five tables — books and authors joined through a book_authors junction table making a many-to-many relationship, members referencing themselves through referred_by, and loans carrying a foreign key to both books and members — with primary keys, foreign keys and the cardinality of each relationship labelled'
    description: 'An entity diagram of the five tables the lesson and its lab use. Across the top sit books (primary key book_id, plus title and published_year), the book_authors junction table, and authors (primary key author_id, plus name and birth_year). The junction table is drawn with a heavier outline and lists book_id and author_id each marked both PK and FK, with a note that the key is the pair. Arrows run from the junction table outward to books and to authors, each labelled many to one, under a caption explaining that books and authors are many-to-many and that a junction table is simply two one-to-many relationships back to back. Below, the loans table (primary key loan_id, foreign keys book_id and member_id, plus borrowed_on and a nullable returned_on) sits between members (primary key member_id, plus name, joined_on and a foreign key referred_by) and an explanatory panel. Arrows run from loans to members and from loans up to books, each labelled many to one, showing that the key lives on the many side. A separate green arrow loops from members back into itself, with notes explaining that referred_by holds a member_id, that it is nullable because the first members were referred by nobody, and that joining a table to itself is a self-join needing two aliases. The panel on the right states the placement rule: in a one-to-many the key goes on the many side, so book_id lives in loans rather than a list of loans being stored inside books; in a many-to-many neither side can hold it, so it goes in a table of its own. Two closing lines record that in SQLite a foreign key is not enforced until PRAGMA foreign_keys equals ON is issued, per connection every time, and that a foreign key also does not create an index, so one must be added on every foreign-key column or each join across it scans the whole table.'
  - id: join-flow
    file: assets/join-flow.svg
    type: flow-animated
    title: 'How a join matches rows: probe, test, and assemble the output'
    alt: 'Diagram: how a join matches rows — a probe row travels from the left members table to test each row of the right loans table, matching pairs assemble into an output row below, and the one unmatched left row survives with NULL under LEFT JOIN while INNER JOIN drops it'
    description: 'An animated flow diagram in three parts, readable in full as a still image. At the top left is a members table with concrete values: member_id 1 Ada, 2 Bruno, 3 Chandra, and 5 Eli, whose row is highlighted in amber. At the top right is a loans table with loan_id 1 for member 1, loan_id 3 for member 2, and loan_id 4 for member 3, under the heading that the join predicate is ON m.member_id equals l.member_id. A marching-dash arrow labelled probe runs between the two tables, and a blue token travels along it and down the right-hand table; each right-hand row lights up briefly in turn as the probe tests it, and each is annotated tested, equal, keep. Eli''s row is annotated that no loan anywhere has member_id 5. Below, an output table shows one row per matching pair: Ada with loan 1, Bruno with loan 3 and Chandra with loan 4, each marked as kept by INNER and LEFT, and then a fourth amber row for Eli whose loan_id column reads NULL, marked as kept by LEFT only because INNER drops it. Notes at the right record that INNER JOIN returns three rows while LEFT JOIN returns four because every left row survives whether it matched or not, and that the NULL is not stored anywhere — the join invents it to fill the columns that had no matching row. A closing line notes that adding WHERE loan_id IS NULL keeps only the last row, which is the anti-join for finding left rows with no match on the right. The animation is a travelling probe token, marching dashes on the predicate arrow, and staggered highlighting of the candidate rows and the assembled output rows; a prefers-reduced-motion block stops all of it and restores full opacity and zero offset, and every value, label and result row is present in the resting frame.'
