terms:
  - term: 'Join'
    definition: 'An operation that combines rows from two tables into one result, pairing each row on the left with the rows on the right that satisfy a condition you supply. Nothing is stored joined: the result is assembled when you ask and thrown away when you are done. A left row matching three right rows produces three output rows, so joining does not preserve your row count.'
  - term: 'Join predicate'
    definition: 'The condition in the ON clause that decides which pairs of rows belong together, usually an equality between a foreign key on one side and a primary key on the other. On an outer join it is not interchangeable with a WHERE clause: the predicate in ON decides what counts as a match, while WHERE filters the finished result after the NULL-filling has already happened.'
  - term: 'Primary key'
    definition: 'The column, or set of columns, that identifies a row uniquely within its table. In a junction table it is the pair of foreign keys together, which is what makes it impossible to record the same relationship twice.'
  - term: 'Foreign key'
    definition: 'A column whose values are required to appear as a primary key in another table. It promises that every non-NULL value here exists as a parent row, that you cannot insert a child pointing at a missing parent, and that deleting a parent with children follows whatever the schema says. It does not create an index, does not perform the join, and — in SQLite — does not enforce anything until PRAGMA foreign_keys is switched on.'
  - term: 'Referential integrity'
    definition: 'The property that every foreign-key value actually points at a row that exists, so the database contains no references to nothing. It is an integrity control rather than a security control: it stops a loan pointing at a member who does not exist, and stops nothing else. PRAGMA foreign_key_check reports where it has already been violated.'
  - term: 'Orphan row'
    definition: 'A child row whose foreign key points at a parent that does not exist. In SQLite these accumulate silently in any database written to by an application that never enabled foreign-key enforcement, because the insert that creates one succeeds with no error and no warning.'
  - term: 'Cardinality'
    definition: 'How many rows on one side of a relationship correspond to how many on the other: one-to-one, one-to-many, or many-to-many. It decides where the key goes. In a one-to-many the foreign key lives on the many side, because a column holds one value; in a many-to-many neither side can hold it, so the relationship needs a table of its own.'
  - term: 'Junction table'
    definition: 'A table whose only job is to record a many-to-many relationship, holding one foreign key to each side and keyed on the pair. Also called a bridge, link or associative table. It is not a special kind of object: it is two one-to-many relationships back to back, which is why joining across it always takes two JOIN clauses.'
  - term: 'Inner join'
    definition: 'The default join. Rows that satisfy the predicate come through, one output row per matching pair; rows on either side that match nothing are dropped. This is precisely why it is the wrong join for any question about absence — the rows you are looking for are the ones it removes.'
  - term: 'Outer join'
    definition: 'A join that keeps rows which matched nothing. LEFT keeps every row from the left table, filling the right-hand columns with NULL when there was no match; RIGHT is its mirror image and is rarely needed, since swapping the table order and using LEFT is easier to read; FULL keeps unmatched rows from both sides. The NULL an outer join produces is not stored in any table — the join manufactures it to fill columns that had no matching row.'
  - term: 'Anti-join'
    definition: 'The idiom for finding rows with no match: LEFT JOIN the other table, then keep only the rows where its columns came back NULL, which can happen for exactly one reason. Worth memorising as a unit, because it is the shape of every question about absence — which customers never ordered, which documents were never embedded, which books nobody has borrowed.'
  - term: 'Self-join'
    definition: 'A table joined to itself, with two distinct aliases so the query can tell the copies apart. It relates rows to other rows in the same table: employees to managers, members to whoever referred them, replies to the comment they answer. Use LEFT unless you specifically want to exclude the rows that reference nobody, because an inner self-join silently drops them.'
  - term: 'Cartesian product'
    definition: 'Every row of one table paired with every row of another, which is what a join with no condition produces — four books and seven authors give twenty-eight rows. Usually accidental, caused by a forgotten join condition, and the rule of thumb is that N tables need at least N minus 1 of them. At real scale it is a denial of service: two tables of ten thousand rows produce a hundred million, and the database will honestly try.'
  - term: 'Normalization'
    definition: 'Organising tables so that each is about one kind of thing and every fact is written down in exactly one place, eliminating the update, insertion and deletion anomalies. Developed by E. F. Codd through 1971 and 1972 as the first three normal forms. It moves cost from writes to reads: you store each fact once and pay a join to reassemble it.'
  - term: 'Update anomaly'
    definition: 'The failure where a fact stored in several rows is corrected in some of them and not others, leaving the database contradicting itself with no error raised. The most dangerous of the three anomalies precisely because it is silent: nothing marks which of the two values is the right one.'
  - term: 'Insertion anomaly'
    definition: 'The failure where a fact cannot be recorded because the table has no row shape for it — an author cannot be entered until one of their books is, because every column describing the book is NOT NULL. A fact about the world with no home in your schema.'
  - term: 'Deletion anomaly'
    definition: 'The failure where removing one fact removes another that happened to share the row — withdrawing a library''s only copy of a book also erases the only record that its author exists. You meant to remove a book and you removed a person.'
  - term: 'Denormalization'
    definition: 'Deliberately storing data pre-joined, trading the three anomalies back in exchange for faster reads. A legitimate engineering decision when you have measured the need and can name every code path that must keep the copies in step. Doing it without that plan is choosing the update anomaly on purpose.'
  - term: 'Nested-loop join'
    definition: 'The straightforward join algorithm: for every row on the left, scan every row on the right. Its cost is the product of the two table sizes — six rows against five is thirty comparisons. When the inner scan is replaced by an index lookup it becomes an indexed nested loop, which SQLite reports in EXPLAIN QUERY PLAN as a SCAN of one table and a SEARCH of the other.'
  - term: 'Hash join'
    definition: 'The join algorithm that builds a dictionary from one side once and then looks each row of the other side up in it. Its cost is the sum rather than the product of the two sizes — six rows and five is eleven operations. Identical results to a nested loop; the entire difference is that one grows as the product and the other as the sum.'
  - term: 'Query planner'
    definition: 'The part of the database that decides how to answer a query — which join algorithm to use, which table to read first, which index to use. EXPLAIN QUERY PLAN shows what it chose: SCAN means read every row, SEARCH means jump to matching rows through an index, and two bare SCANs with nothing between them is a cartesian product you can see before you run it.'
  - term: 'N+1 queries'
    definition: 'The pattern where a program runs one query to fetch a list and then one more query per item, where a single join would have answered the whole question. The penalty depends entirely on deployment: measured on an embedded database, 501 queries against 1 cost 0.79 ms against 0.44 ms, because a query is a function call in the same process. Across a network each of those queries is a round trip, and the same pattern becomes unusable.'
  - term: 'PRAGMA foreign_keys'
    definition: 'The SQLite setting that turns foreign-key enforcement on. Enforcement arrived in version 3.6.19 (2009) and was disabled by default for backwards compatibility, so it must be issued for every connection. It cannot be stored in the database file, and it is documented as a no-op inside a transaction that returns no error and simply has no effect — which is why it is silently ignored in Python if issued after the first write, and why the habit is to issue it as the first statement after connecting.'
