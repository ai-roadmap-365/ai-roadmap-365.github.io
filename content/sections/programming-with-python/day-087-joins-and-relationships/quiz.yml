questions:
  - question: 'A LEFT OUTER JOIN from members to loans is run against a library where one member has never borrowed anything. Which rows does the result contain?'
    options:
      - 'Every member who has at least one loan, one row per loan — the unmatched member is dropped'
      - 'Every member exactly once, with the loans columns holding the most recent loan'
      - 'Every loan, plus one row for each member, concatenated'
      - 'Every member, with one row per loan for those who have loans and a single row with NULL in every loans column for the member who has none'
    answer_index: 3
    explanation: 'A LEFT OUTER JOIN keeps every row from the left table regardless of whether it matched. Rows that matched produce one output row per matching pair — so a member with two loans produces two rows, and joining does not preserve your row count. The row that matched nothing survives exactly once, with every column that came from the right table set to NULL. That NULL is worth being precise about: it is not stored in any table. The join manufactures it on the spot to fill the columns that had no matching row, which is exactly why it then flows into every WHERE clause and aggregate downstream and behaves according to three-valued logic. Option 0 describes an INNER JOIN, which is precisely the join that removes the row you were looking for.'

  - question: 'On a brand-new SQLite connection, you insert a row into a child table whose foreign key points at a parent row that does not exist. What happens?'
    options:
      - 'The insert is rejected with FOREIGN KEY constraint failed, because the REFERENCES clause is in the schema'
      - 'The insert succeeds, because SQLite disables foreign-key enforcement by default and it must be enabled separately for every connection'
      - 'The insert succeeds but SQLite writes a warning to stderr'
      - 'The insert succeeds only if the column is nullable; otherwise it is rejected'
    answer_index: 1
    explanation: 'SQLite gained foreign key enforcement in version 3.6.19 (14 October 2009), nine years after its first release, and because a decade of databases already existed that would break under it, the documentation states that constraints are "disabled by default (for backwards compatibility), so must be enabled separately for each database connection". The orphan row is inserted with no error and no warning. Three properties follow and all three catch people out: the setting is per connection, so every new connect() starts with it off; it cannot be stored in the database file, so the application must issue it every time; and it is documented as a no-op inside a transaction that "does not return an error; it simply has no effect". PRAGMA foreign_key_check will find orphans that are already there.'

  - question: 'This query reports 1 for a member who has never borrowed anything: SELECT m.name, count(*) FROM members m LEFT JOIN loans l ON l.member_id = m.member_id GROUP BY m.member_id. Why?'
    options:
      - 'The LEFT JOIN is wrong; it should be an INNER JOIN'
      - 'GROUP BY always produces at least one row per group with a count of 1'
      - 'count(*) counts rows, and the NULL-extended row the outer join manufactured for that member is still a row — count(l.loan_id) would correctly report 0 because aggregates skip NULLs'
      - 'The member has a loan record that was deleted but not vacuumed'
    answer_index: 2
    explanation: 'Two separate decisions have to be right to get a genuine zero, and this query got one of them wrong. The LEFT JOIN is correct and necessary — switching to INNER JOIN would drop the member from the report entirely, which is worse, because a "loans per member" report that silently omits the members with no loans is exactly backwards. The bug is count(*), which counts rows without looking at their contents, and the outer join produced one row for this member with every loans column NULL. Counting a column from the right-hand table instead — count(l.loan_id) — gives 0, because aggregate functions skip NULLs. This is Day 86''s three-valued logic arriving with a bill.'

  - question: 'You move the predicate l.returned_on IS NULL from the ON clause of a LEFT JOIN into the WHERE clause. On the lesson''s library data the result goes from 5 rows to 4. What is wrong with the 4-row result?'
    options:
      - 'Nothing — ON and WHERE are interchangeable, and the shorter result is simply more concise'
      - 'It is missing one member, which is the only error'
      - 'It is wrong in both directions: it drops a member who has genuinely returned everything, and it keeps a member who has never borrowed at all, showing her as though she had a book out'
      - 'It returns the same members but in a different order'
    answer_index: 2
    explanation: 'On an INNER JOIN the two are interchangeable. On an OUTER JOIN they are not, because the NULL-filling happens after ON and before WHERE. Both failures show up here at once. Dana Whitfield disappears: she has loans, but all of them carry a returned_on date, so every one of her rows fails the WHERE test and she vanishes with no surviving row. Eli Nakamura survives: she has never borrowed anything, so the outer join manufactured a NULL-extended row for her, and returned_on IS NULL is perfectly true of a manufactured NULL — a false positive dressed as a result. The rule: ON decides what counts as a match, so filters on the right-hand table belong there; WHERE filters the finished result. The deliberate exception is WHERE right.key IS NULL, which is the anti-join and works precisely because it collapses the outer join down to the unmatched rows.'

  - question: 'Why does a many-to-many relationship between books and authors require a third table?'
    options:
      - 'It does not; you can store a comma-separated list of author IDs in the books table'
      - 'Because a column holds one value, so neither side can hold the relationship — and the junction table''s primary key is the pair, which is what prevents attaching the same author to the same book twice'
      - 'Because SQLite does not allow two foreign keys in the same table'
      - 'For performance only; a third table makes the join faster but is not logically required'
    answer_index: 1
    explanation: 'A one-to-many relationship is modelled by putting the foreign key on the many side — book_id lives in loans, not a list of loans inside books — and the reason is that a column holds one value. In a many-to-many, both sides are the many side, so neither can hold the key and the relationship gets a table of its own. Making its primary key the pair (book_id, author_id) is what makes it impossible to attach the same author to the same book twice, a constraint you would otherwise enforce in application code and eventually get wrong. A junction table is not a special kind of object: it is two one-to-many relationships back to back, which is why joining across it always takes two JOIN clauses. Option 0 is the trap: the moment you have a list in a cell you have lost the ability to index it, join on it, or constrain it.'

  - question: 'A join between two tables of 10,000 rows each returns 100,000,000 rows. What has almost certainly happened, and what does EXPLAIN QUERY PLAN show?'
    options:
      - 'A missing or incorrect join condition, producing a cartesian product — the plan shows two bare SCANs with nothing tying them together'
      - 'A duplicate primary key in one of the tables'
      - 'The query needs an ORDER BY to deduplicate the output'
      - 'A LEFT JOIN was used where an INNER JOIN was needed'
    answer_index: 0
    explanation: '100,000,000 is exactly 10,000 x 10,000, which is the signature of a cartesian product: every left row paired with every right row because nothing constrained the match. The rule of thumb is that N tables need at least N minus 1 join conditions, and dropping a single condition from a three-table join in the lab turns 7 correct rows into 49. EXPLAIN QUERY PLAN shows this before you run anything: SCAN means read every row and SEARCH means jump to the matching rows through an index, so a SCAN plus a SEARCH is an indexed nested-loop join while two bare SCANs is the product. This matters beyond correctness — at real scale the database will honestly try to produce all hundred million rows, which on a shared server is an outage caused by a query that looked fine in review.'

  - question: 'Which pair of statements about foreign keys is true?'
    options:
      - 'A foreign key creates an index on the column, and performs the join for you when you query the parent table'
      - 'A foreign key creates an index but only in PostgreSQL, and it makes JOIN keywords unnecessary'
      - 'A foreign key requires the referencing column to be NOT NULL, and automatically cascades deletes'
      - 'A foreign key creates no index, so you must add one yourself or every join across it is a full table scan — and it does not perform any join; it only guarantees the join will find something'
    answer_index: 3
    explanation: 'Both halves surprise people. Declaring book_id INTEGER REFERENCES books(book_id) builds no index on book_id, so every join across it — and every referential-integrity check on the child side — scans the whole table; the lab''s schema adds the indexes explicitly with a comment saying why. And a foreign key is a constraint, not a traversal: you still write the JOIN, and the key only promises the join will find a matching parent. Two further non-promises: a nullable foreign key may be NULL, meaning "this row references nothing" (the lab''s members.referred_by is exactly that), and delete behaviour is whatever the schema says — CASCADE, SET NULL or RESTRICT — not an automatic cascade.'

  - question: 'A nested-loop join and a hash join over the same two tables return identical results. What is the difference between them?'
    options:
      - 'The hash join returns approximate matches, trading accuracy for speed'
      - 'The nested loop scans every right row for each left row, costing n times m; the hash join indexes the right side once and then probes it once per left row, costing n plus m'
      - 'The nested loop works only on sorted input; the hash join works on unsorted input'
      - 'They are the same algorithm under different names'
    answer_index: 1
    explanation: 'Both are exact and both return the same rows — the lab asserts that the two hand-written implementations agree with each other and with SQLite, row for row. The entire difference is cost. The nested loop compares everything with everything: 6 loans against 5 members is 30 comparisons. The hash join has a build phase that touches each right row once and a probe phase that touches each left row once: 6 plus 5 is 11 operations. At that scale the gap is nothing, which is the point of measuring it there; at 10,000 by 10,000 it is a hundred million against twenty thousand, because one grows as the product and the other as the sum. This is the choice a query planner is making, and EXPLAIN QUERY PLAN lets you see which it took.'
