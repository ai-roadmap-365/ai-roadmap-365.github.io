terms:
  - term: standard library
    definition: 'The large collection of modules distributed with the Python interpreter itself, available with a simple import and no installation — the "batteries included" that let a great deal of everyday work happen with nothing to download.'
  - term: module
    definition: 'A file of Python code you import to reuse its functions and classes; the standard library is a vast, pre-installed set of such modules, and you import only the specific ones you need (import json, from pathlib import Path).'
  - term: pathlib
    definition: 'The standard-library module for filesystem paths as objects rather than strings: Path("data") / "file.json" joins correctly on any operating system, and .glob / .rglob walk folders for matching files. The modern replacement for os.path.'
  - term: datetime
    definition: 'The standard-library module for dates and times as real objects that know the calendar: datetime.now() stamps the current moment, .isoformat() and .strftime() format it, and timedelta does correct date arithmetic across days.'
  - term: collections
    definition: 'A standard-library module of specialised container types, most notably Counter (tally an iterable), defaultdict (group without checking whether a key exists), and namedtuple (a small record type with named fields).'
  - term: Counter
    definition: 'A collections type that tallies how many times each value appears in any iterable in a single call; Counter.most_common(n) returns the counts largest-first, answering "which category is biggest?" in one line.'
  - term: defaultdict
    definition: 'A collections type that supplies a default value for a missing key automatically, so you can append to defaultdict(list)[key] without first checking whether the key exists — removing the "if key in d" boilerplate of grouping.'
  - term: json
    definition: 'The standard-library module for the JSON data format: json.dump / json.dumps turn Python objects into JSON text, and json.load / json.loads turn JSON text back into Python objects — the safe, cross-language way to save and reload structured data.'
  - term: itertools
    definition: 'A standard-library module of fast, memory-light building blocks for iterators, such as chain (join iterables end to end), islice (slice without building a list), and groupby (group adjacent equal items) — lazy pipelines over sequences.'
  - term: random
    definition: 'The standard-library module for pseudo-random choices: random.choice, random.shuffle, and random.sample draw from data, and random.seed(n) fixes the sequence so a "random" result becomes reproducible across runs and machines.'
  - term: statistics
    definition: 'The standard-library module for basic descriptive statistics over plain Python data: statistics.mean, median, and stdev summarise a list of numbers without needing NumPy for small, everyday summaries.'
  - term: dependency
    definition: 'A third-party package your program relies on, installed from the Python Package Index with pip (for example NumPy, pandas, or requests). Every dependency adds capability but also setup, size, security surface, and a maintenance burden — so you add one only when it clearly pays.'
