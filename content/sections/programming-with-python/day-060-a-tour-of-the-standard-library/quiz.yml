questions:
  - question: 'What does "the standard library" mean in Python?'
    options:
      - 'The set of modules that ship with Python and are available without installing anything'
      - 'The most popular packages people download from the Python Package Index'
      - 'A single large module you import all at once with "import stdlib"'
      - 'The built-in functions like len and print that need no import'
    answer_index: 0
    explanation: 'The standard library is the large collection of modules distributed with the Python interpreter itself. You import the ones you need (import json, from pathlib import Path) with nothing to install — distinct from PyPI packages, which you download with pip, and from the always-available built-ins.'

  - question: 'Which standard-library module would you reach for to walk a folder of files and inspect their paths?'
    options:
      - 'datetime'
      - 'pathlib'
      - 'random'
      - 'statistics'
    answer_index: 1
    explanation: 'pathlib gives you filesystem path objects: Path("data") / "results.json" joins correctly on any OS, and .glob / .rglob walk a folder for matching files. It is the modern, object-oriented replacement for string-based os.path work.'

  - question: 'You have a list of file extensions and want to know how many times each appears. What is the cleanest standard-library tool?'
    options:
      - 'Loop over the list and update a plain dict, checking "if key in counts" each time'
      - 'Use itertools.chain to join the list to itself'
      - 'collections.Counter(extensions), then most_common() to sort the tally'
      - 'json.dumps the list and count the characters'
    answer_index: 2
    explanation: 'collections.Counter tallies any iterable in one call and Counter.most_common() returns the counts largest-first. It is both shorter and faster than the manual dict-with-a-check that a plain loop requires.'

  - question: 'Why does random.seed(42) matter for reproducible AI work?'
    options:
      - 'It makes random numbers cryptographically secure'
      - 'It speeds up the random module noticeably'
      - 'It is required before you may call random.choice at all'
      - 'It fixes the sequence of "random" values, so a teammate re-running the script gets the same shuffle or sample'
    answer_index: 3
    explanation: 'Seeding the random number generator makes its output deterministic: the same seed produces the same sequence. That is what lets a "random" train/test split or shuffle be reproduced exactly by anyone who runs your code — essential for comparable experiments.'

  - question: 'What is the "standard-library-first" judgement?'
    options:
      - 'Never install any third-party package under any circumstances'
      - 'Try a built-in module first, and add a dependency only when it clearly pays for its cost in setup, size, and maintenance'
      - 'Always install a package because outside libraries are more capable than built-ins'
      - 'Import the entire standard library at the top of every script just in case'
    answer_index: 1
    explanation: 'The discipline is to prefer the standard library for everyday work — files, dates, counting, JSON — because it costs nothing to reach and keeps projects portable, and to spend a dependency (NumPy, pandas, requests) only where the capability genuinely earns its ongoing cost.'

  - question: 'Which pair of functions moves data between a Python object and JSON text?'
    options:
      - 'json.read and json.write'
      - 'json.encode and json.decode'
      - 'json.parse and json.stringify'
      - 'json.dumps (object to text) and json.loads (text to object)'
    answer_index: 3
    explanation: 'json.dumps serialises a Python object to a JSON string (and json.dump writes to a file); json.loads parses a JSON string back to a Python object (and json.load reads from a file). It is the standard, cross-language way to save and reload small structured results.'

  - question: 'When is the standard library NOT the right tool, so a third-party package genuinely pays?'
    options:
      - 'Heavy numerical work over large arrays, where NumPy is far faster than the built-in numeric tools'
      - 'Reading a small JSON file once'
      - 'Counting how many files of each type are in a folder'
      - 'Stamping a report with the current date and time'
    answer_index: 0
    explanation: 'For large numerical arrays and vectorised math, NumPy vastly outperforms plain Python, which is why nearly all machine learning stands on it — a clear case where the dependency pays. The other three are exactly what json, collections, and datetime handle with nothing installed.'

  - question: 'How can you explore a module you have not memorised, right from the terminal?'
    options:
      - 'You cannot; you must read the printed manual'
      - 'Call dir(module) to list its names and help(module) to print its documentation'
      - 'Run pip show on the module'
      - 'Delete and reinstall Python to see its contents'
    answer_index: 1
    explanation: 'dir(obj) lists the names available on a module or object, and help(obj) prints its documentation in the terminal. Together with the online "Python Standard Library" reference, they let you look anything up quickly — the skill is knowing the library is there and how to find things, not memorising it.'
