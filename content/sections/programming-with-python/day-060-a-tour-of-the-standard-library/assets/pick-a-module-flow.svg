<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" font-family="system-ui, sans-serif">
  <title>A decision flow for choosing where a capability comes from: start with a task, ask whether the standard library already solves it, if yes identify which module and use it with no install, if no ask whether a third-party package clearly pays its cost, if yes add the dependency deliberately, and if no stay with a small standard-library solution</title>
  <rect x="0" y="0" width="780" height="560" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Where should this capability come from?</text>

  <!-- Task -->
  <rect x="300" y="54" width="180" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">A task to solve</text>
  <text x="390" y="94" text-anchor="middle" font-size="14" fill="#1a202c">e.g. tally file types</text>

  <line x1="390" y1="102" x2="390" y2="126" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,126 384,114 396,114" fill="#1a202c"/>

  <!-- Decision 1: stdlib? -->
  <polygon points="390,132 520,192 390,252 260,192" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Does the standard</text>
  <text x="390" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">library solve it?</text>

  <!-- Yes branch to right: which module -->
  <text x="540" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="520" y1="192" x2="576" y2="192" stroke="#1a202c" stroke-width="2"/>
  <polygon points="576,192 564,186 564,198" fill="#1a202c"/>
  <rect x="576" y="160" width="184" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="668" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Which module?</text>
  <text x="668" y="204" text-anchor="middle" font-size="14" fill="#1a202c">match need to the map</text>

  <line x1="668" y1="224" x2="668" y2="470" stroke="#1a202c" stroke-width="2"/>
  <polygon points="668,470 662,458 674,458" fill="#1a202c"/>

  <!-- No branch down: does dependency pay? -->
  <text x="410" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="390" y1="252" x2="390" y2="278" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,278 384,266 396,266" fill="#1a202c"/>

  <polygon points="390,284 520,344 390,404 260,344" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Does a package</text>
  <text x="390" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">clearly pay?</text>

  <!-- No branch left: stay small -->
  <text x="228" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">no</text>
  <line x1="260" y1="344" x2="196" y2="344" stroke="#1a202c" stroke-width="2"/>
  <polygon points="196,344 208,338 208,350" fill="#1a202c"/>
  <rect x="24" y="312" width="172" height="64" fill="#fef9c3" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="110" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Write a small</text>
  <text x="110" y="356" text-anchor="middle" font-size="14" fill="#1a202c">stdlib solution</text>

  <line x1="110" y1="376" x2="110" y2="486" stroke="#1a202c" stroke-width="2"/>
  <line x1="110" y1="486" x2="300" y2="486" stroke="#1a202c" stroke-width="2"/>
  <polygon points="300,486 288,480 288,492" fill="#1a202c"/>

  <!-- Yes branch down: add dependency -->
  <text x="410" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">yes</text>
  <line x1="390" y1="404" x2="390" y2="430" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,430 384,418 396,418" fill="#1a202c"/>
  <rect x="300" y="430" width="180" height="70" fill="#fee2e2" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Add the dependency</text>
  <text x="390" y="474" text-anchor="middle" font-size="14" fill="#1a202c">pip install, pin it,</text>
  <text x="390" y="492" text-anchor="middle" font-size="14" fill="#1a202c">record why it pays</text>

  <!-- Outcome bar -->
  <rect x="300" y="470" width="368" height="0" fill="none"/>
  <rect x="220" y="516" width="340" height="34" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">A working solution — small, reproducible, honest</text>

  <line x1="390" y1="500" x2="390" y2="516" stroke="#1a202c" stroke-width="2"/>
  <polygon points="390,516 384,504 396,504" fill="#1a202c"/>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 520 192 L 576 192" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 390 252 L 390 278" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 668 224 L 668 470" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 260 344 L 196 344" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 390 404 L 390 430" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 110 486 L 300 486" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
