<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each solving one cost.">
  <title>Four specialised containers</title>
  <style>
    .collections-module-bg   { fill: #f8fafc; }
    .collections-module-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-module-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-module-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-module-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-module-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .collections-module-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .collections-module-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .collections-module-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .collections-module-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .collections-module-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .collections-module-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .collections-module-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .collections-module-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .collections-module-stage { opacity: 1; }

    .collections-module-s0 { animation-delay: 0.00s; }
    .collections-module-e0 { animation-delay: 0.00s; }
    .collections-module-s1 { animation-delay: 1.28s; }
    .collections-module-e1 { animation-delay: 1.28s; }
    .collections-module-s2 { animation-delay: 2.56s; }
    .collections-module-e2 { animation-delay: 2.56s; }
    .collections-module-s3 { animation-delay: 3.84s; }
    .collections-module-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .collections-module-conn  { animation: collections-module-trace 6.4s ease-in-out infinite; }
      .collections-module-stage { animation: collections-module-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes collections-module-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes collections-module-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .collections-module-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .collections-module-stage { animation: collections-module-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes collections-module-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="collections-module-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="collections-module-bg" width="980" height="322"/>
  <text class="collections-module-h1"  x="30" y="40">Four specialised containers</text>
  <text class="collections-module-sub" x="30" y="64">Each solving one cost.</text>
  <g class="collections-module-stage collections-module-s0">
    <rect class="collections-module-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="collections-module-step" x="44" y="142">01</text>
    <text class="collections-module-name" x="70" y="142">A counter, for tallying</text>
    <text class="collections-module-desc" x="44" y="166">Which replaces a dictionary and</text>
    <text class="collections-module-desc" x="44" y="182">a conditional.</text>
  </g>
  <line class="collections-module-line collections-module-conn collections-module-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#collections-module-tip)"/>
  <g class="collections-module-stage collections-module-s1">
    <rect class="collections-module-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="collections-module-step" x="280" y="142">02</text>
    <text class="collections-module-name" x="306" y="142">A default dictionary, for grouping</text>
    <text class="collections-module-desc" x="280" y="166">Which removes the missing-key</text>
    <text class="collections-module-desc" x="280" y="182">check.</text>
  </g>
  <line class="collections-module-line collections-module-conn collections-module-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#collections-module-tip)"/>
  <g class="collections-module-stage collections-module-s2">
    <rect class="collections-module-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="collections-module-step" x="516" y="142">03</text>
    <text class="collections-module-name" x="542" y="142">A deque, for cheap access at both ends</text>
    <text class="collections-module-desc" x="516" y="166">Which a list cannot offer at the</text>
    <text class="collections-module-desc" x="516" y="182">front.</text>
  </g>
  <line class="collections-module-line collections-module-conn collections-module-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#collections-module-tip)"/>
  <g class="collections-module-stage collections-module-s3">
    <rect class="collections-module-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="collections-module-step" x="752" y="142">04</text>
    <text class="collections-module-name" x="778" y="142">And a named tuple, for fixed records</text>
    <text class="collections-module-desc" x="752" y="166">Readable, immutable, and</text>
    <text class="collections-module-desc" x="752" y="182">lightweight.</text>
  </g>
  <text class="collections-module-sub" x="30" y="304">Each of these exists because the general containers make one operation expensive or awkward, which is why reaching for them is usually a simplification.</text>
</svg>
