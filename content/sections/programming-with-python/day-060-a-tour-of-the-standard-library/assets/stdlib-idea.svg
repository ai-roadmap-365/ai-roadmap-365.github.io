<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why the standard library first</title>
  <style>
    .stdlib-idea-bg   { fill: #f8fafc; }
    .stdlib-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stdlib-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stdlib-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stdlib-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stdlib-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stdlib-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stdlib-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stdlib-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stdlib-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stdlib-idea-stage { opacity: 1; }

    .stdlib-idea-s0 { animation-delay: 0.00s; }
    .stdlib-idea-e0 { animation-delay: 0.00s; }
    .stdlib-idea-s1 { animation-delay: 1.28s; }
    .stdlib-idea-e1 { animation-delay: 1.28s; }
    .stdlib-idea-s2 { animation-delay: 2.56s; }
    .stdlib-idea-e2 { animation-delay: 2.56s; }
    .stdlib-idea-s3 { animation-delay: 3.84s; }
    .stdlib-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stdlib-idea-conn  { animation: stdlib-idea-trace 6.4s ease-in-out infinite; }
      .stdlib-idea-stage { animation: stdlib-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stdlib-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stdlib-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stdlib-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stdlib-idea-stage { animation: stdlib-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stdlib-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stdlib-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stdlib-idea-bg" width="980" height="322"/>
  <text class="stdlib-idea-h1"  x="30" y="40">Why the standard library first</text>
  <text class="stdlib-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="stdlib-idea-stage stdlib-idea-s0">
    <rect class="stdlib-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stdlib-idea-step" x="44" y="142">01</text>
    <text class="stdlib-idea-name" x="70" y="142">It is always there</text>
    <text class="stdlib-idea-desc" x="44" y="166">No installation, no version</text>
    <text class="stdlib-idea-desc" x="44" y="182">negotiation.</text>
  </g>
  <line class="stdlib-idea-line stdlib-idea-conn stdlib-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stdlib-idea-tip)"/>
  <g class="stdlib-idea-stage stdlib-idea-s1">
    <rect class="stdlib-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stdlib-idea-step" x="280" y="142">02</text>
    <text class="stdlib-idea-name" x="306" y="142">And it changes slowly and compatibly</text>
    <text class="stdlib-idea-desc" x="280" y="166">Which is what long-lived code</text>
    <text class="stdlib-idea-desc" x="280" y="182">needs.</text>
  </g>
  <line class="stdlib-idea-line stdlib-idea-conn stdlib-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stdlib-idea-tip)"/>
  <g class="stdlib-idea-stage stdlib-idea-s2">
    <rect class="stdlib-idea-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stdlib-idea-step" x="516" y="142">03</text>
    <text class="stdlib-idea-name" x="542" y="142">With a far smaller attack surface</text>
    <text class="stdlib-idea-desc" x="516" y="166">Each dependency is code you did</text>
    <text class="stdlib-idea-desc" x="516" y="182">not review.</text>
  </g>
  <line class="stdlib-idea-line stdlib-idea-conn stdlib-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stdlib-idea-tip)"/>
  <g class="stdlib-idea-stage stdlib-idea-s3">
    <rect class="stdlib-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stdlib-idea-step" x="752" y="142">04</text>
    <text class="stdlib-idea-name" x="778" y="142">And it is usually sufficient</text>
    <text class="stdlib-idea-desc" x="752" y="166">Which is the part people</text>
    <text class="stdlib-idea-desc" x="752" y="182">underestimate.</text>
    <text class="stdlib-idea-edge" x="752" y="242">check first</text>
  </g>
  <text class="stdlib-idea-sub" x="30" y="304">The security argument has grown sharper: every added dependency is a package that can be compromised upstream, and the standard library is not.</text>
</svg>
