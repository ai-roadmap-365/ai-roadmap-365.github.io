visuals:
  - id: stdlib-map
    file: assets/stdlib-map.svg
    type: diagram
    title: 'A map of the standard library grouped by need'
    alt: 'Diagram: a map of the Python standard library grouped by the need it serves — files and paths, data structures, dates and time, math and numbers, text and data formats, and system and runtime'
    description: 'Six cards under a banner reading "installed with Python itself, no pip". Files and paths (pathlib, os.path, shutil, glob); data structures (collections Counter, defaultdict, namedtuple, and itertools); dates and time (datetime, time, calendar, zoneinfo); math and numbers (math, statistics, random, decimal); text and data formats (json, csv, re, string); and system and runtime (os, sys, argparse, subprocess). Reach across the matching row first; leave the map only when a package clearly pays.'
  - id: pick-a-module-flow
    file: assets/pick-a-module-flow.svg
    type: flowchart
    title: 'Where should this capability come from?'
    alt: 'Flowchart: a decision flow for choosing where a capability comes from — start with a task, ask whether the standard library solves it, if so pick the module, otherwise ask whether a third-party package clearly pays before adding a dependency'
    description: 'A task enters a first decision, "Does the standard library solve it?". Yes leads to "Which module? match need to the map" and a working solution with no install. No leads to a second decision, "Does a package clearly pay?"; no branches to "Write a small stdlib solution", yes branches to "Add the dependency — pip install, pin it, record why it pays". All paths converge on a working solution that is small, reproducible, and honest.'
  - id: stdlib-idea
    file: assets/stdlib-idea.svg
    type: diagram
    title: 'Why the standard library first'
    alt: 'Diagram: the four reasons to prefer the standard library'
    description: 'A four-stage description of the case for the standard library covering availability, stability, security and sufficiency.'
  - id: pathlib
    file: assets/pathlib.svg
    type: diagram
    title: 'Paths as objects'
    alt: 'Diagram: the four benefits of treating paths as objects'
    description: 'A four-stage description of path handling covering the separator problem, the object, the operations and portability.'
  - id: collections-module
    file: assets/collections-module.svg
    type: diagram
    title: 'Four specialised containers'
    alt: 'Diagram: four specialised containers and the problem each solves'
    description: 'A four-stage description of specialised containers covering counting, defaults, double-ended access and named fields.'
  - id: docs-introspection
    file: assets/docs-introspection.svg
    type: diagram
    title: 'Finding out what exists'
    alt: 'Diagram: the four ways to discover what a module offers'
    description: 'A four-stage description of discovery covering the documentation, listing attributes, the help function and reading the source.'
  - id: stdlib-not
    file: assets/stdlib-not.svg
    type: diagram
    title: 'Four things it is not'
    alt: 'Diagram: four misconceptions about the standard library'
    description: 'A two-column comparison of misconceptions about the standard library against what is true.'
  - id: stdlib-history
    file: assets/stdlib-history.svg
    type: diagram
    title: 'Four steps for the standard library'
    alt: 'Diagram: the historical progression of the standard library'
    description: 'A four-stage description of standard library history covering the batteries-included philosophy, growth, the packaging ecosystem and curation.'
  - id: well-stocked
    file: assets/well-stocked.svg
    type: diagram
    title: 'A well-stocked kitchen'
    alt: 'Diagram: buying a tool compared with checking what you already have'
    description: 'A two-column comparison of acquiring a new tool against using what is present.'
  - id: stdlib-implications
    file: assets/stdlib-implications.svg
    type: diagram
    title: 'Four consequences of dependency choice'
    alt: 'Diagram: the security, maintenance, portability and capability implications of dependency choice'
    description: 'A four-stage description of dependency implications covering supply chain risk, maintenance, portability and capability limits.'
  - id: stdlib-when
    file: assets/stdlib-when.svg
    type: diagram
    title: 'When to add a dependency'
    alt: 'Diagram: when adding a third-party dependency is warranted'
    description: 'A two-column comparison of situations justifying a dependency against using the standard library.'
