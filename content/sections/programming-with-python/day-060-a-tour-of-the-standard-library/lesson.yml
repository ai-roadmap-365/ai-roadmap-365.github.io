slug: a-tour-of-the-standard-library
title: 'A Tour of the Standard Library'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will know the map of the Python standard library — which module to reach for by the shape of your need — and be able to build a real tool from pathlib, collections, datetime, and json alone, while exercising the judgement to prefer the standard library before adding a third-party dependency.'
objectives:
  - 'Explain what the standard library is, why Python ships "batteries included", and how it differs from third-party packages installed with pip'
  - 'Reach for the right everyday module by need: pathlib for files and paths, datetime for dates and times, collections for counting and grouping, json for structured data, itertools for sequence pipelines'
  - 'Use collections.Counter, defaultdict, and namedtuple, and read a tally with most_common'
  - 'Use random, math, and statistics for sampling and summarising, and seed random for reproducibility'
  - 'Reach os and sys for the environment, command-line arguments, and the interpreter, and use dir() and help() to explore any module'
  - 'Apply the standard-library-first judgement: prefer built-in modules, and add a dependency only when it clearly pays for its cost'
  - 'Combine pathlib, collections, datetime, and json into one small, reproducible data-audit tool with nothing installed'
prerequisites:
  - 'Days 57-59 of this course: named functions and the main guard, modules and imports, and scope'
  - 'Day 56: reading and writing JSON with json.load and json.dump, and command-line tools'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
