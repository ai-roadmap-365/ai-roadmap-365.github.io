title: 'A First Web API with FastAPI'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to stand on the other side of the wire: you will explain how a web API differs from a web page because the client is a machine and the contract therefore matters more than the appearance, describe REST honestly as a set of conventions from a dissertation rather than a standard you can comply with, build a FastAPI application with path parameters that convert, query parameters with defaults and constraints, and request bodies declared as pydantic models — and you will be able to say precisely why that last one is different from everything Days 69 and 75 taught, because an annotation now causes validation to happen at runtime against a stranger''s data. You will read a 422 by its structured detail, declare response models and understand that doing so is how you stop an internal field leaving the process, choose status codes deliberately including a 201 with a Location header and a 204 with an empty body, raise HTTPException for a known negative answer and explain why a traceback must never reach a client, inject storage and the clock with Depends so a test can substitute a fake, read the generated OpenAPI schema and say why a machine-readable contract is the whole point, use async def to exactly the depth of knowing when it helps, and state plainly that validation is not authorization.'
objectives:
  - 'Explain what a web API is and how it differs from a web page — the client is a machine, so field names are a contract and appearance is irrelevant — and name the four kinds of decision an API author makes'
  - 'Describe REST accurately as an architectural style from Roy Fielding''s 2000 dissertation rather than a standard, and explain why most real APIs are only loosely REST'
  - 'Build a FastAPI application: the app object, a path operation, running it under uvicorn, and testing it with TestClient which opens no socket'
  - 'Use path parameters with automatic type conversion and query parameters with defaults, optionality and constraints, and explain why everything in a URL starts out as text'
  - 'Declare a request body as a pydantic model, and explain the central point of the day — that an annotation now causes validation to happen at runtime, which is exactly the complement to mypy that Days 70 and 75 could only describe'
  - 'Read a 422 response correctly: detail as a list reporting every problem at once, loc naming the exact field, type as the stable machine-readable rule, and msg as prose you should not assert on'
  - 'Declare a response model and explain the two things it buys — a documented contract and a filter that stops internal fields leaving the process — and prove the filter is doing work by asserting a field''s absence'
  - 'Choose status codes deliberately: 200, 201 with a Location header, 204 with an empty body, 404, 409, 422, and the 4xx-versus-5xx line that decides whose mistake a failure was'
  - 'Raise HTTPException for a known negative answer, and explain why a stack trace must never reach a client while a 500 body says nothing at all'
  - 'Inject a dependency with Depends and override it with app.dependency_overrides, recognising this as Day 74''s boundary argument with framework support'
  - 'Read the generated OpenAPI schema, explain why a machine-readable contract cannot drift, and connect it to the typed tool definitions a model reads'
  - 'State when async def helps a handler and the one thing you must never do inside one, without needing to understand the event loop'
  - 'State the security position honestly: validation is not authorization, never trust a client-supplied id, CORS is a browser mechanism rather than an access control, and secrets come from the environment'
prerequisites:
  - 'Day 78: HTTP from the client side — methods, status codes, headers, query strings, JSON request and response bodies, and timeouts'
  - 'Days 67-70: classes, dataclasses, and modelling a domain with objects; a pydantic model is a class whose annotations do work'
  - 'Day 75: type annotations and what a static checker does with them — today the same annotations are read by a different tool at a different moment'
  - 'Day 74: injecting a boundary so a test can substitute a fake; Depends is that idea with framework support'
  - 'Days 71-73: pytest, fixtures, and writing tests that can actually fail'
  - 'Day 65: reading and writing JSON; Day 66: raising exceptions deliberately'
  - 'Day 43: python3 -m venv and installing packages with pip'
reading_time_minutes: 40
practical_time_minutes: 30
