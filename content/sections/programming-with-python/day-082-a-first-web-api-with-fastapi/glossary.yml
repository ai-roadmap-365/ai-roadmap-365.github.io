terms:
  - term: web API
    definition: 'An interface over HTTP whose client is a program rather than a person. Because nothing on the other end can read, the field names and status codes are a contract: rename `title` to `name` and every caller breaks at once. That is the single difference from a web page, and everything else about API design follows from it.'
  - term: REST
    definition: 'An architectural style described by Roy Fielding in chapter 5 of his 2000 doctoral dissertation at the University of California, Irvine — a set of constraints including a uniform interface, statelessness between requests, and addressable resources. It is not a standard, has no specification and no compliance test, and what the industry calls a REST API is a loose family of conventions. "Loosely RESTful" is the honest description of almost every real API.'
  - term: resource
    definition: 'A thing your API is about, addressed by a path: a bookmark, a model, a conversation. Resources are nouns and do not change; the HTTP method is the verb applied to them. `/bookmarks` is the collection and `/bookmarks/bm-0001` is one member of it.'
  - term: endpoint
    definition: 'One callable address of your API — in FastAPI terms, a path operation: the pairing of one HTTP method with one path pattern and the function that answers it. `GET /bookmarks` and `POST /bookmarks` share a path and are two different endpoints.'
  - term: path parameter
    definition: 'A named piece of the URL path, written `/items/{item_id}` and received as a function argument. The URL carries text, always; the annotation `item_id: int` is what converts it, and text that cannot be converted produces a 422 with `"loc": ["path", "item_id"]` before the handler is entered.'
  - term: query parameter
    definition: 'A name and value after the `?` in a URL. In FastAPI, any parameter that is not part of the path and is not a model becomes one; a default makes it optional and its absence means the default is used. Constraints attach through `Annotated[int, Query(ge=1, le=100)]`, so the type stays readable to a static checker and the metadata sits beside it.'
  - term: request body
    definition: 'The payload sent with a POST, PUT or PATCH, usually JSON. Declared as a pydantic model, it is parsed and validated before your code runs, so the handler receives a real typed object rather than a dictionary of unknowns.'
  - term: response model
    definition: 'The model declared in `response_model=`, which filters whatever the handler returned down to those fields before serialization. It gives you a documented contract and — more importantly — the filter that stops an internal field leaving the process. One line, easy to omit, which is why you assert on the absence of the field rather than trusting the line to still be there.'
  - term: status code
    definition: 'The three-digit result of a request, and the part of the answer a machine reads first. 200 here-it-is, 201 I-made-it (with a `Location` header), 204 done-and-nothing-to-say (with an empty body), 404 no-such-thing, 422 your-fields-are-wrong, 500 I-broke. The 4xx-versus-5xx line decides whose mistake it was, and getting it backwards ruins every dashboard you will ever build.'
  - term: validation
    definition: 'Checking incoming data against declared rules at the boundary, before any of your logic sees it. In an API it is not optional, because the caller is a stranger. It also canonicalises: `HttpUrl` does not merely accept a URL, it normalises it, so downstream code sees one spelling rather than five.'
  - term: pydantic model
    definition: 'A class deriving from `BaseModel` whose annotations are compiled into a validator at import time and executed against real data at runtime. It looks like a dataclass and behaves completely differently: a dataclass performs no checking at all, while constructing a pydantic model either produces a checked object or raises.'
  - term: 422 Unprocessable Content
    definition: 'The status FastAPI returns when validation fails — defined originally for WebDAV in RFC 4918 and carried into RFC 9110. It means the request was syntactically fine and its contents were not. The body carries a `detail` LIST with one entry per problem, each naming a machine-readable `type`, a `loc` path to the exact field, a human `msg`, and the rejected `input`.'
  - term: serialization
    definition: 'Turning Python objects into bytes a client can read — here, into JSON. It is where a `datetime` becomes an ISO string and a parsed URL becomes text, and, when a response model is declared, where undeclared fields are dropped.'
  - term: dependency injection
    definition: 'Supplying what a function needs as an argument rather than letting it reach for it. FastAPI spells it `Depends(f)`, meaning "call f and pass me the result", resolved per request and cached within one request. `app.dependency_overrides` swaps any dependency in a test, which is Day 74''s boundary argument with framework support.'
  - term: OpenAPI
    definition: 'A specification format for describing an HTTP API in a machine-readable document. It began as Swagger, created by Tony Tam at Wordnik around 2010, and was donated to the Linux Foundation in 2015, forming the OpenAPI Initiative. FastAPI generates the document from your routes and models and serves it at `/openapi.json`; the lab''s reports itself as version 3.1.0.'
  - term: schema
    definition: 'A description of the shape of some data: which fields, of which types, with which constraints, which required. Your pydantic models are schemas, and they appear in the generated OpenAPI document under `components.schemas` — which is how you can check that no internal field is part of your published contract.'
  - term: ASGI
    definition: 'The Asynchronous Server Gateway Interface — one agreed calling convention between a Python web application and any server that hosts it, developed by Andrew Godwin out of the Django Channels work. It succeeds WSGI (PEP 333, Phillip J. Eby, 2003) by allowing handlers to be coroutines, so a request that is merely waiting can yield its worker.'
  - term: ASGI server
    definition: 'The program that owns the socket, speaks HTTP and calls your application — uvicorn here. It is not part of your application, which is why the lab can drive the application with no server at all.'
  - term: TestClient
    definition: 'FastAPI''s in-process client, built on httpx, which hands a request straight to the application object in the same process. No port, no readiness wait, no shutdown handling, no socket — while routing, dependencies, validation, the handler and serialization all run exactly as in production. The only thing it cannot exercise is the wire itself.'
  - term: middleware
    definition: 'Code that wraps every request and response and sees them as raw HTTP — the right place for request logging, compression or CORS headers. Contrast a dependency, which runs only for the routes that ask for it and sees typed Python. Inspecting paths inside middleware to decide whether to act usually means you wanted a dependency.'
  - term: CORS
    definition: 'Cross-Origin Resource Sharing — a browser mechanism deciding whether a page loaded from one origin may read a response from another. It protects the user''s browser session and does nothing whatsoever against a script or a command-line client. Setting `allow_origins=["*"]` to silence a frontend error is a decision about which web pages may read your data, not a security measure.'
  - term: HTTPException
    definition: 'What a handler raises to give a known negative answer — `HTTPException(status_code=404, detail=...)` — producing a small predictable JSON body. It is how a missing thing becomes an answer rather than a crash, and it is the deliberate opposite of an unhandled exception, which becomes a 500 whose body says nothing at all.'
  - term: path operation
    definition: 'FastAPI''s name for one route: the decorator, the path string, and the function beneath it. The decorator carries everything about the contract that is not in the signature — the status code, the response model, the tags and the documented alternative responses.'
  - term: dependency override
    definition: 'An entry in `app.dependency_overrides` mapping a dependency function to a replacement, consulted on every request. It is how a test hands the application an in-memory fake, a frozen clock and a counted id source without patching anything inside the application or putting an "if testing" flag in a handler.'
  - term: extra forbid
    definition: 'The pydantic model setting `ConfigDict(extra="forbid")`, which turns an undeclared field into a 422 instead of silently ignoring it. It catches the misspelled `titel` that would otherwise waste an afternoon, and it is a security control: a client attempting to supply its own `id` is refused with `"type": "extra_forbidden"`.'
  - term: authorization
    definition: 'The question of whether a caller is permitted to do what they asked — distinct from authentication (who are you?) and from validation (is this well-formed?). A perfectly valid DELETE from a stranger is still a stranger deleting your data, and no pydantic model, and no passing test suite, provides any of it.'
