<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Checked before admitted.">
  <title>A reception desk</title>
  <style>
    .reception-desk-bg   { fill: #f8fafc; }
    .reception-desk-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reception-desk-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reception-desk-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reception-desk-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reception-desk-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reception-desk-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reception-desk-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reception-desk-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reception-desk-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reception-desk-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reception-desk-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reception-desk-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reception-desk-row { opacity: 1; }
    .reception-desk-r0 { animation-delay: 0.00s; }
    .reception-desk-r1 { animation-delay: 0.45s; }
    .reception-desk-r2 { animation-delay: 0.90s; }
    .reception-desk-r3 { animation-delay: 1.35s; }
    .reception-desk-r4 { animation-delay: 1.80s; }
    .reception-desk-row { animation: reception-desk-reveal 7.3s ease-in-out infinite; }
    @keyframes reception-desk-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reception-desk-bg" width="980" height="390"/>
  <text class="reception-desk-h1"  x="30" y="40">A reception desk</text>
  <text class="reception-desk-sub" x="30" y="64">Checked before admitted.</text>
  <rect class="reception-desk-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reception-desk-name" x="46" y="122">Checked at the desk</text>
  <text class="reception-desk-desc" x="46" y="142">Turned away early.</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r0" x="46" y="182">Purpose confirmed on arrival</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r1" x="46" y="216">Directed to the right office</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r2" x="46" y="250">Wrong requests stopped at the door</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r3" x="46" y="284">Staff inside handle valid work only</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r4" x="46" y="318">This is validation at the boundary</text>
  <rect class="reception-desk-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reception-desk-name" x="526" y="122">No checks</text>
  <text class="reception-desk-desc" x="526" y="142">Discovered inside.</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r0" x="526" y="182">Anyone wanders in</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r1" x="526" y="216">Interrupts the wrong office</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r2" x="526" y="250">Wrong requests reach the desk of work</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r3" x="526" y="284">Every office must check for itself</text>
  <text class="reception-desk-desc reception-desk-row reception-desk-r4" x="526" y="318">This is validation scattered everywhere</text>
  <text class="reception-desk-sub" x="30" y="372">Every office having to check for itself is the cost of skipping the boundary, and it is why validation belongs at the edge, once.</text>
</svg>
