questions:
  - question: 'Day 69 proved Python stores annotations and ignores them; Day 75 showed a separate program reading them before you run. What does pydantic do with the same annotations that neither of those does?'
    options:
      - 'It stores them in a richer form of __annotations__ that other tools can read later'
      - 'It rewrites the annotations into faster equivalents before the interpreter sees them'
      - 'It performs the same static analysis as mypy, but only for classes derived from BaseModel'
      - 'It compiles them into a runtime validator for incoming data'
    answer_index: 3
    explanation: 'This is the sentence the whole day turns on. At import time pydantic reads the annotations on a model and compiles them into a validator; when a request arrives, that validator runs against the actual bytes a stranger sent. Either it produces a real BookmarkCreate object with a real str and a parsed URL, or it refuses and your handler is never entered. The annotation stopped being a note to yourself and became executable — which is precisely the complement Day 75 could only describe, because mypy never sees a value and structurally never can.'

  - question: 'A caller sends `{"title": "", "url": "nope"}` to a POST endpoint whose body model requires a non-empty title and a real URL. What happens?'
    options:
      - 'A 422 is returned with two entries in detail — one per problem — and the handler is never entered'
      - 'A 400 is returned naming the first problem found, and the caller resubmits to discover the second'
      - 'The handler runs, receives empty strings, and is expected to check them itself'
      - 'A 500 is returned, because the request could not be processed'
    answer_index: 0
    explanation: 'Validation happens before your code, so the handler is never entered and nothing is stored. The status is 422 — Unprocessable Content in RFC 9110 — meaning the request was syntactically fine but its contents are wrong. And detail is a LIST: pydantic reports everything wrong at once rather than stopping at the first problem, so the caller fixes both mistakes in one round trip instead of two. Each entry carries a machine-readable type such as string_too_short, a loc naming the exact field, a human-readable msg, and the input that was rejected.'

  - question: 'A handler annotated to return `StoredBookmark` — a model containing an internal `owner_token` — is decorated with `response_model=BookmarkOut`, which has no such field. What does the client receive, and what happens if you delete that one argument?'
    options:
      - 'The declaration is refused at import time, because the handler''s return type does not match the response model'
      - 'The client gets only BookmarkOut fields; deleting it leaks the secret'
      - 'The client receives owner_token either way — response_model only affects the generated documentation'
      - 'Deleting it causes a 500, because the returned object no longer matches any declared model'
    answer_index: 1
    explanation: 'The handler returns the truth and the declaration decides what the caller is entitled to see: response_model filters the returned object down to its declared fields before serialization. That is why it is a security control rather than paperwork — and why deleting it is so dangerous. The code still "works", every test about creating a bookmark still passes, and a server-side secret is now in every response. This is exactly why the lab asserts the field''s ABSENCE by key and by raw substring, and why the harness deletes the line from a copy of the application and demands the suite go red. An assertion that cannot fail protects nothing.'

  - question: 'Why does confusing a 422 with a 500 damage your ability to operate a service?'
    options:
      - 'Because 5xx responses are cached by intermediaries and 4xx responses are not'
      - 'Because a 500 must always carry a body and a 422 must not'
      - '4xx blames the caller, 5xx blames you — typos become your outages'
      - 'Because most clients retry a 422 automatically but never retry a 500'
    answer_index: 2
    explanation: 'The 4xx-versus-5xx line is the most consequential single distinction in the whole status-code table, because every monitoring dashboard, alerting rule and error budget you ever build is drawn along it. Returning a 500 for a malformed field means your error rate is dominated by other people''s mistakes; returning a 200 with an error object inside means your dashboards report 100% success while the service is broken. The status code is the part of the answer a machine reads first, and it should say whose problem it is.'

  - question: 'Why does `TestClient` need no port number, no readiness wait and no shutdown handling?'
    options:
      - 'It starts a server on an ephemeral port and manages the lifecycle for you behind the scenes'
      - 'It replays previously recorded responses from a fixture file rather than executing the application'
      - 'It runs the application in a subprocess and communicates over a pipe instead of a socket'
      - 'It calls the ASGI app directly, with no server and no socket'
    answer_index: 3
    explanation: 'TestClient wraps httpx and hands the request straight to the app object in this process and this thread''s event loop. Nothing is recorded and nothing is replayed — routing, dependency resolution, validation, your handler and response-model serialization all execute exactly as they would in production. The only thing removed is the wire. That is why it is the cleanest possible form of this week''s no-network rule: no port to collide, no flaky readiness sleep, no stray process left running by a failed test. The lab additionally guards socket.socket.connect so any attempt to connect would raise, and proves the guard is armed by making a throwaway test trip it.'

  - question: 'A test fixture contains `app.dependency_overrides[api.get_now] = lambda: FROZEN_NOW`. What problem does this solve, and which earlier day''s argument is it an instance of?'
    options:
      - 'It freezes the clock so created_at is assertable'
      - 'It speeds up the suite by avoiding repeated system calls, an instance of Day 61''s readability work'
      - 'It prevents timezone errors on machines configured for local time, an instance of Day 65''s data-handling work'
      - 'It replaces the datetime module globally for the duration of the test, an instance of monkeypatching'
    answer_index: 0
    explanation: 'Nothing is patched and no module is replaced. get_now is an ordinary function that FastAPI calls per request; dependency_overrides is a dictionary consulted on every request that says "call this instead". The handler asks for a datetime and receives one, and cannot tell which. That is Day 74 exactly: a thing passed in can be replaced in a test, a thing reached for cannot. The same mechanism gives the lab an in-memory storage fake and a counted id source, which is why the first bookmark is always bm-0001 and why the whole suite touches no file.'

  - question: 'A colleague says their API is "fully REST compliant". What is wrong with that claim?'
    options:
      - 'Nothing — REST compliance is defined by RFC 9110 and can be tested'
      - 'There is no REST specification to comply with'
      - 'REST applies only to read-only APIs, so any API with a POST cannot be compliant'
      - 'REST was superseded by OpenAPI in 2015, so the term no longer has meaning'
    answer_index: 1
    explanation: 'Roy Fielding described REST in chapter 5 of his doctoral dissertation at the University of California, Irvine, in 2000. There is no specification, no version number and no compliance test. What the industry calls a REST API is a loose family of conventions — resources as nouns, HTTP methods as verbs, JSON bodies, meaningful status codes — and Fielding himself later wrote that an API without hypermedia controls is not REST at all, which would disqualify nearly all of them. HTTP, by contrast, IS specified, currently by RFC 9110. Saying "loosely RESTful" is the honest phrasing.'

  - question: 'Which statement about `async def` handlers is correct?'
    options:
      - 'They are always faster, because the framework can parallelise the work across CPU cores'
      - 'They are required whenever a handler declares a response model'
      - 'They help when the handler waits on I/O; blocking stalls the worker'
      - 'They are only permitted for GET requests, because other methods change state'
    answer_index: 2
    explanation: 'The whole rule you need today: async def matters when the handler WAITS — on a database, another service, a file — because while it waits, the event loop can run somebody else''s request on the same worker. Pure computation gains nothing. The trap worth knowing before you meet it is the other half: a blocking call inside an async def handler — a synchronous database driver, time.sleep, a large file read — blocks the entire event loop and therefore every other request on that worker. If your library is synchronous, write a plain def handler; FastAPI runs those in a thread pool, so the blocking is contained. You do not need to understand the event loop to be correct here.'
