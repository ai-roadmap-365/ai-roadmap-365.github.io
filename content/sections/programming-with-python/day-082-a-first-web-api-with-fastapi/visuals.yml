visuals:
  - id: api-architecture
    file: assets/api-architecture.svg
    type: diagram
    title: 'A FastAPI application, end to end — and where a 422 differs from a 500'
    alt: 'Diagram: the architecture of a FastAPI application — a client sends bytes to an ASGI server that owns the socket, the server hands a request to the application, and inside it a routing table picks one path operation, dependency resolution calls each Depends function so storage and the clock arrive as arguments, pydantic validation converts and checks the path, query and body against your annotations and is the only place a 422 is produced, your handler runs and calls the domain layer behind it, and response-model serialization filters the result down to the declared output fields before a status code and JSON body travel back out — while an unhandled exception anywhere becomes a 500 whose body is five words and whose traceback stays in the server log, and the same routes and models feed a generated OpenAPI schema off to the side that nobody wrote'
    description: 'A left-to-right architecture diagram in five bands. On the far left the CLIENT — a machine, usually — sends POST /bookmarks with a JSON body, labelled as where Day 78 stood. Next, the ASGI SERVER (uvicorn 0.51.0) owns the socket, speaks HTTP and runs the event loop, with the note that TestClient replaces this entire box in the lab. It passes a scope into the large white box that is THE FASTAPI APPLICATION, drawn as five numbered stages stacked vertically: 1 the ROUTING TABLE, matching method plus path pattern to one path operation and answering 404 or 405 without entering your code; 2 DEPENDENCY RESOLUTION, calling each Depends function so storage, the clock, settings and the current user arrive as arguments; 3 PYDANTIC VALIDATION, converting and checking the path, query and body against the annotations, highlighted as the ONLY place a 422 is produced; 4 YOUR HANDLER, marked as the only code you wrote; and 5 RESPONSE-MODEL SERIALIZATION, labelled the leak filter. A branch leaves stage 3 to the left into a panel showing the 422 with its structured detail naming every offending field. Below the application box a red band records that an unhandled exception anywhere above becomes a 500 whose body is the five words Internal Server Error, with the traceback going to the server log and never to the client, and the summary that a 422 is their mistake while a 500 is yours. To the right of stage 4 sits the DOMAIN LAYER from Days 67 to 70, with the note that no HTTP belongs in there. A dashed line runs off the top of the application to the OPENAPI SCHEMA panel, built from the same routes and the same models, served at /openapi.json, with the observation that nobody wrote it. A return arrow carries the status code, headers and JSON body back along the bottom to the client. A closing band makes two points: that stages 1, 2, 3 and 5 are the framework and were generated from the annotations you wrote, so an annotation stopped being documentation and started doing work; and that in the lab there is no socket and no ASGI server at all, because TestClient hands the request object to the application directly in the same process, which is why an in-process test is a real test rather than a simulation.'
  - id: request-validation-flow
    file: assets/request-validation-flow.svg
    type: flowchart
    title: 'One POST, from raw bytes to a response, and the single branch where a 422 is decided'
    alt: 'Flowchart: one POST traced from raw bytes through routing, body parsing and pydantic validation — the branch where an invalid field stops the request before the handler is ever entered and returns a 422 whose detail is a list with one entry per problem, each naming a type, the exact field in loc, a human-readable message and the rejected input — then, for a valid body, dependency resolution, the handler running with real typed objects, response-model serialization dropping the internal owner token, and a 201 with a Location header and a five-field JSON body leaving the process, with a side panel recording that a static type checker ran before any of this on the source rather than the data and asked a completely different question'
    description: 'A top-to-bottom flow of one request in seven numbered stages. Stage 1, raw bytes arrive as POST /bookmarks with a JSON content type, and everything is still text — nothing is a Python object yet. Stage 2, routing matches the method and path pattern to one path operation, answering 404 when nothing matches or 405 when the path exists under another method. Stage 3, body parsing turns the bytes into a Python dictionary and rejects malformed JSON here. Stage 4 is drawn as the branch and is highlighted: pydantic validation checks the dictionary against BookmarkCreate, asking whether title is 1 to 80 characters, whether url is really a URL, and whether every field is one the model declares, annotated as an annotation causing work to happen at runtime. The INVALID branch goes left into a large panel headed 422 — and the request STOPS, recording that the handler is never entered and nothing is stored, and that detail is a LIST with one entry per problem reported all at once, each entry carrying a type such as string_too_short saying what rule was broken, a loc naming exactly which field, a msg for a human, and the input that was rejected, with the closing point that a machine can act on this while it cannot act on prose. The VALID branch continues down through stage 5, dependency resolution, where storage, the clock and the id source are each supplied by a Depends function and where a test can swap any of them without touching a handler; stage 6, your handler running with every argument already a real, typed, checked Python object, calling the domain layer; and stage 7, response-model serialization filtering the result down to the declared output fields and dropping owner_token, which is the leak filter. The flow exits right into a panel showing 201 Created with a Location header and a JSON body of exactly five fields. A dashed side panel running down the right-hand side records that a static type checker ran before any of this, on the source rather than the data: mypy asked whether the code contradicts its own annotations and never saw a value, while pydantic asks whether the stranger data satisfies them and holds the actual bytes — the same annotations, a different question, a different moment, and an API needs both because the caller is a stranger. A bottom band notes that stages 2, 3, 4, 5 and 7 are the framework generated from your annotations, that you wrote stage 6 and the models, and that because every field is already checked the first line of your code is business logic rather than fourteen lines of defensive parsing.'
