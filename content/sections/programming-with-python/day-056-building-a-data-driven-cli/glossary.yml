terms:
  - term: CLI (command-line interface)
    definition: 'A program you run by typing its name and instructions in a terminal, which reads its input from command-line arguments rather than a graphical window or interactive prompts, so it can be scripted, scheduled, and tested.'
  - term: argparse
    definition: 'Python''s standard-library module for parsing command-line arguments: you declare the arguments and subcommands your tool accepts, and it reads sys.argv, validates them, converts types, generates --help text, and reports usage errors.'
  - term: positional argument
    definition: 'A command-line argument identified by its position rather than a name, such as the FILE in `tool FILE` — the first value is understood to be the file because of where it sits.'
  - term: option (flag)
    definition: 'A named command-line argument that starts with dashes, such as `--email ada@example.com` or a boolean switch like `--force`; options can be required or optional and may take a value or stand alone.'
  - term: subcommand
    definition: 'A named group of arguments that selects one of several operations a tool offers, created with argparse''s add_subparsers — for example the add, list, find, and delete in `records.py add ...`, much like `git commit` and `git push`.'
  - term: JSON serialization
    definition: 'Turning in-memory Python data (lists, dicts, strings, numbers) into JSON text with json.dump so it can be stored or sent, and back into Python data with json.load — the encode/decode pair that lets a program save and reload its records.'
  - term: persistence
    definition: 'Keeping data beyond a single run of a program by writing it to durable storage such as a file; a tool that persists its records to JSON remembers them the next time it is launched, unlike data held only in memory.'
  - term: exit code
    definition: 'A small integer a program returns to the operating system when it ends: 0 conventionally means success and any non-zero value means failure, so scripts, pipelines, and schedulers can detect whether the program worked.'
  - term: stdout / stderr
    definition: 'The two output streams of a command-line program: standard output (stdout) carries results meant to be read or piped onward, and standard error (stderr) carries diagnostics and error messages, kept separate so piped results stay clean.'
  - term: record (dict)
    definition: 'One item in a data-driven tool''s collection, modelled as a Python dictionary of named fields — for example {"id": 1, "name": "Ada", "email": "ada@example.com"} — with the whole collection held as a list of such dictionaries.'
  - term: command dispatch
    definition: 'Choosing which function handles the chosen subcommand: each subparser stores its handler (set_defaults(func=...)), so the program simply calls args.func(args) instead of a long if/elif ladder — a small dispatch table built into the parser.'
  - term: idempotence
    definition: 'A property of an operation whose repeated application leaves the system in the same state as a single application; read-only commands like list and find are naturally idempotent, and a delete can be made idempotent by treating "already absent" as success.'
