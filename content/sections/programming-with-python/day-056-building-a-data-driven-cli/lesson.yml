id: D056
day: 56
slug: building-a-data-driven-cli
title: 'Building a Data-Driven CLI'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to build a small, data-driven command-line tool: parse arguments and subcommands with argparse, model records as a list of dicts, persist them as JSON, run the command -> load -> mutate -> save -> report loop, and return proper exit codes with errors on standard error.'
objectives:
  - 'Parse command-line arguments with argparse: a global option, subcommands, required and typed options, choices, and generated help text'
  - 'Read and write structured data as JSON with json.load and json.dump so records persist between runs'
  - 'Model a collection of records as a list of dictionaries and mutate it (add, search, delete) in memory'
  - 'Run the command -> load -> mutate -> save -> report loop that underlies almost every data-driven tool'
  - 'Return meaningful exit codes (0 for success, non-zero for failure) and send diagnostics to standard error, keeping results on standard output'
  - 'Keep a tool testable and automatable by taking all input from arguments rather than interactive prompts, and prove a function is importable'
  - 'Choose between argparse, click, and typer, and explain when a JSON file is the right store and when a database is needed instead'
prerequisites:
  - 'Days 50-55 of this course: conditionals and loops, lists, dictionaries, sets and tuples, and comprehensions'
  - 'Day 49: the shape of a real program — named functions, a main(), the main-guard idiom, and input validation'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
