visuals:
  - id: cli-architecture
    file: assets/cli-architecture.svg
    type: diagram
    title: 'Architecture of a data-driven CLI'
    alt: 'Diagram: the architecture of a data-driven CLI — argparse to command dispatch to in-memory records to a JSON store, with output and exit code'
    description: 'Left to right: the terminal command reaches argparse, which parses and validates arguments and the chosen subcommand; command dispatch calls the matching function (add, list, find, or delete); that function works on in-memory records held as a list of dicts, loaded from and saved to a JSON store on disk; and results leave on standard output, errors on standard error, ending with an exit code.'
  - id: cli-command-flow
    file: assets/cli-command-flow.svg
    type: flowchart
    title: 'One CLI command''s runtime flow'
    alt: 'Flowchart: one CLI command''s flow — parse arguments, load JSON, validate, then either error out or mutate, save, print, and exit'
    description: 'One command''s path: parse arguments, load the JSON store (a missing file is an empty list), then a validation decision. If the input is bad or the store is unreadable, the flow branches to print to standard error and return exit code 1. Otherwise it mutates the records, saves them (read-only commands skip the save), prints a result, and returns exit code 0 — two clean exits, success and failure.'
  - id: cli-shape
    file: assets/cli-shape.svg
    type: diagram
    title: 'The shape of a command-line tool'
    alt: 'Diagram: the four parts of a command-line tool'
    description: 'A four-stage description of a command-line tool covering argument parsing, dispatch, the operation and the result.'
  - id: argparse
    file: assets/argparse.svg
    type: diagram
    title: 'Parsing arguments'
    alt: 'Diagram: the four things an argument parser provides'
    description: 'A four-stage description of argument parsing covering validation, types, help text and errors.'
  - id: dispatch
    file: assets/dispatch.svg
    type: diagram
    title: 'Command dispatch'
    alt: 'Diagram: how a command-line tool dispatches to the requested operation'
    description: 'A four-stage description of dispatch covering subcommands, the mapping, the call and extensibility.'
  - id: exit-streams
    file: assets/exit-streams.svg
    type: diagram
    title: 'Exit codes and streams'
    alt: 'Diagram: the four output conventions of a well-behaved command-line tool'
    description: 'A four-stage description of output conventions covering the two streams, exit codes, machine readability and pipelines.'
  - id: cli-not
    file: assets/cli-not.svg
    type: diagram
    title: 'Four things a tool is not'
    alt: 'Diagram: four misconceptions about command-line tools'
    description: 'A two-column comparison of misconceptions about command-line tools against what is true.'
  - id: cli-history
    file: assets/cli-history.svg
    type: diagram
    title: 'Four steps in tool design'
    alt: 'Diagram: the historical progression of command-line tool conventions'
    description: 'A four-stage description of tool history covering single-purpose tools, pipes, argument conventions and subcommands.'
  - id: kitchen-appliance
    file: assets/kitchen-appliance.svg
    type: diagram
    title: 'One appliance, or a set'
    alt: 'Diagram: a single combined appliance compared with a set of composable ones'
    description: 'A two-column comparison of a monolithic tool against composable ones.'
  - id: cli-implications
    file: assets/cli-implications.svg
    type: diagram
    title: 'Four consequences of shipping a tool'
    alt: 'Diagram: the usability, interface, security and maintenance implications of a command-line tool'
    description: 'A four-stage description of tool implications covering usability, interface stability, input trust and maintenance.'
  - id: cli-when
    file: assets/cli-when.svg
    type: diagram
    title: 'When to build a tool'
    alt: 'Diagram: when a command-line tool is the right form'
    description: 'A two-column comparison of situations favouring a command-line tool against alternatives.'
