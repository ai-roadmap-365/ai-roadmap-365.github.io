visuals:
  - id: cli-architecture
    file: assets/cli-architecture.svg
    type: diagram
    title: 'Architecture of a data-driven CLI'
    alt: 'Diagram: the architecture of a data-driven CLI — argparse to command dispatch to in-memory records to a JSON store, with output and exit code'
    description: 'Left to right: the terminal command reaches argparse, which parses and validates arguments and the chosen subcommand; command dispatch calls the matching function (add, list, find, or delete); that function works on in-memory records held as a list of dicts, loaded from and saved to a JSON store on disk; and results leave on standard output, errors on standard error, ending with an exit code.'
  - id: cli-command-flow
    file: assets/cli-command-flow.svg
    type: flowchart
    title: 'One CLI command''s runtime flow'
    alt: 'Flowchart: one CLI command''s flow — parse arguments, load JSON, validate, then either error out or mutate, save, print, and exit'
    description: 'One command''s path: parse arguments, load the JSON store (a missing file is an empty list), then a validation decision. If the input is bad or the store is unreadable, the flow branches to print to standard error and return exit code 1. Otherwise it mutates the records, saves them (read-only commands skip the save), prints a result, and returns exit code 0 — two clean exits, success and failure.'
