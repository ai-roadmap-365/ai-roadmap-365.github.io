<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a data-driven CLI: argparse parses arguments, a dispatch table picks a command, the command works on in-memory records that are a list of dicts, loaded from and saved to a JSON store, and results go out on stdout or stderr with an exit code</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Architecture of a data-driven CLI</text>

  <!-- Terminal input -->
  <rect x="24" y="80" width="150" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="99" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Terminal</text>
  <text x="99" y="128" text-anchor="middle" font-size="14" fill="#1a202c">add --name Ada</text>
  <text x="99" y="145" text-anchor="middle" font-size="14" fill="#1a202c">--email ada@...</text>

  <line x1="174" y1="116" x2="214" y2="116" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="214,116 202,110 202,122" fill="#1d4ed8"/>

  <!-- argparse -->
  <rect x="214" y="80" width="150" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="289" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">argparse</text>
  <text x="289" y="128" text-anchor="middle" font-size="14" fill="#1a202c">parse + validate</text>
  <text x="289" y="145" text-anchor="middle" font-size="14" fill="#1a202c">args, subcommand</text>

  <line x1="364" y1="116" x2="404" y2="116" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="404,116 392,110 392,122" fill="#1d4ed8"/>

  <!-- dispatch -->
  <rect x="404" y="80" width="160" height="72" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="484" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Command dispatch</text>
  <text x="484" y="124" text-anchor="middle" font-size="14" fill="#1a202c">args.func(args) picks</text>
  <text x="484" y="141" text-anchor="middle" font-size="14" fill="#1a202c">add / list / find / delete</text>

  <!-- down to records -->
  <line x1="484" y1="152" x2="484" y2="196" stroke="#1a202c" stroke-width="2"/>
  <polygon points="484,196 478,184 490,184" fill="#1a202c"/>

  <!-- in-memory records -->
  <rect x="360" y="206" width="248" height="96" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="484" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">In-memory records</text>
  <text x="484" y="248" text-anchor="middle" font-size="14" fill="#1a202c">a list of dicts</text>
  <text x="484" y="270" text-anchor="middle" font-size="13" fill="#1a202c">[{"id":1,"name":"Ada",</text>
  <text x="484" y="288" text-anchor="middle" font-size="13" fill="#1a202c">"email":"ada@..."}, ...]</text>

  <!-- JSON store, two-way -->
  <rect x="360" y="342" width="248" height="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="484" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">JSON store (on disk)</text>
  <text x="484" y="390" text-anchor="middle" font-size="14" fill="#1a202c">records.json — persists between runs</text>

  <!-- load / save arrows -->
  <line x1="452" y1="342" x2="452" y2="304" stroke="#1a202c" stroke-width="2"/>
  <polygon points="452,304 446,316 458,316" fill="#1a202c"/>
  <text x="404" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">load</text>

  <line x1="516" y1="302" x2="516" y2="340" stroke="#1a202c" stroke-width="2"/>
  <polygon points="516,340 510,328 522,328" fill="#1a202c"/>
  <text x="560" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">save</text>

  <!-- output on the right -->
  <line x1="608" y1="250" x2="672" y2="250" stroke="#1a202c" stroke-width="2"/>
  <polygon points="672,250 660,244 660,256" fill="#1a202c"/>
  <rect x="632" y="206" width="112" height="96" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="688" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Output</text>
  <text x="688" y="252" text-anchor="middle" font-size="13" fill="#1a202c">stdout: result</text>
  <text x="688" y="272" text-anchor="middle" font-size="13" fill="#1a202c">stderr: errors</text>
  <text x="688" y="292" text-anchor="middle" font-size="13" fill="#1a202c">exit code 0/1</text>

  <text x="380" y="428" text-anchor="middle" font-size="14" fill="#1a202c">One skeleton — parse, dispatch, load, mutate, save, report — is how most command-line tools are built.</text>
</svg>
