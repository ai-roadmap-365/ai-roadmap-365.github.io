<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Composability decides.">
  <title>One appliance, or a set</title>
  <style>
    .kitchen-appliance-bg   { fill: #f8fafc; }
    .kitchen-appliance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-appliance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-appliance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-appliance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-appliance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-appliance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-appliance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-appliance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-appliance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-appliance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-appliance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-appliance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-appliance-row { opacity: 1; }
    .kitchen-appliance-r0 { animation-delay: 0.00s; }
    .kitchen-appliance-r1 { animation-delay: 0.45s; }
    .kitchen-appliance-r2 { animation-delay: 0.90s; }
    .kitchen-appliance-r3 { animation-delay: 1.35s; }
    .kitchen-appliance-r4 { animation-delay: 1.80s; }
    .kitchen-appliance-row { animation: kitchen-appliance-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-appliance-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-appliance-bg" width="980" height="390"/>
  <text class="kitchen-appliance-h1"  x="30" y="40">One appliance, or a set</text>
  <text class="kitchen-appliance-sub" x="30" y="64">Composability decides.</text>
  <rect class="kitchen-appliance-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-appliance-name" x="46" y="122">One combined device</text>
  <text class="kitchen-appliance-desc" x="46" y="142">Does everything.</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r0" x="46" y="182">Every function in one unit</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r1" x="46" y="216">Cannot be combined with others</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r2" x="46" y="250">A new need means a new device</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r3" x="46" y="284">Each function slightly compromised</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r4" x="46" y="318">This is a monolithic script</text>
  <rect class="kitchen-appliance-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-appliance-name" x="526" y="122">A set of tools</text>
  <text class="kitchen-appliance-desc" x="526" y="142">Each does one thing.</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r0" x="526" y="182">Each does one job properly</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r1" x="526" y="216">Combined freely</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r2" x="526" y="250">A new need combines existing ones</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r3" x="526" y="284">Each function done well</text>
  <text class="kitchen-appliance-desc kitchen-appliance-row kitchen-appliance-r4" x="526" y="318">This is a composable tool</text>
  <text class="kitchen-appliance-sub" x="30" y="372">The right column only works if every tool follows the same conventions, which is why the output and exit-code rules are worth the discipline.</text>
</svg>
