questions:
  - question: 'What makes a program a "data-driven CLI" in this lesson''s sense?'
    options:
      - 'It has a graphical window and buttons'
      - 'Driven by arguments, with a file store and subcommands'
      - 'It asks the user a series of questions as it runs'
      - 'It is written in fewer than fifty lines'
    answer_index: 1
    explanation: 'A data-driven CLI reads its instructions from arguments (not interactive prompts), persists a collection of records to a file, and groups related operations as subcommands — the three traits that make it scriptable, durable, and organized.'

  - question: 'Why take input from command-line arguments instead of prompting with input()?'
    options:
      - 'Arguments are easier to type than answering prompts'
      - 'input() is deprecated and no longer works'
      - 'Argument-driven tools can be scripted and tested; prompts cannot'
      - 'Arguments are the only way to pass a number to a program'
    answer_index: 2
    explanation: 'A program that reads sys.argv can be run unattended by a script or scheduler and tested automatically. A program that stops to prompt on the keyboard needs a human every time, so it cannot be automated or tested.'

  - question: 'In the command -> load -> mutate -> save -> report loop, which commands skip the "save" step?'
    options:
      - 'add and delete, because they only read'
      - 'find only, because it never touches the file'
      - 'None — every command saves'
      - 'list and find, because they are read-only'
    answer_index: 3
    explanation: 'list and find are read-only: they load the records and report on them but do not change anything, so there is nothing to save. add and delete mutate the list and must save it back to disk.'

  - question: 'The global `--store` option is defined on the top-level parser. Where must it appear on the command line?'
    options:
      - 'Before the subcommand, for example `records.py --store demo.json add ...`'
      - 'After the subcommand, for example `records.py add --store demo.json ...`'
      - 'It can appear anywhere; argparse does not care about order'
      - 'It must be the very last argument'
    answer_index: 0
    explanation: 'A global option belongs to the top-level parser, so it must come before the subcommand: `records.py --store demo.json add ...`. Placing it after the subcommand makes argparse look for it on the subparser, which does not define it.'

  - question: 'A user runs `find --query zoe` and nothing matches. What does the well-designed tool do?'
    options:
      - 'Crashes with a traceback'
      - 'Prints to standard error and returns exit code 1'
      - 'Prints an empty line and returns exit code 0'
      - 'Silently creates a matching record'
    answer_index: 1
    explanation: 'find returns exit code 1 when nothing matches — not because it broke, but so a caller can test "did we find anything?". The "no records match" notice goes to standard error to keep standard output clean.'

  - question: 'Why send error messages to standard error instead of standard output?'
    options:
      - 'Standard error displays text in red automatically'
      - 'Standard output cannot display error messages'
      - 'It keeps results separate from diagnostics'
      - 'It makes the program run faster'
    answer_index: 2
    explanation: 'Results go to standard output and diagnostics to standard error so that a program piping the tool''s output receives only the clean results, while error messages travel on a separate stream — a long-standing command-line convention.'

  - question: 'How does the tool turn the JSON store''s text into Python data, and why is that choice safe?'
    options:
      - 'With eval(), which is the standard way to read data files'
      - 'By reading the file line by line and guessing the types'
      - 'With exec(), because JSON is Python code'
      - 'With json.load(), which can never execute code'
    answer_index: 3
    explanation: 'json.load parses text into safe Python data structures and cannot run code. eval() and exec() execute their argument as Python, so they must never touch a file''s contents or a user''s input.'

  - question: 'When is a JSON file the WRONG store for a data-driven tool?'
    options:
      - 'When many processes write at once, or rows reach millions'
      - 'When the data is small and there is a single user'
      - 'Whenever the tool has more than one subcommand'
      - 'When you want the data to persist between runs'
    answer_index: 0
    explanation: 'A JSON file assumes a single writer and rewrites the whole file on each change, so concurrent writers can lose updates and large datasets become slow. Those situations call for a database with transactions and indexes; for small, single-user data a JSON file is ideal.'
