questions:
  - question: 'What are the two required parts of every recursive function?'
    options:
      - 'A loop and a counter'
      - 'A base case that stops the recursion and a recursive case that shrinks the problem and combines'
      - 'An import statement and a decorator'
      - 'A try block and an except block'
    answer_index: 1
    explanation: 'Every recursive function needs a base case — the smallest problem, answered directly without further calls — and a recursive case that reduces the problem to a smaller instance, calls itself, and combines the result. Miss either one and the recursion is broken.'

  - question: 'What happens if a recursive function has no correct base case (or its input never shrinks toward one)?'
    options:
      - 'It returns 0 by default'
      - 'Python automatically converts it to a loop'
      - 'It calls itself forever until the call stack is exhausted and Python raises RecursionError'
      - 'It runs faster because there is no stopping check'
    answer_index: 2
    explanation: 'Without a reachable base case, the function keeps calling itself, pushing a new stack frame each time, until the call stack overflows and Python raises RecursionError. The base case is the brake that stops the recursion.'

  - question: 'In the call stack for factorial(4), what happens after the base case factorial(1) returns 1?'
    options:
      - 'The stack unwinds: factorial(2) computes 2*1, factorial(3) computes 3*2, factorial(4) computes 4*6 = 24'
      - 'The program restarts from factorial(4)'
      - 'All frames are discarded and the result is 1'
      - 'factorial(1) calls factorial(0) next'
    answer_index: 0
    explanation: 'Once the base case returns 1, the stacked frames unwind one by one, each completing its multiplication: 2*1=2, then 3*2=6, then 4*6=24. The answer flows back up the chain of waiting calls.'

  - question: 'Why does naive recursive Fibonacci (fib(n) = fib(n-1) + fib(n-2)) become exponentially slow?'
    options:
      - 'Because addition is slow in Python'
      - 'Because it uses too much memory for the result'
      - 'Because the recursion limit is too low'
      - 'Because it makes two recursive calls per step and recomputes the same subproblems again and again'
    answer_index: 3
    explanation: 'It is tree recursion: each call spawns two more, and the same values (like fib(3)) get recomputed many times. The number of calls is 2*fib(n+1)-1, which grows exponentially — fib(30) already makes 2,692,537 calls.'

  - question: 'How does functools.lru_cache fix naive Fibonacci without changing the recursive logic?'
    options:
      - 'It rewrites the function as a loop automatically'
      - 'It remembers each result the first time it is computed, so repeated subproblems become instant cache hits instead of recomputations'
      - 'It increases the recursion limit so more calls fit'
      - 'It runs the function on multiple CPU cores'
    answer_index: 1
    explanation: 'lru_cache stores the result for each argument the first time it is seen and returns it instantly on later calls. The exponential tree collapses to linear work: fib(30) drops from 2.7 million calls to just 31 real computations.'

  - question: 'Which problem is the CLEAREST case where recursion is the right tool over a plain loop?'
    options:
      - 'Flattening a list nested to an unknown depth, where each sublist may contain more sublists'
      - 'Adding up a flat list of numbers'
      - 'Printing the numbers 1 through 10'
      - 'Reading a single line of input'
    answer_index: 0
    explanation: 'Recursion shines on self-similar, nested data of unknown depth: the function handles one level and calls itself on any nested part, following the data as deep as it goes. A flat sum or a simple count is clearer with a loop.'

  - question: 'Why is deep recursion riskier in Python than in some other languages?'
    options:
      - 'Python cannot define functions that call themselves'
      - 'Python runs recursion on the GPU, which has less memory'
      - 'Python has no tail-call optimization and caps the stack (~1000 frames), so recursion whose depth grows with input size can raise RecursionError where a loop would not'
      - 'Python deletes stack frames at random'
    answer_index: 2
    explanation: 'Python does not optimize tail calls into iteration and limits recursion depth to roughly 1000 frames by default. A recursion that goes one level deep per element will overflow on a few thousand items, so a loop or an explicit stack is safer for deep-but-flat traversal.'

  - question: 'How does the base-case / recursive-case decomposition connect to AI work?'
    options:
      - 'It does not; recursion is only an academic exercise'
      - 'It is only used for drawing fractals'
      - 'It replaces the need for training data'
      - 'It is the same divide-and-conquer thinking behind walking parse trees, decision trees, nested JSON, and neural-network computation graphs'
    answer_index: 3
    explanation: 'Recursive structures are everywhere in AI — parse trees, decision trees, nested configuration/JSON, and graph traversals. The "solve the small piece directly, break the big piece into smaller pieces of the same kind, and combine" pattern is the divide-and-conquer thinking behind many algorithms.'
