<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" font-family="system-ui, sans-serif">
  <title>The call stack for factorial(4): frames stack up as each call waits for a smaller one, the base case factorial(1) returns 1, and the stack unwinds multiplying 1, 2, 6, 24 back up to the answer</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The call stack for factorial(4)</text>

  <!-- Left column heading: winding up -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">1. Winding up (calls stack)</text>
  <!-- Right column heading: unwinding -->
  <text x="590" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">2. Unwinding (returns)</text>

  <!-- Stacked frames, left side: factorial(4) on top pushes down to factorial(1) -->
  <!-- frame 4 -->
  <rect x="80" y="80" width="240" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="200" y="108" text-anchor="middle" font-size="15" fill="#1a202c">factorial(4) = 4 * factorial(3)</text>
  <!-- frame 3 -->
  <rect x="80" y="132" width="240" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="200" y="160" text-anchor="middle" font-size="15" fill="#1a202c">factorial(3) = 3 * factorial(2)</text>
  <!-- frame 2 -->
  <rect x="80" y="184" width="240" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="200" y="212" text-anchor="middle" font-size="15" fill="#1a202c">factorial(2) = 2 * factorial(1)</text>
  <!-- frame 1 = base case -->
  <rect x="80" y="236" width="240" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="200" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">factorial(1) = 1  (base case)</text>

  <!-- downward arrow: each call waits on a smaller call -->
  <line x1="40" y1="90" x2="40" y2="270" stroke="#1a202c" stroke-width="2"/>
  <polygon points="40,270 34,258 46,258" fill="#1a202c"/>
  <text x="40" y="300" text-anchor="middle" font-size="13" fill="#1a202c">each call waits</text>
  <text x="40" y="316" text-anchor="middle" font-size="13" fill="#1a202c">for a smaller one</text>

  <!-- base case reached note -->
  <text x="200" y="300" text-anchor="middle" font-size="13" fill="#1a202c">no more calls — start returning</text>

  <!-- Right side: unwinding, returns flow upward -->
  <!-- return 1 -->
  <rect x="460" y="236" width="240" height="44" fill="#dcfce7" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="580" y="264" text-anchor="middle" font-size="15" fill="#1a202c">factorial(1) returns 1</text>
  <!-- return 2 -->
  <rect x="460" y="184" width="240" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="580" y="212" text-anchor="middle" font-size="15" fill="#1a202c">2 * 1 = 2</text>
  <!-- return 6 -->
  <rect x="460" y="132" width="240" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="580" y="160" text-anchor="middle" font-size="15" fill="#1a202c">3 * 2 = 6</text>
  <!-- return 24 -->
  <rect x="460" y="80" width="240" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="5"/>
  <text x="580" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">4 * 6 = 24  (the answer)</text>

  <!-- upward arrow: returns bubble up -->
  <line x1="740" y1="270" x2="740" y2="90" stroke="#1a202c" stroke-width="2"/>
  <polygon points="740,90 734,102 746,102" fill="#1a202c"/>
  <text x="740" y="300" text-anchor="middle" font-size="13" fill="#1a202c">returns</text>
  <text x="740" y="316" text-anchor="middle" font-size="13" fill="#1a202c">bubble up</text>

  <!-- crossover arrow from base-case (left) to base return (right) -->
  <line x1="320" y1="258" x2="460" y2="258" stroke="#1a202c" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="460,258 448,252 448,264" fill="#1a202c"/>

  <!-- bottom takeaway -->
  <rect x="80" y="356" width="620" height="86" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="390" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The base case is the brake.</text>
  <text x="390" y="406" text-anchor="middle" font-size="14" fill="#1a202c">Without factorial(1) returning 1, the stack would grow forever</text>
  <text x="390" y="426" text-anchor="middle" font-size="14" fill="#1a202c">until Python raised RecursionError — a stack overflow.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 40 90 L 40 270" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 320 258 L 460 258" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 740 270 L 740 90" stroke="#1a202c" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
