<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Memoisation</title>
  <style>
    .memoization-bg   { fill: #f8fafc; }
    .memoization-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memoization-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memoization-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memoization-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memoization-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .memoization-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .memoization-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .memoization-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .memoization-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .memoization-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .memoization-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .memoization-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .memoization-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .memoization-stage { opacity: 1; }

    .memoization-s0 { animation-delay: 0.00s; }
    .memoization-e0 { animation-delay: 0.00s; }
    .memoization-s1 { animation-delay: 1.28s; }
    .memoization-e1 { animation-delay: 1.28s; }
    .memoization-s2 { animation-delay: 2.56s; }
    .memoization-e2 { animation-delay: 2.56s; }
    .memoization-s3 { animation-delay: 3.84s; }
    .memoization-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .memoization-conn  { animation: memoization-trace 6.4s ease-in-out infinite; }
      .memoization-stage { animation: memoization-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes memoization-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes memoization-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .memoization-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .memoization-stage { animation: memoization-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes memoization-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="memoization-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="memoization-bg" width="980" height="322"/>
  <text class="memoization-h1"  x="30" y="40">Memoisation</text>
  <text class="memoization-sub" x="30" y="64">Four steps.</text>
  <g class="memoization-stage memoization-s0">
    <rect class="memoization-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="memoization-step" x="44" y="142">01</text>
    <text class="memoization-name" x="70" y="142">Keep a cache of arguments to results</text>
    <text class="memoization-desc" x="44" y="166">Which the decorator provides.</text>
  </g>
  <line class="memoization-line memoization-conn memoization-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#memoization-tip)"/>
  <g class="memoization-stage memoization-s1">
    <rect class="memoization-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="memoization-step" x="280" y="142">02</text>
    <text class="memoization-name" x="306" y="142">Check it before doing any work</text>
    <text class="memoization-desc" x="280" y="166">Returning immediately on a hit.</text>
  </g>
  <line class="memoization-line memoization-conn memoization-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#memoization-tip)"/>
  <g class="memoization-stage memoization-s2">
    <rect class="memoization-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="memoization-step" x="516" y="142">03</text>
    <text class="memoization-name" x="542" y="142">So each distinct subproblem is solved once</text>
    <text class="memoization-desc" x="516" y="166">However many times it is</text>
    <text class="memoization-desc" x="516" y="182">requested.</text>
  </g>
  <line class="memoization-line memoization-conn memoization-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#memoization-tip)"/>
  <g class="memoization-stage memoization-s3">
    <rect class="memoization-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="memoization-step" x="752" y="142">04</text>
    <text class="memoization-name" x="778" y="142">Turning exponential into linear</text>
    <text class="memoization-desc" x="752" y="166">For one line of code.</text>
    <text class="memoization-edge" x="752" y="242">one decorator</text>
  </g>
  <text class="memoization-sub" x="30" y="304">Requiring hashable arguments is the one constraint, which is why a memoised function cannot take a list — and why tuples appear in these signatures.</text>
</svg>
