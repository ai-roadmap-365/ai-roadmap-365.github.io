<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The call stack</title>
  <style>
    .call-stack-bg   { fill: #f8fafc; }
    .call-stack-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .call-stack-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .call-stack-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .call-stack-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .call-stack-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .call-stack-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .call-stack-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .call-stack-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .call-stack-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .call-stack-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .call-stack-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .call-stack-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .call-stack-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .call-stack-stage { opacity: 1; }

    .call-stack-s0 { animation-delay: 0.00s; }
    .call-stack-e0 { animation-delay: 0.00s; }
    .call-stack-s1 { animation-delay: 1.28s; }
    .call-stack-e1 { animation-delay: 1.28s; }
    .call-stack-s2 { animation-delay: 2.56s; }
    .call-stack-e2 { animation-delay: 2.56s; }
    .call-stack-s3 { animation-delay: 3.84s; }
    .call-stack-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .call-stack-conn  { animation: call-stack-trace 6.4s ease-in-out infinite; }
      .call-stack-stage { animation: call-stack-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes call-stack-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes call-stack-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .call-stack-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .call-stack-stage { animation: call-stack-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes call-stack-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="call-stack-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="call-stack-bg" width="980" height="322"/>
  <text class="call-stack-h1"  x="30" y="40">The call stack</text>
  <text class="call-stack-sub" x="30" y="64">Four steps.</text>
  <g class="call-stack-stage call-stack-s0">
    <rect class="call-stack-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="call-stack-step" x="44" y="142">01</text>
    <text class="call-stack-name" x="70" y="142">Each call gets its own frame</text>
    <text class="call-stack-desc" x="44" y="166">Holding its arguments and</text>
    <text class="call-stack-desc" x="44" y="182">locals.</text>
  </g>
  <line class="call-stack-line call-stack-conn call-stack-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#call-stack-tip)"/>
  <g class="call-stack-stage call-stack-s1">
    <rect class="call-stack-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="call-stack-step" x="280" y="142">02</text>
    <text class="call-stack-name" x="306" y="142">Frames stack up as the recursion descends</text>
    <text class="call-stack-desc" x="280" y="166">None of them finished.</text>
  </g>
  <line class="call-stack-line call-stack-conn call-stack-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#call-stack-tip)"/>
  <g class="call-stack-stage call-stack-s2">
    <rect class="call-stack-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="call-stack-step" x="516" y="142">03</text>
    <text class="call-stack-name" x="542" y="142">The base case returns without adding another</text>
    <text class="call-stack-desc" x="516" y="166">Which stops the descent.</text>
  </g>
  <line class="call-stack-line call-stack-conn call-stack-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#call-stack-tip)"/>
  <g class="call-stack-stage call-stack-s3">
    <rect class="call-stack-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="call-stack-step" x="752" y="142">04</text>
    <text class="call-stack-name" x="778" y="142">Then frames unwind, each combining its result</text>
    <text class="call-stack-desc" x="752" y="166">Which is where the answer</text>
    <text class="call-stack-desc" x="752" y="182">accumulates.</text>
  </g>
  <text class="call-stack-sub" x="30" y="304">Memory grows with the depth rather than the work, which is why deep recursion fails where an equivalent loop would not.</text>
</svg>
