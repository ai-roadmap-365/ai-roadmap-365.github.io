visuals:
  - id: recursion-stack
    file: assets/recursion-stack.svg
    type: diagram
    title: 'The call stack for factorial(4)'
    alt: 'Diagram: the call stack for factorial(4), with frames stacking up as each call waits for a smaller one, the base case factorial(1) returning 1, and the stack unwinding to multiply 1, 2, 6, 24 back up to the answer'
    description: 'Two columns. On the left the calls wind up: factorial(4) waits on factorial(3), which waits on factorial(2), which waits on factorial(1); each is a stack frame holding its own n. factorial(1) is the base case and returns 1. On the right the stack unwinds: 2*1=2, then 3*2=6, then 4*6=24, the answer. A panel notes that the base case is the brake — without it the stack grows forever until RecursionError (a stack overflow).'
  - id: base-recursive-flow
    file: assets/base-recursive-flow.svg
    type: flowchart
    title: 'The decision inside every recursive call'
    alt: 'Flowchart: the decision inside every recursive call — is this the base case? If yes, return the base answer; if no, call yourself on a smaller input and combine the result'
    description: 'A single call f(input) pushes a new stack frame and asks one question: is this the base case (the smallest input)? If yes, return the base answer directly. If no, take the recursive case — call f on a smaller input, then combine that result with the current level (n * result, or first + rest) and return the combination. A side panel states the rule: the input must get closer to the base case on every call, or the recursion never stops.'
  - id: recursion-idea
    file: assets/recursion-idea.svg
    type: diagram
    title: 'What recursion is'
    alt: 'Diagram: the four elements of a recursive solution'
    description: 'A four-stage description of recursion covering the self-call, the smaller problem, the base case and the combination.'
  - id: base-recursive
    file: assets/base-recursive.svg
    type: diagram
    title: 'Two cases, always'
    alt: 'Diagram: the two cases every recursive function needs'
    description: 'A four-stage description of the two cases covering the base case, the recursive case, the reduction and the failure mode.'
  - id: call-stack
    file: assets/call-stack.svg
    type: diagram
    title: 'The call stack'
    alt: 'Diagram: how recursive calls stack up and then unwind'
    description: 'A four-stage description of the call stack covering frame creation, the descent, the base case and the unwinding.'
  - id: tree-recursion
    file: assets/tree-recursion.svg
    type: diagram
    title: 'Why naive tree recursion explodes'
    alt: 'Diagram: why a naive tree recursion recomputes the same values exponentially'
    description: 'A four-stage description of the explosion covering two calls per level, the branching, the repetition and the cost.'
  - id: memoization
    file: assets/memoization.svg
    type: diagram
    title: 'Memoisation'
    alt: 'Diagram: how caching results turns an exponential recursion into a linear one'
    description: 'A four-stage description of memoisation covering the cache, the check, the store and the effect.'
  - id: recursion-not
