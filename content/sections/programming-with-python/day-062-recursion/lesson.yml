slug: recursion
title: 'Recursion'
section: programming-with-python
subsection: python-basics
week: 9
learning_promise: 'After this lesson you will be able to write correct recursive functions with a base case and a recursive case, picture how the call stack grows and unwinds and where RecursionError comes from, use recursion where it truly fits (walking nested lists, dicts, and trees), recognise why naive tree recursion like Fibonacci is exponential, fix it with functools.lru_cache memoization, and judge honestly when a loop is the better choice.'
objectives:
  - 'Write a recursive function with a correct base case and recursive case, and explain why every recursive call must move toward the base case'
  - 'Trace the call stack for a recursion (e.g. factorial), showing frames stacking up and then unwinding to the answer, and explain RecursionError / stack overflow and sys.setrecursionlimit'
  - 'Use recursion for genuinely nested data — flattening an arbitrarily nested list and walking a nested dict/tree — where a loop cannot cleanly handle unknown depth'
  - 'Recognise tree recursion (Fibonacci) and explain why the naive version makes an exponential number of calls'
  - 'Fix exponential recursion with memoization using functools.lru_cache, and measure the reduction in call count'
  - 'Decide between recursion and iteration, accounting for Python having no tail-call optimization, and connect the base-case/recursive-case decomposition to divide-and-conquer thinking and to recursive structures in AI (parse trees, decision trees, nested JSON)'
prerequisites:
  - 'Day 57: functions — definition, arguments, and return values (recursion is a function calling itself)'
  - 'Days 52-55: lists and dictionaries, which the nested-data examples walk'
  - 'Comfort running a script from the terminal with python3 and editing a text file'
reading_time_minutes: 40
practical_time_minutes: 30
