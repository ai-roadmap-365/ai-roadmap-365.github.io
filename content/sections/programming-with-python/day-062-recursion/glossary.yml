terms:
  - term: recursion
    definition: 'A problem-solving technique in which a function calls itself to solve a smaller version of the same problem; built from a base case that stops the process and a recursive case that shrinks the problem and combines results. Ideal for self-similar, nested data.'
  - term: base case
    definition: 'The smallest version of a recursive problem — the one answered directly, with no further self-calls, such as factorial(1) returning 1 or the empty list summing to 0. The base case is the brake that stops the recursion; without a reachable one the function recurses forever.'
  - term: recursive case
    definition: 'The part of a recursive function that reduces the problem to a smaller instance of the same problem, calls itself on that smaller instance, and combines the returned result with the current level (for example n * factorial(n - 1)). The input must move strictly closer to the base case each time.'
  - term: call stack
    definition: 'The stack of frames the interpreter keeps for all the function calls currently in progress: a frame is pushed when a function is called and popped when it returns. Recursion relies on it so each nested call has its own private workspace, and its finite size is why recursion depth is limited.'
  - term: stack frame
    definition: 'The private workspace for a single function call, holding that call''s own arguments and local variables while it waits for the calls it made to finish. In factorial(4), four frames exist at the deepest point, each with its own value of n, before they unwind one by one.'
  - term: recursion limit
    definition: 'Python''s configurable cap on how deep the call stack may go (about 1000 frames by default), readable with sys.getrecursionlimit() and adjustable with sys.setrecursionlimit(). It exists so runaway or maliciously deep recursion raises a catchable error instead of exhausting all memory.'
  - term: stack overflow
    definition: 'The condition where the call stack grows past its limit — in Python surfaced as RecursionError. It is caused by recursion that never reaches its base case, or by input nested deeper than the limit allows; the fixes are a correct base case, a higher limit (with care), or an iterative rewrite.'
  - term: memoization
    definition: 'An optimization that stores the results of expensive function calls and returns the cached result when the same inputs recur, so repeated subproblems are computed only once. Named by Donald Michie in 1968, it turns exponential naive recursion (like Fibonacci) into linear work.'
  - term: lru_cache
    definition: 'A decorator from Python''s functools module (functools.lru_cache) that memoizes a function''s results automatically — "least-recently-used cache". Adding @lru_cache(maxsize=None) above a naive recursive Fibonacci makes each value compute once; fib.cache_info() reports the hits and misses.'
  - term: tree recursion
    definition: 'Recursion in which the recursive case makes two or more calls to itself, so the calls branch into a tree rather than a single chain. Naive Fibonacci is the classic example; the branching means the same subproblems can be recomputed exponentially many times unless the results are cached.'
  - term: divide and conquer
    definition: 'An algorithm-design strategy that solves a problem by breaking it into smaller independent subproblems of the same kind, solving each (often recursively), and combining the results. It is the same decomposition as the base-case/recursive-case split, and underlies sorting, searching, and many tree and graph algorithms.'
  - term: tail call
    definition: 'A recursive call that is the very last action a function performs before returning. Some languages optimize tail calls into a loop so they use constant stack space; Python deliberately does not (no tail-call optimization), which is why deep recursion in Python can raise RecursionError where an equivalent loop would not.'
