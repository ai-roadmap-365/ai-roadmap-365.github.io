<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Output to a pipe is block-buffered.">
  <title>Why your progress line appears all at once</title>
  <style>
    .buffering-bg   { fill: #f8fafc; }
    .buffering-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .buffering-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .buffering-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .buffering-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .buffering-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .buffering-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .buffering-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .buffering-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .buffering-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .buffering-stage { opacity: 1; }

    .buffering-s0 { animation-delay: 0.00s; }
    .buffering-e0 { animation-delay: 0.00s; }
    .buffering-s1 { animation-delay: 1.28s; }
    .buffering-e1 { animation-delay: 1.28s; }
    .buffering-s2 { animation-delay: 2.56s; }
    .buffering-e2 { animation-delay: 2.56s; }
    .buffering-s3 { animation-delay: 3.84s; }
    .buffering-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .buffering-conn  { animation: buffering-trace 6.4s ease-in-out infinite; }
      .buffering-stage { animation: buffering-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes buffering-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes buffering-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .buffering-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .buffering-stage { animation: buffering-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes buffering-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="buffering-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="buffering-bg" width="980" height="322"/>
  <text class="buffering-h1"  x="30" y="40">Why your progress line appears all at once</text>
  <text class="buffering-sub" x="30" y="64">Output to a pipe is block-buffered.</text>
  <g class="buffering-stage buffering-s0">
    <rect class="buffering-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="buffering-step" x="44" y="142">01</text>
    <text class="buffering-name" x="70" y="142">To a terminal: line-buffered</text>
    <text class="buffering-desc" x="44" y="166">Each newline flushes. Progress</text>
    <text class="buffering-desc" x="44" y="182">appears as it happens.</text>
    <text class="buffering-edge" x="44" y="242">immediate</text>
  </g>
  <line class="buffering-line buffering-conn buffering-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#buffering-tip)"/>
  <g class="buffering-stage buffering-s1">
    <rect class="buffering-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="buffering-step" x="280" y="142">02</text>
    <text class="buffering-name" x="306" y="142">To a pipe or file: block-buffered</text>
    <text class="buffering-desc" x="280" y="166">Output is held until several</text>
    <text class="buffering-desc" x="280" y="182">kilobytes accumulate.</text>
    <text class="buffering-edge" x="280" y="242">held</text>
  </g>
  <line class="buffering-line buffering-conn buffering-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#buffering-tip)"/>
  <g class="buffering-stage buffering-s2">
    <rect class="buffering-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="buffering-step" x="516" y="142">03</text>
    <text class="buffering-name" x="542" y="142">So it seems to hang, then dump</text>
    <text class="buffering-desc" x="516" y="166">The work was happening; you just</text>
    <text class="buffering-desc" x="516" y="182">could not see it.</text>
  </g>
  <line class="buffering-line buffering-conn buffering-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#buffering-tip)"/>
  <g class="buffering-stage buffering-s3">
    <rect class="buffering-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="buffering-step" x="752" y="142">04</text>
    <text class="buffering-name" x="778" y="142">flush=True forces it out</text>
    <text class="buffering-desc" x="752" y="166">Per call. Costs a little speed,</text>
    <text class="buffering-desc" x="752" y="182">buys visibility.</text>
    <text class="buffering-edge" x="752" y="242">flush</text>
  </g>
  <text class="buffering-sub" x="30" y="304">This is why a script looks fine interactively and appears frozen under cron or in a CI log. The behaviour changed because the destination did, and the program never knew.</text>
</svg>
