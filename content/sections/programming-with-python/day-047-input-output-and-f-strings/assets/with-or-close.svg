<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="close() at the bottom does not run when something raises.">
  <title>Why every file uses with</title>
  <style>
    .with-or-close-bg   { fill: #f8fafc; }
    .with-or-close-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .with-or-close-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .with-or-close-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .with-or-close-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .with-or-close-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .with-or-close-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .with-or-close-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .with-or-close-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .with-or-close-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .with-or-close-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .with-or-close-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .with-or-close-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .with-or-close-row { opacity: 1; }
    .with-or-close-r0 { animation-delay: 0.00s; }
    .with-or-close-r1 { animation-delay: 0.45s; }
    .with-or-close-r2 { animation-delay: 0.90s; }
    .with-or-close-r3 { animation-delay: 1.35s; }
    .with-or-close-r4 { animation-delay: 1.80s; }
    .with-or-close-row { animation: with-or-close-reveal 7.3s ease-in-out infinite; }
    @keyframes with-or-close-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="with-or-close-bg" width="980" height="390"/>
  <text class="with-or-close-h1"  x="30" y="40">Why every file uses with</text>
  <text class="with-or-close-sub" x="30" y="64">close() at the bottom does not run when something raises.</text>
  <rect class="with-or-close-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="with-or-close-name" x="46" y="122">open() then close()</text>
  <text class="with-or-close-desc" x="46" y="142">Correct until something raises.</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r0" x="46" y="182">The close() sits at the bottom</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r1" x="46" y="216">An exception above it skips it</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r2" x="46" y="250">The handle leaks</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r3" x="46" y="284">In a loop, descriptors run out</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r4" x="46" y="318">try/finally works and is more code</text>
  <rect class="with-or-close-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="with-or-close-name" x="526" y="122">with open(...) as f:</text>
  <text class="with-or-close-desc" x="526" y="142">Closed on every path out.</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r0" x="526" y="182">Closes at the end of the block</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r1" x="526" y="216">Closes when an exception is raised</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r2" x="526" y="250">Closes on an early return</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r3" x="526" y="284">No way to forget</text>
  <text class="with-or-close-desc with-or-close-row with-or-close-r4" x="526" y="318">One line shorter, too</text>
  <text class="with-or-close-sub" x="30" y="372">Day 17's file-descriptor limit is reached from this direction: a long-running process that opens files in a loop without with will exhaust them, and the error names neither the loop nor the files.</text>
</svg>
