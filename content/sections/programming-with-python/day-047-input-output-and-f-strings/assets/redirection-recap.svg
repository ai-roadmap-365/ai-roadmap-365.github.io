<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Your program does not know, and should not care.">
  <title>The shell decides where each stream goes</title>
  <style>
    .redirection-recap-bg   { fill: #f8fafc; }
    .redirection-recap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirection-recap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirection-recap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirection-recap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirection-recap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .redirection-recap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .redirection-recap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .redirection-recap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .redirection-recap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .redirection-recap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .redirection-recap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .redirection-recap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .redirection-recap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .redirection-recap-stage { opacity: 1; }

    .redirection-recap-s0 { animation-delay: 0.00s; }
    .redirection-recap-e0 { animation-delay: 0.00s; }
    .redirection-recap-s1 { animation-delay: 1.28s; }
    .redirection-recap-e1 { animation-delay: 1.28s; }
    .redirection-recap-s2 { animation-delay: 2.56s; }
    .redirection-recap-e2 { animation-delay: 2.56s; }
    .redirection-recap-s3 { animation-delay: 3.84s; }
    .redirection-recap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .redirection-recap-conn  { animation: redirection-recap-trace 6.4s ease-in-out infinite; }
      .redirection-recap-stage { animation: redirection-recap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes redirection-recap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes redirection-recap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .redirection-recap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .redirection-recap-stage { animation: redirection-recap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes redirection-recap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="redirection-recap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="redirection-recap-bg" width="980" height="322"/>
  <text class="redirection-recap-h1"  x="30" y="40">The shell decides where each stream goes</text>
  <text class="redirection-recap-sub" x="30" y="64">Your program does not know, and should not care.</text>
  <g class="redirection-recap-stage redirection-recap-s0">
    <rect class="redirection-recap-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="redirection-recap-step" x="44" y="142">01</text>
    <text class="redirection-recap-name" x="70" y="142">prog | next</text>
    <text class="redirection-recap-desc" x="44" y="166">stdout becomes the next</text>
    <text class="redirection-recap-desc" x="44" y="182">program's stdin. stderr still</text>
    <text class="redirection-recap-desc" x="44" y="198">reaches the screen.</text>
    <text class="redirection-recap-edge" x="44" y="242">|</text>
  </g>
  <line class="redirection-recap-line redirection-recap-conn redirection-recap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#redirection-recap-tip)"/>
  <g class="redirection-recap-stage redirection-recap-s1">
    <rect class="redirection-recap-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="redirection-recap-step" x="280" y="142">02</text>
    <text class="redirection-recap-name" x="306" y="142">prog 2&gt; errors.txt</text>
    <text class="redirection-recap-desc" x="280" y="166">stderr to a file, stdout</text>
    <text class="redirection-recap-desc" x="280" y="182">untouched.</text>
    <text class="redirection-recap-edge" x="280" y="242">2&gt;</text>
  </g>
  <line class="redirection-recap-line redirection-recap-conn redirection-recap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#redirection-recap-tip)"/>
  <g class="redirection-recap-stage redirection-recap-s2">
    <rect class="redirection-recap-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="redirection-recap-step" x="516" y="142">03</text>
    <text class="redirection-recap-name" x="542" y="142">prog &gt; out.txt 2&gt;&amp;1</text>
    <text class="redirection-recap-desc" x="516" y="166">Both to one file, when you want</text>
    <text class="redirection-recap-desc" x="516" y="182">the whole story together.</text>
    <text class="redirection-recap-edge" x="516" y="242">2&gt;&amp;1</text>
  </g>
  <line class="redirection-recap-line redirection-recap-conn redirection-recap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#redirection-recap-tip)"/>
  <g class="redirection-recap-stage redirection-recap-s3">
    <rect class="redirection-recap-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="redirection-recap-step" x="752" y="142">04</text>
    <text class="redirection-recap-name" x="778" y="142">prog &lt; input.txt</text>
    <text class="redirection-recap-desc" x="752" y="166">stdin from a file. input() reads</text>
    <text class="redirection-recap-desc" x="752" y="182">from there, not the keyboard.</text>
    <text class="redirection-recap-edge" x="752" y="242">&lt;</text>
  </g>
  <text class="redirection-recap-sub" x="30" y="304">This is Day 10's redirection table, and it works on your Python program for free — because the program reads and writes the same three streams every Unix program has.</text>
</svg>
