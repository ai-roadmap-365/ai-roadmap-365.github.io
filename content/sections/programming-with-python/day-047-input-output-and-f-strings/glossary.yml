terms:
  - term: print
    definition: 'The built-in function that writes its arguments to an output stream (standard output by default), converting each to text and adding a newline; its sep, end, file, and flush arguments control separators, line endings, destination, and buffering.'
  - term: input
    definition: 'The built-in function that reads one line from standard input and returns it as a string with the trailing newline removed; it can display a prompt first, and it always returns text — never a number.'
  - term: stdin
    definition: 'Standard input (file descriptor 0), the stream a program reads from; it may be a keyboard or, in a pipeline, the output of an upstream program.'
  - term: stdout
    definition: 'Standard output (file descriptor 1), the stream a program writes its results to and the channel that feeds the next program in a shell pipeline.'
  - term: stderr
    definition: 'Standard error (file descriptor 2), a second output stream reserved for messages about the run — errors, warnings, progress — kept separate so they do not contaminate the data on standard output.'
  - term: f-string
    definition: 'A formatted string literal, prefixed with f, in which any expression inside curly braces is evaluated and substituted into the text when the program runs; introduced in Python 3.6.'
  - term: format spec
    definition: 'The mini-language written after a colon inside an f-string field, such as >10.2f, controlling fill, alignment, sign, width, thousands separator, precision, and type of the formatted value.'
  - term: context manager
    definition: 'An object used with the with statement that sets up a resource on entry and reliably releases it on exit — closing a file automatically, for example, even if an error is raised inside the block.'
  - term: sys.argv
    definition: 'A list of the command-line arguments passed to a program, as strings; sys.argv[0] is the script name and the real arguments begin at index 1.'
  - term: flush
    definition: 'To force buffered output to be written out immediately rather than held for efficiency; print(..., flush=True) makes text appear the instant it is produced, as in a live progress display.'
  - term: prompt
    definition: 'The text passed to input() and shown to the user before reading their reply, such as input("Your name: ").'
  - term: buffer
    definition: 'A temporary in-memory holding area where output collects before being written out in efficient chunks; flushing empties it early.'
  - term: exit code
    definition: 'An integer a program returns to the shell when it ends; 0 means success and any non-zero value (set with sys.exit(1)) signals failure, letting scripts and pipelines detect problems.'
