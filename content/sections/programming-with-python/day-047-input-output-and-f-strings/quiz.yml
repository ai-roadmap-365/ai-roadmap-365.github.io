questions:
  - question: 'A learner writes total = input("a: ") + input("b: "), types 5 then 7, and finds total is "57". What happened?'
    options:
      - 'input() returned numbers, but + concatenated them by mistake'
      - 'input() always returns a string, so + joined "5" and "7" instead of adding'
      - 'Python added 5 and 7 but displayed the result in a different base'
      - 'input() only reads one character at a time'
    answer_index: 1
    explanation: 'input() always returns a str, even for digits, so "5" + "7" is string concatenation, giving "57". Converting with int() first — int(input(...)) — makes it real addition that gives 12.'

  - question: 'Which print() keyword argument forces buffered text out to the terminal immediately, as needed for a live progress indicator or streamed output?'
    options:
      - 'end'
      - 'sep'
      - 'flush'
      - 'file'
    answer_index: 2
    explanation: 'flush=True forces Python to write the output buffer out at once instead of collecting it. sep sets the separator between values, end sets what follows the last value, and file chooses the destination stream.'

  - question: 'What does the format spec in f"{price:>10.2f}" do to the value?'
    options:
      - 'Left-aligns it in 10 characters with 2 significant figures'
      - 'Right-aligns it in a field 10 characters wide with exactly 2 decimal places'
      - 'Pads it with 10 zeros and rounds to 2 decimals'
      - 'Prints it in scientific notation with 2 digits'
    answer_index: 1
    explanation: 'The > means right-align, 10 is the minimum field width, and .2f means fixed-point with two decimal places. For price = 7.5 it produces "      7.50" — six padding spaces plus "7.50", ten characters in all.'

  - question: 'In a shell pipeline like cat data.txt | python3 tool.py | sort, why must tool.py send its error messages to standard error rather than standard output?'
    options:
      - 'Standard error is faster than standard output'
      - 'Error messages on standard output would flow down the pipe and corrupt the data sort receives'
      - 'Standard output cannot display red text'
      - 'sort only reads from standard error'
    answer_index: 1
    explanation: 'Standard output is the data channel that feeds the next program through the pipe. If errors went there too, they would be mixed into the data stream sort tries to parse. Standard error is a separate channel that stays on the terminal, keeping the pipe clean.'

  - question: 'Which value does sys.argv[0] hold when you run python3 greet.py Ada 30?'
    options:
      - 'The first real argument, "Ada"'
      - 'The number of arguments, 2'
      - 'The script name, "greet.py"'
      - 'The Python interpreter path'
    answer_index: 2
    explanation: 'sys.argv[0] is the script name itself; the actual arguments start at index 1, so sys.argv[1] is "Ada" and sys.argv[2] is "30" — and, like input(), those items are strings that need converting for arithmetic.'

  - question: 'Why should you never write eval(input()) to turn user input into a value?'
    options:
      - 'eval() is slower than int()'
      - 'eval() executes the input as Python code, letting anyone run arbitrary commands on your machine'
      - 'eval() only works on numbers, not text'
      - 'eval() rounds numbers incorrectly'
    answer_index: 1
    explanation: 'eval() runs its text argument as Python code, so eval(input()) lets whoever supplies the input execute anything on your system. To turn text like "42" into a number, use int() or float(), which parse a value and nothing more.'

  - question: 'What is the correct, safe way to open a file for writing so it is always closed, even if an error occurs mid-write?'
    options:
      - 'f = open("out.txt", "w") and remember to call f.close() at the end'
      - 'with open("out.txt", "w") as f:'
      - 'open("out.txt", "w").write(...) on one line'
      - 'eval(open("out.txt"))'
    answer_index: 1
    explanation: 'The with statement uses the file as a context manager: it opens the file, gives you f inside the block, and guarantees the file is closed when the block ends — even if an exception is raised. Manual close() calls are easy to skip when an error jumps past them.'

  - question: 'You want a tool that runs as cat log.txt | python3 count.py, with no human present. Which input method fits, and what breaks if you choose input()?'
    options:
      - 'Use input(); nothing breaks because pipes and keyboards are the same'
      - 'Read sys.stdin; input() would print a prompt but still work fine'
      - 'Read sys.stdin; input() reads only one line and, with no keyboard, an interactive prompt can hang waiting for a human'
      - 'Use sys.argv; sys.stdin cannot be read in Python'
    answer_index: 2
    explanation: 'A pipeline filter should consume the whole stream with sys.stdin. input() reads a single line and is designed for an interactive human; in an automated context it can block waiting for keyboard input that never comes, so the program appears to hang.'
