visuals:
  - id: io-streams-python
    file: assets/io-streams-python.svg
    type: diagram
    title: "A Python program's three standard streams"
    alt: "Diagram: a Python program's three standard streams — stdin in, stdout and stderr out — and how they connect in a shell pipeline"
    description: 'An architecture diagram placing a Python program between its three standard streams: input() reads stdin (file descriptor 0) from the keyboard or a pipe, print() writes stdout (1) for results, and print(file=sys.stderr) writes stderr (2) for errors; a strip below shows stdout feeding the stdin of the next program in a shell pipeline while stderr stays on the terminal.'
  - id: fstring-format
    file: assets/fstring-format.svg
    type: flowchart
    title: 'Reading an f-string format spec'
    alt: 'Diagram: the f-string format specification broken into fill/align, width, precision, and type fields'
    description: 'A flow diagram that splits the format spec in f"{price:>10.2f}" into its four fields — the > alignment character, the width 10, the precision .2, and the type letter f — and shows the resulting right-aligned, ten-wide, two-decimal output for the value 7.5, with a note on adding a comma for a thousands separator.'
