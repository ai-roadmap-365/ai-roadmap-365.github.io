visuals:
  - id: io-streams-python
    file: assets/io-streams-python.svg
    type: diagram
    title: "A Python program's three standard streams"
    alt: "Diagram: a Python program's three standard streams — stdin in, stdout and stderr out — and how they connect in a shell pipeline"
    description: 'An architecture diagram placing a Python program between its three standard streams: input() reads stdin (file descriptor 0) from the keyboard or a pipe, print() writes stdout (1) for results, and print(file=sys.stderr) writes stderr (2) for errors; a strip below shows stdout feeding the stdin of the next program in a shell pipeline while stderr stays on the terminal.'
  - id: fstring-format
    file: assets/fstring-format.svg
    type: flowchart
    title: 'Reading an f-string format spec'
    alt: 'Diagram: the f-string format specification broken into fill/align, width, precision, and type fields'
    description: 'A flow diagram that splits the format spec in f"{price:>10.2f}" into its four fields — the > alignment character, the width 10, the precision .2, and the type letter f — and shows the resulting right-aligned, ten-wide, two-decimal output for the value 7.5, with a note on adding a comma for a thousands separator.'
  - id: stdout-or-stderr
    file: assets/stdout-or-stderr.svg
    type: diagram
    title: 'Results on one stream, commentary on the other'
    alt: 'Diagram: what belongs on stdout compared with stderr'
    description: 'A two-column comparison of the standard output and standard error streams, covering what each should carry and what a pipe does with them.'
  - id: input-returns-string
    file: assets/input-returns-string.svg
    type: diagram
    title: 'input() always returns a string'
    alt: 'Diagram: why input returns text and what to do about it'
    description: 'A four-stage sequence showing input returning a string, the consequences of using it as a number, converting it, and handling a conversion that fails.'
  - id: with-or-close
    file: assets/with-or-close.svg
    type: diagram
    title: 'Why every file uses with'
    alt: 'Diagram: opening a file with a context manager compared with closing it manually'
    description: 'A two-column comparison of manual file closing against the with statement, covering what happens when an exception is raised inside the block.'
  - id: buffering
    file: assets/buffering.svg
    type: diagram
    title: 'Why your progress line appears all at once'
    alt: 'Diagram: line buffering to a terminal compared with block buffering to a pipe'
    description: 'A four-stage explanation of output buffering showing that Python line-buffers to a terminal and block-buffers to a pipe or file, and that flush forces the write.'
  - id: stream-or-load
    file: assets/stream-or-load.svg
    type: diagram
    title: 'Iterating a file, or reading it whole'
    alt: 'Diagram: iterating a file line by line compared with reading it entirely'
    description: 'A two-column comparison of streaming a file line by line against loading its full contents into memory.'
  - id: argv-is-day-12
    file: assets/argv-is-day-12.svg
    type: diagram
    title: 'sys.argv is Day 12, in Python'
    alt: 'Diagram: how sys.argv maps to shell positional parameters'
    description: 'A four-stage mapping of Python''s sys.argv onto the shell positional parameters from the scripting lesson, including the default-value idiom.'
  - id: logging-not-print
    file: assets/logging-not-print.svg
    type: diagram
    title: 'When print should become logging'
    alt: 'Diagram: print compared with the logging module'
    description: 'A two-column comparison of print statements against the logging module for a script that runs unattended, covering levels, destinations and timestamps.'
  - id: redirection-recap
    file: assets/redirection-recap.svg
    type: diagram
    title: 'The shell decides where each stream goes'
    alt: 'Diagram: how the shell redirects a program''s three streams'
    description: 'A four-stage reference to shell redirection of a Python program''s streams, covering piping stdout, redirecting stderr separately, merging them, and feeding stdin.'
  - id: encoding-explicitly
    file: assets/encoding-explicitly.svg
    type: diagram
    title: 'Always pass encoding'
    alt: 'Diagram: opening a file with and without an explicit encoding'
    description: 'A two-column comparison of opening a text file with an explicit encoding against relying on the platform default, and the silent corruption that can follow.'
