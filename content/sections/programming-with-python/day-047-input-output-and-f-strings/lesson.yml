title: 'Input, Output, and f-strings'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will be able to read input safely from a prompt, a pipe, or a command-line argument, format values into clean aligned output with f-string format specs, and separate results from errors so your program behaves well inside a shell pipeline.'
objectives:
  - 'Use print() fully — sep, end, file, and flush — and explain what each argument controls'
  - 'Explain why input() always returns a str and convert its result to a number safely with int() or float()'
  - 'Read and apply the f-string format specification for alignment, width, precision, thousands separators, dates, and expressions'
  - 'Name the three standard streams (stdin, stdout, stderr) and route results to stdout and diagnostics to stderr so a pipeline stays clean'
  - 'Read command-line arguments from sys.argv and read piped data from sys.stdin, and choose between input(), sys.argv, and sys.stdin for a given task'
  - 'Open and write a file safely with open() and a with-statement context manager, and state why eval() must never be used on input'
prerequisites:
  - 'Days 43-46: a working Python 3 install, variables and types, strings, and numbers'
  - 'Day 10: the shell and pipes (stdout of one program feeding stdin of the next)'
  - 'A terminal on macOS or Linux (or WSL on Windows)'
