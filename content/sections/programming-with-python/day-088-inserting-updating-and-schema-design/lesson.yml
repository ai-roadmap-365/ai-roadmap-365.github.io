slug: inserting-updating-and-schema-design
title: 'Inserting, Updating, and Schema Design'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to change data without destroying it: writing rows in every useful form — single, multi-row, INSERT INTO SELECT, RETURNING and UPSERT via ON CONFLICT — updating with expressions and subqueries rather than stale literals, choosing between a hard DELETE and a reversible soft delete, and wrapping any of it in a transaction whose rollback you can prove leaves the database byte for byte as it was. You will design schemas where the bad row is impossible rather than merely discouraged, using NOT NULL, UNIQUE, CHECK, DEFAULT, PRIMARY KEY, foreign keys with the right delete rule, and STRICT typing; normalize to third normal form and then denormalize deliberately, with generated columns where they fit; work around SQLite ALTER TABLE using the documented create-copy-drop-rename rebuild; and build a versioned migration runner from first principles that is atomic when a migration fails and idempotent when it is run twice.'
objectives:
  - 'Measure the real cost of a WHERE-less UPDATE, and apply the SELECT-first routine — copy the file, write the SELECT, read the row count, keep the WHERE clause byte for byte, check changes() inside a transaction — that reduces it to a non-event'
  - 'Write every useful shape of INSERT, including multi-row VALUES as a single implicit transaction, INSERT INTO SELECT, RETURNING for values the database decided, and UPSERT via ON CONFLICT DO UPDATE, explaining why excluded.copies is not copies and why UPSERT differs from insert-then-update'
  - 'Update with an expression or a correlated subquery rather than a literal read earlier, and choose between a hard DELETE and a soft delete on whether the row is noise or history — naming the filter that soft delete imposes on every future query'
  - 'Use transactions correctly — BEGIN, COMMIT, ROLLBACK — explain atomicity in terms of the rollback journal holding the original pages, and demonstrate mechanically that a rolled-back multi-statement change leaves the database file byte for byte identical'
  - 'State correctly what most people have backwards: a constraint error undoes only the failing statement and leaves the transaction open, so a COMMIT afterwards keeps whatever already succeeded — and use ROLLBACK or sqlite3 -bail accordingly'
  - 'Encode domain rules as constraints — NOT NULL, UNIQUE, CHECK, DEFAULT, PRIMARY KEY, FOREIGN KEY and STRICT typing — read each as a sentence about the world, and name the specific bad row each one prevents'
  - 'Explain why a schema constraint beats application validation when the two disagree, and why PRAGMA foreign_keys being off by default makes every REFERENCES clause decoration until it is set on each connection'
  - 'Choose between ON DELETE CASCADE, RESTRICT and SET NULL by asking what the child row means once the parent is gone, and recognise that changes() does not count cascaded rows'
  - 'Normalize a schema through first, second and third normal form with a concrete before-and-after on the library tables, then denormalize deliberately — using a generated column where the expression fits in one row, and knowing what you owe when it does not'
  - 'Name the four operations SQLite ALTER TABLE documents, verify what a specific build actually supports rather than trusting memory, and perform the documented create-copy-drop-rename rebuild inside one transaction with foreign keys off and a foreign_key_check afterwards'
  - 'Build a versioned migration runner from first principles that tracks PRAGMA user_version, applies each migration and its version bump in one transaction so a failure rolls back both, and is idempotent on re-run'
  - 'Compare the ways teams manage schema change — a from-scratch runner, plain SQL files plus a version table, Alembic and Django migrations — and state honestly what differs on other engines regarding ALTER TABLE and transactional DDL'
  - 'Explain why a training-data table without constraints is a model problem waiting to be misdiagnosed, since a duplicated example, a null label or a leaked test row will all be accepted silently'
prerequisites:
  - 'Day 85: the relational model, SQLite, and the sqlite3 shell'
  - 'Day 86: SELECT with WHERE, ORDER BY, GROUP BY and aggregates — you write the SELECT before every UPDATE'
  - 'Day 87: primary and foreign keys, relationships and joins, including that PRAGMA foreign_keys is off by default. This lesson proves that default again because it is the most consequential one in SQLite'
  - 'Days 64-66: reading and writing files, JSON, and an exception-handling strategy — the migration runner builds on all three'
  - 'Day 80 (argparse) for the migration runner''s command-line interface, and Day 43 for running python3 comfortably'
  - 'A terminal, the sqlite3 shell, and python3 3.9 or newer. No third-party packages and no network access are needed at any point'
