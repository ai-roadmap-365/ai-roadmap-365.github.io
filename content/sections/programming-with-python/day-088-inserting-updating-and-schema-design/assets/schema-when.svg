<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the workload.">
  <title>Normalise or denormalise</title>
  <style>
    .schema-when-bg   { fill: #f8fafc; }
    .schema-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-when-row { opacity: 1; }
    .schema-when-r0 { animation-delay: 0.00s; }
    .schema-when-r1 { animation-delay: 0.45s; }
    .schema-when-r2 { animation-delay: 0.90s; }
    .schema-when-r3 { animation-delay: 1.35s; }
    .schema-when-r4 { animation-delay: 1.80s; }
    .schema-when-row { animation: schema-when-reveal 7.3s ease-in-out infinite; }
    @keyframes schema-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="schema-when-bg" width="980" height="390"/>
  <text class="schema-when-h1"  x="30" y="40">Normalise or denormalise</text>
  <text class="schema-when-sub" x="30" y="64">By the workload.</text>
  <rect class="schema-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="schema-when-name" x="46" y="122">Normalise</text>
  <text class="schema-when-desc" x="46" y="142">Four cases.</text>
  <text class="schema-when-desc schema-when-row schema-when-r0" x="46" y="182">Frequent updates to shared facts</text>
  <text class="schema-when-desc schema-when-row schema-when-r1" x="46" y="216">Correctness matters most</text>
  <text class="schema-when-desc schema-when-row schema-when-r2" x="46" y="250">Many writers</text>
  <text class="schema-when-desc schema-when-row schema-when-r3" x="46" y="284">Storage matters</text>
  <text class="schema-when-desc schema-when-row schema-when-r4" x="46" y="318">The default starting point</text>
  <rect class="schema-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="schema-when-name" x="526" y="122">Denormalise</text>
  <text class="schema-when-desc" x="526" y="142">Also four.</text>
  <text class="schema-when-desc schema-when-row schema-when-r0" x="526" y="182">Read-heavy analytics</text>
  <text class="schema-when-desc schema-when-row schema-when-r1" x="526" y="216">Joins measured as the bottleneck</text>
  <text class="schema-when-desc schema-when-row schema-when-r2" x="526" y="250">Data written once, read constantly</text>
  <text class="schema-when-desc schema-when-row schema-when-r3" x="526" y="284">A reporting copy, generated</text>
  <text class="schema-when-desc schema-when-row schema-when-r4" x="526" y="318">Never by hand-maintained duplication</text>
  <text class="schema-when-sub" x="30" y="372">The last row is the condition on all the others: denormalised data that is generated stays consistent, and denormalised data that is typed does not.</text>
</svg>
