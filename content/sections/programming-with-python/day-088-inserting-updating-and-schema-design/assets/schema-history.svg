<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward enforced structure.">
  <title>Four steps in schema thinking</title>
  <style>
    .schema-history-bg   { fill: #f8fafc; }
    .schema-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schema-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schema-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schema-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schema-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schema-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schema-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schema-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schema-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schema-history-stage { opacity: 1; }

    .schema-history-s0 { animation-delay: 0.00s; }
    .schema-history-e0 { animation-delay: 0.00s; }
    .schema-history-s1 { animation-delay: 1.28s; }
    .schema-history-e1 { animation-delay: 1.28s; }
    .schema-history-s2 { animation-delay: 2.56s; }
    .schema-history-e2 { animation-delay: 2.56s; }
    .schema-history-s3 { animation-delay: 3.84s; }
    .schema-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schema-history-conn  { animation: schema-history-trace 6.4s ease-in-out infinite; }
      .schema-history-stage { animation: schema-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schema-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schema-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schema-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schema-history-stage { animation: schema-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schema-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schema-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schema-history-bg" width="980" height="322"/>
  <text class="schema-history-h1"  x="30" y="40">Four steps in schema thinking</text>
  <text class="schema-history-sub" x="30" y="64">Toward enforced structure.</text>
  <g class="schema-history-stage schema-history-s0">
    <rect class="schema-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schema-history-step" x="44" y="142">01</text>
    <text class="schema-history-name" x="70" y="142">Fixed record layouts, known only to the program</text>
    <text class="schema-history-desc" x="44" y="166">Undocumented, and fragile.</text>
  </g>
  <line class="schema-history-line schema-history-conn schema-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schema-history-tip)"/>
  <g class="schema-history-stage schema-history-s1">
    <rect class="schema-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schema-history-step" x="280" y="142">02</text>
    <text class="schema-history-name" x="306" y="142">Then normalisation theory: rules for storing facts once</text>
    <text class="schema-history-desc" x="280" y="166">With formal justification.</text>
  </g>
  <line class="schema-history-line schema-history-conn schema-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schema-history-tip)"/>
  <g class="schema-history-stage schema-history-s2">
    <rect class="schema-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schema-history-step" x="516" y="142">03</text>
    <text class="schema-history-name" x="542" y="142">Then constraints enforced by the engine</text>
    <text class="schema-history-desc" x="516" y="166">Which made the rules real.</text>
  </g>
  <line class="schema-history-line schema-history-conn schema-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schema-history-tip)"/>
  <g class="schema-history-stage schema-history-s3">
    <rect class="schema-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schema-history-step" x="752" y="142">04</text>
    <text class="schema-history-name" x="778" y="142">And migration tooling for changing schemas safely</text>
    <text class="schema-history-desc" x="752" y="166">Versioned, and repeatable.</text>
  </g>
  <text class="schema-history-sub" x="30" y="304">Versioned migrations were the step that made schemas maintainable, because before them a schema change was a hand-run script nobody could reproduce.</text>
</svg>
