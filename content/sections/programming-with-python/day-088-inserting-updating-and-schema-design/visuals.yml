visuals:
  - id: schema-constraints-architecture
    file: assets/schema-constraints-architecture.svg
    type: diagram
    title: 'The four layers that protect data, and what slips past each one'
    alt: "Diagram: the four layers that protect data — application validation, then the schema's constraints, then transactions, then the durable file and its backup — each shown with what it catches and what slips past it, with a write entering at the top and arriving as a durable row at the bottom"
    description: 'A static architecture diagram read from top to bottom. A write — an INSERT, UPDATE or DELETE — enters at the top and passes through four stacked defences, each drawn as a band listing in green what it catches and in red what walks straight through it. Layer one is application validation: your Python, your web form, your loader script. It catches typos, empty fields and gives a friendly message before anything is attempted, but every writer that is not this program slips past it — a console session, a colleague''s script, a second service, or a bug in the validator itself. Layer two, drawn heaviest and shaded to mark it as the strongest, is the schema''s constraints: NOT NULL, UNIQUE, CHECK, DEFAULT, PRIMARY KEY, FOREIGN KEY and STRICT. It catches the same mistakes from every writer, forever, including the one-off script nobody reviewed; what slips past it is any rule needing more than one row at a time, since a CHECK may not contain a subquery, and foreign keys entirely unless PRAGMA foreign_keys equals ON is set on this connection. A caption notes this is the layer that wins ties because it is the only one still enforced at three in the morning. Layer three is the transaction boundary, BEGIN through COMMIT or ROLLBACK. It catches a multi-statement change that must not half-happen and a change you look at and decide against; what slips past is that a statement error does not roll the transaction back, so a COMMIT after an error keeps whatever already succeeded, and a WHERE-less UPDATE that you then commit, which was never invalid but only wrong. Layer four is the durable file and the copy you took first, and nothing slips past it because there is no layer after it — which is why the copy is not optional. The closing caption reads: validation is a courtesy to the user, a constraint is a promise to everyone who will ever write to this table.'
  - id: transaction-flow
    file: assets/transaction-flow.svg
    type: flow-animated
    title: 'One transaction, from BEGIN to either COMMIT or ROLLBACK'
    alt: 'Flowchart: one transaction from BEGIN to either COMMIT or ROLLBACK — the rollback journal copies the original pages aside, three statements change loan and book rows, and then the path branches into COMMIT making the new values durable or ROLLBACK restoring the original pages so the file is byte for byte what it was'
    description: 'An animated flow diagram of a single transaction, using concrete values from the lab''s library database so the still frame teaches on its own. BEGIN sits at the top left. A marching-dash wire leads to an amber rollback-journal box which fills as it copies the ORIGINAL pages aside first, annotated that this copy is the whole trick and that undo is just putting these pages back. Three statement boxes then light up in sequence: UPDATE loans SET returned equals 1 WHERE id equals 2, moving loan 2 from returned 0 to 1; UPDATE books SET copies equals copies plus 1 WHERE id equals 3, moving book 3 from 4 copies to 5; and a SELECT counting outstanding loans which answers 7 rather than 8, because your own connection sees the change. A panel to the right describes the state while the transaction is open: you see loan 2 returned equals 1 and outstanding equals 7, while the file holds both versions at once, the new pages in the database and the originals in the journal beside it, with nothing yet decided — and it records that an error here undoes only the failing statement, leaving the transaction open and waiting for you. The path then branches into two outcomes that take turns being emphasised so neither reads as the default. The green COMMIT branch deletes the journal, since there is nothing left to undo with, and leaves loan 2 returned equals 1, book 3 copies equals 5 and outstanding equals 7, durable against a crash, a power cut and your regret. The blue ROLLBACK branch copies the original pages back over the new ones, restoring loan 2 returned equals 0, book 3 copies equals 4 and outstanding equals 8, leaving the file byte for byte what it was before BEGIN. A closing note states that the resting state shows both outcomes and every value, and that the animation only marks the order: journal first, statements next, decision last. A prefers-reduced-motion block stops every animation and restores full opacity and a solid wire.'
