questions:
  - question: 'In one sentence, what is an index?'
    options:
      - 'A sorted copy of some columns in a B-tree, pointing at the row'
      - 'A rearrangement of the table so its rows are stored in the order of the indexed column'
      - 'A cache of the results of queries you have already run'
      - 'An instruction to the query planner telling it which columns to filter on first'
    answer_index: 0
    explanation: 'Every property of an index follows from that one sentence. COPY is why it costs disk and why dropping it loses nothing. SORTED is why a lookup can halve the search space instead of walking it. POINTER — the rowid — is how the engine gets from the index entry back to the rest of the row, and the case where it does not need to is the covering index, the fastest of all. It is emphatically not a rearrangement of the table: the table keeps its own order, which in SQLite is a B-tree keyed by rowid. And it is not an instruction: you create it and the planner decides whether to use it, possibly differently tomorrow on the same query.'

  - question: 'Your plan reads `SCAN events USING COVERING INDEX ix_trace`. What is happening?'
    options:
      - 'A seek: the index is named, so the engine descended to the matching rows'
      - 'A scan: every index entry is walked end to end'
      - 'The index is corrupt and needs rebuilding with REINDEX'
      - 'The query failed to compile and fell back to a default plan'
    answer_index: 1
    explanation: 'This is the most commonly misread line in the whole topic, and reading it wrongly is how people conclude that their index "did not work" when in fact it was never used for a seek. The first word is the one that matters. SCAN means something is being walked from one end to the other; SEARCH means the engine descended a tree to the rows it wanted. SCAN ... USING INDEX means the planner judged the index a cheaper thing to walk than the table — a real improvement, measured at 7.281 ms against about 13 in the lab — and the cost still grows in proportion to the row count. Only SEARCH breaks that link.'

  - question: 'You have one index on `(run_id, status)`. Which query CANNOT use it for a seek?'
    options:
      - 'WHERE run_id = 200 AND status = ''failed'''
      - 'WHERE run_id = 200'
      - 'WHERE status = ''failed'''
      - 'WHERE status = ''failed'' AND run_id = 200'
    answer_index: 2
    explanation: 'This is the leftmost-prefix rule, and the lab proves it query by query with exactly these four. An index on (run_id, status) is sorted by run_id first and by status only WITHIN one run_id — so the failed rows are scattered one clump per run through the whole index, and there is no starting point to descend to. The first, third and fourth all seek. Note especially that the fourth is the first one written in the other order and gets an identical plan: the order of conditions in WHERE is irrelevant, because the planner reorders them freely. The order of COLUMNS IN THE INDEX is what decides. An index on (a, b, c) serves a, (a, b) and (a, b, c), and cannot seek on b, on c, or on (b, c).'

  - question: 'You add an index, run EXPLAIN QUERY PLAN, and the query is still a SCAN. Which of these is NOT one of the usual causes?'
    options:
      - 'A function or expression wraps the column, so the query asks about values the index does not contain'
      - 'One branch of an OR has no index, so a row failing the indexed test might still pass the other'
      - 'The LIKE pattern begins with a wildcard, so the value''s beginning is unknown'
      - 'The index was created after the rows were inserted, so it only covers rows added since'
    answer_index: 3
    explanation: 'CREATE INDEX builds the index over every row already in the table and the engine maintains it from then on. An index is never partially populated — that is the whole point of it being transactional. The other three are the real and common causes, all demonstrated in the lab: lower(trace_id) = ? scans at 24.608 ms with the index sitting right there, and seeks at 0.004 ms once an index on the expression exists; LIKE ''%080-72'' scans and has no ordinary fix, because a B-tree finds values by their beginning; and run_id = ? OR score > ? collapses to a full scan because score is unindexed, while the same OR with both branches indexed produces a MULTI-INDEX OR plan in 0.019 ms. A fifth cause worth knowing: a column too unselective for seeking to be worth it, where the planner declining your index is the planner being right.'

  - question: 'A table has a million rows and its index has a fan-out of about 100. Roughly how many pages does a seek read, and what happens at a hundred million rows?'
    options:
      - 'About three pages, rising to about four or five'
      - 'About 1,000 pages, rising to about 10,000'
      - 'About 500 pages, rising to about 50,000 — half the tree on average'
      - 'One page in both cases, because the index is loaded into memory in full'
    answer_index: 0
    explanation: 'This is the arithmetic that makes the whole thing work, and it is worth doing rather than accepting. With roughly 100 entries per page, one level reaches 100 keys, two reach 10,000, three reach 1,000,000 and four reach 100,000,000. A seek reads one page per level, so a million rows is about three page reads and a hundred million is about four or five. FAN-OUT is that hundred — how many children a node has — and it is why a B-tree node is a whole disk page rather than the two children of a binary tree. The consequence is the flat seek column in the lesson''s measurements: 0.028, 0.027, 0.028 and 0.027 milliseconds as the table went from 25,000 rows to 400,000. Compare the scan over the same range: 0.31, 1.96, 4.13, 8.41.'

  - question: 'You add an index and one of your queries gets SLOWER. What is the most likely explanation?'
    options:
      - 'The index changed which rows the query returns, so it now has more work to do'
      - 'It was not a SELECT — every write now maintains the index too'
      - 'The index needs ANALYZE before it can be used at all'
      - 'Indexes always slow down SELECT statements and speed up INSERT statements'
    answer_index: 1
    explanation: 'An index cannot change an answer, and this is the property that makes it safe to add and drop — the lab asserts that the rows returned before and after are identical, at every table size. What it does change is the cost of writing. Every insert has to place a new entry in the right position in every index; every delete has to remove one from each; every update to an indexed column has to do both. Measured in the lab: the same bulk insert of 100,000 rows took 53.9 ms with no indexes and 632.3 ms with five, 11.7 times slower, and the file grew 2.4 times larger for the same rows. That cost is paid on every write, for ever, and it will not appear in any query timing you are looking at — which is exactly why an index nobody queries is the most expensive kind. There is a second, rarer case worth knowing: a genuinely unselective index that the planner chooses anyway can be slower than a scan, because every match costs a jump back into the table.'

  - question: 'What makes an index "covering", and why is it the fastest case?'
    options:
      - 'It covers every row in the table rather than a subset, so no rows are missed'
      - 'It covers several tables at once, so a join needs only one lookup'
      - 'Every column is in the index, so the table is never opened'
      - 'It is stored in memory rather than on disk, so no page read is needed at all'
    answer_index: 2
    explanation: 'It is not a special kind of index — you cannot declare one. It is an ordinary index that happens to contain everything a particular query asked for. An index on (run_id) can find the matching entries for WHERE run_id = ? and must then follow each rowid back into the table to fetch score; an index on (run_id, score) already has score, so the trip home never happens and the plan says SEARCH events USING COVERING INDEX ix_run_score. The practical consequence is one of the few genuinely counter-intuitive pieces of index design: it can be worth adding a column to an index that you never filter on, purely because you SELECT it. The cost is a wider index — more pages, and more work on every write — so it is a trade like everything else here, and one you can measure.'

  - question: 'Why does this lesson''s test suite refuse to assert that the indexed lookup takes under 0.05 ms?'
    options:
      - 'Because SQLite does not expose timings accurately enough to assert on'
      - 'Because the suite runs offline, and timing requires a network clock'
      - 'Because assertions about performance belong in the documentation rather than in tests'
      - 'It measures the computer, not the code, so it fails elsewhere'
    answer_index: 3
    explanation: 'This is a real lesson about testing, not a limitation. A duration is a property of the machine that ran it, so a test pinned to one goes red for reasons that have nothing to do with whether the lab is correct — and a suite that goes red for reasons nobody can act on is a suite people stop reading. The forty checks assert SHAPE instead: the plan changed from SCAN to SEARCH; the two results contain exactly the same rows; the indexed lookup is at least 20x faster; inserting with five indexes is at least 1.5x slower; the composite index serves these query shapes and cannot serve that one. Both ratio thresholds sit far below what the authoring machine measured — 20x against about 300x, 1.5x against about 12x — so a slow or noisy machine still passes while a genuinely broken lab still fails. Assert the direction and an order of magnitude; never the number.'
