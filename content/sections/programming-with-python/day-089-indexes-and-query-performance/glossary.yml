terms:
  - term: 'Index'
    definition: 'A second, sorted copy of one or more columns, stored alongside the table as its own B-tree, with a pointer back to the full row. Every property follows from that sentence: it costs disk because it is a copy, it speeds reads because it is sorted, and it slows writes because a copy has to be kept correct. It never changes an answer, which is why adding or dropping one is the safest performance change you will make.'
  - term: 'B-tree'
    definition: 'The balanced, disk-oriented tree that stores both tables and indexes in SQLite, described by Rudolf Bayer and Edward M. McCreight in 1972. Each node is a whole page holding many keys rather than the two of a binary tree, and the tree grows at the root, so every leaf stays the same distance from the top and no rebuild is ever needed.'
  - term: 'Fan-out'
    definition: 'How many children a node of a B-tree has — with a 4,096-byte page and small integer keys, roughly a hundred. Fan-out is why depth grows so slowly: one level reaches about 100 entries, two about 10,000, three about a million. A hundredfold increase in rows adds one page read to a seek.'
  - term: 'Table scan'
    definition: 'Reading every page of a table and testing every row, because there is no ordered structure that says where the matches might be. SQLite calls it SCAN in a query plan. Its cost grows in proportion to the table, for ever: measured here at 0.31 ms over 25,000 rows and 8.41 ms over 400,000.'
  - term: 'Index seek'
    definition: 'Descending an index from its root to the entries that match, reading one page per level. SQLite calls it SEARCH. Its cost grows with the logarithm of the row count, which in practice means it barely grows at all: measured here at about 0.027 ms at every table size from 25,000 rows to 400,000.'
  - term: 'rowid'
    definition: 'The 64-bit integer that identifies a row in an ordinary SQLite table. The table itself is a B-tree keyed by it, so a lookup by rowid is already a seek with nothing created. Declaring a column INTEGER PRIMARY KEY makes that column become the rowid rather than adding a second key; any other primary key type creates a separate index.'
  - term: 'Query plan'
    definition: 'The engine''s chosen strategy for answering a statement, printed by EXPLAIN QUERY PLAN. Read the first word of each step: SCAN means something is being walked end to end, SEARCH means a descent to the matching rows. SCAN naming an index is still a scan — of the index rather than the table — and misreading that line is the most common mistake in the whole topic.'
  - term: 'Composite index'
    definition: 'An index on more than one column, sorted by the first column, then by the second within one value of the first, and so on. The order of the columns is the whole of its behaviour, which is why choosing it deliberately matters more than adding another index.'
  - term: 'Leftmost prefix'
    definition: 'The rule that a composite index on (a, b, c) can seek on a, on (a, b) and on (a, b, c), and cannot seek on b, on c, or on (b, c). The order in which conditions appear in a WHERE clause is irrelevant — the planner reorders them freely; the order of columns in the index is what decides.'
  - term: 'Covering index'
    definition: 'An ordinary index that happens to contain every column a particular query mentions, so the rowid pointer is never followed and the table is never opened. SQLite prints COVERING INDEX in the plan. It is the fastest case, and it is the reason it can be worth adding a column to an index that you never filter on but always select.'
  - term: 'Partial index'
    definition: 'An index with its own WHERE clause, covering only the rows that satisfy it. Far smaller — in this lesson''s lab, 186 pages against 1,857 for the equivalent full index — and usable only for queries the planner can prove fall inside that clause. A query without the matching condition will not use it, and that is correct behaviour rather than a disappointment.'
  - term: 'Expression index'
    definition: 'An index built on an expression rather than a bare column, such as lower(trace_id). It stores the computed value and sorts that, which is what rescues a query whose WHERE clause wraps the column in a function. The expression in the query must match the one in the index; an index on lower() does nothing for a query using upper().'
  - term: 'Unique index'
    definition: 'An index that additionally refuses a duplicate key, which is how a UNIQUE constraint enforces itself. It is the one case where an index is not purely a speed change: it also changes which writes are allowed. Every PRIMARY KEY and UNIQUE constraint quietly creates one.'
  - term: 'Cardinality'
    definition: 'How many distinct values a column holds. High cardinality — a trace id, a timestamp, a foreign key — makes for a useful index. Low cardinality, such as a status column with three values, usually does not.'
  - term: 'Selectivity'
    definition: 'The consequence of cardinality: how many rows the average distinct value matches. In this lesson''s data, run_id matches about 100 rows and status matches about 133,334. Seeking a value that matches a third of the table is genuinely more expensive than reading the table straight through, which is why the planner sometimes declines a perfectly valid index and is right to.'
  - term: 'ANALYZE'
    definition: 'The statement that measures your data and writes the results into a table called sqlite_stat1 — one row per index, giving the number of entries and the average rows per distinct key — so the planner chooses from facts rather than from a built-in guess. It matters most on skewed data and on tables whose shape changed after their indexes were built. On evenly distributed data it often changes nothing, and this lesson''s lab says so rather than implying otherwise.'
  - term: 'sqlite_stat1'
    definition: 'The ordinary table ANALYZE writes its statistics into. You can read it with a SELECT like any other table, which is the quickest way to find out what the planner believes about your data — and to discover that a column you were about to index matches a third of the rows.'
  - term: 'EXPLAIN QUERY PLAN'
    definition: 'The command that prints how SQLite intends to answer a statement, without running it. It costs nothing, changes nothing, and is the only honest way to find out whether an index is being used. Run it before optimising anything and again afterwards. Its output is a human-readable description rather than an interface, so the exact wording may differ between SQLite versions.'
  - term: 'USE TEMP B-TREE FOR ORDER BY'
    definition: 'The line in a query plan meaning SQLite built a throwaway tree and sorted every candidate row into it to satisfy an ORDER BY. Measured here at 13.978 ms to return twenty rows from four hundred thousand. An index that already supplies the requested order removes the line and the work with it — 0.007 ms for the same twenty rows.'
  - term: 'Multi-index OR'
    definition: 'The plan SQLite uses when every branch of an OR has its own usable index: it seeks each branch separately and merges the results. It is the reason the folklore that OR always defeats an index is wrong. One unindexed branch collapses the whole condition to a scan, because a row failing the indexed test might still pass the other one — an OR is only as indexed as its worst branch.'
  - term: 'Query planner'
    definition: 'The part of the engine that decides how to answer a declarative statement: which index to use, in which order to test conditions, whether to sort. Cost-based planning was established by Patricia Selinger and colleagues at IBM in 1979 for System R. The planner may choose differently tomorrow for the identical query, and returning the same rows regardless is the promise that makes that acceptable.'
  - term: 'Write amplification'
    definition: 'The general name for one logical write becoming several physical ones. With indexes it is concrete and measurable: each index is another structure every INSERT, UPDATE and DELETE has to maintain. Measured in this lesson''s lab as 11.7 times slower to insert the same 100,000 rows with five indexes, and a file 2.4 times larger.'
  - term: 'Zone map'
    definition: 'A summary of the minimum and maximum values in a block of rows, kept by columnar engines such as DuckDB. It lets a query skip whole blocks without any index at all: if a block''s dates run from January to March and the query asks for June, the block is never read. It is why the answer to "which index should I create" in an analytical engine is often "none".'
  - term: 'Vector index'
    definition: 'A structure for finding the nearest points to a query point in a high-dimensional space, used for similarity search over embeddings. Most are approximate — they trade a small chance of missing a true nearest neighbour for a large reduction in work, a trade a B-tree never makes. What carries over from this lesson is that a real retrieval query is a similarity search plus a filter on tenant, permission or date, and that filter is an ordinary WHERE clause wanting an ordinary index.'
