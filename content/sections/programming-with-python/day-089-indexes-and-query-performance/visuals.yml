visuals:
  - id: index-btree-architecture
    file: assets/index-btree-architecture.svg
    type: diagram
    title: 'What an index actually is: a second sorted tree, plus a pointer home'
    alt: 'Diagram: the architecture of an index — the table''s own B-tree of pages holding whole rows beside an index B-tree holding sorted key values and the rowids that point back into the table, and beneath them a covering index whose entries carry the answer so the trip back is never made'
    description: 'A static architecture diagram in three parts, read left to right and then down. On the left, inside a dashed group, the events table is drawn as a B-tree of fixed-size pages keyed by rowid: a root page splitting on rowid below and above two hundred thousand, and two leaf pages holding whole rows with every column, annotated that the table is 400,000 rows in 7,392 pages and that a scan reads all of them in order. On the right, a matching group shows the index ix_run as a second B-tree keyed by run_id, with its own root page splitting on run_id and two leaf pages whose entries hold only a run_id and a rowid, sorted by run_id and then by rowid, annotated that the same 400,000 keys occupy 1,070 pages and that the entries carry no title, status or score — just the key. Two dashed blue arrows curve from index leaf entries back into the table leaf pages, labelled that the rowid is the way back. Across the bottom, a third group shows the covering case: an index on run_id and score whose leaf entries carry the score as well, the query SELECT score FROM events WHERE run_id equals one printed beside it, the plan line SEARCH events USING COVERING INDEX ix_run_score, and the arrow to the table drawn crossed out in red and marked not needed with the table box labelled never opened. A footer does the arithmetic that makes the whole idea work: with roughly a hundred entries per page, one page holds a hundred keys, two levels hold ten thousand and three hold a million, so a seek reads one page per level while a scan reads every page of the table. The footer closes with the measured costs on this data — the index on run_id added 1,070 pages or fourteen per cent of the table, a partial index over the 9.9 per cent of failed rows cost 186 pages against 1,857 for the full one, and five indexes made inserts about twelve times slower.'
  - id: query-plan-flow
    file: assets/query-plan-flow.svg
    type: flow-animated
    title: 'The same query, two plans: how much of the table has to light up'
    alt: 'Flowchart: the same query answered twice — above, a scan lighting up page after page and testing every row of the table; below, a seek descending three levels of an index straight to the matching rows while the pages either side are never read'
    description: 'An animated flow diagram in two halves, fully readable as a still picture. The statement under test is printed at the top: SELECT event_id, model, score FROM events WHERE run_id equals two hundred, over 400,000 rows of which 100 match. The upper half is labelled with no index on run_id and carries the plan line SCAN events. Twelve page boxes stand for the table''s 7,392 pages, labelled page 1, page 4, page 7, page 10 and page 7,392, and each lights up in turn from left to right while a token travels across the row above them; the caption records 7,392 pages read, 400,000 rows tested, 100 returned, at a best of 8.41 milliseconds of seven runs, and notes that twice the rows means twice the pages and twice the wait for ever. The lower half is labelled after CREATE INDEX ix_events_run and carries the plan line SEARCH events USING INDEX ix_events_run. A three-level B-tree is drawn: a root page asking whether run_id is below two thousand, one interior page covering run_id 128 to 384, and one leaf page holding run 200 and its rowids, with marching-dash wires connecting them. Four sibling pages beside the path are drawn plain and labelled never read. A second token descends the path level by level as each of the three pages lights up in turn. A green result box records 3 page reads, 100 rows found, 100 returned, a best of 0.027 milliseconds of seven runs, 309 times faster than the scan above on this machine, and notes that four times the rows would add nothing because the depth grows with the logarithm of the row count. A footer states that both halves return the identical 100 rows and only the work changed, which is why an index is always safe to add or drop; describes the resting state explicitly as every page drawn, both tokens at their starting positions and all plan lines and numbers present; confirms that with reduced motion requested the animation stops and that resting state is the whole diagram; and warns that the milliseconds are one machine on one day while the shape is what generalises. The file carries a prefers-reduced-motion media query that disables every animation and restores the resting appearance.'
