slug: indexes-and-query-performance
title: 'Indexes and Query Performance'
section: programming-with-python
subsection: data-and-databases
week: 13
learning_promise: 'After this lesson you will be able to say precisely why a query that was instant on fifty rows takes far longer on four hundred thousand, and fix it with evidence rather than folklore: an index defined exactly — a second, sorted copy of some columns kept in a B-tree, with a rowid pointing back to the row; why a B-tree''s depth grows so slowly that a million rows is a handful of page reads; how to read EXPLAIN QUERY PLAN and why SCAN naming your index is still a scan; the leftmost-prefix rule proved query by query rather than quoted; covering indexes, indexes that remove a sort, and partial indexes measured in pages; the four common reasons a present index goes unused and the rewrite or expression index that fixes each; selectivity, cardinality, ANALYZE and sqlite_stat1; the write cost measured rather than asserted; how PostgreSQL, MySQL, DuckDB and vector indexes answer the same question differently; and how to write tests around a measurement that assert shape and direction rather than a millisecond figure that would be flaky on anybody else''s machine.'
objectives:
  - 'Define an index precisely — a second, sorted copy of one or more columns with a pointer back to the row — and derive from that one sentence why it makes reads faster, writes slower, and costs disk'
  - 'Measure the difference between a scan and a seek at four table sizes and name the two shapes the numbers make: a cost that grows with the table and one that grows with its logarithm'
  - 'Explain the B-tree, its fan-out, and why a hundredfold increase in rows adds a single page read to a seek while adding a hundredfold to a scan'
  - 'Read EXPLAIN QUERY PLAN correctly, including the trap that SCAN naming a covering index is still a walk over every entry and only SEARCH is a descent'
  - 'Prove the leftmost-prefix rule query by query with one index on two columns, and explain why the order of conditions in WHERE is irrelevant while the order of columns in the index decides everything'
  - 'Build a covering index and recognise the plan in which the table is never opened, and give a reason to add a column to an index you never filter on'
  - 'Remove a sort by giving ORDER BY an index that already supplies the order, and recognise USE TEMP B-TREE FOR ORDER BY as the line that means everything was sorted'
  - 'Build a partial index, measure how much smaller it is, and identify the query the planner will refuse to use it for'
  - 'Diagnose the four common reasons a present index goes unused — a function or expression on the column, a leading wildcard, an OR with one unindexed branch, and a column too unselective to be worth seeking — and apply the fix where one exists'
  - 'Explain selectivity and cardinality, run ANALYZE, read sqlite_stat1, and say honestly what statistics did and did not change on a given data set'
  - 'Measure the write cost and disk cost of indexes rather than asserting them, and state the trade in numbers you produced on your own machine'
  - 'Implement a linear scan and a binary search over the same data in plain Python, count the steps as well as timing them, and show that sorting changed the work and never the answer'
  - 'Write tests around a measurement that assert shape and direction rather than a duration, and explain why a test that pins a millisecond figure measures the computer instead of the code'
  - 'Choose between SQLite''s single B-tree index, PostgreSQL''s several index types with EXPLAIN ANALYZE, MySQL''s clustered primary key, DuckDB''s columnar zone maps and a vector index, on the question each one is actually built to answer'
prerequisites:
  - 'Day 85: SQLite''s architecture, the B-tree layer and the pager, and the one EXPLAIN QUERY PLAN output that lesson previewed and promised to explain'
  - 'Day 86: SELECT with WHERE, ORDER BY, GROUP BY and LIMIT. Every query measured today is one you can already write'
  - 'Day 87: keys, relationships and joins — a foreign key column is the most reliably worthwhile index there is'
  - 'Day 88: INSERT, UPDATE, DELETE and transactions. The write cost measured today is the cost of those statements'
  - 'Enough Python to read a loop, a function and a context manager. No third-party package, no account, no installation'
