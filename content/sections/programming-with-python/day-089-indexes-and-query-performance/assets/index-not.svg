<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things an index is not</title>
  <style>
    .index-not-bg   { fill: #f8fafc; }
    .index-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-not-row { opacity: 1; }
    .index-not-r0 { animation-delay: 0.00s; }
    .index-not-r1 { animation-delay: 0.45s; }
    .index-not-r2 { animation-delay: 0.90s; }
    .index-not-r3 { animation-delay: 1.35s; }
    .index-not-r4 { animation-delay: 1.80s; }
    .index-not-row { animation: index-not-reveal 7.3s ease-in-out infinite; }
    @keyframes index-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="index-not-bg" width="980" height="390"/>
  <text class="index-not-h1"  x="30" y="40">Four things an index is not</text>
  <text class="index-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="index-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="index-not-name" x="46" y="122">The misconception</text>
  <text class="index-not-desc" x="46" y="142">Commonly held.</text>
  <text class="index-not-desc index-not-row index-not-r0" x="46" y="182">More indexes means faster</text>
  <text class="index-not-desc index-not-row index-not-r1" x="46" y="216">An index always gets used</text>
  <text class="index-not-desc index-not-row index-not-r2" x="46" y="250">Column order does not matter</text>
  <text class="index-not-desc index-not-row index-not-r3" x="46" y="284">Indexes help every query</text>
  <text class="index-not-desc index-not-row index-not-r4" x="46" y="318">They are free once created</text>
  <rect class="index-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="index-not-name" x="526" y="122">What is true</text>
  <text class="index-not-desc" x="526" y="142">Actually.</text>
  <text class="index-not-desc index-not-row index-not-r0" x="526" y="182">Each one slows every write</text>
  <text class="index-not-desc index-not-row index-not-r1" x="526" y="216">The optimiser may scan instead</text>
  <text class="index-not-desc index-not-row index-not-r2" x="526" y="250">A composite index is used left to right</text>
  <text class="index-not-desc index-not-row index-not-r3" x="526" y="284">Low-selectivity filters may scan anyway</text>
  <text class="index-not-desc index-not-row index-not-r4" x="526" y="318">They cost storage and write time forever</text>
  <text class="index-not-sub" x="30" y="372">The left-to-right rule is the one that surprises people: an index on two columns helps a filter on the first, and usually not one on the second alone.</text>
</svg>
