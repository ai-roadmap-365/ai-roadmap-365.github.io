<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Or reading every page.">
  <title>An index in a book</title>
  <style>
    .book-index-bg   { fill: #f8fafc; }
    .book-index-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .book-index-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .book-index-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .book-index-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .book-index-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .book-index-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .book-index-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .book-index-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .book-index-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .book-index-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .book-index-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .book-index-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .book-index-row { opacity: 1; }
    .book-index-r0 { animation-delay: 0.00s; }
    .book-index-r1 { animation-delay: 0.45s; }
    .book-index-r2 { animation-delay: 0.90s; }
    .book-index-r3 { animation-delay: 1.35s; }
    .book-index-r4 { animation-delay: 1.80s; }
    .book-index-row { animation: book-index-reveal 7.3s ease-in-out infinite; }
    @keyframes book-index-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="book-index-bg" width="980" height="390"/>
  <text class="book-index-h1"  x="30" y="40">An index in a book</text>
  <text class="book-index-sub" x="30" y="64">Or reading every page.</text>
  <rect class="book-index-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="book-index-name" x="46" y="122">Consult the index</text>
  <text class="book-index-desc" x="46" y="142">Seconds.</text>
  <text class="book-index-desc book-index-row book-index-r0" x="46" y="182">Look up the term</text>
  <text class="book-index-desc book-index-row book-index-r1" x="46" y="216">Turn to the listed pages</text>
  <text class="book-index-desc book-index-row book-index-r2" x="46" y="250">Time barely grows with book length</text>
  <text class="book-index-desc book-index-row book-index-r3" x="46" y="284">But the index took work to build</text>
  <text class="book-index-desc book-index-row book-index-r4" x="46" y="318">This is an indexed lookup</text>
  <rect class="book-index-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="book-index-name" x="526" y="122">Read every page</text>
  <text class="book-index-desc" x="526" y="142">Hours.</text>
  <text class="book-index-desc book-index-row book-index-r0" x="526" y="182">Start at page one</text>
  <text class="book-index-desc book-index-row book-index-r1" x="526" y="216">Check each page</text>
  <text class="book-index-desc book-index-row book-index-r2" x="526" y="250">Time grows with book length</text>
  <text class="book-index-desc book-index-row book-index-r3" x="526" y="284">But nothing had to be prepared</text>
  <text class="book-index-desc book-index-row book-index-r4" x="526" y="318">This is a full scan</text>
  <text class="book-index-sub" x="30" y="372">The index also has to be reprinted whenever the book changes, which is exactly the write cost a database index imposes on every insert.</text>
</svg>
