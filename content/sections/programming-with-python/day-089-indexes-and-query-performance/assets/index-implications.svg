<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are cost.">
  <title>Four consequences of indexing</title>
  <style>
    .index-implications-bg   { fill: #f8fafc; }
    .index-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .index-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .index-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .index-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .index-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .index-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .index-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .index-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .index-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .index-implications-stage { opacity: 1; }

    .index-implications-s0 { animation-delay: 0.00s; }
    .index-implications-e0 { animation-delay: 0.00s; }
    .index-implications-s1 { animation-delay: 1.28s; }
    .index-implications-e1 { animation-delay: 1.28s; }
    .index-implications-s2 { animation-delay: 2.56s; }
    .index-implications-e2 { animation-delay: 2.56s; }
    .index-implications-s3 { animation-delay: 3.84s; }
    .index-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .index-implications-conn  { animation: index-implications-trace 6.4s ease-in-out infinite; }
      .index-implications-stage { animation: index-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes index-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes index-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .index-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .index-implications-stage { animation: index-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes index-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="index-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="index-implications-bg" width="980" height="322"/>
  <text class="index-implications-h1"  x="30" y="40">Four consequences of indexing</text>
  <text class="index-implications-sub" x="30" y="64">Two are cost.</text>
  <g class="index-implications-stage index-implications-s0">
    <rect class="index-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="index-implications-step" x="44" y="142">01</text>
    <text class="index-implications-name" x="70" y="142">Reads on indexed columns get dramatically faster</text>
    <text class="index-implications-desc" x="44" y="166">Often by orders of magnitude.</text>
  </g>
  <line class="index-implications-line index-implications-conn index-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#index-implications-tip)"/>
  <g class="index-implications-stage index-implications-s1">
    <rect class="index-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="index-implications-step" x="280" y="142">02</text>
    <text class="index-implications-name" x="306" y="142">But every write must update every index</text>
    <text class="index-implications-desc" x="280" y="166">Which slows inserts.</text>
  </g>
  <line class="index-implications-line index-implications-conn index-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#index-implications-tip)"/>
  <g class="index-implications-stage index-implications-s2">
    <rect class="index-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="index-implications-step" x="516" y="142">03</text>
    <text class="index-implications-name" x="542" y="142">And indexes consume real storage</text>
    <text class="index-implications-desc" x="516" y="166">Sometimes more than the table.</text>
  </g>
  <line class="index-implications-line index-implications-conn index-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#index-implications-tip)"/>
  <g class="index-implications-stage index-implications-s3">
    <rect class="index-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="index-implications-step" x="752" y="142">04</text>
    <text class="index-implications-name" x="778" y="142">While plans change as statistics change</text>
    <text class="index-implications-desc" x="752" y="166">So performance can shift without</text>
    <text class="index-implications-desc" x="752" y="182">a code change.</text>
  </g>
  <text class="index-implications-sub" x="30" y="304">Performance shifting without a code change is the operational surprise: a query that was instant for a year becomes slow when the data crosses a threshold.</text>
</svg>
