terms:
  - term: 'Scheduler'
    definition: 'A component whose only job is to start a program at a specified time or interval. It does not know what your program is for, whether it succeeded, or whether it did the same work twice. Everything beyond "start this now" belongs to you.'
  - term: 'cron'
    definition: 'The POSIX-standard Unix scheduling service, named from the Greek chronos (time). It reads a table of five-field schedules and runs commands. The implementation most Linux systems descend from is Paul Vixie''s, first released in 1987. Ubiquitous and reliable, with no catch-up, no dependency handling, no built-in logging and no overlap protection.'
  - term: 'Cron expression'
    definition: 'Five whitespace-separated fields — minute, hour, day-of-month, month, day-of-week — each of which may be *, a number, a comma-separated list, an a-b range, or a step written */n. Day-of-week runs 0 to 6 with Sunday as 0, and 7 also means Sunday. When both day fields are restricted, cron ORs them rather than ANDing them.'
  - term: 'launchd'
    definition: 'Apple''s single system for launching and supervising processes, introduced in Mac OS X 10.4 (Tiger, 2005), replacing init, startup items, inetd, cron and at. A job is described by a property list whose ProgramArguments key is argv rather than a shell command line, and it runs a job whose scheduled moment passed while the Mac was asleep.'
  - term: 'systemd timer'
    definition: 'A Linux .timer unit that activates a .service unit at a time given by OnCalendar. Splitting when from what buys journal logging, catch-up with Persistent=true, dependency ordering with After=, an enforced TimeoutStartSec, free overlap protection, and the ability to run the job by hand exactly as the timer would.'
  - term: 'Idempotence'
    definition: 'The property that running something twice has the same effect as running it once. The most important property a scheduled job can have, because every other mechanism in this area — retries, catch-up runs, an operator repeating a command, a daylight-saving repeat — eventually causes a second run.'
  - term: 'Idempotency key'
    definition: 'A stable identifier for a unit of work, sent with a request so that the receiving system can ignore a repeat. The standard answer for work that is naturally once-only, such as sending an email or charging a card; payment APIs support it precisely because retries are unavoidable.'
  - term: 'Atomic write'
    definition: 'Writing output to a temporary name in the same directory and then renaming it into place with os.replace, which is atomic on POSIX. Without it a crash mid-write leaves a truncated file under the real name, which the next run mistakes for a finished result. Same directory matters: the rename is only atomic within one filesystem.'
  - term: 'Catch-up'
    definition: 'Running a job whose scheduled moment passed while the machine was unavailable. systemd offers it with Persistent=true and launchd does it on wake; cron has no equivalent and never mentions the missed run. Whether catch-up is correct depends on whether each period''s work is a distinct artefact or merely the latest state.'
  - term: 'Backfill'
    definition: 'Deliberately running a job for a range of past periods. Only possible if the job takes its period as a parameter rather than computing "yesterday" internally — which is the injected-clock argument again, and a thing you discover on the morning you need it most.'
  - term: 'Overlapping run'
    definition: 'A second copy of a job started by the scheduler while the first is still working, which happens the first time a job takes longer than its interval. Two copies reading and writing the same data is how a scheduled job corrupts its own output. Neither cron nor launchd prevents it by default.'
  - term: 'Lock file'
    definition: 'A file used to ensure only one copy of a job runs at a time. Done properly with fcntl.flock and LOCK_NB, which is atomic to acquire and is released by the kernel when the process exits however it exits. Done naively as "if the file exists, exit", it has a race between check and create and leaves a stale file that blocks every future run.'
  - term: 'Drift'
    definition: 'The accumulating lateness of a loop that sleeps for a fixed duration after doing work, because the interval is measured from when the work finished rather than from when it should have started. Five seconds of work in a sixty-second loop is really a sixty-five-second schedule, and run 100 is 495 seconds late.'
  - term: 'Timeout'
    definition: 'A wall-clock budget after which a job is interrupted. In process, signal.setitimer with SIGALRM — POSIX-only, main thread only, and unable to interrupt a call blocked inside a C library. Around a child process, subprocess with start_new_session and os.killpg, escalating SIGTERM to SIGKILL. Without one, a hang holds the lock and silently stops every later run.'
  - term: 'Exit code'
    definition: 'The number a program returns, and the only thing the scheduler sees. Conventions worth reusing: 0 success, 1 an exception, 75 (EX_TEMPFAIL, from BSD sysexits.h) "already running, try later", and 124 (as GNU timeout uses) "killed for overrunning". An idempotent no-op exits 0, because a skipped run is a success.'
  - term: 'Watchdog'
    definition: 'A separate check, on its own schedule and in its own process, that asks whether the thing that should have happened has happened. It must be separate, because a watchdog inside the job it watches cannot report that the job never started.'
  - term: 'Dead man''s switch'
    definition: 'A mechanism that acts when a signal stops arriving rather than when a bad signal arrives — named from the railway handle that applies the brakes when the driver lets go. Applied to scheduled jobs: each success writes a heartbeat, and an alert fires when the heartbeat gets too old. The only mechanism that detects a job which stopped running, because that failure produces no error at all.'
  - term: 'Heartbeat'
    definition: 'The record a successful run leaves behind — a file, a database row, a ping to a service — carrying the time of the last success. The staleness budget for it is usually about two intervals plus the job''s normal runtime: tight enough to notice, loose enough to tolerate exactly one missed run.'
  - term: 'Time zone'
    definition: 'A named set of rules mapping instants to local wall-clock times, recorded in the IANA time zone database and reachable from Python through zoneinfo. A fixed offset is not a time zone: it is wrong for half the year in any zone that observes daylight saving.'
  - term: 'Daylight saving'
    definition: 'The twice-yearly clock change that makes some local wall-clock times not exist and others happen twice. A daily local schedule therefore has one 23-hour day and one 25-hour day per year, and a job scheduled during the repeated hour runs twice. Scheduling in UTC removes the problem entirely; converting to local time for display keeps the human benefit.'
  - term: 'Structured logging'
    definition: 'Writing one machine-readable object per event — here one JSON object per line — rather than free-form prose. One line per event is what makes a log processable with grep and json.loads together; a multi-line traceback in the middle of the stream is not. Include a run id, a status, a duration, an exit code and enough domain context to answer "what did it do?" months later.'
