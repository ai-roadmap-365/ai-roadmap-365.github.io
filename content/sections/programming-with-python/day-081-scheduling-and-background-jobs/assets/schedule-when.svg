<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the requirements.">
  <title>Which scheduling approach when</title>
  <style>
    .schedule-when-bg   { fill: #f8fafc; }
    .schedule-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-when-row { opacity: 1; }
    .schedule-when-r0 { animation-delay: 0.00s; }
    .schedule-when-r1 { animation-delay: 0.45s; }
    .schedule-when-r2 { animation-delay: 0.90s; }
    .schedule-when-r3 { animation-delay: 1.35s; }
    .schedule-when-r4 { animation-delay: 1.80s; }
    .schedule-when-row { animation: schedule-when-reveal 7.3s ease-in-out infinite; }
    @keyframes schedule-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="schedule-when-bg" width="980" height="390"/>
  <text class="schedule-when-h1"  x="30" y="40">Which scheduling approach when</text>
  <text class="schedule-when-sub" x="30" y="64">By the requirements.</text>
  <rect class="schedule-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-when-name" x="46" y="122">The requirement</text>
  <text class="schedule-when-desc" x="46" y="142">What you need.</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r0" x="46" y="182">A simple periodic task on one machine</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r1" x="46" y="216">Dependencies between several jobs</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r2" x="46" y="250">Retries and backfilling missed runs</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r3" x="46" y="284">Work triggered by an event, not a clock</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r4" x="46" y="318">Anything business-critical</text>
  <rect class="schedule-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="schedule-when-name" x="526" y="122">The approach</text>
  <text class="schedule-when-desc" x="526" y="142">What to use.</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r0" x="526" y="182">The system scheduler, plus a lock and a heartbeat</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r1" x="526" y="216">An orchestrator</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r2" x="526" y="250">An orchestrator with backfill support</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r3" x="526" y="284">A queue and a worker</text>
  <text class="schedule-when-desc schedule-when-row schedule-when-r4" x="526" y="318">A managed platform with alerting</text>
  <text class="schedule-when-sub" x="30" y="372">The event-driven row is worth considering before reaching for a schedule at all, since polling on a timer is often a workaround for a missing trigger.</text>
</svg>
