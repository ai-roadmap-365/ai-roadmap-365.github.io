<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward observability.">
  <title>Four steps in scheduled execution</title>
  <style>
    .schedule-history-bg   { fill: #f8fafc; }
    .schedule-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-history-stage { opacity: 1; }

    .schedule-history-s0 { animation-delay: 0.00s; }
    .schedule-history-e0 { animation-delay: 0.00s; }
    .schedule-history-s1 { animation-delay: 1.28s; }
    .schedule-history-e1 { animation-delay: 1.28s; }
    .schedule-history-s2 { animation-delay: 2.56s; }
    .schedule-history-e2 { animation-delay: 2.56s; }
    .schedule-history-s3 { animation-delay: 3.84s; }
    .schedule-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-history-conn  { animation: schedule-history-trace 6.4s ease-in-out infinite; }
      .schedule-history-stage { animation: schedule-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedule-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-history-stage { animation: schedule-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-history-bg" width="980" height="322"/>
  <text class="schedule-history-h1"  x="30" y="40">Four steps in scheduled execution</text>
  <text class="schedule-history-sub" x="30" y="64">Toward observability.</text>
  <g class="schedule-history-stage schedule-history-s0">
    <rect class="schedule-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-history-step" x="44" y="142">01</text>
    <text class="schedule-history-name" x="70" y="142">A simple time-based scheduler</text>
    <text class="schedule-history-desc" x="44" y="166">Reliable, and silent about</text>
    <text class="schedule-history-desc" x="44" y="182">failure.</text>
  </g>
  <line class="schedule-history-line schedule-history-conn schedule-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedule-history-tip)"/>
  <g class="schedule-history-stage schedule-history-s1">
    <rect class="schedule-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-history-step" x="280" y="142">02</text>
    <text class="schedule-history-name" x="306" y="142">Then service managers with logging and dependencies</text>
    <text class="schedule-history-desc" x="280" y="166">Which made failures visible.</text>
  </g>
  <line class="schedule-history-line schedule-history-conn schedule-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedule-history-tip)"/>
  <g class="schedule-history-stage schedule-history-s2">
    <rect class="schedule-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-history-step" x="516" y="142">03</text>
    <text class="schedule-history-name" x="542" y="142">Then orchestrators with retries and backfills</text>
    <text class="schedule-history-desc" x="516" y="166">Which handled dependencies</text>
    <text class="schedule-history-desc" x="516" y="182">between jobs.</text>
  </g>
  <line class="schedule-history-line schedule-history-conn schedule-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedule-history-tip)"/>
  <g class="schedule-history-stage schedule-history-s3">
    <rect class="schedule-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-history-step" x="752" y="142">04</text>
    <text class="schedule-history-name" x="778" y="142">And managed platforms with alerting built in</text>
    <text class="schedule-history-desc" x="752" y="166">Where the heartbeat is not</text>
    <text class="schedule-history-desc" x="752" y="182">optional.</text>
  </g>
  <text class="schedule-history-sub" x="30" y="304">Each step added visibility rather than capability, which reflects where the real difficulty in scheduled work has always been.</text>
</svg>
