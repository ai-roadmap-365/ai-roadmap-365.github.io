questions:
  - question: 'A loop calls `work()` (which takes 5 seconds) and then `time.sleep(60)`. How far behind the intended once-a-minute schedule is the hundredth run?'
    options:
      - 'Not at all — the sleep is exactly 60 seconds'
      - 'About 5 seconds, because only the first run is delayed'
      - '495 seconds, because the work duration is added to every interval and accumulates'
      - 'It cannot be predicted; drift is random'
    answer_index: 2
    explanation: 'The interval is measured from when the work *finished*, so the gap between starts is 65 seconds, not 60 — and nobody wrote 65 anywhere. The error is 5 seconds per run and it accumulates without limit: run 100 begins 99 × 5 = 495 seconds late. The fix is to sleep until the next deadline rather than for a fixed span: track `next_due += 60` and sleep `max(0, next_due - time.monotonic())`. Use `monotonic`, not `time.time()`, because the wall clock can jump.'

  - question: 'What does the cron expression `0 0 13 * 5` actually match?'
    options:
      - 'Friday the 13th only'
      - 'The 13th of any month, OR any Friday — because cron ORs the two day fields when both are restricted'
      - 'The 13th of any month, AND only if it is a Friday'
      - 'It is invalid, because you cannot restrict both day fields'
    answer_index: 1
    explanation: 'This is the classic trap. When BOTH day-of-month and day-of-week are restricted, cron treats them as OR, not AND — so this fires on the 13th of every month and on every Friday, about thirty-seven times more often than "Friday the 13th" — roughly sixty-two firings a year against 1.7. If only one of the two fields is restricted, the fields are ANDed as you would expect: `0 0 * * 5` really is just Fridays. To get Friday the 13th you have to test the day inside the job.'

  - question: 'Your command works perfectly in your terminal and fails silently under cron. What is the most likely cause?'
    options:
      - 'cron cannot run Python programs without a wrapper script'
      - 'The crontab syntax is wrong, so the job never fired'
      - 'cron gives the job a minimal environment: a short PATH, no shell profile, and your home directory as the working directory'
      - 'cron runs the job as a different user'
    answer_index: 2
    explanation: 'cron runs the job as you, and gives it almost nothing of yours. It does not source `.bashrc` or `.zshrc`, so anything you exported there is gone; `PATH` is short, so a Homebrew or virtual-environment binary is not found; and the working directory is your home directory, so relative paths resolve somewhere unexpected. The fixes are absolute paths, an explicit `cd`, and `PATH`, `SHELL` and `TZ` set at the top of the crontab. To reproduce the failure interactively, run the command under `env -i /bin/sh -c ...`, which clears the environment completely.'

  - question: 'Why is `if lock_file.exists(): sys.exit(75)` not a substitute for `fcntl.flock` with `LOCK_NB`?'
    options:
      - 'It is equivalent; flock is just shorter'
      - 'It has a race between the check and the create, and a killed process leaves a file that blocks every future run'
      - 'It only works on Linux'
      - 'It cannot report which process holds the lock'
    answer_index: 1
    explanation: 'Two separate bugs. First, a second process can pass the same `exists()` check in the window before the first one creates the file — a race that is hard to trigger deliberately and therefore reaches production. Second, if the process is killed with SIGKILL or the machine loses power, the file remains and every future run exits immediately, for ever; you have replaced "runs twice" with "never runs again", which is worse because it is silent. `flock` is atomic to acquire, and the kernel releases it when the process exits however it exits.'

  - question: 'A daily job is scheduled at 01:30 local time in a zone with daylight saving. What happens on the morning the clocks go back — and why is that worse than the spring case?'
    options:
      - 'It is skipped, which is worse because the data has a visible gap'
      - 'It runs twice, which is worse because a doubled result looks like data rather than like a fault'
      - 'It runs at 02:30 instead, which is worse because the offset is wrong'
      - 'Nothing changes; the scheduler corrects for it'
    answer_index: 1
    explanation: '01:30 happens twice on the fall-back morning — once as daylight time and again an hour later as standard time — so the job runs twice. That is more dangerous than the spring case, where 02:30 does not exist and a run is skipped, because a missing run leaves a visible gap while a doubled run leaves a doubled total that looks like an ordinary number. A local daily schedule also has a 23-hour day and a 25-hour day, which breaks anything downstream assuming 24 hours. The answer is to schedule in UTC and convert only for display.'

  - question: 'Your job finds that today''s work has already been done and exits without doing anything. What exit code should it use?'
    options:
      - '0 — an idempotent no-op is a success'
      - '75, to distinguish it from real work'
      - '1, so somebody investigates'
      - '124, because nothing ran'
    answer_index: 0
    explanation: '0. A skipped run is a success: the desired state has been reached, which is exactly what you asked for. Using a non-zero code would generate an alert on a perfectly healthy outcome, and alerts that fire on healthy outcomes train people to ignore the channel — which is the most expensive damage you can do to a monitoring system. 75 (`EX_TEMPFAIL`) is reserved here for "another copy holds the lock" and 124 for "the timeout killed it", both of which are genuinely different situations.'

  - question: 'Somebody edits the crontab and accidentally deletes your job''s line. Which monitoring signal tells you?'
    options:
      - 'The failure alert, because a missing job counts as a failure'
      - 'The non-zero exit code from the next run'
      - 'The scheduler logs a warning when a job disappears'
      - 'None of the usual ones — the job produces no error because it produces nothing; only a check on the absence of a success will catch it'
    answer_index: 3
    explanation: 'This is the central point of the lesson. A job that stops running does not fail: there is no run, no exception, no non-zero exit, and no log line. Every alert that watches for failure signals stays quiet, and the system looks healthy. The only mechanism that catches it is a dead man''s switch: each success records when it succeeded, and a separate check on its own schedule alerts when that record is older than a budget of roughly two intervals. The same failure shape covers a rebuilt machine whose timer was not re-enabled, and a hung run that holds the lock so every later run exits 75.'

  - question: 'Which pair of systemd timer features has no cron equivalent at all?'
    options:
      - 'Minute-level scheduling and day-of-week fields'
      - 'Running as a specific user and redirecting output to a file'
      - '`Persistent=true` for catch-up after downtime, and automatic journal logging with `journalctl`'
      - 'Absolute paths and environment variables'
    answer_index: 2
    explanation: '`Persistent=true` runs the job once as soon as the machine comes back if the scheduled moment passed while it was off — cron simply never runs a missed job and never mentions it. And a systemd service''s output goes to the journal automatically, tagged and queryable, whereas cron either mails the output (usually nowhere on a modern machine) or discards it unless you redirect it yourself. Two more systemd advantages worth knowing: `After=` for dependency ordering, and free overlap protection, because a `oneshot` unit that is already active will not be started again.'
