title: 'Scheduling and Background Jobs'
section: programming-with-python
subsection: python-in-practice
week: 12
learning_promise: 'After this lesson you will be able to choose between an in-process loop, an in-process scheduler, an operating-system scheduler and an external queue by asking what each one survives; read and write cron, launchd and systemd timer schedules including the day-of-month and day-of-week rule that catches everybody; anticipate the minimal environment a scheduled job actually gets; and — the real point — build the five properties that decide whether a job can be trusted while nobody is watching: idempotence, a non-blocking lock, a time budget, a structured log with meaningful exit codes, and an alert on silence rather than only on failure. Because the clock arrives as a parameter, every one of those is testable in milliseconds instead of overnight.'
objectives:
  - 'Explain why a time.sleep loop drifts by the work duration every run, measure the accumulated lateness exactly, and fix it by sleeping to a deadline against a monotonic clock rather than for a fixed span'
  - 'Drive sched.scheduler with an injected time source and delay function so a six-hour schedule runs in microseconds, and state precisely when an in-process scheduler is legitimate and when it is a single point of failure nobody is watching'
  - 'Read and write five-field cron expressions including lists, ranges and steps, convert between cron and Python weekday numbering, and apply the rule that cron ORs the day-of-month and day-of-week fields when both are restricted'
  - 'List what a cron job does not inherit — the PATH, the shell profile, the working directory, the virtual environment, the terminal — write the crontab lines that compensate, and reproduce cron''s environment for debugging with env -i'
  - 'Read a launchd plist and a systemd .service and .timer pair field by field, and name the specific things systemd timers provide that cron does not: journal logging, catch-up with Persistent, dependency ordering, an enforced timeout, and overlap protection'
  - 'Make a job idempotent with a key derived from the unit of work, a completeness check that survives a truncated file, and an atomic write via a same-directory temporary file and os.replace — then prove two runs leave exactly one result'
  - 'Prevent overlapping runs with fcntl.flock and LOCK_NB, explain both bugs in the naive "if the lock file exists, exit" version, and justify failing fast rather than queueing'
  - 'Bound a job with signal.setitimer and SIGALRM, state that mechanism''s three honest limits, and reach for a supervised child process with start_new_session and os.killpg when they matter'
  - 'Choose a catch-up policy — run once on return, backfill every missed period, or skip — by asking whether each period''s work is a distinct artefact, and design the job so backfill is possible at all'
  - 'Schedule in UTC, and demonstrate from the operating system''s own time zone database why a local schedule has a 23-hour day and a 25-hour day, a wall-clock time that never happens, and one that happens twice'
  - 'Log one structured JSON line per run with a run id, status, duration and exit code, choose exit codes that already mean something (0, 1, 75 from sysexits, 124 from GNU timeout), and explain why an idempotent no-op must exit 0'
  - 'Build a dead man''s switch that alerts on the absence of a success rather than the presence of a failure, choose a staleness budget of roughly two intervals, and explain why the watchdog must be a separate process on its own schedule'
prerequisites:
  - 'Day 74: the clock as an injected boundary — the single idea that makes every schedule, staleness and daylight-saving question in this lesson testable in milliseconds'
  - 'Day 80: argparse, subcommands, and exit codes as a public interface'
  - 'Days 64 to 66: reading and writing files, JSON and CSV, and a deliberate exception strategy'
  - 'Day 69: dataclasses and type hints, used on every value in the lab'
  - 'Days 71 to 73: pytest, fixtures, parametrization, and reading a failure report'
  - 'Day 60: the standard library tour, where sched, signal and subprocess first appeared'
  - 'Day 43: creating a virtual environment with python3 -m venv'
