visuals:
  - id: scheduling-architecture
    file: assets/scheduling-architecture.svg
    type: diagram
    title: 'Where a scheduled job can live — and what each layer survives'
    alt: 'Diagram: the four layers that can make something happen later — an in-process sleep loop, an in-process scheduler, the operating system''s scheduler, and an external queue or managed scheduler — each labelled with what it survives and what it does not, beside the five operational concerns that apply at every layer: idempotence, locking, timeout, logging with exit codes, and alerting on silence'
    description: 'An architecture diagram in two columns. The left column stacks four layer boxes joined by downward arrows, under the note that moving down the stack buys survival and costs simplicity. Layer one is the in-process sleep loop, "while True: work(); time.sleep(interval)", which survives nothing, drifts by the work duration every run, and dies with the process, the terminal, the deploy and the reboot. Layer two is the in-process scheduler, sched.scheduler with an injected time function and delay function, and threading.Timer, which survives a slow run because it schedules to a deadline but still dies with the process, and is legitimate inside a long-lived service. Layer three, drawn emphasised, is the operating system''s scheduler — cron everywhere, launchd on macOS, systemd timers on Linux — which survives process exit, log-out and reboot, has no catch-up in cron but does with the systemd Persistent setting, dies with the machine, gives the job almost no environment, and carries the note that its single most common bug is a job that works in your terminal and not in cron. Layer four is an external queue or managed scheduler — Celery with a broker, a cloud scheduler, a workflow engine — which survives the machine and brings retries, concurrency limits and history, at the cost of another service to run, monitor, secure and pay for. The right column, headed "every layer needs all five", lists idempotence (twice must equal once, because retries and catch-up runs both mean run it twice), locking (non-blocking flock, because a run longer than the interval overlaps itself), timeout (a hang holds the lock so every later run is skipped in silence), logging and exit codes (one structured line per run, because you will not be watching when it fails), and alerting on silence (a job that stops running raises no error at all). A footer band states that the clock is a boundary at every layer: inject it and the schedule logic, the staleness check and the daylight-saving cases all become tests that run in milliseconds, while reading it from inside the job means the only way to find out what happens on 1 November is to wait until 1 November.'
  - id: scheduled-run-flow
    file: assets/scheduled-run-flow.svg
    type: flowchart
    title: 'One scheduled run, from trigger to exit code — and the watchdog beside it'
    alt: 'Flowchart: one scheduled invocation from trigger to exit code — the scheduler fires, the job takes a non-blocking lock or exits 75, sets up the environment the scheduler did not provide, checks whether the work is already done, runs the work under a time budget, branches to exit 0 with a heartbeat, exit 1, or exit 124, then logs one line and releases the lock, while a separate watchdog process reads the heartbeat on its own schedule and alerts when an expected success never arrives'
    description: 'A six-step vertical flow with one early branch and a three-way outcome, plus a separate watchdog column. Step one: cron, launchd or a systemd timer starts the command. Step two is a decision diamond, "take the lock?", using flock with LOCK_EX and LOCK_NB. The "held" branch leaves to the right and ends in exit 75, already running: no work done, one log line written, no heartbeat, nothing corrupted. The "free" branch continues down to step three, setting up what the scheduler did not give you — PATH, working directory, TZ and configuration — with the warning that skipping this makes the job work in your terminal only. Step four asks whether this unit of work has already been done, and if so records it and exits 0, noting that a no-op is a success rather than something to alert on. Step five, drawn emphasised, does the work under a time budget and writes output atomically, to a temporary name then a rename, so a crash cannot leave a file that looks finished. Three outcomes fan out below it: it finished, exit 0 and write the heartbeat, marked as the only branch that does; it raised, exit 1, no heartbeat, retry only if idempotent; it overran, exit 124, no heartbeat, and the lock is released. All three converge on step six, which logs one line carrying run id, status, duration, exit code and context, releases the lock however the run ended, and exits. To the right, a separate boxed column describes the watchdog: its own schedule and its own process, reading the heartbeat file and asking whether the last success is too old — fresh means exit 0 and say nothing, stale means exit 1 and alert a human, missing means exit 1 because it never ran. The column notes that this is the only check that catches a job which stopped being scheduled at all, because that failure produces no error since it produces nothing. A dashed line runs from the heartbeat write back around to the watchdog, labelled as the only thing connecting them, and a footer states that every clock in the diagram is a parameter, so each branch is a test that runs in milliseconds rather than a morning spent waiting.'
