<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Reproducing it reliably is the first real step.">
  <title>An intermittent bug is not yet fixable</title>
  <style>
    .reproduce-first-bg   { fill: #f8fafc; }
    .reproduce-first-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproduce-first-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproduce-first-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproduce-first-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproduce-first-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reproduce-first-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reproduce-first-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reproduce-first-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reproduce-first-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reproduce-first-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reproduce-first-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reproduce-first-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reproduce-first-row { opacity: 1; }
    .reproduce-first-r0 { animation-delay: 0.00s; }
    .reproduce-first-r1 { animation-delay: 0.45s; }
    .reproduce-first-r2 { animation-delay: 0.90s; }
    .reproduce-first-r3 { animation-delay: 1.35s; }
    .reproduce-first-r4 { animation-delay: 1.80s; }
    .reproduce-first-row { animation: reproduce-first-reveal 7.3s ease-in-out infinite; }
    @keyframes reproduce-first-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reproduce-first-bg" width="980" height="390"/>
  <text class="reproduce-first-h1"  x="30" y="40">An intermittent bug is not yet fixable</text>
  <text class="reproduce-first-sub" x="30" y="64">Reproducing it reliably is the first real step.</text>
  <rect class="reproduce-first-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reproduce-first-name" x="46" y="122">Still intermittent</text>
  <text class="reproduce-first-desc" x="46" y="142">You cannot tell a fix from luck.</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r0" x="46" y="182">It failed once in twenty runs</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r1" x="46" y="216">You change something; it passes</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r2" x="46" y="250">Did you fix it, or get lucky?</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r3" x="46" y="284">No way to know without twenty more runs</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r4" x="46" y="318">And the same doubt after each of them</text>
  <rect class="reproduce-first-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reproduce-first-name" x="526" y="122">Reliably reproduced</text>
  <text class="reproduce-first-desc" x="526" y="142">Now a fix is checkable.</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r0" x="526" y="182">Same input, same seed, same order</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r1" x="526" y="216">Fails every time</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r2" x="526" y="250">A change that makes it pass, fixed it</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r3" x="526" y="284">And a test can hold it fixed</text>
  <text class="reproduce-first-desc reproduce-first-row reproduce-first-r4" x="526" y="318">Worth spending real time on this step</text>
  <text class="reproduce-first-sub" x="30" y="372">Time spent making a bug reproducible feels like time not spent fixing it, and is usually the step that makes the fix quick — as well as the step that lets you write the test that stops it returning.</text>
</svg>
