<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The first one is usually the real cause.">
  <title>Two tracebacks, one problem</title>
  <style>
    .chained-exceptions-bg   { fill: #f8fafc; }
    .chained-exceptions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-exceptions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-exceptions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-exceptions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-exceptions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chained-exceptions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chained-exceptions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chained-exceptions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chained-exceptions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chained-exceptions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chained-exceptions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chained-exceptions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chained-exceptions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chained-exceptions-stage { opacity: 1; }

    .chained-exceptions-s0 { animation-delay: 0.00s; }
    .chained-exceptions-e0 { animation-delay: 0.00s; }
    .chained-exceptions-s1 { animation-delay: 1.28s; }
    .chained-exceptions-e1 { animation-delay: 1.28s; }
    .chained-exceptions-s2 { animation-delay: 2.56s; }
    .chained-exceptions-e2 { animation-delay: 2.56s; }
    .chained-exceptions-s3 { animation-delay: 3.84s; }
    .chained-exceptions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chained-exceptions-conn  { animation: chained-exceptions-trace 6.4s ease-in-out infinite; }
      .chained-exceptions-stage { animation: chained-exceptions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chained-exceptions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chained-exceptions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chained-exceptions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chained-exceptions-stage { animation: chained-exceptions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chained-exceptions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chained-exceptions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chained-exceptions-bg" width="980" height="322"/>
  <text class="chained-exceptions-h1"  x="30" y="40">Two tracebacks, one problem</text>
  <text class="chained-exceptions-sub" x="30" y="64">The first one is usually the real cause.</text>
  <g class="chained-exceptions-stage chained-exceptions-s0">
    <rect class="chained-exceptions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chained-exceptions-step" x="44" y="142">01</text>
    <text class="chained-exceptions-name" x="70" y="142">Something raises</text>
    <text class="chained-exceptions-desc" x="44" y="166">The original failure. This is</text>
    <text class="chained-exceptions-desc" x="44" y="182">usually the real cause.</text>
  </g>
  <line class="chained-exceptions-line chained-exceptions-conn chained-exceptions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chained-exceptions-tip)"/>
  <g class="chained-exceptions-stage chained-exceptions-s1">
    <rect class="chained-exceptions-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chained-exceptions-step" x="280" y="142">02</text>
    <text class="chained-exceptions-name" x="306" y="142">The handler itself fails</text>
    <text class="chained-exceptions-desc" x="280" y="166">Often because it assumed</text>
    <text class="chained-exceptions-desc" x="280" y="182">something the first failure had</text>
    <text class="chained-exceptions-desc" x="280" y="198">already broken.</text>
  </g>
  <line class="chained-exceptions-line chained-exceptions-conn chained-exceptions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chained-exceptions-tip)"/>
  <g class="chained-exceptions-stage chained-exceptions-s2">
    <rect class="chained-exceptions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chained-exceptions-step" x="516" y="142">03</text>
    <text class="chained-exceptions-name" x="542" y="142">Python prints both</text>
    <text class="chained-exceptions-desc" x="516" y="166">"During handling of the above</text>
    <text class="chained-exceptions-desc" x="516" y="182">exception, another occurred."</text>
    <text class="chained-exceptions-edge" x="516" y="242">two blocks</text>
  </g>
  <line class="chained-exceptions-line chained-exceptions-conn chained-exceptions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chained-exceptions-tip)"/>
  <g class="chained-exceptions-stage chained-exceptions-s3">
    <rect class="chained-exceptions-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chained-exceptions-step" x="752" y="142">04</text>
    <text class="chained-exceptions-name" x="778" y="142">Read the FIRST block</text>
    <text class="chained-exceptions-desc" x="752" y="166">The loud second one is a</text>
    <text class="chained-exceptions-desc" x="752" y="182">consequence. The quiet first one</text>
    <text class="chained-exceptions-desc" x="752" y="198">is the cause.</text>
    <text class="chained-exceptions-edge" x="752" y="242">first</text>
  </g>
  <text class="chained-exceptions-sub" x="30" y="304">Python 3 added this chaining precisely so the original is not lost. Before it, a failing except block would replace the real error with its own and the cause disappeared entirely.</text>
</svg>
