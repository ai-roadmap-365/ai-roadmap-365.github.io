<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A traceback is a map of your system.">
  <title>Log the traceback, show an identifier</title>
  <style>
    .traceback-not-to-users-bg   { fill: #f8fafc; }
    .traceback-not-to-users-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-not-to-users-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-not-to-users-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-not-to-users-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-not-to-users-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .traceback-not-to-users-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .traceback-not-to-users-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .traceback-not-to-users-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .traceback-not-to-users-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .traceback-not-to-users-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .traceback-not-to-users-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .traceback-not-to-users-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .traceback-not-to-users-row { opacity: 1; }
    .traceback-not-to-users-r0 { animation-delay: 0.00s; }
    .traceback-not-to-users-r1 { animation-delay: 0.45s; }
    .traceback-not-to-users-r2 { animation-delay: 0.90s; }
    .traceback-not-to-users-r3 { animation-delay: 1.35s; }
    .traceback-not-to-users-r4 { animation-delay: 1.80s; }
    .traceback-not-to-users-row { animation: traceback-not-to-users-reveal 7.3s ease-in-out infinite; }
    @keyframes traceback-not-to-users-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="traceback-not-to-users-bg" width="980" height="390"/>
  <text class="traceback-not-to-users-h1"  x="30" y="40">Log the traceback, show an identifier</text>
  <text class="traceback-not-to-users-sub" x="30" y="64">A traceback is a map of your system.</text>
  <rect class="traceback-not-to-users-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="traceback-not-to-users-name" x="46" y="122">Shown to the user</text>
  <text class="traceback-not-to-users-desc" x="46" y="142">More than you meant to share.</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r0" x="46" y="182">Absolute file paths on your server</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r1" x="46" y="216">Library names and versions</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r2" x="46" y="250">Sometimes the offending VALUE itself</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r3" x="46" y="284">A map for anyone probing the system</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r4" x="46" y="318">And it helps the user not at all</text>
  <rect class="traceback-not-to-users-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="traceback-not-to-users-name" x="526" y="122">Logged, with a reference</text>
  <text class="traceback-not-to-users-desc" x="526" y="142">Same information, right audience.</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r0" x="526" y="182">logging.exception captures it in full</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r1" x="526" y="216">The user sees "error ref 7f3a21"</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r2" x="526" y="250">Support can find it instantly</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r3" x="526" y="284">Nothing internal is disclosed</text>
  <text class="traceback-not-to-users-desc traceback-not-to-users-row traceback-not-to-users-r4" x="526" y="318">Day 40's structured logging carries it</text>
  <text class="traceback-not-to-users-sub" x="30" y="372">Exception messages can contain data as well as structure: a KeyError prints the key, a ValueError often prints the value. Both then live in your logs, which is a retention question as much as a security one.</text>
</svg>
