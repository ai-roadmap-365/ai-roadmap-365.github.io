<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, sans-serif">
  <title>The debugging method loop: reproduce, read, isolate, hypothesize, test, fix</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">The debugging method — a loop, not a guess</text>

  <!-- Six boxes, two rows -->
  <rect x="40" y="80" width="190" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="135" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">1. Reproduce</text>
  <text x="135" y="132" text-anchor="middle" font-size="14" fill="#1a202c">make it fail on demand</text>

  <rect x="285" y="80" width="190" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">2. Read</text>
  <text x="380" y="132" text-anchor="middle" font-size="14" fill="#1a202c">the traceback, bottom-up</text>

  <rect x="530" y="80" width="190" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="625" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">3. Isolate</text>
  <text x="625" y="132" text-anchor="middle" font-size="14" fill="#1a202c">shrink to the failing bit</text>

  <rect x="530" y="240" width="190" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="625" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">4. Hypothesize</text>
  <text x="625" y="292" text-anchor="middle" font-size="14" fill="#1a202c">one testable guess</text>

  <rect x="285" y="240" width="190" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="380" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">5. Test</text>
  <text x="380" y="292" text-anchor="middle" font-size="14" fill="#1a202c">print or pause &amp; inspect</text>

  <rect x="40" y="240" width="190" height="76" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="135" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">6. Fix the cause</text>
  <text x="135" y="292" text-anchor="middle" font-size="14" fill="#1a202c">then re-run step 1</text>

  <!-- Arrows top row L->R -->
  <line x1="230" y1="118" x2="277" y2="118" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="285,118 271,111 271,125" fill="#1d4ed8"/>
  <line x1="475" y1="118" x2="522" y2="118" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="530,118 516,111 516,125" fill="#1d4ed8"/>

  <!-- Arrow down right side -->
  <line x1="625" y1="156" x2="625" y2="232" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="625,240 618,226 632,226" fill="#1d4ed8"/>

  <!-- Arrows bottom row R->L -->
  <line x1="530" y1="278" x2="483" y2="278" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="475,278 489,271 489,285" fill="#1d4ed8"/>
  <line x1="285" y1="278" x2="238" y2="278" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="230,278 244,271 244,285" fill="#1d4ed8"/>

  <!-- Loop-back arrow from Fix up to Reproduce -->
  <line x1="135" y1="240" x2="135" y2="164" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="135,156 128,170 142,170" fill="#1d4ed8"/>

  <!-- Wrong-guess loop note -->
  <text x="380" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Guess wrong? Form the next hypothesis — now better informed — and test again.</text>
  <text x="380" y="392" text-anchor="middle" font-size="15" fill="#1a202c">Bugs fall to steady iteration, not flashes of insight.</text>
  <text x="380" y="416" text-anchor="middle" font-size="14" fill="#1a202c">Stuck for ten minutes? Explain it aloud to a rubber duck.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}.dx-f4{animation-delay:1.68s}.dx-f5{animation-delay:2.10s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 230 118 L 277 118" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 475 118 L 522 118" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 625 156 L 625 232" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 135 240 L 135 164" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 285 278 L 238 278" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 530 278 L 483 278" stroke="#1d4ed8" stroke-width="4.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
