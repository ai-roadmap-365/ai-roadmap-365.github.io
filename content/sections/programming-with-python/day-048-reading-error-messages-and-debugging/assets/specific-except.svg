<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It catches things you did not mean to catch.">
  <title>Never write a bare except</title>
  <style>
    .specific-except-bg   { fill: #f8fafc; }
    .specific-except-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .specific-except-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .specific-except-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .specific-except-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .specific-except-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .specific-except-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .specific-except-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .specific-except-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .specific-except-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .specific-except-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .specific-except-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .specific-except-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .specific-except-row { opacity: 1; }
    .specific-except-r0 { animation-delay: 0.00s; }
    .specific-except-r1 { animation-delay: 0.45s; }
    .specific-except-r2 { animation-delay: 0.90s; }
    .specific-except-r3 { animation-delay: 1.35s; }
    .specific-except-r4 { animation-delay: 1.80s; }
    .specific-except-row { animation: specific-except-reveal 7.3s ease-in-out infinite; }
    @keyframes specific-except-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="specific-except-bg" width="980" height="390"/>
  <text class="specific-except-h1"  x="30" y="40">Never write a bare except</text>
  <text class="specific-except-sub" x="30" y="64">It catches things you did not mean to catch.</text>
  <rect class="specific-except-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="specific-except-name" x="46" y="122">except:</text>
  <text class="specific-except-desc" x="46" y="142">Everything, including the unexpected.</text>
  <text class="specific-except-desc specific-except-row specific-except-r0" x="46" y="182">Swallows KeyboardInterrupt — Ctrl+C stops working</text>
  <text class="specific-except-desc specific-except-row specific-except-r1" x="46" y="216">Swallows SystemExit</text>
  <text class="specific-except-desc specific-except-row specific-except-r2" x="46" y="250">Hides the bug you have not met yet</text>
  <text class="specific-except-desc specific-except-row specific-except-r3" x="46" y="284">Turns a crash into silent wrong behaviour</text>
  <text class="specific-except-desc specific-except-row specific-except-r4" x="46" y="318">The traceback you needed is gone</text>
  <rect class="specific-except-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="specific-except-name" x="526" y="122">except KeyError:</text>
  <text class="specific-except-desc" x="526" y="142">The one you anticipated.</text>
  <text class="specific-except-desc specific-except-row specific-except-r0" x="526" y="182">Handles what you reasoned about</text>
  <text class="specific-except-desc specific-except-row specific-except-r1" x="526" y="216">Anything else still raises, loudly</text>
  <text class="specific-except-desc specific-except-row specific-except-r2" x="526" y="250">The unexpected stays visible</text>
  <text class="specific-except-desc specific-except-row specific-except-r3" x="526" y="284">except Exception: if you must be broad</text>
  <text class="specific-except-desc specific-except-row specific-except-r4" x="526" y="318">And log it with logging.exception</text>
  <text class="specific-except-sub" x="30" y="372">A bare except is how a scheduled job reports success while doing nothing: the failure was caught, nothing was logged, and the exit code stayed zero. Day 14's silent failure, written into the code.</text>
</svg>
