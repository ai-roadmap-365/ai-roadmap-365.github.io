slug: reading-error-messages-and-debugging
title: 'Reading Error Messages and Debugging'
section: programming-with-python
subsection: python-basics
week: 7
learning_promise: 'After this lesson you will be able to read any Python traceback bottom-up, recognize the common exceptions on sight, and work through a bug with a calm, repeatable method instead of guessing.'
objectives:
  - 'Read a Python traceback from the bottom up: identify the exception type and message, then the culprit frame with its file, line number, and function'
  - 'Recognize the common built-in exceptions (SyntaxError, IndentationError, NameError, TypeError, ValueError, IndexError, KeyError, AttributeError, ModuleNotFoundError, ZeroDivisionError) and state what each really means'
  - 'Distinguish confusable pairs — TypeError vs ValueError, and IndexError vs KeyError — and use the exception type to point at the right fix'
  - 'Apply the six-step debugging method: reproduce, read, isolate, hypothesize, test, fix'
  - 'Use print-debugging well and pause a running program with breakpoint()/pdb to step through and inspect variables'
  - 'Explain why the line named in an error is not always where the bug is, and know when to climb the call stack'
  - 'Connect calm, methodical debugging to AI practice, where models, data, and dependencies raise these same exceptions'
prerequisites:
  - 'Days 43-47: Python installed, and comfort writing and running small programs with variables, strings, numbers, and input/output'
  - 'A terminal and a text editor; no prior debugging experience required'
reading_time_minutes: 40
practical_time_minutes: 30
