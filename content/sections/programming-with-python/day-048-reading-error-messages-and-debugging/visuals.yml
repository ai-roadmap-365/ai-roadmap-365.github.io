visuals:
  - id: traceback-anatomy
    file: assets/traceback-anatomy.svg
    type: diagram
    title: 'Anatomy of a traceback'
    alt: 'Diagram: the anatomy of a Python traceback, read from the bottom up'
    description: 'An annotated Python traceback showing that you read it bottom-up: the last line names the exception type and message (the "what"), the frame directly above it is the culprit line where the error surfaced (the "where"), and the frames above that are the call stack you climb only when the cause hides in a caller.'
  - id: debug-method
    file: assets/debug-method.svg
    type: flowchart
    title: 'The debugging method loop'
    alt: 'Flowchart: the debugging method loop from reproduce to fix'
    description: 'The six-step debugging loop — reproduce the failure, read the traceback, isolate the failing piece, form one testable hypothesis, test it, and fix the cause — then re-run from reproduce, forming a fresh hypothesis whenever a guess is wrong.'
