visuals:
  - id: traceback-anatomy
    file: assets/traceback-anatomy.svg
    type: diagram
    title: 'Anatomy of a traceback'
    alt: 'Diagram: the anatomy of a Python traceback, read from the bottom up'
    description: 'An annotated Python traceback showing that you read it bottom-up: the last line names the exception type and message (the "what"), the frame directly above it is the culprit line where the error surfaced (the "where"), and the frames above that are the call stack you climb only when the cause hides in a caller.'
  - id: debug-method
    file: assets/debug-method.svg
    type: flowchart
    title: 'The debugging method loop'
    alt: 'Flowchart: the debugging method loop from reproduce to fix'
    description: 'The six-step debugging loop — reproduce the failure, read the traceback, isolate the failing piece, form one testable hypothesis, test it, and fix the cause — then re-run from reproduce, forming a fresh hypothesis whenever a guess is wrong.'
  - id: read-both-directions
    file: assets/read-both-directions.svg
    type: diagram
    title: 'Read a traceback twice, in both directions'
    alt: 'Diagram: how to read a traceback in two passes'
    description: 'A four-stage reading procedure for a traceback, covering the header, reading upward from the error, then downward to find the last frame belonging to your own code.'
  - id: where-used-not-made
    file: assets/where-used-not-made.svg
    type: diagram
    title: 'A traceback reports use, not origin'
    alt: 'Diagram: where an error is reported compared with where it was caused'
    description: 'A two-column comparison of the line a traceback names against the line where the faulty value was actually produced, using the None case.'
  - id: one-hypothesis
    file: assets/one-hypothesis.svg
    type: diagram
    title: 'One hypothesis, one change, one test'
    alt: 'Diagram: the loop of forming and testing a single hypothesis'
    description: 'A four-stage debugging loop covering forming a specific checkable statement, changing exactly one thing, observing the result, and halving the search space.'
  - id: specific-except
    file: assets/specific-except.svg
    type: diagram
    title: 'Never write a bare except'
    alt: 'Diagram: a bare except clause compared with a specific one'
    description: 'A two-column comparison of catching all exceptions against catching specific ones, covering what each swallows and the debugging consequences.'
  - id: chained-exceptions
    file: assets/chained-exceptions.svg
    type: diagram
    title: 'Two tracebacks, one problem'
    alt: 'Diagram: how chained exceptions are printed and which one matters'
    description: 'A four-stage explanation of chained exceptions covering the original failure, a second failure during handling, how Python prints both, and which to investigate first.'
  - id: exception-categories
    file: assets/exception-categories.svg
    type: diagram
    title: 'The exception type is the first clue'
    alt: 'Diagram: what each common Python exception category indicates'
    description: 'A four-stage grouping of common Python exceptions by the kind of mistake each indicates: naming, type, value and lookup errors.'
  - id: traceback-not-to-users
    file: assets/traceback-not-to-users.svg
    type: diagram
    title: 'Log the traceback, show an identifier'
    alt: 'Diagram: showing a traceback to a user compared with logging it'
    description: 'A two-column comparison of exposing a traceback to an end user against logging it and showing a reference identifier, covering the information each reveals.'
  - id: bisect-the-input
    file: assets/bisect-the-input.svg
    type: diagram
    title: 'Bisect the input, not only the code'
    alt: 'Diagram: narrowing a failure by halving the input data'
    description: 'A four-stage sequence showing a failure on a large input being narrowed by repeatedly halving the data until a minimal failing case remains.'
  - id: reproduce-first
    file: assets/reproduce-first.svg
    type: diagram
    title: 'An intermittent bug is not yet fixable'
    alt: 'Diagram: debugging an intermittent failure compared with a reproducible one'
    description: 'A two-column comparison of attempting to fix an intermittent failure against first making it reproducible, covering how each affects the ability to verify a fix.'
