terms:
  - term: exception
    definition: 'A signal Python raises when it cannot carry out an instruction; it has a type that categorizes the problem and usually a message with the specifics, and it stops normal execution unless the program catches it.'
  - term: traceback
    definition: 'The report Python prints when an uncaught exception occurs, showing the chain of function calls that led to the failure, each with its file, line number, and code, ending with the exception type and message.'
  - term: stack frame
    definition: 'One entry in a traceback (and in the call stack): a single function''s place in the chain of calls, recording the file, line number, function name, and the exact line being executed.'
  - term: call stack
    definition: 'The ordered chain of function calls active at a given moment — who called whom — which the traceback lists oldest-first so the most recent call sits nearest the error.'
  - term: SyntaxError
    definition: 'An error raised when Python cannot parse your code because it is not valid Python; it stops the program from starting at all.'
  - term: IndentationError
    definition: 'A special kind of SyntaxError caused by wrong or inconsistent indentation, such as a line indented where Python did not expect it.'
  - term: NameError
    definition: 'An error raised when you use a name that does not exist, usually because of a typo or because the name was used before it was defined.'
  - term: TypeError
    definition: 'An error raised when an operation receives a value of the wrong type, such as trying to add a string to an integer.'
  - term: ValueError
    definition: 'An error raised when a value is the right type but unacceptable for the operation, such as calling int("hello").'
  - term: IndexError
    definition: 'An error raised when you access a position in an ordered sequence (a list or tuple) that is out of range.'
  - term: KeyError
    definition: 'An error raised when you look up a key in a dictionary that does not exist.'
  - term: AttributeError
    definition: 'An error raised when you access an attribute or method that an object does not have, often due to a typo in the method name.'
  - term: ModuleNotFoundError
    definition: 'An error raised when Python cannot find a module you tried to import, commonly because it is not installed in the current environment.'
  - term: pdb
    definition: 'Python''s built-in interactive debugger, which lets you pause a running program at a prompt and inspect variables, step line by line, and continue.'
  - term: breakpoint
    definition: 'A built-in function (added in Python 3.7) that pauses the program where it is called and drops you into the pdb debugger, replacing the older import pdb; pdb.set_trace() incantation.'
  - term: print-debugging
    definition: 'The practice of adding temporary print() calls to reveal a program''s values and control flow; fast for a quick, specific question but requires editing and re-running.'
  - term: rubber-duck debugging
    definition: 'The practice of explaining your code aloud, line by line, to an inanimate object or patient listener, which often surfaces the flaw the moment intent and reality are compared.'
