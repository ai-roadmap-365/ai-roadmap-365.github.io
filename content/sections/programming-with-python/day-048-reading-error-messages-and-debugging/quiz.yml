questions:
  - question: 'In which order should you read a Python traceback, and why?'
    options:
      - 'Top to bottom, because the first frame is always where your bug is'
      - 'It does not matter; every line says the same thing'
      - 'Bottom to top: the last line names the exception'
      - 'Only the middle frames matter; ignore the top and bottom'
    answer_index: 2
    explanation: 'Tracebacks list calls oldest-first, so the most recent call sits at the bottom next to the exception. Reading bottom-up gives you the "what" (the exception type and message) and then the "where" (the nearest frame) with the least wasted effort.'

  - question: 'A program raises TypeError. What category of mistake does that signal?'
    options:
      - 'A dictionary key that does not exist'
      - 'A sequence index that is out of range'
      - 'Code that Python could not parse at all'
      - 'An operation given a value of the wrong type'
    answer_index: 3
    explanation: 'A TypeError means an operation received the wrong KIND of value — for example "3" + 5, where no value would make string-plus-integer valid. That differs from a ValueError, where the type is right but the specific value is unacceptable.'

  - question: 'What is the difference between a TypeError and a ValueError?'
    options:
      - 'TypeError is the wrong kind of value; ValueError an unusable one'
      - 'They are two names for exactly the same error'
      - 'A ValueError only happens with dictionaries; a TypeError only happens with lists'
      - 'A TypeError happens before the program starts; a ValueError happens while it runs'
    answer_index: 0
    explanation: 'int("hello") raises ValueError because a string is the right type for int() but "hello" is not a number. "3" + 5 raises TypeError because a string and an integer are incompatible kinds for the + operation.'

  - question: 'You look up my_list[5] on a list that has three items. Which exception is raised?'
    options:
      - 'KeyError'
      - 'IndexError'
      - 'ValueError'
      - 'AttributeError'
    answer_index: 1
    explanation: 'IndexError means a sequence index is out of range. A three-item list has valid positions 0, 1, and 2, so asking for position 5 walks off the end. A missing lookup in a dictionary would instead raise KeyError.'

  - question: 'What is the correct order of the six-step systematic debugging method?'
    options:
      - 'Fix, read, reproduce, test, isolate, hypothesize'
      - 'Hypothesize, fix, read, reproduce, isolate, test'
      - 'Reproduce, read, isolate, hypothesize, test, fix'
      - 'Read, fix, reproduce, hypothesize, isolate, test'
    answer_index: 2
    explanation: 'First make the failure reproducible, then read the error, isolate the smallest failing piece, form one testable hypothesis about the cause, test it, and only then fix the cause — re-running your reproduction to confirm.'

  - question: 'What does the built-in breakpoint() function do when your program reaches it?'
    options:
      - 'It permanently deletes the current variable to free memory'
      - 'It restarts the program from the first line'
      - 'It prints every variable in the program and then exits'
      - 'It pauses the program and drops you into the debugger'
    answer_index: 3
    explanation: 'breakpoint() (added in Python 3.7) stops execution at that line and opens the pdb debugger prompt, where commands like p (print a value), n (next line), s (step into), and c (continue) let you inspect the live program without adding and re-running print statements.'

  - question: 'Why is it said that "where the program broke is not always where it went wrong"?'
    options:
      - 'The error surfaces where it failed, not where it was caused'
      - 'Because Python reports line numbers at random'
      - 'Because tracebacks never include the correct file name'
      - 'Because every exception is actually a SyntaxError in disguise'
    answer_index: 0
    explanation: 'A ZeroDivisionError on total / len(values) is genuine, but the actual mistake may be far earlier where values was filled from an empty file. The call stack exists precisely so you can climb from the symptom to a cause hiding in a caller.'

  - question: 'Why should you avoid showing raw tracebacks to the users of a program you build?'
    options:
      - 'Tracebacks make the program run more slowly for users'
      - 'Tracebacks can leak paths, versions, and internal logic'
      - 'Users are legally forbidden from reading tracebacks'
      - 'Tracebacks only display correctly for the original author'
    answer_index: 1
    explanation: 'A raw traceback can reveal file paths, function names, library versions, and even the offending data — a useful map for an attacker. Detailed tracebacks belong in your private console and logs; users should see a calm generic message instead.'
