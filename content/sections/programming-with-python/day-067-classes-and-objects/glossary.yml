terms:
  - term: class
    definition: 'A template that says what every object made from it will carry and what it can do. The `class` statement runs once and produces one object — the class itself — holding a dictionary of class attributes and the function objects for its methods.'
  - term: object
    definition: 'A thing in memory with a type, an identity, and its own state. In Python everything is one, including functions, modules, and classes themselves.'
  - term: instance
    definition: 'One object made from a particular class. Two instances of the same class have distinct identities and their own separate attribute dictionaries, while sharing one copy of every method.'
  - term: instantiation
    definition: 'Calling a class to produce a new instance, as in `Account("ada", 100)`. Python creates the empty object first and then hands it to `__init__` to be filled in.'
  - term: '__init__'
    definition: 'The initializer. It receives an object that already exists as `self`, sets its attributes, and returns None. It is not a constructor: it cannot choose or replace the object it was given, which is why alternative constructors are classmethods.'
  - term: self
    definition: 'The conventional name for a method''s first parameter, which receives the instance the method was reached through. It is an ordinary parameter, not a keyword, and Python makes it explicit so the mechanism is visible rather than hidden.'
  - term: instance attribute
    definition: 'A value stored in one object''s own `__dict__`, usually assigned through `self` inside `__init__`. Each instance has its own, so changing one changes nothing else.'
  - term: class attribute
    definition: 'A value assigned in the class body, stored once on the class and seen by every instance. Harmless for immutable values; a shared object for mutable ones, which is the classic bug this lesson reproduces.'
  - term: method
    definition: 'A function defined in a class body. It lives on the class as a single shared function object and receives the instance as its first argument when called through one.'
  - term: bound method
    definition: 'What you get when you reach a function through an instance: an object holding `__func__`, the original function, and `__self__`, the instance. Calling it calls the function with `__self__` supplied as the first argument.'
  - term: staticmethod
    definition: 'A function stored on a class that receives neither `self` nor `cls`. It belongs with the class conceptually — a validation rule, a unit conversion — rather than needing any particular object.'
  - term: classmethod
    definition: 'A function that receives the class itself as `cls`. Its overwhelmingly common use is the alternative constructor: it calls `cls(...)` and returns a new instance built from some other representation, such as a CSV row.'
  - term: alternative constructor
    definition: 'A second way to build an instance, written as a classmethod because there can only be one `__init__`. `Account.from_csv_row("ada,120.50")` is one, and it is how parsed data becomes validated objects.'
  - term: '__repr__'
    definition: 'The method producing unambiguous text about an object, for you rather than for a user. Lists and debuggers use it exclusively, and `print` falls back to it, which is why every class deserves one. Never put a secret in it — it reaches logs and tracebacks.'
  - term: '__str__'
    definition: 'The method producing friendly text about an object, for a person reading output. `print`, `str()`, and f-strings use it when it exists and fall back to `__repr__` when it does not.'
  - term: property
    definition: 'An attribute backed by functions. `@property` makes reads call a getter and `@name.setter` makes writes call a setter, so a rule can be added to an existing attribute without changing a single caller.'
  - term: invariant
    definition: 'A rule that must hold for an object to be valid — the balance is never negative, the pages lent never exceed the total. A class earns its place by making an invariant impossible to break rather than merely documented.'
  - term: encapsulation
    definition: 'Keeping state and the behaviour that maintains it together, and routing changes through that behaviour. Python does it with conventions and properties rather than access keywords.'
  - term: name mangling
    definition: 'The rewriting of a double-underscore attribute name inside a class body: `__pin` in `class Vault` is stored as `_Vault__pin`. It prevents accidental collisions between classes; it is not access control, since anyone can type the mangled name.'
  - term: '__dict__'
    definition: 'The dictionary an object uses to store its attributes. An instance''s holds only state; a class''s holds its class attributes and every method. `vars(obj)` returns the same object.'
  - term: attribute lookup
    definition: 'The rule that resolves a dotted name: search the instance dictionary first, then fall back to the class. Reads fall back; writes always land on the instance, creating an attribute that shadows the class one.'
  - term: dataclass
    definition: 'A standard-library decorator that writes `__init__`, `__repr__`, and `__eq__` from a class''s annotations. Ideal for a mutable bag of fields; it validates nothing, so a hand-written class still wins where an invariant must hold.'
  - term: namedtuple
    definition: 'An immutable record with named fields that is still a tuple, so it indexes, unpacks, and compares by value. `collections.namedtuple` is the factory form; `typing.NamedTuple` is the readable class form that also accepts methods.'
  - term: enum
    definition: 'A class defining a fixed set of named constant members. Its value is that an illegal member cannot be constructed at all, so a typo raises at the boundary instead of flowing quietly through the program.'
