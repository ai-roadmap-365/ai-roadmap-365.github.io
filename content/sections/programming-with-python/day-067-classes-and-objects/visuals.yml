visuals:
  - id: class-anatomy
    file: assets/class-anatomy.svg
    type: diagram
    title: 'Anatomy of a class: one blueprint, many instances'
    alt: 'Diagram: the anatomy of a class and its instances — the class object holds one shared dictionary containing the class attributes and the function objects for every method, the property, the classmethod, and the staticmethod, while each instance holds its own separate dictionary of state, and an attribute lookup checks the instance dictionary first and falls back to the class dictionary'
    description: 'The class object sits on the left holding a single dictionary, Account.__dict__, whose entries are the class attributes currency and accounts_opened alongside the function objects for __init__, deposit, withdraw, describe and __repr__, the balance property, the from_csv_row classmethod, and the is_valid_amount staticmethod. Two instances sit on the right, ada and bob, each with its own small dictionary holding only state — owner, _balance, and its own history list — and explicitly no methods. An arrow runs from each instance to the class labelled with the lookup rule: the instance dictionary is searched first, and the class dictionary is the fallback. The closing line states the claim the lesson proves in code — a class is a dictionary of state plus a dictionary of functions, with syntax on top — and the note that one function object per method is shared rather than copied per instance explains why the arrow exists instead of duplication.'
  - id: method-call-flow
    file: assets/method-call-flow.svg
    type: flowchart
    title: 'Step by step: what happens when you write account.deposit(50)'
    alt: 'Flowchart: what happens when you write account.deposit(50) — Python looks for the name in the instance dictionary, does not find it, falls back to the class dictionary where the function lives, wraps it as a bound method that remembers the instance, calls it as Account.deposit(account, 50) with self supplied, mutates that instance''s own state through the property setter, has the setter check the invariant, and returns the new balance'
    description: 'Eight numbered steps tracing a single method call. Step one looks for the name deposit in the instance dictionary. Step two fails to find it there, because an instance dictionary holds only state: owner, _balance, history. Step three falls back to the class, where type(account).__dict__ yields a function object. Step four wraps that function as a bound method whose __func__ is the function and whose __self__ is this account. Step five calls it with self supplied, so account.deposit(50) becomes Account.deposit(account, 50). Step six mutates this instance''s own state and no other account moves. Step seven has the property setter check the invariant, with a branch showing that a broken rule raises ValueError and leaves the state valid. Step eight records the movement in the instance history and returns the new balance. A side panel summarises where things live — state in the instance dictionary, behaviour in the class dictionary, and self as the link between them — and the closing line divides the diagram honestly: steps one to five are the language''s sugar, steps six to eight are the programmer''s code keeping the object''s promise.'
