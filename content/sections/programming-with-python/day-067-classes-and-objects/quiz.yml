questions:
  - question: 'You hold an account as a dictionary and enforce "the balance is never negative" inside a `withdraw` function. What is the weakness of that design?'
    options:
      - 'Dictionaries cannot store floating-point numbers accurately enough for money'
      - 'The function will be slower than a method because of the extra argument'
      - 'Dictionaries cannot hold a list, so the movement history has nowhere to live'
      - 'Direct assignment to the key bypasses the function entirely'
    answer_index: 3
    explanation: 'The dictionary is open storage. Every rule you encode lives in functions nobody is obliged to call, so `account["balance"] = -500` succeeds and leaves the object in a state your own code says is impossible. A class closes that gap by routing the assignment through a property setter that refuses it.'

  - question: 'Why is `__init__` described as an initializer rather than a constructor?'
    options:
      - 'The object already exists; `__init__` fills it in and returns None'
      - 'It is only called when you explicitly ask for it, unlike a constructor'
      - 'It constructs the class, not the instance'
      - 'The name is historical; the two words mean exactly the same thing in Python'
    answer_index: 0
    explanation: 'Printing `vars(self)` on the first line of `__init__` shows an empty dictionary on an object that already has a type and an identity. That is why `__init__` cannot return a different or cached object, and why an alternative constructor must be a `@classmethod` rather than a second `__init__` — there is only one.'

  - question: 'What are the two attributes on a bound method that make `acct.deposit(50)` work?'
    options:
      - '`__name__` and `__doc__`'
      - '`__func__` and `__self__`'
      - '`__init__` and `__repr__`'
      - '`__dict__` and `__class__`'
    answer_index: 1
    explanation: 'Reached through the class, `deposit` is a plain function. Reached through an instance it comes back wrapped as a bound method holding those two references, and calling it calls the function with `__self__` inserted as the first argument. That is the whole mechanism: `acct.deposit(50)` genuinely is `Account.deposit(acct, 50)`.'

  - question: 'A class body contains `history = []`. Two instances are created and one of them appends an entry. What does the other instance''s `history` contain?'
    options:
      - 'An empty list, because each instance is given its own copy at creation'
      - 'Nothing — reading it raises AttributeError until it is assigned in `__init__`'
      - 'The same entry — the list was created once and is shared'
      - 'A copy of the entry, so the two lists are equal but not the same object'
    answer_index: 2
    explanation: 'The list is a single object created once, at class-definition time. `self.history.append(...)` never creates anything on the instance: the lookup misses the instance dictionary, falls back to the class, and mutates the one shared list. `vars(instance)` proves it — `history` is not in there. The fix is `self.history = []` inside `__init__`.'

  - question: 'When does a `@classmethod` earn its place over a `@staticmethod`?'
    options:
      - 'When the function needs to modify a class attribute rather than an instance attribute'
      - 'When the function must be callable without creating an instance first'
      - 'When the function is too long to be an ordinary method'
      - 'When it needs the class itself, as an alternative constructor'
    answer_index: 3
    explanation: 'Both are callable on the class, so that is not the distinguishing feature. The classmethod receives the class as `cls` and can therefore call `cls(...)` to produce an instance; the staticmethod receives neither `self` nor `cls` and is simply a related function stored where it can be found, such as a validation rule.'

  - question: 'If you can only define one of `__repr__` and `__str__` on a class, which should you define?'
    options:
      - '`__repr__` — print and str() fall back to it'
      - 'Neither matters unless you plan to write the object to a file'
      - 'It makes no difference — Python generates whichever is missing from the other'
      - '`__str__`, because it is what `print` calls first'
    answer_index: 0
    explanation: 'Define only `__repr__` and everything stays readable: `print` falls back to it, and a list of your objects displays properly. Define only `__str__` and your lists and debugger still show memory addresses, which is exactly when you need the information most. One caution: `__repr__` appears in logs and tracebacks, so never put a secret in it.'

  - question: 'What does a double leading underscore, as in `self.__pin` inside `class Vault`, actually do?'
    options:
      - 'It makes the attribute genuinely private and unreachable from outside the class'
      - 'It renames it to `_Vault__pin`, preventing collisions only'
      - 'It marks the attribute read-only after `__init__` has finished'
      - 'It excludes the attribute from `vars()` and from the default `__repr__`'
    answer_index: 1
    explanation: 'Name mangling is a rename, and `vars(v)` shows the attribute stored under `_Vault__pin` in plain sight. From outside, `v.__pin` raises AttributeError while `v._Vault__pin` works fine. Its real purpose is avoiding collisions between classes, not security — for a value that must not leak, the answer is not to store it in an attribute that reaches your logs.'

  - question: 'You have a group of related fields that need `__init__`, `__repr__`, and `__eq__`, but no rules to enforce. What is the best choice?'
    options:
      - 'A hand-written class, because any structured data deserves one'
      - 'A plain dict, because writing any class for this is over-engineering'
      - 'A dataclass, which writes those methods from your annotations'
      - 'An enum, because it groups related names together'
    answer_index: 2
    explanation: 'A dataclass removes exactly the boilerplate you would otherwise type, and `field(default_factory=list)` avoids today''s shared-mutable bug. Its honest limit is that it validates nothing — it will accept a negative page count without complaint. Write the class by hand the moment there is a rule that must hold, and use an enum when a field has a closed set of legal values.'
