<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where they live.">
  <title>Instance against class attributes</title>
  <style>
    .instance-class-attr-bg   { fill: #f8fafc; }
    .instance-class-attr-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instance-class-attr-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instance-class-attr-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instance-class-attr-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instance-class-attr-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instance-class-attr-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instance-class-attr-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instance-class-attr-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instance-class-attr-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instance-class-attr-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instance-class-attr-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instance-class-attr-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instance-class-attr-row { opacity: 1; }
    .instance-class-attr-r0 { animation-delay: 0.00s; }
    .instance-class-attr-r1 { animation-delay: 0.45s; }
    .instance-class-attr-r2 { animation-delay: 0.90s; }
    .instance-class-attr-r3 { animation-delay: 1.35s; }
    .instance-class-attr-r4 { animation-delay: 1.80s; }
    .instance-class-attr-row { animation: instance-class-attr-reveal 7.3s ease-in-out infinite; }
    @keyframes instance-class-attr-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="instance-class-attr-bg" width="980" height="390"/>
  <text class="instance-class-attr-h1"  x="30" y="40">Instance against class attributes</text>
  <text class="instance-class-attr-sub" x="30" y="64">Where they live.</text>
  <rect class="instance-class-attr-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="instance-class-attr-name" x="46" y="122">Instance attributes</text>
  <text class="instance-class-attr-desc" x="46" y="142">One per object.</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r0" x="46" y="182">Assigned in the initialiser, usually</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r1" x="46" y="216">Each instance has its own</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r2" x="46" y="250">Changing one affects only that instance</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r3" x="46" y="284">Where per-object state belongs</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r4" x="46" y="318">The normal case</text>
  <rect class="instance-class-attr-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="instance-class-attr-name" x="526" y="122">Class attributes</text>
  <text class="instance-class-attr-desc" x="526" y="142">One, shared.</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r0" x="526" y="182">Assigned in the class body</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r1" x="526" y="216">Shared by every instance</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r2" x="526" y="250">Changing it affects all of them</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r3" x="526" y="284">For constants and defaults</text>
  <text class="instance-class-attr-desc instance-class-attr-row instance-class-attr-r4" x="526" y="318">A mutable one is a shared-state trap</text>
  <text class="instance-class-attr-sub" x="30" y="372">A mutable class attribute is the same trap as a mutable default argument: one object shared across every instance, accumulating changes nobody intended.</text>
</svg>
