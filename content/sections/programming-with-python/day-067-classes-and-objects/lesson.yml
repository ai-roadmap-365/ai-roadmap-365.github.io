id: D067
day: 67
slug: classes-and-objects
title: 'Classes and Objects'
section: programming-with-python
subsection: python-in-practice
week: 10
learning_promise: 'After this lesson you will be able to replace a dictionary plus a pile of functions that assume its keys with a class that binds state to the behaviour maintaining its invariants: you will write __init__, self, methods, staticmethods and classmethods knowing exactly what each receives, defend a rule with a @property that rejects an invalid value, give every class a __repr__ that makes debugging possible, avoid the shared-mutable-class-attribute bug, decide honestly whether a class is even the right tool, and build a minimal object system from dicts and closures so you can see that a class is a dictionary of state plus a dictionary of functions with syntax on top.'
objectives:
  - 'Explain the problem a class solves — state and the rules governing it drifting apart when a dict is passed into functions nobody is obliged to call — and demonstrate the failure with real output'
  - 'Distinguish a class (the blueprint) from an instance (a concrete thing with its own state), proving two instances have distinct identities while sharing one type'
  - 'Explain why __init__ is an initializer and not a constructor, showing that the object already exists when it runs, and name a practical consequence of the difference'
  - 'Show that obj.m(x) is Class.m(obj, x) by inspecting a bound method''s __func__ and __self__, and explain why self is an explicit parameter in Python'
  - 'Contrast instance attributes with class attributes, reproduce the shared-mutable-class-attribute bug with real output, and fix it inside __init__'
  - 'Choose correctly among an instance method, a @staticmethod, and a @classmethod, using a classmethod as an alternative constructor that builds objects from CSV rows'
  - 'Define __repr__ and __str__ for their correct audiences, and justify why every class deserves a __repr__ for debugging'
  - 'Enforce an invariant with @property, including a setter that rejects an invalid value, and explain the single-underscore convention and double-underscore name mangling'
  - 'Decide whether a problem deserves a class at all, choosing instead a dict, a NamedTuple, a dataclass, an enum, or a plain function when those fit better'
  - 'Build a minimal object system from dicts and closures, then inspect the result with type(), dir(), __dict__, and vars() to expose the machinery a class provides'
prerequisites:
  - 'Day 66: exceptions and error-handling strategy — raising ValueError to refuse an invalid state is how an invariant is defended'
  - 'Day 65: CSV and JSON in the real world — the classmethod alternative constructor builds objects straight from parsed rows'
  - 'Day 63: designing a small program well — a pure core and a thin shell, the shape the practice assignment reuses'
  - 'Day 58: scope and closures — the from-scratch object system is a dict of closures over one captured state dict'
  - 'Days 52-54: lists and dictionaries, since an object is literally a dictionary of state'
  - 'Comfort running a script from the terminal with python3'
reading_time_minutes: 40
practical_time_minutes: 30
