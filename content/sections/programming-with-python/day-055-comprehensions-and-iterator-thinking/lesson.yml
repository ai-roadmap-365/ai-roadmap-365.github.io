title: 'Comprehensions and Iterator Thinking'
section: programming-with-python
subsection: python-basics
week: 8
learning_promise: 'After this lesson you will be able to write list, dict, and set comprehensions that map and filter in one readable line, and think in iterators — using generators and itertools to process data one item at a time, lazily, no matter how large the stream.'
objectives:
  - 'Write list, dict, and set comprehensions that map and filter a collection in a single expression, naming the three parts (output expression, for clause, if clause)'
  - 'Judge when a comprehension improves readability and when a plain loop is the clearer, honest choice — including the caution against over-nesting'
  - 'Flatten a nested collection with a single nested comprehension and explain why one level is the limit of good taste'
  - 'Explain what a `for` loop really does under the hood in terms of `iter()`, `next()`, and `StopIteration`, and distinguish an iterable from an iterator'
  - 'Write a `yield`-based generator function and a generator expression, and describe how lazy evaluation keeps memory flat over an arbitrarily large stream'
  - 'Assemble a lazy generator pipeline over a stream of records and prove it returns the same result as an eager loop'
  - 'Use itertools building blocks — chain, islice, and count — and connect lazy iterators to AI data loaders, streaming tokenizers, and batch pipelines'
prerequisites:
  - 'Days 51-54 of this course: for and while loops, and lists, dictionaries, tuples, and sets'
  - 'Comfort running a script from the terminal with `python3 file.py` and reading a small Python function'
