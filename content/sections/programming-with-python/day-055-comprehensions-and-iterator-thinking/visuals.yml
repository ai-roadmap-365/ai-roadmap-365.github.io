visuals:
  - id: comprehension-anatomy
    file: assets/comprehension-anatomy.svg
    type: diagram
    title: 'Anatomy of a comprehension'
    alt: 'Diagram: the anatomy of a comprehension — the output expression, the for clause, and the optional if clause, with the equivalent loop'
    description: 'The comprehension [n * n for n in numbers if n % 2 == 0] shown once with each of its three parts labelled: the output expression (the mapping, what to build for each kept item), the for clause (the iterable, the source looped over one at a time), and the optional if clause (the filter, keep an item only when true). Below it, the same logic written as an explicit loop — an empty result list, a for over numbers, an if on evenness, and an append of n * n — with each line annotated to match the comprehension part it corresponds to.'
  - id: lazy-iteration-flow
    file: assets/lazy-iteration-flow.svg
    type: flowchart
    title: 'A lazy generator pipeline'
    alt: 'Flowchart: a lazy generator pipeline moving one record at a time from a large source through a transform and a filter to the consumer'
    description: 'A huge source (a file, socket, or dataset too big for memory) feeds a read_records generator that yields one parsed record, which feeds an only_matching generator that yields it onward only if it passes, which feeds a consumer (sum, for, or next). Arrows show a single record travelling right while the pull for the next item travels left; a highlighted note states that exactly one record is in memory in flight, unlike a list comprehension that would build the whole result first. A final panel notes that when the source runs dry the generator raises StopIteration, the signal a for loop catches to know it is done.'
  - id: comprehension-idea
    file: assets/comprehension-idea.svg
    type: diagram
    title: 'What a comprehension is'
    alt: 'Diagram: the four parts of a comprehension'
    description: 'A four-stage description of comprehensions covering the output expression, the iteration, the optional filter and the result.'
  - id: for-really-does
    file: assets/for-really-does.svg
    type: diagram
    title: 'What a loop expands to'
    alt: 'Diagram: what a for loop expands to underneath'
    description: 'A four-stage description of the loop''s expansion covering the iterator request, the next call, the exception and the equivalence.'
  - id: generators
    file: assets/generators.svg
    type: diagram
    title: 'Generators'
    alt: 'Diagram: the four properties of a generator'
    description: 'A four-stage description of generators covering lazy production, suspended state, single use and memory.'
  - id: itertools
    file: assets/itertools.svg
    type: diagram
    title: 'Composable iteration'
    alt: 'Diagram: four composable iteration utilities and what each does'
    description: 'A four-stage description of iteration utilities covering chaining, slicing, grouping and pairing.'
  - id: comprehension-not
    file: assets/comprehension-not.svg
    type: diagram
    title: 'Four things comprehensions are not'
    alt: 'Diagram: four misconceptions about comprehensions'
    description: 'A two-column comparison of misconceptions about comprehensions against what is true.'
  - id: comprehension-history
    file: assets/comprehension-history.svg
