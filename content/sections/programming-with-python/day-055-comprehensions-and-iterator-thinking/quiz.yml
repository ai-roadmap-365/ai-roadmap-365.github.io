questions:
  - question: 'What are the three parts of the comprehension `[w.upper() for w in words if len(w) > 3]`, in the order they appear?'
    options:
      - 'The expression, the for clause, the if clause'
      - 'A condition, a source, and a resulting value'
      - 'A key, a value, and a filter'
      - 'An import, a loop, and a return'
    answer_index: 0
    explanation: 'Every comprehension has an output expression (what to build for each kept item, written first), a for clause (the source to iterate), and an optional if clause (which items to keep). Here they are `w.upper()`, `for w in words`, and `if len(w) > 3`.'

  - question: 'Which brackets produce a generator expression rather than a list?'
    options:
      - 'Square brackets: `[x for x in xs]`'
      - 'Round brackets: `(x for x in xs)`'
      - 'Curly braces: `{x for x in xs}`'
      - 'Angle brackets: `<x for x in xs>`'
    answer_index: 1
    explanation: 'Round brackets `(...)` create a generator expression, which produces items lazily one at a time. Square brackets build a list (all items now), and curly braces build a set (or a dict with a `key: value` pair).'

  - question: 'What does a `for` loop actually do under the hood?'
    options:
      - 'It copies the whole collection into memory, then reads each item by index'
      - 'It runs the loop body once for every index from 0 to len minus one'
      - 'It calls `iter()`, then `next()` until `StopIteration`'
      - 'It converts the collection to a list and slices it'
    answer_index: 2
    explanation: 'A `for` loop calls `iter(thing)` to obtain an iterator, then calls `next()` on it each pass to get the next item, and stops quietly when `next()` raises `StopIteration`. Because it only ever asks for the next item, the whole collection need not exist at once.'

  - question: 'What is the difference between an iterable and an iterator?'
    options:
      - 'They are two words for the same thing'
      - 'An iterator can only hold numbers, an iterable can hold anything'
      - 'An iterable is lazy and an iterator is eager'
      - 'An iterable makes an iterator; the iterator holds the position'
    answer_index: 3
    explanation: 'An iterable (a list, string, dict, or file) is anything you can call `iter()` on. The iterator it returns is what actually tracks your place and produces the next item when you call `next()`. Lists are iterable; the object you get from `iter(a_list)` is the iterator.'

  - question: 'Why can a generator pipeline process a file larger than your computer''s memory when a list of the same data cannot?'
    options:
      - 'A generator holds one item at a time, so memory stays flat'
      - 'Generators store the data on disk automatically'
      - 'Generators compress the data so it fits'
      - 'A list is slower, so it runs out of time before memory'
    answer_index: 0
    explanation: 'A generator computes each item on demand and keeps only its current state, so at most one item is in flight. A list must materialize every item at once, which fails when the data exceeds available memory. Laziness trades storage for on-demand computation.'

  - question: 'You write `sum([r["score"] for r in huge_records])`. What is the wasteful part, and the fix?'
    options:
      - 'Nothing is wasteful; this is optimal'
      - 'The brackets build the whole list; drop them to stream'
      - 'The `sum` is slow; use a manual loop instead'
      - 'The dictionary access `r["score"]` should be `r.score`'
    answer_index: 1
    explanation: 'The square brackets force a full intermediate list to be built before `sum` sees any of it. Using a generator expression (no brackets) streams the scores one at a time into `sum`, holding almost nothing — the right choice when feeding an aggregator like `sum`, `any`, `max`, or `min`.'

  - question: 'When is a plain `for` loop the clearer, more honest choice over a comprehension?'
    options:
      - 'Whenever the collection has more than ten items'
      - 'Never — comprehensions are always better'
      - 'When the body has side effects or branching'
      - 'Only when you are using a dictionary'
    answer_index: 2
    explanation: 'Comprehensions shine for a simple map/filter that fits one readable line. When the work has side effects (printing, writing files), needs several statements, or branches in complex ways, a plain loop is clearer — forcing it into a comprehension produces an unreadable line.'

  - question: 'What does `itertools.islice(itertools.count(0), 5)` produce, and why is it safe?'
    options:
      - 'It raises an error because `count(0)` is infinite'
      - 'It builds an infinite list and then slices it'
      - 'It produces the numbers 0 through 5 inclusive'
      - 'It yields 0,1,2,3,4 lazily — islice pulls only five'
    answer_index: 3
    explanation: '`count(0)` is an infinite iterator counting upward, but because everything is lazy, `islice` only requests the first five items and stops. Nothing tries to build the infinite sequence, so it produces `0, 1, 2, 3, 4` safely.'
