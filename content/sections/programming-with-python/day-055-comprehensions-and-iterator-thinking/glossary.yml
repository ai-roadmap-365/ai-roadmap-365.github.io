terms:
  - term: list comprehension
    definition: 'A single expression in square brackets `[...]` that builds a list by mapping and optionally filtering an existing iterable — for example `[n * n for n in numbers if n % 2 == 0]`.'
  - term: dict comprehension
    definition: 'A comprehension in curly braces with a `key: value` pair that builds a dictionary — for example `{r["name"]: r["score"] for r in records}`.'
  - term: set comprehension
    definition: 'A comprehension in curly braces that builds a set, so duplicates collapse and order is not kept — for example `{r["team"] for r in records}`.'
  - term: generator expression
    definition: 'Comprehension syntax written with round brackets `(...)` that produces items lazily, one at a time, instead of building the whole collection at once; ideal fed straight into `sum`, `any`, or `max`.'
  - term: iterable
    definition: 'Any object you can call `iter()` on to obtain an iterator — including lists, strings, dictionaries, sets, files, and generators. It is what a `for` loop can walk over.'
  - term: iterator
    definition: 'The object returned by `iter()` that remembers your position in a sequence and yields the next item each time `next()` is called, raising `StopIteration` when exhausted.'
  - term: iterator protocol
    definition: 'The contract every iterator follows: an `__iter__` method that returns the iterator itself and a `__next__` method that returns the next item or raises `StopIteration`. It is what makes `for` work uniformly over any source.'
  - term: lazy evaluation
    definition: 'Computing a value only when it is actually needed, and only as much as is consumed. Generators use lazy evaluation to process arbitrarily large streams while holding almost nothing in memory.'
  - term: yield
    definition: 'The keyword that turns a function into a generator: it hands out one value and pauses the function, remembering all its local state, so execution resumes right after the `yield` on the next `next()` call.'
  - term: StopIteration
    definition: 'The exception an iterator raises when it has no more items. A `for` loop catches it silently as its signal to stop; you also see it when calling `next()` past the end by hand.'
  - term: generator function
    definition: 'A function that uses `yield` instead of `return`; calling it returns a generator object (an iterator) without running the body, which then executes lazily as items are pulled from it.'
  - term: itertools
    definition: 'A Python standard-library module of fast, lazy iterator building blocks — including `chain` (splice iterables into one stream), `islice` (slice an iterator lazily), and `count` (count upward forever).'
