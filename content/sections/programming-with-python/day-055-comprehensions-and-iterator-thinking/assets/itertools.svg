<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four tools.">
  <title>Composable iteration</title>
  <style>
    .itertools-bg   { fill: #f8fafc; }
    .itertools-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .itertools-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .itertools-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .itertools-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .itertools-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .itertools-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .itertools-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .itertools-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .itertools-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .itertools-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .itertools-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .itertools-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .itertools-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .itertools-stage { opacity: 1; }

    .itertools-s0 { animation-delay: 0.00s; }
    .itertools-e0 { animation-delay: 0.00s; }
    .itertools-s1 { animation-delay: 1.28s; }
    .itertools-e1 { animation-delay: 1.28s; }
    .itertools-s2 { animation-delay: 2.56s; }
    .itertools-e2 { animation-delay: 2.56s; }
    .itertools-s3 { animation-delay: 3.84s; }
    .itertools-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .itertools-conn  { animation: itertools-trace 6.4s ease-in-out infinite; }
      .itertools-stage { animation: itertools-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes itertools-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes itertools-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .itertools-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .itertools-stage { animation: itertools-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes itertools-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="itertools-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="itertools-bg" width="980" height="322"/>
  <text class="itertools-h1"  x="30" y="40">Composable iteration</text>
  <text class="itertools-sub" x="30" y="64">Four tools.</text>
  <g class="itertools-stage itertools-s0">
    <rect class="itertools-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="itertools-step" x="44" y="142">01</text>
    <text class="itertools-name" x="70" y="142">Chain: treat several iterables as one</text>
    <text class="itertools-desc" x="44" y="166">Without concatenating them in</text>
    <text class="itertools-desc" x="44" y="182">memory.</text>
  </g>
  <line class="itertools-line itertools-conn itertools-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#itertools-tip)"/>
  <g class="itertools-stage itertools-s1">
    <rect class="itertools-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="itertools-step" x="280" y="142">02</text>
    <text class="itertools-name" x="306" y="142">Islice: take a window without materialising</text>
    <text class="itertools-desc" x="280" y="166">Which is how a generator is</text>
    <text class="itertools-desc" x="280" y="182">sampled.</text>
  </g>
  <line class="itertools-line itertools-conn itertools-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#itertools-tip)"/>
  <g class="itertools-stage itertools-s2">
    <rect class="itertools-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="itertools-step" x="516" y="142">03</text>
    <text class="itertools-name" x="542" y="142">Groupby: group consecutive equal items</text>
    <text class="itertools-desc" x="516" y="166">Which requires the input to be</text>
    <text class="itertools-desc" x="516" y="182">sorted first.</text>
  </g>
  <line class="itertools-line itertools-conn itertools-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#itertools-tip)"/>
  <g class="itertools-stage itertools-s3">
    <rect class="itertools-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="itertools-step" x="752" y="142">04</text>
    <text class="itertools-name" x="778" y="142">And zip: walk several sequences together</text>
    <text class="itertools-desc" x="752" y="166">Stopping at the shortest.</text>
  </g>
  <text class="itertools-sub" x="30" y="304">Grouping only consecutive items is the one that produces wrong answers rather than errors: unsorted input yields many small groups instead of a few large ones.</text>
</svg>
