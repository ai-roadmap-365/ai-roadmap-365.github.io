<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things comprehensions are not</title>
  <style>
    .comprehension-not-bg   { fill: #f8fafc; }
    .comprehension-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .comprehension-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .comprehension-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .comprehension-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .comprehension-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .comprehension-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .comprehension-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .comprehension-not-row { opacity: 1; }
    .comprehension-not-r0 { animation-delay: 0.00s; }
    .comprehension-not-r1 { animation-delay: 0.45s; }
    .comprehension-not-r2 { animation-delay: 0.90s; }
    .comprehension-not-r3 { animation-delay: 1.35s; }
    .comprehension-not-r4 { animation-delay: 1.80s; }
    .comprehension-not-row { animation: comprehension-not-reveal 7.3s ease-in-out infinite; }
    @keyframes comprehension-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="comprehension-not-bg" width="980" height="390"/>
  <text class="comprehension-not-h1"  x="30" y="40">Four things comprehensions are not</text>
  <text class="comprehension-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="comprehension-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="comprehension-not-name" x="46" y="122">The misconception</text>
  <text class="comprehension-not-desc" x="46" y="142">Commonly held.</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r0" x="46" y="182">A comprehension is just shorter syntax</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r1" x="46" y="216">Nested comprehensions read fine</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r2" x="46" y="250">A generator can be iterated repeatedly</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r3" x="46" y="284">Comprehensions are always faster</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r4" x="46" y="318">They are the right tool for side effects</text>
  <rect class="comprehension-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="comprehension-not-name" x="526" y="122">What is true</text>
  <text class="comprehension-not-desc" x="526" y="142">Actually.</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r0" x="526" y="182">It is also faster, having a specialised bytecode path</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r1" x="526" y="216">Two levels is usually the readability limit</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r2" x="526" y="250">It is exhausted after one pass</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r3" x="526" y="284">Only when building a collection</text>
  <text class="comprehension-not-desc comprehension-not-row comprehension-not-r4" x="526" y="318">A loop is clearer when the point is an effect</text>
  <text class="comprehension-not-sub" x="30" y="372">The side-effect row matters for readability: a comprehension whose result is discarded is a loop written to look like an expression.</text>
</svg>
