<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, sans-serif">
  <title>The anatomy of a list comprehension, labelling its three parts: the output expression, the for clause, and the optional if clause</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Anatomy of a comprehension</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#1a202c">Read it as one sentence: "collect n squared, for each n in numbers, when n is even."</text>

  <!-- The comprehension expression, monospace-ish -->
  <rect x="70" y="90" width="620" height="66" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="96" y="132" font-size="24" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">[</text>
  <text x="120" y="132" font-size="24" fill="#1d4ed8" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold">n * n</text>
  <text x="230" y="132" font-size="24" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold">for n in numbers</text>
  <text x="500" y="132" font-size="24" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold">if n % 2 == 0</text>
  <text x="672" y="132" font-size="24" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">]</text>

  <!-- Output expression label -->
  <rect x="70" y="200" width="180" height="88" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="160" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">1. Output expression</text>
  <text x="160" y="246" text-anchor="middle" font-size="13" fill="#1a202c">what to build for</text>
  <text x="160" y="263" text-anchor="middle" font-size="13" fill="#1a202c">each kept item</text>
  <text x="160" y="281" text-anchor="middle" font-size="13" fill="#1d4ed8">(the mapping)</text>
  <line x1="160" y1="196" x2="160" y2="158" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="160,158 154,170 166,170" fill="#1d4ed8"/>

  <!-- for clause label -->
  <rect x="300" y="200" width="180" height="88" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="390" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">2. for clause</text>
  <text x="390" y="246" text-anchor="middle" font-size="13" fill="#1a202c">the source to loop</text>
  <text x="390" y="263" text-anchor="middle" font-size="13" fill="#1a202c">over, one at a time</text>
  <text x="390" y="281" text-anchor="middle" font-size="13" fill="#1d4ed8">(the iterable)</text>
  <line x1="390" y1="196" x2="390" y2="158" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="390,158 384,170 396,170" fill="#1d4ed8"/>

  <!-- if clause label -->
  <rect x="530" y="200" width="180" height="88" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="620" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">3. if clause (optional)</text>
  <text x="620" y="246" text-anchor="middle" font-size="13" fill="#1a202c">keep an item only</text>
  <text x="620" y="263" text-anchor="middle" font-size="13" fill="#1a202c">when this is true</text>
  <text x="620" y="281" text-anchor="middle" font-size="13" fill="#1d4ed8">(the filter)</text>
  <line x1="620" y1="196" x2="620" y2="158" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="620,158 614,170 626,170" fill="#1d4ed8"/>

  <!-- Equivalent loop -->
  <rect x="70" y="320" width="620" height="120" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="8"/>
  <text x="380" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">The same thing written as a loop</text>
  <text x="96" y="372" font-size="15" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">result = []</text>
  <text x="96" y="394" font-size="15" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">for n in numbers:          # the for clause</text>
  <text x="96" y="416" font-size="15" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">    if n % 2 == 0:         # the if clause</text>
  <text x="96" y="434" font-size="15" fill="#1a202c" font-family="ui-monospace, Menlo, Consolas, monospace">        result.append(n * n)   # the output expression</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 160 196 L 160 158" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 390 196 L 390 158" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 620 196 L 620 158" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
