terms:
  - term: 'Quality gate'
    definition: 'A single, reproducible command that runs an ordered set of automated checks over a change and returns one exit code meaning "safe to merge" or "not safe to merge". Three properties make a set of checks into a gate: it is one command, it returns one exit code, and it runs identically everywhere. Everything else — which checks, how strict — is negotiable.'
  - term: 'Continuous integration'
    definition: 'The practice of running the gate automatically on a clean machine on every push, so that integration problems surface within minutes rather than at the end of a project. Named by Grady Booch in 1991 and made a daily practice by Kent Beck''s Extreme Programming in 1999. Continuous integration is where a gate runs; it is not the gate itself.'
  - term: 'Exit code'
    definition: 'The number a program returns to whatever started it: zero means success, anything else means failure. It is the machine-readable half of a gate''s answer — the part a hook, a build server or a merge button can act on without understanding a word of the human-readable output.'
  - term: 'Pre-commit hook'
    definition: 'A script Git runs before a commit is created, which can refuse the commit by exiting non-zero. Fast checks belong in one: formatting, linting, whitespace. The full test suite does not, because a hook that makes committing take twenty seconds gets bypassed with git commit --no-verify within a week.'
  - term: 'Code coverage'
    definition: 'A measurement of which parts of a program were executed during a test run, expressed as a percentage. Described as an idea by Miller and Maloney in 1963. It measures execution, never verification: code can be fully covered and completely unchecked.'
  - term: 'Line coverage'
    definition: 'The fraction of executable lines that ran at least once during a test run. The cheapest coverage measure and the least informative: a line containing a condition counts as covered as soon as it runs, whichever way the condition went.'
  - term: 'Branch coverage'
    definition: 'The fraction of conditional outcomes that occurred — for an if statement, the true path and the false path count separately. Strictly more informative than line coverage, because it can see an else that was never taken. Enabled in coverage.py with branch = true.'
  - term: 'Coverage ratchet'
    definition: 'A coverage floor that only ever moves upward: set it to the project''s current figure, raise it deliberately when the real number rises, and never lower it silently. It cannot make a messy codebase clean, but it makes decline impossible, which is the only thing a coverage number is reliably good at.'
  - term: 'Fail-fast'
    definition: 'Stopping a gate at the first failing stage instead of running the rest. Right when the feedback loop is tight and the cost of a wasted run is your own patience — a local run, a pre-commit hook. Its opposite, running everything and reporting all failures, is right in continuous integration, where a run is expensive to trigger and nobody is watching it.'
  - term: 'Build matrix'
    definition: 'Running the same job once per combination of listed variables — most often several Python versions — in parallel. It is how a support claim gets checked: if a package says it requires Python 3.10 or newer, that is a claim about several interpreters, and a claim nothing verifies is a claim that quietly stops being true.'
  - term: 'Branch protection'
    definition: 'A repository setting that requires named checks to pass before a pull request can be merged, and forbids pushing straight to the protected branch. It lives in the repository''s configuration rather than in the workflow file, and it is what turns a red mark everybody scrolls past into a merge that cannot happen.'
  - term: 'Flaky test'
    definition: 'A test that passes and fails on the same code, usually because it depends on a real clock, a real network call, a shared file, or the order the suite happens to run in. Worse than a missing test, because it teaches everyone that a red build might mean nothing. The discipline is to fix it or delete it — never to retry it.'
  - term: 'Pipeline'
    definition: 'The ordered sequence of stages a change passes through on its way to being merged or deployed. In this lesson the pipeline is the five stages inside check.sh; in a larger system it also includes packaging, deployment and smoke tests. The ordering principle is the same at every scale: cheapest feedback first.'
  - term: 'Artifact'
    definition: 'A file produced by a build or gate run and kept for later inspection — a coverage data file, a built package, a log. In continuous integration, artifacts are uploaded by a step that usually runs even when the gate failed, because a failure is exactly when you want the evidence.'
  - term: 'Clean checkout'
    definition: 'A fresh copy of a repository at one exact commit, on a machine holding nothing else — no editor settings, no globally installed package, no uncommitted file, no environment variable from your shell profile. It is what makes "works on my machine" a testable claim rather than an argument, and it usually disproves it.'
  - term: 'Technical debt'
    definition: 'The accumulated cost of decisions that made a change quick at the time and make every later change slower. A gate does not repay technical debt; it stops new debt being added silently, which is what the ratchet strategy exploits when adopting a gate in an existing messy codebase.'
  - term: 'Ceremony'
    definition: 'A check that costs more attention than it saves — one that fails on things nobody would have fixed anyway, whose failures are routinely overridden, or whose usual fix is adding a suppression comment rather than changing the code. Removing a rule that mainly generates suppressions is not a lowering of standards; it is the removal of a tax funding nothing.'
