visuals:
  - id: quality-gate-architecture
    file: assets/quality-gate-architecture.svg
    type: diagram
    title: 'One gate, two machines, one exit code'
    alt: 'Diagram: the architecture of a quality gate — a developer laptop and a continuous-integration runner both invoking the same check.sh, which runs five ordered stages (format, lint, types, tests, coverage) each configured by its own table in a single pyproject.toml, producing one exit code that branch protection consumes to allow or block a merge'
    description: 'An architecture diagram in three columns. On the left, two callers: a developer laptop carrying its editor, virtual environment and uncommitted files, and a continuous-integration runner that is a clean throwaway machine with a clean checkout and pinned dependencies. Both arrows point into the same middle panel, labelled bash check.sh, which holds five stacked stage boxes in cost order — format (ruff format --check .), lint (ruff check .), types (mypy), tests (coverage run -m pytest) and coverage (coverage report) — annotated with their relative costs from milliseconds to slowest, and a note that the default mode reports all failures while --fail-fast stops at the first. On the right, a single pyproject.toml panel listing the tool tables that configure each stage, with dashed lines connecting each table to the stage it configures and fail_under = 95 called out. Below the gate, one exit code box reading zero means safe to merge and one means not, feeding a branch protection box described as a repository setting rather than a file, which turns the merge button on or off; a note records that without branch protection the gate only reports.'
  - id: gate-execution-flow
    file: assets/gate-execution-flow.svg
    type: flowchart
    title: 'One change, from edit to merge'
    alt: 'Flowchart: a change moving through a quality gate — edit, fast pre-commit hook, push, clean checkout on a CI runner, install pinned dependencies, then the five ordered stages of format, lint, types, tests and coverage, each branching to a fix-and-retry loop back to the developer or onward to the next stage, ending at branch protection which either allows or blocks the merge'
    description: 'A two-band flowchart following one change. The upper band, on your machine and measured in seconds, runs edit to pre-commit hook (fast checks only) to push, with a note that a slow hook gets skipped with --no-verify so it must stay under a second. The lower band, on a clean machine running the same bash check.sh, begins with a clean checkout of one commit and nothing else, then installs pinned dependencies from requirements.txt, then fans into a build matrix across Python 3.10, 3.11 and 3.12. Below that the five stages run in sequence — format asking whether the layout matches, lint asking whether banned patterns appear, types asking whether the annotations hold, tests asking whether the asserted behaviour still holds, coverage asking whether the figure is above the floor — and every stage has a dashed fail branch leading right into a single feedback panel that returns the stage name, the tool''s message and exit 1, and records the difference between --fail-fast stopping there and the default finishing and reporting every failure. When all five are green the flow continues down to branch protection, shown as two terminal outcomes: exit 0 with the merge allowed, and exit 1 with the merge blocked.'
