<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" font-family="system-ui, sans-serif">
  <title>The architecture of a quality gate: a developer laptop and a continuous-integration runner both invoke the same check.sh script, which runs five ordered stages — format, lint, types, tests and coverage — each configured by its own table in a single pyproject.toml, producing one exit code that branch protection consumes to allow or block a merge</title>
  <rect x="0" y="0" width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">One gate, two machines, one exit code</text>

  <!-- Callers -->
  <rect x="30" y="70" width="180" height="86" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="120" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Developer laptop</text>
  <text x="120" y="118" text-anchor="middle" font-size="14" fill="#1a202c">your editor, your venv,</text>
  <text x="120" y="138" text-anchor="middle" font-size="14" fill="#1a202c">your uncommitted files</text>

  <rect x="30" y="184" width="180" height="86" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="120" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CI runner</text>
  <text x="120" y="232" text-anchor="middle" font-size="14" fill="#1a202c">clean throwaway machine,</text>
  <text x="120" y="252" text-anchor="middle" font-size="14" fill="#1a202c">clean checkout, pinned deps</text>

  <text x="120" y="298" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">two environments</text>
  <text x="120" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">one identical command</text>

  <line x1="212" y1="113" x2="266" y2="150" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,153 256,148 262,140" fill="#1a202c"/>
  <line x1="212" y1="227" x2="266" y2="190" stroke="#1a202c" stroke-width="2"/>
  <polygon points="270,187 262,200 256,192" fill="#1a202c"/>

  <!-- The gate -->
  <rect x="272" y="70" width="360" height="420" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="12"/>
  <text x="452" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">bash check.sh</text>
  <text x="452" y="120" text-anchor="middle" font-size="14" fill="#1a202c">stages run cheapest first</text>

  <rect x="296" y="140" width="312" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="312" y="163" font-size="15" font-weight="bold" fill="#1a202c">1. format</text>
  <text x="312" y="183" font-size="14" fill="#1d4ed8">ruff format --check .</text>
  <text x="592" y="173" text-anchor="end" font-size="14" fill="#1a202c">ms</text>

  <rect x="296" y="200" width="312" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="312" y="223" font-size="15" font-weight="bold" fill="#1a202c">2. lint</text>
  <text x="312" y="243" font-size="14" fill="#1d4ed8">ruff check .</text>
  <text x="592" y="233" text-anchor="end" font-size="14" fill="#1a202c">ms</text>

  <rect x="296" y="260" width="312" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="312" y="283" font-size="15" font-weight="bold" fill="#1a202c">3. types</text>
  <text x="312" y="303" font-size="14" fill="#1d4ed8">mypy</text>
  <text x="592" y="293" text-anchor="end" font-size="14" fill="#1a202c">~1 s</text>

  <rect x="296" y="320" width="312" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="312" y="343" font-size="15" font-weight="bold" fill="#1a202c">4. tests</text>
  <text x="312" y="363" font-size="14" fill="#1d4ed8">coverage run -m pytest</text>
  <text x="592" y="353" text-anchor="end" font-size="14" fill="#1a202c">slowest</text>

  <rect x="296" y="380" width="312" height="52" fill="#ffffff" stroke="#1a202c" stroke-width="1.5" rx="6"/>
  <text x="312" y="403" font-size="15" font-weight="bold" fill="#1a202c">5. coverage</text>
  <text x="312" y="423" font-size="14" fill="#1d4ed8">coverage report</text>
  <text x="592" y="413" text-anchor="end" font-size="14" fill="#1a202c">free</text>

  <text x="452" y="462" text-anchor="middle" font-size="14" fill="#1a202c">report all by default · --fail-fast stops at stage 1 failure</text>

  <!-- Config file -->
  <rect x="660" y="140" width="212" height="292" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="766" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">pyproject.toml</text>
  <text x="766" y="186" text-anchor="middle" font-size="14" fill="#1a202c">one file, four tools</text>
  <text x="676" y="216" font-size="14" fill="#1d4ed8">[tool.ruff]</text>
  <text x="676" y="240" font-size="14" fill="#1d4ed8">[tool.ruff.lint]</text>
  <text x="676" y="276" font-size="14" fill="#1d4ed8">[tool.mypy]</text>
  <text x="676" y="336" font-size="14" fill="#1d4ed8">[tool.pytest.ini_options]</text>
  <text x="676" y="360" font-size="14" fill="#1d4ed8">[tool.coverage.run]</text>
  <text x="676" y="396" font-size="14" fill="#1d4ed8">[tool.coverage.report]</text>
  <text x="676" y="418" font-size="14" fill="#1a202c">fail_under = 95</text>

  <line x1="658" y1="222" x2="612" y2="176" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="658" y1="238" x2="612" y2="230" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="658" y1="276" x2="612" y2="288" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="658" y1="338" x2="612" y2="348" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="658" y1="398" x2="612" y2="408" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Exit code -->
  <rect x="332" y="510" width="240" height="56" fill="#ffffff" stroke="#1a202c" stroke-width="2" rx="8"/>
  <text x="452" y="534" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">one exit code</text>
  <text x="452" y="555" text-anchor="middle" font-size="14" fill="#1d4ed8">0 = safe to merge · 1 = not</text>
  <line x1="452" y1="490" x2="452" y2="506" stroke="#1a202c" stroke-width="2"/>
  <polygon points="452,508 446,494 458,494" fill="#1a202c"/>

  <!-- Branch protection -->
  <rect x="612" y="500" width="260" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="742" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Branch protection</text>
  <text x="742" y="545" text-anchor="middle" font-size="14" fill="#1a202c">a repository setting, not a file</text>
  <text x="742" y="566" text-anchor="middle" font-size="14" fill="#1d4ed8">merge button on, or off</text>
  <line x1="574" y1="538" x2="608" y2="538" stroke="#1a202c" stroke-width="2"/>
  <polygon points="610,538 596,532 596,544" fill="#1a202c"/>

  <text x="180" y="530" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">without branch protection</text>
  <text x="180" y="552" text-anchor="middle" font-size="14" font-style="italic" fill="#1d4ed8">the gate only reports</text>
</svg>
