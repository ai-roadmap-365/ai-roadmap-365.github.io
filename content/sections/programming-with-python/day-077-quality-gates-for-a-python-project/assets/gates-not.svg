<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things gates are not</title>
  <style>
    .gates-not-bg   { fill: #f8fafc; }
    .gates-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gates-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gates-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gates-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gates-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gates-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gates-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gates-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gates-not-row { opacity: 1; }
    .gates-not-r0 { animation-delay: 0.00s; }
    .gates-not-r1 { animation-delay: 0.45s; }
    .gates-not-r2 { animation-delay: 0.90s; }
    .gates-not-r3 { animation-delay: 1.35s; }
    .gates-not-r4 { animation-delay: 1.80s; }
    .gates-not-row { animation: gates-not-reveal 7.3s ease-in-out infinite; }
    @keyframes gates-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gates-not-bg" width="980" height="390"/>
  <text class="gates-not-h1"  x="30" y="40">Four things gates are not</text>
  <text class="gates-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="gates-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gates-not-name" x="46" y="122">The misconception</text>
  <text class="gates-not-desc" x="46" y="142">Commonly held.</text>
  <text class="gates-not-desc gates-not-row gates-not-r0" x="46" y="182">More gates means higher quality</text>
  <text class="gates-not-desc gates-not-row gates-not-r1" x="46" y="216">Coverage thresholds measure quality</text>
  <text class="gates-not-desc gates-not-row gates-not-r2" x="46" y="250">A gate can be advisory</text>
  <text class="gates-not-desc gates-not-row gates-not-r3" x="46" y="284">Slow gates are acceptable in the build</text>
  <text class="gates-not-desc gates-not-row gates-not-r4" x="46" y="318">Gates replace review</text>
  <rect class="gates-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gates-not-name" x="526" y="122">What is true</text>
  <text class="gates-not-desc" x="526" y="142">Actually.</text>
  <text class="gates-not-desc gates-not-row gates-not-r0" x="526" y="182">Gates you cannot justify get disabled</text>
  <text class="gates-not-desc gates-not-row gates-not-r1" x="526" y="216">They measure execution, not verification</text>
  <text class="gates-not-desc gates-not-row gates-not-r2" x="526" y="250">An advisory gate is a report</text>
  <text class="gates-not-desc gates-not-row gates-not-r3" x="526" y="284">Slow gates get bypassed or ignored</text>
  <text class="gates-not-desc gates-not-row gates-not-r4" x="526" y="318">They free review for what only people can do</text>
  <text class="gates-not-sub" x="30" y="372">An advisory gate is a contradiction: if failing it does not block anything, it is a dashboard, and dashboards are read once and then forgotten.</text>
</svg>
