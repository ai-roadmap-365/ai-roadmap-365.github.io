questions:
  - question: 'A team runs formatting, linting, type checking, tests and coverage — but as five separate commands documented on a wiki page. What is the main problem?'
    options:
      - 'It is not a gate — five chances to skip, and skipping is silent'
      - 'Five commands run more slowly than one command doing the same work'
      - 'Some of the tools cannot be run from the command line at all'
      - 'The exit codes of five commands cannot be combined into one answer'
    answer_index: 0
    explanation: 'A gate''s value comes from being unavoidable, and only one command can be unavoidable. Five commands is a suggestion with extra steps: each one is a decision, each decision can be skipped, and skipping leaves no trace. This is why the single-command property matters more than any individual check in the gate — a project with only a test suite behind one command is in better shape than a project with five excellent checks nobody runs. The exit codes combine fine; the problem is human, not technical.'

  - question: 'Why do the stages of a gate run in the order format, lint, types, tests, coverage?'
    options:
      - 'Because formatting problems are the most serious and test failures the least'
      - 'The cheapest feedback should arrive soonest'
      - 'Because each stage depends on the output of the one before it'
      - 'Because tools that rewrite files must always run before tools that only read them'
    answer_index: 1
    explanation: 'The ordering is argued entirely from the cost of feedback, not from importance — tests are far more important than formatting and run fourth. Format and lint parse files in milliseconds; types must resolve imports and analyse a package; tests actually execute your code and dominate the total. Putting the cheap checks first means the developer who broke formatting spends four seconds finding out, not four minutes. Note also that a gate must never rewrite the files it judges, which is why ruff format --check is used rather than ruff format.'

  - question: 'When is fail-fast the wrong mode for a gate?'
    options:
      - 'During a local run while iterating on a change'
      - 'In a pre-commit hook, where the developer is waiting for the commit to complete'
      - 'In CI, where one run should report everything wrong'
      - 'Whenever more than three stages are configured'
    answer_index: 2
    explanation: 'Both modes are defensible; the question is who is waiting and what a wasted run costs. Fail-fast suits a tight loop — a hook, or a local run — where re-running is instant and there is no point spending forty seconds on tests to report something you will re-run anyway. Report-everything suits continuous integration, where making someone push, wait four minutes, fix the format error, push, wait four minutes, fix the lint error is a cruelty that a single complete report avoids.'

  - question: 'A test file calls every function in a module and contains no assert statements at all. What does coverage.py report?'
    options:
      - 'Zero percent, because a test with no assertion is not counted as a test'
      - 'An error, because coverage.py refuses to measure a run with no assertions'
      - 'Roughly fifty percent, since only half the work of a test was done'
      - 'Up to one hundred percent — coverage measures lines, not checks'
    answer_index: 3
    explanation: 'This is measurable, and the lab measures it: a two-test file with zero assert statements produces "promo.py 4 0 2 0 100%" for a module that charges members ten percent of the price instead of taking ten percent off. Coverage.py records execution. It has no concept of an assertion and cannot have one. Adding one assertion per test changes nothing about the coverage figure and turns the suite red with "assert 100 == 900" — the gap between covered and correct, in one command.'

  - question: 'Given that 100% coverage proves so little, why keep a coverage floor in the gate at all?'
    options:
      - 'It catches decline: new unexercised code turns it red at once'
      - 'Because a project cannot be released until its coverage reaches one hundred percent'
      - 'Because a high coverage figure is strong evidence that the tests are good'
      - 'Because branch coverage, unlike line coverage, does prove that assertions were made'
    answer_index: 0
    explanation: 'Nobody ever decides to lower a project''s coverage; it happens one reasonable-looking change at a time. A floor turns that invisible slide into a specific red build on a specific day with the exact uncovered line range printed — which is the only kind of event that produces a decision. Hence the rule: a coverage target is a bad goal, because it is trivially gamed by the tests least worth writing, and a good alarm, because "this change dropped coverage by four points" is always worth asking about. Branch coverage is more informative than line coverage but equally blind to assertions.'

  - question: 'What does running the gate on a clean checkout actually prove that running it on your laptop does not?'
    options:
      - 'That the code runs faster on server hardware than on a laptop'
      - 'That the code alone is sufficient, with nothing else required'
      - 'That every test in the suite is deterministic'
      - 'That the pinned dependency versions are the newest available'
    answer_index: 1
    explanation: '"Works on my machine" is an accurate report about hidden state, not an admission of incompetence: your machine has an editor that reformats on save, a package you installed globally two years ago, an environment variable in your shell profile, and a file you created but never committed. A clean checkout removes all of it and asks whether the repository alone suffices. When the answer is no, the difference is real information — usually a missing commit or a missing pin — and no amount of staring at your own machine would have found it.'

  - question: 'A continuous-integration workflow is running and marking pull requests red, but people keep merging anyway. What is missing?'
    options:
      - 'A build matrix covering more Python versions'
      - 'A fail-fast setting in the workflow file'
      - 'Branch protection, which makes the verdict binding'
      - 'An artifact upload step so reviewers can download the logs'
    answer_index: 2
    explanation: 'By itself a workflow only reports: it puts a mark on a pull request. Whether anyone may merge past a red mark is decided by branch protection, a repository setting that requires named checks to pass before the merge button is enabled and forbids pushing straight to the protected branch. It lives in the repository''s configuration, not in the workflow file. A gate without branch protection is a smoke alarm with the battery out — the matrix, the fail-fast flag and the artifacts are all useful, and none of them makes anything binding.'

  - question: 'You inherit a codebase at 41% coverage with two hundred type errors. What is the right way to introduce a gate?'
    options:
      - 'Disable the failing rules globally and revisit the decision in a year'
      - 'Freeze all feature work for three weeks and fix everything, then turn on the full gate at once'
      - 'Turn on the full gate immediately and let the team override failures until the backlog clears'
      - 'Set the floor at 41%, format in one commit, then lint and type one'
    answer_index: 3
    explanation: 'This is the ratchet: freeze the current state as the floor and require only that new code be clean. "Fix everything first" is a plan that will be abandoned, leaving the gate half-installed and disbelieved. Routinely overriding failures teaches everyone the gate means nothing, which is the same damage a flaky test does. And disabling rules globally converts visible debt into invisible debt — where a legacy area genuinely cannot be cleaned, exclude it explicitly by name, so the debt keeps an address. Improvement then happens as a side effect of normal work rather than as a project somebody has to fund.'
