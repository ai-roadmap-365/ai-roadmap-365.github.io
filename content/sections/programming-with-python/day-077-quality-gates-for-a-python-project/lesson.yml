id: D077
day: 77
slug: quality-gates-for-a-python-project
title: 'Quality Gates for a Python Project'
section: programming-with-python
subsection: python-in-practice
week: 11
learning_promise: 'After this lesson you will be able to assemble the week''s separate tools into a single quality gate: one command, runnable identically on a laptop and on a build server, that returns one exit code meaning "safe to merge" — ordered by cost from format through lint, types, tests and coverage; configured entirely in one pyproject.toml; wired into a pre-commit hook for the fast parts and a continuous-integration workflow for the binding parts; measured honestly, so you can say exactly what each stage proves, what it cannot prove, and why 100% coverage means only that lines executed.'
objectives:
  - 'Define a quality gate by its three properties — one command, one exit code, identical execution everywhere — and explain why the single-command property matters more than any individual check inside it'
  - 'Order the stages of a gate by the cost of feedback (format, lint, types, tests, coverage, build) and choose deliberately between fail-fast and run-everything-and-report-all for a given context'
  - 'State in one sentence what each stage proves and what it cannot prove, using the four-tool taxonomy built across Week 11'
  - 'Measure line and branch coverage with coverage.py and pytest-cov, read every column of a real report, and use the Missing column as a worklist'
  - 'Demonstrate that a test file with zero assertions still produces 100% coverage of a module containing a real bug, and therefore treat a coverage figure as an alarm and a ratchet rather than a goal'
  - 'Configure pytest, mypy, Ruff and coverage.py entirely in one pyproject.toml, and explain what one configuration file buys over five separate dotfiles'
  - 'Write a local gate runner in plain bash that resolves its tools rather than assuming them, never rewrites the code it judges, and fails loudly instead of skipping a stage'
  - 'Read a complete continuous-integration workflow line by line — trigger, clean checkout, pinned interpreter, pinned dependencies, the single gate command, the build matrix and its artifacts — and explain why branch protection rather than the workflow file is what blocks a bad merge'
  - 'Judge when a gate pays for itself and when it becomes ceremony, measure the cost of a slow gate in developer attention, handle flaky tests by fixing or deleting rather than retrying, and adopt a gate in a messy codebase with the ratchet strategy instead of "fix everything first"'
prerequisites:
  - 'Days 71-76 of this course: pytest and the first assertion, fixtures and parametrization, test-driven development, mocking at boundaries, mypy, and Ruff — this lesson assembles all six and re-teaches none of them'
  - 'Day 69 (type hints, which mypy checks) and Day 70 (value objects and invariants, which the lab''s package is built from)'
  - 'Day 61 (writing readable code), Day 49 (exit codes), and Day 43 (virtual environments and installing dependencies)'
  - 'Comfort running a bash script from the terminal and editing a TOML file'
reading_time_minutes: 40
practical_time_minutes: 30
