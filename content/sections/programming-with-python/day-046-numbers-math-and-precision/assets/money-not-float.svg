<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A fraction of a cent is a legal problem, not a rounding one.">
  <title>Money is never a float</title>
  <style>
    .money-not-float-bg   { fill: #f8fafc; }
    .money-not-float-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .money-not-float-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .money-not-float-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .money-not-float-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .money-not-float-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .money-not-float-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .money-not-float-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .money-not-float-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .money-not-float-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .money-not-float-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .money-not-float-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .money-not-float-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .money-not-float-row { opacity: 1; }
    .money-not-float-r0 { animation-delay: 0.00s; }
    .money-not-float-r1 { animation-delay: 0.45s; }
    .money-not-float-r2 { animation-delay: 0.90s; }
    .money-not-float-r3 { animation-delay: 1.35s; }
    .money-not-float-r4 { animation-delay: 1.80s; }
    .money-not-float-row { animation: money-not-float-reveal 7.3s ease-in-out infinite; }
    @keyframes money-not-float-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="money-not-float-bg" width="980" height="390"/>
  <text class="money-not-float-h1"  x="30" y="40">Money is never a float</text>
  <text class="money-not-float-sub" x="30" y="64">A fraction of a cent is a legal problem, not a rounding one.</text>
  <rect class="money-not-float-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="money-not-float-name" x="46" y="122">As a float</text>
  <text class="money-not-float-desc" x="46" y="142">Fast, and wrong by fractions.</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r0" x="46" y="182">0.1 + 0.2 is not 0.3</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r1" x="46" y="216">Errors accumulate across a ledger</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r2" x="46" y="250">Totals disagree with the sum of the lines</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r3" x="46" y="284">An auditor can see the discrepancy</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r4" x="46" y="318">And you cannot explain it away</text>
  <rect class="money-not-float-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="money-not-float-name" x="526" y="122">As Decimal, or integer cents</text>
  <text class="money-not-float-desc" x="526" y="142">Exact, and defensible.</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r0" x="526" y="182">Decimal("0.1") + Decimal("0.2") is exactly 0.3</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r1" x="526" y="216">No accumulation of error</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r2" x="526" y="250">Line items sum to the total, exactly</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r3" x="526" y="284">Rounding happens where you decide it does</text>
  <text class="money-not-float-desc money-not-float-row money-not-float-r4" x="526" y="318">Integer minor units work too, and are faster</text>
  <text class="money-not-float-sub" x="30" y="372">Storing amounts as integer cents is the other common answer, and often the better one: it is exact, fast, and removes the question of what precision to configure.</text>
</svg>
