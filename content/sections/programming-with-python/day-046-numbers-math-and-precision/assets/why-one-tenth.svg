<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The same reason one third has no exact decimal.">
  <title>Why one tenth cannot be stored</title>
  <style>
    .why-one-tenth-bg   { fill: #f8fafc; }
    .why-one-tenth-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-one-tenth-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-one-tenth-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-one-tenth-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-one-tenth-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-one-tenth-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-one-tenth-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-one-tenth-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-one-tenth-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-one-tenth-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-one-tenth-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-one-tenth-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-one-tenth-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-one-tenth-stage { opacity: 1; }

    .why-one-tenth-s0 { animation-delay: 0.00s; }
    .why-one-tenth-e0 { animation-delay: 0.00s; }
    .why-one-tenth-s1 { animation-delay: 1.28s; }
    .why-one-tenth-e1 { animation-delay: 1.28s; }
    .why-one-tenth-s2 { animation-delay: 2.56s; }
    .why-one-tenth-e2 { animation-delay: 2.56s; }
    .why-one-tenth-s3 { animation-delay: 3.84s; }
    .why-one-tenth-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-one-tenth-conn  { animation: why-one-tenth-trace 6.4s ease-in-out infinite; }
      .why-one-tenth-stage { animation: why-one-tenth-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes why-one-tenth-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-one-tenth-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-one-tenth-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-one-tenth-stage { animation: why-one-tenth-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-one-tenth-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-one-tenth-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-one-tenth-bg" width="980" height="322"/>
  <text class="why-one-tenth-h1"  x="30" y="40">Why one tenth cannot be stored</text>
  <text class="why-one-tenth-sub" x="30" y="64">The same reason one third has no exact decimal.</text>
  <g class="why-one-tenth-stage why-one-tenth-s0">
    <rect class="why-one-tenth-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="why-one-tenth-step" x="44" y="142">01</text>
    <text class="why-one-tenth-name" x="70" y="142">Binary fractions are halves</text>
    <text class="why-one-tenth-desc" x="44" y="166">1/2, 1/4, 1/8 — each place is</text>
    <text class="why-one-tenth-desc" x="44" y="182">half the one before it.</text>
    <text class="why-one-tenth-edge" x="44" y="242">powers of 2</text>
  </g>
  <line class="why-one-tenth-line why-one-tenth-conn why-one-tenth-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#why-one-tenth-tip)"/>
  <g class="why-one-tenth-stage why-one-tenth-s1">
    <rect class="why-one-tenth-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="why-one-tenth-step" x="280" y="142">02</text>
    <text class="why-one-tenth-name" x="306" y="142">So 0.5, 0.25, 0.375 are exact</text>
    <text class="why-one-tenth-desc" x="280" y="166">Their denominators are powers of</text>
    <text class="why-one-tenth-desc" x="280" y="182">two. Nothing is lost.</text>
  </g>
  <line class="why-one-tenth-line why-one-tenth-conn why-one-tenth-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#why-one-tenth-tip)"/>
  <g class="why-one-tenth-stage why-one-tenth-s2">
    <rect class="why-one-tenth-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="why-one-tenth-step" x="516" y="142">03</text>
    <text class="why-one-tenth-name" x="542" y="142">One tenth is not</text>
    <text class="why-one-tenth-desc" x="516" y="166">In binary it repeats forever, as</text>
    <text class="why-one-tenth-desc" x="516" y="182">one third does in decimal.</text>
    <text class="why-one-tenth-edge" x="516" y="242">repeating</text>
  </g>
  <line class="why-one-tenth-line why-one-tenth-conn why-one-tenth-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#why-one-tenth-tip)"/>
  <g class="why-one-tenth-stage why-one-tenth-s3">
    <rect class="why-one-tenth-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="why-one-tenth-step" x="752" y="142">04</text>
    <text class="why-one-tenth-name" x="778" y="142">So it is rounded to the nearest</text>
    <text class="why-one-tenth-desc" x="752" y="166">Stored as</text>
    <text class="why-one-tenth-desc" x="752" y="182">0.1000000000000000055511151231257827...</text>
    <text class="why-one-tenth-edge" x="752" y="242">nearest</text>
  </g>
  <text class="why-one-tenth-sub" x="30" y="304">Nothing is broken and nothing is Python-specific: this is IEEE 754, implemented in the processor, and every language on the machine gives the same answer.</text>
</svg>
