<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Half the memory, half the mantissa.">
  <title>Lower precision is a deliberate trade</title>
  <style>
    .float-precision-tradeoff-bg   { fill: #f8fafc; }
    .float-precision-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-precision-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-precision-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-precision-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-precision-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .float-precision-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .float-precision-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .float-precision-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .float-precision-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .float-precision-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .float-precision-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .float-precision-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .float-precision-tradeoff-row { opacity: 1; }
    .float-precision-tradeoff-r0 { animation-delay: 0.00s; }
    .float-precision-tradeoff-r1 { animation-delay: 0.45s; }
    .float-precision-tradeoff-r2 { animation-delay: 0.90s; }
    .float-precision-tradeoff-r3 { animation-delay: 1.35s; }
    .float-precision-tradeoff-r4 { animation-delay: 1.80s; }
    .float-precision-tradeoff-row { animation: float-precision-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes float-precision-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="float-precision-tradeoff-bg" width="980" height="390"/>
  <text class="float-precision-tradeoff-h1"  x="30" y="40">Lower precision is a deliberate trade</text>
  <text class="float-precision-tradeoff-sub" x="30" y="64">Half the memory, half the mantissa.</text>
  <rect class="float-precision-tradeoff-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="float-precision-tradeoff-name" x="46" y="122">float32</text>
  <text class="float-precision-tradeoff-desc" x="46" y="142">The usual default.</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r0" x="46" y="182">4 bytes per value</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r1" x="46" y="216">24 bits of significand</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r2" x="46" y="250">Wide enough range for most work</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r3" x="46" y="284">Safe for gradients and small values</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r4" x="46" y="318">The baseline for training</text>
  <rect class="float-precision-tradeoff-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="float-precision-tradeoff-name" x="526" y="122">float16</text>
  <text class="float-precision-tradeoff-desc" x="526" y="142">Half the memory and bandwidth.</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r0" x="526" y="182">2 bytes per value</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r1" x="526" y="216">11 bits of significand</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r2" x="526" y="250">Much narrower range</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r3" x="526" y="284">Small gradients can underflow to zero</text>
  <text class="float-precision-tradeoff-desc float-precision-tradeoff-row float-precision-tradeoff-r4" x="526" y="318">Which is why loss scaling exists</text>
  <text class="float-precision-tradeoff-sub" x="30" y="372">This is the same trade this lesson describes, at a smaller mantissa. Halving the memory doubles the batch that fits — and the underflow risk is real, which is why mixed precision keeps some operations at higher precision deliberately.</text>
</svg>
