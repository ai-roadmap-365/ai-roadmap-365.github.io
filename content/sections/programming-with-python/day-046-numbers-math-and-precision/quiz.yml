questions:
  - question: 'In Python, what does the expression 0.1 + 0.2 == 0.3 evaluate to, and why?'
    options:
      - 'True, because Python rounds all decimals to two places automatically'
      - 'False — 0.1, 0.2 and 0.3 are not exact in binary, so it is off'
      - 'True, because floating-point arithmetic is always exact'
      - 'It raises an error, because you cannot compare floats'
    answer_index: 1
    explanation: 'Each of 0.1, 0.2, and 0.3 is stored as the nearest available binary fraction, and the rounding errors do not cancel: 0.1 + 0.2 is stored as 0.30000000000000004, which is not the stored value of 0.3, so the comparison is False.'

  - question: 'Which numeric type should you use to total a shopping cart so the amount reconciles exactly to the cent?'
    options:
      - 'float, because it is the fastest'
      - 'int, because money is always whole numbers'
      - 'Decimal, because it does exact base-10 arithmetic'
      - 'complex, because it has two parts'
    answer_index: 2
    explanation: 'Decimal performs exact base-10 arithmetic, so decimal fractions like 0.10 and 0.20 add up exactly. float uses base-2 and introduces rounding error; Decimal (or integer cents) is the correct choice for money.'

  - question: 'What is the difference between 7 / 2 and 7 // 2 in Python 3?'
    options:
      - 'They are identical; both give 3.5'
      - '7 / 2 gives 3 (an int) and 7 // 2 gives 3.5 (a float)'
      - '7 // 2 raises an error because you cannot floor-divide odd numbers'
      - '7 / 2 gives 3.5 (float); 7 // 2 gives 3 (floor)'
    answer_index: 3
    explanation: 'In Python 3, / is true division and always returns a float (7 / 2 is 3.5), while // is floor division that divides and rounds down to a whole number (7 // 2 is 3).'

  - question: 'You need to check whether two computed floats are effectively equal. What is the recommended approach?'
    options:
      - 'Use math.isclose(a, b), which tests equality within a small tolerance'
      - 'Use == directly; float comparison is always exact'
      - 'Convert both to strings and compare the strings'
      - 'Multiply both by 1000 and hope they match'
    answer_index: 0
    explanation: 'Because floats carry tiny rounding errors, == often reports False for values that are mathematically equal. math.isclose(a, b) returns True when the values are within a small tolerance, which is the correct way to compare computed floats.'

  - question: 'Why is Decimal("0.1") exact but Decimal(0.1) is not?'
    options:
      - 'There is no difference; both are exact'
      - 'Decimal(0.1) copies the float''s error; the string is exact'
      - 'Decimal("0.1") is actually the inexact one'
      - 'Decimal(0.1) rounds to the nearest whole number'
    answer_index: 1
    explanation: 'Decimal(0.1) receives the float 0.1, which already holds 0.1000000000000000055..., and stores that error. Decimal("0.1") parses the string "0.1" and stores exactly one tenth. Always build money Decimals from strings.'

  - question: 'What is special about Python''s int type compared with integers in many other languages?'
    options:
      - 'Python ints are limited to 64 bits and overflow silently'
      - 'Python ints are stored as floats internally'
      - 'Python ints have arbitrary precision and never overflow'
      - 'Python ints can only hold values up to one million'
    answer_index: 2
    explanation: 'Python integers have arbitrary precision: they are exact and unbounded, growing to use as much memory as needed, so an expression like 2 ** 100 produces the full exact 31-digit result with no overflow.'

  - question: 'A colleague uses Python''s random module to generate password-reset tokens. What is the problem?'
    options:
      - 'random is too slow for generating tokens'
      - 'There is no problem; random is cryptographically secure'
      - 'random only produces whole numbers'
      - 'random is predictable; use the secrets module'
    answer_index: 3
    explanation: 'The random module uses a predictable Mersenne Twister generator: given enough outputs its future values can be reconstructed. For anything that must be unguessable — tokens, passwords, one-time codes — use the secrets module, which draws from a cryptographically secure source.'

  - question: 'What do the 52 mantissa bits and 11 exponent bits of a 64-bit float control, respectively?'
    options:
      - 'The mantissa controls precision; the exponent controls range'
      - 'The mantissa controls the sign and the exponent controls the color'
      - 'Both control only the range'
      - 'The mantissa controls range and the exponent controls precision'
    answer_index: 0
    explanation: 'In IEEE 754 double precision, the 52 mantissa (fraction) bits set the precision — about 15 to 17 significant decimal digits — while the 11 exponent bits set the scale, giving the enormous range up to about 1.8 x 10^308.'
