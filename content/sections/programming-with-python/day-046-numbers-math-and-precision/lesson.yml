learning_promise: 'After this lesson you will be able to choose the right Python number type for any task, explain why 0.1 + 0.2 is not exactly 0.3, compare floats safely, and use the decimal module for exact money math.'
objectives:
  - 'Distinguish Python''s numeric types — int (exact, unlimited), float (fast, approximate), Decimal (exact base-10), and Fraction (exact ratio) — and pick the right one for a task'
  - 'Use the arithmetic operators + - * / // % ** correctly, and explain why / always returns a float while // stays an exact integer operation'
  - 'Explain, in terms of binary and a fixed mantissa, why floating-point cannot represent 0.1 exactly, and connect it to the base-10 impossibility of writing one third'
  - 'Compare floats safely with math.isclose or rounding instead of ==, and know when each is appropriate'
  - 'Compute an exact currency total with the decimal module, building Decimals from strings rather than floats'
  - 'Use floor division and modulo to split whole quantities into units and remainders without any rounding error'
  - 'Connect float precision to machine-learning practice: why float32/float16/bfloat16 choices trade memory, speed, and accuracy, and what quantization gives up'
prerequisites:
  - 'Day 45 — Variables, Types, and Assignment (you can create variables and read basic Python)'
  - 'Day 43 — Python installed and runnable as python3'
  - 'Day 4 — binary and data representation (numbers are bit patterns)'
