terms:
  - term: int
    definition: 'Python''s integer type: an exact whole number with arbitrary precision, meaning it grows as large as memory allows and never overflows.'
  - term: float
    definition: 'Python''s floating-point type: a number with a decimal point stored in 64 bits as an IEEE 754 double, fast and wide-ranging but limited to about 15 to 17 significant digits of precision.'
  - term: IEEE 754
    definition: 'The international standard, published in 1985, that defines how binary floating-point numbers are laid out in bits and how arithmetic on them rounds, so the same program gives the same result on any conforming hardware.'
  - term: floating-point error
    definition: 'The small, deterministic rounding difference that arises because most decimal fractions (like 0.1) have no exact representation in binary and must be stored as the nearest available value.'
  - term: mantissa
    definition: 'The field of a floating-point number that holds its significant binary digits (also called the fraction); a 64-bit double has 52 mantissa bits, which set its precision.'
  - term: exponent
    definition: 'The field of a floating-point number that sets the scale — which power of two the mantissa is multiplied by; a 64-bit double has 11 exponent bits, which set its range.'
  - term: floor division
    definition: 'The // operator, which divides two numbers and rounds the result down to a whole number (toward negative infinity); 7 // 2 is 3.'
  - term: modulo
    definition: 'The % operator, which returns the remainder left over after floor division; 7 % 2 is 1, and (a // b) * b + (a % b) always reconstructs a.'
  - term: Decimal
    definition: 'A standard-library type (from the decimal module) that performs exact base-10 arithmetic to a chosen precision, correct for money; build it from a string, as Decimal("0.1"), never from a float.'
  - term: Fraction
    definition: 'A standard-library type (from the fractions module) that stores a number as an exact ratio of two integers, so values like one third stay exact through arithmetic.'
  - term: math.isclose
    definition: 'A function in the math module that reports whether two floats are equal within a small tolerance; the correct way to compare computed floats instead of using ==.'
  - term: rounding
    definition: 'Reducing a number to a chosen number of digits; Python''s built-in round uses banker''s rounding (round half to even), so round(2.5) is 2 and round(3.5) is 4.'
  - term: quantization
    definition: 'Storing numbers with fewer bits (for example a model''s parameters in 8 bits instead of 32) to save memory and bandwidth, at the cost of coarser precision.'
