visuals:
  - id: float-representation
    file: assets/float-representation.svg
    type: architecture
    title: 'How a 64-bit float is stored'
    alt: 'Diagram: a 64-bit float split into sign, exponent, and mantissa, and why one tenth cannot be stored exactly'
    description: 'A double-precision float shown as its three fields — 1 sign bit, 11 exponent bits for scale, and 52 mantissa bits for precision — followed by the reason one tenth cannot be exact: like one third in base 10, one tenth in base 2 repeats forever and must be rounded to the nearest storable value.'
  - id: number-types
    file: assets/number-types.svg
    type: diagram
    title: 'Four Python number types compared'
    alt: 'Diagram: int, float, Decimal, and Fraction compared with the trade-off each makes'
    description: 'A stacked comparison of int (exact, unlimited whole numbers), float (fast, approximate, wide range), Decimal (exact base-10 for money), and Fraction (exact ratios, slowest), with a rule of thumb for choosing among them.'
  - id: exact-or-approximate
    file: assets/exact-or-approximate.svg
    type: diagram
    title: 'Two number systems, two different promises'
    alt: 'Diagram: exact integer arithmetic compared with approximate float arithmetic'
    description: 'A two-column comparison of Python integers and floats, covering exactness, range, speed and the arithmetic guarantees each offers.'
  - id: why-one-tenth
    file: assets/why-one-tenth.svg
    type: diagram
    title: 'Why one tenth cannot be stored'
    alt: 'Diagram: why the decimal fraction one tenth repeats in binary'
    description: 'A four-stage explanation of binary fractions showing that only denominators that are powers of two terminate, so one tenth repeats forever and must be rounded.'
  - id: equals-or-isclose
    file: assets/equals-or-isclose.svg
    type: diagram
    title: 'Never compare floats with =='
    alt: 'Diagram: exact float equality compared with a tolerance check'
    description: 'A two-column comparison of testing float equality with the equality operator against using a tolerance, and why the tolerance form asks the meaningful question.'
  - id: floor-and-modulo
    file: assets/floor-and-modulo.svg
    type: diagram
    title: 'Division has three answers in Python'
    alt: 'Diagram: true division, floor division and modulo in Python'
    description: 'A four-stage reference to Python''s division operators covering true division, floor division, the sign of the modulo result, and banker''s rounding.'
  - id: decimal-from-string
    file: assets/decimal-from-string.svg
    type: diagram
    title: 'Construct Decimal from a string'
    alt: 'Diagram: constructing a Decimal from a float compared with from a string'
    description: 'A two-column comparison of creating a Decimal from a float literal against creating it from a string, showing that the float''s rounding error is inherited.'
  - id: nan-propagates
    file: assets/nan-propagates.svg
    type: diagram
    title: 'Why one nan ruins everything downstream'
    alt: 'Diagram: how a nan value spreads through subsequent computations'
    description: 'A four-stage sequence showing a nan entering a dataset, propagating through arithmetic, defeating equality comparison, and surfacing far from its cause.'
  - id: float-precision-tradeoff
    file: assets/float-precision-tradeoff.svg
    type: diagram
    title: 'Lower precision is a deliberate trade'
    alt: 'Diagram: 32-bit floats compared with 16-bit floats'
    description: 'A two-column comparison of single and half precision floating point, covering memory, range, precision and the risks of the lower format in machine learning.'
  - id: summing-error
    file: assets/summing-error.svg
    type: diagram
    title: 'Why a long sum drifts'
    alt: 'Diagram: how rounding error accumulates across a long summation'
    description: 'A four-stage explanation of accumulated floating-point error in summation, covering per-operation rounding, the growth of total error, non-associativity, and compensated summation.'
  - id: money-not-float
    file: assets/money-not-float.svg
    type: diagram
    title: 'Money is never a float'
    alt: 'Diagram: representing currency with floats compared with Decimal'
    description: 'A two-column comparison of representing monetary amounts as floats against Decimal or integer minor units, covering exactness and auditability.'
