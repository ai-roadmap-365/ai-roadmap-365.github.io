questions:
  - question: "Why is establishing a simple domain heuristic baseline (e.g. basic business IF/THEN rule) mandatory before deploying a complex machine learning model?"
    options:
      - "To prove that the complex model provides meaningful commercial and statistical lift over existing simple business logic, justifying its added latency, infrastructure cost, and maintenance overhead."
      - "Because scikit-learn will refuse to fit decision trees without a baseline."
      - "Because deep neural networks require domain rules to initialize backpropagation weights."
      - "To satisfy Python GIL thread concurrency constraints."
    answer_index: 0
    explanation: "If a 500-tree gradient booster or neural network only provides a 0.2% improvement over a 2-line domain heuristic, the added engineering complexity, inference latency, and maintenance risk are not justified."

  - question: "In Andrew Ng's systematic error analysis methodology, how is the Error Reduction Ceiling for a specific error category computed?"
    options:
      - "Ceiling = (Count of Errors in Category) / (Total Number of Validation Samples). It represents the maximum possible increase in global accuracy if that specific category is 100% resolved."
      - "By running grid search on learning rate across 100 epochs."
      - "By taking the logarithm of the training loss curve."
      - "By computing the determinant of the covariance matrix."
    answer_index: 0
    explanation: "If a model makes 100 total errors out of 1,000 validation samples, and 40 errors are caused by label noise, the maximum possible global accuracy gain from perfectly fixing labels is 40 / 1000 = +4.0%."

  - question: "What is the primary danger of relying purely on an aggregated global evaluation metric (e.g. Overall 93% Accuracy) across a full test set?"
    options:
      - "The high global average can completely mask catastrophic failure rates (e.g. 50% accuracy) on critical but smaller subpopulations, VIP customer cohorts, or rare edge-case operating environments."
      - "Global metrics cause floating-point underflow in GPU registers."
      - "Global metrics are not supported by scikit-learn."
      - "Aggregated scores require quadratic memory complexity."
    answer_index: 0
    explanation: "Simpson's Paradox and class imbalance mean that high overall accuracy often conceals severe localized failures on critical demographic or operational slices."

  - question: "What is a DummyClassifier(strategy='most_frequent') used for in production baseline benchmarking?"
    options:
      - "It represents the trivial statistical floor by always predicting the single most common class in the training dataset, setting the minimum benchmark any real model must easily beat."
      - "It generates random synthetic features for data augmentation."
      - "It cleans missing values in SQL databases."
      - "It compresses tree models for mobile deployment."
    answer_index: 0
    explanation: "In an imbalanced dataset where 95% of transactions are legitimate, a Dummy majority baseline achieves 95% accuracy by default. Any real machine learning model must achieve significant lift above this trivial floor."

  - question: "What distinguishes Data-Centric AI from Model-Centric AI during error resolution?"
    options:
      - "Data-Centric AI holds the model architecture fixed and systematically improves the quality, consistency, and annotations of the training data, whereas Model-Centric AI keeps dirty data fixed and repeatedly tweaks algorithms."
      - "Data-Centric AI only uses SQL databases."
      - "Model-Centric AI does not use gradient descent."
      - "Data-Centric AI is restricted to unsupervised clustering."
    answer_index: 0
    explanation: "Andrew Ng championed Data-Centric AI: when error analysis reveals that failures stem from mislabeled samples, missing context, or blurred images, engineering effort is focused on cleaning the data rather than endlessly tuning hyperparameters."
