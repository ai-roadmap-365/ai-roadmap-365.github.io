<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are organisational.">
  <title>Four consequences of baselines</title>
  <style>
    .baseline-implications-bg   { fill: #f8fafc; }
    .baseline-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .baseline-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .baseline-implications-stage { opacity: 1; }

    .baseline-implications-s0 { animation-delay: 0.00s; }
    .baseline-implications-e0 { animation-delay: 0.00s; }
    .baseline-implications-s1 { animation-delay: 1.28s; }
    .baseline-implications-e1 { animation-delay: 1.28s; }
    .baseline-implications-s2 { animation-delay: 2.56s; }
    .baseline-implications-e2 { animation-delay: 2.56s; }
    .baseline-implications-s3 { animation-delay: 3.84s; }
    .baseline-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .baseline-implications-conn  { animation: baseline-implications-trace 6.4s ease-in-out infinite; }
      .baseline-implications-stage { animation: baseline-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes baseline-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes baseline-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .baseline-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .baseline-implications-stage { animation: baseline-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes baseline-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="baseline-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="baseline-implications-bg" width="980" height="322"/>
  <text class="baseline-implications-h1"  x="30" y="40">Four consequences of baselines</text>
  <text class="baseline-implications-sub" x="30" y="64">Two are organisational.</text>
  <g class="baseline-implications-stage baseline-implications-s0">
    <rect class="baseline-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-implications-step" x="44" y="142">01</text>
    <text class="baseline-implications-name" x="70" y="142">They decide whether to continue at all</text>
    <text class="baseline-implications-desc" x="44" y="166">Which is the most valuable</text>
    <text class="baseline-implications-desc" x="44" y="182">decision they inform.</text>
  </g>
  <line class="baseline-implications-line baseline-implications-conn baseline-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#baseline-implications-tip)"/>
  <g class="baseline-implications-stage baseline-implications-s1">
    <rect class="baseline-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-implications-step" x="280" y="142">02</text>
    <text class="baseline-implications-name" x="306" y="142">And error analysis directs effort to what matters</text>
    <text class="baseline-implications-desc" x="280" y="166">Rather than to what is</text>
    <text class="baseline-implications-desc" x="280" y="182">interesting.</text>
  </g>
  <line class="baseline-implications-line baseline-implications-conn baseline-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#baseline-implications-tip)"/>
  <g class="baseline-implications-stage baseline-implications-s2">
    <rect class="baseline-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-implications-step" x="516" y="142">03</text>
    <text class="baseline-implications-name" x="542" y="142">While honest comparison sets expectations</text>
    <text class="baseline-implications-desc" x="516" y="166">Against the rule being replaced,</text>
    <text class="baseline-implications-desc" x="516" y="182">not against zero.</text>
  </g>
  <line class="baseline-implications-line baseline-implications-conn baseline-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#baseline-implications-tip)"/>
  <g class="baseline-implications-stage baseline-implications-s3">
    <rect class="baseline-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="baseline-implications-step" x="752" y="142">04</text>
    <text class="baseline-implications-name" x="778" y="142">And the ceiling estimate says when to stop</text>
    <text class="baseline-implications-desc" x="752" y="166">Which prevents indefinite</text>
    <text class="baseline-implications-desc" x="752" y="182">optimisation.</text>
  </g>
  <text class="baseline-implications-sub" x="30" y="304">Knowing when to stop is worth as much as knowing what to try, and a ceiling estimate provides it before rather than after the effort is spent.</text>
</svg>
