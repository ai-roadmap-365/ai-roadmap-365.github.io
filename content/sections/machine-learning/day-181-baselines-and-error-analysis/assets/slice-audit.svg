<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Slice-based auditing</title>
  <style>
    .slice-audit-bg   { fill: #f8fafc; }
    .slice-audit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slice-audit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slice-audit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slice-audit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slice-audit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slice-audit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slice-audit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slice-audit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slice-audit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slice-audit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slice-audit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slice-audit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .slice-audit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .slice-audit-stage { opacity: 1; }

    .slice-audit-s0 { animation-delay: 0.00s; }
    .slice-audit-e0 { animation-delay: 0.00s; }
    .slice-audit-s1 { animation-delay: 1.28s; }
    .slice-audit-e1 { animation-delay: 1.28s; }
    .slice-audit-s2 { animation-delay: 2.56s; }
    .slice-audit-e2 { animation-delay: 2.56s; }
    .slice-audit-s3 { animation-delay: 3.84s; }
    .slice-audit-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .slice-audit-conn  { animation: slice-audit-trace 6.4s ease-in-out infinite; }
      .slice-audit-stage { animation: slice-audit-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes slice-audit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes slice-audit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .slice-audit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .slice-audit-stage { animation: slice-audit-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes slice-audit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="slice-audit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="slice-audit-bg" width="980" height="322"/>
  <text class="slice-audit-h1"  x="30" y="40">Slice-based auditing</text>
  <text class="slice-audit-sub" x="30" y="64">Four steps.</text>
  <g class="slice-audit-stage slice-audit-s0">
    <rect class="slice-audit-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="slice-audit-step" x="44" y="142">01</text>
    <text class="slice-audit-name" x="70" y="142">Define slices that matter to the business</text>
    <text class="slice-audit-desc" x="44" y="166">Region, customer size, product</text>
    <text class="slice-audit-desc" x="44" y="182">line, time of day.</text>
  </g>
  <line class="slice-audit-line slice-audit-conn slice-audit-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#slice-audit-tip)"/>
  <g class="slice-audit-stage slice-audit-s1">
    <rect class="slice-audit-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="slice-audit-step" x="280" y="142">02</text>
    <text class="slice-audit-name" x="306" y="142">Measure the metric within each</text>
    <text class="slice-audit-desc" x="280" y="166">Not only overall.</text>
  </g>
  <line class="slice-audit-line slice-audit-conn slice-audit-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#slice-audit-tip)"/>
  <g class="slice-audit-stage slice-audit-s2">
    <rect class="slice-audit-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="slice-audit-step" x="516" y="142">03</text>
    <text class="slice-audit-name" x="542" y="142">The aggregate can meet target while a slice fails badly</text>
    <text class="slice-audit-desc" x="516" y="166">Which is the normal case, not</text>
    <text class="slice-audit-desc" x="516" y="182">the exception.</text>
  </g>
  <line class="slice-audit-line slice-audit-conn slice-audit-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#slice-audit-tip)"/>
  <g class="slice-audit-stage slice-audit-s3">
    <rect class="slice-audit-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="slice-audit-step" x="752" y="142">04</text>
    <text class="slice-audit-name" x="778" y="142">And a failing slice is a specific, fixable problem</text>
    <text class="slice-audit-desc" x="752" y="166">Rather than a diffuse one.</text>
  </g>
  <text class="slice-audit-sub" x="30" y="304">This is the same practice as subgroup fairness auditing applied to business dimensions, and it typically finds more actionable problems than model tuning does.</text>
</svg>
