<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What baselines are not</title>
  <style>
    .baseline-not-bg   { fill: #f8fafc; }
    .baseline-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .baseline-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .baseline-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .baseline-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .baseline-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .baseline-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .baseline-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .baseline-not-row { opacity: 1; }
    .baseline-not-r0 { animation-delay: 0.00s; }
    .baseline-not-r1 { animation-delay: 0.45s; }
    .baseline-not-r2 { animation-delay: 0.90s; }
    .baseline-not-r3 { animation-delay: 1.35s; }
    .baseline-not-r4 { animation-delay: 1.80s; }
    .baseline-not-row { animation: baseline-not-reveal 7.3s ease-in-out infinite; }
    @keyframes baseline-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="baseline-not-bg" width="980" height="390"/>
  <text class="baseline-not-h1"  x="30" y="40">What baselines are not</text>
  <text class="baseline-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="baseline-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="baseline-not-name" x="46" y="122">The misconception</text>
  <text class="baseline-not-desc" x="46" y="142">Commonly held.</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r0" x="46" y="182">Baselines are a formality</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r1" x="46" y="216">Beating chance means the model works</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r2" x="46" y="250">Error analysis is for when things go wrong</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r3" x="46" y="284">Aggregate metrics are enough</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r4" x="46" y="318">Model search is the way to improve</text>
  <rect class="baseline-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="baseline-not-name" x="526" y="122">What is true</text>
  <text class="baseline-not-desc" x="526" y="142">Actually.</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r0" x="526" y="182">They decide whether the project is worth continuing</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r1" x="526" y="216">It must beat the rule it replaces</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r2" x="526" y="250">It is the highest-return routine activity</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r3" x="526" y="284">Slices reveal what averages hide</text>
  <text class="baseline-not-desc baseline-not-row baseline-not-r4" x="526" y="318">Error analysis beats it, consistently</text>
  <text class="baseline-not-sub" x="30" y="372">A model that beats chance and loses to a three-line business rule is a common and expensive outcome, and only the second tier of the ladder detects it.</text>
</svg>
