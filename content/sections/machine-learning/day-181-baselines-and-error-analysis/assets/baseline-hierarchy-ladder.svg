<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Baseline Hierarchy Ladder</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-tier1 { fill: #334155; stroke: #64748b; stroke-width: 2; rx: 8; }
    .box-tier2 { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .box-tier3 { fill: #065f46; stroke: #10b981; stroke-width: 2; rx: 8; }
    .box-tier4 { fill: #581c87; stroke: #a855f7; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .wire { stroke: var(--border-subtle, #475569); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">The Four-Tier Model Performance Baseline Ladder</text>
  <text x="450" y="65" class="text-sub">Every Complex Architecture Must Earn its Right to Exist</text>

  <!-- Tier 1: Trivial Baseline -->
  <rect x="150" y="360" width="600" height="65" class="box-tier1" />
  <text x="450" y="388" class="text-title">Tier 1: Trivial Statistical Baseline</text>
  <text x="450" y="410" class="text-sub">DummyClassifier (Majority Class / Stratified) / DummyRegressor (Mean/Median)</text>

  <!-- Tier 2: Domain Heuristic -->
  <rect x="150" y="270" width="600" height="65" class="box-tier2" />
  <text x="450" y="298" class="text-title">Tier 2: Simple Domain Rule / Heuristic</text>
  <text x="450" y="320" class="text-sub">Business rule (e.g. 'If user logged in &gt; 5 times, predict retained')</text>

  <!-- Tier 3: Linear Model -->
  <rect x="150" y="180" width="600" height="65" class="box-tier3" />
  <text x="450" y="208" class="text-title">Tier 3: Standard Linear / Regularized Baseline</text>
  <text x="450" y="230" class="text-sub">Logistic Regression with L2 Penalty / Ridge Regression</text>

  <!-- Tier 4: Complex Candidate -->
  <rect x="150" y="90" width="600" height="65" class="box-tier4" />
  <text x="450" y="118" class="text-title">Tier 4: Complex Deep Learning / GBDT Candidate</text>
  <text x="450" y="140" class="text-sub">XGBoost / LightGBM / Deep Neural Network (Must justify latency &amp; complexity!)</text>

  <!-- Arrows -->
  <line x1="450" y1="360" x2="450" y2="335" class="wire" />
  <line x1="450" y1="270" x2="450" y2="245" class="wire" />
  <line x1="450" y1="180" x2="450" y2="155" class="wire" />
</svg>
