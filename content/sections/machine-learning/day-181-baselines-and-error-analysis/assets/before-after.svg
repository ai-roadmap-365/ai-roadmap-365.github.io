<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The question that gives a number meaning.">
  <title>Compared with what</title>
  <style>
    .before-after-bg   { fill: #f8fafc; }
    .before-after-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-after-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-after-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-after-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-after-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .before-after-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .before-after-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .before-after-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .before-after-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .before-after-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .before-after-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .before-after-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .before-after-row { opacity: 1; }
    .before-after-r0 { animation-delay: 0.00s; }
    .before-after-r1 { animation-delay: 0.45s; }
    .before-after-r2 { animation-delay: 0.90s; }
    .before-after-r3 { animation-delay: 1.35s; }
    .before-after-r4 { animation-delay: 1.80s; }
    .before-after-row { animation: before-after-reveal 7.3s ease-in-out infinite; }
    @keyframes before-after-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="before-after-bg" width="980" height="390"/>
  <text class="before-after-h1"  x="30" y="40">Compared with what</text>
  <text class="before-after-sub" x="30" y="64">The question that gives a number meaning.</text>
  <rect class="before-after-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="before-after-name" x="46" y="122">No comparison</text>
  <text class="before-after-desc" x="46" y="142">A number alone.</text>
  <text class="before-after-desc before-after-row before-after-r0" x="46" y="182">Eighty-five percent accurate</text>
  <text class="before-after-desc before-after-row before-after-r1" x="46" y="216">Sounds impressive</text>
  <text class="before-after-desc before-after-row before-after-r2" x="46" y="250">Cannot be judged</text>
  <text class="before-after-desc before-after-row before-after-r3" x="46" y="284">Might be worse than doing nothing</text>
  <text class="before-after-desc before-after-row before-after-r4" x="46" y="318">This is an unanchored result</text>
  <rect class="before-after-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="before-after-name" x="526" y="122">With comparison</text>
  <text class="before-after-desc" x="526" y="142">A number in context.</text>
  <text class="before-after-desc before-after-row before-after-r0" x="526" y="182">Eighty-five, against a rule at eighty-two</text>
  <text class="before-after-desc before-after-row before-after-r1" x="526" y="216">The improvement is three points</text>
  <text class="before-after-desc before-after-row before-after-r2" x="526" y="250">Can be weighed against cost</text>
  <text class="before-after-desc before-after-row before-after-r3" x="526" y="284">Might still not be worth deploying</text>
  <text class="before-after-desc before-after-row before-after-r4" x="526" y="318">This is an anchored result</text>
  <text class="before-after-sub" x="30" y="372">The last row of the second column is the honest outcome that anchoring makes visible: a real improvement can still fail to justify its maintenance cost.</text>
</svg>
