terms:
  - term: 'Trivial Baseline'
    definition: 'A zero-learning heuristic predictor such as majority class or mean target value.'
  - term: 'Simple Statistical Baseline'
    definition: 'A fast, interpretable model (logistic regression, linear regression) serving as the minimum complexity benchmark.'
  - term: 'Human-Level Performance (HLP)'
    definition: 'The empirical performance achieved by domain experts on a task, establishing an estimate of Bayes optimal error.'
  - term: 'Competitive Baseline'
    definition: 'A tuned standard algorithm (e.g. LightGBM, Random Forest) establishing the state of the art on tabular features.'
  - term: 'Error Reduction Ceiling'
    definition: 'The maximum possible percentage gain in overall accuracy if an error category is 100% eliminated.'
  - term: 'Data-Centric Error Analysis'
    definition: 'Systematically inspecting misclassified samples to categorize root causes and fix underlying data issues rather than tweaking algorithms.'
  - term: 'Slice Performance Audit'
    definition: 'Evaluating model performance across critical demographic, operational, or business cohorts to detect hidden failures.'
  - term: 'Bayes Optimal Error'
    definition: 'The lowest possible prediction error rate achievable by any classifier due to irreducible noise.'
