visuals:
  - id: baseline-hierarchy-ladder
    file: assets/baseline-hierarchy-ladder.svg
    type: diagram
    title: 'The Four-Tier Model Performance Baseline Ladder'
    alt: 'Diagram showing the 4-tier model performance comparison ladder from trivial statistical baselines up to complex deep architectures.'
    description: 'A static diagram outlining the four stages of baseline verification required before deploying complex machine learning architectures.'
  - id: error-analysis-taxonomy-matrix
    file: assets/error-analysis-taxonomy-matrix.svg
    type: flow-animated
    title: 'Andrew Ngs Systematic Error Analysis Workflow'
    alt: 'Animated flow chart detailing the data-centric error analysis workflow from error sampling to ceiling calculation and prioritization.'
    description: 'An animated flow chart showing how to manually inspect failure modes, build an error taxonomy, and calculate maximum achievable accuracy ceilings.'
  - id: baseline-ladder
    file: assets/baseline-ladder.svg
    type: diagram
    title: 'The baseline ladder'
    alt: 'Diagram: the four tiers of baseline for a machine learning project'
    description: 'A four-stage description of the baseline ladder covering the trivial baseline, the business rule, the simple model and the complex model.'
  - id: error-analysis-method
    file: assets/error-analysis-method.svg
    type: diagram
    title: 'Systematic error analysis'
    alt: 'Diagram: the four steps of systematic error analysis'
    description: 'A four-stage description of error analysis covering sampling errors, categorisation, counting and prioritisation.'
  - id: error-ceiling
    file: assets/error-ceiling.svg
    type: diagram
    title: 'The error ceiling'
    alt: 'Diagram: how the achievable error reduction is estimated before doing the work'
    description: 'A four-stage description of ceiling estimation covering the category share, perfect resolution, the resulting ceiling and the decision.'
  - id: slice-audit
    file: assets/slice-audit.svg
    type: diagram
    title: 'Slice-based auditing'
    alt: 'Diagram: how slice-based measurement finds failures the aggregate conceals'
    description: 'A four-stage description of slice auditing covering slice definition, per-slice measurement, the disparity and the action.'
  - id: baseline-not
    file: assets/baseline-not.svg
    type: diagram
    title: 'What baselines are not'
    alt: 'Diagram: four misconceptions about baselines and error analysis'
    description: 'A two-column comparison of misconceptions about baselines against what is true.'
  - id: baseline-history
    file: assets/baseline-history.svg
    type: diagram
    title: 'Four steps in evaluation discipline'
    alt: 'Diagram: the historical progression of baseline and error analysis practice'
    description: 'A four-stage description of the practice''s history covering absolute scores, chance baselines, business comparison and slice auditing.'
  - id: before-after
    file: assets/before-after.svg
    type: diagram
    title: 'Compared with what'
    alt: 'Diagram: an unanchored measurement compared with an anchored one'
    description: 'A two-column comparison of a measurement without a baseline against one with.'
  - id: baseline-implications
    file: assets/baseline-implications.svg
    type: diagram
    title: 'Four consequences of baselines'
    alt: 'Diagram: the decision, effort, expectation and stopping implications of baselines'
    description: 'A four-stage description of baseline implications covering go-or-no-go decisions, effort direction, expectations and stopping criteria.'
  - id: baseline-when
    file: assets/baseline-when.svg
    type: diagram
    title: 'Which baseline when'
    alt: 'Diagram: choosing a baseline by what the model would replace'
    description: 'A two-column comparison of situations against the baseline each requires.'
  - id: tier-detail
    file: assets/tier-detail.svg
    type: diagram
    title: 'The business rule baseline'
    alt: 'Diagram: how the existing business rule is measured as a baseline'
    description: 'A four-stage description of the business rule baseline covering the rule, its implementation, measurement and the comparison.'
  - id: baseline-why
    file: assets/baseline-why.svg
    type: diagram
    title: 'What baselines solve'
    alt: 'Diagram: the four problems baselines and error analysis address'
    description: 'A four-stage description of the problems addressed covering meaningless scores, misdirected effort, indefinite optimisation and unrealistic promises.'
