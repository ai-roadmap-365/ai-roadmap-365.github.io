id: D155
day: 155
slug: logistic-regression
title: Logistic Regression
section: machine-learning
subsection: core-concepts
week: 23
learning_promise: >-
  Learn how to frame binary classification from first principles: why linear regression fails on binary
  targets, how the sigmoid function maps unbounded real numbers into calibrated probabilities, how the logit
  and log-odds link function operate, how Maximum Likelihood Estimation produces the binary cross-entropy loss,
  and how gradient descent trains a robust logistic regression model.
objectives:
  - 'Explain why linear regression is mathematically unsuited for binary classification tasks'
  - 'Derive the sigmoid function and compute probabilities from linear combinations of features'
  - 'Calculate odds and log-odds (logit) and interpret model coefficients in terms of multiplicative odds ratios'
  - 'Formulate binary cross-entropy (log loss) from Maximum Likelihood Estimation principles'
  - 'Compute exact analytical gradients with respect to model weights and bias'
  - 'Implement and train a logistic regression classifier from scratch using batch gradient descent'
  - 'Evaluate probability calibration and understand the effect of decision threshold shifts'
  - 'Benchmark custom logistic regression against scikit-learn LogisticRegression on real diagnostic data'
prerequisites:
  - 'Day 148 -- Linear regression fundamentals and matrix formulations'
  - 'Day 149 -- Cost functions and optimization via gradient descent'
  - 'Day 153 -- Linear regression from scratch with NumPy arrays'
reading_time_minutes: 50
practical_time_minutes: 60
