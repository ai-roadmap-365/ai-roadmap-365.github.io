terms:
  - term: 'Logistic Regression'
    definition: 'A linear classification algorithm that models the probability of a binary outcome by applying the logistic sigmoid function to a linear combination of features.'
  - term: 'Sigmoid Function'
    definition: 'An S-shaped mathematical activation function sigma(z) = 1 / (1 + exp(-z)) that maps any real number into the interval (0, 1).'
  - term: 'Logit (Log-Odds)'
    definition: 'The natural logarithm of the odds of an event: logit(p) = ln(p / (1 - p)). It serves as the link function in logistic regression.'
  - term: 'Odds'
    definition: 'The ratio of the probability that an event occurs to the probability that it does not occur: Odds = p / (1 - p).'
  - term: 'Binary Cross-Entropy (Log Loss)'
    definition: 'The loss function used for binary classification, measuring the negative log-likelihood of the true labels given predicted probabilities.'
  - term: 'Maximum Likelihood Estimation (MLE)'
    definition: 'A method of estimating model parameters by maximizing the likelihood function so that the observed data becomes most probable under the model.'
  - term: 'Decision Boundary'
    definition: 'The geometric hyperplane in feature space where the predicted probability equals the threshold (typically 0.5), separating predicted classes.'
  - term: 'Decision Threshold'
    definition: 'The cutoff probability tau used to convert continuous probabilities into discrete class labels (y_hat = 1 if p >= tau else 0).'
  - term: 'Probability Calibration'
    definition: 'The degree to which predicted probabilities match real-world empirical frequencies (e.g. among events predicted with 80% confidence, 80% actually occur).'
  - term: 'Odds Ratio'
    definition: 'The ratio of odds between two conditions, equal to exp(w_j) for a unit increase in feature j in logistic regression.'
