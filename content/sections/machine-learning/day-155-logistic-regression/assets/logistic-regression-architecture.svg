<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Logistic Regression Architecture">
  <title>Logistic Regression Architecture: Linear Combination to Probability</title>
  <defs>
    <style>
      .d155a-bg { fill: #f8fafc; }
      .d155a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d155a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d155a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
      .d155a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 15px; font-weight: 600; }
      .d155a-accent { fill: #1d4ed8; }
      .d155a-arrow { stroke: #1d4ed8; stroke-width: 2.5; marker-end: url(#d155a-arr); fill: none; }
      .d155a-pill { fill: #dbeafe; stroke: #bfdbfe; rx: 4; }
    </style>
    <marker id="d155a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d155a-bg" />

  <!-- Title -->
  <text x="40" y="45" class="d155a-header" font-size="22">Logistic Regression Computation Architecture</text>
  <text x="40" y="70" class="d155a-text">Mapping continuous features to calibrated probabilities and discrete decisions</text>

  <!-- Step 1: Input & Weights -->
  <rect x="40" y="110" width="220" height="280" class="d155a-card" />
  <rect x="50" y="120" width="200" height="30" class="d155a-pill" />
  <text x="60" y="140" class="d155a-header" font-size="14" fill="#1e40af">1. Linear Combination</text>
  
  <text x="60" y="180" class="d155a-text">Feature vector:</text>
  <text x="60" y="205" class="d155a-math">x = [x₁, x₂, ..., x_d]</text>
  
  <text x="60" y="245" class="d155a-text">Weight parameters:</text>
  <text x="60" y="270" class="d155a-math">w = [w₁, w₂, ..., w_d]</text>
  
  <text x="60" y="310" class="d155a-text">Log-odds score (z):</text>
  <text x="60" y="335" class="d155a-math">z = wᵀx + b</text>
  <text x="60" y="365" class="d155a-text" font-size="12" fill="#64748b">Range: (-∞, +∞)</text>

  <!-- Arrow 1 -->
  <path d="M 260 250 L 330 250" class="d155a-arrow" />

  <!-- Step 2: Sigmoid Activation -->
  <rect x="340" y="110" width="240" height="280" class="d155a-card" />
  <rect x="350" y="120" width="220" height="30" class="d155a-pill" />
  <text x="360" y="140" class="d155a-header" font-size="14" fill="#1e40af">2. Sigmoid Activation</text>

  <text x="360" y="180" class="d155a-text">Link Function:</text>
  <text x="360" y="205" class="d155a-math">σ(z) = 1 / (1 + e⁻ᶻ)</text>

  <!-- S-Curve graphic inside card -->
  <path d="M 370 320 Q 450 320 460 270 T 550 220" stroke="#1d4ed8" stroke-width="3" fill="none" />
  <line x1="370" y1="270" x2="550" y2="270" stroke="#cbd5e1" stroke-dasharray="4" />
  <text x="370" y="265" class="d155a-text" font-size="11" fill="#64748b">p = 0.5 (z=0)</text>

  <text x="360" y="350" class="d155a-math">p = P(y=1 | x)</text>
  <text x="360" y="375" class="d155a-text" font-size="12" fill="#64748b">Output Range: (0, 1)</text>

  <!-- Arrow 2 -->
  <path d="M 580 250 L 650 250" class="d155a-arrow" />

  <!-- Step 3: Decision Rule -->
  <rect x="660" y="110" width="200" height="280" class="d155a-card" />
  <rect x="670" y="120" width="180" height="30" class="d155a-pill" />
  <text x="680" y="140" class="d155a-header" font-size="14" fill="#1e40af">3. Binary Decision</text>

  <text x="680" y="180" class="d155a-text">Threshold (τ = 0.5):</text>
  <text x="680" y="215" class="d155a-math">ŷ = 1  if p ≥ 0.5</text>
  <text x="680" y="245" class="d155a-math">ŷ = 0  if p &lt; 0.5</text>

  <rect x="680" y="275" width="160" height="40" fill="#ecfdf5" stroke="#10b981" rx="4" />
  <text x="690" y="300" class="d155a-math" fill="#065f46">Class 1: Positive</text>

  <rect x="680" y="325" width="160" height="40" fill="#fef2f2" stroke="#ef4444" rx="4" />
  <text x="690" y="350" class="d155a-math" fill="#991b1b">Class 0: Negative</text>

  <!-- Bottom Banner -->
  <rect x="40" y="410" width="820" height="50" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
  <text x="60" y="440" class="d155a-text" font-weight="600" fill="#1e40af">Key Insight: The decision boundary wᵀx + b = 0 is linear in feature space, even though the output probability is nonlinear.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 260 250 L 330 250" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 580 250 L 650 250" stroke="#1d4ed8" stroke-width="4.1" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
