<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Gradient Descent Optimization Flow">
  <title>Logistic Regression Gradient Descent Optimization Flow</title>
  <defs>
    <style>
      .d155f-bg { fill: #f8fafc; }
      .d155f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d155f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d155f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d155f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d155f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d155f-arr); fill: none; }
      .d155f-highlight { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      
      @keyframes d155f-pulse {
        0%, 100% { stroke-opacity: 0.3; stroke-width: 2; }
        50% { stroke-opacity: 1; stroke-width: 3.5; }
      }
      .d155f-anim-loop { animation: d155f-pulse 3s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d155f-anim-loop { animation: none; stroke-opacity: 1; stroke-width: 2; }
      }
    </style>
    <marker id="d155f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d155f-bg" />

  <text x="40" y="45" class="d155f-title" font-size="22">Gradient Descent Training Loop</text>
  <text x="40" y="70" class="d155f-text">Iterative parameter adjustment via analytical gradient computation</text>

  <!-- 1. Predict -->
  <rect x="50" y="110" width="180" height="130" class="d155f-box" />
  <text x="65" y="135" class="d155f-title" font-size="14" fill="#1d4ed8">1. Forward Probs</text>
  <text x="65" y="165" class="d155f-math">z = Xw + b</text>
  <text x="65" y="195" class="d155f-math">p = σ(z)</text>
  <text x="65" y="225" class="d155f-text" font-size="11" fill="#64748b">Compute for N rows</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 175 L 270 175" class="d155f-arrow" />

  <!-- 2. Loss -->
  <rect x="280" y="110" width="190" height="130" class="d155f-box" />
  <text x="295" y="135" class="d155f-title" font-size="14" fill="#1d4ed8">2. Binary Log-Loss</text>
  <text x="295" y="165" class="d155f-math" font-size="12">L = -mean[y·ln(p)</text>
  <text x="295" y="185" class="d155f-math" font-size="12">    + (1-y)·ln(1-p)]</text>
  <text x="295" y="220" class="d155f-text" font-size="11" fill="#64748b">Evaluate convergence</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 470 175 L 510 175" class="d155f-arrow" />

  <!-- 3. Gradients -->
  <rect x="520" y="110" width="190" height="130" class="d155f-highlight" />
  <text x="535" y="135" class="d155f-title" font-size="14" fill="#1e40af">3. Exact Gradients</text>
  <text x="535" y="165" class="d155f-math">e = p - y</text>
  <text x="535" y="190" class="d155f-math">∇w = (1/N) Xᵀe</text>
  <text x="535" y="215" class="d155f-math">∇b = mean(e)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 710 175 L 750 175" class="d155f-arrow" />

  <!-- 4. Update -->
  <rect x="760" y="110" width="100" height="130" class="d155f-box" />
  <text x="770" y="135" class="d155f-title" font-size="14" fill="#1d4ed8">4. Update</text>
  <text x="770" y="170" class="d155f-math">w ← w - η∇w</text>
  <text x="770" y="205" class="d155f-math">b ← b - η∇b</text>

  <!-- Loop back arrow -->
  <path d="M 810 240 L 810 320 L 140 320 L 140 240" class="d155f-arrow d155f-anim-loop" />
  <text x="440" y="340" class="d155f-text" font-weight="600" fill="#2563eb" text-anchor="middle">Repeat until ||∇w|| &lt; tol or max_epochs reached</text>

  <!-- Insight panel -->
  <rect x="50" y="380" width="810" height="70" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
  <text x="70" y="410" class="d155f-text" font-weight="700" fill="#0f172a">Mathematical Elegance of Cross-Entropy:</text>
  <text x="70" y="433" class="d155f-text">The error signal e = (p - y) directly drives the gradient. When p ≈ y, the gradient vanishes naturally without vanishing gradient stalls.</text>
</svg>
