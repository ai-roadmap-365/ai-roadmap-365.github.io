sources:
  - title: 'Scikit-Learn User Guide: Logistic Regression'
    url: https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression
    publisher: Scikit-Learn Developers
    accessed: '2026-08-29'
    year: 2026
    description: >-
      Official technical documentation and API reference for LogisticRegression solvers, penalties, and
      multiclass formulations.
  - title: An Introduction to Statistical Learning (with Applications in Python)
    url: https://www.statlearning.com/
    publisher: Springer
    accessed: '2026-08-29'
    year: 2023
    description: >-
      Foundational textbook covering classification theory, logistic regression derivations, odds ratios, and
      Maximum Likelihood Estimation.
  - title: Pattern Recognition and Machine Learning
    url: https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/
    publisher: Springer / Microsoft Research
    accessed: '2026-08-31'
    year: 2006
    description: >-
      Comprehensive graduate-level treatment of generative vs discriminative models, logistic regression, and
      cross-entropy error functions.
