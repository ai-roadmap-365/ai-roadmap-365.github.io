visuals:
  - id: logistic-regression-architecture
    file: assets/logistic-regression-architecture.svg
    type: diagram
    title: 'Logistic Regression Architecture: From Linear Combination to Probabilities'
    alt: 'Diagram showing linear dot product w transpose x plus b mapped through the S-shaped sigmoid activation function to output predicted probability p in the open interval zero to one, compared with a decision threshold tau equal to zero point five to yield binary class predictions.'
    description: 'A static architecture diagram illustrating the forward computation graph of binary logistic regression: linear input combination z = w^T x + b, sigmoid activation sigma(z) compressing (-inf, +inf) into (0, 1), and binary thresholding at tau = 0.5.'
  - id: gradient-update-flow
    file: assets/gradient-update-flow.svg
    type: flow-animated
    title: 'Gradient Descent Loss Minimization in Logistic Regression'
    alt: 'Animated diagram depicting the iterative gradient descent update loop: forward probability prediction, binary cross-entropy loss computation, analytical error vector p minus y backpropagation, and parameter update w minus eta grad w shifting the decision boundary toward optimal separation.'
    description: 'An animated flow diagram demonstrating the iterative optimization loop: computing probabilities, evaluating binary cross-entropy loss, taking the difference p - y, and updating model weights across iterations with reduced-motion static fallback.'
  - id: logreg-idea
    file: assets/logreg-idea.svg
    type: diagram
    title: 'Logistic regression in four steps'
    alt: 'Diagram: the four steps of logistic regression from features to probability'
    description: 'A four-stage description of logistic regression covering the weighted sum, the sigmoid, the probability and the threshold.'
  - id: odds-logit
    file: assets/odds-logit.svg
    type: diagram
    title: 'From probability to a straight line'
    alt: 'Diagram: how probability is transformed into an unbounded linear scale'
    description: 'A three-stage description of the logit transformation covering probability, odds and log odds.'
  - id: sigmoid
    file: assets/sigmoid.svg
    type: diagram
    title: 'The sigmoid'
    alt: 'Diagram: the four properties of the sigmoid function'
    description: 'A four-stage description of the sigmoid covering its range, its centre, its gradient and saturation.'
  - id: cross-entropy
    file: assets/cross-entropy.svg
    type: diagram
    title: 'Why cross-entropy'
    alt: 'Diagram: how the cross-entropy loss is derived from maximum likelihood'
    description: 'A four-stage description of the cross-entropy loss covering likelihood, the log, the negation and the behaviour.'
  - id: gradients
    file: assets/gradients.svg
    type: diagram
    title: 'The gradient'
    alt: 'Diagram: the four steps of computing the logistic regression gradient'
    description: 'A four-stage description of the gradient covering the error, the feature product, the sum and the update.'
  - id: logreg-vs-linear
    file: assets/logreg-vs-linear.svg
    type: diagram
    title: 'Logistic against linear regression'
    alt: 'Diagram: linear regression compared with logistic regression'
    description: 'A two-column comparison of linear regression against logistic regression.'
  - id: not-classifier
    file: assets/not-classifier.svg
    type: diagram
    title: 'What it is not'
    alt: 'Diagram: three common misconceptions about logistic regression'
    description: 'A two-column comparison of misconceptions about logistic regression against what is actually true.'
  - id: logreg-history
    file: assets/logreg-history.svg
    type: diagram
    title: 'Four steps to logistic regression'
    alt: 'Diagram: the historical progression of the logistic function'
    description: 'A four-stage description of the history covering population modelling, the logit, statistical adoption and machine learning.'
  - id: scales
    file: assets/scales.svg
    type: diagram
    title: 'A weighing scale with a limit'
    alt: 'Diagram: an unbounded sum compared with a bounded reading'
    description: 'A two-column comparison of an unbounded accumulation against a bounded reading.'
  - id: logreg-implications
    file: assets/logreg-implications.svg
    type: diagram
    title: 'Four consequences of logistic regression'
    alt: 'Diagram: the interpretability, calibration, cost and fairness implications of logistic regression'
    description: 'A four-stage description of implications covering interpretability, calibration, computational cost and encoded bias.'
  - id: logreg-when
    file: assets/logreg-when.svg
    type: diagram
    title: 'When to use logistic regression'
    alt: 'Diagram: when logistic regression is the right model'
    description: 'A two-column comparison of situations favouring logistic regression against those requiring more.'
  - id: logreg-vs-tree
    file: assets/logreg-vs-tree.svg
    type: diagram
    title: 'Logistic regression against trees'
    alt: 'Diagram: linear model decision boundaries compared with tree-based boundaries'
    description: 'A two-column comparison of linear and tree-based classifiers.'
  - id: multiclass-logreg
    file: assets/multiclass-logreg.svg
    type: diagram
    title: 'Extending to many classes'
    alt: 'Diagram: how binary logistic regression is extended to multiple classes'
    description: 'A four-stage description of multiclass extension covering per-class scores, the softmax, normalisation and the prediction.'
  - id: regularisation-logreg
    file: assets/regularisation-logreg.svg
    type: diagram
    title: 'Regularising the coefficients'
    alt: 'Diagram: three regularisation options for logistic regression'
    description: 'A three-stage description of regularisation covering unregularised fitting, ridge and lasso penalties.'
  - id: threshold-choice
    file: assets/threshold-choice.svg
    type: diagram
    title: 'Choosing the threshold'
    alt: 'Diagram: how a classification threshold is chosen from costs rather than defaults'
    description: 'A four-stage description of threshold selection covering the default, asymmetric costs, the cost-weighted choice and the review.'
  - id: logreg-pitfalls
    file: assets/logreg-pitfalls.svg
    type: diagram
    title: 'Four things logistic regression is'
    alt: 'Diagram: the four defining properties of logistic regression'
    description: 'A four-stage description of what logistic regression is covering the linear predictor, the link, the loss and the output.'
