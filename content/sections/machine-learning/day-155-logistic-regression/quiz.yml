questions:
  - question: 'Why does ordinary linear regression fail when applied directly to binary classification problems?'
    options:
      - 'Linear regression predicts values outside the interval [0, 1] and assumes constant error variance across all inputs'
      - 'Linear regression requires all input features to be binary indicators rather than continuous values'
      - 'Linear regression cannot be optimized using gradient descent'
      - 'Linear regression models always suffer from severe class imbalance'
    answer_index: 0
    explanation: 'Linear regression produces unbounded continuous outputs (-inf to +inf) that cannot represent valid probabilities, and the binary nature of y violates the assumption of homoscedasticity (constant residual variance).'

  - question: 'What is the mathematical definition of the standard logistic sigmoid function sigma(z)?'
    options:
      - 'sigma(z) = exp(-z) / (1 + exp(-z))'
      - 'sigma(z) = 1 / (1 + exp(-z))'
      - 'sigma(z) = (exp(z) - exp(-z)) / (exp(z) + exp(-z))'
      - 'sigma(z) = ln(z / (1 - z))'
    answer_index: 1
    explanation: 'The standard sigmoid function is sigma(z) = 1 / (1 + exp(-z)), which maps any real number in (-inf, +inf) smoothly into the open probability interval (0, 1).'

  - question: 'If the log-odds (logit) of an event is 0.0, what is the corresponding predicted probability P(y=1)?'
    options:
      - '0.0'
      - '0.25'
      - '0.50'
      - '1.0'
    answer_index: 2
    explanation: 'When logit(p) = ln(p / (1-p)) = 0, we have p / (1-p) = exp(0) = 1, which implies p = 1 - p, so p = 0.50.'

  - question: 'How is the binary cross-entropy loss (log loss) derived for a single training sample with label y in {0, 1} and predicted probability p?'
    options:
      - 'L = (y - p)^2'
      - 'L = |y - p|'
      - 'L = max(0, 1 - y * p)'
      - 'L = - [y * ln(p) + (1 - y) * ln(1 - p)]'
    answer_index: 3
    explanation: 'Binary cross-entropy is the negative log-likelihood of the Bernoulli distribution: when y=1 the loss is -ln(p), and when y=0 the loss is -ln(1-p).'

  - question: 'What is the analytical gradient of the binary cross-entropy loss with respect to weight vector w for a batch of N samples?'
    options:
      - 'grad_w = (1/N) * X^T (p - y)'
      - 'grad_w = (2/N) * X^T (p - y)'
      - 'grad_w = (1/N) * X^T (p - y) * p * (1 - p)'
      - 'grad_w = - (1/N) * sum(y / p)'
    answer_index: 0
    explanation: 'Thanks to the elegant cancellation between the sigmoid derivative sigma*(1-sigma) and the log loss derivative, the gradient simplifies exactly to (1/N) * X^T (p - y).'

  - question: 'In logistic regression, how does a one-unit increase in feature x_j affect the odds of the positive class, holding all other features fixed?'
    options:
      - 'The odds increase by exactly w_j units'
      - 'The odds are multiplied by a factor of exp(w_j)'
      - 'The predicted probability increases by exactly w_j'
      - 'The odds are multiplied by w_j'
    answer_index: 1
    explanation: 'Because log-odds = w_0 + w_1*x_1 + ... + w_j*x_j, increasing x_j by 1 increases the log-odds by w_j, multiplying the odds by exp(w_j).'

  - question: 'What happens to the gradient update when a model predicts p = 0.999 for a true label of y = 1?'
    options:
      - 'The gradient magnitude is close to zero, causing negligible parameter change'
      - 'The gradient becomes infinite due to logarithmic divergence'
      - 'The model reverses the direction of the weight vector'
      - 'The learning rate is automatically halved'
    answer_index: 0
    explanation: 'Since the error term is (p - y) = (0.999 - 1.0) = -0.001, the gradient is nearly zero, reflecting confident and correct predictions.'

  - question: 'Why is feature scaling essential before training regularized logistic regression or using gradient descent?'
    options:
      - 'Unscaled features with large magnitudes distort gradient steps and receive disproportionate regularization penalties'
      - 'Unscaled features cause the sigmoid function to output values outside [0, 1]'
      - 'Logistic regression cannot compute dot products on unstandardized data'
      - 'Scikit-learn raises a ValueError if features are unscaled'
    answer_index: 0
    explanation: 'Gradient descent oscillates when feature scales vary widely, and L1/L2 penalties penalize large coefficients regardless of the underlying unit, unfairly shrinking features with naturally small units.'
