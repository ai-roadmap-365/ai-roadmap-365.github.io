terms:
  - term: 'Customer Segmentation'
    definition: 'The practice of dividing a customer base into distinct groups of individuals that share similar behavioral, demographic, or economic characteristics.'
  - term: 'RFM Framework'
    definition: 'A marketing analysis framework evaluating customer Recency (last purchase), Frequency (purchase count), and Monetary value (total spend).'
  - term: 'Power-Law Distribution'
    definition: 'A heavy-tailed distribution where a small fraction of individuals accounts for the vast majority of total value (e.g. 80/20 rule).'
  - term: 'Log Transformation'
    definition: 'Applying y = log(1 + x) to compress exponential right-skewed feature ranges into symmetrical bell-shaped distributions.'
  - term: 'Centroid Profiling'
    definition: 'Calculating the mean or median values of all business features across each cluster to define distinct qualitative personas.'
  - term: 'Customer Lifetime Value (CLV)'
    definition: 'The total net revenue a business anticipates generating from a customer over the entire duration of their relationship.'
  - term: 'Cluster Stability'
    definition: 'The consistency of learned cluster assignments across bootstrapping samples or consecutive time windows.'
  - term: 'Adjusted Rand Index (ARI)'
    definition: 'A metric measuring the similarity between two clustering assignments, adjusted for chance overlap.'
