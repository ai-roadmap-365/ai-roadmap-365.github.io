questions:
  - question: 'What do the three dimensions of the classical RFM marketing framework represent?'
    options:
      - 'Retention rate, Fulfillment speed, and Marketing cost'
      - 'Recency, frequency, and monetary value'
      - 'Revenue, Forecast error, and Margin percentage'
      - 'Regional footprint, Feature importance, and Median price'
    answer_index: 1
    explanation: 'RFM is the foundational behavioral framework: Recency evaluates engagement timing, Frequency measures brand loyalty, and Monetary value quantifies gross economic value.'
  - question: 'Why is applying a logarithmic transform (np.log1p) standard practice on raw Monetary and Frequency features before clustering?'
    options:
      - 'Log transforms eliminate all negative numbers in ratings'
      - 'Log transforms convert categorical variables into integers'
      - 'Spend is heavy-tailed, and logs make it roughly symmetric'
      - 'Log transforms guarantee that PCA eigenvalues equal 1.0'
    answer_index: 2
    explanation: 'Unscaled power-law features cause a tiny handful of high-spending whales to dominate Euclidean distance calculations, pulling cluster centroids into uninformative outliers.'
  - question: 'What is the primary architectural benefit of combining PCA with K-Means clustering (PCA + K-Means pipeline)?'
    options:
      - 'PCA automatically assigns text names to clusters'
      - 'PCA converts unsupervised clustering into supervised logistic regression'
      - 'PCA removes the need to select cluster count K'
      - 'PCA orthogonalises correlated RFM indicators'
    answer_index: 3
    explanation: 'By removing feature covariance and noise, PCA ensures Euclidean distance in the reduced subspace reflects true orthogonal variance rather than redundantly weighted collinear metrics.'
  - question: 'How does an enterprise marketing system transform raw cluster centroids into actionable Business Personas?'
    options:
      - 'Denormalise the centroids and design campaigns per segment'
      - 'By deleting the data of customers in low-revenue clusters'
      - 'By renaming the database tables to match cluster indices'
      - 'By retraining the model every 5 minutes'
    answer_index: 0
    explanation: 'Unsupervised cluster numbers (Cluster 0, 1, 2) have no inherent business meaning until mapped back to dollar amounts and purchase frequencies to trigger targeted marketing actions.'
  - question: 'What diagnostic metric indicates that an unsupervised segmentation pipeline is suffering from cluster instability / drift over time?'
    options:
      - 'The database disk space usage increases linearly'
      - 'The ARI between consecutive months drops below 0.80'
      - 'The number of features in the input schema remains constant'
      - 'The PCA cumulative explained variance ratio equals 1.0'
    answer_index: 1
    explanation: 'Tracking Adjusted Rand Index (ARI) or Normalized Mutual Information (NMI) across retraining cycles audits whether clusters represent stable underlying personas or arbitrary stochastic reshuffling.'
