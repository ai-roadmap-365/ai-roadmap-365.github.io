<svg role="img" aria-label="End to end architecture pipeline diagram showing raw customer feature ingestion preprocessing PCA compression K Means clustering and downstream persona profiling" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Customer Segmentation Pipeline Architecture</title>
  <defs>
    <linearGradient id="bg189a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pipeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg189a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CUSTOMER SEGMENTATION: END-TO-END PIPELINE ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Raw Ingestion -> Robust Preprocessing -> PCA Dimensionality Reduction -> K-Means Clustering -> Persona Profiles</text>
  <g transform="translate(40, 85)">
    <rect width="770" height="295" fill="url(#pipeCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Stage 1 -->
    <rect x="30" y="80" width="110" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="85" y="110" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Ingestion</text>
    <text x="85" y="145" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">RFM Metrics</text>
    <text x="85" y="165" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Demographics</text>
    <!-- Arrow 1 -->
    <line x1="145" y1="140" x2="175" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 2 -->
    <rect x="180" y="80" width="120" height="120" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="240" y="110" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Cleaning</text>
    <text x="240" y="145" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Log Transform</text>
    <text x="240" y="165" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">StandardScaler</text>
    <!-- Arrow 2 -->
    <line x1="305" y1="140" x2="335" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 3 -->
    <rect x="340" y="80" width="120" height="120" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="400" y="110" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Reduction</text>
    <text x="400" y="145" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">PCA (90% EVR)</text>
    <text x="400" y="165" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Orthogonalize</text>
    <!-- Arrow 3 -->
    <line x1="465" y1="140" x2="495" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 4 -->
    <rect x="500" y="80" width="120" height="120" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="560" y="110" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Clustering</text>
    <text x="560" y="145" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">K-Means++ (K=4)</text>
    <text x="560" y="165" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Silhouette &gt; 0.55</text>
    <!-- Arrow 4 -->
    <line x1="625" y1="140" x2="655" y2="140" stroke="#64748b" stroke-width="2"/>
    <!-- Stage 5 -->
    <rect x="660" y="80" width="90" height="120" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="705" y="110" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">5. Personas</text>
    <text x="705" y="145" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">VIP Loyal</text>
    <text x="705" y="165" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">At-Risk Churn</text>
    <text x="385" y="270" fill="#cbd5e1" font-family="system-ui" font-size="11" text-anchor="middle">Production Integration: Daily batch feature store computation + CRM webhook targeting</text>
  </g>
</svg>
