<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What a segmentation study is not</title>
  <style>
    .segmentation-not-bg   { fill: #f8fafc; }
    .segmentation-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .segmentation-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .segmentation-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .segmentation-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .segmentation-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .segmentation-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .segmentation-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .segmentation-not-row { opacity: 1; }
    .segmentation-not-r0 { animation-delay: 0.00s; }
    .segmentation-not-r1 { animation-delay: 0.45s; }
    .segmentation-not-r2 { animation-delay: 0.90s; }
    .segmentation-not-r3 { animation-delay: 1.35s; }
    .segmentation-not-r4 { animation-delay: 1.80s; }
    .segmentation-not-row { animation: segmentation-not-reveal 7.3s ease-in-out infinite; }
    @keyframes segmentation-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="segmentation-not-bg" width="980" height="390"/>
  <text class="segmentation-not-h1"  x="30" y="40">What a segmentation study is not</text>
  <text class="segmentation-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="segmentation-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="segmentation-not-name" x="46" y="122">The misconception</text>
  <text class="segmentation-not-desc" x="46" y="142">Commonly held.</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r0" x="46" y="182">The algorithm finds the real segments</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r1" x="46" y="216">More segments give more insight</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r2" x="46" y="250">A good silhouette score means a good segmentation</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r3" x="46" y="284">Segments are stable once found</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r4" x="46" y="318">It is a clustering exercise</text>
  <rect class="segmentation-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="segmentation-not-name" x="526" y="122">What is true</text>
  <text class="segmentation-not-desc" x="526" y="142">Actually.</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r0" x="526" y="182">It finds structure; you decide what is real</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r1" x="526" y="216">Beyond five or six, nobody acts on them</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r2" x="526" y="250">Statistical separation is not business relevance</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r3" x="526" y="284">They drift as behaviour changes</text>
  <text class="segmentation-not-desc segmentation-not-row segmentation-not-r4" x="526" y="318">It is a business exercise using clustering</text>
  <text class="segmentation-not-sub" x="30" y="372">The number of segments is bounded by what an organisation can actually operate differently, which is usually far fewer than the data would support.</text>
</svg>
