visuals:
  - id: customer-segmentation-pipeline-architecture
    file: assets/customer-segmentation-pipeline-architecture.svg
    type: diagram
    title: Customer Segmentation Pipeline Architecture
    alt: End to end architecture pipeline diagram showing raw customer feature ingestion preprocessing PCA compression K Means clustering and downstream persona profiling
    description: Production engineering flow diagram connecting raw transactional event data to cleaned RFM features, PCA dimensionality reduction, and K-Means segmentation personas.
  - id: customer-segment-radar-comparison
    file: assets/customer-segment-radar-comparison.svg
    type: diagram
    title: Customer Segment Radar Profile Comparison
    alt: Spider radar chart comparing four behavioral customer segments across Recency Frequency Monetary value and Tenure dimensions
    description: Radar polygon chart illustrating multi-attribute centroid decomposition comparing High-Value VIPs against At-Risk Churn customer cohorts.
  - id: segmentation-idea
    file: assets/segmentation-idea.svg
    type: diagram
    title: 'What makes a segmentation useful'
    alt: 'Diagram: the four properties of an actionable customer segmentation'
    description: 'A four-stage description of segmentation quality covering distinctness, size, interpretability and actionability.'
  - id: rfm
    file: assets/rfm.svg
    type: diagram
    title: 'The recency-frequency-value framework'
    alt: 'Diagram: the three behavioural features that structure most customer segmentation'
    description: 'A four-stage description of behavioural segmentation features covering recency, frequency, value and their combination.'
  - id: centroid-decomposition
    file: assets/centroid-decomposition.svg
    type: diagram
    title: 'Describing a segment'
    alt: 'Diagram: how cluster centroids are turned into business descriptions'
    description: 'A four-stage description of segment description covering the centroid, standardised comparison, the profile and the name.'
  - id: cluster-stability
    file: assets/cluster-stability.svg
    type: diagram
    title: 'Segment stability'
    alt: 'Diagram: the four checks that validate a segmentation over time'
    description: 'A four-stage description of segmentation validation covering reseeding, resampling, temporal stability and membership drift.'
  - id: segmentation-not
    file: assets/segmentation-not.svg
    type: diagram
    title: 'What a segmentation study is not'
    alt: 'Diagram: four misconceptions about customer segmentation'
    description: 'A two-column comparison of misconceptions about segmentation against what is true.'
  - id: segmentation-pipeline
    file: assets/segmentation-pipeline.svg
    type: diagram
    title: 'The segmentation pipeline'
    alt: 'Diagram: the five stages of an end-to-end segmentation study'
    description: 'A five-stage description of a segmentation pipeline covering aggregation, feature construction, scaling, clustering and profiling.'
  - id: market-stall
    file: assets/market-stall.svg
    type: diagram
    title: 'Grouping customers usefully'
    alt: 'Diagram: a statistically clean grouping compared with an operationally useful one'
    description: 'A two-column comparison of a statistically optimal segmentation against an operationally useful one.'
  - id: segmentation-implications
    file: assets/segmentation-implications.svg
    type: diagram
    title: 'Four consequences of segmentation'
    alt: 'Diagram: the targeting, drift, privacy and fairness implications of customer segmentation'
    description: 'A four-stage description of segmentation implications covering targeting value, drift, personal data and discriminatory risk.'
  - id: segmentation-when
    file: assets/segmentation-when.svg
    type: diagram
    title: 'When to run a segmentation'
    alt: 'Diagram: when a segmentation study is worthwhile'
    description: 'A two-column comparison of situations warranting segmentation against those that do not.'
