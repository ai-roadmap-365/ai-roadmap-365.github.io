terms:
  - term: Multiple regression
    definition: >-
      A linear model with more than one predictor: y = b0 + b1*x1 + b2*x2 + ... + bp*xp. Each coefficient
      is fitted jointly with every other, which is what makes its meaning conditional rather than standalone.
  - term: Design matrix
    definition: >-
      The matrix of predictor values the model is actually fitted to, one row per observation and one
      column per feature (plus an intercept column of ones). PolynomialFeatures and an interaction term both
      work by adding columns to this matrix before an ordinary linear fit ever runs.
  - term: Holding the other predictors constant
    definition: >-
      What a multiple-regression coefficient measures: the change in the target for one unit of change in
      one predictor, with every other predictor's value fixed at whatever it happens to be. When predictors
      move together in the data, this condition is met only approximately, which is the seed of every
      instability measured in this lesson.
  - term: Multicollinearity
    definition: >-
      Two or more predictors carrying overlapping information about each other, not just about the target.
      Measured here at a correlation of 0.8967 between two serum measurements. It destabilises coefficients
      without necessarily hurting predictions.
  - term: Variance inflation factor
    definition: >-
      1 / (1 - R2), where R2 comes from regressing one predictor on all the others. A VIF of 1 means a
      predictor is unrelated to the rest; measured here at 59.2025 for the most entangled predictor against
      1.2173 for the least.
  - term: Exact duplicate column
    definition: >-
      Two identical columns in a design matrix. The normal equations cannot tell them apart, so any split of
      their combined coefficient fits equally well -- measured here as an even split, -0.545 and -0.545,
      summing to the original -1.09 to eight decimal places.
  - term: Near-duplicate instability
    definition: >-
      What happens once an exact tie is broken by a small amount of noise: the split becomes unique but
      effectively arbitrary, swinging with a standard deviation above 4.4 across ten seeds here while the
      sum of the two coefficients stays within 0.0144.
  - term: Coefficient sign flip
    definition: >-
      A predictor's simple-regression coefficient and its multiple-regression coefficient pointing opposite
      directions. Measured on real data here: a serum measurement is +0.4723 alone and -1.09 once a
      correlated partner is held constant -- the same mechanism as Simpson's paradox.
  - term: Polynomial regression
    definition: >-
      Ordinary linear regression fitted to a design matrix that includes powers of a predictor (x, x^2, x^3,
      ...). Linear in its parameters throughout -- verified here by matching PolynomialFeatures plus
      LinearRegression against a direct normal-equations solve to thirteen decimal places.
  - term: Linear in the parameters
    definition: >-
      The defining property of a linear model: the prediction is a linear combination of the coefficients,
      regardless of what nonlinear functions of the raw inputs feed into it. A curve in x can still be a
      straight fit in the coefficients, which is what lets a polynomial model use ordinary least squares.
  - term: Interaction term
    definition: >-
      A design-matrix column formed by multiplying two predictors together (x1 * x2), which lets one
      predictor's effect depend on the level of another. Measured here to cost 0.0043 of R2 when dropped
      from a two-predictor quadratic fit.
  - term: R2 monotonicity
    definition: >-
      The fact that R2 on the training data can never decrease when a predictor is added, because ordinary
      least squares always has the option of setting the new coefficient to zero. Measured here climbing
      from 0.5177 to 0.5325 as ten columns of pure noise were added.
  - term: Feature scaling
    definition: >-
      Rescaling predictors, most commonly to zero mean and unit variance, before fitting. Changes every
      ordinary-least-squares coefficient's magnitude -- measured here by a factor above thirty for one
      predictor -- while leaving every prediction and R2 unchanged to eleven decimal places.
  - term: Coefficient of variation
    definition: >-
      A coefficient's bootstrap standard deviation divided by its bootstrap mean, used here to compare
      instability across predictors on a scale-free basis. Tracks variance inflation factor across the ten
      diabetes predictors, with one predictor's near-zero mean coefficient excluded as a known distortion.
  - term: Simple regression coefficient
    definition: >-
      A predictor's coefficient when it is the only predictor in the model -- its raw, unconditional
      association with the target, before any other variable is accounted for.
  - term: Simpson's paradox (as a coefficient flip)
    definition: >-
      The same reversal Day 119 measured in aggregated rates, here appearing as a continuous coefficient:
      conditioning on a correlated variable can invert the apparent direction of another variable's
      relationship with the target.
