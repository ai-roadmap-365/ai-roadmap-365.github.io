questions:
  - question: >-
      An exact copy of a predictor with an original coefficient of -1.09 is appended to a design matrix and
      the model refit. The two resulting coefficients are -0.545 and -0.545. What is the correct way to
      read this?
    options:
      - 'Neither half individually means anything; only their sum, which equals the original coefficient to eight decimal places, is meaningful, because the normal equations cannot distinguish two identical columns'
      - 'The original coefficient was wrong, and -0.545 is the corrected, more accurate value for that predictor'
      - 'Each half is an independent, meaningful estimate of the predictor''s own effect on the target'
      - 'The duplication introduced an error, and the model should be refit without the duplicate to get the true answer'
    answer_index: 0
    explanation: >-
      Two identical columns carry identical information, so the normal equations have no way to prefer one
      split of their combined effect over another -- any pair of numbers summing to -1.09 fits exactly as
      well. The even 50/50 split seen here is specific to the columns being identical; it is not a general
      property of correlated predictors, which the noisy version of this experiment breaks immediately. The
      sum is the only quantity that is actually determined, and it matches the original to eight decimal
      places -- refitting without the duplicate would simply recover the original coefficient directly.
  - question: >-
      Breaking the exact duplicate with one percent of noise sends the split coefficients to +0.7592 and
      -1.8451 at one seed, while across ten different noise seeds both coefficients swing with a standard
      deviation above 4.4 -- yet R-squared stays within 0.5178 to 0.5186 the entire time. What does this
      combination demonstrate?
    options:
      - 'That the model is broken and should not be trusted for anything'
      - 'That a model can be accurate at prediction while its individual coefficients are unstable and effectively uninterpretable -- and no accuracy metric will reveal that instability'
      - 'That R-squared is the wrong metric to use whenever predictors are correlated'
      - 'That the noise added to the duplicate column introduced a bug that should be fixed before trusting the result'
    answer_index: 1
    explanation: >-
      The predictions and the R-squared are measuring what the combined pair of near-identical columns
      contributes, and that combined contribution barely moves across seeds -- which is exactly why the
      accuracy metrics stay put. The instability lives entirely in how the shared effect gets divided between
      the two columns, which prediction-quality metrics have no way to see. Nothing is broken and nothing is
      a bug; this is the deterministic behaviour of least squares facing near-collinear columns, and it is
      the central danger of trusting a coefficient from a model with correlated predictors.
  - question: >-
      Variance inflation factors on ten real predictors range from 1.2173 (age) to 59.2025 (a serum
      measurement, s1). What does a VIF of 59.2025 mean, precisely?
    options:
      - 'That predictor is correlated with the target 59.2 times more strongly than an average predictor'
      - 'The predictor''s coefficient is 59.2 times larger than it should be'
      - 'Regressing that predictor on the other nine predictors explains about 98.3 percent of its own variance -- it is nearly redundant with the rest of the design matrix, which inflates the variance of its coefficient estimate by a factor of 59.2 relative to an unrelated predictor'
      - 'The model''s R-squared would drop by a factor of 59.2 if that predictor were removed'
    answer_index: 2
    explanation: >-
      VIF is defined as 1 / (1 - R2), where R2 comes from regressing the predictor of interest on every
      other predictor -- it is a statement about how redundant one column is with the rest of the design
      matrix, not about the predictor's relationship with the target at all. Solving 1 / (1 - R2) = 59.2025
      for R2 gives about 0.983: the other nine predictors explain 98.3 percent of this predictor's own
      variance. A high VIF says a coefficient estimate is unreliable; it says nothing directly about the
      model's overall predictive accuracy.
  - question: >-
      A serum measurement's coefficient is +0.4723 when it is the only predictor in the model, and -1.09
      once the other nine predictors -- including a partner it correlates with at 0.8967 -- are added. What
      changed between the two fits?
    options:
      - 'A calculation error, since a coefficient should not change sign when more predictors are added'
      - 'The units of the predictor were rescaled between the two fits'
      - 'The target variable changed definition between the two fits'
      - 'The conditioning: the simple coefficient describes the predictor''s raw, unconditional association with the target, while the multiple coefficient describes its association after the correlated partner''s overlapping information has been accounted for -- the same reversal mechanism as Simpson''s paradox'
    answer_index: 3
    explanation: >-
      Nothing was rescaled and nothing about the target changed; both fits used the same raw-unit data. A
      simple-regression coefficient is unconditional -- it credits a predictor with everything it correlates
      with, including effects that actually belong to a correlated partner. Once that partner enters the
      model, the predictor's coefficient reflects only what is left over after the partner's overlapping
      information is accounted for, which can reverse the apparent direction entirely. Sign flips under
      conditioning are a known, real phenomenon, not evidence of an error -- it is the identical mechanism Day
      119 measured as Simpson's paradox.
  - question: >-
      PolynomialFeatures(degree=2) followed by LinearRegression, and a direct numpy.linalg.lstsq solve on
      the identical expanded design matrix, produce coefficients that agree to thirteen decimal places. What
      does this demonstrate about polynomial regression?
    options:
      - 'That a polynomial fit is linear in its PARAMETERS, not in the predictor -- the curve in x is achieved by adding new columns (x^2, x*x2, ...) to the design matrix, and an ordinary linear solver fits the coefficients on those columns exactly as it would on any other predictors'
      - 'That scikit-learn silently converts the problem to a simpler linear one before solving it, discarding the polynomial terms'
      - 'That the two methods happened to agree by coincidence on this particular dataset'
      - 'That PolynomialFeatures and lstsq are both approximations that happen to converge to similar answers'
    answer_index: 0
    explanation: >-
      Nothing is discarded and nothing is approximate: PolynomialFeatures literally computes the powers and
      products of the original predictors as new columns, and the resulting problem -- predict y from these
      columns with coefficients -- is exactly the linear system ordinary least squares always solves. Solving
      that identical system by two independent routes, scikit-learn's estimator and a direct linear-algebra
      call, is expected to agree to floating-point precision, which is what thirteen decimal places
      demonstrates. "Linear regression" describes the model's linearity in its coefficients, not the shape of
      the curve it can trace through x.
  - question: >-
      Dropping the interaction term (bmi times bp) from a degree-2 polynomial fit on bmi and bp drops
      R-squared from 0.404170 to 0.399896, even though the squared terms bmi^2 and bp^2 remain in the model.
      What does the interaction term capture that the two squared terms do not?
    options:
      - 'The same information as the squared terms, just expressed differently -- dropping it should not have changed R-squared at all'
      - 'Whether bmi and bp are correlated with each other'
      - 'Whether bmi''s effect on the target changes depending on the level of bp (and vice versa) -- something neither predictor curving on its own, which is all bmi^2 and bp^2 describe, can express'
      - 'The combined average of bmi and bp, which is a more stable predictor than either alone'
    answer_index: 2
    explanation: >-
      bmi^2 and bp^2 let each predictor's own relationship with the target curve rather than stay a straight
      line, but each is still a function of only one variable at a time. The interaction term bmi*bp is the
      only column in this design matrix that depends on both variables jointly, and its coefficient measures
      exactly the claim that one predictor's effect is not constant across levels of the other. Measuring a
      real, if modest, R-squared cost from removing it (0.0043 here) confirms that claim was buying something
      real. Correlation between bmi and bp is a separate question from whether their interaction predicts the
      target.
  - question: >-
      Ten columns of pure numpy noise, with no relationship to the target whatsoever, were added to a
      ten-predictor model, and R-squared rose from 0.5177 to 0.5325 -- strictly increasing at every step
      along the way (1, 2, 5 and 10 noise columns). Why does this happen?
    options:
      - 'It should not happen, and this indicates a bug in how R-squared was computed'
      - 'Because the noise columns happen, by chance, to be correlated with the true predictors'
      - 'R-squared is not defined for models with more predictors than are theoretically justified'
      - 'Ordinary least squares can always set a new column''s coefficient to exactly zero and reproduce the previous fit exactly, so adding a column can never make the training R-squared worse -- and any nonzero coefficient it chooses instead is, by definition, doing marginally better on the training rows it was fit on'
    answer_index: 3
    explanation: >-
      This is a guaranteed mathematical property of ordinary least squares, not a bug or a special property
      of this particular noise: the optimisation over the new, larger coefficient vector includes the old
      coefficient vector with the new coefficient set to zero as one of its candidate solutions, so the best
      achievable training-set sum of squared errors can only go down or stay the same, never up, meaning
      R-squared can only go up or stay the same. Random correlation with the true predictors is not required
      for this to happen, though it does explain why the increase is nonzero rather than exactly zero at
      finite sample sizes. R-squared remains well defined regardless of how many predictors are added.
  - question: >-
      Standardising all ten predictors to zero mean and unit variance before fitting changes one
      predictor's coefficient from -1.09 to -37.68 -- more than thirty times larger in magnitude -- while
      R-squared and every individual prediction stay unchanged to eleven decimal places. What is the correct
      general conclusion?
    options:
      - 'The unscaled coefficient of -1.09 was incorrect, and -37.68 is the corrected value'
      - 'For ordinary least squares specifically, an affine rescaling of the inputs changes the size of each coefficient (because it changes what "one unit" of a predictor means) but leaves the fitted model''s predictions and fit quality unchanged -- this is a property of this estimator, not a universal law'
      - 'Feature scaling never matters for any model, since it did not matter here'
      - 'Standardising introduced a rounding error of about thirty-six units into the model'
    answer_index: 1
    explanation: >-
      Both coefficients are correct descriptions of the same underlying relationship, expressed in different
      units of the predictor -- neither is more "correct" than the other, and no error occurred. The specific
      invariance measured here -- unchanged predictions and R-squared -- is a property of ordinary least
      squares under an affine rescaling of its inputs; it does not extend to every model. Regularised
      estimators (ridge and lasso, which penalise coefficient size directly) and gradient-descent-based
      fitting (whose convergence speed depends on the input scale) are both affected by scaling in ways
      ordinary least squares is not.
