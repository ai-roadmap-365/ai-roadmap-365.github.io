title: 'Multiple and Polynomial Regression'
section: machine-learning
subsection: core-concepts
week: 22
learning_promise: >-
  After this lesson you will know what changes the moment a second predictor joins the first, because you
  will have measured it on real clinical data. You will append an exact copy of a predictor correlated at
  0.8967 with another column already in the model, and watch its coefficient of -1.09 split into two
  coefficients of -0.545 each -- neither matching the original, their sum matching it to eight decimal
  places, and every prediction the model makes changing by less than four trillionths. You will break that
  exact tie with one percent of noise and watch the two coefficients swing across a range wider than twelve
  units and repeatedly change sign, while their sum barely moves and R-squared holds at 0.5177 to 0.5186
  across ten different noise draws. You will compute variance inflation factors directly from their
  definition on ten real predictors, from 1.22 for age to 59.20 for a serum measurement, and confirm with
  bootstrap resampling that the high-VIF predictors are the unstable ones. You will watch a predictor's
  coefficient flip sign between a simple regression and a multiple one -- positive alone, negative once a
  correlated partner is held constant -- on real data, not a constructed example. You will prove that a
  polynomial fit is linear in its parameters by solving the identical expanded design matrix two different
  ways and finding the answers agree to thirteen decimal places. And you will measure two quiet failure
  modes that later days exist specifically to fix: R-squared climbing from 0.5177 to 0.5325 as ten columns
  of pure noise are added, and standardising a design matrix moving every coefficient by a factor of thirty
  or more while changing not one prediction.
objectives:
  - 'Explain what a coefficient in a multiple regression means, and why "holding the other predictors constant" is doing enormous work in that definition'
  - 'Compute variance inflation factors directly from their definition, and read what they say about ten real clinical predictors'
  - 'Demonstrate that duplicating a correlated predictor splits its coefficient arbitrarily while conserving the sum and leaving predictions almost untouched'
  - 'Distinguish an exact duplicate, which splits its coefficient in a closed-form way, from a near-duplicate, whose split is unstable and effectively arbitrary'
  - 'Connect a predictor''s variance inflation factor to how much its coefficient wobbles under bootstrap resampling'
  - 'Identify a sign flip between a predictor''s simple and multiple regression coefficients, and explain the conditioning that caused it'
  - 'Build a polynomial design matrix with PolynomialFeatures and explain why the resulting model is still linear in its parameters'
  - 'Interpret an interaction term as a claim that one predictor''s effect depends on the level of another, distinct from either predictor curving on its own'
  - 'Measure that R-squared cannot decrease when a predictor is added, even a column of pure noise, and explain the mechanism'
  - 'Measure that standardising a design matrix changes every coefficient''s magnitude while leaving every prediction and R-squared unchanged'
  - 'State when feature scaling matters for a model and when it does not, for ordinary least squares specifically'
  - 'Recognise multicollinearity as a coefficient-interpretation problem, not a prediction-quality problem, and name ridge regression as the standard remedy'
prerequisites:
  - 'Day 148 -- the geometry of a line through one predictor, and how to read a single coefficient'
  - 'Day 149 -- why squared error is the loss being minimised, and the normal equations that solve for it'
  - 'Day 145 -- the capacity-versus-error trade-off measured with polynomial degree; today is about the mechanics of the fit, not that trade-off again'
  - 'Day 119 -- Simpson''s paradox, which returns here as a coefficient sign flip on real data'
  - 'Comfort with NumPy arrays and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
