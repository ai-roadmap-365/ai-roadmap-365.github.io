<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The sign flip</title>
  <style>
    .sign-flip-bg   { fill: #f8fafc; }
    .sign-flip-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-flip-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-flip-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-flip-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-flip-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sign-flip-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sign-flip-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sign-flip-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sign-flip-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sign-flip-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sign-flip-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sign-flip-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sign-flip-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sign-flip-stage { opacity: 1; }

    .sign-flip-s0 { animation-delay: 0.00s; }
    .sign-flip-e0 { animation-delay: 0.00s; }
    .sign-flip-s1 { animation-delay: 1.28s; }
    .sign-flip-e1 { animation-delay: 1.28s; }
    .sign-flip-s2 { animation-delay: 2.56s; }
    .sign-flip-e2 { animation-delay: 2.56s; }
    .sign-flip-s3 { animation-delay: 3.84s; }
    .sign-flip-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sign-flip-conn  { animation: sign-flip-trace 6.4s ease-in-out infinite; }
      .sign-flip-stage { animation: sign-flip-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sign-flip-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sign-flip-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sign-flip-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sign-flip-stage { animation: sign-flip-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sign-flip-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sign-flip-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sign-flip-bg" width="980" height="322"/>
  <text class="sign-flip-h1"  x="30" y="40">The sign flip</text>
  <text class="sign-flip-sub" x="30" y="64">Four steps.</text>
  <g class="sign-flip-stage sign-flip-s0">
    <rect class="sign-flip-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sign-flip-step" x="44" y="142">01</text>
    <text class="sign-flip-name" x="70" y="142">Two predictors carry nearly the same information</text>
    <text class="sign-flip-desc" x="44" y="166">Correlated strongly with each</text>
    <text class="sign-flip-desc" x="44" y="182">other.</text>
  </g>
  <line class="sign-flip-line sign-flip-conn sign-flip-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sign-flip-tip)"/>
  <g class="sign-flip-stage sign-flip-s1">
    <rect class="sign-flip-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sign-flip-step" x="280" y="142">02</text>
    <text class="sign-flip-name" x="306" y="142">The fit must divide the effect between them</text>
    <text class="sign-flip-desc" x="280" y="166">And many divisions fit almost</text>
    <text class="sign-flip-desc" x="280" y="182">equally well.</text>
  </g>
  <line class="sign-flip-line sign-flip-conn sign-flip-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sign-flip-tip)"/>
  <g class="sign-flip-stage sign-flip-s2">
    <rect class="sign-flip-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sign-flip-step" x="516" y="142">03</text>
    <text class="sign-flip-name" x="542" y="142">So a small data change moves the split substantially</text>
    <text class="sign-flip-desc" x="516" y="166">Including across zero.</text>
  </g>
  <line class="sign-flip-line sign-flip-conn sign-flip-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sign-flip-tip)"/>
  <g class="sign-flip-stage sign-flip-s3">
    <rect class="sign-flip-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sign-flip-step" x="752" y="142">04</text>
    <text class="sign-flip-name" x="778" y="142">And a coefficient changes sign</text>
    <text class="sign-flip-desc" x="752" y="166">Without the predictions changing</text>
    <text class="sign-flip-desc" x="752" y="182">meaningfully.</text>
  </g>
  <text class="sign-flip-sub" x="30" y="304">Predictions staying stable while coefficients flip is the crux of this lesson: the model is fine and the interpretation is not.</text>
</svg>
