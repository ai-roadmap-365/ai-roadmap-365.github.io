<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things this is not</title>
  <style>
    .multiple-not-bg   { fill: #f8fafc; }
    .multiple-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .multiple-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiple-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .multiple-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .multiple-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .multiple-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .multiple-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .multiple-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .multiple-not-row { opacity: 1; }
    .multiple-not-r0 { animation-delay: 0.00s; }
    .multiple-not-r1 { animation-delay: 0.45s; }
    .multiple-not-r2 { animation-delay: 0.90s; }
    .multiple-not-r3 { animation-delay: 1.35s; }
    .multiple-not-r4 { animation-delay: 1.80s; }
    .multiple-not-row { animation: multiple-not-reveal 7.3s ease-in-out infinite; }
    @keyframes multiple-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="multiple-not-bg" width="980" height="390"/>
  <text class="multiple-not-h1"  x="30" y="40">Four things this is not</text>
  <text class="multiple-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="multiple-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="multiple-not-name" x="46" y="122">The misconception</text>
  <text class="multiple-not-desc" x="46" y="142">Commonly held.</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r0" x="46" y="182">Collinearity ruins the model</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r1" x="46" y="216">Scaling fixes collinearity</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r2" x="46" y="250">A higher fit statistic means a better model</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r3" x="46" y="284">Polynomial terms are a cheap improvement</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r4" x="46" y="318">A coefficient is an effect</text>
  <rect class="multiple-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="multiple-not-name" x="526" y="122">What is true</text>
  <text class="multiple-not-desc" x="526" y="142">Actually.</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r0" x="526" y="182">It ruins interpretation, not prediction</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r1" x="526" y="216">It changes units, and nothing else</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r2" x="526" y="250">It rises with any added column</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r3" x="526" y="284">Each one adds columns and variance</text>
  <text class="multiple-not-desc multiple-not-row multiple-not-r4" x="526" y="318">It is an effect conditional on the model</text>
  <text class="multiple-not-sub" x="30" y="372">The first row is the correction this lesson exists to make, and it is supported by measurement rather than assertion.</text>
</svg>
