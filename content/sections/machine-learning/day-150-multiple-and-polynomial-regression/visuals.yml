visuals:
  - id: design-matrix-architecture
    file: assets/design-matrix-architecture.svg
    type: diagram
    title: >-
      Ten predictors, one design matrix, and what a coefficient means
    alt: >-
      Diagram: a design matrix of ten columns from the diabetes dataset -- age, sex, bmi, bp, and six serum
      measurements s1 through s6 -- with s1 and s2 bracketed together and labelled with their correlation of
      0.8967. Beneath each column sits its variance inflation factor: 1.2173 for age, 1.2781 for sex, 1.5094
      for bmi, 1.4594 for bp, 59.2025 for s1, 39.1934 for s2, 15.4022 for s3, 8.891 for s4, 10.076 for s5, and
      1.4846 for s6, with the four highest values highlighted in red. A left panel explains that a
      coefficient measures the effect of one column holding every other column fixed, and that this
      condition is only approximate when columns move together. A right panel gives the duplicate-column
      result: the original s1 coefficient of minus 1.09 splits into two coefficients of minus 0.545 each in
      a duplicated model, whose sum matches the original to eight decimal places, whose maximum prediction
      change is 3.98 times ten to the minus twelve, and whose R2 is unchanged at 0.5177, with a closing note
      that neither half means anything alone
    description: >-
      A static architecture diagram. Across the top, ten labelled boxes represent the columns of the
      diabetes design matrix in their real clinical units, with the two most correlated columns, s1 and s2,
      bracketed together and annotated with their correlation of 0.8967. Directly beneath each column box
      sits its variance inflation factor, computed by regressing that column on the other nine: 1.2173,
      1.2781, 1.5094 and 1.4594 for the four clinical measurements, then 59.2025, 39.1934, 15.4022, 8.891 and
      10.076 for five of the six serum measurements, with the four above the usual rule-of-thumb cutoff of 5
      drawn in red, and 1.4846 for the sixth serum measurement. Three faint horizontal rules beneath suggest
      the matrix continuing for all 442 rows. Below a dividing line, two panels sit side by side. The left
      panel states the general definition of a multiple-regression coefficient as the effect of one unit of
      one column holding every other column fixed, and notes in red that this condition is only approximate
      when two columns move together, which is what destabilises the coefficients. The right panel walks
      through the lesson's centrepiece: duplicating s1 exactly splits its original coefficient of minus 1.09
      into two coefficients of minus 0.545 each, whose sum matches the original to eight decimal places,
      whose maximum prediction change across the whole dataset is 3.98 times ten to the minus twelve, and
      whose R2 is unchanged at 0.5177, closing with the observation that neither half of the split means
      anything on its own.
  - id: duplicate-column-flow
    file: assets/duplicate-column-flow.svg
    type: flow-animated
    title: >-
      Five noise seeds, two wildly swinging coefficients, one steady sum and one steady set of predictions
    alt: >-
      Diagram: five seed groups labelled seed 0 through seed 4, each showing a pair of bars for the
      near-duplicate column's two coefficients, revealed left to right. At seed 0 the pair reads plus 0.76 and
      minus 1.85. At seed 1, plus 4.92 and minus 5.99. At seed 2, minus 1.64 and plus 0.55. At seed 3, plus
      3.68 and minus 4.77. At seed 4, minus 5.61 and plus 4.49. The bars swing above and below a zero line
      and repeatedly change sign between seeds. A panel beneath states that across all five seeds the sum of
      the two coefficients has mean minus 1.0891 and standard deviation 0.0144, the largest single
      prediction move across ten seeds tried is 6.59 on a target whose own spread is 77, and R2 stays within
      0.5178 to 0.5186 throughout. A caption reads that wild coefficients and stable predictions are the
      whole lesson. A prefers-reduced-motion block leaves every seed and every value visible at once
    description: >-
      An animated bar-pair chart with five groups, one per noise seed, revealed left to right on an
      eight-second loop so the instability reads as motion, each group staying fully visible once revealed.
      Each group plots two diverging bars against a shared zero baseline, one blue for coefficient a and one
      red-outlined for coefficient b, both computed by appending a copy of the s1 column plus one percent of
      Gaussian noise and refitting. The printed values are seed 0: plus 0.76 and minus 1.85; seed 1: plus
      4.92 and minus 5.99; seed 2: minus 1.64 and plus 0.55; seed 3: plus 3.68 and minus 4.77; seed 4: minus
      5.61 and plus 4.49 -- the bars visibly swing in height and repeatedly cross zero, changing which
      coefficient is positive from seed to seed. A legend identifies the two bar colours and a marching-dash
      green line reading "sum, approximately minus 1.09, steady." Beneath the chart, a bordered panel states
      the numbers that do not move: across all five seeds the coefficients' sum has mean minus 1.0891 and
      standard deviation 0.0144, the largest single prediction change seen across ten seeds tried in total is
      6.59 on a target whose own standard deviation is 77, and R2 stays within 0.5178 to 0.5186 throughout. A
      closing caption states that wild coefficients alongside stable predictions is the whole lesson. A
      prefers-reduced-motion media query disables the reveal animation and the marching dashes, leaving every
      seed's bars and every printed value visible at once, so the still frame carries the complete argument.
