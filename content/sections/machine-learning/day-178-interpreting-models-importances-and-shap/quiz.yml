questions:
  - question: "Why is scikit-learn's default feature_importances_ (Mean Decrease in Impurity / Gini MDI) in Random Forests considered dangerous for production model interpretation?"
    options:
      - "MDI is only defined for linear regression and crashes on decision trees."
      - "MDI requires inverting a matrix of dimension D x D which causes numerical overflow."
      - 'MDI is in-sample and inflates high-cardinality features'
      - "MDI violates the IEEE 754 floating-point standard."
    answer_index: 2
    explanation: "Because MDI measures how much Gini impurity decreases inside training tree splits, high-cardinality features offer many split opportunities to overfit training data, yielding high MDI importance despite being pure noise on out-of-sample validation data."

  - question: "What does the Efficiency Axiom of Shapley Values mathematically guarantee?"
    options:
      - "All features receive non-negative importance scores."
      - "The algorithm executes in O(1) constant time regardless of the number of features."
      - "The model will achieve at least 95% classification accuracy on holdout test splits."
      - 'The attributions sum to prediction minus baseline'
    answer_index: 3
    explanation: "The Efficiency Axiom states: sum(phi_i) = f(x) - E[f(X)]. Every single unit of prediction delta above or below the population average is completely and fairly allocated among the features with zero unexplained residual."

  - question: "How does Permutation Feature Importance (MDA) measure feature relevance?"
    options:
      - 'Shuffle one column and measure the drop in score'
      - "By deleting the column from the database and retraining the model from scratch."
      - "By computing the Pearson correlation coefficient between the feature and the target."
      - "By setting all values of the feature to zero and measuring inference latency."
    answer_index: 0
    explanation: "Permutation feature importance breaks the statistical association between feature j and the target y by shuffling column j across validation rows. If the feature was critical, model validation score drops significantly."

  - question: "What is the primary computational breakthrough of TreeSHAP compared to model-agnostic KernelSHAP?"
    options:
      - "TreeSHAP eliminates the need for decision tree splits."
      - 'TreeSHAP uses the tree structure for exact values'
      - "TreeSHAP converts all non-linear trees into a single linear regression model."
      - "TreeSHAP works without access to tree weights or leaf values."
    answer_index: 1
    explanation: "Scott Lundberg et al. developed TreeSHAP to traverse all possible feature coalitions simultaneously along tree paths in polynomial time O(TLD^2) (where T is trees, L is leaves, D is depth), making exact SHAP values computable for millions of records."

  - question: "In a SHAP Beeswarm Summary Plot, what does a cluster of red dots located to the right of the center line (SHAP value > 0) signify?"
    options:
      - "The feature has low correlation with the target variable."
      - "The feature is causing an internal out-of-memory error."
      - 'High values push the prediction above the baseline'
      - "The feature values are missing in the test split."
    answer_index: 2
    explanation: "In SHAP beeswarm plots, dot color represents feature value (red = high, blue = low) and horizontal position represents SHAP attribution. Red dots to the right indicate that high feature values increase the model prediction."
