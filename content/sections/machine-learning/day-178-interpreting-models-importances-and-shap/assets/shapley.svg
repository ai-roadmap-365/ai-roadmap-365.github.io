<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>Shapley attribution</title>
  <style>
    .shapley-bg   { fill: #f8fafc; }
    .shapley-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shapley-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shapley-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shapley-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shapley-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shapley-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shapley-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shapley-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shapley-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shapley-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shapley-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shapley-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .shapley-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .shapley-stage { opacity: 1; }

    .shapley-s0 { animation-delay: 0.00s; }
    .shapley-e0 { animation-delay: 0.00s; }
    .shapley-s1 { animation-delay: 1.28s; }
    .shapley-e1 { animation-delay: 1.28s; }
    .shapley-s2 { animation-delay: 2.56s; }
    .shapley-e2 { animation-delay: 2.56s; }
    .shapley-s3 { animation-delay: 3.84s; }
    .shapley-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .shapley-conn  { animation: shapley-trace 6.4s ease-in-out infinite; }
      .shapley-stage { animation: shapley-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes shapley-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes shapley-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .shapley-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .shapley-stage { animation: shapley-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes shapley-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="shapley-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="shapley-bg" width="980" height="322"/>
  <text class="shapley-h1"  x="30" y="40">Shapley attribution</text>
  <text class="shapley-sub" x="30" y="64">Four properties.</text>
  <g class="shapley-stage shapley-s0">
    <rect class="shapley-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="shapley-step" x="44" y="142">01</text>
    <text class="shapley-name" x="70" y="142">Contributions sum exactly to the prediction</text>
    <text class="shapley-desc" x="44" y="166">Minus the baseline. Nothing is</text>
    <text class="shapley-desc" x="44" y="182">unallocated.</text>
  </g>
  <line class="shapley-line shapley-conn shapley-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#shapley-tip)"/>
  <g class="shapley-stage shapley-s1">
    <rect class="shapley-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="shapley-step" x="280" y="142">02</text>
    <text class="shapley-name" x="306" y="142">Features contributing identically receive identical credit</text>
    <text class="shapley-desc" x="280" y="166">Which is fairness, formally</text>
    <text class="shapley-desc" x="280" y="182">stated.</text>
  </g>
  <line class="shapley-line shapley-conn shapley-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#shapley-tip)"/>
  <g class="shapley-stage shapley-s2">
    <rect class="shapley-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="shapley-step" x="516" y="142">03</text>
    <text class="shapley-name" x="542" y="142">A feature that changes nothing receives zero</text>
    <text class="shapley-desc" x="516" y="166">Which sounds obvious and many</text>
    <text class="shapley-desc" x="516" y="182">methods violate.</text>
  </g>
  <line class="shapley-line shapley-conn shapley-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#shapley-tip)"/>
  <g class="shapley-stage shapley-s3">
    <rect class="shapley-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="shapley-step" x="752" y="142">04</text>
    <text class="shapley-name" x="778" y="142">And it is the unique method with all three</text>
    <text class="shapley-desc" x="752" y="166">Which is a theorem, not a</text>
    <text class="shapley-desc" x="752" y="182">preference.</text>
  </g>
  <text class="shapley-sub" x="30" y="304">Uniqueness under those axioms is what distinguishes this from other attribution schemes: any method with all three properties is this one.</text>
</svg>
