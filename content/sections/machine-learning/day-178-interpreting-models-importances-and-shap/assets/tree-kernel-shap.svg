<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Exact against approximate.">
  <title>Two ways to compute attribution</title>
  <style>
    .tree-kernel-shap-bg   { fill: #f8fafc; }
    .tree-kernel-shap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-kernel-shap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-kernel-shap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-kernel-shap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-kernel-shap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-kernel-shap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-kernel-shap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-kernel-shap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-kernel-shap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-kernel-shap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-kernel-shap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-kernel-shap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-kernel-shap-row { opacity: 1; }
    .tree-kernel-shap-r0 { animation-delay: 0.00s; }
    .tree-kernel-shap-r1 { animation-delay: 0.45s; }
    .tree-kernel-shap-r2 { animation-delay: 0.90s; }
    .tree-kernel-shap-r3 { animation-delay: 1.35s; }
    .tree-kernel-shap-r4 { animation-delay: 1.80s; }
    .tree-kernel-shap-row { animation: tree-kernel-shap-reveal 7.3s ease-in-out infinite; }
    @keyframes tree-kernel-shap-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tree-kernel-shap-bg" width="980" height="390"/>
  <text class="tree-kernel-shap-h1"  x="30" y="40">Two ways to compute attribution</text>
  <text class="tree-kernel-shap-sub" x="30" y="64">Exact against approximate.</text>
  <rect class="tree-kernel-shap-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tree-kernel-shap-name" x="46" y="122">Tree-specific</text>
  <text class="tree-kernel-shap-desc" x="46" y="142">Exact and fast.</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r0" x="46" y="182">Exploits the tree structure directly</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r1" x="46" y="216">Polynomial time, not exponential</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r2" x="46" y="250">Exact values, no sampling</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r3" x="46" y="284">Only works for tree models</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r4" x="46" y="318">Fast enough for every prediction</text>
  <rect class="tree-kernel-shap-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tree-kernel-shap-name" x="526" y="122">Model-agnostic</text>
  <text class="tree-kernel-shap-desc" x="526" y="142">Approximate and slow.</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r0" x="526" y="182">Treats the model as a black box</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r1" x="526" y="216">Samples coalitions of features</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r2" x="526" y="250">Approximate, with sampling error</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r3" x="526" y="284">Works for any model at all</text>
  <text class="tree-kernel-shap-desc tree-kernel-shap-row tree-kernel-shap-r4" x="526" y="318">Too slow for high throughput</text>
  <text class="tree-kernel-shap-sub" x="30" y="372">Using tree ensembles makes exact attribution affordable per prediction, which is a real and under-appreciated argument for them in regulated deployments.</text>
</svg>
