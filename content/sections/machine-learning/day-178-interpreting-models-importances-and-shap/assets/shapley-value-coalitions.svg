<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Shapley Value Coalitions</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-active { fill: var(--accent-subtle, #1e1b4b); stroke: var(--accent, #6366f1); stroke-width: 2; rx: 8; }
    .box-coalition { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 6; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .wire { stroke: var(--border-subtle, #475569); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .wire-accent { stroke: var(--accent, #6366f1); stroke-width: 2; fill: none; marker-end: url(#arrow-accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Game-Theoretic Shapley Values: Marginal Coalition Attributions</text>
  <text x="450" y="65" class="text-sub">Measuring Feature i Contribution across All Possible Feature Subsets S subset N</text>

  <!-- Empty Coalition -->
  <rect x="50" y="120" width="160" height="50" class="box" />
  <text x="130" y="150" class="text-title">Empty S = {}</text>

  <!-- Size 1 Coalitions -->
  <rect x="270" y="90" width="160" height="45" class="box-coalition" />
  <text x="350" y="118" class="text-title">S = {Age}</text>

  <rect x="270" y="150" width="160" height="45" class="box-coalition" />
  <text x="350" y="178" class="text-title">S = {Income}</text>

  <!-- Size 2 Coalitions -->
  <rect x="500" y="120" width="170" height="50" class="box-coalition" />
  <text x="585" y="150" class="text-title">S = {Age, Income}</text>

  <!-- Final Instance Prediction -->
  <rect x="720" y="100" width="140" height="90" class="box-active" />
  <text x="790" y="135" class="text-title">f(x)</text>
  <text x="790" y="160" class="text-sub">Total Prediction</text>

  <!-- Arrows -->
  <path d="M 210 145 L 270 115" class="wire" />
  <path d="M 210 145 L 270 170" class="wire" />
  <path d="M 430 115 L 500 145" class="wire" />
  <path d="M 430 170 L 500 145" class="wire" />
  <path d="M 670 145 L 720 145" class="wire-accent" />

  <!-- Bottom: Shapley Formula Breakdown -->
  <rect x="100" y="240" width="700" height="210" class="box" />
  <text x="450" y="275" class="text-title">The Four Fundamental Shapley Axioms</text>

  <text x="130" y="315" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #10b981;">1. Efficiency:</text>
  <text x="240" y="315" class="text-sub" style="text-anchor: start;">Sum of all feature attributions equals model deviation: sum(phi_i) = f(x) - E[f(X)]</text>

  <text x="130" y="350" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #3b82f6;">2. Symmetry:</text>
  <text x="240" y="350" class="text-sub" style="text-anchor: start;">If two features contribute equally to all coalitions, phi_i = phi_j</text>

  <text x="130" y="385" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #f59e0b;">3. Dummy Player:</text>
  <text x="240" y="385" class="text-sub" style="text-anchor: start;">If a feature has zero marginal gain in all coalitions, phi_i = 0</text>

  <text x="130" y="420" class="text-sub" style="text-anchor: start; font-weight: 700; fill: #ec4899;">4. Additivity:</text>
  <text x="240" y="420" class="text-sub" style="text-anchor: start;">For tree ensembles f + g, the ensemble attribution is the sum: phi_i(f + g) = phi_i(f) + phi_i(g)</text>
</svg>
