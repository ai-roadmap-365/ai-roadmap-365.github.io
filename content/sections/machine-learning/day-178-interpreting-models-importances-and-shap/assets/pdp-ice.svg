<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Dependence plots</title>
  <style>
    .pdp-ice-bg   { fill: #f8fafc; }
    .pdp-ice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdp-ice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdp-ice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdp-ice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdp-ice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pdp-ice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pdp-ice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pdp-ice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pdp-ice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pdp-ice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pdp-ice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pdp-ice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pdp-ice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pdp-ice-stage { opacity: 1; }

    .pdp-ice-s0 { animation-delay: 0.00s; }
    .pdp-ice-e0 { animation-delay: 0.00s; }
    .pdp-ice-s1 { animation-delay: 1.28s; }
    .pdp-ice-e1 { animation-delay: 1.28s; }
    .pdp-ice-s2 { animation-delay: 2.56s; }
    .pdp-ice-e2 { animation-delay: 2.56s; }
    .pdp-ice-s3 { animation-delay: 3.84s; }
    .pdp-ice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pdp-ice-conn  { animation: pdp-ice-trace 6.4s ease-in-out infinite; }
      .pdp-ice-stage { animation: pdp-ice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pdp-ice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pdp-ice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pdp-ice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pdp-ice-stage { animation: pdp-ice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pdp-ice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pdp-ice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pdp-ice-bg" width="980" height="322"/>
  <text class="pdp-ice-h1"  x="30" y="40">Dependence plots</text>
  <text class="pdp-ice-sub" x="30" y="64">Four steps.</text>
  <g class="pdp-ice-stage pdp-ice-s0">
    <rect class="pdp-ice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pdp-ice-step" x="44" y="142">01</text>
    <text class="pdp-ice-name" x="70" y="142">Sweep one feature across its range</text>
    <text class="pdp-ice-desc" x="44" y="166">Holding the others at their</text>
    <text class="pdp-ice-desc" x="44" y="182">observed values.</text>
  </g>
  <line class="pdp-ice-line pdp-ice-conn pdp-ice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pdp-ice-tip)"/>
  <g class="pdp-ice-stage pdp-ice-s1">
    <rect class="pdp-ice-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pdp-ice-step" x="280" y="142">02</text>
    <text class="pdp-ice-name" x="306" y="142">Average the predictions at each point</text>
    <text class="pdp-ice-desc" x="280" y="166">Which gives the average effect.</text>
  </g>
  <line class="pdp-ice-line pdp-ice-conn pdp-ice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pdp-ice-tip)"/>
  <g class="pdp-ice-stage pdp-ice-s2">
    <rect class="pdp-ice-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pdp-ice-step" x="516" y="142">03</text>
    <text class="pdp-ice-name" x="542" y="142">But also plot each row's own curve</text>
    <text class="pdp-ice-desc" x="516" y="166">Which the average conceals.</text>
  </g>
  <line class="pdp-ice-line pdp-ice-conn pdp-ice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pdp-ice-tip)"/>
  <g class="pdp-ice-stage pdp-ice-s3">
    <rect class="pdp-ice-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pdp-ice-step" x="752" y="142">04</text>
    <text class="pdp-ice-name" x="778" y="142">Diverging individual curves reveal interactions</text>
    <text class="pdp-ice-desc" x="752" y="166">Where the average is misleading.</text>
  </g>
  <text class="pdp-ice-sub" x="30" y="304">A flat average curve hiding strongly opposed individual effects is the failure the individual curves exist to expose, and it is common wherever interactions matter.</text>
</svg>
