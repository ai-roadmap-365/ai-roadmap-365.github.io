<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Feature Importance Comparison Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-bad { fill: #7f1d1d; stroke: #ef4444; stroke-width: 2; rx: 8; }
    .box-good { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
    .bar { fill: #6366f1; rx: 4; }
    .bar-bad { fill: #ef4444; rx: 4; }
    .bar-good { fill: #10b981; rx: 4; }
    .pulse-glow { animation: glow 2s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: 0.7; } to { opacity: 1.0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-glow { animation: none !important; opacity: 1.0; }
    }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-bar { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #f8fafc; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Feature Importance Methods: Flaws vs Truth</text>
  <text x="450" y="65" class="text-sub">Comparing Tree Gini MDI, Permutation Importance, and SHAP Attributions</text>

  <!-- Column 1: Tree MDI (Flawed) -->
  <rect x="50" y="100" width="250" height="340" class="box" />
  <text x="175" y="130" class="text-title">1. Tree Gini MDI</text>
  <text x="175" y="150" class="text-sub" fill="#ef4444">In-Sample Impurity (Biased)</text>

  <text x="70" y="195" class="text-bar">High Cardinality ID</text>
  <rect x="70" y="205" width="200" height="20" class="bar-bad" />

  <text x="70" y="255" class="text-bar">Continuous Float</text>
  <rect x="70" y="265" width="160" height="20" class="bar-bad" />

  <text x="70" y="315" class="text-bar">True Binary Signal</text>
  <rect x="70" y="325" width="40" height="20" class="bar-bad" />

  <text x="175" y="390" class="text-sub">Over-inflates high cardinality</text>
  <text x="175" y="410" class="text-sub">Evaluated on train set only</text>

  <!-- Column 2: Permutation (Better) -->
  <rect x="325" y="100" width="250" height="340" class="box" />
  <text x="450" y="130" class="text-title">2. Permutation MDA</text>
  <text x="450" y="150" class="text-sub" fill="#f59e0b">Out-of-Sample Shuffle</text>

  <text x="345" y="195" class="text-bar">True Binary Signal</text>
  <rect x="345" y="205" width="180" height="20" class="bar" />

  <text x="345" y="255" class="text-bar">Continuous Float</text>
  <rect x="345" y="265" width="140" height="20" class="bar" />

  <text x="345" y="315" class="text-bar">High Cardinality ID</text>
  <rect x="345" y="325" width="15" height="20" class="bar" />

  <text x="450" y="390" class="text-sub">Evaluated on validation data</text>
  <text x="450" y="410" class="text-sub">Distorted by correlated features</text>

  <!-- Column 3: SHAP Values (Gold Standard) -->
  <rect x="600" y="100" width="250" height="340" class="box-good pulse-glow" />
  <text x="725" y="130" class="text-title">3. TreeSHAP Values</text>
  <text x="725" y="150" class="text-sub" fill="#10b981">Game-Theoretic Fair Attribution</text>

  <text x="620" y="195" class="text-bar">True Binary Signal</text>
  <rect x="620" y="205" width="190" height="20" class="bar-good" />

  <text x="620" y="255" class="text-bar">Continuous Float</text>
  <rect x="620" y="265" width="130" height="20" class="bar-good" />

  <text x="620" y="315" class="text-bar">High Cardinality ID</text>
  <rect x="620" y="325" width="5" height="20" class="bar-good" />

  <text x="725" y="390" class="text-sub">Guaranteed by 4 Shapley axioms</text>
  <text x="725" y="410" class="text-sub">Local and global explanations</text>
</svg>
