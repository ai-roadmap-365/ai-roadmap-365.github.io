<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="To the person it affected.">
  <title>Explaining a decision</title>
  <style>
    .audit-trail-bg   { fill: #f8fafc; }
    .audit-trail-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-trail-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-trail-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-trail-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-trail-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .audit-trail-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .audit-trail-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .audit-trail-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .audit-trail-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .audit-trail-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .audit-trail-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .audit-trail-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .audit-trail-row { opacity: 1; }
    .audit-trail-r0 { animation-delay: 0.00s; }
    .audit-trail-r1 { animation-delay: 0.45s; }
    .audit-trail-r2 { animation-delay: 0.90s; }
    .audit-trail-r3 { animation-delay: 1.35s; }
    .audit-trail-r4 { animation-delay: 1.80s; }
    .audit-trail-row { animation: audit-trail-reveal 7.3s ease-in-out infinite; }
    @keyframes audit-trail-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="audit-trail-bg" width="980" height="390"/>
  <text class="audit-trail-h1"  x="30" y="40">Explaining a decision</text>
  <text class="audit-trail-sub" x="30" y="64">To the person it affected.</text>
  <rect class="audit-trail-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="audit-trail-name" x="46" y="122">No explanation</text>
  <text class="audit-trail-desc" x="46" y="142">Take it as given.</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r0" x="46" y="182">The decision is stated, not justified</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r1" x="46" y="216">No way to check it for error</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r2" x="46" y="250">No way to contest it</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r3" x="46" y="284">No way to know what would change it</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r4" x="46" y="318">This is an opaque model</text>
  <rect class="audit-trail-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="audit-trail-name" x="526" y="122">Attributed</text>
  <text class="audit-trail-desc" x="526" y="142">Reasons, per case.</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r0" x="526" y="182">Each factor's contribution stated</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r1" x="526" y="216">Errors in the inputs become visible</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r2" x="526" y="250">The decision can be contested</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r3" x="526" y="284">What would change it is knowable</text>
  <text class="audit-trail-desc audit-trail-row audit-trail-r4" x="526" y="318">This is a locally explained model</text>
  <text class="audit-trail-sub" x="30" y="372">The fourth row is what people affected by a decision most often want: not why they were declined, but what would need to be different.</text>
</svg>
