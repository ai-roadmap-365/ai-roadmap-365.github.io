visuals:
  - id: shapley-value-coalitions
    file: assets/shapley-value-coalitions.svg
    type: diagram
    title: 'Game-Theoretic Shapley Values: Marginal Coalition Attributions'
    alt: 'Diagram showing the mathematical coalition expansion of Shapley values across feature subsets satisfying the four efficiency and fairness axioms.'
    description: 'A static mathematical diagram detailing the cooperative game theory coalition formulation and four axiomatic guarantees of Shapley values.'
  - id: feature-importance-comparison-flow
    file: assets/feature-importance-comparison-flow.svg
    type: flow-animated
    title: 'Feature Importance Methods: Flaws vs Truth'
    alt: 'Animated comparison chart contrasting the vulnerabilities of Tree Gini MDI against Permutation Importance and game-theoretic SHAP values.'
    description: 'An animated comparison exposing how Mean Decrease in Impurity is deceived by high cardinality while Permutation and SHAP accurately recover true signal.'
  - id: interpret-idea
    file: assets/interpret-idea.svg
    type: diagram
    title: 'Two kinds of explanation'
    alt: 'Diagram: global model explanation compared with local prediction explanation'
    description: 'A four-stage description of interpretability covering the two questions, global methods, local methods and their different uses.'
  - id: mdi-flaw
    file: assets/mdi-flaw.svg
    type: diagram
    title: 'The biased default'
    alt: 'Diagram: why the default tree importance measure is biased'
    description: 'A four-stage description of impurity importance bias covering the measure, the cardinality bias, the consequence and the remedy.'
  - id: permutation
    file: assets/permutation.svg
    type: diagram
    title: 'Permutation importance'
    alt: 'Diagram: how permutation importance measures a feature''s contribution'
    description: 'A four-stage description of permutation importance covering the baseline, the shuffle, the drop and the caveat.'
  - id: pdp-ice
    file: assets/pdp-ice.svg
    type: diagram
    title: 'Dependence plots'
    alt: 'Diagram: how partial dependence and individual curves show a feature''s effect'
    description: 'A four-stage description of dependence plots covering the sweep, the averaging, the individual curves and the divergence.'
  - id: shapley
    file: assets/shapley.svg
    type: diagram
    title: 'Shapley attribution'
    alt: 'Diagram: the four properties that make Shapley attribution unique'
    description: 'A four-stage description of Shapley values covering efficiency, symmetry, the null property and uniqueness.'
  - id: tree-kernel-shap
    file: assets/tree-kernel-shap.svg
    type: diagram
    title: 'Two ways to compute attribution'
    alt: 'Diagram: exact tree attribution compared with model-agnostic approximation'
    description: 'A two-column comparison of exact tree-based attribution against model-agnostic approximation.'
  - id: interpret-not
    file: assets/interpret-not.svg
    type: diagram
    title: 'What interpretability is not'
    alt: 'Diagram: four misconceptions about model interpretability'
    description: 'A two-column comparison of misconceptions about interpretability against what is true.'
  - id: interpret-history
    file: assets/interpret-history.svg
    type: diagram
    title: 'Four steps in interpretability'
    alt: 'Diagram: the historical progression of model interpretability methods'
    description: 'A four-stage description of interpretability history covering inherently simple models, importance measures, model-agnostic methods and regulatory requirements.'
  - id: audit-trail
    file: assets/audit-trail.svg
    type: diagram
    title: 'Explaining a decision'
    alt: 'Diagram: an unexplained decision compared with an attributed one'
    description: 'A two-column comparison of an unexplained decision against an attributed one.'
  - id: interpret-implications
    file: assets/interpret-implications.svg
    type: diagram
    title: 'Four consequences of interpretability'
    alt: 'Diagram: the deployment, debugging, legal and misuse implications of interpretability'
    description: 'A four-stage description of interpretability implications covering deployment, debugging value, legal obligation and misinterpretation risk.'
  - id: interpret-when
    file: assets/interpret-when.svg
    type: diagram
    title: 'Which interpretability tool when'
    alt: 'Diagram: choosing an interpretability method by the question asked'
    description: 'A two-column comparison of questions against the interpretability method that answers each.'
  - id: visualisation-suite
    file: assets/visualisation-suite.svg
    type: diagram
    title: 'What to put in a model report'
    alt: 'Diagram: the four visualisations that make a model report useful'
    description: 'A four-stage description of a model report covering global importance, dependence, local attribution and subgroup comparison.'
