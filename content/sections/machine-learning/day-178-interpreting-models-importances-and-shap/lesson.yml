title: 'Interpreting Models: Importances and SHAP'
section: machine-learning
subsection: supervised-learning
week: 26
learning_promise: >-
  Master the mathematical foundations of Explainable AI (XAI): understand the fatal statistical flaws of built-in Tree
  Gini Impurity feature importances, compute out-of-sample Permutation Feature Importance, derive game-theoretic Shapley
  values from cooperative game theory satisfying the four foundational axioms, and generate production TreeSHAP waterfall
  and beeswarm explanations for high-stakes decision systems.
objectives:
  - 'Differentiate Global Model Interpretability from Local Instance Attribution'
  - 'Demonstrate why Tree Gini Mean Decrease in Impurity (MDI) is fatally biased toward high-cardinality noise'
  - 'Implement out-of-sample Permutation Feature Importance (Mean Decrease in Accuracy / MDA)'
  - 'Compute 1D Partial Dependence Plots (PDP) and Individual Conditional Expectation (ICE) curves'
  - 'Formulate the Shapley value equation and prove the four core axioms (Efficiency, Symmetry, Dummy, Additivity)'
  - 'Differentiate TreeSHAP polynomial tree traversal from KernelSHAP permutation sampling'
  - 'Interpret SHAP waterfall plots, beeswarm summary plots, and interaction force plots'
  - 'Audit production models for regulatory compliance and adversarial explanation manipulation'
prerequisites:
  - 'Day 163 -- Random Forests'
  - 'Day 165 -- XGBoost and LightGBM in Practice'
  - 'Day 172 -- Feature Selection'
