terms:
  - term: 'Mean Decrease in Impurity (MDI)'
    definition: 'Tree-based feature importance measuring total reduction in split criterion, susceptible to inflating cardinality and in-sample overfitting.'
  - term: 'Permutation Feature Importance'
    definition: 'Model-agnostic importance measuring validation score drop when values of a single feature column are randomly shuffled.'
  - term: 'Shapley Value'
    definition: 'The unique game-theoretic payoff allocation satisfying efficiency, symmetry, dummy player, and additivity axioms.'
  - term: 'SHAP (SHapley Additive exPlanations)'
    definition: 'A unified framework interpreting predictions by computing Shapley values of conditional expectations across feature coalitions.'
  - term: 'Partial Dependence Plot (PDP)'
    definition: 'A visual tool showing the marginal average effect of one or two features on predicted outcomes while integrating over other features.'
  - term: 'Individual Conditional Expectation (ICE)'
    definition: 'A visualization plotting individual instance prediction curves across feature values, exposing heterogeneous subgroup effects obscured by PDP.'
  - term: 'TreeSHAP'
    definition: 'A fast polynomial-time algorithm for computing exact Shapley values on tree-based ensembles.'
  - term: 'Local Interpretability'
    definition: 'Explaining the exact contribution of each feature towards a single specific individual prediction.'
