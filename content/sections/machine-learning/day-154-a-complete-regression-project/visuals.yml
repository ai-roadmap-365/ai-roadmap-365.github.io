visuals:
  - id: protocol-architecture
    file: assets/protocol-architecture.svg
    type: diagram
    title: >-
      The eight-stage protocol for one regression project, with the number each stage actually produced
    alt: >-
      Diagram: eight boxes in reading order, left to right then wrapping to a second row: frame the
      problem, noting the target has no physical unit; state a mean-predictor baseline of 70.4637 RMSE;
      split 442 rows into 331 train and 111 test; sweep 23 candidate pipelines; cross-validate on train
      rows only and select Lasso with alpha equal to 1 at a cross-validated RMSE of 53.8958; evaluate the
      test set exactly once through a gate, scoring 56.5566 RMSE; read the residual diagnostics, finding a
      mild heteroscedasticity signal of 0.2386, a weak curvature signal of -0.1278, and a Q-Q correlation
      of 0.9901; and state a verdict of a margin of 13.9071 RMSE points with a 95 percent bootstrap
      interval from 5.5852 to 22.3324, distinguishable from the baseline. A highlighted panel beneath
      states that selecting by peeking at the test set was never negative across twenty seeds, averaging a
      gap of 0.5279 RMSE points in the leak's favour, and that a 95 percent prediction interval achieved a
      realised coverage of 0.9459
    description: >-
      A static architecture diagram of eight connected boxes describing the full protocol this lesson runs
      on the diabetes-progression dataset. Stage 1 frames the problem: a composite disease-progression
      score with no physical unit, predicted from 10 real-valued measurements in their raw units, 442
      rows, the only bundled regression dataset that needs no download. Stage 2 states the mean-predictor
      baseline of 70.4637 RMSE. Stage 3 splits the data 331 train against 111 test, with the test rows
      held back. Stage 4 sweeps 23 candidate pipelines -- 11 ridge regularisation strengths, 11 lasso
      regularisation strengths, 1 plain OLS -- with K counted explicitly. Stage 5 cross-validates every
      candidate on train rows only and selects the winner, Lasso with alpha equal to 1 at a
      cross-validated RMSE of 53.8958. Stage 6 evaluates the test set exactly once through a GatedTestSet,
      scoring 56.5566 RMSE, with any second attempt raising an error. Stage 7 reads the residual
      diagnostics: a mild heteroscedasticity signal of 0.2386, a weak curvature signal of -0.1278, a
      normal-probability correlation of 0.9901, and a worst individual residual of -157.3 points. Stage 8
      states the verdict: a margin of 13.9071 RMSE points over baseline with a 95 percent bootstrap
      interval of [5.5852, 22.3324], clearly distinguishable. A highlighted panel beneath the eight boxes
      carries two further checks: selecting by peeking at the test set never once produced a worse RMSE
      than selecting honestly across twenty seeds, averaging a gap of 0.5279 RMSE points in the leak's
      favour; and a 95 percent prediction interval, sized from training residuals only, achieved a
      realised coverage of 0.9459 on the test rows.
  - id: leak-and-coverage-flow
    file: assets/leak-and-coverage-flow.svg
    type: flow-animated
    title: >-
      The leaky-selection gap and the prediction interval's realised coverage, both across eight sampled
      seeds
    alt: >-
      Diagram: two bar-chart panels revealed left to right. The top panel plots the gap between a leaky
      test-set-peeking selection and the honest cross-validated one, in RMSE points, at eight of twenty
      independently seeded runs; every bar sits above zero, and never below it. The bottom panel plots the
      realised coverage of a 95 percent prediction interval at the same eight seeds against a dashed line
      marking the 0.95 nominal rate; the bars scatter closely around that line, both above and below it
    description: >-
      An animated two-panel bar chart. The top panel shows the gap between a leaky selection (choosing a
      model by scoring every one of 23 candidates directly on the test set and keeping the lowest RMSE)
      and the honest one (selecting on cross-validated training rows, then looking at test once), in RMSE
      points, at eight of the lesson's twenty seeds. Every one of the eight bars sits above the zero line;
      none sits at or below it, ranging from 0.0761 to 1.0515. The bottom panel shows the realised
      coverage of a 95 percent prediction interval -- the fraction of test targets that actually fall
      inside a constant-width interval built from training residuals -- at the same eight seeds, plotted
      against a dashed line marking the 0.95 nominal rate. The coverage bars scatter closely around that
      line, from 0.9369 to 0.9730, both above and below it. Bars in both panels reveal left to right,
      roughly one every half second on an eight-second loop, with the second panel's bars beginning to
      reveal after the first panel's are all visible; each bar stays at full opacity once revealed. A
      highlighted note beneath states the full twenty-seed summary: mean leaky gap +0.5279, never
      negative, and a ten-seed mean coverage of 0.9558 against the 0.95 nominal rate. A
      prefers-reduced-motion block disables every reveal and leaves all bars and the note in their final
      positions, so the still frame carries the entire result.
