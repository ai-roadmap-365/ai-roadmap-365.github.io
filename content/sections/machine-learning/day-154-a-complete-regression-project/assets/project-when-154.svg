<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it can be trimmed.">
  <title>When the full protocol is warranted</title>
  <style>
    .project-when-154-bg   { fill: #f8fafc; }
    .project-when-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-when-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-when-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-when-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-when-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-when-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-when-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-when-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-when-154-row { opacity: 1; }
    .project-when-154-r0 { animation-delay: 0.00s; }
    .project-when-154-r1 { animation-delay: 0.45s; }
    .project-when-154-r2 { animation-delay: 0.90s; }
    .project-when-154-r3 { animation-delay: 1.35s; }
    .project-when-154-r4 { animation-delay: 1.80s; }
    .project-when-154-row { animation: project-when-154-reveal 7.3s ease-in-out infinite; }
    @keyframes project-when-154-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="project-when-154-bg" width="980" height="390"/>
  <text class="project-when-154-h1"  x="30" y="40">When the full protocol is warranted</text>
  <text class="project-when-154-sub" x="30" y="64">And when it can be trimmed.</text>
  <rect class="project-when-154-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="project-when-154-name" x="46" y="122">Full protocol</text>
  <text class="project-when-154-desc" x="46" y="142">Four cases.</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r0" x="46" y="182">Any model informing a real decision</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r1" x="46" y="216">Where the margin will be quoted</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r2" x="46" y="250">Where predictions carry consequences</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r3" x="46" y="284">Regulated or audited work</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r4" x="46" y="318">Where the model will be maintained</text>
  <rect class="project-when-154-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="project-when-154-name" x="526" y="122">Trim it</text>
  <text class="project-when-154-desc" x="526" y="142">Also four.</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r0" x="526" y="182">Exploratory feasibility checks</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r1" x="526" y="216">Where the answer is obvious either way</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r2" x="526" y="250">Teaching examples</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r3" x="526" y="284">Throwaway analysis</text>
  <text class="project-when-154-desc project-when-154-row project-when-154-r4" x="526" y="318">But keep the baseline and the split</text>
  <text class="project-when-154-sub" x="30" y="372">The baseline and the split are the irreducible minimum, because without them a feasibility check can conclude the opposite of the truth.</text>
</svg>
