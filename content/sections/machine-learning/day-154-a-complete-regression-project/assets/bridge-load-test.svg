<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not repeated until it passes.">
  <title>A single load test</title>
  <style>
    .bridge-load-test-bg   { fill: #f8fafc; }
    .bridge-load-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-load-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-load-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-load-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-load-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bridge-load-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bridge-load-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bridge-load-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bridge-load-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bridge-load-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bridge-load-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bridge-load-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bridge-load-test-row { opacity: 1; }
    .bridge-load-test-r0 { animation-delay: 0.00s; }
    .bridge-load-test-r1 { animation-delay: 0.45s; }
    .bridge-load-test-r2 { animation-delay: 0.90s; }
    .bridge-load-test-r3 { animation-delay: 1.35s; }
    .bridge-load-test-r4 { animation-delay: 1.80s; }
    .bridge-load-test-row { animation: bridge-load-test-reveal 7.3s ease-in-out infinite; }
    @keyframes bridge-load-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bridge-load-test-bg" width="980" height="390"/>
  <text class="bridge-load-test-h1"  x="30" y="40">A single load test</text>
  <text class="bridge-load-test-sub" x="30" y="64">Not repeated until it passes.</text>
  <rect class="bridge-load-test-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bridge-load-test-name" x="46" y="122">Repeated until it passes</text>
  <text class="bridge-load-test-desc" x="46" y="142">Meaningless.</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r0" x="46" y="182">Test, adjust, retest</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r1" x="46" y="216">Eventually it passes</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r2" x="46" y="250">The pass says nothing about the structure</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r3" x="46" y="284">The margin was tuned away</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r4" x="46" y="318">This is tuning against the test set</text>
  <rect class="bridge-load-test-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bridge-load-test-name" x="526" y="122">One gated test</text>
  <text class="bridge-load-test-desc" x="526" y="142">Decisive.</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r0" x="526" y="182">Everything settled beforehand</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r1" x="526" y="216">Tested once, under load</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r2" x="526" y="250">The result stands either way</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r3" x="526" y="284">The margin is real</text>
  <text class="bridge-load-test-desc bridge-load-test-row bridge-load-test-r4" x="526" y="318">This is a gated evaluation</text>
  <text class="bridge-load-test-sub" x="30" y="372">No engineer would accept a structure certified by a test repeated until it passed, and the same reasoning applies exactly to a model's reported score.</text>
</svg>
