<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks.">
  <title>Residual diagnostics</title>
  <style>
    .residual-diagnostics-bg   { fill: #f8fafc; }
    .residual-diagnostics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .residual-diagnostics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .residual-diagnostics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .residual-diagnostics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .residual-diagnostics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .residual-diagnostics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .residual-diagnostics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .residual-diagnostics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .residual-diagnostics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .residual-diagnostics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .residual-diagnostics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .residual-diagnostics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .residual-diagnostics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .residual-diagnostics-stage { opacity: 1; }

    .residual-diagnostics-s0 { animation-delay: 0.00s; }
    .residual-diagnostics-e0 { animation-delay: 0.00s; }
    .residual-diagnostics-s1 { animation-delay: 1.28s; }
    .residual-diagnostics-e1 { animation-delay: 1.28s; }
    .residual-diagnostics-s2 { animation-delay: 2.56s; }
    .residual-diagnostics-e2 { animation-delay: 2.56s; }
    .residual-diagnostics-s3 { animation-delay: 3.84s; }
    .residual-diagnostics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .residual-diagnostics-conn  { animation: residual-diagnostics-trace 6.4s ease-in-out infinite; }
      .residual-diagnostics-stage { animation: residual-diagnostics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes residual-diagnostics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes residual-diagnostics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .residual-diagnostics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .residual-diagnostics-stage { animation: residual-diagnostics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes residual-diagnostics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="residual-diagnostics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="residual-diagnostics-bg" width="980" height="322"/>
  <text class="residual-diagnostics-h1"  x="30" y="40">Residual diagnostics</text>
  <text class="residual-diagnostics-sub" x="30" y="64">Four checks.</text>
  <g class="residual-diagnostics-stage residual-diagnostics-s0">
    <rect class="residual-diagnostics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="residual-diagnostics-step" x="44" y="142">01</text>
    <text class="residual-diagnostics-name" x="70" y="142">Plot residuals against predictions</text>
    <text class="residual-diagnostics-desc" x="44" y="166">A pattern means the model form</text>
    <text class="residual-diagnostics-desc" x="44" y="182">is wrong.</text>
  </g>
  <line class="residual-diagnostics-line residual-diagnostics-conn residual-diagnostics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#residual-diagnostics-tip)"/>
  <g class="residual-diagnostics-stage residual-diagnostics-s1">
    <rect class="residual-diagnostics-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="residual-diagnostics-step" x="280" y="142">02</text>
    <text class="residual-diagnostics-name" x="306" y="142">Check whether the spread grows with the prediction</text>
    <text class="residual-diagnostics-desc" x="280" y="166">Which breaks the</text>
    <text class="residual-diagnostics-desc" x="280" y="182">constant-variance assumption.</text>
  </g>
  <line class="residual-diagnostics-line residual-diagnostics-conn residual-diagnostics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#residual-diagnostics-tip)"/>
  <g class="residual-diagnostics-stage residual-diagnostics-s2">
    <rect class="residual-diagnostics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="residual-diagnostics-step" x="516" y="142">03</text>
    <text class="residual-diagnostics-name" x="542" y="142">Read the five worst failures individually</text>
    <text class="residual-diagnostics-desc" x="516" y="166">Which is where the diagnosis</text>
    <text class="residual-diagnostics-desc" x="516" y="182">usually is.</text>
  </g>
  <line class="residual-diagnostics-line residual-diagnostics-conn residual-diagnostics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#residual-diagnostics-tip)"/>
  <g class="residual-diagnostics-stage residual-diagnostics-s3">
    <rect class="residual-diagnostics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="residual-diagnostics-step" x="752" y="142">04</text>
    <text class="residual-diagnostics-name" x="778" y="142">And check the distribution of the errors</text>
    <text class="residual-diagnostics-desc" x="752" y="166">Skew means the average is hiding</text>
    <text class="residual-diagnostics-desc" x="752" y="182">something.</text>
  </g>
  <text class="residual-diagnostics-sub" x="30" y="304">Reading the worst individual failures is the step a single aggregate score can never substitute for, and it is usually where the next improvement comes from.</text>
</svg>
