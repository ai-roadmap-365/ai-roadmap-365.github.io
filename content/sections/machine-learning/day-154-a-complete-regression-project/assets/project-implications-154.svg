<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are uncomfortable.">
  <title>Four consequences of the full protocol</title>
  <style>
    .project-implications-154-bg   { fill: #f8fafc; }
    .project-implications-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-implications-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-implications-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-implications-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-implications-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-implications-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-implications-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-implications-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .project-implications-154-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .project-implications-154-stage { opacity: 1; }

    .project-implications-154-s0 { animation-delay: 0.00s; }
    .project-implications-154-e0 { animation-delay: 0.00s; }
    .project-implications-154-s1 { animation-delay: 1.28s; }
    .project-implications-154-e1 { animation-delay: 1.28s; }
    .project-implications-154-s2 { animation-delay: 2.56s; }
    .project-implications-154-e2 { animation-delay: 2.56s; }
    .project-implications-154-s3 { animation-delay: 3.84s; }
    .project-implications-154-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .project-implications-154-conn  { animation: project-implications-154-trace 6.4s ease-in-out infinite; }
      .project-implications-154-stage { animation: project-implications-154-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes project-implications-154-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes project-implications-154-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .project-implications-154-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .project-implications-154-stage { animation: project-implications-154-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes project-implications-154-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="project-implications-154-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="project-implications-154-bg" width="980" height="322"/>
  <text class="project-implications-154-h1"  x="30" y="40">Four consequences of the full protocol</text>
  <text class="project-implications-154-sub" x="30" y="64">Two are uncomfortable.</text>
  <g class="project-implications-154-stage project-implications-154-s0">
    <rect class="project-implications-154-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-154-step" x="44" y="142">01</text>
    <text class="project-implications-154-name" x="70" y="142">The reported number survives deployment</text>
    <text class="project-implications-154-desc" x="44" y="166">Which is the entire purpose.</text>
  </g>
  <line class="project-implications-154-line project-implications-154-conn project-implications-154-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#project-implications-154-tip)"/>
  <g class="project-implications-154-stage project-implications-154-s1">
    <rect class="project-implications-154-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-154-step" x="280" y="142">02</text>
    <text class="project-implications-154-name" x="306" y="142">But it is lower than a leaky alternative</text>
    <text class="project-implications-154-desc" x="280" y="166">Which needs explaining to</text>
    <text class="project-implications-154-desc" x="280" y="182">stakeholders.</text>
  </g>
  <line class="project-implications-154-line project-implications-154-conn project-implications-154-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#project-implications-154-tip)"/>
  <g class="project-implications-154-stage project-implications-154-s2">
    <rect class="project-implications-154-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-154-step" x="516" y="142">03</text>
    <text class="project-implications-154-name" x="542" y="142">And the residual work takes real time</text>
    <text class="project-implications-154-desc" x="516" y="166">Longer than fitting the model.</text>
  </g>
  <line class="project-implications-154-line project-implications-154-conn project-implications-154-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#project-implications-154-tip)"/>
  <g class="project-implications-154-stage project-implications-154-s3">
    <rect class="project-implications-154-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="project-implications-154-step" x="752" y="142">04</text>
    <text class="project-implications-154-name" x="778" y="142">While the diagnostics show what to improve next</text>
    <text class="project-implications-154-desc" x="752" y="166">Which the score alone never</text>
    <text class="project-implications-154-desc" x="752" y="182">does.</text>
  </g>
  <text class="project-implications-154-sub" x="30" y="304">The diagnostics paying for themselves in direction is the argument to make internally: the extra time produces the next project's plan as well as this one's verdict.</text>
</svg>
