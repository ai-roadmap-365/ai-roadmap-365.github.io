<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward intervals.">
  <title>Four steps in reporting a model</title>
  <style>
    .project-history-154-bg   { fill: #f8fafc; }
    .project-history-154-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-history-154-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-history-154-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-history-154-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-history-154-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-history-154-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-history-154-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-history-154-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-history-154-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-history-154-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-history-154-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-history-154-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .project-history-154-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .project-history-154-stage { opacity: 1; }

    .project-history-154-s0 { animation-delay: 0.00s; }
    .project-history-154-e0 { animation-delay: 0.00s; }
    .project-history-154-s1 { animation-delay: 1.28s; }
    .project-history-154-e1 { animation-delay: 1.28s; }
    .project-history-154-s2 { animation-delay: 2.56s; }
    .project-history-154-e2 { animation-delay: 2.56s; }
    .project-history-154-s3 { animation-delay: 3.84s; }
    .project-history-154-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .project-history-154-conn  { animation: project-history-154-trace 6.4s ease-in-out infinite; }
      .project-history-154-stage { animation: project-history-154-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes project-history-154-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes project-history-154-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .project-history-154-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .project-history-154-stage { animation: project-history-154-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes project-history-154-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="project-history-154-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="project-history-154-bg" width="980" height="322"/>
  <text class="project-history-154-h1"  x="30" y="40">Four steps in reporting a model</text>
  <text class="project-history-154-sub" x="30" y="64">Toward intervals.</text>
  <g class="project-history-154-stage project-history-154-s0">
    <rect class="project-history-154-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="project-history-154-step" x="44" y="142">01</text>
    <text class="project-history-154-name" x="70" y="142">A bare score, on unstated data</text>
    <text class="project-history-154-desc" x="44" y="166">Which cannot be interpreted at</text>
    <text class="project-history-154-desc" x="44" y="182">all.</text>
  </g>
  <line class="project-history-154-line project-history-154-conn project-history-154-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#project-history-154-tip)"/>
  <g class="project-history-154-stage project-history-154-s1">
    <rect class="project-history-154-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="project-history-154-step" x="280" y="142">02</text>
    <text class="project-history-154-name" x="306" y="142">A held-out score</text>
    <text class="project-history-154-desc" x="280" y="166">An enormous improvement, and</text>
    <text class="project-history-154-desc" x="280" y="182">still unanchored.</text>
  </g>
  <line class="project-history-154-line project-history-154-conn project-history-154-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#project-history-154-tip)"/>
  <g class="project-history-154-stage project-history-154-s2">
    <rect class="project-history-154-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="project-history-154-step" x="516" y="142">03</text>
    <text class="project-history-154-name" x="542" y="142">A comparison against a stated baseline</text>
    <text class="project-history-154-desc" x="516" y="166">Which makes it a claim.</text>
  </g>
  <line class="project-history-154-line project-history-154-conn project-history-154-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#project-history-154-tip)"/>
  <g class="project-history-154-stage project-history-154-s3">
    <rect class="project-history-154-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="project-history-154-step" x="752" y="142">04</text>
    <text class="project-history-154-name" x="778" y="142">And an interval around the margin</text>
    <text class="project-history-154-desc" x="752" y="166">Which makes it a verdict.</text>
  </g>
  <text class="project-history-154-sub" x="30" y="304">Each step made the number harder to misread, and the last one is still the least common in published machine learning results.</text>
</svg>
