title: A Complete Regression Project
section: machine-learning
subsection: core-concepts
week: 22
learning_promise: >-
  After this lesson you will have run one regression project properly, once, on a real dataset, and
  watched six days of separate disciplines pay off together instead of in isolation. You will compute a
  mean-predictor baseline before fitting anything, sweep 23 real candidate pipelines -- ridge, lasso and
  plain OLS -- and select a winner by cross-validating on training rows only. You will evaluate the test
  set exactly once through a mechanical gate, and compute a 95 percent bootstrap interval around the
  winning model's margin over baseline -- 13.9071 RMSE points, comfortably clearing an interval of
  [5.5852, 22.3324]. You will read residual diagnostics as this day's centrepiece: a mild
  heteroscedasticity signal, a weak curvature signal, a from-scratch normal-probability check, and the
  five largest individual mistakes named and inspected. You will measure whether the model is worse for
  high-value targets than low-value ones on a disease-progression score, and find the answer is nearly
  flat rather than assuming it either way. You will reconstruct, deliberately, the mistake of selecting a
  model by scoring every candidate directly against the test set, and watch the resulting gap never once
  turn negative across 20 seeds. And you will build a prediction interval from held-out residuals and
  measure its realised coverage -- 0.9459 -- against its 0.95 nominal rate, rather than trusting the
  nominal number on faith.
objectives:
  - 'Choose a regression dataset by what is genuinely available offline, and state plainly when a target has no physical unit'
  - 'Compute a mean-predictor baseline before fitting any model, and use it as a gate every later result must clear'
  - 'Build a train/test split sized honestly for a small dataset, and hold the test rows back until exactly one evaluation'
  - 'Sweep a real set of candidate pipelines with scikit-learn''s Pipeline, and count K explicitly rather than losing track of it'
  - 'Select a winning configuration using cross-validation on training rows only, choosing RMSE as the metric before any model is fitted'
  - 'Evaluate a test set exactly once with a mechanical gate, reusing the GatedTestSet pattern from Day 144 and Day 147'
  - 'Compute a bootstrap interval around a model''s margin over baseline, and judge whether an improvement is distinguishable from noise at the test-set size actually available'
  - 'Read residual-vs-fitted, curvature and normal-probability diagnostics as the centrepiece of a regression verdict, not an afterthought to a single RMSE'
  - 'Measure whether a model''s errors are worse for high-value targets than low-value ones, and report the result honestly whichever way it comes out'
  - 'Reproduce the mistake of selecting a model by scoring every candidate directly on the test set, and explain why the resulting gap can never be negative'
  - 'Build a prediction interval from held-out training residuals, and measure its realised coverage against its nominal rate rather than assuming the two match'
  - 'Assemble frame, baseline, split, pipeline, cross-validation, selection, one test evaluation, residual diagnostics, a fairness check and prediction intervals into a single defensible verdict'
prerequisites:
  - 'Day 144 -- the three sets, the selection-optimism formula, and the GatedTestSet pattern this lesson reuses'
  - 'Day 147 -- the full classification protocol this lesson mirrors for regression, and the leaky-selection mistake this lesson reconstructs a second time'
  - 'Day 148 -- the one-predictor linear model, coefficient interpretation in real units, and the four assumptions this lesson''s residual diagnostics check'
  - 'Day 149 -- the loss as a choice, and why squared error and absolute error can disagree about which model is best'
  - 'Day 150 -- multicollinearity, measured on this exact dataset, needed to read why regularisation helps prediction only modestly here even though it stabilises coefficients dramatically'
  - 'Day 151 -- ridge and lasso, the two regularised families this lesson''s sweep is built from'
  - 'Day 152 -- metrics that can be gamed or inverted, needed to trust that RMSE was chosen here as a considered choice rather than a default'
  - 'Day 153 -- OLS built from scratch, and comfort with NumPy arrays and reading a pytest failure; a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
