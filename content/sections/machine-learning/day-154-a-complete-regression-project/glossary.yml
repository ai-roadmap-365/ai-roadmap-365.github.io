terms:
  - term: Mean-predictor baseline
    definition: >-
      The RMSE and R2 of predicting the training mean for every test row, with no model at all. Every
      model in this lesson has to clear it to be worth building -- here, 70.4637 RMSE -- and it is
      computed before any model is fitted, not after, as a check on whether the whole exercise is worth
      doing.
  - term: Candidate pipeline
    definition: >-
      One complete, fittable scikit-learn Pipeline -- a specific estimator with specific hyperparameters,
      any preprocessing folded in. This lesson sweeps 23 of them: 11 ridge regularisation strengths, 11
      lasso regularisation strengths, and 1 plain OLS.
  - term: K, counted
    definition: >-
      The number of candidates actually tried in a selection sweep. Day 144 named it as the number nobody
      remembers; this lesson counts it explicitly at 23, because a defensible model comparison needs it
      stated, not estimated.
  - term: 5-fold cross-validation, scored by RMSE
    definition: >-
      Splitting the training rows into five folds and scoring every candidate on all five, so every
      training row serves as held-out data exactly once. The scoring metric -- RMSE -- is chosen before
      any candidate is fitted, in the target's own unitless composite-score points.
  - term: The margin
    definition: >-
      The improvement of a winning model's test RMSE over the baseline RMSE. Here, 70.4637 minus 56.5566
      equals 13.9071 RMSE points -- the number a bootstrap interval is computed around, not trusted on its
      own.
  - term: Bootstrap interval on the margin
    definition: >-
      A 95 percent interval built by resampling the test rows with replacement thousands of times and
      recomputing both RMSEs on each resample. Computed here as [5.5852, 22.3324] -- since it excludes
      zero, the model is distinguishable from baseline at this test-set size.
  - term: GatedTestSet
    definition: >-
      An object that wraps the held-out test rows and permits exactly one call to evaluate, raising
      TestSetTouchedTwice on any further attempt without advancing its own counter. The discipline from
      Day 144 and Day 147, made mechanical again on a regression problem.
  - term: Leaky selection
    definition: >-
      Choosing a winning configuration by fitting every candidate and scoring each one directly against
      the test set, keeping the lowest RMSE, instead of selecting on cross-validated training rows.
      Measured here at a mean gap of +0.5279 RMSE points over 20 seeds, and never negative at any seed
      tried.
  - term: Residual
    definition: >-
      The true target value minus the model's prediction, for one row. This lesson's centrepiece: reading
      the full set of residuals for patterns, not summarising them into a single RMSE and stopping there.
  - term: Heteroscedasticity signal
    definition: >-
      The correlation between a model's fitted value and the absolute size of its residual. Near zero
      means errors do not systematically grow or shrink with the prediction; here, 0.2386 -- a mild
      fanning-out, not a dramatic one.
  - term: Curvature signal
    definition: >-
      The correlation between the squared fitted value and the signed residual, used here as a numeric
      stand-in for a missed non-linear trend a residual-vs-fitted plot would show as a curve. Measured at
      -0.1278 -- weak, no strong evidence of a missed curve.
  - term: Normal-probability (Q-Q) correlation
    definition: >-
      A from-scratch check correlating sorted, standardised residuals against the quantiles a perfectly
      normal distribution would produce. 1.0 is a straight line; this lesson measures 0.9901, close to
      normal even on 111 real test rows.
  - term: Error by target level
    definition: >-
      RMSE computed separately on the below-median and above-median halves of the true test targets, to
      check whether a model is systematically worse for higher-value cases -- a fairness-relevant question
      on a disease-progression score. Measured here as a ratio of 1.0473: only 4.73 percent worse on the
      more severe half.
  - term: Prediction interval
    definition: >-
      A range around a point prediction meant to contain the true value with some stated probability --
      distinct from a confidence interval, which describes uncertainty about a parameter rather than about
      one future observation. Built here with a constant half-width of 105.8797 from training out-of-fold
      residuals.
  - term: Realised coverage
    definition: >-
      The fraction of test targets that actually fall inside a prediction interval, checked against the
      interval's nominal (stated) rate. Measured here at 0.9459 against a 0.95 nominal rate on 111 test
      rows.
  - term: Verdict
    definition: >-
      The end product of a properly run regression project: a test RMSE, a bootstrap interval around its
      margin over baseline, a statement of whether the margin clears that interval, residual diagnostics,
      a fairness check by target level, and a prediction interval with measured coverage -- not a single
      RMSE quoted alone.
  - term: Out-of-fold residual
    definition: >-
      A residual computed on a training row while that row was held out of the fold used to fit the model
      -- via cross_val_predict -- so the residual reflects genuine held-out error rather than a fitted
      value the model has already seen. Used here to size the prediction interval without touching test
      rows at all.
