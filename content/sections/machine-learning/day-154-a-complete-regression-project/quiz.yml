questions:
  - question: >-
      This lesson uses sklearn.datasets.load_diabetes(scaled=False) rather than
      fetch_california_housing, even though the latter is a larger, more well-known regression dataset.
      Why, specifically?
    options:
      - 'fetch_california_housing downloads its data on first use (download_if_missing defaults to True), which this lab''s offline rule forbids; load_diabetes is bundled inside scikit-learn itself'
      - 'load_diabetes has more rows than fetch_california_housing'
      - 'fetch_california_housing only supports classification, not regression'
      - 'load_diabetes is the only regression dataset with a physical unit on its target'
    answer_index: 0
    explanation: >-
      inspect.signature(fetch_california_housing).parameters['download_if_missing'].default is True --
      confirmed directly in exercise 1 -- which makes it network-dependent and therefore forbidden by this
      lab's safety rule (A37). load_diabetes ships as bundled arrays inside the installed scikit-learn
      package and needs no network at all. The row-count and classification claims are both false:
      fetch_california_housing has more rows, and both datasets are regression problems. The unit claim is
      also false in the other direction -- this lesson's target has NO physical unit, and that is stated
      plainly rather than invented.
  - question: >-
      The mean-predictor baseline on the test set scores 70.4637 RMSE and an R2 of -0.0001. What does the
      R2 close to zero (rather than exactly zero) tell you?
    options:
      - 'That the baseline model is broken and should be debugged'
      - 'That the test set''s mean target value is very close to, but not identical to, the training set''s mean -- R2 of exactly 0.0 only holds when a model predicts the training mean and is scored against data with that exact same mean'
      - 'That RMSE and R2 are inconsistent metrics and one of them must be wrong'
      - 'That the dataset has too few rows to compute R2 reliably'
    answer_index: 1
    explanation: >-
      DummyRegressor(strategy='mean') predicts the TRAINING mean for every row. R2 is defined relative to
      the mean of whatever it is scored against -- here, the TEST set's mean, which differs very slightly
      from the training mean because of the random split. That tiny difference is exactly what produces an
      R2 of -0.0001 instead of a perfect 0.0. Nothing is broken, and RMSE and R2 are simply two different
      formulas computed from the same residuals -- they do not need to "agree" in any stronger sense than
      that.
  - question: >-
      Plain OLS scores 54.0926 cross-validated RMSE at seed 0, only 0.1968 points behind the winning
      Lasso(alpha=1) at 53.8958 -- yet Day 150 measured VIFs as high as 59.2 on this exact dataset's raw
      features. How should these two facts be read together?
    options:
      - 'They contradict each other, so one of the two measurements must be wrong'
      - 'Multicollinearity always makes predictions worse, so the small gap here is a bug'
      - 'Multicollinearity destabilises the individual COEFFICIENTS (Day 150''s finding) without necessarily destabilising PREDICTION accuracy by very much -- regularisation''s benefit here is real but modest, which this lesson measures rather than assumes'
      - 'The VIF measurement from Day 150 is irrelevant to regression entirely'
    answer_index: 2
    explanation: >-
      Day 150's finding was specifically about coefficient instability under correlated predictors, not
      about prediction accuracy. A model can have wildly unstable individual coefficients while still
      producing nearly-as-good predictions as a regularised alternative, because the correlated predictors
      can substitute for one another in the fitted equation even as their individual weights swing. This
      lesson measures the prediction-accuracy gap directly (0.1968 RMSE points) rather than assuming
      regularisation must produce a dramatic improvement just because multicollinearity is present.
  - question: >-
      The winning model's margin over baseline is 13.9071 RMSE points. A 2000-draw bootstrap gives a 95
      percent interval on that margin of [5.5852, 22.3324]. What is the correct verdict?
    options:
      - 'Cannot distinguish the model from the baseline, because the interval is wide'
      - 'The model overfit, because the margin is large relative to the baseline'
      - 'No verdict is possible until the test set is evaluated a second time to narrow the interval'
      - 'The margin is distinguishable from zero, since the interval''s lower bound (5.5852) is comfortably positive -- the model beats the baseline by more than sampling noise on 111 test rows could plausibly explain'
    answer_index: 3
    explanation: >-
      The interval excludes zero entirely -- its lower bound is 5.5852, well above zero -- so the improvement
      is distinguishable from baseline at this test-set size, even though the interval itself is wide (as
      expected on only 111 test rows). Interval width alone does not determine the verdict; whether the
      interval excludes zero (or, more generally, whatever threshold defines "no improvement") does. A
      second test evaluation would not narrow anything -- per Day 144's GatedTestSet discipline, it would
      produce a validation score wearing the word test. And a large margin over baseline says nothing about
      overfitting without comparing train and validation behaviour, which Day 145 covered separately.
  - question: >-
      The heteroscedasticity signal (correlation of fitted value with absolute residual) is 0.2386, and the
      curvature signal (correlation of squared fitted value with signed residual) is -0.1278. How should a
      reader interpret these two numbers together?
    options:
      - 'Both signals are real but modest -- a mild tendency for errors to grow with the prediction, and a weak, inconclusive hint of a missed curve -- worth reporting honestly rather than either dismissed or treated as alarming'
      - 'Both signals indicate the model is badly overfit and must be discarded'
      - 'A positive heteroscedasticity signal always means the model is unusable for prediction'
      - 'These two numbers should be identical if the residuals are well-behaved, so their difference is an error'
    answer_index: 0
    explanation: >-
      Neither 0.2386 nor -0.1278 is close to the extremes (near +/-1) that would indicate a dramatic,
      unmissable pattern in a residual-vs-fitted plot. They are genuine, real signals -- not exactly zero --
      but modest enough that this lesson reports them as "worth watching, not alarming" rather than either
      direction of overstatement. The two correlations measure different things (error MAGNITUDE growing
      with fitted value, versus a systematic CURVE in signed error) and have no reason to be equal or even
      similar in size.
  - question: >-
      Error by target level gives RMSE 55.2464 on the below-median half of test targets and 57.8601 on the
      above-median half -- a ratio of 1.0473. What is the honest reading of this result?
    options:
      - 'The check was a waste of time, since the ratio came out close to 1.0'
      - 'A ratio close to 1.0 means this specific measured run found only a small (4.73 percent) difference in error between severity levels -- a real, if modest, finding that had to be measured rather than assumed, and a different seed or a different dataset could easily show a larger asymmetry'
      - 'The model must be discarded because it treats every target value identically'
      - 'A ratio close to 1.0 proves the model is fair on every possible fairness definition'
    answer_index: 1
    explanation: >-
      Measuring this and finding it nearly flat is still valuable information -- the alternative, skipping
      the check because "it probably doesn't matter," would have left a real fairness-relevant question
      unanswered. A ratio of exactly 1.0 is not achieved (it is 1.0473, not 1.0000), so the model does not
      treat every value identically; the difference is simply small at this seed on this dataset. Nothing
      about one ratio close to 1.0 generalises to "fair on every definition" -- it answers only the specific
      question this check asks (RMSE by severity half), not every possible fairness question.
  - question: >-
      Exercise 10 selects a model by fitting all 23 candidates and scoring each one directly on the test
      set (keeping the lowest RMSE), instead of selecting on cross-validated training rows. Over 20 seeds,
      this leaky RMSE is never higher than the honest RMSE. Why can the leaky RMSE never come out worse?
    options:
      - 'Because the leaky search always uses more training data than the honest one'
      - 'Because the leaky search considers the honestly selected winner among its 23 candidates, and can only replace it with something that scored at least as well (as low or lower RMSE) on the very test rows it was allowed to peek at'
      - 'Because ridge regression always outperforms lasso on this dataset'
      - 'Because the test set is larger than the training set in this lesson'
    answer_index: 2
    explanation: >-
      The leaky search is a superset of the honest choice: it evaluates every one of the 23 candidates,
      including whichever one cross-validation selected, directly against the test rows, and keeps
      whichever produces the lowest RMSE on those same rows. By construction it therefore cannot report a
      HIGHER (worse) RMSE than the honestly selected model's own test score -- it can only match or beat it,
      which is the exact mechanism, not chance. Training-set size is identical between the two searches, and
      no single family (ridge, lasso, or OLS) systematically wins across all 20 seeds.
  - question: >-
      A prediction interval is built with a constant half-width of 105.8797, derived from the standard
      deviation of out-of-fold residuals on the TRAINING rows. Its realised coverage on the 111 test rows
      is 0.9459, against a stated (nominal) rate of 0.95. What would have been wrong about sizing this
      interval from the TEST residuals instead?
    options:
      - 'Nothing -- test residuals would have given a more accurate interval'
      - 'Test residuals are always larger than training residuals, so the interval would have been too wide'
      - 'Using the test residuals to size an interval that is then checked for coverage on those same test residuals is circular -- it would inflate the apparent accuracy of the interval using information the interval is supposed to be evaluated against, the same discipline error Day 144 built GatedTestSet to prevent'
      - 'Test residuals cannot be computed at all, since the model was never evaluated on the test set'
    answer_index: 2
    explanation: >-
      Sizing an interval from the very data used to check its coverage is a leak in exactly the shape Day
      144 and Day 147 both taught: any quantity derived from test data and then evaluated against that same
      test data is contaminated, because it has seen the answer it is being scored against. Training
      out-of-fold residuals (via cross_val_predict) never touch the test rows, so the coverage check that
      follows is honest. Test residuals ARE computable (the model was in fact evaluated once, through the
      gate), which makes option D factually wrong, and there is no general rule that test residuals are
      always larger.
