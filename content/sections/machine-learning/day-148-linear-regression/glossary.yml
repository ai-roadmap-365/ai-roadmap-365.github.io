terms:
  - term: Simple linear regression
    definition: >-
      A model with exactly two learned numbers -- a slope and an intercept -- fitted to one predictor and
      one target so their squared errors are as small as possible. "Simple" means one predictor, as
      opposed to multiple linear regression's several predictors.
  - term: Slope
    definition: >-
      The change in the predicted target per one unit of the predictor, in the target's real units.
      Measured here at 10.2331 points of disease progression per unit of BMI -- only interpretable in raw
      units, not the mean-centred, unit-norm-scaled default scikit-learn's diabetes dataset returns.
  - term: Intercept
    definition: >-
      The predicted target value when the predictor is zero. Only independently meaningful when a
      predictor value of zero is a realistic situation; otherwise it exists to make the line fit
      correctly rather than to be read on its own.
  - term: Residual
    definition: >-
      The leftover error at one row -- actual target value minus predicted value. Residuals are what a
      residual plot examines, and their pattern reveals what a single summary score like R-squared cannot.
  - term: R-squared
    definition: >-
      The proportion of the target's variance a fitted line explains, from 0 to 1. Measured at 0.3439 for
      BMI predicting disease progression, and at a respectable-looking 0.852 on data with real, substantial
      curvature the line was the wrong shape to capture -- the standing warning of this lesson.
  - term: Standard error of a slope
    definition: >-
      How much a fitted slope would wobble under a fresh sample of the same size, computed from the
      residual variance and the spread of the predictor. Measured at 0.6738 for the BMI slope, giving a
      95% confidence interval of [8.9125, 11.5538].
  - term: Point of means
    definition: >-
      The point (mean of x, mean of y). A least-squares line fitted with an intercept passes through this
      point exactly, on any dataset -- a guarantee that follows from the fit, not a coincidence.
  - term: Residual sum
    definition: >-
      The total of all residuals across a dataset. Exactly zero, up to floating point, for any
      least-squares line fitted with an intercept -- measured at -1.67e-11 on 442 rows here.
  - term: Linearity assumption
    definition: >-
      The claim that the true relationship between predictor and target is a straight line. Broken by
      construction in this lesson's curved dataset, where an R-squared of 0.852 gave no warning and only
      the binned residual means -- +4.2216, -1.9594, -3.6829, -2.3803, +3.8010 -- revealed the missed curve.
  - term: Homoscedasticity
    definition: >-
      The assumption that the scatter of errors around the fitted line is roughly the same width
      everywhere. Its opposite, heteroscedasticity, was measured here as a residual standard deviation of
      4.7427 in the low half of the predictor against 12.0684 in the high half.
  - term: Leverage
    definition: >-
      A measure of a point's potential to pull a fitted line toward itself, computed from its predictor
      value alone -- before its target value is even considered. Measured at 0.8048 for one added point
      against a mean of 0.0299 for forty ordinary points, a ratio of nearly 27.
  - term: fit_intercept
    definition: >-
      A `LinearRegression` argument that, when set to False, forces the fitted line through the origin.
      Measured to cost 59 percent worse RMSE and a biased slope on data whose true intercept was 25.0 and
      whose predictor values never approached zero.
  - term: Quadratic-fit-to-residuals diagnostic
    definition: >-
      Fitting a quadratic curve to a set of residuals (not to the original data) and reading how much of
      the residuals' own variance it explains. Near zero on genuinely linear data (0.0002, measured on the
      real BMI model) and substantial where curvature was missed (0.3558, measured on deliberately curved
      data).
  - term: Skewness
    definition: >-
      A rough measure of a distribution's asymmetry, zero for a perfectly symmetric one. Used here as an
      informal check on whether a model's residuals look roughly normal -- 0.156 for the BMI model's
      residuals, mildly asymmetric and not alarming.
  - term: Correlation-causation distinction
    definition: >-
      The principle, established on Day 119, that a regression coefficient describes association in the
      data it was fitted on and says nothing on its own about whether changing the predictor would change
      the target. A slope is not a lever.
  - term: Anscombe's quartet
    definition: >-
      Four datasets constructed by Francis Anscombe in 1973 that share nearly identical summary
      statistics -- including the same fitted regression line -- while looking completely different when
      plotted, an early and influential illustration of exactly this lesson's argument for residual plots.
  - term: Method of least squares
    definition: >-
      The fitting criterion `LinearRegression` uses: choose the slope and intercept that minimize the sum
      of squared residuals. Published by Legendre in 1805 and by Gauss in 1809, who claimed prior use from
      1795; Day 149 derives why squared error specifically.
  - term: Robust regression
    definition: >-
      A family of fitting methods, such as scikit-learn's HuberRegressor and RANSACRegressor, designed to
      resist the influence of high-leverage points and outliers that an ordinary least-squares fit does
      not resist. Described here from documentation; not run in this lesson's lab.
