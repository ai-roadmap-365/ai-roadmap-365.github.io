visuals:
  - id: line-geometry-architecture
    file: assets/line-geometry-architecture.svg
    type: diagram
    title: >-
      A fitted line, and the two facts that always hold
    alt: >-
      Diagram: a scatterplot of points with a straight fitted line through them, annotated with four
      labelled callouts. The slope callout points at the line's steepness and states it as the change in
      y per one unit of x, in the target's real units. The intercept callout points at where the line
      crosses the y-axis and states it as the predicted y when x is zero, noting this is only meaningful
      when x near zero is a real situation. A callout on the line states that it passes exactly through
      the point at the mean of x and the mean of y. A callout beneath the plot shows a smaller panel of
      residuals plotted against x, each residual a vertical segment from a point down to zero, captioned
      that these residuals always sum to zero when an intercept is fitted, and that their pattern -- not
      their sum -- is what a diagnosis reads
    description: >-
      A static architecture diagram built around a scatterplot of twenty points with a positive-slope
      straight line fitted through them. Three callout cards to the right of the plot label the slope as
      the change in y per one unit of x in the target's real units, the intercept as the predicted y at x
      equal to zero (with a note that this is only meaningful when x near zero is realistic), and the
      point of means as the exact point (mean of x, mean of y) the line is guaranteed to pass through, a
      dashed line dropping from that point to a residual panel below. That panel shows ten vertical
      segments -- residuals -- alternating above and below a zero baseline at the same horizontal
      positions as points in the scatterplot above, captioned that these residuals always sum to
      (essentially) zero when an intercept is fitted, and that this is a guarantee following from how the
      line was fitted, not a coincidence of any particular dataset.
  - id: four-failures-flow
    file: assets/four-failures-flow.svg
    type: flow-animated
    title: >-
      One fitted line, checked four ways, each catching a failure the R-squared alone missed
    alt: >-
      Diagram: a pipeline showing one fitted line passing through four diagnostic checks in sequence:
      curvature, spread, leverage and a forced-zero intercept, each reporting the number it measured. The
      curvature check reports a quadratic fit to the residuals explaining 0.3558 of their variance on
      deliberately curved data against 0.0002 on real data, despite an R-squared of 0.852 on the curved
      data looking fine. The spread check reports a residual standard deviation of 4.7427 in the low half
      of the predictor against 12.0684 in the high half, a ratio of 2.5446, on data whose R-squared of
      0.5723 also looked ordinary. The leverage check reports one added point moving a slope from 1.5196
      to 0.2138, a change of -1.3059, with that point's leverage 27 times the average of the other forty
      points. The intercept check reports RMSE of 6.1401 with an intercept fitted against 9.7878 without
      one, 59 percent worse. A caption states that none of the four numbers come from the R-squared, and
      that a line can score well on that single number while hiding any of the four failures, each
      visible only once the residuals or the point positions are examined directly
    description: >-
      An animated flow diagram with a fitted-line node on the left connected by a horizontal pipeline to
      four stage cards -- Curvature, Spread, Leverage, and Zero intercept -- and a diagnosed-output node
      on the right. A token travels the pipeline left to right in four pauses over an eight-second loop,
      dwelling briefly over each card; as it arrives, that card's background lifts from a pale tint to a
      brighter one and settles back, in sequence, while every card's full text -- its measured numbers --
      remains visible at all times regardless of the token's position. The curvature card reports a
      quadratic-fit R-squared of 0.3558 on deliberately curved data against 0.0002 on real BMI data, next
      to a note that an R-squared of 0.852 on the curved data looked respectable. The spread card reports
      residual standard deviations of 4.7427 and 12.0684 in the low and high halves of the predictor, a
      ratio of 2.5446, beside a note that its own R-squared of 0.5723 also looked ordinary. The leverage
      card reports a slope moving from 1.5196 to 0.2138 when one point is added, a change of -1.3059, and
      that point's leverage at 27 times the average of the other forty points. The zero-intercept card
      reports RMSE of 6.1401 with a fitted intercept against 9.7878 with the intercept forced to zero, 59
      percent worse. A legend panel beneath states that none of the four numbers come from the R-squared
      and that each failure is invisible in the score and visible only in the residuals or the point
      positions. A prefers-reduced-motion block halts the token at its final position and disables every
      card's colour animation, leaving all four cards and all figures visible and static, so the still
      frame carries the entire result.
