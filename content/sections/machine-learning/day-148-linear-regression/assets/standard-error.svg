<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The slope is an estimate</title>
  <style>
    .standard-error-bg   { fill: #f8fafc; }
    .standard-error-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-error-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-error-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-error-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-error-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .standard-error-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .standard-error-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .standard-error-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .standard-error-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .standard-error-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .standard-error-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .standard-error-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .standard-error-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .standard-error-stage { opacity: 1; }

    .standard-error-s0 { animation-delay: 0.00s; }
    .standard-error-e0 { animation-delay: 0.00s; }
    .standard-error-s1 { animation-delay: 1.28s; }
    .standard-error-e1 { animation-delay: 1.28s; }
    .standard-error-s2 { animation-delay: 2.56s; }
    .standard-error-e2 { animation-delay: 2.56s; }
    .standard-error-s3 { animation-delay: 3.84s; }
    .standard-error-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .standard-error-conn  { animation: standard-error-trace 6.4s ease-in-out infinite; }
      .standard-error-stage { animation: standard-error-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes standard-error-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes standard-error-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .standard-error-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .standard-error-stage { animation: standard-error-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes standard-error-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="standard-error-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="standard-error-bg" width="980" height="322"/>
  <text class="standard-error-h1"  x="30" y="40">The slope is an estimate</text>
  <text class="standard-error-sub" x="30" y="64">Four steps.</text>
  <g class="standard-error-stage standard-error-s0">
    <rect class="standard-error-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="standard-error-step" x="44" y="142">01</text>
    <text class="standard-error-name" x="70" y="142">The coefficient is estimated from one sample</text>
    <text class="standard-error-desc" x="44" y="166">A different sample gives a</text>
    <text class="standard-error-desc" x="44" y="182">different number.</text>
  </g>
  <line class="standard-error-line standard-error-conn standard-error-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#standard-error-tip)"/>
  <g class="standard-error-stage standard-error-s1">
    <rect class="standard-error-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="standard-error-step" x="280" y="142">02</text>
    <text class="standard-error-name" x="306" y="142">How different is the standard error</text>
    <text class="standard-error-desc" x="280" y="166">Computable from the residuals</text>
    <text class="standard-error-desc" x="280" y="182">and the spread of the input.</text>
  </g>
  <line class="standard-error-line standard-error-conn standard-error-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#standard-error-tip)"/>
  <g class="standard-error-stage standard-error-s2">
    <rect class="standard-error-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="standard-error-step" x="516" y="142">03</text>
    <text class="standard-error-name" x="542" y="142">Which gives an interval around the coefficient</text>
    <text class="standard-error-desc" x="516" y="166">Rather than a bare point</text>
    <text class="standard-error-desc" x="516" y="182">estimate.</text>
  </g>
  <line class="standard-error-line standard-error-conn standard-error-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#standard-error-tip)"/>
  <g class="standard-error-stage standard-error-s3">
    <rect class="standard-error-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="standard-error-step" x="752" y="142">04</text>
    <text class="standard-error-name" x="778" y="142">An interval spanning zero means no detectable effect</text>
    <text class="standard-error-desc" x="752" y="166">However confident the point</text>
    <text class="standard-error-desc" x="752" y="182">estimate looks.</text>
  </g>
  <text class="standard-error-sub" x="30" y="304">Reporting a coefficient without its interval invites a conclusion the data does not support, which is why statistical packages print them by default and machine learning libraries do not.</text>
</svg>
