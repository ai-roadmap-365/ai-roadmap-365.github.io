questions:
  - question: >-
      A line fitted to 300 points scores an R-squared of 0.852, and the data was actually generated from
      a quadratic relationship. What does the R-squared alone tell you about whether the line is the
      right shape for the data?
    options:
      - 'Nothing reliable -- a good R-squared can coexist with a real, substantial missed curve, which only a residual plot reveals'
      - 'That the fit is definitely correct, since 0.852 is close to the maximum of 1.0'
      - 'That the relationship is at least 85.2 percent linear, with the rest being noise'
      - 'That a larger dataset would push the R-squared toward 1.0 and resolve the question'
    answer_index: 0
    explanation: >-
      R-squared measures how much of the target's variance the line explains, which a wrong-shaped line
      can still do plenty of. This lesson's curved dataset binned residual means -- +4.2216, -1.9594,
      -3.6829, -2.3803, +3.8010 -- trace the missed curve exactly, and a quadratic fitted to those
      residuals explains 35.58 percent of their own variance. R-squared has no notion of "85.2 percent
      linear"; it is a single number about explained variance, not a shape diagnostic, and more data
      would not change the fundamental mismatch between a straight line and a curved relationship.
  - question: >-
      Why does `load_diabetes(scaled=False)` matter for reading the fitted BMI slope of 10.2331, and what
      goes wrong if you call `load_diabetes()` without it?
    options:
      - 'Nothing changes; scaled=False only affects how fast the model trains'
      - 'The default scaled=True version mean-centres and unit-norm-scales every column, so the resulting slope is on an uninterpretable scale and the sentence "one more unit of BMI" is no longer writable'
      - 'scaled=False removes rows with missing BMI values, which the scaled version keeps'
      - 'scaled=False is required for scikit-learn to accept the data at all; the scaled version raises an error'
    answer_index: 1
    explanation: >-
      The default `load_diabetes()` returns columns already mean-centred and scaled to unit norm, which
      is a completely different, uninterpretable scale for reading a coefficient. With `scaled=False`,
      BMI stays in its real units (roughly 18 to 42), and the fitted slope of 10.2331 becomes a sentence a
      clinician could read: one more unit of BMI is associated with about ten more points of one-year
      disease progression. Neither version raises an error or drops rows; the only difference is units.
  - question: >-
      Two facts hold for the BMI model's fitted line: it predicts exactly 152.1335 at the mean BMI, which
      equals the mean of the target, and its 442 residuals sum to -1.67e-11. What kind of facts are these?
    options:
      - 'Coincidences specific to the diabetes dataset, which would not hold on a different dataset'
      - 'Measurements that happened to come out close to exact this time, within normal sampling variation'
      - 'Guarantees that follow from how a least-squares line with an intercept is fitted -- true on any dataset, not measurements that could have come out otherwise'
      - 'Evidence that BMI is a strong predictor of disease progression'
    answer_index: 2
    explanation: >-
      Both facts are structural properties of the least-squares solution with an intercept, true on any
      dataset for a reason that has nothing to do with BMI or diabetes specifically -- Day 149 derives
      why. They are not measurements with sampling variation attached (the residual sum is not "close to
      zero," it is zero up to floating point), and they say nothing about whether BMI is a strong
      predictor -- that is what R-squared and the standard error address, separately.
  - question: >-
      One point added to a forty-point dataset, at x=40 (well beyond the other points' range of 0 to 10),
      cuts the fitted slope from 1.5196 to 0.2138. What number, computed from that point's x-value alone,
      would have flagged it as worth scrutiny before its y-value was even considered?
    options:
      - 'Its residual, which measures how far its y-value falls from the fitted line'
      - 'The overall R-squared of the model with and without the point included'
      - 'The point''s rank when all y-values are sorted from smallest to largest'
      - 'Its leverage, computed as 1/n plus the squared distance from mean(x) divided by the sum of squared distances from mean(x) across all points'
    answer_index: 3
    explanation: >-
      Leverage is a function of x alone -- it does not involve y at all, which is exactly why it can be
      computed before a point's outcome is even known. The added point's leverage measured at 0.8048
      against a mean of 0.0299 for the other forty, a ratio of nearly 27. A residual requires the fitted
      line and the point's y-value, so it cannot flag a point in advance; R-squared is a whole-model
      summary, not a per-point diagnostic; and sorting y-values says nothing about a point's position on x.
  - question: >-
      A fitted line has an R-squared of 0.5723, which looks unremarkable. Splitting its residuals at the
      median of x shows a standard deviation of 4.7427 in the low half against 12.0684 in the high half.
      What does this reveal, and why didn't the R-squared catch it?
    options:
      - 'Heteroscedasticity -- error whose spread grows with x. R-squared summarizes overall explained variance and has no way to represent how that error is distributed across x'
      - 'The model is overfitting, and R-squared should have been lower to reflect that'
      - 'A coding error in the residual calculation, since spread should always be constant'
      - 'That the true relationship is not linear, the same failure as the curvature check'
    answer_index: 0
    explanation: >-
      Heteroscedasticity means the noise around the line is not equally wide everywhere -- here, the
      spread more than doubles from the low half of x to the high half, a ratio of 2.5446. The fitted line
      itself stays roughly unbiased; what breaks is any single, dataset-wide standard error, which
      understates uncertainty at high x and overstates it at low x. R-squared is a single aggregate number
      and has no mechanism to flag an uneven spread; this is a distinct failure from curvature, which is
      about the line's shape rather than the noise's spread.
  - question: >-
      `fit_intercept=False` is applied to data whose x-values range from 5 to 25 and whose true intercept
      is 25.0. RMSE gets about 59 percent worse, and the fitted slope changes from close to the true value
      of 3.0 to 4.4232. Why does forcing the intercept to zero also distort the slope, rather than leaving
      the slope correct and only the intercept wrong?
    options:
      - 'It does not actually affect the slope; the 4.4232 figure is measurement noise'
      - 'The dataset''s x-values being far from zero causes a numerical overflow that corrupts the slope'
      - 'fit_intercept=False also removes the R-squared calculation, so the slope reported is meaningless'
      - 'The model has no separate parameter left to represent "the line does not pass through the origin," so the slope tilts to compensate, and the resulting slope is a distorted estimate of the true relationship'
    answer_index: 3
    explanation: >-
      With only one free parameter (the slope) and no intercept to absorb the true offset, the line is
      forced through the origin regardless of where the data actually sits, and the only way to reduce
      error given that constraint is for the slope to tilt -- which is exactly what happened, moving from
      close to the true 3.0 up to 4.4232. This is a real, measured effect, not noise; R-squared still
      computes normally; and there is no overflow involved, just a genuinely worse and biased fit.
  - question: >-
      A slope of 10.2331 has a standard error of 0.6738, giving a 95% confidence interval of [8.9125,
      11.5538]. What does that interval actually tell you?
    options:
      - 'That there is a 95% chance the true slope lies in exactly this interval'
      - 'That 95% of the individual data points fall within this range of the fitted line'
      - 'That if you drew many fresh samples of the same size from the same population and fitted a line to each, about 95% of the resulting slope estimates would fall in a range like this one'
      - 'That the model is 95% accurate at predicting new BMI values'
    answer_index: 2
    explanation: >-
      A confidence interval is a statement about the procedure's long-run behaviour across repeated
      sampling, not a probability statement about one fixed true value being in one fixed interval -- a
      common and understandable misreading, but a different claim. It says nothing about where 95% of the
      individual data points fall (that is a much wider range, since it is about y-values around the line,
      not about the slope estimate), and it makes no claim about prediction accuracy at all.
  - question: >-
      A quadratic fit to a set of residuals explains 0.0002 of their variance on the real BMI model and
      0.3558 on a deliberately curved dataset. Why is the contrast between these two numbers more useful
      than either number alone?
    options:
      - 'It is not more useful; only the largest number, 0.3558, matters for deciding whether a fit has a problem'
      - 'It proves that BMI data can never have curvature, unlike synthetic data'
      - 'It shows that the BMI model is a better fit than the curved-data model in every respect'
      - 'The contrast calibrates what "essentially zero" and "real structure" look like on this diagnostic, letting you judge a new dataset''s number against a known-clean baseline and a known-broken one, rather than guessing at a threshold'
    answer_index: 3
    explanation: >-
      Without a reference point, a lone number like "0.05" or "0.15" from this diagnostic on an unfamiliar
      dataset is hard to judge -- is it noise, or a real signal? Seeing 0.0002 on data known to be linear
      and 0.3558 on data known to have real curvature gives two calibration points to compare a new
      measurement against. It says nothing general about which model is "better" (they are testing
      different things) and nothing about whether BMI data specifically could ever show curvature -- only
      that this particular model, on this diagnostic, did not.
