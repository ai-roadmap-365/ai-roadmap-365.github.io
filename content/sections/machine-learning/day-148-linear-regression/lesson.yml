title: 'Linear Regression'
section: machine-learning
subsection: core-concepts
week: 22
learning_promise: >-
  After this lesson you will be able to fit a simple linear regression in real units and read the slope
  as a sentence a non-technical reader could act on -- and you will have measured, not just been told,
  that a good-looking fit can still be wrong. You will watch a line score an R-squared of 0.852 on data
  with real, substantial curvature, and see the residuals -- five printed numbers -- trace the missed
  curve exactly, while a quadratic fitted to those residuals explains over a third of their own variance.
  You will fit BMI against a real diabetes-progression score in raw units, read a slope of 10.2331 with a
  standard error of 0.6738, and confirm the two facts that hold on any least-squares line with an
  intercept: it passes exactly through the point of means, and its residuals sum to zero. You will watch
  one added point, out of forty-one, cut a fitted slope by more than 85 percent, and compute the number --
  leverage -- that would have flagged it before its y-value was even considered. You will measure
  heteroscedasticity fanning a residual plot while the R-squared stays ordinary, and measure what forcing
  fit_intercept=False costs when the true intercept is nowhere near zero. Squared error, multiple
  predictors, regularization, formal metrics and building least squares from scratch are the next five
  days; today is the line itself, and what it does and does not tell you.
objectives:
  - 'Fit a simple linear regression with scikit-learn and read the slope and intercept as real-unit statements about the data'
  - 'Explain why load_diabetes(scaled=False) matters for interpreting a coefficient, and what is lost by skipping it'
  - 'Compute the standard error of a fitted slope and build a confidence interval from it'
  - 'State and verify the two facts that hold exactly for any least-squares line fitted with an intercept'
  - 'Diagnose non-linearity from a residual plot on data whose R-squared alone gives no warning'
  - 'Diagnose heteroscedasticity from a residual plot on data whose R-squared alone gives no warning'
  - 'Compute the leverage of a point from its predictor value alone, and explain what it does and does not predict'
  - 'Measure the cost of forcing fit_intercept=False on data whose true intercept is not near zero'
  - 'Distinguish a coefficient from a causal claim, and explain why a regression slope licenses neither'
  - 'Quantify how a slope estimate improves as sample size grows, and relate it to the one-over-root-n rate'
  - 'Use a quadratic-fit-to-residuals diagnostic to tell real curvature apart from ordinary noise'
  - 'Identify when a one-predictor linear model is the right first model, and when it is not'
prerequisites:
  - 'Days 141-147 (Week 21) -- what a model score means, splits, overfitting and underfitting, the scikit-learn estimator API, and an end-to-end classification exercise'
  - 'Day 119 -- correlation versus causation, which this lesson restates specifically for a regression coefficient'
  - 'Days 117-118 -- the standard error and the sampling distribution; this lesson applies the same arithmetic to a slope'
  - 'Comfort with NumPy arrays and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
