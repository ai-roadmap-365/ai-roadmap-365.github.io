sources:
  - title: 'SMOTE: Synthetic Minority Over-sampling Technique'
    url: 'https://doi.org/10.1613/jair.953'
    publisher: 'Journal of Artificial Intelligence Research (Chawla et al.)'
    accessed: '2026-08-29'
    year: 2002
    description: 'Seminal paper introducing the SMOTE algorithm and demonstrating its superiority over simple oversampling on imbalanced datasets.'
  - title: 'Focal Loss for Dense Object Detection'
    url: 'https://doi.org/10.1109/ICCV.2017.324'
    publisher: 'IEEE ICCV (Lin et al. / Meta AI)'
    accessed: '2026-08-29'
    year: 2017
    description: 'Landmark paper introducing Focal Loss to resolve the extreme 1:1,000 class imbalance in dense one-stage object detectors.'
  - title: 'Learning from Imbalanced Data'
    url: 'https://doi.org/10.1109/TKDE.2008.239'
    publisher: 'IEEE Transactions on Knowledge and Data Engineering (He & Garcia)'
    accessed: '2026-08-29'
    year: 2009
    description: 'Comprehensive survey covering sampling paradigms, cost-sensitive algorithms, active learning, and imbalanced assessment metrics.'
