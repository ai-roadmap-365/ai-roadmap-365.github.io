terms:
  - term: 'Class Imbalance'
    definition: 'A dataset characteristic where the distribution of examples across target classes is severely unequal (e.g. 99% majority vs 1% minority).'
  - term: 'Cost-Sensitive Learning'
    definition: 'A machine learning approach that incorporates asymmetric misclassification costs directly into the loss function during training.'
  - term: 'Balanced Class Weighting'
    definition: 'A technique that scales the loss contribution of each sample inversely proportional to its class frequency: w_c = N / (K * N_c).'
  - term: 'Random Undersampling'
    definition: 'A data-level technique that balances class distribution by randomly discarding instances from the majority class.'
  - term: 'Random Oversampling'
    definition: 'A data-level technique that balances class distribution by randomly duplicating instances from the minority class.'
  - term: 'SMOTE'
    definition: 'Synthetic Minority Over-sampling Technique: an algorithm that synthesizes new minority class instances by interpolating between k-nearest neighbors in feature space.'
  - term: 'Focal Loss'
    definition: 'A dynamically scaled cross-entropy loss function that down-weights easy majority examples to focus gradient optimization on hard minority examples.'
  - term: 'Stratified K-Fold'
    definition: 'A cross-validation splitting scheme that ensures each fold contains approximately the same percentage of samples of each target class as the complete dataset.'
  - term: 'Tomek Links'
    definition: 'Pairs of very close instances of different classes used in data cleaning to remove ambiguous or noisy borderline points.'
  - term: 'Prior Calibration (Logit Adjustment)'
    definition: 'A post-processing adjustment that shifts model logits to correct for differences between training sampling rates and true real-world class prevalence.'
