<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why imbalance breaks training</title>
  <style>
    .imbalance-idea-bg   { fill: #f8fafc; }
    .imbalance-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imbalance-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imbalance-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imbalance-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imbalance-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imbalance-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .imbalance-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .imbalance-idea-stage { opacity: 1; }

    .imbalance-idea-s0 { animation-delay: 0.00s; }
    .imbalance-idea-e0 { animation-delay: 0.00s; }
    .imbalance-idea-s1 { animation-delay: 1.28s; }
    .imbalance-idea-e1 { animation-delay: 1.28s; }
    .imbalance-idea-s2 { animation-delay: 2.56s; }
    .imbalance-idea-e2 { animation-delay: 2.56s; }
    .imbalance-idea-s3 { animation-delay: 3.84s; }
    .imbalance-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .imbalance-idea-conn  { animation: imbalance-idea-trace 6.4s ease-in-out infinite; }
      .imbalance-idea-stage { animation: imbalance-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes imbalance-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes imbalance-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .imbalance-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .imbalance-idea-stage { animation: imbalance-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes imbalance-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="imbalance-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="imbalance-idea-bg" width="980" height="322"/>
  <text class="imbalance-idea-h1"  x="30" y="40">Why imbalance breaks training</text>
  <text class="imbalance-idea-sub" x="30" y="64">Four steps.</text>
  <g class="imbalance-idea-stage imbalance-idea-s0">
    <rect class="imbalance-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-idea-step" x="44" y="142">01</text>
    <text class="imbalance-idea-name" x="70" y="142">The rare class is a small fraction of the data</text>
    <text class="imbalance-idea-desc" x="44" y="166">One in a hundred, or far fewer.</text>
  </g>
  <line class="imbalance-idea-line imbalance-idea-conn imbalance-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#imbalance-idea-tip)"/>
  <g class="imbalance-idea-stage imbalance-idea-s1">
    <rect class="imbalance-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-idea-step" x="280" y="142">02</text>
    <text class="imbalance-idea-name" x="306" y="142">So it contributes almost nothing to the average loss</text>
    <text class="imbalance-idea-desc" x="280" y="166">The optimiser barely sees it.</text>
  </g>
  <line class="imbalance-idea-line imbalance-idea-conn imbalance-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#imbalance-idea-tip)"/>
  <g class="imbalance-idea-stage imbalance-idea-s2">
    <rect class="imbalance-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-idea-step" x="516" y="142">03</text>
    <text class="imbalance-idea-name" x="542" y="142">Predicting the common class everywhere is near-optimal</text>
    <text class="imbalance-idea-desc" x="516" y="166">By the loss the model was given.</text>
  </g>
  <line class="imbalance-idea-line imbalance-idea-conn imbalance-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#imbalance-idea-tip)"/>
  <g class="imbalance-idea-stage imbalance-idea-s3">
    <rect class="imbalance-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-idea-step" x="752" y="142">04</text>
    <text class="imbalance-idea-name" x="778" y="142">So the model does exactly that</text>
    <text class="imbalance-idea-desc" x="752" y="166">Correctly optimising the wrong</text>
    <text class="imbalance-idea-desc" x="752" y="182">objective.</text>
  </g>
  <text class="imbalance-idea-sub" x="30" y="304">The model is not failing here — it is succeeding at the objective it was given, which is why the fix is to change the objective rather than the model.</text>
</svg>
