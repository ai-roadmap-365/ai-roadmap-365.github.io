<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The cardinal rule</title>
  <style>
    .leakage-rule-bg   { fill: #f8fafc; }
    .leakage-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-rule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-rule-stage { opacity: 1; }

    .leakage-rule-s0 { animation-delay: 0.00s; }
    .leakage-rule-e0 { animation-delay: 0.00s; }
    .leakage-rule-s1 { animation-delay: 1.28s; }
    .leakage-rule-e1 { animation-delay: 1.28s; }
    .leakage-rule-s2 { animation-delay: 2.56s; }
    .leakage-rule-e2 { animation-delay: 2.56s; }
    .leakage-rule-s3 { animation-delay: 3.84s; }
    .leakage-rule-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-rule-conn  { animation: leakage-rule-trace 6.4s ease-in-out infinite; }
      .leakage-rule-stage { animation: leakage-rule-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-rule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-rule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-rule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-rule-stage { animation: leakage-rule-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-rule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-rule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-rule-bg" width="980" height="322"/>
  <text class="leakage-rule-h1"  x="30" y="40">The cardinal rule</text>
  <text class="leakage-rule-sub" x="30" y="64">Four steps.</text>
  <g class="leakage-rule-stage leakage-rule-s0">
    <rect class="leakage-rule-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-rule-step" x="44" y="142">01</text>
    <text class="leakage-rule-name" x="70" y="142">Resampling before splitting duplicates examples</text>
    <text class="leakage-rule-desc" x="44" y="166">Then the split separates the</text>
    <text class="leakage-rule-desc" x="44" y="182">copies.</text>
  </g>
  <line class="leakage-rule-line leakage-rule-conn leakage-rule-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-rule-tip)"/>
  <g class="leakage-rule-stage leakage-rule-s1">
    <rect class="leakage-rule-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-rule-step" x="280" y="142">02</text>
    <text class="leakage-rule-name" x="306" y="142">So the same point appears in training and validation</text>
    <text class="leakage-rule-desc" x="280" y="166">Which is leakage.</text>
  </g>
  <line class="leakage-rule-line leakage-rule-conn leakage-rule-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-rule-tip)"/>
  <g class="leakage-rule-stage leakage-rule-s2">
    <rect class="leakage-rule-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-rule-step" x="516" y="142">03</text>
    <text class="leakage-rule-name" x="542" y="142">And validation scores look excellent</text>
    <text class="leakage-rule-desc" x="516" y="166">While production performance</text>
    <text class="leakage-rule-desc" x="516" y="182">collapses.</text>
  </g>
  <line class="leakage-rule-line leakage-rule-conn leakage-rule-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-rule-tip)"/>
  <g class="leakage-rule-stage leakage-rule-s3">
    <rect class="leakage-rule-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-rule-step" x="752" y="142">04</text>
    <text class="leakage-rule-name" x="778" y="142">Split first, then resample the training fold only</text>
    <text class="leakage-rule-desc" x="752" y="166">Never the validation fold.</text>
  </g>
  <text class="leakage-rule-sub" x="30" y="304">This produces one of the most convincing false results in applied machine learning, because the inflated score is stable across folds and looks entirely trustworthy.</text>
</svg>
