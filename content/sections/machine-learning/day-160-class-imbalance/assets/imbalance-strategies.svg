<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Class Imbalance Mitigation Strategies">
  <title>Class Imbalance Strategies: Resampling vs Cost Weighting</title>
  <defs>
    <style>
      .d160a-bg { fill: #f8fafc; }
      .d160a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d160a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .d160a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d160a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      .d160a-maj { fill: #3b82f6; }
      .d160a-min { fill: #ef4444; }
      .d160a-syn { fill: #10b981; stroke: #047857; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d160a-bg" />

  <text x="40" y="45" class="d160a-header" font-size="22">Taxonomy of Class Imbalance Solutions</text>
  <text x="40" y="70" class="d160a-text">Contrasting Data-Level Resampling against Algorithm-Level Cost Weighting</text>

  <!-- Panel 1: Undersampling -->
  <rect x="40" y="100" width="260" height="340" class="d160a-card" />
  <text x="55" y="130" class="d160a-header" fill="#1d4ed8">1. Undersampling</text>
  <text x="55" y="155" class="d160a-text">Discards majority samples</text>
  <text x="55" y="175" class="d160a-math" fill="#b91c1c">Risk: Information Loss</text>

  <rect x="55" y="195" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <!-- Majority dots (sparse) -->
  <circle cx="90" cy="240" r="6" class="d160a-maj" />
  <circle cx="140" cy="220" r="6" class="d160a-maj" />
  <circle cx="180" cy="250" r="6" class="d160a-maj" />
  <circle cx="110" cy="280" r="6" class="d160a-maj" />

  <!-- Minority dots -->
  <circle cx="210" cy="290" r="6" class="d160a-min" />
  <circle cx="240" cy="270" r="6" class="d160a-min" />
  <circle cx="220" cy="320" r="6" class="d160a-min" />
  <circle cx="250" cy="310" r="6" class="d160a-min" />

  <text x="55" y="375" class="d160a-text">Balances counts directly</text>
  <text x="55" y="395" class="d160a-text" fill="#64748b">Fast, but wastes data</text>

  <!-- Panel 2: SMOTE Oversampling -->
  <rect x="320" y="100" width="260" height="340" class="d160a-card" />
  <text x="335" y="130" class="d160a-header" fill="#047857">2. SMOTE Oversampling</text>
  <text x="335" y="155" class="d160a-text">Synthesizes minority points</text>
  <text x="335" y="175" class="d160a-math" fill="#047857">x_syn = x + λ·(x_nn - x)</text>

  <rect x="335" y="195" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <!-- Minority real + synthetic -->
  <circle cx="480" cy="270" r="6" class="d160a-min" />
  <circle cx="530" cy="310" r="6" class="d160a-min" />
  <line x1="480" y1="270" x2="530" y2="310" stroke="#10b981" stroke-dasharray="2 2" />
  <!-- Synthetic points -->
  <circle cx="495" cy="282" r="5" class="d160a-syn" />
  <circle cx="515" cy="298" r="5" class="d160a-syn" />

  <text x="335" y="375" class="d160a-text">Creates convex manifolds</text>
  <text x="335" y="395" class="d160a-text" fill="#64748b">Must resample in train ONLY</text>

  <!-- Panel 3: Cost Weighting -->
  <rect x="600" y="100" width="260" height="340" class="d160a-card" />
  <text x="615" y="130" class="d160a-header" fill="#7c3aed">3. Cost Weighting</text>
  <text x="615" y="155" class="d160a-text">Algorithm-level penalty</text>
  <text x="615" y="175" class="d160a-math" fill="#7c3aed">w_c = N / (K · N_c)</text>

  <rect x="615" y="195" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="630" y="240" class="d160a-text" font-weight="700">Modified Cross-Entropy:</text>
  <text x="630" y="270" class="d160a-math" font-size="11">L = - ∑ w_y · log P(y|x)</text>
  <text x="630" y="310" class="d160a-text">Minority errors amplified</text>

  <text x="615" y="375" class="d160a-text">Zero data alteration</text>
  <text x="615" y="395" class="d160a-text" fill="#64748b">Direct gradient rebalancing</text>
</svg>
