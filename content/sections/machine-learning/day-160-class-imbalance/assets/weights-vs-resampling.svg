<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same goal, different risks.">
  <title>Weighting against resampling</title>
  <style>
    .weights-vs-resampling-bg   { fill: #f8fafc; }
    .weights-vs-resampling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-vs-resampling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-vs-resampling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-vs-resampling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-vs-resampling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-vs-resampling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weights-vs-resampling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weights-vs-resampling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weights-vs-resampling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weights-vs-resampling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weights-vs-resampling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weights-vs-resampling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weights-vs-resampling-row { opacity: 1; }
    .weights-vs-resampling-r0 { animation-delay: 0.00s; }
    .weights-vs-resampling-r1 { animation-delay: 0.45s; }
    .weights-vs-resampling-r2 { animation-delay: 0.90s; }
    .weights-vs-resampling-r3 { animation-delay: 1.35s; }
    .weights-vs-resampling-r4 { animation-delay: 1.80s; }
    .weights-vs-resampling-row { animation: weights-vs-resampling-reveal 7.3s ease-in-out infinite; }
    @keyframes weights-vs-resampling-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="weights-vs-resampling-bg" width="980" height="390"/>
  <text class="weights-vs-resampling-h1"  x="30" y="40">Weighting against resampling</text>
  <text class="weights-vs-resampling-sub" x="30" y="64">Same goal, different risks.</text>
  <rect class="weights-vs-resampling-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="weights-vs-resampling-name" x="46" y="122">Weighting</text>
  <text class="weights-vs-resampling-desc" x="46" y="142">Change the objective.</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r0" x="46" y="182">Data untouched</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r1" x="46" y="216">No leakage risk</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r2" x="46" y="250">One parameter, easy to reason about</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r3" x="46" y="284">Supported by most libraries</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r4" x="46" y="318">Distorts calibration predictably</text>
  <rect class="weights-vs-resampling-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="weights-vs-resampling-name" x="526" y="122">Resampling</text>
  <text class="weights-vs-resampling-desc" x="526" y="142">Change the data.</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r0" x="526" y="182">Data duplicated or discarded</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r1" x="526" y="216">Leakage risk if done before splitting</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r2" x="526" y="250">Several parameters to tune</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r3" x="526" y="284">Needs pipeline discipline</text>
  <text class="weights-vs-resampling-desc weights-vs-resampling-row weights-vs-resampling-r4" x="526" y="318">Can help where weighting alone plateaus</text>
  <text class="weights-vs-resampling-sub" x="30" y="372">Start with weighting and escalate only on measured failure, which is the same cheap-first discipline that applies to model choice.</text>
</svg>
