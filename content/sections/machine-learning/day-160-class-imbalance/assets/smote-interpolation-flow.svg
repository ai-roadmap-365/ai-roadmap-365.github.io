<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="SMOTE Interpolation Geometry Flow">
  <title>SMOTE Synthetic Minority Interpolation Flow</title>
  <defs>
    <style>
      .d160f-bg { fill: #f8fafc; }
      .d160f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d160f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .d160f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d160f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      .d160f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d160f-arr); fill: none; }
      
      @keyframes d160f-slide {
        0% { cx: 400; cy: 260; }
        100% { cx: 620; cy: 210; }
      }
      .d160f-gen { animation: d160f-slide 3s infinite alternate ease-in-out; fill: #10b981; stroke: #047857; stroke-width: 2; }
      
      @media (prefers-reduced-motion: reduce) {
        .d160f-gen { animation: none; cx: 510; cy: 235; fill: #10b981; }
      }
    </style>
    <marker id="d160f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d160f-bg" />

  <text x="40" y="45" class="d160f-title" font-size="22">SMOTE: Geometric Line Segment Interpolation</text>
  <text x="40" y="70" class="d160f-text">Synthesizing realistic continuous points along nearest-neighbor vectors: x_new = x_i + λ · (x_nn - x_i)</text>

  <!-- Left Explanation Card -->
  <rect x="40" y="110" width="270" height="340" class="d160f-box" />
  <text x="55" y="140" class="d160f-title" font-size="15" fill="#1e40af">Algorithm Steps</text>

  <text x="55" y="175" class="d160f-text" font-weight="700">1. Select Minority Point:</text>
  <text x="55" y="195" class="d160f-math">x_i ∈ X_minority</text>

  <text x="55" y="230" class="d160f-text" font-weight="700">2. Find k-NN in Minority:</text>
  <text x="55" y="250" class="d160f-math">N_k(x_i) = {x_nn₁, ..., x_nn_k}</text>

  <text x="55" y="285" class="d160f-text" font-weight="700">3. Draw Random Step λ:</text>
  <text x="55" y="305" class="d160f-math">λ ~ Uniform(0, 1)</text>

  <text x="55" y="340" class="d160f-text" font-weight="700">4. Interpolate Position:</text>
  <text x="55" y="360" class="d160f-math" font-size="11">x_syn = x_i + λ·(x_nn - x_i)</text>

  <text x="55" y="415" class="d160f-text" fill="#dc2626" font-size="11">Critical: Apply ONLY on train split!</text>

  <!-- Right Geometric Canvas -->
  <rect x="330" y="110" width="530" height="340" class="d160f-box" />
  <text x="350" y="140" class="d160f-title" font-size="15">Feature Space Vector Interpolation</text>

  <!-- Line connecting base to neighbor -->
  <line x1="400" y1="260" x2="620" y2="210" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="400" y1="260" x2="480" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="400" y1="260" x2="550" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Base point x_i -->
  <circle cx="400" cy="260" r="10" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
  <text x="360" y="290" class="d160f-math" font-size="14">x_i (Base)</text>

  <!-- Neighbor point x_nn -->
  <circle cx="620" cy="210" r="10" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
  <text x="635" y="215" class="d160f-math" font-size="14">x_nn (Neighbor)</text>

  <!-- Other neighbors -->
  <circle cx="480" cy="360" r="7" fill="#fca5a5" />
  <circle cx="550" cy="160" r="7" fill="#fca5a5" />

  <!-- Animated synthetic point -->
  <circle r="9" class="d160f-gen" />
  <text x="470" y="225" class="d160f-text" font-weight="700" fill="#047857">x_syn (Synthetic Point)</text>

  <text x="350" y="420" class="d160f-text">Synthetic points populate the interior convex line segments between true minority instances.</text>
</svg>
