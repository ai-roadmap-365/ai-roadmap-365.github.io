<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are fairness.">
  <title>Four consequences of imbalance</title>
  <style>
    .imbalance-implications-bg   { fill: #f8fafc; }
    .imbalance-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .imbalance-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .imbalance-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .imbalance-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .imbalance-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .imbalance-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .imbalance-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .imbalance-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .imbalance-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .imbalance-implications-stage { opacity: 1; }

    .imbalance-implications-s0 { animation-delay: 0.00s; }
    .imbalance-implications-e0 { animation-delay: 0.00s; }
    .imbalance-implications-s1 { animation-delay: 1.28s; }
    .imbalance-implications-e1 { animation-delay: 1.28s; }
    .imbalance-implications-s2 { animation-delay: 2.56s; }
    .imbalance-implications-e2 { animation-delay: 2.56s; }
    .imbalance-implications-s3 { animation-delay: 3.84s; }
    .imbalance-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .imbalance-implications-conn  { animation: imbalance-implications-trace 6.4s ease-in-out infinite; }
      .imbalance-implications-stage { animation: imbalance-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes imbalance-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes imbalance-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .imbalance-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .imbalance-implications-stage { animation: imbalance-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes imbalance-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="imbalance-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="imbalance-implications-bg" width="980" height="322"/>
  <text class="imbalance-implications-h1"  x="30" y="40">Four consequences of imbalance</text>
  <text class="imbalance-implications-sub" x="30" y="64">Two are fairness.</text>
  <g class="imbalance-implications-stage imbalance-implications-s0">
    <rect class="imbalance-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-implications-step" x="44" y="142">01</text>
    <text class="imbalance-implications-name" x="70" y="142">Reweighting distorts predicted probabilities</text>
    <text class="imbalance-implications-desc" x="44" y="166">So recalibrate if the</text>
    <text class="imbalance-implications-desc" x="44" y="182">probability is used.</text>
  </g>
  <line class="imbalance-implications-line imbalance-implications-conn imbalance-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#imbalance-implications-tip)"/>
  <g class="imbalance-implications-stage imbalance-implications-s1">
    <rect class="imbalance-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-implications-step" x="280" y="142">02</text>
    <text class="imbalance-implications-name" x="306" y="142">Minority groups are often the rare class</text>
    <text class="imbalance-implications-desc" x="280" y="166">So imbalance handling is</text>
    <text class="imbalance-implications-desc" x="280" y="182">frequently a fairness matter.</text>
  </g>
  <line class="imbalance-implications-line imbalance-implications-conn imbalance-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#imbalance-implications-tip)"/>
  <g class="imbalance-implications-stage imbalance-implications-s2">
    <rect class="imbalance-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-implications-step" x="516" y="142">03</text>
    <text class="imbalance-implications-name" x="542" y="142">The evaluation set must keep the real balance</text>
    <text class="imbalance-implications-desc" x="516" y="166">Or the numbers describe a</text>
    <text class="imbalance-implications-desc" x="516" y="182">fictional world.</text>
  </g>
  <line class="imbalance-implications-line imbalance-implications-conn imbalance-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#imbalance-implications-tip)"/>
  <g class="imbalance-implications-stage imbalance-implications-s3">
    <rect class="imbalance-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="imbalance-implications-step" x="752" y="142">04</text>
    <text class="imbalance-implications-name" x="778" y="142">And the threshold matters more than usual</text>
    <text class="imbalance-implications-desc" x="752" y="166">Small shifts move the rare class</text>
    <text class="imbalance-implications-desc" x="752" y="182">a great deal.</text>
  </g>
  <text class="imbalance-implications-sub" x="30" y="304">The fairness connection is not incidental: the technical problem of a rare class and the social problem of an under-represented group are frequently the same rows of data.</text>
</svg>
