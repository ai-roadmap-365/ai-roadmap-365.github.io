questions:
  - question: 'Why does standard logistic regression or gradient-based classification fail on heavily imbalanced datasets (e.g. 99% Negative, 1% Positive)?'
    options:
      - 'Because logistic regression cannot compute gradients on small classes'
      - 'The majority class dominates the loss and the gradients'
      - 'Because the sigmoid function only outputs values above 0.50'
      - 'Because the matrix X^T X is always singular on imbalanced data'
    answer_index: 1
    explanation: 'In unweighted cross-entropy loss, each sample contributes equally. When 99% of samples belong to class 0, the optimizer minimizes global loss by shifting the bias to push all probabilities toward 0.'

  - question: 'What is the formula for balanced class weighting w_c in scikit-learn (class_weight="balanced")?'
    options:
      - 'w_c = 1 / sqrt(N_c)'
      - 'w_c = N_c / N'
      - 'w_c = N / (K * N_c)'
      - 'w_c = N_c * K'
    answer_index: 2
    explanation: 'To give each class equal total weight in the loss function, the weight for class c is the total sample count N divided by the number of classes K times the sample count N_c in class c.'

  - question: 'How does the SMOTE (Synthetic Minority Over-sampling Technique) algorithm create new minority samples?'
    options:
      - 'It flips labels of majority points near the decision boundary'
      - 'It duplicates existing minority points with random Gaussian jitter added to all features'
      - 'It trains a Generative Adversarial Network (GAN) on the entire dataset'
      - 'It interpolates between a minority point and its neighbours'
    answer_index: 3
    explanation: 'SMOTE operates in feature space, selecting a random neighbor among the k-NN of a minority point and creating synthetic instances along the vector segment joining them.'

  - question: 'What is the primary danger of Random Undersampling of the majority class?'
    options:
      - 'It discards most of the training data'
      - 'It causes severe overfitting on the minority class'
      - 'It increases training time by a factor of 10'
      - 'It violates the triangle inequality'
    answer_index: 0
    explanation: 'By throwing away 90%–99% of majority samples to balance class counts, undersampling discards rich information about the variance and boundaries of the majority distribution.'

  - question: 'Why is it a catastrophic methodological error to apply SMOTE or oversampling to your entire dataset BEFORE performing train-test splitting or cross-validation?'
    options:
      - 'SMOTE will crash if applied to more than 1,000 samples'
      - 'Synthetic points from test rows leak into training'
      - 'Cross-validation requires equal fold sizes'
      - 'Scikit-learn forbids pipelines with resamplers'
    answer_index: 1
    explanation: 'Resampling before splitting leaks information across the train/test boundary. Synthetic points in the test set will be linear interpolations of training points, resulting in severe data leakage.'

  - question: 'What is the Focal Loss formulation designed to address in dense object detection and imbalanced classification?'
    options:
      - 'It eliminates the need for gradient descent'
      - 'It replaces log loss with mean squared error'
      - 'It down-weights easy, well-classified samples'
      - 'It automatically balances class counts in memory'
    answer_index: 2
    explanation: 'Focal Loss dynamically scales cross entropy: when a sample is easily classified (p_t -> 1), the modulating factor (1 - p_t)^gamma -> 0, focusing gradient updates almost entirely on hard, rare instances.'

  - question: 'If you train a model on an artificially balanced dataset (50% positive / 50% negative) through undersampling, what must you do to the model predicted probabilities before using them in a production system where the true base rate is 1%?'
    options:
      - 'Re-train the model on raw unscaled data'
      - 'Multiply all probabilities by 100'
      - 'Nothing; probabilities are scale-invariant'
      - 'Apply prior probability calibration'
    answer_index: 3
    explanation: 'Training on a balanced sample alters the learned prior P(y=1) to 0.50. To recover calibrated posterior probabilities under the real-world base rate pi_true = 0.01, the logits must be shifted by the log-odds ratio of the priors.'

  - question: 'Which cross-validation strategy MUST be used when evaluating datasets with rare target classes?'
    options:
      - 'Stratified K-fold cross-validation'
      - 'Standard K-Fold Cross-Validation (`KFold`)'
      - 'Leave-One-Out Cross-Validation (`LeaveOneOut`)'
      - 'Time Series Split'
    answer_index: 0
    explanation: 'Standard KFold randomly assigns samples, risking folds that contain zero minority instances. StratifiedKFold guarantees that every train and validation split preserves the exact global class ratio.'
