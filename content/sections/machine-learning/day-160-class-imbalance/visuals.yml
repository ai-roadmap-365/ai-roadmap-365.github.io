visuals:
  - id: imbalance-strategies
    file: assets/imbalance-strategies.svg
    type: diagram
    title: 'Class Imbalance Mitigation Strategies: Resampling vs Cost Weighting'
    alt: 'Diagram comparing three major class imbalance solutions: Data-Level Undersampling, Data-Level SMOTE Oversampling, and Algorithm-Level Cost-Sensitive Class Weighting.'
    description: 'A static architecture diagram illustrating the taxonomy of imbalance solutions: discarding majority samples (Undersampling), generating synthetic feature vectors (SMOTE), and scaling loss gradients by inverse class frequency (Cost-Sensitive Weighting).'
  - id: smote-interpolation-flow
    file: assets/smote-interpolation-flow.svg
    type: flow-animated
    title: 'SMOTE Synthetic Minority Interpolation Geometry'
    alt: 'Animated diagram showing a minority class instance finding its k-nearest neighbors in feature space and generating new synthetic points along the connecting line segments via random lambda weighting.'
    description: 'An animated flow diagram demonstrating how SMOTE computes k-NN distance vectors and synthesizes new continuous minority instances along convex line segments with reduced-motion fallback.'
