visuals:
  - id: imbalance-strategies
    file: assets/imbalance-strategies.svg
    type: diagram
    title: 'Class Imbalance Mitigation Strategies: Resampling vs Cost Weighting'
    alt: 'Diagram comparing three major class imbalance solutions: Data-Level Undersampling, Data-Level SMOTE Oversampling, and Algorithm-Level Cost-Sensitive Class Weighting.'
    description: 'A static architecture diagram illustrating the taxonomy of imbalance solutions: discarding majority samples (Undersampling), generating synthetic feature vectors (SMOTE), and scaling loss gradients by inverse class frequency (Cost-Sensitive Weighting).'
  - id: smote-interpolation-flow
    file: assets/smote-interpolation-flow.svg
    type: flow-animated
    title: 'SMOTE Synthetic Minority Interpolation Geometry'
    alt: 'Animated diagram showing a minority class instance finding its k-nearest neighbors in feature space and generating new synthetic points along the connecting line segments via random lambda weighting.'
    description: 'An animated flow diagram demonstrating how SMOTE computes k-NN distance vectors and synthesizes new continuous minority instances along convex line segments with reduced-motion fallback.'
  - id: imbalance-idea
    file: assets/imbalance-idea.svg
    type: diagram
    title: 'Why imbalance breaks training'
    alt: 'Diagram: why an imbalanced dataset produces a model that ignores the rare class'
    description: 'A four-stage description of the imbalance problem covering the rare class, the loss contribution, the optimum and the consequence.'
  - id: class-weights
    file: assets/class-weights.svg
    type: diagram
    title: 'Reweighting the loss'
    alt: 'Diagram: how class weights rebalance the training objective'
    description: 'A four-stage description of class weighting covering the weight, its effect on the loss, the resulting gradient and the advantages.'
  - id: resampling
    file: assets/resampling.svg
    type: diagram
    title: 'Two resampling directions'
    alt: 'Diagram: undersampling the majority class compared with oversampling the minority'
    description: 'A two-column comparison of undersampling against oversampling.'
  - id: leakage-rule
    file: assets/leakage-rule.svg
    type: diagram
    title: 'The cardinal rule'
    alt: 'Diagram: why resampling must happen inside the cross-validation split'
    description: 'A four-stage description of resampling leakage covering the wrong order, the duplication, the inflated score and the correct order.'
  - id: unweighted-failure
    file: assets/unweighted-failure.svg
    type: diagram
    title: 'Why the loss fails'
    alt: 'Diagram: how the loss contribution of a rare class shrinks with imbalance'
    description: 'A four-stage description of the loss failure covering per-example loss, the average, the imbalance ratio and the effective gradient.'
  - id: imbalance-not
    file: assets/imbalance-not.svg
    type: diagram
    title: 'What imbalance handling is not'
    alt: 'Diagram: four misconceptions about handling class imbalance'
    description: 'A two-column comparison of misconceptions about imbalance handling against what is true.'
  - id: imbalance-history
    file: assets/imbalance-history.svg
    type: diagram
    title: 'Four steps in imbalance handling'
    alt: 'Diagram: the historical progression of class imbalance techniques'
    description: 'A four-stage description of imbalance history covering neglect, resampling, synthetic generation and cost-sensitive learning.'
  - id: security-screening
    file: assets/security-screening.svg
    type: diagram
    title: 'Searching for something rare'
    alt: 'Diagram: a rare-event search where accuracy is uninformative'
    description: 'A two-column comparison of an accuracy-driven approach against a recall-driven one for rare events.'
  - id: imbalance-implications
    file: assets/imbalance-implications.svg
    type: diagram
    title: 'Four consequences of imbalance'
    alt: 'Diagram: the calibration, fairness, evaluation and threshold implications of class imbalance'
    description: 'A four-stage description of imbalance implications covering calibration, subgroup effects, evaluation choice and threshold sensitivity.'
  - id: imbalance-when
    file: assets/imbalance-when.svg
    type: diagram
    title: 'Which strategy when'
    alt: 'Diagram: choosing an imbalance strategy by situation'
    description: 'A two-column comparison of situations against the imbalance strategy that fits.'
  - id: threshold-imbalance
    file: assets/threshold-imbalance.svg
    type: diagram
    title: 'Imbalance and the threshold'
    alt: 'Diagram: how class imbalance shifts the optimal decision threshold'
    description: 'A four-stage description of threshold shifting covering the default, the skewed distribution, the optimum and the tuning.'
  - id: weights-vs-resampling
    file: assets/weights-vs-resampling.svg
    type: diagram
    title: 'Weighting against resampling'
    alt: 'Diagram: class weighting compared with resampling'
    description: 'A two-column comparison of class weighting against resampling.'
