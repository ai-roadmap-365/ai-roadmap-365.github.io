id: D160
day: 160
slug: class-imbalance
title: Class Imbalance
section: machine-learning
subsection: core-concepts
week: 23
learning_promise: >-
  Master the theory and practical mitigation of class imbalance: why standard empirical risk minimization fails
  under severe skew, how cost-sensitive learning and balanced class weights rebalance loss gradients, how random
  undersampling and oversampling reshape training distributions, how SMOTE generates synthetic minority instances
  through geometric interpolation, and how to avoid critical data leakage in cross-validation pipelines.
objectives:
  - 'Diagnose the failure modes of standard loss functions on imbalanced datasets (e.g. 1:100 skew)'
  - 'Derive and implement balanced class weights for cost-sensitive classification'
  - 'Implement random undersampling and oversampling techniques'
  - 'Construct the Synthetic Minority Over-sampling Technique (SMOTE) algorithm from first principles'
  - 'Compare algorithm-level weighting with data-level resampling'
  - 'Explain why resampling before cross-validation causes fatal data leakage'
  - 'Apply probability calibration and threshold shifting to correct for altered class priors'
  - 'Evaluate imbalanced classifiers using PR AUC, F-beta, and Matthews Correlation Coefficient'
prerequisites:
  - 'Day 157 -- k-Nearest Neighbors and distance matrices'
  - 'Day 159 -- Precision, Recall, PR curves, and confusion matrices'
reading_time_minutes: 50
practical_time_minutes: 60
