questions:
  - question: 'What is the primary architectural purpose of a 3-way data partition (Train / Validation / Test) in a classification project?'
    options:
      - 'Train fits model parameters; Validation tunes hyperparameters and decision thresholds; Test provides an unbiased, untouched final benchmark of real-world generalization'
      - 'To make training three times faster'
      - 'To satisfy scikit-learn syntax requirements'
      - 'To balance class ratios across folds'
    answer_index: 0
    explanation: 'The validation split allows iterative model selection and threshold tuning without contaminating the test set. The test set remains completely untouched until the final deployment sign-off.'

  - question: 'What is the correct procedure for applying feature standardization (StandardScaler) in an end-to-end pipeline?'
    options:
      - 'Call scaler.fit_transform() on the training data ONLY; then call scaler.transform() on validation and test data using the training parameters'
      - 'Call scaler.fit_transform() on the entire dataset before splitting'
      - 'Fit a separate scaler independently on each split'
      - 'Scaling is unnecessary if using Logistic Regression'
    answer_index: 0
    explanation: 'Fitting the scaler on validation or test data leaks future distributional parameters (mean and variance) into the training phase. The scaler must learn parameters strictly from training data.'

  - question: 'Why is it critical to benchmark multiple distinct model families (e.g. Logistic Regression, KNN, Naive Bayes) rather than jumping immediately to a complex model?'
    options:
      - 'Different model families embody distinct inductive biases (linear hyperplanes, local Voronoi neighborhoods, generative feature independence); a simpler model often matches or beats complex models while offering superior latency, interpretability, and debuggability'
      - 'Because complex models cannot be evaluated with ROC curves'
      - 'Because KNN is always required as an ensemble component'
      - 'Because Scikit-Learn requires running all three'
    answer_index: 0
    explanation: 'Establishing transparent linear and non-parametric baselines provides an honest benchmark. If Logistic Regression matches complex models within 0.5% F1 score, its microsecond latency and full explainability make it the superior production choice.'

  - question: 'On which data split should the optimal classification threshold tau* be calibrated?'
    options:
      - 'On the Validation split (or via out-of-fold training predictions)'
      - 'On the Test split'
      - 'On the Training split directly'
      - 'Thresholds should always remain at default 0.50'
    answer_index: 0
    explanation: 'Calibrating the threshold on the test set is a form of data leakage (optimizing parameters on test data). Threshold optimization must occur on validation data, followed by verification on the test set.'

  - question: 'What is the purpose of conducting a systematic Error Analysis after model training?'
    options:
      - 'Inspecting individual False Positive and False Negative cases to identify mislabeled training data, missing feature signals, or systematic demographic failure modes'
      - 'Calculating the training loss'
      - 'Running unit tests on the code'
      - 'Plotting a scatter plot of feature weights'
    answer_index: 0
    explanation: 'Error analysis moves beyond aggregate numbers to examine specific misclassified records, discovering whether errors stem from noisy labels, unhandled edge cases, or missing informative features.'

  - question: 'What does the "Gated Test Set" access-control design pattern enforce in production ML development?'
    options:
      - 'It programmatically prevents evaluating the test set more than once, stopping practitioners from repeatedly tweaking hyperparameters until the test score happens to look good'
      - 'It encrypts test data with RSA keys'
      - 'It restricts test access to root users'
      - 'It forces test data to be stored in SQL'
    answer_index: 0
    explanation: 'Repeatedly testing and tweaking against the test set causes subtle overfitting to the test data. A gated test set locks evaluation after a single run to ensure absolute integrity.'

  - question: 'When comparing model candidates in Stratified 5-Fold Cross-Validation, how should fold splits be organized across models?'
    options:
      - 'All candidate models must be evaluated on the exact same cross-validation fold indices (using a fixed random_state in StratifiedKFold) to guarantee fair paired comparisons'
      - 'Each model should use a different random fold partition'
      - 'Models should be evaluated on different sub-samples'
      - 'Only the champion model needs cross-validation'
    answer_index: 0
    explanation: 'Using identical fold splits eliminates variance caused by lucky data partitions, enabling a rigorous paired statistical comparison between models.'

  - question: 'What should be exported in a complete production classification artifact?'
    options:
      - 'A single serialized pipeline object containing the fitted feature transformers, the champion model, the calibrated threshold tau*, and metadata documentation'
      - 'Only the weight vector w'
      - 'The raw training dataset'
      - 'A Jupyter notebook'
    answer_index: 0
    explanation: 'A production artifact must encapsulate the full deterministic transformation chain (preprocessors, model, and calibrated threshold) so raw inputs can be mapped directly to decisions in production.'
