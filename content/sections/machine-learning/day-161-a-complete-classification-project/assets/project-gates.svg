<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Eight of them.">
  <title>A project is a sequence of gates</title>
  <style>
    .project-gates-bg   { fill: #f8fafc; }
    .project-gates-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-gates-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-gates-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-gates-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-gates-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .project-gates-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .project-gates-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .project-gates-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .project-gates-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .project-gates-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .project-gates-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .project-gates-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .project-gates-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .project-gates-stage { opacity: 1; }

    .project-gates-s0 { animation-delay: 0.00s; }
    .project-gates-e0 { animation-delay: 0.00s; }
    .project-gates-s1 { animation-delay: 1.37s; }
    .project-gates-e1 { animation-delay: 1.37s; }
    .project-gates-s2 { animation-delay: 2.74s; }
    .project-gates-e2 { animation-delay: 2.74s; }
    .project-gates-s3 { animation-delay: 4.11s; }
    .project-gates-e3 { animation-delay: 4.11s; }
    .project-gates-s4 { animation-delay: 5.49s; }
    .project-gates-e4 { animation-delay: 5.49s; }
    .project-gates-s5 { animation-delay: 6.86s; }
    .project-gates-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .project-gates-conn  { animation: project-gates-trace 9.600000000000001s ease-in-out infinite; }
      .project-gates-stage { animation: project-gates-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes project-gates-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes project-gates-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .project-gates-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .project-gates-stage { animation: project-gates-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes project-gates-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="project-gates-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="project-gates-bg" width="980" height="322"/>
  <text class="project-gates-h1"  x="30" y="40">A project is a sequence of gates</text>
  <text class="project-gates-sub" x="30" y="64">Eight of them.</text>
  <g class="project-gates-stage project-gates-s0">
    <rect class="project-gates-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="44" y="142">01</text>
    <text class="project-gates-name" x="70" y="142">Formulate the problem and a trivial baseline</text>
    <text class="project-gates-desc" x="44" y="166">Before any</text>
    <text class="project-gates-desc" x="44" y="182">modelling.</text>
  </g>
  <line class="project-gates-line project-gates-conn project-gates-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#project-gates-tip)"/>
  <g class="project-gates-stage project-gates-s1">
    <rect class="project-gates-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="201" y="142">02</text>
    <text class="project-gates-name" x="227" y="142">Split three ways, stratified</text>
    <text class="project-gates-desc" x="201" y="166">Train, validation</text>
    <text class="project-gates-desc" x="201" y="182">and a test set you</text>
    <text class="project-gates-desc" x="201" y="198">do not touch.</text>
  </g>
  <line class="project-gates-line project-gates-conn project-gates-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#project-gates-tip)"/>
  <g class="project-gates-stage project-gates-s2">
    <rect class="project-gates-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="358" y="142">03</text>
    <text class="project-gates-name" x="384" y="142">Fit preprocessing on training data only</text>
    <text class="project-gates-desc" x="358" y="166">Which is where</text>
    <text class="project-gates-desc" x="358" y="182">leakage usually</text>
    <text class="project-gates-desc" x="358" y="198">enters.</text>
  </g>
  <line class="project-gates-line project-gates-conn project-gates-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#project-gates-tip)"/>
  <g class="project-gates-stage project-gates-s3">
    <rect class="project-gates-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="515" y="142">04</text>
    <text class="project-gates-name" x="541" y="142">Compare models by cross-validation</text>
    <text class="project-gates-desc" x="515" y="166">On the training</text>
    <text class="project-gates-desc" x="515" y="182">folds alone.</text>
  </g>
  <line class="project-gates-line project-gates-conn project-gates-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#project-gates-tip)"/>
  <g class="project-gates-stage project-gates-s4">
    <rect class="project-gates-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="672" y="142">05</text>
    <text class="project-gates-name" x="698" y="142">Calibrate the threshold on validation</text>
    <text class="project-gates-desc" x="672" y="166">Using real costs.</text>
  </g>
  <line class="project-gates-line project-gates-conn project-gates-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#project-gates-tip)"/>
  <g class="project-gates-stage project-gates-s5">
    <rect class="project-gates-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="project-gates-step" x="829" y="142">06</text>
    <text class="project-gates-name" x="855" y="142">Then open the test set, once</text>
    <text class="project-gates-desc" x="829" y="166">And report whatever</text>
    <text class="project-gates-desc" x="829" y="182">it says.</text>
    <text class="project-gates-edge" x="829" y="242">single access</text>
  </g>
  <text class="project-gates-sub" x="30" y="304">The ordering is the method: each gate exists to stop information from a later stage influencing an earlier one, which is the whole discipline.</text>
</svg>
