<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Written before the data.">
  <title>A trial protocol</title>
  <style>
    .clinical-trial-bg   { fill: #f8fafc; }
    .clinical-trial-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clinical-trial-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clinical-trial-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clinical-trial-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clinical-trial-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clinical-trial-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clinical-trial-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clinical-trial-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clinical-trial-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clinical-trial-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clinical-trial-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clinical-trial-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clinical-trial-row { opacity: 1; }
    .clinical-trial-r0 { animation-delay: 0.00s; }
    .clinical-trial-r1 { animation-delay: 0.45s; }
    .clinical-trial-r2 { animation-delay: 0.90s; }
    .clinical-trial-r3 { animation-delay: 1.35s; }
    .clinical-trial-r4 { animation-delay: 1.80s; }
    .clinical-trial-row { animation: clinical-trial-reveal 7.3s ease-in-out infinite; }
    @keyframes clinical-trial-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clinical-trial-bg" width="980" height="390"/>
  <text class="clinical-trial-h1"  x="30" y="40">A trial protocol</text>
  <text class="clinical-trial-sub" x="30" y="64">Written before the data.</text>
  <rect class="clinical-trial-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clinical-trial-name" x="46" y="122">Decide as you go</text>
  <text class="clinical-trial-desc" x="46" y="142">Whatever looks good.</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r0" x="46" y="182">Metrics chosen after seeing results</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r1" x="46" y="216">The split revisited when it disappoints</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r2" x="46" y="250">Many comparisons, one reported</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r3" x="46" y="284">Findings that do not replicate</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r4" x="46" y="318">This is undisciplined modelling</text>
  <rect class="clinical-trial-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clinical-trial-name" x="526" y="122">Protocol first</text>
  <text class="clinical-trial-desc" x="526" y="142">Decided in advance.</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r0" x="526" y="182">Metric and target fixed beforehand</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r1" x="526" y="216">The split made once and kept</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r2" x="526" y="250">Every comparison recorded</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r3" x="526" y="284">Findings that hold up</text>
  <text class="clinical-trial-desc clinical-trial-row clinical-trial-r4" x="526" y="318">This is a gated project</text>
  <text class="clinical-trial-sub" x="30" y="372">Clinical research adopted pre-registration for exactly the reason applied machine learning needs it: analysis decisions made after seeing the data are not independent of it.</text>
</svg>
