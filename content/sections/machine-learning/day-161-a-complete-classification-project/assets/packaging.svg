<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four parts.">
  <title>Packaging the result</title>
  <style>
    .packaging-bg   { fill: #f8fafc; }
    .packaging-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packaging-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packaging-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packaging-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packaging-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packaging-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packaging-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packaging-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .packaging-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .packaging-stage { opacity: 1; }

    .packaging-s0 { animation-delay: 0.00s; }
    .packaging-e0 { animation-delay: 0.00s; }
    .packaging-s1 { animation-delay: 1.28s; }
    .packaging-e1 { animation-delay: 1.28s; }
    .packaging-s2 { animation-delay: 2.56s; }
    .packaging-e2 { animation-delay: 2.56s; }
    .packaging-s3 { animation-delay: 3.84s; }
    .packaging-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .packaging-conn  { animation: packaging-trace 6.4s ease-in-out infinite; }
      .packaging-stage { animation: packaging-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes packaging-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes packaging-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .packaging-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .packaging-stage { animation: packaging-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes packaging-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="packaging-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="packaging-bg" width="980" height="322"/>
  <text class="packaging-h1"  x="30" y="40">Packaging the result</text>
  <text class="packaging-sub" x="30" y="64">Four parts.</text>
  <g class="packaging-stage packaging-s0">
    <rect class="packaging-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-step" x="44" y="142">01</text>
    <text class="packaging-name" x="70" y="142">The whole pipeline, not just the model</text>
    <text class="packaging-desc" x="44" y="166">Preprocessing included, or</text>
    <text class="packaging-desc" x="44" y="182">inference will differ.</text>
  </g>
  <line class="packaging-line packaging-conn packaging-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#packaging-tip)"/>
  <g class="packaging-stage packaging-s1">
    <rect class="packaging-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-step" x="280" y="142">02</text>
    <text class="packaging-name" x="306" y="142">The calibrated threshold</text>
    <text class="packaging-desc" x="280" y="166">Which is part of the decision,</text>
    <text class="packaging-desc" x="280" y="182">not an afterthought.</text>
  </g>
  <line class="packaging-line packaging-conn packaging-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#packaging-tip)"/>
  <g class="packaging-stage packaging-s2">
    <rect class="packaging-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-step" x="516" y="142">03</text>
    <text class="packaging-name" x="542" y="142">Metadata: data version, code commit, library versions</text>
    <text class="packaging-desc" x="516" y="166">So the result can be reproduced.</text>
  </g>
  <line class="packaging-line packaging-conn packaging-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#packaging-tip)"/>
  <g class="packaging-stage packaging-s3">
    <rect class="packaging-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="packaging-step" x="752" y="142">04</text>
    <text class="packaging-name" x="778" y="142">And the evaluation record</text>
    <text class="packaging-desc" x="752" y="166">What it scored, on what, at what</text>
    <text class="packaging-desc" x="752" y="182">operating point.</text>
  </g>
  <text class="packaging-sub" x="30" y="304">Shipping the model without its preprocessing is a classic production failure: the served model receives raw features it was never trained on.</text>
</svg>
