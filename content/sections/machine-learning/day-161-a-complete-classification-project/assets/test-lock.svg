<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The test set is spent when used</title>
  <style>
    .test-lock-bg   { fill: #f8fafc; }
    .test-lock-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lock-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lock-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lock-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lock-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-lock-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-lock-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-lock-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-lock-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-lock-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-lock-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-lock-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-lock-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-lock-stage { opacity: 1; }

    .test-lock-s0 { animation-delay: 0.00s; }
    .test-lock-e0 { animation-delay: 0.00s; }
    .test-lock-s1 { animation-delay: 1.28s; }
    .test-lock-e1 { animation-delay: 1.28s; }
    .test-lock-s2 { animation-delay: 2.56s; }
    .test-lock-e2 { animation-delay: 2.56s; }
    .test-lock-s3 { animation-delay: 3.84s; }
    .test-lock-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-lock-conn  { animation: test-lock-trace 6.4s ease-in-out infinite; }
      .test-lock-stage { animation: test-lock-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-lock-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-lock-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-lock-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-lock-stage { animation: test-lock-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-lock-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-lock-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-lock-bg" width="980" height="322"/>
  <text class="test-lock-h1"  x="30" y="40">The test set is spent when used</text>
  <text class="test-lock-sub" x="30" y="64">Four steps.</text>
  <g class="test-lock-stage test-lock-s0">
    <rect class="test-lock-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-lock-step" x="44" y="142">01</text>
    <text class="test-lock-name" x="70" y="142">The test set estimates performance on unseen data</text>
    <text class="test-lock-desc" x="44" y="166">Which requires that it be</text>
    <text class="test-lock-desc" x="44" y="182">unseen.</text>
  </g>
  <line class="test-lock-line test-lock-conn test-lock-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-lock-tip)"/>
  <g class="test-lock-stage test-lock-s1">
    <rect class="test-lock-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-lock-step" x="280" y="142">02</text>
    <text class="test-lock-name" x="306" y="142">Looking at it and then changing the model</text>
    <text class="test-lock-desc" x="280" y="166">Makes it part of the fitting</text>
    <text class="test-lock-desc" x="280" y="182">process.</text>
  </g>
  <line class="test-lock-line test-lock-conn test-lock-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-lock-tip)"/>
  <g class="test-lock-stage test-lock-s2">
    <rect class="test-lock-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-lock-step" x="516" y="142">03</text>
    <text class="test-lock-name" x="542" y="142">After several such rounds it is a validation set</text>
    <text class="test-lock-desc" x="516" y="166">And overestimates performance.</text>
  </g>
  <line class="test-lock-line test-lock-conn test-lock-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-lock-tip)"/>
  <g class="test-lock-stage test-lock-s3">
    <rect class="test-lock-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-lock-step" x="752" y="142">04</text>
    <text class="test-lock-name" x="778" y="142">So decide everything on validation, then open it once</text>
    <text class="test-lock-desc" x="752" y="166">And report what it says,</text>
    <text class="test-lock-desc" x="752" y="182">including disappointment.</text>
  </g>
  <text class="test-lock-sub" x="30" y="304">Reporting the disappointing number is the part that requires discipline rather than technique, and it is what makes the estimate worth having.</text>
</svg>
