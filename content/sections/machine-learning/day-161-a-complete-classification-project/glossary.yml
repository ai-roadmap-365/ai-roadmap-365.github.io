terms:
  - term: 'End-to-End Classification Pipeline'
    definition: 'A cohesive software pipeline encapsulating data validation, feature preprocessing, model inference, and threshold calibration into a single deployable artifact.'
  - term: 'Stratified 3-Way Split'
    definition: 'Partitioning a dataset into Train (60%), Validation (20%), and Test (20%) subsets while preserving exact class prevalence across all three splits.'
  - term: 'Model Benchmarking'
    definition: 'The rigorous comparison of diverse algorithmic families (linear, instance-based, probabilistic) on identical cross-validation splits.'
  - term: 'Data Leakage'
    definition: 'The spurious introduction of information from outside the training dataset into the model building pipeline, producing unrealistically optimistic evaluations.'
  - term: 'Gated Test Evaluation'
    definition: 'A software design pattern that restricts test set evaluation to a single execution to prevent iterative overfitting to the test split.'
  - term: 'Threshold Calibration'
    definition: 'The empirical tuning of decision threshold tau on validation data to minimize business-specific asymmetric cost functions.'
  - term: 'Error Analysis'
    definition: 'The manual and automated diagnostic inspection of False Positives and False Negatives to uncover systematic failure modes and data quality defects.'
  - term: 'Inductive Bias'
    definition: 'The set of fundamental geometric and statistical assumptions an algorithm uses to predict outputs for unseen inputs.'
  - term: 'Baseline Rate'
    definition: 'The performance achieved by a trivial heuristic (such as predicting the majority class or stratified random guessing), establishing the minimum bar for any valid model.'
  - term: 'Subgroup Fairness'
    definition: 'Evaluating model performance (Precision, Recall, False Positive Rate) across demographic or operational subgroups to ensure equitable outcomes.'
