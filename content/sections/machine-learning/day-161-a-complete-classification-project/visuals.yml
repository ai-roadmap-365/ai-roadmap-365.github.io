visuals:
  - id: classification-pipeline-lifecycle
    file: assets/classification-pipeline-lifecycle.svg
    type: diagram
    title: 'The 8-Phase Classification Project Lifecycle'
    alt: 'Diagram showing the 8 linear phases of disciplined classification engineering: Problem Framing, 3-Way Stratified Split, Feature Preprocessing, Multi-Model CV Benchmarking, Threshold Calibration, Gated Test Evaluation, Error Analysis, and Production Deployment.'
    description: 'A static architecture diagram illustrating the rigorous engineering lifecycle of classification systems, highlighting isolation boundaries that prevent data leakage and ensure production reliability.'
  - id: model-benchmark-radar
    file: assets/model-benchmark-radar.svg
    type: flow-animated
    title: 'Multi-Model Benchmark Radar Comparison'
    alt: 'Animated radar chart comparing Logistic Regression, k-Nearest Neighbors, and Gaussian Naive Bayes across Accuracy, Precision, Recall, F1 Score, and Inference Speed.'
    description: 'An animated diagnostic chart contrasting four model configurations across five core evaluation dimensions with reduced-motion fallback.'
  - id: project-gates
    file: assets/project-gates.svg
    type: diagram
    title: 'A project is a sequence of gates'
    alt: 'Diagram: the eight gates of a complete classification project'
    description: 'A six-stage description of a classification project covering formulation, splitting, preprocessing, model selection, threshold calibration and locked evaluation.'
  - id: leakage-preprocessing
    file: assets/leakage-preprocessing.svg
    type: diagram
    title: 'How leakage enters'
    alt: 'Diagram: how preprocessing before splitting leaks information between sets'
    description: 'A four-stage description of preprocessing leakage covering the wrong order, the shared statistics, the inflated score and the correct order.'
  - id: test-lock
    file: assets/test-lock.svg
    type: diagram
    title: 'The test set is spent when used'
    alt: 'Diagram: why a test set can only be used once'
    description: 'A four-stage description of test set discipline covering the purpose, repeated use, the erosion and the practice.'
  - id: error-analysis
    file: assets/error-analysis.svg
    type: diagram
    title: 'Error analysis'
    alt: 'Diagram: the four steps of systematic error analysis'
    description: 'A four-stage description of error analysis covering collection, categorisation, counting and prioritisation.'
  - id: baseline
    file: assets/baseline.svg
    type: diagram
    title: 'Start with a baseline'
    alt: 'Diagram: the four steps of establishing a project baseline'
    description: 'A four-stage description of baseline setting covering the decision, the trivial baseline, the simple model and the target.'
  - id: stratified-split
    file: assets/stratified-split.svg
    type: diagram
    title: 'Splitting the data'
    alt: 'Diagram: the four properties of a correct three-way data split'
    description: 'A four-stage description of data splitting covering the three parts, stratification, grouping and time ordering.'
  - id: model-tournament
    file: assets/model-tournament.svg
    type: diagram
    title: 'Comparing models fairly'
    alt: 'Diagram: how several models are compared under identical conditions'
    description: 'A four-stage description of model comparison covering identical folds, the same pipeline, repeated runs and the spread.'
  - id: packaging
    file: assets/packaging.svg
    type: diagram
    title: 'Packaging the result'
    alt: 'Diagram: the four components of a deployable model artefact'
    description: 'A four-stage description of model packaging covering the pipeline, the threshold, the metadata and the evaluation record.'
  - id: project-not
    file: assets/project-not.svg
    type: diagram
    title: 'What a complete project is not'
    alt: 'Diagram: four misconceptions about what completes a machine learning project'
    description: 'A two-column comparison of misconceptions about project completion against what is true.'
  - id: clinical-trial
    file: assets/clinical-trial.svg
    type: diagram
    title: 'A trial protocol'
    alt: 'Diagram: an unplanned analysis compared with a pre-registered protocol'
    description: 'A two-column comparison of an unplanned analysis against a pre-registered one.'
  - id: project-implications
    file: assets/project-implications.svg
    type: diagram
    title: 'Four consequences of doing it properly'
    alt: 'Diagram: the reliability, speed, auditability and expectation implications of a gated project'
    description: 'A four-stage description of project discipline implications covering reliability, apparent slowness, auditability and expectation setting.'
  - id: project-when
    file: assets/project-when.svg
    type: diagram
    title: 'When to follow the full process'
    alt: 'Diagram: when the full project discipline is warranted'
    description: 'A two-column comparison of situations requiring the full process against lighter ones.'
