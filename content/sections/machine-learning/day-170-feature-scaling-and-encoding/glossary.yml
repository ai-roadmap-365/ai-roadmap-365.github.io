terms:
  - term: 'Feature Scaling'
    definition: 'The process of normalizing or standardizing the range of independent variables to ensure uniform contribution across distance metrics and optimization routines.'
  - term: 'StandardScaler (Z-Score)'
    definition: 'A transformation z = (x - mu) / sigma that centers data to zero mean and scales to unit variance.'
  - term: 'MinMaxScaler'
    definition: 'A linear transformation scaling features to a fixed closed interval, typically [0, 1].'
  - term: 'RobustScaler'
    definition: 'A scaling transformation using the median and Interquartile Range (IQR) that is robust against extreme numerical outliers.'
  - term: 'One-Hot Encoding (OHE)'
    definition: 'A representation where categorical variables are converted into binary indicator vectors with mutually exclusive active bits.'
  - term: 'Target Encoding'
    definition: 'A categorical encoding method that replaces each category with the average target value of that category, regularized by global Bayesian smoothing.'
  - term: 'Out-of-Fold (OOF) Target Encoding'
    definition: 'Computing target encodings strictly on complementary cross-validation folds to eliminate target leakage.'
  - term: 'Bayesian Shrinkage'
    definition: 'A regularization technique that pulls small-sample category estimates toward the global prior distribution mean.'
  - term: 'Condition Number (kappa)'
    definition: 'The ratio of the largest to smallest eigenvalue of the Hessian matrix, dictating the convergence speed of gradient descent.'
  - term: 'Yeo-Johnson Transformation'
    definition: 'A parametric power transformation that normalizes continuous features with positive, zero, or negative values.'
