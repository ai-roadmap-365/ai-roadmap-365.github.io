sources:
  - title: 'A Preprocessing Scheme for High-Cardinality Categorical Attributes in Classification and Prediction Problems'
    url: 'https://doi.org/10.1145/507533.507538'
    publisher: 'ACM SIGKDD Explorations (Daniele Micci-Barreca)'
    accessed: '2026-08-29'
    year: 2001
    description: 'Foundational paper introducing empirical Bayesian smoothed target encoding for high-cardinality categorical features.'
  - title: 'A New Family of Power Transformations to Improve Normality or Symmetry'
    url: 'https://doi.org/10.1093/biomet/87.4.954'
    publisher: 'Biometrika (In-Kwon Yeo and Richard A. Johnson)'
    accessed: '2026-08-29'
    year: 2000
    description: 'Introduced the Yeo-Johnson power transformation extending Box-Cox to handle zero and negative values.'
  - title: 'CatBoost: unbiased boosting with categorical features'
    url: 'https://proceedings.neurips.cc/paper/2018/hash/14491b756b3a51daac41c24863285549-Abstract.html'
    publisher: 'NeurIPS (Liudmila Prokhorenkova et al.)'
    accessed: '2026-08-29'
    year: 2018
    description: 'Analyzed target encoding prediction shift and introduced ordered target statistics to combat online leakage.'
