id: D170
day: 170
slug: feature-scaling-and-encoding
title: Feature Scaling and Encoding
section: machine-learning
subsection: supervised-learning
week: 25
learning_promise: >-
  Master the mathematical theory and practical implementation of Feature Scaling and Categorical Encoding: understand why
  gradient descent condition numbers and distance metrics demand scaling, compare StandardScaler vs MinMaxScaler vs RobustScaler vs MaxAbsScaler,
  master categorical encodings from One-Hot to Out-of-Fold Smoothed Target Encoding with Bayesian shrinkage,
  and identify exact scaling and encoding rules across all major model families.
objectives:
  - 'Derive why feature scale disparities degrade gradient descent condition numbers and distance metrics'
  - 'Implement StandardScaler, MinMaxScaler, and outlier-resilient RobustScaler from scratch'
  - 'Differentiate One-Hot Encoding, Ordinal Encoding, Frequency Encoding, and Target Encoding'
  - 'Formulate and implement leak-free Out-of-Fold Smoothed Target Encoding (Micci-Barreca, 2001)'
  - 'Analyze high-cardinality curse of dimensionality in sparse One-Hot representations'
  - 'Apply Power Transformations (Yeo-Johnson / Box-Cox) to normalize skewed distributions'
  - 'Classify model families by feature scaling invariance (Trees vs Linear vs SVM vs Neural)'
  - 'Construct leak-free preprocessing pipelines to prevent data leakage in production'
prerequisites:
  - 'Day 167 -- Cross-Validation Done Right'
  - 'Day 169 -- Support Vector Machines'
reading_time_minutes: 50
practical_time_minutes: 60
