questions:
  - question: 'Why does training a Linear Regression or Support Vector Machine on unscaled features (e.g. Feature 1 in [0, 1] and Feature 2 in [1000, 1000000]) degrade optimization?'
    options:
      - 'The loss function Hessian matrix has a severe condition number kappa = lambda_max / lambda_min, creating elongated elliptical contours that cause gradient descent to oscillate wildly; L2 regularization also penalizes weights unfairly'
      - 'Unscaled features crash the Python interpreter'
      - 'Linear models cannot multiply numbers greater than 100'
      - 'Feature scale only affects decision trees'
    answer_index: 0
    explanation: 'Disparate feature scales create steep elliptical loss surfaces where gradient steps bounce back and forth perpendicular to the shortest path, slowing convergence by orders of magnitude.'

  - question: 'What is the primary advantage of RobustScaler over StandardScaler when preprocessing real-world tabular data?'
    options:
      - 'RobustScaler centers data using the Median and scales using the Interquartile Range (IQR = Q75 - Q25), preventing extreme outliers from distorting the calculated mean and variance'
      - 'RobustScaler converts continuous features to integers'
      - 'RobustScaler uses GPU acceleration'
      - 'RobustScaler does not require calculating statistics'
    answer_index: 0
    explanation: 'StandardScaler computes the sample mean and standard deviation, which are heavily distorted by extreme outliers. RobustScaler uses rank-based median and IQR, remaining robust against extreme anomalies.'

  - question: 'When is One-Hot Encoding (OHE) appropriate, and when does it fail?'
    options:
      - 'OHE is ideal for low-cardinality nominal categories (e.g. Blood Type, Color with <= 10 levels); it fails on high-cardinality categories (e.g. ZipCode with 40,000 levels) due to the curse of dimensionality and memory exhaustion'
      - 'OHE is only for text classification'
      - 'OHE should never be used on nominal features'
      - 'OHE is mandatory for all integer columns'
    answer_index: 0
    explanation: 'One-hot encoding creates a binary column per category. When cardinality k is high, it creates massive sparse matrices, slows tree splitting, and overfits small subsets.'

  - question: 'What is the mathematical formulation of Smoothed Target Encoding with Bayesian shrinkage (Micci-Barreca, 2001)?'
    options:
      - 'S_c = (n_c * mean_c + m * global_mean) / (n_c + m), where m is the smoothing weight pulling rare categories (small n_c) towards the global dataset prior'
      - 'S_c = n_c * mean_c * global_mean'
      - 'S_c = count(c) / total_rows'
      - 'S_c = log(n_c + 1)'
    answer_index: 0
    explanation: 'Smoothed target encoding computes the weighted average between a category empirical mean and the global mean, preventing rare categories with 1 sample from generating extreme overfitted target signals.'

  - question: 'Why MUST Target Encoding be computed strictly Out-of-Fold (OOF) across cross-validation splits?'
    options:
      - 'Calculating target means on the full training dataset causes severe target leakage: the model memorizes the exact label of single-sample categories rather than learning generalizable category relationships'
      - 'OOF target encoding runs faster than in-sample encoding'
      - 'Out-of-fold encoding removes categorical columns'
      - 'OOF encoding is only required for deep neural networks'
    answer_index: 0
    explanation: 'In-sample target encoding leaks the target label into the feature value. If Category X appears once with y=1, its target encoded feature is exactly 1.0, giving the model a trivial leaky cheat code.'

  - question: 'Which family of machine learning algorithms is completely INVARIANT to monotonic feature scaling?'
    options:
      - 'Tree-based models (Decision Trees, Random Forests, XGBoost, LightGBM)'
      - 'Linear and Logistic Regression'
      - 'Support Vector Machines'
      - 'k-Nearest Neighbors'
    answer_index: 0
    explanation: 'Decision trees evaluate split thresholds based strictly on ordinal rank ordering (x_i <= theta). Multiplying a feature by 1,000,000 or taking its logarithm leaves the tree split sequence completely unchanged.'

  - question: 'When is Ordinal Encoding (mapping categories to 0, 1, 2, 3...) strictly valid?'
    options:
      - 'Only when the categorical feature has a true, natural mathematical ordering (e.g. Education Level: High School = 1, Bachelors = 2, Masters = 3, PhD = 4)'
      - 'On all categorical columns regardless of meaning'
      - 'Only for telephone numbers'
      - 'Only when the target is continuous'
    answer_index: 0
    explanation: 'Ordinal encoding imposes an artificial numerical distance (e.g. PhD is 4x High School). If applied to nominal categories like Country (USA=1, France=2, Japan=3), linear models and distance metrics will learn nonsensical linear relations.'

  - question: 'What is the purpose of the Yeo-Johnson Power Transformation?'
    options:
      - 'To transform skewed, heavy-tailed continuous distributions into approximately symmetric Gaussian normal distributions, supporting both positive and negative values'
      - 'To convert text strings into numbers'
      - 'To remove missing values'
      - 'To encode categorical variables'
    answer_index: 0
    explanation: 'The Yeo-Johnson transformation stabilizes variance and removes skewness for features with arbitrary real values (unlike Box-Cox which requires strictly positive x > 0).'
