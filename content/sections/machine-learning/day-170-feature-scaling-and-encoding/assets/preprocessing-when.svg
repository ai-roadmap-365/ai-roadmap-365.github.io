<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By model and data.">
  <title>Which preprocessing when</title>
  <style>
    .preprocessing-when-bg   { fill: #f8fafc; }
    .preprocessing-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preprocessing-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preprocessing-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preprocessing-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preprocessing-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preprocessing-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-when-row { opacity: 1; }
    .preprocessing-when-r0 { animation-delay: 0.00s; }
    .preprocessing-when-r1 { animation-delay: 0.45s; }
    .preprocessing-when-r2 { animation-delay: 0.90s; }
    .preprocessing-when-r3 { animation-delay: 1.35s; }
    .preprocessing-when-r4 { animation-delay: 1.80s; }
    .preprocessing-when-row { animation: preprocessing-when-reveal 7.3s ease-in-out infinite; }
    @keyframes preprocessing-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="preprocessing-when-bg" width="980" height="390"/>
  <text class="preprocessing-when-h1"  x="30" y="40">Which preprocessing when</text>
  <text class="preprocessing-when-sub" x="30" y="64">By model and data.</text>
  <rect class="preprocessing-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-when-name" x="46" y="122">The situation</text>
  <text class="preprocessing-when-desc" x="46" y="142">What you have.</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r0" x="46" y="182">Linear or distance-based model</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r1" x="46" y="216">Tree-based model</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r2" x="46" y="250">Heavy outliers you cannot remove</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r3" x="46" y="284">High-cardinality categories</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r4" x="46" y="318">Skewed positive quantities</text>
  <rect class="preprocessing-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="preprocessing-when-name" x="526" y="122">The preprocessing</text>
  <text class="preprocessing-when-desc" x="526" y="142">What to do.</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r0" x="526" y="182">Standardise, and one-hot encode</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r1" x="526" y="216">Leave numerics alone; ordinal or native encoding</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r2" x="526" y="250">Robust scaling, or clip first</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r3" x="526" y="284">Target encoding with cross-fold discipline, or hashing</text>
  <text class="preprocessing-when-desc preprocessing-when-row preprocessing-when-r4" x="526" y="318">Log transform before scaling</text>
  <text class="preprocessing-when-sub" x="30" y="372">Matching preprocessing to the model family rather than applying a fixed recipe is the whole lesson, and it removes most of the silent failures in this area.</text>
</svg>
