<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Target Encoding Smoothing Flow">
  <title>Out-of-Fold Target Encoding Workflow</title>
  <defs>
    <style>
      .d170f-bg { fill: #f8fafc; }
      .d170f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d170f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d170f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d170f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d170f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d170f-arr); fill: none; }
    </style>
    <marker id="d170f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d170f-bg" />

  <text x="40" y="45" class="d170f-title" font-size="22">Out-of-Fold Smoothed Target Encoding (Micci-Barreca, 2001)</text>
  <text x="40" y="70" class="d170f-text">Eliminating Target Leakage with Bayesian Shrinkage Smoothing m</text>

  <!-- Step 1: K-Fold Split -->
  <rect x="60" y="110" width="230" height="150" class="d170f-card" />
  <text x="80" y="135" class="d170f-title" fill="#1d4ed8">1. K-Fold Split</text>
  <text x="80" y="160" class="d170f-text">Partition dataset into K=5 complementary folds.</text>
  <text x="80" y="195" class="d170f-math">D = F₁ ∪ F₂ ∪ ... ∪ F₅</text>
  <text x="80" y="235" class="d170f-text">Zero target leakage anchor.</text>

  <path d="M 290 185 L 340 185" class="d170f-arrow" />

  <!-- Step 2: Training Fold Statistics -->
  <rect x="340" y="110" width="240" height="150" class="d170f-card" />
  <text x="360" y="135" class="d170f-title" fill="#b91c1c">2. Compute Fold Stats</text>
  <text x="360" y="160" class="d170f-text">On Training Split D \ F_k:</text>
  <text x="360" y="190" class="d170f-math">ȳ_global = Mean(y_train)</text>
  <text x="360" y="215" class="d170f-math">ȳ_c = Mean(y_train | c)</text>
  <text x="360" y="240" class="d170f-math">n_c = Count(c in train)</text>

  <path d="M 580 185 L 630 185" class="d170f-arrow" />

  <!-- Step 3: Bayesian Smoothing Formula -->
  <rect x="630" y="110" width="230" height="150" class="d170f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="650" y="135" class="d170f-title" fill="#15803d">3. Bayesian Shrinkage</text>
  <text x="650" y="165" class="d170f-math">S_c = n_c ȳ_c + m ȳ_glob</text>
  <text x="685" y="185" class="d170f-math">-----------------</text>
  <text x="715" y="205" class="d170f-math">n_c + m</text>
  <text x="650" y="235" class="d170f-text">m = smoothing weight (e.g. 10)</text>

  <!-- Down Arrow to Output -->
  <path d="M 745 260 L 745 320" class="d170f-arrow" />

  <!-- Bottom Panel: Result -->
  <rect x="60" y="320" width="800" height="110" class="d170f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="80" y="350" class="d170f-title" fill="#1e40af">4. Encode Validation Fold F_k</text>
  <text x="80" y="375" class="d170f-text">• Each row in validation fold F_k is mapped to S_c calculated strictly on other folds.</text>
  <text x="80" y="400" class="d170f-text">• Rare categories shrink safely to ȳ_global; high-count categories preserve pure empirical mean ȳ_c.</text>
</svg>
