visuals:
  - id: gradient-boosting-additive-flow
    file: assets/gradient-boosting-additive-flow.svg
    type: diagram
    title: 'Gradient Boosting Additive Pipeline and Pseudo-Residual Flow'
    alt: 'Architecture diagram showing sequential boosting pipeline: base prediction F0, residual calculation r1, fitting tree h1, applying shrinkage eta, and accumulating into FM.'
    description: 'A static architecture diagram illustrating the sequential additive pipeline of gradient boosting from initial baseline F0 through residual fitting and shrinkage updates.'
  - id: residual-optimization-geometry
    file: assets/residual-optimization-geometry.svg
    type: flow-animated
    title: 'Functional Gradient Descent: Optimization Trajectory in Function Space'
    alt: 'Animated chart illustrating how sequential decision trees approximate the true target function step by step along the negative gradient.'
    description: 'An animated diagnostic chart demonstrating sequential function approximation and residual convergence across boosting iterations.'
  - id: boosting-idea
    file: assets/boosting-idea.svg
    type: diagram
    title: 'Boosting in four steps'
    alt: 'Diagram: the four steps of gradient boosting'
    description: 'A four-stage description of gradient boosting covering the initial guess, the residuals, the corrective model and the accumulation.'
  - id: functional-gradient
    file: assets/functional-gradient.svg
    type: diagram
    title: 'Gradient descent in function space'
    alt: 'Diagram: how boosting performs gradient descent over functions rather than parameters'
    description: 'A four-stage description of functional gradient descent covering the parameter analogy, the function space, the gradient and the step.'
  - id: pseudo-residuals
    file: assets/pseudo-residuals.svg
    type: diagram
    title: 'Pseudo-residuals by loss'
    alt: 'Diagram: how different loss functions produce different pseudo-residuals'
    description: 'A three-stage description of pseudo-residuals covering squared error, absolute error and log loss.'
  - id: newton-leaf
    file: assets/newton-leaf.svg
    type: diagram
    title: 'Setting the leaf values'
    alt: 'Diagram: how leaf values are set using second-order information'
    description: 'A four-stage description of leaf value adjustment covering the tree structure, the first-order estimate, the second-order correction and the benefit.'
  - id: boosting-algorithm
    file: assets/boosting-algorithm.svg
    type: diagram
    title: 'The algorithm'
    alt: 'Diagram: the five steps of one gradient boosting iteration'
    description: 'A five-stage description of a boosting round covering prediction, gradients, tree fitting, leaf values and the shrunk update.'
  - id: boosting-not
    file: assets/boosting-not.svg
    type: diagram
    title: 'What gradient boosting is not'
    alt: 'Diagram: four misconceptions about gradient boosting'
    description: 'A two-column comparison of misconceptions about gradient boosting against what is true.'
  - id: boosting-history
    file: assets/boosting-history.svg
    type: diagram
    title: 'Four steps in boosting'
    alt: 'Diagram: the historical progression of boosting methods'
    description: 'A four-stage description of boosting history covering the theoretical question, the first algorithm, the gradient formulation and modern libraries.'
  - id: editing-drafts
    file: assets/editing-drafts.svg
    type: diagram
    title: 'Successive drafts'
    alt: 'Diagram: a single attempt compared with successive corrective revisions'
    description: 'A two-column comparison of one attempt against iterative correction.'
  - id: boosting-implications
    file: assets/boosting-implications.svg
    type: diagram
    title: 'Four consequences of boosting'
    alt: 'Diagram: the accuracy, tuning, training and overfitting implications of gradient boosting'
    description: 'A four-stage description of boosting implications covering accuracy, tuning burden, sequential training and overfitting risk.'
  - id: boosting-when
    file: assets/boosting-when.svg
    type: diagram
    title: 'When to use boosting'
    alt: 'Diagram: when gradient boosting is the right choice'
    description: 'A two-column comparison of situations favouring boosting against alternatives.'
  - id: learning-rate-boost
    file: assets/learning-rate-boost.svg
    type: diagram
    title: 'The learning rate in boosting'
    alt: 'Diagram: how the learning rate shapes gradient boosting'
    description: 'A four-stage description of the boosting learning rate covering the shrinkage, the tree count, generalisation and the trade.'
  - id: boosting-why
    file: assets/boosting-why.svg
    type: diagram
    title: 'What boosting solved'
    alt: 'Diagram: the four problems gradient boosting was created to solve'
    description: 'A four-stage description of the problems boosting addresses covering weak learners, bias, arbitrary losses and feature interactions.'
