terms:
  - term: 'Gradient Boosting'
    definition: 'An ensemble method that builds an additive model sequentially by training base estimators (typically shallow decision trees) on the negative gradient of a differentiable loss function.'
  - term: 'Functional Gradient Descent'
    definition: 'The optimization paradigm of taking gradient steps in the infinite-dimensional space of functions, rather than optimizing a fixed parameter vector in Euclidean space.'
  - term: 'Pseudo-Residual'
    definition: 'The negative gradient of the loss function with respect to model predictions (-dL/dF), serving as the training target for each subsequent boosting iteration.'
  - term: 'Shrinkage (Learning Rate)'
    definition: 'A regularization scaling factor eta in (0, 1] that multiplies the output of each newly added tree, controlling the step size along the functional gradient.'
  - term: 'Additive Model'
    definition: 'A model structure of the form F(x) = sum(eta * h_m(x)), where the final prediction is a linear combination of base learners.'
  - term: 'Newton-Raphson Step'
    definition: 'A second-order optimization update that divides the first derivative (gradient) by the second derivative (Hessian) to optimize leaf values for non-quadratic loss functions.'
  - term: 'Weak Learner'
    definition: 'A base model (such as a depth-3 decision tree stump) that performs only slightly better than random guessing on its own, but combines into a strong learner when boosted.'
  - term: 'Stochastic Gradient Boosting'
    definition: 'An extension where a random subsample of training instances (and/or features) is drawn without replacement at each iteration to compute pseudo-residuals.'
  - term: 'Early Stopping'
    definition: 'Halting the boosting iterations when performance on a held-out validation dataset stops improving for a specified number of rounds (patience).'
  - term: 'Deviance'
    definition: 'Twice the negative log-likelihood (log-loss), commonly used as the loss metric for binary classification gradient boosting.'
