<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of boosting</title>
  <style>
    .boosting-implications-bg   { fill: #f8fafc; }
    .boosting-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boosting-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boosting-implications-stage { opacity: 1; }

    .boosting-implications-s0 { animation-delay: 0.00s; }
    .boosting-implications-e0 { animation-delay: 0.00s; }
    .boosting-implications-s1 { animation-delay: 1.28s; }
    .boosting-implications-e1 { animation-delay: 1.28s; }
    .boosting-implications-s2 { animation-delay: 2.56s; }
    .boosting-implications-e2 { animation-delay: 2.56s; }
    .boosting-implications-s3 { animation-delay: 3.84s; }
    .boosting-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boosting-implications-conn  { animation: boosting-implications-trace 6.4s ease-in-out infinite; }
      .boosting-implications-stage { animation: boosting-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boosting-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boosting-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boosting-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boosting-implications-stage { animation: boosting-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boosting-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boosting-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boosting-implications-bg" width="980" height="322"/>
  <text class="boosting-implications-h1"  x="30" y="40">Four consequences of boosting</text>
  <text class="boosting-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="boosting-implications-stage boosting-implications-s0">
    <rect class="boosting-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-implications-step" x="44" y="142">01</text>
    <text class="boosting-implications-name" x="70" y="142">Best-in-class accuracy on tabular data</text>
    <text class="boosting-implications-desc" x="44" y="166">Consistently, across a decade of</text>
    <text class="boosting-implications-desc" x="44" y="182">comparisons.</text>
  </g>
  <line class="boosting-implications-line boosting-implications-conn boosting-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boosting-implications-tip)"/>
  <g class="boosting-implications-stage boosting-implications-s1">
    <rect class="boosting-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-implications-step" x="280" y="142">02</text>
    <text class="boosting-implications-name" x="306" y="142">But it needs real tuning</text>
    <text class="boosting-implications-desc" x="280" y="166">Learning rate, depth, rounds,</text>
    <text class="boosting-implications-desc" x="280" y="182">regularisation.</text>
  </g>
  <line class="boosting-implications-line boosting-implications-conn boosting-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boosting-implications-tip)"/>
  <g class="boosting-implications-stage boosting-implications-s2">
    <rect class="boosting-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-implications-step" x="516" y="142">03</text>
    <text class="boosting-implications-name" x="542" y="142">And training is sequential</text>
    <text class="boosting-implications-desc" x="516" y="166">Which limits how it</text>
    <text class="boosting-implications-desc" x="516" y="182">parallelises.</text>
  </g>
  <line class="boosting-implications-line boosting-implications-conn boosting-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boosting-implications-tip)"/>
  <g class="boosting-implications-stage boosting-implications-s3">
    <rect class="boosting-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-implications-step" x="752" y="142">04</text>
    <text class="boosting-implications-name" x="778" y="142">While too many rounds overfit</text>
    <text class="boosting-implications-desc" x="752" y="166">So early stopping on validation</text>
    <text class="boosting-implications-desc" x="752" y="182">is essential.</text>
  </g>
  <text class="boosting-implications-sub" x="30" y="304">Early stopping on a validation fold is not optional here: without it, the model will keep improving on training data long after it has stopped generalising.</text>
</svg>
