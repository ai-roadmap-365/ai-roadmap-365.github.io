<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each model fixes the last.">
  <title>Boosting in four steps</title>
  <style>
    .boosting-idea-bg   { fill: #f8fafc; }
    .boosting-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boosting-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boosting-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boosting-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boosting-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boosting-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boosting-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boosting-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boosting-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boosting-idea-stage { opacity: 1; }

    .boosting-idea-s0 { animation-delay: 0.00s; }
    .boosting-idea-e0 { animation-delay: 0.00s; }
    .boosting-idea-s1 { animation-delay: 1.28s; }
    .boosting-idea-e1 { animation-delay: 1.28s; }
    .boosting-idea-s2 { animation-delay: 2.56s; }
    .boosting-idea-e2 { animation-delay: 2.56s; }
    .boosting-idea-s3 { animation-delay: 3.84s; }
    .boosting-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boosting-idea-conn  { animation: boosting-idea-trace 6.4s ease-in-out infinite; }
      .boosting-idea-stage { animation: boosting-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boosting-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boosting-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boosting-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boosting-idea-stage { animation: boosting-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boosting-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boosting-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boosting-idea-bg" width="980" height="322"/>
  <text class="boosting-idea-h1"  x="30" y="40">Boosting in four steps</text>
  <text class="boosting-idea-sub" x="30" y="64">Each model fixes the last.</text>
  <g class="boosting-idea-stage boosting-idea-s0">
    <rect class="boosting-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-idea-step" x="44" y="142">01</text>
    <text class="boosting-idea-name" x="70" y="142">Start with a constant prediction</text>
    <text class="boosting-idea-desc" x="44" y="166">The mean, usually. Wrong for</text>
    <text class="boosting-idea-desc" x="44" y="182">almost everything.</text>
  </g>
  <line class="boosting-idea-line boosting-idea-conn boosting-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boosting-idea-tip)"/>
  <g class="boosting-idea-stage boosting-idea-s1">
    <rect class="boosting-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-idea-step" x="280" y="142">02</text>
    <text class="boosting-idea-name" x="306" y="142">Compute how wrong it is, per example</text>
    <text class="boosting-idea-desc" x="280" y="166">The residuals. Which are what to</text>
    <text class="boosting-idea-desc" x="280" y="182">fix.</text>
  </g>
  <line class="boosting-idea-line boosting-idea-conn boosting-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boosting-idea-tip)"/>
  <g class="boosting-idea-stage boosting-idea-s2">
    <rect class="boosting-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-idea-step" x="516" y="142">03</text>
    <text class="boosting-idea-name" x="542" y="142">Fit a small tree to predict those residuals</text>
    <text class="boosting-idea-desc" x="516" y="166">Not the target. The errors.</text>
  </g>
  <line class="boosting-idea-line boosting-idea-conn boosting-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boosting-idea-tip)"/>
  <g class="boosting-idea-stage boosting-idea-s3">
    <rect class="boosting-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boosting-idea-step" x="752" y="142">04</text>
    <text class="boosting-idea-name" x="778" y="142">Add a fraction of it, and repeat</text>
    <text class="boosting-idea-desc" x="752" y="166">Hundreds of times, each</text>
    <text class="boosting-idea-desc" x="752" y="182">correcting the last.</text>
    <text class="boosting-idea-edge" x="752" y="242">sequential</text>
  </g>
  <text class="boosting-idea-sub" x="30" y="304">Fitting the errors rather than the target is the whole idea, and it is what lets a sequence of very weak models add up to a very strong one.</text>
</svg>
