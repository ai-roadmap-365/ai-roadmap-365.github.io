<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four effects.">
  <title>The learning rate in boosting</title>
  <style>
    .learning-rate-boost-bg   { fill: #f8fafc; }
    .learning-rate-boost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rate-boost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rate-boost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rate-boost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rate-boost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learning-rate-boost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .learning-rate-boost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .learning-rate-boost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .learning-rate-boost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .learning-rate-boost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .learning-rate-boost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .learning-rate-boost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .learning-rate-boost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .learning-rate-boost-stage { opacity: 1; }

    .learning-rate-boost-s0 { animation-delay: 0.00s; }
    .learning-rate-boost-e0 { animation-delay: 0.00s; }
    .learning-rate-boost-s1 { animation-delay: 1.28s; }
    .learning-rate-boost-e1 { animation-delay: 1.28s; }
    .learning-rate-boost-s2 { animation-delay: 2.56s; }
    .learning-rate-boost-e2 { animation-delay: 2.56s; }
    .learning-rate-boost-s3 { animation-delay: 3.84s; }
    .learning-rate-boost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .learning-rate-boost-conn  { animation: learning-rate-boost-trace 6.4s ease-in-out infinite; }
      .learning-rate-boost-stage { animation: learning-rate-boost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes learning-rate-boost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes learning-rate-boost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .learning-rate-boost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .learning-rate-boost-stage { animation: learning-rate-boost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes learning-rate-boost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="learning-rate-boost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="learning-rate-boost-bg" width="980" height="322"/>
  <text class="learning-rate-boost-h1"  x="30" y="40">The learning rate in boosting</text>
  <text class="learning-rate-boost-sub" x="30" y="64">Four effects.</text>
  <g class="learning-rate-boost-stage learning-rate-boost-s0">
    <rect class="learning-rate-boost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="learning-rate-boost-step" x="44" y="142">01</text>
    <text class="learning-rate-boost-name" x="70" y="142">Each tree's contribution is multiplied down</text>
    <text class="learning-rate-boost-desc" x="44" y="166">Typically to a tenth or less.</text>
  </g>
  <line class="learning-rate-boost-line learning-rate-boost-conn learning-rate-boost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#learning-rate-boost-tip)"/>
  <g class="learning-rate-boost-stage learning-rate-boost-s1">
    <rect class="learning-rate-boost-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="learning-rate-boost-step" x="280" y="142">02</text>
    <text class="learning-rate-boost-name" x="306" y="142">So more trees are needed to fit</text>
    <text class="learning-rate-boost-desc" x="280" y="166">Roughly in inverse proportion.</text>
  </g>
  <line class="learning-rate-boost-line learning-rate-boost-conn learning-rate-boost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#learning-rate-boost-tip)"/>
  <g class="learning-rate-boost-stage learning-rate-boost-s2">
    <rect class="learning-rate-boost-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="learning-rate-boost-step" x="516" y="142">03</text>
    <text class="learning-rate-boost-name" x="542" y="142">But each correction is smaller and safer</text>
    <text class="learning-rate-boost-desc" x="516" y="166">Which generalises better.</text>
  </g>
  <line class="learning-rate-boost-line learning-rate-boost-conn learning-rate-boost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#learning-rate-boost-tip)"/>
  <g class="learning-rate-boost-stage learning-rate-boost-s3">
    <rect class="learning-rate-boost-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="learning-rate-boost-step" x="752" y="142">04</text>
    <text class="learning-rate-boost-name" x="778" y="142">So low rate plus many trees beats the reverse</text>
    <text class="learning-rate-boost-desc" x="752" y="166">At the cost of training time.</text>
  </g>
  <text class="learning-rate-boost-sub" x="30" y="304">Shrinkage is the most effective single regulariser in boosting, and it is why the recommended recipe is a small rate with early stopping rather than a tuned tree count.</text>
</svg>
