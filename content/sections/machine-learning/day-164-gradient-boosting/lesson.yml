id: D164
day: 164
slug: gradient-boosting
title: Gradient Boosting
section: machine-learning
subsection: supervised-learning
week: 24
learning_promise: >-
  Master the mathematical theory and implementation of Gradient Boosting from first principles: why boosting builds models
  sequentially rather than in parallel, how functional gradient descent treats trees as steps in function space, how to derive
  pseudo-residuals for arbitrary loss functions, why shrinkage (learning rate) prevents overfitting, and how Newton-Raphson
  leaf updates power modern tabular classifiers.
objectives:
  - 'Formulate the additive model framework F_M(x) = F_0(x) + sum eta * h_m(x)'
  - 'Explain functional gradient descent and derive pseudo-residuals as negative loss gradients'
  - 'Derive the Newton-Raphson leaf value adjustment formula for binary cross-entropy loss'
  - 'Implement complete Gradient Boosting Regressors and Classifiers from scratch in NumPy'
  - 'Analyze the role of shrinkage (learning rate eta) as a regularizer in stochastic gradient boosting'
  - 'Contrast boosting (bias reduction) with bagging (variance reduction)'
  - 'Diagnose overfitting dynamics in boosting and configure early stopping with validation loss'
  - 'Benchmark custom gradient boosting against scikit-learn GradientBoostingClassifier'
prerequisites:
  - 'Day 162 -- Decision Trees'
  - 'Day 163 -- Random Forests and Bagging'
reading_time_minutes: 50
practical_time_minutes: 60
last_verified: '2026-08-29'
tags: [machine-learning, ensemble, gradient-boosting, boosting, functional-gradient-descent, pseudo-residuals, newton-raphson, shrinkage, scikit-learn]
