sources:
  - title: 'Greedy Function Approximation: A Gradient Boosting Machine'
    url: 'https://doi.org/10.1214/aos/1013203451'
    publisher: 'The Annals of Statistics (Jerome H. Friedman)'
    accessed: '2026-08-29'
    year: 2001
    description: 'The foundational paper formulating gradient boosting as gradient descent in function space, introducing pseudo-residuals, shrinkage, and tree-specific leaf updates.'
  - title: 'Stochastic Gradient Boosting'
    url: 'https://doi.org/10.1016/S0167-9473(01)00065-2'
    publisher: 'Computational Statistics & Data Analysis (Jerome H. Friedman)'
    accessed: '2026-08-29'
    year: 2002
    description: 'Introduced subsampling rows and features at each boosting iteration to dramatically improve generalization and training speed.'
  - title: 'The Elements of Statistical Learning (Chapter 10: Boosting and Additive Trees)'
    url: 'https://hastie.su.domains/ElemStatLearn/'
    publisher: 'Springer (Hastie, Tibshirani, Friedman)'
    accessed: '2026-08-29'
    year: 2009
    description: 'Rigorous derivation of AdaBoost, Gradient Boosting, loss functions, deviance, and regularized ensemble optimization.'
