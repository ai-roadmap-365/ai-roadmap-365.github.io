questions:
  - question: 'What is the fundamental difference in training strategy between Bagging (Random Forests) and Boosting (Gradient Boosting)?'
    options:
      - 'Bagging is for classification only; Boosting is for regression only'
      - 'Bagging uses gradient descent; Boosting uses random guessing'
      - 'Bagging is parallel and cuts variance; boosting is sequential'
      - 'Bagging requires normalized features; Boosting does not'
    answer_index: 2
    explanation: 'Random Forests train diverse trees independently in parallel to lower variance. Gradient Boosting builds trees sequentially, with each new tree taking a step in function space along the negative gradient of the loss.'

  - question: 'What is a "pseudo-residual" in Gradient Boosting?'
    options:
      - 'The out-of-bag classification error'
      - 'A random number used for regularization'
      - 'The difference between feature values and their mean'
      - 'The negative gradient of the loss'
    answer_index: 3
    explanation: 'Gradient boosting performs gradient descent in function space. The negative gradient points in the direction of steepest descent, which acts as the target signal (pseudo-residual) for the next tree.'

  - question: 'For Binary Cross-Entropy loss L(y, F), what is the pseudo-residual r_i where p_i = sigmoid(F(x_i))?'
    options:
      - 'r_i = y_i - p_i'
      - 'r_i = y_i * log(p_i)'
      - 'r_i = (y_i - p_i)^2'
      - 'r_i = 1 / (1 + exp(-F_i))'
    answer_index: 0
    explanation: 'Differentiating binary cross-entropy with respect to the raw log-odds score F yields the negative gradient r_i = y_i - p_i.'

  - question: 'Why is shrinkage (learning rate eta in (0, 1]) essential in Gradient Boosting?'
    options:
      - 'It speeds up tree training time'
      - 'It scales each new tree down, so learning is slow'
      - 'It reduces the memory size of the tree'
      - 'It converts regression trees into classification trees'
    answer_index: 1
    explanation: 'Shrinkage acts as a powerful regularizer. Taking small steps along the gradient (e.g. eta = 0.05) leaves room for future trees to correct errors on diverse sub-patterns rather than memorizing early training residuals.'

  - question: 'What is the initial constant prediction F_0 for binary classification in Gradient Boosting?'
    options:
      - 'The mean target value p'
      - '0.0 for all datasets'
      - 'The log-odds of the positive class'
      - 'A randomly initialized weight matrix'
    answer_index: 2
    explanation: 'Setting F_0 to the empirical log-odds minimizes initial binary cross-entropy loss before any trees are added.'

  - question: 'Why do Gradient Boosted Trees use shallow decision trees (depth 3 to 6) as base learners, while Random Forests use deep unpruned trees?'
    options:
      - 'Shallow trees are required for GPU execution'
      - 'Shallow trees cannot compute gradients'
      - 'Deep trees cannot be trained with shrinkage'
      - 'Boosting reduces bias, so weak learners are enough'
    answer_index: 3
    explanation: 'Random Forests average deep, low-bias trees to reduce variance. Boosting uses shallow, high-bias trees and sequentially drives both bias and variance down through additive gradient steps.'

  - question: 'What happens if you train Gradient Boosting for 5,000 trees with learning rate eta = 0.3 without early stopping?'
    options:
      - 'It overfits: training loss falls while test error rises'
      - 'The model will asymptotically converge to the optimal Bayes error without overfitting'
      - 'The trees will automatically collapse to depth 1'
      - 'The learning rate will automatically decay to zero'
    answer_index: 0
    explanation: 'Unlike Random Forests, Gradient Boosting CAN overfit if too many trees are added. Monitoring validation loss with early stopping is mandatory in production.'

  - question: 'What is the purpose of Newton-Raphson leaf value adjustment in classification trees?'
    options:
      - 'To sort the feature thresholds'
      - 'It divides by the second derivative'
      - 'To convert probabilities to integers'
      - 'To calculate Out-of-Bag error'
    answer_index: 1
    explanation: 'Since log-loss is non-linear, a single second-order Newton-Raphson step gamma = -g / H = sum(r) / sum(p*(1-p)) computes the exact optimal leaf weight update.'
