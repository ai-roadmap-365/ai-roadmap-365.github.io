title: 'The Machine Learning Workflow'
section: machine-learning
subsection: core-concepts
week: 21
learning_promise: >-
  After this lesson you will treat the machine learning workflow as a set of connections rather than a
  list of stages, because you will have measured what a single wrong connection costs. You will run one
  pipeline twice on identical data, with the identical model, folds and seed, and watch it report 0.5000
  in the correct order and 0.7300 with two stages transposed -- on data whose labels are coin flips and
  which contains nothing at all to learn. You will see that no exception, no warning and no NaN
  accompanies the 0.7300, and then watch a declared stage contract turn that silent twenty-three point
  lie into a StageContractError naming the stage that broke and the key it wanted. You will measure how
  the inflation grows with the number of features selected, reaching 0.47 at fifty. You will put five
  models on an eight-percent-positive problem into one table and find that accuracy and recall ship
  different models, that a majority-class baseline scores 0.9200 with zero recall, and that the only
  model catching most of the positives loses to that constant. You will read a 0.9435-accurate model's
  confusion matrix and find it missing 83 positives while catching 77. You will prove a pipeline
  deterministic with a manifest of content hashes, and prove the manifest is not merely a constant. And
  you will measure the fitting stage at thirty percent of your own pipeline and understand why that
  figure is an upper bound rather than an estimate.
objectives:
  - 'Express a workflow as stages with declared input and output contracts, rather than as cells in whatever order they were run'
  - 'Demonstrate that transposing two stages changes the reported score, and quantify by how much on data with nothing to learn'
  - 'Explain why an honest contract declaration is the mechanism that makes a mis-ordering detectable, and state precisely what it does not protect against'
  - 'Show that the inflation from a leaky ordering grows with the number of features selected'
  - 'Choose an evaluation metric before choosing a model, and demonstrate a case where the metric inverts the decision'
  - 'Compare any reported score against a majority-class baseline, including a case where a useful model loses to a constant'
  - 'Read a confusion matrix and state what the aggregate accuracy concealed'
  - 'Prove a pipeline deterministic with a manifest of content hashes, and prove the manifest is not a constant'
  - 'Measure the relative size of the modelling stage in a real pipeline rather than repeating a folklore percentage'
  - 'Distinguish a failure that names the broken stage from one that names a missing dictionary key, and say why the difference is worth code'
  - 'Run a control through a pipeline -- data with a known answer of nothing -- as routine practice'
  - 'Identify the one-way gate in a workflow and state what crossing it twice destroys'
prerequisites:
  - 'Day 141 -- what a model score means and does not mean; this day is about the machinery that decides whether a score means anything at all'
  - 'Day 142 -- naming the setting before choosing an algorithm, which is the framing stage of this workflow'
  - 'Day 126 -- the reproducible pipeline: idempotence, determinism, contracts at both ends, a step log and a manifest of hashes, applied here to a modelling workflow'
  - 'Day 137 -- leakage as a concept; today it arrives as a property of stage ordering rather than of reasoning'
  - 'Days 117-118 -- the standard error, which is why two honest scores here land below chance and the lab asserts an inequality rather than a value'
  - 'Comfort with NumPy arrays, Python dataclasses and reading a pytest failure, and a working python3 3.11 or newer on your PATH'
