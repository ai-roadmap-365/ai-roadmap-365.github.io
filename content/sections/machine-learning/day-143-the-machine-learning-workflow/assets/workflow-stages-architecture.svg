<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="d143a-title d143a-desc" width="1040" height="700">
  <title id="d143a-title">The workflow as stages with declared contracts, looping around a one-way gate</title>
  <desc id="d143a-desc">Seven stages drawn as cards, each listing what it requires and what it produces, with a loop returning from error analysis to framing and a one-way gate guarding the test set.</desc>
  <style>
    .d143a-bg { fill: #f8fafc; }
    .d143a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d143a-stage { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d143a-gate { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 3; }
    .d143a-name { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d143a-io { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d143a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d143a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d143a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d143a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d143a-loop { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
    .d143a-note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
  </style>
  <rect class="d143a-bg" x="0" y="0" width="1040" height="700"/>
  <marker id="d143a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d143a-title" x="520" y="42" text-anchor="middle">The workflow, with the arrows made load-bearing</text>
  <text class="d143a-muted" x="520" y="68" text-anchor="middle">Each stage declares what it requires and what it produces. The runner refuses to run a stage whose inputs are absent.</text>

  <!-- row 1 -->
  <rect class="d143a-stage" x="40" y="100" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="148" y="128" text-anchor="middle">1. frame</text>
  <text class="d143a-io" x="56" y="152">requires: a decision to change</text>
  <text class="d143a-io" x="56" y="172">produces: target, metric,</text>
  <text class="d143a-io" x="56" y="190">baseline to beat</text>

  <rect class="d143a-stage" x="284" y="100" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="392" y="128" text-anchor="middle">2. load</text>
  <text class="d143a-io" x="300" y="152">requires: target</text>
  <text class="d143a-io" x="300" y="172">produces: X, y</text>
  <text class="d143a-io" x="300" y="192">and a row count you checked</text>

  <rect class="d143a-stage" x="528" y="100" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="636" y="128" text-anchor="middle">3. split</text>
  <text class="d143a-io" x="544" y="152">requires: X, y</text>
  <text class="d143a-io" x="544" y="172">produces: folds</text>
  <text class="d143a-io" x="544" y="192">this stage comes FIRST</text>

  <rect class="d143a-stage" x="772" y="100" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="880" y="128" text-anchor="middle">4. select and clean</text>
  <text class="d143a-io" x="788" y="152">requires: X, y, folds</text>
  <text class="d143a-io" x="788" y="172">produces: selected</text>
  <text class="d143a-io" x="788" y="192">per fold, never globally</text>

  <path class="d143a-wire" d="M 256 156 L 278 156" marker-end="url(#d143a-arrowhead)"/>
  <path class="d143a-wire" d="M 500 156 L 522 156" marker-end="url(#d143a-arrowhead)"/>
  <path class="d143a-wire" d="M 744 156 L 766 156" marker-end="url(#d143a-arrowhead)"/>
  <path class="d143a-wire" d="M 880 212 L 880 246 L 636 246 L 636 274" marker-end="url(#d143a-arrowhead)"/>

  <!-- row 2 -->
  <rect class="d143a-stage" x="528" y="278" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="636" y="306" text-anchor="middle">5. fit</text>
  <text class="d143a-io" x="544" y="330">requires: folds, selected</text>
  <text class="d143a-io" x="544" y="350">produces: a model</text>
  <text class="d143a-io" x="544" y="370">30 percent of this pipeline</text>

  <rect class="d143a-stage" x="284" y="278" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="392" y="306" text-anchor="middle">6. evaluate</text>
  <text class="d143a-io" x="300" y="330">requires: a model, the metric</text>
  <text class="d143a-io" x="300" y="350">produces: a score and the</text>
  <text class="d143a-io" x="300" y="370">baseline beside it</text>

  <rect class="d143a-stage" x="40" y="278" width="216" height="112" rx="8"/>
  <text class="d143a-name" x="148" y="306" text-anchor="middle">7. error analysis</text>
  <text class="d143a-io" x="56" y="330">requires: a score</text>
  <text class="d143a-io" x="56" y="350">produces: which cases fail</text>
  <text class="d143a-io" x="56" y="370">and what to change next</text>

  <path class="d143a-wire" d="M 528 334 L 506 334" marker-end="url(#d143a-arrowhead)"/>
  <path class="d143a-wire" d="M 284 334 L 262 334" marker-end="url(#d143a-arrowhead)"/>

  <!-- the loop -->
  <path class="d143a-loop" d="M 148 278 L 148 250 L 20 250 L 20 84 L 148 84 L 148 96" marker-end="url(#d143a-arrowhead)"/>
  <text class="d143a-muted" x="30" y="238">the loop: stages 1 to 7 run again and again</text>

  <!-- the gate -->
  <rect class="d143a-gate" x="40" y="420" width="948" height="96" rx="10"/>
  <text class="d143a-strong" x="514" y="452" text-anchor="middle">The one-way gate: the test set</text>
  <text class="d143a-label" x="514" y="478" text-anchor="middle">Everything above this line loops. The test set is crossed once, at the end, after the looping has stopped.</text>
  <text class="d143a-muted" x="514" y="502" text-anchor="middle">Cross it twice and it stops being a test set and becomes another validation set. Day 144 measures what that costs.</text>
  <path class="d143a-wire" d="M 148 390 L 148 414" marker-end="url(#d143a-arrowhead)"/>

  <!-- the measured note -->
  <rect class="d143a-note" x="40" y="540" width="948" height="132" rx="10"/>
  <text class="d143a-strong" x="514" y="572" text-anchor="middle">Why stage 3 comes before stage 4, measured</text>
  <text class="d143a-label" x="70" y="600">Run in the order drawn, on 100 rows of 5000 pure-noise features whose labels are coin flips:</text>
  <text class="d143a-label" x="70" y="624">split then select — 0.50, which is chance, which is correct.</text>
  <text class="d143a-label" x="70" y="646">select then split — 0.73, with no warning of any kind. Twenty-three points of accuracy, invented by a transposition.</text>
  <text class="d143a-muted" x="70" y="666">With the contracts above enforced, the second ordering does not produce a number at all: it names the stage that broke.</text>
</svg>
