<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="d143f-title d143f-desc" width="1040" height="660">
  <title id="d143f-title">The same five stages in two orders, and the twenty-three points between them</title>
  <desc id="d143f-desc">Two parallel tracks of five stages each, sharing the same data and the same model. A token travels along each track in turn. The upper track splits before selecting and arrives at 0.50; the lower track selects before splitting and arrives at 0.73, or at a contract error when contracts are enforced.</desc>
  <style>
    .d143f-bg { fill: #f8fafc; }
    .d143f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; }
    .d143f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; }
    .d143f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d143f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d143f-stagetext { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d143f-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d143f-swapped { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
    .d143f-wire { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
    .d143f-result { fill: #ffffff; stroke: #1d4ed8; stroke-width: 3; }
    .d143f-score { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
    .d143f-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d143f-tokenA {
      fill: #1d4ed8;
      animation: d143f-runA 8s ease-in-out infinite;
    }
    .d143f-tokenB {
      fill: #1d4ed8;
      animation: d143f-runB 8s ease-in-out infinite;
    }
    @keyframes d143f-runA {
      0%   { transform: translateX(0px);   opacity: 1; }
      40%  { transform: translateX(700px); opacity: 1; }
      50%  { transform: translateX(700px); opacity: 1; }
      100% { transform: translateX(700px); opacity: 1; }
    }
    @keyframes d143f-runB {
      0%   { transform: translateX(0px);   opacity: 1; }
      50%  { transform: translateX(0px);   opacity: 1; }
      90%  { transform: translateX(700px); opacity: 1; }
      100% { transform: translateX(700px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d143f-tokenA { animation: none; transform: translateX(700px); opacity: 1; }
      .d143f-tokenB { animation: none; transform: translateX(700px); opacity: 1; }
    }
  </style>
  <rect class="d143f-bg" x="0" y="0" width="1040" height="660"/>

  <text class="d143f-title" x="520" y="40" text-anchor="middle">Two orderings, one transposition, twenty-three points</text>
  <text class="d143f-muted" x="520" y="66" text-anchor="middle">Same data, same model, same folds, same seed. 100 rows of 5000 pure-noise features; the labels are coin flips.</text>

  <!-- track A -->
  <text class="d143f-head" x="40" y="112">correct order</text>
  <rect class="d143f-box"     x="40"  y="126" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="101" y="161" text-anchor="middle">load</text>
  <rect class="d143f-swapped" x="182" y="126" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="243" y="161" text-anchor="middle">split</text>
  <rect class="d143f-swapped" x="324" y="126" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="385" y="161" text-anchor="middle">select</text>
  <rect class="d143f-box"     x="466" y="126" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="527" y="161" text-anchor="middle">fit</text>
  <rect class="d143f-box"     x="608" y="126" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="669" y="161" text-anchor="middle">baseline</text>
  <path class="d143f-wire" d="M 162 155 L 182 155"/>
  <path class="d143f-wire" d="M 304 155 L 324 155"/>
  <path class="d143f-wire" d="M 446 155 L 466 155"/>
  <path class="d143f-wire" d="M 588 155 L 608 155"/>
  <path class="d143f-wire" d="M 730 155 L 780 155"/>
  <circle class="d143f-tokenA" cx="80" cy="200" r="10"/>
  <rect class="d143f-result" x="784" y="118" width="216" height="74" rx="8"/>
  <text class="d143f-score" x="892" y="152" text-anchor="middle">0.50</text>
  <text class="d143f-muted" x="892" y="176" text-anchor="middle">chance, which is correct</text>

  <!-- track B -->
  <text class="d143f-head" x="40" y="300">wrong order, contracts off</text>
  <rect class="d143f-box"     x="40"  y="314" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="101" y="349" text-anchor="middle">load</text>
  <rect class="d143f-swapped" x="182" y="314" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="243" y="349" text-anchor="middle">select</text>
  <rect class="d143f-swapped" x="324" y="314" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="385" y="349" text-anchor="middle">split</text>
  <rect class="d143f-box"     x="466" y="314" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="527" y="349" text-anchor="middle">fit</text>
  <rect class="d143f-box"     x="608" y="314" width="122" height="58" rx="7"/>
  <text class="d143f-stagetext" x="669" y="349" text-anchor="middle">baseline</text>
  <path class="d143f-wire" d="M 162 343 L 182 343"/>
  <path class="d143f-wire" d="M 304 343 L 324 343"/>
  <path class="d143f-wire" d="M 446 343 L 466 343"/>
  <path class="d143f-wire" d="M 588 343 L 608 343"/>
  <path class="d143f-wire" d="M 730 343 L 780 343"/>
  <circle class="d143f-tokenB" cx="80" cy="388" r="10"/>
  <rect class="d143f-result" x="784" y="306" width="216" height="74" rx="8"/>
  <text class="d143f-score" x="892" y="340" text-anchor="middle">0.73</text>
  <text class="d143f-muted" x="892" y="364" text-anchor="middle">invented, and silent</text>

  <text class="d143f-muted" x="40" y="230">the two shaded stages are the only difference between the tracks</text>
  <text class="d143f-muted" x="40" y="418">no exception, no warning, no NaN — a number simply comes out and it looks like a result</text>

  <!-- contracts on -->
  <rect class="d143f-note" x="40" y="452" width="960" height="80" rx="10"/>
  <text class="d143f-head" x="60" y="482">wrong order, contracts enforced</text>
  <text class="d143f-label" x="60" y="512">StageContractError: stage 'select' requires 'folds' which no earlier stage produced</text>

  <rect class="d143f-note" x="40" y="548" width="960" height="92" rx="10"/>
  <text class="d143f-label" x="520" y="578" text-anchor="middle">The select stage declares that it needs the folds, because it genuinely does: choosing features is a per-fold operation.</text>
  <text class="d143f-label" x="520" y="602" text-anchor="middle">Declaring that honestly is the whole mechanism. A team that writes the requirement as X and y alone has not hit a subtle bug —</text>
  <text class="d143f-label" x="520" y="626" text-anchor="middle">they have written down a claim that is false, and every checking tool they own is downstream of it.</text>
</svg>
