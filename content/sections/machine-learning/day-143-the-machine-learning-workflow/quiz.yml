questions:
  - question: >-
      Two pipelines share their data, their model, their folds and their seed. One runs `select`
      before `split` and reports 0.73; the other runs `split` before `select` and reports 0.50. The
      labels are coin flips. What produced the 0.23?
    options:
      - 'The leaky pipeline reuses one global feature selection across folds, so the folds are no longer independent of each other'
      - 'Every fold''s test rows helped choose the features, so the features were fitted to the answers before the answers were hidden'
      - 'The 1-NN model memorises its training rows, and the wrong ordering gives it more of them'
      - 'Five-fold cross-validation is biased on small samples, and the leaky pipeline happens to expose that bias'
    answer_index: 1
    explanation: >-
      With 5000 noise columns and 100 rows, some columns will correlate with the labels by pure
      chance. Choosing the top twenty using every row means the test rows of every fold voted on
      which columns to look at, so the model does legitimately well on them. Note what is NOT wrong:
      the model never sees a test label during fitting, the folds are disjoint and correct, and the
      cross-validation loop is textbook. Every individual piece is right and the composition is
      wrong, which is exactly why reviewing the model code line by line never finds it.
  - question: >-
      In the leaky pipeline, the `select` stage still declares `folds` among its requirements. Why
      does that matter?
    options:
      - 'It does not really matter; the runner could infer the dependency from which keys the stage function reads'
      - 'It documents the stage for future readers, which is good practice but not load-bearing'
      - 'It is what lets the runner notice the stage was placed too early -- the declaration is true, and checking a true declaration against the keys present is the whole mechanism'
      - 'It makes the stage fail faster, which reduces wasted compute on large datasets'
    answer_index: 2
    explanation: >-
      Choosing features genuinely is a per-fold operation, so `folds` genuinely is a requirement.
      Stating it honestly is what turns an implicit ordering into a checkable claim. Inferring
      dependencies from what the function reads is not equivalent -- the leaky stage reads only X and
      y, so inference would conclude, correctly and uselessly, that it can run first. And note the
      limitation this implies: a team that writes `requires=("X", "y")` defeats the check entirely.
      The contract does not make wrong claims impossible; it makes them visible.
  - question: >-
      A model scores 0.9435 accuracy on a problem where 8 percent of rows are positive. The
      majority-class baseline scores 0.9200. What have you learned?
    options:
      - 'That the model is 94 percent accurate, which is a strong result on an imbalanced problem'
      - 'That the model has learned nothing, since 0.9435 is close to the base rate'
      - 'That the model is well calibrated, since its accuracy tracks the class distribution'
      - 'That the model adds 2.35 points over a constant -- and nothing yet about whether those points are the ones anybody wanted'
    answer_index: 3
    explanation: >-
      The baseline turns an impressive-looking 0.9435 into a modest 2.35-point improvement that now
      has to justify the cost of building and maintaining a model. But the gap is only half the
      story: this same model catches 77 of 160 positives and misses 83. Concluding it has learned
      nothing is too strong -- 0.7196 precision is real -- and calibration is a different property
      entirely, about predicted probabilities rather than accuracy. The honest summary is "2.35
      points, on a metric that may be the wrong one".
  - question: >-
      When would you ship a model with lower accuracy than a majority-class baseline?
    options:
      - 'When recall is what the decision needs -- the balanced logistic model scores 0.8685 accuracy against the constant''s 0.9200, and catches 84 percent of positives against the constant''s zero'
      - 'Never; accuracy below a constant means the model is worse than doing nothing'
      - 'When the training accuracy is higher, indicating the model has capacity the test set cannot show'
      - 'When the dataset is imbalanced, because accuracy is undefined on imbalanced data'
    answer_index: 0
    explanation: >-
      The constant scores 0.92 by never predicting a positive, so it catches none of the thing the
      system exists to catch. If the intervention is cheap -- an email, a flag for review -- 0.8438
      recall at 0.3619 precision is straightforwardly more valuable than 0.92 accuracy at zero
      recall. Accuracy is perfectly well defined on imbalanced data; it is just answering a question
      nobody asked. And training accuracy is never the argument, which Day 141 measured at length.
  - question: >-
      Your pipeline's manifest of content hashes is identical on every run. What does that establish?
    options:
      - 'That the pipeline is deterministic, which is the property you wanted'
      - 'Either that the pipeline is deterministic, or that you are hashing something that never varies -- and only changing an input can tell you which'
      - 'That the pipeline is correct, since a correct pipeline produces stable output'
      - 'That the random seed is being applied, since an unseeded pipeline would produce different hashes'
    answer_index: 1
    explanation: >-
      This is the control that gets left out. A manifest that always matches might be proving
      determinism or might be proving that the thing you hashed is a constant -- a typo in the key
      name, a stage that silently returns the same empty array, a hash taken before the varying step.
      The lab therefore asserts both directions: two runs at seed 143 agree AND a run at seed 144
      differs. Determinism says nothing about correctness; a reliably wrong pipeline is reliably
      wrong.
  - question: >-
      Why does the stage runner check a stage's declared requirements *before* running it, rather
      than letting the stage fail and catching the exception?
    options:
      - 'Because exceptions are slow in Python, and the check runs on every stage of every execution'
      - 'Because catching exceptions would swallow genuine errors from inside the stage as well'
      - 'A stage that half-runs and then fails leaves a partially-mutated state to reason about; checking first means a stage either runs completely or never starts'
      - 'Because the exception type varies by stage, so there is nothing reliable to catch'
    answer_index: 2
    explanation: >-
      The atomicity is the point. It also produces a categorically better error: `StageContractError:
      stage 'load' requires ['n_samples', ...]` names the stage and what it wanted, while the
      uncaught version gives you `KeyError: 'n_samples'` from somewhere inside a function you now
      have to find. In a thirty-stage pipeline that difference is most of an afternoon. Exception
      cost is irrelevant at this scale, and conflating genuine stage errors with contract violations
      is a real concern but a consequence of the design rather than its motivation.
  - question: >-
      This lesson measured its fitting stage at 30 percent of the pipeline and called that an upper
      bound rather than an estimate. Why "upper"?
    options:
      - 'Because line counts overstate the size of the fitting stage, which is denser than the others'
      - 'Because a larger dataset would need more loading code, lowering the fraction'
      - 'Because 30 percent is above the commonly quoted figure, so the true value must be lower'
      - 'Because this pipeline has no cleaning, monitoring, deployment, schema-validation or drift-detection stage, and every one of those would be added to the denominator'
    answer_index: 3
    explanation: >-
      The measurement is of a deliberately minimal pipeline, so every stage a real project would add
      makes the modelling fraction smaller and none makes it larger. That is what licenses the word
      "upper". The lesson measures its own pipeline rather than quoting the familiar percentage
      precisely because the familiar percentages disagree with each other and none could be verified
      here -- a direction that is defensible beats a number that is not.
  - question: >-
      Two of the honest cross-validation scores in the lab's inflation table are below 0.5, at 0.39
      and 0.38. What is the right response?
    options:
      - 'None -- with 20 test rows per fold the standard error is near 0.11, so an estimate of a 0.5 quantity wanders below as readily as above'
      - 'Investigate: scoring below chance means the model has learned an inverted signal'
      - 'Increase the number of folds until the honest score converges to exactly 0.5'
      - 'Discard those rows of the table, since a below-chance score cannot be reported'
    answer_index: 0
    explanation: >-
      This is Day 117's arithmetic arriving where it matters. An inverted signal is impossible here
      by construction -- the labels were never generated from the features, so there is nothing to
      invert. Raising the fold count trades test-set size for training-set size and does not remove
      the variance. And discarding the inconvenient rows is the forking-paths problem in miniature.
      The lab's response is the honest one: assert that the honest score is at or below chance, which
      is the claim the evidence supports, rather than that it equals 0.5, which it does not.
