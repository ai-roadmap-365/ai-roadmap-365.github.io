terms:
  - term: Stage
    definition: >-
      One step of a workflow together with the declaration of what it requires and what it produces.
      The declaration is the part that matters: without it a stage is just a function, and the order
      it must run in exists only in somebody's memory.
  - term: Stage contract
    definition: >-
      The pair of key lists a stage declares. The runner checks required keys are present before
      running and that produced keys match afterwards, so a mis-ordered pipeline raises a named error
      instead of returning a number. It cannot protect against a declaration that is false.
  - term: Artifact
    definition: >-
      Everything the pipeline knows so far, plus how it came to know it. Extended by returning a new
      copy rather than by mutation, because a stage that mutates its input makes the step log a work
      of fiction describing states that no longer exist.
  - term: Step log
    definition: >-
      The ordered record of which stage produced which keys. It records what happened rather than
      what was intended, which is why it is evidence rather than documentation.
  - term: Manifest
    definition: >-
      A set of content hashes over the pipeline's inputs and outputs, letting two runs be compared
      exactly. The same primitive as a package lock file or a container digest, answering the same
      question: is what I have now the thing I checked before?
  - term: Content hash
    definition: >-
      A cryptographic digest of an object's exact bytes -- here including the array's dtype, so that
      the same numbers stored as int64 and float64 hash differently, on purpose. Silently equal
      hashes are worse than no hashes.
  - term: Selection bias
    definition: >-
      The optimism introduced by choosing features, models or thresholds using data that is later
      used to evaluate them. Measured here at 0.23 accuracy points at twenty features and 0.47 at
      fifty, on data containing nothing to learn.
  - term: Stage ordering
    definition: >-
      Which stage runs before which. The subject of this lesson, because leakage is usually not a
      mistake in reasoning but a mistake in ordering -- and ordering is exactly what a notebook does
      not enforce.
  - term: The one-way gate
    definition: >-
      The test set. Everything before it loops; it is crossed once, at the end, after the looping has
      stopped. Cross it twice and it becomes another validation set and stops estimating anything.
  - term: Framing stage
    definition: >-
      The stage that produces the target, the metric and the baseline to beat, before any model
      exists. The only stage whose omission has no error message, which is why it is the one most
      often skipped.
  - term: Baseline
    definition: >-
      The score of the simplest thing that could work -- here a model always predicting the majority
      class, scoring 0.9200 with zero recall. Without it, 0.9435 reads as excellent; with it, as 2.35
      points that must justify a model's maintenance cost.
  - term: Metric selection
    definition: >-
      Choosing what a score measures, which determines which model you ship. Not a reporting decision
      made at the end: on this lesson's table, accuracy and recall pick different winners with
      nothing else changing.
  - term: Confusion matrix
    definition: >-
      The four counts of true and false, positive and negative. On the 0.9435-accurate model here it
      reads 1810, 30, 83, 77 -- so the model misses more positives than it catches, which one
      aggregate number could never have told you.
  - term: Error analysis
    definition: >-
      The stage that asks which cases fail and why, rather than how many. It is what decides what the
      next loop is for, and the aggregate score distinguishes none of the possible answers.
  - term: Control
    definition: >-
      Data with a known answer, put through the pipeline to check the pipeline. Today's noise dataset
      is one: a pipeline reporting better than chance on it is known to be broken without any
      argument about the real data. Standard in a laboratory, rare in machine learning, four lines to
      add.
  - term: Determinism
    definition: >-
      The property that identical inputs give identical outputs. Proved by a manifest matching across
      runs -- and only meaningful when accompanied by the control that a changed input produces a
      changed manifest.
  - term: Training-serving skew
    definition: >-
      When a feature is computed one way during training and another way at prediction time. The same
      ordering bug in a different costume: silent, inflates the offline number, and found only when
      live performance disappoints.
  - term: CRISP-DM
    definition: >-
      The Cross-Industry Standard Process for Data Mining, published in 1999: six phases drawn as a
      circle because the process was always understood as a loop. Its lasting contribution is
      insisting the business problem is understood before the data, and the data before the model.
  - term: sklearn Pipeline
    definition: >-
      scikit-learn's object composing preprocessing steps with a model so that every fit happens
      inside the cross-validation fold. It makes today's leak structurally impossible rather than
      merely unlikely -- but only for the steps placed inside it.
  - term: Iteration budget
    definition: >-
      How many times you may traverse the loop before the loop itself starts fitting your judgement
      to the validation data. Bounded by deciding what to try before trying it, and by counting the
      traversals.
