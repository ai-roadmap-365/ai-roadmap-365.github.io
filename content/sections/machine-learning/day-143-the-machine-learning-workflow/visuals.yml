visuals:
  - id: workflow-stages-architecture
    file: assets/workflow-stages-architecture.svg
    type: diagram
    title: >-
      The machine learning workflow drawn as seven stages with declared input and output
      contracts, looping around the one-way gate of the test set
    alt: >-
      Diagram: seven stages drawn as cards, each listing what it requires and what it produces. Frame
      requires a decision to change and produces the target, the metric and a baseline to beat. Load
      produces X and y. Split requires X and y and produces folds, and is marked as coming first.
      Select and clean requires X, y and folds and produces a per-fold selection, never a global one.
      Fit requires folds and the selection and is annotated as 30 percent of this pipeline. Evaluate
      produces a score with the baseline beside it. Error analysis produces which cases fail and what
      to change next, and a dashed loop returns from it to framing. Below all seven, a wide panel
      marks the test set as a one-way gate that everything above loops around and that is crossed once
      at the end. A final panel records the measurement: run in the drawn order the pipeline scores
      0.50 on pure noise, which is chance and correct, while selecting before splitting scores 0.73
      with no warning of any kind
    description: >-
      A static architecture diagram in three bands. The upper band is the loop: seven stage cards,
      four across the top and three returning along the second row, each printing its own name, the
      keys it requires and the keys it produces. Frame requires a decision to change and produces a
      target, a metric and a baseline to beat. Load requires the target and produces X, y and a row
      count you checked. Split requires X and y, produces folds, and carries the annotation that
      this stage comes first. Select and clean requires X, y and folds, produces a selection, and is
      annotated per fold, never globally. Fit requires the folds and the selection, produces a
      model, and is annotated as 30 percent of this pipeline. Evaluate requires a model and the
      metric and produces a score with the baseline beside it. Error analysis requires a score and
      produces which cases fail and what to change next. A dashed arrow returns from error analysis
      around the outside back to framing, labelled as the loop that runs again and again. The middle
      band is a heavily-outlined panel marking the test set as a one-way gate: everything above it
      loops, it is crossed once at the end after the looping has stopped, and crossing it twice turns
      it into another validation set, with a forward reference to Day 144 measuring the cost. The
      lower band records the measurement that justifies the ordering: run in the order drawn, on 100
      rows of 5000 pure-noise features whose labels are coin flips, split-then-select scores 0.50,
      which is chance and correct, while select-then-split scores 0.73 with no warning of any kind --
      twenty-three points of accuracy invented by a transposition -- and with the declared contracts
      enforced the second ordering produces no number at all, naming the stage that broke instead.
  - id: two-orderings-flow
    file: assets/two-orderings-flow.svg
    type: flow-animated
    title: >-
      The same five stages run in two orders, with a token travelling each track in turn and the
      twenty-three invented accuracy points between the two results
    alt: >-
      Diagram: two parallel tracks of five stages each, sharing the same data and the same model, with
      a token travelling each track in turn. The upper track, headed correct order, runs load, split,
      select, fit, baseline and arrives at a result panel reading 0.50 with the note chance, which is
      correct. The lower track, headed wrong order with contracts off, runs load, select, split, fit,
      baseline and arrives at 0.73 with the note invented, and silent. The split and select boxes are
      shaded on both tracks as the only difference between them. Below, a panel records that with
      contracts enforced the same wrong ordering raises StageContractError naming stage select and the
      missing key folds, and a final panel explains that the select stage declares it needs the folds
      because it genuinely does, that declaring it honestly is the whole mechanism, and that a team
      writing the requirement as X and y alone has not hit a subtle bug but written down a claim that
      is false
    description: >-
      An animated flow diagram comparing two runs of one pipeline. Two horizontal tracks each carry
      five stage boxes and end in an outlined result panel. The upper track is headed "correct
      order" and runs load, split, select, fit, baseline, arriving at a large 0.50 annotated "chance,
      which is correct". The lower track is headed "wrong order, contracts off" and runs load,
      select, split, fit, baseline, arriving at a large 0.73 annotated "invented, and silent". On
      both tracks the split and select boxes are shaded and outlined in the accent colour, because
      they are the only difference between the two runs -- the data, the model, the folds and the
      seed are identical. A round token travels the upper track over the first 40 percent of an
      8-second loop and the lower track over the second half, so the two runs are seen in sequence
      rather than at once; each token rests at the end of its track. Between the tracks a caption
      notes that no exception, no warning and no NaN is produced -- a number simply comes out and it
      looks like a result. Below the tracks, a highlighted panel headed "wrong order, contracts
      enforced" prints the actual error text: StageContractError, stage 'select' requires 'folds'
      which no earlier stage produced. A final panel explains the mechanism: the select stage
      declares that it needs the folds because it genuinely does, since choosing features is a
      per-fold operation; declaring that honestly is the whole mechanism; and a team that writes the
      requirement as X and y alone has not hit a subtle bug but has written down a claim that is
      false, with every checking tool they own downstream of it. A prefers-reduced-motion block
      stops both tokens and rests them at the end of their tracks, so the still frame carries both
      orderings, both scores, the error text and every conclusion.
