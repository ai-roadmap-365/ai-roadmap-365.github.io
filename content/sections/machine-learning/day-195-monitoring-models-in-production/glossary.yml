terms:
  - term: 'Model Observability'
    definition: 'The capability to infer the internal health, accuracy, and data consistency of production ML systems from external telemetry metrics.'
  - term: 'Data Drift (Covariate Shift)'
    definition: 'A change in the statistical distribution of input features P(X) while the conditional target mapping P(Y|X) remains stationary.'
  - term: 'Concept Drift'
    definition: 'A change in the underlying physical or behavioral relationship P(Y|X) between input features and target outcomes.'
  - term: 'Population Stability Index (PSI)'
    definition: 'A metric measuring the degree of divergence between two probability distributions, based on symmetric Kullback-Leibler divergence.'
  - term: 'Kolmogorov-Smirnov (KS) Test'
    definition: 'A non-parametric statistical test comparing the continuous empirical cumulative distributions of two independent samples.'
  - term: 'Prediction Drift'
    definition: 'A shift in the distribution of model output probabilities or predicted class labels over time.'
  - term: 'Feedback Delay'
    definition: 'The time lag between when a model prediction is emitted and when the true ground-truth outcome is recorded.'
  - term: 'Golden Signals'
    definition: 'The four core SRE monitoring dimensions: Latency, Traffic (QPS), Errors, and Resource Saturation.'
