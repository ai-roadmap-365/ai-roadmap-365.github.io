visuals:
  - id: population-stability-index-workflow
    file: assets/population-stability-index-workflow.svg
    type: diagram
    title: Population Stability Index (PSI) Drift Calculation
    alt: Population Stability Index calculation workflow showing reference baseline vs current inference bin frequency comparisons and drift thresholds
    description: Statistical distribution comparison diagram detailing reference training bins, live production observations, and PSI threshold classification rules.
  - id: production-ml-observability-pillars
    file: assets/production-ml-observability-pillars.svg
    type: diagram
    title: Production ML Observability Dashboard
    alt: Observability telemetry dashboard layout displaying four monitoring pillars service latency prediction drift error rate and resource saturation
    description: Four-quadrant production telemetry architecture covering operational SLAs, input data drift, prediction concept drift, and service error rates.
  - id: drift-taxonomy
    file: assets/drift-taxonomy.svg
    type: diagram
    title: 'Three kinds of drift'
    alt: 'Diagram: three types of production drift and the response to each'
    description: 'A two-column comparison of drift types against the response each requires.'
  - id: psi
    file: assets/psi.svg
    type: diagram
    title: 'The stability index'
    alt: 'Diagram: how the population stability index measures distribution shift'
    description: 'A four-stage description of the stability index covering binning, proportion comparison, the sum and the thresholds.'
  - id: ks-test
    file: assets/ks-test.svg
    type: diagram
    title: 'The distribution test'
    alt: 'Diagram: how a distribution test detects drift in a continuous feature'
    description: 'A four-stage description of the distribution test covering the cumulative distributions, the maximum gap, significance and the sample-size caveat.'
  - id: drift-metrics
    file: assets/drift-metrics.svg
    type: diagram
    title: 'Three ways to measure a shift'
    alt: 'Diagram: three distance metrics for measuring distribution drift'
    description: 'A two-column comparison of drift distance metrics against their characteristics.'
  - id: observability-pillars
    file: assets/observability-pillars.svg
    type: diagram
    title: 'Four things to monitor'
    alt: 'Diagram: the four monitoring pillars of a production model'
    description: 'A four-stage description of model observability covering service health, input drift, prediction drift and outcome quality.'
  - id: monitoring-idea
    file: assets/monitoring-idea.svg
    type: diagram
    title: 'Why models decay'
    alt: 'Diagram: the four reasons a deployed model degrades over time'
    description: 'A four-stage description of model decay covering population change, behaviour change, upstream change and feedback.'
  - id: monitoring-not
    file: assets/monitoring-not.svg
    type: diagram
    title: 'What monitoring is not'
    alt: 'Diagram: four misconceptions about model monitoring'
    description: 'A two-column comparison of misconceptions about monitoring against what is true.'
  - id: monitoring-history
    file: assets/monitoring-history.svg
    type: diagram
    title: 'Four steps in model monitoring'
    alt: 'Diagram: the historical progression of model monitoring practice'
    description: 'A four-stage description of monitoring history covering none, service metrics, drift detection and full observability.'
  - id: instrument-panel
    file: assets/instrument-panel.svg
    type: diagram
    title: 'Instruments, or a warning light'
    alt: 'Diagram: a single warning light compared with a full instrument panel'
    description: 'A two-column comparison of a single failure alert against continuous instrumentation.'
  - id: monitoring-implications
    file: assets/monitoring-implications.svg
    type: diagram
    title: 'Four consequences of monitoring'
    alt: 'Diagram: the detection, cost, privacy and response implications of model monitoring'
    description: 'A four-stage description of monitoring implications covering early detection, storage cost, logged personal data and response ownership.'
  - id: monitoring-when
    file: assets/monitoring-when.svg
    type: diagram
    title: 'What to monitor when'
    alt: 'Diagram: choosing what to monitor by what signals are available'
    description: 'A two-column comparison of situations against the monitoring that applies.'
