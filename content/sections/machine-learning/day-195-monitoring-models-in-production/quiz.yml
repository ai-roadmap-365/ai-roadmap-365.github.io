questions:
  - question: 'What is the fundamental mathematical distinction between Covariate/Data Drift and Concept Drift?'
    options:
      - 'Data Drift is a shift in input feature distributions P(X) while relationship P(Y|X) remains unchanged; Concept Drift is a change in the true causal relationship P(Y|X) itself'
      - 'Data Drift only occurs in neural networks; Concept Drift only occurs in decision trees'
      - 'Data Drift means the server ran out of disk space; Concept Drift means the Python version was upgraded'
      - 'There is no difference between Data Drift and Concept Drift'
    answer_index: 0
    explanation: 'Data drift means inputs change (e.g. users become wealthier), while concept drift means the underlying physical relationship changes (e.g. macroeconomic recession alters default risk for all incomes).'
  - question: 'What does a Population Stability Index score of PSI = 0.24 between training and live inference data indicate?'
    options:
      - 'Significant distribution shift: the feature has drifted substantially and requires urgent model retraining or feature investigation'
      - 'Zero drift: the model is perfectly calibrated'
      - 'That 24% of requests resulted in HTTP 500 errors'
      - 'That the model accuracy increased by 24%'
    answer_index: 0
    explanation: 'Industry standard PSI benchmarks: PSI < 0.10 is stable, 0.10 <= PSI < 0.20 represents moderate shift, and PSI >= 0.20 signifies severe distribution drift.'
  - question: 'Why is Ground Truth Label Feedback Delay a major challenge when monitoring production machine learning systems?'
    options:
      - 'In many real-world domains (e.g. loan defaults, fraud, 30-day churn), the true target label Y is not known for weeks or months after the prediction is served'
      - 'PostgreSQL databases cannot store dates'
      - 'Labels can only be downloaded once per year'
      - 'FastAPI blocks label logging'
    answer_index: 0
    explanation: 'Because ground truth labels arrive with significant latency, production monitors must rely on proxy signals: input data drift (PSI) and prediction probability distribution drift.'
  - question: 'What does the Two-Sample Kolmogorov-Smirnov (KS) Test measure when comparing reference and production feature arrays?'
    options:
      - 'The maximum vertical distance (D-statistic) between the empirical cumulative distribution functions (eCDFs) of the two datasets'
      - 'The difference between the two maximum values'
      - 'The ratio of standard deviations'
      - 'The correlation between feature column names'
    answer_index: 0
    explanation: 'The KS-test compares empirical CDFs: D = sup_x |F_1(x) - F_2(x)|. A p-value < 0.05 rejects the null hypothesis that the two samples originate from the same continuous distribution.'
  - question: 'Why is monitoring Prediction Distribution Drift (P(Y_hat)) an effective early warning proxy for model degradation?'
    options:
      - 'If the model output distribution suddenly shifts from 10% positive to 40% positive, it indicates underlying data distribution shifts even before ground-truth labels arrive'
      - 'Prediction drift automatically fixes model weights'
      - 'Prediction drift proves that server memory is corrupted'
      - 'It eliminates the need for Prometheus metrics'
    answer_index: 0
    explanation: 'Monitoring model output scores is instant and requires zero ground-truth labels, immediately catching upstream data pipeline corruptions or macroeconomic shocks.'
