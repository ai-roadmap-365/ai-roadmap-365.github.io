<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What monitoring is not</title>
  <style>
    .monitoring-not-bg   { fill: #f8fafc; }
    .monitoring-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .monitoring-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .monitoring-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .monitoring-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .monitoring-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .monitoring-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .monitoring-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .monitoring-not-row { opacity: 1; }
    .monitoring-not-r0 { animation-delay: 0.00s; }
    .monitoring-not-r1 { animation-delay: 0.45s; }
    .monitoring-not-r2 { animation-delay: 0.90s; }
    .monitoring-not-r3 { animation-delay: 1.35s; }
    .monitoring-not-r4 { animation-delay: 1.80s; }
    .monitoring-not-row { animation: monitoring-not-reveal 7.3s ease-in-out infinite; }
    @keyframes monitoring-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="monitoring-not-bg" width="980" height="390"/>
  <text class="monitoring-not-h1"  x="30" y="40">What monitoring is not</text>
  <text class="monitoring-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="monitoring-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="monitoring-not-name" x="46" y="122">The misconception</text>
  <text class="monitoring-not-desc" x="46" y="142">Commonly held.</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r0" x="46" y="182">Service uptime is model monitoring</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r1" x="46" y="216">Drift always means retrain</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r2" x="46" y="250">Statistical significance is the trigger</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r3" x="46" y="284">You can wait for outcome labels</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r4" x="46" y="318">Alerts are enough</text>
  <rect class="monitoring-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="monitoring-not-name" x="526" y="122">What is true</text>
  <text class="monitoring-not-desc" x="526" y="142">Actually.</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r0" x="526" y="182">A healthy service can serve wrong predictions</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r1" x="526" y="216">Investigate the cause first</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r2" x="526" y="250">Use effect size at production volumes</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r3" x="526" y="284">They arrive far too late to rely on</text>
  <text class="monitoring-not-desc monitoring-not-row monitoring-not-r4" x="526" y="318">Someone must own the response</text>
  <text class="monitoring-not-sub" x="30" y="372">A perfectly healthy service producing steadily worse predictions is the failure mode monitoring exists for, and no infrastructure metric will ever show it.</text>
</svg>
