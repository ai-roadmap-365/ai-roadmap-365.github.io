<svg role="img" aria-label="Population Stability Index calculation workflow showing reference baseline vs current inference bin frequency comparisons and drift thresholds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Population Stability Index (PSI) Drift Calculation</title>
  <defs>
    <linearGradient id="bg195a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card195" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg195a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">POPULATION STABILITY INDEX (PSI) DRIFT DETECTOR</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Quantifying Statistical Divergence: PSI = sum (Actual% - Expected%) * ln(Actual% / Expected%)</text>
  <g transform="translate(50, 85)">
    <rect width="750" height="295" fill="url(#card195)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Reference Dist -->
    <rect x="30" y="35" width="200" height="150" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="130" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Reference Training Set (P)</text>
    <rect x="50" y="80" width="25" height="85" fill="#38bdf8" opacity="0.8"/>
    <rect x="85" y="100" width="25" height="65" fill="#38bdf8" opacity="0.8"/>
    <rect x="120" y="70" width="25" height="95" fill="#38bdf8" opacity="0.8"/>
    <rect x="155" y="115" width="25" height="50" fill="#38bdf8" opacity="0.8"/>
    <rect x="190" y="130" width="25" height="35" fill="#38bdf8" opacity="0.8"/>
    <text x="130" y="178" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">10 Quantile Bins Expected%</text>
    <!-- Arrow -->
    <line x1="230" y1="110" x2="275" y2="110" stroke="#64748b" stroke-width="2"/>
    <!-- Current Dist -->
    <rect x="275" y="35" width="200" height="150" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="375" y="60" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Live Production Stream (Q)</text>
    <rect x="295" y="130" width="25" height="35" fill="#fbbf24" opacity="0.8"/>
    <rect x="330" y="115" width="25" height="50" fill="#fbbf24" opacity="0.8"/>
    <rect x="365" y="85" width="25" height="80" fill="#fbbf24" opacity="0.8"/>
    <rect x="400" y="70" width="25" height="95" fill="#fbbf24" opacity="0.8"/>
    <rect x="435" y="60" width="25" height="105" fill="#fbbf24" opacity="0.8"/>
    <text x="375" y="178" fill="#94a3b8" font-family="system-ui" font-size="8" text-anchor="middle">Shifted Bins Actual%</text>
    <!-- Arrow -->
    <line x1="475" y1="110" x2="520" y2="110" stroke="#64748b" stroke-width="2"/>
    <!-- Action Thresholds -->
    <rect x="520" y="35" width="200" height="150" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="6"/>
    <text x="620" y="60" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">PSI Decision Thresholds</text>
    <text x="535" y="90" fill="#34d399" font-family="system-ui" font-size="9">• PSI &lt; 0.10: No Shift (Stable)</text>
    <text x="535" y="115" fill="#fbbf24" font-family="system-ui" font-size="9">• 0.10 &le; PSI &lt; 0.20: Moderate Drift</text>
    <text x="535" y="140" fill="#ef4444" font-family="system-ui" font-size="9">• PSI &ge; 0.20: Significant Shift!</text>
    <text x="535" y="165" fill="#fca5a5" font-family="system-ui" font-size="8">Trigger Retraining Pipeline</text>
    <!-- Mathematical summary bar -->
    <rect x="30" y="205" width="690" height="70" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="375" y="232" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Symmetric Kullback-Leibler (KL) Divergence Foundation</text>
    <text x="375" y="255" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">PSI = D_KL(Actual || Expected) + D_KL(Expected || Actual) = sum (A_i - E_i) * ln(A_i / E_i)</text>
  </g>
</svg>
