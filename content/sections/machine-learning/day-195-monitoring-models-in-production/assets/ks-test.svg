<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The distribution test</title>
  <style>
    .ks-test-bg   { fill: #f8fafc; }
    .ks-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ks-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ks-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ks-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ks-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ks-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ks-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ks-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ks-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ks-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ks-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ks-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ks-test-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ks-test-stage { opacity: 1; }

    .ks-test-s0 { animation-delay: 0.00s; }
    .ks-test-e0 { animation-delay: 0.00s; }
    .ks-test-s1 { animation-delay: 1.28s; }
    .ks-test-e1 { animation-delay: 1.28s; }
    .ks-test-s2 { animation-delay: 2.56s; }
    .ks-test-e2 { animation-delay: 2.56s; }
    .ks-test-s3 { animation-delay: 3.84s; }
    .ks-test-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ks-test-conn  { animation: ks-test-trace 6.4s ease-in-out infinite; }
      .ks-test-stage { animation: ks-test-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ks-test-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ks-test-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ks-test-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ks-test-stage { animation: ks-test-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ks-test-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ks-test-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ks-test-bg" width="980" height="322"/>
  <text class="ks-test-h1"  x="30" y="40">The distribution test</text>
  <text class="ks-test-sub" x="30" y="64">Four steps.</text>
  <g class="ks-test-stage ks-test-s0">
    <rect class="ks-test-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ks-test-step" x="44" y="142">01</text>
    <text class="ks-test-name" x="70" y="142">Build the cumulative distribution for both periods</text>
    <text class="ks-test-desc" x="44" y="166">Reference and current.</text>
  </g>
  <line class="ks-test-line ks-test-conn ks-test-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ks-test-tip)"/>
  <g class="ks-test-stage ks-test-s1">
    <rect class="ks-test-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ks-test-step" x="280" y="142">02</text>
    <text class="ks-test-name" x="306" y="142">Find the largest vertical gap between them</text>
    <text class="ks-test-desc" x="280" y="166">Which is the test statistic.</text>
  </g>
  <line class="ks-test-line ks-test-conn ks-test-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ks-test-tip)"/>
  <g class="ks-test-stage ks-test-s2">
    <rect class="ks-test-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ks-test-step" x="516" y="142">03</text>
    <text class="ks-test-name" x="542" y="142">Compare against a critical value</text>
    <text class="ks-test-desc" x="516" y="166">Giving a significance level.</text>
  </g>
  <line class="ks-test-line ks-test-conn ks-test-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ks-test-tip)"/>
  <g class="ks-test-stage ks-test-s3">
    <rect class="ks-test-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ks-test-step" x="752" y="142">04</text>
    <text class="ks-test-name" x="778" y="142">But at production volumes everything is significant</text>
    <text class="ks-test-desc" x="752" y="166">So use effect size, not the</text>
    <text class="ks-test-desc" x="752" y="182">p-value.</text>
  </g>
  <text class="ks-test-sub" x="30" y="304">Statistical significance is nearly useless at production sample sizes: with a million rows, a difference too small to matter will still be highly significant.</text>
</svg>
