sources:
  - title: 'Some Methods for Classification and Analysis of Multivariate Observations'
    url: 'https://projecteuclid.org/euclid.bsmsp/1200512992'
    publisher: 'Proceedings of the 5th Berkeley Symposium on Mathematical Statistics and Probability'
    accessed: '2026-08-29'
    year: 1967
    description: 'James MacQueen formulating the standard K-Means algorithm for multivariate clustering.'
  - title: 'k-means++: The Advantages of Careful Seeding'
    url: 'https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf'
    publisher: 'ACM-SIAM Symposium on Discrete Algorithms (SODA)'
    accessed: '2026-08-29'
    year: 2007
    description: 'David Arthur and Sergei Vassilvitskii introducing distance-squared seeding with O(log k) competitive ratio.'
  - title: 'Silhouettes: A Graphical Aid to the Interpretation and Validation of Cluster Analysis'
    url: 'https://doi.org/10.1016/0377-0427(87)90125-7'
    publisher: 'Journal of Computational and Applied Mathematics'
    accessed: '2026-08-29'
    year: 1987
    description: 'Peter Rousseeuw introducing the Silhouette coefficient measuring cluster cohesion and separation.'
