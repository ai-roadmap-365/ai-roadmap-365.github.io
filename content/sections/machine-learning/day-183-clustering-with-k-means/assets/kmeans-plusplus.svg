<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Careful initialisation</title>
  <style>
    .kmeans-plusplus-bg   { fill: #f8fafc; }
    .kmeans-plusplus-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-plusplus-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-plusplus-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-plusplus-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-plusplus-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-plusplus-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-plusplus-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kmeans-plusplus-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kmeans-plusplus-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kmeans-plusplus-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kmeans-plusplus-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kmeans-plusplus-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kmeans-plusplus-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kmeans-plusplus-stage { opacity: 1; }

    .kmeans-plusplus-s0 { animation-delay: 0.00s; }
    .kmeans-plusplus-e0 { animation-delay: 0.00s; }
    .kmeans-plusplus-s1 { animation-delay: 1.28s; }
    .kmeans-plusplus-e1 { animation-delay: 1.28s; }
    .kmeans-plusplus-s2 { animation-delay: 2.56s; }
    .kmeans-plusplus-e2 { animation-delay: 2.56s; }
    .kmeans-plusplus-s3 { animation-delay: 3.84s; }
    .kmeans-plusplus-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kmeans-plusplus-conn  { animation: kmeans-plusplus-trace 6.4s ease-in-out infinite; }
      .kmeans-plusplus-stage { animation: kmeans-plusplus-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kmeans-plusplus-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kmeans-plusplus-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kmeans-plusplus-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kmeans-plusplus-stage { animation: kmeans-plusplus-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kmeans-plusplus-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kmeans-plusplus-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kmeans-plusplus-bg" width="980" height="322"/>
  <text class="kmeans-plusplus-h1"  x="30" y="40">Careful initialisation</text>
  <text class="kmeans-plusplus-sub" x="30" y="64">Four steps.</text>
  <g class="kmeans-plusplus-stage kmeans-plusplus-s0">
    <rect class="kmeans-plusplus-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-plusplus-step" x="44" y="142">01</text>
    <text class="kmeans-plusplus-name" x="70" y="142">Random initial centres cluster together by chance</text>
    <text class="kmeans-plusplus-desc" x="44" y="166">Which leads to poor local</text>
    <text class="kmeans-plusplus-desc" x="44" y="182">minima.</text>
  </g>
  <line class="kmeans-plusplus-line kmeans-plusplus-conn kmeans-plusplus-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kmeans-plusplus-tip)"/>
  <g class="kmeans-plusplus-stage kmeans-plusplus-s1">
    <rect class="kmeans-plusplus-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-plusplus-step" x="280" y="142">02</text>
    <text class="kmeans-plusplus-name" x="306" y="142">So pick the first centre at random</text>
    <text class="kmeans-plusplus-desc" x="280" y="166">From the data points.</text>
  </g>
  <line class="kmeans-plusplus-line kmeans-plusplus-conn kmeans-plusplus-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kmeans-plusplus-tip)"/>
  <g class="kmeans-plusplus-stage kmeans-plusplus-s2">
    <rect class="kmeans-plusplus-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-plusplus-step" x="516" y="142">03</text>
    <text class="kmeans-plusplus-name" x="542" y="142">Then pick each next one with probability proportional to squared distance</text>
    <text class="kmeans-plusplus-desc" x="516" y="166">From the nearest existing</text>
    <text class="kmeans-plusplus-desc" x="516" y="182">centre.</text>
  </g>
  <line class="kmeans-plusplus-line kmeans-plusplus-conn kmeans-plusplus-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kmeans-plusplus-tip)"/>
  <g class="kmeans-plusplus-stage kmeans-plusplus-s3">
    <rect class="kmeans-plusplus-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-plusplus-step" x="752" y="142">04</text>
    <text class="kmeans-plusplus-name" x="778" y="142">Which spreads them out, with a proven bound</text>
    <text class="kmeans-plusplus-desc" x="752" y="166">On expected quality relative to</text>
    <text class="kmeans-plusplus-desc" x="752" y="182">the optimum.</text>
    <text class="kmeans-plusplus-edge" x="752" y="242">provable</text>
  </g>
  <text class="kmeans-plusplus-sub" x="30" y="304">This is the default in every serious implementation, and it costs one extra pass over the data for a substantial and provable improvement.</text>
</svg>
