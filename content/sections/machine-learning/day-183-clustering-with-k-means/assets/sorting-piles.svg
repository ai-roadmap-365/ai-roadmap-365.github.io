<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Decided before you look.">
  <title>Sorting into a fixed number of piles</title>
  <style>
    .sorting-piles-bg   { fill: #f8fafc; }
    .sorting-piles-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-piles-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-piles-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-piles-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-piles-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-piles-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-piles-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sorting-piles-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sorting-piles-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sorting-piles-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sorting-piles-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sorting-piles-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-piles-row { opacity: 1; }
    .sorting-piles-r0 { animation-delay: 0.00s; }
    .sorting-piles-r1 { animation-delay: 0.45s; }
    .sorting-piles-r2 { animation-delay: 0.90s; }
    .sorting-piles-r3 { animation-delay: 1.35s; }
    .sorting-piles-r4 { animation-delay: 1.80s; }
    .sorting-piles-row { animation: sorting-piles-reveal 7.3s ease-in-out infinite; }
    @keyframes sorting-piles-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sorting-piles-bg" width="980" height="390"/>
  <text class="sorting-piles-h1"  x="30" y="40">Sorting into a fixed number of piles</text>
  <text class="sorting-piles-sub" x="30" y="64">Decided before you look.</text>
  <rect class="sorting-piles-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-piles-name" x="46" y="122">A fixed number of piles</text>
  <text class="sorting-piles-desc" x="46" y="142">Decided in advance.</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r0" x="46" y="182">You choose how many before starting</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r1" x="46" y="216">Everything goes in a pile</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r2" x="46" y="250">Unusual items are forced somewhere</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r3" x="46" y="284">Piles come out roughly equal</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r4" x="46" y="318">This is k-means</text>
  <rect class="sorting-piles-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-piles-name" x="526" y="122">Piles as they emerge</text>
  <text class="sorting-piles-desc" x="526" y="142">Decided by the items.</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r0" x="526" y="182">The count follows from the material</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r1" x="526" y="216">Some items belong to no pile</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r2" x="526" y="250">Unusual items are set aside</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r3" x="526" y="284">Piles vary in size and shape</text>
  <text class="sorting-piles-desc sorting-piles-row sorting-piles-r4" x="526" y="318">This is density-based clustering</text>
  <text class="sorting-piles-sub" x="30" y="372">Choosing the number of piles before looking at the material is the assumption to be conscious of, and it is frequently wrong in ways the algorithm cannot report.</text>
</svg>
