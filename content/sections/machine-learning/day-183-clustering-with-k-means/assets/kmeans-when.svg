<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to use k-means</title>
  <style>
    .kmeans-when-bg   { fill: #f8fafc; }
    .kmeans-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kmeans-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kmeans-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kmeans-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kmeans-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kmeans-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-when-row { opacity: 1; }
    .kmeans-when-r0 { animation-delay: 0.00s; }
    .kmeans-when-r1 { animation-delay: 0.45s; }
    .kmeans-when-r2 { animation-delay: 0.90s; }
    .kmeans-when-r3 { animation-delay: 1.35s; }
    .kmeans-when-r4 { animation-delay: 1.80s; }
    .kmeans-when-row { animation: kmeans-when-reveal 7.3s ease-in-out infinite; }
    @keyframes kmeans-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kmeans-when-bg" width="980" height="390"/>
  <text class="kmeans-when-h1"  x="30" y="40">When to use k-means</text>
  <text class="kmeans-when-sub" x="30" y="64">And when not to.</text>
  <rect class="kmeans-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kmeans-when-name" x="46" y="122">Use it</text>
  <text class="kmeans-when-desc" x="46" y="142">Four cases.</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r0" x="46" y="182">Large datasets needing speed</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r1" x="46" y="216">Roughly spherical, similar-sized groups</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r2" x="46" y="250">Vector quantisation and codebooks</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r3" x="46" y="284">Where k is known from the domain</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r4" x="46" y="318">As a fast first look at structure</text>
  <rect class="kmeans-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kmeans-when-name" x="526" y="122">Use something else</text>
  <text class="kmeans-when-desc" x="526" y="142">Also four.</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r0" x="526" y="182">Irregular or nested cluster shapes</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r1" x="526" y="216">Where outliers must be excluded</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r2" x="526" y="250">Where the group count is unknown</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r3" x="526" y="284">Very high dimensions without reduction</text>
  <text class="kmeans-when-desc kmeans-when-row kmeans-when-r4" x="526" y="318">Where a hierarchy is more useful than a partition</text>
  <text class="kmeans-when-sub" x="30" y="372">Running it as a first look even when it is the wrong final method is reasonable, because it is fast enough that the information is nearly free.</text>
</svg>
