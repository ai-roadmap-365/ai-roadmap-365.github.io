<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two steps, repeated.">
  <title>K-means in four steps</title>
  <style>
    .kmeans-idea-bg   { fill: #f8fafc; }
    .kmeans-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kmeans-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kmeans-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kmeans-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kmeans-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kmeans-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kmeans-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kmeans-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kmeans-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kmeans-idea-stage { opacity: 1; }

    .kmeans-idea-s0 { animation-delay: 0.00s; }
    .kmeans-idea-e0 { animation-delay: 0.00s; }
    .kmeans-idea-s1 { animation-delay: 1.28s; }
    .kmeans-idea-e1 { animation-delay: 1.28s; }
    .kmeans-idea-s2 { animation-delay: 2.56s; }
    .kmeans-idea-e2 { animation-delay: 2.56s; }
    .kmeans-idea-s3 { animation-delay: 3.84s; }
    .kmeans-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kmeans-idea-conn  { animation: kmeans-idea-trace 6.4s ease-in-out infinite; }
      .kmeans-idea-stage { animation: kmeans-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kmeans-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kmeans-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kmeans-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kmeans-idea-stage { animation: kmeans-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kmeans-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kmeans-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kmeans-idea-bg" width="980" height="322"/>
  <text class="kmeans-idea-h1"  x="30" y="40">K-means in four steps</text>
  <text class="kmeans-idea-sub" x="30" y="64">Two steps, repeated.</text>
  <g class="kmeans-idea-stage kmeans-idea-s0">
    <rect class="kmeans-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-idea-step" x="44" y="142">01</text>
    <text class="kmeans-idea-name" x="70" y="142">Place k centres</text>
    <text class="kmeans-idea-desc" x="44" y="166">Chosen carefully, not at random.</text>
  </g>
  <line class="kmeans-idea-line kmeans-idea-conn kmeans-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kmeans-idea-tip)"/>
  <g class="kmeans-idea-stage kmeans-idea-s1">
    <rect class="kmeans-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-idea-step" x="280" y="142">02</text>
    <text class="kmeans-idea-name" x="306" y="142">Assign every point to its nearest centre</text>
    <text class="kmeans-idea-desc" x="280" y="166">Which partitions the space.</text>
  </g>
  <line class="kmeans-idea-line kmeans-idea-conn kmeans-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kmeans-idea-tip)"/>
  <g class="kmeans-idea-stage kmeans-idea-s2">
    <rect class="kmeans-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-idea-step" x="516" y="142">03</text>
    <text class="kmeans-idea-name" x="542" y="142">Move each centre to the mean of its points</text>
    <text class="kmeans-idea-desc" x="516" y="166">Which is where the name comes</text>
    <text class="kmeans-idea-desc" x="516" y="182">from.</text>
  </g>
  <line class="kmeans-idea-line kmeans-idea-conn kmeans-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kmeans-idea-tip)"/>
  <g class="kmeans-idea-stage kmeans-idea-s3">
    <rect class="kmeans-idea-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kmeans-idea-step" x="752" y="142">04</text>
    <text class="kmeans-idea-name" x="778" y="142">Repeat until nothing moves</text>
    <text class="kmeans-idea-desc" x="752" y="166">Which is guaranteed, though not</text>
    <text class="kmeans-idea-desc" x="752" y="182">to the best answer.</text>
  </g>
  <text class="kmeans-idea-sub" x="30" y="304">Convergence being guaranteed while optimality is not is the defining property: it always stops, and where it stops depends on where it started.</text>
</svg>
