<svg role="img" aria-label="Diagram of 2D feature space partitioned into three Voronoi cells with cluster centroids and data points" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>K-Means Clustering and Voronoi Tessellation</title>
  <defs>
    <linearGradient id="bg183a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cell1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cell2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cell3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.25" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg183a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">K-MEANS CLUSTERING: VORONOI TESSELLATION &amp; PARTITIONING</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Euclidean nearest-neighbor bisectors define convex polyhedral decision boundaries</text>
  
  <g transform="translate(60, 85)">
    <polygon points="0,0 420,0 350,180 0,140" fill="url(#cell1)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="420,0 730,0 730,220 350,180" fill="url(#cell2)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="0,140 350,180 730,220 730,290 0,290" fill="url(#cell3)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <circle cx="160" cy="70" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="160" y="75" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">C1</text>
    <circle cx="120" cy="50" r="5" fill="#93c5fd"/>
    <circle cx="180" cy="90" r="5" fill="#93c5fd"/>
    <circle cx="210" cy="55" r="5" fill="#93c5fd"/>
    <circle cx="140" cy="105" r="5" fill="#93c5fd"/>
    
    <circle cx="540" cy="80" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <text x="540" y="85" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">C2</text>
    <circle cx="490" cy="60" r="5" fill="#6ee7b7"/>
    <circle cx="580" cy="70" r="5" fill="#6ee7b7"/>
    <circle cx="520" cy="110" r="5" fill="#6ee7b7"/>
    <circle cx="610" cy="100" r="5" fill="#6ee7b7"/>

    <circle cx="360" cy="230" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <text x="360" y="235" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">C3</text>
    <circle cx="300" cy="210" r="5" fill="#fcd34d"/>
    <circle cx="410" cy="240" r="5" fill="#fcd34d"/>
    <circle cx="350" cy="265" r="5" fill="#fcd34d"/>
    <circle cx="250" cy="250" r="5" fill="#fcd34d"/>
  </g>
</svg>
