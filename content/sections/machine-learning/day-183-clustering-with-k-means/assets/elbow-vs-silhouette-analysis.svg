<svg role="img" aria-label="Two-panel chart showing WCSS inertia elbow curve alongside mean silhouette score across values of k from 2 to 8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Elbow Method Inertia vs Silhouette Score Profile</title>
  <defs>
    <linearGradient id="bg183b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg183b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">OPTIMAL K SELECTION: ELBOW INERTIA VS SILHOUETTE PROFILE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Balancing Within-Cluster Variance against Inter-Cluster Cohesion and Separation</text>
  
  <g transform="translate(50, 85)">
    <rect width="355" height="295" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <text x="177" y="25" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Elbow Method (Inertia / WCSS)</text>
    <polyline points="40,50 90,140 140,200 190,230 240,245 290,255" fill="none" stroke="#ef4444" stroke-width="3"/>
    <circle cx="140" cy="200" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="140" y="185" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Elbow (k=3)</text>
  </g>

  <g transform="translate(445, 85)">
    <rect width="355" height="295" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <text x="177" y="25" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Silhouette Score Profile</text>
    <polyline points="40,160 90,120 140,70 190,130 240,170 290,200" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="140" cy="70" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="140" y="55" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Peak Score = 0.68 (k=3)</text>
  </g>
</svg>
