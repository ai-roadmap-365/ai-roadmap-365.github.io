terms:
  - term: 'K-Means Clustering'
    definition: 'A centroid-based unsupervised algorithm that partitions N observations into K disjoint clusters by minimizing within-cluster sum of squares.'
  - term: 'Lloyd Algorithm'
    definition: 'An alternating optimization heuristic that iterates between assigning points to nearest centroids (E-step) and updating centroids to cluster means (M-step).'
  - term: 'k-means++'
    definition: 'An initialization scheme that selects initial cluster centers with probability proportional to their squared distance from already chosen centers.'
  - term: 'WCSS (Inertia)'
    definition: 'Within-Cluster Sum of Squares: the sum of squared Euclidean distances between each point and its assigned cluster centroid.'
  - term: 'Voronoi Tessellation'
    definition: 'A partitioning of metric space into convex polyhedral cells, where each cell contains all points closer to its generating seed than to any other.'
  - term: 'Silhouette Coefficient'
    definition: 'A cluster validation metric ranging from -1 to +1 measuring how well-separated and cohesive clusters are.'
  - term: 'Mini-Batch K-Means'
    definition: 'A streaming variant of K-Means that updates centroids using small random sub-samples, reducing computational complexity to linear time.'
  - term: 'Centroid'
    definition: 'The geometric mean (center of mass) of all data points belonging to a specific cluster in multi-dimensional space.'
