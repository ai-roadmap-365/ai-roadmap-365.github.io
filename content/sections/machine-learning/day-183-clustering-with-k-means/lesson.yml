section: machine-learning
subsection: beyond-supervised
week: 27
learning_promise: 'Master K-Means clustering from mathematical foundations to production scale: derive Lloyd coordinate descent, implement k-means++ seeding from scratch, analyze Voronoi partitions and WCSS inertia, and select optimal clusters using Silhouette and Elbow analysis.'
objectives:
  - 'Formulate the Within-Cluster Sum of Squares (WCSS) objective function as a non-convex optimization problem.'
  - 'Implement Lloyd algorithm from scratch: alternating expectation-step assignment and maximization-step centroid recalculation.'
  - 'Implement k-means++ distance-squared probability seeding and prove the O(log k) approximation guarantee.'
  - 'Compute and interpret the Silhouette Coefficient and Elbow Method for optimal cluster count selection.'
  - 'Diagnose K-Means failure modes: non-convex geometry, anisotropic variance, and unequal cluster density.'
  - 'Scale clustering to massive datasets using Mini-Batch K-Means with streaming gradient updates.'
