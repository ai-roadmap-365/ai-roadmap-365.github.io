visuals:
  - id: kmeans-clustering-voronoi-partition
    file: assets/kmeans-clustering-voronoi-partition.svg
    type: diagram
    title: K-Means Clustering and Voronoi Tessellation
    alt: Diagram of 2D feature space partitioned into three Voronoi cells with cluster centroids and data points
    description: Geometric visualization of Voronoi cell boundaries formed by Euclidean distance bisectors between cluster centroids.
  - id: elbow-vs-silhouette-analysis
    file: assets/elbow-vs-silhouette-analysis.svg
    type: diagram
    title: Elbow Method Inertia vs Silhouette Score Profile
    alt: Two-panel chart showing WCSS inertia elbow curve alongside mean silhouette score across values of k from 2 to 8
    description: Comparative analysis of Elbow Method diminishing returns versus Silhouette score peaks for determining optimal cluster count k.
  - id: kmeans-idea
    file: assets/kmeans-idea.svg
    type: diagram
    title: 'K-means in four steps'
    alt: 'Diagram: the four steps of the k-means clustering algorithm'
    description: 'A four-stage description of k-means covering initialisation, assignment, update and convergence.'
  - id: wcss
    file: assets/wcss.svg
    type: diagram
    title: 'The objective'
    alt: 'Diagram: the four properties of the within-cluster sum of squares objective'
    description: 'A four-stage description of the k-means objective covering the sum, the minimisation, the monotone decrease and the local minimum.'
  - id: kmeans-plusplus
    file: assets/kmeans-plusplus.svg
    type: diagram
    title: 'Careful initialisation'
    alt: 'Diagram: how distance-weighted seeding improves k-means initialisation'
    description: 'A four-stage description of careful seeding covering the random baseline, the first centre, the weighted choice and the guarantee.'
  - id: choosing-k
    file: assets/choosing-k.svg
    type: diagram
    title: 'Choosing k'
    alt: 'Diagram: three methods for choosing the number of clusters'
    description: 'A two-column comparison of methods for choosing the cluster count against their limitations.'
  - id: lloyd
    file: assets/lloyd.svg
    type: diagram
    title: 'Why it converges'
    alt: 'Diagram: why alternating assignment and update converges'
    description: 'A four-stage description of the convergence argument covering the two steps, each reducing the objective, finite configurations and termination.'
  - id: kmeans-not
    file: assets/kmeans-not.svg
    type: diagram
    title: 'What k-means is not'
    alt: 'Diagram: four misconceptions about k-means clustering'
    description: 'A two-column comparison of misconceptions about k-means against what is true.'
  - id: kmeans-history
    file: assets/kmeans-history.svg
    type: diagram
    title: 'Four steps for k-means'
    alt: 'Diagram: the historical progression of k-means clustering'
    description: 'A four-stage description of k-means history covering the original algorithm, independent rediscovery, careful seeding and vector quantisation.'
  - id: sorting-piles
    file: assets/sorting-piles.svg
    type: diagram
    title: 'Sorting into a fixed number of piles'
    alt: 'Diagram: sorting into a predetermined number of groups compared with letting groups emerge'
    description: 'A two-column comparison of a fixed group count against an emergent one.'
  - id: kmeans-implications
    file: assets/kmeans-implications.svg
    type: diagram
    title: 'Four consequences of k-means'
    alt: 'Diagram: the speed, assumption, stability and privacy implications of k-means'
    description: 'A four-stage description of k-means implications covering speed, shape assumptions, run-to-run stability and centroid disclosure.'
  - id: kmeans-when
    file: assets/kmeans-when.svg
    type: diagram
    title: 'When to use k-means'
    alt: 'Diagram: when k-means is the right clustering method'
    description: 'A two-column comparison of situations favouring k-means against alternatives.'
  - id: kmeans-why
    file: assets/kmeans-why.svg
    type: diagram
    title: 'What k-means solved'
    alt: 'Diagram: the four problems k-means was created to solve'
    description: 'A four-stage description of the problems addressed covering unlabelled structure, signal compression, segmentation and speed.'
