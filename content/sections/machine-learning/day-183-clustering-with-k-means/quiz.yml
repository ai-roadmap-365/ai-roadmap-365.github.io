questions:
  - question: 'What mathematical objective function does Lloyd algorithm iteratively minimize?'
    options:
      - 'The Maximum Margin hyperplane separation between clusters'
      - 'The Within-Cluster Sum of Squares (WCSS / Inertia) across all K clusters'
      - 'The Cross-Entropy loss between predicted and ground-truth cluster labels'
      - 'The total number of pairwise Euclidean distance comparisons'
    answer_index: 1
    explanation: 'K-Means minimizes WCSS, defined as the sum of squared Euclidean distances between each observation and its assigned cluster centroid.'
  - question: 'How does k-means++ initialization select subsequent cluster centroids after the first random center is chosen?'
    options:
      - 'Uniformly at random from the remaining unselected data points'
      - 'By computing the global eigendecomposition of the covariance matrix'
      - 'With probability proportional to squared distance from the nearest centroid'
      - 'By picking the points with the lowest feature variance'
    answer_index: 2
    explanation: 'k-means++ uses D^2 weighting: points farther from existing centers have a higher probability of selection, ensuring well-dispersed initial centroids.'
  - question: 'What does a Silhouette Coefficient near +1.0 indicate for a specific data point?'
    options:
      - 'The algorithm has failed to converge after the maximum number of iterations'
      - 'The point lies exactly on the boundary between two competing clusters'
      - 'The point has been misassigned to the wrong cluster and is closer to another cluster'
      - 'Tight within its own cluster and far from the nearest one'
    answer_index: 3
    explanation: 'Silhouette score s(i) = (b(i) - a(i)) / max(a(i), b(i)). When s(i) approaches +1, intra-cluster distance a(i) is near 0 and inter-cluster distance b(i) is large.'
  - question: 'Why does standard K-Means fail on concentric circular datasets or crescent-shaped clusters?'
    options:
      - 'K-Means assumes spherical clusters with linear boundaries'
      - 'The learning rate decays to zero before reaching non-linear boundaries'
      - 'K-Means cannot compute distances in more than two dimensions'
      - 'Inertia cannot be computed when clusters contain unequal numbers of samples'
    answer_index: 0
    explanation: 'Because K-Means assigns points to the nearest centroid using Euclidean distance, decision boundaries between clusters are strictly convex Voronoi hyperplanes, making it incapable of capturing non-convex manifolds.'
  - question: 'How does Mini-Batch K-Means achieve massive speedups over batch K-Means on large-scale datasets?'
    options:
      - 'By skipping the distance computation and hashing points into buckets'
      - 'It updates centroids from small random batches'
      - 'By executing PCA before every iteration step'
      - 'By restricting the number of clusters to powers of two'
    answer_index: 1
    explanation: 'Mini-Batch K-Means updates cluster centroids using convex combination updates over small random subsets (e.g. 256 samples), converging in a fraction of the time with minimal loss of inertia quality.'
