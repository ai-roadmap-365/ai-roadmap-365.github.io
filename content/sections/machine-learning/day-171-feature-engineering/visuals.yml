visuals:
  - id: cyclical-time-encoding
    file: assets/cyclical-time-encoding.svg
    type: diagram
    title: 'Cyclical Time Encoding on the 2D Trigonometric Unit Circle'
    alt: 'Diagram showing 24-hour clock mapped onto a 2D unit circle with sine and cosine coordinates, showing continuous distance between 23:00 and 00:00.'
    description: 'A static architecture diagram illustrating how periodic temporal features are projected onto continuous 2D trigonometric unit circle coordinates.'
  - id: group-aggregation-lifecycle
    file: assets/group-aggregation-lifecycle.svg
    type: flow-animated
    title: 'Leak-Free Group Aggregation Engineering Lifecycle'
    alt: 'Animated flow chart showing training group summary statistics calculation, merging onto validation folds, and computing relative residuals.'
    description: 'An animated flow chart showing the leak-free extraction and deployment of group-level aggregation features across cross-validation splits.'
  - id: fe-idea
    file: assets/fe-idea.svg
    type: diagram
    title: 'What feature engineering does'
    alt: 'Diagram: how feature engineering makes a pattern learnable'
    description: 'A four-stage description of feature engineering covering the hidden pattern, the model''s limits, the constructed feature and the result.'
  - id: interactions
    file: assets/interactions.svg
    type: diagram
    title: 'Interactions and ratios'
    alt: 'Diagram: four arithmetic feature constructions and what each expresses'
    description: 'A four-stage description of arithmetic features covering products, ratios, differences and polynomial terms.'
  - id: cyclical
    file: assets/cyclical.svg
    type: diagram
    title: 'Encoding cycles'
    alt: 'Diagram: why cyclical quantities need a two-dimensional encoding'
    description: 'A four-stage description of cyclical encoding covering the wraparound problem, the discontinuity, the projection and the result.'
  - id: aggregations
    file: assets/aggregations.svg
    type: diagram
    title: 'Group aggregations'
    alt: 'Diagram: how group aggregations summarise related rows into a feature'
    description: 'A four-stage description of group aggregation covering the entity, the summary, the join and the leakage risk.'
  - id: time-features
    file: assets/time-features.svg
    type: diagram
    title: 'Time-series primitives'
    alt: 'Diagram: four time-series feature constructions'
    description: 'A four-stage description of time-series features covering lags, rolling windows, deltas and time since an event.'
  - id: fe-not
    file: assets/fe-not.svg
    type: diagram
    title: 'What feature engineering is not'
    alt: 'Diagram: four misconceptions about feature engineering'
    description: 'A two-column comparison of misconceptions about feature engineering against what is true.'
  - id: fe-history
    file: assets/fe-history.svg
    type: diagram
    title: 'Four steps in feature engineering'
    alt: 'Diagram: the historical progression of feature engineering practice'
    description: 'A four-stage description of feature engineering history covering hand-crafted features, domain libraries, learned representations and the tabular exception.'
  - id: cooking-prep
    file: assets/cooking-prep.svg
    type: diagram
    title: 'Preparing ingredients'
    alt: 'Diagram: raw ingredients compared with prepared ones'
    description: 'A two-column comparison of unprepared ingredients against prepared ones.'
  - id: fe-implications
    file: assets/fe-implications.svg
    type: diagram
    title: 'Four consequences of feature engineering'
    alt: 'Diagram: the accuracy, leakage, maintenance and serving implications of feature engineering'
    description: 'A four-stage description of feature engineering implications covering accuracy gains, leakage risk, maintenance burden and serving complexity.'
  - id: fe-when
    file: assets/fe-when.svg
    type: diagram
    title: 'Where to spend feature effort'
    alt: 'Diagram: when feature engineering is worth the effort'
    description: 'A two-column comparison of situations rewarding feature engineering against those that do not.'
