terms:
  - term: 'Feature Engineering'
    definition: 'The process of using domain knowledge to extract, transform, and create new input variables from raw data to enhance machine learning model performance.'
  - term: 'Interaction Feature'
    definition: 'A feature created by multiplying, dividing, or combining two or more distinct variables to capture joint non-linear effects.'
  - term: 'Cyclical Encoding'
    definition: 'Mapping periodic temporal variables (hours, days, months) to 2D continuous coordinates using sine and cosine trigonometric functions.'
  - term: 'Group Aggregation (Split-Apply-Combine)'
    definition: 'Computing entity-level summary statistics (mean, std, count, min, max) grouped by a categorical key and merging back onto the dataset.'
  - term: 'Relative Residual Feature'
    definition: 'The difference or ratio between an individual observation and its group aggregate baseline (e.g. x - Mean(x | group)).'
  - term: 'Domain Ratio'
    definition: 'A custom mathematical quotient representing a known physical, economic, or clinical relationship (e.g. Debt-to-Income, BMI).'
  - term: 'Lag Feature'
    definition: 'A historical value of a time-series variable from k time steps prior (x_{t-k}) used to capture temporal momentum.'
  - term: 'Rolling Window Statistic'
    definition: 'A moving aggregate statistic (mean, standard deviation, max) computed over a sliding temporal window of past observations.'
  - term: 'Combinatorial Expansion'
    definition: 'The rapid, exponential growth in feature space dimensionality when generating high-degree polynomial combinations.'
  - term: 'Feature Store'
    definition: 'A centralized operational data management layer that curates, stores, and serves standardized feature definitions across training and production.'
