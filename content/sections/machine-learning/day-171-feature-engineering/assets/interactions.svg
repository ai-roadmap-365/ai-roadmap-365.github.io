<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four kinds.">
  <title>Interactions and ratios</title>
  <style>
    .interactions-bg   { fill: #f8fafc; }
    .interactions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .interactions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .interactions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .interactions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .interactions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .interactions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .interactions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .interactions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .interactions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .interactions-stage { opacity: 1; }

    .interactions-s0 { animation-delay: 0.00s; }
    .interactions-e0 { animation-delay: 0.00s; }
    .interactions-s1 { animation-delay: 1.28s; }
    .interactions-e1 { animation-delay: 1.28s; }
    .interactions-s2 { animation-delay: 2.56s; }
    .interactions-e2 { animation-delay: 2.56s; }
    .interactions-s3 { animation-delay: 3.84s; }
    .interactions-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .interactions-conn  { animation: interactions-trace 6.4s ease-in-out infinite; }
      .interactions-stage { animation: interactions-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes interactions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes interactions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .interactions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .interactions-stage { animation: interactions-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes interactions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="interactions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="interactions-bg" width="980" height="322"/>
  <text class="interactions-h1"  x="30" y="40">Interactions and ratios</text>
  <text class="interactions-sub" x="30" y="64">Four kinds.</text>
  <g class="interactions-stage interactions-s0">
    <rect class="interactions-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="interactions-step" x="44" y="142">01</text>
    <text class="interactions-name" x="70" y="142">Products</text>
    <text class="interactions-desc" x="44" y="166">Express that two features matter</text>
    <text class="interactions-desc" x="44" y="182">together, not separately.</text>
  </g>
  <line class="interactions-line interactions-conn interactions-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#interactions-tip)"/>
  <g class="interactions-stage interactions-s1">
    <rect class="interactions-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="interactions-step" x="280" y="142">02</text>
    <text class="interactions-name" x="306" y="142">Ratios</text>
    <text class="interactions-desc" x="280" y="166">Normalise one quantity by</text>
    <text class="interactions-desc" x="280" y="182">another. Often the strongest</text>
    <text class="interactions-desc" x="280" y="198">single addition.</text>
  </g>
  <line class="interactions-line interactions-conn interactions-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#interactions-tip)"/>
  <g class="interactions-stage interactions-s2">
    <rect class="interactions-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="interactions-step" x="516" y="142">03</text>
    <text class="interactions-name" x="542" y="142">Differences</text>
    <text class="interactions-desc" x="516" y="166">Gaps and changes, especially</text>
    <text class="interactions-desc" x="516" y="182">between dates.</text>
  </g>
  <line class="interactions-line interactions-conn interactions-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#interactions-tip)"/>
  <g class="interactions-stage interactions-s3">
    <rect class="interactions-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="interactions-step" x="752" y="142">04</text>
    <text class="interactions-name" x="778" y="142">Squares and higher powers</text>
    <text class="interactions-desc" x="752" y="166">Let a linear model bend.</text>
    <text class="interactions-desc" x="752" y="182">Expensive in feature count.</text>
  </g>
  <text class="interactions-sub" x="30" y="304">Ratios are consistently the highest-return construction on business data, because most meaningful quantities are per-something rather than absolute.</text>
</svg>
