<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before the cooking.">
  <title>Preparing ingredients</title>
  <style>
    .cooking-prep-bg   { fill: #f8fafc; }
    .cooking-prep-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cooking-prep-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cooking-prep-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cooking-prep-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cooking-prep-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cooking-prep-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cooking-prep-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cooking-prep-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cooking-prep-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cooking-prep-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cooking-prep-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cooking-prep-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cooking-prep-row { opacity: 1; }
    .cooking-prep-r0 { animation-delay: 0.00s; }
    .cooking-prep-r1 { animation-delay: 0.45s; }
    .cooking-prep-r2 { animation-delay: 0.90s; }
    .cooking-prep-r3 { animation-delay: 1.35s; }
    .cooking-prep-r4 { animation-delay: 1.80s; }
    .cooking-prep-row { animation: cooking-prep-reveal 7.3s ease-in-out infinite; }
    @keyframes cooking-prep-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cooking-prep-bg" width="980" height="390"/>
  <text class="cooking-prep-h1"  x="30" y="40">Preparing ingredients</text>
  <text class="cooking-prep-sub" x="30" y="64">Before the cooking.</text>
  <rect class="cooking-prep-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cooking-prep-name" x="46" y="122">Raw ingredients</text>
  <text class="cooking-prep-desc" x="46" y="142">Everything is there.</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r0" x="46" y="182">All the necessary components present</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r1" x="46" y="216">But in an unusable form</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r2" x="46" y="250">The cook must extract what is needed</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r3" x="46" y="284">Slower, and worse results</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r4" x="46" y="318">This is raw features</text>
  <rect class="cooking-prep-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cooking-prep-name" x="526" y="122">Prepared ingredients</text>
  <text class="cooking-prep-desc" x="526" y="142">In a usable form.</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r0" x="526" y="182">The same components, cut and measured</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r1" x="526" y="216">Ready to combine directly</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r2" x="526" y="250">The work is already done</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r3" x="526" y="284">Faster, and better results</text>
  <text class="cooking-prep-desc cooking-prep-row cooking-prep-r4" x="526" y="318">This is engineered features</text>
  <text class="cooking-prep-sub" x="30" y="372">Nothing is added by preparation in either case — the information was always present, and making it accessible is what changes the outcome.</text>
</svg>
