<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What feature engineering is not</title>
  <style>
    .fe-not-bg   { fill: #f8fafc; }
    .fe-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fe-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fe-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fe-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fe-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fe-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-not-row { opacity: 1; }
    .fe-not-r0 { animation-delay: 0.00s; }
    .fe-not-r1 { animation-delay: 0.45s; }
    .fe-not-r2 { animation-delay: 0.90s; }
    .fe-not-r3 { animation-delay: 1.35s; }
    .fe-not-r4 { animation-delay: 1.80s; }
    .fe-not-row { animation: fe-not-reveal 7.3s ease-in-out infinite; }
    @keyframes fe-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fe-not-bg" width="980" height="390"/>
  <text class="fe-not-h1"  x="30" y="40">What feature engineering is not</text>
  <text class="fe-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="fe-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fe-not-name" x="46" y="122">The misconception</text>
  <text class="fe-not-desc" x="46" y="142">Commonly held.</text>
  <text class="fe-not-desc fe-not-row fe-not-r0" x="46" y="182">More features means a better model</text>
  <text class="fe-not-desc fe-not-row fe-not-r1" x="46" y="216">Deep learning has made it obsolete</text>
  <text class="fe-not-desc fe-not-row fe-not-r2" x="46" y="250">Automated tools replace domain knowledge</text>
  <text class="fe-not-desc fe-not-row fe-not-r3" x="46" y="284">Any transformation is safe</text>
  <text class="fe-not-desc fe-not-row fe-not-r4" x="46" y="318">It is preprocessing</text>
  <rect class="fe-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fe-not-name" x="526" y="122">What is true</text>
  <text class="fe-not-desc" x="526" y="142">Actually.</text>
  <text class="fe-not-desc fe-not-row fe-not-r0" x="526" y="182">Irrelevant features add variance and cost</text>
  <text class="fe-not-desc fe-not-row fe-not-r1" x="526" y="216">Only for images, text and audio</text>
  <text class="fe-not-desc fe-not-row fe-not-r2" x="526" y="250">They generate candidates; judgment selects</text>
  <text class="fe-not-desc fe-not-row fe-not-r3" x="526" y="284">Anything using the target or other rows can leak</text>
  <text class="fe-not-desc fe-not-row fe-not-r4" x="526" y="318">It is modelling, and it is where the gains are</text>
  <text class="fe-not-sub" x="30" y="372">Automated feature generation produces thousands of candidates and no judgment about which are legitimate, which is why leakage is so common when it is used unsupervised.</text>
</svg>
