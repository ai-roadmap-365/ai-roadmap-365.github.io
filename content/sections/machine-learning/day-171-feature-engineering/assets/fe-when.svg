<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where not to.">
  <title>Where to spend feature effort</title>
  <style>
    .fe-when-bg   { fill: #f8fafc; }
    .fe-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fe-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fe-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fe-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fe-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fe-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fe-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fe-when-row { opacity: 1; }
    .fe-when-r0 { animation-delay: 0.00s; }
    .fe-when-r1 { animation-delay: 0.45s; }
    .fe-when-r2 { animation-delay: 0.90s; }
    .fe-when-r3 { animation-delay: 1.35s; }
    .fe-when-r4 { animation-delay: 1.80s; }
    .fe-when-row { animation: fe-when-reveal 7.3s ease-in-out infinite; }
    @keyframes fe-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fe-when-bg" width="980" height="390"/>
  <text class="fe-when-h1"  x="30" y="40">Where to spend feature effort</text>
  <text class="fe-when-sub" x="30" y="64">And where not to.</text>
  <rect class="fe-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fe-when-name" x="46" y="122">Invest</text>
  <text class="fe-when-desc" x="46" y="142">Four signals.</text>
  <text class="fe-when-desc fe-when-row fe-when-r0" x="46" y="182">Tabular or transactional data</text>
  <text class="fe-when-desc fe-when-row fe-when-r1" x="46" y="216">Domain expertise is available</text>
  <text class="fe-when-desc fe-when-row fe-when-r2" x="46" y="250">Relationships the model cannot construct</text>
  <text class="fe-when-desc fe-when-row fe-when-r3" x="46" y="284">Time-series with lags and recency</text>
  <text class="fe-when-desc fe-when-row fe-when-r4" x="46" y="318">Where a point of accuracy is worth money</text>
  <rect class="fe-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fe-when-name" x="526" y="122">Do not</text>
  <text class="fe-when-desc" x="526" y="142">Also four.</text>
  <text class="fe-when-desc fe-when-row fe-when-r0" x="526" y="182">Images, audio and text — let the model learn</text>
  <text class="fe-when-desc fe-when-row fe-when-r1" x="526" y="216">Where the baseline already meets the target</text>
  <text class="fe-when-desc fe-when-row fe-when-r2" x="526" y="250">Without a leakage-safe pipeline</text>
  <text class="fe-when-desc fe-when-row fe-when-r3" x="526" y="284">When automated generation is unsupervised</text>
  <text class="fe-when-desc fe-when-row fe-when-r4" x="526" y="318">Where nobody will maintain the features</text>
  <text class="fe-when-sub" x="30" y="372">The third row is a precondition rather than a case: engineering features without a pipeline that enforces fold discipline reliably produces results that do not survive deployment.</text>
</svg>
