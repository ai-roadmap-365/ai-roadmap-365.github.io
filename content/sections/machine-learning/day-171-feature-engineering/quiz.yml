questions:
  - question: 'Why is cyclical encoding using Sine and Cosine pairs mandatory for periodic temporal features (e.g. Hour of Day in 0-23)?'
    options:
      - 'Because decision trees cannot split integers'
      - 'Because cyclical encoding speeds up CPU math'
      - 'Raw hours put 23:00 and 00:00 far apart'
      - 'Because timestamps are imaginary numbers'
    answer_index: 2
    explanation: 'On a 24-hour clock, 23:59 is 2 minutes away from 00:01. Linear integers treat them as maximum distance. Sine/cosine coordinates preserve true cyclical proximity on the unit circle.'

  - question: 'What is the mathematical definition of a Group Aggregation feature (Split-Apply-Combine)?'
    options:
      - 'A random split of the dataset'
      - 'A method for clustering unsupervised data'
      - 'A technique for reducing matrix rank'
      - 'Summary statistics per categorical group'
    answer_index: 3
    explanation: 'Group aggregations contextualize individual transactions against user, merchant, or regional baselines, generating powerful relative signals like amount_ratio = amount / user_30day_avg.'

  - question: 'How do interaction features (e.g. Product x1 * x2 or Ratio x1 / x2) help Linear and Logistic Regression models?'
    options:
      - 'They let linear models capture interactions'
      - 'They reduce the number of features in the dataset'
      - 'They eliminate the need for cross-validation'
      - 'They convert classification into regression'
    answer_index: 0
    explanation: 'A linear model can only learn additive weights w1*x1 + w2*x2. Adding an explicit interaction column x3 = x1*x2 allows the linear hyperplane to model joint multiplicative synergies.'

  - question: 'What fatal mistake occurs if Group Aggregation features are computed on the entire dataset BEFORE splitting into training and validation sets?'
    options:
      - 'The DataFrame column names are corrupted'
      - 'Leakage into the group statistics'
      - 'The computer runs out of memory'
      - 'The model underfits severely'
    answer_index: 1
    explanation: 'Group statistics must be computed strictly on training data and merged onto validation splits; unseen test groups must fallback to global training priors.'

  - question: 'Why are Domain-Specific Ratios (such as Debt-to-Income or Price-per-Square-Foot) often more predictive than the raw individual features?'
    options:
      - 'Ratios eliminate missing values'
      - 'Ratios always have Gaussian distributions'
      - 'Ratios encode real capacity constraints'
      - 'Ratios reduce model training time to zero'
    answer_index: 2
    explanation: 'A $10,000 credit card debt is trivial for a high earner but devastating for a low earner. The ratio Debt / Income captures financial solvency directly in a single informative feature.'

  - question: 'What is the danger of generating all possible polynomial interaction terms (e.g. degree 3 or 4 polynomial expansion) on high-dimensional data?'
    options:
      - 'Scikit-learn cannot compute polynomials'
      - 'Polynomial features cause division by zero'
      - 'Polynomial features only work on images'
      - 'Combinatorial explosion of dimensionality'
    answer_index: 3
    explanation: 'For d=100 features, degree 3 creates over 170,000 interaction columns, creating severe multicollinearity and overfitting. Domain-guided feature engineering is vastly superior to blind brute-force expansion.'

  - question: 'What are Lag Features and Rolling Window Statistics in sequential/time-series modeling?'
    options:
      - 'Lags give past values, rolling stats trend'
      - 'Techniques for delaying model deployment'
      - 'Methods for slowing down gradient descent'
      - 'Ways to prune decision tree branches'
    answer_index: 0
    explanation: 'Lag and rolling features translate temporal autocorrelation into static tabular features that standard gradient boosted trees can easily split on.'

  - question: 'According to famous Kaggle Grandmasters and ML researchers, what separates winning solutions from mediocre models in competitive tabular challenges?'
    options:
      - 'Using the newest deep learning neural architecture'
      - 'Feature engineering and leak-free validation'
      - 'Training for 100,000 epochs on a GPU cluster'
      - 'Using random hyperparameters'
    answer_index: 1
    explanation: 'Features provide the signal; algorithms merely extract it. High-quality feature engineering consistently beats fancy algorithms on dirty real-world data.'
