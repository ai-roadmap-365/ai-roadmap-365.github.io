visuals:
  - id: two-failures-architecture
    file: assets/two-failures-architecture.svg
    type: diagram
    title: >-
      The squared error decomposed into bias, variance and irreducible noise at three capacities,
      with each of the two failures named and given its symptom
    alt: >-
      Diagram: total error split into three stacked parts at three capacities. At degree 1, labelled
      too rigid, bias squared of 4.2985 sits above a thin variance band of 0.7112 and a noise block of
      4.0000, totalling 9.0097. At degree 3, labelled the true shape, bias has collapsed to a sliver
      of 0.0033 with variance 0.8399 above the same noise floor, totalling 4.8432. At degree 12,
      labelled too flexible, a small bias band of 2803.5354 sits above an enormous variance band of
      452183.1336, totalling 454990.6691, with a note that the bar is not to scale. A dashed line
      marks the irreducible floor at 4.0000 across all three. Two cards below state that underfitting
      is bias, whose symptom is high training error and a negative gap to test error, and that
      overfitting is variance, whose symptom is low training error and an enormous gap. A final note
      records that more data shrinks variance and leaves bias exactly where it was, which is why it
      cures one failure and not the other
    description: >-
      A static architecture diagram in three columns, one per model capacity, above two diagnosis
      cards. Each column stacks the three parts of the expected squared error, measured over 200
      independent training sets of 25 rows drawn from a cubic plus noise of standard deviation 2. The
      degree-1 column, headed "too rigid", is dominated by a large bias band of 4.2985 above a thin
      variance band of 0.7112 and the noise block of 4.0000, totalling 9.0097. The degree-3 column,
      headed "the true shape", shows bias collapsed to a sliver of 0.0033 -- because the true
      function is itself a cubic -- with variance 0.8399 above the same noise floor, totalling
      4.8432. The degree-12 column, headed "too flexible", inverts the first: a bias band of
      2803.5354 above an enormous variance band of 452183.1336, totalling 454990.6691, with the bar
      explicitly labelled as not to scale. A dashed line runs across all three columns marking the
      irreducible floor at 4.0000. Below, two cards state the diagnoses: underfitting is bias, the
      model class cannot represent the truth so it is wrong in the same direction whatever data it is
      given, and its symptom is high training error with a NEGATIVE gap to test error; overfitting is
      variance, the model class can represent the truth and much else besides so it chases the noise
      and lands somewhere new each time, and its symptom is low training error with an enormous gap.
      A closing note records that more data shrinks variance and leaves bias exactly where it was,
      which is why it cures one failure and not the other.
  - id: capacity-curve-flow
    file: assets/capacity-curve-flow.svg
    type: flow-animated
    title: >-
      Training error falling monotonically with capacity while test error turns at degree 4 and
      climbs four orders of magnitude, drawn on a logarithmic error axis
    alt: >-
      Diagram: two curves against polynomial degree on a logarithmic error axis. The training-error
      curve, drawn with hollow markers, falls steadily from 11.32 at degree 1 to about 1 at degree 14
      and stays there. The test-error curve, drawn with filled markers, falls to a marked minimum of
      5.4911 at degree 4 and then climbs steeply to 226667 at degree 24, crossing four orders of
      magnitude. A dashed vertical line marks the best degree. The animation reveals the markers left
      to right so the divergence is visible as motion. A caption records that at the left-hand end the
      curves are the wrong way round, with test error sitting below training error, because a model
      too rigid to chase noise has none to be flattered by, and that this negative gap is the
      signature of underfitting and the one people miss
    description: >-
      An animated line chart of the measured capacity sweep: 25 training rows, 2000 test rows, a
      cubic truth plus noise, polynomial degrees 1, 2, 3, 4, 6, 8, 10, 14, 18 and 24 along the
      horizontal axis. The vertical axis is mean squared error on a logarithmic scale with
      gridlines at 1, 10, 100, 1000, 10000 and 100000, because on a linear axis every point except
      the last would be indistinguishable from zero. The training-error curve, drawn dark with
      hollow markers, falls steadily from 11.3217 at degree 1 to 0.9685 at degree 14 and then
      wobbles slightly upward. The test-error curve, drawn in the accent colour with filled
      markers, falls to a marked minimum of 5.4911 at degree 4 and then climbs to 226667.4689 at
      degree 24. A dashed vertical line and a label mark the best degree. The animation reveals the
      marker pairs left to right, roughly one every 0.6 seconds on an 8-second loop, so the moment
      the two curves diverge is visible as motion; each marker, once revealed, stays at full
      opacity. A caption beneath records the finding that is easiest to miss: at the left-hand end
      the curves are the wrong way round, with test error sitting below training error, because a
      model too rigid to chase noise has none to be flattered by -- and that negative gap is the
      signature of underfitting. A prefers-reduced-motion block disables every reveal and leaves
      both curves and all twenty markers in place, so the still frame carries the whole result.
