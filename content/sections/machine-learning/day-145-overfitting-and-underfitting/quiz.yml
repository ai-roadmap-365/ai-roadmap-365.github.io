questions:
  - question: >-
      A model scores 11.3217 on its training set and 9.8274 on its test set — better on data it has
      never seen. What does that tell you?
    options:
      - 'The split is broken: test rows have leaked into training, which is the only way test error can beat training error'
      - 'The test set happens to be easier than the training set, and a different split would reverse it'
      - 'It is underfitting — too rigid to have chased any noise'
      - 'The model is well regularised, and a negative gap is the target you should tune toward'
    answer_index: 2
    explanation: >-
      A negative gap is the signature of underfitting and it is the one people miss. Training error
      is normally optimistic because the model has partly memorised its training rows; a straight
      line fitted to a cubic has memorised nothing, so there is no optimism to subtract. Engineers
      who see this usually suspect a leak and go looking for a bug -- and the fix they then apply,
      more regularisation, is the exact opposite of what is needed. The gap is not something to tune
      toward; it is a diagnostic.
  - question: >-
      Bias squared is 4.2985, variance is 0.7112 and irreducible noise is 4.0000. Which failure is
      this, and which action would be the most expensive mistake?
    options:
      - 'Overfitting; the expensive mistake would be adding capacity'
      - 'Neither -- the error is dominated by noise, and the expensive mistake would be any further work at all'
      - 'Underfitting; the expensive mistake would be adding regularisation'
      - 'Underfitting; the expensive mistake would be commissioning more labelled data'
    answer_index: 3
    explanation: >-
      Bias exceeds variance sixfold, so the model class cannot represent the truth. More data shrinks
      the variance term and leaves bias exactly where it is: in this lesson's measurement, a
      133-fold increase in data moved an underfit model from 8.5023 to 8.2393. Commissioning labels
      is usually the most expensive action available, which is what makes it the worst choice here.
      Adding regularisation would also be wrong -- it reduces variance, which is already the small
      term -- but it costs a few fits rather than a quarter's budget. Noise is 4.0 of the 9.01
      total, so it is substantial but not dominant.
  - question: >-
      Degree 2 contains every degree-1 model as a special case, yet it measures more bias (4.3342
      against 4.2985) AND more variance (1.4204 against 0.7112). How can a strictly larger model
      class be worse on both terms?
    options:
      - 'The true function is odd, so a quadratic term buys nothing'
      - 'The extra variance is real, but the extra bias is a rounding artefact -- a larger class can never have more bias'
      - 'It cannot; one of the two measurements must be an artefact of the finite number of training sets'
      - 'Degree 2 was fitted with a different random seed, so the comparison is not like for like'
    answer_index: 0
    explanation: >-
      The true function has no even component worth having, so the quadratic term contributes nothing
      to reducing bias -- and the fitted quadratic coefficient is estimated from noise, which
      contributes to both terms. In population terms a larger class cannot have more bias; in
      measured terms, over 200 finite training sets, the average prediction is itself estimated and
      the extra free parameter degrades it. The practical lesson stands either way: capacity is not
      a single dial running from worse to better, and a bigger set of candidate functions is not
      automatically a better one.
  - question: >-
      More data took one model from a test MSE of 215,413 to 4.0055, and another from 8.5023 to
      8.2393. State the rule.
    options:
      - 'More data helps every model, but the benefit is proportional to how bad the model started'
      - 'More data cures variance and does nothing for bias'
      - 'More data helps only models that are already close to the noise floor'
      - 'More data reduces the noise floor, which is why the first model improved so dramatically'
    answer_index: 1
    explanation: >-
      Variance is scatter caused by which particular rows you happened to draw, and averaging over
      more rows shrinks it. Bias is the model class being unable to represent the truth, and no
      quantity of rows changes what a straight line can be. Note also where the first model landed:
      4.0055 against an irreducible floor of exactly 4.0000. It did not merely improve -- it ran out
      of room. The noise floor is a property of the data-generating process and no amount of data
      moves it.
  - question: >-
      A ridge penalty improved a model's test error by a factor of 39,588 while raising its training
      error from 1.0321 to 2.7461. Why is the second half of that sentence the mechanism rather than
      a side effect?
    options:
      - 'It is a side effect: the training error rises because ridge solves a slightly different optimisation problem, which is incidental to the improvement'
      - 'Because a higher training error means the model has been forced to generalise, which is what regularisation is defined to do'
      - 'Because the penalty works by discouraging the fit from using the capacity it has, and refusing to fit the training data as closely IS the variance reduction'
      - 'Because training error and test error are always inversely related once a model has enough capacity'
    answer_index: 2
    explanation: >-
      The penalty buys variance reduction with bias, and the currency it pays in is exactly the
      closeness of the training fit. That is why a team that tunes for training error will reliably
      switch off every regularisation they have. Note the shape too: the test column has its own
      U-curve, with alpha 1.0 beating 10.0 beating 100.0, because too much penalty is simply
      underfitting by another route. Nothing forces a model to generalise, and training and test
      error are not inversely related in general -- both fall together in the useful range.
  - question: >-
      A degree-24 polynomial fitted to 25 rows scores far worse than the same model fitted to 15
      rows. What is special about 25?
    options:
      - '25 rows is where cross-validation folds become too small to be reliable'
      - '25 rows is where the training set becomes large enough for the model to memorise it exactly'
      - 'Nothing is special about 25; the result is sampling noise and would not survive a different seed'
      - 'Degree 24 gives 25 features for 25 rows — an exact fit'
    answer_index: 3
    explanation: >-
      This is the interpolation threshold. At 15 rows there are more features than rows, the system
      is under-determined, and least squares returns the minimum-norm solution -- which is quietly a
      form of regularisation and behaves better. At exactly 25 the solution is unique and wild
      between the training points. Beyond it, more data constrains the fit again and the error falls
      to the noise floor. This is the left-hand edge of what the literature calls double descent, and
      the lab finds it without going looking for it.
  - question: >-
      Over 600 epochs of gradient descent, training error fell at every single epoch while test error
      bottomed at epoch 14. What does that establish?
    options:
      - 'Training time is itself a capacity dial'
      - 'That the learning rate was too high, since a correctly tuned run would improve both together'
      - 'That the model had already converged by epoch 14, and the remaining epochs were numerical noise'
      - 'That the test set is too small to track the training curve reliably'
    answer_index: 0
    explanation: >-
      Nothing about the model class or the data changed across those 600 epochs. Only how much of the
      available capacity the optimiser had actually reached did, which is why early stopping and an
      explicit penalty produce such similar curves. The model had certainly not converged -- training
      error was still falling at epoch 600, from 7.3906 down to 2.4744 -- and the generalisation gap
      grew from 0.6771 to 3.4234 over the same span. That growing gap is what the extra training was
      buying.
  - question: >-
      Your model overfits. A colleague suggests the problem is that you compared 200 candidate
      configurations on your validation set. Are they describing the same thing?
    options:
      - 'Yes -- both are the model learning noise, and both are fixed by regularisation'
      - 'No — one is fitting data, the other fitting your choice'
      - 'Yes, but selection bias is simply a milder form of overfitting and needs no separate treatment'
      - 'No -- selection bias only affects the training set, while overfitting affects the test set'
    answer_index: 1
    explanation: >-
      They are routinely confused and the confusion is expensive. This lesson's 226,667 has nothing
      to do with how many models were compared, and Day 144's validation score of 0.5720 against a
      test score of 0.4992 has nothing to do with model capacity -- every candidate there was a coin
      flip with no capacity at all. Regularising harder will make no progress against a selection
      problem; the fix for that is a held-out test set, counting K, and nested cross-validation.
