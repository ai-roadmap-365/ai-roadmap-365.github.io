terms:
  - term: Overfitting
    definition: >-
      A model having enough freedom to fit the noise in this particular training set, so that what it
      learned includes things that will not be true next time. It is the variance term of the
      decomposition, not a synonym for complexity: a complicated model on enough data does not
      overfit, and a simple model on three points can.
  - term: Underfitting
    definition: >-
      The model class being unable to represent the truth, so the error survives however good the fit
      is. It is the bias term. No amount of optimisation, tuning or data helps, because the
      constraint is what the class can express at all.
  - term: Bias
    definition: >-
      How far the average prediction -- averaged over training sets -- sits from the truth. An error
      the model class makes every time, in the same direction. Measured here at 4.2985 for a straight
      line fitted to a cubic, and 0.0033 for a cubic fitted to a cubic.
  - term: Variance
    definition: >-
      How much individual predictions scatter around their own average across training sets. An error
      that changes with the data you happened to draw. Measured here at 0.7112 at degree 1 and
      452183.1336 at degree 12.
  - term: Irreducible noise
    definition: >-
      The part of the target that nothing could predict. Here it is exactly 4.0000, the square of the
      noise standard deviation, and two different models converge on it from opposite sides given
      enough data. The number that tells a project when to stop spending.
  - term: The bias-variance decomposition
    definition: >-
      The identity that expected squared error equals bias squared plus variance plus irreducible
      noise. Not a metaphor: the lab checks the sum against the error actually observed and finds
      agreement to within one percent at every capacity.
  - term: Generalisation gap
    definition: >-
      Test error minus training error. The only part of the decomposition computable from a single
      fit, which makes it the practical diagnostic -- and its SIGN is what distinguishes the two
      failures.
  - term: Negative gap
    definition: >-
      Test error below training error, measured here at -1.4942. Not a broken split: a model too
      rigid to chase noise has none to be flattered by, so its training score carries no optimism.
      The signature of underfitting, and the one most often mistaken for a bug.
  - term: Model capacity
    definition: >-
      How much a model class can represent. Not a single dial from worse to better -- degree 2
      contains every degree-1 model and measured more bias AND more variance, because the true
      function is odd so the extra term buys nothing and still costs.
  - term: Regularisation
    definition: >-
      Any penalty that discourages a fit from using the capacity it has. Buys variance reduction with
      bias, and the currency it pays in is training error: a ridge penalty of 1.0 improved test error
      here by a factor of 39,588 while raising training error from 1.0321 to 2.7461.
  - term: Ridge regression
    definition: >-
      Least squares with an L2 penalty on the coefficients, published by Hoerl and Kennard in 1970
      for exactly this reason. One hyper-parameter, alpha, whose test error has its own U-curve --
      too much penalty is underfitting by another route.
  - term: Learning curve
    definition: >-
      Training and test error plotted against training-set size. It tells you what more data would
      buy before you buy it: converged curves sitting high mean bias-limited and no amount of data
      will help.
  - term: Early stopping
    definition: >-
      Halting gradient descent before it reaches the capacity available to it. Training time is a
      capacity dial: training error fell at every one of 600 epochs here while test error bottomed at
      epoch 14 and the gap grew fivefold.
  - term: Patience
    definition: >-
      Waiting a fixed number of non-improving epochs before stopping, and restoring the best weights
      rather than the last. Necessary because a test curve wanders -- this one rose to 7.1435 and
      partly recovered without ever beating its epoch-14 value.
  - term: Interpolation threshold
    definition: >-
      The point where the number of parameters equals the number of training rows, so the fit is
      unique and unconstrained between the points. Found here by accident: degree 24 supplies exactly
      25 features, and the worst measured error occurred at exactly 25 rows.
  - term: Minimum-norm solution
    definition: >-
      What least squares returns when there are more features than rows and the system is
      under-determined. Quietly a form of regularisation, which is why the degree-24 model behaved
      better at 15 rows than at 25.
  - term: Double descent
    definition: >-
      Test error falling again beyond the interpolation threshold, described in work from around
      2019. The U-curve of this lesson is the right first mental model and is not the whole story for
      very large models; this lab reaches the left-hand edge of the effect.
  - term: Capacity control
    definition: >-
      Choosing how much a model may express, rather than maximising it. Structural risk minimisation
      is the formal version; a max depth, a dropout rate, a weight decay and an epoch budget are all
      instances of it.
  - term: Ensembling
    definition: >-
      Combining many models so their independent errors partly cancel. Bagging attacks the variance
      term by averaging high-variance models; boosting attacks the bias term by sequencing
      high-bias ones. Described here from documentation, not measured.
  - term: Diagnosis before treatment
    definition: >-
      Establishing which term dominates before choosing an intervention. It costs one fit and rules
      out the expensive mistakes: commissioning labels against a bias problem, or adding capacity
      against a variance one.
