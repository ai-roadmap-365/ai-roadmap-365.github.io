<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By the diagnosis.">
  <title>Which remedy when</title>
  <style>
    .fitting-when-bg   { fill: #f8fafc; }
    .fitting-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fitting-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fitting-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fitting-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fitting-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fitting-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fitting-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fitting-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fitting-when-row { opacity: 1; }
    .fitting-when-r0 { animation-delay: 0.00s; }
    .fitting-when-r1 { animation-delay: 0.45s; }
    .fitting-when-r2 { animation-delay: 0.90s; }
    .fitting-when-r3 { animation-delay: 1.35s; }
    .fitting-when-r4 { animation-delay: 1.80s; }
    .fitting-when-row { animation: fitting-when-reveal 7.3s ease-in-out infinite; }
    @keyframes fitting-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fitting-when-bg" width="980" height="390"/>
  <text class="fitting-when-h1"  x="30" y="40">Which remedy when</text>
  <text class="fitting-when-sub" x="30" y="64">By the diagnosis.</text>
  <rect class="fitting-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fitting-when-name" x="46" y="122">The diagnosis</text>
  <text class="fitting-when-desc" x="46" y="142">What you measured.</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r0" x="46" y="182">Both errors high, small gap</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r1" x="46" y="216">Large and persistent gap</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r2" x="46" y="250">Both low and close</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r3" x="46" y="284">Gap grows with training time</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r4" x="46" y="318">High training error and a large gap</text>
  <rect class="fitting-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fitting-when-name" x="526" y="122">The remedy</text>
  <text class="fitting-when-desc" x="526" y="142">What to do.</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r0" x="526" y="182">More capacity, or better features</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r1" x="526" y="216">Regularise, simplify, or add data</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r2" x="526" y="250">Stop; it is finished</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r3" x="526" y="284">Stop training earlier</text>
  <text class="fitting-when-desc fitting-when-row fitting-when-r4" x="526" y="318">Look for a leak or a bug</text>
  <text class="fitting-when-sub" x="30" y="372">Reading this table before choosing a fix is the whole lesson, and it converts model improvement from guesswork into a short decision.</text>
</svg>
