<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four cases.">
  <title>Diagnosing from the gap</title>
  <style>
    .gap-diagnosis-bg   { fill: #f8fafc; }
    .gap-diagnosis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-diagnosis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-diagnosis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-diagnosis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-diagnosis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gap-diagnosis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gap-diagnosis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gap-diagnosis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gap-diagnosis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gap-diagnosis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gap-diagnosis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gap-diagnosis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gap-diagnosis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gap-diagnosis-stage { opacity: 1; }

    .gap-diagnosis-s0 { animation-delay: 0.00s; }
    .gap-diagnosis-e0 { animation-delay: 0.00s; }
    .gap-diagnosis-s1 { animation-delay: 1.28s; }
    .gap-diagnosis-e1 { animation-delay: 1.28s; }
    .gap-diagnosis-s2 { animation-delay: 2.56s; }
    .gap-diagnosis-e2 { animation-delay: 2.56s; }
    .gap-diagnosis-s3 { animation-delay: 3.84s; }
    .gap-diagnosis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gap-diagnosis-conn  { animation: gap-diagnosis-trace 6.4s ease-in-out infinite; }
      .gap-diagnosis-stage { animation: gap-diagnosis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gap-diagnosis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gap-diagnosis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gap-diagnosis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gap-diagnosis-stage { animation: gap-diagnosis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gap-diagnosis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gap-diagnosis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gap-diagnosis-bg" width="980" height="322"/>
  <text class="gap-diagnosis-h1"  x="30" y="40">Diagnosing from the gap</text>
  <text class="gap-diagnosis-sub" x="30" y="64">Four cases.</text>
  <g class="gap-diagnosis-stage gap-diagnosis-s0">
    <rect class="gap-diagnosis-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gap-diagnosis-step" x="44" y="142">01</text>
    <text class="gap-diagnosis-name" x="70" y="142">Both high, and close</text>
    <text class="gap-diagnosis-desc" x="44" y="166">Underfitting. Add capacity or</text>
    <text class="gap-diagnosis-desc" x="44" y="182">better features.</text>
  </g>
  <line class="gap-diagnosis-line gap-diagnosis-conn gap-diagnosis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gap-diagnosis-tip)"/>
  <g class="gap-diagnosis-stage gap-diagnosis-s1">
    <rect class="gap-diagnosis-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gap-diagnosis-step" x="280" y="142">02</text>
    <text class="gap-diagnosis-name" x="306" y="142">Training low, validation much higher</text>
    <text class="gap-diagnosis-desc" x="280" y="166">Overfitting. Regularise,</text>
    <text class="gap-diagnosis-desc" x="280" y="182">simplify, or get more data.</text>
  </g>
  <line class="gap-diagnosis-line gap-diagnosis-conn gap-diagnosis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gap-diagnosis-tip)"/>
  <g class="gap-diagnosis-stage gap-diagnosis-s2">
    <rect class="gap-diagnosis-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gap-diagnosis-step" x="516" y="142">03</text>
    <text class="gap-diagnosis-name" x="542" y="142">Both low, and close</text>
    <text class="gap-diagnosis-desc" x="516" y="166">Finished. Ship it.</text>
  </g>
  <line class="gap-diagnosis-line gap-diagnosis-conn gap-diagnosis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gap-diagnosis-tip)"/>
  <g class="gap-diagnosis-stage gap-diagnosis-s3">
    <rect class="gap-diagnosis-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gap-diagnosis-step" x="752" y="142">04</text>
    <text class="gap-diagnosis-name" x="778" y="142">Both high with a large gap</text>
    <text class="gap-diagnosis-desc" x="752" y="166">Usually a leak or a bug, not a</text>
    <text class="gap-diagnosis-desc" x="752" y="182">modelling problem.</text>
    <text class="gap-diagnosis-edge" x="752" y="242">investigate</text>
  </g>
  <text class="gap-diagnosis-sub" x="30" y="304">The fourth case is the one worth recognising: high training error with a large gap is contradictory under the standard picture and usually indicates something broken.</text>
</svg>
