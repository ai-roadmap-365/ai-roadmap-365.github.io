<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="d145a-title d145a-desc" width="1040" height="720">
  <title id="d145a-title">The error decomposed into bias, variance and irreducible noise, with each failure named</title>
  <desc id="d145a-desc">Total error split into three stacked parts across three capacities, showing bias dominating when the model is too rigid, variance dominating when it is too flexible, and a noise floor that neither can cross.</desc>
  <style>
    .d145a-bg { fill: #f8fafc; }
    .d145a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d145a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; }
    .d145a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d145a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d145a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d145a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d145a-bias { fill: #1d4ed8; stroke: #1d4ed8; stroke-width: 2; }
    .d145a-var { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .d145a-noise { fill: #ffffff; stroke: #1a202c; stroke-width: 2; }
    .d145a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d145a-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d145a-floor { stroke: #1a202c; stroke-width: 2; stroke-dasharray: 7 5; }
  </style>
  <rect class="d145a-bg" x="0" y="0" width="1040" height="720"/>

  <text class="d145a-title" x="520" y="42" text-anchor="middle">Every error is three errors, and each failure is one of them</text>
  <text class="d145a-muted" x="520" y="68" text-anchor="middle">Measured over 200 independent training sets of 25 rows. The data is a cubic plus noise of standard deviation 2.</text>

  <!-- legend -->
  <rect class="d145a-bias" x="200" y="92" width="24" height="16" rx="3"/>
  <text class="d145a-label" x="234" y="106">bias squared — wrong the same way every time</text>
  <rect class="d145a-var" x="600" y="92" width="24" height="16" rx="3"/>
  <text class="d145a-label" x="634" y="106">variance — wrong a different way each time</text>
  <rect class="d145a-noise" x="200" y="118" width="24" height="16" rx="3"/>
  <text class="d145a-label" x="234" y="132">irreducible noise — 4.0000, and no model can cross it</text>

  <!-- three columns. Bars drawn on a sqrt-ish visual scale, values printed exactly. -->
  <!-- degree 1 -->
  <text class="d145a-head" x="180" y="180" text-anchor="middle">degree 1</text>
  <text class="d145a-muted" x="180" y="202" text-anchor="middle">too rigid</text>
  <rect class="d145a-noise" x="120" y="380" width="120" height="80" rx="4"/>
  <rect class="d145a-var"   x="120" y="366" width="120" height="14" rx="2"/>
  <rect class="d145a-bias"  x="120" y="280" width="120" height="86" rx="4"/>
  <text class="d145a-num" x="180" y="264" text-anchor="middle">total 9.0097</text>
  <text class="d145a-strong" x="250" y="326">bias 4.2985</text>
  <text class="d145a-muted" x="250" y="378">variance 0.7112</text>
  <text class="d145a-muted" x="250" y="428">noise 4.0000</text>

  <!-- degree 3 -->
  <text class="d145a-head" x="520" y="180" text-anchor="middle">degree 3</text>
  <text class="d145a-muted" x="520" y="202" text-anchor="middle">the true shape</text>
  <rect class="d145a-noise" x="460" y="380" width="120" height="80" rx="4"/>
  <rect class="d145a-var"   x="460" y="363" width="120" height="17" rx="2"/>
  <rect class="d145a-bias"  x="460" y="362" width="120" height="1"/>
  <text class="d145a-num" x="520" y="346" text-anchor="middle">total 4.8432</text>
  <text class="d145a-strong" x="590" y="360">bias 0.0033</text>
  <text class="d145a-muted" x="590" y="378">variance 0.8399</text>
  <text class="d145a-muted" x="590" y="428">noise 4.0000</text>

  <!-- degree 12 -->
  <text class="d145a-head" x="860" y="180" text-anchor="middle">degree 12</text>
  <text class="d145a-muted" x="860" y="202" text-anchor="middle">too flexible</text>
  <rect class="d145a-noise" x="800" y="380" width="120" height="80" rx="4"/>
  <rect class="d145a-var"   x="800" y="240" width="120" height="140" rx="4"/>
  <rect class="d145a-bias"  x="800" y="232" width="120" height="8" rx="2"/>
  <text class="d145a-num" x="860" y="222" text-anchor="middle">total 454990.6691</text>
  <text class="d145a-strong" x="930" y="240">bias 2803.5354</text>
  <text class="d145a-muted" x="930" y="312">variance 452183.1336</text>
  <text class="d145a-muted" x="930" y="428">noise 4.0000</text>
  <text class="d145a-muted" x="860" y="484" text-anchor="middle">bar not to scale</text>

  <line class="d145a-floor" x1="80" y1="460" x2="960" y2="460"/>
  <text class="d145a-muted" x="80" y="480">the floor: 4.0000</text>

  <!-- diagnosis cards -->
  <rect class="d145a-card" x="60" y="508" width="440" height="126" rx="10"/>
  <text class="d145a-strong" x="80" y="538">Underfitting is bias.</text>
  <text class="d145a-label" x="80" y="564">The model class cannot represent the truth, so it is wrong</text>
  <text class="d145a-label" x="80" y="586">in the same direction whatever data you hand it.</text>
  <text class="d145a-muted" x="80" y="612">Symptom: training error is high, and the gap to test error is NEGATIVE.</text>

  <rect class="d145a-card" x="540" y="508" width="440" height="126" rx="10"/>
  <text class="d145a-strong" x="560" y="538">Overfitting is variance.</text>
  <text class="d145a-label" x="560" y="564">The model class can represent the truth and much else,</text>
  <text class="d145a-label" x="560" y="586">so it chases the noise and lands somewhere new each time.</text>
  <text class="d145a-muted" x="560" y="612">Symptom: training error is low, and the gap to test error is enormous.</text>

  <rect class="d145a-note" x="60" y="654" width="920" height="52" rx="10"/>
  <text class="d145a-label" x="520" y="686" text-anchor="middle">More data shrinks variance and leaves bias exactly where it was — which is why it cures one failure and not the other.</text>
</svg>
