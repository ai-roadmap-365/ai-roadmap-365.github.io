terms:
  - term: 'Data Leakage'
    definition: 'The spurious inclusion of information about the target variable that would not be available at actual inference time.'
  - term: 'Target Leakage'
    definition: 'Including features that are updated or created as a consequence of the target event having occurred.'
  - term: 'Preprocessing Contamination'
    definition: 'Fitting transformers (imputers, scalers, encoders) on the combined dataset before splitting train and test sets.'
  - term: 'Lookahead Bias'
    definition: 'Temporal leakage where future timestamps or future aggregate statistics are used to predict past/current events.'
  - term: 'Group Contamination'
    definition: 'Splitting samples randomly when records from the same entity (e.g. patient, user) exist across both train and validation splits.'
  - term: 'Time-Series Split'
    definition: 'A walk-forward validation scheme strictly ensuring training data precedes test data in chronological order.'
  - term: 'GroupKFold'
    definition: 'A cross-validation scheme ensuring all records from any specific group or entity reside in only one fold.'
  - term: 'Feature Timestamp Audit'
    definition: 'A governance check confirming the creation timestamp of every feature strictly precedes the prediction trigger event.'
