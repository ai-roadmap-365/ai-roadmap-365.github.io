questions:
  - question: "What is Target Leakage in a machine learning feature pipeline?"
    options:
      - "When a feature includes information that is a consequence or direct proxy of the target variable that will not be available when the model is used to make real-time predictions in production."
      - "When the target variable is formatted as a string rather than an integer."
      - "When gradient descent learning rate is set higher than 1.0."
      - "When training data is stored in a SQLite database instead of PostgreSQL."
    answer_index: 0
    explanation: "Target leakage occurs when features contain information that will not be available at inference time because they are recorded after the target event occurs (e.g. `Refund_Timestamp` when predicting loan default)."

  - question: "Why does calling `scaler.fit_transform(full_dataset)` BEFORE calling `train_test_split()` cause Preprocessing Contamination?"
    options:
      - "The mean and variance of the holdout test split leak into the scaler parameters, causing the model to evaluate on test data statistics during training."
      - "The scaler deletes 50% of the training dataset."
      - "Scikit-learn raises an automated syntax error."
      - "The transformed matrix becomes un-pickleable."
    answer_index: 0
    explanation: "Fitting any transformer on the entire dataset leaks global summary statistics (mean, variance, category frequencies, target encodings) from the test set into the training process, causing overly optimistic validation metrics."

  - question: "When predicting financial stock returns or time-series demand, why is standard random K-Fold cross-validation forbidden?"
    options:
      - "It causes Temporal Lookahead Bias by using future data points (t+1, t+5) to train models that predict past outcomes (t), creating unrealistic predictive accuracy that collapses in live trading."
      - "K-Fold cross-validation is only defined for binary classification."
      - "Financial data cannot be stored in NumPy arrays."
      - "Time series data has zero variance."
    answer_index: 0
    explanation: "Random K-Fold shuffles samples randomly, allowing the model to peek into future market movements to predict past time steps. Production time series must use chronological splits (`TimeSeriesSplit`)."

  - question: "In medical imaging where multiple X-rays are collected from the same patient across several years, what splitting strategy is mandatory to avoid Group Leakage?"
    options:
      - "GroupKFold or StratifiedGroupKFold partitioned by Patient ID, ensuring all scans from any given patient appear strictly in train OR test, never both."
      - "Random 80/20 train/test splitting on individual image rows."
      - "Standard StratifiedKFold without group grouping."
      - "Dropping 90% of the patient scans at random."
    answer_index: 0
    explanation: "If scans from the same patient are split between train and test, the model memorizes idiosyncratic patient anatomy, hospital equipment artifacts, or jewelry rather than disease pathology."

  - question: "What is the most immediate statistical symptom that an ML model has suffered from severe data leakage?"
    options:
      - "The model achieves near-perfect validation metrics (e.g. ROC-AUC = 0.9998 or R2 = 0.9995) on the very first iteration, but fails completely on true out-of-time production data."
      - "Training loss takes 1,000 epochs to converge."
      - "The model outputs only NaN values."
      - "Memory consumption doubles during cross-validation."
    answer_index: 0
    explanation: "Real-world tabular datasets with human behavioral noise virtually never achieve 0.9999 ROC-AUC. A near-perfect score on the first baseline attempt is the classic signature of a target leak or ID contamination."
