visuals:
  - id: data-leakage-taxonomy-matrix
    file: assets/data-leakage-taxonomy-matrix.svg
    type: diagram
    title: 'The Four Major Taxonomies of Data Leakage'
    alt: 'Taxonomy diagram illustrating the four core forms of data leakage: Target Leakage, Preprocessing Contamination, Temporal Lookahead, and Group ID Contamination.'
    description: 'A static architecture matrix detailing the root causes, mathematical mechanisms, and mitigation techniques for each of the four data leakage taxonomies.'
  - id: leakage-free-pipeline-flow
    file: assets/leakage-free-pipeline-flow.svg
    type: flow-animated
    title: 'Pipeline Encapsulation: Leaky vs Leak-Free Architecture'
    alt: 'Animated flow chart contrasting procedural scripts that leak test statistics with encapsulated scikit-learn Pipelines that guarantee clean cross-validation.'
    description: 'An animated comparison exposing why preprocessing transformations must be fitted strictly inside cross-validation loops to prevent optimistic evaluation bias.'
  - id: leakage-idea
    file: assets/leakage-idea.svg
    type: diagram
    title: 'What leakage is'
    alt: 'Diagram: how data leakage produces an excellent score and a worthless model'
    description: 'A four-stage description of leakage covering the information path, the inflated score, the deployment failure and the difficulty of detection.'
  - id: target-leakage
    file: assets/target-leakage.svg
    type: diagram
    title: 'Target leakage'
    alt: 'Diagram: how a feature that encodes the outcome creates target leakage'
    description: 'A four-stage description of target leakage covering the feature, its timing, the near-perfect score and the test.'
  - id: preprocessing-leak
    file: assets/preprocessing-leak.svg
    type: diagram
    title: 'Preprocessing contamination'
    alt: 'Diagram: how fitting a transform before splitting contaminates the validation set'
    description: 'A four-stage description of preprocessing contamination covering the fit, the shared statistics, the modest inflation and the fix.'
  - id: temporal-leak
    file: assets/temporal-leak.svg
    type: diagram
    title: 'Temporal lookahead'
    alt: 'Diagram: how random splitting on time-ordered data leaks the future'
    description: 'A four-stage description of temporal leakage covering the ordering, random splitting, the future information and the correct split.'
  - id: group-leak
    file: assets/group-leak.svg
    type: diagram
    title: 'Group contamination'
    alt: 'Diagram: how rows from the same entity leak across a split'
    description: 'A four-stage description of group leakage covering repeated entities, the random split, entity recognition and the grouped split.'
  - id: leakage-not
    file: assets/leakage-not.svg
    type: diagram
    title: 'What leakage is not'
    alt: 'Diagram: four misconceptions about data leakage'
    description: 'A two-column comparison of misconceptions about leakage against what is true.'
  - id: leakage-detection
    file: assets/leakage-detection.svg
    type: diagram
    title: 'Detecting leakage'
    alt: 'Diagram: the four checks that detect data leakage'
    description: 'A four-stage description of leakage detection covering implausible scores, feature importance, the timing audit and the ablation.'
  - id: exam-leak
    file: assets/exam-leak.svg
    type: diagram
    title: 'Seeing the exam paper'
    alt: 'Diagram: an examination with the answers available compared with a fair one'
    description: 'A two-column comparison of a compromised examination against a fair one.'
  - id: leakage-implications
    file: assets/leakage-implications.svg
    type: diagram
    title: 'Four consequences of leakage'
    alt: 'Diagram: the credibility, cost, detection and trust implications of data leakage'
    description: 'A four-stage description of leakage implications covering wasted work, deployment failure, late detection and lost trust.'
  - id: leakage-when
    file: assets/leakage-when.svg
    type: diagram
    title: 'Where to look for leakage'
    alt: 'Diagram: where leakage typically enters, by data characteristic'
    description: 'A two-column comparison of data characteristics against the leakage each invites.'
  - id: leakage-why
    file: assets/leakage-why.svg
    type: diagram
    title: 'Why leakage is the defining failure'
    alt: 'Diagram: the four reasons data leakage is the central failure mode of applied machine learning'
    description: 'A four-stage description of leakage''s significance covering silence, plausibility, timing and cost.'
