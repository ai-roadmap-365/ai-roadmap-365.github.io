    title: 'Pipeline Encapsulation: Leaky vs Leak-Free Architecture'
    alt: 'Animated flow chart contrasting procedural scripts that leak test statistics with encapsulated scikit-learn Pipelines that guarantee clean cross-validation.'
    description: 'An animated comparison exposing why preprocessing transformations must be fitted strictly inside cross-validation loops to prevent optimistic evaluation bias.'
