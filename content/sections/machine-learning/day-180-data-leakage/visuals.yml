visuals:
  - id: data-leakage-taxonomy-matrix
    file: assets/data-leakage-taxonomy-matrix.svg
    type: diagram
    title: 'The Four Major Taxonomies of Data Leakage'
    alt: 'Taxonomy diagram illustrating the four core forms of data leakage: Target Leakage, Preprocessing Contamination, Temporal Lookahead, and Group ID Contamination.'
    description: 'A static architecture matrix detailing the root causes, mathematical mechanisms, and mitigation techniques for each of the four data leakage taxonomies.'
  - id: leakage-free-pipeline-flow
    file: assets/leakage-free-pipeline-flow.svg
