slug: data-leakage
title: Data Leakage
section: machine-learning
subsection: supervised-learning
week: 26
learning_promise: >-
  Master the detection and eradication of Data Leakage in applied machine learning: systematically identify Target Leakage,
  Preprocessing Contamination, Temporal Lookahead Bias, and Group ID Contamination, audit pipelines using permutation
  and correlation checks, and enforce atomic Pipeline encapsulation for 100% leak-free production deployments.
objectives:
  - 'Differentiate the four primary taxonomies of data leakage (Target, Preprocessing, Temporal, Group)'
  - 'Recognize the classic symptoms of Target Leakage (e.g. suspiciously perfect ROC-AUC > 0.999)'
  - 'Audit feature tables for consequences of the target that will not exist at inference time'
  - 'Prevent Preprocessing Contamination by nesting scaling, imputation, and target encoding inside Pipelines'
  - 'Eliminate Temporal Lookahead Bias using Purged TimeSeriesSplit cross-validation'
  - 'Prevent Patient/Customer Group Contamination using GroupKFold cross-validation'
  - 'Build automated data leakage CI/CD test gates before production release'
prerequisites:
  - 'Day 167 -- Cross-Validation Done Right'
  - 'Day 173 -- scikit-learn Pipelines'
  - 'Day 176 -- Choosing the Right Metric'
