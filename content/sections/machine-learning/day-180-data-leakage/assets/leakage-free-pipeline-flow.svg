<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Leakage Free Pipeline Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-bad { fill: #7f1d1d; stroke: #ef4444; stroke-width: 2; rx: 8; }
    .box-good { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
    .wire-bad { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arrow-bad); }
    .wire-good { stroke: #10b981; stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 2s linear infinite; marker-end: url(#arrow-good); }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      .wire-good { animation: none !important; stroke-dasharray: none; }
    }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Pipeline Encapsulation: Leaky vs Leak-Free Architecture</text>
  <text x="450" y="65" class="text-sub">Why Cross-Validation Must Enclose All Feature Preprocessing Steps</text>

  <!-- Left: Contaminated Workflow -->
  <rect x="50" y="100" width="370" height="340" class="box-bad" />
  <text x="235" y="130" class="text-title" fill="#fecaca">The Leaky Procedural Script (Fatal)</text>

  <rect x="70" y="150" width="330" height="40" class="box" />
  <text x="235" y="175" class="text-sub">1. scaler.fit(full_df) -- LEAKS TEST STATISTICS</text>

  <rect x="70" y="210" width="330" height="40" class="box" />
  <text x="235" y="235" class="text-sub">2. smote.fit_resample(full_df) -- LEAKS LABELS</text>

  <rect x="70" y="270" width="330" height="40" class="box" />
  <text x="235" y="295" class="text-sub">3. X_train, X_test = train_test_split()</text>

  <rect x="70" y="330" width="330" height="40" class="box" />
  <text x="235" y="355" class="text-sub">4. model.fit(X_train); model.score(X_test)</text>

  <text x="235" y="415" class="text-sub" fill="#fca5a5">Result: High validation score, zero production accuracy!</text>

  <!-- Right: Leak-Free Pipeline Workflow -->
  <rect x="480" y="100" width="370" height="340" class="box-good" />
  <text x="665" y="130" class="text-title" fill="#a7f3d0">The Atomic Pipeline Architecture (Correct)</text>

  <rect x="500" y="150" width="330" height="40" class="box" />
  <text x="665" y="175" class="text-sub">1. X_train, X_test = train_test_split() (Clean Split)</text>

  <rect x="500" y="210" width="330" height="80" class="box-good" />
  <text x="665" y="235" class="text-title">Pipeline([('scaler', ...), ('clf', ...)])</text>
  <text x="665" y="260" class="text-sub">pipeline.fit(X_train) -- Learns only from Train</text>
  <text x="665" y="280" class="text-sub">pipeline.predict(X_test) -- Zero Contamination</text>

  <rect x="500" y="310" width="330" height="45" class="box" />
  <text x="665" y="338" class="text-sub">cross_val_score(pipeline, X_train, cv=5)</text>

  <text x="665" y="415" class="text-sub" fill="#a7f3d0">Result: Honest validation score, rock-solid production serving!</text>
</svg>
