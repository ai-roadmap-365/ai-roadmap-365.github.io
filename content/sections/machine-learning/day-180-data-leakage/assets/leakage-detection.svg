<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four checks.">
  <title>Detecting leakage</title>
  <style>
    .leakage-detection-bg   { fill: #f8fafc; }
    .leakage-detection-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-detection-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-detection-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-detection-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-detection-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-detection-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-detection-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-detection-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-detection-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-detection-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-detection-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-detection-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-detection-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-detection-stage { opacity: 1; }

    .leakage-detection-s0 { animation-delay: 0.00s; }
    .leakage-detection-e0 { animation-delay: 0.00s; }
    .leakage-detection-s1 { animation-delay: 1.28s; }
    .leakage-detection-e1 { animation-delay: 1.28s; }
    .leakage-detection-s2 { animation-delay: 2.56s; }
    .leakage-detection-e2 { animation-delay: 2.56s; }
    .leakage-detection-s3 { animation-delay: 3.84s; }
    .leakage-detection-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-detection-conn  { animation: leakage-detection-trace 6.4s ease-in-out infinite; }
      .leakage-detection-stage { animation: leakage-detection-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-detection-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-detection-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-detection-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-detection-stage { animation: leakage-detection-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-detection-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-detection-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-detection-bg" width="980" height="322"/>
  <text class="leakage-detection-h1"  x="30" y="40">Detecting leakage</text>
  <text class="leakage-detection-sub" x="30" y="64">Four checks.</text>
  <g class="leakage-detection-stage leakage-detection-s0">
    <rect class="leakage-detection-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-detection-step" x="44" y="142">01</text>
    <text class="leakage-detection-name" x="70" y="142">Be suspicious of implausibly good results</text>
    <text class="leakage-detection-desc" x="44" y="166">Which is the strongest single</text>
    <text class="leakage-detection-desc" x="44" y="182">signal.</text>
  </g>
  <line class="leakage-detection-line leakage-detection-conn leakage-detection-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-detection-tip)"/>
  <g class="leakage-detection-stage leakage-detection-s1">
    <rect class="leakage-detection-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-detection-step" x="280" y="142">02</text>
    <text class="leakage-detection-name" x="306" y="142">Inspect the top features by importance</text>
    <text class="leakage-detection-desc" x="280" y="166">A dominant, unexplainable</text>
    <text class="leakage-detection-desc" x="280" y="182">feature is usually a leak.</text>
  </g>
  <line class="leakage-detection-line leakage-detection-conn leakage-detection-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-detection-tip)"/>
  <g class="leakage-detection-stage leakage-detection-s2">
    <rect class="leakage-detection-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-detection-step" x="516" y="142">03</text>
    <text class="leakage-detection-name" x="542" y="142">Audit each feature's recording time</text>
    <text class="leakage-detection-desc" x="516" y="166">Against the moment of</text>
    <text class="leakage-detection-desc" x="516" y="182">prediction.</text>
  </g>
  <line class="leakage-detection-line leakage-detection-conn leakage-detection-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-detection-tip)"/>
  <g class="leakage-detection-stage leakage-detection-s3">
    <rect class="leakage-detection-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-detection-step" x="752" y="142">04</text>
    <text class="leakage-detection-name" x="778" y="142">And drop the suspect feature to see the effect</text>
    <text class="leakage-detection-desc" x="752" y="166">A collapse confirms it.</text>
  </g>
  <text class="leakage-detection-sub" x="30" y="304">Treating a surprisingly good result as a defect to investigate rather than a success to report is the habit that catches most of these before deployment.</text>
</svg>
