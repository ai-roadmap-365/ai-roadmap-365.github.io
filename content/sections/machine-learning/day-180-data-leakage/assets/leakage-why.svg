<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why leakage is the defining failure</title>
  <style>
    .leakage-why-bg   { fill: #f8fafc; }
    .leakage-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leakage-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leakage-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leakage-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leakage-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leakage-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leakage-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leakage-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .leakage-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .leakage-why-stage { opacity: 1; }

    .leakage-why-s0 { animation-delay: 0.00s; }
    .leakage-why-e0 { animation-delay: 0.00s; }
    .leakage-why-s1 { animation-delay: 1.28s; }
    .leakage-why-e1 { animation-delay: 1.28s; }
    .leakage-why-s2 { animation-delay: 2.56s; }
    .leakage-why-e2 { animation-delay: 2.56s; }
    .leakage-why-s3 { animation-delay: 3.84s; }
    .leakage-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .leakage-why-conn  { animation: leakage-why-trace 6.4s ease-in-out infinite; }
      .leakage-why-stage { animation: leakage-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes leakage-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes leakage-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .leakage-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .leakage-why-stage { animation: leakage-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes leakage-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="leakage-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="leakage-why-bg" width="980" height="322"/>
  <text class="leakage-why-h1"  x="30" y="40">Why leakage is the defining failure</text>
  <text class="leakage-why-sub" x="30" y="64">Four reasons.</text>
  <g class="leakage-why-stage leakage-why-s0">
    <rect class="leakage-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-why-step" x="44" y="142">01</text>
    <text class="leakage-why-name" x="70" y="142">It produces no error, warning or anomaly</text>
    <text class="leakage-why-desc" x="44" y="166">Every check passes.</text>
  </g>
  <line class="leakage-why-line leakage-why-conn leakage-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#leakage-why-tip)"/>
  <g class="leakage-why-stage leakage-why-s1">
    <rect class="leakage-why-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-why-step" x="280" y="142">02</text>
    <text class="leakage-why-name" x="306" y="142">And the resulting score is plausible or excellent</text>
    <text class="leakage-why-desc" x="280" y="166">So nobody investigates.</text>
  </g>
  <line class="leakage-why-line leakage-why-conn leakage-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#leakage-why-tip)"/>
  <g class="leakage-why-stage leakage-why-s2">
    <rect class="leakage-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-why-step" x="516" y="142">03</text>
    <text class="leakage-why-name" x="542" y="142">Detected only after deployment</text>
    <text class="leakage-why-desc" x="516" y="166">When live performance is</text>
    <text class="leakage-why-desc" x="516" y="182">compared to the promise.</text>
  </g>
  <line class="leakage-why-line leakage-why-conn leakage-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#leakage-why-tip)"/>
  <g class="leakage-why-stage leakage-why-s3">
    <rect class="leakage-why-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="leakage-why-step" x="752" y="142">04</text>
    <text class="leakage-why-name" x="778" y="142">By which point the commitment has been made</text>
    <text class="leakage-why-desc" x="752" y="166">Which is what makes it</text>
    <text class="leakage-why-desc" x="752" y="182">expensive.</text>
  </g>
  <text class="leakage-why-sub" x="30" y="304">Every property here works against detection, which is why the defence has to be structural — pipelines and correct splits — rather than a matter of care.</text>
</svg>
