<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Preprocessing contamination</title>
  <style>
    .preprocessing-leak-bg   { fill: #f8fafc; }
    .preprocessing-leak-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-leak-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-leak-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-leak-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-leak-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preprocessing-leak-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .preprocessing-leak-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .preprocessing-leak-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .preprocessing-leak-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .preprocessing-leak-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .preprocessing-leak-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .preprocessing-leak-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .preprocessing-leak-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .preprocessing-leak-stage { opacity: 1; }

    .preprocessing-leak-s0 { animation-delay: 0.00s; }
    .preprocessing-leak-e0 { animation-delay: 0.00s; }
    .preprocessing-leak-s1 { animation-delay: 1.28s; }
    .preprocessing-leak-e1 { animation-delay: 1.28s; }
    .preprocessing-leak-s2 { animation-delay: 2.56s; }
    .preprocessing-leak-e2 { animation-delay: 2.56s; }
    .preprocessing-leak-s3 { animation-delay: 3.84s; }
    .preprocessing-leak-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .preprocessing-leak-conn  { animation: preprocessing-leak-trace 6.4s ease-in-out infinite; }
      .preprocessing-leak-stage { animation: preprocessing-leak-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes preprocessing-leak-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes preprocessing-leak-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .preprocessing-leak-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .preprocessing-leak-stage { animation: preprocessing-leak-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes preprocessing-leak-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="preprocessing-leak-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="preprocessing-leak-bg" width="980" height="322"/>
  <text class="preprocessing-leak-h1"  x="30" y="40">Preprocessing contamination</text>
  <text class="preprocessing-leak-sub" x="30" y="64">Four steps.</text>
  <g class="preprocessing-leak-stage preprocessing-leak-s0">
    <rect class="preprocessing-leak-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-leak-step" x="44" y="142">01</text>
    <text class="preprocessing-leak-name" x="70" y="142">A transform is fitted on the whole dataset</text>
    <text class="preprocessing-leak-desc" x="44" y="166">Scaling, imputation, encoding,</text>
    <text class="preprocessing-leak-desc" x="44" y="182">selection.</text>
  </g>
  <line class="preprocessing-leak-line preprocessing-leak-conn preprocessing-leak-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#preprocessing-leak-tip)"/>
  <g class="preprocessing-leak-stage preprocessing-leak-s1">
    <rect class="preprocessing-leak-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-leak-step" x="280" y="142">02</text>
    <text class="preprocessing-leak-name" x="306" y="142">Its statistics include the validation rows</text>
    <text class="preprocessing-leak-desc" x="280" y="166">Which is information the model</text>
    <text class="preprocessing-leak-desc" x="280" y="182">should not have.</text>
  </g>
  <line class="preprocessing-leak-line preprocessing-leak-conn preprocessing-leak-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#preprocessing-leak-tip)"/>
  <g class="preprocessing-leak-stage preprocessing-leak-s2">
    <rect class="preprocessing-leak-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-leak-step" x="516" y="142">03</text>
    <text class="preprocessing-leak-name" x="542" y="142">The inflation is modest but real</text>
    <text class="preprocessing-leak-desc" x="516" y="166">Which makes it harder to notice</text>
    <text class="preprocessing-leak-desc" x="516" y="182">than target leakage.</text>
  </g>
  <line class="preprocessing-leak-line preprocessing-leak-conn preprocessing-leak-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#preprocessing-leak-tip)"/>
  <g class="preprocessing-leak-stage preprocessing-leak-s3">
    <rect class="preprocessing-leak-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="preprocessing-leak-step" x="752" y="142">04</text>
    <text class="preprocessing-leak-name" x="778" y="142">Fit inside the pipeline, per fold</text>
    <text class="preprocessing-leak-desc" x="752" y="166">Which makes it structurally</text>
    <text class="preprocessing-leak-desc" x="752" y="182">impossible.</text>
  </g>
  <text class="preprocessing-leak-sub" x="30" y="304">The modest size of the effect is what allows this one to survive review: it does not produce an implausible score, only a slightly optimistic one.</text>
</svg>
