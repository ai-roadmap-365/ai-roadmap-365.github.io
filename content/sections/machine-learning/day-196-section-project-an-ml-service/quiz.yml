questions:
  - question: 'In the complete end-to-end ML service architecture, what is the primary role of the Model Registry catalog?'
    options:
      - 'One source of truth for versioned artifacts and metadata'
      - 'Writing SQL queries on the customer database'
      - 'Generating HTML web pages for browser users'
      - 'Compiling the Python source code into machine bytecode'
    answer_index: 0
    explanation: 'The Model Registry decouples training from serving: it stores validated candidate artifacts with immutable cryptographic hashes and controls stage promotions.'
  - question: 'Why must feature preprocessing (e.g. StandardScaler or imputation) be bundled directly inside the serialized pipeline artifact rather than computed ad-hoc in the API handler?'
    options:
      - 'Because FastAPI cannot execute division'
      - 'To prevent train-serve skew in the scaling parameters'
      - 'To reduce Docker container image size'
      - 'Because NumPy arrays cannot be normalized in memory'
    answer_index: 1
    explanation: 'Bundling transformers inside the model artifact ensures identical preprocessing logic at training and serving time, preventing catastrophic train-serve feature skew.'
  - question: 'What happens when a live prediction request arrives with a feature value that triggers a Population Stability Index score of PSI = 0.35 over a 24-hour window?'
    options:
      - 'The model deletes all negative predictions'
      - 'The FastAPI server immediately shuts down'
      - 'It flags drift, alerts on-call, and queues a retrain'
      - 'The database drops all customer records'
    answer_index: 2
    explanation: 'PSI >= 0.20 indicates substantial population shift: the monitor triggers operational alerts and queues the drifted dataset for model retraining.'
  - question: 'What is the primary benefit of testing your ML microservice using an automated end-to-end pytest suite prior to production deployment?'
    options:
      - 'It automatically writes documentation'
      - 'It eliminates the need for any cloud compute resources'
      - 'It guarantees 100% test dataset accuracy'
      - 'It validates the whole lifecycle under simulated traffic'
    answer_index: 3
    explanation: 'End-to-end testing verifies the integration between web schemas, tensor math, error fallbacks, and monitoring hooks, catching regressions before deployment.'
  - question: 'As Course 04 concludes, what foundational transition occurs as we enter Course 05: Deep Learning?'
    options:
      - 'From classical tabular models to representation learning'
      - 'Stopping the use of Python and switching to C'
      - 'Abandoning all testing and monitoring practices'
      - 'Switching from mathematics to pure guesswork'
    answer_index: 0
    explanation: 'Course 05 builds upon classical ML foundations, introducing deep representation learning, tensor autograd, backpropagation, and neural architectures.'
