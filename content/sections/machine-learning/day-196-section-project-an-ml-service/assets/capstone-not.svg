<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What the project is not</title>
  <style>
    .capstone-not-bg   { fill: #f8fafc; }
    .capstone-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capstone-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .capstone-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .capstone-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .capstone-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .capstone-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .capstone-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capstone-not-row { opacity: 1; }
    .capstone-not-r0 { animation-delay: 0.00s; }
    .capstone-not-r1 { animation-delay: 0.45s; }
    .capstone-not-r2 { animation-delay: 0.90s; }
    .capstone-not-r3 { animation-delay: 1.35s; }
    .capstone-not-r4 { animation-delay: 1.80s; }
    .capstone-not-row { animation: capstone-not-reveal 7.3s ease-in-out infinite; }
    @keyframes capstone-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="capstone-not-bg" width="980" height="390"/>
  <text class="capstone-not-h1"  x="30" y="40">What the project is not</text>
  <text class="capstone-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="capstone-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="capstone-not-name" x="46" y="122">The misconception</text>
  <text class="capstone-not-desc" x="46" y="142">Commonly held.</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r0" x="46" y="182">The goal is the highest accuracy</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r1" x="46" y="216">A working notebook is the deliverable</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r2" x="46" y="250">Serving is the last step</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r3" x="46" y="284">It demonstrates modelling skill</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r4" x="46" y="318">Completion means it runs</text>
  <rect class="capstone-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="capstone-not-name" x="526" y="122">What is true</text>
  <text class="capstone-not-desc" x="526" y="142">Actually.</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r0" x="526" y="182">The goal is a defensible, operable service</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r1" x="526" y="216">The pipeline, artefact and docs are</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r2" x="526" y="250">Monitoring comes after it</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r3" x="526" y="284">It demonstrates engineering discipline</text>
  <text class="capstone-not-desc capstone-not-row capstone-not-r4" x="526" y="318">Completion means someone else can run it</text>
  <text class="capstone-not-sub" x="30" y="372">Accuracy being secondary is deliberate here: a slightly worse model that is reproducible, monitored and documented is more valuable than a better one that is none of those.</text>
</svg>
