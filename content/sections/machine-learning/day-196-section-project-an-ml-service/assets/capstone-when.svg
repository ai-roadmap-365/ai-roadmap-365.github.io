<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a simpler delivery fits.">
  <title>When to build the full service</title>
  <style>
    .capstone-when-bg   { fill: #f8fafc; }
    .capstone-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .capstone-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capstone-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .capstone-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .capstone-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .capstone-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .capstone-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .capstone-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .capstone-when-row { opacity: 1; }
    .capstone-when-r0 { animation-delay: 0.00s; }
    .capstone-when-r1 { animation-delay: 0.45s; }
    .capstone-when-r2 { animation-delay: 0.90s; }
    .capstone-when-r3 { animation-delay: 1.35s; }
    .capstone-when-r4 { animation-delay: 1.80s; }
    .capstone-when-row { animation: capstone-when-reveal 7.3s ease-in-out infinite; }
    @keyframes capstone-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="capstone-when-bg" width="980" height="390"/>
  <text class="capstone-when-h1"  x="30" y="40">When to build the full service</text>
  <text class="capstone-when-sub" x="30" y="64">And when a simpler delivery fits.</text>
  <rect class="capstone-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="capstone-when-name" x="46" y="122">Build the service</text>
  <text class="capstone-when-desc" x="46" y="142">Four signals.</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r0" x="46" y="182">Predictions needed repeatedly and on demand</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r1" x="46" y="216">The model will run for a year or more</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r2" x="46" y="250">Several consumers depend on it</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r3" x="46" y="284">Regulated or audited use</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r4" x="46" y="318">Where retraining will be needed</text>
  <rect class="capstone-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="capstone-when-name" x="526" y="122">Something simpler</text>
  <text class="capstone-when-desc" x="526" y="142">Also four.</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r0" x="526" y="182">A one-off question answered once</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r1" x="526" y="216">A nightly batch table would do</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r2" x="526" y="250">A single consumer who can run the script</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r3" x="526" y="284">Feasibility work</text>
  <text class="capstone-when-desc capstone-when-row capstone-when-r4" x="526" y="318">Where nobody will maintain a service</text>
  <text class="capstone-when-sub" x="30" y="372">The batch table is the option to check first: where predictions are not needed within the hour, it delivers the value with none of the availability commitment.</text>
</svg>
