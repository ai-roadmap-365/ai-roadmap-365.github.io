terms:
  - term: 'Deployed ML Service'
    definition: 'A complete, production-grade microservice exposing a trained model over a REST API with schema validation and drift monitoring.'
  - term: 'Train-Serve Skew'
    definition: 'A discrepancy in performance or data processing between how a model was trained and how it executes in live production.'
  - term: 'End-to-End Pipeline'
    definition: 'A unified engineering workflow connecting data ingestion, feature transformation, training, registration, serving, and monitoring.'
  - term: 'Artifact Provenance'
    definition: 'The immutable cryptographic audit trail linking a deployed binary to its exact dataset hash, code commit SHA, and metrics.'
  - term: 'Graceful Degradation'
    definition: 'The system design principle ensuring that when a component fails, the service falls back to safe heuristics rather than crashing.'
  - term: 'Representation Learning'
    definition: 'A branch of machine learning where algorithms automatically discover optimal feature representations from raw input tensors.'
  - term: 'Course 04 Capstone'
    definition: 'The culminating project demonstrating mastery of classical machine learning algorithms, unsupervised representations, and MLOps.'
  - term: 'Deep Learning Transition'
    definition: 'The pedagogical advancement from classical tabular ML to gradient-based neural networks and PyTorch tensor computing.'
