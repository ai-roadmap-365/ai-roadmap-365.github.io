questions:
  - question: 'According to extensive empirical benchmarks (Gorishniy et al. 2021; Grinsztajn et al. 2022), why do Tree Ensembles (GBDT) consistently outperform Deep Neural Networks on tabular data?'
    options:
      - 'Because GPUs cannot process tabular data'
      - 'Tabular data lacks spatial invariance and is heterogeneous'
      - 'Because neural networks can only process images and text'
      - 'Because tabular datasets have too many rows for neural networks'
    answer_index: 1
    explanation: 'Deep learning thrives on smooth, rotationally invariant manifolds (images/audio). Tabular data has sharp axis-aligned step functions, extreme feature scale disparities, and uninformative features, where decision trees have the exact correct inductive bias.'

  - question: 'What is the critical rule when constructing the Level-1 meta-feature training matrix Z for Stacking Ensembles?'
    options:
      - 'Matrix Z must be normalized using PCA'
      - 'Matrix Z must contain raw continuous features only'
      - 'The predictions must be strictly out-of-fold'
      - 'All base models must be identical'
    answer_index: 2
    explanation: 'If you train base models on all data and predict on all data, predictions are overfitted and overconfident. The meta-learner will learn to trust overfitted confidence, causing catastrophic failure on test data. Out-of-fold predictions replicate true test-set uncertainty.'

  - question: 'What type of model is recommended as the Level-1 Meta-Learner in a Stacking Ensemble?'
    options:
      - 'A k-Nearest Neighbors classifier'
      - 'A 100-layer Deep Neural Network'
      - 'An unconstrained Decision Tree of depth 50'
      - 'A strongly regularized linear model'
    answer_index: 3
    explanation: 'Because Level-0 features are high-level probability predictions (typically 3 to 10 columns), a regularized linear meta-learner prevents meta-overfitting while finding optimal blending weights.'

  - question: 'What is the difference between Stacking and Blending?'
    options:
      - 'Stacking uses K-fold OOF; blending holds out one split'
      - 'Stacking is for classification; Blending is for regression'
      - 'Stacking uses neural networks; Blending uses decision trees'
      - 'There is no difference'
    answer_index: 0
    explanation: 'Stacking uses all training data via K-fold OOF generation. Blending uses a single holdout set, which is computationally faster but data-inefficient on small datasets.'

  - question: 'How does Permutation Feature Importance measure the significance of a feature column?'
    options:
      - 'By counting the number of times the feature appears in the source code'
      - 'Shuffle that column and measure the drop in the metric'
      - 'By computing the correlation coefficient with the target'
      - 'By calculating the gradient of the feature'
    answer_index: 1
    explanation: 'Permutation importance is model-agnostic: shuffling feature j breaks its predictive signal; if model accuracy collapses, feature j was highly important.'

  - question: 'What mathematical property makes TreeSHAP (Lundberg et al. 2020) superior to standard feature importance heuristics (Gini gain or split count)?'
    options:
      - 'TreeSHAP does not require training trees'
      - 'TreeSHAP runs in O(1) constant time'
      - 'Consistency and local accuracy'
      - 'TreeSHAP replaces cross-validation'
    answer_index: 2
    explanation: 'Traditional Gini gain suffers from inconsistency (a feature can become more important in the true model but receive lower Gini gain). TreeSHAP provides theoretically sound, consistent local and global explanations.'

  - question: 'Why is Model Diversity the single most important requirement for successful ensemble stacking?'
    options:
      - 'Diverse models eliminate the need for cross-validation'
      - 'Diverse models run faster on GPUs'
      - 'Diverse models require less memory'
      - 'Models with uncorrelated errors cancel failures'
    answer_index: 3
    explanation: 'Ensemble theory proves that the error of an ensemble decreases as the correlation between individual model errors decreases. Maximum diversity (trees + linear + neural) maximizes performance.'

  - question: 'What is Rank Averaging, and when should it be used instead of simple probability averaging?'
    options:
      - 'Averaging percentile ranks, not probabilities'
      - 'A method for ranking features by importance'
      - 'A sorting algorithm for decision tree leaves'
      - 'A technique for pruning trees'
    answer_index: 0
    explanation: 'When one model outputs probabilities clustered in [0.01, 0.05] and another in [0.2, 0.8], simple averaging gives unfair weight to the wider model. Rank averaging standardizes outputs to uniform percentile ranks.'
