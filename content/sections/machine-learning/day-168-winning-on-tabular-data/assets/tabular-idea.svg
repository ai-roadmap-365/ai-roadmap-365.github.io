<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four reasons.">
  <title>Why tabular is its own discipline</title>
  <style>
    .tabular-idea-bg   { fill: #f8fafc; }
    .tabular-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tabular-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tabular-idea-stage { opacity: 1; }

    .tabular-idea-s0 { animation-delay: 0.00s; }
    .tabular-idea-e0 { animation-delay: 0.00s; }
    .tabular-idea-s1 { animation-delay: 1.28s; }
    .tabular-idea-e1 { animation-delay: 1.28s; }
    .tabular-idea-s2 { animation-delay: 2.56s; }
    .tabular-idea-e2 { animation-delay: 2.56s; }
    .tabular-idea-s3 { animation-delay: 3.84s; }
    .tabular-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tabular-idea-conn  { animation: tabular-idea-trace 6.4s ease-in-out infinite; }
      .tabular-idea-stage { animation: tabular-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tabular-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tabular-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tabular-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tabular-idea-stage { animation: tabular-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tabular-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tabular-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tabular-idea-bg" width="980" height="322"/>
  <text class="tabular-idea-h1"  x="30" y="40">Why tabular is its own discipline</text>
  <text class="tabular-idea-sub" x="30" y="64">Four reasons.</text>
  <g class="tabular-idea-stage tabular-idea-s0">
    <rect class="tabular-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-idea-step" x="44" y="142">01</text>
    <text class="tabular-idea-name" x="70" y="142">Features are heterogeneous</text>
    <text class="tabular-idea-desc" x="44" y="166">Age, income, category, date.</text>
    <text class="tabular-idea-desc" x="44" y="182">Different units and types.</text>
  </g>
  <line class="tabular-idea-line tabular-idea-conn tabular-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tabular-idea-tip)"/>
  <g class="tabular-idea-stage tabular-idea-s1">
    <rect class="tabular-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-idea-step" x="280" y="142">02</text>
    <text class="tabular-idea-name" x="306" y="142">With no spatial or sequential structure</text>
    <text class="tabular-idea-desc" x="280" y="166">Column order carries no meaning.</text>
  </g>
  <line class="tabular-idea-line tabular-idea-conn tabular-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tabular-idea-tip)"/>
  <g class="tabular-idea-stage tabular-idea-s2">
    <rect class="tabular-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-idea-step" x="516" y="142">03</text>
    <text class="tabular-idea-name" x="542" y="142">So the inductive biases that help networks do not apply</text>
    <text class="tabular-idea-desc" x="516" y="166">There is nothing for convolution</text>
    <text class="tabular-idea-desc" x="516" y="182">or attention to exploit.</text>
  </g>
  <line class="tabular-idea-line tabular-idea-conn tabular-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tabular-idea-tip)"/>
  <g class="tabular-idea-stage tabular-idea-s3">
    <rect class="tabular-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tabular-idea-step" x="752" y="142">04</text>
    <text class="tabular-idea-name" x="778" y="142">And datasets are usually small</text>
    <text class="tabular-idea-desc" x="752" y="166">Thousands of rows, not millions.</text>
  </g>
  <text class="tabular-idea-sub" x="30" y="304">The absence of exploitable structure is why deep learning has no advantage here: its architectures encode assumptions that tabular data simply does not satisfy.</text>
</svg>
