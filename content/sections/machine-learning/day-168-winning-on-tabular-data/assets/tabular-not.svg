<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What the tabular playbook is not</title>
  <style>
    .tabular-not-bg   { fill: #f8fafc; }
    .tabular-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-not-row { opacity: 1; }
    .tabular-not-r0 { animation-delay: 0.00s; }
    .tabular-not-r1 { animation-delay: 0.45s; }
    .tabular-not-r2 { animation-delay: 0.90s; }
    .tabular-not-r3 { animation-delay: 1.35s; }
    .tabular-not-r4 { animation-delay: 1.80s; }
    .tabular-not-row { animation: tabular-not-reveal 7.3s ease-in-out infinite; }
    @keyframes tabular-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tabular-not-bg" width="980" height="390"/>
  <text class="tabular-not-h1"  x="30" y="40">What the tabular playbook is not</text>
  <text class="tabular-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="tabular-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tabular-not-name" x="46" y="122">The misconception</text>
  <text class="tabular-not-desc" x="46" y="142">Commonly held.</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r0" x="46" y="182">Deep learning is better if you try hard enough</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r1" x="46" y="216">The model choice is the main decision</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r2" x="46" y="250">Attribution values show causation</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r3" x="46" y="284">Stacking always helps</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r4" x="46" y="318">More features are better</text>
  <rect class="tabular-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tabular-not-name" x="526" y="122">What is true</text>
  <text class="tabular-not-desc" x="526" y="142">Actually.</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r0" x="526" y="182">Boosted trees still win on most tabular benchmarks</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r1" x="526" y="216">Features and validation matter more</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r2" x="526" y="250">They show the model's use of a feature</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r3" x="526" y="284">Only with genuinely diverse base models</text>
  <text class="tabular-not-desc tabular-not-row tabular-not-r4" x="526" y="318">Irrelevant features add variance</text>
  <text class="tabular-not-sub" x="30" y="372">The causation point recurs in every explainability discussion and matters legally: an attribution is a statement about the model, never about the world.</text>
</svg>
