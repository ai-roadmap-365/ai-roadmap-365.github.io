<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to stop early.">
  <title>When to use the full playbook</title>
  <style>
    .tabular-when-bg   { fill: #f8fafc; }
    .tabular-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tabular-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tabular-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tabular-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tabular-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tabular-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tabular-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tabular-when-row { opacity: 1; }
    .tabular-when-r0 { animation-delay: 0.00s; }
    .tabular-when-r1 { animation-delay: 0.45s; }
    .tabular-when-r2 { animation-delay: 0.90s; }
    .tabular-when-r3 { animation-delay: 1.35s; }
    .tabular-when-r4 { animation-delay: 1.80s; }
    .tabular-when-row { animation: tabular-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tabular-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tabular-when-bg" width="980" height="390"/>
  <text class="tabular-when-h1"  x="30" y="40">When to use the full playbook</text>
  <text class="tabular-when-sub" x="30" y="64">And when to stop early.</text>
  <rect class="tabular-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tabular-when-name" x="46" y="122">Full playbook</text>
  <text class="tabular-when-desc" x="46" y="142">Four signals.</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r0" x="46" y="182">Accuracy has real business value</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r1" x="46" y="216">A competition or benchmark</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r2" x="46" y="250">The model will run for years</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r3" x="46" y="284">Where explanations are required</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r4" x="46" y="318">And the data is genuinely tabular</text>
  <rect class="tabular-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tabular-when-name" x="526" y="122">Stop earlier</text>
  <text class="tabular-when-desc" x="526" y="142">Also four.</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r0" x="526" y="182">A default boosted model already meets the target</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r1" x="526" y="216">Exploratory feasibility work</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r2" x="526" y="250">Where the margin is not worth the maintenance</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r3" x="526" y="284">Very small datasets</text>
  <text class="tabular-when-desc tabular-when-row tabular-when-r4" x="526" y="318">Stacking rarely repays its complexity</text>
  <text class="tabular-when-sub" x="30" y="372">Stacking is the step to stop before most often: it adds real operational complexity for a gain that is usually a fraction of a percent.</text>
</svg>
