terms:
  - term: 'Tabular Data'
    definition: 'Structured data organized in rows (records) and columns (features) with heterogeneous data types, representing the dominant data modality in business and industry.'
  - term: 'Stacking (Stacked Generalization)'
    definition: 'An ensemble machine learning technique where multiple base models generate out-of-fold predictions, which serve as features for a higher-level meta-learner.'
  - term: 'Out-of-Fold (OOF) Predictions'
    definition: 'Predictions generated on validation folds during cross-validation, creating a leak-free meta-dataset representing true model generalization.'
  - term: 'Meta-Learner'
    definition: 'The top-level model (often a regularized linear estimator) in a stacking ensemble trained to combine the predictions of base models.'
  - term: 'Blending'
    definition: 'A simplified ensembling method that trains the meta-learner on a single holdout validation split rather than full out-of-fold cross-validation.'
  - term: 'Rank Averaging'
    definition: 'An ensembling strategy where predicted probabilities are converted to fractional ranks before averaging, neutralizing calibration disparities for rank-based metrics (ROC-AUC).'
  - term: 'Permutation Feature Importance'
    definition: 'A model-agnostic feature evaluation technique that measures the performance decrease after randomly shuffling the values of a specific feature column.'
  - term: 'SHAP (SHapley Additive exPlanations)'
    definition: 'A unified framework based on cooperative game theory that assigns each feature an exact additive attribution score for individual model predictions.'
  - term: 'TreeSHAP'
    definition: 'A fast, exact polynomial-time algorithm for computing Shapley values for tree-based ensemble models.'
  - term: 'Model Diversity'
    definition: 'The degree of statistical independence between the prediction errors of base models in an ensemble, serving as the primary driver of ensembling success.'
