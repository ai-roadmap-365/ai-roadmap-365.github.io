sources:
  - title: Why Do Tree-Based Models Still Outperform Deep Learning on Typical Tabular Data?
    url: >-
      https://proceedings.neurips.cc/paper_files/paper/2022/hash/0378c7692da36807bdec87ab043cdadc-Abstract-Datasets_and_Benchmarks.html
    publisher: NeurIPS (Leo Grinsztajn, Edouard Oyallon, Gael Varoquaux)
    accessed: '2026-08-29'
    year: 2022
    description: >-
      Comprehensive benchmark proving tree-based models outperform neural networks across 45 tabular datasets
      due to coordinate-aligned decision boundaries.
  - title: Revisiting Deep Learning Models for Tabular Data
    url: https://arxiv.org/abs/2106.11959
    publisher: NeurIPS (Yury Gorishniy, Ivan Rubachev, Valentin Khrulkov, Artem Babenko)
    accessed: '2026-08-31'
    year: 2021
    description: >-
      Extensive evaluation showing tuned XGBoost and CatBoost outperform tabular neural architectures (ResNet,
      TabNet, FT-Transformer).
  - title: From Local Explanations to Global Understanding with Explainable AI for Trees
    url: https://www.nature.com/articles/s42256-019-0138-9
    publisher: Nature Machine Intelligence (Scott M. Lundberg et al.)
    accessed: '2026-08-29'
    year: 2020
    description: >-
      Introduced the TreeSHAP algorithm for exact polynomial-time computation of Shapley values for tree
      ensembles.
