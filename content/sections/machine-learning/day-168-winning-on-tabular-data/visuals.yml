visuals:
  - id: tabular-master-playbook
    file: assets/tabular-master-playbook.svg
    type: diagram
    title: 'The Tabular Master Playbook: 8-Phase Machine Learning Lifecycle'
    alt: 'Architecture diagram showing the 8 phases of winning on tabular data: Validation, EDA, Baseline, Trees, Feature Engineering, Tuning, Stacking, and Explainability.'
    description: 'A static architecture diagram illustrating the end-to-end engineering lifecycle for structured tabular datasets.'
  - id: stacking-ensemble-architecture
    file: assets/stacking-ensemble-architecture.svg
    type: flow-animated
    title: 'Multi-Model Stacking Ensemble Architecture'
    alt: 'Animated flow chart showing Level-0 base model training, out-of-fold prediction matrix generation, Level-1 meta-learner fitting, and test inference.'
    description: 'An animated flow chart showing the leak-free generation of out-of-fold meta-features and two-level stacking prediction.'
  - id: tabular-lifecycle
    file: assets/tabular-lifecycle.svg
    type: diagram
    title: 'The tabular playbook'
    alt: 'Diagram: the six decisive phases of a tabular machine learning project'
    description: 'A six-stage description of the tabular lifecycle covering understanding, validation design, baselines, feature engineering, model selection and ensembling.'
  - id: stacking
    file: assets/stacking.svg
    type: diagram
    title: 'Stacking'
    alt: 'Diagram: how a meta-model learns to combine several base models'
    description: 'A four-stage description of stacking covering base models, out-of-fold predictions, the meta-model and the leakage rule.'
  - id: shap
    file: assets/shap.svg
    type: diagram
    title: 'Attributing a prediction'
    alt: 'Diagram: how a prediction is attributed across its input features'
    description: 'A four-stage description of prediction attribution covering the baseline, marginal contributions, the fair allocation and the guarantee.'
  - id: tabular-not
    file: assets/tabular-not.svg
    type: diagram
    title: 'What the tabular playbook is not'
    alt: 'Diagram: four misconceptions about tabular machine learning'
    description: 'A two-column comparison of misconceptions about tabular modelling against what is true.'
  - id: tabular-idea
    file: assets/tabular-idea.svg
    type: diagram
    title: 'Why tabular is its own discipline'
    alt: 'Diagram: the four properties that make tabular data different from images and text'
    description: 'A four-stage description of tabular data covering heterogeneous features, the absence of structure, feature meaning and dataset size.'
  - id: tabular-features
    file: assets/tabular-features.svg
    type: diagram
    title: 'Where tabular gains come from'
    alt: 'Diagram: the four categories of engineered feature that improve tabular models'
    description: 'A four-stage description of feature engineering covering aggregations, ratios, time features and domain terms.'
  - id: tabular-history
    file: assets/tabular-history.svg
    type: diagram
    title: 'Four steps in tabular practice'
    alt: 'Diagram: the historical progression of tabular modelling practice'
    description: 'A four-stage description of tabular history covering linear models, tree ensembles, the deep learning challenge and the current consensus.'
  - id: assembling-a-case
    file: assets/assembling-a-case.svg
    type: diagram
    title: 'Combining independent opinions'
    alt: 'Diagram: consulting similar advisers compared with consulting different ones'
    description: 'A two-column comparison of consulting similar advisers against genuinely different ones.'
  - id: tabular-implications
    file: assets/tabular-implications.svg
    type: diagram
    title: 'Four consequences of tabular practice'
    alt: 'Diagram: the accuracy, effort, explainability and drift implications of tabular modelling'
    description: 'A four-stage description of tabular implications covering accuracy sources, effort allocation, explainability and data drift.'
  - id: tabular-when
    file: assets/tabular-when.svg
    type: diagram
    title: 'When to use the full playbook'
    alt: 'Diagram: when the complete tabular playbook is warranted'
    description: 'A two-column comparison of situations requiring the full playbook against lighter approaches.'
