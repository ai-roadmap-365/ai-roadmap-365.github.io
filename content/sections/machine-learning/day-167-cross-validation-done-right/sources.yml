sources:
  - title: 'A Study of Cross-Validation and Bootstrap for Accuracy Estimation and Model Selection'
    url: 'https://dl.acm.org/doi/10.5555/1643031.1643047'
    publisher: 'IJCAI (Ron Kohavi)'
    accessed: '2026-08-29'
    year: 1995
    description: 'Foundational empirical study comparing stratified vs regular cross-validation, establishing 10-fold stratified CV as the gold standard.'
  - title: 'Overfitting in Model Selection and Subsequent Selection Bias in Performance Evaluation'
    url: 'https://doi.org/10.1007/s10994-006-8197-2'
    publisher: 'Machine Learning (Gavin C. Cawley and Nicola L. C. Talbot)'
    accessed: '2026-08-29'
    year: 2010
    description: 'Proved the mathematical necessity of Nested Cross-Validation to eliminate model selection bias in machine learning evaluation.'
  - title: 'The Elements of Statistical Learning (Chapter 7: Model Assessment and Selection)'
    url: 'https://hastie.su.domains/ElemStatLearn/'
    publisher: 'Springer (Hastie, Tibshirani, Friedman)'
    accessed: '2026-08-29'
    year: 2009
    description: 'Comprehensive mathematical derivation of K-Fold, optimism of training error, effective number of parameters, and validation leakage.'
