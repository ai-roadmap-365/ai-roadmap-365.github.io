questions:
  - question: 'Why is standard K-Fold cross-validation dangerous when evaluating a model on an imbalanced dataset (e.g. 98% Negative, 2% Positive)?'
    options:
      - 'Random splitting can produce validation folds that contain zero positive instances or wildly distorted class ratios, causing massive metric variance and unstable evaluation'
      - 'Standard K-Fold is computationally too slow for imbalanced data'
      - 'Standard K-Fold only works on regression tasks'
      - 'Standard K-Fold requires GPU memory'
    answer_index: 0
    explanation: 'Random sampling does not guarantee class representation. Stratified K-Fold splits within each class distribution, guaranteeing that every fold contains exactly 2% positive samples.'

  - question: 'What is Group K-Fold, and when is it strictly mandatory?'
    options:
      - 'A cross-validation scheme where all records belonging to the same entity (e.g. multiple medical images from the same patient, or multiple transactions from the same user) are strictly assigned to either the training fold or the validation fold, never both'
      - 'A scheme that groups features together by correlation'
      - 'A method for clustering unsupervised data'
      - 'A technique that combines classification and regression models'
    answer_index: 0
    explanation: 'When multiple rows originate from the same subject, a model can memorize subject-specific idiosyncrasies rather than the true signal. Group K-Fold tests if the model generalizes to completely unseen entities.'

  - question: 'Why must you NEVER shuffle data when evaluating a Time-Series forecasting model?'
    options:
      - 'Shuffling creates "lookahead leakage": training on future timestamps to predict past timestamps violates temporal causality and produces artificially inflated, unrealistic validation scores'
      - 'Shuffling causes division by zero in gradient descent'
      - 'Shuffling converts time stamps into strings'
      - 'Time-series models cannot process shuffled arrays'
    answer_index: 0
    explanation: 'In the real world, you only predict the future using historical observations. Rolling-origin or expanding-window TimeSeriesSplit ensures training data strictly precedes validation data in time.'

  - question: 'What is Nested Cross-Validation (Double CV), and why is it used?'
    options:
      - 'An outer CV loop evaluates unbiased generalization performance, while an inner CV loop selects optimal hyperparameters on the outer training split only; this prevents hyperparameter optimization from leaking validation information'
      - 'A method that runs 100 cross-validation folds simultaneously'
      - 'A technique for training neural networks inside decision trees'
      - 'A way to combine multiple datasets'
    answer_index: 0
    explanation: 'If you report the best validation score achieved during hyperparameter tuning, that score is optimistically biased because the hyperparameters were chosen to maximize that specific fold. Nested CV provides an unbiased generalization estimate.'

  - question: 'If you standardize features using StandardScaler() on the entire dataset BEFORE splitting into cross-validation folds, what fatal error have you committed?'
    options:
      - 'Preprocessing Data Leakage: the global mean and standard deviation of the validation set leaked into the training folds, giving the model subtle clues about the test distribution'
      - 'Underfitting'
      - 'High variance error'
      - 'Syntax error'
    answer_index: 0
    explanation: 'Any preprocessing (scaling, imputation, target encoding, feature selection) must be fitted strictly on the training fold and applied to the validation fold. Fitting before splitting is a classic data leakage failure mode.'

  - question: 'What is the Bias-Variance trade-off when choosing the number of folds k in K-Fold Cross-Validation (e.g. k=5 vs k=10 vs Leave-One-Out)?'
    options:
      - 'Smaller k (e.g. k=5) trains on less data per fold (higher bias) but folds have less overlap (lower variance of the CV estimate); larger k (Leave-One-Out) has nearly unbiased estimates of the full dataset, but training sets are almost identical, leading to higher variance among fold models'
      - 'k=5 has higher compute cost than Leave-One-Out'
      - 'k=10 always has 100% accuracy'
      - 'There is no trade-off; k=2 is always optimal'
    answer_index: 0
    explanation: 'Empirical statistical theory (Kohavi, 1995; Hastie et al., 2009) established that 5-fold or 10-fold cross-validation offers the optimal compromise between computational cost, bias, and variance.'

  - question: 'What is Repeated K-Fold Cross-Validation?'
    options:
      - 'Running standard K-Fold CV multiple times (e.g. 5 repeats of 10-fold CV = 50 total evaluations), with different random shuffles for each repeat, and averaging all fold scores to reduce estimator variance'
      - 'Training the same model 10 times on the full dataset'
      - 'Repeating failed cross-validation runs'
      - 'A technique for infinite datasets'
    answer_index: 0
    explanation: 'On small or noisy datasets, a single 10-fold split can have lucky or unlucky fold partitions. Repeated K-Fold averages across multiple random partitionings to yield a rock-solid performance estimate.'

  - question: 'How do scikit-learn Pipelines guarantee zero data leakage during cross-validation?'
    options:
      - 'When passed to cross_val_score, the Pipeline automatically fits all preprocessing transformers strictly on the training fold and transforms the validation fold during evaluation'
      - 'Pipelines encrypt the test data'
      - 'Pipelines disable feature scaling'
      - 'Pipelines only accept integer inputs'
    answer_index: 0
    explanation: 'A Pipeline encapsulates transformers and estimators into a single atomic object, ensuring that transformer fit() is called ONLY on training folds inside cross-validation splits.'
