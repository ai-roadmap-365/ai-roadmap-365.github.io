terms:
  - term: 'Cross-Validation'
    definition: 'A statistical resampling procedure used to evaluate machine learning models on a limited data sample by partitioning data into complementary subsets.'
  - term: 'Stratified K-Fold'
    definition: 'A cross-validation variation where folds are selected so that the mean target value (or class proportion) is approximately equal across all folds.'
  - term: 'Group K-Fold'
    definition: 'A cross-validation split that ensures no group (patient, user, physical device) is represented in both the training and testing sets of any fold.'
  - term: 'Time Series Split (Rolling-Origin)'
    definition: 'A temporal cross-validation scheme where training observations strictly precede validation observations in chronological order, typically via expanding windows.'
  - term: 'Nested Cross-Validation'
    definition: 'A hierarchical validation framework with an outer loop estimating model generalization error and an inner loop performing hyperparameter tuning.'
  - term: 'Data Leakage'
    definition: 'The inadvertent introduction of information about the target or validation set into the model training pipeline, creating deceptively high validation scores.'
  - term: 'Leave-One-Out (LOOCV)'
    definition: 'An extreme form of K-Fold where k = N, training on N-1 instances and testing on the single remaining instance.'
  - term: 'Repeated K-Fold'
    definition: 'Executing K-Fold cross-validation n times with different random partitions and averaging all scores to reduce the variance of the performance estimate.'
  - term: 'Lookahead Bias'
    definition: 'A temporal data leakage error where information from future timestamps is inadvertently used to train a model predicting past or present events.'
  - term: 'scikit-learn Pipeline'
    definition: 'A utility that chains data transformers and an estimator into a single object, enforcing leak-free fit and transform execution across cross-validation folds.'
