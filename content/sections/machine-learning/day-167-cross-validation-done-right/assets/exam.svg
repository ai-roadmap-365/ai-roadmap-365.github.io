<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Questions the student has not seen.">
  <title>Setting an exam</title>
  <style>
    .exam-bg   { fill: #f8fafc; }
    .exam-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exam-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exam-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exam-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exam-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exam-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-row { opacity: 1; }
    .exam-r0 { animation-delay: 0.00s; }
    .exam-r1 { animation-delay: 0.45s; }
    .exam-r2 { animation-delay: 0.90s; }
    .exam-r3 { animation-delay: 1.35s; }
    .exam-r4 { animation-delay: 1.80s; }
    .exam-row { animation: exam-reveal 7.3s ease-in-out infinite; }
    @keyframes exam-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exam-bg" width="980" height="390"/>
  <text class="exam-h1"  x="30" y="40">Setting an exam</text>
  <text class="exam-sub" x="30" y="64">Questions the student has not seen.</text>
  <rect class="exam-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exam-name" x="46" y="122">Questions already studied</text>
  <text class="exam-desc" x="46" y="142">Measures recall.</text>
  <text class="exam-desc exam-row exam-r0" x="46" y="182">The student has seen these exact questions</text>
  <text class="exam-desc exam-row exam-r1" x="46" y="216">High marks, regardless of understanding</text>
  <text class="exam-desc exam-row exam-r2" x="46" y="250">Tells you nothing about new problems</text>
  <text class="exam-desc exam-row exam-r3" x="46" y="284">Easy to set</text>
  <text class="exam-desc exam-row exam-r4" x="46" y="318">This is validating on training data</text>
  <rect class="exam-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exam-name" x="526" y="122">Unseen questions</text>
  <text class="exam-desc" x="526" y="142">Measures understanding.</text>
  <text class="exam-desc exam-row exam-r0" x="526" y="182">Same material, different questions</text>
  <text class="exam-desc exam-row exam-r1" x="526" y="216">Marks reflect genuine capability</text>
  <text class="exam-desc exam-row exam-r2" x="526" y="250">Predicts performance on new problems</text>
  <text class="exam-desc exam-row exam-r3" x="526" y="284">Harder to set fairly</text>
  <text class="exam-desc exam-row exam-r4" x="526" y="318">This is proper cross-validation</text>
  <text class="exam-sub" x="30" y="372">Grouped splitting is the equivalent of not examining a student on questions their own classmates wrote, which is a distinction real examiners take seriously too.</text>
</svg>
