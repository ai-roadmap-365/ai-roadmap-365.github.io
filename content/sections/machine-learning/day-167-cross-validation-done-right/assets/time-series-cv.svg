<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Time-ordered folds</title>
  <style>
    .time-series-cv-bg   { fill: #f8fafc; }
    .time-series-cv-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-series-cv-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-series-cv-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-series-cv-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-series-cv-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .time-series-cv-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .time-series-cv-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .time-series-cv-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .time-series-cv-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .time-series-cv-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .time-series-cv-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .time-series-cv-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .time-series-cv-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .time-series-cv-stage { opacity: 1; }

    .time-series-cv-s0 { animation-delay: 0.00s; }
    .time-series-cv-e0 { animation-delay: 0.00s; }
    .time-series-cv-s1 { animation-delay: 1.28s; }
    .time-series-cv-e1 { animation-delay: 1.28s; }
    .time-series-cv-s2 { animation-delay: 2.56s; }
    .time-series-cv-e2 { animation-delay: 2.56s; }
    .time-series-cv-s3 { animation-delay: 3.84s; }
    .time-series-cv-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .time-series-cv-conn  { animation: time-series-cv-trace 6.4s ease-in-out infinite; }
      .time-series-cv-stage { animation: time-series-cv-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes time-series-cv-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes time-series-cv-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .time-series-cv-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .time-series-cv-stage { animation: time-series-cv-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes time-series-cv-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="time-series-cv-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="time-series-cv-bg" width="980" height="322"/>
  <text class="time-series-cv-h1"  x="30" y="40">Time-ordered folds</text>
  <text class="time-series-cv-sub" x="30" y="64">Four steps.</text>
  <g class="time-series-cv-stage time-series-cv-s0">
    <rect class="time-series-cv-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="time-series-cv-step" x="44" y="142">01</text>
    <text class="time-series-cv-name" x="70" y="142">Never train on data from after the validation period</text>
    <text class="time-series-cv-desc" x="44" y="166">Which random splitting does</text>
    <text class="time-series-cv-desc" x="44" y="182">constantly.</text>
  </g>
  <line class="time-series-cv-line time-series-cv-conn time-series-cv-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#time-series-cv-tip)"/>
  <g class="time-series-cv-stage time-series-cv-s1">
    <rect class="time-series-cv-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="time-series-cv-step" x="280" y="142">02</text>
    <text class="time-series-cv-name" x="306" y="142">So train on everything up to a point</text>
    <text class="time-series-cv-desc" x="280" y="166">And validate on what follows.</text>
  </g>
  <line class="time-series-cv-line time-series-cv-conn time-series-cv-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#time-series-cv-tip)"/>
  <g class="time-series-cv-stage time-series-cv-s2">
    <rect class="time-series-cv-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="time-series-cv-step" x="516" y="142">03</text>
    <text class="time-series-cv-name" x="542" y="142">Then extend the training window and repeat</text>
    <text class="time-series-cv-desc" x="516" y="166">Simulating how the model would</text>
    <text class="time-series-cv-desc" x="516" y="182">actually be retrained.</text>
  </g>
  <line class="time-series-cv-line time-series-cv-conn time-series-cv-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#time-series-cv-tip)"/>
  <g class="time-series-cv-stage time-series-cv-s3">
    <rect class="time-series-cv-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="time-series-cv-step" x="752" y="142">04</text>
    <text class="time-series-cv-name" x="778" y="142">With a gap if predictions are made in advance</text>
    <text class="time-series-cv-desc" x="752" y="166">Matching the real forecast</text>
    <text class="time-series-cv-desc" x="752" y="182">horizon.</text>
  </g>
  <text class="time-series-cv-sub" x="30" y="304">The gap is the detail usually omitted: if the model predicts a week ahead, validating on the very next day overstates what it will achieve.</text>
</svg>
