<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Nested Cross-Validation Architecture Flow">
  <title>Nested (Double) Cross-Validation Architecture</title>
  <defs>
    <style>
      .d167f-bg { fill: #f8fafc; }
      .d167f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d167f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .d167f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d167f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d167f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d167f-arr); fill: none; }
    </style>
    <marker id="d167f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d167f-bg" />

  <text x="40" y="45" class="d167f-title" font-size="22">Nested (Double) Cross-Validation</text>
  <text x="40" y="70" class="d167f-text" font-size="13">Decoupling Model Selection (Inner Loop) from Unbiased Generalization Estimation (Outer Loop)</text>

  <!-- Outer Loop Container -->
  <rect x="40" y="100" width="820" height="340" class="d167f-card" stroke="#2563eb" stroke-dasharray="4 2" />
  <text x="60" y="130" class="d167f-title" fill="#1d4ed8">OUTER LOOP: Generalization Error Estimation (K_out = 5 Folds)</text>

  <!-- Outer Train vs Outer Val -->
  <rect x="60" y="150" width="480" height="40" fill="#eff6ff" stroke="#3b82f6" rx="4" />
  <text x="75" y="175" class="d167f-title" font-size="13" fill="#1e40af">Outer Training Split (80% Data)</text>

  <rect x="560" y="150" width="270" height="40" fill="#fef2f2" stroke="#ef4444" rx="4" />
  <text x="575" y="175" class="d167f-title" font-size="13" fill="#dc2626">Outer Test Fold (20% Clean Holdout)</text>

  <!-- Inner Loop Container inside Outer Train -->
  <rect x="60" y="210" width="480" height="200" class="d167f-card" fill="#f8fafc" stroke="#16a34a" />
  <text x="80" y="235" class="d167f-title" font-size="13" fill="#15803d">INNER LOOP: Hyperparameter Selection (K_in = 3 Folds)</text>

  <text x="80" y="260" class="d167f-text">• Grid/Random Search evaluates parameters θ on Inner Folds.</text>
  <text x="80" y="285" class="d167f-text">• Computes Mean Inner Score: Score(θ) = (1/3) ∑ Score_k(θ).</text>
  <text x="80" y="310" class="d167f-text">• Selects optimal hyperparameter set: θ* = argmax Score(θ).</text>
  <text x="80" y="335" class="d167f-math" fill="#15803d">Train Model(θ*) on FULL Outer Training Split (80%)</text>

  <!-- Arrow from Inner best model to Outer Test Evaluation -->
  <path d="M 540 335 L 690 335 L 690 200" class="d167f-arrow" />

  <!-- Outer Test Score Box -->
  <rect x="560" y="230" width="270" height="180" class="d167f-card" />
  <text x="580" y="260" class="d167f-title" font-size="13" fill="#0f172a">Unbiased Outer Score</text>
  <text x="580" y="290" class="d167f-math">Score_k = Metric(Model(θ*), Test_k)</text>
  <text x="580" y="330" class="d167f-text">Final Unbiased Estimate:</text>
  <text x="580" y="355" class="d167f-math" fill="#1d4ed8">CV_Score = (1/5) ∑ Score_k</text>
  <text x="580" y="385" class="d167f-text" font-size="10" fill="#64748b">Zero hyperparameter optimization leakage!</text>
</svg>
