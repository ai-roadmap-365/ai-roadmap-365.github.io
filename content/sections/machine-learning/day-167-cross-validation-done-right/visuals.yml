visuals:
  - id: cross-validation-schemes
    file: assets/cross-validation-schemes.svg
    type: diagram
    title: 'Cross-Validation Schemes Taxonomy: K-Fold vs Stratified vs Group vs Time-Series'
    alt: 'Diagram comparing four cross-validation schemes showing data partitions for K-Fold, Stratified K-Fold, Group K-Fold, and Time-Series expanding windows.'
    description: 'A static architecture diagram illustrating the partition logic of four foundational cross-validation strategies.'
  - id: nested-cv-flow
    file: assets/nested-cv-flow.svg
    type: flow-animated
    title: 'Nested (Double) Cross-Validation Architecture'
    alt: 'Animated flow chart illustrating the Outer generalization loop and Inner hyperparameter tuning loop in nested cross-validation.'
    description: 'An animated flow chart showing the complete execution flow of nested cross-validation to eliminate optimization bias.'
  - id: cv-idea
    file: assets/cv-idea.svg
    type: diagram
    title: 'Why cross-validation'
    alt: 'Diagram: why cross-validation is used instead of a single split'
    description: 'A four-stage description of cross-validation covering the noisy single split, the rotation, the averaging and the spread.'
  - id: cv-taxonomy
    file: assets/cv-taxonomy.svg
    type: diagram
    title: 'Four splitting strategies'
    alt: 'Diagram: four cross-validation strategies and the data structures they suit'
    description: 'A two-column comparison of data structures against the cross-validation strategy each requires.'
  - id: stratified
    file: assets/stratified.svg
    type: diagram
    title: 'Stratified folds'
    alt: 'Diagram: how stratified folds preserve class proportions'
    description: 'A four-stage description of stratification covering the imbalance, the random-split risk, the stratified allocation and the effect.'
  - id: group-kfold
    file: assets/group-kfold.svg
    type: diagram
    title: 'Grouped folds'
    alt: 'Diagram: why rows from the same entity must not straddle a fold boundary'
    description: 'A four-stage description of grouped splitting covering repeated entities, the leak, the grouping and the honest estimate.'
  - id: time-series-cv
    file: assets/time-series-cv.svg
    type: diagram
    title: 'Time-ordered folds'
    alt: 'Diagram: how expanding-window validation respects time ordering'
    description: 'A four-stage description of time-series validation covering the ordering constraint, the expanding window, the forward test and the gap.'
  - id: nested-cv
    file: assets/nested-cv.svg
    type: diagram
    title: 'Nested cross-validation'
    alt: 'Diagram: how nested cross-validation separates tuning from evaluation'
    description: 'A four-stage description of nested cross-validation covering the outer split, the inner tuning, the outer evaluation and the honest estimate.'
  - id: cv-not
    file: assets/cv-not.svg
    type: diagram
    title: 'What cross-validation is not'
    alt: 'Diagram: four misconceptions about cross-validation'
    description: 'A two-column comparison of misconceptions about cross-validation against what is true.'
  - id: cv-history
    file: assets/cv-history.svg
    type: diagram
    title: 'Four steps in validation practice'
    alt: 'Diagram: the historical progression of model validation practice'
    description: 'A four-stage description of validation history covering training-set scores, single holdouts, k-fold rotation and structure-aware splitting.'
  - id: exam
    file: assets/exam.svg
    type: diagram
    title: 'Setting an exam'
    alt: 'Diagram: examining on seen material compared with unseen material'
    description: 'A two-column comparison of testing on seen material against unseen material.'
  - id: cv-implications
    file: assets/cv-implications.svg
    type: diagram
    title: 'Four consequences of validation choice'
    alt: 'Diagram: the trust, cost, variance and honesty implications of cross-validation'
    description: 'A four-stage description of cross-validation implications covering decision quality, compute cost, estimate variance and reported honesty.'
  - id: cv-when
    file: assets/cv-when.svg
    type: diagram
    title: 'Which validation when'
    alt: 'Diagram: choosing a validation strategy by situation'
    description: 'A two-column comparison of situations against the validation approach each needs.'
