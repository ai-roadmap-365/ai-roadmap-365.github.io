questions:
  - question: 'What is the key difference between Single Linkage and Complete Linkage in agglomerative clustering?'
    options:
      - 'Single Linkage uses the minimum pairwise distance between clusters (prone to chaining), while Complete Linkage uses the maximum pairwise distance (produces compact clusters)'
      - 'Single Linkage requires knowing K upfront, whereas Complete Linkage does not'
      - 'Complete Linkage executes in linear time O(N), while Single Linkage is NP-hard'
      - 'Single Linkage only works on 1-dimensional datasets'
    answer_index: 0
    explanation: 'Single Linkage computes min(d(u,v)), which can chain distant clusters through noise bridges. Complete Linkage computes max(d(u,v)), enforcing compact spherical cluster hulls.'
  - question: 'What criterion defines a Core Point in the DBSCAN algorithm?'
    options:
      - 'A point that has at least MinPts sample points within its epsilon-radius neighborhood'
      - 'A point that is closest to the global arithmetic centroid'
      - 'A point with zero within-cluster variance'
      - 'A point that has been selected during k-means++ seeding'
    answer_index: 0
    explanation: 'In DBSCAN, a point p is a Core Point if |N_eps(p)| >= MinPts, making it a generator of a dense cluster component.'
  - question: 'How does DBSCAN treat points that are neither core points nor density-reachable from any core point?'
    options:
      - 'It labels them as noise (outliers) with a special cluster index of -1'
      - 'It forcefully assigns them to the nearest centroid'
      - 'It creates a new singleton cluster for each point'
      - 'It throws an uncaught exception during fit'
    answer_index: 0
    explanation: 'DBSCAN is uniquely noise-robust: points in sparse regions that cannot be reached from any core point are categorized as noise (-1) without distorting cluster hulls.'
  - question: 'What is the primary advantage of Ward linkage in agglomerative hierarchical clustering?'
    options:
      - 'It minimizes the increase in total within-cluster sum of squares (variance) at each merge step, producing balanced and cohesive clusters'
      - 'It guarantees that all clusters contain identical numbers of points'
      - 'It eliminates the need to calculate Euclidean distances'
      - 'It allows dendrogram cuts at negative heights'
    answer_index: 0
    explanation: 'Ward linkage merges the two clusters that result in the smallest increase in total error sum of squares (ESS), closely mirroring the objective of K-Means hierarchically.'
  - question: 'How do practitioners determine the optimal epsilon value for DBSCAN on a new dataset?'
    options:
      - 'By plotting the sorted k-nearest neighbor distance graph (with k = MinPts) and locating the sharp upward inflection knee'
      - 'By running gradient descent on the Silhouette loss function'
      - 'By dividing the total dataset variance by the number of features'
      - 'By choosing epsilon equal to the maximum pairwise Euclidean distance'
    answer_index: 0
    explanation: 'The k-distance plot reveals the characteristic density drop-off: points in dense clusters have low k-distances, while noise points have high k-distances. The knee marks the optimal epsilon.'
