    <text x="70" y="260" fill="#94a3b8" font-family="monospace" font-size="11">A</text>
    <text x="130" y="260" fill="#94a3b8" font-family="monospace" font-size="11">B</text>
    <text x="210" y="260" fill="#94a3b8" font-family="monospace" font-size="11">C</text>
    <text x="290" y="260" fill="#94a3b8" font-family="monospace" font-size="11">D</text>
    <text x="450" y="260" fill="#94a3b8" font-family="monospace" font-size="11">E</text>
    <text x="530" y="260" fill="#94a3b8" font-family="monospace" font-size="11">F</text>
    <text x="610" y="260" fill="#94a3b8" font-family="monospace" font-size="11">G</text>
