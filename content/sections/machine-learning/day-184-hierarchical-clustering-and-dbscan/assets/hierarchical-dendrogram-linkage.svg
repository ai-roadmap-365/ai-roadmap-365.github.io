  </defs>
  <rect width="850" height="420" fill="url(#bg184a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HIERARCHICAL AGGLOMERATIVE CLUSTERING: DENDROGRAM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multi-scale nested tree representation with distance threshold horizontal cut</text>
