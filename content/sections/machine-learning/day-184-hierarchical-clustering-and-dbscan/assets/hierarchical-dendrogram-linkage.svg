    <polyline points="100,200 100,140 250,140 250,180" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polyline points="450,240 450,190 530,190 530,240" fill="none" stroke="#10b981" stroke-width="2"/>
    <polyline points="490,190 490,150 610,150 610,240" fill="none" stroke="#10b981" stroke-width="2"/>
    <polyline points="175,140 175,80 550,80 550,150" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="40" y1="120" x2="690" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="630" y="112" fill="#ef4444" font-family="system-ui" font-size="11" font-weight="700">Cut Threshold (k=2)</text>
