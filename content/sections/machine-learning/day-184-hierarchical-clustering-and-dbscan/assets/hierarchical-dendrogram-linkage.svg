<svg role="img" aria-label="Dendrogram tree showing hierarchical agglomerative clustering linkage merges across distance thresholds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Hierarchical Agglomerative Dendrogram and Linkage</title>
  <defs>
    <linearGradient id="bg184a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dendroCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
