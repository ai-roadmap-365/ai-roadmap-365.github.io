<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each produces a different shape.">
  <title>Four linkage rules</title>
  <style>
    .linkage-bg   { fill: #f8fafc; }
    .linkage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linkage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linkage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linkage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linkage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linkage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linkage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linkage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linkage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linkage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linkage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linkage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linkage-row { opacity: 1; }
    .linkage-r0 { animation-delay: 0.00s; }
    .linkage-r1 { animation-delay: 0.45s; }
    .linkage-r2 { animation-delay: 0.90s; }
    .linkage-r3 { animation-delay: 1.35s; }
    .linkage-r4 { animation-delay: 1.80s; }
    .linkage-row { animation: linkage-reveal 7.3s ease-in-out infinite; }
    @keyframes linkage-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="linkage-bg" width="980" height="390"/>
  <text class="linkage-h1"  x="30" y="40">Four linkage rules</text>
  <text class="linkage-sub" x="30" y="64">Each produces a different shape.</text>
  <rect class="linkage-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="linkage-name" x="46" y="122">The rule</text>
  <text class="linkage-desc" x="46" y="142">How distance is measured.</text>
  <text class="linkage-desc linkage-row linkage-r0" x="46" y="182">Single — nearest pair of points</text>
  <text class="linkage-desc linkage-row linkage-r1" x="46" y="216">Complete — furthest pair of points</text>
  <text class="linkage-desc linkage-row linkage-r2" x="46" y="250">Average — mean of all pairs</text>
  <text class="linkage-desc linkage-row linkage-r3" x="46" y="284">Ward — the merge that least increases variance</text>
  <text class="linkage-desc linkage-row linkage-r4" x="46" y="318">Centroid — distance between cluster means</text>
  <rect class="linkage-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="linkage-name" x="526" y="122">The effect</text>
  <text class="linkage-desc" x="526" y="142">What it produces.</text>
  <text class="linkage-desc linkage-row linkage-r0" x="526" y="182">Long chains; can trace shapes, and straggles</text>
  <text class="linkage-desc linkage-row linkage-r1" x="526" y="216">Compact, roughly equal clusters</text>
  <text class="linkage-desc linkage-row linkage-r2" x="526" y="250">A compromise between the two</text>
  <text class="linkage-desc linkage-row linkage-r3" x="526" y="284">Spherical clusters; the usual default</text>
  <text class="linkage-desc linkage-row linkage-r4" x="526" y="318">Can produce inversions in the tree</text>
  <text class="linkage-sub" x="30" y="372">Single linkage chaining is both its strength and its failure: it can follow a curved cluster and it can also link two real groups through a thin bridge of noise.</text>
</svg>
