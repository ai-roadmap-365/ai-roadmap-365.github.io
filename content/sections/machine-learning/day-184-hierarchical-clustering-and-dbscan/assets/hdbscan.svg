<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The parameter problem.">
  <title>Fixed density against varying</title>
  <style>
    .hdbscan-bg   { fill: #f8fafc; }
    .hdbscan-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdbscan-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdbscan-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdbscan-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdbscan-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hdbscan-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hdbscan-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hdbscan-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hdbscan-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hdbscan-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hdbscan-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hdbscan-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hdbscan-row { opacity: 1; }
    .hdbscan-r0 { animation-delay: 0.00s; }
    .hdbscan-r1 { animation-delay: 0.45s; }
    .hdbscan-r2 { animation-delay: 0.90s; }
    .hdbscan-r3 { animation-delay: 1.35s; }
    .hdbscan-r4 { animation-delay: 1.80s; }
    .hdbscan-row { animation: hdbscan-reveal 7.3s ease-in-out infinite; }
    @keyframes hdbscan-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hdbscan-bg" width="980" height="390"/>
  <text class="hdbscan-h1"  x="30" y="40">Fixed density against varying</text>
  <text class="hdbscan-sub" x="30" y="64">The parameter problem.</text>
  <rect class="hdbscan-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hdbscan-name" x="46" y="122">Fixed radius</text>
  <text class="hdbscan-desc" x="46" y="142">One density for all.</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r0" x="46" y="182">A single radius parameter</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r1" x="46" y="216">Clusters of differing density cannot both be found</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r2" x="46" y="250">The parameter is hard to choose</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r3" x="46" y="284">Sensitive to small changes in it</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r4" x="46" y="318">Fast and simple</text>
  <rect class="hdbscan-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hdbscan-name" x="526" y="122">Varying density</text>
  <text class="hdbscan-desc" x="526" y="142">Density as a hierarchy.</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r0" x="526" y="182">Builds a hierarchy over densities</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r1" x="526" y="216">Finds clusters at different densities together</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r2" x="526" y="250">Only a minimum cluster size to choose</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r3" x="526" y="284">Much more robust</text>
  <text class="hdbscan-desc hdbscan-row hdbscan-r4" x="526" y="318">Slower, and usually worth it</text>
  <text class="hdbscan-sub" x="30" y="372">Removing the radius parameter is the practical advance: it was the hardest thing to set and the thing that most often made density clustering fail.</text>
</svg>
