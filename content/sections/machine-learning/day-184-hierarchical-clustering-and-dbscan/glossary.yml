terms:
  - term: 'Agglomerative Clustering'
    definition: 'A bottom-up hierarchical clustering method that starts with each observation in its own cluster and iteratively merges closest pairs.'
  - term: 'Dendrogram'
    definition: 'A tree diagram recording the sequence of cluster merges or splits and the distance levels at which they occur.'
  - term: 'Linkage Criterion'
    definition: 'The metric function determining the distance between two sets of observations as a function of pairwise distances between points.'
  - term: 'Ward Linkage'
    definition: 'An agglomerative linkage objective that minimizes the total within-cluster variance increase resulting from merging two clusters.'
  - term: 'DBSCAN'
    definition: 'Density-Based Spatial Clustering of Applications with Noise: a non-parametric clustering algorithm discovering arbitrary-shaped dense regions.'
  - term: 'Epsilon (eps)'
    definition: 'The maximum radius distance defining the neighborhood surrounding a given observation in DBSCAN.'
  - term: 'MinPts'
    definition: 'The minimum number of data points required within an epsilon-radius neighborhood for a point to qualify as a core point.'
  - term: 'Core Point'
    definition: 'A point with at least MinPts neighbors within distance epsilon, acting as an interior generator of a density cluster.'
