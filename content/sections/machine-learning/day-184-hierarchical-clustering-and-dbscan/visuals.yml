visuals:
  - id: hierarchical-dendrogram-linkage
    file: assets/hierarchical-dendrogram-linkage.svg
    type: diagram
    title: Hierarchical Agglomerative Dendrogram and Linkage
    alt: Dendrogram tree showing hierarchical agglomerative clustering linkage merges across distance thresholds
    description: Multi-scale nested tree representation of hierarchical agglomerative clustering with horizontal cut threshold.
  - id: dbscan-density-core-border-noise
    file: assets/dbscan-density-core-border-noise.svg
    type: diagram
    title: DBSCAN Density Reachability Core Border and Noise
    alt: DBSCAN density reachability showing core points with epsilon radius border points and isolated noise points
    description: Geometric illustration of DBSCAN epsilon neighborhoods, core point density conditions, border points, and isolated noise.
  - id: hac-dbscan
    file: assets/hac-dbscan.svg
    type: diagram
    title: 'Two ways beyond k-means'
    alt: 'Diagram: hierarchical clustering compared with density-based clustering'
    description: 'A two-column comparison of hierarchical clustering against density-based clustering.'
  - id: hac
    file: assets/hac.svg
    type: diagram
    title: 'Agglomerative clustering'
    alt: 'Diagram: the four steps of agglomerative hierarchical clustering'
    description: 'A four-stage description of agglomerative clustering covering singletons, the closest pair, merging and the dendrogram.'
  - id: dbscan
    file: assets/dbscan.svg
    type: diagram
    title: 'Density-based clustering'
    alt: 'Diagram: how density-based clustering grows clusters and identifies noise'
    description: 'A four-stage description of density clustering covering the two parameters, core points, expansion and noise.'
  - id: hdbscan
    file: assets/hdbscan.svg
    type: diagram
    title: 'Fixed density against varying'
    alt: 'Diagram: fixed-radius density clustering compared with hierarchical density clustering'
    description: 'A two-column comparison of fixed-density clustering against varying-density clustering.'
  - id: linkage
    file: assets/linkage.svg
    type: diagram
    title: 'Four linkage rules'
    alt: 'Diagram: four linkage rules for hierarchical clustering and the shapes each produces'
    description: 'A two-column comparison of hierarchical linkage rules against the cluster shapes each favours.'
  - id: dendrogram
    file: assets/dendrogram.svg
    type: diagram
    title: 'Reading a dendrogram'
    alt: 'Diagram: the four things a dendrogram reveals about cluster structure'
    description: 'A four-stage description of dendrogram reading covering merge height, the cut, cluster count and stability.'
  - id: cluster-not
    file: assets/cluster-not.svg
    type: diagram
    title: 'What these methods are not'
    alt: 'Diagram: four misconceptions about hierarchical and density clustering'
    description: 'A two-column comparison of misconceptions against what is true.'
  - id: cluster-history
    file: assets/cluster-history.svg
    type: diagram
    title: 'Four steps in clustering'
    alt: 'Diagram: the historical progression of clustering methods'
    description: 'A four-stage description of clustering history covering hierarchical methods, centroid methods, density methods and hierarchical density methods.'
  - id: constellations
    file: assets/constellations.svg
    type: diagram
    title: 'Constellations against a seating plan'
    alt: 'Diagram: groups defined by density compared with groups defined in advance'
    description: 'A two-column comparison of emergent groupings against imposed ones.'
  - id: cluster-implications
    file: assets/cluster-implications.svg
    type: diagram
    title: 'Four consequences of these methods'
    alt: 'Diagram: the flexibility, cost, parameter and dimensionality implications of hierarchical and density clustering'
    description: 'A four-stage description of implications covering shape flexibility, computational cost, parameter sensitivity and dimensionality.'
  - id: cluster-when
    file: assets/cluster-when.svg
    type: diagram
    title: 'Which clustering method when'
    alt: 'Diagram: choosing a clustering method by requirement'
    description: 'A two-column comparison of requirements against the clustering method that fits.'
