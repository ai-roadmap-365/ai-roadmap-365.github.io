title: An End-to-End Classification Exercise
section: machine-learning
subsection: core-concepts
week: 21
learning_promise: >-
  After this lesson you will have run one classification project properly, once, on a real dataset, and
  watched six days of separate disciplines pay off together instead of in isolation. You will measure
  three candidate datasets and choose the one that gives an honest interval room to exist, rather than
  the one that is most familiar. You will sweep 36 real candidate pipelines, cross-validate every one of
  them on training rows only, and select a winner without ever touching the test set. You will compute
  what Day 144's selection-optimism formula predicts for that sweep -- 0.0326 -- and then measure what
  actually happened over 20 seeds: a mean drop of -0.0001, thirty-fold smaller than predicted, because
  the formula assumes independent zero-skill candidates and this sweep's 36 are neither. You will open a
  confusion matrix and find that a 98.25 percent accuracy hides two false negatives and zero false
  positives -- the costlier kind of mistake in this domain, invisible in the headline number. You will
  compute a 95 percent interval around the one test score this project spends, and use it to state a
  defensible verdict rather than a bare percentage. And you will reproduce, deliberately, the mistake of
  selecting a model by scoring every candidate directly against the test set, and watch it never once
  score worse than the honest approach across 20 seeds -- an asymmetry with a mechanism, not a
  coincidence.
objectives:
  - 'Choose a dataset for a classification project by measuring headroom for an interval, not by picking the most familiar one'
  - 'State a majority-class baseline before fitting any model, and use it as a gate every later result must clear'
  - 'Build a stratified train/test split and hold the test rows back until exactly one evaluation'
  - 'Sweep a real set of candidate pipelines with scikit-learn''s Pipeline, and count K explicitly rather than losing track of it'
  - 'Select a winning configuration using cross-validation on training rows only, never on test rows'
  - 'Compute the selection optimism Day 144''s formula predicts for a real sweep, from the validation standard error and the expected maximum of K normals'
  - 'Explain honestly why a formula built for independent zero-skill candidates can badly overestimate the real optimism of a sweep of correlated, genuinely skilled candidates'
  - 'Read a confusion matrix for the specific, asymmetric mistakes it reveals, not only the accuracy it summarises'
  - 'Compute a 95 percent interval around a test accuracy, and judge whether an improvement over baseline is distinguishable from noise at the test-set size actually available'
  - 'Reproduce the mistake of selecting a model by scoring every candidate directly on the test set, and explain why the resulting gap can never be negative'
  - 'Enforce a one-evaluation budget on a test set mechanically, using the same pattern introduced on Day 144'
  - 'Assemble frame, baseline, split, pipeline, cross-validation, selection, one test evaluation, error analysis and a verdict into a single defensible protocol'
prerequisites:
  - 'Day 141 -- what a model score means, and that a training score is arithmetic rather than evidence'
  - 'Day 142 -- the winner''s curse, which reappears here checked against real, skilled candidates instead of bandit arms'
  - 'Day 143 -- stage ordering, and the discipline of fitting anything only on training rows'
  - 'Day 144 -- the three sets, the selection-optimism formula this lesson applies and then qualifies, and the GatedTestSet pattern this lesson reuses'
  - 'Day 145 -- overfitting and underfitting, needed to correctly read a near-ceiling accuracy without mistaking it for a red flag'
  - 'Day 146 -- the scikit-learn estimator API: fit, predict, Pipeline, and the learned attributes with trailing underscores. This lesson uses all of it and teaches none of it again'
  - 'Comfort with NumPy arrays and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
