visuals:
  - id: protocol-architecture
    file: assets/protocol-architecture.svg
    type: diagram
    title: >-
      The eight-stage protocol for one classification project, with the number each stage actually
      produced
    alt: >-
      Diagram: eight boxes in reading order, left to right then wrapping to a second row: frame the
      problem; state a majority-class baseline of 0.6316; split 569 rows into 455 train and 114 test,
      stratified; sweep 36 candidate pipelines; cross-validate on train rows only and select
      LogisticRegression with C equal to 1 at a cross-validated accuracy of 0.9780; evaluate the test set
      exactly once through a gate, scoring 0.9825; read the confusion matrix, finding two false negatives
      and zero false positives; and state a verdict of a 95 percent interval from 0.9584 to 1.0066,
      distinguishable from the baseline. A highlighted panel beneath states that Day 144's formula
      predicted a selection optimism of 0.0326 for this sweep, while the measured drop averaged -0.0001
      over twenty seeds, because the formula assumes independent zero-skill candidates and these 36 are
      neither
    description: >-
      A static architecture diagram of eight connected boxes describing the full protocol this lesson
      runs on the Wisconsin breast-cancer dataset. Stage 1 frames the problem: malignant versus benign,
      30 features, 569 rows, chosen over iris and wine by measured headroom for an interval. Stage 2
      states the majority-class baseline of 0.6316. Stage 3 splits the data 455 train against 114 test,
      stratified, with the test rows held back. Stage 4 sweeps 36 candidate pipelines -- 15
      k-nearest-neighbours settings, 11 logistic-regression strengths, 10 decision-tree depths -- with K
      counted explicitly. Stage 5 cross-validates every candidate on train rows only and selects the
      winner, LogisticRegression with C equal to 1 at a cross-validated accuracy of 0.9780. Stage 6
      evaluates the test set exactly once through a GatedTestSet, scoring 0.9825, with any second attempt
      raising an error. Stage 7 reads the confusion matrix and finds two false negatives (malignant cases
      predicted benign) and zero false positives. Stage 8 states the verdict: a 95 percent interval of
      [0.9584, 1.0066], an improvement of +0.3509 over baseline, clearly distinguishable. A highlighted
      panel beneath the eight boxes carries the closing measurement of the week: Day 144's formula
      predicted a selection optimism of 0.0326 for this sweep, while the measured drop over twenty
      independent seeds averaged -0.0001, because the formula assumes independent, zero-skill candidates
      and this sweep's 36 candidates are neither.
  - id: optimism-comparison-flow
    file: assets/optimism-comparison-flow.svg
    type: flow-animated
    title: >-
      Predicted selection optimism against the measured drop, and the leaky-selection gap, both across
      twenty seeds
    alt: >-
      Diagram: two bar-chart panels revealed left to right. The top panel plots the measured drop between
      cross-validated and test accuracy at eight sampled seeds against a dashed line marking the 0.0326
      optimism Day 144's formula predicted for this 36-candidate sweep; every measured drop sits far
      below the predicted line and scatters both above and below zero. The bottom panel plots the gap
      between a leaky test-set-peeking selection and the honest cross-validated one at the same eight
      seeds; every bar sits at or above zero, and never below it
    description: >-
      An animated two-panel bar chart. The top panel shows the measured drop (cross-validated accuracy
      minus test accuracy) at eight of the lesson's twenty seeds, as bars rising above or falling below a
      zero line, against a dashed reference line marking the 0.0326 optimism Day 144's formula predicted
      for this 36-candidate sweep. Every one of the eight measured bars sits far short of the predicted
      line, and the bars scatter on both sides of zero rather than clustering above it. The bottom panel
      shows the gap between a leaky selection (choosing a model by scoring every candidate directly on
      the test set) and the honest one (selecting on cross-validated training rows, then looking at test
      once) at the same eight seeds; every bar sits at or above the zero line, several exactly at zero,
      none below it. Bars in both panels reveal left to right, roughly one every half second on an
      eight-second loop, with the second panel's bars beginning to reveal after the first panel's are all
      visible; each bar stays at full opacity once revealed. A highlighted note beneath states the full
      twenty-seed summary: mean measured drop -0.0001 against a mean prediction of 0.0330, and mean leaky
      gap +0.0096, never negative once. A prefers-reduced-motion block disables every reveal and leaves
      all bars and the note in their final positions, so the still frame carries the entire result.
