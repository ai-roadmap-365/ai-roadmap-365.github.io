terms:
  - term: Majority-class baseline
    definition: >-
      The accuracy of predicting the most common class every time, with no model at all. Every model in
      this lesson has to clear it to be worth building -- here, 0.6316 -- and it is computed before any
      model is fitted, not after, as a check on whether the whole exercise is worth doing.
  - term: Candidate pipeline
    definition: >-
      One complete, fittable scikit-learn Pipeline -- a specific estimator with specific hyperparameters,
      any preprocessing folded in. This lesson sweeps 36 of them: 15 k-nearest-neighbours settings, 11
      logistic-regression regularisation strengths, 10 decision-tree depths.
  - term: K, counted
    definition: >-
      The number of candidates actually tried in a selection sweep. Day 144 named it as the number nobody
      remembers; this lesson counts it explicitly at 36, because the selection-optimism formula needs it
      as an input.
  - term: 5-fold stratified cross-validation
    definition: >-
      Splitting the training rows into five class-balanced folds and scoring each candidate on all five,
      so every training row serves as held-out data exactly once. Used here to select the winning
      configuration without ever touching the test rows.
  - term: Selection optimism, predicted
    definition: >-
      The optimism Day 144's formula predicts for a specific sweep: the standard error of an accuracy on
      one cross-validation fold's worth of rows, times the expected maximum of K standard normal draws.
      Computed here at 0.0326 for a 36-candidate sweep, before the test set is ever consulted.
  - term: Selection optimism, measured
    definition: >-
      What actually happened when the prediction above was checked against a real test evaluation, over
      20 independent seeds: a mean drop of -0.0001, far below the 0.0330 mean prediction, because the
      candidates in this sweep are correlated and genuinely skilled rather than independent and skill-free.
  - term: GatedTestSet
    definition: >-
      An object that wraps the held-out test rows and permits exactly one call to evaluate, raising
      TestSetTouchedTwice on any further attempt without advancing its own counter. The discipline from
      Day 144, made mechanical again on a real dataset.
  - term: Leaky selection
    definition: >-
      Choosing a winning configuration by fitting every candidate and scoring each one directly against
      the test set, instead of selecting on cross-validated training rows. Measured here at a mean gap of
      +0.0096 over 20 seeds, and never negative at any seed tried.
  - term: Confusion matrix
    definition: >-
      A table of predicted class against true class. Here, [[40, 2], [0, 72]]: two malignant cases
      predicted benign, zero benign cases predicted malignant -- a fact that a single accuracy number
      does not reveal on its own.
  - term: False negative, in this domain
    definition: >-
      A malignant case predicted benign -- the costlier of the two possible mistakes in cancer screening,
      because it delays treatment rather than triggering an unnecessary follow-up. This lesson's model
      makes two of them and zero of the other kind.
  - term: 95 percent interval, on a test accuracy
    definition: >-
      test_accuracy plus or minus 1.96 times the standard error sqrt(p(1-p)/n). Computed here at
      0.9825 +/- 0.0241, giving [0.9584, 1.0066] -- the range Day 144's arithmetic says the true accuracy
      plausibly sits in, given only 114 test rows.
  - term: Distinguishable from baseline
    definition: >-
      Whether an improvement over the baseline exceeds the test set's own 95 percent half-width. Here,
      an improvement of 0.3509 against a half-width of 0.0241 is clearly distinguishable; a smaller
      improvement on the same test set might not have been, and the arithmetic is how you would find out.
  - term: Frame
    definition: >-
      Stating what is being predicted, from what, and what beating it would even mean, before any code is
      written. The first stage of this lesson's protocol, and the one skipped most often in practice.
  - term: Verdict
    definition: >-
      The end product of a properly run classification project: a test score, an interval around it, a
      statement of whether it clears the baseline given that interval, and an honest account of the
      specific errors the model makes -- not a single accuracy number quoted alone.
  - term: Winner's curse, applied to a real sweep
    definition: >-
      The same argmax-over-noisy-estimates mechanism Day 142 and Day 144 measured on bandit arms and coin
      flips, checked here against real, skilled, correlated candidates -- and found to overestimate the
      real effect by roughly thirty-fold on average, because the assumptions behind the formula do not
      hold for this kind of sweep.
  - term: Ceiling effect
    definition: >-
      When a metric's possible values are so coarse, or so close to its maximum, that a real difference
      cannot be observed. Here, 114 test rows move accuracy in steps of about 0.0088, which is part of
      why the leaky-selection gap lands at exactly zero on some seeds.
