<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same data, different answers.">
  <title>The leaky run against the honest one</title>
  <style>
    .leaky-honest-bg   { fill: #f8fafc; }
    .leaky-honest-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leaky-honest-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leaky-honest-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leaky-honest-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leaky-honest-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leaky-honest-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leaky-honest-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leaky-honest-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leaky-honest-row { opacity: 1; }
    .leaky-honest-r0 { animation-delay: 0.00s; }
    .leaky-honest-r1 { animation-delay: 0.45s; }
    .leaky-honest-r2 { animation-delay: 0.90s; }
    .leaky-honest-r3 { animation-delay: 1.35s; }
    .leaky-honest-r4 { animation-delay: 1.80s; }
    .leaky-honest-row { animation: leaky-honest-reveal 7.3s ease-in-out infinite; }
    @keyframes leaky-honest-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="leaky-honest-bg" width="980" height="390"/>
  <text class="leaky-honest-h1"  x="30" y="40">The leaky run against the honest one</text>
  <text class="leaky-honest-sub" x="30" y="64">Same data, different answers.</text>
  <rect class="leaky-honest-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="leaky-honest-name" x="46" y="122">The leaky run</text>
  <text class="leaky-honest-desc" x="46" y="142">Impressive.</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r0" x="46" y="182">Preprocessing fitted before splitting</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r1" x="46" y="216">Threshold tuned on the test set</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r2" x="46" y="250">Best of many candidates reported</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r3" x="46" y="284">Score comfortably higher</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r4" x="46" y="318">And none of it will hold</text>
  <rect class="leaky-honest-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="leaky-honest-name" x="526" y="122">The honest run</text>
  <text class="leaky-honest-desc" x="526" y="142">Lower, and true.</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r0" x="526" y="182">Everything fitted inside the fold</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r1" x="526" y="216">Threshold set on validation</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r2" x="526" y="250">Selection optimism accounted for</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r3" x="526" y="284">Score lower, with an interval</text>
  <text class="leaky-honest-desc leaky-honest-row leaky-honest-r4" x="526" y="318">Which is what deployment will show</text>
  <text class="leaky-honest-sub" x="30" y="372">Running both side by side on the same data is the most convincing demonstration available, because the only difference is the discipline.</text>
</svg>
