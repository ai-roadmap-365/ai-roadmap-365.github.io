<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things the exercise is not</title>
  <style>
    .exercise-not-bg   { fill: #f8fafc; }
    .exercise-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exercise-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exercise-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exercise-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exercise-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exercise-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exercise-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exercise-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exercise-not-row { opacity: 1; }
    .exercise-not-r0 { animation-delay: 0.00s; }
    .exercise-not-r1 { animation-delay: 0.45s; }
    .exercise-not-r2 { animation-delay: 0.90s; }
    .exercise-not-r3 { animation-delay: 1.35s; }
    .exercise-not-r4 { animation-delay: 1.80s; }
    .exercise-not-row { animation: exercise-not-reveal 7.3s ease-in-out infinite; }
    @keyframes exercise-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exercise-not-bg" width="980" height="390"/>
  <text class="exercise-not-h1"  x="30" y="40">Four things the exercise is not</text>
  <text class="exercise-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="exercise-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exercise-not-name" x="46" y="122">The misconception</text>
  <text class="exercise-not-desc" x="46" y="142">Commonly held.</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r0" x="46" y="182">The goal is the highest score</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r1" x="46" y="216">A high score means it worked</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r2" x="46" y="250">Steps can be reordered for convenience</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r3" x="46" y="284">One test evaluation is overcautious</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r4" x="46" y="318">The confusion matrix is a formality</text>
  <rect class="exercise-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exercise-not-name" x="526" y="122">What is true</text>
  <text class="exercise-not-desc" x="526" y="142">Actually.</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r0" x="526" y="182">The goal is a defensible number</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r1" x="526" y="216">Only against a baseline, with an interval</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r2" x="526" y="250">Ordering is what makes the result true</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r3" x="526" y="284">Each extra look spends the estimate</text>
  <text class="exercise-not-desc exercise-not-row exercise-not-r4" x="526" y="318">It is where the useful diagnosis lives</text>
  <text class="exercise-not-sub" x="30" y="372">The exercise is designed so the honest number is lower than the leaky one, which is uncomfortable and exactly the lesson.</text>
</svg>
