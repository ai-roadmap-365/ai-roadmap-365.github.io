<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The single test evaluation</title>
  <style>
    .gated-test-bg   { fill: #f8fafc; }
    .gated-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gated-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gated-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gated-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gated-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gated-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gated-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gated-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gated-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gated-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gated-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gated-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gated-test-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gated-test-stage { opacity: 1; }

    .gated-test-s0 { animation-delay: 0.00s; }
    .gated-test-e0 { animation-delay: 0.00s; }
    .gated-test-s1 { animation-delay: 1.28s; }
    .gated-test-e1 { animation-delay: 1.28s; }
    .gated-test-s2 { animation-delay: 2.56s; }
    .gated-test-e2 { animation-delay: 2.56s; }
    .gated-test-s3 { animation-delay: 3.84s; }
    .gated-test-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gated-test-conn  { animation: gated-test-trace 6.4s ease-in-out infinite; }
      .gated-test-stage { animation: gated-test-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gated-test-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gated-test-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gated-test-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gated-test-stage { animation: gated-test-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gated-test-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gated-test-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gated-test-bg" width="980" height="322"/>
  <text class="gated-test-h1"  x="30" y="40">The single test evaluation</text>
  <text class="gated-test-sub" x="30" y="64">Four properties.</text>
  <g class="gated-test-stage gated-test-s0">
    <rect class="gated-test-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gated-test-step" x="44" y="142">01</text>
    <text class="gated-test-name" x="70" y="142">The test set is locked until every decision is made</text>
    <text class="gated-test-desc" x="44" y="166">Model, hyperparameters,</text>
    <text class="gated-test-desc" x="44" y="182">threshold, features.</text>
  </g>
  <line class="gated-test-line gated-test-conn gated-test-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gated-test-tip)"/>
  <g class="gated-test-stage gated-test-s1">
    <rect class="gated-test-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gated-test-step" x="280" y="142">02</text>
    <text class="gated-test-name" x="306" y="142">Then opened exactly once</text>
    <text class="gated-test-desc" x="280" y="166">With no adjustment afterwards.</text>
  </g>
  <line class="gated-test-line gated-test-conn gated-test-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gated-test-tip)"/>
  <g class="gated-test-stage gated-test-s2">
    <rect class="gated-test-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gated-test-step" x="516" y="142">03</text>
    <text class="gated-test-name" x="542" y="142">And whatever it says is reported</text>
    <text class="gated-test-desc" x="516" y="166">Including disappointment.</text>
  </g>
  <line class="gated-test-line gated-test-conn gated-test-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gated-test-tip)"/>
  <g class="gated-test-stage gated-test-s3">
    <rect class="gated-test-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gated-test-step" x="752" y="142">04</text>
    <text class="gated-test-name" x="778" y="142">Going back to change anything spends it</text>
    <text class="gated-test-desc" x="752" y="166">After which it is a validation</text>
    <text class="gated-test-desc" x="752" y="182">set.</text>
  </g>
  <text class="gated-test-sub" x="30" y="304">The prohibition on going back is what the whole apparatus protects, and it is the point at which discipline rather than technique determines the result.</text>
</svg>
