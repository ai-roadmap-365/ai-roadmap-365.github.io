questions:
  - question: >-
      Iris and wine both ship inside scikit-learn, need no download, and are the classic teaching
      datasets. This lesson uses breast_cancer instead. Why, specifically?
    options:
      - 'The sweep saturates, and 30-36 test rows are too coarse'
      - 'Breast_cancer is a binary classification problem and iris and wine are not, and this lesson only covers binary classification'
      - 'Iris and wine are not free to use commercially, unlike breast_cancer'
      - 'Breast_cancer has more features, and more features always make a better teaching example'
    answer_index: 0
    explanation: >-
      candidate_summaries() measures all three: iris and wine both saturate near-perfect cross-validated
      accuracy with this lesson's 36 candidates, and their test sets (30 and 36 rows) move accuracy in
      steps of roughly 3 points -- too coarse to support the interval and selection-optimism work this
      lesson does. breast_cancer's 569 rows and 114-row test set give room for both. All three datasets
      are bundled and free; the class-count claim about "only binary" is simply false, since nothing about
      the protocol in this lesson requires two classes.
  - question: >-
      Day 144's formula predicts a selection optimism of 0.0326 for this lesson's 36-candidate sweep. The
      measured drop at the reported seed is -0.0045, and the mean measured drop over 20 seeds is -0.0001.
      What is the correct reading of this gap?
    options:
      - 'The formula is wrong and should be discarded for real projects'
      - 'The formula assumes independent, zero-skill candidates'
      - 'The measurement is wrong, since theory should always match practice exactly'
      - 'Selection optimism only applies to classification, not regression, which is why it did not appear'
    answer_index: 1
    explanation: >-
      The formula's derivation assumes K independent draws with no true skill difference between them --
      literally what Day 144's coin-flip candidates were. This lesson's 36 candidates are neither: nearby
      k values and nearby regularisation strengths make almost identical predictions, so the effective
      number of independent choices is far below 36, and every candidate carries real skill rather than
      being pure noise. The formula still correctly signals that some optimism check is warranted; it
      simply is not calibrated for this kind of correlated, skilled sweep, and the honest response is to
      measure the real gap rather than trust either the formula or a single seed.
  - question: >-
      The confusion matrix for the winning model is [[40, 2], [0, 72]] (rows true, columns predicted,
      order malignant then benign), at an overall accuracy of 0.9825. What does the accuracy figure alone
      fail to tell you?
    options:
      - 'That the model achieved above-baseline performance at all'
      - 'The total number of test rows used to compute it'
      - 'Both errors are false negatives — malignant called benign'
      - 'Whether the model was trained using cross-validation'
    answer_index: 2
    explanation: >-
      A single accuracy number of 0.9825 sounds uniformly good and gives no hint that the two mistakes it
      represents are not interchangeable: both are false negatives, the costlier error in cancer
      screening because it delays treatment rather than triggering an unnecessary follow-up. The other
      three options are either recoverable from the accuracy figure and n_test directly, or are facts
      about the training procedure that the confusion matrix does not encode either.
  - question: >-
      The test set has 114 rows. The 95 percent interval around the test accuracy of 0.9825 is
      [0.9584, 1.0066], and the improvement over the 0.6316 baseline is +0.3509. What is the correct
      verdict?
    options:
      - 'Cannot distinguish the model from the baseline, because the interval crosses above 1.0, which is impossible for an accuracy'
      - 'No verdict is possible until the test set is evaluated a second time to confirm the result'
      - 'The model is overfitting, because 0.9825 is close to a perfect score'
      - 'The improvement is clearly distinguishable from the baseline, since 0.3509 is far larger than the interval''s 0.0241 half-width'
    answer_index: 3
    explanation: >-
      The improvement (0.3509) is roughly fourteen times the interval's half-width (0.0241), so the model
      is comfortably distinguishable from baseline at this test-set size -- an honest verdict this lesson
      could easily have come out the other way with a smaller improvement or a smaller test set, which is
      exactly why the interval is computed rather than assumed. The interval extending slightly above
      1.0 is an artefact of the normal approximation near a boundary, not evidence of a problem, and does
      not change the comparison. A second test evaluation would not confirm anything -- it would be a
      validation score wearing the word test, per Day 144. And near-ceiling accuracy on its own says
      nothing about overfitting without comparing train and validation behaviour, which Day 145 covered.
  - question: >-
      Exercise 10 selects a model by fitting all 36 candidates and scoring each one directly on the test
      set, instead of selecting on cross-validated training rows. Over 20 seeds, this leaky score is never
      lower than the honest score, though the gap is sometimes exactly zero. Why can the gap never be
      negative?
    options:
      - 'The leaky search can only replace the winner with a better one'
      - 'Because the leaky search always trains on more data than the honest one'
      - 'Because the test set is larger than the training set in this lesson'
      - 'Because logistic regression always outperforms k-nearest-neighbours on this dataset'
    answer_index: 0
    explanation: >-
      The leaky search is a superset of the honest choice: it evaluates every one of the 36 candidates,
      including the one cross-validation selected, directly against the test rows, and keeps whichever
      scores highest on those same rows. By construction it therefore cannot do worse than the honest
      winner's own test score -- it can only tie or improve on it, which is the exact mechanism, not
      chance. Training-set size is identical between the two searches, and neither family
      systematically wins across all 20 seeds.
  - question: >-
      114 test rows means test accuracy can only take values that are multiples of roughly 0.0088 (1/114).
      What effect does this have on the leaky-selection gap measured in exercise 10b?
    options:
      - 'None -- accuracy granularity has no bearing on whether a gap can be measured'
      - 'Both searches sometimes land on the identical winner'
      - 'It makes the gap systematically larger than it would be with more test rows'
      - 'It means the confusion matrix cannot be computed accurately'
    answer_index: 1
    explanation: >-
      With only 114 possible test rows, accuracy can only move in steps of about 0.0088, so two different
      configurations frequently tie exactly on test accuracy even if their underlying quality differs
      slightly -- and a tie means the leaky search has nothing to gain over the honest one at that seed,
      producing a gap of precisely zero. A finer-grained test set (more rows) would show a smoother, and
      likely more consistently positive, gap. The granularity affects the SIZE of an observable gap, not
      whether the confusion matrix is computable, and there is no reason it would inflate the gap.
  - question: >-
      Which of the following is the correct order for this lesson's protocol, and why does the order
      matter?
    options:
      - 'Split, frame, cross-validate, fit on everything, evaluate on test as many times as needed to be sure'
      - 'Fit the best-looking model first, then decide afterward what dataset and baseline would justify it'
      - 'Frame, baseline, split, sweep, select, test once, analyse'
      - 'Evaluate candidates on the test set to find the best one, then cross-validate that one candidate to double-check it'
    answer_index: 2
    explanation: >-
      Each stage in the correct order protects the next: framing and a baseline establish what "good"
      even means before any model exists; the split holds the test rows back; the sweep and
      cross-validation spend looks on training rows, where spending is free; selection happens before the
      one test evaluation, never after; and the verdict is stated with an interval, not a bare number.
      Evaluating on test repeatedly, choosing a model before framing the problem, or letting the test set
      do the selecting (as in exercise 10) each break a different stage of this same order, which is why
      this lesson measures all three as mistakes elsewhere.
  - question: >-
      A learner concludes from this lesson: "Selection optimism turned out to be nearly zero here, so
      checking for it was a waste of time -- I'll skip that step on my own project." What is wrong with
      this reasoning?
    options:
      - 'Nothing -- if optimism is usually small, the check can reasonably be skipped'
      - 'Selection optimism is only ever nonzero when the candidates are literal coin flips, so the learner is correct in this case but the reasoning does not generalise'
      - 'The formula should have been trusted instead of the measurement, since formulas are always more reliable'
      - 'The check tells you whether optimism is small on your project'
    answer_index: 3
    explanation: >-
      This lesson''s own headline finding is that the closed-form prediction (0.0326) and the measured
      reality (-0.0001) diverged sharply -- which was only discoverable BECAUSE the check was run. A
      learner who skips the check on a new project because it came out small once has replaced one
      untested assumption (the formula always applies) with another (my optimism is always negligible),
      which is the same mistake in a different shape. Day 144 already showed optimism CAN be large (0.0728
      on literal coin flips); this lesson shows it can also be much smaller than a formula predicts. Both
      are only known by measuring, on the project in front of you, every time.
