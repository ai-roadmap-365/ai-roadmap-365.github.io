title: 'Your First Model with scikit-learn'
section: machine-learning
subsection: core-concepts
week: 21
learning_promise: >-
  After this lesson you will know exactly what scikit-learn's fit/predict/score/get_params/set_params
  contract actually guarantees, because you will have built a classifier that implements all five by
  hand -- inheriting nothing -- and watched its predictions come out byte-identical to
  DummyClassifier(strategy="most_frequent"). You will then hand that same object to cross_val_score and
  watch it fail with an AttributeError naming a missing __sklearn_tags__ attribute, even though fit,
  predict and score all still work when called directly, and you will fix it with one line of
  inheritance from BaseEstimator. You will measure the exact five attributes fitting a LogisticRegression
  adds, all ending in a trailing underscore; that get_params and set_params round-trip exactly and that
  clone() copies configuration but never learned state; that a Pipeline step is refit once per
  cross-validation fold, on training rows only, which is the mechanism behind Day 143's leakage rule; that
  scikit-learn discovers 210 estimators, all of which implement fit, and that transform and predict are
  not mutually exclusive -- 20 estimators implement both, and you will know exactly which and why. You
  will measure what random_state=None actually costs, and run scikit-learn's own check_estimator against
  your classifier, honestly reporting which of its 52 checks pass and why two do not.
objectives:
  - 'Implement fit, predict, predict_proba, score, get_params and set_params from scratch and verify they reproduce a library estimator''s output exactly'
  - 'State precisely what fit() adds to an object -- every learned attribute ends in a trailing underscore, by documented convention'
  - 'Explain why NotFittedError exists and reproduce its exact message on both a library estimator and a hand-built one'
  - 'Show that get_params/set_params round-trip correctly, and that clone() copies configuration without ever copying learned state'
  - 'Read a Pipeline''s own get_params(deep=True) and change a nested step''s hyper-parameter through it'
  - 'Measure that a Pipeline step is refit once per cross-validation fold, on that fold''s training rows only, and connect that mechanism to Day 143''s leakage rule'
  - 'Identify, from a real measured failure, exactly what Pipeline and cross_val_score require beyond the five core methods in this version of scikit-learn, and fix it with one line of inheritance'
  - 'State how many of scikit-learn''s discovered estimators implement fit, and that transform and predict are not mutually exclusive'
  - 'Show that predict() is argmax(predict_proba()), restated through classes_, and that decision_function agrees with it too'
  - 'Measure what random_state=None costs: identical predictions under a fixed seed, and a different model on every fit without one'
  - 'Run check_estimator() against a real estimator and report, honestly, which checks pass and why the rest do not'
  - 'Distinguish what the estimator API requires by design from what a specific library version additionally requires for full interoperability'
prerequisites:
  - 'Day 141 -- what a model score means, which this lesson assumes rather than re-teaches'
  - 'Day 143 -- stage ordering and what "anything fitted" refers to; today measures the object-model mechanism behind that rule'
  - 'Day 144 -- the splitters and cross_val_score this lesson uses without re-teaching them'
  - 'Comfort reading a Python class definition and a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
