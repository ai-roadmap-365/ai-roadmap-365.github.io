terms:
  - term: Estimator
    definition: >-
      Any scikit-learn object that implements fit(). The base of the whole API -- measured here at 210
      of 210 discovered estimators, every single one implementing fit, whatever else it does.
  - term: Predictor
    definition: >-
      An estimator that additionally implements predict(), and usually predict_proba() and/or
      decision_function(). 119 of 210 discovered estimators, measured here.
  - term: Transformer
    definition: >-
      An estimator that implements transform() instead of, or beside, predict(). 90 of 210 discovered
      estimators. Overlaps with predictors only for clustering models and meta-estimators -- 20 of them,
      named explicitly in this lesson.
  - term: fit()
    definition: >-
      The method that reads hyper-parameters and training data and stores everything learned as
      attributes ending in a trailing underscore. The only estimator method permitted to add such
      attributes, and conventionally returns self for chaining.
  - term: Trailing underscore convention
    definition: >-
      A documented naming rule, not a style choice: any attribute ending in "_" was learned from data by
      fit(); anything without it is a hyper-parameter set by the caller. Measured on a fitted
      LogisticRegression at exactly five such attributes.
  - term: NotFittedError
    definition: >-
      The exception raised when predict(), transform() or similar is called before fit() has run.
      Measured with an identical message pattern on a library estimator and a hand-built one -- "is not
      fitted yet. Call 'fit'..."
  - term: get_params()
    definition: >-
      Returns an estimator's hyper-parameters as a dictionary, including nested step parameters for
      composite estimators like Pipeline, prefixed with the step's name and two underscores. Measured at
      23 keys for a two-step Pipeline.
  - term: set_params()
    definition: >-
      Accepts the same keys get_params() reports and writes them back, reaching through nested prefixes
      to mutate a Pipeline's actual step objects. Measured to change a nested LogisticRegression's live
      .C attribute directly.
  - term: BaseEstimator
    definition: >-
      scikit-learn's base class supplying get_params/set_params by inspecting __init__'s signature. The
      class this lesson's centrepiece measurement shows is necessary, in this library version, for
      Pipeline and cross_val_score compatibility -- not merely for direct use.
  - term: __sklearn_tags__
    definition: >-
      An internal method, supplied by BaseEstimator, that scikit-learn's own fitted-check reads inside
      Pipeline and cross_val_score. Its absence is the exact, measured cause of an estimator built
      without BaseEstimator failing inside both, even though its fit/predict/score work fine directly.
  - term: clone()
    definition: >-
      Builds a fresh, unfitted estimator instance from type(estimator)(**estimator.get_params(deep=False)).
      Measured to produce identical get_params() and zero learned attributes on the clone, while the
      original stays fitted -- the mechanism that gives every cross-validation fold a genuinely fresh
      model.
  - term: ClassifierMixin
    definition: >-
      A mixin supplying a default score() method (accuracy) to any class that also implements predict().
      Optional -- a classifier can define its own score(), as this lesson's from-scratch version does.
  - term: Pipeline as an estimator
    definition: >-
      A Pipeline implements fit/predict/score/get_params/set_params itself; it is not merely a container.
      Measured to refit a wrapped preprocessing step exactly once per cross-validation fold, on that
      fold's training rows only.
  - term: check_estimator()
    definition: >-
      scikit-learn's own conformance suite for verifying an object satisfies the estimator contract.
      Measured against this lesson's hand-built classifier at 52 checks, 48 passed, 2 skipped, 2 failed --
      both failures explained, not suppressed.
  - term: random_state
    definition: >-
      A parameter controlling reproducibility for estimators with internal randomness. Measured: a fixed
      integer gives byte-identical predictions across five independent fits; random_state=None draws
      fresh OS entropy every call and produced 5 of 5 distinct prediction vectors in this lesson's
      measurement.
  - term: predict_proba() and predict() agreement
    definition: >-
      predict(X) is defined as classes_[argmax(predict_proba(X), axis=1)] for any classifier implementing
      both -- measured to hold on every row of a fitted multiclass LogisticRegression, never independently
      computed.
  - term: decision_function()
    definition: >-
      A classifier's raw score before probabilities are computed. For binary classifiers, predict(X)
      equals classes_ indexed by (decision_function(X) > 0); for multiclass, classes_ indexed by its
      argmax. Both relationships measured directly in this lesson.
  - term: Protocol, not magic
    definition: >-
      The claim this lesson tests directly: five methods, implemented by hand with zero inheritance,
      reproduce library output exactly when called directly -- and, in this library version, stop being
      sufficient for interoperability with Pipeline and cross_val_score without also inheriting
      BaseEstimator.
