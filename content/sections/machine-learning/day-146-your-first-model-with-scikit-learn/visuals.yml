visuals:
  - id: estimator-anatomy-architecture
    file: assets/estimator-anatomy-architecture.svg
    type: diagram
    title: >-
      Anatomy of a fitted scikit-learn estimator: hyper-parameters in, learned state named with a
      trailing underscore, predictions and probabilities read back out, and get_params/set_params/clone
      touching configuration only
    alt: >-
      Diagram: an estimator object shown with hyper-parameters entering through init on the left, fit of
      X and y in the centre turning those hyper-parameters plus training data into learned state on the
      right -- five attributes, every one ending in a trailing underscore: classes underscore, coef
      underscore, intercept underscore, n features in underscore, n iter underscore. Below that, predict,
      predict proba and score read that learned state back out, with a note that predict equals classes
      underscore indexed by the argmax of predict proba, measured directly. A separate card states that
      before fit runs, none of that state exists and predict raises NotFittedError with the message is
      not fitted yet, call fit, measured identically on a library estimator and a hand-built one. Along
      the bottom, a loop shows get params, set params and clone touching configuration only, never
      learned state, with clone defined as building a fresh instance from the type of the estimator
      called with get params of deep false -- measured to produce identical get params and no learned
      attributes on the clone, while the original estimator stays fitted
    description: >-
      A static architecture diagram of one estimator object. Hyper-parameters enter through init on the
      left and are stored exactly as given; fit of X and y in the centre reads those hyper-parameters
      plus the training data and produces learned state on the right, listed as the five attributes
      measured on a real fitted LogisticRegression, every one ending in a trailing underscore. Below the
      learned-state box, predict, predict_proba and score read that state back out, with a measured note
      that predict equals classes_ indexed by the argmax of predict_proba. A card beneath the init/fit
      pair states that before fit runs none of that learned state exists, and that calling predict raises
      NotFittedError with the exact captured message, identical on a library estimator and a hand-built
      one. Along the bottom, a wide panel shows get_params, set_params and clone as a loop: get_params
      returns __init__'s arguments as a dict, set_params writes them back and round-trips exactly, and
      clone is shown with its one-line definition -- a fresh instance built from the estimator's own type
      and its get_params(deep=False) -- annotated with the measured fact that a clone has identical
      get_params and none of the learned attributes, while the original stays fitted.
  - id: protocol-footnote-flow
    file: assets/protocol-footnote-flow.svg
    type: flow-animated
    title: >-
      Five stages from a hand-built classifier working standalone to breaking inside Pipeline and
      cross_val_score, and the one line of inheritance that fixes it
    alt: >-
      Diagram: five stages left to right, connected by a wire with a token travelling along it. Stage
      one: MajorityClassifier is built from scratch, inheriting nothing from scikit-learn, implementing
      fit, predict, score, get params and set params by hand. Stage two: calling fit, predict and score
      directly all work, marked WORKS. Stage three: handing the same object to cross val score raises
      AttributeError, no attribute dunder sklearn tags, marked with the error text, because
      scikit-learn's own fitted check needs a method only BaseEstimator supplies. Stage four: the
      identical classifier is rebuilt inheriting ClassifierMixin and BaseEstimator, with its hand-written
      get params and set params deleted, since BaseEstimator now supplies both. Stage five: the same call
      to cross val score inside a real Pipeline now returns five real scores, marked WORKS. A caption
      states that fit, predict, score, get params and set params are necessary and sufficient for direct
      use, proven at stage two, but stopped being sufficient for Pipeline and cross val score
      compatibility in this version of scikit-learn, which both need dunder sklearn tags, supplied only
      by BaseEstimator -- and that the fix is one line of inheritance, shown at stage four
    description: >-
      An animated flow diagram of five stages, connected by a wire that carries a travelling token
      timed to arrive at each stage as it lights up. Stage one shows MajorityClassifier being built with
      zero inheritance from scikit-learn. Stage two shows fit, predict and score called directly, marked
      WORKS. Stage three shows the same object handed to cross_val_score, raising the exact
      AttributeError naming a missing __sklearn_tags__ attribute and recommending BaseEstimator, marked
      with the error text rather than a checkmark. Stage four shows the identical classifier rebuilt
      inheriting ClassifierMixin and BaseEstimator, with get_params and set_params deleted from its
      source since BaseEstimator now supplies both by introspecting __init__. Stage five shows the same
      call, now inside a real Pipeline scored by a real cross_val_score, returning five real scores,
      marked WORKS. Each stage box lights up in sequence on an eight-second loop, roughly one every 1.4
      seconds, and the travelling token pauses briefly at each stage before moving to the next. A caption
      panel beneath states the lesson's central finding in full sentences. A prefers-reduced-motion block
      disables every animation, leaving all five stages, their verdicts and the caption fully legible as
      a still frame that carries the entire result.
