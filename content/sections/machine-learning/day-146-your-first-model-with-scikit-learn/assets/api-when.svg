<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use what exists.">
  <title>When to write a custom estimator</title>
  <style>
    .api-when-bg   { fill: #f8fafc; }
    .api-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .api-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .api-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .api-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .api-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .api-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .api-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .api-when-row { opacity: 1; }
    .api-when-r0 { animation-delay: 0.00s; }
    .api-when-r1 { animation-delay: 0.45s; }
    .api-when-r2 { animation-delay: 0.90s; }
    .api-when-r3 { animation-delay: 1.35s; }
    .api-when-r4 { animation-delay: 1.80s; }
    .api-when-row { animation: api-when-reveal 7.3s ease-in-out infinite; }
    @keyframes api-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="api-when-bg" width="980" height="390"/>
  <text class="api-when-h1"  x="30" y="40">When to write a custom estimator</text>
  <text class="api-when-sub" x="30" y="64">And when to use what exists.</text>
  <rect class="api-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="api-when-name" x="46" y="122">Write one</text>
  <text class="api-when-desc" x="46" y="142">Four reasons.</text>
  <text class="api-when-desc api-when-row api-when-r0" x="46" y="182">A genuinely novel method</text>
  <text class="api-when-desc api-when-row api-when-r1" x="46" y="216">Wrapping a model from another framework</text>
  <text class="api-when-desc api-when-row api-when-r2" x="46" y="250">A domain-specific transform used repeatedly</text>
  <text class="api-when-desc api-when-row api-when-r3" x="46" y="284">To make something searchable and pipelineable</text>
  <text class="api-when-desc api-when-row api-when-r4" x="46" y="318">And run the contract checker on it</text>
  <rect class="api-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="api-when-name" x="526" y="122">Use what exists</text>
  <text class="api-when-desc" x="526" y="142">Almost always.</text>
  <text class="api-when-desc api-when-row api-when-r0" x="526" y="182">Any standard model</text>
  <text class="api-when-desc api-when-row api-when-r1" x="526" y="216">Any standard transform</text>
  <text class="api-when-desc api-when-row api-when-r2" x="526" y="250">Where a function would do</text>
  <text class="api-when-desc api-when-row api-when-r3" x="526" y="284">Where it will be used once</text>
  <text class="api-when-desc api-when-row api-when-r4" x="526" y="318">Because the contract has sharp edges</text>
  <text class="api-when-sub" x="30" y="372">Running the mechanical checker is not optional when writing one: the contract's requirements around cloning and refitting are easy to breach and hard to notice.</text>
</svg>
