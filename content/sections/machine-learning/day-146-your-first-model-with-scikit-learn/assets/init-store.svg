<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Construction stores only</title>
  <style>
    .init-store-bg   { fill: #f8fafc; }
    .init-store-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-store-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-store-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-store-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-store-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-store-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .init-store-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .init-store-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .init-store-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .init-store-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .init-store-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .init-store-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .init-store-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .init-store-stage { opacity: 1; }

    .init-store-s0 { animation-delay: 0.00s; }
    .init-store-e0 { animation-delay: 0.00s; }
    .init-store-s1 { animation-delay: 1.28s; }
    .init-store-e1 { animation-delay: 1.28s; }
    .init-store-s2 { animation-delay: 2.56s; }
    .init-store-e2 { animation-delay: 2.56s; }
    .init-store-s3 { animation-delay: 3.84s; }
    .init-store-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .init-store-conn  { animation: init-store-trace 6.4s ease-in-out infinite; }
      .init-store-stage { animation: init-store-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes init-store-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes init-store-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .init-store-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .init-store-stage { animation: init-store-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes init-store-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="init-store-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="init-store-bg" width="980" height="322"/>
  <text class="init-store-h1"  x="30" y="40">Construction stores only</text>
  <text class="init-store-sub" x="30" y="64">Four steps.</text>
  <g class="init-store-stage init-store-s0">
    <rect class="init-store-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="init-store-step" x="44" y="142">01</text>
    <text class="init-store-name" x="70" y="142">Store every argument unmodified</text>
    <text class="init-store-desc" x="44" y="166">Under the same name it was</text>
    <text class="init-store-desc" x="44" y="182">given.</text>
  </g>
  <line class="init-store-line init-store-conn init-store-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#init-store-tip)"/>
  <g class="init-store-stage init-store-s1">
    <rect class="init-store-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="init-store-step" x="280" y="142">02</text>
    <text class="init-store-name" x="306" y="142">Validate nothing, compute nothing</text>
    <text class="init-store-desc" x="280" y="166">Which feels wrong and is</text>
    <text class="init-store-desc" x="280" y="182">required.</text>
  </g>
  <line class="init-store-line init-store-conn init-store-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#init-store-tip)"/>
  <g class="init-store-stage init-store-s2">
    <rect class="init-store-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="init-store-step" x="516" y="142">03</text>
    <text class="init-store-name" x="542" y="142">Because cloning reads the parameters back out</text>
    <text class="init-store-desc" x="516" y="166">And expects to reconstruct an</text>
    <text class="init-store-desc" x="516" y="182">identical object.</text>
  </g>
  <line class="init-store-line init-store-conn init-store-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#init-store-tip)"/>
  <g class="init-store-stage init-store-s3">
    <rect class="init-store-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="init-store-step" x="752" y="142">04</text>
    <text class="init-store-name" x="778" y="142">Any transformation here breaks that</text>
    <text class="init-store-desc" x="752" y="166">And every search that relies on</text>
    <text class="init-store-desc" x="752" y="182">it.</text>
  </g>
  <text class="init-store-sub" x="30" y="304">This rule looks arbitrary until you see the clone operation that depends on it, at which point it is the only way the whole ecosystem can work.</text>
</svg>
