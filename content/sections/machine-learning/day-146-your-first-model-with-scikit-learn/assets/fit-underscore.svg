<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Fit learns, and marks it</title>
  <style>
    .fit-underscore-bg   { fill: #f8fafc; }
    .fit-underscore-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-underscore-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-underscore-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-underscore-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-underscore-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fit-underscore-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fit-underscore-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fit-underscore-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fit-underscore-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fit-underscore-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fit-underscore-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fit-underscore-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fit-underscore-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fit-underscore-stage { opacity: 1; }

    .fit-underscore-s0 { animation-delay: 0.00s; }
    .fit-underscore-e0 { animation-delay: 0.00s; }
    .fit-underscore-s1 { animation-delay: 1.28s; }
    .fit-underscore-e1 { animation-delay: 1.28s; }
    .fit-underscore-s2 { animation-delay: 2.56s; }
    .fit-underscore-e2 { animation-delay: 2.56s; }
    .fit-underscore-s3 { animation-delay: 3.84s; }
    .fit-underscore-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fit-underscore-conn  { animation: fit-underscore-trace 6.4s ease-in-out infinite; }
      .fit-underscore-stage { animation: fit-underscore-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fit-underscore-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fit-underscore-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fit-underscore-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fit-underscore-stage { animation: fit-underscore-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fit-underscore-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fit-underscore-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fit-underscore-bg" width="980" height="322"/>
  <text class="fit-underscore-h1"  x="30" y="40">Fit learns, and marks it</text>
  <text class="fit-underscore-sub" x="30" y="64">Four steps.</text>
  <g class="fit-underscore-stage fit-underscore-s0">
    <rect class="fit-underscore-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fit-underscore-step" x="44" y="142">01</text>
    <text class="fit-underscore-name" x="70" y="142">Fit is the only method that learns</text>
    <text class="fit-underscore-desc" x="44" y="166">Everything else applies what it</text>
    <text class="fit-underscore-desc" x="44" y="182">learned.</text>
  </g>
  <line class="fit-underscore-line fit-underscore-conn fit-underscore-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fit-underscore-tip)"/>
  <g class="fit-underscore-stage fit-underscore-s1">
    <rect class="fit-underscore-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fit-underscore-step" x="280" y="142">02</text>
    <text class="fit-underscore-name" x="306" y="142">Learned attributes end with an underscore</text>
    <text class="fit-underscore-desc" x="280" y="166">Which distinguishes them from</text>
    <text class="fit-underscore-desc" x="280" y="182">configuration at a glance.</text>
  </g>
  <line class="fit-underscore-line fit-underscore-conn fit-underscore-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fit-underscore-tip)"/>
  <g class="fit-underscore-stage fit-underscore-s2">
    <rect class="fit-underscore-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fit-underscore-step" x="516" y="142">03</text>
    <text class="fit-underscore-name" x="542" y="142">Fit returns the estimator itself</text>
    <text class="fit-underscore-desc" x="516" y="166">Which is what allows method</text>
    <text class="fit-underscore-desc" x="516" y="182">chaining.</text>
  </g>
  <line class="fit-underscore-line fit-underscore-conn fit-underscore-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fit-underscore-tip)"/>
  <g class="fit-underscore-stage fit-underscore-s3">
    <rect class="fit-underscore-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fit-underscore-step" x="752" y="142">04</text>
    <text class="fit-underscore-name" x="778" y="142">And refitting resets that state entirely</text>
    <text class="fit-underscore-desc" x="752" y="166">Rather than accumulating across</text>
    <text class="fit-underscore-desc" x="752" y="182">calls.</text>
  </g>
  <text class="fit-underscore-sub" x="30" y="304">Refitting resetting rather than accumulating is worth knowing: an estimator fitted twice on different data retains nothing from the first fit.</text>
</svg>
