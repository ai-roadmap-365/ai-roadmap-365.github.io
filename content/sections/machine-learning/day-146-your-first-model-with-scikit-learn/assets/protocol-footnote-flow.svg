<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="d146f-title d146f-desc" width="1040" height="640">
  <title id="d146f-title">Five stages from a hand-built classifier to Pipeline compatibility</title>
  <desc id="d146f-desc">Five stages lighting up in sequence with a token travelling between them. Stage one: MajorityClassifier is built from scratch, inheriting nothing from scikit-learn. Stage two: calling fit, predict and score directly all work, with a check mark. Stage three: handing the same object to cross_val_score raises AttributeError, no attribute __sklearn_tags__, with a cross mark, because scikit-learn's own fitted-check needs a method only BaseEstimator supplies. Stage four: the identical classifier is rebuilt inheriting ClassifierMixin and BaseEstimator, and its hand-written get_params and set_params are deleted, since BaseEstimator now supplies both. Stage five: the same call to cross_val_score inside a real Pipeline now returns five real scores, with a check mark. A caption states that five methods are necessary and sufficient for direct use, but not, in this version of scikit-learn, sufficient on their own for Pipeline and cross_val_score compatibility, and that the fix is one line of inheritance</desc>
  <style>
    .d146f-bg { fill: #f8fafc; }
    .d146f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; }
    .d146f-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d146f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d146f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .d146f-mono { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12.5px; }
    .d146f-verdict-ok { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; }
    .d146f-verdict-bad { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; }
    .d146f-caption { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }

    .d146f-stage {
      fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2;
      animation: d146f-lift 8s ease-in-out infinite;
    }
    .d146f-stage.d146f-breaks {
      fill: #ffffff; stroke: #1a202c; stroke-width: 2.5; stroke-dasharray: 7 5;
    }
    .d146f-s1 { animation-delay: 0s; }
    .d146f-s2 { animation-delay: 1.4s; }
    .d146f-s3 { animation-delay: 2.8s; }
    .d146f-s4 { animation-delay: 4.2s; }
    .d146f-s5 { animation-delay: 5.6s; }

    @keyframes d146f-lift {
      0%, 14%, 100% { fill: #eef2ff; }
      4%, 9% { fill: #bfdbfe; }
    }

    .d146f-wire {
      stroke: #1d4ed8; stroke-width: 2.5; fill: none;
      stroke-dasharray: 9 7;
      animation: d146f-march 1.6s linear infinite;
    }
    @keyframes d146f-march { to { stroke-dashoffset: -16; } }

    .d146f-token {
      fill: #1d4ed8;
      offset-path: path('M 130 400 L 322 400 L 322 400 L 514 400 L 514 400 L 706 400 L 706 400 L 898 400');
      offset-rotate: 0deg;
      animation: d146f-travel 7s ease-in-out infinite;
    }
    @keyframes d146f-travel {
      0%, 6% { offset-distance: 0%; }
      24%, 30% { offset-distance: 25%; }
      48%, 54% { offset-distance: 50%; }
      72%, 78% { offset-distance: 75%; }
      96%, 100% { offset-distance: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .d146f-stage { animation: none; fill: #eef2ff; }
      .d146f-wire { animation: none; stroke-dasharray: none; }
      .d146f-token { animation: none; offset-distance: 100%; }
    }
  </style>
  <rect class="d146f-bg" x="0" y="0" width="1040" height="640"/>
  <marker id="d146f-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d146f-title" x="520" y="38" text-anchor="middle">From five methods to Pipeline compatibility</text>
  <text class="d146f-sub" x="520" y="60" text-anchor="middle">Necessary for direct use at every stage. Sufficient for Pipeline and cross_val_score only from stage 4 onward.</text>

  <!-- connecting wire -->
  <path class="d146f-wire" d="M 130 400 L 898 400"/>
  <circle class="d146f-token" r="9"/>

  <!-- stage 1 -->
  <rect class="d146f-stage d146f-s1" x="40" y="100" width="170" height="180" rx="8"/>
  <text class="d146f-head" x="125" y="130" text-anchor="middle">Stage 1</text>
  <text class="d146f-label" x="60" y="156">MajorityClassifier</text>
  <text class="d146f-label" x="60" y="176">built from scratch.</text>
  <text class="d146f-label" x="60" y="200">Inherits nothing</text>
  <text class="d146f-label" x="60" y="220">from scikit-learn.</text>
  <text class="d146f-mono" x="60" y="248">fit, predict, score,</text>
  <text class="d146f-mono" x="60" y="264">get_params, set_params</text>

  <!-- stage 2 -->
  <rect class="d146f-stage d146f-s2" x="230" y="100" width="170" height="180" rx="8"/>
  <text class="d146f-head" x="315" y="130" text-anchor="middle">Stage 2</text>
  <text class="d146f-label" x="250" y="156">Called directly:</text>
  <text class="d146f-mono" x="250" y="178">.fit(X, y)</text>
  <text class="d146f-mono" x="250" y="198">.predict(X)</text>
  <text class="d146f-mono" x="250" y="218">.score(X, y)</text>
  <text class="d146f-verdict-ok" x="315" y="256" text-anchor="middle">WORKS</text>

  <!-- stage 3 -->
  <rect class="d146f-stage d146f-breaks d146f-s3" x="420" y="100" width="200" height="180" rx="8"/>
  <text class="d146f-head" x="520" y="130" text-anchor="middle">Stage 3</text>
  <text class="d146f-label" x="440" y="154">Handed to:</text>
  <text class="d146f-mono" x="440" y="174">cross_val_score(</text>
  <text class="d146f-mono" x="440" y="190">  MajorityClassifier(),</text>
  <text class="d146f-mono" x="440" y="206">  X, y)</text>
  <text class="d146f-verdict-bad" x="520" y="240" text-anchor="middle">AttributeError</text>
  <text class="d146f-label" x="440" y="262" text-anchor="start">no __sklearn_tags__</text>

  <!-- stage 4 -->
  <rect class="d146f-stage d146f-s4" x="650" y="100" width="200" height="180" rx="8"/>
  <text class="d146f-head" x="750" y="130" text-anchor="middle">Stage 4</text>
  <text class="d146f-label" x="670" y="156">Same classifier, now:</text>
  <text class="d146f-mono" x="670" y="180">(ClassifierMixin,</text>
  <text class="d146f-mono" x="670" y="198">  BaseEstimator)</text>
  <text class="d146f-label" x="670" y="224">get_params/set_params</text>
  <text class="d146f-label" x="670" y="242">deleted -- inherited now</text>

  <!-- stage 5 -->
  <rect class="d146f-stage d146f-s5" x="870" y="100" width="140" height="180" rx="8"/>
  <text class="d146f-head" x="940" y="130" text-anchor="middle">Stage 5</text>
  <text class="d146f-label" x="890" y="156">Real Pipeline,</text>
  <text class="d146f-label" x="890" y="174">real cross_val_score</text>
  <text class="d146f-verdict-ok" x="940" y="222" text-anchor="middle">WORKS</text>
  <text class="d146f-label" x="890" y="252">5 real scores</text>

  <!-- caption -->
  <rect x="40" y="460" width="960" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="d146f-caption" x="60" y="492" font-weight="700">fit, predict, score, get_params and set_params are necessary and sufficient</text>
  <text class="d146f-caption" x="60" y="516">for direct use -- stage 2 proves it, matching a library estimator's output exactly.</text>
  <text class="d146f-caption" x="60" y="546" font-weight="700">They stopped being sufficient for Pipeline and cross_val_score compatibility</text>
  <text class="d146f-caption" x="60" y="570">in this version of scikit-learn: both need __sklearn_tags__, which only BaseEstimator</text>
  <text class="d146f-caption" x="60" y="592">supplies. The fix is one line of inheritance, shown at stage 4.</text>
</svg>
