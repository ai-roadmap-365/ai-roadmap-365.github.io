<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The cost of an unset seed</title>
  <style>
    .random-state-bg   { fill: #f8fafc; }
    .random-state-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .random-state-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .random-state-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .random-state-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .random-state-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .random-state-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .random-state-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .random-state-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .random-state-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .random-state-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .random-state-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .random-state-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .random-state-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .random-state-stage { opacity: 1; }

    .random-state-s0 { animation-delay: 0.00s; }
    .random-state-e0 { animation-delay: 0.00s; }
    .random-state-s1 { animation-delay: 1.28s; }
    .random-state-e1 { animation-delay: 1.28s; }
    .random-state-s2 { animation-delay: 2.56s; }
    .random-state-e2 { animation-delay: 2.56s; }
    .random-state-s3 { animation-delay: 3.84s; }
    .random-state-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .random-state-conn  { animation: random-state-trace 6.4s ease-in-out infinite; }
      .random-state-stage { animation: random-state-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes random-state-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes random-state-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .random-state-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .random-state-stage { animation: random-state-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes random-state-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="random-state-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="random-state-bg" width="980" height="322"/>
  <text class="random-state-h1"  x="30" y="40">The cost of an unset seed</text>
  <text class="random-state-sub" x="30" y="64">Four steps.</text>
  <g class="random-state-stage random-state-s0">
    <rect class="random-state-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="random-state-step" x="44" y="142">01</text>
    <text class="random-state-name" x="70" y="142">Left unset, the seed differs on every run</text>
    <text class="random-state-desc" x="44" y="166">Which is the library's default.</text>
  </g>
  <line class="random-state-line random-state-conn random-state-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#random-state-tip)"/>
  <g class="random-state-stage random-state-s1">
    <rect class="random-state-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="random-state-step" x="280" y="142">02</text>
    <text class="random-state-name" x="306" y="142">So results move between runs</text>
    <text class="random-state-desc" x="280" y="166">By more than small model</text>
    <text class="random-state-desc" x="280" y="182">differences.</text>
  </g>
  <line class="random-state-line random-state-conn random-state-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#random-state-tip)"/>
  <g class="random-state-stage random-state-s2">
    <rect class="random-state-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="random-state-step" x="516" y="142">03</text>
    <text class="random-state-name" x="542" y="142">And two models compared on one run each are not comparable</text>
    <text class="random-state-desc" x="516" y="166">You measured the seeds, not the</text>
    <text class="random-state-desc" x="516" y="182">models.</text>
  </g>
  <line class="random-state-line random-state-conn random-state-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#random-state-tip)"/>
  <g class="random-state-stage random-state-s3">
    <rect class="random-state-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="random-state-step" x="752" y="142">04</text>
    <text class="random-state-name" x="778" y="142">Set it explicitly, and vary it deliberately</text>
    <text class="random-state-desc" x="752" y="166">Several fixed seeds, reported as</text>
    <text class="random-state-desc" x="752" y="182">a spread.</text>
  </g>
  <text class="random-state-sub" x="30" y="304">Setting a single seed and reporting one number is only half the fix: the honest version varies the seed deliberately and reports the spread.</text>
</svg>
