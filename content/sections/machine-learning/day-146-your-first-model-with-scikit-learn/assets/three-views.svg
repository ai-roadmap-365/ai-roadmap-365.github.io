<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which to use.">
  <title>Three views of one score</title>
  <style>
    .three-views-bg   { fill: #f8fafc; }
    .three-views-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-views-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-views-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-views-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-views-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-views-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-views-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-views-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-views-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-views-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-views-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-views-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-views-row { opacity: 1; }
    .three-views-r0 { animation-delay: 0.00s; }
    .three-views-r1 { animation-delay: 0.45s; }
    .three-views-r2 { animation-delay: 0.90s; }
    .three-views-r3 { animation-delay: 1.35s; }
    .three-views-r4 { animation-delay: 1.80s; }
    .three-views-row { animation: three-views-reveal 7.3s ease-in-out infinite; }
    @keyframes three-views-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-views-bg" width="980" height="390"/>
  <text class="three-views-h1"  x="30" y="40">Three views of one score</text>
  <text class="three-views-sub" x="30" y="64">Which to use.</text>
  <rect class="three-views-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-views-name" x="46" y="122">The method</text>
  <text class="three-views-desc" x="46" y="142">What it returns.</text>
  <text class="three-views-desc three-views-row three-views-r0" x="46" y="182">Predict — a hard label</text>
  <text class="three-views-desc three-views-row three-views-r1" x="46" y="216">Probability — a calibrated score in zero to one</text>
  <text class="three-views-desc three-views-row three-views-r2" x="46" y="250">Decision function — an uncalibrated signed score</text>
  <text class="three-views-desc three-views-row three-views-r3" x="46" y="284">All derived from the same underlying computation</text>
  <text class="three-views-desc three-views-row three-views-r4" x="46" y="318">Differing only in presentation</text>
  <rect class="three-views-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-views-name" x="526" y="122">When to use it</text>
  <text class="three-views-desc" x="526" y="142">And its catch.</text>
  <text class="three-views-desc three-views-row three-views-r0" x="526" y="182">When the threshold is already decided</text>
  <text class="three-views-desc three-views-row three-views-r1" x="526" y="216">For thresholding and expected-cost decisions</text>
  <text class="three-views-desc three-views-row three-views-r2" x="526" y="250">For ranking, when calibration does not matter</text>
  <text class="three-views-desc three-views-row three-views-r3" x="526" y="284">Not every estimator implements all three</text>
  <text class="three-views-desc three-views-row three-views-r4" x="526" y="318">Hard labels discard the information you need to tune</text>
  <text class="three-views-sub" x="30" y="372">Reaching for hard labels first discards exactly the information threshold tuning requires, which is why the probability method is usually the right default.</text>
</svg>
