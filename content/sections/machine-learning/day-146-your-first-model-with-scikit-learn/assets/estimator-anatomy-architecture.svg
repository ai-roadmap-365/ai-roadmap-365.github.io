<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img" aria-labelledby="d146a-title d146a-desc" width="1040" height="760">
  <title id="d146a-title">Anatomy of a fitted scikit-learn estimator</title>
  <desc id="d146a-desc">One estimator object shown as hyper-parameters going in through __init__, fit(X, y) turning them plus data into learned attributes named with a trailing underscore, and predict, predict_proba and score reading only that learned state back out, with get_params, set_params and clone shown as a separate loop that touches configuration only, never learned state.</desc>
  <style>
    .d146a-bg { fill: #f8fafc; }
    .d146a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d146a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; }
    .d146a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d146a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d146a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d146a-mono { fill: #1a202c; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 14px; }
    .d146a-monob { fill: #1d4ed8; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 14px; font-weight: 700; }
    .d146a-init { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2.5; }
    .d146a-fit { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
    .d146a-learned { fill: #ffffff; stroke: #1a202c; stroke-width: 3; }
    .d146a-out { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d146a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d146a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d146a-loop { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
  </style>
  <rect class="d146a-bg" x="0" y="0" width="1040" height="760"/>
  <marker id="d146a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d146a-title" x="520" y="42" text-anchor="middle">Anatomy of a fitted estimator</text>
  <text class="d146a-muted" x="520" y="68" text-anchor="middle">Four verbs, one rule for what changes: fit() is the only method that may add a trailing underscore.</text>

  <!-- init box -->
  <rect class="d146a-init" x="40" y="100" width="260" height="110" rx="8"/>
  <text class="d146a-head" x="170" y="130" text-anchor="middle">__init__(strategy=...)</text>
  <text class="d146a-label" x="170" y="155" text-anchor="middle">hyper-parameters, set by you</text>
  <text class="d146a-muted" x="60" y="180">Stored exactly as given.</text>
  <text class="d146a-muted" x="60" y="198">Nothing computed here.</text>

  <path class="d146a-wire" d="M 300 155 L 400 155" marker-end="url(#d146a-arrowhead)"/>

  <!-- fit box -->
  <rect class="d146a-fit" x="400" y="100" width="240" height="110" rx="8"/>
  <text class="d146a-head" x="520" y="140" text-anchor="middle">fit(X, y)</text>
  <text class="d146a-label" x="520" y="166" text-anchor="middle">reads hyper-parameters</text>
  <text class="d146a-label" x="520" y="188" text-anchor="middle">and the training data</text>

  <path class="d146a-wire" d="M 640 155 L 740 155" marker-end="url(#d146a-arrowhead)"/>

  <!-- learned attrs box -->
  <rect class="d146a-learned" x="740" y="90" width="260" height="200" rx="8"/>
  <text class="d146a-head" x="870" y="120" text-anchor="middle">LEARNED STATE</text>
  <text class="d146a-muted" x="760" y="142">every name ends in "_"</text>
  <text class="d146a-mono" x="760" y="168">classes_</text>
  <text class="d146a-mono" x="760" y="190">coef_</text>
  <text class="d146a-mono" x="760" y="212">intercept_</text>
  <text class="d146a-mono" x="760" y="234">n_features_in_</text>
  <text class="d146a-mono" x="760" y="256">n_iter_</text>
  <text class="d146a-muted" x="760" y="278">measured: exactly these 5, no more</text>

  <!-- measured note under init/fit -->
  <rect class="d146a-card" x="40" y="230" width="600" height="100" rx="8"/>
  <text class="d146a-strong" x="60" y="258">Measured: dir(model) after fit() minus dir(model) before it</text>
  <text class="d146a-label" x="60" y="284">is exactly the 5 names on the right -- on a real LogisticRegression,</text>
  <text class="d146a-label" x="60" y="306">fit on real data. Nothing else changes.</text>

  <!-- outputs -->
  <path class="d146a-wire" d="M 870 290 L 870 340" marker-end="url(#d146a-arrowhead)"/>
  <rect class="d146a-out" x="620" y="350" width="380" height="150" rx="8"/>
  <text class="d146a-head" x="640" y="380">Reading learned state back out</text>
  <text class="d146a-mono" x="640" y="408">predict(X)</text>
  <text class="d146a-mono" x="640" y="430">predict_proba(X)</text>
  <text class="d146a-mono" x="640" y="452">score(X, y)</text>
  <text class="d146a-muted" x="640" y="480">measured: predict(X) equals classes_[argmax(predict_proba(X))]</text>

  <!-- not fitted -->
  <rect class="d146a-card" x="40" y="350" width="540" height="150" rx="8"/>
  <text class="d146a-strong" x="60" y="380">Before fit(), none of that state exists</text>
  <text class="d146a-label" x="60" y="406">predict(X) on an unfitted estimator raises NotFittedError:</text>
  <text class="d146a-muted" x="60" y="430">"...is not fitted yet. Call 'fit' with appropriate</text>
  <text class="d146a-muted" x="60" y="450">arguments before using this estimator."</text>
  <text class="d146a-muted" x="60" y="476">Measured identically on the library estimator and a hand-built one.</text>

  <!-- get_params / set_params / clone loop -->
  <rect class="d146a-card" x="40" y="540" width="960" height="190" rx="10"/>
  <text class="d146a-head" x="60" y="570">get_params, set_params and clone touch configuration only, never learned state</text>

  <rect class="d146a-init" x="60" y="590" width="220" height="100" rx="8"/>
  <text class="d146a-strong" x="170" y="618" text-anchor="middle">get_params()</text>
  <text class="d146a-muted" x="170" y="642" text-anchor="middle">returns __init__'s</text>
  <text class="d146a-muted" x="170" y="660" text-anchor="middle">arguments, as a dict</text>

  <path class="d146a-loop" d="M 280 640 L 380 640" marker-end="url(#d146a-arrowhead)"/>

  <rect class="d146a-init" x="380" y="590" width="220" height="100" rx="8"/>
  <text class="d146a-strong" x="490" y="618" text-anchor="middle">set_params(**dict)</text>
  <text class="d146a-muted" x="490" y="642" text-anchor="middle">round-trips exactly</text>
  <text class="d146a-muted" x="490" y="660" text-anchor="middle">with get_params()</text>

  <path class="d146a-loop" d="M 600 640 L 700 640" marker-end="url(#d146a-arrowhead)"/>

  <rect class="d146a-learned" x="700" y="590" width="260" height="100" rx="8"/>
  <text class="d146a-strong" x="830" y="618" text-anchor="middle">clone(estimator)</text>
  <text class="d146a-monob" x="830" y="642" text-anchor="middle">type(est)(**get_params())</text>
  <text class="d146a-muted" x="830" y="664" text-anchor="middle">fresh, unfitted, same config</text>

  <text class="d146a-label" x="60" y="712">Measured: get_params() and set_params() round-trip exactly; clone() of a fitted estimator has identical</text>
  <text class="d146a-label" x="60" y="728">get_params() and none of the learned attributes -- while the original object stays fitted.</text>
</svg>
