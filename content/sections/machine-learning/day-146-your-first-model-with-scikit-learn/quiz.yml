questions:
  - question: >-
      MajorityClassifier, built without inheriting anything from scikit-learn, produces predictions and
      predict_proba output byte-identical to DummyClassifier(strategy="most_frequent") across five seeded
      datasets. What does that agreement actually prove?
    options:
      - 'That MajorityClassifier is now guaranteed to work inside Pipeline and cross_val_score, since its output matches the library exactly'
      - 'That DummyClassifier itself is redundant, since a fifteen-line class can replace it'
      - 'That those six methods reproduce a library estimator'
      - 'Nothing conclusive, because DummyClassifier is not representative of real classifiers'
    answer_index: 2
    explanation: >-
      Two independent implementations of the same rule, called directly, produce the same output --
      which is the strongest evidence available that the five-method contract is sufficient for direct
      use. It says nothing about interoperability with scikit-learn's own tooling: the very same object
      raises AttributeError the instant it is handed to cross_val_score, which is exercise 5's finding,
      not this one's. DummyClassifier is a deliberately simple baseline used precisely because its rule
      is easy to reproduce exactly, which makes it a good target for this comparison, not evidence that
      it is unnecessary.
  - question: >-
      Fitting a LogisticRegression on real data and diffing dir(model) before and after fit() shows
      exactly which five new attributes?
    options:
      - 'coef_, intercept_, n_iter_, and two private attributes that vary by call'
      - 'fit_, predict_, score_, params_, config_'
      - 'weights, bias, classes, n_features, n_iter'
      - 'classes_, coef_, intercept_, n_features_in_, n_iter_'
    answer_index: 3
    explanation: >-
      Those five, measured directly, and every one ends in a trailing underscore -- a documented
      convention meaning "learned from data," never "set by the caller." The second option invents
      method-like names that do not match scikit-learn's actual convention; the third option drops the
      trailing underscores, which is the whole point being tested; the fourth option is close on the
      first three but wrong about there being unnamed private attributes -- the diff is exact and
      reproducible, not fuzzy.
  - question: >-
      cross_val_score(MajorityClassifier(), X, y, cv=5) raises AttributeError naming a missing
      __sklearn_tags__ attribute. Calling MajorityClassifier().fit(X, y).predict(X) directly still works
      perfectly on the same object. What does that combination tell you?
    options:
      - 'The failure is in scikit-learn''s own fitted-check'
      - 'That MajorityClassifier has a bug in its predict() method that only shows up under cross-validation'
      - 'That the five-method contract was never actually sufficient, and the earlier measurement was wrong'
      - 'That cross_val_score requires predict_proba, which MajorityClassifier does implement, so the error must be unrelated'
    answer_index: 0
    explanation: >-
      Direct calls to fit, predict and score all succeed on the identical object -- which rules out a
      bug in those three methods and rules out the contract itself being insufficient for what it was
      built for. What fails is machinery inside Pipeline and cross_val_score that checks whether the
      estimator is fitted via __sklearn_tags__, a method only BaseEstimator supplies in this version of
      the library. predict_proba is unrelated to this specific failure; the error names
      __sklearn_tags__ specifically, not predict_proba.
  - question: >-
      MajorityClassifierBase is rebuilt inheriting (ClassifierMixin, BaseEstimator), and its hand-written
      get_params and set_params methods are deleted from the source entirely. Why is deleting them
      correct, rather than merely a simplification?
    options:
      - 'Because get_params and set_params are optional and scikit-learn works fine without them either way'
      - 'Because Python raises an error if a subclass defines a method its parent class also defines'
      - 'Because BaseEstimator now supplies both by inspecting __init__''s signature, and keeping a hand-written version would risk it silently disagreeing with the introspected one'
      - 'Because ClassifierMixin overrides them regardless of what is written, making the hand-written versions dead code'
    answer_index: 1
    explanation: >-
      BaseEstimator.get_params() reads __init__'s parameter names via introspection and returns the
      matching attributes; deleting the hand-written versions means there is exactly one source of
      truth instead of two that could drift apart. The first option is wrong because get_params/set_params
      are what make clone() and GridSearchCV work at all -- not optional for those. The second option
      names the wrong class; ClassifierMixin supplies score(), not get_params/set_params. Python does
      not forbid a subclass from redefining a parent's method -- if it did, no library could ever
      override a base class method, which is a routine and permitted pattern.
  - question: >-
      sklearn.utils.all_estimators() finds 20 estimators, out of 210 discovered, that implement both
      transform and predict. Why does this not contradict the rule that a plain classifier must never
      grow a transform method?
    options:
      - 'Because it does contradict the rule, and the rule should be abandoned as too strict'
      - 'Because the rule only applies to regressors, not classifiers, so the 20 estimators are all classifiers by definition'
      - 'They are clustering models and meta-estimators'
      - 'Because all 20 are deprecated estimators kept only for backward compatibility'
    answer_index: 2
    explanation: >-
      The 20 are named explicitly in this lab's measurement: clustering models where predict (which
      cluster) and transform (distance to every centre) are both genuinely useful outputs of the same
      fit, and meta-estimators (Pipeline, GridSearchCV, the Stacking and Voting ensembles) that inherit
      both by wrapping an arbitrary estimator. The rule survives narrowed to what it actually claims: a
      plain classifier or regressor should never have both, and none of the 20 are plain classifiers or
      regressors.
  - question: >-
      clone() of a fitted LogisticRegression returns an object with identical get_params() and no coef_
      attribute at all, while the original stays fitted. What one-line description of clone()'s
      implementation makes both facts true simultaneously?
    options:
      - 'clone() deep-copies the entire object, then deletes every attribute ending in an underscore'
      - 'clone() serialises the estimator with pickle and immediately unpickles it into a new variable'
      - 'clone() calls the original estimator''s reset() method, which every scikit-learn estimator implements'
      - 'clone() rebuilds from constructor arguments only'
    answer_index: 3
    explanation: >-
      Building a fresh object purely from get_params(deep=False) guarantees the clone starts with
      identical configuration and zero fitted state, because get_params only ever reports constructor
      arguments -- there is nothing fitted to carry forward even if you wanted to. The original object
      is never touched by this process, which is why it stays fitted. There is no reset() method in the
      estimator API; pickling would preserve fitted state, which is exactly the opposite of what clone()
      needs to guarantee for cross-validation.
  - question: >-
      A preprocessing step inside a Pipeline is measured to be fit exactly 5 times under 5-fold
      cross_val_score, and exactly 10 times under 10-fold. What mechanism produces that exact count, and
      how does it connect to Day 143?
    options:
      - 'It clones the pipeline per fold and fits on training rows only'
      - 'The preprocessing step has an internal retry loop that happens to run once per fold by coincidence'
      - 'cross_val_score fits the whole dataset once per fold as a caching optimisation; the count is incidental to leakage prevention'
      - 'The count is a bug in this lab''s counting wrapper and does not reflect real scikit-learn behaviour'
    answer_index: 0
    explanation: >-
      Each fold gets a genuinely fresh clone, fit only on that fold's training rows, which is precisely
      why nothing fitted inside the pipeline can see validation or test rows during that fold's fit --
      not by convention, but because the clone handed to that fold never saw anything else. This turns
      Day 143's rule from a promise into a countable, measured fact. The "coincidence" and "bug" options
      both dodge the actual mechanism; the "caching optimisation" option gets the direction backwards --
      re-fitting per fold is more expensive than caching would be, and it happens because correctness
      requires it.
  - question: >-
      check_estimator(MajorityClassifierBase()) reports 52 checks, 48 passed, 2 skipped, and 2 failed.
      What should you conclude about the estimator from the 2 failures?
    options:
      - 'That the estimator is broken and should not be used until both failures are fixed'
      - 'Both failures are genuine and specific to this estimator'
      - 'That the failures are random and would likely pass on a re-run'
      - 'That check_estimator() itself is unreliable, since a correctly implemented estimator should pass everything'
    answer_index: 1
    explanation: >-
      check_classifiers_train assumes a real learner and asserts accuracy above 0.83; a deliberate
      majority-class dummy cannot and should not reach that. check_classifiers_regression_target expects
      a ValueError on a continuous target, which this fit() genuinely never checks for -- a real,
      specific, fixable gap, not a structural violation. Both are deterministic, not flaky, and neither
      calls check_estimator()'s own reliability into question -- it is doing exactly its job by
      surfacing them.
