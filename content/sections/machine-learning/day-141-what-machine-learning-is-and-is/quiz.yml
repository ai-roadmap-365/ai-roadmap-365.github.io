questions:
  - question: >-
      A one-nearest-neighbour model is fitted to 200 rows whose labels were generated by coin flips, with no
      relationship of any kind between the features and the labels. What is its accuracy on those same 200
      rows, and why?
    options:
      - 'Exactly 1.000, because every training point is its own nearest neighbour at distance zero, so predicting it returns its own stored label'
      - 'About 0.5, because the labels are random and randomness cannot be learned'
      - 'Somewhere between 0.7 and 0.9, depending on the seed and the number of features'
      - 'Undefined, because a model cannot be scored on data it was trained on'
    answer_index: 0
    explanation: >-
      This is arithmetic, not measurement. A 1-NN prediction finds the closest stored point and copies its
      label; for a training row the closest stored point is itself, at distance zero. The measured value in
      this lesson is exactly 1.0 for both the hand-written NumPy version and scikit-learn's, on labels that
      are coin flips. The 0.518 that option two is thinking of is the test accuracy on 1000 unseen rows, and
      keeping those two numbers apart is the whole point of the day.
  - question: >-
      Two models are trained on the same data. Model A scores 1.000 on the training set; model B scores
      0.780. What do you know about which one will do better on new data?
    options:
      - 'Model A, because a higher training score means a better fit to the underlying pattern'
      - 'Model B, because a lower training score always indicates better generalisation'
      - 'Nothing at all from these two numbers -- the ranking can be exactly backwards, and in this lesson it is'
      - 'Model A, provided both models come from the same family'
    answer_index: 2
    explanation: >-
      Measured in this lesson on the same noisy dataset: the full-depth tree scores 1.000 in training and
      0.6535 on unseen data, while logistic regression scores 0.780 in training and 0.7655 on unseen data.
      The better training score belongs to the worse model. Option two overcorrects -- a lower training
      score does not always mean better generalisation either. Training scores simply do not rank models,
      and no amount of care in reading them changes that.
  - question: >-
      A classifier reports 82.1 percent accuracy on a held-out test set. Ninety percent of the rows in that
      test set belong to one class. What is the correct reading?
    options:
      - 'A solid result -- 82 percent on held-out data is genuine evidence the model works'
      - 'Encouraging but incomplete; you would want a confusion matrix before concluding anything'
      - 'The model is well calibrated but poorly tuned, and needs a different threshold'
      - 'The model is worse than a constant that always predicts the majority class and ignores the input, which scores exactly 0.900'
    answer_index: 3
    explanation: >-
      This is the measured case in exercise 6: features that are pure noise, 90 percent of rows in one
      class, the majority-class baseline at exactly 0.900, a 1-NN at 0.821 and a full-depth tree at 0.817.
      Both trained models would be reported as "82 percent accurate" and both are worse than ignoring the
      input entirely. A confusion matrix is genuinely useful and comes later in this course, but you do not
      need one to disqualify this result -- one subtraction does it.
  - question: >-
      You know that exactly 25 percent of your labels are wrong, in training and in held-out data alike.
      What is the highest accuracy any model can reach on that held-out data?
    options:
      - 'There is no fixed limit; a sufficiently large model can learn to correct the mislabelled rows'
      - 'About 0.750, because a model that recovered the underlying rule perfectly would still be marked wrong on the quarter of rows whose recorded labels are wrong'
      - '0.875, the midpoint between the noise rate and perfect accuracy'
      - 'It depends entirely on the model family; tree-based models are more robust to label noise'
    answer_index: 1
    explanation: >-
      The ceiling is 1 minus the noise rate, and in this lesson it is exact rather than estimated because
      exactly 1000 of 4000 test labels were flipped. Four different model families were measured against it:
      logistic regression 0.73725, 15-NN 0.72675, a depth-3 tree 0.68825 and a full-depth tree 0.60875 --
      all at or below 0.750. Computing the ceiling first is what stops you from spending a quarter on the
      26.3 points that are not available to anyone.
  - question: >-
      A model trained on points from the unit square scores 0.948 on fresh points from that square and
      0.4895 on the identical problem translated three units away -- same labelling rule, same shape,
      different region. Why does the model not raise a warning?
    options:
      - 'It would, if the training code had enabled input validation'
      - 'Because the accuracy metric is inappropriate for shifted data and a different metric would show it'
      - 'Because nothing in its training data describes where the training data ended, so it has no way to represent the idea of being outside it'
      - 'Because the translation was too small; a larger shift would have triggered an out-of-range error'
    answer_index: 2
    explanation: >-
      A trained model is a function from inputs to outputs. It was given examples, not a boundary, and there
      is no place inside it where the edge of the training distribution is recorded. That silence is the
      dangerous part: nothing errors, nothing alerts, and the service keeps returning confident answers at
      the same rate while accuracy sits below chance. Detecting this requires monitoring the distribution of
      inputs deliberately, which is a thing you build rather than a thing you get.
  - question: >-
      A 5-nearest-neighbour regressor is fitted to y = x squared for x between 0 and 10. Its mean absolute
      error is 0.180 inside that range and 139.704 on the range from 10 to 20. Its largest prediction
      anywhere outside the training range is 97.307, while the largest target it saw in training was 98.862.
      What do those last two numbers explain?
    options:
      - 'That the model needs more training data at the upper end of its range'
      - 'That the mean absolute error is the wrong metric for extrapolation and a squared error would behave better'
      - 'That the model has a bug: a correctly implemented regressor would extrapolate the parabola'
      - 'That the model structurally cannot return a value larger than one it has seen, because a prediction is an average of stored neighbours -- extrapolation is not something it does badly, it is something it does not do'
    answer_index: 3
    explanation: >-
      A nearest-neighbour prediction is an average over stored targets, so its output is bounded by the
      targets it stored. Asked about x = 20, where the truth is 400, it returns something near the edge of
      what it knows. This is a property to respect rather than a bug to fix -- and fitting a straight line
      instead does not rescue you: measured here, a linear model scores 6.007 error inside the range and
      101.643 outside it, failing in a different direction because a line is not a parabola.
  - question: >-
      For a task where the label is exactly determined by a rule you can write in three lines, a depth-3
      tree scores 0.8855, a depth-8 tree 0.9375 and a 15-NN 0.9675 on unseen data. The rule scores 1.000.
      What is the professional conclusion?
    options:
      - 'Write the rule. It is exactly correct on every input, needs no labels, cannot drift, costs nothing to run and can be reviewed by someone else'
      - 'Use the 15-NN, since 0.9675 is close enough and a trained model will adapt if the rule ever changes'
      - 'Ensemble the rule and the 15-NN to get the best of both'
      - 'Collect more training data until a model matches the rule exactly'
    answer_index: 0
    explanation: >-
      The models are approximating a function that is already written down, from a finite sample, using
      shapes that cannot represent it exactly. Option four is the trap worth naming: more data narrows the
      gap and never closes it, and every extra example costs money to label. The genuinely common
      professional error is not choosing the model over the rule knowingly -- it is never asking whether the
      rule exists, because the rule is usually sitting in a specification or a regulation and modelling is
      the more interesting part of the job.
  - question: >-
      A problem has no rule anyone can write, no labelled examples at all, a stable distribution and full
      tolerance for occasional errors. What does the four-question decision function in this lesson return,
      and why is the order of the questions the point?
    options:
      - '"Yes", because three of the four conditions are satisfied and labels can be obtained later'
      - '"Not yet: the distribution moves", because label scarcity and distribution instability are the same problem'
      - '"Get labels first", because supervised learning approximates a function from examples of its output, and with no examples there is nothing to approximate'
      - '"No: errors are not tolerable", because unlabelled data makes every prediction unverifiable'
    answer_index: 2
    explanation: >-
      The order runs: does an exact rule exist, are labels available, is the distribution stable, are errors
      tolerable -- cheapest disqualifier first. Here the first question passes and the second fails, so the
      verdict is "get labels first". The ordering earns its keep in a different case measured in the lab: a
      problem where a rule exists and there are no labels, no stability and no error tolerance still returns
      "write the rule", because a rule needs none of those things.
