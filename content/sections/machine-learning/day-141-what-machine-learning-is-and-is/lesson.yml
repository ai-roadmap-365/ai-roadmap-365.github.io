id: D141
day: 141
slug: what-machine-learning-is-and-is
title: 'What Machine Learning Is and Is Not'
section: machine-learning
subsection: core-concepts
week: 21
learning_promise: >-
  After this lesson you will be able to state what machine learning is in one sentence -- function
  approximation from examples -- and derive from that sentence every property that makes it useful and
  every property that makes it dangerous. You will fit a one-nearest-neighbour model to a dataset whose
  labels are coin flips and watch it score exactly 1.000 on the data it memorised and 0.518, which is
  chance, on data it has not seen, so that a training-set number never persuades you of anything again.
  You will construct a problem where an exact three-line rule scores 1.000 and the best of four trained
  models reaches only 0.9675, and learn to ask whether the rule exists before reaching for a model. You
  will make a model's accuracy fall from 0.948 to 0.4895 by moving the input region without changing the
  rule, and see why nothing in the model can notice. You will measure a nearest-neighbour regressor at
  0.180 error inside its training range and 139.704 outside it, and understand that as a property to
  respect rather than a bug to fix. You will put a majority-class baseline of 0.900 next to a model
  scoring 0.821 and see a good-looking accuracy lose to a constant. You will compute an irreducible
  ceiling of 0.750 from a known label-noise rate and confirm that four different model families all sit
  at or below it. And you will end with a four-question decision function that tells you, before any
  code is written, when machine learning is the wrong tool entirely.
objectives:
  - 'Define machine learning as function approximation from examples, and name its three ingredients: data, a model class and an objective'
  - 'Produce a perfect 1.000 training accuracy from a model that has learned nothing, and explain why that number is arithmetic rather than achievement'
  - 'Write a nearest-neighbour classifier from scratch in NumPy and state the one condition under which its training accuracy is not exactly 1.000'
  - 'Explain why performance on seen data is free and performance on unseen data is the entire product'
  - 'Judge when a hand-written rule beats a trained model, and apply that judgement before reaching for a model'
  - 'Name the i.i.d. assumption plainly and demonstrate an accuracy collapsing under a distribution shift the model was never told about'
  - 'Distinguish interpolation from extrapolation with measured error on both sides of a training range, and treat the difference as a property rather than a defect'
  - 'Compare any reported accuracy against a majority-class baseline, including the case where a good-looking model loses to a constant'
  - 'Compute an irreducible error ceiling from a known label-noise rate and explain why chasing the last few points is often chasing noise'
  - 'Separate machine learning from reasoning, understanding, causal inference and database lookup, with a concrete demonstration of each distinction'
  - 'Account honestly for the cost of a model -- labels, maintenance, monitoring and the ethical inheritance of its training data'
  - 'Apply a four-question decision function to decide whether machine learning is the right tool, and defend the order the questions are asked in'
prerequisites:
  - 'Day 137 -- features and leakage: target leakage, train/test contamination and the instinct that a result which looks too good is a bug report. This day supplies the measurements behind that instinct'
  - 'Day 136 -- the untouched confirmation set and the forking-paths problem, which is the same discipline applied before models existed'
  - 'Days 117-118 -- the standard error, and why a small margin measured on a small sample is noise'
  - 'Day 119 -- the observational caveat, which returns here as the reason a model is never an explanation'
  - 'Day 138 -- data ethics, bias and provenance, whose obligations attach to every model trained on that data'
  - 'Comfort with NumPy array indexing and pytest, and a working python3 (3.11 or newer) on your PATH; the lab builds its own virtual environment from requirements/requirements.txt'
