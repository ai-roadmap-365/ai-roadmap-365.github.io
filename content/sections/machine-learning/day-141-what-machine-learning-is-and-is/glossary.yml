terms:
  - term: Machine learning
    definition: >-
      Function approximation from examples. You choose a family of candidate functions and a way of scoring
      a candidate against your examples, and a search returns the member of the family that scores best.
      Nothing else is required for the definition -- in particular, no understanding, no reasoning and no
      model of the world.
  - term: Model class
    definition: >-
      The family of functions a training procedure is allowed to search through: straight lines, decision
      trees up to a given depth, nearest-neighbour lookups, neural networks of a given shape. You never
      search all possible functions; you always choose a family first, and that choice is yours to defend.
  - term: Objective
    definition: >-
      The score that ranks one candidate function above another during training, so that "better" means
      something specific. It is a number you chose, which is why a model optimises what you asked for
      rather than what you wanted.
  - term: Generalisation
    definition: >-
      Performance on data the model has never seen, drawn from the same source as its training data. It is
      the entire product of machine learning. Performance on data the model has already seen is free, can
      always be made perfect by a large enough model, and is evidence of nothing.
  - term: Generalisation gap
    definition: >-
      The difference between a model's score on its training data and its score on unseen data. Measured in
      this lesson at 0.040 for a full-depth tree on iris and 0.3465 for the same model type on data with 20
      percent of labels flipped -- identical training scores of 1.000 in both cases, which is why the gap
      rather than the training score is the informative number.
  - term: Majority-class baseline
    definition: >-
      A predictor that ignores the input entirely and always answers with the most common class. It is the
      cheapest meaningful comparison for a classifier, and a model that cannot beat it has demonstrated
      nothing. Measured here at exactly 0.900 on a dataset where two trained models scored 0.821 and 0.817.
  - term: Irreducible error ceiling
    definition: >-
      The maximum accuracy any model can reach on held-out data, given a known fraction of wrong labels. If
      a fraction r of labels is wrong, a model that recovered the underlying rule perfectly would still be
      marked wrong on that fraction, so the ceiling is 1 minus r. Measured here as exactly 0.750 for a
      25 percent noise rate, with the best of four model families reaching 0.73725.
  - term: The i.i.d. assumption
    definition: >-
      Short for independent and identically distributed: the assumption that future inputs are drawn from
      the same distribution as the training data, each drawn independently. Every claim a trained model
      makes rests on it, it is frequently false in production, and its failure is silent -- nothing errors
      and nothing alerts.
  - term: Distribution shift
    definition: >-
      What happens when the inputs a deployed model meets stop resembling the ones it was trained on. In
      this lesson a model scoring 0.948 in distribution scores 0.4895 -- below chance -- on the identical
      problem translated to a different region, while the underlying rule still scores 1.000 there.
  - term: Interpolation and extrapolation
    definition: >-
      Interpolation is filling in between the examples; extrapolation is answering beyond their range.
      Models interpolate. A nearest-neighbour regressor measured here has 0.180 error inside its training
      range and 139.704 outside it, and its largest prediction outside the range, 97.307, never exceeds the
      largest target it saw in training, 98.862 -- it structurally cannot return a value it has not seen.
  - term: Label noise
    definition: >-
      Recorded outputs that are wrong: mis-entered, disputed between annotators, or genuinely ambiguous. It
      is the usual cause of a low ceiling, it is measured by re-labelling a sample and counting
      disagreements, and it cannot be fixed by a better model or by more data.
  - term: One-nearest-neighbour classifier
    definition: >-
      A model whose fit step stores the training set and whose predict step returns the label of the
      closest stored point. Its training accuracy is exactly 1.000 by construction, because a training
      point's closest stored point is itself at distance zero -- unless two identical feature rows carry
      different labels, which is the sole exception and does occur in iris.
  - term: Variance-limited versus noise-limited
    definition: >-
      A problem is variance-limited when the boundary is learnable and the sample is too small to reveal
      it; more data helps decisively, measured here as a 39.8-point gain. It is noise-limited when the
      labels themselves are wrong; more data moves it barely, measured here as 2.1 points against a ceiling
      it already sat within 3.5 points of.
  - term: Target function
    definition: >-
      The function you wish you had, mapping inputs to correct outputs. You never have it. What you have is
      a sample of its behaviour, possibly with errors in the recorded outputs, and the model is your best
      approximation of it from that sample.
  - term: The rule test
    definition: >-
      The first question to ask of any candidate machine learning problem: can the correct answer be
      computed by a rule you can write down? If it can, write the rule. A rule is exactly correct, needs no
      labels, never drifts, costs nothing to run and can be reviewed by someone who is not you -- and in
      this lesson a three-line rule scores 1.000 where the best trained model reaches 0.9675.
