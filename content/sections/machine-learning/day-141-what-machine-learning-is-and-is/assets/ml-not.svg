<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things it is not</title>
  <style>
    .ml-not-bg   { fill: #f8fafc; }
    .ml-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ml-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ml-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ml-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ml-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ml-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ml-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ml-not-row { opacity: 1; }
    .ml-not-r0 { animation-delay: 0.00s; }
    .ml-not-r1 { animation-delay: 0.45s; }
    .ml-not-r2 { animation-delay: 0.90s; }
    .ml-not-r3 { animation-delay: 1.35s; }
    .ml-not-r4 { animation-delay: 1.80s; }
    .ml-not-row { animation: ml-not-reveal 7.3s ease-in-out infinite; }
    @keyframes ml-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ml-not-bg" width="980" height="390"/>
  <text class="ml-not-h1"  x="30" y="40">Four things it is not</text>
  <text class="ml-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="ml-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ml-not-name" x="46" y="122">The misconception</text>
  <text class="ml-not-desc" x="46" y="142">Commonly held.</text>
  <text class="ml-not-desc ml-not-row ml-not-r0" x="46" y="182">A high accuracy means the model works</text>
  <text class="ml-not-desc ml-not-row ml-not-r1" x="46" y="216">It finds causes</text>
  <text class="ml-not-desc ml-not-row ml-not-r2" x="46" y="250">It works without enough data</text>
  <text class="ml-not-desc ml-not-row ml-not-r3" x="46" y="284">More complex models are better</text>
  <text class="ml-not-desc ml-not-row ml-not-r4" x="46" y="318">It removes the need to understand the problem</text>
  <rect class="ml-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ml-not-name" x="526" y="122">What is true</text>
  <text class="ml-not-desc" x="526" y="142">Actually.</text>
  <text class="ml-not-desc ml-not-row ml-not-r0" x="526" y="182">Only on data it has not seen, against a baseline</text>
  <text class="ml-not-desc ml-not-row ml-not-r1" x="526" y="216">It finds correlation, and nothing more</text>
  <text class="ml-not-desc ml-not-row ml-not-r2" x="526" y="250">Below a threshold it cannot begin</text>
  <text class="ml-not-desc ml-not-row ml-not-r3" x="526" y="284">Complexity trades against generalisation</text>
  <text class="ml-not-desc ml-not-row ml-not-r4" x="526" y="318">Framing the problem is most of the work</text>
  <text class="ml-not-sub" x="30" y="372">The causation row is the one with real-world consequences, and it recurs in the feature importance and interpretability lessons for the same reason.</text>
</svg>
