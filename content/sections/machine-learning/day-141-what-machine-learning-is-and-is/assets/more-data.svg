<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what it does not.">
  <title>What more data fixes</title>
  <style>
    .more-data-bg   { fill: #f8fafc; }
    .more-data-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .more-data-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .more-data-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .more-data-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .more-data-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .more-data-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .more-data-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .more-data-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .more-data-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .more-data-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .more-data-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .more-data-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .more-data-row { opacity: 1; }
    .more-data-r0 { animation-delay: 0.00s; }
    .more-data-r1 { animation-delay: 0.45s; }
    .more-data-r2 { animation-delay: 0.90s; }
    .more-data-r3 { animation-delay: 1.35s; }
    .more-data-r4 { animation-delay: 1.80s; }
    .more-data-row { animation: more-data-reveal 7.3s ease-in-out infinite; }
    @keyframes more-data-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="more-data-bg" width="980" height="390"/>
  <text class="more-data-h1"  x="30" y="40">What more data fixes</text>
  <text class="more-data-sub" x="30" y="64">And what it does not.</text>
  <rect class="more-data-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="more-data-name" x="46" y="122">More data helps</text>
  <text class="more-data-desc" x="46" y="142">Variance problems.</text>
  <text class="more-data-desc more-data-row more-data-r0" x="46" y="182">A model memorising its training set</text>
  <text class="more-data-desc more-data-row more-data-r1" x="46" y="216">A large train-test gap</text>
  <text class="more-data-desc more-data-row more-data-r2" x="46" y="250">Unstable predictions between runs</text>
  <text class="more-data-desc more-data-row more-data-r3" x="46" y="284">Rare cases seen too seldom</text>
  <text class="more-data-desc more-data-row more-data-r4" x="46" y="318">Estimates that are noisy rather than wrong</text>
  <rect class="more-data-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="more-data-name" x="526" y="122">More data does not help</text>
  <text class="more-data-desc" x="526" y="142">Bias and ceiling problems.</text>
  <text class="more-data-desc more-data-row more-data-r0" x="526" y="182">A model too simple for the pattern</text>
  <text class="more-data-desc more-data-row more-data-r1" x="526" y="216">Both scores poor and close together</text>
  <text class="more-data-desc more-data-row more-data-r2" x="526" y="250">Information absent from the features</text>
  <text class="more-data-desc more-data-row more-data-r3" x="526" y="284">The irreducible noise floor</text>
  <text class="more-data-desc more-data-row more-data-r4" x="526" y="318">A wrongly framed problem</text>
  <text class="more-data-sub" x="30" y="372">This asymmetry decides whether a data-collection budget is worth spending, and it is answerable in an afternoon with a learning curve.</text>
</svg>
