visuals:
  - id: what-ml-is-architecture
    file: assets/what-ml-is-architecture.svg
    type: diagram
    title: >-
      The three ingredients of machine learning feeding a search over a family of functions, with the
      boundary of the training distribution drawn as a visible region
    alt: >-
      Diagram: on the left, three stacked boxes labelled data, model class and objective, feeding arrows
      into a centre box labelled search, which finds the member of the family that scores best on the
      examples. An arrow from the search leads to a box labelled one trained function, noting that it maps
      any input to an output, has no idea why, and will answer wherever you point it. Below, a wide panel
      labelled feature space contains a shaded dashed ellipse labelled training distribution, holding six
      blue points, with the note that the examples came from here and the score was measured here. Four
      orange points sit outside the ellipse under a heading reading outside the training distribution, with
      the note that the function still returns a confident answer there, that no example was ever drawn from
      that region, and that no measurement made inside the region says anything about it
    description: >-
      A static architecture diagram in two parts. The upper part is the definition: three white cards on the
      left -- Data (examples of the function's output, pairs of input and label), Model class (the family of
      functions you are willing to search through) and Objective (a score that ranks one candidate above
      another) -- with arrows converging on a single soft-blue card labelled Search, which finds the member
      of the family that scores best on the examples and notes that nothing else is needed. One arrow leaves
      the search for a card reading "One trained function", annotated that it maps any input to an output,
      has no idea why, and will answer wherever you point it. The lower part is the consequence: a wide
      panel labelled "Feature space: every input the trained function can be asked about" containing a
      dashed blue ellipse labelled Training distribution with six blue points inside it, and four orange
      points scattered outside it under a warning-coloured heading reading "Outside the training
      distribution". The annotation beside the orange points states that the function still returns a
      confident answer there, that no example was ever drawn from that region, and that no measurement made
      inside the region says anything about it. Drawing the distribution as a region rather than as an
      adjective is the diagram's whole purpose.
  - id: memorise-vs-generalise-flow
    file: assets/memorise-vs-generalise-flow.svg
    type: flow-animated
    title: >-
      A memorising model and a simpler model side by side, with unseen points arriving into both, showing
      that the better training score belongs to the worse model
    alt: >-
      Diagram: two panels side by side sharing the same seven blue training points. The left panel, headed
      memorises: full-depth tree, draws a jagged line passing through every training point exactly, and
      three orange unseen points arrive from above and settle far from that line, each joined to it by a
      long dashed orange bar. Its scores read training accuracy 1.000 and accuracy on unseen data 0.6535.
      The right panel, headed generalises: one straight boundary, draws a single straight line that misses
      several training points, and three orange unseen points settle close to it with short dashed bars. Its
      scores read training accuracy 0.780 and accuracy on unseen data 0.7655. A caption states that the
      model which scored a perfect 1.000 on what it had seen scores 0.6535 on what it had not, 11.2 points
      below the simpler model, and that with motion switched off every point, bar, fit and score already
      sits in its final position
    description: >-
      An animated flow diagram, fully readable as a still image. Two panels sit side by side and share the
      same seven blue training points. In the left panel, headed "Memorises: full-depth tree", a jagged
      polyline passes through every training point exactly; three orange unseen points drop in from above on
      a staggered six-second loop and settle far from that line, each joined to it by a long dashed orange
      error bar. Its score lines read "Training accuracy 1.000" in green and "Accuracy on unseen data
      0.6535" in warning orange. In the right panel, headed "Generalises: one straight boundary", a single
      straight line misses several training points; the same three orange points settle close to it with
      short dashed bars, and its score lines read "Training accuracy 0.780" in plain text and "Accuracy on
      unseen data 0.7655" in green. Two marching-dash feeds at the top carry the unseen points into each
      panel, and each test-accuracy label pulses gently once per cycle. Every value is measured on the same
      300 training rows and 2000 unseen rows with 20 percent of the labels flipped. A prefers-reduced-motion
      block disables the marching dashes, freezes every arriving point at its final resting position at full
      opacity, and stops the pulse, leaving every point, bar, fit line, score and caption fully drawn and
      fully legible.
