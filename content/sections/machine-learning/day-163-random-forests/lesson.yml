id: D163
day: 163
slug: random-forests
title: Random Forests
section: machine-learning
subsection: supervised-learning
week: 24
learning_promise: >-
  Master the theory, mathematics, and implementation of Random Forests: why ensembling reduces model variance without
  increasing bias, how Bootstrap Aggregation (Bagging) samples data with replacement, why random feature subspace selection
  decorrelates individual trees, how Out-of-Bag (OOB) error provides free cross-validation, and how Random Forests achieve
  industry-standard tabular accuracy.
objectives:
  - 'Derive the mathematical variance reduction formula for an ensemble of correlated estimators'
  - 'Explain Bootstrap Aggregation (Bagging) and prove that 36.8% of samples are Out-of-Bag'
  - 'Analyze why random feature subspace selection (max_features = sqrt(D)) decorrelates trees'
  - 'Implement a complete Random Forest Classifier from scratch in NumPy with majority voting'
  - 'Calculate Out-of-Bag (OOB) accuracy and explain why it eliminates the need for a separate validation split'
  - 'Contrast Mean Decrease in Impurity (MDI) with Permutation Feature Importance'
  - 'Compare Random Forests against single Decision Trees across bias, variance, and computational complexity'
  - 'Benchmark custom Random Forests against scikit-learn on high-dimensional clinical tabular data'
prerequisites:
  - 'Day 162 -- Decision Trees and CART splitting'
  - 'Day 152 -- Bias-Variance Trade-off'
reading_time_minutes: 50
practical_time_minutes: 60
