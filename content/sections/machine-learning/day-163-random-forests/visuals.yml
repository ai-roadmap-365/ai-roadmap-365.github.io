visuals:
  - id: random-forest-architecture
    file: assets/random-forest-architecture.svg
    type: diagram
    title: 'Random Forest Architecture: Bagging, Random Subspaces, and Voting'
    alt: 'Architecture diagram showing training data split into B bootstrap datasets, training B randomized trees with feature subsets, and aggregating via majority vote.'
    description: 'A static architecture diagram illustrating the end-to-end Random Forest pipeline from bootstrap data resampling through parallel tree induction to majority voting.'
  - id: oob-evaluation-flow
    file: assets/oob-evaluation-flow.svg
    type: flow-animated
    title: 'Out-of-Bag (OOB) Free Validation Evaluation Mechanism'
    alt: 'Animated flow chart illustrating how out-of-bag samples (~36.8%) are routed through non-training trees to produce unbiased validation metrics.'
    description: 'An animated flow chart demonstrating out-of-bag evaluation mechanics without separate validation data.'
  - id: forest-idea
    file: assets/forest-idea.svg
    type: diagram
    title: 'Why averaging works'
    alt: 'Diagram: why averaging many decorrelated models reduces error'
    description: 'A four-stage description of ensembling covering individual error, independence, cancellation and the requirement.'
  - id: variance-math
    file: assets/variance-math.svg
    type: diagram
    title: 'The variance arithmetic'
    alt: 'Diagram: how ensemble variance depends on correlation between members'
    description: 'A four-stage description of ensemble variance covering the independent case, the correlated case, the limit and the implication.'
  - id: bagging
    file: assets/bagging.svg
    type: diagram
    title: 'Bagging'
    alt: 'Diagram: how bootstrap sampling produces diverse training sets'
    description: 'A four-stage description of bagging covering resampling, the omitted examples, independent fitting and aggregation.'
  - id: feature-subspace
    file: assets/feature-subspace.svg
    type: diagram
    title: 'Random feature selection'
    alt: 'Diagram: how restricting features at each split decorrelates the trees'
    description: 'A four-stage description of feature subsampling covering the dominant feature, the correlation problem, the restriction and the effect.'
  - id: oob
    file: assets/oob.svg
    type: diagram
    title: 'Out-of-bag scoring'
    alt: 'Diagram: how out-of-bag examples provide validation without a holdout set'
    description: 'A four-stage description of out-of-bag estimation covering the omitted rows, per-row prediction, aggregation and the equivalence.'
  - id: forest-not
    file: assets/forest-not.svg
    type: diagram
    title: 'What a random forest is not'
    alt: 'Diagram: four misconceptions about random forests'
    description: 'A two-column comparison of misconceptions about random forests against what is true.'
  - id: bagging-vs-boosting
    file: assets/bagging-vs-boosting.svg
    type: diagram
    title: 'Bagging against boosting'
    alt: 'Diagram: bagging compared with boosting'
    description: 'A two-column comparison of bagging against boosting.'
  - id: forest-history
    file: assets/forest-history.svg
    type: diagram
    title: 'Four steps to random forests'
    alt: 'Diagram: the historical progression toward random forests'
    description: 'A four-stage description of forest history covering single trees, bagging, feature subspaces and the combination.'
  - id: crowd
    file: assets/crowd.svg
    type: diagram
    title: 'Asking a crowd'
    alt: 'Diagram: independent estimates compared with correlated ones'
    description: 'A two-column comparison of independent crowd estimates against correlated ones.'
  - id: forest-implications
    file: assets/forest-implications.svg
    type: diagram
    title: 'Four consequences of forests'
    alt: 'Diagram: the accuracy, cost, interpretability and memory implications of random forests'
    description: 'A four-stage description of forest implications covering accuracy, training cost, lost interpretability and memory.'
  - id: forest-when
    file: assets/forest-when.svg
    type: diagram
    title: 'When to use a random forest'
    alt: 'Diagram: when random forests are the right model'
    description: 'A two-column comparison of situations favouring random forests against alternatives.'
