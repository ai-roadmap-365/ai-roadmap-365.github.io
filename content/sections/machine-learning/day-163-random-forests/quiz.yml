questions:
  - question: 'What is the theoretical variance of the average of B estimators, each with variance sigma^2 and pairwise correlation rho?'
    options:
      - 'Var(f_bar) = (1 - rho) * sigma^2'
      - 'Var(f_bar) = B * sigma^2'
      - 'Var(f_bar) = sigma^2 / B'
      - 'Var(f_bar) = rho * sigma^2 + ((1 - rho) / B) * sigma^2'
    answer_index: 3
    explanation: 'As B approaches infinity, the second term vanishes, leaving rho * sigma^2. This proves that the lower bound on ensemble variance is determined by tree correlation rho.'

  - question: 'What is the asymptotic probability that a specific training sample is NOT selected in a bootstrap sample of size N?'
    options:
      - 'About 36.8%'
      - 'About 50.0%'
      - 'About 0.0%'
      - 'About 1/N'
    answer_index: 0
    explanation: 'Each draw omits the sample with probability (1 - 1/N). Drawing N times independently yields (1 - 1/N)^N, which converges to 1/e ~ 36.8% as N grows large.'

  - question: 'Why does a Random Forest randomly subset features (e.g. max_features = sqrt(D)) at each split, instead of just using standard Bagging?'
    options:
      - 'To reduce memory consumption'
      - 'To decorrelate the trees, so variance actually falls'
      - 'To make the trees linearly separable'
      - 'To convert classification trees into regression trees'
    answer_index: 1
    explanation: 'If a dominant feature exists, standard bagged trees will all pick that feature at the root, leading to high correlation rho. Subsetting features forces trees to explore alternative predictive pathways.'

  - question: 'What is Out-of-Bag (OOB) error estimation in Random Forests?'
    options:
      - 'Evaluating the model on samples with missing values'
      - 'Testing the model on an external Kaggle dataset'
      - 'Score each row using only the trees that excluded it'
      - 'The training error computed on the in-bag samples'
    answer_index: 2
    explanation: 'Because ~36.8% of trees never saw sample i during training, aggregating predictions from those trees provides an unbiased validation estimate without setting aside a validation fold.'

  - question: 'How does increasing the number of trees (n_estimators) in a Random Forest affect model generalization?'
    options:
      - 'It changes the linear decision boundary'
      - 'It causes severe overfitting as B becomes large'
      - 'It increases bias and degrades training accuracy'
      - 'It reduces variance and then plateaus'
    answer_index: 3
    explanation: 'Unlike boosting or neural networks, adding more trees to a Random Forest cannot cause overfitting; it simply averages out more variance until the correlation limit rho * sigma^2 is reached.'

  - question: 'What is the standard recommended default value for max_features in Random Forest classification vs regression?'
    options:
      - 'sqrt(D) for classification, D/3 for regression'
      - 'Classification: D; Regression: 1'
      - 'Classification: D / 2; Regression: D / 2'
      - 'Classification: log2(D); Regression: sqrt(D)'
    answer_index: 0
    explanation: 'Empirical work by Breiman established sqrt(D) as the standard default for classification and D/3 for regression tasks.'

  - question: 'Why can Random Forests be trained in parallel across multiple CPU cores with near-linear speedup?'
    options:
      - 'Because trees use GPU tensor cores'
      - 'The trees are independent, so they parallelise'
      - 'Because random forests share a single global weight matrix'
      - 'Because decision trees do not require sorting'
    answer_index: 1
    explanation: 'In Bagging, each tree is constructed independently from its own bootstrap sample, allowing all trees to be trained simultaneously across all available CPU threads.'

  - question: 'What is a major limitation of Random Forests compared to linear models or neural networks?'
    options:
      - 'They cannot handle non-linear relationships'
      - 'They require feature normalization and scaling'
      - 'They cannot extrapolate beyond the training range'
      - 'They cannot be used for multi-class classification'
    answer_index: 2
    explanation: 'Because tree leaves predict constant values (averages or majority classes), a Random Forest can never predict a target value higher than the maximum target seen in the training set.'
