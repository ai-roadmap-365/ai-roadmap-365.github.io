terms:
  - term: 'Random Forest'
    definition: 'An ensemble learning method that constructs a multitude of decorrelated decision trees using bootstrap aggregation and random feature subspace selection.'
  - term: 'Bootstrap Aggregation (Bagging)'
    definition: 'An ensemble technique that trains multiple base estimators on bootstrap samples drawn uniformly with replacement from the original dataset.'
  - term: 'Out-of-Bag (OOB) Sample'
    definition: 'The ~36.8% of training observations omitted from a given bootstrap sample, used for internal cross-validation and unbiased error estimation.'
  - term: 'Random Feature Subspace'
    definition: 'The random selection of a subset of features (typically sqrt(D)) considered at each candidate split in a tree to reduce inter-tree correlation.'
  - term: 'Ensemble Decorrelation'
    definition: 'The mathematical reduction of pairwise correlation rho among ensemble members, maximizing the variance reduction achievable through averaging.'
  - term: 'Majority Voting'
    definition: 'The ensemble aggregation rule where each base classifier casts one vote for a predicted class, and the class with the most votes is chosen.'
  - term: 'Mean Decrease in Impurity (MDI)'
    definition: 'Feature importance computed by accumulating the total weighted impurity reduction brought by a feature across all nodes in all trees in the forest.'
  - term: 'Permutation Feature Importance'
    definition: 'A model-agnostic feature importance metric that measures the drop in model score when values of a single feature are randomly shuffled.'
  - term: 'Extrapolation Limit'
    definition: 'The inherent property of tree-based models where predictions are bounded by the range of observed training target values, preventing linear trend extrapolation.'
  - term: 'Embarrassingly Parallel'
    definition: 'A computation that requires zero communication between sub-tasks, allowing random forest trees to train simultaneously across all CPU cores.'
