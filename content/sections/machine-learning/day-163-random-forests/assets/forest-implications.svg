<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of forests</title>
  <style>
    .forest-implications-bg   { fill: #f8fafc; }
    .forest-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forest-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forest-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forest-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forest-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forest-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forest-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forest-implications-stage { opacity: 1; }

    .forest-implications-s0 { animation-delay: 0.00s; }
    .forest-implications-e0 { animation-delay: 0.00s; }
    .forest-implications-s1 { animation-delay: 1.28s; }
    .forest-implications-e1 { animation-delay: 1.28s; }
    .forest-implications-s2 { animation-delay: 2.56s; }
    .forest-implications-e2 { animation-delay: 2.56s; }
    .forest-implications-s3 { animation-delay: 3.84s; }
    .forest-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forest-implications-conn  { animation: forest-implications-trace 6.4s ease-in-out infinite; }
      .forest-implications-stage { animation: forest-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forest-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forest-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forest-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forest-implications-stage { animation: forest-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forest-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forest-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forest-implications-bg" width="980" height="322"/>
  <text class="forest-implications-h1"  x="30" y="40">Four consequences of forests</text>
  <text class="forest-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="forest-implications-stage forest-implications-s0">
    <rect class="forest-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forest-implications-step" x="44" y="142">01</text>
    <text class="forest-implications-name" x="70" y="142">Strong accuracy with almost no tuning</text>
    <text class="forest-implications-desc" x="44" y="166">Which is why it is the default</text>
    <text class="forest-implications-desc" x="44" y="182">first serious model.</text>
  </g>
  <line class="forest-implications-line forest-implications-conn forest-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forest-implications-tip)"/>
  <g class="forest-implications-stage forest-implications-s1">
    <rect class="forest-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forest-implications-step" x="280" y="142">02</text>
    <text class="forest-implications-name" x="306" y="142">Training parallelises across all cores</text>
    <text class="forest-implications-desc" x="280" y="166">So it is fast in wall-clock</text>
    <text class="forest-implications-desc" x="280" y="182">terms.</text>
  </g>
  <line class="forest-implications-line forest-implications-conn forest-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forest-implications-tip)"/>
  <g class="forest-implications-stage forest-implications-s2">
    <rect class="forest-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forest-implications-step" x="516" y="142">03</text>
    <text class="forest-implications-name" x="542" y="142">But the single tree's readable path is gone</text>
    <text class="forest-implications-desc" x="516" y="166">Replaced by importances and</text>
    <text class="forest-implications-desc" x="516" y="182">partial dependence.</text>
  </g>
  <line class="forest-implications-line forest-implications-conn forest-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forest-implications-tip)"/>
  <g class="forest-implications-stage forest-implications-s3">
    <rect class="forest-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forest-implications-step" x="752" y="142">04</text>
    <text class="forest-implications-name" x="778" y="142">And hundreds of trees take real memory</text>
    <text class="forest-implications-desc" x="752" y="166">Which matters at serving time.</text>
  </g>
  <text class="forest-implications-sub" x="30" y="304">Losing the readable decision path is the real cost of ensembling, and it is why a single tree remains useful as an inspection tool alongside the forest.</text>
</svg>
