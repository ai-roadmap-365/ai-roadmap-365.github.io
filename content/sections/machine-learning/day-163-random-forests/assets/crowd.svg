<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Independence is the requirement.">
  <title>Asking a crowd</title>
  <style>
    .crowd-bg   { fill: #f8fafc; }
    .crowd-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowd-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowd-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowd-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowd-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crowd-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crowd-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .crowd-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .crowd-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .crowd-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .crowd-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .crowd-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .crowd-row { opacity: 1; }
    .crowd-r0 { animation-delay: 0.00s; }
    .crowd-r1 { animation-delay: 0.45s; }
    .crowd-r2 { animation-delay: 0.90s; }
    .crowd-r3 { animation-delay: 1.35s; }
    .crowd-r4 { animation-delay: 1.80s; }
    .crowd-row { animation: crowd-reveal 7.3s ease-in-out infinite; }
    @keyframes crowd-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="crowd-bg" width="980" height="390"/>
  <text class="crowd-h1"  x="30" y="40">Asking a crowd</text>
  <text class="crowd-sub" x="30" y="64">Independence is the requirement.</text>
  <rect class="crowd-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="crowd-name" x="46" y="122">Independent guesses</text>
  <text class="crowd-desc" x="46" y="142">Errors cancel.</text>
  <text class="crowd-desc crowd-row crowd-r0" x="46" y="182">Each person guesses alone</text>
  <text class="crowd-desc crowd-row crowd-r1" x="46" y="216">Errors scatter in all directions</text>
  <text class="crowd-desc crowd-row crowd-r2" x="46" y="250">The average is remarkably close</text>
  <text class="crowd-desc crowd-row crowd-r3" x="46" y="284">More people helps further</text>
  <text class="crowd-desc crowd-row crowd-r4" x="46" y="318">This is a decorrelated ensemble</text>
  <rect class="crowd-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="crowd-name" x="526" y="122">Correlated guesses</text>
  <text class="crowd-desc" x="526" y="142">Errors accumulate.</text>
  <text class="crowd-desc crowd-row crowd-r0" x="526" y="182">Everyone hears the first guess</text>
  <text class="crowd-desc crowd-row crowd-r1" x="526" y="216">Errors all point the same way</text>
  <text class="crowd-desc crowd-row crowd-r2" x="526" y="250">The average inherits the bias</text>
  <text class="crowd-desc crowd-row crowd-r3" x="526" y="284">More people does not help</text>
  <text class="crowd-desc crowd-row crowd-r4" x="526" y="318">This is a correlated ensemble</text>
  <text class="crowd-sub" x="30" y="372">The crowd result depends entirely on independence, which is exactly the condition random feature selection is engineered to create.</text>
</svg>
