<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What a random forest is not</title>
  <style>
    .forest-not-bg   { fill: #f8fafc; }
    .forest-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forest-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forest-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forest-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forest-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forest-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forest-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forest-not-row { opacity: 1; }
    .forest-not-r0 { animation-delay: 0.00s; }
    .forest-not-r1 { animation-delay: 0.45s; }
    .forest-not-r2 { animation-delay: 0.90s; }
    .forest-not-r3 { animation-delay: 1.35s; }
    .forest-not-r4 { animation-delay: 1.80s; }
    .forest-not-row { animation: forest-not-reveal 7.3s ease-in-out infinite; }
    @keyframes forest-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="forest-not-bg" width="980" height="390"/>
  <text class="forest-not-h1"  x="30" y="40">What a random forest is not</text>
  <text class="forest-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="forest-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="forest-not-name" x="46" y="122">The misconception</text>
  <text class="forest-not-desc" x="46" y="142">Commonly held.</text>
  <text class="forest-not-desc forest-not-row forest-not-r0" x="46" y="182">More trees can overfit</text>
  <text class="forest-not-desc forest-not-row forest-not-r1" x="46" y="216">It is a black box</text>
  <text class="forest-not-desc forest-not-row forest-not-r2" x="46" y="250">Feature importances show causation</text>
  <text class="forest-not-desc forest-not-row forest-not-r3" x="46" y="284">Individual trees should be good</text>
  <text class="forest-not-desc forest-not-row forest-not-r4" x="46" y="318">It needs careful tuning</text>
  <rect class="forest-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="forest-not-name" x="526" y="122">What is true</text>
  <text class="forest-not-desc" x="526" y="142">Actually.</text>
  <text class="forest-not-desc forest-not-row forest-not-r0" x="526" y="182">More trees only converge; they never overfit</text>
  <text class="forest-not-desc forest-not-row forest-not-r1" x="526" y="216">Importances and paths are inspectable</text>
  <text class="forest-not-desc forest-not-row forest-not-r2" x="526" y="250">They show predictive use, nothing more</text>
  <text class="forest-not-desc forest-not-row forest-not-r3" x="526" y="284">Weak decorrelated trees are the design</text>
  <text class="forest-not-desc forest-not-row forest-not-r4" x="526" y="318">Defaults work remarkably well</text>
  <text class="forest-not-sub" x="30" y="372">Feature importance being read as causal is the error with real consequences: it reflects what the model found useful, which includes proxies and leakage.</text>
</svg>
