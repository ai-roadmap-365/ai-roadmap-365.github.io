<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Out-of-Bag Evaluation Flow">
  <title>Out-of-Bag (OOB) Evaluation Mechanism</title>
  <defs>
    <style>
      .d163f-bg { fill: #f8fafc; }
      .d163f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d163f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .d163f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d163f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      
      @keyframes d163f-highlight {
        0%, 100% { stroke: #3b82f6; stroke-width: 2; }
        50% { stroke: #22c55e; stroke-width: 3.5; }
      }
      .d163f-active { animation: d163f-highlight 3s infinite ease-in-out; }
      
      @media (prefers-reduced-motion: reduce) {
        .d163f-active { animation: none; stroke: #3b82f6; stroke-width: 2; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d163f-bg" />

  <text x="40" y="45" class="d163f-title" font-size="22">Out-of-Bag (OOB) Free Validation Evaluation</text>
  <text x="40" y="70" class="d163f-text">Unbiased validation without setting aside an explicit holdout dataset: 1/e ≈ 36.8% OOB per tree</text>

  <!-- Left: Step Breakdown -->
  <rect x="40" y="100" width="460" height="340" class="d163f-card" />
  <text x="60" y="130" class="d163f-title" fill="#1e40af">OOB Step-by-Step Mechanism</text>

  <!-- Step 1 -->
  <rect x="60" y="150" width="420" height="50" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="75" y="172" class="d163f-title" font-size="12" fill="#1e293b">1. Bootstrap Resampling (Per Tree b)</text>
  <text x="75" y="190" class="d163f-text" font-size="11">Draw N samples with replacement. In-Bag: 63.2%, Out-of-Bag: 36.8%.</text>

  <!-- Step 2 -->
  <rect x="60" y="210" width="420" height="50" fill="#eff6ff" stroke="#bfdbfe" rx="6" class="d163f-active" />
  <text x="75" y="232" class="d163f-title" font-size="12" fill="#1d4ed8">2. Isolate Non-Training Trees for Sample i</text>
  <text x="75" y="250" class="d163f-text" font-size="11">For observation (x_i, y_i), identify all trees B_i where i was NOT sampled.</text>

  <!-- Step 3 -->
  <rect x="60" y="270" width="420" height="50" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
  <text x="75" y="292" class="d163f-title" font-size="12" fill="#1e293b">3. Out-of-Bag Vote Aggregation</text>
  <text x="75" y="310" class="d163f-text" font-size="11">Aggregate predictions: ŷ_i^OOB = mode({ Tree_b(x_i) | b ∈ B_i }).</text>

  <!-- Step 4 -->
  <rect x="60" y="330" width="420" height="50" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
  <text x="75" y="352" class="d163f-title" font-size="12" fill="#16a34a">4. Compute OOB Error Metric</text>
  <text x="75" y="370" class="d163f-math" font-size="11">OOB_Score = (1 / N) · ∑ I( ŷ_i^OOB == y_i )</text>

  <!-- Right: Mathematical Proof Card -->
  <rect x="520" y="100" width="340" height="340" class="d163f-card" />
  <text x="540" y="130" class="d163f-title" fill="#1e40af">Why 36.8% is Left Out</text>

  <text x="540" y="165" class="d163f-text">Probability of single draw NOT picking sample i:</text>
  <rect x="540" y="175" width="300" height="35" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
  <text x="555" y="198" class="d163f-math">P(not chosen in 1 draw) = 1 - 1/N</text>

  <text x="540" y="235" class="d163f-text">Probability of NOT picking i across N draws:</text>
  <rect x="540" y="245" width="300" height="35" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
  <text x="555" y="268" class="d163f-math">P(OOB) = (1 - 1/N)^N</text>

  <text x="540" y="305" class="d163f-text">Asymptotic limit as N ➔ ∞:</text>
  <rect x="540" y="315" width="300" height="40" fill="#eff6ff" stroke="#3b82f6" rx="4" />
  <text x="555" y="340" class="d163f-math" fill="#1e40af">lim (1 - 1/N)^N = 1/e ≈ 0.36788</text>

  <text x="540" y="380" class="d163f-text" font-size="12">Each tree leaves ~36.8% of the data untouched, creating a built-in cross-validation engine.</text>
</svg>
