<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Bagging</title>
  <style>
    .bagging-bg   { fill: #f8fafc; }
    .bagging-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bagging-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bagging-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bagging-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bagging-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bagging-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bagging-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bagging-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bagging-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bagging-stage { opacity: 1; }

    .bagging-s0 { animation-delay: 0.00s; }
    .bagging-e0 { animation-delay: 0.00s; }
    .bagging-s1 { animation-delay: 1.28s; }
    .bagging-e1 { animation-delay: 1.28s; }
    .bagging-s2 { animation-delay: 2.56s; }
    .bagging-e2 { animation-delay: 2.56s; }
    .bagging-s3 { animation-delay: 3.84s; }
    .bagging-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bagging-conn  { animation: bagging-trace 6.4s ease-in-out infinite; }
      .bagging-stage { animation: bagging-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bagging-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bagging-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bagging-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bagging-stage { animation: bagging-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bagging-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bagging-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bagging-bg" width="980" height="322"/>
  <text class="bagging-h1"  x="30" y="40">Bagging</text>
  <text class="bagging-sub" x="30" y="64">Four steps.</text>
  <g class="bagging-stage bagging-s0">
    <rect class="bagging-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bagging-step" x="44" y="142">01</text>
    <text class="bagging-name" x="70" y="142">Sample the training set with replacement</text>
    <text class="bagging-desc" x="44" y="166">Same size, but some rows</text>
    <text class="bagging-desc" x="44" y="182">repeated and some absent.</text>
  </g>
  <line class="bagging-line bagging-conn bagging-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bagging-tip)"/>
  <g class="bagging-stage bagging-s1">
    <rect class="bagging-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bagging-step" x="280" y="142">02</text>
    <text class="bagging-name" x="306" y="142">About a third of rows are left out each time</text>
    <text class="bagging-desc" x="280" y="166">Which becomes useful later.</text>
  </g>
  <line class="bagging-line bagging-conn bagging-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bagging-tip)"/>
  <g class="bagging-stage bagging-s2">
    <rect class="bagging-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bagging-step" x="516" y="142">03</text>
    <text class="bagging-name" x="542" y="142">Fit an independent tree on each sample</text>
    <text class="bagging-desc" x="516" y="166">In parallel, with no</text>
    <text class="bagging-desc" x="516" y="182">communication.</text>
  </g>
  <line class="bagging-line bagging-conn bagging-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bagging-tip)"/>
  <g class="bagging-stage bagging-s3">
    <rect class="bagging-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bagging-step" x="752" y="142">04</text>
    <text class="bagging-name" x="778" y="142">Then average their predictions</text>
    <text class="bagging-desc" x="752" y="166">Or take a majority vote for</text>
    <text class="bagging-desc" x="752" y="182">classification.</text>
    <text class="bagging-edge" x="752" y="242">parallel</text>
  </g>
  <text class="bagging-sub" x="30" y="304">Trees being fitted independently is why bagging parallelises perfectly, in contrast to boosting where each model depends on the last.</text>
</svg>
