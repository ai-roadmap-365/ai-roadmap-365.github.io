<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The variance arithmetic</title>
  <style>
    .variance-math-bg   { fill: #f8fafc; }
    .variance-math-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .variance-math-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .variance-math-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .variance-math-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .variance-math-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .variance-math-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .variance-math-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .variance-math-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .variance-math-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .variance-math-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .variance-math-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .variance-math-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .variance-math-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .variance-math-stage { opacity: 1; }

    .variance-math-s0 { animation-delay: 0.00s; }
    .variance-math-e0 { animation-delay: 0.00s; }
    .variance-math-s1 { animation-delay: 1.28s; }
    .variance-math-e1 { animation-delay: 1.28s; }
    .variance-math-s2 { animation-delay: 2.56s; }
    .variance-math-e2 { animation-delay: 2.56s; }
    .variance-math-s3 { animation-delay: 3.84s; }
    .variance-math-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .variance-math-conn  { animation: variance-math-trace 6.4s ease-in-out infinite; }
      .variance-math-stage { animation: variance-math-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes variance-math-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes variance-math-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .variance-math-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .variance-math-stage { animation: variance-math-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes variance-math-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="variance-math-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="variance-math-bg" width="980" height="322"/>
  <text class="variance-math-h1"  x="30" y="40">The variance arithmetic</text>
  <text class="variance-math-sub" x="30" y="64">Four steps.</text>
  <g class="variance-math-stage variance-math-s0">
    <rect class="variance-math-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="variance-math-step" x="44" y="142">01</text>
    <text class="variance-math-name" x="70" y="142">Averaging n independent models divides variance by n</text>
    <text class="variance-math-desc" x="44" y="166">Which would be a free</text>
    <text class="variance-math-desc" x="44" y="182">improvement.</text>
  </g>
  <line class="variance-math-line variance-math-conn variance-math-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#variance-math-tip)"/>
  <g class="variance-math-stage variance-math-s1">
    <rect class="variance-math-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="variance-math-step" x="280" y="142">02</text>
    <text class="variance-math-name" x="306" y="142">But real models are correlated</text>
    <text class="variance-math-desc" x="280" y="166">They see the same data and make</text>
    <text class="variance-math-desc" x="280" y="182">similar errors.</text>
  </g>
  <line class="variance-math-line variance-math-conn variance-math-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#variance-math-tip)"/>
  <g class="variance-math-stage variance-math-s2">
    <rect class="variance-math-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="variance-math-step" x="516" y="142">03</text>
    <text class="variance-math-name" x="542" y="142">So variance falls toward the correlation, not to zero</text>
    <text class="variance-math-desc" x="516" y="166">Adding trees past that point</text>
    <text class="variance-math-desc" x="516" y="182">buys nothing.</text>
  </g>
  <line class="variance-math-line variance-math-conn variance-math-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#variance-math-tip)"/>
  <g class="variance-math-stage variance-math-s3">
    <rect class="variance-math-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="variance-math-step" x="752" y="142">04</text>
    <text class="variance-math-name" x="778" y="142">Which is why decorrelation is the design goal</text>
    <text class="variance-math-desc" x="752" y="166">Lowering correlation lowers the</text>
    <text class="variance-math-desc" x="752" y="182">floor.</text>
  </g>
  <text class="variance-math-sub" x="30" y="304">This explains why more trees stop helping: the ensemble's variance is bounded below by how correlated its members are, not by how many there are.</text>
</svg>
