sources:
  - title: 'Random Forests'
    url: 'https://doi.org/10.1023/A:1010933404324'
    publisher: 'Machine Learning (Leo Breiman)'
    accessed: '2026-08-29'
    year: 2001
    description: 'The seminal journal paper formally introducing Random Forests, bagging, random feature subspaces, OOB error bounds, and variable importance.'
  - title: 'Bagging Predictors'
    url: 'https://doi.org/10.1007/BF00058655'
    publisher: 'Machine Learning (Leo Breiman)'
    accessed: '2026-08-29'
    year: 1996
    description: 'The original paper introducing Bootstrap Aggregation and proving that bagging reduces variance for unstable, non-linear estimators.'
  - title: 'The Elements of Statistical Learning (Chapter 15: Random Forests)'
    url: 'https://hastie.su.domains/ElemStatLearn/'
    publisher: 'Springer (Hastie, Tibshirani, Friedman)'
    accessed: '2026-08-29'
    year: 2009
    description: 'Definitive mathematical treatment of ensemble variance reduction, pairwise tree correlation, and out-of-bag error properties.'
