questions:
  - question: >-
      A thousand candidates, each a fixed vector of random predictions with exactly zero skill, are
      scored on a 500-row validation set. The best of them scores 0.5720. Where does that number
      come from?
    options:
      - 'From overfitting: with a thousand candidates, at least one has genuinely learned the validation set'
      - 'From taking a maximum over noisy estimates -- some candidates got lucky on those 500 rows, and the one kept is by definition the luckiest'
      - 'From the validation set being too small; with 5000 rows the best would still score 0.5720'
      - 'From a bug: candidates with zero skill cannot average above 0.5'
    answer_index: 1
    explanation: >-
      Each candidate's validation score is a draw with standard error 0.0224. The maximum of a
      thousand such draws sits about 3.26 standard errors above the mean, which is 0.0728 -- exactly
      the measured optimism. Nothing was learned: these are prediction vectors generated without
      ever seeing the data. And the score is not a bug, because the *average* candidate does score
      0.5; it is the *maximum* that is biased. A larger validation set would shrink the standard
      error and therefore the optimism, which is the third option's mistake.
  - question: >-
      In that same experiment, the winner's test score sits within 0.003 of 0.5 for every value of
      K, from one candidate to a thousand. Why does that observation carry the argument?
    options:
      - 'It shows the test set is larger than the validation set and therefore more reliable'
      - 'It shows the candidates were correctly generated, which is a sanity check on the setup'
      - 'It is the control: the test set was never selected on, so its stability proves the validation climb is selection and not some artefact of the experiment'
      - 'It shows the model generalises, since test performance did not degrade as K grew'
    answer_index: 2
    explanation: >-
      Without the test column, a rising validation score could be explained by almost anything --
      a drifting generator, a bug in the scoring, an artefact of the averaging. The test column
      holds both sets to the same construction and differs in exactly one respect: nothing selected
      on it. That isolates selection as the cause. Both sets are 500 rows, so size is not the
      difference, and there is no model here to generalise -- the candidates are coin flips.
  - question: >-
      Your validation set has 500 rows and you plan to try 100 configurations. What accuracy should
      you expect to invent, and what does it mean for detecting a two-point improvement?
    options:
      - 'About 0.056 -- the standard error 0.0224 times the expected maximum of 100 normals, 2.50 -- so a two-point improvement cannot be resolved by that sweep'
      - 'About 0.002, since the optimism is roughly one over the number of validation rows'
      - 'None, provided you also keep a test set; the test set corrects the validation optimism'
      - 'About 0.068 -- the standard error times sqrt(2 ln 100), which is 3.03'
    answer_index: 0
    explanation: >-
      The optimism is the validation set's standard error multiplied by the expected maximum of K
      noise draws, and both are known before you start. At 0.0224 and 2.50 that is 0.056 -- more
      than twice the improvement being chased, so the sweep cannot answer the question. The
      sqrt(2 ln K) figure is the tempting wrong answer and is addressed in the next question. And a
      test set does not correct the validation optimism; it simply gives you a separate honest
      number, which is precisely why both exist.
  - question: >-
      The closed form sqrt(2 ln K) predicts 3.03 standard errors of optimism at K=100. Simulation of
      the expected maximum of 100 normals gives 2.50, and the measurement gives 2.57. Which should
      you use?
    options:
      - 'sqrt(2 ln K), because a closed form is exact where a simulation is an approximation'
      - 'Neither -- disagreement between them means the whole framework does not apply here'
      - 'The average of the two, since each carries error in a different direction'
      - 'The simulated expectation, because sqrt(2 ln K) is an asymptotic that is loose at every K you would actually use, and the measurement confirms the simulation rather than the formula'
    answer_index: 3
    explanation: >-
      sqrt(2 ln K) is correct in the limit as K grows without bound and overestimates at finite K --
      by 0.53 standard errors here, which is a fifth of the answer. The simulation is a direct
      estimate of the quantity you want and the measurement lands within 0.07 of it. This lesson's
      lab asserts the inequality -- that the closed form exceeds the simulation -- rather than
      treating the formula as truth, on the standing principle that when a measurement and a
      textbook disagree, the measurement wins.
  - question: >-
      Fifty people, twenty rows each, and every person's label is a coin flip so nothing is
      generalisable. A row-wise random split scores 0.9760; a group-aware split scores 0.4112. What
      is the mechanism, and which count demonstrates it?
    options:
      - 'The row-wise split has more training data, and the count is 750 training rows against 700'
      - 'The 1-NN memorises its training rows, and the count is the 1000 rows in the dataset'
      - 'Every one of the fifty people appears in both halves, so each test row''s nearest neighbour is another row from the same person carrying that person''s label'
      - 'The group-aware split has fewer test rows and therefore a noisier estimate, and the count is the twelve people in its test half'
    answer_index: 2
    explanation: >-
      With twenty rows per person and a random quarter held out, the chance that one person's rows
      all land on the same side is about two in a hundred thousand -- so the count of people in both
      halves is 50 of 50, and the lab asserts it. The model is doing a lookup rather than
      predicting. Training-set size is not the difference, and while the group-aware estimate is
      genuinely noisy -- twelve people, hence a score below chance -- noise explains the wobble, not
      the fifty-six-point gap.
  - question: >-
      Across 500 random splits of a 5-percent positive class, 21 produced a test half containing no
      positives at all. What breaks, and what is the fix?
    options:
      - 'Recall is undefined and precision divides by zero; the fix is to stratify the split'
      - 'Accuracy becomes meaningless; the fix is to use a larger model'
      - 'Nothing breaks -- a test set with no positives simply measures specificity, which is still informative'
      - 'The training set becomes imbalanced; the fix is to oversample the minority class'
    answer_index: 0
    explanation: >-
      With no positives in the test half there is no true positive and no false negative, so recall
      has a zero denominator and precision divides by zero whenever the model predicts a positive.
      Stratifying costs nothing, keeps the same mean positive rate, and cuts the spread from a
      standard deviation of 0.0265 to 0.0100 -- and never produced an empty test half in 500 splits.
      Oversampling addresses a different problem, in the training half, and does not fix an
      evaluation set that cannot be evaluated.
  - question: >-
      A shuffled split beat a chronological one in all 20 constructions tested, but the effect ranged
      from +0.016 to +0.2557. Why does the lesson report the whole distribution rather than the
      largest value?
    options:
      - 'Because the largest value came from a construction with a bug, so it was excluded'
      - 'Because averages are conventionally preferred to extremes when reporting results'
      - 'Because quoting the seed that produced the biggest effect would be the forking-paths problem committed inside a lesson against it -- and the direction, which held 20 of 20, is the defensible claim'
      - 'Because the mean of 0.0728 is the true effect size and the extremes are measurement error'
    answer_index: 2
    explanation: >-
      The first construction tried gave +0.1428, which would have made a striking headline. Choosing
      it after seeing the results is exactly selecting on the outcome, which is what this lesson
      measures elsewhere. So the lab asserts the direction in one exercise and the full distribution
      -- mean, standard deviation, minimum and maximum -- in another. Note also that the extremes
      are not measurement error: they are real variation between datasets, which is why the
      practical lesson is that split mistakes do not all cost the same.
  - question: >-
      A single holdout on 400 rows spans 0.66 to 0.85 across 200 random seeds, on identical data and
      an identical model. What does that imply about a reported three-point improvement measured on
      one such holdout?
    options:
      - 'That the improvement is real but understated, since a single holdout is conservative'
      - 'That the improvement is smaller than the split-to-split variation, so the holdout cannot distinguish it from having drawn a luckier split'
      - 'That the model is overfitting, since a stable model would give a stable holdout score'
      - 'That the test set is too large, and a smaller one would give a tighter estimate'
    answer_index: 1
    explanation: >-
      Nineteen accuracy points of swing come from nothing but which rows landed where. A three-point
      difference measured once, on one split of that size, is comfortably inside the noise. Five-fold
      cross-validation on the same data spans 3.25 points and is 6.23 times steadier, which is the
      practical answer when fits are cheap; when they are not, the answer is a single holdout
      reported with an interval. The swing is a property of the split, not of the model, and a
      smaller test set would widen the interval rather than narrow it.
