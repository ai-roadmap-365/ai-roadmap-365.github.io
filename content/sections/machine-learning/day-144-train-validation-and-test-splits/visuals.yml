visuals:
  - id: three-sets-architecture
    file: assets/three-sets-architecture.svg
    type: diagram
    title: >-
      One dataset divided into training, validation and test portions, each labelled with its job,
      its budget of looks, and what exceeding that budget destroys
    alt: >-
      Diagram: one dataset drawn as a horizontal bar divided into a wide training portion, a narrower
      validation portion and a narrow test portion. Each carries its job and its budget. Training fits
      the parameters and may be looked at without limit, with the note that anything fitted is fitted
      only here. Validation chooses between candidates, may be used many times, and every look costs.
      Test estimates what you will actually get and permits exactly one evaluation. Below, a measured
      table on candidates with zero skill shows that trying 1, 10 and 1000 candidates gives best
      validation scores of 0.4984, 0.5331 and 0.5720 while the same candidates score 0.5011, 0.4999
      and 0.4992 on the test set, so the validation column climbs on noise while the test column never
      moves. A final panel states that the test set's whole value comes from never having influenced
      anything, and that looking twice turns it into a second validation set
    description: >-
      A static architecture diagram built around a single horizontal bar representing one dataset,
      divided left to right into a wide shaded training portion, a narrower validation portion and a
      narrow heavily-outlined test portion. Beneath each sits a card giving that set's job and its
      budget. Training fits the parameters, has an unlimited budget of looks, carries the reminder
      that a score measured there says nothing about new data -- with Day 141's measured 1.000 on
      coin-flip labels as the evidence -- and notes that anything fitted, including a scaler, an
      imputer or a feature selector, is fitted only there. Validation chooses between candidates,
      may be used many times, and states that every look costs, with the cost identified as the
      expected maximum of K noise draws. A wide highlighted panel below carries the measurement that
      justifies the whole diagram, taken on candidates with exactly zero skill: trying 1, 10 and
      1000 candidates gives best validation scores of 0.4984, 0.5331 and 0.5720 while those same
      candidates score 0.5011, 0.4999 and 0.4992 on the test set, so the validation column climbs on
      noise while the test column never moves. A vertical arrow runs the full height of the diagram
      from the test portion down to a final card, which states that the test set estimates what you
      will actually get, permits exactly one evaluation, derives its whole value from never having
      influenced anything, and becomes a second validation set the moment it is looked at twice.
  - id: selection-optimism-flow
    file: assets/selection-optimism-flow.svg
    type: flow-animated
    title: >-
      Selection optimism rising with the number of candidates tried, against a test score that never
      moves because it was never selected on
    alt: >-
      Diagram: a bar chart with one pair of bars per number of candidates considered, at 1, 2, 5, 10,
      25, 50, 100, 500 and 1000. The wide shaded bar in each pair is the best validation score and
      rises steadily from 0.4984 to 0.5720, with each value printed above its bar. The narrow outlined
      bar beside it is that same candidate's test score and stays level at chance throughout, against
      a dashed line marking 0.5000. Every candidate is a coin flip with no skill at all. A caption
      explains that the narrow bars cannot move because the test set was never selected on, that the
      wide bars climb because the maximum of many noisy draws is systematically larger than any one of
      them, and that this gap is why the third set exists and is a computable quantity
    description: >-
      An animated bar chart with nine pairs of bars, one pair for each number of candidates
      considered: 1, 2, 5, 10, 25, 50, 100, 500 and 1000. In each pair the wide shaded bar is the
      best validation score achieved by that many candidates and the narrow outlined bar beside it
      is that same winning candidate's score on a test set it never influenced. The wide bars climb
      steadily from 0.4984 to 0.5720, with each measured value printed above its own bar, while the
      narrow bars stay level against a dashed reference line marking chance at 0.5000. Every
      candidate is a coin flip with exactly zero skill, and the figures are averaged over 400
      replications on a 500-row validation set and a 500-row test set. The animation reveals the
      pairs left to right, roughly one every half second on a seven-second loop, so the climb is
      visible as motion; each bar, once revealed, stays at full opacity for the rest of the cycle. A
      legend distinguishes the best validation score, described as the one you would report, from
      the test score, described as the one that is true. A caption beneath explains that the narrow
      bars cannot move because the test set was never selected on, that the wide bars climb because
      the maximum of many noisy draws is systematically larger than any one of them, and that this
      gap is both the reason the third set exists and a quantity you can compute in advance. A
      prefers-reduced-motion block disables every reveal and leaves all bars and all printed values
      in their final positions, so the still frame carries the entire result.
