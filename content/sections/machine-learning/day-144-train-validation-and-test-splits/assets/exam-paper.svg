<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three papers, three uses.">
  <title>Setting and marking an exam</title>
  <style>
    .exam-paper-bg   { fill: #f8fafc; }
    .exam-paper-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-paper-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-paper-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-paper-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-paper-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exam-paper-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-paper-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exam-paper-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exam-paper-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exam-paper-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exam-paper-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exam-paper-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exam-paper-row { opacity: 1; }
    .exam-paper-r0 { animation-delay: 0.00s; }
    .exam-paper-r1 { animation-delay: 0.45s; }
    .exam-paper-r2 { animation-delay: 0.90s; }
    .exam-paper-r3 { animation-delay: 1.35s; }
    .exam-paper-r4 { animation-delay: 1.80s; }
    .exam-paper-row { animation: exam-paper-reveal 7.3s ease-in-out infinite; }
    @keyframes exam-paper-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="exam-paper-bg" width="980" height="390"/>
  <text class="exam-paper-h1"  x="30" y="40">Setting and marking an exam</text>
  <text class="exam-paper-sub" x="30" y="64">Three papers, three uses.</text>
  <rect class="exam-paper-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="exam-paper-name" x="46" y="122">Practice and mocks</text>
  <text class="exam-paper-desc" x="46" y="142">Used freely.</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r0" x="46" y="182">Worked through repeatedly</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r1" x="46" y="216">Mistakes are the point</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r2" x="46" y="250">Used to decide what to revise</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r3" x="46" y="284">Can be revisited any number of times</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r4" x="46" y="318">This is training and validation</text>
  <rect class="exam-paper-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="exam-paper-name" x="526" y="122">The final paper</text>
  <text class="exam-paper-desc" x="526" y="142">Sat once.</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r0" x="526" y="182">Seen once, under conditions</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r1" x="526" y="216">The mark is the estimate</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r2" x="526" y="250">Not used to decide anything further</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r3" x="526" y="284">Reusing it invalidates the mark</text>
  <text class="exam-paper-desc exam-paper-row exam-paper-r4" x="526" y="318">This is the test set</text>
  <text class="exam-paper-sub" x="30" y="372">A student who has seen the final paper cannot be assessed by it, which is exactly what happens to a test set used to make a decision.</text>
</svg>
