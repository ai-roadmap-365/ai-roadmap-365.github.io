<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Sizing the test set</title>
  <style>
    .test-size-bg   { fill: #f8fafc; }
    .test-size-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-size-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-size-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-size-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-size-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .test-size-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .test-size-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .test-size-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .test-size-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .test-size-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .test-size-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .test-size-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .test-size-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .test-size-stage { opacity: 1; }

    .test-size-s0 { animation-delay: 0.00s; }
    .test-size-e0 { animation-delay: 0.00s; }
    .test-size-s1 { animation-delay: 1.28s; }
    .test-size-e1 { animation-delay: 1.28s; }
    .test-size-s2 { animation-delay: 2.56s; }
    .test-size-e2 { animation-delay: 2.56s; }
    .test-size-s3 { animation-delay: 3.84s; }
    .test-size-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .test-size-conn  { animation: test-size-trace 6.4s ease-in-out infinite; }
      .test-size-stage { animation: test-size-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes test-size-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes test-size-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .test-size-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .test-size-stage { animation: test-size-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes test-size-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="test-size-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="test-size-bg" width="980" height="322"/>
  <text class="test-size-h1"  x="30" y="40">Sizing the test set</text>
  <text class="test-size-sub" x="30" y="64">Four steps.</text>
  <g class="test-size-stage test-size-s0">
    <rect class="test-size-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="test-size-step" x="44" y="142">01</text>
    <text class="test-size-name" x="70" y="142">Decide the smallest difference worth detecting</text>
    <text class="test-size-desc" x="44" y="166">Two points, or a fraction of</text>
    <text class="test-size-desc" x="44" y="182">one.</text>
  </g>
  <line class="test-size-line test-size-conn test-size-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#test-size-tip)"/>
  <g class="test-size-stage test-size-s1">
    <rect class="test-size-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="test-size-step" x="280" y="142">02</text>
    <text class="test-size-name" x="306" y="142">Which fixes the precision the estimate needs</text>
    <text class="test-size-desc" x="280" y="166">An interval narrower than that</text>
    <text class="test-size-desc" x="280" y="182">difference.</text>
  </g>
  <line class="test-size-line test-size-conn test-size-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#test-size-tip)"/>
  <g class="test-size-stage test-size-s2">
    <rect class="test-size-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="test-size-step" x="516" y="142">03</text>
    <text class="test-size-name" x="542" y="142">And that fixes the number of test rows</text>
    <text class="test-size-desc" x="516" y="166">Computable before any data is</text>
    <text class="test-size-desc" x="516" y="182">collected.</text>
  </g>
  <line class="test-size-line test-size-conn test-size-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#test-size-tip)"/>
  <g class="test-size-stage test-size-s3">
    <rect class="test-size-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="test-size-step" x="752" y="142">04</text>
    <text class="test-size-name" x="778" y="142">Too small, and no comparison can conclude anything</text>
    <text class="test-size-desc" x="752" y="166">Which is a common and avoidable</text>
    <text class="test-size-desc" x="752" y="182">waste.</text>
  </g>
  <text class="test-size-sub" x="30" y="304">Sizing the test set before collecting data is unusual practice and cheap: it prevents an entire project ending in a comparison that cannot distinguish its candidates.</text>
</svg>
