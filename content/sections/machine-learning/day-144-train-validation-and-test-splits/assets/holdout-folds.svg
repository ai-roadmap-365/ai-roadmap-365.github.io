<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By dataset size.">
  <title>One holdout against many folds</title>
  <style>
    .holdout-folds-bg   { fill: #f8fafc; }
    .holdout-folds-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .holdout-folds-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .holdout-folds-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .holdout-folds-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .holdout-folds-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .holdout-folds-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .holdout-folds-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .holdout-folds-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .holdout-folds-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .holdout-folds-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .holdout-folds-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .holdout-folds-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .holdout-folds-row { opacity: 1; }
    .holdout-folds-r0 { animation-delay: 0.00s; }
    .holdout-folds-r1 { animation-delay: 0.45s; }
    .holdout-folds-r2 { animation-delay: 0.90s; }
    .holdout-folds-r3 { animation-delay: 1.35s; }
    .holdout-folds-r4 { animation-delay: 1.80s; }
    .holdout-folds-row { animation: holdout-folds-reveal 7.3s ease-in-out infinite; }
    @keyframes holdout-folds-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="holdout-folds-bg" width="980" height="390"/>
  <text class="holdout-folds-h1"  x="30" y="40">One holdout against many folds</text>
  <text class="holdout-folds-sub" x="30" y="64">By dataset size.</text>
  <rect class="holdout-folds-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="holdout-folds-name" x="46" y="122">A single holdout</text>
  <text class="holdout-folds-desc" x="46" y="142">One split.</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r0" x="46" y="182">Fast: one fit</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r1" x="46" y="216">One noisy estimate</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r2" x="46" y="250">Adequate on large datasets</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r3" x="46" y="284">Simple to reason about</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r4" x="46" y="318">Wastes the held-out rows for training</text>
  <rect class="holdout-folds-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="holdout-folds-name" x="526" y="122">K-fold rotation</text>
  <text class="holdout-folds-desc" x="526" y="142">Many splits.</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r0" x="526" y="182">Slower: k fits</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r1" x="526" y="216">An estimate with a measurable spread</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r2" x="526" y="250">Necessary on small datasets</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r3" x="526" y="284">More care needed with grouping</text>
  <text class="holdout-folds-desc holdout-folds-row holdout-folds-r4" x="526" y="318">Every row used for both purposes</text>
  <text class="holdout-folds-sub" x="30" y="372">On a large enough dataset the single holdout is statistically adequate, and cross-validation then buys precision nobody needs at k times the cost.</text>
</svg>
