<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why selection inflates</title>
  <style>
    .maximum-biased-bg   { fill: #f8fafc; }
    .maximum-biased-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .maximum-biased-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .maximum-biased-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .maximum-biased-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .maximum-biased-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .maximum-biased-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .maximum-biased-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .maximum-biased-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .maximum-biased-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .maximum-biased-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .maximum-biased-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .maximum-biased-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .maximum-biased-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .maximum-biased-stage { opacity: 1; }

    .maximum-biased-s0 { animation-delay: 0.00s; }
    .maximum-biased-e0 { animation-delay: 0.00s; }
    .maximum-biased-s1 { animation-delay: 1.28s; }
    .maximum-biased-e1 { animation-delay: 1.28s; }
    .maximum-biased-s2 { animation-delay: 2.56s; }
    .maximum-biased-e2 { animation-delay: 2.56s; }
    .maximum-biased-s3 { animation-delay: 3.84s; }
    .maximum-biased-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .maximum-biased-conn  { animation: maximum-biased-trace 6.4s ease-in-out infinite; }
      .maximum-biased-stage { animation: maximum-biased-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes maximum-biased-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes maximum-biased-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .maximum-biased-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .maximum-biased-stage { animation: maximum-biased-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes maximum-biased-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="maximum-biased-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="maximum-biased-bg" width="980" height="322"/>
  <text class="maximum-biased-h1"  x="30" y="40">Why selection inflates</text>
  <text class="maximum-biased-sub" x="30" y="64">Four steps.</text>
  <g class="maximum-biased-stage maximum-biased-s0">
    <rect class="maximum-biased-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="maximum-biased-step" x="44" y="142">01</text>
    <text class="maximum-biased-name" x="70" y="142">Every validation score carries noise</text>
    <text class="maximum-biased-desc" x="44" y="166">Even for a model that learned</text>
    <text class="maximum-biased-desc" x="44" y="182">nothing.</text>
  </g>
  <line class="maximum-biased-line maximum-biased-conn maximum-biased-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#maximum-biased-tip)"/>
  <g class="maximum-biased-stage maximum-biased-s1">
    <rect class="maximum-biased-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="maximum-biased-step" x="280" y="142">02</text>
    <text class="maximum-biased-name" x="306" y="142">Selecting the highest of many picks up that noise</text>
    <text class="maximum-biased-desc" x="280" y="166">Along with any real quality.</text>
  </g>
  <line class="maximum-biased-line maximum-biased-conn maximum-biased-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#maximum-biased-tip)"/>
  <g class="maximum-biased-stage maximum-biased-s2">
    <rect class="maximum-biased-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="maximum-biased-step" x="516" y="142">03</text>
    <text class="maximum-biased-name" x="542" y="142">So the winner's score overstates its true performance</text>
    <text class="maximum-biased-desc" x="516" y="166">By more, the more candidates</text>
    <text class="maximum-biased-desc" x="516" y="182">were tried.</text>
  </g>
  <line class="maximum-biased-line maximum-biased-conn maximum-biased-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#maximum-biased-tip)"/>
  <g class="maximum-biased-stage maximum-biased-s3">
    <rect class="maximum-biased-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="maximum-biased-step" x="752" y="142">04</text>
    <text class="maximum-biased-name" x="778" y="142">Which is why the test set must be untouched</text>
    <text class="maximum-biased-desc" x="752" y="166">It is the only unbiased estimate</text>
    <text class="maximum-biased-desc" x="752" y="182">left.</text>
  </g>
  <text class="maximum-biased-sub" x="30" y="304">The bias grows with the number of candidates, which is why an extensive hyperparameter search makes the validation score less trustworthy rather than more.</text>
</svg>
