terms:
  - term: Training set
    definition: >-
      The rows a model fits its parameters on, and the only rows anything fitted may see -- a scaler,
      an imputer, an encoder, a feature selector or a decision threshold included. Unlimited looks,
      and a score measured here estimates nothing.
  - term: Validation set
    definition: >-
      The rows you choose between candidates on. Many looks are permitted and every look costs
      something measurable: the score on this set is inflated by the expected maximum of K noise
      draws, where K is how many things you tried.
  - term: Test set
    definition: >-
      The rows that tell you what you will actually get. Exactly one look. Its entire value comes
      from never having influenced anything, so the second evaluation is a validation score wearing
      the word test.
  - term: Selection bias
    definition: >-
      The optimism created by keeping the best of several candidates measured on the same set. Not a
      vague hazard but a computable quantity -- measured here at 0.0728 for a thousand candidates
      that were literally coin flips.
  - term: Winner's curse
    definition: >-
      The systematic upward bias of an argmax taken over noisy estimates: the winner is whichever
      estimate was most inflated. Named in 1971 for sealed-bid oil leases, met on Day 142 as a bandit
      arm, and met today as a validation score.
  - term: Expected maximum of K draws
    definition: >-
      The quantity selection optimism actually equals, once expressed in standard errors. Simulated
      here at 0.55, 1.54, 2.50 and 3.24 standard errors for K = 2, 10, 100 and 1000, tracking the
      measurement to within 0.2 at every K.
  - term: Standard error of an accuracy
    definition: >-
      sqrt(p times one minus p, divided by n) -- how much an accuracy estimate wobbles from the split
      alone. 0.0224 on 500 rows at p = 0.5. Theory matched 20000 measured draws to four decimal
      places at every size tried.
  - term: Stratified split
    definition: >-
      A split preserving each class's proportion in both halves. Costs nothing, has the same mean as
      a random split, and cuts the spread by a factor of 2.65 here -- while never once producing the
      empty test half a random split produced 21 times in 500.
  - term: Group split
    definition: >-
      A split that never puts rows from the same unit -- person, device, document, hospital -- on
      both sides. The fix for the most expensive failure in this lesson: 0.9760 row-wise against
      0.4112 group-aware, because all fifty people were in both halves.
  - term: Unit of independence
    definition: >-
      The thing you want to generalise to, which is the thing you must split by. The row is the unit
      only when rows are independent, and deciding this is a question about the domain rather than
      about the data.
  - term: Chronological split
    definition: >-
      Training on the past and testing on the future, because deployment is chronological. Shuffling
      beat it in 20 of 20 constructions here, and the chronological score turned out
      indistinguishable from the majority baseline where the shuffled one looked like real signal.
  - term: k-fold cross-validation
    definition: >-
      Dividing the data into k parts so every row serves as test data exactly once. Six times
      steadier than a single holdout here, at k times the fits, and estimating the same quantity --
      the two means agreed to within 0.003.
  - term: Holdout variance
    definition: >-
      How much a single train/test estimate moves when only the split changes. Measured at 0.0381
      standard deviation and a 0.19 range on 400 rows -- larger than most improvements anyone is
      chasing.
  - term: Nested cross-validation
    definition: >-
      An inner loop that selects and an outer loop that scores, so the outer estimate is not
      contaminated by the selection. The correct fix for the optimism this lesson measures, at the
      product of the two loops in compute.
  - term: Test-set sizing
    definition: >-
      Deciding how many test rows you need from the smallest difference that would change a decision,
      before splitting. 1225 rows for plus or minus 0.02 at an accuracy of 0.85; 4899 for plus or
      minus 0.01.
  - term: One-over-root-n
    definition: >-
      The rate at which a sampling error shrinks. Quadrupling a test set halves its interval rather
      than quartering it, so precision never becomes cheap -- going from 500 rows to 5000 buys a
      factor of 3.2.
  - term: Benchmark overfitting
    definition: >-
      What happens when a public test set is selected on by thousands of researchers over years. No
      individual sees a test label; the aggregate is a selection over an enormous and uncounted K,
      and re-collected test data has shown substantial accuracy drops.
  - term: Evaluation budget
    definition: >-
      The number of times a held-out set may be consulted before its estimate stops being honest.
      One for a test set. Enforceable mechanically -- today's GatedTestSet refuses the second look
      and deliberately does not advance its counter on a refusal.
  - term: Data leakage through the split
    definition: >-
      Information about the test rows reaching training through the split itself rather than through
      a feature: a shared person, a shared moment in time, a fitted transform applied before the cut.
      All three are silent and all three inflate.
  - term: Optimism
    definition: >-
      The gap between a score measured on data that influenced a choice and the score on data that
      did not. In this lesson it has a sign, a size, a formula and a control -- which is what
      distinguishes it from a warning.
