questions:
  - question: 'What is the fundamental difference between a model parameter and a hyperparameter?'
    options:
      - 'Parameters are for classification; hyperparameters are for regression'
      - 'Parameters are learned; hyperparameters are set beforehand'
      - 'Parameters are integers; hyperparameters are floating-point numbers'
      - 'There is no difference'
    answer_index: 1
    explanation: 'Parameters are internal to the model and optimized directly by the training algorithm. Hyperparameters are external knobs set by the engineer to guide optimization and regularize model capacity.'

  - question: 'Why does Random Search mathematically outperform Grid Search for the same total number of trials (Bergstra & Bengio, 2012)?'
    options:
      - 'Because Random Search always finds the global minimum'
      - 'Because Random Search uses GPU acceleration'
      - 'Only one or two hyperparameters usually matter'
      - 'Because Grid Search cannot evaluate integer parameters'
    answer_index: 2
    explanation: 'If only learning_rate matters and max_depth is secondary, a 9-trial grid search tests only 3 distinct learning rates. A 9-trial random search tests 9 distinct learning rates, providing 3x better coverage of the critical dimension.'

  - question: 'What are the two core components of a Bayesian Optimization system?'
    options:
      - 'A clustering algorithm and a decision tree'
      - 'A linear regression model and a random number generator'
      - 'A neural network and a confusion matrix'
      - 'A surrogate model and an acquisition function'
    answer_index: 3
    explanation: 'Bayesian optimization uses a probabilistic surrogate model to estimate mean performance mu(x) and uncertainty sigma(x), and an acquisition function to balance exploration (high uncertainty) vs exploitation (high mean).'

  - question: 'In the Expected Improvement (EI) acquisition function, what does the parameter xi >= 0 control?'
    options:
      - 'The exploration-exploitation trade-off'
      - 'The learning rate of the booster'
      - 'The number of cross-validation folds'
      - 'The random seed'
    answer_index: 0
    explanation: 'The parameter xi specifies the minimum improvement over the current best score required to be considered attractive, shifting search priority towards high-variance unexplored parameter space.'

  - question: 'What is Successive Halving (and its extension Hyperband)?'
    options:
      - 'A method that cuts feature count in half'
      - 'A multi-fidelity bandit over increasing budgets'
      - 'A binary search over learning rates'
      - 'A tree pruning algorithm'
    answer_index: 1
    explanation: 'Successive Halving evaluates dozens of configurations cheaply on small subsets/epochs, quickly killing poor parameter combinations and allocating full compute budgets only to top performers.'

  - question: 'What is the recommended tuning hierarchy for Gradient Boosted Trees (XGBoost / LightGBM)?'
    options:
      - '1. Tune lambda; 2. Set max_depth=50'
      - '1. Tune random_state; 2. Tune thread count; 3. Run grid search'
      - 'Fix the rate, then structure, sampling, regularization, rate'
      - '1. Tune batch size; 2. Train for 1 epoch'
    answer_index: 2
    explanation: 'Systematic tuning starts by locking in tree capacity and early stopping at a moderate learning rate, tuning structural and sampling regularizers, and finally reducing learning rate with increased trees for a final accuracy boost.'

  - question: 'What is "Optimization Leakage" (overfitting the validation set during hyperparameter tuning)?'
    options:
      - 'When features are correlated'
      - 'When test labels leak into the training set'
      - 'When missing values are imputed before scaling'
      - 'The search eventually memorises the validation noise'
    answer_index: 3
    explanation: 'Just as model parameters can overfit the training set, hyperparameter search algorithms can overfit the validation set if too many configurations are tested without a completely isolated holdout test set.'

  - question: 'Why is it dangerous to tune hyperparameters using only training set accuracy?'
    options:
      - 'It always picks the most complex, unconstrained model'
      - 'Training accuracy cannot be computed for decision trees'
      - 'Grid search crashes if cross-validation is disabled'
      - 'Hyperparameters only affect test accuracy'
    answer_index: 0
    explanation: 'Training accuracy monotonically favors maximum complexity. Hyperparameters MUST be evaluated on held-out cross-validation folds to measure true generalization.'
