visuals:
  - id: tuning-strategies-comparison
    file: assets/tuning-strategies-comparison.svg
    type: diagram
    title: 'Hyperparameter Search Strategies: Grid vs Random vs Bayesian'
    alt: 'Comparison diagram contrasting Grid Search (rigid grid), Random Search (uniform scatter), and Bayesian Optimization (guided cluster near optimum).'
    description: 'A static architecture diagram illustrating the parameter space exploration efficiency of Grid Search, Random Search, and Bayesian Optimization.'
  - id: bayesian-optimization-loop
    file: assets/bayesian-optimization-loop.svg
    type: flow-animated
    title: 'Sequential Model-Based Optimization (Bayesian Loop)'
    alt: 'Animated flow chart illustrating the cyclical loop between evaluating trials, updating Gaussian Process surrogate, computing Expected Improvement, and picking next candidate.'
    description: 'An animated flow chart demonstrating the iterative Bayesian optimization cycle balancing exploration and exploitation.'
  - id: tuning-idea
    file: assets/tuning-idea.svg
    type: diagram
    title: 'The tuning problem'
    alt: 'Diagram: the four properties that make hyperparameter search difficult'
    description: 'A four-stage description of the tuning problem covering the black box, the cost, the absence of gradients and noise.'
  - id: grid-random
    file: assets/grid-random.svg
    type: diagram
    title: 'Grid against random search'
    alt: 'Diagram: grid search compared with random search over hyperparameters'
    description: 'A two-column comparison of grid search against random search.'
  - id: bayesian-opt
    file: assets/bayesian-opt.svg
    type: diagram
    title: 'Bayesian optimisation'
    alt: 'Diagram: the four steps of Bayesian hyperparameter optimisation'
    description: 'A four-stage description of Bayesian optimisation covering the surrogate model, the acquisition, the evaluation and the update.'
  - id: acquisition
    file: assets/acquisition.svg
    type: diagram
    title: 'Choosing where to look'
    alt: 'Diagram: how the acquisition function balances exploration and exploitation'
    description: 'A four-stage description of the acquisition function covering the two candidates, the trade-off, the expected improvement and the choice.'
  - id: hyperband
    file: assets/hyperband.svg
    type: diagram
    title: 'Stopping bad runs early'
    alt: 'Diagram: how early stopping of poor configurations multiplies the search budget'
    description: 'A four-stage description of multi-fidelity search covering the small budget, the ranking, the elimination and the reallocation.'
  - id: tuning-not
    file: assets/tuning-not.svg
    type: diagram
    title: 'What tuning is not'
    alt: 'Diagram: four misconceptions about hyperparameter tuning'
    description: 'A two-column comparison of misconceptions about tuning against what is true.'
  - id: tuning-leakage
    file: assets/tuning-leakage.svg
    type: diagram
    title: 'Tuning and leakage'
    alt: 'Diagram: how repeated hyperparameter selection overfits the validation set'
    description: 'A four-stage description of tuning leakage covering repeated selection, the optimistic bias, the consequence and the remedy.'
  - id: prospecting
    file: assets/prospecting.svg
    type: diagram
    title: 'Prospecting a large area'
    alt: 'Diagram: exhaustive surveying compared with informed sampling'
    description: 'A two-column comparison of exhaustive search against informed sequential search.'
  - id: tuning-implications
    file: assets/tuning-implications.svg
    type: diagram
    title: 'Four consequences of tuning'
    alt: 'Diagram: the accuracy, compute, energy and reproducibility implications of hyperparameter search'
    description: 'A four-stage description of tuning implications covering accuracy gains, compute cost, energy use and reproducibility.'
  - id: tuning-when
    file: assets/tuning-when.svg
    type: diagram
    title: 'How much to tune'
    alt: 'Diagram: when hyperparameter tuning is worth the compute'
    description: 'A two-column comparison of situations warranting extensive tuning against better uses of the effort.'
  - id: tuning-history
    file: assets/tuning-history.svg
    type: diagram
    title: 'Four steps in hyperparameter search'
    alt: 'Diagram: the historical progression of hyperparameter search methods'
    description: 'A four-stage description of tuning history covering manual search, grid search, random search and model-based methods.'
