terms:
  - term: 'Hyperparameter'
    definition: 'A configuration external to the model whose value is set before the learning process begins, dictating model capacity, optimization dynamics, and regularization.'
  - term: 'Grid Search'
    definition: 'An exhaustive hyperparameter optimization strategy that trains and evaluates models across all combinations in a predefined discrete Cartesian product grid.'
  - term: 'Random Search'
    definition: 'A hyperparameter optimization method that samples parameter configurations randomly from specified statistical distributions, providing superior coverage of continuous spaces.'
  - term: 'Bayesian Optimization'
    definition: 'A sequential design strategy for global optimization that builds a probabilistic surrogate model of the objective function to intelligently select the most promising evaluation points.'
  - term: 'Surrogate Model'
    definition: 'A computationally cheap probabilistic approximation (e.g. Gaussian Process, Tree-structured Parzen Estimator) of the true expensive objective function.'
  - term: 'Acquisition Function'
    definition: 'A mathematical function (such as Expected Improvement or Upper Confidence Bound) that guides search exploration by quantifying the utility of sampling a candidate hyperparameter point.'
  - term: 'Expected Improvement (EI)'
    definition: 'An acquisition function that measures the expected magnitude of performance gain over the current best observed score, integrating over the surrogate posterior uncertainty.'
  - term: 'Successive Halving'
    definition: 'An early-stopping resource allocation algorithm that trains a pool of configurations on minimal resources, progressively pruning the bottom half and promoting top candidates.'
  - term: 'Hyperband'
    definition: 'A bandit-based hyperparameter optimization framework that extends Successive Halving across varying initial resource allocations to resolve the exploration vs exploitation trade-off.'
  - term: 'Optimization Leakage'
    definition: 'The phenomenon where hyperparameter tuning overfits a specific validation fold due to excessive trials, necessitating an untouched external test set for final audit.'
