<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Tuning and leakage</title>
  <style>
    .tuning-leakage-bg   { fill: #f8fafc; }
    .tuning-leakage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-leakage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-leakage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-leakage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-leakage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tuning-leakage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tuning-leakage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tuning-leakage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tuning-leakage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tuning-leakage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tuning-leakage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tuning-leakage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tuning-leakage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tuning-leakage-stage { opacity: 1; }

    .tuning-leakage-s0 { animation-delay: 0.00s; }
    .tuning-leakage-e0 { animation-delay: 0.00s; }
    .tuning-leakage-s1 { animation-delay: 1.28s; }
    .tuning-leakage-e1 { animation-delay: 1.28s; }
    .tuning-leakage-s2 { animation-delay: 2.56s; }
    .tuning-leakage-e2 { animation-delay: 2.56s; }
    .tuning-leakage-s3 { animation-delay: 3.84s; }
    .tuning-leakage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tuning-leakage-conn  { animation: tuning-leakage-trace 6.4s ease-in-out infinite; }
      .tuning-leakage-stage { animation: tuning-leakage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tuning-leakage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tuning-leakage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tuning-leakage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tuning-leakage-stage { animation: tuning-leakage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tuning-leakage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tuning-leakage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tuning-leakage-bg" width="980" height="322"/>
  <text class="tuning-leakage-h1"  x="30" y="40">Tuning and leakage</text>
  <text class="tuning-leakage-sub" x="30" y="64">Four steps.</text>
  <g class="tuning-leakage-stage tuning-leakage-s0">
    <rect class="tuning-leakage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tuning-leakage-step" x="44" y="142">01</text>
    <text class="tuning-leakage-name" x="70" y="142">Every configuration is scored on the same validation set</text>
    <text class="tuning-leakage-desc" x="44" y="166">Hundreds of times.</text>
  </g>
  <line class="tuning-leakage-line tuning-leakage-conn tuning-leakage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tuning-leakage-tip)"/>
  <g class="tuning-leakage-stage tuning-leakage-s1">
    <rect class="tuning-leakage-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tuning-leakage-step" x="280" y="142">02</text>
    <text class="tuning-leakage-name" x="306" y="142">Selecting the maximum of many noisy scores overestimates</text>
    <text class="tuning-leakage-desc" x="280" y="166">Even when nothing was learned.</text>
  </g>
  <line class="tuning-leakage-line tuning-leakage-conn tuning-leakage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tuning-leakage-tip)"/>
  <g class="tuning-leakage-stage tuning-leakage-s2">
    <rect class="tuning-leakage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tuning-leakage-step" x="516" y="142">03</text>
    <text class="tuning-leakage-name" x="542" y="142">So the reported validation score is optimistic</text>
    <text class="tuning-leakage-desc" x="516" y="166">Sometimes substantially.</text>
  </g>
  <line class="tuning-leakage-line tuning-leakage-conn tuning-leakage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tuning-leakage-tip)"/>
  <g class="tuning-leakage-stage tuning-leakage-s3">
    <rect class="tuning-leakage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tuning-leakage-step" x="752" y="142">04</text>
    <text class="tuning-leakage-name" x="778" y="142">Report the test score instead, or nest the cross-validation</text>
    <text class="tuning-leakage-desc" x="752" y="166">Which costs more and is honest.</text>
  </g>
  <text class="tuning-leakage-sub" x="30" y="304">This is the same failure as reusing a test set, one level removed, and it is why a tuned model's validation score should never be quoted as its expected performance.</text>
</svg>
