<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Bayesian Optimization SMBO Loop">
  <title>Bayesian Optimization SMBO Loop</title>
  <defs>
    <style>
      .d166f-bg { fill: #f8fafc; }
      .d166f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d166f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .d166f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d166f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      .d166f-arrow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#d166f-arr); fill: none; }
    </style>
    <marker id="d166f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d166f-bg" />

  <text x="40" y="45" class="d166f-title" font-size="22">Sequential Model-Based Optimization (Bayesian Loop)</text>
  <text x="40" y="70" class="d166f-text">Surrogate Model (GP / TPE) ➔ Acquisition Function (EI) ➔ Expensive ML Evaluation ➔ Update History</text>

  <!-- Step 1: Surrogate Model (Top Left) -->
  <rect x="80" y="120" width="300" height="90" class="d166f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="100" y="150" class="d166f-title" fill="#1d4ed8">1. Probabilistic Surrogate Model</text>
  <text x="100" y="172" class="d166f-text">Fit Gaussian Process / TPE on history:</text>
  <text x="100" y="192" class="d166f-math">Posterior: μ(x) [mean] &amp; σ(x) [uncertainty]</text>

  <!-- Arrow 1: To Acquisition Function -->
  <path d="M 380 165 L 520 165" class="d166f-arrow" />

  <!-- Step 2: Acquisition Function (Top Right) -->
  <rect x="520" y="120" width="300" height="90" class="d166f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="540" y="150" class="d166f-title" fill="#15803d">2. Maximize Acquisition Function</text>
  <text x="540" y="172" class="d166f-text">Compute Expected Improvement (EI):</text>
  <text x="540" y="192" class="d166f-math">x* = argmax EI(x) = f(μ, σ, best_y)</text>

  <!-- Arrow 2: Down to Expensive Evaluation -->
  <path d="M 670 210 L 670 270" class="d166f-arrow" />

  <!-- Step 3: Expensive Model Evaluation (Bottom Right) -->
  <rect x="520" y="270" width="300" height="90" class="d166f-card" fill="#fef2f2" stroke="#ef4444" />
  <text x="540" y="300" class="d166f-title" fill="#dc2626">3. Expensive Model Evaluation</text>
  <text x="540" y="322" class="d166f-text">Train ML model with parameters x* on CV:</text>
  <text x="540" y="342" class="d166f-math">Observe true score: y* = CrossVal(x*)</text>

  <!-- Arrow 3: Left to Update History -->
  <path d="M 520 315 L 380 315" class="d166f-arrow" />

  <!-- Step 4: Update History (Bottom Left) -->
  <rect x="80" y="270" width="300" height="90" class="d166f-card" fill="#f8fafc" />
  <text x="100" y="300" class="d166f-title" fill="#0f172a">4. Update Historical Observations</text>
  <text x="100" y="322" class="d166f-text">Append (x*, y*) to dataset D_t:</text>
  <text x="100" y="342" class="d166f-math">D_{t+1} = D_t ∪ { (x*, y*) }</text>

  <!-- Arrow 4: Up back to Surrogate -->
  <path d="M 230 270 L 230 210" class="d166f-arrow" />

  <!-- Bottom Explanatory Summary -->
  <text x="80" y="420" class="d166f-text" font-size="12">By iterating this loop for 50-100 trials, Bayesian optimization discovers near-optimal configurations with 90% fewer evaluations than Grid Search.</text>
</svg>
