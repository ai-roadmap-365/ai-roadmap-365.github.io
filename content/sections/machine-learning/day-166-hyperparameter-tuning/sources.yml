sources:
  - title: 'Random Search for Hyper-Parameter Optimization'
    url: 'https://www.jmlr.org/papers/v13/bergstra12a.html'
    publisher: 'Journal of Machine Learning Research (James Bergstra and Yoshua Bengio)'
    accessed: '2026-08-29'
    year: 2012
    description: 'The landmark paper proving that Random Search is mathematically and empirically superior to Grid Search due to low effective dimensionality.'
  - title: 'Practical Bayesian Optimization of Machine Learning Algorithms'
    url: 'https://proceedings.neurips.cc/paper/2012/hash/05311655a15b75fab86956663e1819ce-Abstract.html'
    publisher: 'NeurIPS (Jasper Snoek, Hugo Larochelle, Ryan P. Adams)'
    accessed: '2026-08-29'
    year: 2012
    description: 'Seminal work establishing Bayesian optimization with Gaussian Processes and Expected Improvement for tuning complex ML systems.'
  - title: 'Hyperband: A Novel Bandit-Based Approach to Hyperparameter Optimization'
    url: 'https://www.jmlr.org/papers/v18/16-558.html'
    publisher: 'Journal of Machine Learning Research (Lisha Li, Kevin Jamieson, et al.)'
    accessed: '2026-08-29'
    year: 2018
    description: 'Introduced the Hyperband algorithm combining multi-fidelity resource allocation with Successive Halving to accelerate hyperparameter searches.'
