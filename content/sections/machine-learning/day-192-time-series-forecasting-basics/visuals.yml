visuals:
  - id: time-series-decomposition-structure
    file: assets/time-series-decomposition-structure.svg
    type: diagram
    title: Classical Time Series Decomposition
    alt: Time series decomposition chart separating raw signal into underlying trend cyclical seasonality and stationary residual noise components
    description: Structural mathematical decomposition isolating raw historical observations into long-term secular trend, periodic seasonality, and stationary noise.
  - id: temporal-cross-validation-splits
    file: assets/temporal-cross-validation-splits.svg
    type: diagram
    title: Temporal Cross-Validation Expanding Window Splits
    alt: Diagram of rolling expanding window cross validation for temporal forecasting showing sequential train splits and non overlapping test horizons
    description: Walk-forward expanding window cross-validation architecture preventing lookahead data leakage in sequential time-series modeling.
  - id: ts-idea
    file: assets/ts-idea.svg
    type: diagram
    title: 'Why time series is different'
    alt: 'Diagram: why time-ordered data breaks standard modelling assumptions'
    description: 'A four-stage description of the time-series difference covering independence, autocorrelation, non-stationarity and validation.'
  - id: decomposition
    file: assets/decomposition.svg
    type: diagram
    title: 'Decomposing a series'
    alt: 'Diagram: the four components a time series decomposes into'
    description: 'A four-stage description of series decomposition covering trend, seasonality, cycles and residual.'
  - id: stationarity
    file: assets/stationarity.svg
    type: diagram
    title: 'Stationarity'
    alt: 'Diagram: what stationarity means and how differencing achieves it'
    description: 'A four-stage description of stationarity covering the definition, why it is required, differencing and over-differencing.'
  - id: acf-pacf
    file: assets/acf-pacf.svg
    type: diagram
    title: 'Reading correlation plots'
    alt: 'Diagram: how autocorrelation plots reveal the structure of a series'
    description: 'A four-stage description of correlation diagnostics covering autocorrelation, partial autocorrelation, the patterns and the model choice.'
  - id: classical-tabular
    file: assets/classical-tabular.svg
    type: diagram
    title: 'Classical models against tabular ones'
    alt: 'Diagram: classical time-series models compared with tabular models on lag features'
    description: 'A two-column comparison of classical statistical forecasting against tabular machine learning.'
  - id: arima
    file: assets/arima.svg
    type: diagram
    title: 'The baselines to beat'
    alt: 'Diagram: the classical forecasting baselines any model must beat'
    description: 'A four-stage description of forecasting baselines covering the naive forecast, the seasonal naive, exponential smoothing and the autoregressive family.'
  - id: ts-not
    file: assets/ts-not.svg
    type: diagram
    title: 'What forecasting is not'
    alt: 'Diagram: four misconceptions about time-series forecasting'
    description: 'A two-column comparison of misconceptions about forecasting against what is true.'
  - id: ts-history
    file: assets/ts-history.svg
    type: diagram
    title: 'Four steps in forecasting'
    alt: 'Diagram: the historical progression of forecasting methods'
    description: 'A four-stage description of forecasting history covering smoothing methods, the autoregressive family, machine learning approaches and global models.'
  - id: weather
    file: assets/weather.svg
    type: diagram
    title: 'Forecasting weather'
    alt: 'Diagram: near-term forecasting compared with long-horizon forecasting'
    description: 'A two-column comparison of short-horizon forecasts against long-horizon ones.'
  - id: ts-implications
    file: assets/ts-implications.svg
    type: diagram
    title: 'Four consequences of time-series work'
    alt: 'Diagram: the leakage, drift, horizon and interval implications of forecasting'
    description: 'A four-stage description of forecasting implications covering leakage risk, regime change, horizon degradation and uncertainty.'
  - id: ts-when
    file: assets/ts-when.svg
    type: diagram
    title: 'Which forecasting approach when'
    alt: 'Diagram: choosing a forecasting approach by data characteristics'
    description: 'A two-column comparison of data situations against the forecasting approach that fits.'
