title: 'Time Series Forecasting Basics'
section: machine-learning
subsection: beyond-supervised
week: 28
learning_promise: 'Master time-series forecasting: formulate stationarity and autocorrelation, engineer lag and rolling window features, execute walk-forward temporal cross-validation, and evaluate forecasting metrics.'
objectives:
  - 'Test and enforce stationarity using differencing and the Augmented Dickey-Fuller (ADF) formulation.'
  - 'Deconstruct time series into Trend, Seasonality, and Residuals using additive and multiplicative models.'
  - 'Engineer tabular temporal features: autoregressive lag terms, rolling window means/stds, and cyclical calendar encodings.'
  - 'Execute walk-forward expanding window cross-validation to eliminate lookahead bias.'
  - 'Evaluate forecasts using MAE, RMSE, Mean Absolute Percentage Error (MAPE), and Symmetric MAPE (sMAPE).'
