questions:
  - question: 'Why is standard random K-Fold cross-validation catastrophic when evaluating time-series forecasting models?'
    options:
      - 'Random splitting leaks future data into the past (Lookahead Bias), creating unrealistically optimistic validation metrics that fail immediately in live forecasting'
      - 'K-Fold cross-validation takes too much CPU memory on time series'
      - 'Time series data cannot be converted into numpy arrays'
      - 'Scikit-learn raises an error if time series rows are shuffled'
    answer_index: 0
    explanation: 'Shuffling temporal rows allows models to interpolate between known future and past points, masking catastrophic real-world extrapolation failures. Walk-forward temporal splits must be used.'
  - question: 'What does weak stationarity (wide-sense stationarity) mathematically require of a time-series process Y_t?'
    options:
      - 'Constant mean over time, constant variance over time, and autocovariance depending only on lag interval k, not absolute time t'
      - 'That all values are strictly positive integers'
      - 'That the trend line has an exact slope of 1.0'
      - 'That all seasonal cycles repeat exactly every 24 hours'
    answer_index: 0
    explanation: 'Stationarity requires that statistical properties (mean, variance, autocovariance) are invariant to time shifts, ensuring past patterns generalize to future periods.'
  - question: 'What is the primary vulnerability of Mean Absolute Percentage Error (MAPE = (1/N) * sum(|(y - y_hat) / y|) * 100)?'
    options:
      - 'It explodes to infinity or produces undefined division errors when actual ground-truth values y are zero or close to zero'
      - 'It cannot be computed on floating point numbers'
      - 'It always outputs negative percentages'
      - 'It requires GPU acceleration'
    answer_index: 0
    explanation: 'When actual demand y_t = 0 (e.g. intermittent spare parts demand), dividing by y_t causes division by zero; Symmetric MAPE (sMAPE) or MASE is used instead.'
  - question: 'How are cyclical time features (e.g. hour of day from 0 to 23) properly encoded for linear models and neural networks?'
    options:
      - 'Via sine and cosine trigonometric transformations: sin(2 * pi * hour / 24) and cos(2 * pi * hour / 24), preserving circular continuity between 23:59 and 00:00'
      - 'As a single integer column from 0 to 23'
      - 'As a 24-column one-hot binary vector'
      - 'By subtracting the mean hour'
    answer_index: 0
    explanation: 'Sine and cosine transforms map cyclical time to a 2D unit circle, ensuring that hour 23 and hour 0 are mathematically adjacent with distance near zero.'
  - question: 'What is an Autoregressive Lag Feature (e.g. Lag 7 in daily sales forecasting)?'
    options:
      - 'The exact target value observed 7 time steps in the past: y_{t-7}, capturing weekly seasonal periodicity'
      - 'The difference between today price and tomorrow price'
      - 'The moving average of the next 7 days'
      - 'The total number of sales in the current calendar month'
    answer_index: 0
    explanation: 'Lag features feed historical values y_{t-k} directly as input columns into tabular ML models (GBDT / Ridge), capturing autoregressive and seasonal dependencies.'
