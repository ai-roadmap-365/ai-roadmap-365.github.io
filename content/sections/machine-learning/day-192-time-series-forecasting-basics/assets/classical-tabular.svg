<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two routes to a forecast.">
  <title>Classical models against tabular ones</title>
  <style>
    .classical-tabular-bg   { fill: #f8fafc; }
    .classical-tabular-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classical-tabular-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classical-tabular-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classical-tabular-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classical-tabular-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .classical-tabular-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classical-tabular-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .classical-tabular-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .classical-tabular-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .classical-tabular-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .classical-tabular-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .classical-tabular-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .classical-tabular-row { opacity: 1; }
    .classical-tabular-r0 { animation-delay: 0.00s; }
    .classical-tabular-r1 { animation-delay: 0.45s; }
    .classical-tabular-r2 { animation-delay: 0.90s; }
    .classical-tabular-r3 { animation-delay: 1.35s; }
    .classical-tabular-r4 { animation-delay: 1.80s; }
    .classical-tabular-row { animation: classical-tabular-reveal 7.3s ease-in-out infinite; }
    @keyframes classical-tabular-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="classical-tabular-bg" width="980" height="390"/>
  <text class="classical-tabular-h1"  x="30" y="40">Classical models against tabular ones</text>
  <text class="classical-tabular-sub" x="30" y="64">Two routes to a forecast.</text>
  <rect class="classical-tabular-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="classical-tabular-name" x="46" y="122">Classical statistical</text>
  <text class="classical-tabular-desc" x="46" y="142">Models the process.</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r0" x="46" y="182">Explicit trend and seasonality terms</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r1" x="46" y="216">Few parameters, interpretable</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r2" x="46" y="250">Strong on short, regular series</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r3" x="46" y="284">Handles uncertainty intervals natively</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r4" x="46" y="318">Hard to add external variables</text>
  <rect class="classical-tabular-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="classical-tabular-name" x="526" y="122">Tabular with lag features</text>
  <text class="classical-tabular-desc" x="526" y="142">Models a table.</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r0" x="526" y="182">Lags, rolling windows, calendar features</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r1" x="526" y="216">Boosted trees on the result</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r2" x="526" y="250">Strong with many series and covariates</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r3" x="526" y="284">Intervals need extra work</text>
  <text class="classical-tabular-desc classical-tabular-row classical-tabular-r4" x="526" y="318">External variables are trivial to add</text>
  <text class="classical-tabular-sub" x="30" y="372">The tabular route dominates competitions with many related series, and the classical route remains hard to beat on a single short, regular one.</text>
</svg>
