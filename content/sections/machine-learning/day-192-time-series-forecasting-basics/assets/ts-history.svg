<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Classical, then tabular.">
  <title>Four steps in forecasting</title>
  <style>
    .ts-history-bg   { fill: #f8fafc; }
    .ts-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ts-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ts-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ts-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ts-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ts-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ts-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ts-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ts-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ts-history-stage { opacity: 1; }

    .ts-history-s0 { animation-delay: 0.00s; }
    .ts-history-e0 { animation-delay: 0.00s; }
    .ts-history-s1 { animation-delay: 1.28s; }
    .ts-history-e1 { animation-delay: 1.28s; }
    .ts-history-s2 { animation-delay: 2.56s; }
    .ts-history-e2 { animation-delay: 2.56s; }
    .ts-history-s3 { animation-delay: 3.84s; }
    .ts-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ts-history-conn  { animation: ts-history-trace 6.4s ease-in-out infinite; }
      .ts-history-stage { animation: ts-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ts-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ts-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ts-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ts-history-stage { animation: ts-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ts-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ts-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ts-history-bg" width="980" height="322"/>
  <text class="ts-history-h1"  x="30" y="40">Four steps in forecasting</text>
  <text class="ts-history-sub" x="30" y="64">Classical, then tabular.</text>
  <g class="ts-history-stage ts-history-s0">
    <rect class="ts-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ts-history-step" x="44" y="142">01</text>
    <text class="ts-history-name" x="70" y="142">Exponential smoothing</text>
    <text class="ts-history-desc" x="44" y="166">Simple, robust, and still</text>
    <text class="ts-history-desc" x="44" y="182">competitive.</text>
  </g>
  <line class="ts-history-line ts-history-conn ts-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ts-history-tip)"/>
  <g class="ts-history-stage ts-history-s1">
    <rect class="ts-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ts-history-step" x="280" y="142">02</text>
    <text class="ts-history-name" x="306" y="142">The autoregressive family</text>
    <text class="ts-history-desc" x="280" y="166">Which gave the field its</text>
    <text class="ts-history-desc" x="280" y="182">statistical foundation.</text>
  </g>
  <line class="ts-history-line ts-history-conn ts-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ts-history-tip)"/>
  <g class="ts-history-stage ts-history-s2">
    <rect class="ts-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ts-history-step" x="516" y="142">03</text>
    <text class="ts-history-name" x="542" y="142">Then tabular machine learning on lag features</text>
    <text class="ts-history-desc" x="516" y="166">Which won competitions once many</text>
    <text class="ts-history-desc" x="516" y="182">series were involved.</text>
  </g>
  <line class="ts-history-line ts-history-conn ts-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ts-history-tip)"/>
  <g class="ts-history-stage ts-history-s3">
    <rect class="ts-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ts-history-step" x="752" y="142">04</text>
    <text class="ts-history-name" x="778" y="142">And global models trained across all series at once</text>
    <text class="ts-history-desc" x="752" y="166">Which is current best practice</text>
    <text class="ts-history-desc" x="752" y="182">at scale.</text>
  </g>
  <text class="ts-history-sub" x="30" y="304">Training one model across thousands of related series rather than one model each is the change that made machine learning decisively competitive here.</text>
</svg>
