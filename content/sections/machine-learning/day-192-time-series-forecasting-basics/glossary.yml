terms:
  - term: 'Time Series Forecasting'
    definition: 'The process of analyzing historical sequential data to predict future values across a specified temporal horizon.'
  - term: 'Stationarity'
    definition: 'A property of a time series where statistical properties (mean, variance, autocorrelation) remain constant over time.'
  - term: 'Autoregressive Lag'
    definition: 'A feature variable representing the historical value of the target series at a prior time step: y_{t-k}.'
  - term: 'Lookahead Bias'
    definition: 'A form of data leakage where future information is inadvertently used to train a model predicting past or current events.'
  - term: 'Rolling Window'
    definition: 'A moving window of fixed width w calculating aggregate statistics (mean, std, max) over recent historical time steps.'
  - term: 'Walk-Forward Validation'
    definition: 'A temporal cross-validation scheme where training datasets expand sequentially forward in time, testing strictly on subsequent horizons.'
  - term: 'sMAPE'
    definition: 'Symmetric Mean Absolute Percentage Error: an evaluation metric bounding percentage errors between 0% and 200%.'
  - term: 'Seasonality'
    definition: 'Predictable, repeating cyclical patterns or fluctuations occurring at regular calendar intervals (hourly, weekly, annual).'
