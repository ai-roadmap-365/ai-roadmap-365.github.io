visuals:
  - id: fastapi-ml-serving-architecture
    file: assets/fastapi-ml-serving-architecture.svg
    type: diagram
    title: FastAPI ML Inference Service Architecture
    alt: FastAPI ML inference architecture showing HTTP request Pydantic schema validation model forward pass and JSON response
    description: Real-time inference architecture illustrating request interception, Pydantic schema validation, vectorization, forward pass, and structured JSON output.
  - id: production-container-process-architecture
    file: assets/production-container-process-architecture.svg
    type: diagram
    title: Production ML Container Deployment Architecture
    alt: Microservice production deployment stack showing Docker container Uvicorn ASGI workers Gunicorn process manager and Prometheus telemetry
    description: Production container architecture detailing Gunicorn master process management, forked Uvicorn ASGI workers, and Prometheus metrics telemetry.
  - id: serving-flow
    file: assets/serving-flow.svg
    type: diagram
    title: 'The serving path'
    alt: 'Diagram: the five stages of a model serving request'
    description: 'A five-stage description of a serving request covering validation, feature assembly, prediction, post-processing and the response.'
  - id: batch-endpoint
    file: assets/batch-endpoint.svg
    type: diagram
    title: 'Single against batch endpoints'
    alt: 'Diagram: single-prediction endpoints compared with batch endpoints'
    description: 'A two-column comparison of single-request serving against batched serving.'
  - id: health-probes
    file: assets/health-probes.svg
    type: diagram
    title: 'Health checks'
    alt: 'Diagram: the difference between liveness and readiness checks'
    description: 'A four-stage description of health probes covering liveness, readiness, the distinction and the model-specific check.'
  - id: circuit-breaker
    file: assets/circuit-breaker.svg
    type: diagram
    title: 'Failing gracefully'
    alt: 'Diagram: how a circuit breaker degrades a model service safely'
    description: 'A four-stage description of circuit breaking covering failure detection, opening, the fallback and recovery.'
  - id: serving-idea
    file: assets/serving-idea.svg
    type: diagram
    title: 'What serving adds'
    alt: 'Diagram: the four concerns serving adds to a trained model'
    description: 'A four-stage description of model serving covering the contract, latency, availability and observability.'
  - id: pydantic-serving
    file: assets/pydantic-serving.svg
    type: diagram
    title: 'The serving contract'
    alt: 'Diagram: the four properties of a serving input contract'
    description: 'A four-stage description of the serving contract covering explicit types, ranges, versioning and error messages.'
  - id: serving-not
    file: assets/serving-not.svg
    type: diagram
    title: 'What serving is not'
    alt: 'Diagram: four misconceptions about model serving'
    description: 'A two-column comparison of misconceptions about serving against what is true.'
  - id: serving-history
    file: assets/serving-history.svg
    type: diagram
    title: 'Four steps in model serving'
    alt: 'Diagram: the historical progression of model serving practice'
    description: 'A four-stage description of serving history covering batch scoring, bespoke services, standard serving frameworks and managed endpoints.'
  - id: kitchen-service
    file: assets/kitchen-service.svg
    type: diagram
    title: 'A kitchen at service'
    alt: 'Diagram: cooking one dish compared with running a service'
    description: 'A two-column comparison of preparing a single dish against running a service.'
  - id: serving-implications
    file: assets/serving-implications.svg
    type: diagram
    title: 'Four consequences of serving'
    alt: 'Diagram: the availability, cost, contract and observability implications of model serving'
    description: 'A four-stage description of serving implications covering availability obligations, running cost, contract stability and observability.'
  - id: serving-when
    file: assets/serving-when.svg
    type: diagram
    title: 'Which serving pattern when'
    alt: 'Diagram: choosing a serving pattern by how predictions are consumed'
    description: 'A two-column comparison of consumption patterns against the serving approach each needs.'
