questions:
  - question: 'Why is loading a machine learning model inside the HTTP request handler function (e.g. inside def predict(): model = joblib.load()) an architectural anti-pattern?'
    options:
      - 'Loading models from disk on every single incoming HTTP request causes massive disk I/O latency (hundreds of milliseconds per request) and exhaust server RAM'
      - 'FastAPI does not allow reading files from disk'
      - 'Joblib can only be loaded once per operating system boot'
      - 'HTTP requests automatically delete pickle files'
    answer_index: 0
    explanation: 'Models must be preloaded once during server startup (using FastAPI lifespan / startup events) into shared worker memory, enabling sub-millisecond in-memory inference.'
  - question: 'What HTTP status code does FastAPI automatically return when an incoming JSON payload violates Pydantic schema constraints (e.g. string passed instead of float)?'
    options:
      - '422 Unprocessable Entity, providing structured error details pinpointing the exact invalid field'
      - '500 Internal Server Error'
      - '200 OK with empty response'
      - '404 Not Found'
    answer_index: 0
    explanation: 'FastAPI intercepts malformed payloads before they reach model code, returning a standard 422 Unprocessable Entity with precise field validation messages.'
  - question: 'What is the critical distinction between a Liveness Probe (/healthz/live) and a Readiness Probe (/healthz/ready) in Kubernetes ML deployments?'
    options:
      - 'Liveness checks if the Python process is alive; Readiness checks if the multi-gigabyte model weights have finished loading into RAM and can accept live traffic'
      - 'Liveness checks CPU temperature; Readiness checks GPU temperature'
      - 'Readiness only runs once per year'
      - 'There is no difference between liveness and readiness'
    answer_index: 0
    explanation: 'If a pod passes liveness but fails readiness during heavy model warmup, Kubernetes routes user traffic to other pods until the weights are fully loaded.'
  - question: 'Why is Vectorized Batch Inference (/predict_batch) significantly faster per sample than sequential single-item calls (/predict)?'
    options:
      - 'Vectorization leverages SIMD CPU instructions and eliminates per-request HTTP network handshake and serialization overhead across samples'
      - 'Batch inference skips all math calculations'
      - 'Batch inference converts floats to integers'
      - 'Batch endpoints do not require Python'
    answer_index: 0
    explanation: 'Vectorized NumPy/C++ matrix multiplication processes 1,000 samples in parallel using SIMD hardware instructions, reducing per-sample latency by up to 90%.'
  - question: 'In a mission-critical ML microservice, what does an automated Circuit Breaker do when the primary ML model raises an unexpected tensor exception?'
    options:
      - 'Catches the exception, logs an alert, and immediately returns a deterministic heuristic baseline prediction without crashing the user HTTP response'
      - 'Deletes the Docker container'
      - 'Reruns the model 100 times in a loop'
      - 'Sends an email to all users'
    answer_index: 0
    explanation: 'Circuit breakers ensure graceful degradation: if an unexpected null tensor or CUDA error occurs, the API returns a safe fallback baseline to maintain 100% user uptime.'
