<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By how the prediction is used.">
  <title>Which serving pattern when</title>
  <style>
    .serving-when-bg   { fill: #f8fafc; }
    .serving-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-when-row { opacity: 1; }
    .serving-when-r0 { animation-delay: 0.00s; }
    .serving-when-r1 { animation-delay: 0.45s; }
    .serving-when-r2 { animation-delay: 0.90s; }
    .serving-when-r3 { animation-delay: 1.35s; }
    .serving-when-r4 { animation-delay: 1.80s; }
    .serving-when-row { animation: serving-when-reveal 7.3s ease-in-out infinite; }
    @keyframes serving-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="serving-when-bg" width="980" height="390"/>
  <text class="serving-when-h1"  x="30" y="40">Which serving pattern when</text>
  <text class="serving-when-sub" x="30" y="64">By how the prediction is used.</text>
  <rect class="serving-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="serving-when-name" x="46" y="122">The situation</text>
  <text class="serving-when-desc" x="46" y="142">How it is used.</text>
  <text class="serving-when-desc serving-when-row serving-when-r0" x="46" y="182">A person waiting for an answer</text>
  <text class="serving-when-desc serving-when-row serving-when-r1" x="46" y="216">Scoring a whole population nightly</text>
  <text class="serving-when-desc serving-when-row serving-when-r2" x="46" y="250">High volume, latency tolerant</text>
  <text class="serving-when-desc serving-when-row serving-when-r3" x="46" y="284">Predictions needed at unpredictable times</text>
  <text class="serving-when-desc serving-when-row serving-when-r4" x="46" y="318">Very low volume</text>
  <rect class="serving-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="serving-when-name" x="526" y="122">The pattern</text>
  <text class="serving-when-desc" x="526" y="142">What to build.</text>
  <text class="serving-when-desc serving-when-row serving-when-r0" x="526" y="182">A real-time endpoint, unbatched</text>
  <text class="serving-when-desc serving-when-row serving-when-r1" x="526" y="216">A batch job writing to a table</text>
  <text class="serving-when-desc serving-when-row serving-when-r2" x="526" y="250">A queue with batched workers</text>
  <text class="serving-when-desc serving-when-row serving-when-r3" x="526" y="284">Real-time, with caching</text>
  <text class="serving-when-desc serving-when-row serving-when-r4" x="526" y="318">Batch, or a serverless function</text>
  <text class="serving-when-sub" x="30" y="372">The nightly batch job is under-used: where the prediction is not needed within the hour, it removes the availability commitment entirely.</text>
</svg>
