<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What serving is not</title>
  <style>
    .serving-not-bg   { fill: #f8fafc; }
    .serving-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-not-row { opacity: 1; }
    .serving-not-r0 { animation-delay: 0.00s; }
    .serving-not-r1 { animation-delay: 0.45s; }
    .serving-not-r2 { animation-delay: 0.90s; }
    .serving-not-r3 { animation-delay: 1.35s; }
    .serving-not-r4 { animation-delay: 1.80s; }
    .serving-not-row { animation: serving-not-reveal 7.3s ease-in-out infinite; }
    @keyframes serving-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="serving-not-bg" width="980" height="390"/>
  <text class="serving-not-h1"  x="30" y="40">What serving is not</text>
  <text class="serving-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="serving-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="serving-not-name" x="46" y="122">The misconception</text>
  <text class="serving-not-desc" x="46" y="142">Commonly held.</text>
  <text class="serving-not-desc serving-not-row serving-not-r0" x="46" y="182">Wrapping predict in a web handler is enough</text>
  <text class="serving-not-desc serving-not-row serving-not-r1" x="46" y="216">The model is the slow part</text>
  <text class="serving-not-desc serving-not-row serving-not-r2" x="46" y="250">Serving is an infrastructure concern</text>
  <text class="serving-not-desc serving-not-row serving-not-r3" x="46" y="284">Any input can be scored</text>
  <text class="serving-not-desc serving-not-row serving-not-r4" x="46" y="318">Deployment is the finish line</text>
  <rect class="serving-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="serving-not-name" x="526" y="122">What is true</text>
  <text class="serving-not-desc" x="526" y="142">Actually.</text>
  <text class="serving-not-desc serving-not-row serving-not-r0" x="526" y="182">Validation, fallbacks and observability are the work</text>
  <text class="serving-not-desc serving-not-row serving-not-r1" x="526" y="216">Feature assembly frequently dominates</text>
  <text class="serving-not-desc serving-not-row serving-not-r2" x="526" y="250">The model author owns the contract</text>
  <text class="serving-not-desc serving-not-row serving-not-r3" x="526" y="284">Validate, or produce silent wrong answers</text>
  <text class="serving-not-desc serving-not-row serving-not-r4" x="526" y="318">Monitoring begins there</text>
  <text class="serving-not-sub" x="30" y="372">Feature assembly dominating latency is common and surprising: a model taking two milliseconds behind a feature lookup taking eighty is the normal shape.</text>
</svg>
