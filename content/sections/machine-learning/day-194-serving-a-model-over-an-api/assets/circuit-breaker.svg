<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Failing gracefully</title>
  <style>
    .circuit-breaker-bg   { fill: #f8fafc; }
    .circuit-breaker-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .circuit-breaker-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .circuit-breaker-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .circuit-breaker-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .circuit-breaker-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .circuit-breaker-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .circuit-breaker-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .circuit-breaker-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .circuit-breaker-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .circuit-breaker-stage { opacity: 1; }

    .circuit-breaker-s0 { animation-delay: 0.00s; }
    .circuit-breaker-e0 { animation-delay: 0.00s; }
    .circuit-breaker-s1 { animation-delay: 1.28s; }
    .circuit-breaker-e1 { animation-delay: 1.28s; }
    .circuit-breaker-s2 { animation-delay: 2.56s; }
    .circuit-breaker-e2 { animation-delay: 2.56s; }
    .circuit-breaker-s3 { animation-delay: 3.84s; }
    .circuit-breaker-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .circuit-breaker-conn  { animation: circuit-breaker-trace 6.4s ease-in-out infinite; }
      .circuit-breaker-stage { animation: circuit-breaker-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes circuit-breaker-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes circuit-breaker-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .circuit-breaker-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .circuit-breaker-stage { animation: circuit-breaker-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes circuit-breaker-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="circuit-breaker-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="circuit-breaker-bg" width="980" height="322"/>
  <text class="circuit-breaker-h1"  x="30" y="40">Failing gracefully</text>
  <text class="circuit-breaker-sub" x="30" y="64">Four steps.</text>
  <g class="circuit-breaker-stage circuit-breaker-s0">
    <rect class="circuit-breaker-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-breaker-step" x="44" y="142">01</text>
    <text class="circuit-breaker-name" x="70" y="142">Track the failure rate of a dependency</text>
    <text class="circuit-breaker-desc" x="44" y="166">The feature store, or the model</text>
    <text class="circuit-breaker-desc" x="44" y="182">itself.</text>
  </g>
  <line class="circuit-breaker-line circuit-breaker-conn circuit-breaker-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#circuit-breaker-tip)"/>
  <g class="circuit-breaker-stage circuit-breaker-s1">
    <rect class="circuit-breaker-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-breaker-step" x="280" y="142">02</text>
    <text class="circuit-breaker-name" x="306" y="142">Open the circuit past a threshold</text>
    <text class="circuit-breaker-desc" x="280" y="166">Stop calling it rather than</text>
    <text class="circuit-breaker-desc" x="280" y="182">timing out repeatedly.</text>
  </g>
  <line class="circuit-breaker-line circuit-breaker-conn circuit-breaker-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#circuit-breaker-tip)"/>
  <g class="circuit-breaker-stage circuit-breaker-s2">
    <rect class="circuit-breaker-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-breaker-step" x="516" y="142">03</text>
    <text class="circuit-breaker-name" x="542" y="142">Serve a documented fallback</text>
    <text class="circuit-breaker-desc" x="516" y="166">A simpler model, a cached value,</text>
    <text class="circuit-breaker-desc" x="516" y="182">or the business rule.</text>
  </g>
  <line class="circuit-breaker-line circuit-breaker-conn circuit-breaker-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#circuit-breaker-tip)"/>
  <g class="circuit-breaker-stage circuit-breaker-s3">
    <rect class="circuit-breaker-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="circuit-breaker-step" x="752" y="142">04</text>
    <text class="circuit-breaker-name" x="778" y="142">Then test periodically and close it again</text>
    <text class="circuit-breaker-desc" x="752" y="166">Which recovers without a</text>
    <text class="circuit-breaker-desc" x="752" y="182">deployment.</text>
  </g>
  <text class="circuit-breaker-sub" x="30" y="304">Deciding the fallback in advance is what makes this useful: an undefined fallback becomes an error page, which is rarely the best available answer.</text>
</svg>
