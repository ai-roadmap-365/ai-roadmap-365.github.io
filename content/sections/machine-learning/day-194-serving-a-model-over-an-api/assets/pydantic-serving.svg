<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>The serving contract</title>
  <style>
    .pydantic-serving-bg   { fill: #f8fafc; }
    .pydantic-serving-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pydantic-serving-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pydantic-serving-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pydantic-serving-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pydantic-serving-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pydantic-serving-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pydantic-serving-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pydantic-serving-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pydantic-serving-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pydantic-serving-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pydantic-serving-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pydantic-serving-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pydantic-serving-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pydantic-serving-stage { opacity: 1; }

    .pydantic-serving-s0 { animation-delay: 0.00s; }
    .pydantic-serving-e0 { animation-delay: 0.00s; }
    .pydantic-serving-s1 { animation-delay: 1.28s; }
    .pydantic-serving-e1 { animation-delay: 1.28s; }
    .pydantic-serving-s2 { animation-delay: 2.56s; }
    .pydantic-serving-e2 { animation-delay: 2.56s; }
    .pydantic-serving-s3 { animation-delay: 3.84s; }
    .pydantic-serving-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pydantic-serving-conn  { animation: pydantic-serving-trace 6.4s ease-in-out infinite; }
      .pydantic-serving-stage { animation: pydantic-serving-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pydantic-serving-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pydantic-serving-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pydantic-serving-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pydantic-serving-stage { animation: pydantic-serving-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pydantic-serving-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pydantic-serving-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pydantic-serving-bg" width="980" height="322"/>
  <text class="pydantic-serving-h1"  x="30" y="40">The serving contract</text>
  <text class="pydantic-serving-sub" x="30" y="64">Four properties.</text>
  <g class="pydantic-serving-stage pydantic-serving-s0">
    <rect class="pydantic-serving-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pydantic-serving-step" x="44" y="142">01</text>
    <text class="pydantic-serving-name" x="70" y="142">Every field typed explicitly</text>
    <text class="pydantic-serving-desc" x="44" y="166">Including which are optional.</text>
  </g>
  <line class="pydantic-serving-line pydantic-serving-conn pydantic-serving-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pydantic-serving-tip)"/>
  <g class="pydantic-serving-stage pydantic-serving-s1">
    <rect class="pydantic-serving-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pydantic-serving-step" x="280" y="142">02</text>
    <text class="pydantic-serving-name" x="306" y="142">With ranges and allowed values where they exist</text>
    <text class="pydantic-serving-desc" x="280" y="166">So impossible inputs are</text>
    <text class="pydantic-serving-desc" x="280" y="182">rejected, not scored.</text>
  </g>
  <line class="pydantic-serving-line pydantic-serving-conn pydantic-serving-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pydantic-serving-tip)"/>
  <g class="pydantic-serving-stage pydantic-serving-s2">
    <rect class="pydantic-serving-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pydantic-serving-step" x="516" y="142">03</text>
    <text class="pydantic-serving-name" x="542" y="142">Versioned alongside the model</text>
    <text class="pydantic-serving-desc" x="516" y="166">Because the model's expectations</text>
    <text class="pydantic-serving-desc" x="516" y="182">change with it.</text>
  </g>
  <line class="pydantic-serving-line pydantic-serving-conn pydantic-serving-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pydantic-serving-tip)"/>
  <g class="pydantic-serving-stage pydantic-serving-s3">
    <rect class="pydantic-serving-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pydantic-serving-step" x="752" y="142">04</text>
    <text class="pydantic-serving-name" x="778" y="142">And errors that name the offending field</text>
    <text class="pydantic-serving-desc" x="752" y="166">So the caller can fix their</text>
    <text class="pydantic-serving-desc" x="752" y="182">side.</text>
  </g>
  <text class="pydantic-serving-sub" x="30" y="304">Range validation catches the failure that type checking misses: an age of four hundred is a valid integer and an invalid input, and only the range check knows.</text>
</svg>
