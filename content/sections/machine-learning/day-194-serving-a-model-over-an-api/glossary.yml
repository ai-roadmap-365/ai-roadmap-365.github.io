terms:
  - term: 'Model Serving'
    definition: 'The operational process of hosting a trained machine learning model behind an API to provide predictions for incoming queries.'
  - term: 'FastAPI'
    definition: 'An asynchronous Python web framework optimized for building high-performance REST APIs with automatic Pydantic validation.'
  - term: 'ASGI'
    definition: 'Asynchronous Server Gateway Interface: the standard Python interface for asynchronous web servers (e.g. Uvicorn).'
  - term: 'Pydantic Schema'
    definition: 'A strongly typed Python data contract defining validation rules, boundaries, and types for API request and response bodies.'
  - term: 'Readiness Probe'
    definition: 'A health check endpoint verifying that a microservice has finished initial startup and model loading before receiving traffic.'
  - term: 'Liveness Probe'
    definition: 'A health check endpoint verifying that a container process is running and has not deadlocked or hung.'
  - term: 'Batch Prediction'
    definition: 'An inference pattern where multiple feature vectors are sent together in a single request and processed via vectorized matrix operations.'
  - term: 'Fallback Heuristic'
    definition: 'A deterministic business rule executed when a primary ML model fails or exceeds its operational latency timeout.'
