visuals:
  - id: roc-vs-pr-curves
    file: assets/roc-vs-pr-curves.svg
    type: diagram
    title: 'ROC Curve versus Precision-Recall Curve under Class Imbalance'
    alt: 'Diagram showing an ROC curve displaying high AUC=0.95 contrasted with a Precision-Recall curve on a 1% imbalanced dataset where precision drops sharply due to high false positives.'
    description: 'A static architecture diagram illustrating the divergence between ROC space (TPR vs FPR) and PR space (Precision vs Recall) when evaluating rare positive events with overwhelming negative samples.'
  - id: threshold-cost-tradeoff
    file: assets/threshold-cost-tradeoff.svg
    type: flow-animated
    title: 'Threshold Sweeping and Asymmetric Cost Minimization'
    alt: 'Animated diagram showing a decision threshold marker sweeping across the probability distribution, demonstrating the inverse trade-off between Precision and Recall, and highlighting the minimum total cost operating point.'
    description: 'An animated flow diagram demonstrating how varying classification threshold tau from 0.0 to 1.0 shifts False Positives and False Negatives, reaching an optimal minimum-cost threshold with reduced-motion fallback.'
  - id: metrics-idea
    file: assets/metrics-idea.svg
    type: diagram
    title: 'Why accuracy misleads'
    alt: 'Diagram: why accuracy is inadequate for imbalanced or asymmetric problems'
    description: 'A four-stage description of the accuracy problem covering the rare class, the trivial model, the high score and the alternative.'
  - id: confusion-matrix
    file: assets/confusion-matrix.svg
    type: diagram
    title: 'The confusion matrix'
    alt: 'Diagram: the four cells of a binary confusion matrix'
    description: 'A four-stage description of the confusion matrix covering the four outcome types.'
  - id: core-metrics
    file: assets/core-metrics.svg
    type: diagram
    title: 'Four metrics from four cells'
    alt: 'Diagram: the four core classification metrics and the questions they answer'
    description: 'A four-stage description of classification metrics covering precision, recall, specificity and the combined score.'
  - id: pr-roc
    file: assets/pr-roc.svg
    type: diagram
    title: 'Two curves'
    alt: 'Diagram: the receiver operating characteristic curve compared with the precision-recall curve'
    description: 'A two-column comparison of the two threshold-sweep curves.'
  - id: cost-threshold
    file: assets/cost-threshold.svg
    type: diagram
    title: 'Choosing the operating point'
    alt: 'Diagram: how a classification threshold is derived from error costs'
    description: 'A four-stage description of cost-sensitive threshold choice covering the cost estimates, the sweep, the expected cost and the selection.'
  - id: metrics-not
    file: assets/metrics-not.svg
    type: diagram
    title: 'What these metrics are not'
    alt: 'Diagram: four misconceptions about classification metrics'
    description: 'A two-column comparison of misconceptions about classification metrics against what is true.'
  - id: metrics-history
    file: assets/metrics-history.svg
    type: diagram
    title: 'Four steps in evaluation metrics'
    alt: 'Diagram: the historical progression of classification evaluation metrics'
    description: 'A four-stage description of metric history covering signal detection, information retrieval, machine learning and modern AI evaluation.'
  - id: medical-screening
    file: assets/medical-screening.svg
    type: diagram
    title: 'A screening test'
    alt: 'Diagram: a screening test''s two error types and their different costs'
    description: 'A two-column comparison of the two error types in a screening test.'
  - id: metrics-implications
    file: assets/metrics-implications.svg
    type: diagram
    title: 'Four consequences of metric choice'
    alt: 'Diagram: the incentive, fairness, reporting and drift implications of metric choice'
    description: 'A four-stage description of metric implications covering optimisation incentives, subgroup disparity, honest reporting and threshold drift.'
  - id: metrics-when
    file: assets/metrics-when.svg
    type: diagram
    title: 'Which metric when'
    alt: 'Diagram: choosing a classification metric by the cost structure of the problem'
    description: 'A two-column comparison of situations against the metric that fits each.'
  - id: per-class-metrics
    file: assets/per-class-metrics.svg
    type: diagram
    title: 'Metrics beyond two classes'
    alt: 'Diagram: three ways to average classification metrics across multiple classes'
    description: 'A three-stage description of multiclass averaging covering macro, weighted and micro averaging.'
  - id: calibration-metrics
    file: assets/calibration-metrics.svg
    type: diagram
    title: 'Beyond ranking: calibration'
    alt: 'Diagram: how probability calibration is measured separately from ranking quality'
    description: 'A four-stage description of calibration covering the distinction, binning, the comparison and the remedy.'
  - id: metrics-vs-loss
    file: assets/metrics-vs-loss.svg
    type: diagram
    title: 'The metric against the loss'
    alt: 'Diagram: the training loss compared with the evaluation metric'
    description: 'A two-column comparison of the training loss against the evaluation metric.'
