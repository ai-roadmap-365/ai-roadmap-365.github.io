questions:
  - question: 'In a medical diagnostic screening for a rare disease with 1% prevalence, a model that blindly predicts "Healthy" for every patient achieves what accuracy, and what is its recall for infected patients?'
    options:
      - 'Accuracy = 99%, Recall = 0%'
      - 'Accuracy = 1%, Recall = 99%'
      - 'Accuracy = 50%, Recall = 50%'
      - 'Accuracy = 100%, Recall = 100%'
    answer_index: 0
    explanation: 'Since 99% of samples are negative, predicting negative everywhere correctly identifies 99% of samples (Accuracy = 99%), but catches zero infected patients (TP = 0, so Recall = 0%).'

  - question: 'What is the definition of Precision in binary classification?'
    options:
      - 'TP / (TP + FP) -- The fraction of positive predictions that were actually positive'
      - 'TP / (TP + FN) -- The fraction of actual positive cases that were detected'
      - 'TN / (TN + FP) -- The true negative rate'
      - '(TP + TN) / Total'
    answer_index: 0
    explanation: 'Precision measures predictive positive purity: of all the times the model sounded the alarm (TP + FP), how many were true alarms (TP).'

  - question: 'What is the harmonic mean property of the F1 score, and why is it preferred over the arithmetic mean?'
    options:
      - 'F1 = 2 * (P * R) / (P + R); the harmonic mean penalizes extreme imbalances, ensuring F1 is low if either Precision or Recall is near zero'
      - 'The harmonic mean is always equal to 1.0'
      - 'The harmonic mean is unaffected by False Positives'
      - 'The arithmetic mean requires matrix inversion'
    answer_index: 0
    explanation: 'If Precision is 1.0 and Recall is 0.0, the arithmetic mean is 0.50 (misleadingly moderate), while the harmonic mean F1 is 0.0 (accurately reflecting complete failure on one dimension).'

  - question: 'What are the axes of a Receiver Operating Characteristic (ROC) curve?'
    options:
      - 'Y-axis: True Positive Rate (Sensitivity / Recall); X-axis: False Positive Rate (1 - Specificity)'
      - 'Y-axis: Precision; X-axis: Recall'
      - 'Y-axis: Accuracy; X-axis: Threshold'
      - 'Y-axis: Loss; X-axis: Epochs'
    answer_index: 0
    explanation: 'The ROC curve plots TPR = TP / (TP + FN) on the vertical axis against FPR = FP / (TN + FP) on the horizontal axis as decision threshold tau sweeps from 1.0 to 0.0.'

  - question: 'What is the statistical interpretation of the Area Under the ROC Curve (ROC AUC)?'
    options:
      - 'The probability that the model assigns a higher predicted score to a randomly chosen positive instance than to a randomly chosen negative instance'
      - 'The accuracy of the model at threshold 0.50'
      - 'The percentage of True Positives in the test set'
      - 'The correlation between features and labels'
    answer_index: 0
    explanation: 'ROC AUC is mathematically equivalent to the Wilcoxon-Mann-Whitney U-statistic: P(score(x_pos) > score(x_neg)). A perfect ranker has AUC = 1.0; random guessing has AUC = 0.50.'

  - question: 'Why is the Precision-Recall (PR) curve preferred over the ROC curve when evaluating rare event detection (e.g. fraud detection with 0.1% positive rate)?'
    options:
      - 'The ROC curve includes True Negatives (TN) in the denominator of FPR, which dilutes False Positives when TN is massive, making ROC look unrealistically optimistic'
      - 'PR curves can only be plotted in Python'
      - 'ROC curves cannot handle continuous probabilities'
      - 'PR curves do not depend on threshold choice'
    answer_index: 0
    explanation: 'When negatives outnumber positives 1,000 to 1, having 100 False Positives produces a tiny FPR of 0.001 (ROC looks stellar), but Precision drops to a dismal 9% (PR curve honestly reflects high false alarm rate).'

  - question: 'If a bank determines that a missed fraudulent transaction (FN) costs $1,000, while a false alarm flagging a legitimate customer (FP) costs $10, how should the decision threshold tau be adjusted relative to the default tau = 0.50?'
    options:
      - 'Lower tau significantly (e.g. tau = 0.05 - 0.15) to aggressively maximize Recall and prevent expensive False Negatives'
      - 'Raise tau to 0.95 to maximize Precision'
      - 'Keep tau at 0.50 because probabilities are calibrated'
      - 'Set tau to 0.0'
    answer_index: 0
    explanation: 'When False Negatives are 100x more costly than False Positives, the threshold must be lowered so the system triggers an alert even on small hints of risk.'

  - question: 'What metric is considered the most robust single summary metric for binary classification on imbalanced datasets because it uses all four cells of the confusion matrix?'
    options:
      - 'Matthews Correlation Coefficient (MCC)'
      - 'Accuracy'
      - 'Precision'
      - 'Balanced Accuracy'
    answer_index: 0
    explanation: 'MCC incorporates TP, TN, FP, and FN into a Pearson correlation coefficient between true and predicted labels on a scale of [-1, +1], providing an honest score regardless of class prevalence.'
