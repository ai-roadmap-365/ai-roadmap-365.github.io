terms:
  - term: 'Confusion Matrix'
    definition: 'A 2x2 contingency table summarizing the counts of True Positives (TP), True Negatives (TN), False Positives (FP), and False Negatives (FN) produced by a classifier.'
  - term: 'Precision (Positive Predictive Value)'
    definition: 'The proportion of predicted positive instances that are truly positive: Precision = TP / (TP + FP).'
  - term: 'Recall (Sensitivity / True Positive Rate)'
    definition: 'The proportion of actual positive instances that were successfully identified: Recall = TP / (TP + FN).'
  - term: 'Specificity (True Negative Rate)'
    definition: 'The proportion of actual negative instances that were correctly identified: Specificity = TN / (TN + FP).'
  - term: 'False Positive Rate (FPR)'
    definition: 'The proportion of actual negative instances that were incorrectly classified as positive: FPR = FP / (TN + FP) = 1 - Specificity.'
  - term: 'F1 Score'
    definition: 'The harmonic mean of precision and recall: F1 = 2 * (Precision * Recall) / (Precision + Recall).'
  - term: 'Receiver Operating Characteristic (ROC)'
    definition: 'A graphical plot illustrating binary classifier diagnostic ability as its discrimination threshold tau is varied, plotting TPR against FPR.'
  - term: 'ROC AUC'
    definition: 'Area Under the ROC Curve: a threshold-independent metric measuring the probability that a classifier ranks a random positive instance higher than a random negative instance.'
  - term: 'Precision-Recall (PR) Curve'
    definition: 'A graphical plot showing the trade-off between Precision and Recall across all classification thresholds, especially informative for imbalanced datasets.'
  - term: 'Matthews Correlation Coefficient (MCC)'
    definition: 'A balanced metric for binary classification quality ranging from -1 to +1, computed directly from all four confusion matrix quadrants.'
