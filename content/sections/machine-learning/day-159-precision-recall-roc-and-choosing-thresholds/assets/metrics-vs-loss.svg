<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="They are not the same.">
  <title>The metric against the loss</title>
  <style>
    .metrics-vs-loss-bg   { fill: #f8fafc; }
    .metrics-vs-loss-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-vs-loss-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-vs-loss-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-vs-loss-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-vs-loss-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metrics-vs-loss-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-vs-loss-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metrics-vs-loss-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metrics-vs-loss-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metrics-vs-loss-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metrics-vs-loss-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metrics-vs-loss-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metrics-vs-loss-row { opacity: 1; }
    .metrics-vs-loss-r0 { animation-delay: 0.00s; }
    .metrics-vs-loss-r1 { animation-delay: 0.45s; }
    .metrics-vs-loss-r2 { animation-delay: 0.90s; }
    .metrics-vs-loss-r3 { animation-delay: 1.35s; }
    .metrics-vs-loss-r4 { animation-delay: 1.80s; }
    .metrics-vs-loss-row { animation: metrics-vs-loss-reveal 7.3s ease-in-out infinite; }
    @keyframes metrics-vs-loss-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="metrics-vs-loss-bg" width="980" height="390"/>
  <text class="metrics-vs-loss-h1"  x="30" y="40">The metric against the loss</text>
  <text class="metrics-vs-loss-sub" x="30" y="64">They are not the same.</text>
  <rect class="metrics-vs-loss-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-vs-loss-name" x="46" y="122">The loss</text>
  <text class="metrics-vs-loss-desc" x="46" y="142">What is optimised.</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r0" x="46" y="182">Must be differentiable</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r1" x="46" y="216">Computed on every training batch</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r2" x="46" y="250">Cross-entropy, usually</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r3" x="46" y="284">Not what anyone cares about directly</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r4" x="46" y="318">Chosen for optimisation</text>
  <rect class="metrics-vs-loss-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="metrics-vs-loss-name" x="526" y="122">The metric</text>
  <text class="metrics-vs-loss-desc" x="526" y="142">What is judged.</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r0" x="526" y="182">Need not be differentiable</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r1" x="526" y="216">Computed on validation and test sets</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r2" x="526" y="250">Precision, recall, expected cost</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r3" x="526" y="284">What the decision actually depends on</text>
  <text class="metrics-vs-loss-desc metrics-vs-loss-row metrics-vs-loss-r4" x="526" y="318">Chosen for meaning</text>
  <text class="metrics-vs-loss-sub" x="30" y="372">The gap between them is a real source of confusion: a run whose loss improves while its metric worsens is normal, not a bug.</text>
</svg>
