sources:
  - title: 'An Introduction to ROC Analysis'
    url: 'https://doi.org/10.1016/j.patrec.2005.10.010'
    publisher: 'Pattern Recognition Letters (Tom Fawcett)'
    accessed: '2026-08-29'
    year: 2006
    description: 'The definitive tutorial paper covering ROC curves, convex hulls, AUC interpretation, and cost-based decision making.'
  - title: 'The Relationship Between Precision-Recall and ROC Curves'
    url: 'https://doi.org/10.1145/1143844.1143874'
    publisher: 'ICML (Davis & Goadrich)'
    accessed: '2026-08-29'
    year: 2006
    description: 'Groundbreaking paper proving that an algorithm dominating in ROC space also dominates in PR space, and analyzing differences under extreme skew.'
  - title: 'The Advantages of the Matthews Correlation Coefficient (MCC) Over F1 Score and Accuracy'
    url: 'https://doi.org/10.1186/s12864-019-6413-7'
    publisher: 'BMC Genomics (Chicco & Jurman)'
    accessed: '2026-08-29'
    year: 2020
    description: 'Extensive empirical study demonstrating why MCC provides the most reliable evaluation on binary classification tasks.'
