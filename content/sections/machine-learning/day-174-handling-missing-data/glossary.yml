terms:
  - term: 'Missing Completely at Random (MCAR)'
    definition: 'A missing data mechanism where the probability of missingness is completely independent of both observed and unobserved data.'
  - term: 'Missing at Random (MAR)'
    definition: 'A missing data mechanism where missingness depends systematically on observed features but not on the unobserved missing value itself.'
  - term: 'Missing Not at Random (MNAR)'
    definition: 'A missing data mechanism where the probability of missingness depends directly on the unobserved value itself, carrying informative signal.'
  - term: 'Listwise Deletion (Complete Case Analysis)'
    definition: 'Discarding any observation that contains one or more missing values across any feature column.'
  - term: 'SimpleImputer'
    definition: 'A univariate imputation transformer that replaces missing values with fixed summary statistics (mean, median, mode, or constant).'
  - term: 'MissingIndicator'
    definition: 'A binary transformation that outputs boolean indicator features marking the exact coordinates of missing data in the original matrix.'
  - term: 'NaN-Euclidean Distance'
    definition: 'A modified Euclidean distance metric that calculates pairwise distances across mutually observed coordinates and scales by total dimension ratio.'
  - term: 'KNNImputer'
    definition: 'A multivariate imputation algorithm that imputes missing coordinates using the distance-weighted average of the k nearest neighbors.'
  - term: 'IterativeImputer (MICE)'
    definition: 'Multivariate Imputation by Chained Equations: modeling each missing feature as a regression function of all other features in round-robin cycles.'
  - term: 'Default Split Direction (GBDT NaNs)'
    definition: 'The optimal tree branching direction (left or right) chosen by gradient boosted trees to route missing values based on maximum split gain.'
