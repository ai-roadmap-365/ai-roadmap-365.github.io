questions:
  - question: 'What is the fundamental difference between Missing Completely at Random (MCAR) and Missing Not at Random (MNAR) in Donald Rubin’s taxonomy?'
    options:
      - 'Under MCAR, the probability of missingness is completely independent of both observed and unobserved data; under MNAR, the probability of missingness depends directly on the unobserved value itself (e.g. wealthy individuals refusing to disclose high income)'
      - 'MCAR only applies to integers; MNAR only applies to text strings'
      - 'MCAR means 100% of data is missing'
      - 'MNAR means missing values were caused by computer hardware failure'
    answer_index: 0
    explanation: 'MCAR is pure random coin-flip missingness. MNAR contains informative signal because the missingness mechanism is linked to the true unobserved quantity.'

  - question: 'Why is Listwise Deletion (calling df.dropna() to delete all rows with any missing value) usually a terrible practice in applied machine learning?'
    options:
      - 'It drastically reduces sample size N (often throwing away 70-90% of observations) and introduces severe selection bias if data is MAR or MNAR, distorting population distributions'
      - 'Listwise deletion is illegal in Python'
      - 'Listwise deletion causes memory leaks'
      - 'Listwise deletion only works for linear models'
    answer_index: 0
    explanation: 'If each of 20 features has 5% independent missingness, dropping rows with any missing value discards (1 - 0.95^20) = 64% of all training samples, destroying predictive power.'

  - question: 'What is the formula for NaN-aware Euclidean distance between two vectors u and v with missing entries?'
    options:
      - 'd(u, v) = sqrt( (D_total / D_valid) * sum_{j in valid} (u_j - v_j)^2 ), where D_total / D_valid scales the observed squared differences up to account for unobserved dimensions'
      - 'd(u, v) = sum |u_j - v_j|'
      - 'd(u, v) = sqrt( sum (u_j - v_j)^2 ) with NaNs replaced by 0'
      - 'd(u, v) = max(u) - min(v)'
    answer_index: 0
    explanation: 'The scaling factor D_total / D_valid adjusts the computed distance so pairs with fewer overlapping coordinates are fairly compared to pairs with full overlap.'

  - question: 'Why is combining SimpleImputer(strategy="median") with MissingIndicator(add_indicator=True) highly effective for linear models on MNAR data?'
    options:
      - 'The median fills numerical gaps with a stable baseline, while the binary MissingIndicator feature flag allows linear models to learn a dedicated weight for the informative missingness condition'
      - 'MissingIndicator converts all numbers to integers'
      - 'It runs 100x faster than mean imputation'
      - 'It prevents overfitting automatically'
    answer_index: 0
    explanation: 'If missingness is informative (e.g. patient didn’t take blood test because they felt healthy), the binary missing flag carries vital predictive signal.'

  - question: 'How do Gradient Boosted Decision Trees (XGBoost, LightGBM, CatBoost) natively handle missing values without manual imputation?'
    options:
      - 'At each decision split, the algorithm evaluates sending all samples with NaN to the left child versus the right child, and picks the default direction that maximizes the split loss reduction gain'
      - 'They delete rows with NaNs during tree building'
      - 'They replace NaNs with the number -999'
      - 'They convert NaNs to zero'
    answer_index: 0
    explanation: 'GBDTs treat missingness as a distinct branch choice, finding the optimal default child direction directly during greedy split optimization.'

  - question: 'How does IterativeImputer (Multivariate Imputation by Chained Equations / MICE) work?'
    options:
      - 'It models each feature with missing values as a function of all other features in a round-robin regression loop, iteratively updating estimates until predictions stabilize'
      - 'It computes the global dataset median 100 times'
      - 'It clusters the data with K-Means'
      - 'It drops columns one by one'
    answer_index: 0
    explanation: 'MICE treats missing value imputation as a series of predictive modeling tasks, preserving complex multivariate relationships across features.'

  - question: 'What is the computational complexity limitation of KNNImputer on large datasets?'
    options:
      - 'KNNImputer requires computing all pairwise NaN-Euclidean distances across all N samples, scaling as O(N^2 * D), which becomes prohibitively slow for large tabular datasets (N > 50,000)'
      - 'KNNImputer cannot run on multi-core CPUs'
      - 'KNNImputer is limited to 10 features'
      - 'KNNImputer only works on binary data'
    answer_index: 0
    explanation: 'Finding nearest neighbors requires O(N^2) pairwise distance computations, making KNNImputer expensive for large-scale enterprise datasets.'

  - question: 'Why MUST missing value imputers be fitted strictly on the training set and NOT the combined dataset?'
    options:
      - 'Computing imputation statistics (such as mean or median) across the full dataset causes data leakage, allowing test fold target information and distributions to contaminate training'
      - 'Imputers cannot process more than 1000 rows'
      - 'Test data cannot contain NaNs'
      - 'Scikit-learn crashes if you fit on test data'
    answer_index: 0
    explanation: 'Imputing globally leaks test set distribution medians and correlations into training folds, producing artificially optimistic validation scores.'
