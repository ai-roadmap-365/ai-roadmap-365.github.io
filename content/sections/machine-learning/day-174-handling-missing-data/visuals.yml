    file: assets/missing-data-taxonomy.svg
    type: diagram
    title: "Donald Rubin's Missing Data Taxonomy: MCAR vs MAR vs MNAR"
    alt: 'Architecture diagram comparing Missing Completely at Random (MCAR), Missing at Random (MAR), and Missing Not at Random (MNAR).'
    description: 'A static architecture diagram illustrating the mathematical dependencies, bias risks, and optimal imputation remedies for MCAR, MAR, and MNAR.'
  - id: knn-imputer-nan-geometry
    file: assets/knn-imputer-nan-geometry.svg
    type: flow-animated
    title: 'NaN-Euclidean Distance and KNN Imputation Geometry'
    alt: 'Animated flow chart showing 2D projection with missing coordinates, NaN-Euclidean distance scaling, nearest neighbor search, and coordinate imputation.'
    description: 'An animated flow chart showing the geometric calculation of NaN-Euclidean distance and neighbor averaging in KNNImputer.'
