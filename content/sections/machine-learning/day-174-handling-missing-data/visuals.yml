visuals:
  - id: missing-data-taxonomy
    file: assets/missing-data-taxonomy.svg
    type: diagram
    title: "Donald Rubin's Missing Data Taxonomy: MCAR vs MAR vs MNAR"
    alt: 'Architecture diagram comparing Missing Completely at Random (MCAR), Missing at Random (MAR), and Missing Not at Random (MNAR).'
    description: 'A static architecture diagram illustrating the mathematical dependencies, bias risks, and optimal imputation remedies for MCAR, MAR, and MNAR.'
  - id: knn-imputer-nan-geometry
    file: assets/knn-imputer-nan-geometry.svg
    type: flow-animated
    title: 'NaN-Euclidean Distance and KNN Imputation Geometry'
    alt: 'Animated flow chart showing 2D projection with missing coordinates, NaN-Euclidean distance scaling, nearest neighbor search, and coordinate imputation.'
    description: 'An animated flow chart showing the geometric calculation of NaN-Euclidean distance and neighbor averaging in KNNImputer.'
  - id: rubin
    file: assets/rubin.svg
    type: diagram
    title: 'Three missingness mechanisms'
    alt: 'Diagram: the three mechanisms of missing data and what each permits'
    description: 'A two-column comparison of missingness mechanisms against the treatment each allows.'
  - id: missing-indicator
    file: assets/missing-indicator.svg
    type: diagram
    title: 'Missingness is information'
    alt: 'Diagram: why the fact that a value is missing carries signal'
    description: 'A four-stage description of informative missingness covering the absent value, the reason, the signal and the indicator column.'
  - id: nan-euclidean
    file: assets/nan-euclidean.svg
    type: diagram
    title: 'Distance with missing values'
    alt: 'Diagram: how distance is computed when some values are absent'
    description: 'A four-stage description of missing-aware distance covering the problem, the present dimensions, the rescaling and the use.'
  - id: imputation-methods
    file: assets/imputation-methods.svg
    type: diagram
    title: 'Four imputation methods'
    alt: 'Diagram: four imputation methods compared by cost and quality'
    description: 'A two-column comparison of imputation methods against their trade-offs.'
  - id: native-missing
    file: assets/native-missing.svg
    type: diagram
    title: 'Native missing handling'
    alt: 'Diagram: how a boosted tree learns which way to route missing values'
    description: 'A four-stage description of native missing handling covering the split, the two options, the learned default and the advantage.'
  - id: missing-not
    file: assets/missing-not.svg
    type: diagram
    title: 'What handling missing data is not'
    alt: 'Diagram: four misconceptions about missing data'
    description: 'A two-column comparison of misconceptions about missing data against what is true.'
  - id: missing-history
    file: assets/missing-history.svg
    type: diagram
    title: 'Four steps in missing data practice'
    alt: 'Diagram: the historical progression of missing data handling'
    description: 'A four-stage description of missing data history covering deletion, single imputation, the statistical taxonomy and native model handling.'
  - id: survey
    file: assets/survey.svg
    type: diagram
    title: 'Unanswered survey questions'
    alt: 'Diagram: treating a blank answer as absent compared with treating it as informative'
    description: 'A two-column comparison of ignoring non-responses against treating them as data.'
  - id: missing-implications
    file: assets/missing-implications.svg
    type: diagram
    title: 'Four consequences of missing data handling'
    alt: 'Diagram: the bias, leakage, signal and model-choice implications of missing data handling'
    description: 'A four-stage description of missing data implications covering deletion bias, imputation leakage, lost signal and model choice.'
  - id: missing-when
    file: assets/missing-when.svg
    type: diagram
    title: 'Which approach when'
    alt: 'Diagram: choosing a missing data strategy by situation'
    description: 'A two-column comparison of situations against the missing data approach that fits.'
  - id: missing-why
    file: assets/missing-why.svg
    type: diagram
    title: 'What missing data handling solves'
    alt: 'Diagram: the four problems missing data handling addresses'
    description: 'A four-stage description of the problems addressed covering algorithm requirements, sample bias, lost signal and serving consistency.'
