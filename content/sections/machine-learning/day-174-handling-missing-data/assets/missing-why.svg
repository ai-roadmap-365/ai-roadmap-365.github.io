<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four problems.">
  <title>What missing data handling solves</title>
  <style>
    .missing-why-bg   { fill: #f8fafc; }
    .missing-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .missing-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .missing-why-stage { opacity: 1; }

    .missing-why-s0 { animation-delay: 0.00s; }
    .missing-why-e0 { animation-delay: 0.00s; }
    .missing-why-s1 { animation-delay: 1.28s; }
    .missing-why-e1 { animation-delay: 1.28s; }
    .missing-why-s2 { animation-delay: 2.56s; }
    .missing-why-e2 { animation-delay: 2.56s; }
    .missing-why-s3 { animation-delay: 3.84s; }
    .missing-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .missing-why-conn  { animation: missing-why-trace 6.4s ease-in-out infinite; }
      .missing-why-stage { animation: missing-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes missing-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes missing-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .missing-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .missing-why-stage { animation: missing-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes missing-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="missing-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="missing-why-bg" width="980" height="322"/>
  <text class="missing-why-h1"  x="30" y="40">What missing data handling solves</text>
  <text class="missing-why-sub" x="30" y="64">Four problems.</text>
  <g class="missing-why-stage missing-why-s0">
    <rect class="missing-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="missing-why-step" x="44" y="142">01</text>
    <text class="missing-why-name" x="70" y="142">Most algorithms cannot accept a gap</text>
    <text class="missing-why-desc" x="44" y="166">They need a number in every</text>
    <text class="missing-why-desc" x="44" y="182">cell.</text>
  </g>
  <line class="missing-why-line missing-why-conn missing-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#missing-why-tip)"/>
  <g class="missing-why-stage missing-why-s1">
    <rect class="missing-why-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="missing-why-step" x="280" y="142">02</text>
    <text class="missing-why-name" x="306" y="142">But deleting rows biases the sample</text>
    <text class="missing-why-desc" x="280" y="166">Toward whoever answered.</text>
  </g>
  <line class="missing-why-line missing-why-conn missing-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#missing-why-tip)"/>
  <g class="missing-why-stage missing-why-s2">
    <rect class="missing-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="missing-why-step" x="516" y="142">03</text>
    <text class="missing-why-name" x="542" y="142">And filling it in erases the fact of absence</text>
    <text class="missing-why-desc" x="516" y="166">Which was often the strongest</text>
    <text class="missing-why-desc" x="516" y="182">signal.</text>
  </g>
  <line class="missing-why-line missing-why-conn missing-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#missing-why-tip)"/>
  <g class="missing-why-stage missing-why-s3">
    <rect class="missing-why-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="missing-why-step" x="752" y="142">04</text>
    <text class="missing-why-name" x="778" y="142">While serving must handle it identically</text>
    <text class="missing-why-desc" x="752" y="166">Or predictions differ from</text>
    <text class="missing-why-desc" x="752" y="182">training.</text>
  </g>
  <text class="missing-why-sub" x="30" y="304">The serving requirement is the one that turns this from a data-cleaning task into a pipeline design decision: the imputation must travel with the model.</text>
</svg>
