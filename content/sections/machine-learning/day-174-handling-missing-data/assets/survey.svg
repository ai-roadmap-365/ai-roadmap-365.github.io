<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Silence is a response.">
  <title>Unanswered survey questions</title>
  <style>
    .survey-bg   { fill: #f8fafc; }
    .survey-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .survey-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .survey-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .survey-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .survey-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .survey-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .survey-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .survey-row { opacity: 1; }
    .survey-r0 { animation-delay: 0.00s; }
    .survey-r1 { animation-delay: 0.45s; }
    .survey-r2 { animation-delay: 0.90s; }
    .survey-r3 { animation-delay: 1.35s; }
    .survey-r4 { animation-delay: 1.80s; }
    .survey-row { animation: survey-reveal 7.3s ease-in-out infinite; }
    @keyframes survey-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="survey-bg" width="980" height="390"/>
  <text class="survey-h1"  x="30" y="40">Unanswered survey questions</text>
  <text class="survey-sub" x="30" y="64">Silence is a response.</text>
  <rect class="survey-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="survey-name" x="46" y="122">Treating blanks as absent</text>
  <text class="survey-desc" x="46" y="142">Nothing to see.</text>
  <text class="survey-desc survey-row survey-r0" x="46" y="182">The response is discarded</text>
  <text class="survey-desc survey-row survey-r1" x="46" y="216">Or filled with the average answer</text>
  <text class="survey-desc survey-row survey-r2" x="46" y="250">The reason for the blank is lost</text>
  <text class="survey-desc survey-row survey-r3" x="46" y="284">Conclusions drawn from respondents only</text>
  <text class="survey-desc survey-row survey-r4" x="46" y="318">This is naive imputation</text>
  <rect class="survey-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="survey-name" x="526" y="122">Treating blanks as data</text>
  <text class="survey-desc" x="526" y="142">Silence means something.</text>
  <text class="survey-desc survey-row survey-r0" x="526" y="182">Non-response recorded explicitly</text>
  <text class="survey-desc survey-row survey-r1" x="526" y="216">People who declined are a group</text>
  <text class="survey-desc survey-row survey-r2" x="526" y="250">Why they declined is analysed</text>
  <text class="survey-desc survey-row survey-r3" x="526" y="284">Conclusions account for both</text>
  <text class="survey-desc survey-row survey-r4" x="526" y="318">This is a missingness indicator</text>
  <text class="survey-sub" x="30" y="372">Survey methodologists treat non-response as a finding rather than a gap, and applied machine learning benefits from exactly the same instinct.</text>
</svg>
