<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="KNN Imputer NaN Geometry Flow">
  <title>NaN-Euclidean Distance and KNN Imputation Flow</title>
  <defs>
    <style>
      .d174f-bg { fill: #f8fafc; }
      .d174f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d174f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d174f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d174f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d174f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d174f-arr); fill: none; }
    </style>
    <marker id="d174f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d174f-bg" />

  <text x="40" y="45" class="d174f-title" font-size="22">NaN-Euclidean Metric &amp; KNN Imputation Lifecycle</text>
  <text x="40" y="70" class="d174f-text">Distance Scaling Across Incomplete Observations &amp; Local Coordinate Reconstruction</text>

  <!-- Step 1: Incomplete Observation Vector -->
  <rect x="60" y="110" width="240" height="150" class="d174f-card" />
  <text x="80" y="135" class="d174f-title" fill="#1d4ed8">1. Missing Coordinate</text>
  <text x="80" y="160" class="d174f-text">Row with missing Feature 2:</text>
  <text x="80" y="190" class="d174f-math">u = [ 10.0, NaN, 100.0 ]</text>
  <text x="80" y="215" class="d174f-math">v = [ 10.0, 50.0, 100.0 ]</text>
  <text x="80" y="240" class="d174f-text">D_total = 3, D_valid = 2</text>

  <path d="M 300 185 L 350 185" class="d174f-arrow" />

  <!-- Step 2: NaN-Euclidean Metric Scaling -->
  <rect x="350" y="110" width="250" height="150" class="d174f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="370" y="135" class="d174f-title" fill="#1e40af">2. NaN-Distance Scaling</text>
  <text x="370" y="165" class="d174f-math">d(u,v) = sqrt( (D/D_val) Σ(Δx)² )</text>
  <text x="370" y="195" class="d174f-math">d = sqrt( (3/2) · (0 + 0) ) = 0.0</text>
  <text x="370" y="225" class="d174f-text">Vector v identified as exact nearest neighbor!</text>

  <path d="M 600 185 L 650 185" class="d174f-arrow" />

  <!-- Step 3: Neighbor Average Imputation -->
  <rect x="650" y="110" width="210" height="150" class="d174f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="670" y="135" class="d174f-title" fill="#15803d">3. Coordinate Impute</text>
  <text x="670" y="160" class="d174f-text">Average top K neighbors:</text>
  <text x="670" y="190" class="d174f-math">u_2 = Mean(v_2 for v ∈ Nbrs)</text>
  <text x="670" y="215" class="d174f-math">u_2 = 50.0</text>
  <text x="670" y="240" class="d174f-text">Clean reconstructed row!</text>

  <!-- Down Arrow to Final Output -->
  <path d="M 755 260 L 755 320" class="d174f-arrow" />

  <!-- Bottom Panel: Production Impact -->
  <rect x="60" y="320" width="800" height="110" class="d174f-card" />
  <text x="80" y="350" class="d174f-title" fill="#0f172a">4. Production Advantages</text>
  <text x="80" y="375" class="d174f-text">• Preserves non-linear multi-attribute correlations without discarding valuable rows.</text>
  <text x="80" y="400" class="d174f-text">• Coupled with <tspan font-weight="700">MissingIndicator</tspan>, captures both continuous value and binary missingness signal.</text>
</svg>
