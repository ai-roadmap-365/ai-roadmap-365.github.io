<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward modelling it.">
  <title>Four steps in missing data practice</title>
  <style>
    .missing-history-bg   { fill: #f8fafc; }
    .missing-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .missing-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .missing-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .missing-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .missing-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .missing-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .missing-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .missing-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .missing-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .missing-history-stage { opacity: 1; }

    .missing-history-s0 { animation-delay: 0.00s; }
    .missing-history-e0 { animation-delay: 0.00s; }
    .missing-history-s1 { animation-delay: 1.28s; }
    .missing-history-e1 { animation-delay: 1.28s; }
    .missing-history-s2 { animation-delay: 2.56s; }
    .missing-history-e2 { animation-delay: 2.56s; }
    .missing-history-s3 { animation-delay: 3.84s; }
    .missing-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .missing-history-conn  { animation: missing-history-trace 6.4s ease-in-out infinite; }
      .missing-history-stage { animation: missing-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes missing-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes missing-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .missing-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .missing-history-stage { animation: missing-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes missing-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="missing-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="missing-history-bg" width="980" height="322"/>
  <text class="missing-history-h1"  x="30" y="40">Four steps in missing data practice</text>
  <text class="missing-history-sub" x="30" y="64">Toward modelling it.</text>
  <g class="missing-history-stage missing-history-s0">
    <rect class="missing-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="missing-history-step" x="44" y="142">01</text>
    <text class="missing-history-name" x="70" y="142">Delete incomplete rows</text>
    <text class="missing-history-desc" x="44" y="166">Simple, wasteful, and biased.</text>
  </g>
  <line class="missing-history-line missing-history-conn missing-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#missing-history-tip)"/>
  <g class="missing-history-stage missing-history-s1">
    <rect class="missing-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="missing-history-step" x="280" y="142">02</text>
    <text class="missing-history-name" x="306" y="142">Fill with a column mean</text>
    <text class="missing-history-desc" x="280" y="166">Which kept the rows and</text>
    <text class="missing-history-desc" x="280" y="182">distorted the distribution.</text>
  </g>
  <line class="missing-history-line missing-history-conn missing-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#missing-history-tip)"/>
  <g class="missing-history-stage missing-history-s2">
    <rect class="missing-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="missing-history-step" x="516" y="142">03</text>
    <text class="missing-history-name" x="542" y="142">Then a formal taxonomy of mechanisms</text>
    <text class="missing-history-desc" x="516" y="166">Which made the assumptions</text>
    <text class="missing-history-desc" x="516" y="182">explicit.</text>
  </g>
  <line class="missing-history-line missing-history-conn missing-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#missing-history-tip)"/>
  <g class="missing-history-stage missing-history-s3">
    <rect class="missing-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="missing-history-step" x="752" y="142">04</text>
    <text class="missing-history-name" x="778" y="142">And models that handle it natively</text>
    <text class="missing-history-desc" x="752" y="166">Learning the routing rather than</text>
    <text class="missing-history-desc" x="752" y="182">filling the gap.</text>
  </g>
  <text class="missing-history-sub" x="30" y="304">The taxonomy was the decisive contribution because it turned an ad hoc cleanup step into a question with a stateable assumption behind it.</text>
</svg>
