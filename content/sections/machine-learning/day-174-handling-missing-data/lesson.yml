id: D174
day: 174
slug: handling-missing-data
title: Handling Missing Data
section: machine-learning
subsection: supervised-learning
week: 25
learning_promise: >-
  Master the mathematical theory and practical implementation of Handling Missing Data: understand Donald Rubin's 1976
  taxonomy (MCAR, MAR, MNAR), compare SimpleImputer vs MissingIndicator vs KNNImputer vs IterativeImputer (MICE),
  derive the NaN-Euclidean distance metric from scratch, and analyze how Gradient Boosted Decision Trees natively route
  missing values during tree construction.
objectives:
  - 'Differentiate MCAR, MAR, and MNAR missing data mechanisms and their mathematical implications'
  - 'Derive and implement the NaN-aware Euclidean distance metric with dimension scaling'
  - 'Implement MissingIndicator feature flags to capture non-random missingness signals'
  - 'Construct distance-weighted KNNImputer and understand IterativeImputer (MICE / chained equations)'
  - 'Analyze native GBDT (XGBoost/LightGBM) default split gain routing for NaNs'
  - 'Evaluate the severe estimation biases introduced by naive listwise deletion (dropna)'
  - 'Construct leak-free missing value imputation pipelines inside ColumnTransformer'
  - 'Select the optimal imputation strategy based on dataset size, cardinality, and missingness ratio'
prerequisites:
  - 'Day 170 -- Feature Scaling and Encoding'
  - 'Day 173 -- Scikit-Learn Pipelines'
reading_time_minutes: 50
practical_time_minutes: 60
