visuals:
  - id: feature-selection-taxonomy
    file: assets/feature-selection-taxonomy.svg
    type: diagram
    title: 'The 3 Canonical Feature Selection Methodologies: Filter vs Wrapper vs Embedded'
    alt: 'Architecture diagram comparing Filter methods (fast univariate), Wrapper methods (iterative model loop), and Embedded methods (integrated regularization).'
    description: 'A static architecture diagram illustrating the trade-offs, speeds, and algorithmic loops of Filter, Wrapper, and Embedded selection methods.'
  - id: boruta-shadow-features-flow
    file: assets/boruta-shadow-features-flow.svg
    type: flow-animated
    title: 'Boruta Shadow Feature Permutation Testing Workflow'
    alt: 'Animated flow chart showing creation of permuted shadow features, model training on extended matrix, Z-score comparison, and feature confirmation.'
    description: 'An animated flow chart demonstrating the Boruta algorithm hypothesis test comparing real features against randomized shadow copies.'
  - id: selection-idea
    file: assets/selection-idea.svg
    type: diagram
    title: 'Why fewer features'
    alt: 'Diagram: the four reasons to reduce the number of features'
    description: 'A four-stage description of feature selection motives covering variance, cost, interpretability and maintenance.'
  - id: selection-families
    file: assets/selection-families.svg
    type: diagram
    title: 'Three families of selection'
    alt: 'Diagram: filter, wrapper and embedded feature selection compared'
    description: 'A two-column comparison of feature selection families by cost and quality.'
  - id: wrapper
    file: assets/wrapper.svg
    type: diagram
    title: 'Wrapper selection'
    alt: 'Diagram: how recursive feature elimination selects a feature subset'
    description: 'A four-stage description of recursive elimination covering the full fit, ranking, removal and the stopping point.'
  - id: embedded
    file: assets/embedded.svg
    type: diagram
    title: 'Embedded selection'
    alt: 'Diagram: how a penalty drives coefficients to exactly zero'
    description: 'A four-stage description of embedded selection covering the penalty, the geometry, the zeros and the benefit.'
  - id: selection-bias
    file: assets/selection-bias.svg
    type: diagram
    title: 'The golden rule'
    alt: 'Diagram: how selecting features before splitting produces an inflated score'
    description: 'A four-stage description of selection bias covering the wrong order, the target use, the inflated score and the correct order.'
  - id: selection-not
    file: assets/selection-not.svg
    type: diagram
    title: 'What feature selection is not'
    alt: 'Diagram: four misconceptions about feature selection'
    description: 'A two-column comparison of misconceptions about feature selection against what is true.'
  - id: selection-stability
    file: assets/selection-stability.svg
    type: diagram
    title: 'Selection stability'
    alt: 'Diagram: how selection stability across folds indicates feature reliability'
    description: 'A four-stage description of stability selection covering per-fold selection, the frequency count, the interpretation and the decision.'
  - id: packing
    file: assets/packing.svg
    type: diagram
    title: 'Packing for a journey'
    alt: 'Diagram: packing everything compared with packing deliberately'
    description: 'A two-column comparison of taking everything against taking what is needed.'
  - id: selection-implications
    file: assets/selection-implications.svg
    type: diagram
    title: 'Four consequences of selection'
    alt: 'Diagram: the accuracy, cost, robustness and bias implications of feature selection'
    description: 'A four-stage description of selection implications covering accuracy, serving cost, robustness and selection bias.'
  - id: selection-when
    file: assets/selection-when.svg
    type: diagram
    title: 'Which method when'
    alt: 'Diagram: choosing a feature selection method by situation'
    description: 'A two-column comparison of situations against the selection method that fits.'
