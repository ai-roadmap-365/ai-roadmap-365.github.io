terms:
  - term: 'Feature Selection'
    definition: 'The process of selecting a subset of relevant features for use in model construction to reduce overfitting and improve efficiency.'
  - term: 'Filter Method'
    definition: 'A model-agnostic feature selection approach that evaluates individual feature properties (variance, correlation, mutual information) independently.'
  - term: 'Wrapper Method'
    definition: 'A feature selection approach (e.g. RFE, SFS) that uses a predictive model as an evaluation engine to search candidate feature subsets.'
  - term: 'Embedded Method'
    definition: 'Feature selection performed directly as part of the model learning algorithm (e.g. L1 Lasso sparsity, Tree Gain importance).'
  - term: 'Recursive Feature Elimination (RFE)'
    definition: 'A greedy backward selection algorithm that iteratively fits a model and prunes the least important feature until the target subset size is reached.'
  - term: 'Boruta Algorithm'
    definition: 'An all-relevant feature selection method that compares real feature importances against randomly permuted shadow noise copies.'
  - term: 'Mutual Information'
    definition: 'A non-parametric measure of the mutual dependence between two variables that captures both linear and non-linear relationships.'
  - term: 'Selection Bias (Leakage)'
    definition: 'Optimistic evaluation bias caused by selecting features on the full dataset rather than strictly inside cross-validation training folds.'
  - term: 'VarianceThreshold'
    definition: 'A baseline filter that removes all features whose empirical variance does not meet a specified minimum threshold.'
  - term: 'Curse of Dimensionality'
    definition: 'The exponential increase in volume and sparsity of feature space as dimensions grow, requiring exponentially more data to generalize.'
