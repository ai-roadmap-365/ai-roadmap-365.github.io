questions:
  - question: 'What is Selection Bias (Data Leakage) in feature selection, and how is it strictly prevented?'
    options:
      - 'Selecting before splitting lets test labels choose features'
      - 'Selection bias occurs when you select fewer than 5 features'
      - 'Selection bias is prevented by training on a GPU'
      - 'Selection bias only affects neural networks'
    answer_index: 0
    explanation: 'If you select the top 20 features using all N samples, you have used the test fold targets to pick features, creating a severe optimistic bias that collapses on new real-world data.'

  - question: 'What is the primary operational trade-off between Filter Methods and Wrapper Methods (like RFE)?'
    options:
      - 'Filter methods always achieve higher accuracy than wrapper methods'
      - 'Filters are fast but univariate; wrappers are costly'
      - 'Wrapper methods do not require training a machine learning model'
      - 'Filter methods only work on categorical data'
    answer_index: 1
    explanation: 'Filter methods rank features individually without fitting models (fast O(d)). Wrapper methods repeatedly fit the estimator to evaluate subset interactions (slow but tailored to the specific model).'

  - question: 'How does Mutual Information I(X; Y) differ from Pearson Correlation r(X, Y) in feature filtering?'
    options:
      - 'Pearson correlation is non-parametric'
      - 'Mutual information only works on integer targets'
      - 'Pearson finds only linear; MI finds any dependency'
      - 'Mutual information cannot handle continuous variables'
    answer_index: 2
    explanation: 'Mutual Information measures how much knowing X reduces uncertainty about Y. For y = x^2 with x centered at 0, Pearson correlation is 0, but Mutual Information is high.'

  - question: 'How does the Boruta Algorithm statistically determine whether a feature is genuinely informative?'
    options:
      - 'It drops all features with negative coefficients'
      - 'It trains a deep neural network for 1000 epochs'
      - 'It calculates the determinant of the covariance matrix'
      - 'It compares real features against shuffled shadow copies'
    answer_index: 3
    explanation: 'Boruta uses shadow features as empirical null hypothesis noise benchmarks. A real feature is confirmed only if its importance consistently beats the best randomized noise feature.'

  - question: 'What is the mathematical mechanism of Recursive Feature Elimination (RFE)?'
    options:
      - 'It fits, ranks, prunes the weakest, and repeats'
      - 'It tests all 2^d possible combinations simultaneously'
      - 'It randomly drops 50% of columns in each step'
      - 'It computes the singular value decomposition of X'
    answer_index: 0
    explanation: 'RFE is a greedy backward elimination algorithm that iteratively prunes the least important features according to the model coefficients.'

  - question: 'Why does removing highly collinear redundant features (|r| > 0.90) improve model stability and explainability?'
    options:
      - 'Multicollinearity causes out-of-memory errors in CPU RAM'
      - 'Multicollinearity inflates coefficient variance'
      - 'Removing collinear features always doubles model training time'
      - 'Decision trees cannot train on correlated features'
    answer_index: 1
    explanation: 'When two features carry identical information, linear models assign arbitrary opposing weights (e.g. +1000 and -1000). Pruning redundancy stabilizes weight interpretation.'

  - question: 'What is the recommended multi-stage Feature Selection Funnel for large tabular datasets (e.g. 10,000 initial raw + engineered features)?'
    options:
      - 'Keep all 10,000 features without any selection'
      - 'Run brute-force all-subsets search on 10,000 features'
      - 'Filter, then embedded importance, then RFECV'
      - 'Select only the first 5 columns of the CSV file'
    answer_index: 2
    explanation: 'A multi-stage funnel combines the speed of filter methods for high-volume pruning with the precision of wrapper/embedded methods for fine subset tuning.'

  - question: 'How does L1 Lasso Regularization perform Embedded Feature Selection automatically during training?'
    options:
      - 'Lasso only works when all features are integers'
      - 'Lasso deletes columns from the Pandas DataFrame before training'
      - 'Lasso computes random tree splits'
      - 'The L1 corner at zero drives weights exactly to 0'
    answer_index: 3
    explanation: 'The diamond-shaped L1 constraint surface causes loss function contours to intersect at the axes, driving non-informative feature weights strictly to zero.'
