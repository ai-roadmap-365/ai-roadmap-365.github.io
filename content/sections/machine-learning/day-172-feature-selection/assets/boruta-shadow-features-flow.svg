<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Boruta Shadow Feature Testing Flow">
  <title>Boruta Shadow Features Algorithm Workflow</title>
  <defs>
    <style>
      .d172f-bg { fill: #f8fafc; }
      .d172f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d172f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d172f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d172f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d172f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d172f-arr); fill: none; }
    </style>
    <marker id="d172f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d172f-bg" />

  <text x="40" y="45" class="d172f-title" font-size="22">Boruta Shadow Feature Permutation Algorithm (Kursa &amp; Rudnicki, 2010)</text>
  <text x="40" y="70" class="d172f-text">Statistical Hypothesis Testing: Proving Real Features Outperform Randomized Shadow Noise</text>

  <!-- Step 1: Create Shadow Features -->
  <rect x="60" y="110" width="240" height="150" class="d172f-card" />
  <text x="80" y="135" class="d172f-title" fill="#1d4ed8">1. Permute Shadow Copies</text>
  <text x="80" y="160" class="d172f-text">For every feature X_j, create a shuffled shadow copy:</text>
  <text x="80" y="195" class="d172f-math">X_shadow = Permute(X)</text>
  <text x="80" y="225" class="d172f-math">X_ext = [ X | X_shadow ]</text>

  <path d="M 300 185 L 350 185" class="d172f-arrow" />

  <!-- Step 2: Fit Random Forest & Measure Importance -->
  <rect x="350" y="110" width="250" height="150" class="d172f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="370" y="135" class="d172f-title" fill="#1e40af">2. Measure Importances</text>
  <text x="370" y="160" class="d172f-text">Fit Forest on extended matrix:</text>
  <text x="370" y="190" class="d172f-math">Z_max_shadow = Max(Z_shadow)</text>
  <text x="370" y="215" class="d172f-text">Record hits where:</text>
  <text x="370" y="235" class="d172f-math">Z_real_j &gt; Z_max_shadow</text>

  <path d="M 600 185 L 650 185" class="d172f-arrow" />

  <!-- Step 3: Statistical Hypothesis Test -->
  <rect x="650" y="110" width="210" height="150" class="d172f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="670" y="135" class="d172f-title" fill="#15803d">3. Binomial Test</text>
  <text x="670" y="160" class="d172f-text">Across N_trials:</text>
  <text x="670" y="190" class="d172f-math">Hits ~ Binomial(N, p=0.5)</text>
  <text x="670" y="215" class="d172f-text">Classify each feature:</text>
  <text x="670" y="235" class="d172f-math" fill="#15803d">Confirmed / Tentative / Rejected</text>

  <!-- Down Arrow to Final Output -->
  <path d="M 755 260 L 755 320" class="d172f-arrow" />

  <!-- Bottom Panel: Production Impact -->
  <rect x="60" y="320" width="800" height="110" class="d172f-card" />
  <text x="80" y="350" class="d172f-title" fill="#0f172a">4. All-Relevant Feature Selection Guarantee</text>
  <text x="80" y="375" class="d172f-text">• Unlike minimal-optimal RFE, Boruta finds <tspan font-weight="700">ALL features carrying statistical signal</tspan>.</text>
  <text x="80" y="400" class="d172f-text">• Guarantees zero arbitrary drop of synergistic correlated features while removing 100% of pure noise.</text>
</svg>
