questions:
  - question: "Why does simply deleting protected demographic features (e.g. Race, Gender) from a dataset fail to prevent algorithmic discrimination?"
    options:
      - 'Other features act as proxies for the protected one'
      - "Machine learning models automatically crash if fewer than 10 features are provided."
      - "Deleting columns reduces GPU memory bandwidth during training."
      - "Gradient descent requires protected attributes to compute backward loss gradients."
    answer_index: 0
    explanation: "This is known as Fairness Through Unawareness failure. Redundant encodings in modern high-dimensional datasets allow complex non-linear models to easily reconstruct protected attributes from correlated proxy features."

  - question: "What does the EEOC 4/5ths (80%) Rule establish regarding Disparate Impact Ratio?"
    options:
      - "At least 80% of training data must be reserved for model validation."
      - 'The unprivileged rate must be at least 80% of the other'
      - "The model must achieve an accuracy of at least 80% on all demographic subgroups."
      - "Models must be retrained every 4 to 5 months in production."
    answer_index: 1
    explanation: "The Equal Employment Opportunity Commission (EEOC) Uniform Guidelines define adverse impact as a selection rate for any group which is less than four-fifths (80%) of the rate for the group with the highest selection rate."

  - question: "What is the core conclusion of the Impossibility Theorem of Algorithmic Fairness (Kleinberg et al. 2016)?"
    options:
      - "Decision trees are mathematically incapable of splitting on continuous features."
      - "Machine learning algorithms can never be audited by human regulators."
      - 'When base rates differ, the three cannot all hold'
      - "Fairness metrics cannot be computed in Python."
    answer_index: 2
    explanation: "Kleinberg and Chouldechova proved that if the true underlying base rate P(Y=1|A) differs between groups, equalizing error rates (Equalized Odds) and equalizing predictive precision (Predictive Parity) are mathematically mutually exclusive."

  - question: "What is Equal Opportunity as defined by Hardt et al. (2016)?"
    options:
      - "Ensuring that the training dataset has an equal number of male and female samples."
      - "Requiring that exactly 50% of all applicants in every group receive loans."
      - "Requiring that all models use equal learning rates during gradient descent."
      - 'Equal true positive rate across groups'
    answer_index: 3
    explanation: "Equal Opportunity focuses on qualified individuals (Y=1), requiring that a qualified person has an equal probability of being correctly approved regardless of their demographic group."

  - question: "How does Post-Processing Threshold Calibration achieve Equal Opportunity in production?"
    options:
      - 'Group-specific thresholds that equalise the TPR'
      - "By adding random Gaussian noise to all predictions until accuracy drops to 50%."
      - "By retraining the entire model architecture using adversarial loss."
      - "By deleting 50% of the privileged group's positive predictions."
    answer_index: 0
    explanation: "Post-processing calibration adjusts the decision cutoff threshold independently for each group (e.g. lowering T_0 for unprivileged applicants) so that qualified candidates in all groups achieve identical True Positive Rates without retraining the core model."
