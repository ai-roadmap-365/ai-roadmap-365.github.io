id: D179
day: 179
slug: fairness-and-bias-in-models
title: Fairness and Bias in Models
section: machine-learning
subsection: supervised-learning
week: 26
learning_promise: >-
  Master the mathematical formulation and engineering mitigation of algorithmic bias in machine learning: understand
  why dropping protected attributes fails, quantify Demographic Parity, Equalized Odds, and Predictive Parity, prove the
  Impossibility Theorem of Algorithmic Fairness, and implement pre-processing sample reweighing and post-processing
  group threshold calibration.
objectives:
  - 'Differentiate direct discrimination from proxy discrimination through redundant feature encoding'
  - 'Formulate and compute Demographic Parity Difference and the EEOC Disparate Impact 4/5ths Ratio'
  - 'Formulate and compute Equal Opportunity (Equal TPR) and Equalized Odds (Equal TPR and FPR)'
  - 'Prove why Equalized Odds, Predictive Parity, and Calibration are mutually exclusive under unequal base rates'
  - 'Implement pre-processing sample reweighing (Kamiran & Calders) to debias training data'
  - 'Implement post-processing group-specific threshold calibration to achieve Equal Opportunity'
  - 'Audit production models for regulatory compliance with ECOA, EEOC, and the EU AI Act'
prerequisites:
  - 'Day 159 -- Precision, Recall, ROC, and Choosing Thresholds'
  - 'Day 176 -- Choosing the Right Metric'
  - 'Day 178 -- Interpreting Models: Importances and SHAP'
reading_time_minutes: 50
practical_time_minutes: 60
