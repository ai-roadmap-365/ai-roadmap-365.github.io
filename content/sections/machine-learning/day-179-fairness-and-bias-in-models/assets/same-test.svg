<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which is not the same as fair.">
  <title>The same test for everyone</title>
  <style>
    .same-test-bg   { fill: #f8fafc; }
    .same-test-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-test-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-test-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-test-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-test-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .same-test-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .same-test-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .same-test-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .same-test-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .same-test-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .same-test-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .same-test-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .same-test-row { opacity: 1; }
    .same-test-r0 { animation-delay: 0.00s; }
    .same-test-r1 { animation-delay: 0.45s; }
    .same-test-r2 { animation-delay: 0.90s; }
    .same-test-r3 { animation-delay: 1.35s; }
    .same-test-r4 { animation-delay: 1.80s; }
    .same-test-row { animation: same-test-reveal 7.3s ease-in-out infinite; }
    @keyframes same-test-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="same-test-bg" width="980" height="390"/>
  <text class="same-test-h1"  x="30" y="40">The same test for everyone</text>
  <text class="same-test-sub" x="30" y="64">Which is not the same as fair.</text>
  <rect class="same-test-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="same-test-name" x="46" y="122">Identical treatment</text>
  <text class="same-test-desc" x="46" y="142">The same rule for all.</text>
  <text class="same-test-desc same-test-row same-test-r0" x="46" y="182">One rule, applied uniformly</text>
  <text class="same-test-desc same-test-row same-test-r1" x="46" y="216">Feels obviously fair</text>
  <text class="same-test-desc same-test-row same-test-r2" x="46" y="250">Ignores differing starting conditions</text>
  <text class="same-test-desc same-test-row same-test-r3" x="46" y="284">Can produce very unequal outcomes</text>
  <text class="same-test-desc same-test-row same-test-r4" x="46" y="318">This is fairness through unawareness</text>
  <rect class="same-test-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="same-test-name" x="526" y="122">Equitable outcomes</text>
  <text class="same-test-desc" x="526" y="142">Adjusted for conditions.</text>
  <text class="same-test-desc same-test-row same-test-r0" x="526" y="182">The rule accounts for circumstances</text>
  <text class="same-test-desc same-test-row same-test-r1" x="526" y="216">Feels less obviously fair</text>
  <text class="same-test-desc same-test-row same-test-r2" x="526" y="250">Addresses differing starting points</text>
  <text class="same-test-desc same-test-row same-test-r3" x="526" y="284">Aims at comparable outcomes</text>
  <text class="same-test-desc same-test-row same-test-r4" x="526" y="318">This is outcome-based fairness</text>
  <text class="same-test-sub" x="30" y="372">The tension between these two is centuries old in law and policy, and algorithmic fairness inherited it intact rather than creating it.</text>
</svg>
