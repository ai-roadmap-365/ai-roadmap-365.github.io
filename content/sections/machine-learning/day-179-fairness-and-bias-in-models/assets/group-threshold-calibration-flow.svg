<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Group Threshold Calibration Flow</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .box { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .box-hi { fill: var(--accent-subtle, #1e1b4b); stroke: var(--accent, #6366f1); stroke-width: 2; rx: 8; }
    .thresh-line { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 4; }
    .thresh-calib { stroke: #10b981; stroke-width: 3; }
    .wire-active { stroke: #6366f1; stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      .wire-active { animation: none !important; stroke-dasharray: none; }
    }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
  </style>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Post-Processing Group Threshold Calibration</text>
  <text x="450" y="65" class="text-sub">Shifting Decision Thresholds (T_0, T_1) to Guarantee Equal Opportunity (Equal TPR)</text>

  <!-- Group 0 Distribution -->
  <rect x="60" y="100" width="360" height="300" class="box" />
  <text x="240" y="130" class="text-title">Unprivileged Group (A = 0)</text>
  <text x="240" y="150" class="text-sub">Lower Baseline Probability Distribution</text>

  <path d="M 90 350 Q 180 220 230 350" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2" />
  <path d="M 180 350 Q 250 180 370 350" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />

  <!-- Thresholds for Group 0 -->
  <line x1="280" y1="170" x2="280" y2="360" class="thresh-line" />
  <text x="280" y="165" class="text-sub" fill="#ef4444">Default T=0.50 (TPR=45%)</text>

  <line x1="210" y1="190" x2="210" y2="360" class="thresh-calib" />
  <text x="210" y="185" class="text-sub" fill="#10b981">Calibrated T_0=0.32 (TPR=80%)</text>

  <!-- Group 1 Distribution -->
  <rect x="480" y="100" width="360" height="300" class="box" />
  <text x="660" y="130" class="text-title">Privileged Group (A = 1)</text>
  <text x="660" y="150" class="text-sub">Higher Baseline Probability Distribution</text>

  <path d="M 510 350 Q 600 240 650 350" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2" />
  <path d="M 600 350 Q 700 160 810 350" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />

  <!-- Thresholds for Group 1 -->
  <line x1="680" y1="170" x2="680" y2="360" class="thresh-line" />
  <text x="680" y="165" class="text-sub" fill="#ef4444">Default T=0.50 (TPR=88%)</text>

  <line x1="720" y1="190" x2="720" y2="360" class="thresh-calib" />
  <text x="720" y="185" class="text-sub" fill="#10b981">Calibrated T_1=0.58 (TPR=80%)</text>

  <!-- Bottom Result Summary -->
  <rect x="150" y="420" width="600" height="55" class="box-hi" />
  <text x="450" y="445" class="text-title" fill="#10b981">Equal Opportunity Achieved: TPR(A=0) == TPR(A=1) == 80%</text>
  <text x="450" y="465" class="text-sub">Qualified candidates receive equal approval rates regardless of group membership.</text>
</svg>
