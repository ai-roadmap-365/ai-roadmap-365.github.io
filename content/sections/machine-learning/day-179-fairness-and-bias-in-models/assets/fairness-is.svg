<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>What fairness measurement is</title>
  <style>
    .fairness-is-bg   { fill: #f8fafc; }
    .fairness-is-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-is-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-is-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-is-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-is-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fairness-is-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fairness-is-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fairness-is-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fairness-is-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fairness-is-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fairness-is-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fairness-is-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .fairness-is-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .fairness-is-stage { opacity: 1; }

    .fairness-is-s0 { animation-delay: 0.00s; }
    .fairness-is-e0 { animation-delay: 0.00s; }
    .fairness-is-s1 { animation-delay: 1.28s; }
    .fairness-is-e1 { animation-delay: 1.28s; }
    .fairness-is-s2 { animation-delay: 2.56s; }
    .fairness-is-e2 { animation-delay: 2.56s; }
    .fairness-is-s3 { animation-delay: 3.84s; }
    .fairness-is-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .fairness-is-conn  { animation: fairness-is-trace 6.4s ease-in-out infinite; }
      .fairness-is-stage { animation: fairness-is-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes fairness-is-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes fairness-is-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .fairness-is-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .fairness-is-stage { animation: fairness-is-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes fairness-is-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="fairness-is-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="fairness-is-bg" width="980" height="322"/>
  <text class="fairness-is-h1"  x="30" y="40">What fairness measurement is</text>
  <text class="fairness-is-sub" x="30" y="64">Four properties.</text>
  <g class="fairness-is-stage fairness-is-s0">
    <rect class="fairness-is-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-is-step" x="44" y="142">01</text>
    <text class="fairness-is-name" x="70" y="142">A comparison of model behaviour across groups</text>
    <text class="fairness-is-desc" x="44" y="166">Not a property of a single</text>
    <text class="fairness-is-desc" x="44" y="182">prediction.</text>
  </g>
  <line class="fairness-is-line fairness-is-conn fairness-is-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#fairness-is-tip)"/>
  <g class="fairness-is-stage fairness-is-s1">
    <rect class="fairness-is-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-is-step" x="280" y="142">02</text>
    <text class="fairness-is-name" x="306" y="142">Against a chosen criterion</text>
    <text class="fairness-is-desc" x="280" y="166">Which cannot be derived from the</text>
    <text class="fairness-is-desc" x="280" y="182">data.</text>
  </g>
  <line class="fairness-is-line fairness-is-conn fairness-is-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#fairness-is-tip)"/>
  <g class="fairness-is-stage fairness-is-s2">
    <rect class="fairness-is-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-is-step" x="516" y="142">03</text>
    <text class="fairness-is-name" x="542" y="142">Usually trading against another criterion</text>
    <text class="fairness-is-desc" x="516" y="166">And sometimes against accuracy.</text>
  </g>
  <line class="fairness-is-line fairness-is-conn fairness-is-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#fairness-is-tip)"/>
  <g class="fairness-is-stage fairness-is-s3">
    <rect class="fairness-is-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="fairness-is-step" x="752" y="142">04</text>
    <text class="fairness-is-name" x="778" y="142">And stated explicitly in the model documentation</text>
    <text class="fairness-is-desc" x="752" y="166">So the choice is auditable.</text>
  </g>
  <text class="fairness-is-sub" x="30" y="304">Recording which criterion was chosen and why is what makes a fairness claim defensible, since an unstated criterion cannot be evaluated by anyone else.</text>
</svg>
