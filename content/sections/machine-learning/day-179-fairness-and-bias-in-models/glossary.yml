terms:
  - term: 'Demographic Parity'
    definition: 'A fairness metric requiring the positive prediction rate to be equal across all protected demographic groups.'
  - term: 'Disparate Impact Ratio'
    definition: 'The ratio of the positive selection rate of the unprivileged group to the privileged group (4/5ths or 80% rule threshold).'
  - term: 'Equal Opportunity'
    definition: 'A fairness criterion requiring the True Positive Rate (Recall) to be equal across all protected groups for favorable outcomes.'
  - term: 'Equalized Odds'
    definition: 'A fairness criterion requiring both True Positive Rate and False Positive Rate to be equal across all protected groups.'
  - term: 'Impossibility Theorem of Fairness'
    definition: 'Mathematical proof that Demographic Parity, Equalized Odds, and Predictive Parity cannot simultaneously hold when base rates differ across groups.'
  - term: 'Sample Reweighing'
    definition: 'A pre-processing mitigation technique assigning sample weights inversely proportional to demographic group-outcome co-occurrences.'
  - term: 'Group-Specific Threshold Calibration'
    definition: 'A post-processing technique selecting different decision thresholds per demographic group to enforce Equal Opportunity.'
  - term: 'Proxy Feature'
    definition: 'An unprotected feature that correlates strongly with a protected attribute (e.g. zip code with race).'
