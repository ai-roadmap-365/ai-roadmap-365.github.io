visuals:
  - id: fairness-criteria-tradeoff
    file: assets/fairness-criteria-tradeoff.svg
    type: diagram
    title: 'The Impossibility Theorem of Algorithmic Fairness'
    alt: 'Diagram showing the mathematical impossibility triangle between Demographic Parity, Equalized Odds, and Predictive Parity.'
    description: 'A static diagram illustrating Kleinberg and Chouldechovas impossibility theorem proving mutual incompatibility among fairness criteria when base rates differ.'
  - id: group-threshold-calibration-flow
    file: assets/group-threshold-calibration-flow.svg
    type: flow-animated
    title: 'Post-Processing Group Threshold Calibration'
    alt: 'Animated flow chart demonstrating post-processing threshold calibration adjusting group cutoffs to equalize True Positive Rates.'
    description: 'An animated flow chart showing how shifting group-specific decision thresholds T_0 and T_1 establishes Equal Opportunity across unprivileged and privileged groups.'
  - id: fairness-idea
    file: assets/fairness-idea.svg
    type: diagram
    title: 'Why fairness needs defining'
    alt: 'Diagram: why algorithmic fairness requires an explicit definition'
    description: 'A four-stage description of the fairness problem covering the intuition, the competing formalisations, the incompatibility and the requirement.'
  - id: parity-opportunity
    file: assets/parity-opportunity.svg
    type: diagram
    title: 'Three fairness definitions'
    alt: 'Diagram: three formal definitions of algorithmic fairness compared'
    description: 'A two-column comparison of fairness definitions against what each requires.'
  - id: impossibility
    file: assets/impossibility.svg
    type: diagram
    title: 'The impossibility result'
    alt: 'Diagram: why the main fairness criteria cannot be satisfied simultaneously'
    description: 'A four-stage description of the impossibility result covering the criteria, the base rate condition, the incompatibility and the consequence.'
  - id: debiasing
    file: assets/debiasing.svg
    type: diagram
    title: 'Three intervention points'
    alt: 'Diagram: the three stages at which fairness interventions can be applied'
    description: 'A three-stage description of debiasing interventions covering preprocessing, in-processing and post-processing.'
  - id: fairness-not
    file: assets/fairness-not.svg
    type: diagram
    title: 'What fairness work is not'
    alt: 'Diagram: four misconceptions about algorithmic fairness'
    description: 'A two-column comparison of misconceptions about fairness against what is true.'
  - id: fairness-history
    file: assets/fairness-history.svg
    type: diagram
    title: 'Four steps in algorithmic fairness'
    alt: 'Diagram: the historical progression of algorithmic fairness practice'
    description: 'A four-stage description of fairness history covering absence, documented harms, formal definitions and regulation.'
  - id: same-test
    file: assets/same-test.svg
    type: diagram
    title: 'The same test for everyone'
    alt: 'Diagram: identical treatment compared with equitable outcomes'
    description: 'A two-column comparison of identical treatment against equitable outcomes.'
  - id: fairness-implications
    file: assets/fairness-implications.svg
    type: diagram
    title: 'Four consequences of fairness work'
    alt: 'Diagram: the legal, measurement, trade-off and scope implications of fairness work'
    description: 'A four-stage description of fairness implications covering legal exposure, measurement requirements, accuracy trade-offs and system scope.'
  - id: fairness-when
    file: assets/fairness-when.svg
