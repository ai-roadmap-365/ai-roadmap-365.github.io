    title: 'Demographic parity'
    alt: 'Diagram: how demographic parity and disparate impact are measured'
    description: 'A four-stage description of demographic parity covering the selection rate, the ratio, the legal threshold and the limitation.'
  - id: predictive-parity
    file: assets/predictive-parity.svg
