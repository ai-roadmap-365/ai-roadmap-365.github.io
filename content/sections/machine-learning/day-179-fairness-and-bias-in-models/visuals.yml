    title: 'Predictive parity'
    alt: 'Diagram: how predictive parity and calibration are measured per group'
    description: 'A four-stage description of predictive parity covering the score, the per-group outcome rate, the comparison and the conflict.'
  - id: fairness-why
    file: assets/fairness-why.svg
    type: diagram
    title: 'What fairness work addresses'
    alt: 'Diagram: the four problems algorithmic fairness work addresses'
    description: 'A four-stage description of the problems addressed covering historical bias, proxies, scale and accountability.'
  - id: fairness-is
    file: assets/fairness-is.svg
