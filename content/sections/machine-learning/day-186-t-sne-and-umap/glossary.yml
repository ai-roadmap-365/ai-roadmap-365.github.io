terms:
  - term: 't-SNE'
    definition: 't-Distributed Stochastic Neighbor Embedding: a non-linear probabilistic technique for embedding high-dimensional data in 2D or 3D.'
  - term: 'UMAP'
    definition: 'Uniform Manifold Approximation and Projection: a dimension reduction technique founded on Riemannian geometry and algebraic topology.'
  - term: 'Perplexity'
    definition: 'A hyperparameter in t-SNE controlling the effective number of nearest neighbors considered when building Gaussian affinity distributions.'
  - term: 'The Crowding Problem'
    definition: 'The mismatch in geometric volume between high and low dimensions that causes moderate-distance points to collapse into a crowded center.'
  - term: 'Student-t Distribution'
    definition: 'A heavy-tailed probability distribution (Cauchy distribution with 1 dof) used by t-SNE in the embedding space to alleviate crowding.'
  - term: 'KL Divergence'
    definition: 'Kullback-Leibler divergence: a non-symmetric statistical measure of the difference between high-dimensional and low-dimensional probability distributions.'
  - term: 'Early Exaggeration'
    definition: 'An optimization heuristic scaling high-dimensional joint probabilities during initial iterations to encourage cluster separation.'
  - term: 'Fuzzy Simplicial Set'
    definition: 'A topological representation of data used by UMAP to model local metric spaces and fuzzy neighborhood connectivity.'
