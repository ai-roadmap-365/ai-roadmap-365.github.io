<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The manifold approach</title>
  <style>
    .umap-theory-bg   { fill: #f8fafc; }
    .umap-theory-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .umap-theory-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .umap-theory-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .umap-theory-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .umap-theory-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .umap-theory-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .umap-theory-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .umap-theory-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .umap-theory-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .umap-theory-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .umap-theory-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .umap-theory-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .umap-theory-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .umap-theory-stage { opacity: 1; }

    .umap-theory-s0 { animation-delay: 0.00s; }
    .umap-theory-e0 { animation-delay: 0.00s; }
    .umap-theory-s1 { animation-delay: 1.28s; }
    .umap-theory-e1 { animation-delay: 1.28s; }
    .umap-theory-s2 { animation-delay: 2.56s; }
    .umap-theory-e2 { animation-delay: 2.56s; }
    .umap-theory-s3 { animation-delay: 3.84s; }
    .umap-theory-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .umap-theory-conn  { animation: umap-theory-trace 6.4s ease-in-out infinite; }
      .umap-theory-stage { animation: umap-theory-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes umap-theory-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes umap-theory-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .umap-theory-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .umap-theory-stage { animation: umap-theory-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes umap-theory-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="umap-theory-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="umap-theory-bg" width="980" height="322"/>
  <text class="umap-theory-h1"  x="30" y="40">The manifold approach</text>
  <text class="umap-theory-sub" x="30" y="64">Four steps.</text>
  <g class="umap-theory-stage umap-theory-s0">
    <rect class="umap-theory-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="umap-theory-step" x="44" y="142">01</text>
    <text class="umap-theory-name" x="70" y="142">Assume the data lies on a manifold</text>
    <text class="umap-theory-desc" x="44" y="166">Locally flat, globally curved.</text>
  </g>
  <line class="umap-theory-line umap-theory-conn umap-theory-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#umap-theory-tip)"/>
  <g class="umap-theory-stage umap-theory-s1">
    <rect class="umap-theory-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="umap-theory-step" x="280" y="142">02</text>
    <text class="umap-theory-name" x="306" y="142">Estimate a local distance scale per point</text>
    <text class="umap-theory-desc" x="280" y="166">Which handles varying density.</text>
  </g>
  <line class="umap-theory-line umap-theory-conn umap-theory-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#umap-theory-tip)"/>
  <g class="umap-theory-stage umap-theory-s2">
    <rect class="umap-theory-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="umap-theory-step" x="516" y="142">03</text>
    <text class="umap-theory-name" x="542" y="142">Build a weighted neighbour graph</text>
    <text class="umap-theory-desc" x="516" y="166">Then lay it out in two</text>
    <text class="umap-theory-desc" x="516" y="182">dimensions by attraction and</text>
    <text class="umap-theory-desc" x="516" y="198">repulsion.</text>
  </g>
  <line class="umap-theory-line umap-theory-conn umap-theory-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#umap-theory-tip)"/>
  <g class="umap-theory-stage umap-theory-s3">
    <rect class="umap-theory-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="umap-theory-step" x="752" y="142">04</text>
    <text class="umap-theory-name" x="778" y="142">Which is faster and retains more global structure</text>
    <text class="umap-theory-desc" x="752" y="166">Though still not enough to read</text>
    <text class="umap-theory-desc" x="752" y="182">distances from.</text>
  </g>
  <text class="umap-theory-sub" x="30" y="304">Retaining more global structure than the alternative is a relative claim rather than a licence: distances in the output are still not trustworthy.</text>
</svg>
