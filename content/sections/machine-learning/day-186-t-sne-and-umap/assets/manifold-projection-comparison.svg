<svg role="img" aria-label="Two panel projection comparison contrasting t SNE local cluster separation against UMAP preserved global topology trajectories" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Non-Linear Manifold Projection Comparison: t-SNE vs UMAP</title>
  <defs>
    <linearGradient id="bg186b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panelCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg186b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MANIFOLD PROJECTION COMPARISON: t-SNE VS UMAP</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Local Neighborhood Preservation (t-SNE) vs Riemannian Metric Topology (UMAP)</text>
  <g transform="translate(50, 85)">
    <rect width="355" height="295" fill="url(#panelCard)" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <text x="177" y="25" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">1. t-SNE (KL Divergence)</text>
    <circle cx="100" cy="110" r="28" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6"/>
    <circle cx="250" cy="120" r="24" fill="#10b981" fill-opacity="0.3" stroke="#10b981"/>
    <circle cx="170" cy="220" r="32" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b"/>
    <text x="177" y="275" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Tight isolated clusters | Global distances arbitrary</text>
  </g>
  <g transform="translate(445, 85)">
    <rect width="355" height="295" fill="url(#panelCard)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="177" y="25" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">2. UMAP (Fuzzy Simplicial Set)</text>
    <path d="M 80 110 Q 170 160 270 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="80" cy="110" r="24" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6"/>
    <circle cx="270" cy="120" r="20" fill="#10b981" fill-opacity="0.3" stroke="#10b981"/>
    <circle cx="170" cy="215" r="28" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b"/>
    <text x="177" y="275" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Preserves continuous trajectories &amp; global structure</text>
  </g>
</svg>
