<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward local fidelity.">
  <title>Four steps in visualising high dimensions</title>
  <style>
    .embedding-history-bg   { fill: #f8fafc; }
    .embedding-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .embedding-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .embedding-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .embedding-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .embedding-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .embedding-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .embedding-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .embedding-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .embedding-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .embedding-history-stage { opacity: 1; }

    .embedding-history-s0 { animation-delay: 0.00s; }
    .embedding-history-e0 { animation-delay: 0.00s; }
    .embedding-history-s1 { animation-delay: 1.28s; }
    .embedding-history-e1 { animation-delay: 1.28s; }
    .embedding-history-s2 { animation-delay: 2.56s; }
    .embedding-history-e2 { animation-delay: 2.56s; }
    .embedding-history-s3 { animation-delay: 3.84s; }
    .embedding-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .embedding-history-conn  { animation: embedding-history-trace 6.4s ease-in-out infinite; }
      .embedding-history-stage { animation: embedding-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes embedding-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes embedding-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .embedding-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .embedding-history-stage { animation: embedding-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes embedding-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="embedding-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="embedding-history-bg" width="980" height="322"/>
  <text class="embedding-history-h1"  x="30" y="40">Four steps in visualising high dimensions</text>
  <text class="embedding-history-sub" x="30" y="64">Toward local fidelity.</text>
  <g class="embedding-history-stage embedding-history-s0">
    <rect class="embedding-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-history-step" x="44" y="142">01</text>
    <text class="embedding-history-name" x="70" y="142">Linear projection</text>
    <text class="embedding-history-desc" x="44" y="166">Fast, and unable to unfold</text>
    <text class="embedding-history-desc" x="44" y="182">curved structure.</text>
  </g>
  <line class="embedding-history-line embedding-history-conn embedding-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#embedding-history-tip)"/>
  <g class="embedding-history-stage embedding-history-s1">
    <rect class="embedding-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-history-step" x="280" y="142">02</text>
    <text class="embedding-history-name" x="306" y="142">Multidimensional scaling preserved all distances</text>
    <text class="embedding-history-desc" x="280" y="166">Which crowds badly in two</text>
    <text class="embedding-history-desc" x="280" y="182">dimensions.</text>
  </g>
  <line class="embedding-history-line embedding-history-conn embedding-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#embedding-history-tip)"/>
  <g class="embedding-history-stage embedding-history-s2">
    <rect class="embedding-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-history-step" x="516" y="142">03</text>
    <text class="embedding-history-name" x="542" y="142">Neighbour embedding preserved local structure instead</text>
    <text class="embedding-history-desc" x="516" y="166">Which produced far more legible</text>
    <text class="embedding-history-desc" x="516" y="182">pictures.</text>
  </g>
  <line class="embedding-history-line embedding-history-conn embedding-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#embedding-history-tip)"/>
  <g class="embedding-history-stage embedding-history-s3">
    <rect class="embedding-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="embedding-history-step" x="752" y="142">04</text>
    <text class="embedding-history-name" x="778" y="142">And manifold methods made it fast enough for millions of points</text>
    <text class="embedding-history-desc" x="752" y="166">Which is why every embedding</text>
    <text class="embedding-history-desc" x="752" y="182">plot now uses one.</text>
  </g>
  <text class="embedding-history-sub" x="30" y="304">The decisive move was giving up on global distances deliberately, which is why the resulting plots are legible and why their distances cannot be read.</text>
</svg>
