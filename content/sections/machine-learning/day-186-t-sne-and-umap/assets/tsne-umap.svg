<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Local structure, preserved.">
  <title>Two visualisation methods</title>
  <style>
    .tsne-umap-bg   { fill: #f8fafc; }
    .tsne-umap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-umap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-umap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-umap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-umap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tsne-umap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsne-umap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tsne-umap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tsne-umap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tsne-umap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tsne-umap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tsne-umap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tsne-umap-row { opacity: 1; }
    .tsne-umap-r0 { animation-delay: 0.00s; }
    .tsne-umap-r1 { animation-delay: 0.45s; }
    .tsne-umap-r2 { animation-delay: 0.90s; }
    .tsne-umap-r3 { animation-delay: 1.35s; }
    .tsne-umap-r4 { animation-delay: 1.80s; }
    .tsne-umap-row { animation: tsne-umap-reveal 7.3s ease-in-out infinite; }
    @keyframes tsne-umap-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tsne-umap-bg" width="980" height="390"/>
  <text class="tsne-umap-h1"  x="30" y="40">Two visualisation methods</text>
  <text class="tsne-umap-sub" x="30" y="64">Local structure, preserved.</text>
  <rect class="tsne-umap-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tsne-umap-name" x="46" y="122">Probabilistic neighbour embedding</text>
  <text class="tsne-umap-desc" x="46" y="142">Local, and slow.</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r0" x="46" y="182">Matches neighbour probabilities across dimensions</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r1" x="46" y="216">Preserves local structure well</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r2" x="46" y="250">Global distances are not meaningful</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r3" x="46" y="284">Slow on large datasets</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r4" x="46" y="318">Very sensitive to its perplexity setting</text>
  <rect class="tsne-umap-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tsne-umap-name" x="526" y="122">Manifold approximation</text>
  <text class="tsne-umap-desc" x="526" y="142">Local, and faster.</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r0" x="526" y="182">Builds a neighbour graph and lays it out</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r1" x="526" y="216">Preserves local structure comparably</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r2" x="526" y="250">Preserves global structure somewhat better</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r3" x="526" y="284">Much faster, and scales further</text>
  <text class="tsne-umap-desc tsne-umap-row tsne-umap-r4" x="526" y="318">Can transform new points</text>
  <text class="tsne-umap-sub" x="30" y="372">Being able to transform new points is a real practical difference: the first method must be refitted from scratch to place anything it has not already seen.</text>
</svg>
