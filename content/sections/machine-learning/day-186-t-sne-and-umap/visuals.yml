visuals:
  - id: tsne-student-t-crowding-geometry
    file: assets/tsne-student-t-crowding-geometry.svg
    type: diagram
    title: t-SNE Student-t Distribution and Crowding Resolution
    alt: Crowding problem illustration contrasting Gaussian high dimensional tails with Student t heavy low dimensional distribution tails
    description: Visualizing how the heavy Cauchy/Student-t distribution in embedding space prevents intermediate-distance sample points from collapsing into a dense sphere.
  - id: manifold-projection-comparison
    file: assets/manifold-projection-comparison.svg
    type: diagram
    title: Non-Linear Manifold Projection Comparison t-SNE vs UMAP
    alt: Two panel projection comparison contrasting t SNE local cluster separation against UMAP preserved global topology trajectories
    description: Side-by-side comparison of t-SNE pure local neighborhood clustering versus UMAP global trajectory preservation.
