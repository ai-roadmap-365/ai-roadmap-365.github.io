visuals:
  - id: tsne-student-t-crowding-geometry
    file: assets/tsne-student-t-crowding-geometry.svg
    type: diagram
    title: t-SNE Student-t Distribution and Crowding Resolution
    alt: Crowding problem illustration contrasting Gaussian high dimensional tails with Student t heavy low dimensional distribution tails
    description: Visualizing how the heavy Cauchy/Student-t distribution in embedding space prevents intermediate-distance sample points from collapsing into a dense sphere.
  - id: manifold-projection-comparison
    file: assets/manifold-projection-comparison.svg
    type: diagram
    title: Non-Linear Manifold Projection Comparison t-SNE vs UMAP
    alt: Two panel projection comparison contrasting t SNE local cluster separation against UMAP preserved global topology trajectories
    description: Side-by-side comparison of t-SNE pure local neighborhood clustering versus UMAP global trajectory preservation.
  - id: tsne-umap
    file: assets/tsne-umap.svg
    type: diagram
    title: 'Two visualisation methods'
    alt: 'Diagram: two non-linear dimensionality reduction methods compared'
    description: 'A two-column comparison of the two common embedding visualisation methods.'
  - id: affinities
    file: assets/affinities.svg
    type: diagram
    title: 'Neighbour probabilities'
    alt: 'Diagram: how neighbour relationships are converted into probabilities'
    description: 'A four-stage description of affinity computation covering distances, the kernel, normalisation and perplexity.'
  - id: crowding
    file: assets/crowding.svg
    type: diagram
    title: 'The crowding problem'
    alt: 'Diagram: why a heavy-tailed distribution is used in the low-dimensional space'
    description: 'A four-stage description of the crowding problem covering the volume mismatch, the crowding, the heavy tail and the effect.'
  - id: kl-objective
    file: assets/kl-objective.svg
    type: diagram
    title: 'The objective'
    alt: 'Diagram: the asymmetric objective that shapes the embedding'
    description: 'A four-stage description of the divergence objective covering the comparison, the asymmetry, the consequence and the optimisation.'
  - id: umap-theory
    file: assets/umap-theory.svg
    type: diagram
    title: 'The manifold approach'
    alt: 'Diagram: how manifold approximation builds and lays out a neighbour graph'
    description: 'A four-stage description of manifold approximation covering the local metric, the graph, the layout and the advantages.'
  - id: tsne-not
    file: assets/tsne-not.svg
    type: diagram
    title: 'What these methods are not'
    alt: 'Diagram: four misconceptions about embedding visualisation methods'
    description: 'A two-column comparison of misconceptions about visualisation methods against what is true.'
  - id: embedding-history
    file: assets/embedding-history.svg
    type: diagram
    title: 'Four steps in visualising high dimensions'
    alt: 'Diagram: the historical progression of high-dimensional visualisation methods'
    description: 'A four-stage description of visualisation history covering linear projection, multidimensional scaling, neighbour embedding and manifold methods.'
  - id: map-projection
