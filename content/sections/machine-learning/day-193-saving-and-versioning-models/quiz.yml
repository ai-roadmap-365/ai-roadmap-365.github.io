questions:
  - question: 'Why is loading unvetted model files using Python standard pickle.load() a critical cybersecurity vulnerability (CWE-502)?'
    options:
      - 'Pickle cannot save scikit-learn models'
      - 'Pickle takes too much disk space'
      - 'Unpickling can execute arbitrary code during loading'
      - 'Pickle only works on Linux'
    answer_index: 2
    explanation: 'Pickle files can execute arbitrary Python commands during deserialization via the __reduce__ method, allowing attackers to gain remote code execution.'
  - question: 'What is the primary architectural advantage of the ONNX (Open Neural Network Exchange) format over joblib?'
    options:
      - 'ONNX guarantees 100% training accuracy'
      - 'ONNX automatically optimizes SQL databases'
      - 'ONNX models do not require any disk storage'
      - 'ONNX runs as a graph in native runtimes, without Python'
    answer_index: 3
    explanation: 'ONNX decouples models from Python, allowing high-performance, sub-millisecond C++ inference engines (ONNX Runtime, Triton) to serve predictions securely.'
  - question: 'Why are Safetensors (developed by HuggingFace) replacing PyTorch pickle-based .pt checkpoints?'
    options:
      - 'Raw tensors plus a JSON header — no code, and mmap-loaded'
      - 'Safetensors reduce model weights by 99%'
      - 'Safetensors do not require floating point numbers at all'
      - 'Safetensors are written in assembly code'
    answer_index: 0
    explanation: 'Safetensors eliminates code execution vulnerabilities completely while allowing zero-copy memory mapping directly from disk to GPU memory.'
  - question: 'What does a Cryptographic SHA-256 Hash guarantee when stored in an enterprise Model Registry?'
    options:
      - 'That the model is trained with 256 gradient steps'
      - 'That the deployed artifact matches the validated one exactly'
      - 'That the training data is encrypted with AES-256'
      - 'That the model latency is always less than 256 microseconds'
    answer_index: 1
    explanation: 'A SHA-256 checksum provides cryptographic proof that model files have not been modified, corrupted, or tampered with in storage buckets.'
  - question: 'Under Semantic Versioning (MAJOR.MINOR.PATCH) for machine learning models, when should the MAJOR version number be incremented?'
    options:
      - 'Whenever a typo is fixed in the documentation'
      - 'Every time the model is retrained on fresh weekly data'
      - 'When the input schema or prediction format breaks'
      - 'When the training loss decreases by 0.1%'
    answer_index: 2
    explanation: 'MAJOR version increments indicate breaking interface contracts (input/output schema changes) that require upstream API clients to modify their request payloads.'
