terms:
  - term: 'Model Serialization'
    definition: 'The process of converting an in-memory trained model object into a persistent byte stream or file for storage and serving.'
  - term: 'Model Registry'
    definition: 'A centralized catalog storing versioned model artifacts, cryptographic hashes, metadata, and lifecycle stages.'
  - term: 'Pickle Vulnerability'
    definition: 'A critical security flaw where unpickling untrusted files allows arbitrary code execution via Python object reconstruction.'
  - term: 'ONNX'
    definition: 'Open Neural Network Exchange: a cross-platform, open format for executing machine learning models across heterogeneous hardware.'
  - term: 'Safetensors'
    definition: 'A safe, zero-copy serialization format for deep learning tensors that prohibits executable code.'
  - term: 'Semantic Versioning (SemVer)'
    definition: 'A versioning convention (MAJOR.MINOR.PATCH) communicating breaking schema changes, retraining updates, and hotfixes.'
  - term: 'Schema Contract'
    definition: 'A strict specification defining the expected feature names, data types, and value constraints required by a model.'
  - term: 'Provenance / Lineage'
    definition: 'The complete historical audit trail linking a model artifact to its training dataset, code commit SHA, and hyperparameters.'
