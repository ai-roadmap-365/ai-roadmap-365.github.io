<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What versioning is not</title>
  <style>
    .versioning-not-bg   { fill: #f8fafc; }
    .versioning-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .versioning-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .versioning-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .versioning-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .versioning-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .versioning-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-not-row { opacity: 1; }
    .versioning-not-r0 { animation-delay: 0.00s; }
    .versioning-not-r1 { animation-delay: 0.45s; }
    .versioning-not-r2 { animation-delay: 0.90s; }
    .versioning-not-r3 { animation-delay: 1.35s; }
    .versioning-not-r4 { animation-delay: 1.80s; }
    .versioning-not-row { animation: versioning-not-reveal 7.3s ease-in-out infinite; }
    @keyframes versioning-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="versioning-not-bg" width="980" height="390"/>
  <text class="versioning-not-h1"  x="30" y="40">What versioning is not</text>
  <text class="versioning-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="versioning-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="versioning-not-name" x="46" y="122">The misconception</text>
  <text class="versioning-not-desc" x="46" y="142">Commonly held.</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r0" x="46" y="182">Saving the model file is enough</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r1" x="46" y="216">A filename with a date is versioning</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r2" x="46" y="250">Any format will do</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r3" x="46" y="284">The environment is incidental</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r4" x="46" y="318">It is an operations concern</text>
  <rect class="versioning-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="versioning-not-name" x="526" y="122">What is true</text>
  <text class="versioning-not-desc" x="526" y="142">Actually.</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r0" x="526" y="182">Preprocessing, data and environment travel with it</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r1" x="526" y="216">You need the data and code versions too</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r2" x="526" y="250">Format is a security and portability decision</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r3" x="526" y="284">A library upgrade changes results</text>
  <text class="versioning-not-desc versioning-not-row versioning-not-r4" x="526" y="318">It is what makes the work reproducible</text>
  <text class="versioning-not-sub" x="30" y="372">The library-upgrade point is the one that catches teams: a minor version bump in a dependency can change predictions, and without pinning nobody can tell when.</text>
</svg>
