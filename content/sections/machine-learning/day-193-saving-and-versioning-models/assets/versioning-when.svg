<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to consequence.">
  <title>How much versioning</title>
  <style>
    .versioning-when-bg   { fill: #f8fafc; }
    .versioning-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .versioning-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .versioning-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .versioning-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .versioning-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .versioning-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .versioning-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .versioning-when-row { opacity: 1; }
    .versioning-when-r0 { animation-delay: 0.00s; }
    .versioning-when-r1 { animation-delay: 0.45s; }
    .versioning-when-r2 { animation-delay: 0.90s; }
    .versioning-when-r3 { animation-delay: 1.35s; }
    .versioning-when-r4 { animation-delay: 1.80s; }
    .versioning-when-row { animation: versioning-when-reveal 7.3s ease-in-out infinite; }
    @keyframes versioning-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="versioning-when-bg" width="980" height="390"/>
  <text class="versioning-when-h1"  x="30" y="40">How much versioning</text>
  <text class="versioning-when-sub" x="30" y="64">Scaled to consequence.</text>
  <rect class="versioning-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="versioning-when-name" x="46" y="122">Full discipline</text>
  <text class="versioning-when-desc" x="46" y="142">Four cases.</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r0" x="46" y="182">Anything in production</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r1" x="46" y="216">Regulated or audited work</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r2" x="46" y="250">Models that outlive their authors</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r3" x="46" y="284">Where decisions must be explained later</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r4" x="46" y="318">Where rollback must be possible</text>
  <rect class="versioning-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="versioning-when-name" x="526" y="122">Lighter</text>
  <text class="versioning-when-desc" x="526" y="142">Also four.</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r0" x="526" y="182">Throwaway exploration</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r1" x="526" y="216">Teaching examples</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r2" x="526" y="250">Single-use analysis</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r3" x="526" y="284">Where nothing depends on the result</text>
  <text class="versioning-when-desc versioning-when-row versioning-when-r4" x="526" y="318">But pin the environment regardless</text>
  <text class="versioning-when-sub" x="30" y="372">Pinning the environment is the one habit worth keeping everywhere, because it costs a file and it is what makes any later reproduction possible at all.</text>
</svg>
