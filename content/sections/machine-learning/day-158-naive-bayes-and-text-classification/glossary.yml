terms:
  - term: 'Naive Bayes'
    definition: 'A family of generative probabilistic classifiers based on Bayes Theorem with the strong assumption of conditional feature independence given the class label.'
  - term: 'Conditional Independence'
    definition: 'A statistical property where two events or variables X and Y are independent given knowledge of a third variable Z: P(X, Y | Z) = P(X | Z) * P(Y | Z).'
  - term: 'Multinomial Naive Bayes'
    definition: 'A Naive Bayes variant tailored for discrete count data, commonly used for text classification with Bag-of-Words representations.'
  - term: 'Bernoulli Naive Bayes'
    definition: 'A Naive Bayes variant designed for binary boolean feature vectors, modeling both the presence and absence of features.'
  - term: 'Gaussian Naive Bayes'
    definition: 'A Naive Bayes variant for continuous real-valued features, assuming features within each class follow independent normal distributions.'
  - term: 'Laplace Smoothing (Additive Smoothing)'
    definition: 'A technique to smooth categorical probabilities by adding a pseudocount alpha to observed counts, preventing zero-frequency probability failures.'
  - term: 'Bag-of-Words (BOW)'
    definition: 'A text representation model that simplifies a document to an unordered multiset of word counts, disregarding grammar and word order.'
  - term: 'TF-IDF'
    definition: 'Term Frequency-Inverse Document Frequency: a numerical statistic reflecting how important a word is to a document in a collection or corpus.'
  - term: 'Generative Classifier'
    definition: 'A classification model that learns the joint probability distribution P(x, y) of inputs and labels, modeling how data is generated.'
  - term: 'Log-Likelihood'
    definition: 'The natural logarithm of a likelihood function, transforming fragile multiplication of small probabilities into stable numerical addition.'
