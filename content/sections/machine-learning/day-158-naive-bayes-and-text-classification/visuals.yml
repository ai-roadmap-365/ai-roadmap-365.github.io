visuals:
  - id: naive-bayes-architecture
    file: assets/naive-bayes-architecture.svg
    type: diagram
    title: 'Naive Bayes Probabilistic Architecture and Factorization'
    alt: 'Diagram showing Bayes Theorem decomposing class posterior into prior P(y) and conditional word likelihoods P(w1|y) through P(wd|y) under the conditional independence assumption.'
    description: 'A static architecture diagram illustrating the Bayesian probability graph: class node y generating independent feature nodes x1, x2, ..., xd, transformed into additive log-space inference.'
  - id: text-classification-pipeline
    file: assets/text-classification-pipeline.svg
    type: flow-animated
    title: 'End-to-End Text Classification Pipeline'
    alt: 'Animated diagram showing raw text intake, regex tokenization, vocabulary mapping, Bag-of-Words count matrix construction, and log-sum Naive Bayes spam/ham classification.'
    description: 'An animated flow diagram tracing a raw email message through cleaning, tokenization, count vectorization, and Laplace-smoothed Naive Bayes scoring with reduced-motion fallback.'
