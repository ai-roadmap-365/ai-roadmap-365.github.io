visuals:
  - id: naive-bayes-architecture
    file: assets/naive-bayes-architecture.svg
    type: diagram
    title: 'Naive Bayes Probabilistic Architecture and Factorization'
    alt: 'Diagram showing Bayes Theorem decomposing class posterior into prior P(y) and conditional word likelihoods P(w1|y) through P(wd|y) under the conditional independence assumption.'
    description: 'A static architecture diagram illustrating the Bayesian probability graph: class node y generating independent feature nodes x1, x2, ..., xd, transformed into additive log-space inference.'
  - id: text-classification-pipeline
    file: assets/text-classification-pipeline.svg
    type: flow-animated
    title: 'End-to-End Text Classification Pipeline'
    alt: 'Animated diagram showing raw text intake, regex tokenization, vocabulary mapping, Bag-of-Words count matrix construction, and log-sum Naive Bayes spam/ham classification.'
    description: 'An animated flow diagram tracing a raw email message through cleaning, tokenization, count vectorization, and Laplace-smoothed Naive Bayes scoring with reduced-motion fallback.'
  - id: nb-idea
    file: assets/nb-idea.svg
    type: diagram
    title: 'Naive Bayes in four steps'
    alt: 'Diagram: the four steps of naive Bayes classification'
    description: 'A four-stage description of naive Bayes covering class priors, per-feature likelihoods, the independence assumption and the combination.'
  - id: bayes-theorem
    file: assets/bayes-theorem.svg
    type: diagram
    title: 'Bayes'' theorem, applied'
    alt: 'Diagram: how Bayes'' theorem is applied to classification'
    description: 'A four-stage description of Bayesian classification covering the question, the inversion, the terms and the simplification.'
  - id: independence
    file: assets/independence.svg
    type: diagram
    title: 'The naive assumption'
    alt: 'Diagram: why the independence assumption is false and works regardless'
    description: 'A four-stage description of the independence assumption covering the joint problem, the assumption, its falsity and why it still classifies well.'
  - id: log-space
    file: assets/log-space.svg
    type: diagram
    title: 'Working in log space'
    alt: 'Diagram: why naive Bayes is computed with logarithms'
    description: 'A four-stage description of log-space computation covering the product, underflow, the log transform and the addition.'
  - id: multinomial-nb
    file: assets/multinomial-nb.svg
    type: diagram
    title: 'Naive Bayes for text'
    alt: 'Diagram: how naive Bayes classifies text using word counts'
    description: 'A four-stage description of multinomial naive Bayes covering tokenisation, counting, smoothing and scoring.'
  - id: nb-variants
    file: assets/nb-variants.svg
    type: diagram
    title: 'Three variants'
    alt: 'Diagram: three naive Bayes variants by feature type'
    description: 'A two-column comparison of naive Bayes variants by the type of feature they model.'
  - id: nb-vs-logreg
    file: assets/nb-vs-logreg.svg
    type: diagram
    title: 'Naive Bayes against logistic regression'
    alt: 'Diagram: generative classification compared with discriminative classification'
    description: 'A two-column comparison of naive Bayes against logistic regression.'
  - id: nb-history
    file: assets/nb-history.svg
    type: diagram
    title: 'Four steps for naive Bayes'
    alt: 'Diagram: the historical progression of naive Bayes classification'
    description: 'A four-stage description of naive Bayes history covering the early formulation, theoretical dismissal, spam filtering success and its role as a baseline.'
  - id: nb-implications
    file: assets/nb-implications.svg
    type: diagram
    title: 'What naive Bayes costs'
    alt: 'Diagram: the speed, calibration, data-efficiency and correlation implications of naive Bayes'
    description: 'A two-column comparison of naive Bayes strengths against its weaknesses.'
  - id: nb-when
    file: assets/nb-when.svg
    type: diagram
    title: 'When to use naive Bayes'
    alt: 'Diagram: when naive Bayes is the right choice'
    description: 'A two-column comparison of situations favouring naive Bayes against alternatives.'
  - id: nb-analogy-detail
    file: assets/nb-analogy-detail.svg
    type: diagram
    title: 'Weighing independent testimony'
    alt: 'Diagram: combining independent evidence compared with combining correlated evidence'
    description: 'A four-stage description of evidence combination covering independent witnesses, accumulation, correlated witnesses and overconfidence.'
  - id: nb-not
    file: assets/nb-not.svg
    type: diagram
    title: 'What naive Bayes is not'
    alt: 'Diagram: three misconceptions about naive Bayes'
    description: 'A two-column comparison of misconceptions about naive Bayes against what is true.'
  - id: nb-why
    file: assets/nb-why.svg
    type: diagram
    title: 'What naive Bayes solved'
    alt: 'Diagram: the four problems naive Bayes was created to solve'
    description: 'A four-stage description of the problems naive Bayes addresses covering the joint distribution, data scarcity, speed and incremental updates.'
