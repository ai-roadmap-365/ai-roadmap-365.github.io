questions:
  - question: 'What is the core "naive" assumption made by the Naive Bayes classification family?'
    options:
      - 'All features are conditionally independent given the class label: P(x_1, ..., x_d | y) = prod P(x_j | y)'
      - 'All features follow a standard normal Gaussian distribution'
      - 'All classes have equal prior probabilities P(y) = 1/K'
      - 'The dataset has zero measurement noise'
    answer_index: 0
    explanation: 'The fundamental simplifying assumption is that feature variables x_i and x_j are mutually independent conditioned on class y, allowing the high-dimensional joint likelihood to factorize into a simple product of 1D marginal likelihoods.'

  - question: 'What is the "Zero-Frequency Problem" in Naive Bayes, and how is it resolved?'
    options:
      - 'If a word never appeared in class c during training, P(word | c) = 0, which multiplies the entire document joint probability to 0; it is resolved using Laplace (additive) smoothing'
      - 'Features with zero variance cause division by zero; it is resolved by dropping the column'
      - 'Log of zero produces NaN; it is resolved by replacing NaN with 1.0'
      - 'Classes with zero samples crash gradient descent'
    answer_index: 0
    explanation: 'Without smoothing, an unseen token yields P(token|c)=0, annihilating all other word evidence in the product. Additive Laplace smoothing adds alpha to the numerator and alpha*V to the denominator.'

  - question: 'Why do we compute Naive Bayes inference in log-space: log P(y) + sum x_j * log P(x_j | y)?'
    options:
      - 'Multiplying dozens or hundreds of small probabilities (e.g. 0.001^100) causes floating-point numerical underflow to 0.0; log-space transforms multiplication into stable addition'
      - 'Logarithms make non-linear decision boundaries straight'
      - 'Logarithms are required by Scikit-Learn APIs'
      - 'Logarithms normalize the probabilities so they sum to 1'
    answer_index: 0
    explanation: 'In 64-bit floating point, multiplying many fractional probabilities quickly exceeds the minimum exponent limit (~10^-308), causing fatal underflow. Logarithms map products into well-behaved additions.'

  - question: 'Which Naive Bayes variant is specifically designed for discrete word frequency count vectors (Bag-of-Words)?'
    options:
      - 'Multinomial Naive Bayes (MultinomialNB)'
      - 'Gaussian Naive Bayes (GaussianNB)'
      - 'Bernoulli Naive Bayes (BernoulliNB)'
      - 'Categorical Naive Bayes'
    answer_index: 0
    explanation: 'MultinomialNB models the multinomial distribution of word token counts generated in text documents.'

  - question: 'How does Bernoulli Naive Bayes differ from Multinomial Naive Bayes?'
    options:
      - 'BernoulliNB operates on binary presence/absence indicator vectors x_j in {0, 1} and explicitly penalizes the absence of words, whereas MultinomialNB operates on frequency counts'
      - 'BernoulliNB is a regression model'
      - 'BernoulliNB does not use Bayes theorem'
      - 'BernoulliNB only supports 2 classes'
    answer_index: 0
    explanation: 'BernoulliNB models binary word presence and includes terms for both word presence P(w|c) and word absence (1 - P(w|c)), whereas MultinomialNB models total token occurrences.'

  - question: 'How does Gaussian Naive Bayes estimate conditional probabilities for continuous numerical features?'
    options:
      - 'It computes the empirical mean mu_{cj} and variance sigma_{cj}^2 for each feature within each class and evaluates the Gaussian probability density function'
      - 'It discretizes continuous values into 10 bins'
      - 'It computes Euclidean distance to the class centroid'
      - 'It fits a polynomial curve'
    answer_index: 0
    explanation: 'GaussianNB assumes that continuous features within each class follow a 1D normal distribution characterized by sample mean and sample variance.'

  - question: 'What is the fundamental theoretical difference between a Generative classifier (like Naive Bayes) and a Discriminative classifier (like Logistic Regression)?'
    options:
      - 'Generative models learn the joint probability P(x, y) = P(y)P(x|y) and model how the data was generated; Discriminative models learn the conditional boundary P(y|x) directly'
      - 'Generative models only work on text, while discriminative models only work on numbers'
      - 'Generative models use gradient descent, while discriminative models use closed-form equations'
      - 'Discriminative models cannot predict probabilities'
    answer_index: 0
    explanation: 'Generative classifiers model the full joint distribution P(x, y) (allowing them to generate synthetic data or handle missing inputs), whereas discriminative classifiers optimize the posterior boundary P(y|x) directly.'

  - question: 'What happens to Laplace-smoothed word likelihood theta_{cj} as smoothing parameter alpha -> infinity?'
    options:
      - 'Every word receives a uniform probability theta_{cj} = 1 / V, completely ignoring empirical training counts'
      - 'The probabilities become zero'
      - 'The model overfits to the training data'
      - 'The vocabulary size shrinks to 1'
    answer_index: 0
    explanation: 'As alpha approaches infinity, (N_cj + alpha) / (N_c + alpha*V) approaches alpha / (alpha*V) = 1/V, producing a completely flat, uniform prior over all words.'
