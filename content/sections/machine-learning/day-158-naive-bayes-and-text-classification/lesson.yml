slug: naive-bayes-and-text-classification
title: Naive Bayes and Text Classification
section: machine-learning
subsection: core-concepts
week: 23
learning_promise: >-
  Master generative probabilistic classification using Bayes Theorem and conditional independence: how Multinomial,
  Bernoulli, and Gaussian Naive Bayes model text and tabular features, how Bag-of-Words vectorization and TF-IDF
  convert unstructured language into numerical tensors, why Laplace smoothing solves the zero-frequency problem,
  and why log-space computation is mandatory for numerical stability in NLP.
objectives:
  - 'Derive the Naive Bayes classification rule from Bayes Theorem and the conditional independence assumption'
  - 'Differentiate Multinomial, Bernoulli, and Gaussian Naive Bayes variants and their suitable feature modalities'
  - 'Implement a text tokenization, vocabulary mapping, and Bag-of-Words (BOW) feature extraction pipeline'
  - 'Explain the Zero-Frequency problem and implement additive Laplace smoothing'
  - 'Formulate inference in log-space to prevent floating-point numerical underflow'
  - 'Compare generative Naive Bayes classifiers with discriminative Logistic Regression models'
  - 'Construct an end-to-end spam vs ham email classification system'
  - 'Evaluate the limitations and failure modes of feature independence assumptions in real-world language'
prerequisites:
  - 'Day 115 -- Bayes Theorem, priors, likelihoods, and posteriors'
  - 'Day 155 -- Logistic regression and binary classification loss'
reading_time_minutes: 50
practical_time_minutes: 60
