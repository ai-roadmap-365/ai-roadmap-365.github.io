sources:
  - title: 'A Comparison of Event Models for Naive Bayes Text Classification'
    url: 'https://www.cs.cmu.edu/~knigam/papers/multinomial-aaaiws98.pdf'
    publisher: 'AAAI Workshop on Learning for Text Categorization (McCallum & Nigam)'
    accessed: '2026-08-29'
    year: 1998
    description: 'Foundational paper establishing the mathematical distinction between multi-variate Bernoulli and multinomial event models in text classification.'
  - title: 'Scikit-Learn User Guide: Naive Bayes'
    url: 'https://scikit-learn.org/stable/modules/naive_bayes.html'
    publisher: 'Scikit-Learn Developers'
    accessed: '2026-08-29'
    year: 2026
    description: 'Technical reference for GaussianNB, MultinomialNB, ComplementNB, and BernoulliNB implementations and smoothing parameter tuning.'
  - title: 'Speech and Language Processing (Chapter 4: Naive Bayes Classification and Sentiment)'
    url: 'https://web.stanford.edu/~jurafsky/slp3/'
    publisher: 'Stanford University (Jurafsky & Martin)'
    accessed: '2026-08-29'
    year: 2024
    description: 'Authoritative textbook chapter covering text tokenization, sentiment analysis, Laplace smoothing, and generative NLP modeling.'
