<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Naive Bayes Architecture">
  <title>Naive Bayes Probabilistic Architecture</title>
  <defs>
    <style>
      .d158a-bg { fill: #f8fafc; }
      .d158a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d158a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d158a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d158a-math { fill: #0f172a; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
      .d158a-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d158a-arr); fill: none; }
      .d158a-node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 20; }
      .d158a-prior { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 20; }
    </style>
    <marker id="d158a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d158a-bg" />

  <text x="40" y="45" class="d158a-header" font-size="22">Naive Bayes: Generative Factorization &amp; Independence</text>
  <text x="40" y="70" class="d158a-text">Decomposing high-dimensional joint likelihood into independent feature products</text>

  <!-- Panel 1: Generative Graph -->
  <rect x="40" y="100" width="410" height="340" class="d158a-card" />
  <text x="60" y="130" class="d158a-header" font-size="16" fill="#1e40af">1. Directed Graphical Model</text>

  <!-- Class Node (y) -->
  <rect x="185" y="160" width="120" height="45" class="d158a-prior" />
  <text x="215" y="188" class="d158a-math" fill="#991b1b">Class (y)</text>

  <!-- Feature Nodes -->
  <rect x="60" y="270" width="80" height="40" class="d158a-node" />
  <text x="85" y="295" class="d158a-math">x₁</text>

  <rect x="155" y="270" width="80" height="40" class="d158a-node" />
  <text x="180" y="295" class="d158a-math">x₂</text>

  <rect x="250" y="270" width="80" height="40" class="d158a-node" />
  <text x="275" y="295" class="d158a-math">x₃</text>

  <rect x="345" y="270" width="80" height="40" class="d158a-node" />
  <text x="370" y="295" class="d158a-math">x_d</text>

  <!-- Arrows from y to x_i -->
  <path d="M 210 205 L 110 270" class="d158a-arrow" />
  <path d="M 230 205 L 185 270" class="d158a-arrow" />
  <path d="M 260 205 L 285 270" class="d158a-arrow" />
  <path d="M 280 205 L 375 270" class="d158a-arrow" />

  <text x="60" y="355" class="d158a-text" font-weight="700">Conditional Independence Assumption:</text>
  <text x="60" y="380" class="d158a-math" font-size="12">P(x₁, ..., x_d | y) = ∏ P(x_j | y)</text>
  <text x="60" y="410" class="d158a-text" font-size="12" fill="#64748b">Features are conditionally uncoupled given class y</text>

  <!-- Panel 2: Log-Space Computation -->
  <rect x="470" y="100" width="390" height="340" class="d158a-card" />
  <text x="490" y="130" class="d158a-header" font-size="16" fill="#16a34a">2. Log-Space Scoring</text>

  <rect x="490" y="160" width="350" height="70" fill="#f0fdf4" stroke="#86efac" rx="6" />
  <text x="505" y="185" class="d158a-math" font-size="13">log P(y=c | x) = log P(y=c)</text>
  <text x="625" y="212" class="d158a-math" font-size="13">+ ∑ x_j · log θ_{c, j}</text>

  <text x="490" y="260" class="d158a-header" font-size="14" fill="#0f172a">Laplace (Additive) Smoothing:</text>
  <rect x="490" y="275" width="350" height="60" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="505" y="310" class="d158a-math" font-size="13">θ_{c, j} = (N_{c, j} + α) / (N_c + α·V)</text>

  <text x="490" y="370" class="d158a-text" font-weight="700">Benefits of Log-Space Formulation:</text>
  <text x="490" y="395" class="d158a-text" font-size="12">1. Prevents floating-point underflow on long texts.</text>
  <text x="490" y="415" class="d158a-text" font-size="12">2. Replaces slow products with fast BLAS dot products.</text>
</svg>
