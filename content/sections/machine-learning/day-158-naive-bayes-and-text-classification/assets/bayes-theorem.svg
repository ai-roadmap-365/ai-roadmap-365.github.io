<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Bayes' theorem, applied</title>
  <style>
    .bayes-theorem-bg   { fill: #f8fafc; }
    .bayes-theorem-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-theorem-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-theorem-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-theorem-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-theorem-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bayes-theorem-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bayes-theorem-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bayes-theorem-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bayes-theorem-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bayes-theorem-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bayes-theorem-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bayes-theorem-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bayes-theorem-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bayes-theorem-stage { opacity: 1; }

    .bayes-theorem-s0 { animation-delay: 0.00s; }
    .bayes-theorem-e0 { animation-delay: 0.00s; }
    .bayes-theorem-s1 { animation-delay: 1.28s; }
    .bayes-theorem-e1 { animation-delay: 1.28s; }
    .bayes-theorem-s2 { animation-delay: 2.56s; }
    .bayes-theorem-e2 { animation-delay: 2.56s; }
    .bayes-theorem-s3 { animation-delay: 3.84s; }
    .bayes-theorem-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bayes-theorem-conn  { animation: bayes-theorem-trace 6.4s ease-in-out infinite; }
      .bayes-theorem-stage { animation: bayes-theorem-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bayes-theorem-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bayes-theorem-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bayes-theorem-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bayes-theorem-stage { animation: bayes-theorem-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bayes-theorem-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bayes-theorem-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bayes-theorem-bg" width="980" height="322"/>
  <text class="bayes-theorem-h1"  x="30" y="40">Bayes' theorem, applied</text>
  <text class="bayes-theorem-sub" x="30" y="64">Four steps.</text>
  <g class="bayes-theorem-stage bayes-theorem-s0">
    <rect class="bayes-theorem-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-theorem-step" x="44" y="142">01</text>
    <text class="bayes-theorem-name" x="70" y="142">We want the probability of a class given the features</text>
    <text class="bayes-theorem-desc" x="44" y="166">Which we cannot count directly.</text>
  </g>
  <line class="bayes-theorem-line bayes-theorem-conn bayes-theorem-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bayes-theorem-tip)"/>
  <g class="bayes-theorem-stage bayes-theorem-s1">
    <rect class="bayes-theorem-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-theorem-step" x="280" y="142">02</text>
    <text class="bayes-theorem-name" x="306" y="142">Bayes' theorem inverts it</text>
    <text class="bayes-theorem-desc" x="280" y="166">Into the probability of the</text>
    <text class="bayes-theorem-desc" x="280" y="182">features given the class, which</text>
    <text class="bayes-theorem-desc" x="280" y="198">we can count.</text>
  </g>
  <line class="bayes-theorem-line bayes-theorem-conn bayes-theorem-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bayes-theorem-tip)"/>
  <g class="bayes-theorem-stage bayes-theorem-s2">
    <rect class="bayes-theorem-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-theorem-step" x="516" y="142">03</text>
    <text class="bayes-theorem-name" x="542" y="142">Multiplied by the class prior</text>
    <text class="bayes-theorem-desc" x="516" y="166">How common that class is at all.</text>
  </g>
  <line class="bayes-theorem-line bayes-theorem-conn bayes-theorem-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bayes-theorem-tip)"/>
  <g class="bayes-theorem-stage bayes-theorem-s3">
    <rect class="bayes-theorem-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bayes-theorem-step" x="752" y="142">04</text>
    <text class="bayes-theorem-name" x="778" y="142">And divided by evidence we can ignore</text>
    <text class="bayes-theorem-desc" x="752" y="166">It is the same for every class,</text>
    <text class="bayes-theorem-desc" x="752" y="182">so it cannot change the argmax.</text>
    <text class="bayes-theorem-edge" x="752" y="242">drops out</text>
  </g>
  <text class="bayes-theorem-sub" x="30" y="304">Dropping the denominator is what makes this cheap, and it is why the outputs are not probabilities unless you normalise them deliberately.</text>
</svg>
