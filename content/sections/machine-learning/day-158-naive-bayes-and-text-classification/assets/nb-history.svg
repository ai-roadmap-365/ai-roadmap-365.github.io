<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Dismissed, then vindicated.">
  <title>Four steps for naive Bayes</title>
  <style>
    .nb-history-bg   { fill: #f8fafc; }
    .nb-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nb-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nb-history-stage { opacity: 1; }

    .nb-history-s0 { animation-delay: 0.00s; }
    .nb-history-e0 { animation-delay: 0.00s; }
    .nb-history-s1 { animation-delay: 1.28s; }
    .nb-history-e1 { animation-delay: 1.28s; }
    .nb-history-s2 { animation-delay: 2.56s; }
    .nb-history-e2 { animation-delay: 2.56s; }
    .nb-history-s3 { animation-delay: 3.84s; }
    .nb-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nb-history-conn  { animation: nb-history-trace 6.4s ease-in-out infinite; }
      .nb-history-stage { animation: nb-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nb-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nb-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nb-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nb-history-stage { animation: nb-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nb-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nb-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nb-history-bg" width="980" height="322"/>
  <text class="nb-history-h1"  x="30" y="40">Four steps for naive Bayes</text>
  <text class="nb-history-sub" x="30" y="64">Dismissed, then vindicated.</text>
  <g class="nb-history-stage nb-history-s0">
    <rect class="nb-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nb-history-step" x="44" y="142">01</text>
    <text class="nb-history-name" x="70" y="142">Formulated early, on obviously false assumptions</text>
    <text class="nb-history-desc" x="44" y="166">And dismissed by theorists for</text>
    <text class="nb-history-desc" x="44" y="182">that reason.</text>
  </g>
  <line class="nb-history-line nb-history-conn nb-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nb-history-tip)"/>
  <g class="nb-history-stage nb-history-s1">
    <rect class="nb-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nb-history-step" x="280" y="142">02</text>
    <text class="nb-history-name" x="306" y="142">Then it worked, repeatedly</text>
    <text class="nb-history-desc" x="280" y="166">Particularly on text.</text>
  </g>
  <line class="nb-history-line nb-history-conn nb-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nb-history-tip)"/>
  <g class="nb-history-stage nb-history-s2">
    <rect class="nb-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nb-history-step" x="516" y="142">03</text>
    <text class="nb-history-name" x="542" y="142">Spam filtering made it famous</text>
    <text class="nb-history-desc" x="516" y="166">Effective, fast, and easy to</text>
    <text class="nb-history-desc" x="516" y="182">update.</text>
  </g>
  <line class="nb-history-line nb-history-conn nb-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nb-history-tip)"/>
  <g class="nb-history-stage nb-history-s3">
    <rect class="nb-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nb-history-step" x="752" y="142">04</text>
    <text class="nb-history-name" x="778" y="142">And it remains the standard text baseline</text>
    <text class="nb-history-desc" x="752" y="166">Still hard to beat on small</text>
    <text class="nb-history-desc" x="752" y="182">corpora.</text>
  </g>
  <text class="nb-history-sub" x="30" y="304">A model dismissed on theoretical grounds and vindicated empirically is a useful caution about judging methods by their assumptions rather than their results.</text>
</svg>
