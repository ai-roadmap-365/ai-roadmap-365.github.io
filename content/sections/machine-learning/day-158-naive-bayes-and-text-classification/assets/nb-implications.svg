<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what it gives.">
  <title>What naive Bayes costs</title>
  <style>
    .nb-implications-bg   { fill: #f8fafc; }
    .nb-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-implications-row { opacity: 1; }
    .nb-implications-r0 { animation-delay: 0.00s; }
    .nb-implications-r1 { animation-delay: 0.45s; }
    .nb-implications-r2 { animation-delay: 0.90s; }
    .nb-implications-r3 { animation-delay: 1.35s; }
    .nb-implications-r4 { animation-delay: 1.80s; }
    .nb-implications-row { animation: nb-implications-reveal 7.3s ease-in-out infinite; }
    @keyframes nb-implications-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="nb-implications-bg" width="980" height="390"/>
  <text class="nb-implications-h1"  x="30" y="40">What naive Bayes costs</text>
  <text class="nb-implications-sub" x="30" y="64">And what it gives.</text>
  <rect class="nb-implications-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="nb-implications-name" x="46" y="122">Strengths</text>
  <text class="nb-implications-desc" x="46" y="142">Four.</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r0" x="46" y="182">Trains in a single pass</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r1" x="46" y="216">Predicts in microseconds</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r2" x="46" y="250">Works with very little training data</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r3" x="46" y="284">Updates incrementally with new counts</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r4" x="46" y="318">Trivial to implement and inspect</text>
  <rect class="nb-implications-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="nb-implications-name" x="526" y="122">Weaknesses</text>
  <text class="nb-implications-desc" x="526" y="142">Also four.</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r0" x="526" y="182">Probabilities are badly calibrated</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r1" x="526" y="216">Correlated features are double-counted</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r2" x="526" y="250">Cannot represent feature interactions</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r3" x="526" y="284">Sensitive to the smoothing constant</text>
  <text class="nb-implications-desc nb-implications-row nb-implications-r4" x="526" y="318">Plateaus as data grows</text>
  <text class="nb-implications-sub" x="30" y="372">Double-counting correlated features is the mechanism behind the poor calibration: the same evidence is multiplied in several times, driving outputs toward zero and one.</text>
</svg>
