<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four problems.">
  <title>What naive Bayes solved</title>
  <style>
    .nb-why-bg   { fill: #f8fafc; }
    .nb-why-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-why-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-why-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-why-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-why-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nb-why-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nb-why-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nb-why-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nb-why-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nb-why-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nb-why-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nb-why-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nb-why-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nb-why-stage { opacity: 1; }

    .nb-why-s0 { animation-delay: 0.00s; }
    .nb-why-e0 { animation-delay: 0.00s; }
    .nb-why-s1 { animation-delay: 1.28s; }
    .nb-why-e1 { animation-delay: 1.28s; }
    .nb-why-s2 { animation-delay: 2.56s; }
    .nb-why-e2 { animation-delay: 2.56s; }
    .nb-why-s3 { animation-delay: 3.84s; }
    .nb-why-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .nb-why-conn  { animation: nb-why-trace 6.4s ease-in-out infinite; }
      .nb-why-stage { animation: nb-why-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes nb-why-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nb-why-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nb-why-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nb-why-stage { animation: nb-why-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nb-why-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nb-why-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nb-why-bg" width="980" height="322"/>
  <text class="nb-why-h1"  x="30" y="40">What naive Bayes solved</text>
  <text class="nb-why-sub" x="30" y="64">Four problems.</text>
  <g class="nb-why-stage nb-why-s0">
    <rect class="nb-why-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="nb-why-step" x="44" y="142">01</text>
    <text class="nb-why-name" x="70" y="142">The joint distribution of many features is uncountable</text>
    <text class="nb-why-desc" x="44" y="166">Independence makes it countable.</text>
  </g>
  <line class="nb-why-line nb-why-conn nb-why-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#nb-why-tip)"/>
  <g class="nb-why-stage nb-why-s1">
    <rect class="nb-why-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="nb-why-step" x="280" y="142">02</text>
    <text class="nb-why-name" x="306" y="142">Estimating it needs enormous data</text>
    <text class="nb-why-desc" x="280" y="166">Per-feature counts need very</text>
    <text class="nb-why-desc" x="280" y="182">little.</text>
  </g>
  <line class="nb-why-line nb-why-conn nb-why-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#nb-why-tip)"/>
  <g class="nb-why-stage nb-why-s2">
    <rect class="nb-why-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="nb-why-step" x="516" y="142">03</text>
    <text class="nb-why-name" x="542" y="142">And it had to run on modest hardware</text>
    <text class="nb-why-desc" x="516" y="166">Counting is cheap in every</text>
    <text class="nb-why-desc" x="516" y="182">sense.</text>
  </g>
  <line class="nb-why-line nb-why-conn nb-why-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#nb-why-tip)"/>
  <g class="nb-why-stage nb-why-s3">
    <rect class="nb-why-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="nb-why-step" x="752" y="142">04</text>
    <text class="nb-why-name" x="778" y="142">While updating on new data had to be instant</text>
    <text class="nb-why-desc" x="752" y="166">Which incrementing counts</text>
    <text class="nb-why-desc" x="752" y="182">allows.</text>
  </g>
  <text class="nb-why-sub" x="30" y="304">Incremental updating is why spam filters adopted it: a user marking a message updates the model immediately, with no retraining pass.</text>
</svg>
