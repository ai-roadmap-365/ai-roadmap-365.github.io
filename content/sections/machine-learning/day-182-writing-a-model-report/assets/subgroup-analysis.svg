<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reporting subgroup performance</title>
  <style>
    .subgroup-analysis-bg   { fill: #f8fafc; }
    .subgroup-analysis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .subgroup-analysis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .subgroup-analysis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .subgroup-analysis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .subgroup-analysis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .subgroup-analysis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .subgroup-analysis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .subgroup-analysis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .subgroup-analysis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .subgroup-analysis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .subgroup-analysis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .subgroup-analysis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .subgroup-analysis-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .subgroup-analysis-stage { opacity: 1; }

    .subgroup-analysis-s0 { animation-delay: 0.00s; }
    .subgroup-analysis-e0 { animation-delay: 0.00s; }
    .subgroup-analysis-s1 { animation-delay: 1.28s; }
    .subgroup-analysis-e1 { animation-delay: 1.28s; }
    .subgroup-analysis-s2 { animation-delay: 2.56s; }
    .subgroup-analysis-e2 { animation-delay: 2.56s; }
    .subgroup-analysis-s3 { animation-delay: 3.84s; }
    .subgroup-analysis-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .subgroup-analysis-conn  { animation: subgroup-analysis-trace 6.4s ease-in-out infinite; }
      .subgroup-analysis-stage { animation: subgroup-analysis-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes subgroup-analysis-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes subgroup-analysis-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .subgroup-analysis-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .subgroup-analysis-stage { animation: subgroup-analysis-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes subgroup-analysis-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="subgroup-analysis-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="subgroup-analysis-bg" width="980" height="322"/>
  <text class="subgroup-analysis-h1"  x="30" y="40">Reporting subgroup performance</text>
  <text class="subgroup-analysis-sub" x="30" y="64">Four steps.</text>
  <g class="subgroup-analysis-stage subgroup-analysis-s0">
    <rect class="subgroup-analysis-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="subgroup-analysis-step" x="44" y="142">01</text>
    <text class="subgroup-analysis-name" x="70" y="142">Report the chosen slices</text>
    <text class="subgroup-analysis-desc" x="44" y="166">Demographic where relevant,</text>
    <text class="subgroup-analysis-desc" x="44" y="182">business dimensions always.</text>
  </g>
  <line class="subgroup-analysis-line subgroup-analysis-conn subgroup-analysis-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#subgroup-analysis-tip)"/>
  <g class="subgroup-analysis-stage subgroup-analysis-s1">
    <rect class="subgroup-analysis-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="subgroup-analysis-step" x="280" y="142">02</text>
    <text class="subgroup-analysis-name" x="306" y="142">With the same metric computed within each</text>
    <text class="subgroup-analysis-desc" x="280" y="166">Not a different one per slice.</text>
  </g>
  <line class="subgroup-analysis-line subgroup-analysis-conn subgroup-analysis-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#subgroup-analysis-tip)"/>
  <g class="subgroup-analysis-stage subgroup-analysis-s2">
    <rect class="subgroup-analysis-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="subgroup-analysis-step" x="516" y="142">03</text>
    <text class="subgroup-analysis-name" x="542" y="142">And the sample size for each</text>
    <text class="subgroup-analysis-desc" x="516" y="166">So small-sample noise is</text>
    <text class="subgroup-analysis-desc" x="516" y="182">visible.</text>
  </g>
  <line class="subgroup-analysis-line subgroup-analysis-conn subgroup-analysis-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#subgroup-analysis-tip)"/>
  <g class="subgroup-analysis-stage subgroup-analysis-s3">
    <rect class="subgroup-analysis-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="subgroup-analysis-step" x="752" y="142">04</text>
    <text class="subgroup-analysis-name" x="778" y="142">Plus the largest disparity, stated plainly</text>
    <text class="subgroup-analysis-desc" x="752" y="166">Rather than left for the reader</text>
    <text class="subgroup-analysis-desc" x="752" y="182">to compute.</text>
  </g>
  <text class="subgroup-analysis-sub" x="30" y="304">Including sample sizes is what stops a slice with eleven examples being read as evidence, which is a common and avoidable misreading of these tables.</text>
</svg>
