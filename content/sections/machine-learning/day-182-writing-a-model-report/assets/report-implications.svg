<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are protective.">
  <title>Four consequences of documenting properly</title>
  <style>
    .report-implications-bg   { fill: #f8fafc; }
    .report-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .report-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .report-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .report-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .report-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .report-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .report-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .report-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .report-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .report-implications-stage { opacity: 1; }

    .report-implications-s0 { animation-delay: 0.00s; }
    .report-implications-e0 { animation-delay: 0.00s; }
    .report-implications-s1 { animation-delay: 1.28s; }
    .report-implications-e1 { animation-delay: 1.28s; }
    .report-implications-s2 { animation-delay: 2.56s; }
    .report-implications-e2 { animation-delay: 2.56s; }
    .report-implications-s3 { animation-delay: 3.84s; }
    .report-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .report-implications-conn  { animation: report-implications-trace 6.4s ease-in-out infinite; }
      .report-implications-stage { animation: report-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes report-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes report-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .report-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .report-implications-stage { animation: report-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes report-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="report-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="report-implications-bg" width="980" height="322"/>
  <text class="report-implications-h1"  x="30" y="40">Four consequences of documenting properly</text>
  <text class="report-implications-sub" x="30" y="64">Two are protective.</text>
  <g class="report-implications-stage report-implications-s0">
    <rect class="report-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="report-implications-step" x="44" y="142">01</text>
    <text class="report-implications-name" x="70" y="142">Independent review becomes possible</text>
    <text class="report-implications-desc" x="44" y="166">Which is what makes the result</text>
    <text class="report-implications-desc" x="44" y="182">trustworthy.</text>
  </g>
  <line class="report-implications-line report-implications-conn report-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#report-implications-tip)"/>
  <g class="report-implications-stage report-implications-s1">
    <rect class="report-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="report-implications-step" x="280" y="142">02</text>
    <text class="report-implications-name" x="306" y="142">And stated scope bounds the liability</text>
    <text class="report-implications-desc" x="280" y="166">For uses outside what was</text>
    <text class="report-implications-desc" x="280" y="182">evaluated.</text>
  </g>
  <line class="report-implications-line report-implications-conn report-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#report-implications-tip)"/>
  <g class="report-implications-stage report-implications-s2">
    <rect class="report-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="report-implications-step" x="516" y="142">03</text>
    <text class="report-implications-name" x="542" y="142">Operations inherit what they need to run it</text>
    <text class="report-implications-desc" x="516" y="166">Thresholds, assumptions, failure</text>
    <text class="report-implications-desc" x="516" y="182">modes.</text>
  </g>
  <line class="report-implications-line report-implications-conn report-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#report-implications-tip)"/>
  <g class="report-implications-stage report-implications-s3">
    <rect class="report-implications-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="report-implications-step" x="752" y="142">04</text>
    <text class="report-implications-name" x="778" y="142">While writing it exposes gaps</text>
    <text class="report-implications-desc" x="752" y="166">Sections you cannot complete are</text>
    <text class="report-implications-desc" x="752" y="182">work not yet done.</text>
  </g>
  <text class="report-implications-sub" x="30" y="304">The gap-exposing effect is the reason to write it during the project rather than after: an empty subgroup section is a task, not a formatting problem.</text>
</svg>
