<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four kinds.">
  <title>Stating the limitations</title>
  <style>
    .caveats-bg   { fill: #f8fafc; }
    .caveats-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caveats-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caveats-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caveats-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caveats-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .caveats-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .caveats-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .caveats-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .caveats-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .caveats-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .caveats-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .caveats-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .caveats-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .caveats-stage { opacity: 1; }

    .caveats-s0 { animation-delay: 0.00s; }
    .caveats-e0 { animation-delay: 0.00s; }
    .caveats-s1 { animation-delay: 1.28s; }
    .caveats-e1 { animation-delay: 1.28s; }
    .caveats-s2 { animation-delay: 2.56s; }
    .caveats-e2 { animation-delay: 2.56s; }
    .caveats-s3 { animation-delay: 3.84s; }
    .caveats-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .caveats-conn  { animation: caveats-trace 6.4s ease-in-out infinite; }
      .caveats-stage { animation: caveats-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes caveats-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes caveats-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .caveats-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .caveats-stage { animation: caveats-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes caveats-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="caveats-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="caveats-bg" width="980" height="322"/>
  <text class="caveats-h1"  x="30" y="40">Stating the limitations</text>
  <text class="caveats-sub" x="30" y="64">Four kinds.</text>
  <g class="caveats-stage caveats-s0">
    <rect class="caveats-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="caveats-step" x="44" y="142">01</text>
    <text class="caveats-name" x="70" y="142">What the training data did not cover</text>
    <text class="caveats-desc" x="44" y="166">Populations, conditions, time</text>
    <text class="caveats-desc" x="44" y="182">periods.</text>
  </g>
  <line class="caveats-line caveats-conn caveats-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#caveats-tip)"/>
  <g class="caveats-stage caveats-s1">
    <rect class="caveats-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="caveats-step" x="280" y="142">02</text>
    <text class="caveats-name" x="306" y="142">Where performance is known to be weaker</text>
    <text class="caveats-desc" x="280" y="166">Which slices, and by how much.</text>
  </g>
  <line class="caveats-line caveats-conn caveats-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#caveats-tip)"/>
  <g class="caveats-stage caveats-s2">
    <rect class="caveats-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="caveats-step" x="516" y="142">03</text>
    <text class="caveats-name" x="542" y="142">Operational assumptions that must hold</text>
    <text class="caveats-desc" x="516" y="166">Feature availability, latency,</text>
    <text class="caveats-desc" x="516" y="182">freshness.</text>
  </g>
  <line class="caveats-line caveats-conn caveats-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#caveats-tip)"/>
  <g class="caveats-stage caveats-s3">
    <rect class="caveats-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="caveats-step" x="752" y="142">04</text>
    <text class="caveats-name" x="778" y="142">And what must be monitored after deployment</text>
    <text class="caveats-desc" x="752" y="166">With thresholds for</text>
    <text class="caveats-desc" x="752" y="182">intervention.</text>
  </g>
  <text class="caveats-sub" x="30" y="304">Specifying the monitoring thresholds in the report itself is what connects the document to operations, rather than leaving it as a description of a past evaluation.</text>
</svg>
