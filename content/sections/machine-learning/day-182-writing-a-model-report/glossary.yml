terms:
  - term: 'Model Card'
    definition: 'A standardized short document providing key benchmarked evaluation, intended usage, and ethical considerations for an ML model.'
  - term: 'Intended Use'
    definition: 'Clear statements defining target users, domains, operational environments, and tasks for which the model was designed.'
  - term: 'Out-of-Scope Use'
    definition: 'Explicit declarations of applications, populations, and contexts where the model is strictly prohibited from being used.'
  - term: 'Quantitative Analysis'
    definition: 'Disaggregated metric evaluation across demographic, environmental, and temporal slices.'
  - term: 'Model Details'
    definition: 'Basic metadata including architecture, version, developers, release date, and license.'
  - term: 'Ethical Considerations'
    definition: 'Discussion of potential societal risks, biases, surveillance concerns, and privacy safeguards.'
  - term: 'Caveats and Recommendations'
    definition: 'Known failure modes, unexpected performance drops, and guidelines for downstream maintainers.'
  - term: 'Datasheet for Datasets'
    definition: 'A companion standard document detailing the provenance, collection protocol, and composition of training datasets.'
