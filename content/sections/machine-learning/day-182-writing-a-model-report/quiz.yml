questions:
  - question: "Why is the 'Out-of-Scope and Prohibited Uses' section in a Model Card considered legally and operationally critical?"
    options:
      - "It explicitly defines the operating boundaries and user populations where the model must NEVER be deployed, protecting the organization from catastrophic misuse and liability under regulations like the EU AI Act."
      - "It increases GPU training throughput by 20%."
      - "It allows the model to run without scikit-learn installed."
      - "It compresses the model pickle file size."
    answer_index: 0
    explanation: "Under the Mitchell et al. standard and modern AI regulations (EU AI Act, FTC), explicitly declaring prohibited use cases (e.g. 'Do NOT use on pediatric patients < 18') establishes clear legal boundaries and prevents dangerous deployment in untested domains."

  - question: "Under the Mitchell et al. (2019) Model Card standard, what must the Quantitative Analyses section contain beyond a single global accuracy score?"
    options:
      - "Stratified performance metrics evaluated across distinct demographic subgroups (e.g. age, sex, region), operational environment slices, and algorithmic fairness audits."
      - "The complete assembly code instructions of the GPU."
      - "A list of every single training sample row."
      - "The personal email addresses of all annotators."
    answer_index: 0
    explanation: "Model Cards require quantitative evaluation broken down across diverse demographic and operational slices, proving the model does not suffer from severe localized blind spots or disparate impact."

  - question: "What is the primary function of a Model Card in an enterprise MLOps CI/CD pipeline?"
    options:
      - "To serve as a standardized, version-controlled, and automated artifact documenting model behavior, evaluation metrics, fairness audits, and limitations for compliance sign-off."
      - "To compile Python scripts into C++ binaries."
      - "To automatically tune learning rates during backpropagation."
      - "To encrypt database tables."
    answer_index: 0
    explanation: "In modern MLOps, automated pipelines compile Model Cards on every training run, attaching immutable documentation to the Model Registry to satisfy legal, safety, and business governance requirements before deployment."

  - question: "How does a Model Card differ from standard developer software documentation (e.g. docstrings or API reference)?"
    options:
      - "A Model Card focuses on empirical performance, dataset provenance, demographic fairness, ethical limitations, and failure boundaries, whereas developer docs describe software API functions and types."
      - "A Model Card is written only for compiler optimizers."
      - "Developer documentation is prohibited in enterprise machine learning."
      - "Model Cards are only used for unsupervised clustering."
    answer_index: 0
    explanation: "While code docstrings explain how to call functions, a Model Card explains the empirical behavior, safety limits, dataset representation, and ethical constraints of the machine learning artifact."

  - question: "What should be documented under the 'Caveats and Recommendations' section of an enterprise Model Card?"
    options:
      - "Known operational edge-case failure modes, data freshness constraints, performance degradation thresholds, and mandatory retraining trigger criteria."
      - "The salary of the data science team."
      - "The brand of laptop used during development."
      - "Marketing slogans for customer sales."
    answer_index: 0
    explanation: "Caveats document real-world operational constraints: when the model will degrade (e.g. high inflation, missing sensor readings) and when the model must be taken offline and retrained."
