visuals:
  - id: model-card-canonical-architecture
    file: assets/model-card-canonical-architecture.svg
    type: diagram
    title: 'The 9 Canonical Sections of an Enterprise Model Card'
    alt: 'Architecture diagram showing the 9 mandatory sections of an enterprise Model Card under the Mitchell et al. standard.'
    description: 'A static diagram outlining the nine core sections required in transparent machine learning reporting.'
  - id: model-card-governance-flow
    file: assets/model-card-governance-flow.svg
    type: flow-animated
    title: 'Automated Continuous Model Card Generation'
    alt: 'Animated flow chart showing the continuous automated generation and validation of Model Cards in CI/CD pipelines.'
    description: 'An animated flow chart demonstrating how model training, automated fairness auditing, and Model Card rendering integrate into MLOps deployment.'
  - id: model-card
    file: assets/model-card.svg
    type: diagram
    title: 'What a model card contains'
    alt: 'Diagram: the five essential sections of a model card'
    description: 'A five-stage description of a model card covering details, intended use, evaluation, subgroups and limitations.'
  - id: intended-use
    file: assets/intended-use.svg
    type: diagram
    title: 'Stating the intended use'
    alt: 'Diagram: the four elements of an intended-use statement'
    description: 'A four-stage description of intended use covering the decision, the population, the conditions and the exclusions.'
  - id: subgroup-analysis
    file: assets/subgroup-analysis.svg
    type: diagram
    title: 'Reporting subgroup performance'
    alt: 'Diagram: how subgroup performance is reported in a model card'
    description: 'A four-stage description of subgroup reporting covering the slices, per-slice metrics, sample sizes and the disparities.'
  - id: caveats
    file: assets/caveats.svg
    type: diagram
    title: 'Stating the limitations'
    alt: 'Diagram: the four kinds of limitation a model report should state'
    description: 'A four-stage description of model limitations covering data limitations, performance limitations, operational limitations and monitoring requirements.'
  - id: report-not
    file: assets/report-not.svg
    type: diagram
    title: 'What a model report is not'
    alt: 'Diagram: four misconceptions about model reports'
    description: 'A two-column comparison of misconceptions about model reports against what is true.'
  - id: report-history
    file: assets/report-history.svg
    type: diagram
    title: 'Four steps in model documentation'
    alt: 'Diagram: the historical progression of model documentation practice'
    description: 'A four-stage description of documentation history covering none, ad hoc notes, the model card proposal and regulatory requirement.'
  - id: medicine-label
    file: assets/medicine-label.svg
    type: diagram
    title: 'A medicine label'
    alt: 'Diagram: an undocumented product compared with a labelled one'
    description: 'A two-column comparison of an undocumented product against a properly labelled one.'
  - id: report-implications
    file: assets/report-implications.svg
    type: diagram
    title: 'Four consequences of documenting properly'
    alt: 'Diagram: the review, liability, operations and quality implications of model documentation'
    description: 'A four-stage description of documentation implications covering independent review, liability bounds, operational handover and quality improvement.'
  - id: report-when
    file: assets/report-when.svg
    type: diagram
    title: 'How much documentation'
    alt: 'Diagram: how much model documentation is warranted, by consequence'
    description: 'A two-column comparison of deployment contexts against the documentation each requires.'
  - id: model-details
    file: assets/model-details.svg
    type: diagram
    title: 'The identifying details'
    alt: 'Diagram: the four identifying fields of a model card'
    description: 'A four-stage description of model identification covering version, provenance, owner and dependencies.'
  - id: eval-setup
    file: assets/eval-setup.svg
    type: diagram
    title: 'Documenting the evaluation'
    alt: 'Diagram: the four elements of a documented evaluation'
    description: 'A four-stage description of evaluation documentation covering the metric, the data, the operating point and the comparison.'
