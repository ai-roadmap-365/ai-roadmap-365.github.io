visuals:
  - id: active-learning-uncertainty-sampling
    file: assets/active-learning-uncertainty-sampling.svg
    type: diagram
    title: Active Learning Uncertainty Sampling Loop
    alt: Active learning uncertainty sampling loop showing model predicting pool entropy selecting low confidence queries and updating training distribution
    description: Architectural loop demonstrating how entropy-based uncertainty sampling filters massive unlabeled data pools for human annotators.
  - id: weak-supervision-snorkel-workflow
    file: assets/weak-supervision-snorkel-workflow.svg
    type: diagram
    title: Weak Supervision Programmatic Labeling Workflow
    alt: Weak supervision workflow showing heuristic labeling functions vote aggregation generative label matrix and downstream model training
    description: Programmatic labeling pipeline combining domain heuristics, regular expressions, and noisy labeling functions into probabilistic training labels.
  - id: labelling-idea
    file: assets/labelling-idea.svg
    type: diagram
    title: 'Why labels are the constraint'
    alt: 'Diagram: why labelled data is the binding constraint in supervised learning'
    description: 'A four-stage description of the labelling constraint covering abundance of raw data, the cost of labels, the quality ceiling and the strategies.'
  - id: active-learning
    file: assets/active-learning.svg
    type: diagram
    title: 'Active learning'
    alt: 'Diagram: how active learning selects which examples to label next'
    description: 'A four-stage description of active learning covering the initial model, uncertainty scoring, selection and the loop.'
  - id: agreement
    file: assets/agreement.svg
    type: diagram
    title: 'Measuring annotator agreement'
    alt: 'Diagram: how inter-annotator agreement is measured and why chance is corrected for'
    description: 'A four-stage description of agreement measurement covering double labelling, raw agreement, chance correction and interpretation.'
  - id: weak-supervision
    file: assets/weak-supervision.svg
    type: diagram
    title: 'Weak supervision'
    alt: 'Diagram: how programmatic labelling functions produce training labels'
    description: 'A four-stage description of weak supervision covering labelling functions, their noise, the combination model and the resulting labels.'
  - id: confident-learning
    file: assets/confident-learning.svg
    type: diagram
    title: 'Finding label errors'
    alt: 'Diagram: how confidently-wrong predictions identify mislabelled examples'
    description: 'A four-stage description of label error detection covering out-of-fold prediction, confident disagreement, ranking and review.'
  - id: labelling-not
    file: assets/labelling-not.svg
    type: diagram
    title: 'What labelling is not'
    alt: 'Diagram: four misconceptions about data labelling'
    description: 'A two-column comparison of misconceptions about labelling against what is true.'
  - id: labelling-history
    file: assets/labelling-history.svg
    type: diagram
    title: 'Four steps in dataset construction'
    alt: 'Diagram: the historical progression of training dataset construction'
    description: 'A four-stage description of dataset history covering small expert sets, crowdsourcing, weak supervision and model-generated labels.'
  - id: survey-design
    file: assets/survey-design.svg
    type: diagram
    title: 'Writing a survey question'
    alt: 'Diagram: an ambiguous question compared with a well-specified one'
    description: 'A two-column comparison of an ambiguous labelling task against a well-specified one.'
  - id: labelling-implications
    file: assets/labelling-implications.svg
    type: diagram
    title: 'Four consequences of labelling practice'
    alt: 'Diagram: the ceiling, cost, labour and bias implications of data labelling'
    description: 'A four-stage description of labelling implications covering the accuracy ceiling, cost, annotator conditions and encoded bias.'
  - id: labelling-when
    file: assets/labelling-when.svg
    type: diagram
    title: 'Which labelling strategy when'
    alt: 'Diagram: choosing a labelling strategy by situation'
    description: 'A two-column comparison of situations against the labelling strategy that fits.'
