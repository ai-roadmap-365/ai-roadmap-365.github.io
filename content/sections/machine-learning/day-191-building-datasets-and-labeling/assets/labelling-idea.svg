<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why labels are the constraint</title>
  <style>
    .labelling-idea-bg   { fill: #f8fafc; }
    .labelling-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .labelling-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .labelling-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .labelling-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .labelling-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .labelling-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .labelling-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .labelling-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .labelling-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .labelling-idea-stage { opacity: 1; }

    .labelling-idea-s0 { animation-delay: 0.00s; }
    .labelling-idea-e0 { animation-delay: 0.00s; }
    .labelling-idea-s1 { animation-delay: 1.28s; }
    .labelling-idea-e1 { animation-delay: 1.28s; }
    .labelling-idea-s2 { animation-delay: 2.56s; }
    .labelling-idea-e2 { animation-delay: 2.56s; }
    .labelling-idea-s3 { animation-delay: 3.84s; }
    .labelling-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .labelling-idea-conn  { animation: labelling-idea-trace 6.4s ease-in-out infinite; }
      .labelling-idea-stage { animation: labelling-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes labelling-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes labelling-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .labelling-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .labelling-idea-stage { animation: labelling-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes labelling-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="labelling-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="labelling-idea-bg" width="980" height="322"/>
  <text class="labelling-idea-h1"  x="30" y="40">Why labels are the constraint</text>
  <text class="labelling-idea-sub" x="30" y="64">Four steps.</text>
  <g class="labelling-idea-stage labelling-idea-s0">
    <rect class="labelling-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="labelling-idea-step" x="44" y="142">01</text>
    <text class="labelling-idea-name" x="70" y="142">Raw data is usually abundant</text>
    <text class="labelling-idea-desc" x="44" y="166">Logs, records, images,</text>
    <text class="labelling-idea-desc" x="44" y="182">documents.</text>
  </g>
  <line class="labelling-idea-line labelling-idea-conn labelling-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#labelling-idea-tip)"/>
  <g class="labelling-idea-stage labelling-idea-s1">
    <rect class="labelling-idea-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="labelling-idea-step" x="280" y="142">02</text>
    <text class="labelling-idea-name" x="306" y="142">Labels are expensive and slow</text>
    <text class="labelling-idea-desc" x="280" y="166">Human time, often expert human</text>
    <text class="labelling-idea-desc" x="280" y="182">time.</text>
  </g>
  <line class="labelling-idea-line labelling-idea-conn labelling-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#labelling-idea-tip)"/>
  <g class="labelling-idea-stage labelling-idea-s2">
    <rect class="labelling-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="labelling-idea-step" x="516" y="142">03</text>
    <text class="labelling-idea-name" x="542" y="142">And label quality caps model quality</text>
    <text class="labelling-idea-desc" x="516" y="166">A model cannot exceed the labels</text>
    <text class="labelling-idea-desc" x="516" y="182">it learned from.</text>
  </g>
  <line class="labelling-idea-line labelling-idea-conn labelling-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#labelling-idea-tip)"/>
  <g class="labelling-idea-stage labelling-idea-s3">
    <rect class="labelling-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="labelling-idea-step" x="752" y="142">04</text>
    <text class="labelling-idea-name" x="778" y="142">So spend the budget deliberately</text>
    <text class="labelling-idea-desc" x="752" y="166">Which is what active learning</text>
    <text class="labelling-idea-desc" x="752" y="182">and weak supervision do.</text>
  </g>
  <text class="labelling-idea-sub" x="30" y="304">The quality ceiling is the part teams under-weight: doubling the labelling budget helps far less than fixing systematically wrong labels.</text>
</svg>
