questions:
  - question: 'What does Shannon Entropy quantify when selecting samples for human labeling in Active Learning?'
    options:
      - 'The physical temperature of the server CPU'
      - 'The entropy of the predicted class distribution'
      - 'The number of characters in the input text prompt'
      - 'The ratio of training rows to testing rows'
    answer_index: 1
    explanation: 'Shannon entropy measures prediction uncertainty. A binary model outputting [0.50, 0.50] has maximum entropy 1.0, representing the highest priority sample for human annotation.'
  - question: 'What does a Cohen Kappa score of kappa = 0.82 between two annotators indicate?'
    options:
      - 'That 82% of labels are negative'
      - 'Poor agreement indistinguishable from random coin flips'
      - 'Near-perfect inter-annotator agreement beyond random chance'
      - 'That the dataset must be discarded'
    answer_index: 2
    explanation: 'Cohen Kappa measures agreement corrected for chance: kappa > 0.80 represents strong to near-perfect consensus between independent raters.'
  - question: 'What is the primary advantage of Weak Supervision (Snorkel) over traditional manual data labeling?'
    options:
      - 'It bypasses all cloud storage costs'
      - 'It eliminates the need for any training algorithms'
      - 'It guarantees 100% test accuracy on unseen data'
      - 'Experts write labelling functions that label millions fast'
    answer_index: 3
    explanation: 'Weak supervision encodes human expertise into reusable code functions that can re-label millions of records instantly whenever business rules or schemas change.'
  - question: 'Why is a Golden Evaluation Test Set strictly segregated and never labeled using automated weak supervision?'
    options:
      - 'To measure real accuracy without inheriting heuristic bias'
      - 'To reduce disk space usage'
      - 'Because Python cannot compute loss on weak labels'
      - 'To prevent Git merge conflicts'
    answer_index: 0
    explanation: 'Evaluation test sets must represent pristine ground-truth reality annotated by trusted domain experts, ensuring benchmark metrics accurately reflect production performance.'
  - question: 'In Confident Learning, what does the off-diagonal mass of the Confident Joint Matrix C_{y_tilde, y*} reveal?'
    options:
      - 'The matrix inverse of the feature covariance matrix'
      - 'The estimated count of mislabelled instances'
      - 'The number of missing values per column'
      - 'The gradient descent learning rate'
    answer_index: 1
    explanation: 'Confident learning estimates the joint distribution between noisy observed labels and latent true labels, flagging rows where model probability strongly disagrees with annotations as label errors.'
