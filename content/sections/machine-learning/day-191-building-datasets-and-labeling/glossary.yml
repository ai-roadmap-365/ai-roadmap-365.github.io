terms:
  - term: 'Data-Centric AI'
    definition: 'An engineering paradigm focusing on systematically improving dataset quality, consistency, and labels rather than solely tweaking model architectures.'
  - term: 'Active Learning'
    definition: 'A machine learning framework where the learning algorithm interactively queries an information source (human oracle) to label new data points.'
  - term: 'Uncertainty Sampling'
    definition: 'An active learning query strategy that selects unlabeled samples where the current model has highest prediction entropy or lowest confidence.'
  - term: 'Weak Supervision'
    definition: 'A framework where noisy, higher-level, or programmatic sources of supervision are algorithmically combined to generate training labels.'
  - term: 'Labeling Function (LF)'
    definition: 'A user-defined heuristic function that inspects an unlabelled sample and outputs a proposed label or abstains from voting.'
  - term: 'Cohen Kappa'
    definition: 'A statistical coefficient measuring inter-rater agreement for categorical items, normalized against agreement expected by chance.'
  - term: 'Confident Learning'
    definition: 'A probabilistic framework estimating joint noise distributions to identify and prune mislabeled training instances.'
  - term: 'Golden Test Set'
    definition: 'A curated, pristine, manually verified dataset used strictly for final model evaluation and never exposed during training.'
