terms:
  - term: Normal equations
    definition: >-
      The closed-form solution to ordinary least squares, obtained by solving X'X beta = X'y directly.
      Textbook-simple, and measured here to agree with sklearn's LinearRegression to only 1.2153e-10 on
      well-conditioned data -- about a hundred times looser than a direct solve of X.
  - term: lstsq
    definition: >-
      A least-squares solve that factors the design matrix X directly rather than forming and inverting
      X'X. Measured here to agree with sklearn to 1.1990e-12, because it never squares X's condition
      number the way the normal equations do.
  - term: Condition number
    definition: >-
      The ratio of a matrix's largest to smallest singular value, measuring how much a small change in
      the input can be amplified in the output of a linear solve. 227.2248 for the diabetes design
      matrix here; 2.4363e+07 for the near-duplicate-column dataset that makes the normal equations
      explode.
  - term: 'cond(X''X) = cond(X) squared'
    definition: >-
      The textbook reason the normal equations lose more precision than a direct solve of X. Confirmed
      to ten decimal places on well-conditioned data (51631.1119 against 227.2248 squared); the
      verification itself degrades under extreme ill-conditioning, measured here at 0.9527 rather than
      1.0 on the near-duplicate-column case.
  - term: Minimum-norm solution
    definition: >-
      Among the infinitely many coefficient vectors that fit an under-determined or near-collinear
      problem almost equally well, the one with the smallest overall magnitude. sklearn's default
      LinearRegression solver returns this one, splitting a shared true coefficient of 1 into 2.5 and
      2.5 on this lesson's near-duplicate-column dataset rather than exploding.
  - term: Multicollinearity
    definition: >-
      Two or more predictor columns carrying overlapping information about each other, first introduced
      structurally on Day 150. This lesson measures its numerical consequence directly: a near-duplicate
      column sends closed-form coefficients past 196,000 in magnitude while the true coefficients are 1
      and 4.
  - term: Gradient-descent stability threshold
    definition: >-
      The learning rate above which gradient descent on a quadratic loss diverges, from Day 111's
      condition |1 - eta * a| < 1 applied to the loss's largest Hessian eigenvalue. Measured at 0.2485
      for standardized diabetes features; gradient descent converges in 7132 iterations at 80 percent of
      it and diverges to non-finite values at 102 percent.
  - term: Hessian eigenvalue ratio
    definition: >-
      The condition number of the loss surface gradient descent is optimizing, governing how many
      iterations the slowest direction needs to converge. 470.08 on standardized diabetes features;
      76278.96 on raw, unscaled ones -- over a hundred times worse, which is why gradient descent barely
      moves on badly scaled data even at a stable learning rate.
  - term: Feature standardization
    definition: >-
      Rescaling every column to zero mean and unit standard deviation before fitting. Not required for
      the closed form, which is invariant to scale, but measured here to shrink the Hessian eigenvalue
      ratio from 76278.96 to 470.08 and make gradient descent converge in thousands of iterations rather
      than hundreds of thousands.
  - term: Operation count
    definition: >-
      Multiply-add operations computed by formula rather than timed on a clock, so the comparison
      survives a different machine unchanged. 54,813 for the closed form on the diabetes shape against
      64,452,440 for gradient descent to reach 9-decimal agreement -- about 1176 times more.
  - term: BaseEstimator
    definition: >-
      The scikit-learn base class supplying get_params, set_params and __sklearn_tags__ by introspecting
      __init__. Day 146 measured that a from-scratch estimator raises AttributeError inside
      Pipeline.predict() and cross_val_score without it, even though fit, predict and score work fine
      called directly; OLSRegressor inherits it for that measured reason.
  - term: RegressorMixin
    definition: >-
      A scikit-learn mixin supplying a default score() method (R-squared) for any estimator that
      implements predict(). Paired with BaseEstimator on OLSRegressor so it behaves as a complete
      regressor rather than a bare fit/predict object.
  - term: check_estimator
    definition: >-
      scikit-learn's own compliance suite for a hand-built estimator. Run against OLSRegressor here:
      48 of 52 checks pass; the two failures, named rather than suppressed, are both about input
      validation this implementation does not perform.
  - term: fit_intercept by centring
    definition: >-
      Computing an intercept by subtracting each column's mean before fitting and recovering it
      afterwards as y.mean() minus X.mean(axis=0) dotted with the coefficients, rather than appending a
      column of ones to the design matrix. Measured here to agree with the column-append approach to
      within 1.9554e-11 on coefficients and 2.8422e-14 on the intercept.
  - term: Singular versus ill-conditioned
    definition: >-
      A singular matrix cannot be inverted at all; an ill-conditioned one can be inverted but the
      inversion amplifies floating-point error. The near-duplicate column in this lesson's dramatic case
      is ill-conditioned, not exactly singular -- which is why the normal equations return a number at
      all, just a badly wrong one.
  - term: SVD-based solve
    definition: >-
      A least-squares solution method built on the singular value decomposition, which sklearn's default
      LinearRegression uses. Directly exposes a matrix's small singular values, letting it return the
      minimum-norm answer on near-collinear data rather than the exploded answer the normal equations
      and a naive lstsq both fall into on the most extreme cases.
  - term: Batch gradient descent
    definition: >-
      The update rule coef := coef - eta * gradient, applied to every row of the data on every
      iteration. Day 111's material, applied here to ordinary least squares' mean-squared-error loss,
      whose gradient is (2/n) X'(X coef - y).
