questions:
  - question: >-
      On the diabetes dataset, the normal equations agree with sklearn's LinearRegression to within
      1.2153e-10, and lstsq agrees to within 1.1990e-12 -- about a hundred times closer. Both solve
      the exact same least-squares problem correctly. Where does the gap between them come from?
    options:
      - 'The normal equations have a bug: forming X''X loses information a direct solve of X does not'
      - 'lstsq uses a different, more accurate loss function than the normal equations'
      - 'The normal equations square the condition number of X by forming X''X, so a solve that was already carrying some floating-point error now carries roughly twice as many lost digits'
      - 'The gap is measurement noise and would vanish on a different run of the same code'
    answer_index: 2
    explanation: >-
      cond(X'X) is exactly the square of cond(X), measured here as 51631.1119 against 227.2248 squared
      -- confirmed to ten decimal places. Squaring a condition number roughly doubles how many decimal
      digits of precision a fixed-precision solve loses. lstsq never forms X'X at all; it factors X
      directly, so it does not inherit the squared conditioning. Both routes are correct algorithms
      for the same problem -- there is no bug and no different loss function -- and the gap is
      deterministic given the pinned software versions, not run-to-run noise.
  - question: >-
      Three random columns plus a fourth that is almost identical to the first, true coefficients
      [1, 2, 3, 4]. The normal equations and lstsq both report coefficients near plus and minus two
      hundred thousand for the duplicated pair. sklearn's LinearRegression reports 2.5 and 2.5 for the
      same pair. What is sklearn doing differently?
    options:
      - 'sklearn detects the near-duplicate column and silently drops one of them before fitting'
      - 'sklearn uses an SVD-based solve that returns the minimum-norm solution among the infinitely many that fit the data almost equally well, splitting the shared weight evenly'
      - 'sklearn applies a small amount of regularization by default, which the from-scratch methods do not'
      - 'sklearn''s LinearRegression is simply wrong here, and the from-scratch answer of plus and minus two hundred thousand is the correct one'
    answer_index: 1
    explanation: >-
      When two columns are nearly collinear, many different coefficient splits fit the data almost
      equally well -- the true coefficient of 1 shared between the near-duplicate pair could land
      almost anywhere between them without materially changing predictions. sklearn's default solver
      finds the minimum-norm answer among those options, which splits the weight evenly at 2.5 and
      2.5. LinearRegression does not drop columns and applies no regularization by default (that is
      Ridge and Lasso's job, covered on Day 151). The exploded from-scratch coefficients are not
      "more correct" -- they are a numerically unstable answer to an ill-posed sub-problem.
  - question: >-
      At the extreme ill-conditioning of the near-duplicate-column dataset, cond(X'X) / cond(X) squared
      measures at 0.9527, not the 1.0000000000 confirmed on the well-conditioned diabetes data. What
      does that measured gap mean?
    options:
      - 'The theorem cond(X''X) = cond(X) squared is only approximately true, and becomes less true as conditioning worsens'
      - 'A bug exists somewhere in the condition-number calculation for extremely ill-conditioned matrices'
      - 'The theorem remains exactly true in exact arithmetic; the measured ratio drifts from 1.0 because computing the smallest singular value of an already near-singular matrix is itself numerically imprecise'
      - 'The near-duplicate dataset was constructed incorrectly and should be regenerated with a different seed'
    answer_index: 2
    explanation: >-
      cond(X'X) = cond(X) squared is a theorem about singular values, exactly true regardless of how
      ill-conditioned X is. But VERIFYING it numerically requires computing X's smallest singular
      value, and when that value is already vanishingly small relative to the largest one -- exactly
      the situation an extremely ill-conditioned matrix creates -- the computation of that smallest
      value is itself imprecise. The measurement, not the theorem, degrades. This is the honest finding
      the lesson reports rather than smoothing over: even a clean mathematical identity can become hard
      to verify numerically once conditioning is extreme enough.
  - question: >-
      Day 111 established that gradient descent on a quadratic loss is stable exactly when
      |1 - eta * a| < 1 for every eigenvalue a of the loss's Hessian. On standardized diabetes
      features, that threshold evaluates to eta < 0.2485. What happens at eta = 0.2535, about two
      percent above the threshold?
    options:
      - 'Gradient descent converges slightly more slowly than at eta = 0.2, since it is still fairly close to the threshold'
      - 'Gradient descent converges to a slightly different, incorrect answer, since the learning rate is now too large to be accurate'
      - 'Nothing changes, since the Day 111 formula is only a rough guideline rather than an exact predictor'
      - 'Gradient descent diverges: the coefficients grow without bound and stop being finite numbers within a few thousand iterations'
    answer_index: 3
    explanation: >-
      Measured directly: at 80 percent of the threshold, gradient descent converges to 1e-9 agreement
      with the closed form in exactly 7132 iterations. At 102 percent of the threshold, it diverges --
      the coefficients become non-finite within 20,000 iterations. The formula is not a rough
      guideline here; it predicts the exact boundary between the two regimes, because it comes directly
      from the eigenvalues of the actual loss surface being optimized, not from a heuristic.
  - question: >-
      The same gradient-descent setup, run on the RAW (unscaled) diabetes features instead of the
      standardized ones, has a Hessian eigenvalue ratio of 76278.96 against 470.08 standardized -- over
      a hundred times worse. At 95 percent of its OWN stability threshold, after 200,000 iterations it
      still has not reached even one decimal place of agreement with the closed form. Why doesn't a
      learning rate chosen specifically for the raw features' own threshold fix this?
    options:
      - 'The threshold calculation is wrong for unscaled data and needs a correction factor'
      - 'The stability threshold only prevents divergence in the direction of the LARGEST eigenvalue; convergence speed in the direction of the SMALLEST eigenvalue is governed by a different, much slower rate'
      - '200,000 iterations is simply not enough for any dataset; a million would have converged'
      - 'Raw features cannot be fit by gradient descent at all, regardless of learning rate'
    answer_index: 1
    explanation: >-
      The largest eigenvalue sets the divergence boundary -- exceed it and the loss blows up. But
      the SLOWEST direction to converge is governed by the SMALLEST eigenvalue, and the condition
      number (their ratio) determines how many iterations that slow direction needs. A learning rate
      near the largest-eigenvalue threshold is stable everywhere, but progress along the
      smallest-eigenvalue direction crawls when that ratio is 76278.96 rather than 470.08. This is
      Day 111's condition number arriving exactly where it bites, and it is why standardizing features
      before gradient descent is standard practice rather than a nicety.
  - question: >-
      The closed-form solve on the diabetes shape costs 54,813 multiply-add operations (forming X'X
      plus solving it). Gradient descent, for the 7291 iterations needed to reach 9-decimal agreement,
      costs 64,452,440 -- about 1176 times more. Why does the lesson count operations rather than
      timing the two approaches?
    options:
      - 'Timing figures depend on the specific machine, CPU load, and hardware they were measured on, so they are excluded from the byte-compared measurement report and would be flaky evidence for anyone reading this on a different machine'
      - 'Timing is simply more difficult to implement correctly than counting operations'
      - 'Operation counts are always a more accurate measure of real-world speed than wall-clock time'
      - 'The two approaches actually run in identical wall-clock time on any modern machine, so timing would show nothing'
    answer_index: 0
    explanation: >-
      A number derived from a formula -- n*p^2 + p^3 against 2*n*p*iterations -- is exactly
      reproducible on any machine, in any year, regardless of CPU speed, thermal throttling, or what
      else is running. A wall-clock timing is not: it is a fact about one run on one machine at one
      moment, and asserting on it produces a test that is flaky everywhere else. Operation counts are
      not claimed to be a perfect proxy for real-world speed (cache behavior, vectorization and
      parallelism all matter in practice) -- they are claimed to be the honest, reproducible thing to
      measure and report here.
  - question: >-
      OLSRegressor inherits BaseEstimator and RegressorMixin. Day 146 already measured why a
      from-scratch estimator needs that inheritance. What was that measured reason?
    options:
      - 'Without it, fit() and predict() raise a TypeError immediately when first called'
      - 'Without it, the estimator cannot be pickled or saved to disk'
      - 'Without it, NumPy refuses to accept the estimator''s output as a valid array'
      - 'Without it, cross_val_score and Pipeline.predict() raise AttributeError on __sklearn_tags__, a method only BaseEstimator supplies, even though fit(), predict() and score() all work perfectly well called directly'
    answer_index: 3
    explanation: >-
      Day 146's centrepiece measurement: fit(), predict() and score() work fine on a hand-built
      estimator with no inheritance at all -- called directly, nothing breaks. The failure appears
      specifically inside scikit-learn's own machinery (Pipeline.predict() and cross_val_score), which
      checks for a method named __sklearn_tags__ that only BaseEstimator supplies. This lesson assumes
      that measurement rather than re-deriving it, and builds OLSRegressor with the inheritance from
      the start for exactly that reason.
  - question: >-
      sklearn.utils.estimator_checks.check_estimator runs 52 checks against OLSRegressor. 48 pass, and
      2 fail by name: check_n_features_in_after_fitting and check_dtype_object. What do those two
      failures indicate about this from-scratch implementation?
    options:
      - 'The estimator does not perform certain input-validation steps that scikit-learn''s own estimators perform: checking a new prediction''s feature count matches training, and rejecting malformed dtypes with a clear error rather than letting an ambiguous failure occur later'
      - 'The core fitting mathematics -- the coefficients OLSRegressor computes -- is wrong in some cases'
      - 'The estimator is fundamentally incompatible with scikit-learn and cannot be used in a Pipeline at all'
      - 'These two failures are false positives caused by a bug in check_estimator itself'
    answer_index: 0
    explanation: >-
      Both failures are about input validation, not about the fitting mathematics -- OLSRegressor's
      coefficients agree with sklearn's LinearRegression to within 1e-8 or better across all three
      fitting methods. check_n_features_in_after_fitting checks that predict() rejects data with the
      wrong number of columns; check_dtype_object checks that malformed input produces a clear error
      rather than an obscure downstream failure. Both are real, honestly reported gaps in this
      implementation''s robustness -- not evidence against the 48 checks that DO pass, and not a reason
      to suppress or hide the two that do not.
