<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="d153a-title d153a-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d153a-title">Ordinary least squares, fit three ways, all measured against sklearn</title>
  <desc id="d153a-desc">A design matrix feeds three separate fitting routes -- the normal equations, an lstsq-based solve, and gradient descent -- each producing coefficients compared against scikit-learn's own LinearRegression. A bottom panel shows the near-duplicate-column case where two of the three routes explode.</desc>

  <style>
    .d153a-bg { fill: #f8fafc; }
    .d153a-box { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; }
    .d153a-box-alt { fill: #e0e7ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; }
    .d153a-warn { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; rx: 8; }
    .d153a-safe { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; rx: 8; }
    .d153a-title-text { fill: #1a202c; font-size: 22px; font-weight: 700; }
    .d153a-h { fill: #1a202c; font-size: 16px; font-weight: 700; }
    .d153a-t { fill: #1a202c; font-size: 14px; }
    .d153a-t-small { fill: #1a202c; font-size: 13px; }
    .d153a-mono { fill: #1a202c; font-size: 13px; font-family: "SF Mono", "Menlo", monospace; }
    .d153a-wire { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#d153a-arrow); }
    .d153a-wire-warn { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#d153a-arrow-warn); }
  </style>

  <defs>
    <marker id="d153a-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8" />
    </marker>
    <marker id="d153a-arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="d153a-bg" x="0" y="0" width="1000" height="760" />
  <text x="500" y="34" text-anchor="middle" class="d153a-title-text">Ordinary least squares, fit three ways</text>
  <text x="500" y="56" text-anchor="middle" class="d153a-t-small">Design matrix X (442 rows, 10 columns) -- diabetes dataset</text>

  <!-- input box -->
  <rect class="d153a-box-alt" x="400" y="72" width="200" height="42" rx="8" />
  <text x="500" y="98" text-anchor="middle" class="d153a-h">X, y</text>

  <!-- three wires down -->
  <path class="d153a-wire" d="M 460 114 L 175 150" />
  <path class="d153a-wire" d="M 500 114 L 500 150" />
  <path class="d153a-wire" d="M 540 114 L 825 150" />

  <!-- Column A: normal equations -->
  <rect class="d153a-box" x="35" y="150" width="280" height="56" rx="8" />
  <text x="175" y="172" text-anchor="middle" class="d153a-h">A. Normal equations</text>
  <text x="175" y="192" text-anchor="middle" class="d153a-mono">solve(X'X, X'y)</text>

  <path class="d153a-wire" d="M 175 206 L 175 236" />
  <rect class="d153a-box" x="35" y="236" width="280" height="66" rx="8" />
  <text x="175" y="258" text-anchor="middle" class="d153a-t">forms X'X: squares the</text>
  <text x="175" y="276" text-anchor="middle" class="d153a-t">condition number</text>
  <text x="175" y="294" text-anchor="middle" class="d153a-mono">227.22 -&gt; 51631.11</text>

  <path class="d153a-wire" d="M 175 302 L 175 332" />
  <rect class="d153a-box" x="35" y="332" width="280" height="56" rx="8" />
  <text x="175" y="354" text-anchor="middle" class="d153a-t">gap from sklearn</text>
  <text x="175" y="374" text-anchor="middle" class="d153a-mono">max |diff| = 1.2153e-10</text>

  <!-- Column B: lstsq -->
  <rect class="d153a-box" x="360" y="150" width="280" height="56" rx="8" />
  <text x="500" y="172" text-anchor="middle" class="d153a-h">B. lstsq</text>
  <text x="500" y="192" text-anchor="middle" class="d153a-mono">numpy.linalg.lstsq(X, y)</text>

  <path class="d153a-wire" d="M 500 206 L 500 236" />
  <rect class="d153a-box" x="360" y="236" width="280" height="66" rx="8" />
  <text x="500" y="258" text-anchor="middle" class="d153a-t">factors X directly:</text>
  <text x="500" y="276" text-anchor="middle" class="d153a-t">never forms X'X</text>
  <text x="500" y="294" text-anchor="middle" class="d153a-mono">no squared conditioning</text>

  <path class="d153a-wire" d="M 500 302 L 500 332" />
  <rect class="d153a-safe" x="360" y="332" width="280" height="56" rx="8" />
  <text x="500" y="354" text-anchor="middle" class="d153a-t">gap from sklearn</text>
  <text x="500" y="374" text-anchor="middle" class="d153a-mono">max |diff| = 1.1990e-12 (~101x closer)</text>

  <!-- Column C: gradient descent -->
  <rect class="d153a-box" x="685" y="150" width="280" height="56" rx="8" />
  <text x="825" y="172" text-anchor="middle" class="d153a-h">C. Gradient descent</text>
  <text x="825" y="192" text-anchor="middle" class="d153a-mono">coef -= eta * grad, looped</text>

  <path class="d153a-wire" d="M 825 206 L 825 236" />
  <rect class="d153a-box" x="685" y="236" width="280" height="66" rx="8" />
  <text x="825" y="258" text-anchor="middle" class="d153a-t">standardized features,</text>
  <text x="825" y="276" text-anchor="middle" class="d153a-t">eta = 0.2 (80% of threshold)</text>
  <text x="825" y="294" text-anchor="middle" class="d153a-mono">7291 iterations to 9 decimals</text>

  <path class="d153a-wire" d="M 825 302 L 825 332" />
  <rect class="d153a-box" x="685" y="332" width="280" height="56" rx="8" />
  <text x="825" y="354" text-anchor="middle" class="d153a-t">gap from sklearn</text>
  <text x="825" y="374" text-anchor="middle" class="d153a-mono">max |diff| = 4.38e-11</text>

  <!-- all three converge to the referee -->
  <path class="d153a-wire" d="M 175 388 L 460 432" />
  <path class="d153a-wire" d="M 500 388 L 500 432" />
  <path class="d153a-wire" d="M 825 388 L 540 432" />

  <rect class="d153a-box-alt" x="360" y="432" width="280" height="54" rx="8" />
  <text x="500" y="454" text-anchor="middle" class="d153a-h">sklearn LinearRegression</text>
  <text x="500" y="474" text-anchor="middle" class="d153a-t-small">the referee every route is measured against</text>

  <!-- dramatic case panel -->
  <path class="d153a-wire" d="M 500 486 L 500 516" />
  <rect class="d153a-warn" x="60" y="516" width="880" height="200" rx="10" />
  <text x="500" y="546" text-anchor="middle" class="d153a-h">The dramatic case: one near-duplicate column</text>
  <text x="500" y="568" text-anchor="middle" class="d153a-t-small">100 rows, 3 random columns plus a 4th equal to column 0 plus 1e-7 noise; true coefficients [1, 2, 3, 4]</text>

  <rect class="d153a-box" x="90" y="586" width="250" height="106" rx="8" />
  <text x="215" y="608" text-anchor="middle" class="d153a-h">Normal equations</text>
  <text x="215" y="630" text-anchor="middle" class="d153a-mono">196747.976</text>
  <text x="215" y="650" text-anchor="middle" class="d153a-mono">-196742.975</text>
  <text x="215" y="674" text-anchor="middle" class="d153a-t-small">explodes, opposite signs</text>

  <rect class="d153a-box" x="375" y="586" width="250" height="106" rx="8" />
  <text x="500" y="608" text-anchor="middle" class="d153a-h">lstsq</text>
  <text x="500" y="630" text-anchor="middle" class="d153a-mono">207112.776</text>
  <text x="500" y="650" text-anchor="middle" class="d153a-mono">-207107.775</text>
  <text x="500" y="674" text-anchor="middle" class="d153a-t-small">explodes too</text>

  <rect class="d153a-safe" x="660" y="586" width="250" height="106" rx="8" />
  <text x="785" y="608" text-anchor="middle" class="d153a-h">sklearn</text>
  <text x="785" y="630" text-anchor="middle" class="d153a-mono">2.501</text>
  <text x="785" y="650" text-anchor="middle" class="d153a-mono">2.501</text>
  <text x="785" y="674" text-anchor="middle" class="d153a-t-small">splits the weight evenly</text>

  <text x="500" y="740" text-anchor="middle" class="d153a-t-small">Every route solves the least-squares problem correctly. Only one of the three stays numerically sane at this conditioning.</text>
</svg>
