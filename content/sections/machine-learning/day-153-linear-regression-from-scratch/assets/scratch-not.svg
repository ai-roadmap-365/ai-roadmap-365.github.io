<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Commonly assumed otherwise.">
  <title>Four things this exercise is not</title>
  <style>
    .scratch-not-bg   { fill: #f8fafc; }
    .scratch-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scratch-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scratch-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scratch-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scratch-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scratch-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scratch-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scratch-not-row { opacity: 1; }
    .scratch-not-r0 { animation-delay: 0.00s; }
    .scratch-not-r1 { animation-delay: 0.45s; }
    .scratch-not-r2 { animation-delay: 0.90s; }
    .scratch-not-r3 { animation-delay: 1.35s; }
    .scratch-not-r4 { animation-delay: 1.80s; }
    .scratch-not-row { animation: scratch-not-reveal 7.3s ease-in-out infinite; }
    @keyframes scratch-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scratch-not-bg" width="980" height="390"/>
  <text class="scratch-not-h1"  x="30" y="40">Four things this exercise is not</text>
  <text class="scratch-not-sub" x="30" y="64">Commonly assumed otherwise.</text>
  <rect class="scratch-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-not-name" x="46" y="122">The misconception</text>
  <text class="scratch-not-desc" x="46" y="142">Commonly held.</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r0" x="46" y="182">The textbook formula is what libraries use</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r1" x="46" y="216">Mathematically identical means numerically identical</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r2" x="46" y="250">A duplicated column raises an error</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r3" x="46" y="284">Numerical issues are edge cases</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r4" x="46" y="318">Writing it yourself is for learning only</text>
  <rect class="scratch-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scratch-not-name" x="526" y="122">What is true</text>
  <text class="scratch-not-desc" x="526" y="142">Actually.</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r0" x="526" y="182">They decompose instead, deliberately</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r1" x="526" y="216">It does not; the difference was measured</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r2" x="526" y="250">Rounding leaves it just shy of singular</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r3" x="526" y="284">Near-duplicate columns are common in real data</text>
  <text class="scratch-not-desc scratch-not-row scratch-not-r4" x="526" y="318">It tells you when to distrust a result</text>
  <text class="scratch-not-sub" x="30" y="372">The third row was checked rather than assumed and the documentation corrected: the expected exception does not occur, because floating point leaves the matrix not quite singular.</text>
</svg>
