slug: linear-regression-from-scratch
title: 'Linear Regression from Scratch'
section: machine-learning
subsection: core-concepts
week: 22
learning_promise: >-
  After this lesson you will have built ordinary least squares three ways -- the normal equations,
  an lstsq-based solve, and gradient descent -- and measured exactly what a good library was doing
  for you that the textbook formula does not. You will watch a design matrix with one near-duplicate
  column send the normal-equation and lstsq coefficients to plus and minus two hundred thousand while
  scikit-learn's own LinearRegression stays at 2.5 and 2.5, and you will measure why: cond(X'X) is
  exactly the square of cond(X), confirmed to ten decimal places on well-conditioned data and measured
  to degrade under extreme ill-conditioning on the dramatic case. You will apply Day 111's gradient-
  descent stability condition to a real Hessian's eigenvalues and predict, to the decimal, the learning
  rate at which convergence turns into divergence -- then measure gradient descent struggling for
  200,000 iterations on badly scaled raw features where it converges in thousands on standardized
  ones. You will count operations rather than time them, and find the closed form needs about a
  thousand times fewer multiply-adds than gradient descent needs to match it. You will build a
  scikit-learn-compatible estimator, citing Day 146's measured reason for inheriting BaseEstimator
  rather than re-deriving the contract, and run the real check_estimator suite against it -- reporting
  48 of 52 checks passing and naming the two that do not.
objectives:
  - 'Implement ordinary least squares via the normal equations, an lstsq-based solve, and batch gradient descent, from first principles'
  - 'Explain why cond(X''X) is exactly the square of cond(X), and state the textbook consequence for numerical precision'
  - 'Construct a design matrix on which the normal equations and lstsq both fail while a library implementation does not, and explain the mechanism'
  - 'Apply Day 111''s stability condition, |1 - eta * a| < 1, to a measured Hessian''s eigenvalues to predict a gradient-descent divergence boundary exactly'
  - 'Measure how badly scaled features multiply a Hessian''s condition number, and connect the resulting slowdown to Day 111''s material rather than treating it as a new fact'
  - 'Count the operations a closed-form solve and an iterative method use, and state when each is the right choice as a function of problem shape'
  - 'Build a scikit-learn-compatible estimator by inheriting BaseEstimator and RegressorMixin, citing Day 146''s measured requirement rather than re-deriving it'
  - 'Run sklearn.utils.estimator_checks.check_estimator against a from-scratch estimator and report a real pass/fail count by name, without suppressing failures'
  - 'Compare two implementations of fit_intercept -- centring versus an appended column of ones -- and confirm they agree to measured precision'
  - 'Distinguish a genuinely singular design matrix from a merely ill-conditioned one, and state why lstsq degrades more gracefully than the normal equations at both'
  - 'Recognise multicollinearity, introduced structurally on Day 150, as the same phenomenon this lesson measures numerically at the level of floating-point arithmetic'
  - 'Explain, with a measured example, why a library''s default solver choice is a numerical-stability decision and not an arbitrary implementation detail'
prerequisites:
  - 'Day 111 -- gradient descent, its update rule, learning-rate regimes from |1 - eta a|, and the condition number as the ratio of the Hessian''s eigenvalues; none of that is re-derived here'
  - 'Day 146 -- the scikit-learn estimator API contract and the measured requirement that a from-scratch estimator inherit BaseEstimator to survive Pipeline.predict() and cross_val_score'
  - 'Day 148 -- the one-predictor model and what a fitted coefficient means'
  - 'Day 149 -- the loss function and where the normal equations come from'
  - 'Day 150 -- many predictors and multicollinearity, which this lesson measures as a numerical-precision problem rather than a purely statistical one'
  - 'Comfort with NumPy arrays, matrix multiplication, and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
