visuals:
  - id: three-ways-to-ols-architecture
    file: assets/three-ways-to-ols-architecture.svg
    type: diagram
    title: >-
      Ordinary least squares fit three ways -- the normal equations, lstsq and gradient descent -- each
      measured against scikit-learn's own LinearRegression, with the near-duplicate-column case beneath
    alt: >-
      Diagram: a design matrix X feeds three parallel fitting routes. Column A, the normal equations,
      forms X transpose X, squaring the condition number from 227.22 to 51631.11, then solves it, landing
      1.2153e-10 from sklearn. Column B, lstsq, factors X directly without squaring the condition number,
      landing 1.1990e-12 from sklearn, about a hundred times closer. Column C, gradient descent on
      standardized features at a learning rate of 0.2, needs 7291 iterations to land 4.38e-11 from
      sklearn. All three converge on a box labelled sklearn LinearRegression, the referee. Below, a
      highlighted panel shows the dramatic case: a hundred rows with a near-duplicate fourth column and
      true coefficients 1, 2, 3, 4. The normal equations produce 196747.976 and negative 196742.975 for
      the duplicated pair; lstsq produces 207112.776 and negative 207107.775; sklearn produces 2.501 and
      2.501, splitting the shared weight evenly. A caption states every route solves the least-squares
      problem correctly, but only one stays numerically sane at this conditioning
    description: >-
      A static architecture diagram. A design-matrix input box at the top feeds three parallel columns.
      Column A (normal equations) shows the two-step pipeline of forming X transpose X -- annotated with
      the measured condition-number squaring, 227.22 to 51631.11 -- then solving it, with a result box
      reporting a maximum gap from sklearn of 1.2153e-10. Column B (lstsq) shows a single direct-factor
      step annotated as never forming X transpose X, with a result box in green reporting a gap of
      1.1990e-12, roughly a hundred times closer. Column C (gradient descent) shows an iterative loop
      annotated with the learning rate (0.2, eighty percent of the Day 111 stability threshold) and the
      measured iteration count for nine-decimal agreement (7291), with a result box reporting a gap of
      4.38e-11. All three columns' result boxes feed arrows converging on a single box labelled sklearn
      LinearRegression, described as the referee every route is measured against. Below that, a large
      red-tinted panel titled "the dramatic case" describes the near-duplicate-column construction (a
      hundred rows, three random columns plus a fourth equal to the first plus a sliver of noise, true
      coefficients 1, 2, 3, 4) and shows three result cards side by side: the normal equations' exploded
      pair in red, lstsq's similarly exploded pair in red, and sklearn's sane 2.501/2.501 pair in green.
      A closing caption states that every method solves the least-squares problem correctly and that only
      one of the three stays numerically sane at this level of conditioning.
  - id: stability-threshold-flow
    file: assets/stability-threshold-flow.svg
    type: flow-animated
    title: >-
      Gradient descent below and above the Day 111 stability threshold, converging in one lane and
      diverging in the other from the same update rule
    alt: >-
      Diagram: two lanes share one gradient-descent update rule. The top, green lane is labelled a
      learning rate of 0.1988, eighty percent of the stability threshold, and states it converges: a
      dashed spiral curves inward toward a target point labelled the closed-form target, and a travelling
      dot follows that spiral inward, reaching the target after what the caption states is exactly 7132
      iterations. The bottom, red lane is labelled a learning rate of 0.2535, one hundred two percent of
      the same threshold, and states it diverges: a dashed spiral curves outward, growing with each loop,
      and a travelling dot follows it outward and off the frame, labelled leaves the frame as infinity or
      not a number, within 20000 iterations. A closing caption states that only the learning rate changed
      between the two lanes, and that the Day 111 formula predicts exactly which lane a given rate falls
      into
    description: >-
      An animated flow diagram with two stacked lanes sharing the same visual language. The top lane,
      tinted green, is labelled with a learning rate of 0.1988 -- eighty percent of the measured Day 111
      stability threshold of 0.2485 -- and the word converges. A dashed, marching-ants spiral path curves
      inward from an outer starting point toward a fixed blue target dot labelled the closed-form target,
      and a green circular token travels along that same path on a seven-second loop, animating from the
      outside in and settling near the target before the loop restarts; a caption states the real
      measured iteration count, 7132, for reaching 1e-9 agreement. The bottom lane, tinted red, is
      labelled with a learning rate of 0.2535 -- just over the same threshold -- and the word diverges. A
      mirrored dashed spiral curves outward from the same target point, growing wider with each loop, and
      a red token travels outward along it on the same seven-second loop, leaving the visible frame near
      a label reading "leaves the frame: inf / nan"; a caption states the real measured fact that the
      coefficients become non-finite within 20,000 iterations. Both spirals continue their marching-ants
      motion throughout, and a closing caption beneath both lanes states that only the learning rate
      differs between them and that the Day 111 formula predicts exactly which lane a given rate falls
      into. A prefers-reduced-motion block disables all motion, freezes both marching dashes into solid
      lines, and places both tokens at the end of their paths -- next to the target in the top lane and
      off-frame in the bottom lane -- so the still frame still shows one settled and one departed token.
