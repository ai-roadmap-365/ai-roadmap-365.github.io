<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="ColumnTransformer Branching Flow">
  <title>ColumnTransformer Branching Flow</title>
  <defs>
    <style>
      .d173f-bg { fill: #f8fafc; }
      .d173f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d173f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .d173f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d173f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d173f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d173f-arr); fill: none; }
    </style>
    <marker id="d173f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d173f-bg" />

  <text x="40" y="45" class="d173f-title" font-size="22">ColumnTransformer Heterogeneous Routing Workflow</text>
  <text x="40" y="70" class="d173f-text">Parallel Processing of Numerical and Categorical Features with Horizontal Matrix Concatenation</text>

  <!-- Left: Raw Input DataFrame -->
  <rect x="40" y="110" width="220" height="320" class="d173f-card" />
  <text x="60" y="140" class="d173f-title" fill="#0f172a">Raw Tabular Matrix X</text>
  <text x="60" y="170" class="d173f-math">• Col 0: Income ($)</text>
  <text x="60" y="195" class="d173f-math">• Col 1: Age (Years)</text>
  <text x="60" y="220" class="d173f-math">• Col 2: Country (Str)</text>
  <text x="60" y="245" class="d173f-math">• Col 3: Education (Str)</text>
  <text x="60" y="280" class="d173f-text">Shape: (N, 4)</text>
  <text x="60" y="310" class="d173f-text">Heterogeneous data types requiring tailored math.</text>

  <!-- Routing Arrows -->
  <path d="M 260 180 L 330 150" class="d173f-arrow" />
  <path d="M 260 230 L 330 300" class="d173f-arrow" />

  <!-- Top Branch: Numerical -->
  <rect x="330" y="110" width="260" height="130" class="d173f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="350" y="135" class="d173f-title" fill="#1d4ed8">Branch A: Numerical [0, 1]</text>
  <text x="350" y="160" class="d173f-math">1. SimpleImputer(median)</text>
  <text x="350" y="185" class="d173f-math">2. StandardScaler()</text>
  <text x="350" y="215" class="d173f-text">Output Shape: (N, 2) Dense Float</text>

  <!-- Bottom Branch: Categorical -->
  <rect x="330" y="270" width="260" height="130" class="d173f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="350" y="295" class="d173f-title" fill="#15803d">Branch B: Categorical [2, 3]</text>
  <text x="350" y="320" class="d173f-math">1. SimpleImputer(most_frequent)</text>
  <text x="350" y="345" class="d173f-math">2. OneHotEncoder(ignore_unknown)</text>
  <text x="350" y="375" class="d173f-text">Output Shape: (N, 12) Binary Vector</text>

  <!-- Joining Arrows -->
  <path d="M 590 175 L 660 240" class="d173f-arrow" />
  <path d="M 590 335 L 660 260" class="d173f-arrow" />

  <!-- Right: Merged Output Matrix -->
  <rect x="660" y="180" width="200" height="160" class="d173f-card" fill="#fefce8" stroke="#eab308" />
  <text x="680" y="210" class="d173f-title" fill="#a16207">Concatenated Output</text>
  <text x="680" y="240" class="d173f-math">np.hstack([ A, B ])</text>
  <text x="680" y="270" class="d173f-text">• Total Features: 14</text>
  <text x="680" y="295" class="d173f-text">• Dense / Sparse Array</text>
  <text x="680" y="320" class="d173f-math" fill="#a16207">Ready for Estimator!</text>
</svg>
