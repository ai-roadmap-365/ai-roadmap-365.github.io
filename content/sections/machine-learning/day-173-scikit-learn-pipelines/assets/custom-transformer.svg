<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four requirements.">
  <title>Writing a custom transform</title>
  <style>
    .custom-transformer-bg   { fill: #f8fafc; }
    .custom-transformer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-transformer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-transformer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-transformer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-transformer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .custom-transformer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .custom-transformer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .custom-transformer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .custom-transformer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .custom-transformer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .custom-transformer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .custom-transformer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .custom-transformer-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .custom-transformer-stage { opacity: 1; }

    .custom-transformer-s0 { animation-delay: 0.00s; }
    .custom-transformer-e0 { animation-delay: 0.00s; }
    .custom-transformer-s1 { animation-delay: 1.28s; }
    .custom-transformer-e1 { animation-delay: 1.28s; }
    .custom-transformer-s2 { animation-delay: 2.56s; }
    .custom-transformer-e2 { animation-delay: 2.56s; }
    .custom-transformer-s3 { animation-delay: 3.84s; }
    .custom-transformer-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .custom-transformer-conn  { animation: custom-transformer-trace 6.4s ease-in-out infinite; }
      .custom-transformer-stage { animation: custom-transformer-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes custom-transformer-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes custom-transformer-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .custom-transformer-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .custom-transformer-stage { animation: custom-transformer-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes custom-transformer-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="custom-transformer-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="custom-transformer-bg" width="980" height="322"/>
  <text class="custom-transformer-h1"  x="30" y="40">Writing a custom transform</text>
  <text class="custom-transformer-sub" x="30" y="64">Four requirements.</text>
  <g class="custom-transformer-stage custom-transformer-s0">
    <rect class="custom-transformer-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="custom-transformer-step" x="44" y="142">01</text>
    <text class="custom-transformer-name" x="70" y="142">A fit method that learns and stores statistics</text>
    <text class="custom-transformer-desc" x="44" y="166">And returns itself.</text>
  </g>
  <line class="custom-transformer-line custom-transformer-conn custom-transformer-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#custom-transformer-tip)"/>
  <g class="custom-transformer-stage custom-transformer-s1">
    <rect class="custom-transformer-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="custom-transformer-step" x="280" y="142">02</text>
    <text class="custom-transformer-name" x="306" y="142">A transform method that applies them</text>
    <text class="custom-transformer-desc" x="280" y="166">Learning nothing new.</text>
  </g>
  <line class="custom-transformer-line custom-transformer-conn custom-transformer-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#custom-transformer-tip)"/>
  <g class="custom-transformer-stage custom-transformer-s2">
    <rect class="custom-transformer-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="custom-transformer-step" x="516" y="142">03</text>
    <text class="custom-transformer-name" x="542" y="142">Constructor parameters stored unmodified</text>
    <text class="custom-transformer-desc" x="516" y="166">So the object can be cloned and</text>
    <text class="custom-transformer-desc" x="516" y="182">tuned.</text>
  </g>
  <line class="custom-transformer-line custom-transformer-conn custom-transformer-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#custom-transformer-tip)"/>
  <g class="custom-transformer-stage custom-transformer-s3">
    <rect class="custom-transformer-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="custom-transformer-step" x="752" y="142">04</text>
    <text class="custom-transformer-name" x="778" y="142">And it composes with everything else</text>
    <text class="custom-transformer-desc" x="752" y="166">Grid search, serialisation,</text>
    <text class="custom-transformer-desc" x="752" y="182">nested pipelines.</text>
  </g>
  <text class="custom-transformer-sub" x="30" y="304">The rule that transform learns nothing is the contract that makes leakage impossible: any statistic computed there would be computed on validation data too.</text>
</svg>
