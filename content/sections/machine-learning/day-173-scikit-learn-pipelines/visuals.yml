visuals:
  - id: sklearn-pipeline-architecture
    file: assets/sklearn-pipeline-architecture.svg
    type: diagram
    title: 'Atomic Scikit-Learn Pipeline Architecture'
    alt: 'Architecture diagram showing raw data passing through ColumnTransformer branches, feature union, and final estimator.'
    description: 'A static architecture diagram illustrating the end-to-end flow of raw data through composite scikit-learn preprocessing and model objects.'
  - id: columntransformer-branching-flow
    file: assets/columntransformer-branching-flow.svg
    type: flow-animated
    title: 'ColumnTransformer Heterogeneous Branch Routing Flow'
    alt: 'Animated flow chart showing numerical columns routed to OutlierClipper and StandardScaler, and categorical columns routed to OneHotEncoder.'
    description: 'An animated flow chart demonstrating the parallel execution and horizontal concatenation of heterogeneous feature branches in ColumnTransformer.'
  - id: pipeline-idea
    file: assets/pipeline-idea.svg
    type: diagram
    title: 'What a pipeline is'
    alt: 'Diagram: the four properties of a machine learning pipeline object'
    description: 'A four-stage description of pipelines covering the chained steps, the fit rule, the single object and serialisation.'
  - id: pipeline-lifecycle
    file: assets/pipeline-lifecycle.svg
    type: diagram
    title: 'How a pipeline runs'
    alt: 'Diagram: how fit and transform propagate through a pipeline'
    description: 'A four-stage description of pipeline execution covering fitting each step, passing output forward, the final estimator and prediction.'
  - id: column-transformer
    file: assets/column-transformer.svg
    type: diagram
    title: 'Different transforms per column'
    alt: 'Diagram: how different preprocessing is applied to different column groups'
    description: 'A four-stage description of column-wise transformation covering the mixed types, the grouping, parallel transforms and recombination.'
  - id: custom-transformer
    file: assets/custom-transformer.svg
    type: diagram
    title: 'Writing a custom transform'
    alt: 'Diagram: the four requirements of a custom pipeline transformer'
    description: 'A four-stage description of the transformer contract covering fit, transform, statelessness at predict and parameter exposure.'
  - id: nested-tuning
    file: assets/nested-tuning.svg
    type: diagram
    title: 'Tuning across the whole pipeline'
    alt: 'Diagram: how hyperparameter search spans preprocessing and model together'
    description: 'A four-stage description of pipeline tuning covering the naming syntax, the joint search space, per-fold refitting and the combination effect.'
  - id: pipeline-not
    file: assets/pipeline-not.svg
    type: diagram
    title: 'What a pipeline is not'
    alt: 'Diagram: four misconceptions about pipelines'
    description: 'A two-column comparison of misconceptions about pipelines against what is true.'
  - id: pipeline-history
    file: assets/pipeline-history.svg
    type: diagram
    title: 'Four steps toward pipelines'
    alt: 'Diagram: the historical progression of preprocessing organisation'
    description: 'A four-stage description of pipeline history covering scripts, functions, pipeline objects and feature stores.'
  - id: assembly-line
    file: assets/assembly-line.svg
    type: diagram
    title: 'A fixed assembly line'
    alt: 'Diagram: independent workstations compared with a fixed assembly line'
    description: 'A two-column comparison of loose workstations against a fixed line.'
  - id: pipeline-implications
    file: assets/pipeline-implications.svg
    type: diagram
    title: 'Four consequences of pipelines'
    alt: 'Diagram: the leakage, reproducibility, deployment and tuning implications of pipelines'
    description: 'A four-stage description of pipeline implications covering leakage prevention, reproducibility, deployment safety and joint tuning.'
  - id: pipeline-when
    file: assets/pipeline-when.svg
    type: diagram
    title: 'When to use a pipeline'
    alt: 'Diagram: when a pipeline is warranted'
    description: 'A two-column comparison of situations warranting a pipeline against the rare exceptions.'
