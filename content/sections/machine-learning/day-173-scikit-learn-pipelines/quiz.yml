questions:
  - question: 'Why is using an atomic scikit-learn Pipeline strictly superior to applying preprocessing transformations as loose procedural scripts?'
    options:
      - 'Pipelines prevent data leakage during cross-validation by fitting scalers strictly on training folds, ensure identical preprocessing during production inference, and allow tuning preprocessing and model hyperparameters jointly'
      - 'Pipelines automatically convert Python code to C++ for a 1000x speedup'
      - 'Pipelines eliminate the need for training data'
      - 'Pipelines only work on GPU clusters'
    answer_index: 0
    explanation: 'Pipelines encapsulate the entire feature transformation and estimation lifecycle into a single atomic object, eliminating manual preprocessing leakage and ensuring seamless deployment.'

  - question: 'What is the strict constructor (__init__) rule for custom transformers inheriting from BaseEstimator?'
    options:
      - '__init__ must accept only explicit keyword arguments matching internal attributes exactly (self.param = param), without *args, **kwargs, or internal parameter mutation, ensuring compatibility with clone() and get_params()'
      - '__init__ must never take any arguments'
      - '__init__ must immediately fit the model on data'
      - '__init__ must delete all temporary files'
    answer_index: 0
    explanation: 'Scikit-learn inspects transformer signatures via get_params() to clone estimators. Any mismatch or variable-length argument breaks GridSearchCV and cross_val_score.'

  - question: 'What does ColumnTransformer do in a machine learning preprocessing graph?'
    options:
      - 'It routes different subsets of columns (e.g. numerical indices vs categorical indices) to independent preprocessing pipelines in parallel and concatenates the resulting transformed matrices horizontally'
      - 'It drops all columns with missing values'
      - 'It rotates a matrix by 90 degrees'
      - 'It converts pandas DataFrames into SQL tables'
    answer_index: 0
    explanation: 'ColumnTransformer enables heterogeneous tabular preprocessing: scaling numerical columns while one-hot encoding or target encoding categorical columns simultaneously.'

  - question: 'How do you specify a nested hyperparameter grid in GridSearchCV for a parameter inside a Pipeline named "preprocessor" with a step named "scaler" and parameter "with_mean"?'
    options:
      - "'preprocessor__scaler__with_mean': [True, False] using double underscores to traverse composite step hierarchies"
      - "'preprocessor.scaler.with_mean': [True, False]"
      - "'with_mean': [True, False]"
      - "'preprocessor->scaler->with_mean': [True, False]"
    answer_index: 0
    explanation: 'Scikit-learn uses double underscores (step__substep__param) to navigate nested pipeline parameter trees in GridSearchCV and RandomizedSearchCV.'

  - question: 'What does TransformerMixin provide when inherited by a custom class?'
    options:
      - 'It automatically implements fit_transform(X, y) by calling self.fit(X, y).transform(X)'
      - 'It adds GPU support'
      - 'It compiles Python to machine code'
      - 'It generates unit tests'
    answer_index: 0
    explanation: 'TransformerMixin provides a standardized, boilerplate-free implementation of fit_transform() that calls fit() followed by transform().'

  - question: 'What is the purpose of FunctionTransformer in scikit-learn?'
    options:
      - 'To wrap arbitrary stateless Python functions (e.g. np.log1p, np.sqrt, custom domain formulas) into a standard scikit-learn transformer interface'
      - 'To create neural network activation functions'
      - 'To speed up mathematical functions using multithreading'
      - 'To define Python lambdas inside Jupyter cells'
    answer_index: 0
    explanation: 'FunctionTransformer converts stateless mathematical functions into first-class Pipeline steps without requiring a custom class definition.'

  - question: 'What is the difference between ColumnTransformer and FeatureUnion?'
    options:
      - 'ColumnTransformer applies different transformers to distinct, disjoint subsets of columns; FeatureUnion applies multiple transformers to the EXACT SAME full input matrix and concatenates the resulting features'
      - 'ColumnTransformer only works on text data'
      - 'FeatureUnion is deprecated in scikit-learn'
      - 'ColumnTransformer requires GPU execution'
    answer_index: 0
    explanation: 'ColumnTransformer slices columns by index/name. FeatureUnion takes the entire matrix X and runs multiple feature extractors in parallel (e.g. PCA + PolynomialFeatures).'

  - question: 'Why is serializing a complete Pipeline object with joblib.dump() safer in production than serializing loose scaler and model objects separately?'
    options:
      - 'Serializing the unified Pipeline ensures that exact scaler parameters (mean, scale, category dictionaries) are bound immutably to the model weights, preventing train/serve skew'
      - 'Joblib files are encrypted with RSA 4096-bit keys'
      - 'Pipelines produce 100x smaller disk files'
      - 'Loose objects cannot be saved to disk'
    answer_index: 0
    explanation: 'Saving loose objects requires manual coordination during inference. If someone updates the model but forgets the scaler, predictions fail silently. A unified Pipeline guarantees end-to-end consistency.'
