terms:
  - term: 'Scikit-Learn Pipeline'
    definition: 'A sequential chain of data transformers terminating in an estimator that exposes unified fit, transform, and predict methods.'
  - term: 'ColumnTransformer'
    definition: 'A composite transformer that applies distinct preprocessing pipelines to specified column subsets in parallel and concatenates the results.'
  - term: 'FeatureUnion'
    definition: 'A composite transformer that applies multiple transformers to the same input matrix in parallel and horizontally concatenates all generated features.'
  - term: 'BaseEstimator'
    definition: 'The base class for all scikit-learn estimators, providing get_params and set_params parameter introspection for cloning and grid search.'
  - term: 'TransformerMixin'
    definition: 'A mixin class providing the default fit_transform method implementation for transformers.'
  - term: 'FunctionTransformer'
    definition: 'A scikit-learn wrapper converting stateless Python functions into transformer objects compatible with Pipelines.'
  - term: 'Atomic Serialization'
    definition: 'Saving an entire end-to-end feature transformation and modeling graph as a single immutable joblib artifact.'
  - term: 'Train/Serve Skew'
    definition: 'Discrepancies in data preprocessing between training time and live production inference that cause silent model degradation.'
  - term: 'Composite Hyperparameter Tuning'
    definition: 'Simultaneously optimizing feature engineering, scaling, selection, and model parameters in a unified search grid using double-underscore syntax.'
  - term: 'get_feature_names_out'
    definition: 'A scikit-learn API method that tracks and outputs the transformed string names of features passing through complex ColumnTransformer pipelines.'
