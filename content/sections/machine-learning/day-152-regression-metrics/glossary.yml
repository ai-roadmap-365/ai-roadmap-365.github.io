terms:
  - term: Loss
    definition: >-
      What an algorithm minimises while fitting a model, established on Day 149. Distinct from a metric,
      which is what you report afterward to judge the result -- the two need not be the same function,
      and this lesson covers the reporting side.
  - term: Metric
    definition: >-
      What you report after fitting, to judge a model's result. RMSE, MAE, MAPE, R-squared and adjusted
      R-squared are all metrics, and none of them is required to be the function the model was fitted to
      minimise.
  - term: RMSE
    definition: >-
      Root mean squared error -- the square root of the average squared residual. In the target's own
      units. Squares every error before averaging, so one very wrong prediction dominates it: measured
      here moving 11.39 times under a single outlier while MAE moved only 3.00 times.
  - term: MAE
    definition: >-
      Mean absolute error -- the average of the absolute value of every residual. In the target's own
      units. Weighs every error equally, so it is dominated by the typical case rather than by a handful
      of large misses.
  - term: MAPE
    definition: >-
      Mean absolute percentage error -- the average of each residual divided by its true value, expressed
      as a percentage. Undefined at a true value of zero; scikit-learn does not raise or warn there, it
      floors the denominator at machine epsilon and returns a huge, silently wrong number -- measured
      here at roughly 5.6e15.
  - term: R-squared
    definition: >-
      One minus the ratio of a model's sum of squared errors to a constant-mean predictor's sum of
      squared errors. Not bounded below by zero: a deliberately bad predictor measured here scored
      -4.7009. Dimensionless, unlike RMSE and MAE.
  - term: Adjusted R-squared
    definition: >-
      R-squared penalised by the number of predictors used relative to the number of rows. Corrects the
      training-R2 climb at a modest predictor count -- measured falling from 0.5415 to 0.5329 at 20 pure
      noise columns -- but breaks down itself once the predictor count approaches the row count, measured
      climbing back to 0.6104 at 100 noise columns on 331 rows.
  - term: Constant-mean predictor
    definition: >-
      The baseline predictor R-squared is defined relative to -- always guess the training mean.
      Measured here scoring R-squared of -0.0001 on fresh test data, essentially exactly zero by
      construction, which is the fact R-squared's zero point actually represents.
  - term: Training R2 climb
    definition: >-
      The rise in a model's R-squared measured on the same rows it was fit on, as predictors are added,
      regardless of whether those predictors carry any real relationship to the target. Measured here at
      0.5554 to 0.7403 across 0 to 100 pure-noise columns -- not a sign of a better model, a mechanical
      consequence of ordinary least squares.
  - term: Metric ranking inversion
    definition: >-
      When two metrics disagree about which of two models is better, because each weighs the same
      residuals differently. Measured here directly: RMSE preferred a model with many small errors, MAE
      preferred a model with a few large ones -- the regression counterpart of Day 143's accuracy-versus-
      recall inversion on classification.
  - term: Argument-order bug
    definition: >-
      A class of bug where a function's answer depends on which argument occupies which position, and
      swapping them produces a plausible-looking but wrong answer rather than an error. sklearn.metrics.
      r2_score is not symmetric in y_true and y_pred; measured here returning 0.359409 in the correct
      order and -0.209635 swapped.
  - term: Affine-rescaling invariance
    definition: >-
      A property of ordinary least squares: fitting on features rescaled by a per-column affine
      transform (mean-centred and divided by a constant, as standardisation does) produces identical
      predictions to fitting on the original features. Measured here as identical RMSE, MAE and R2 on
      raw-unit and standardised diabetes features.
  - term: Unit of a metric
    definition: >-
      What RMSE and MAE are stated in -- the same units as the target. A metric you cannot state a unit
      for is a metric you cannot explain to a stakeholder; the diabetes target itself has no physical
      unit, being a composite disease-progression score, which this lesson states plainly rather than
      fabricating one.
  - term: MAPE's structural asymmetry
    definition: >-
      The verified, narrow claim about MAPE's directional bias: the worst possible systematic
      under-prediction (always guessing zero) caps out at 100 percent, while over-prediction has no
      ceiling -- measured here at 1.0 versus 10.0 for an eleven-times over-prediction. Narrower than the
      folklore claim that equal-magnitude errors are scored unequally, which does not hold under direct
      construction.
  - term: Selection of a regression metric
    definition: >-
      The decision, made before reporting, about which function best answers the actual business
      question -- whether occasional large errors are more costly than being typically slightly off,
      whether a percentage is meaningful given the target's scale, and what unit a stakeholder needs to
      hear. Not a formality; measured directly to change which of two models looks better.
  - term: Test R2
    definition: >-
      R-squared measured on data the model was not fit on -- the honest number, as opposed to training
      R2, which climbs mechanically as predictors are added. Measured here at 0.3594 for the full
      ten-feature diabetes model, unaffected by whether the model was fit on raw or standardised
      features.
