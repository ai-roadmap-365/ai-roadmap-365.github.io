learning_promise: >-
  After this lesson you will know why the number you report is a choice, not a formality, because you
  will have measured a linear model's training R-squared climb from 0.5554 to 0.7403 as you add columns
  of pure random noise -- columns with exactly zero relationship to the target -- and watched adjusted
  R-squared correct that climb at a modest predictor count and then break down itself once the predictor
  count approaches the row count. You will measure that R-squared has no lower bound at all: a
  deliberately bad predictor scores -4.7009, not the 0 most people assume is a floor. You will move one
  target value 200 units away from an otherwise unchanged set of predictions and watch RMSE move 11.39
  times while MAE moves only 3.00 times, from the same squaring-versus-not-squaring mechanism Day 149
  used on the loss side. You will break MAPE at a zero true value and watch it return a number roughly
  fourteen orders of magnitude too large with no exception and no warning, and you will measure its real
  structural asymmetry: bounded at 100 percent for the worst possible under-prediction, unbounded for
  over-prediction. And you will construct two models, scored on the same targets, where RMSE prefers one
  and MAE prefers the other -- a genuine ranking inversion between the two most common regression
  metrics, and the single most useful thing in this lesson to carry into a real project.
objectives:
  - 'State the distinction between a loss and a metric precisely, and name which regression metrics this lesson covers'
  - 'Demonstrate that a training-set R-squared climbs as predictors are added, even when every added predictor is pure noise'
  - 'Compute adjusted R-squared and identify the point at which its own correction breaks down'
  - 'State the exact baseline R-squared is measured against, and demonstrate that it has no lower bound'
  - 'Explain why RMSE moves more than MAE under a single outlier, in terms of squaring versus not squaring the error'
  - 'Construct a true value of zero and a true value near zero and show what each does to MAPE'
  - 'State MAPE''s real structural asymmetry between over-prediction and under-prediction, and distinguish it from looser folklore claims'
  - 'Construct two models where RMSE and MAE disagree about which is better, and explain the mechanism behind the inversion'
  - 'State the unit RMSE and MAE are reported in for a real dataset, and explain why a metric without a statable unit cannot be explained to a stakeholder'
  - 'Confirm that sklearn.metrics.r2_score agrees with LinearRegression.score, and demonstrate that swapping r2_score''s two arguments changes the answer'
  - 'Choose which regression metric to report for a stated business question, and defend the choice'
  - 'Connect Day 143''s classification metric-first lesson (accuracy versus recall) to its regression counterpart measured here'
prerequisites:
  - 'Day 149 -- the loss/metric distinction, stated once and handed off explicitly to this day: a loss is what you optimise, a metric is what you report'
  - 'Day 143 -- metric-first thinking on the classification side, where accuracy and recall shipped different models on an imbalanced problem'
  - 'Day 148 -- the one-predictor linear model and residual plots, which this lesson reports metrics about'
  - 'Day 150 -- multiple predictors, which this lesson''s noise-column exercise extends directly'
  - 'Comfort with NumPy arrays and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
