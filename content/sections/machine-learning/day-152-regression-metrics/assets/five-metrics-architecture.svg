<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img" aria-labelledby="d152a-title d152a-desc" width="1040" height="760">
  <title id="d152a-title">Five regression metrics, what each reports, and what each hides</title>
  <desc id="d152a-desc">Five cards, one per metric -- RMSE, MAE, MAPE, R2 and adjusted R2 -- each showing its formula, its unit, and the one trap measured in this lesson, above a strip showing the same residuals feeding all five and a warning that they do not have to agree.</desc>
  <style>
    .d152a-bg { fill: #f8fafc; }
    .d152a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; }
    .d152a-sub { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d152a-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; }
    .d152a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d152a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d152a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .d152a-formula { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
    .d152a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d152a-trap { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d152a-row { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
    .d152a-wire { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d152a-warn { fill: #ffffff; stroke: #1a202c; stroke-width: 3; }
  </style>
  <rect class="d152a-bg" x="0" y="0" width="1040" height="760"/>

  <text class="d152a-title" x="520" y="42" text-anchor="middle">Five metrics, five different answers to "how wrong is this model"</text>
  <text class="d152a-sub" x="520" y="66" text-anchor="middle">All five are computed from the same residuals. None of them is the loss the model was fitted with.</text>

  <!-- shared residual strip -->
  <rect class="d152a-row" x="40" y="92" width="960" height="56" rx="8"/>
  <text class="d152a-strong" x="60" y="126">One set of residuals: y_true minus y_pred, for every row in the test set</text>

  <path class="d152a-wire" d="M 130 148 L 130 172" marker-end="url(#d152a-arrow)"/>
  <path class="d152a-wire" d="M 320 148 L 320 172" marker-end="url(#d152a-arrow)"/>
  <path class="d152a-wire" d="M 520 148 L 520 172" marker-end="url(#d152a-arrow)"/>
  <path class="d152a-wire" d="M 720 148 L 720 172" marker-end="url(#d152a-arrow)"/>
  <path class="d152a-wire" d="M 910 148 L 910 172" marker-end="url(#d152a-arrow)"/>
  <marker id="d152a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <!-- RMSE -->
  <rect class="d152a-card" x="40" y="178" width="190" height="220" rx="8"/>
  <text class="d152a-head" x="60" y="206">RMSE</text>
  <text class="d152a-formula" x="60" y="230">sqrt(mean(error^2))</text>
  <text class="d152a-label" x="60" y="254">Unit: same as the target</text>
  <text class="d152a-muted" x="60" y="278">Squares every error, so</text>
  <text class="d152a-muted" x="60" y="296">one bad row dominates it.</text>
  <rect class="d152a-trap" x="56" y="308" width="158" height="76" rx="6"/>
  <text class="d152a-strong" x="66" y="330">Measured trap</text>
  <text class="d152a-muted" x="66" y="350">One outlier: RMSE moved</text>
  <text class="d152a-muted" x="66" y="368">11.4x, MAE only 3.0x.</text>

  <!-- MAE -->
  <rect class="d152a-card" x="240" y="178" width="190" height="220" rx="8"/>
  <text class="d152a-head" x="260" y="206">MAE</text>
  <text class="d152a-formula" x="260" y="230">mean(|error|)</text>
  <text class="d152a-label" x="260" y="254">Unit: same as the target</text>
  <text class="d152a-muted" x="260" y="278">Weighs every error the</text>
  <text class="d152a-muted" x="260" y="296">same; typical case wins.</text>
  <rect class="d152a-trap" x="256" y="308" width="158" height="76" rx="6"/>
  <text class="d152a-strong" x="266" y="330">Measured trap</text>
  <text class="d152a-muted" x="266" y="350">Can rank a model BETTER</text>
  <text class="d152a-muted" x="266" y="368">than RMSE says it is.</text>

  <!-- MAPE -->
  <rect class="d152a-card" x="440" y="178" width="190" height="220" rx="8"/>
  <text class="d152a-head" x="460" y="206">MAPE</text>
  <text class="d152a-formula" x="460" y="230">mean(|error| / |y_true|)</text>
  <text class="d152a-label" x="460" y="254">Unit: percent</text>
  <text class="d152a-muted" x="460" y="278">Divides by the true value,</text>
  <text class="d152a-muted" x="460" y="296">row by row.</text>
  <rect class="d152a-trap" x="456" y="308" width="158" height="76" rx="6"/>
  <text class="d152a-strong" x="466" y="330">Measured trap</text>
  <text class="d152a-muted" x="466" y="350">At y_true = 0: 5.6e15,</text>
  <text class="d152a-muted" x="466" y="368">no error, no warning.</text>

  <!-- R2 -->
  <rect class="d152a-card" x="640" y="178" width="190" height="220" rx="8"/>
  <text class="d152a-head" x="660" y="206">R-squared</text>
  <text class="d152a-formula" x="660" y="230">1 - SS_res / SS_total</text>
  <text class="d152a-label" x="660" y="254">Unit: none (a ratio)</text>
  <text class="d152a-muted" x="660" y="278">Compares you to a</text>
  <text class="d152a-muted" x="660" y="296">constant-mean predictor.</text>
  <rect class="d152a-trap" x="656" y="308" width="158" height="76" rx="6"/>
  <text class="d152a-strong" x="666" y="330">Measured trap</text>
  <text class="d152a-muted" x="666" y="350">No floor: a bad predictor</text>
  <text class="d152a-muted" x="666" y="368">scored -4.7009.</text>

  <!-- Adjusted R2 -->
  <rect class="d152a-card" x="840" y="178" width="160" height="220" rx="8"/>
  <text class="d152a-head" x="860" y="206">Adjusted R2</text>
  <text class="d152a-formula" x="860" y="230">R2, penalised by p</text>
  <text class="d152a-label" x="860" y="254">Unit: none (a ratio)</text>
  <text class="d152a-muted" x="860" y="278">Corrects for the number</text>
  <text class="d152a-muted" x="860" y="296">of predictors used.</text>
  <rect class="d152a-trap" x="856" y="308" width="128" height="76" rx="6"/>
  <text class="d152a-strong" x="866" y="330">Measured trap</text>
  <text class="d152a-muted" x="866" y="350">Breaks down itself once</text>
  <text class="d152a-muted" x="866" y="368">p approaches n.</text>

  <!-- bottom banner -->
  <rect class="d152a-warn" x="40" y="416" width="960" height="320" rx="10"/>
  <text class="d152a-head" x="60" y="448">What the centrepiece measurement showed: training R2 climbing on pure noise</text>
  <text class="d152a-muted" x="60" y="472">A linear model on the diabetes dataset, with independent random-noise columns added and nothing else changing.</text>

  <text class="d152a-strong" x="70" y="504">noise columns added</text>
  <text class="d152a-strong" x="330" y="504">train R2</text>
  <text class="d152a-strong" x="520" y="504">adjusted R2</text>
  <text class="d152a-label" x="70" y="530">0</text>
  <text class="d152a-label" x="330" y="530">0.5554</text>
  <text class="d152a-label" x="520" y="530">0.5415</text>
  <text class="d152a-label" x="70" y="552">20</text>
  <text class="d152a-label" x="330" y="552">0.5754</text>
  <text class="d152a-label" x="520" y="552">0.5329 (correctly LOWER)</text>
  <text class="d152a-formula" x="70" y="578">100</text>
  <text class="d152a-formula" x="330" y="578">0.7403</text>
  <text class="d152a-formula" x="520" y="578">0.6104 (WRONGLY HIGHER)</text>

  <text class="d152a-strong" x="70" y="618">R2 has no lower bound</text>
  <text class="d152a-muted" x="70" y="640">Full model, test R2: 0.3594. Constant-mean predictor: -0.0001 (zero, by construction).</text>
  <text class="d152a-muted" x="70" y="660">A deliberately bad predictor: -4.7009 -- nearly five full units below the "floor" most readers assume exists.</text>

  <text class="d152a-strong" x="70" y="696">The metric a stakeholder gets is a choice, not a formality</text>
  <text class="d152a-muted" x="70" y="718">Every one of these five numbers comes from the same residuals. They are not interchangeable, and they can</text>
  <text class="d152a-muted" x="70" y="736">rank two models in opposite orders -- measured directly in this lesson's ranking-inversion exercise.</text>
</svg>
