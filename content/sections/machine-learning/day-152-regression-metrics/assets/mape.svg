<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The percentage error</title>
  <style>
    .mape-bg   { fill: #f8fafc; }
    .mape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mape-stage { opacity: 1; }

    .mape-s0 { animation-delay: 0.00s; }
    .mape-e0 { animation-delay: 0.00s; }
    .mape-s1 { animation-delay: 1.28s; }
    .mape-e1 { animation-delay: 1.28s; }
    .mape-s2 { animation-delay: 2.56s; }
    .mape-e2 { animation-delay: 2.56s; }
    .mape-s3 { animation-delay: 3.84s; }
    .mape-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mape-conn  { animation: mape-trace 6.4s ease-in-out infinite; }
      .mape-stage { animation: mape-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mape-stage { animation: mape-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mape-bg" width="980" height="322"/>
  <text class="mape-h1"  x="30" y="40">The percentage error</text>
  <text class="mape-sub" x="30" y="64">Four steps.</text>
  <g class="mape-stage mape-s0">
    <rect class="mape-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mape-step" x="44" y="142">01</text>
    <text class="mape-name" x="70" y="142">Average the absolute error as a fraction of the actual</text>
    <text class="mape-desc" x="44" y="166">Which gives a unitless</text>
    <text class="mape-desc" x="44" y="182">percentage.</text>
  </g>
  <line class="mape-line mape-conn mape-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mape-tip)"/>
  <g class="mape-stage mape-s1">
    <rect class="mape-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mape-step" x="280" y="142">02</text>
    <text class="mape-name" x="306" y="142">Undefined when the actual value is zero</text>
    <text class="mape-desc" x="280" y="166">And enormous when it is near</text>
    <text class="mape-desc" x="280" y="182">zero.</text>
  </g>
  <line class="mape-line mape-conn mape-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mape-tip)"/>
  <g class="mape-stage mape-s2">
    <rect class="mape-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mape-step" x="516" y="142">03</text>
    <text class="mape-name" x="542" y="142">Its asymmetry is structural, not directional</text>
    <text class="mape-desc" x="516" y="166">Under-prediction caps at 1.0;</text>
    <text class="mape-desc" x="516" y="182">over-prediction is unbounded.</text>
  </g>
  <line class="mape-line mape-conn mape-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mape-tip)"/>
  <g class="mape-stage mape-s3">
    <rect class="mape-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mape-step" x="752" y="142">04</text>
    <text class="mape-name" x="778" y="142">Both directions score 0.2629 for equal-magnitude errors</text>
    <text class="mape-desc" x="752" y="166">Which contradicts the usual</text>
    <text class="mape-desc" x="752" y="182">claim.</text>
  </g>
  <text class="mape-sub" x="30" y="304">The commonly stated asymmetry is wrong as usually described: equal-magnitude errors score identically, and the real asymmetry is in the bounds.</text>
</svg>
