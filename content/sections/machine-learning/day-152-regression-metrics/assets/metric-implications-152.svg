<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are traps.">
  <title>Four consequences of metric choice</title>
  <style>
    .metric-implications-152-bg   { fill: #f8fafc; }
    .metric-implications-152-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-implications-152-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-implications-152-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-implications-152-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-implications-152-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-implications-152-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-implications-152-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-implications-152-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-implications-152-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-implications-152-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-implications-152-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-implications-152-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-implications-152-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-implications-152-stage { opacity: 1; }

    .metric-implications-152-s0 { animation-delay: 0.00s; }
    .metric-implications-152-e0 { animation-delay: 0.00s; }
    .metric-implications-152-s1 { animation-delay: 1.28s; }
    .metric-implications-152-e1 { animation-delay: 1.28s; }
    .metric-implications-152-s2 { animation-delay: 2.56s; }
    .metric-implications-152-e2 { animation-delay: 2.56s; }
    .metric-implications-152-s3 { animation-delay: 3.84s; }
    .metric-implications-152-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-implications-152-conn  { animation: metric-implications-152-trace 6.4s ease-in-out infinite; }
      .metric-implications-152-stage { animation: metric-implications-152-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metric-implications-152-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-implications-152-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-implications-152-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-implications-152-stage { animation: metric-implications-152-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-implications-152-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-implications-152-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-implications-152-bg" width="980" height="322"/>
  <text class="metric-implications-152-h1"  x="30" y="40">Four consequences of metric choice</text>
  <text class="metric-implications-152-sub" x="30" y="64">Two are traps.</text>
  <g class="metric-implications-152-stage metric-implications-152-s0">
    <rect class="metric-implications-152-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metric-implications-152-step" x="44" y="142">01</text>
    <text class="metric-implications-152-name" x="70" y="142">Reporting the training statistic misleads</text>
    <text class="metric-implications-152-desc" x="44" y="166">Since it rises with any added</text>
    <text class="metric-implications-152-desc" x="44" y="182">column.</text>
  </g>
  <line class="metric-implications-152-line metric-implications-152-conn metric-implications-152-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metric-implications-152-tip)"/>
  <g class="metric-implications-152-stage metric-implications-152-s1">
    <rect class="metric-implications-152-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metric-implications-152-step" x="280" y="142">02</text>
    <text class="metric-implications-152-name" x="306" y="142">And the statistic can be gamed deliberately</text>
    <text class="metric-implications-152-desc" x="280" y="166">By adding predictors, which is</text>
    <text class="metric-implications-152-desc" x="280" y="182">measurable.</text>
  </g>
  <line class="metric-implications-152-line metric-implications-152-conn metric-implications-152-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metric-implications-152-tip)"/>
  <g class="metric-implications-152-stage metric-implications-152-s2">
    <rect class="metric-implications-152-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metric-implications-152-step" x="516" y="142">03</text>
    <text class="metric-implications-152-name" x="542" y="142">While it is not comparable across datasets</text>
    <text class="metric-implications-152-desc" x="516" y="166">Because the baseline variance</text>
    <text class="metric-implications-152-desc" x="516" y="182">differs.</text>
  </g>
  <line class="metric-implications-152-line metric-implications-152-conn metric-implications-152-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metric-implications-152-tip)"/>
  <g class="metric-implications-152-stage metric-implications-152-s3">
    <rect class="metric-implications-152-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metric-implications-152-step" x="752" y="142">04</text>
    <text class="metric-implications-152-name" x="778" y="142">So report an error in real units alongside it</text>
    <text class="metric-implications-152-desc" x="752" y="166">Which is what a decision can</text>
    <text class="metric-implications-152-desc" x="752" y="182">use.</text>
  </g>
  <text class="metric-implications-152-sub" x="30" y="304">The cross-dataset incomparability is routinely ignored in published comparisons, and it makes a table of fit statistics across different problems nearly meaningless.</text>
</svg>
