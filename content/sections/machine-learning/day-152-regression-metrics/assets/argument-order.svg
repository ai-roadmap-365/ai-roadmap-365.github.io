<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The argument-order trap</title>
  <style>
    .argument-order-bg   { fill: #f8fafc; }
    .argument-order-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argument-order-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argument-order-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argument-order-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argument-order-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .argument-order-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .argument-order-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .argument-order-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .argument-order-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .argument-order-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .argument-order-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .argument-order-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .argument-order-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .argument-order-stage { opacity: 1; }

    .argument-order-s0 { animation-delay: 0.00s; }
    .argument-order-e0 { animation-delay: 0.00s; }
    .argument-order-s1 { animation-delay: 1.28s; }
    .argument-order-e1 { animation-delay: 1.28s; }
    .argument-order-s2 { animation-delay: 2.56s; }
    .argument-order-e2 { animation-delay: 2.56s; }
    .argument-order-s3 { animation-delay: 3.84s; }
    .argument-order-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .argument-order-conn  { animation: argument-order-trace 6.4s ease-in-out infinite; }
      .argument-order-stage { animation: argument-order-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes argument-order-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes argument-order-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .argument-order-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .argument-order-stage { animation: argument-order-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes argument-order-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="argument-order-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="argument-order-bg" width="980" height="322"/>
  <text class="argument-order-h1"  x="30" y="40">The argument-order trap</text>
  <text class="argument-order-sub" x="30" y="64">Four steps.</text>
  <g class="argument-order-stage argument-order-s0">
    <rect class="argument-order-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="argument-order-step" x="44" y="142">01</text>
    <text class="argument-order-name" x="70" y="142">The convention is actual values first, predictions second</text>
    <text class="argument-order-desc" x="44" y="166">Across the metrics library.</text>
  </g>
  <line class="argument-order-line argument-order-conn argument-order-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#argument-order-tip)"/>
  <g class="argument-order-stage argument-order-s1">
    <rect class="argument-order-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="argument-order-step" x="280" y="142">02</text>
    <text class="argument-order-name" x="306" y="142">Swapping them raises no error</text>
    <text class="argument-order-desc" x="280" y="166">Both are arrays of the same</text>
    <text class="argument-order-desc" x="280" y="182">shape.</text>
  </g>
  <line class="argument-order-line argument-order-conn argument-order-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#argument-order-tip)"/>
  <g class="argument-order-stage argument-order-s2">
    <rect class="argument-order-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="argument-order-step" x="516" y="142">03</text>
    <text class="argument-order-name" x="542" y="142">But the statistic is not symmetric</text>
    <text class="argument-order-desc" x="516" y="166">So the number changes, plausibly</text>
    <text class="argument-order-desc" x="516" y="182">rather than absurdly.</text>
  </g>
  <line class="argument-order-line argument-order-conn argument-order-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#argument-order-tip)"/>
  <g class="argument-order-stage argument-order-s3">
    <rect class="argument-order-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="argument-order-step" x="752" y="142">04</text>
    <text class="argument-order-name" x="778" y="142">Use keyword arguments</text>
    <text class="argument-order-desc" x="752" y="166">Which makes the mistake</text>
    <text class="argument-order-desc" x="752" y="182">impossible.</text>
  </g>
  <text class="argument-order-sub" x="30" y="304">The result being plausible rather than absurd is what lets this survive review, and keyword arguments remove the possibility entirely for the cost of a few characters.</text>
</svg>
