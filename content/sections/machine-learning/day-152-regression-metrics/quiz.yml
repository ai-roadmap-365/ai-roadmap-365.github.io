questions:
  - question: >-
      A linear model is fit on the diabetes dataset, then refit with 100 extra columns of independent
      random noise added -- numbers with exactly zero relationship to the target. Its TRAINING R-squared
      rises from 0.5554 to 0.7403. What is the correct explanation?
    options:
      - 'This indicates a bug in the R-squared calculation, since unrelated columns should not change the score'
      - 'The extra columns happened to be correlated with the target by chance, which is likely with 100 random draws'
      - 'More predictors can never raise the training residual sum'
      - 'The model is using the noise columns to memorise individual rows, the same mechanism as a 1-nearest-neighbour classifier'
    answer_index: 2
    explanation: >-
      This is a property of ordinary least squares, not an accident of this dataset or these particular
      noise columns: adding any column, however useless, can only help or leave unchanged a training-set
      fit, because the fit that ignored the new column entirely (coefficient zero) is still available.
      Chance correlation contributes to the exact size of the climb but is not the reason it is
      guaranteed; harness check 8 confirms the climb happens at several further seeds, which chance
      correlation alone would not guarantee. Nothing about this indicates a bug, and there is no
      memorisation mechanism in linear regression analogous to 1-NN.
  - question: >-
      Adjusted R-squared falls from 0.5415 to 0.5329 when 20 noise columns are added (correctly detecting
      that they did not help), but RISES to 0.6104 when 100 noise columns are added, on 331 training rows.
      What does this measure?
    options:
      - 'Adjusted R-squared corrects for overfitting perfectly at any predictor count, and 0.6104 must reflect a real relationship the model found'
      - 'The 100-noise-column model is being scored on a different, larger validation set, which explains the higher number'
      - 'A rounding error in how adjusted R-squared was computed at high predictor counts'
      - 'The correction breaks down once predictors approach rows'
    answer_index: 3
    explanation: >-
      Adjusted R-squared''s formula, 1 minus (1 minus R-squared) times (n-1)/(n-p-1), has a penalty term
      that grows sharply as p approaches n. At p=110 on n=331 rows that term is large enough to overwhelm
      the correction and let adjusted R-squared climb back above the baseline, even though every added
      column is still pure noise. This is a real, measured failure mode of the correction, not a rounding
      artefact, not evidence of a real relationship, and both figures are computed on the same training
      set with no validation set involved.
  - question: >-
      A deliberately bad predictor (predicting zero for every row) scores an R-squared of -4.7009 on the
      diabetes test set. What does a negative R-squared mean?
    options:
      - 'It is relative to the mean, and worse than that scores below 0'
      - 'The test set itself is corrupted, since a properly split test set cannot produce a negative score'
      - 'The model has negative variance, which is only possible for classification problems misapplied to regression'
      - 'It is a formula error; R-squared cannot go below zero because it is defined as a percentage of variance explained'
    answer_index: 0
    explanation: >-
      R-squared is one minus the ratio of your model''s sum of squared errors to a constant-mean
      predictor''s sum of squared errors. There is no mathematical floor on that ratio: a sufficiently bad
      model''s error sum can exceed the mean predictor''s by any amount, which is exactly what happened
      here. This is not a formula error, has nothing to do with classification, and says nothing about
      test-set corruption -- the constant-mean predictor and the full model on the same split both score
      as expected (-0.0001 and 0.3594 respectively).
  - question: >-
      Fifty predictions are unchanged, but one true value is moved 200 units away from the rest. RMSE
      moves from 2.4801 to 28.2569 (11.39 times); MAE moves from 1.9833 to 5.9448 (3.00 times). Why does
      RMSE move so much more?
    options:
      - 'RMSE is a biased estimator and MAE is unbiased, which explains the difference'
      - 'RMSE squares each error first, so one large error dominates'
      - 'MAE was computed on a smaller sample than RMSE in this measurement, making it less sensitive to the outlier'
      - 'RMSE is measured in different units than MAE, so the two numbers are not directly comparable'
    answer_index: 1
    explanation: >-
      Squaring a large error produces an enormous contribution to the sum being averaged; absolute value
      never does. This is the same squaring-versus-not-squaring mechanism Day 149 measured on the LOSS
      side (which line gets fit), applied here to what gets REPORTED after fitting. RMSE and MAE are both
      in the target''s own units, computed on the same fifty rows, and neither estimator''s bias is the
      relevant property here -- the effect is about sensitivity to one large error, not about expected
      value over repeated samples.
  - question: >-
      `mean_absolute_percentage_error` is called with one true value of exactly zero. What actually
      happens, and why does it matter?
    options:
      - 'It automatically excludes that row from the average and computes MAPE over the remaining rows'
      - 'It returns NaN with a RuntimeWarning printed to the console, alerting the caller to the problem'
      - 'It returns a huge meaningless number with no warning'
      - 'It raises a ZeroDivisionError immediately, which is the correct and safe behaviour'
    answer_index: 2
    explanation: >-
      scikit-learn floors the zero denominator at machine epsilon rather than raising or warning, which
      produces a finite but enormous, meaningless value. The genuinely important part of this fact is
      NOT that the value is wrong -- it is that nothing in the call signals it is wrong. A raised
      exception or a warning would at least alert a caller; a silently returned huge float does not, and
      a pipeline that logs "MAPE: 5.6e15" without a human reading it will not catch this. No row is
      excluded, and nothing is printed.
  - question: >-
      Two models are scored on the same 100 targets. Model A makes many small, consistent errors: RMSE
      1.947, MAE 1.586. Model B is right on 95 rows and badly wrong on 5: RMSE 4.4353, MAE 0.8417. Which
      model is better?
    options:
      - 'Model A, because RMSE is always the more trustworthy metric for model comparison'
      - 'Neither model is usable, since a metric disagreement always indicates a bug in at least one of the two evaluations'
      - 'Model B, because MAE is always the more trustworthy metric for model comparison'
      - 'It cannot be answered from the metrics alone'
    answer_index: 3
    explanation: >-
      This is a real ranking inversion, not a bug: RMSE prefers Model A because it is dominated by Model
      B''s few large misses; MAE prefers Model B because it is dominated by the 95 rows Model B gets
      almost exactly right. Neither metric is unconditionally "more trustworthy" -- each answers a
      different question about the same residuals. If occasional large errors are unacceptable (a
      dosage, a structural load), RMSE''s preference for A is the one to act on; if the typical case
      matters most and the five bad rows are tolerable, MAE''s preference for B is. A metric disagreement
      like this is expected behaviour, not evidence of a bug.
  - question: >-
      RMSE and MAE are reported as 56.3929 and 45.1206 on the diabetes test set, identically whether the
      model was fit on raw-unit features (age in years, bmi, raw blood pressure) or on standardised
      features. What does this identical result demonstrate, and what unit are those two numbers in?
    options:
      - 'OLS is invariant to per-column rescaling, so metrics match'
      - 'It demonstrates that the raw and scaled feature sets happen to contain exactly the same information by coincidence in this particular dataset'
      - 'It demonstrates a bug -- fitting on differently scaled features should change the predictions and therefore the metrics'
      - 'It demonstrates that RMSE and MAE are always identical regardless of what units the TARGET itself is measured in'
    answer_index: 0
    explanation: >-
      Rescaling a predictor column by an affine transform (mean-centring and dividing by a constant, as
      standardisation does) does not change what ordinary least squares can express, so the fitted
      predictions -- and every metric computed from them -- are identical. This is a property of the
      estimator, not a coincidence of this dataset. RMSE and MAE ARE affected by the target''s own units
      (a metric on a target measured in dollars looks different from the same relationship measured in
      cents); what does not affect them is the units of the FEATURES. The diabetes target itself has no
      physical unit -- inventing one, such as mg/dL, would be a fabrication the dataset''s own
      documentation does not support.
  - question: >-
      `r2_score(y_test, pred)` returns 0.359409. Calling it with the arguments swapped,
      `r2_score(pred, y_test)`, returns -0.209635 -- the same predictions now look worse than guessing the
      mean. What is the correct explanation?
    options:
      - 'r2_score always returns a negative number when called with the arguments in the wrong order, regardless of the data'
      - 'r2_score is not symmetric — the denominator is the first array'
      - 'r2_score has a bug that only appears with this particular dataset'
      - 'The swapped call is measuring the model''s performance on the training set instead of the test set'
    answer_index: 1
    explanation: >-
      r2_score''s formula divides by the variance of whichever array is treated as "true", so which
      array is passed first changes the computation, not merely the presentation of the result. This is
      not a bug specific to this dataset -- it is documented behaviour that surfaces differently on every
      pair of non-identical arrays, and the sign of the result on a swap is not universally negative,
      only whatever the swapped formula happens to produce for a given pair of arrays. Neither call
      touches the training set; both use the same test-set arrays in different positions.
