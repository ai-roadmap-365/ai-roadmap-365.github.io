visuals:
  - id: five-metrics-architecture
    file: assets/five-metrics-architecture.svg
    type: diagram
    title: >-
      Five regression metrics, what each reports, and what each hides
    alt: >-
      Diagram: five cards in a row, one per metric -- RMSE, MAE, MAPE, R2 and adjusted R2 -- each fed by
      the same strip of residuals above them. Each card shows the metric's formula, the unit it is
      reported in, and a highlighted trap box naming the one failure this lesson measured for it: RMSE
      moved 11.39 times under one outlier while MAE moved only 3.00 times; MAPE returned 5.6e15 with no
      error and no warning when a true value was exactly zero; R2 scored -4.7009 for a deliberately bad
      predictor, which is impossible if it lived between 0 and 1; and adjusted R2 corrected the training
      R2 climb at a modest number of noise columns but climbed back above the baseline once the number of
      predictors approached the number of rows. A bottom panel gives the noise-column measurements in
      full, the R2 bounds measurements in full, and states that all five numbers come from the same
      residuals yet are not interchangeable and can rank two models in opposite orders
    description: >-
      A static architecture diagram with a shared strip of residuals at the top feeding five cards below
      it, one per metric considered in this lesson: RMSE, MAE, MAPE, R2 and adjusted R2. Each card states
      the metric's formula, the unit it reports in -- the target's own units for RMSE and MAE, percent for
      MAPE, a dimensionless ratio for R2 and adjusted R2 -- and a highlighted trap box naming the specific
      measured failure: RMSE moving 11.39 times against MAE's 3.00 times under one outlier; MAPE returning
      5.6e15 with neither an exception nor a warning when a true value is exactly zero; R2 scoring
      -4.7009 for a deliberately bad predictor, disproving the common belief that it is bounded at zero;
      and adjusted R2 correcting the training-R2 climb at a modest predictor count while climbing back
      above the baseline once the predictor count approaches the row count. A wide panel beneath the five
      cards restates the noise-column measurement in full -- 0.5554 to 0.7403 training R2 across 0 to 100
      noise columns, with adjusted R2 correctly falling to 0.5329 at 20 columns and wrongly climbing to
      0.6104 at 100 -- and the R2-bounds measurement -- 0.3594 for the full model, -0.0001 for a
      constant-mean predictor, -4.7009 for a deliberately bad one. It closes by stating that every one of
      the five numbers comes from the same residuals, that they are not interchangeable, and that they can
      rank two models in opposite orders, which the lesson measures directly.
  - id: outlier-metric-flow
    file: assets/outlier-metric-flow.svg
    type: flow-animated
    title: >-
      The same one outlier reaching RMSE and MAE by different routes, and moving each by a different
      amount
    alt: >-
      Diagram: a flow diagram in which fifty residuals, one of them moved 200 units away from the rest,
      split into two paths. One path squares each error before averaging and taking a square root, which
      is RMSE. The other path takes the absolute value of each error before averaging, which is MAE. A
      token travels each path to represent the one large error; on the squaring path it grows enormous by
      the time it reaches the end, and on the absolute-value path it grows only in proportion to its size.
      Bars beside each path show RMSE moving from 2.4801 before the outlier to 28.2569 after, a factor of
      11.39, while MAE moves from 1.9833 to 5.9448, a factor of 3.00, on the exact same fifty predictions
      with the exact same one target shifted. A caption states that RMSE squares that one row's error
      before averaging while MAE never squares anything, and that with motion switched off both bar
      heights and both printed numbers are already in their final position
    description: >-
      An animated flow diagram beginning with a source box holding fifty residuals, one of them moved 200
      units away from the rest, splitting into two branching paths that curve toward a squaring stage
      feeding RMSE and an absolute-value stage feeding MAE. A token travels each branch over the seven
      seconds preceding the reveal of the bars, arriving small on both paths and then, near the end of each
      path, growing to a large dark circle on the squaring path and only a modestly larger circle on the
      absolute-value path -- representing the one shifted row's error being squared on one branch and left
      linear on the other. As each token completes its journey, a pair of bars beside the two stages grows
      into view: the RMSE bar rises from a small "before" bar labelled 2.4801 to a much taller "after" bar
      labelled 28.2569, an 11.39-times increase, while the MAE bar rises from 1.9833 to a modestly taller
      5.9448, a 3.00-times increase. A caption beneath states plainly that RMSE squares that one row's
      error before averaging while MAE never squares anything, which is the entire mechanism. A
      prefers-reduced-motion block disables every animation and leaves both tokens at their grown, final
      size and both "after" bars at their final height with their final labels visible, so the still frame
      carries the whole result on its own.
