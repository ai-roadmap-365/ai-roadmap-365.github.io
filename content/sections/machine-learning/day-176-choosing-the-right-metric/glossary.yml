terms:
  - term: 'Matthews Correlation Coefficient (MCC)'
    definition: 'A balanced metric for binary classification that takes into account true/false positives and negatives, robust to severe class imbalance.'
  - term: 'Cost Matrix'
    definition: 'A matrix assigning specific economic monetary costs and payoffs to each of the four confusion matrix outcomes (TP, FP, TN, FN).'
  - term: 'Expected Value Framework'
    definition: 'The business decision rule computing total expected profit or cost by weighting confusion matrix rates by their financial values.'
  - term: 'PR-AUC'
    definition: 'The Area Under the Precision-Recall Curve, reflecting model capability on rare positive classes without inflation from large true negative counts.'
  - term: 'ROC-AUC'
    definition: 'Area Under the Receiver Operating Characteristic curve measuring the probability that a random positive sample ranks higher than a random negative.'
  - term: 'sMAPE'
    definition: 'Symmetric Mean Absolute Percentage Error, providing scale-independent percentage error bounded between 0% and 200%.'
  - term: 'NDCG@k'
    definition: 'Normalized Discounted Cumulative Gain at rank k, measuring ranking quality where items placed higher carry logarithmically greater weight.'
  - term: 'Brier Score'
    definition: 'Mean squared error between predicted probabilities and actual binary outcomes, quantifying probabilistic calibration.'
