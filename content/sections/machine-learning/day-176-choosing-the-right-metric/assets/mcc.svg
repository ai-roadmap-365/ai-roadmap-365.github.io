<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four properties.">
  <title>A metric that uses all four cells</title>
  <style>
    .mcc-bg   { fill: #f8fafc; }
    .mcc-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcc-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcc-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcc-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcc-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mcc-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mcc-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mcc-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mcc-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mcc-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mcc-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mcc-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mcc-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mcc-stage { opacity: 1; }

    .mcc-s0 { animation-delay: 0.00s; }
    .mcc-e0 { animation-delay: 0.00s; }
    .mcc-s1 { animation-delay: 1.28s; }
    .mcc-e1 { animation-delay: 1.28s; }
    .mcc-s2 { animation-delay: 2.56s; }
    .mcc-e2 { animation-delay: 2.56s; }
    .mcc-s3 { animation-delay: 3.84s; }
    .mcc-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mcc-conn  { animation: mcc-trace 6.4s ease-in-out infinite; }
      .mcc-stage { animation: mcc-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mcc-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mcc-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mcc-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mcc-stage { animation: mcc-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mcc-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mcc-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mcc-bg" width="980" height="322"/>
  <text class="mcc-h1"  x="30" y="40">A metric that uses all four cells</text>
  <text class="mcc-sub" x="30" y="64">Four properties.</text>
  <g class="mcc-stage mcc-s0">
    <rect class="mcc-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mcc-step" x="44" y="142">01</text>
    <text class="mcc-name" x="70" y="142">It uses all four confusion matrix cells</text>
    <text class="mcc-desc" x="44" y="166">Unlike the combined</text>
    <text class="mcc-desc" x="44" y="182">precision-recall score, which</text>
    <text class="mcc-desc" x="44" y="198">ignores true negatives.</text>
  </g>
  <line class="mcc-line mcc-conn mcc-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mcc-tip)"/>
  <g class="mcc-stage mcc-s1">
    <rect class="mcc-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mcc-step" x="280" y="142">02</text>
    <text class="mcc-name" x="306" y="142">Ranging from minus one to plus one</text>
    <text class="mcc-desc" x="280" y="166">Zero meaning no better than</text>
    <text class="mcc-desc" x="280" y="182">chance.</text>
  </g>
  <line class="mcc-line mcc-conn mcc-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mcc-tip)"/>
  <g class="mcc-stage mcc-s2">
    <rect class="mcc-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mcc-step" x="516" y="142">03</text>
    <text class="mcc-name" x="542" y="142">And it stays honest under imbalance</text>
    <text class="mcc-desc" x="516" y="166">A trivial classifier scores</text>
    <text class="mcc-desc" x="516" y="182">zero, not high.</text>
  </g>
  <line class="mcc-line mcc-conn mcc-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mcc-tip)"/>
  <g class="mcc-stage mcc-s3">
    <rect class="mcc-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mcc-step" x="752" y="142">04</text>
    <text class="mcc-name" x="778" y="142">Which makes it a strong single summary</text>
    <text class="mcc-desc" x="752" y="166">Where one number is genuinely</text>
    <text class="mcc-desc" x="752" y="182">needed.</text>
  </g>
  <text class="mcc-sub" x="30" y="304">The trivial classifier scoring zero rather than high is the property that recommends it: it is the only common single metric that is not fooled by imbalance.</text>
</svg>
