<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Choosing a metric</title>
  <style>
    .metric-choice-bg   { fill: #f8fafc; }
    .metric-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .metric-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .metric-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .metric-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .metric-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .metric-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .metric-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .metric-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .metric-choice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .metric-choice-stage { opacity: 1; }

    .metric-choice-s0 { animation-delay: 0.00s; }
    .metric-choice-e0 { animation-delay: 0.00s; }
    .metric-choice-s1 { animation-delay: 1.28s; }
    .metric-choice-e1 { animation-delay: 1.28s; }
    .metric-choice-s2 { animation-delay: 2.56s; }
    .metric-choice-e2 { animation-delay: 2.56s; }
    .metric-choice-s3 { animation-delay: 3.84s; }
    .metric-choice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .metric-choice-conn  { animation: metric-choice-trace 6.4s ease-in-out infinite; }
      .metric-choice-stage { animation: metric-choice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes metric-choice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes metric-choice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .metric-choice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .metric-choice-stage { animation: metric-choice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes metric-choice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="metric-choice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="metric-choice-bg" width="980" height="322"/>
  <text class="metric-choice-h1"  x="30" y="40">Choosing a metric</text>
  <text class="metric-choice-sub" x="30" y="64">Four steps.</text>
  <g class="metric-choice-stage metric-choice-s0">
    <rect class="metric-choice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="metric-choice-step" x="44" y="142">01</text>
    <text class="metric-choice-name" x="70" y="142">Start from the decision the model informs</text>
    <text class="metric-choice-desc" x="44" y="166">Not from the library's default.</text>
  </g>
  <line class="metric-choice-line metric-choice-conn metric-choice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#metric-choice-tip)"/>
  <g class="metric-choice-stage metric-choice-s1">
    <rect class="metric-choice-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="metric-choice-step" x="280" y="142">02</text>
    <text class="metric-choice-name" x="306" y="142">Establish what each kind of error costs</text>
    <text class="metric-choice-desc" x="280" y="166">In money, time or harm.</text>
  </g>
  <line class="metric-choice-line metric-choice-conn metric-choice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#metric-choice-tip)"/>
  <g class="metric-choice-stage metric-choice-s2">
    <rect class="metric-choice-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="metric-choice-step" x="516" y="142">03</text>
    <text class="metric-choice-name" x="542" y="142">Then pick the metric that reflects those costs</text>
    <text class="metric-choice-desc" x="516" y="166">Or compute expected cost</text>
    <text class="metric-choice-desc" x="516" y="182">directly.</text>
  </g>
  <line class="metric-choice-line metric-choice-conn metric-choice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#metric-choice-tip)"/>
  <g class="metric-choice-stage metric-choice-s3">
    <rect class="metric-choice-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="metric-choice-step" x="752" y="142">04</text>
    <text class="metric-choice-name" x="778" y="142">And keep the confusion matrix alongside it</text>
    <text class="metric-choice-desc" x="752" y="166">Because any scalar hides the</text>
    <text class="metric-choice-desc" x="752" y="182">error profile.</text>
  </g>
  <text class="metric-choice-sub" x="30" y="304">Starting from the decision rather than the model is the whole discipline: a metric chosen for convenience will be optimised faithfully and pointlessly.</text>
</svg>
