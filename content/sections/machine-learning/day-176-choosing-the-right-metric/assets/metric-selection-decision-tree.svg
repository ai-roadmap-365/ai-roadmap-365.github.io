<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <title>Metric Selection Decision Tree</title>
  <style>
    .bg { fill: var(--bg-surface, #0f172a); }
    .node { fill: var(--bg-subtle, #1e293b); stroke: var(--border-subtle, #334155); stroke-width: 2; rx: 8; }
    .node-active { fill: var(--accent-subtle, #1e1b4b); stroke: var(--accent, #6366f1); stroke-width: 2; rx: 8; }
    .node-good { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: var(--text-secondary, #94a3b8); text-anchor: middle; }
    .text-head { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: var(--text-primary, #f8fafc); text-anchor: middle; }
    .edge { stroke: var(--border-subtle, #475569); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .edge-accent { stroke: var(--accent, #6366f1); stroke-width: 2; fill: none; marker-end: url(#arrow-accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="900" height="500" class="bg" rx="12" />

  <text x="450" y="40" class="text-head">Production Metric Selection Decision Framework</text>
  <text x="450" y="65" class="text-sub">Aligning Machine Learning Evaluation with Core Business Objective Types</text>

  <!-- Root Question -->
  <rect x="340" y="90" width="220" height="55" class="node-active" />
  <text x="450" y="115" class="text-title">What is the ML Task?</text>
  <text x="450" y="133" class="text-sub">Problem Formulation</text>

  <!-- Branch 1: Classification -->
  <path d="M 380 145 L 200 190" class="edge-accent" />
  <rect x="90" y="190" width="220" height="55" class="node" />
  <text x="200" y="215" class="text-title">Classification</text>
  <text x="200" y="233" class="text-sub">Binary or Multi-Class</text>

  <!-- Branch 2: Regression -->
  <path d="M 450 145 L 450 190" class="edge-accent" />
  <rect x="340" y="190" width="220" height="55" class="node" />
  <text x="450" y="215" class="text-title">Regression</text>
  <text x="450" y="233" class="text-sub">Continuous Target</text>

  <!-- Branch 3: Ranking -->
  <path d="M 520 145 L 700 190" class="edge-accent" />
  <rect x="590" y="190" width="220" height="55" class="node" />
  <text x="700" y="215" class="text-title">Ranking / Retrieval</text>
  <text x="700" y="233" class="text-sub">Ordered Recommendations</text>

  <!-- Sub-branch Classification -->
  <path d="M 150 245 L 100 295" class="edge" />
  <rect x="15" y="295" width="170" height="65" class="node-good" />
  <text x="100" y="320" class="text-title">Balanced Classes</text>
  <text x="100" y="340" class="text-sub">ROC-AUC, Accuracy, F1</text>

  <path d="M 250 245 L 300 295" class="edge" />
  <rect x="215" y="295" width="170" height="65" class="node-good" />
  <text x="300" y="320" class="text-title">Imbalanced / Fraud</text>
  <text x="300" y="340" class="text-sub">PR-AUC, MCC, Cost Matrix</text>

  <!-- Sub-branch Regression -->
  <path d="M 410 245 L 360 380" class="edge" />
  <rect x="275" y="380" width="170" height="65" class="node-good" />
  <text x="360" y="405" class="text-title">Heavy Outliers</text>
  <text x="360" y="425" class="text-sub">MAE, Huber Loss, sMAPE</text>

  <path d="M 490 245 L 540 380" class="edge" />
  <rect x="455" y="380" width="170" height="65" class="node-good" />
  <text x="540" y="405" class="text-title">Normal Variance</text>
  <text x="540" y="425" class="text-sub">RMSE, R-squared, MSE</text>

  <!-- Sub-branch Ranking -->
  <path d="M 700 245 L 700 295" class="edge" />
  <rect x="615" y="295" width="170" height="65" class="node-good" />
  <text x="700" y="320" class="text-title">Graded Relevance</text>
  <text x="700" y="340" class="text-sub">NDCG@K, MRR, MAP@K</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.36s}.dx-f2{animation-delay:0.72s}.dx-f3{animation-delay:1.08s}.dx-f4{animation-delay:1.44s}.dx-f5{animation-delay:1.80s}.dx-f6{animation-delay:2.16s}.dx-f7{animation-delay:2.52s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 380 145 L 200 190" stroke="var(--accent, #6366f1)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 450 145 L 450 190" stroke="var(--accent, #6366f1)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 520 145 L 700 190" stroke="var(--accent, #6366f1)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 150 245 L 100 295" stroke="var(--border-subtle, #475569)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f4" d="M 250 245 L 300 295" stroke="var(--border-subtle, #475569)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f5" d="M 410 245 L 360 380" stroke="var(--border-subtle, #475569)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f6" d="M 490 245 L 540 380" stroke="var(--border-subtle, #475569)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f7" d="M 700 245 L 700 295" stroke="var(--border-subtle, #475569)" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
