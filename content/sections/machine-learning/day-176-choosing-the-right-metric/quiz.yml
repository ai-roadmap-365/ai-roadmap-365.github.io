questions:
  - question: "Why is Precision-Recall AUC (PR-AUC) strictly preferred over ROC-AUC in fraud detection with 0.1% positive prevalence?"
    options:
      - "ROC-AUC cannot be calculated if there are fewer than 1,000 samples in the test set."
      - 'ROC-AUC hides false positives; PR-AUC exposes them'
      - "PR-AUC is always mathematically guaranteed to equal 1.0 for linear models."
      - "ROC-AUC requires gradient descent optimization during evaluation."
    answer_index: 1
    explanation: "In severe class imbalance, True Negatives dwarf True Positives by orders of magnitude. The False Positive Rate (FP / (FP + TN)) has a massive denominator, keeping FPR near zero even with thousands of False Positives. Precision (TP / (TP + FP)) directly penalizes False Positives."

  - question: "What is the primary advantage of Matthew's Correlation Coefficient (MCC) over the standard F1-score?"
    options:
      - "MCC works only for continuous regression problems."
      - "MCC is bounded between 0 and 100 rather than -1 and +1."
      - 'MCC uses all four quadrants; F1 ignores true negatives'
      - "MCC does not require ground truth labels."
    answer_index: 2
    explanation: "F1-score is completely blind to True Negatives. In contrast, MCC produces a high score only if the prediction obtained good results in all four confusion matrix categories (TP, TN, FP, TN), yielding +1 for perfect prediction, 0 for random guessing, and -1 for total disagreement."

  - question: "In a medical screening diagnostic where missing a tumor (False Negative) costs $10,000 in malpractice liability while an unnecessary biopsy (False Positive) costs $100, how should the decision threshold be tuned?"
    options:
      - "Switch the model from Logistic Regression to a Random Forest without changing the threshold."
      - "Keep the threshold strictly at 0.50 to maintain maximum model accuracy."
      - "Shift the threshold higher than 0.90 to ensure only 100% confident tumor predictions are flagged."
      - 'Shift the threshold well below 0.50 to catch positives'
    answer_index: 3
    explanation: "When the cost of a False Negative ($10,000) vastly exceeds the cost of a False Positive ($100), the expected financial loss is minimized by lowering the decision threshold, ensuring virtually all positive cases are detected even if it generates more False Positives."

  - question: "Why is Symmetric MAPE (sMAPE) often preferred over standard MAPE in sales forecasting?"
    options:
      - 'MAPE is asymmetric and divides by zero; sMAPE is bounded'
      - "sMAPE computes logarithmic differences that eliminate all floating-point operations."
      - "Standard MAPE cannot be used with Python pandas DataFrames."
      - "sMAPE is an unsupervised metric that does not require historical sales data."
    answer_index: 0
    explanation: "Standard MAPE divides by actual value y. If y=0, division by zero occurs; if y is small, MAPE explodes to infinity. Furthermore, MAPE caps under-forecasting penalty at 100% while over-forecasting has no upper bound. sMAPE balances the denominator with (abs(y) + abs(y_hat))/2."

  - question: "What does Normalized Discounted Cumulative Gain at Rank K (NDCG@K) measure in recommendation engines?"
    options:
      - "The total network latency of ranking 1,000 items in an API database query."
      - 'Ranking quality, discounted by position and normalised'
      - "The classification accuracy of predicting whether a user is active or inactive."
      - "The percentage of items in the catalog that have never been recommended."
    answer_index: 1
    explanation: "NDCG@K assigns higher weight to relevant items appearing at rank 1, 2, 3 than rank 10 or 20 using logarithmic position discounting (1 / log2(i + 1)), and normalizes the sum by the Ideal DCG (IDCG) so the final metric is bounded in [0, 1]."
