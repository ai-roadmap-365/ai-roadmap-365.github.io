id: D176
day: 176
slug: choosing-the-right-metric
title: Choosing the Right Metric
section: machine-learning
subsection: supervised-learning
week: 26
learning_promise: >-
  Master the mathematical theory and business economics of machine learning evaluation metrics: understand why default
  accuracy and RMSE deceive engineers, formulate cost-sensitive utility functions and asymmetric loss matrices, choose
  between ROC-AUC and PR-AUC under severe imbalance, evaluate ranking algorithms with NDCG@K, and calibrate decision
  thresholds to maximize commercial ROI.
objectives:
  - 'Differentiate purely statistical loss functions from real-world business utility metrics'
  - 'Demonstrate why Accuracy fails in skewed distributions and calculate Matthew Correlation Coefficient (MCC)'
  - 'Formulate the Expected Value Framework using Cost-Benefit Confusion Matrices'
  - 'Contrast ROC-AUC and Precision-Recall AUC (PR-AUC) under extreme class imbalance'
  - 'Evaluate regression models using RMSE, MAE, Huber loss, MAPE, and symmetric MAPE (sMAPE)'
  - 'Compute Discounted Cumulative Gain (DCG) and Normalized DCG at rank K (NDCG@K) for ranking systems'
  - 'Calibrate optimal decision thresholds T* to minimize financial risk'
  - 'Detect Goodhart’s Law and metric gaming vulnerabilities in deployed ML systems'
prerequisites:
  - 'Day 159 -- Precision, Recall, ROC, and Choosing Thresholds'
  - 'Day 160 -- Class Imbalance'
  - 'Day 152 -- Regression Metrics'
reading_time_minutes: 50
practical_time_minutes: 60
