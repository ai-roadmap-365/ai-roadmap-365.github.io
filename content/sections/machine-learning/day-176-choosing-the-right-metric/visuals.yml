visuals:
  - id: metric-selection-decision-tree
    file: assets/metric-selection-decision-tree.svg
    type: diagram
    title: 'Production Metric Selection Decision Framework'
    alt: 'Decision tree diagram mapping classification, regression, and ranking problem constraints to their optimal statistical and business evaluation metrics.'
    description: 'A static decision framework guiding the selection of evaluation metrics based on problem formulation, class balance, outlier presence, and business goals.'
  - id: cost-matrix-expected-value-flow
    file: assets/cost-matrix-expected-value-flow.svg
    type: flow-animated
    title: 'Expected Financial Cost Optimization Loop'
    alt: 'Animated flow chart showing predicted model probabilities evaluated across an asymmetric confusion cost matrix to compute the cost-optimal decision threshold.'
    description: 'An animated diagram illustrating how varying the decision threshold across a financial cost matrix identifies the exact threshold minimizing expected real-world loss.'
  - id: metric-choice
    file: assets/metric-choice.svg
    type: diagram
    title: 'Choosing a metric'
    alt: 'Diagram: how a metric is chosen from the decision it informs'
    description: 'A four-stage description of metric selection covering the decision, the error costs, the candidate metrics and the choice.'
  - id: mcc
    file: assets/mcc.svg
    type: diagram
    title: 'A metric that uses all four cells'
    alt: 'Diagram: the four properties of the Matthews correlation coefficient'
    description: 'A four-stage description of the correlation coefficient covering all four cells, the range, imbalance behaviour and the interpretation.'
  - id: regression-metrics
    file: assets/regression-metrics.svg
    type: diagram
    title: 'Four regression metrics'
    alt: 'Diagram: four regression metrics and what each emphasises'
    description: 'A two-column comparison of regression metrics against what each emphasises.'
  - id: expected-value
    file: assets/expected-value.svg
    type: diagram
    title: 'Expected value'
    alt: 'Diagram: how a cost matrix converts predictions into an expected value'
    description: 'A four-stage description of expected value covering the cost matrix, the outcome probabilities, the product and the decision.'
  - id: ndcg
    file: assets/ndcg.svg
    type: diagram
    title: 'Ranking metrics'
    alt: 'Diagram: how discounted cumulative gain scores a ranked list'
    description: 'A four-stage description of ranking evaluation covering graded relevance, position discounting, accumulation and normalisation.'
  - id: metric-not
    file: assets/metric-not.svg
    type: diagram
    title: 'What metric choice is not'
    alt: 'Diagram: four misconceptions about choosing metrics'
    description: 'A two-column comparison of misconceptions about metric choice against what is true.'
  - id: metric-history
    file: assets/metric-history.svg
    type: diagram
    title: 'Four steps in metric practice'
    alt: 'Diagram: the historical progression of evaluation metric practice'
    description: 'A four-stage description of metric history covering accuracy, precision and recall, cost-sensitive evaluation and task-specific metrics.'
  - id: instrument
    file: assets/instrument.svg
    type: diagram
    title: 'Choosing an instrument'
    alt: 'Diagram: measuring with the wrong instrument compared with the right one'
    description: 'A two-column comparison of an unsuitable measuring instrument against a suitable one.'
  - id: metric-implications
    file: assets/metric-implications.svg
    type: diagram
    title: 'Four consequences of metric choice'
    alt: 'Diagram: the optimisation, fairness, communication and drift implications of metric choice'
    description: 'A four-stage description of metric implications covering optimisation targets, subgroup disparity, stakeholder communication and drift.'
  - id: metric-when
    file: assets/metric-when.svg
    type: diagram
    title: 'Which metric when'
    alt: 'Diagram: choosing an evaluation metric by task type'
    description: 'A two-column comparison of task types against the metric each requires.'
  - id: confusion-foundation
    file: assets/confusion-foundation.svg
    type: diagram
    title: 'Everything derives from four cells'
    alt: 'Diagram: how every classification metric derives from the confusion matrix'
    description: 'A four-stage description of metric derivation covering the four cells, row ratios, column ratios and combined scores.'
  - id: fbeta
    file: assets/fbeta.svg
    type: diagram
    title: 'Weighting the two errors'
    alt: 'Diagram: how the weighting parameter shifts emphasis between precision and recall'
    description: 'A four-stage description of the weighted score covering the equal case, the weighting parameter, the two directions and the choice.'
  - id: roc-pr-auc
    file: assets/roc-pr-auc.svg
    type: diagram
    title: 'Two areas under two curves'
    alt: 'Diagram: the two area-under-curve metrics compared'
    description: 'A two-column comparison of the two area-under-curve summary metrics.'
  - id: metric-is
    file: assets/metric-is.svg
    type: diagram
    title: 'What a metric is'
    alt: 'Diagram: the four defining properties of an evaluation metric'
    description: 'A four-stage description of a metric covering the summary, the assumptions, the threshold dependence and the operating point.'
