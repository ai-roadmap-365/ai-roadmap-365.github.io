visuals:
  - id: metric-selection-decision-tree
    file: assets/metric-selection-decision-tree.svg
    type: diagram
    title: 'Production Metric Selection Decision Framework'
    alt: 'Decision tree diagram mapping classification, regression, and ranking problem constraints to their optimal statistical and business evaluation metrics.'
    description: 'A static decision framework guiding the selection of evaluation metrics based on problem formulation, class balance, outlier presence, and business goals.'
  - id: cost-matrix-expected-value-flow
    file: assets/cost-matrix-expected-value-flow.svg
    type: flow-animated
    title: 'Expected Financial Cost Optimization Loop'
    alt: 'Animated flow chart showing predicted model probabilities evaluated across an asymmetric confusion cost matrix to compute the cost-optimal decision threshold.'
    description: 'An animated diagram illustrating how varying the decision threshold across a financial cost matrix identifies the exact threshold minimizing expected real-world loss.'
