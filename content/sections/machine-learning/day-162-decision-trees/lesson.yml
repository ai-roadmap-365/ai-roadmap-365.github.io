id: D162
day: 162
slug: decision-trees
title: Decision Trees
section: machine-learning
subsection: supervised-learning
week: 24
learning_promise: >-
  Master the theory, mathematics, and implementation of Decision Trees from first principles: why trees partition
  feature space into axis-aligned hyper-rectangles, how Gini impurity and Shannon entropy measure node homogeneity,
  how the CART algorithm searches greedily for optimal split thresholds, why unpruned trees suffer from high variance
  and overfitting, and how hyperparameter constraints and pruning restore generalization.
objectives:
  - 'Explain how decision trees recursively partition continuous feature space into axis-aligned rectangular regions'
  - 'Derive and compute Gini Impurity, Shannon Entropy, and Information Gain'
  - 'Formulate the greedy CART split optimization objective function'
  - 'Implement a complete binary decision tree classifier from scratch using recursive tree structures'
  - 'Analyze the inductive bias, non-parametric nature, and scale invariance of decision trees'
  - 'Diagnose overfitting mechanisms in unconstrained trees and identify high-variance failure modes'
  - 'Apply pre-pruning hyperparameters (max_depth, min_samples_split, min_samples_leaf) to prevent memorization'
  - 'Benchmark custom decision trees against scikit-learn DecisionTreeClassifier on real multiclass data'
prerequisites:
  - 'Day 156 -- Decision boundaries and non-linear partitions'
  - 'Day 159 -- Classification metrics and confusion matrices'
reading_time_minutes: 50
practical_time_minutes: 60
last_verified: '2026-08-29'
