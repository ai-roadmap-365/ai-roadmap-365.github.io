terms:
  - term: 'Decision Tree'
    definition: 'A non-parametric hierarchical supervised learning model that recursively partitions feature space into axis-aligned rectangular regions based on feature threshold tests.'
  - term: 'Gini Impurity'
    definition: 'A measure of node label heterogeneity in classification trees: G = 1 - sum(p_k^2), equal to 0.0 for pure nodes and maximized for uniform distributions.'
  - term: 'Shannon Entropy'
    definition: 'An information-theoretic measure of uncertainty: H = - sum(p_k * log2(p_k)), measuring the expected bits required to encode class labels.'
  - term: 'Information Gain'
    definition: 'The reduction in entropy achieved by partitioning a node into child subsets: IG = H(Parent) - sum((N_child / N_parent) * H(Child)).'
  - term: 'CART (Classification and Regression Trees)'
    definition: 'The standard greedy binary recursive partitioning algorithm developed by Breiman et al. using Gini impurity for classification and variance reduction for regression.'
  - term: 'Leaf Node'
    definition: 'A terminal node in a decision tree that contains no child branches and assigns a final class prediction (or continuous average) to all arriving samples.'
  - term: 'Axis-Aligned Split'
    definition: 'A decision rule evaluating a single feature against a scalar threshold (x_j <= t), creating boundaries strictly orthogonal to coordinate axes.'
  - term: 'Pre-Pruning (Early Stopping)'
    definition: 'Regularizing a decision tree by halting recursive growth when predefined stopping thresholds (max_depth, min_samples_split) are met.'
  - term: 'Cost-Complexity Pruning'
    definition: 'A post-pruning technique that minimizes a cost function balancing tree misclassification error against tree size parameterized by alpha.'
  - term: 'Scale Invariance'
    definition: 'The property of decision trees where monotonic feature transformations (e.g. scaling or log-transforms) have zero effect on split choices or model predictions.'
