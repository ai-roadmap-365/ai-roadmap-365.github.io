questions:
  - question: 'What is the geometric nature of the decision boundary produced by a standard single-feature Decision Tree?'
    options:
      - 'A piecewise-constant, axis-aligned step boundary'
      - 'A smooth diagonal linear hyperplane'
      - 'A set of concentric circular Voronoi cells'
      - 'A high-degree smooth polynomial curve'
    answer_index: 0
    explanation: 'Because each internal tree node splits on a single feature using an inequality x_j <= t, all decision boundaries are strictly orthogonal (perpendicular) to the feature axes.'

  - question: 'What is the Gini Impurity of a binary classification node containing 70 Positive samples and 30 Negative samples?'
    options:
      - 'G = 0.70'
      - 'G = 0.42'
      - 'G = 0.50'
      - 'G = 0.21'
    answer_index: 1
    explanation: 'Gini impurity is defined as 1 - sum(p_k^2). Here, p_pos = 0.7 and p_neg = 0.3, so G = 1 - (0.49 + 0.09) = 1 - 0.58 = 0.42.'

  - question: 'Why are Decision Trees completely invariant to monotonic feature transformations (e.g. scaling, log-transforms, standardizing)?'
    options:
      - 'Because the Gini formula normalizes all values to [0, 1]'
      - 'Because trees multiply all inputs by a learned weight matrix'
      - 'Splits depend only on rank order, which scaling preserves'
      - 'Because decision trees only accept categorical variables'
    answer_index: 2
    explanation: 'Tree splits evaluate inequalities like x_j <= t based on sample sorting. Any monotonic transformation preserves rank order, leaving the tree structure and predictions completely unchanged.'

  - question: 'What is the primary fundamental weakness (failure mode) of an unconstrained, deeply grown Decision Tree?'
    options:
      - 'Inability to handle multiclass classification'
      - 'High bias: the tree cannot fit non-linear patterns'
      - 'Extreme sensitivity to feature scaling'
      - 'High variance: it grows until each leaf has one sample'
    answer_index: 3
    explanation: 'Without stopping criteria or pruning, a decision tree will split until every training point is isolated in its own pure leaf, achieving 100% training accuracy but failing to generalize to new data.'

  - question: 'How does the CART algorithm select the best feature j* and threshold t* at an internal node m?'
    options:
      - 'It picks the split minimising weighted child impurity'
      - 'It computes the gradient of log-loss with respect to feature weights'
      - 'It randomly selects a feature and places the threshold at the median'
      - 'It solves the normal equation (X^T X)^-1 X^T y'
    answer_index: 0
    explanation: 'CART is a greedy recursive partitioning algorithm that evaluates all possible midpoint thresholds across all features to minimize the weighted child impurity at each step.'

  - question: 'What is the maximum possible value of Gini Impurity for a K-class classification problem?'
    options:
      - 'G_max = 1.0'
      - 'G_max = 1 - (1/K)'
      - 'G_max = K'
      - 'G_max = log2(K)'
    answer_index: 1
    explanation: 'When all K classes are equally likely (p_k = 1/K for all k), Gini impurity reaches its maximum: G_max = 1 - sum_{k=1}^K (1/K)^2 = 1 - K * (1/K^2) = 1 - (1/K).'

  - question: 'What is the difference between Pre-Pruning (early stopping) and Post-Pruning (cost-complexity pruning)?'
    options:
      - 'Pre-pruning uses Gini; post-pruning uses Entropy'
      - 'Pre-pruning applies to classification; post-pruning applies to regression'
      - 'Pre-pruning limits growth; post-pruning collapses subtrees'
      - 'There is no mathematical difference'
    answer_index: 2
    explanation: 'Pre-pruning stops splitting early (which can suffer from premature stopping when complex interactions require multiple splits). Post-pruning builds the full tree and prunes back weak branches using cost-complexity optimization.'

  - question: 'Why is it difficult for a standard Decision Tree to model a simple diagonal linear boundary like x_1 + x_2 = 1?'
    options:
      - 'Because diagonal lines have zero Gini impurity'
      - 'Because decision trees cannot compute addition'
      - 'Because linear boundaries require negative thresholds'
      - 'Axis-aligned splits make a diagonal a staircase'
    answer_index: 3
    explanation: 'Axis-aligned splits must approximate continuous diagonal lines using a high-variance staircase approximation, requiring dozens of deep nodes where a single logistic regression hyperplane would suffice.'
