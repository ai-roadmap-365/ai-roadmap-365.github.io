visuals:
  - id: decision-tree-splitting
    file: assets/decision-tree-splitting.svg
    type: diagram
    title: 'Decision Tree Architecture and 2D Feature Space Partitioning'
    alt: 'Diagram showing a binary decision tree alongside its corresponding 2D feature space partitioned into axis-aligned rectangular regions R1, R2, and R3.'
    description: 'A static architecture diagram illustrating the direct equivalence between hierarchical tree nodes and axis-aligned orthogonal bounding boxes in 2D feature space.'
  - id: gini-vs-entropy-curves
    file: assets/gini-vs-entropy-curves.svg
    type: flow-animated
    title: 'Impurity Metrics Comparison: Gini vs Entropy vs Misclassification'
    alt: 'Animated graph comparing Gini Impurity, Scaled Shannon Entropy, and Misclassification Error across class probability p in the interval zero to one.'
    description: 'An animated diagnostic chart contrasting the shapes of Gini, Entropy, and Misclassification error curves with reduced-motion fallback.'
  - id: tree-idea
    file: assets/tree-idea.svg
    type: diagram
    title: 'How a tree decides'
    alt: 'Diagram: the four steps of decision tree prediction'
    description: 'A four-stage description of tree prediction covering the root question, branching, recursion and the leaf.'
  - id: impurity
    file: assets/impurity.svg
    type: diagram
    title: 'Measuring a good split'
    alt: 'Diagram: how split quality is measured by impurity reduction'
    description: 'A four-stage description of impurity covering the pure node, the mixed node, the measure and the gain.'
  - id: greedy-split
    file: assets/greedy-split.svg
    type: diagram
    title: 'Why splitting is greedy'
    alt: 'Diagram: how the greedy split search works and what it gives up'
    description: 'A four-stage description of greedy splitting covering the candidate search, the local choice, the recursion and the consequence.'
  - id: tree-overfitting
    file: assets/tree-overfitting.svg
    type: diagram
    title: 'Why a tree overfits'
    alt: 'Diagram: how an unconstrained decision tree overfits and how it is controlled'
    description: 'A four-stage description of tree overfitting covering unlimited growth, memorisation, the controls and pruning.'
  - id: tree-not
    file: assets/tree-not.svg
    type: diagram
    title: 'What a decision tree is not'
    alt: 'Diagram: four misconceptions about decision trees'
    description: 'A two-column comparison of misconceptions about decision trees against what is true.'
  - id: tree-history
    file: assets/tree-history.svg
    type: diagram
    title: 'Four steps in decision trees'
    alt: 'Diagram: the historical progression of decision tree methods'
    description: 'A four-stage description of tree history covering early rule induction, the standard algorithms, overfitting recognition and ensembles.'
  - id: flowchart
    file: assets/flowchart.svg
    type: diagram
    title: 'A diagnostic flowchart'
    alt: 'Diagram: a hand-written flowchart compared with a learned decision tree'
    description: 'A two-column comparison of an expert-written flowchart against a learned tree.'
  - id: tree-implications
    file: assets/tree-implications.svg
    type: diagram
    title: 'Four consequences of trees'
    alt: 'Diagram: the interpretability, robustness, variance and extrapolation implications of decision trees'
    description: 'A four-stage description of tree implications covering interpretability, preprocessing robustness, variance and extrapolation failure.'
  - id: tree-when
    file: assets/tree-when.svg
    type: diagram
    title: 'When a single tree is right'
    alt: 'Diagram: when a single decision tree is appropriate'
    description: 'A two-column comparison of situations favouring a single tree against ensembles.'
  - id: recursive-induction
    file: assets/recursive-induction.svg
    type: diagram
    title: 'Growing the tree'
    alt: 'Diagram: the recursive procedure that builds a decision tree'
    description: 'A four-stage description of tree induction covering the node, the best split, the recursion and the stopping conditions.'
  - id: tree-is
    file: assets/tree-is.svg
    type: diagram
    title: 'What a decision tree is'
    alt: 'Diagram: the four defining properties of a decision tree'
    description: 'A two-column comparison of what a decision tree is against what that implies.'
  - id: tree-why
    file: assets/tree-why.svg
    type: diagram
    title: 'What trees solved'
    alt: 'Diagram: the four problems decision trees were created to solve'
    description: 'A four-stage description of the problems trees address covering interpretability, mixed feature types, non-linearity and preprocessing.'
