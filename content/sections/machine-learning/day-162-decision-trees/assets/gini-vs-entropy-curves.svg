<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Gini vs Entropy Impurity Comparison">
  <title>Impurity Metrics Comparison: Gini vs Entropy</title>
  <defs>
    <style>
      .d162f-bg { fill: #f8fafc; }
      .d162f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d162f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d162f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .d162f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 13px; font-weight: 600; }
      
      @keyframes d162f-pulse {
        0%, 100% { stroke-width: 3; }
        50% { stroke-width: 5; }
      }
      .d162f-curve-gini { stroke: #2563eb; fill: none; stroke-width: 3.5; animation: d162f-pulse 4s infinite ease-in-out; }
      .d162f-curve-ent { stroke: #dc2626; fill: none; stroke-width: 2.5; stroke-dasharray: 4 2; }
      .d162f-curve-err { stroke: #16a34a; fill: none; stroke-width: 2; stroke-dasharray: 2 2; }
      
      @media (prefers-reduced-motion: reduce) {
        .d162f-curve-gini { animation: none; stroke-width: 3.5; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="d162f-bg" />

  <text x="40" y="45" class="d162f-title" font-size="22">Impurity Functions for Binary Classification</text>
  <text x="40" y="70" class="d162f-text">Comparing Gini Impurity, Scaled Shannon Entropy (0.5 · H), and Misclassification Error</text>

  <!-- Left: Plot Area -->
  <rect x="40" y="100" width="460" height="340" class="d162f-card" />

  <!-- Grid and Axes -->
  <line x1="80" y1="380" x2="460" y2="380" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="140" x2="80" y2="380" stroke="#94a3b8" stroke-width="2" />

  <!-- Y ticks -->
  <text x="50" y="385" class="d162f-math" font-size="11">0.0</text>
  <text x="50" y="265" class="d162f-math" font-size="11">0.25</text>
  <text x="50" y="145" class="d162f-math" font-size="11">0.50</text>
  <line x1="75" y1="140" x2="460" y2="140" stroke="#e2e8f0" stroke-dasharray="2" />
  <line x1="75" y1="260" x2="460" y2="260" stroke="#e2e8f0" stroke-dasharray="2" />

  <!-- X ticks -->
  <text x="80" y="405" class="d162f-math" font-size="11">0.0</text>
  <text x="270" y="405" class="d162f-math" font-size="11">0.50</text>
  <text x="450" y="405" class="d162f-math" font-size="11">1.0</text>
  <text x="230" y="425" class="d162f-text" font-weight="700">Class Probability p ➔</text>

  <!-- Curves: parabolic Gini 4*p*(1-p)*0.5 -> peak 0.5 at p=0.5 -->
  <!-- Scaled Entropy: 0.5 * (-p log2 p - (1-p) log2 (1-p)) -> peak 0.5 at p=0.5 -->
  <!-- Misclassification: 1 - max(p, 1-p) -> triangle peak 0.5 at p=0.5 -->
  
  <!-- Misclassification (Green triangle) -->
  <path d="M 80 380 L 270 140 L 460 380" class="d162f-curve-err" />

  <!-- Scaled Entropy (Red dotted) -->
  <path d="M 80 380 Q 150 170 270 140 Q 390 170 460 380" class="d162f-curve-ent" />

  <!-- Gini Parabola (Blue solid) -->
  <path d="M 80 380 Q 270 140 460 380" class="d162f-curve-gini" />

  <!-- Right: Explanatory Card -->
  <rect x="520" y="100" width="340" height="340" class="d162f-card" />
  <text x="540" y="130" class="d162f-title" font-size="16" fill="#1e40af">Impurity Mathematical Forms</text>

  <!-- 1. Gini -->
  <rect x="540" y="150" width="300" height="65" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
  <text x="555" y="172" class="d162f-title" font-size="13" fill="#1d4ed8">1. Gini Impurity (CART Default)</text>
  <text x="555" y="195" class="d162f-math" font-size="12">G = 1 - (p² + (1-p)²) = 2p(1-p)</text>

  <!-- 2. Entropy -->
  <rect x="540" y="225" width="300" height="65" fill="#fef2f2" stroke="#fecaca" rx="6" />
  <text x="555" y="247" class="d162f-title" font-size="13" fill="#dc2626">2. Shannon Entropy (C4.5 / ID3)</text>
  <text x="555" y="270" class="d162f-math" font-size="12">H = -p·log₂(p) - (1-p)·log₂(1-p)</text>

  <!-- 3. Misclassification -->
  <rect x="540" y="300" width="300" height="65" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
  <text x="555" y="322" class="d162f-title" font-size="13" fill="#16a34a">3. Misclassification Error</text>
  <text x="555" y="345" class="d162f-math" font-size="12">E = 1 - max(p, 1-p)</text>

  <text x="540" y="395" class="d162f-text" font-size="12">Gini and Entropy are strictly concave and differentiable, making them vastly superior to raw error for greedy splitting.</text>
</svg>
