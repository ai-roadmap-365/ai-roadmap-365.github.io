<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Decision Tree Splitting Architecture">
  <title>Decision Tree Architecture and Feature Space Partitioning</title>
  <defs>
    <style>
      .d162a-bg { fill: #f8fafc; }
      .d162a-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 6; }
      .d162a-header { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .d162a-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .d162a-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .d162a-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 12px; font-weight: 600; }
      .d162a-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d162a-arr); fill: none; }
      .d162a-leaf-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 6; }
      .d162a-leaf-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .d162a-leaf-green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 6; }
    </style>
    <marker id="d162a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d162a-bg" />

  <text x="40" y="45" class="d162a-header" font-size="22">Decision Tree Architecture &amp; Space Partitioning</text>
  <text x="40" y="70" class="d162a-text">Equivalence between hierarchical tree nodes and axis-aligned bounding rectangles</text>

  <!-- Left: Binary Tree Structure -->
  <rect x="40" y="100" width="400" height="340" class="d162a-box" />
  <text x="60" y="130" class="d162a-title" fill="#1e40af">Hierarchical Decision Logic</text>

  <!-- Root Node -->
  <rect x="150" y="150" width="180" height="50" class="d162a-box" fill="#f8fafc" />
  <text x="175" y="172" class="d162a-math">x₁ ≤ 4.5 ?</text>
  <text x="175" y="190" class="d162a-text" font-size="10" fill="#64748b">Root Node (Depth 0)</text>

  <!-- Left Branch -->
  <path d="M 190 200 L 110 240" class="d162a-arrow" />
  <text x="125" y="215" class="d162a-text" font-size="11" fill="#15803d">True</text>

  <!-- Left Leaf: Region 1 -->
  <rect x="50" y="240" width="120" height="60" class="d162a-leaf-red" />
  <text x="60" y="265" class="d162a-title" fill="#991b1b">Region R₁</text>
  <text x="60" y="285" class="d162a-math" fill="#b91c1c">Class: Red</text>

  <!-- Right Branch -->
  <path d="M 290 200 L 330 240" class="d162a-arrow" />
  <text x="315" y="215" class="d162a-text" font-size="11" fill="#dc2626">False</text>

  <!-- Node 2 -->
  <rect x="250" y="240" width="170" height="50" class="d162a-box" fill="#f8fafc" />
  <text x="270" y="262" class="d162a-math">x₂ ≤ 6.0 ?</text>
  <text x="270" y="280" class="d162a-text" font-size="10" fill="#64748b">Internal Node (Depth 1)</text>

  <!-- Children of Node 2 -->
  <path d="M 290 290 L 250 330" class="d162a-arrow" />
  <path d="M 380 290 L 390 330" class="d162a-arrow" />

  <!-- Leaf R2 -->
  <rect x="190" y="330" width="110" height="60" class="d162a-leaf-blue" />
  <text x="200" y="355" class="d162a-title" fill="#1d4ed8">Region R₂</text>
  <text x="200" y="375" class="d162a-math" fill="#1e40af">Class: Blue</text>

  <!-- Leaf R3 -->
  <rect x="320" y="330" width="110" height="60" class="d162a-leaf-green" />
  <text x="330" y="355" class="d162a-title" fill="#15803d">Region R₃</text>
  <text x="330" y="375" class="d162a-math" fill="#166534">Class: Green</text>

  <!-- Right: 2D Space Partition -->
  <rect x="470" y="100" width="390" height="340" class="d162a-box" />
  <text x="490" y="130" class="d162a-title" fill="#1e40af">2D Feature Space Orthogonal Partitions</text>

  <!-- Canvas Coordinates -->
  <rect x="520" y="150" width="300" height="240" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Split 1: x1 = 4.5 (vertical line at x = 620) -->
  <line x1="620" y1="150" x2="620" y2="390" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 2" />
  <!-- Region R1 background -->
  <rect x="520" y="150" width="100" height="240" fill="#fef2f2" opacity="0.6" />
  <text x="545" y="270" class="d162a-title" fill="#991b1b">R₁ (Red)</text>
  <text x="590" y="415" class="d162a-math" font-size="11">x₁=4.5</text>

  <!-- Split 2: x2 = 6.0 in right region (horizontal line at y = 270) -->
  <line x1="620" y1="270" x2="820" y2="270" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 2" />
  <!-- Region R2 background (x2 <= 6.0, bottom right) -->
  <rect x="620" y="270" width="200" height="120" fill="#eff6ff" opacity="0.6" />
  <text x="690" y="340" class="d162a-title" fill="#1d4ed8">R₂ (Blue)</text>

  <!-- Region R3 background (x2 > 6.0, top right) -->
  <rect x="620" y="150" width="200" height="120" fill="#f0fdf4" opacity="0.6" />
  <text x="690" y="215" class="d162a-title" fill="#15803d">R₃ (Green)</text>
  <text x="830" y="275" class="d162a-math" font-size="11">x₂=6.0</text>

  <!-- Axis labels -->
  <text x="670" y="420" class="d162a-text" font-weight="700">Feature x₁ ➔</text>
  <text x="485" y="280" class="d162a-text" font-weight="700" transform="rotate(-90 485,280)">Feature x₂ ➔</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}.dx-f3{animation-delay:1.26s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 190 200 L 110 240" stroke="#2563eb" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 290 200 L 330 240" stroke="#2563eb" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 290 290 L 250 330" stroke="#2563eb" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f3" d="M 380 290 L 390 330" stroke="#2563eb" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
