<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why a tree overfits</title>
  <style>
    .tree-overfitting-bg   { fill: #f8fafc; }
    .tree-overfitting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-overfitting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-overfitting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-overfitting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-overfitting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-overfitting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-overfitting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-overfitting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-overfitting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-overfitting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-overfitting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-overfitting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tree-overfitting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tree-overfitting-stage { opacity: 1; }

    .tree-overfitting-s0 { animation-delay: 0.00s; }
    .tree-overfitting-e0 { animation-delay: 0.00s; }
    .tree-overfitting-s1 { animation-delay: 1.28s; }
    .tree-overfitting-e1 { animation-delay: 1.28s; }
    .tree-overfitting-s2 { animation-delay: 2.56s; }
    .tree-overfitting-e2 { animation-delay: 2.56s; }
    .tree-overfitting-s3 { animation-delay: 3.84s; }
    .tree-overfitting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tree-overfitting-conn  { animation: tree-overfitting-trace 6.4s ease-in-out infinite; }
      .tree-overfitting-stage { animation: tree-overfitting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tree-overfitting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tree-overfitting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tree-overfitting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tree-overfitting-stage { animation: tree-overfitting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tree-overfitting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tree-overfitting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tree-overfitting-bg" width="980" height="322"/>
  <text class="tree-overfitting-h1"  x="30" y="40">Why a tree overfits</text>
  <text class="tree-overfitting-sub" x="30" y="64">Four steps.</text>
  <g class="tree-overfitting-stage tree-overfitting-s0">
    <rect class="tree-overfitting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tree-overfitting-step" x="44" y="142">01</text>
    <text class="tree-overfitting-name" x="70" y="142">Left unconstrained, a tree splits until every leaf is pure</text>
    <text class="tree-overfitting-desc" x="44" y="166">One example per leaf, if</text>
    <text class="tree-overfitting-desc" x="44" y="182">necessary.</text>
  </g>
  <line class="tree-overfitting-line tree-overfitting-conn tree-overfitting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tree-overfitting-tip)"/>
  <g class="tree-overfitting-stage tree-overfitting-s1">
    <rect class="tree-overfitting-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tree-overfitting-step" x="280" y="142">02</text>
    <text class="tree-overfitting-name" x="306" y="142">Which is memorisation, not learning</text>
    <text class="tree-overfitting-desc" x="280" y="166">Perfect on training data, poor</text>
    <text class="tree-overfitting-desc" x="280" y="182">on anything else.</text>
  </g>
  <line class="tree-overfitting-line tree-overfitting-conn tree-overfitting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tree-overfitting-tip)"/>
  <g class="tree-overfitting-stage tree-overfitting-s2">
    <rect class="tree-overfitting-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tree-overfitting-step" x="516" y="142">03</text>
    <text class="tree-overfitting-name" x="542" y="142">So constrain depth, leaf size and minimum gain</text>
    <text class="tree-overfitting-desc" x="516" y="166">Which stops splitting early.</text>
  </g>
  <line class="tree-overfitting-line tree-overfitting-conn tree-overfitting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tree-overfitting-tip)"/>
  <g class="tree-overfitting-stage tree-overfitting-s3">
    <rect class="tree-overfitting-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tree-overfitting-step" x="752" y="142">04</text>
    <text class="tree-overfitting-name" x="778" y="142">Or grow fully and prune back</text>
    <text class="tree-overfitting-desc" x="752" y="166">Which is usually better, and</text>
    <text class="tree-overfitting-desc" x="752" y="182">more expensive.</text>
  </g>
  <text class="tree-overfitting-sub" x="30" y="304">Growing then pruning outperforms early stopping because a split that looks useless can enable a valuable one beneath it, which early stopping never discovers.</text>
</svg>
