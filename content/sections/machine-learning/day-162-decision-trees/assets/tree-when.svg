<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when to use an ensemble.">
  <title>When a single tree is right</title>
  <style>
    .tree-when-bg   { fill: #f8fafc; }
    .tree-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-when-row { opacity: 1; }
    .tree-when-r0 { animation-delay: 0.00s; }
    .tree-when-r1 { animation-delay: 0.45s; }
    .tree-when-r2 { animation-delay: 0.90s; }
    .tree-when-r3 { animation-delay: 1.35s; }
    .tree-when-r4 { animation-delay: 1.80s; }
    .tree-when-row { animation: tree-when-reveal 7.3s ease-in-out infinite; }
    @keyframes tree-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tree-when-bg" width="980" height="390"/>
  <text class="tree-when-h1"  x="30" y="40">When a single tree is right</text>
  <text class="tree-when-sub" x="30" y="64">And when to use an ensemble.</text>
  <rect class="tree-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tree-when-name" x="46" y="122">A single tree</text>
  <text class="tree-when-desc" x="46" y="142">Four cases.</text>
  <text class="tree-when-desc tree-when-row tree-when-r0" x="46" y="182">Where the rules must be read and audited</text>
  <text class="tree-when-desc tree-when-row tree-when-r1" x="46" y="216">As an exploratory look at the data</text>
  <text class="tree-when-desc tree-when-row tree-when-r2" x="46" y="250">Where a human will act on the rules</text>
  <text class="tree-when-desc tree-when-row tree-when-r3" x="46" y="284">Very small datasets</text>
  <text class="tree-when-desc tree-when-row tree-when-r4" x="46" y="318">Where interpretability outranks accuracy</text>
  <rect class="tree-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tree-when-name" x="526" y="122">An ensemble</text>
  <text class="tree-when-desc" x="526" y="142">Almost everywhere else.</text>
  <text class="tree-when-desc tree-when-row tree-when-r0" x="526" y="182">Where accuracy is the priority</text>
  <text class="tree-when-desc tree-when-row tree-when-r1" x="526" y="216">Tabular data of any size</text>
  <text class="tree-when-desc tree-when-row tree-when-r2" x="526" y="250">Where variance is hurting you</text>
  <text class="tree-when-desc tree-when-row tree-when-r3" x="526" y="284">Production prediction</text>
  <text class="tree-when-desc tree-when-row tree-when-r4" x="526" y="318">Which is most of the time</text>
  <text class="tree-when-sub" x="30" y="372">A single tree is best thought of as an inspection tool rather than a production model, which is how the strongest tabular practitioners actually use it.</text>
</svg>
