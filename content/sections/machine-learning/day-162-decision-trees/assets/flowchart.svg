<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Written by data.">
  <title>A diagnostic flowchart</title>
  <style>
    .flowchart-bg   { fill: #f8fafc; }
    .flowchart-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flowchart-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flowchart-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flowchart-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flowchart-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flowchart-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flowchart-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .flowchart-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .flowchart-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .flowchart-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .flowchart-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .flowchart-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flowchart-row { opacity: 1; }
    .flowchart-r0 { animation-delay: 0.00s; }
    .flowchart-r1 { animation-delay: 0.45s; }
    .flowchart-r2 { animation-delay: 0.90s; }
    .flowchart-r3 { animation-delay: 1.35s; }
    .flowchart-r4 { animation-delay: 1.80s; }
    .flowchart-row { animation: flowchart-reveal 7.3s ease-in-out infinite; }
    @keyframes flowchart-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="flowchart-bg" width="980" height="390"/>
  <text class="flowchart-h1"  x="30" y="40">A diagnostic flowchart</text>
  <text class="flowchart-sub" x="30" y="64">Written by data.</text>
  <rect class="flowchart-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="flowchart-name" x="46" y="122">Written by an expert</text>
  <text class="flowchart-desc" x="46" y="142">From knowledge.</text>
  <text class="flowchart-desc flowchart-row flowchart-r0" x="46" y="182">Questions chosen by experience</text>
  <text class="flowchart-desc flowchart-row flowchart-r1" x="46" y="216">Thresholds set by judgment</text>
  <text class="flowchart-desc flowchart-row flowchart-r2" x="46" y="250">Reflects understood causes</text>
  <text class="flowchart-desc flowchart-row flowchart-r3" x="46" y="284">Slow to produce and revise</text>
  <text class="flowchart-desc flowchart-row flowchart-r4" x="46" y="318">Trusted because it is reasoned</text>
  <rect class="flowchart-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="flowchart-name" x="526" y="122">Learned from data</text>
  <text class="flowchart-desc" x="526" y="142">From correlation.</text>
  <text class="flowchart-desc flowchart-row flowchart-r0" x="526" y="182">Questions chosen by impurity reduction</text>
  <text class="flowchart-desc flowchart-row flowchart-r1" x="526" y="216">Thresholds set by search</text>
  <text class="flowchart-desc flowchart-row flowchart-r2" x="526" y="250">Reflects correlation, not cause</text>
  <text class="flowchart-desc flowchart-row flowchart-r3" x="526" y="284">Produced in seconds</text>
  <text class="flowchart-desc flowchart-row flowchart-r4" x="526" y="318">Readable, and needs checking</text>
  <text class="flowchart-sub" x="30" y="372">The correlation caveat matters: a learned tree may split on a proxy that predicts well and would be indefensible as a stated reason for a decision.</text>
</svg>
