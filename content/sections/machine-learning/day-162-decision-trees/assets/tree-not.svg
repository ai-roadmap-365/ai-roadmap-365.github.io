<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What a decision tree is not</title>
  <style>
    .tree-not-bg   { fill: #f8fafc; }
    .tree-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-not-row { opacity: 1; }
    .tree-not-r0 { animation-delay: 0.00s; }
    .tree-not-r1 { animation-delay: 0.45s; }
    .tree-not-r2 { animation-delay: 0.90s; }
    .tree-not-r3 { animation-delay: 1.35s; }
    .tree-not-r4 { animation-delay: 1.80s; }
    .tree-not-row { animation: tree-not-reveal 7.3s ease-in-out infinite; }
    @keyframes tree-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tree-not-bg" width="980" height="390"/>
  <text class="tree-not-h1"  x="30" y="40">What a decision tree is not</text>
  <text class="tree-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="tree-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tree-not-name" x="46" y="122">The misconception</text>
  <text class="tree-not-desc" x="46" y="142">Commonly held.</text>
  <text class="tree-not-desc tree-not-row tree-not-r0" x="46" y="182">Trees need feature scaling</text>
  <text class="tree-not-desc tree-not-row tree-not-r1" x="46" y="216">A deeper tree is a better tree</text>
  <text class="tree-not-desc tree-not-row tree-not-r2" x="46" y="250">Trees find the optimal set of rules</text>
  <text class="tree-not-desc tree-not-row tree-not-r3" x="46" y="284">They handle any relationship</text>
  <text class="tree-not-desc tree-not-row tree-not-r4" x="46" y="318">A single tree is competitive</text>
  <rect class="tree-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tree-not-name" x="526" y="122">What is true</text>
  <text class="tree-not-desc" x="526" y="142">Actually.</text>
  <text class="tree-not-desc tree-not-row tree-not-r0" x="526" y="182">They are entirely scale-invariant</text>
  <text class="tree-not-desc tree-not-row tree-not-r1" x="526" y="216">Depth is the main overfitting control</text>
  <text class="tree-not-desc tree-not-row tree-not-r2" x="526" y="250">Greedy and local, never optimal</text>
  <text class="tree-not-desc tree-not-row tree-not-r3" x="526" y="284">They cannot extrapolate at all</text>
  <text class="tree-not-desc tree-not-row tree-not-r4" x="526" y="318">Ensembles of trees are; one is not</text>
  <text class="tree-not-sub" x="30" y="372">Scale invariance is a genuine practical advantage: it removes an entire category of preprocessing error that affects every distance-based and linear model.</text>
</svg>
