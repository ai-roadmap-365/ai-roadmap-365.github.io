<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>How a tree decides</title>
  <style>
    .tree-idea-bg   { fill: #f8fafc; }
    .tree-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tree-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tree-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tree-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tree-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tree-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tree-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tree-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tree-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tree-idea-stage { opacity: 1; }

    .tree-idea-s0 { animation-delay: 0.00s; }
    .tree-idea-e0 { animation-delay: 0.00s; }
    .tree-idea-s1 { animation-delay: 1.28s; }
    .tree-idea-e1 { animation-delay: 1.28s; }
    .tree-idea-s2 { animation-delay: 2.56s; }
    .tree-idea-e2 { animation-delay: 2.56s; }
    .tree-idea-s3 { animation-delay: 3.84s; }
    .tree-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tree-idea-conn  { animation: tree-idea-trace 6.4s ease-in-out infinite; }
      .tree-idea-stage { animation: tree-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tree-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tree-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tree-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tree-idea-stage { animation: tree-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tree-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tree-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tree-idea-bg" width="980" height="322"/>
  <text class="tree-idea-h1"  x="30" y="40">How a tree decides</text>
  <text class="tree-idea-sub" x="30" y="64">Four steps.</text>
  <g class="tree-idea-stage tree-idea-s0">
    <rect class="tree-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tree-idea-step" x="44" y="142">01</text>
    <text class="tree-idea-name" x="70" y="142">Ask one question about one feature</text>
    <text class="tree-idea-desc" x="44" y="166">Is this value above a threshold?</text>
  </g>
  <line class="tree-idea-line tree-idea-conn tree-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tree-idea-tip)"/>
  <g class="tree-idea-stage tree-idea-s1">
    <rect class="tree-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tree-idea-step" x="280" y="142">02</text>
    <text class="tree-idea-name" x="306" y="142">Send the example down the matching branch</text>
    <text class="tree-idea-desc" x="280" y="166">Two branches, in the standard</text>
    <text class="tree-idea-desc" x="280" y="182">formulation.</text>
  </g>
  <line class="tree-idea-line tree-idea-conn tree-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tree-idea-tip)"/>
  <g class="tree-idea-stage tree-idea-s2">
    <rect class="tree-idea-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tree-idea-step" x="516" y="142">03</text>
    <text class="tree-idea-name" x="542" y="142">Repeat with a new question</text>
    <text class="tree-idea-desc" x="516" y="166">Each node asking about whatever</text>
    <text class="tree-idea-desc" x="516" y="182">separates best there.</text>
  </g>
  <line class="tree-idea-line tree-idea-conn tree-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tree-idea-tip)"/>
  <g class="tree-idea-stage tree-idea-s3">
    <rect class="tree-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tree-idea-step" x="752" y="142">04</text>
    <text class="tree-idea-name" x="778" y="142">Until a leaf gives the answer</text>
    <text class="tree-idea-desc" x="752" y="166">And the path taken is the</text>
    <text class="tree-idea-desc" x="752" y="182">explanation.</text>
    <text class="tree-idea-edge" x="752" y="242">readable</text>
  </g>
  <text class="tree-idea-sub" x="30" y="304">The path being the explanation is what makes trees uniquely interpretable: the reason for a prediction is a short list of conditions anyone can read.</text>
</svg>
