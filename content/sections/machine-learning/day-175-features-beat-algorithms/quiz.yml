questions:
  - question: 'What is the core thesis behind the famous maxim "Features Beat Algorithms" in applied machine learning?'
    options:
      - 'Feature engineering replaces the need for any machine learning code'
      - 'A model can only learn from the representation it is given'
      - 'Algorithms are completely irrelevant in machine learning'
      - 'Deep learning has eliminated all feature engineering'
    answer_index: 1
    explanation: 'Algorithms optimize mathematical loss functions over the provided input space. If the feature representation lacks crucial domain interactions, no algorithm can discover them reliably.'

  - question: 'How does Cover’s Theorem (1965) mathematically explain why feature engineering empowers linear models?'
    options:
      - 'Cover Theorem states gradient descent always converges in 1 step'
      - 'Cover Theorem proves all matrices are invertible'
      - 'A non-linear projection can make it linearly separable'
      - 'Cover Theorem only applies to decision trees'
    answer_index: 2
    explanation: 'Thomas Cover proved that non-linear transformations into higher dimensions drastically increase the probability that data classes are linearly separable by a hyperplane.'

  - question: 'What is the "CMLC" (Changing Anything Changes Everything) anti-pattern in ML technical debt (Sculley et al., 2015)?'
    options:
      - 'A hardware memory leak'
      - 'A syntax error in Python'
      - 'A database connection timeout'
      - 'Models entangle all signals'
    answer_index: 3
    explanation: 'Unlike traditional modular software, ML systems are inherently entangled. You cannot isolate the effect of one feature without affecting the entire joint optimization landscape.'

  - question: 'What are the three primary production advantages of a Simple Linear Model on Engineered Features compared to a 100-Tree GBDT on Raw Features?'
    options:
      - 'Low latency, exact explainability, simple deployment'
      - '1. Uses zero CPU RAM, 2. Never needs training data, 3. 100% test accuracy'
      - '1. Smaller CSV files, 2. No need for Python, 3. Can run without electricity'
      - 'There are no advantages; complex models are always better'
    answer_index: 0
    explanation: 'Linear models compute a simple dot product w^T x in sub-millisecond time and provide transparent coefficient attribution for regulatory audits.'

  - question: 'What is a Feature Store (such as Feast or Hopsworks), and what critical problem does it solve in enterprise MLOps?'
    options:
      - 'A cloud storage bucket for storing raw CSV files'
      - 'A repository of standardized feature definitions'
      - 'A database that automatically generates machine learning models'
      - 'An IDE for writing Python code'
    answer_index: 1
    explanation: 'Feature stores ensure that the exact same feature engineering code used during offline batch training is executed during online real-time inference.'

  - question: 'What is a Feature Ablation Study?'
    options:
      - 'A technique for visualizing decision trees'
      - 'A method for compressing model weights'
      - 'Removing features one by one to measure each'
      - 'A process for generating synthetic data'
    answer_index: 2
    explanation: 'Ablation studies isolate the exact Return on Investment (ROI) of each feature, identifying redundant or harmful features to prune.'

  - question: 'What is the "Unreasonable Effectiveness of Data" principle (Halevy, Norvig, Pereira, 2009)?'
    options:
      - 'Linear models cannot process large datasets'
      - 'Data volume has no impact on machine learning performance'
      - 'Deep learning requires zero data'
      - 'Simple algorithms on great data beat the reverse'
    answer_index: 3
    explanation: 'Peter Norvig and Google researchers showed that scaling high-quality data and representations delivers vastly larger accuracy leaps than tweaking algorithmic formulations.'

  - question: 'What is the recommended Feature Lifecycle Flywheel in professional ML engineering?'
    options:
      - 'Discovery, leak-free pipeline, selection, store, monitoring'
      - '1. Train model -> 2. Deploy -> 3. Never touch it again'
      - '1. Generate all possible polynomial features -> 2. Fit model'
      - '1. Delete all features -> 2. Train on target'
    answer_index: 0
    explanation: 'A closed-loop feature lifecycle ensures continuous improvement, monitoring for data drift, and retirement of dead features to minimize technical debt.'
