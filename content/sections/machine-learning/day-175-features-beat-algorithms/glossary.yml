terms:
  - term: 'Fundamental Theorem of Applied ML'
    definition: 'The principle that data quality and representation richness bound model performance far more than algorithmic complexity.'
  - term: 'Cover’s Theorem (1965)'
    definition: 'A theorem stating that non-linear projection of a pattern-classification problem into a higher-dimensional space increases the likelihood of linear separability.'
  - term: 'Representational Capacity'
    definition: 'The space of functional relationships that a machine learning model can express given a specific feature representation.'
  - term: 'CMLC (Changing Anything Changes Everything)'
    definition: 'The fundamental machine learning technical debt anti-pattern where changing one feature alters the entire joint optimization landscape.'
  - term: 'Feature ROI'
    definition: 'The ratio of predictive metric improvement (e.g. R2 / ROC-AUC gain) to computational inference latency and engineering maintenance cost.'
  - term: 'Feature Store'
    definition: 'A centralized data infrastructure layer that manages, version-controls, and serves standardized features across training and real-time production.'
  - term: 'Feature Ablation Study'
    definition: 'Systematically removing features from a model to measure their isolated marginal impact on validation performance.'
  - term: 'Train/Serve Skew'
    definition: 'The discrepancy between feature values computed during training and feature values generated during live production inference.'
  - term: 'Feature Drift'
    definition: 'The statistical shift in the distribution of an input feature over time due to real-world behavioral or environmental changes.'
  - term: 'Dead Feature'
    definition: 'An unmaintained feature in production that no longer carries predictive signal or whose upstream data feed has silently corrupted.'
