<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it applies least.">
  <title>When this applies most</title>
  <style>
    .features-when-bg   { fill: #f8fafc; }
    .features-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .features-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .features-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .features-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .features-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .features-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-when-row { opacity: 1; }
    .features-when-r0 { animation-delay: 0.00s; }
    .features-when-r1 { animation-delay: 0.45s; }
    .features-when-r2 { animation-delay: 0.90s; }
    .features-when-r3 { animation-delay: 1.35s; }
    .features-when-r4 { animation-delay: 1.80s; }
    .features-when-row { animation: features-when-reveal 7.3s ease-in-out infinite; }
    @keyframes features-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="features-when-bg" width="980" height="390"/>
  <text class="features-when-h1"  x="30" y="40">When this applies most</text>
  <text class="features-when-sub" x="30" y="64">And where it applies least.</text>
  <rect class="features-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="features-when-name" x="46" y="122">Features dominate</text>
  <text class="features-when-desc" x="46" y="142">Four settings.</text>
  <text class="features-when-desc features-when-row features-when-r0" x="46" y="182">Tabular and transactional data</text>
  <text class="features-when-desc features-when-row features-when-r1" x="46" y="216">Small to medium datasets</text>
  <text class="features-when-desc features-when-row features-when-r2" x="46" y="250">Where domain knowledge exists</text>
  <text class="features-when-desc features-when-row features-when-r3" x="46" y="284">Business and operational problems</text>
  <text class="features-when-desc features-when-row features-when-r4" x="46" y="318">Where the baseline is far from the ceiling</text>
  <rect class="features-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="features-when-name" x="526" y="122">Models matter more</text>
  <text class="features-when-desc" x="526" y="142">Also four.</text>
  <text class="features-when-desc features-when-row features-when-r0" x="526" y="182">Images, audio, text and video</text>
  <text class="features-when-desc features-when-row features-when-r1" x="526" y="216">Very large datasets</text>
  <text class="features-when-desc features-when-row features-when-r2" x="526" y="250">Where representations must be learned</text>
  <text class="features-when-desc features-when-row features-when-r3" x="526" y="284">Research benchmarks</text>
  <text class="features-when-desc features-when-row features-when-r4" x="526" y="318">Where features are already near-optimal</text>
  <text class="features-when-sub" x="30" y="372">The right-hand column is where deep learning won, and the reason is the same finding: those are the settings where a person cannot hand-build the features.</text>
</svg>
