<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What this claim is not</title>
  <style>
    .features-not-bg   { fill: #f8fafc; }
    .features-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .features-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .features-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .features-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .features-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .features-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .features-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .features-not-row { opacity: 1; }
    .features-not-r0 { animation-delay: 0.00s; }
    .features-not-r1 { animation-delay: 0.45s; }
    .features-not-r2 { animation-delay: 0.90s; }
    .features-not-r3 { animation-delay: 1.35s; }
    .features-not-r4 { animation-delay: 1.80s; }
    .features-not-row { animation: features-not-reveal 7.3s ease-in-out infinite; }
    @keyframes features-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="features-not-bg" width="980" height="390"/>
  <text class="features-not-h1"  x="30" y="40">What this claim is not</text>
  <text class="features-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="features-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="features-not-name" x="46" y="122">The misconception</text>
  <text class="features-not-desc" x="46" y="142">Commonly held.</text>
  <text class="features-not-desc features-not-row features-not-r0" x="46" y="182">Model choice does not matter at all</text>
  <text class="features-not-desc features-not-row features-not-r1" x="46" y="216">It means never tune anything</text>
  <text class="features-not-desc features-not-row features-not-r2" x="46" y="250">It applies everywhere equally</text>
  <text class="features-not-desc features-not-row features-not-r3" x="46" y="284">More features is the same as better features</text>
  <text class="features-not-desc features-not-row features-not-r4" x="46" y="318">Deep learning disproved it</text>
  <rect class="features-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="features-not-name" x="526" y="122">What is true</text>
  <text class="features-not-desc" x="526" y="142">Actually.</text>
  <text class="features-not-desc features-not-row features-not-r0" x="526" y="182">It matters less than features, not not at all</text>
  <text class="features-not-desc features-not-row features-not-r1" x="526" y="216">Tune after the features are good</text>
  <text class="features-not-desc features-not-row features-not-r2" x="526" y="250">It is strongest on tabular data</text>
  <text class="features-not-desc features-not-row features-not-r3" x="526" y="284">Irrelevant features actively hurt</text>
  <text class="features-not-desc features-not-row features-not-r4" x="526" y="318">It moved the feature learning inside the model</text>
  <text class="features-not-sub" x="30" y="372">Deep learning did not disprove the claim so much as automate it: the features are still decisive, and the network now learns them instead of a person building them.</text>
</svg>
