<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-label="Feature Flywheel Lifecycle Flow">
  <title>The Production Feature Engineering Flywheel</title>
  <defs>
    <style>
      .d175f-bg { fill: #f8fafc; }
      .d175f-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .d175f-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .d175f-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .d175f-math { fill: #1e293b; font-family: "Courier New", monospace; font-size: 11px; font-weight: 600; }
      .d175f-arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#d175f-arr); fill: none; }
    </style>
    <marker id="d175f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="d175f-bg" />

  <text x="40" y="45" class="d175f-title" font-size="22">The Closed-Loop Feature Engineering Flywheel</text>
  <text x="40" y="70" class="d175f-text">Continuous Discovery, Automated Validation, Feature Store Serving, and Drift Deprecation</text>

  <!-- Step 1: Discovery -->
  <rect x="60" y="110" width="230" height="130" class="d175f-card" />
  <text x="80" y="135" class="d175f-title" fill="#1d4ed8">1. Domain Discovery</text>
  <text x="80" y="160" class="d175f-text">• Formulate physical ratios.</text>
  <text x="80" y="180" class="d175f-text">• Cyclical time encodings.</text>
  <text x="80" y="200" class="d175f-text">• Entity group aggregations.</text>

  <path d="M 290 175 L 340 175" class="d175f-arrow" />

  <!-- Step 2: Leak-Free Validation -->
  <rect x="340" y="110" width="240" height="130" class="d175f-card" fill="#eff6ff" stroke="#3b82f6" />
  <text x="360" y="135" class="d175f-title" fill="#1e40af">2. Leak-Free Validation</text>
  <text x="360" y="160" class="d175f-text">• Nested cross-validation.</text>
  <text x="360" y="180" class="d175f-text">• Boruta shadow selection.</text>
  <text x="360" y="200" class="d175f-text">• Feature ablation ROI tests.</text>

  <path d="M 580 175 L 630 175" class="d175f-arrow" />

  <!-- Step 3: Feature Store Deployment -->
  <rect x="630" y="110" width="230" height="130" class="d175f-card" fill="#f0fdf4" stroke="#22c55e" />
  <text x="650" y="135" class="d175f-title" fill="#15803d">3. Feature Store</text>
  <text x="650" y="160" class="d175f-text">• Standardized schema definition.</text>
  <text x="650" y="180" class="d175f-text">• Zero train/serve skew.</text>
  <text x="650" y="200" class="d175f-text">• Low-latency Redis serving.</text>

  <!-- Down Arrow to Step 4 -->
  <path d="M 745 240 L 745 290" class="d175f-arrow" />

  <!-- Step 4: Drift & Deprecation -->
  <rect x="60" y="290" width="800" height="140" class="d175f-card" fill="#fefce8" stroke="#eab308" />
  <text x="80" y="320" class="d175f-title" fill="#a16207">4. Continuous Production Drift Monitoring &amp; Technical Debt Pruning</text>
  <text x="80" y="350" class="d175f-text">• Monitor Population Stability Index (PSI) and Kolmogorov-Smirnov feature drift alerts.</text>
  <text x="80" y="375" class="d175f-text">• Identify and prune Dead Features to prevent CMLC (Changing Anything Changes Everything) entanglement.</text>
  <text x="80" y="405" class="d175f-math" fill="#a16207">Result: Sustainable, Ultra-High Performance Enterprise AI</text>
</svg>
