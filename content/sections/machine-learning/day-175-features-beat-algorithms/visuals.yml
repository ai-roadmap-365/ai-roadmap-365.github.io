visuals:
  - id: features-vs-algorithms-frontier
    file: assets/features-vs-algorithms-frontier.svg
    type: diagram
    title: 'The Machine Learning Performance Frontier: Representation vs Algorithm'
    alt: 'Diagram plotting model performance against engineering effort, showing representation quality delivering the largest vertical gains.'
    description: 'A static architecture diagram illustrating the relative return on investment of data quality, feature engineering, and algorithm tuning.'
  - id: feature-flywheel-lifecycle
    file: assets/feature-flywheel-lifecycle.svg
    type: flow-animated
    title: 'The Closed-Loop Feature Engineering Flywheel'
    alt: 'Animated flow chart showing feature discovery, validation, feature store cataloging, serving, monitoring, and deprecation.'
    description: 'An animated flow chart showing the continuous lifecycle of feature discovery, validation, serving, and drift monitoring in production.'
  - id: features-beat
    file: assets/features-beat.svg
    type: diagram
    title: 'Why features beat algorithms'
    alt: 'Diagram: why feature quality dominates model choice'
    description: 'A four-stage description of the features-over-algorithms finding covering the ceiling, model differences, feature differences and the conclusion.'
  - id: covers-theorem
    file: assets/covers-theorem.svg
    type: diagram
    title: 'Why more dimensions separate'
    alt: 'Diagram: why projecting into higher dimensions makes data more separable'
    description: 'A four-stage description of the separability result covering the low-dimensional overlap, the projection, the separability and the caveat.'
  - id: flywheel
    file: assets/flywheel.svg
    type: diagram
    title: 'The production flywheel'
    alt: 'Diagram: how a deployed system compounds its own data advantage'
    description: 'A four-stage description of the data flywheel covering deployment, collection, new features and the compounding advantage.'
  - id: tech-debt
    file: assets/tech-debt.svg
    type: diagram
    title: 'Hidden technical debt'
    alt: 'Diagram: the four forms of hidden technical debt in machine learning systems'
    description: 'A four-stage description of machine learning technical debt covering entanglement, undeclared consumers, unstable dependencies and configuration.'
  - id: features-not
    file: assets/features-not.svg
    type: diagram
    title: 'What this claim is not'
    alt: 'Diagram: four misconceptions about features beating algorithms'
    description: 'A two-column comparison of misconceptions about the features-over-algorithms claim against what is true.'
  - id: features-history
    file: assets/features-history.svg
    type: diagram
    title: 'Four steps in this finding'
    alt: 'Diagram: the historical progression of the data-over-algorithms finding'
    description: 'A four-stage description of the finding''s history covering early observations, the scaling result, competition evidence and the deep learning restatement.'
  - id: raw-materials
    file: assets/raw-materials.svg
    type: diagram
    title: 'The materials, not the tools'
    alt: 'Diagram: better tools compared with better materials'
    description: 'A two-column comparison of improving tools against improving materials.'
  - id: features-implications
    file: assets/features-implications.svg
    type: diagram
    title: 'Four consequences of this finding'
    alt: 'Diagram: the effort, staffing, data and debt implications of prioritising features'
    description: 'A four-stage description of implications covering effort allocation, staffing, data strategy and technical debt.'
  - id: features-when
    file: assets/features-when.svg
    type: diagram
    title: 'When this applies most'
    alt: 'Diagram: where feature quality dominates and where model choice matters more'
    description: 'A two-column comparison of settings where features dominate against those where models matter more.'
  - id: head-to-head
    file: assets/head-to-head.svg
    type: diagram
    title: 'The controlled comparison'
    alt: 'Diagram: how a controlled comparison isolates feature effects from model effects'
    description: 'A four-stage description of the controlled experiment covering the fixed features, model variation, fixed model and feature variation.'
  - id: features-why
    file: assets/features-why.svg
    type: diagram
    title: 'What this finding changes'
    alt: 'Diagram: the four decisions the features-over-algorithms finding changes'
    description: 'A four-stage description of the finding''s consequences covering effort order, hiring, data investment and stopping criteria.'
