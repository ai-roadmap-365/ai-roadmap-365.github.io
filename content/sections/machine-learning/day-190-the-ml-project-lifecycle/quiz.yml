questions:
  - question: 'What is the primary reason why up to 85% of corporate machine learning projects historically fail to reach production?'
    options:
      - 'Poor problem scoping and misalignment between business KPIs and model optimization loss functions'
      - 'Lack of high-performance GPU hardware'
      - 'Inability to achieve 99.9% training accuracy'
      - 'Incompatibility between Python and web browsers'
    answer_index: 0
    explanation: 'Most ML failures stem from organizational and scoping disconnects: solving the wrong problem, unfeasible data collection, or optimizing an offline metric that does not move business revenue.'
  - question: 'Why is establishing a simple heuristic or rule-based baseline mandatory in Stage 3 (Modeling) before training complex neural networks?'
    options:
      - 'It proves data pipeline correctness and sets a minimum economic performance floor to justify the engineering complexity of machine learning'
      - 'Heuristics are always faster than neural networks'
      - 'Scikit-learn requires a baseline model to initialize random seeds'
      - 'Baselines automatically generate Pydantic schemas'
    answer_index: 0
    explanation: 'A simple heuristic (e.g. historical average or rule table) establishes whether an ML model delivers enough incremental business value to justify maintenance and compute costs.'
  - question: 'What does Canary Deployment accomplish during the model rollout stage?'
    options:
      - 'Routing a small fraction of live traffic (e.g. 5%) to the new candidate model while the remaining 95% goes to the champion baseline, monitoring errors and latency before full promotion'
      - 'Training the model simultaneously on 5 GPU nodes'
      - 'Converting floating point weights into 8-bit integers'
      - 'Encrypting the SQLite database'
    answer_index: 0
    explanation: 'Canary deployment minimizes operational blast radius by exposing only a tiny sliver of live users to new model versions, rolling back automatically if errors or latency spikes occur.'
  - question: 'In the Data Engine stage, what is the concept of Active Learning?'
    options:
      - 'Using the current model to select only the most uncertain or ambiguous unlabelled samples for human annotation, maximizing labeling efficiency'
      - 'Training models while the server is actively handling live API traffic'
      - 'Exercising CPU cores at 100% capacity'
      - 'Streaming video data over WebSockets'
    answer_index: 0
    explanation: 'Active learning prioritizes human labeling effort on boundary cases where the model has lowest confidence (e.g. prediction entropy near 0.5), dramatically cutting data costs.'
  - question: 'What is the purpose of an automated Circuit Breaker in a production ML microservice?'
    options:
      - 'Automatically intercepting server exceptions or latency timeouts and falling back to a deterministic heuristic rule without crashing user requests'
      - 'Shutting down the server when CPU temperature exceeds 80C'
      - 'Deleting stale customer records from disk'
      - 'Encrypting network communication over TLS'
    answer_index: 0
    explanation: 'Circuit breakers guarantee system resilience: if an ML model container fails or times out, the service immediately serves a safe fallback heuristic, preserving user uptime.'
