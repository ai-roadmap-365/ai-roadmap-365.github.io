visuals:
  - id: ml-project-lifecycle-framework
    file: assets/ml-project-lifecycle-framework.svg
    type: diagram
    title: The Machine Learning Project Lifecycle Framework
    alt: End to end lifecycle cycle diagram illustrating Problem Scoping Data Engine Modeling Validation Deployment and Continuous Monitoring stages
    description: High-level architectural lifecycle diagram detailing the six interconnected stages of production machine learning systems.
  - id: ml-quality-gates-matrix
    file: assets/ml-quality-gates-matrix.svg
    type: diagram
    title: Production ML Quality Gate Matrix
    alt: Hierarchical checklist matrix displaying deployment gate evaluation criteria spanning offline accuracy slice performance latency limits and fallback triggers
    description: Four-quadrant deployment gate matrix outlining mandatory operational, statistical, schema, and fallback requirements before live traffic promotion.
  - id: lifecycle-stages
    file: assets/lifecycle-stages.svg
    type: diagram
    title: 'The six stages'
    alt: 'Diagram: the six stages of a machine learning project lifecycle'
    description: 'A six-stage description of the project lifecycle covering problem framing, data, modelling, evaluation, deployment and monitoring.'
  - id: deployment-gates
    file: assets/deployment-gates.svg
    type: diagram
    title: 'The deployment gates'
    alt: 'Diagram: the five gates a model must pass before deployment'
    description: 'A two-column comparison of deployment gates against what each verifies.'
  - id: lifecycle-idea
    file: assets/lifecycle-idea.svg
    type: diagram
    title: 'Why projects fail'
    alt: 'Diagram: the four common causes of machine learning project failure'
    description: 'A four-stage description of project failure covering the wrong problem, unusable data, no deployment path and no maintenance.'
  - id: lifecycle-not
    file: assets/lifecycle-not.svg
    type: diagram
    title: 'What the lifecycle is not'
    alt: 'Diagram: four misconceptions about the machine learning lifecycle'
    description: 'A two-column comparison of misconceptions about the lifecycle against what is true.'
  - id: lifecycle-history
    file: assets/lifecycle-history.svg
    type: diagram
    title: 'Four steps in project practice'
    alt: 'Diagram: the historical progression of machine learning project practice'
    description: 'A four-stage description of practice history covering research scripts, engineered pipelines, operational discipline and continuous evaluation.'
  - id: building-project
    file: assets/building-project.svg
    type: diagram
    title: 'Designing and maintaining a building'
    alt: 'Diagram: a design-only view of a project compared with a whole-lifecycle view'
    description: 'A two-column comparison of a design-focused project against a lifecycle-focused one.'
  - id: lifecycle-implications
    file: assets/lifecycle-implications.svg
    type: diagram
    title: 'Four consequences of the lifecycle view'
    alt: 'Diagram: the success-rate, staffing, cost and decay implications of the lifecycle view'
    description: 'A four-stage description of lifecycle implications covering project success, staffing, ongoing cost and model decay.'
  - id: lifecycle-when
    file: assets/lifecycle-when.svg
    type: diagram
    title: 'How much process'
    alt: 'Diagram: how much lifecycle process a project warrants'
    description: 'A two-column comparison of project types against the process each requires.'
  - id: lifecycle-why
    file: assets/lifecycle-why.svg
    type: diagram
    title: 'What the lifecycle addresses'
    alt: 'Diagram: the four project failures the lifecycle view is designed to prevent'
    description: 'A four-stage description of the failures addressed covering misframed problems, late data discovery, stranded models and unmaintained deployments.'
