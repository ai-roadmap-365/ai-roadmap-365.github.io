terms:
  - term: 'ML Project Lifecycle'
    definition: 'The end-to-end multi-stage process of designing, building, validating, deploying, and maintaining production machine learning systems.'
  - term: 'MLOps'
    definition: 'Machine Learning Operations: the set of practices and tooling uniting ML development and IT operations for automated, reliable deployments.'
  - term: 'Baseline Model'
    definition: 'A simple, deterministic, or rule-based heuristic against which complex machine learning models are quantitatively benchmarked.'
  - term: 'Quality Gate'
    definition: 'A mandatory statistical or operational condition that a candidate model must pass before being promoted to live production traffic.'
  - term: 'Canary Deployment'
    definition: 'A deployment technique where a small fraction of live user traffic is routed to a new model version to monitor reliability before full rollout.'
  - term: 'Circuit Breaker'
    definition: 'A software resilience pattern that detects model invocation failures and redirects requests to a fast heuristic fallback.'
  - term: 'Data Flywheel'
    definition: 'A self-reinforcing product loop where user interactions generate fresh telemetry, improving future model training and user retention.'
  - term: 'Model Slicing'
    definition: 'The practice of evaluating model accuracy across distinct demographic or behavioral sub-populations rather than global aggregates alone.'
