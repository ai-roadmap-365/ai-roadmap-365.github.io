<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What the lifecycle is not</title>
  <style>
    .lifecycle-not-bg   { fill: #f8fafc; }
    .lifecycle-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lifecycle-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lifecycle-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lifecycle-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lifecycle-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lifecycle-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-not-row { opacity: 1; }
    .lifecycle-not-r0 { animation-delay: 0.00s; }
    .lifecycle-not-r1 { animation-delay: 0.45s; }
    .lifecycle-not-r2 { animation-delay: 0.90s; }
    .lifecycle-not-r3 { animation-delay: 1.35s; }
    .lifecycle-not-r4 { animation-delay: 1.80s; }
    .lifecycle-not-row { animation: lifecycle-not-reveal 7.3s ease-in-out infinite; }
    @keyframes lifecycle-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lifecycle-not-bg" width="980" height="390"/>
  <text class="lifecycle-not-h1"  x="30" y="40">What the lifecycle is not</text>
  <text class="lifecycle-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="lifecycle-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lifecycle-not-name" x="46" y="122">The misconception</text>
  <text class="lifecycle-not-desc" x="46" y="142">Commonly held.</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r0" x="46" y="182">It is a linear sequence</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r1" x="46" y="216">Deployment is the end</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r2" x="46" y="250">Modelling is the bulk of the work</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r3" x="46" y="284">A deployed model is finished</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r4" x="46" y="318">It is the same as software delivery</text>
  <rect class="lifecycle-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lifecycle-not-name" x="526" y="122">What is true</text>
  <text class="lifecycle-not-desc" x="526" y="142">Actually.</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r0" x="526" y="182">It loops constantly, especially back to data</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r1" x="526" y="216">It is roughly the midpoint</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r2" x="526" y="250">It is typically under a fifth of it</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r3" x="526" y="284">Its performance decays from day one</text>
  <text class="lifecycle-not-desc lifecycle-not-row lifecycle-not-r4" x="526" y="318">Data and models decay; code does not</text>
  <text class="lifecycle-not-sub" x="30" y="372">Decay from day one is the property that distinguishes this from software delivery: unchanged code keeps working, and an unchanged model does not.</text>
</svg>
