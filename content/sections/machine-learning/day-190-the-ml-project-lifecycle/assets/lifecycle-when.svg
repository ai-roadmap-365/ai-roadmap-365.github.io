<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Scaled to the model's life.">
  <title>How much process</title>
  <style>
    .lifecycle-when-bg   { fill: #f8fafc; }
    .lifecycle-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lifecycle-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lifecycle-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lifecycle-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lifecycle-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lifecycle-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lifecycle-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lifecycle-when-row { opacity: 1; }
    .lifecycle-when-r0 { animation-delay: 0.00s; }
    .lifecycle-when-r1 { animation-delay: 0.45s; }
    .lifecycle-when-r2 { animation-delay: 0.90s; }
    .lifecycle-when-r3 { animation-delay: 1.35s; }
    .lifecycle-when-r4 { animation-delay: 1.80s; }
    .lifecycle-when-row { animation: lifecycle-when-reveal 7.3s ease-in-out infinite; }
    @keyframes lifecycle-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lifecycle-when-bg" width="980" height="390"/>
  <text class="lifecycle-when-h1"  x="30" y="40">How much process</text>
  <text class="lifecycle-when-sub" x="30" y="64">Scaled to the model's life.</text>
  <rect class="lifecycle-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lifecycle-when-name" x="46" y="122">Full lifecycle</text>
  <text class="lifecycle-when-desc" x="46" y="142">Four cases.</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r0" x="46" y="182">Anything running in production</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r1" x="46" y="216">Models affecting people</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r2" x="46" y="250">Anything expected to last a year</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r3" x="46" y="284">Regulated environments</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r4" x="46" y="318">Where several people are involved</text>
  <rect class="lifecycle-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lifecycle-when-name" x="526" y="122">Lighter</text>
  <text class="lifecycle-when-desc" x="526" y="142">Also four.</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r0" x="526" y="182">One-off analysis answering one question</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r1" x="526" y="216">Feasibility studies</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r2" x="526" y="250">Research and teaching</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r3" x="526" y="284">Throwaway exploration</text>
  <text class="lifecycle-when-desc lifecycle-when-row lifecycle-when-r4" x="526" y="318">But frame the problem regardless</text>
  <text class="lifecycle-when-sub" x="30" y="372">Framing the problem is the stage worth keeping even in the lightest work, because it is what prevents an accurate answer to a question nobody asked.</text>
</svg>
