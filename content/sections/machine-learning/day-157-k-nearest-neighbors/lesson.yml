slug: k-nearest-neighbors
title: k-Nearest Neighbors
section: machine-learning
subsection: core-concepts
week: 23
learning_promise: >-
  Master the non-parametric foundations of k-Nearest Neighbors (KNN): how instance-based learning works without
  an explicit training phase, how distance metrics (Euclidean, Manhattan, Cosine) shape neighborhood geometry,
  how neighborhood size k controls the bias-variance trade-off from Voronoi tessellations to smooth global boundaries,
  why feature scaling is non-negotiable, and how the curse of dimensionality impacts distance metrics in high dimensions.
objectives:
  - 'Explain the mechanics of instance-based, non-parametric classification without explicit training phases'
  - 'Implement vectorized pairwise distance matrix computation in NumPy using matrix broadcasting'
  - 'Compare Euclidean (L2), Manhattan (L1), Minkowski (Lp), and Cosine distance metrics'
  - 'Analyze how neighborhood size k governs the bias-variance trade-off and boundary complexity'
  - 'Construct uniform and distance-inverse weighting schemes for plurality voting and probability calibration'
  - 'Demonstrate why unscaled features distort distance-based classification'
  - 'Explain the Curse of Dimensionality and its geometric impact on distance concentration'
  - 'Compare brute-force neighbor search with spatial indexing trees (KD-Trees and Ball-Trees)'
prerequisites:
  - 'Day 156 -- Decision boundaries, hyperplanes, and classification geometry'
  - 'Day 107 -- Norms, distances, and similarity measures (L1, L2, Cosine)'
reading_time_minutes: 50
practical_time_minutes: 60
