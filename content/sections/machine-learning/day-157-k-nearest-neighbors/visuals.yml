visuals:
  - id: knn-decision-boundaries
    file: assets/knn-decision-boundaries.svg
    type: diagram
    title: 'k-Nearest Neighbors Decision Boundaries: k=1 versus k=15'
    alt: 'Diagram comparing the complex fragmented Voronoi cell decision boundary of a k=1 classifier with the smooth, regularized decision boundary of a k=15 classifier on a 2D binary classification dataset.'
    description: 'A static architecture diagram illustrating how neighborhood size k governs boundary complexity: k=1 creates jagged Voronoi polygons with 100% training fit, while k=15 aggregates local neighborhoods into a smooth generalized separation contour.'
  - id: knn-inference-flow
    file: assets/knn-inference-flow.svg
    type: flow-animated
    title: 'k-Nearest Neighbors Query and Voting Flow'
    alt: 'Animated diagram showing a query point entering feature space, computing Euclidean distances to training points, selecting top-k nearest neighbors within an expanding radius, and aggregating votes to produce a class probability distribution.'
    description: 'An animated flow diagram demonstrating the complete inference pipeline of KNN: distance matrix broadcasting, neighbor sorting, radius expansion, and weighted vote tallying with reduced-motion fallback.'
  - id: knn-idea
    file: assets/knn-idea.svg
    type: diagram
    title: 'k-nearest neighbours'
    alt: 'Diagram: the four steps of k-nearest-neighbour prediction'
    description: 'A four-stage description of nearest-neighbour classification covering storage, distance, selection and voting.'
  - id: distance-metrics
    file: assets/distance-metrics.svg
    type: diagram
    title: 'Three distance metrics'
    alt: 'Diagram: three distance metrics for nearest-neighbour search'
    description: 'A three-stage description of distance metrics covering Euclidean, Manhattan and cosine distance.'
  - id: vectorised-distance
    file: assets/vectorised-distance.svg
    type: diagram
    title: 'Computing distances efficiently'
    alt: 'Diagram: how pairwise distances are computed as a matrix operation'
    description: 'A four-stage description of vectorised distance covering the naive loop, the expansion, the matrix product and the result.'
  - id: choosing-k
    file: assets/choosing-k.svg
    type: diagram
    title: 'Choosing k'
    alt: 'Diagram: how the number of neighbours trades bias against variance'
    description: 'A four-stage description of choosing k covering one neighbour, many neighbours, the trade-off and the selection method.'
  - id: scaling-mandatory
    file: assets/scaling-mandatory.svg
    type: diagram
    title: 'Why scaling is not optional'
    alt: 'Diagram: how unscaled features distort nearest-neighbour distances'
    description: 'A four-stage description of the scaling requirement covering mixed units, the dominant feature, the distorted distance and the fix.'
  - id: curse-dimensionality
    file: assets/curse-dimensionality.svg
    type: diagram
    title: 'The curse of dimensionality'
    alt: 'Diagram: why distance stops discriminating in high-dimensional spaces'
    description: 'A four-stage description of the curse of dimensionality covering volume growth, sparsity, distance concentration and the remedy.'
  - id: lazy-eager
    file: assets/lazy-eager.svg
    type: diagram
    title: 'Lazy against eager learning'
    alt: 'Diagram: instance-based learning compared with model-based learning'
    description: 'A two-column comparison of lazy instance-based learning against eager model-based learning.'
  - id: knn-history
    file: assets/knn-history.svg
    type: diagram
    title: 'Four steps in nearest-neighbour methods'
    alt: 'Diagram: the historical progression of nearest-neighbour methods'
    description: 'A four-stage description of nearest-neighbour history covering the original rule, theoretical guarantees, indexing structures and vector search.'
  - id: voting
    file: assets/voting.svg
    type: diagram
    title: 'How the neighbours vote'
    alt: 'Diagram: four ways neighbours combine into a prediction'
    description: 'A four-stage description of neighbour voting covering majority vote, distance weighting, regression averaging and probability estimation.'
  - id: knn-implications
    file: assets/knn-implications.svg
    type: diagram
    title: 'What nearest neighbours costs'
    alt: 'Diagram: the memory, latency, privacy and maintenance implications of nearest-neighbour methods'
    description: 'A two-column comparison of the benefits and costs of nearest-neighbour methods.'
  - id: knn-when
    file: assets/knn-when.svg
    type: diagram
    title: 'When to use nearest neighbours'
    alt: 'Diagram: when nearest-neighbour methods are appropriate'
    description: 'A two-column comparison of situations suited to nearest neighbours against those that are not.'
  - id: knn-approximate
    file: assets/knn-approximate.svg
    type: diagram
    title: 'Making it scale'
    alt: 'Diagram: the four ways nearest-neighbour search is made to scale'
    description: 'A four-stage description of scaling nearest-neighbour search covering exact scanning, tree indexes, approximate graphs and dimensionality reduction.'
  - id: consulting-neighbours
    file: assets/consulting-neighbours.svg
    type: diagram
    title: 'Asking the nearest people'
    alt: 'Diagram: asking one person compared with asking several'
    description: 'A two-column comparison of consulting a single nearest source against consulting several.'
