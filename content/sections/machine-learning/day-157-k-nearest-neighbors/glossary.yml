terms:
  - term: 'k-Nearest Neighbors (KNN)'
    definition: 'A non-parametric, instance-based classification and regression algorithm that predicts the target value of a query point by aggregating the labels of its k closest training examples.'
  - term: 'Instance-Based Learning (Lazy Learning)'
    definition: 'A machine learning paradigm where the algorithm memorizes the training data and delays all computation and generalization until an inference query is received.'
  - term: 'Euclidean Distance (L2 Norm)'
    definition: 'The straight-line distance between two points in Euclidean space: d(x, z) = sqrt(sum (x_i - z_i)^2).'
  - term: 'Manhattan Distance (L1 Norm / Cityblock)'
    definition: 'The sum of absolute coordinate differences between two points: d(x, z) = sum |x_i - z_i|.'
  - term: 'Cosine Distance'
    definition: 'A directional similarity metric defined as 1 - (x . z) / (||x|| * ||z||), measuring the angular difference between vectors independent of length.'
  - term: 'Voronoi Tessellation'
    definition: 'A partitioning of a plane into convex polygonal cells such that every point in a cell is closer to that cell generator point than to any other generator.'
  - term: 'Curse of Dimensionality'
    definition: 'The phenomenon where exponential growth of volume in high-dimensional spaces causes data sparsity and distance concentration, diminishing the utility of distance metrics.'
  - term: 'KD-Tree (k-d Tree)'
    definition: 'A binary space-partitioning tree structure that organizes points in k-dimensional space to enable fast O(log N) nearest neighbor lookups.'
  - term: 'Ball-Tree'
    definition: 'A spatial indexing data structure that partitions data points into nested multi-dimensional hyperspheres (balls), effective for metric spaces where KD-Trees struggle.'
  - term: 'Plurality Voting'
    definition: 'A decision rule where the class receiving the most votes among the k nearest neighbors is selected as the predicted label.'
