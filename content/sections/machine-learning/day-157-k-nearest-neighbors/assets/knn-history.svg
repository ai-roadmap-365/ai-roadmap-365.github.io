<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From statistics to retrieval.">
  <title>Four steps in nearest-neighbour methods</title>
  <style>
    .knn-history-bg   { fill: #f8fafc; }
    .knn-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knn-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knn-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knn-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knn-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knn-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knn-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knn-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .knn-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .knn-history-stage { opacity: 1; }

    .knn-history-s0 { animation-delay: 0.00s; }
    .knn-history-e0 { animation-delay: 0.00s; }
    .knn-history-s1 { animation-delay: 1.28s; }
    .knn-history-e1 { animation-delay: 1.28s; }
    .knn-history-s2 { animation-delay: 2.56s; }
    .knn-history-e2 { animation-delay: 2.56s; }
    .knn-history-s3 { animation-delay: 3.84s; }
    .knn-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .knn-history-conn  { animation: knn-history-trace 6.4s ease-in-out infinite; }
      .knn-history-stage { animation: knn-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes knn-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes knn-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .knn-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .knn-history-stage { animation: knn-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes knn-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="knn-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="knn-history-bg" width="980" height="322"/>
  <text class="knn-history-h1"  x="30" y="40">Four steps in nearest-neighbour methods</text>
  <text class="knn-history-sub" x="30" y="64">From statistics to retrieval.</text>
  <g class="knn-history-stage knn-history-s0">
    <rect class="knn-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="knn-history-step" x="44" y="142">01</text>
    <text class="knn-history-name" x="70" y="142">A simple rule: predict what the nearest example did</text>
    <text class="knn-history-desc" x="44" y="166">Proposed in the 1950s, and</text>
    <text class="knn-history-desc" x="44" y="182">obvious in hindsight.</text>
  </g>
  <line class="knn-history-line knn-history-conn knn-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#knn-history-tip)"/>
  <g class="knn-history-stage knn-history-s1">
    <rect class="knn-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="knn-history-step" x="280" y="142">02</text>
    <text class="knn-history-name" x="306" y="142">Shown to be provably near-optimal with enough data</text>
    <text class="knn-history-desc" x="280" y="166">Within a factor of the best</text>
    <text class="knn-history-desc" x="280" y="182">possible error.</text>
  </g>
  <line class="knn-history-line knn-history-conn knn-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#knn-history-tip)"/>
  <g class="knn-history-stage knn-history-s2">
    <rect class="knn-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="knn-history-step" x="516" y="142">03</text>
    <text class="knn-history-name" x="542" y="142">Then indexing structures to avoid scanning everything</text>
    <text class="knn-history-desc" x="516" y="166">Trees, and later approximate</text>
    <text class="knn-history-desc" x="516" y="182">graphs.</text>
  </g>
  <line class="knn-history-line knn-history-conn knn-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#knn-history-tip)"/>
  <g class="knn-history-stage knn-history-s3">
    <rect class="knn-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="knn-history-step" x="752" y="142">04</text>
    <text class="knn-history-name" x="778" y="142">And now the basis of vector search</text>
    <text class="knn-history-desc" x="752" y="166">Which is this method at web</text>
    <text class="knn-history-desc" x="752" y="182">scale.</text>
  </g>
  <text class="knn-history-sub" x="30" y="304">The theoretical guarantee is remarkable and comes with a catch: it holds in the limit of infinite data, which the curse of dimensionality makes unreachable.</text>
</svg>
