<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How many to ask.">
  <title>Asking the nearest people</title>
  <style>
    .consulting-neighbours-bg   { fill: #f8fafc; }
    .consulting-neighbours-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consulting-neighbours-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consulting-neighbours-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consulting-neighbours-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consulting-neighbours-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .consulting-neighbours-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .consulting-neighbours-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .consulting-neighbours-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .consulting-neighbours-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .consulting-neighbours-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .consulting-neighbours-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .consulting-neighbours-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .consulting-neighbours-row { opacity: 1; }
    .consulting-neighbours-r0 { animation-delay: 0.00s; }
    .consulting-neighbours-r1 { animation-delay: 0.45s; }
    .consulting-neighbours-r2 { animation-delay: 0.90s; }
    .consulting-neighbours-r3 { animation-delay: 1.35s; }
    .consulting-neighbours-r4 { animation-delay: 1.80s; }
    .consulting-neighbours-row { animation: consulting-neighbours-reveal 7.3s ease-in-out infinite; }
    @keyframes consulting-neighbours-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="consulting-neighbours-bg" width="980" height="390"/>
  <text class="consulting-neighbours-h1"  x="30" y="40">Asking the nearest people</text>
  <text class="consulting-neighbours-sub" x="30" y="64">How many to ask.</text>
  <rect class="consulting-neighbours-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="consulting-neighbours-name" x="46" y="122">Ask one person</text>
  <text class="consulting-neighbours-desc" x="46" y="142">The closest.</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r0" x="46" y="182">Whoever is nearest decides</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r1" x="46" y="216">Very sensitive to who that is</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r2" x="46" y="250">One unusual person misleads you</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r3" x="46" y="284">No sense of disagreement</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r4" x="46" y="318">This is k equals one</text>
  <rect class="consulting-neighbours-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="consulting-neighbours-name" x="526" y="122">Ask several</text>
  <text class="consulting-neighbours-desc" x="526" y="142">And take the majority.</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r0" x="526" y="182">A group decides together</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r1" x="526" y="216">One outlier is outvoted</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r2" x="526" y="250">Disagreement is visible</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r3" x="526" y="284">But you reach further afield</text>
  <text class="consulting-neighbours-desc consulting-neighbours-row consulting-neighbours-r4" x="526" y="318">This is k greater than one</text>
  <text class="consulting-neighbours-sub" x="30" y="372">Reaching further afield is the cost that balances the benefit: asking more people means asking some who are not really relevant to your situation.</text>
</svg>
