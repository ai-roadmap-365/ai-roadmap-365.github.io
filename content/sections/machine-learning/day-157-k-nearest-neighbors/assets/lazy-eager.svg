<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Where the work happens.">
  <title>Lazy against eager learning</title>
  <style>
    .lazy-eager-bg   { fill: #f8fafc; }
    .lazy-eager-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lazy-eager-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lazy-eager-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lazy-eager-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lazy-eager-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lazy-eager-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lazy-eager-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lazy-eager-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lazy-eager-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lazy-eager-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lazy-eager-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lazy-eager-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lazy-eager-row { opacity: 1; }
    .lazy-eager-r0 { animation-delay: 0.00s; }
    .lazy-eager-r1 { animation-delay: 0.45s; }
    .lazy-eager-r2 { animation-delay: 0.90s; }
    .lazy-eager-r3 { animation-delay: 1.35s; }
    .lazy-eager-r4 { animation-delay: 1.80s; }
    .lazy-eager-row { animation: lazy-eager-reveal 7.3s ease-in-out infinite; }
    @keyframes lazy-eager-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lazy-eager-bg" width="980" height="390"/>
  <text class="lazy-eager-h1"  x="30" y="40">Lazy against eager learning</text>
  <text class="lazy-eager-sub" x="30" y="64">Where the work happens.</text>
  <rect class="lazy-eager-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lazy-eager-name" x="46" y="122">Lazy</text>
  <text class="lazy-eager-desc" x="46" y="142">Work at prediction.</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r0" x="46" y="182">Training is storage</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r1" x="46" y="216">Prediction scans the dataset</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r2" x="46" y="250">Cost grows with training data</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r3" x="46" y="284">New data is added instantly</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r4" x="46" y="318">No model to inspect</text>
  <rect class="lazy-eager-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lazy-eager-name" x="526" y="122">Eager</text>
  <text class="lazy-eager-desc" x="526" y="142">Work at training.</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r0" x="526" y="182">Training fits parameters</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r1" x="526" y="216">Prediction is a fixed computation</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r2" x="526" y="250">Prediction cost is constant</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r3" x="526" y="284">New data means retraining</text>
  <text class="lazy-eager-desc lazy-eager-row lazy-eager-r4" x="526" y="318">A model you can examine</text>
  <text class="lazy-eager-sub" x="30" y="372">The cost profile is inverted from every other model in this course, which is what makes nearest neighbours unsuitable for high-throughput serving.</text>
</svg>
