    description: 'Seminal foundational paper proving that 1-NN error rate is bounded asymptotically by at most twice the optimal Bayes error rate.'
  - title: 'Scikit-Learn User Guide: Nearest Neighbors'
    url: 'https://scikit-learn.org/stable/modules/neighbors.html'
    publisher: 'Scikit-Learn Developers'
    accessed: '2026-08-29'
    year: 2026
    description: 'Technical manual covering KD-Tree, BallTree, brute-force algorithms, distance metrics, and neighborhood weighting.'
  - title: 'The Elements of Statistical Learning (Chapter 13: Prototype Methods and Nearest-Neighbors)'
    url: 'https://hastie.su.domains/ElemStatLearn/'
    publisher: 'Springer'
    accessed: '2026-08-29'
    year: 2009
    description: 'Rigorous statistical treatment of nearest neighbor classifiers, curse of dimensionality, and adaptive metric methods.'
