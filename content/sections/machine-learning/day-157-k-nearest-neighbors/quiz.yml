questions:
  - question: 'What is the computational complexity of the training phase (fit) for a brute-force k-Nearest Neighbors classifier on N training samples with d features?'
    options:
      - 'O(N * d^2)'
      - 'O(N^2 * d)'
      - 'O(1)'
      - 'O(d^3)'
    answer_index: 2
    explanation: 'KNN is a lazy learning algorithm. It performs no parameter estimation during training; it merely stores the training instances in memory.'

  - question: 'What happens to the decision boundary of a KNN classifier as k decreases to k = 1?'
    options:
      - 'The model becomes equivalent to linear logistic regression'
      - 'The decision boundary becomes a perfectly flat straight line'
      - 'The model underfits and predicts the majority class everywhere'
      - '100% training accuracy, but a fragmented, high-variance boundary'
    answer_index: 3
    explanation: 'At k=1, the boundary is formed by the Voronoi cells around individual training points. Any noise or outlier in the training set creates an isolated island of misclassification, representing maximum model variance.'

  - question: 'Why is feature scaling (e.g. StandardScaler or MinMaxScaler) mandatory before applying KNN?'
    options:
      - 'Euclidean distance is dominated by large-magnitude features'
      - 'Because gradient descent fails to converge without scaling'
      - 'Because KNN requires all features to follow a normal distribution'
      - 'Because distance cannot be computed on negative numbers'
    answer_index: 0
    explanation: 'Euclidean distance sums squared coordinate differences (x_i - z_i)^2. If one feature is measured in thousands (e.g. Income) and another in units (e.g. Age), the income feature completely swamps the distance metric.'

  - question: 'What is the Curse of Dimensionality in the context of distance-based models like KNN?'
    options:
      - 'High dimensions cause floating point underflow in matrix multiplication'
      - 'In high dimensions all pairwise distances concentrate'
      - 'The number of classes grows exponentially with dimension'
      - 'KD-Trees require infinite memory in 3D space'
    answer_index: 1
    explanation: 'In high dimensions, the volume of the space grows exponentially, data becomes extremely sparse, and the difference between the distance to the nearest neighbor and the distance to the farthest point shrinks relative to the mean distance.'

  - question: 'How does distance-inverse weighting (weights="distance") modify the KNN voting mechanism?'
    options:
      - 'It converts the classifier into a regression model'
      - 'Points farther away receive higher weights to promote diversity'
      - 'Each neighbour votes with weight 1/(distance + eps)'
      - 'It removes the requirement to choose a value for k'
    answer_index: 2
    explanation: 'Distance-inverse weighting assigns influence inversely proportional to distance, ensuring that immediately adjacent neighbors dominate the prediction even if distant outliers are within the top k.'

  - question: 'When is a KD-Tree spatial index preferred over brute-force linear scan in KNN?'
    options:
      - 'When training on a single GPU'
      - 'When the dimensionality d is extremely high (d > 10,000)'
      - 'When using Cosine distance on sparse text vectors'
      - 'When N is large and dimensionality is low to moderate'
    answer_index: 3
    explanation: 'KD-Trees partition space recursively along coordinate axes, reducing search time to O(d * log N). However, in high dimensions (d > 20), nearly all branches must be searched, causing KD-Trees to degrade to slower than brute force.'

  - question: 'What is the effect of setting k = N (where N is the total number of training samples) in a standard uniform-weight KNN classifier?'
    options:
      - 'It always predicts the majority class'
      - 'The model achieves 100% test accuracy'
      - 'The model forms N distinct Voronoi cells'
      - 'The model throws a ZeroDivisionError'
    answer_index: 0
    explanation: 'When k=N, every prediction averages over all training samples, predicting the global majority class everywhere (maximum bias, zero variance).'

  - question: 'Which distance metric is most suitable for high-dimensional sparse text vectors?'
    options:
      - 'Euclidean distance (L2 norm)'
      - 'Cosine distance (1 - cosine similarity)'
      - 'Manhattan distance (L1 norm)'
      - 'Mahalanobis distance'
    answer_index: 1
    explanation: 'Cosine distance measures the angle between vectors independent of document length (magnitude), making it ideal for sparse frequency and TF-IDF representations.'
