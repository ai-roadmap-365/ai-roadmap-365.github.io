id: D156
day: 156
slug: decision-boundaries
title: Decision Boundaries
section: machine-learning
subsection: core-concepts
week: 23
learning_promise: >-
  Master the geometric foundations of classification: how hyperplanes partition feature spaces into decision
  regions, how to calculate exact boundary lines and signed distance metrics, how polynomial feature expansions
  generate curved non-linear boundaries in input space, and how One-vs-Rest and Softmax strategies handle
  multiclass decision boundaries.
objectives:
  - 'Derive the equation of a decision boundary from the condition P(y=1|x) = 0.50'
  - 'Calculate the slope, intercept, and orientation of linear 2D decision boundaries from model weights'
  - 'Compute perpendicular signed distances from data points to the separating hyperplane'
  - 'Explain how non-linear feature maps enable linear models to separate curved data manifolds'
  - 'Construct polynomial feature expansions and analyze the trade-offs of boundary complexity'
  - 'Compare One-vs-Rest (OvR) and Multinomial Softmax strategies for multiclass decision regions'
  - 'Diagnose overfitting and underfitting by inspecting boundary curvature and margins'
  - 'Evaluate the geometric effect of regularization on decision boundary stability'
prerequisites:
  - 'Day 155 -- Logistic regression formulation, logit link, and sigmoid activation'
  - 'Day 100-103 -- Vectors, hyperplanes, dot products, and Euclidean distances'
reading_time_minutes: 50
practical_time_minutes: 60
