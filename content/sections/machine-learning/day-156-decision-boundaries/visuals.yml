visuals:
  - id: decision-boundary-geometry
    file: assets/decision-boundary-geometry.svg
    type: diagram
    title: 'Linear versus Polynomial Decision Boundaries in Feature Space'
    alt: 'Diagram comparing a linear decision boundary separating two linearly separable point clusters with a quadratic polynomial decision boundary forming an elliptical separation curve around an enclosed class cluster.'
    description: 'A static architecture diagram illustrating 2D decision boundary geometry: a straight hyperplane w1*x1 + w2*x2 + b = 0 versus a curved quadratic boundary w1*x1 + w2*x2 + w3*x1^2 + w4*x1*x2 + w5*x2^2 + b = 0 separating non-linear data clusters.'
  - id: ovr-decision-flow
    file: assets/ovr-decision-flow.svg
    type: flow-animated
    title: 'One-vs-Rest (OvR) Multiclass Decision Space Partitioning'
    alt: 'Animated diagram showing three separate binary linear hyperplanes for classes A, B, and C combined through an argmax score rule to partition a two-dimensional feature space into three convex polygonal decision regions.'
    description: 'An animated flow diagram demonstrating how three binary classification boundaries combine into a cohesive 3-class partition of 2D space, including animated region highlighting and reduced-motion fallback.'
  - id: boundary-idea
    file: assets/boundary-idea.svg
    type: diagram
    title: 'What a decision boundary is'
    alt: 'Diagram: the four defining properties of a decision boundary'
    description: 'A four-stage description of decision boundaries covering the surface, the split, distance as confidence and the model''s shape.'
  - id: linear-boundary
    file: assets/linear-boundary.svg
    type: diagram
    title: 'The linear boundary'
    alt: 'Diagram: how a linear model''s decision boundary is defined by its weights'
    description: 'A four-stage description of the linear boundary covering the score, the zero set, the geometry and the weight vector.'
  - id: signed-distance
    file: assets/signed-distance.svg
    type: diagram
    title: 'Distance as confidence'
    alt: 'Diagram: how signed distance from the boundary encodes prediction confidence'
    description: 'A four-stage description of signed distance covering the raw score, normalisation, the sign and the magnitude.'
  - id: polynomial
    file: assets/polynomial.svg
    type: diagram
    title: 'Bending a linear boundary'
    alt: 'Diagram: how feature expansion lets a linear model draw a curved boundary'
    description: 'A four-stage description of polynomial expansion covering the limitation, added features, the linear fit and the projected curve.'
  - id: ovr-softmax
    file: assets/ovr-softmax.svg
    type: diagram
    title: 'Two ways to do multiclass'
    alt: 'Diagram: one-versus-rest classification compared with softmax classification'
    description: 'A two-column comparison of one-versus-rest against softmax multiclass classification.'
  - id: boundary-vs-model
    file: assets/boundary-vs-model.svg
    type: diagram
    title: 'The boundary against the model'
    alt: 'Diagram: a decision boundary compared with the model that produces it'
    description: 'A two-column comparison of the decision boundary against the underlying model.'
  - id: boundary-history
    file: assets/boundary-history.svg
    type: diagram
    title: 'Four steps in separating classes'
    alt: 'Diagram: the historical progression of decision boundary complexity'
    description: 'A four-stage description of boundary history covering the perceptron, its limits, kernels and learned representations.'
  - id: sorting-office
    file: assets/sorting-office.svg
    type: diagram
    title: 'A line drawn on the floor'
    alt: 'Diagram: a straight dividing line compared with a flexible one'
    description: 'A two-column comparison of a straight partition against a flexible partition.'
  - id: boundary-implications
    file: assets/boundary-implications.svg
    type: diagram
    title: 'Four consequences of boundary shape'
    alt: 'Diagram: the interpretability, overfitting, extrapolation and fairness implications of boundary complexity'
    description: 'A four-stage description of implications covering interpretability, overfitting, extrapolation and disparate impact.'
  - id: boundary-when
    file: assets/boundary-when.svg
    type: diagram
    title: 'When a linear boundary suffices'
    alt: 'Diagram: when linear decision boundaries are adequate'
    description: 'A two-column comparison of situations where a linear boundary suffices against those requiring more.'
  - id: regularisation-boundary
    file: assets/regularisation-boundary.svg
    type: diagram
    title: 'Controlling boundary complexity'
    alt: 'Diagram: the four ways boundary complexity is controlled'
    description: 'A four-stage description of complexity control covering feature count, regularisation strength, model class and validation.'
  - id: boundary-diagnostics
    file: assets/boundary-diagnostics.svg
    type: diagram
    title: 'Reading a boundary plot'
    alt: 'Diagram: the four diagnostics visible in a decision boundary plot'
    description: 'A four-stage description of boundary diagnostics covering shape, margin, misclassified points and confidence gradient.'
  - id: boundary-vs-margin
    file: assets/boundary-vs-margin.svg
    type: diagram
    title: 'Any boundary against the widest one'
    alt: 'Diagram: an arbitrary separating boundary compared with a maximum-margin boundary'
    description: 'A two-column comparison of an arbitrary separating boundary against a maximum-margin one.'
