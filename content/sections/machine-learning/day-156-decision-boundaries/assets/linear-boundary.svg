<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The linear boundary</title>
  <style>
    .linear-boundary-bg   { fill: #f8fafc; }
    .linear-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linear-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linear-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linear-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linear-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .linear-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .linear-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .linear-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .linear-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .linear-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .linear-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .linear-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .linear-boundary-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .linear-boundary-stage { opacity: 1; }

    .linear-boundary-s0 { animation-delay: 0.00s; }
    .linear-boundary-e0 { animation-delay: 0.00s; }
    .linear-boundary-s1 { animation-delay: 1.28s; }
    .linear-boundary-e1 { animation-delay: 1.28s; }
    .linear-boundary-s2 { animation-delay: 2.56s; }
    .linear-boundary-e2 { animation-delay: 2.56s; }
    .linear-boundary-s3 { animation-delay: 3.84s; }
    .linear-boundary-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .linear-boundary-conn  { animation: linear-boundary-trace 6.4s ease-in-out infinite; }
      .linear-boundary-stage { animation: linear-boundary-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes linear-boundary-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes linear-boundary-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .linear-boundary-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .linear-boundary-stage { animation: linear-boundary-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes linear-boundary-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="linear-boundary-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="linear-boundary-bg" width="980" height="322"/>
  <text class="linear-boundary-h1"  x="30" y="40">The linear boundary</text>
  <text class="linear-boundary-sub" x="30" y="64">Four steps.</text>
  <g class="linear-boundary-stage linear-boundary-s0">
    <rect class="linear-boundary-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="linear-boundary-step" x="44" y="142">01</text>
    <text class="linear-boundary-name" x="70" y="142">The model computes a weighted sum</text>
    <text class="linear-boundary-desc" x="44" y="166">Plus a bias term.</text>
  </g>
  <line class="linear-boundary-line linear-boundary-conn linear-boundary-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#linear-boundary-tip)"/>
  <g class="linear-boundary-stage linear-boundary-s1">
    <rect class="linear-boundary-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="linear-boundary-step" x="280" y="142">02</text>
    <text class="linear-boundary-name" x="306" y="142">The boundary is where that sum is zero</text>
    <text class="linear-boundary-desc" x="280" y="166">Positive on one side, negative</text>
    <text class="linear-boundary-desc" x="280" y="182">on the other.</text>
  </g>
  <line class="linear-boundary-line linear-boundary-conn linear-boundary-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#linear-boundary-tip)"/>
  <g class="linear-boundary-stage linear-boundary-s2">
    <rect class="linear-boundary-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="linear-boundary-step" x="516" y="142">03</text>
    <text class="linear-boundary-name" x="542" y="142">Which in two dimensions is a straight line</text>
    <text class="linear-boundary-desc" x="516" y="166">And in higher dimensions a flat</text>
    <text class="linear-boundary-desc" x="516" y="182">hyperplane.</text>
  </g>
  <line class="linear-boundary-line linear-boundary-conn linear-boundary-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#linear-boundary-tip)"/>
  <g class="linear-boundary-stage linear-boundary-s3">
    <rect class="linear-boundary-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="linear-boundary-step" x="752" y="142">04</text>
    <text class="linear-boundary-name" x="778" y="142">The weight vector points perpendicular to it</text>
    <text class="linear-boundary-desc" x="752" y="166">Which is why weights indicate</text>
    <text class="linear-boundary-desc" x="752" y="182">feature importance.</text>
  </g>
  <text class="linear-boundary-sub" x="30" y="304">The weight vector being perpendicular to the boundary is the geometric fact that makes coefficients interpretable: a large weight means that feature moves you across quickly.</text>
</svg>
