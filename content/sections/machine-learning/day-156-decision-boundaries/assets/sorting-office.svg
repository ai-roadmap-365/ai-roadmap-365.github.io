<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it can be drawn.">
  <title>A line drawn on the floor</title>
  <style>
    .sorting-office-bg   { fill: #f8fafc; }
    .sorting-office-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sorting-office-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-office-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sorting-office-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sorting-office-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sorting-office-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sorting-office-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sorting-office-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sorting-office-row { opacity: 1; }
    .sorting-office-r0 { animation-delay: 0.00s; }
    .sorting-office-r1 { animation-delay: 0.45s; }
    .sorting-office-r2 { animation-delay: 0.90s; }
    .sorting-office-r3 { animation-delay: 1.35s; }
    .sorting-office-r4 { animation-delay: 1.80s; }
    .sorting-office-row { animation: sorting-office-reveal 7.3s ease-in-out infinite; }
    @keyframes sorting-office-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sorting-office-bg" width="980" height="390"/>
  <text class="sorting-office-h1"  x="30" y="40">A line drawn on the floor</text>
  <text class="sorting-office-sub" x="30" y="64">And where it can be drawn.</text>
  <rect class="sorting-office-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-office-name" x="46" y="122">A straight line</text>
  <text class="sorting-office-desc" x="46" y="142">Simple, and limited.</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r0" x="46" y="182">One cut across the whole room</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r1" x="46" y="216">Easy to describe and to remember</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r2" x="46" y="250">Items near the line are ambiguous</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r3" x="46" y="284">Some arrangements cannot be split</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r4" x="46" y="318">This is a linear boundary</text>
  <rect class="sorting-office-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sorting-office-name" x="526" y="122">A flexible line</text>
  <text class="sorting-office-desc" x="526" y="142">Powerful, and fragile.</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r0" x="526" y="182">Curves and loops as needed</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r1" x="526" y="216">Hard to describe</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r2" x="526" y="250">Fits every item exactly</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r3" x="526" y="284">Including the ones misplaced by accident</text>
  <text class="sorting-office-desc sorting-office-row sorting-office-r4" x="526" y="318">This is an overfitted boundary</text>
  <text class="sorting-office-sub" x="30" y="372">Fitting every item exactly is the failure rather than the goal, because some of those items were placed where they are by noise.</text>
</svg>
