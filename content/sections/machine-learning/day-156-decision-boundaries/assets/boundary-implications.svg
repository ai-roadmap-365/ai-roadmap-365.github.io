<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are risks.">
  <title>Four consequences of boundary shape</title>
  <style>
    .boundary-implications-bg   { fill: #f8fafc; }
    .boundary-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boundary-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .boundary-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .boundary-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .boundary-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .boundary-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .boundary-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .boundary-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .boundary-implications-stage { opacity: 1; }

    .boundary-implications-s0 { animation-delay: 0.00s; }
    .boundary-implications-e0 { animation-delay: 0.00s; }
    .boundary-implications-s1 { animation-delay: 1.28s; }
    .boundary-implications-e1 { animation-delay: 1.28s; }
    .boundary-implications-s2 { animation-delay: 2.56s; }
    .boundary-implications-e2 { animation-delay: 2.56s; }
    .boundary-implications-s3 { animation-delay: 3.84s; }
    .boundary-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .boundary-implications-conn  { animation: boundary-implications-trace 6.4s ease-in-out infinite; }
      .boundary-implications-stage { animation: boundary-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes boundary-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes boundary-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .boundary-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .boundary-implications-stage { animation: boundary-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes boundary-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="boundary-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="boundary-implications-bg" width="980" height="322"/>
  <text class="boundary-implications-h1"  x="30" y="40">Four consequences of boundary shape</text>
  <text class="boundary-implications-sub" x="30" y="64">Two are risks.</text>
  <g class="boundary-implications-stage boundary-implications-s0">
    <rect class="boundary-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-implications-step" x="44" y="142">01</text>
    <text class="boundary-implications-name" x="70" y="142">Simple boundaries are explainable</text>
    <text class="boundary-implications-desc" x="44" y="166">Which matters wherever decisions</text>
    <text class="boundary-implications-desc" x="44" y="182">are contested.</text>
  </g>
  <line class="boundary-implications-line boundary-implications-conn boundary-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#boundary-implications-tip)"/>
  <g class="boundary-implications-stage boundary-implications-s1">
    <rect class="boundary-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-implications-step" x="280" y="142">02</text>
    <text class="boundary-implications-name" x="306" y="142">Complex boundaries can memorise noise</text>
    <text class="boundary-implications-desc" x="280" y="166">Fitting the training set and</text>
    <text class="boundary-implications-desc" x="280" y="182">failing on new data.</text>
  </g>
  <line class="boundary-implications-line boundary-implications-conn boundary-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#boundary-implications-tip)"/>
  <g class="boundary-implications-stage boundary-implications-s2">
    <rect class="boundary-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-implications-step" x="516" y="142">03</text>
    <text class="boundary-implications-name" x="542" y="142">And behave unpredictably outside the training range</text>
    <text class="boundary-implications-desc" x="516" y="166">Where no data constrained them.</text>
  </g>
  <line class="boundary-implications-line boundary-implications-conn boundary-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#boundary-implications-tip)"/>
  <g class="boundary-implications-stage boundary-implications-s3">
    <rect class="boundary-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="boundary-implications-step" x="752" y="142">04</text>
    <text class="boundary-implications-name" x="778" y="142">While a boundary can encode disparate treatment</text>
    <text class="boundary-implications-desc" x="752" y="166">Legibly in a linear model,</text>
    <text class="boundary-implications-desc" x="752" y="182">opaquely in a complex one.</text>
  </g>
  <text class="boundary-implications-sub" x="30" y="304">Behaviour outside the training range is the risk that reaches production quietly: the model is confident there because nothing ever told it not to be.</text>
</svg>
