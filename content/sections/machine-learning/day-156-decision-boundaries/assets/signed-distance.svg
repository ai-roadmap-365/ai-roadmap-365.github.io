<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Distance as confidence</title>
  <style>
    .signed-distance-bg   { fill: #f8fafc; }
    .signed-distance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-distance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-distance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-distance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-distance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .signed-distance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .signed-distance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .signed-distance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .signed-distance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .signed-distance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .signed-distance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .signed-distance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .signed-distance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .signed-distance-stage { opacity: 1; }

    .signed-distance-s0 { animation-delay: 0.00s; }
    .signed-distance-e0 { animation-delay: 0.00s; }
    .signed-distance-s1 { animation-delay: 1.28s; }
    .signed-distance-e1 { animation-delay: 1.28s; }
    .signed-distance-s2 { animation-delay: 2.56s; }
    .signed-distance-e2 { animation-delay: 2.56s; }
    .signed-distance-s3 { animation-delay: 3.84s; }
    .signed-distance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .signed-distance-conn  { animation: signed-distance-trace 6.4s ease-in-out infinite; }
      .signed-distance-stage { animation: signed-distance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes signed-distance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes signed-distance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .signed-distance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .signed-distance-stage { animation: signed-distance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes signed-distance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="signed-distance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="signed-distance-bg" width="980" height="322"/>
  <text class="signed-distance-h1"  x="30" y="40">Distance as confidence</text>
  <text class="signed-distance-sub" x="30" y="64">Four steps.</text>
  <g class="signed-distance-stage signed-distance-s0">
    <rect class="signed-distance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="signed-distance-step" x="44" y="142">01</text>
    <text class="signed-distance-name" x="70" y="142">The raw score is proportional to distance</text>
    <text class="signed-distance-desc" x="44" y="166">But scaled by the weight</text>
    <text class="signed-distance-desc" x="44" y="182">vector's length.</text>
  </g>
  <line class="signed-distance-line signed-distance-conn signed-distance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#signed-distance-tip)"/>
  <g class="signed-distance-stage signed-distance-s1">
    <rect class="signed-distance-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="signed-distance-step" x="280" y="142">02</text>
    <text class="signed-distance-name" x="306" y="142">Divide by that length to get true distance</text>
    <text class="signed-distance-desc" x="280" y="166">In the units of the feature</text>
    <text class="signed-distance-desc" x="280" y="182">space.</text>
  </g>
  <line class="signed-distance-line signed-distance-conn signed-distance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#signed-distance-tip)"/>
  <g class="signed-distance-stage signed-distance-s2">
    <rect class="signed-distance-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="signed-distance-step" x="516" y="142">03</text>
    <text class="signed-distance-name" x="542" y="142">The sign gives the predicted class</text>
    <text class="signed-distance-desc" x="516" y="166">Which side of the boundary the</text>
    <text class="signed-distance-desc" x="516" y="182">point lies on.</text>
  </g>
  <line class="signed-distance-line signed-distance-conn signed-distance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#signed-distance-tip)"/>
  <g class="signed-distance-stage signed-distance-s3">
    <rect class="signed-distance-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="signed-distance-step" x="752" y="142">04</text>
    <text class="signed-distance-name" x="778" y="142">And the magnitude gives confidence</text>
    <text class="signed-distance-desc" x="752" y="166">Which is what the sigmoid then</text>
    <text class="signed-distance-desc" x="752" y="182">converts to probability.</text>
  </g>
  <text class="signed-distance-sub" x="30" y="304">This connects the geometry to the previous lesson directly: the sigmoid is a monotone function of signed distance, so probability and distance carry the same information.</text>
</svg>
