terms:
  - term: 'Decision Boundary'
    definition: 'The geometric surface in feature space where the model predicts equal probability across classes (or where the score crosses the classification threshold), separating different predicted class regions.'
  - term: 'Hyperplane'
    definition: 'A flat affine subspace of dimension d-1 in a d-dimensional feature space, defined by the linear equation w^T x + b = 0.'
  - term: 'Signed Distance'
    definition: 'The perpendicular Euclidean distance from a point to a hyperplane, with positive sign indicating the positive half-space and negative sign indicating the negative half-space.'
  - term: 'Decision Region'
    definition: 'The contiguous zone in feature space where all points are assigned to the same class label by the classification model.'
  - term: 'Polynomial Feature Expansion'
    definition: 'A non-linear feature transformation that generates interaction terms and powers of original features, enabling linear models to separate curved manifolds.'
  - term: 'One-vs-Rest (OvR)'
    definition: 'A multiclass classification heuristic that trains K separate binary models, each predicting one class versus all other classes combined.'
  - term: 'Softmax Regression (Multinomial)'
    definition: 'A direct multiclass generalization of logistic regression that models a normalized categorical distribution over all K classes simultaneously.'
  - term: 'Margin'
    definition: 'The geometric distance between the decision boundary and the nearest training data points of any class.'
  - term: 'Linearly Separable'
    definition: 'A dataset property where two classes can be divided with 100% accuracy by a single flat hyperplane without any misclassifications.'
  - term: 'Conic Section'
    definition: 'Geometric curves (ellipses, parabolas, hyperbolas) formed in 2D space by quadratic decision boundaries w1*x1 + w2*x2 + w3*x1^2 + w4*x1*x2 + w5*x2^2 + b = 0.'
