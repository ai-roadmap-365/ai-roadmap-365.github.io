questions:
  - question: 'What mathematical condition defines the decision boundary of a standard binary logistic regression classifier with threshold tau = 0.50?'
    options:
      - 'sigma(w^T x + b) = 0'
      - 'w^T x + b = 1'
      - 'w^T x + b = 0'
      - '||w||_2 = 0'
    answer_index: 2
    explanation: 'When tau = 0.50, sigma(z) = 0.50 requires z = w^T x + b = 0. This zero-set forms a flat hyperplane in feature space.'

  - question: 'In a 2D feature space (x1, x2), what is the slope of the linear decision boundary w1*x1 + w2*x2 + b = 0?'
    options:
      - '- b / w1'
      - '- w2 / w1'
      - 'w1 * w2'
      - '- w1 / w2'
    answer_index: 3
    explanation: 'Rearranging w1*x1 + w2*x2 + b = 0 into slope-intercept form x2 = m*x1 + c yields x2 = (-w1/w2)*x1 + (-b/w2), so the slope is -w1/w2.'

  - question: 'What does the sign and magnitude of the quantity (w^T x_0 + b) / ||w||_2 represent for a query point x_0?'
    options:
      - 'The signed perpendicular distance to the hyperplane'
      - 'The classification error rate of point x_0'
      - 'The gradient of the loss at point x_0'
      - 'The odds ratio of point x_0'
    answer_index: 0
    explanation: 'Dividing the raw linear score by the Euclidean norm of the weight vector yields the exact perpendicular signed distance from x_0 to the hyperplane w^T x + b = 0.'

  - question: 'How does expanding a 2D input (x1, x2) into polynomial terms (x1, x2, x1^2, x1*x2, x2^2) enable a linear classifier to learn curved boundaries?'
    options:
      - 'Polynomial expansion converts the sigmoid activation into a step function'
      - 'It stays a hyperplane in 5D, projecting as a conic in 2D'
      - 'Polynomial expansion makes the loss function non-convex'
      - 'Polynomial expansion replaces logistic regression with a decision tree'
    answer_index: 1
    explanation: 'Linearity is preserved in the transformed 5D feature space, but when plotted in the original (x1, x2) coordinates, the quadratic equation w1*x1 + w2*x2 + w3*x1^2 + w4*x1*x2 + w5*x2^2 + b = 0 forms smooth curves.'

  - question: 'In a One-vs-Rest (OvR) multiclass scheme with K=4 classes, how many distinct binary classifiers are trained?'
    options:
      - '8'
      - '6'
      - '4'
      - '16'
    answer_index: 2
    explanation: 'One-vs-Rest trains exactly K binary classifiers (one per class), comparing each class against the combination of all remaining classes.'

  - question: 'What is a known limitation of the One-vs-Rest multiclass decision strategy?'
    options:
      - 'OvR produces non-linear boundaries in raw features'
      - 'OvR cannot be trained using gradient descent'
      - 'OvR only works when K is an even number'
      - 'Each classifier trains on an imbalanced set'
    answer_index: 3
    explanation: 'Because each binary model is trained independently on a 1-vs-(K-1) dataset, class imbalance is introduced and the raw scores may not be directly comparable across classifiers.'

  - question: 'What happens to the decision boundary of a logistic regression model as L2 regularization strength lambda increases (or C decreases)?'
    options:
      - 'The weight vector shrinks, flattening the boundary'
      - 'The boundary becomes highly oscillatory and fits every individual training point'
      - 'The boundary rotates exactly 90 degrees'
      - 'The boundary disappears and predicts only random noise'
    answer_index: 0
    explanation: 'Stronger L2 regularization shrinks weights toward zero, preventing extreme coefficients and creating smoother, more conservative decision boundaries.'

  - question: 'For a binary classifier with w = [0, 5] and b = -10, what is the geometric orientation of the decision boundary in (x1, x2) space?'
    options:
      - 'A vertical line at x1 = 2.0'
      - 'A horizontal line at x2 = 2.0'
      - 'A diagonal line passing through the origin'
      - 'A circle centered at (0, 0)'
    answer_index: 1
    explanation: 'The equation is 0*x1 + 5*x2 - 10 = 0 ==> 5*x2 = 10 ==> x2 = 2.0, which is a horizontal line parallel to the x1 axis.'
