questions:
  - question: 'What is the Cold Start Problem in collaborative filtering recommender systems?'
    options:
      - 'New users or items have no interaction history at all'
      - 'The latency overhead of spinning up GPU worker nodes during morning peak traffic'
      - 'The numerical instability of computing matrix inverse on zero matrices'
      - 'The memory exhaustion caused by loading 1 billion user rows into RAM'
    answer_index: 0
    explanation: 'Collaborative filtering relies on overlapping interaction histories. When a new user or item joins with zero ratings, the system has no vectors to compute similarities against.'
  - question: 'Why are explicit user and item bias terms (b_u and b_i) included in matrix factorization: r_hat_{u,i} = mu + b_u + b_i + p_u . q_i?'
    options:
      - 'They prevent matrix multiplication from outputting negative numbers'
      - 'They capture systematic per-user and per-item tendencies'
      - 'They normalize the latent dimension size K to equal 100'
      - 'They convert implicit clicks into explicit star ratings'
    answer_index: 1
    explanation: 'Much of rating variation is explained by baseline user tendencies (some people are generous raters; others are harsh) and item quality, rather than complex user-item interaction affinities.'
  - question: 'What is the primary difference between explicit feedback and implicit feedback in modern recommender systems?'
    options:
      - 'Explicit feedback requires GPU training; implicit feedback runs on CPU'
      - 'Explicit feedback uses floating point values; implicit feedback uses binary strings'
      - 'Explicit is direct ratings; implicit is passive behaviour'
      - 'Explicit feedback is only available for e-commerce products'
    answer_index: 2
    explanation: 'Explicit feedback captures deliberate scores, which are rare (<1% of users rate). Implicit feedback captures continuous user activity, which is abundant but lacks negative signals.'
  - question: 'How does Normalized Discounted Cumulative Gain at K (NDCG@K) reward ranking quality compared to Precision@K?'
    options:
      - 'NDCG measures the execution time of the ranking database query'
      - 'NDCG only checks whether the single top item is relevant'
      - 'NDCG ignores item order and counts total relevant items'
      - 'NDCG discounts by position, punishing low-ranked hits'
    answer_index: 3
    explanation: 'NDCG rewards placing highly relevant items at the very top of the list by discounting utility by 1 / log2(rank + 1), reflecting true user browsing behavior.'
  - question: 'What is the key computational advantage of Alternating Least Squares (ALS) over Stochastic Gradient Descent (SGD) for matrix factorization?'
    options:
      - 'Fixing Q decouples each user into an independent ridge fit'
      - 'ALS does not require any matrix inversions'
      - 'ALS eliminates the need for regularization parameters'
      - 'ALS guarantees 100% training accuracy in 1 iteration'
    answer_index: 0
    explanation: 'Fixing one matrix makes the loss quadratic and convex. User and item vectors can be updated independently and in parallel across distributed Spark or Ray clusters.'
