<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Implicit feedback</title>
  <style>
    .implicit-bg   { fill: #f8fafc; }
    .implicit-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .implicit-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .implicit-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .implicit-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .implicit-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .implicit-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .implicit-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .implicit-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .implicit-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .implicit-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .implicit-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .implicit-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .implicit-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .implicit-stage { opacity: 1; }

    .implicit-s0 { animation-delay: 0.00s; }
    .implicit-e0 { animation-delay: 0.00s; }
    .implicit-s1 { animation-delay: 1.28s; }
    .implicit-e1 { animation-delay: 1.28s; }
    .implicit-s2 { animation-delay: 2.56s; }
    .implicit-e2 { animation-delay: 2.56s; }
    .implicit-s3 { animation-delay: 3.84s; }
    .implicit-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .implicit-conn  { animation: implicit-trace 6.4s ease-in-out infinite; }
      .implicit-stage { animation: implicit-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes implicit-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes implicit-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .implicit-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .implicit-stage { animation: implicit-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes implicit-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="implicit-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="implicit-bg" width="980" height="322"/>
  <text class="implicit-h1"  x="30" y="40">Implicit feedback</text>
  <text class="implicit-sub" x="30" y="64">Four steps.</text>
  <g class="implicit-stage implicit-s0">
    <rect class="implicit-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="implicit-step" x="44" y="142">01</text>
    <text class="implicit-name" x="70" y="142">Users rarely give explicit ratings</text>
    <text class="implicit-desc" x="44" y="166">They click, watch, or buy.</text>
  </g>
  <line class="implicit-line implicit-conn implicit-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#implicit-tip)"/>
  <g class="implicit-stage implicit-s1">
    <rect class="implicit-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="implicit-step" x="280" y="142">02</text>
    <text class="implicit-name" x="306" y="142">Which gives positive signals only</text>
    <text class="implicit-desc" x="280" y="166">There is no equivalent of a</text>
    <text class="implicit-desc" x="280" y="182">one-star rating.</text>
  </g>
  <line class="implicit-line implicit-conn implicit-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#implicit-tip)"/>
  <g class="implicit-stage implicit-s2">
    <rect class="implicit-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="implicit-step" x="516" y="142">03</text>
    <text class="implicit-name" x="542" y="142">So absence must be treated as weak negative evidence</text>
    <text class="implicit-desc" x="516" y="166">Not as missing, and not as a</text>
    <text class="implicit-desc" x="516" y="182">definite no.</text>
  </g>
  <line class="implicit-line implicit-conn implicit-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#implicit-tip)"/>
  <g class="implicit-stage implicit-s3">
    <rect class="implicit-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="implicit-step" x="752" y="142">04</text>
    <text class="implicit-name" x="778" y="142">Weighted by confidence, which repeated interaction raises</text>
    <text class="implicit-desc" x="752" y="166">Which is the modelling decision</text>
    <text class="implicit-desc" x="752" y="182">that matters.</text>
  </g>
  <text class="implicit-sub" x="30" y="304">Treating an absence as weak evidence rather than as a definite negative is the whole design problem in implicit feedback, and getting it wrong dominates the result.</text>
</svg>
