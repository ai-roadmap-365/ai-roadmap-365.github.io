<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Factorising a sparse matrix</title>
  <style>
    .funk-svd-bg   { fill: #f8fafc; }
    .funk-svd-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .funk-svd-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .funk-svd-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .funk-svd-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .funk-svd-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .funk-svd-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .funk-svd-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .funk-svd-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .funk-svd-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .funk-svd-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .funk-svd-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .funk-svd-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .funk-svd-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .funk-svd-stage { opacity: 1; }

    .funk-svd-s0 { animation-delay: 0.00s; }
    .funk-svd-e0 { animation-delay: 0.00s; }
    .funk-svd-s1 { animation-delay: 1.28s; }
    .funk-svd-e1 { animation-delay: 1.28s; }
    .funk-svd-s2 { animation-delay: 2.56s; }
    .funk-svd-e2 { animation-delay: 2.56s; }
    .funk-svd-s3 { animation-delay: 3.84s; }
    .funk-svd-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .funk-svd-conn  { animation: funk-svd-trace 6.4s ease-in-out infinite; }
      .funk-svd-stage { animation: funk-svd-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes funk-svd-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes funk-svd-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .funk-svd-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .funk-svd-stage { animation: funk-svd-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes funk-svd-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="funk-svd-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="funk-svd-bg" width="980" height="322"/>
  <text class="funk-svd-h1"  x="30" y="40">Factorising a sparse matrix</text>
  <text class="funk-svd-sub" x="30" y="64">Four steps.</text>
  <g class="funk-svd-stage funk-svd-s0">
    <rect class="funk-svd-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="funk-svd-step" x="44" y="142">01</text>
    <text class="funk-svd-name" x="70" y="142">Approximate the interaction matrix as two thin matrices multiplied</text>
    <text class="funk-svd-desc" x="44" y="166">Users by factors, factors by</text>
    <text class="funk-svd-desc" x="44" y="182">items.</text>
  </g>
  <line class="funk-svd-line funk-svd-conn funk-svd-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#funk-svd-tip)"/>
  <g class="funk-svd-stage funk-svd-s1">
    <rect class="funk-svd-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="funk-svd-step" x="280" y="142">02</text>
    <text class="funk-svd-name" x="306" y="142">Fit only on the observed entries</text>
    <text class="funk-svd-desc" x="280" y="166">Which classical decomposition</text>
    <text class="funk-svd-desc" x="280" y="182">cannot do.</text>
  </g>
  <line class="funk-svd-line funk-svd-conn funk-svd-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#funk-svd-tip)"/>
  <g class="funk-svd-stage funk-svd-s2">
    <rect class="funk-svd-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="funk-svd-step" x="516" y="142">03</text>
    <text class="funk-svd-name" x="542" y="142">Minimising squared error on those entries</text>
    <text class="funk-svd-desc" x="516" y="166">Plus a penalty on the factor</text>
    <text class="funk-svd-desc" x="516" y="182">sizes.</text>
  </g>
  <line class="funk-svd-line funk-svd-conn funk-svd-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#funk-svd-tip)"/>
  <g class="funk-svd-stage funk-svd-s3">
    <rect class="funk-svd-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="funk-svd-step" x="752" y="142">04</text>
    <text class="funk-svd-name" x="778" y="142">Which is why it generalises to unobserved ones</text>
    <text class="funk-svd-desc" x="752" y="166">Rather than memorising what it</text>
    <text class="funk-svd-desc" x="752" y="182">saw.</text>
  </g>
  <text class="funk-svd-sub" x="30" y="304">Fitting only the observed entries is the departure from classical decomposition, and it is what makes the method applicable to a matrix that is almost entirely empty.</text>
</svg>
