<svg role="img" aria-label="Two path diagram illustrating User based collaborative filtering neighborhood consensus versus Item based similarity weighting" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Collaborative Filtering Neighborhood Flow</title>
  <defs>
    <linearGradient id="bg188b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg188b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COLLABORATIVE FILTERING: USER-BASED VS ITEM-BASED</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Cosine Similarity &amp; Pearson Correlation in Sparse Rating Spaces</text>
  <g transform="translate(50, 85)">
    <rect width="360" height="295" fill="url(#cardFlow)" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <text x="180" y="25" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">1. User-User Collaborative Filtering</text>
    <circle cx="180" cy="80" r="20" fill="#3b82f6"/>
    <text x="180" y="85" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Target User u</text>
    <line x1="120" y1="150" x2="165" y2="95" stroke="#38bdf8" stroke-width="2"/>
    <line x1="240" y1="150" x2="195" y2="95" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="120" cy="160" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="240" cy="160" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="270" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Find similar users via Pearson correlation -> recommend their favorites</text>
  </g>
  <g transform="translate(440, 85)">
    <rect width="360" height="295" fill="url(#cardFlow)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="180" y="25" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">2. Item-Item Collaborative Filtering</text>
    <rect x="140" y="65" width="80" height="35" fill="#10b981" rx="4"/>
    <text x="180" y="87" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Target Item i</text>
    <line x1="120" y1="150" x2="160" y2="100" stroke="#10b981" stroke-width="2"/>
    <line x1="240" y1="150" x2="200" y2="100" stroke="#10b981" stroke-width="2"/>
    <rect x="85" y="150" width="70" height="30" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <rect x="205" y="150" width="70" height="30" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="180" y="270" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Precompute item similarity matrix -> recommend items similar to history</text>
  </g>
</svg>
