<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Fitting the factors</title>
  <style>
    .sgd-recsys-bg   { fill: #f8fafc; }
    .sgd-recsys-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-recsys-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-recsys-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-recsys-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-recsys-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-recsys-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sgd-recsys-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sgd-recsys-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sgd-recsys-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sgd-recsys-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sgd-recsys-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sgd-recsys-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sgd-recsys-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sgd-recsys-stage { opacity: 1; }

    .sgd-recsys-s0 { animation-delay: 0.00s; }
    .sgd-recsys-e0 { animation-delay: 0.00s; }
    .sgd-recsys-s1 { animation-delay: 1.28s; }
    .sgd-recsys-e1 { animation-delay: 1.28s; }
    .sgd-recsys-s2 { animation-delay: 2.56s; }
    .sgd-recsys-e2 { animation-delay: 2.56s; }
    .sgd-recsys-s3 { animation-delay: 3.84s; }
    .sgd-recsys-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sgd-recsys-conn  { animation: sgd-recsys-trace 6.4s ease-in-out infinite; }
      .sgd-recsys-stage { animation: sgd-recsys-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sgd-recsys-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sgd-recsys-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sgd-recsys-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sgd-recsys-stage { animation: sgd-recsys-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sgd-recsys-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sgd-recsys-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sgd-recsys-bg" width="980" height="322"/>
  <text class="sgd-recsys-h1"  x="30" y="40">Fitting the factors</text>
  <text class="sgd-recsys-sub" x="30" y="64">Four steps.</text>
  <g class="sgd-recsys-stage sgd-recsys-s0">
    <rect class="sgd-recsys-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sgd-recsys-step" x="44" y="142">01</text>
    <text class="sgd-recsys-name" x="70" y="142">Initialise every user and item vector randomly</text>
    <text class="sgd-recsys-desc" x="44" y="166">Small values, near zero.</text>
  </g>
  <line class="sgd-recsys-line sgd-recsys-conn sgd-recsys-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sgd-recsys-tip)"/>
  <g class="sgd-recsys-stage sgd-recsys-s1">
    <rect class="sgd-recsys-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sgd-recsys-step" x="280" y="142">02</text>
    <text class="sgd-recsys-name" x="306" y="142">Take one observed interaction and predict it</text>
    <text class="sgd-recsys-desc" x="280" y="166">By the dot product.</text>
  </g>
  <line class="sgd-recsys-line sgd-recsys-conn sgd-recsys-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sgd-recsys-tip)"/>
  <g class="sgd-recsys-stage sgd-recsys-s2">
    <rect class="sgd-recsys-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sgd-recsys-step" x="516" y="142">03</text>
    <text class="sgd-recsys-name" x="542" y="142">Then nudge both vectors to reduce the error</text>
    <text class="sgd-recsys-desc" x="516" y="166">Each toward the other, in</text>
    <text class="sgd-recsys-desc" x="516" y="182">proportion.</text>
  </g>
  <line class="sgd-recsys-line sgd-recsys-conn sgd-recsys-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sgd-recsys-tip)"/>
  <g class="sgd-recsys-stage sgd-recsys-s3">
    <rect class="sgd-recsys-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sgd-recsys-step" x="752" y="142">04</text>
    <text class="sgd-recsys-name" x="778" y="142">Sweeping over the observed entries repeatedly</text>
    <text class="sgd-recsys-desc" x="752" y="166">Which is cheap, because most</text>
    <text class="sgd-recsys-desc" x="752" y="182">entries are empty.</text>
    <text class="sgd-recsys-edge" x="752" y="242">sparse</text>
  </g>
  <text class="sgd-recsys-sub" x="30" y="304">Only touching observed entries is what makes this tractable: a dense update over a matrix of billions of cells would be impossible, and is unnecessary.</text>
</svg>
