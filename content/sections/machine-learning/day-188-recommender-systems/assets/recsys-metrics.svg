<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What a list is judged on.">
  <title>Ranking metrics against accuracy</title>
  <style>
    .recsys-metrics-bg   { fill: #f8fafc; }
    .recsys-metrics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-metrics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-metrics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-metrics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-metrics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-metrics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-metrics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recsys-metrics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recsys-metrics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recsys-metrics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recsys-metrics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recsys-metrics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-metrics-row { opacity: 1; }
    .recsys-metrics-r0 { animation-delay: 0.00s; }
    .recsys-metrics-r1 { animation-delay: 0.45s; }
    .recsys-metrics-r2 { animation-delay: 0.90s; }
    .recsys-metrics-r3 { animation-delay: 1.35s; }
    .recsys-metrics-r4 { animation-delay: 1.80s; }
    .recsys-metrics-row { animation: recsys-metrics-reveal 7.3s ease-in-out infinite; }
    @keyframes recsys-metrics-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="recsys-metrics-bg" width="980" height="390"/>
  <text class="recsys-metrics-h1"  x="30" y="40">Ranking metrics against accuracy</text>
  <text class="recsys-metrics-sub" x="30" y="64">What a list is judged on.</text>
  <rect class="recsys-metrics-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-metrics-name" x="46" y="122">Rating accuracy</text>
  <text class="recsys-metrics-desc" x="46" y="142">Predicting a number.</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r0" x="46" y="182">Squared error on predicted ratings</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r1" x="46" y="216">Treats every item equally</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r2" x="46" y="250">Ignores the order shown</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r3" x="46" y="284">Optimises something users never see</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r4" x="46" y="318">Historically standard, and misleading</text>
  <rect class="recsys-metrics-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="recsys-metrics-name" x="526" y="122">Ranking quality</text>
  <text class="recsys-metrics-desc" x="526" y="142">Ordering a list.</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r0" x="526" y="182">Discounted gain, hit rate, coverage</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r1" x="526" y="216">Weights the top positions heavily</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r2" x="526" y="250">Order is the whole measurement</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r3" x="526" y="284">Optimises what users actually experience</text>
  <text class="recsys-metrics-desc recsys-metrics-row recsys-metrics-r4" x="526" y="318">Plus diversity and novelty alongside</text>
  <text class="recsys-metrics-sub" x="30" y="372">Diversity and novelty belong in the evaluation because a recommender that is accurate and repetitive fails commercially while scoring well.</text>
</svg>
