<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to recommend.">
  <title>A bookseller who knows you</title>
  <style>
    .librarian-recs-bg   { fill: #f8fafc; }
    .librarian-recs-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-recs-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-recs-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-recs-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-recs-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .librarian-recs-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-recs-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .librarian-recs-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .librarian-recs-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .librarian-recs-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .librarian-recs-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .librarian-recs-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .librarian-recs-row { opacity: 1; }
    .librarian-recs-r0 { animation-delay: 0.00s; }
    .librarian-recs-r1 { animation-delay: 0.45s; }
    .librarian-recs-r2 { animation-delay: 0.90s; }
    .librarian-recs-r3 { animation-delay: 1.35s; }
    .librarian-recs-r4 { animation-delay: 1.80s; }
    .librarian-recs-row { animation: librarian-recs-reveal 7.3s ease-in-out infinite; }
    @keyframes librarian-recs-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="librarian-recs-bg" width="980" height="390"/>
  <text class="librarian-recs-h1"  x="30" y="40">A bookseller who knows you</text>
  <text class="librarian-recs-sub" x="30" y="64">Two ways to recommend.</text>
  <rect class="librarian-recs-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-recs-name" x="46" y="122">People like you bought</text>
  <text class="librarian-recs-desc" x="46" y="142">Collaborative.</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r0" x="46" y="182">Based on what similar customers chose</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r1" x="46" y="216">Finds surprising connections</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r2" x="46" y="250">Needs no knowledge of the items</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r3" x="46" y="284">Fails for a new customer or a new book</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r4" x="46" y="318">This is collaborative filtering</text>
  <rect class="librarian-recs-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="librarian-recs-name" x="526" y="122">Similar to what you bought</text>
  <text class="librarian-recs-desc" x="526" y="142">Content-based.</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r0" x="526" y="182">Based on the items' own properties</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r1" x="526" y="216">Finds obvious connections</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r2" x="526" y="250">Needs item descriptions</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r3" x="526" y="284">Works from the first purchase</text>
  <text class="librarian-recs-desc librarian-recs-row librarian-recs-r4" x="526" y="318">This is content-based filtering</text>
  <text class="librarian-recs-sub" x="30" y="372">Real systems run both because their failure modes are complementary: one cannot start, and the other cannot surprise.</text>
</svg>
