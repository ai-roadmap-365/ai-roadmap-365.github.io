<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From neighbours to embeddings.">
  <title>Four steps in recommendation</title>
  <style>
    .recsys-history-bg   { fill: #f8fafc; }
    .recsys-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .recsys-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .recsys-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .recsys-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .recsys-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .recsys-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .recsys-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .recsys-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .recsys-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .recsys-history-stage { opacity: 1; }

    .recsys-history-s0 { animation-delay: 0.00s; }
    .recsys-history-e0 { animation-delay: 0.00s; }
    .recsys-history-s1 { animation-delay: 1.28s; }
    .recsys-history-e1 { animation-delay: 1.28s; }
    .recsys-history-s2 { animation-delay: 2.56s; }
    .recsys-history-e2 { animation-delay: 2.56s; }
    .recsys-history-s3 { animation-delay: 3.84s; }
    .recsys-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .recsys-history-conn  { animation: recsys-history-trace 6.4s ease-in-out infinite; }
      .recsys-history-stage { animation: recsys-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes recsys-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes recsys-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .recsys-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .recsys-history-stage { animation: recsys-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes recsys-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="recsys-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="recsys-history-bg" width="980" height="322"/>
  <text class="recsys-history-h1"  x="30" y="40">Four steps in recommendation</text>
  <text class="recsys-history-sub" x="30" y="64">From neighbours to embeddings.</text>
  <g class="recsys-history-stage recsys-history-s0">
    <rect class="recsys-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-history-step" x="44" y="142">01</text>
    <text class="recsys-history-name" x="70" y="142">Neighbourhood methods</text>
    <text class="recsys-history-desc" x="44" y="166">Find similar users, recommend</text>
    <text class="recsys-history-desc" x="44" y="182">what they chose.</text>
  </g>
  <line class="recsys-history-line recsys-history-conn recsys-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#recsys-history-tip)"/>
  <g class="recsys-history-stage recsys-history-s1">
    <rect class="recsys-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-history-step" x="280" y="142">02</text>
    <text class="recsys-history-name" x="306" y="142">Matrix factorisation</text>
    <text class="recsys-history-desc" x="280" y="166">Which won a famous competition</text>
    <text class="recsys-history-desc" x="280" y="182">and changed the field.</text>
  </g>
  <line class="recsys-history-line recsys-history-conn recsys-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#recsys-history-tip)"/>
  <g class="recsys-history-stage recsys-history-s2">
    <rect class="recsys-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-history-step" x="516" y="142">03</text>
    <text class="recsys-history-name" x="542" y="142">Then implicit feedback formulations</text>
    <text class="recsys-history-desc" x="516" y="166">Because explicit ratings barely</text>
    <text class="recsys-history-desc" x="516" y="182">exist in practice.</text>
  </g>
  <line class="recsys-history-line recsys-history-conn recsys-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#recsys-history-tip)"/>
  <g class="recsys-history-stage recsys-history-s3">
    <rect class="recsys-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="recsys-history-step" x="752" y="142">04</text>
    <text class="recsys-history-name" x="778" y="142">And now deep models over sequences</text>
    <text class="recsys-history-desc" x="752" y="166">Which are the same embeddings</text>
    <text class="recsys-history-desc" x="752" y="182">with more structure.</text>
  </g>
  <text class="recsys-history-sub" x="30" y="304">The competition-winning factorisation approach is the direct ancestor of the embedding techniques used throughout the rest of this course.</text>
</svg>
