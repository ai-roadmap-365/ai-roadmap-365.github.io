terms:
  - term: 'Recommender System'
    definition: 'An algorithmic system that predicts user preference ratings or ranks items to deliver personalized suggestions.'
  - term: 'Collaborative Filtering'
    definition: 'A recommendation method based on historical interactions and behavioral similarities between users and items without requiring domain attributes.'
  - term: 'Matrix Factorization'
    definition: 'Decomposing a sparse user-item interaction matrix into low-rank latent user and item embedding vectors.'
  - term: 'Cold Start Problem'
    definition: 'The challenge of recommending items to new users or recommending new items with no prior interaction history.'
  - term: 'Implicit Feedback'
    definition: 'Passive user behavioral signals (clicks, views, dwell time, purchases) rather than explicit numeric ratings.'
  - term: 'Alternating Least Squares (ALS)'
    definition: 'An optimization algorithm that alternates between fixing user matrices to solve for items and fixing item matrices to solve for users.'
  - term: 'NDCG@K'
    definition: 'Normalized Discounted Cumulative Gain at rank K, measuring ranking quality with logarithmic position penalties.'
  - term: 'Cosine Similarity'
    definition: 'A metric measuring the cosine of the angle between two multi-dimensional vectors, evaluating directional similarity independent of magnitude.'
