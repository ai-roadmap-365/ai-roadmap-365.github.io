visuals:
  - id: matrix-factorization-latent-factors
    file: assets/matrix-factorization-latent-factors.svg
    type: diagram
    title: Matrix Factorization Latent Factor Decomposition
    alt: Matrix factorization diagram decomposing a sparse user item rating matrix R into dense user embedding matrix P and item embedding matrix Q with latent dimension k
    description: Matrix factorization architecture decomposing large sparse user-item interaction matrices into dense low-rank user and item latent embedding vectors.
  - id: collaborative-filtering-neighborhood-flow
    file: assets/collaborative-filtering-neighborhood-flow.svg
    type: diagram
    title: Collaborative Filtering Neighborhood Flow
    alt: Two path diagram illustrating User based collaborative filtering neighborhood consensus versus Item based similarity weighting
    description: Comparative neighborhood routing between user-based collaborative filtering (peer correlation) and item-based collaborative filtering (item cosine similarity).
  - id: recsys-idea
    file: assets/recsys-idea.svg
    type: diagram
    title: 'How recommendation works'
    alt: 'Diagram: how latent factors predict a user''s preference for an item'
    description: 'A four-stage description of matrix factorisation covering the sparse matrix, latent factors, the dot product and the prediction.'
  - id: funk-svd
    file: assets/funk-svd.svg
    type: diagram
    title: 'Factorising a sparse matrix'
    alt: 'Diagram: how a sparse interaction matrix is factorised into two dense ones'
    description: 'A four-stage description of matrix factorisation covering the decomposition, the observed entries, the objective and regularisation.'
  - id: implicit
    file: assets/implicit.svg
    type: diagram
    title: 'Implicit feedback'
    alt: 'Diagram: how implicit feedback differs from explicit ratings'
    description: 'A four-stage description of implicit feedback covering the absence of ratings, the interaction signal, the missing negatives and confidence weighting.'
  - id: bpr
    file: assets/bpr.svg
    type: diagram
    title: 'Optimising for ranking'
    alt: 'Diagram: how pairwise ranking optimisation differs from rating prediction'
    description: 'A four-stage description of pairwise ranking covering the goal, the pairs, the objective and the advantage.'
  - id: recsys-metrics
    file: assets/recsys-metrics.svg
    type: diagram
    title: 'Ranking metrics against accuracy'
    alt: 'Diagram: rating-prediction metrics compared with ranking metrics'
    description: 'A two-column comparison of rating accuracy metrics against ranking metrics.'
  - id: collaborative
    file: assets/collaborative.svg
    type: diagram
    title: 'Collaborative filtering'
    alt: 'Diagram: how collaborative filtering recommends from similar users or items'
    description: 'A four-stage description of collaborative filtering covering the two directions, similarity, aggregation and the cold start.'
  - id: sgd-recsys
    file: assets/sgd-recsys.svg
    type: diagram
    title: 'Fitting the factors'
    alt: 'Diagram: how latent factors are learned by stochastic gradient descent'
    description: 'A four-stage description of factor learning covering initialisation, the error, the paired update and the sweep.'
  - id: recsys-not
    file: assets/recsys-not.svg
    type: diagram
    title: 'What recommenders are not'
    alt: 'Diagram: four misconceptions about recommender systems'
    description: 'A two-column comparison of misconceptions about recommenders against what is true.'
  - id: recsys-history
    file: assets/recsys-history.svg
    type: diagram
    title: 'Four steps in recommendation'
    alt: 'Diagram: the historical progression of recommender systems'
    description: 'A four-stage description of recommender history covering neighbourhood methods, matrix factorisation, implicit feedback and deep models.'
  - id: librarian-recs
    file: assets/librarian-recs.svg
    type: diagram
    title: 'A bookseller who knows you'
    alt: 'Diagram: recommending by similar customers compared with recommending by content'
    description: 'A two-column comparison of collaborative recommendation against content-based recommendation.'
  - id: recsys-implications
    file: assets/recsys-implications.svg
    type: diagram
    title: 'Four consequences of recommenders'
    alt: 'Diagram: the engagement, feedback-loop, privacy and diversity implications of recommender systems'
    description: 'A four-stage description of implications covering commercial value, feedback loops, behavioural data and content diversity.'
  - id: recsys-when
    file: assets/recsys-when.svg
    type: diagram
    title: 'Which recommendation approach when'
    alt: 'Diagram: choosing a recommendation approach by available data'
    description: 'A two-column comparison of data situations against the recommendation approach that fits.'
