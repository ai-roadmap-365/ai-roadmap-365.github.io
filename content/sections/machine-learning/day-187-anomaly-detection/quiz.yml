questions:
  - question: 'Why do anomalous data points have shorter average path lengths in an Isolation Forest compared to nominal inliers?'
    options:
      - 'Anomalies are few and have extreme attribute values, making them easy to separate with very few random partition cuts'
      - 'Anomalies are stored in pre-computed hash maps at depth 1'
      - 'The trees are trained with supervised loss gradients that pull anomalies to the root'
      - 'Nominal inliers are randomly deleted during tree construction'
    answer_index: 0
    explanation: 'Because anomalies are isolated in sparse regions of the feature space, random axis-aligned cuts isolate them near the root of the tree with very short path lengths h(x).'
  - question: 'What does the normalization factor c(n) represent in the Isolation Forest anomaly score formula s(x, n) = 2^(-E[h(x)] / c(n))?'
    options:
      - 'The average path length of an unsuccessful search in a Binary Search Tree (BST) built on n points'
      - 'The maximum possible depth limit ceil(log2(n))'
      - 'The total number of trees in the forest ensemble'
      - 'The variance of the sample covariance matrix'
    answer_index: 0
    explanation: 'c(n) is the mathematical expectation of the path length of an unsuccessful search in an equivalent Binary Search Tree over n samples, derived using the Euler-Mascheroni constant.'
  - question: 'What is the key advantage of Local Outlier Factor (LOF) over global distance metrics like Mahalanobis distance?'
    options:
      - 'LOF compares local density against k-nearest neighbors, identifying outliers in datasets with variable density clusters'
      - 'LOF does not require computing any pairwise distances'
      - 'LOF is strictly linear in runtime O(N)'
      - 'LOF outputs binary 0 or 1 without requiring a threshold'
    answer_index: 0
    explanation: 'LOF computes local reachability density ratios relative to neighbors, allowing it to detect outliers in sparse clusters where global distance metrics would fail.'
  - question: 'What is the primary danger of using a very large sample size (e.g. n=100,000) inside individual trees of an Isolation Forest?'
    options:
      - 'It induces swamping (normal points surrounded by anomalies) and masking (anomalies clustering together to look normal), degrading isolation efficiency'
      - 'The tree recursion causes a stack overflow error'
      - 'The trees become non-deterministic'
      - 'The anomaly score s(x) becomes negative'
    answer_index: 0
    explanation: 'Sub-sampling (e.g. psi = 256) is a deliberate design feature of Isolation Forests that eliminates swamping and masking while making training blazing fast.'
  - question: 'How does the contamination parameter calibrate the decision threshold in scikit-learn IsolationForest?'
    options:
      - 'It sets the decision threshold equal to the (100 * (1 - contamination)) percentile of training anomaly scores, flagging the top expected fraction as outliers'
      - 'It deletes that percentage of training rows before fitting'
      - 'It scales the tree learning rate by 1 - contamination'
      - 'It injects Gaussian noise into input features'
    answer_index: 0
    explanation: 'Contamination sets the score percentile cutoff: setting contamination=0.01 forces the model to classify the top 1% highest scoring samples as anomalies (label -1).'
