visuals:
  - id: isolation-forest-partition-tree
    file: assets/isolation-forest-partition-tree.svg
    type: diagram
    title: Isolation Forest Partition Tree Mechanics
    alt: Architecture diagram showing feature space random partition cuts isolating an outlier at shallow depth h equals 1 versus deep recursive inlier splits
    description: Geometric and binary tree visualization showing how isolation trees exploit sparsity to isolate outliers with short average path lengths.
  - id: anomaly-decision-boundaries-comparison
    file: assets/anomaly-decision-boundaries-comparison.svg
    type: diagram
    title: Anomaly Decision Boundaries Comparison
    alt: Three panel comparison showing contour decision boundaries of Elliptic Envelope Isolation Forest and Local Outlier Factor
    description: Comparative analysis of parametric Gaussian envelopes versus random partition tree hulls versus local reachability density contours.
  - id: anomaly-idea
    file: assets/anomaly-idea.svg
    type: diagram
    title: 'Why anomalies need their own methods'
    alt: 'Diagram: why rare-event detection is not a classification problem'
    description: 'A four-stage description of the anomaly problem covering rarity, missing examples, the unsupervised approach and the output.'
  - id: isolation-forest
    file: assets/isolation-forest.svg
    type: diagram
    title: 'Isolation forests'
    alt: 'Diagram: how isolation forests detect anomalies by how easily points are separated'
    description: 'A four-stage description of isolation forests covering random splits, isolation, path length and the score.'
  - id: path-length
    file: assets/path-length.svg
    type: diagram
    title: 'Turning path length into a score'
    alt: 'Diagram: how average path length becomes a normalised anomaly score'
    description: 'A four-stage description of anomaly scoring covering the average, the normalisation, the scale and the threshold.'
  - id: anomaly-paradigms
    file: assets/anomaly-paradigms.svg
    type: diagram
    title: 'Four detection paradigms'
    alt: 'Diagram: four anomaly detection paradigms compared by approach'
    description: 'A two-column comparison of anomaly detection paradigms against their characteristics.'
  - id: anomaly-not
    file: assets/anomaly-not.svg
    type: diagram
    title: 'What anomaly detection is not'
    alt: 'Diagram: four misconceptions about anomaly detection'
    description: 'A two-column comparison of misconceptions about anomaly detection against what is true.'
  - id: anomaly-history
    file: assets/anomaly-history.svg
    type: diagram
    title: 'Four steps in anomaly detection'
    alt: 'Diagram: the historical progression of anomaly detection methods'
    description: 'A four-stage description of anomaly detection history covering statistical outliers, distance methods, isolation methods and deep reconstruction.'
  - id: quality-control
