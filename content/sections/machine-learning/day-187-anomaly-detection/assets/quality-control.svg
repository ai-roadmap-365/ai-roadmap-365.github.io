<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Without a list of faults.">
  <title>Spotting what does not belong</title>
  <style>
    .quality-control-bg   { fill: #f8fafc; }
    .quality-control-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-control-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-control-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-control-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-control-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .quality-control-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quality-control-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .quality-control-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .quality-control-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .quality-control-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .quality-control-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .quality-control-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .quality-control-row { opacity: 1; }
    .quality-control-r0 { animation-delay: 0.00s; }
    .quality-control-r1 { animation-delay: 0.45s; }
    .quality-control-r2 { animation-delay: 0.90s; }
    .quality-control-r3 { animation-delay: 1.35s; }
    .quality-control-r4 { animation-delay: 1.80s; }
    .quality-control-row { animation: quality-control-reveal 7.3s ease-in-out infinite; }
    @keyframes quality-control-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="quality-control-bg" width="980" height="390"/>
  <text class="quality-control-h1"  x="30" y="40">Spotting what does not belong</text>
  <text class="quality-control-sub" x="30" y="64">Without a list of faults.</text>
  <rect class="quality-control-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="quality-control-name" x="46" y="122">A list of known faults</text>
  <text class="quality-control-desc" x="46" y="142">Checks what you expected.</text>
  <text class="quality-control-desc quality-control-row quality-control-r0" x="46" y="182">Each known problem has a test</text>
  <text class="quality-control-desc quality-control-row quality-control-r1" x="46" y="216">New failure modes pass unnoticed</text>
  <text class="quality-control-desc quality-control-row quality-control-r2" x="46" y="250">Needs examples of every fault</text>
  <text class="quality-control-desc quality-control-row quality-control-r3" x="46" y="284">Precise about what it covers</text>
  <text class="quality-control-desc quality-control-row quality-control-r4" x="46" y="318">This is a classifier</text>
  <rect class="quality-control-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="quality-control-name" x="526" y="122">Knowing what normal looks like</text>
  <text class="quality-control-desc" x="526" y="142">Notices the unfamiliar.</text>
  <text class="quality-control-desc quality-control-row quality-control-r0" x="526" y="182">Deep familiarity with the ordinary</text>
  <text class="quality-control-desc quality-control-row quality-control-r1" x="526" y="216">Anything unusual stands out</text>
  <text class="quality-control-desc quality-control-row quality-control-r2" x="526" y="250">Needs no examples of faults</text>
  <text class="quality-control-desc quality-control-row quality-control-r3" x="526" y="284">Vague about why it is odd</text>
  <text class="quality-control-desc quality-control-row quality-control-r4" x="526" y="318">This is anomaly detection</text>
  <text class="quality-control-sub" x="30" y="372">An experienced inspector who cannot say what is wrong but knows something is describes this exactly: the detector flags unfamiliarity, not a diagnosis.</text>
</svg>
