<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Toward scale.">
  <title>Four steps in anomaly detection</title>
  <style>
    .anomaly-history-bg   { fill: #f8fafc; }
    .anomaly-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .anomaly-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .anomaly-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .anomaly-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .anomaly-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .anomaly-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .anomaly-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .anomaly-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .anomaly-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .anomaly-history-stage { opacity: 1; }

    .anomaly-history-s0 { animation-delay: 0.00s; }
    .anomaly-history-e0 { animation-delay: 0.00s; }
    .anomaly-history-s1 { animation-delay: 1.28s; }
    .anomaly-history-e1 { animation-delay: 1.28s; }
    .anomaly-history-s2 { animation-delay: 2.56s; }
    .anomaly-history-e2 { animation-delay: 2.56s; }
    .anomaly-history-s3 { animation-delay: 3.84s; }
    .anomaly-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .anomaly-history-conn  { animation: anomaly-history-trace 6.4s ease-in-out infinite; }
      .anomaly-history-stage { animation: anomaly-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes anomaly-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes anomaly-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .anomaly-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .anomaly-history-stage { animation: anomaly-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes anomaly-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="anomaly-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="anomaly-history-bg" width="980" height="322"/>
  <text class="anomaly-history-h1"  x="30" y="40">Four steps in anomaly detection</text>
  <text class="anomaly-history-sub" x="30" y="64">Toward scale.</text>
  <g class="anomaly-history-stage anomaly-history-s0">
    <rect class="anomaly-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-history-step" x="44" y="142">01</text>
    <text class="anomaly-history-name" x="70" y="142">Statistical outlier tests</text>
    <text class="anomaly-history-desc" x="44" y="166">Assuming a known distribution,</text>
    <text class="anomaly-history-desc" x="44" y="182">in few dimensions.</text>
  </g>
  <line class="anomaly-history-line anomaly-history-conn anomaly-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#anomaly-history-tip)"/>
  <g class="anomaly-history-stage anomaly-history-s1">
    <rect class="anomaly-history-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-history-step" x="280" y="142">02</text>
    <text class="anomaly-history-name" x="306" y="142">Distance and density methods</text>
    <text class="anomaly-history-desc" x="280" y="166">More general, and quadratic in</text>
    <text class="anomaly-history-desc" x="280" y="182">cost.</text>
  </g>
  <line class="anomaly-history-line anomaly-history-conn anomaly-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#anomaly-history-tip)"/>
  <g class="anomaly-history-stage anomaly-history-s2">
    <rect class="anomaly-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-history-step" x="516" y="142">03</text>
    <text class="anomaly-history-name" x="542" y="142">Isolation-based methods</text>
    <text class="anomaly-history-desc" x="516" y="166">Linear cost, and no distances</text>
    <text class="anomaly-history-desc" x="516" y="182">computed.</text>
  </g>
  <line class="anomaly-history-line anomaly-history-conn anomaly-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#anomaly-history-tip)"/>
  <g class="anomaly-history-stage anomaly-history-s3">
    <rect class="anomaly-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="anomaly-history-step" x="752" y="142">04</text>
    <text class="anomaly-history-name" x="778" y="142">Then reconstruction-based deep methods</text>
    <text class="anomaly-history-desc" x="752" y="166">For images, sequences and</text>
    <text class="anomaly-history-desc" x="752" y="182">complex signals.</text>
  </g>
  <text class="anomaly-history-sub" x="30" y="304">The move away from computing distances is what unlocked production scale, and it is the same constraint that shapes vector search.</text>
</svg>
