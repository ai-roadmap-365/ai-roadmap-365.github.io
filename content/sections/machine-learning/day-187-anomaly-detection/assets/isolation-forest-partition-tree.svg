<svg role="img" aria-label="Architecture diagram showing feature space random partition cuts isolating an outlier at shallow depth h equals 1 versus deep recursive inlier splits" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Isolation Forest Partition Tree Mechanics</title>
  <defs>
    <linearGradient id="bg187a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card187" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg187a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ISOLATION FOREST: RANDOM PARTITIONING TREE MECHANICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Anomalies are isolated near the root (short path length h(x)); inliers require deep recursive splits</text>
  <g transform="translate(50, 85)">
    <rect width="360" height="295" fill="url(#card187)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <text x="180" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Feature Space Random Cuts</text>
    <rect x="40" y="50" width="280" height="200" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="200" cy="160" r="30" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6"/>
    <circle cx="70" cy="80" r="7" fill="#ef4444"/>
    <text x="70" y="70" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Anomaly (x_a)</text>
    <line x1="40" y1="110" x2="320" y2="110" stroke="#ef4444" stroke-width="2.5"/>
    <text x="270" y="105" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Cut 1 (h=1)</text>
  </g>
  <g transform="translate(440, 85)">
    <rect width="360" height="295" fill="url(#card187)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <text x="180" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Isolation Tree Path Length</text>
    <circle cx="180" cy="65" r="16" fill="#3b82f6"/>
    <text x="180" y="70" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Root</text>
    <line x1="168" y1="75" x2="90" y2="125" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="90" cy="125" r="16" fill="#ef4444"/>
    <text x="90" y="130" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">x_a</text>
    <text x="90" y="160" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">h(x_a) = 1 (Short)</text>
    <text x="180" y="280" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Score: s(x) = 2^(-E[h(x)] / c(n))</text>
  </g>
</svg>
