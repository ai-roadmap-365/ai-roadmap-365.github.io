terms:
  - term: 'Anomaly Detection'
    definition: 'The identification of rare items, events, or observations that raise suspicions by differing significantly from the majority of the data.'
  - term: 'Isolation Forest'
    definition: 'An unsupervised tree-based ensemble that isolates anomalies by randomly partitioning feature values.'
  - term: 'Path Length h(x)'
    definition: 'The number of edges traversed from the root node to a terminating leaf node in an Isolation Tree.'
  - term: 'Euler-Mascheroni Constant'
    definition: 'A mathematical constant (approx 0.5772156649) used in BST expected path length normalization.'
  - term: 'Local Outlier Factor (LOF)'
    definition: 'A density-based algorithm measuring the local deviation of a given data point with respect to its neighbors.'
  - term: 'Mahalanobis Distance'
    definition: 'A multi-dimensional generalization of measuring how many standard deviations away point x is from sample mean mu.'
  - term: 'Contamination'
    definition: 'The expected proportion of outliers in the dataset, used to calibrate decision score thresholds.'
  - term: 'One-Class SVM'
    definition: 'An unsupervised kernel method that learns a soft boundary enclosing nominal data points in high-dimensional feature space.'
