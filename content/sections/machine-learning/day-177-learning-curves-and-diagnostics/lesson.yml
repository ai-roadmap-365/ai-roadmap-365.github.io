slug: learning-curves-and-diagnostics
title: Learning Curves and Diagnostics
section: machine-learning
subsection: supervised-learning
week: 26
learning_promise: >-
  Master the empirical science of model diagnostics: interpret learning curves and validation curves to dissect the
  Bias-Variance tradeoff, diagnose whether a failing model suffers from representational underfitting or noisy overfitting,
  and execute targeted algorithmic remedies rather than relying on guesswork.
objectives:
  - 'Deconstruct Mean Squared Error into irreducible noise, squared bias, and variance'
  - 'Construct and interpret learning curves plotting J_train(m) and J_val(m) against training sample size m'
  - 'Construct and interpret validation curves sweeping hyperparameter complexity'
  - 'Differentiate High Bias (plateauing validation error) from High Variance (large generalization gap)'
  - 'Apply targeted engineering remedies: when collecting more data works and when it is useless'
  - 'Automate diagnostic checks for CI/CD model validation suites'
prerequisites:
  - 'Day 145 -- Overfitting and Underfitting'
  - 'Day 166 -- Hyperparameter Tuning'
  - 'Day 167 -- Cross-Validation Done Right'
