questions:
  - question: "When a model exhibits High Bias (Underfitting), what does its learning curve look like as training sample size m increases?"
    options:
      - 'Both errors flatten high with a narrow gap'
      - "Training error drops to zero while validation error explodes to infinity."
      - "Validation error oscillates wildly between 0% and 100%."
      - "The model achieves 100% accuracy on validation data immediately."
    answer_index: 0
    explanation: "In High Bias, the model lacks representational capacity to capture the underlying pattern. As sample size m grows, training error increases slightly and validation error decreases slightly, converging to the same high error plateau. Adding more data does not help."

  - question: "If your model exhibits a large generalization gap (Training R2 = 0.99, Validation R2 = 0.65), what is the correct diagnosis and primary remedy?"
    options:
      - "High Bias (Underfitting); remedies include adding more polynomial interaction terms and reducing regularization."
      - 'High variance: more data, more regularization, or bagging'
      - "Data Leakage; the training data must have leaked future target labels into validation splits."
      - "Label Noise; all ground truth labels must be manually deleted and re-annotated."
    answer_index: 1
    explanation: "A large gap between training performance and validation performance is the textbook definition of High Variance (Overfitting). Increasing training data, strengthening regularization, or reducing features will pull the validation score up toward the training score."

  - question: "Why does collecting more training data NOT solve a High Bias problem?"
    options:
      - "Because gradient descent cannot compute gradients on large datasets."
      - "Because scikit-learn algorithms crash when training data exceeds 10,000 samples."
      - 'The architecture lacks the capacity to represent it'
      - "Because validation curves are only valid for sample sizes under 500."
    answer_index: 2
    explanation: "If you try to fit a straight line (y = wx + b) to a complex sinusoidal wave, having 10,000 data points will not help the line bend. The constraint is model representational capacity, not sample quantity."

  - question: "In a Validation Curve sweeping tree depth from 1 to 20, what does a U-shaped validation error curve indicate?"
    options:
      - "The dataset has zero irreducible noise."
      - "The decision tree algorithm is mathematically invalid for tabular datasets."
      - "The cross-validation splitter failed to shuffle the samples."
      - 'High bias at low depth, high variance at high depth'
    answer_index: 3
    explanation: "The validation curve captures the classic Bias-Variance tradeoff: underfitting on the left (high bias), optimal tradeoff in the center, and overfitting on the right (high variance)."

  - question: "What is irreducible error (sigma^2) in the Bias-Variance decomposition?"
    options:
      - 'The inherent noise no model can ever predict'
      - "A software bug in the NumPy random number generator."
      - "The floating point precision limit of 64-bit IEEE 754 floats."
      - "The difference between L1 and L2 regularization penalties."
    answer_index: 0
    explanation: "Irreducible error sigma^2 represents the intrinsic stochastic variance of the environment and unobserved variables. It sets the theoretical lower bound (Bayes Error Rate) for any machine learning predictor."
