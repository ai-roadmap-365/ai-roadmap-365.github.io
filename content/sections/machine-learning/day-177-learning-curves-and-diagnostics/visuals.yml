visuals:
  - id: learning-curves-bias-variance
    file: assets/learning-curves-bias-variance.svg
    type: diagram
    title: 'Learning Curve Diagnostics: High Bias vs High Variance'
    alt: 'Comparative diagram contrasting learning curves under High Bias where errors plateau early versus High Variance where a wide generalization gap persists.'
    description: 'A static diagnostic chart illustrating how training and validation errors behave as sample size m grows in underfitting vs overfitting regimes.'
  - id: validation-curve-hyperparameter-flow
    file: assets/validation-curve-hyperparameter-flow.svg
    type: flow-animated
    title: 'Validation Curve: Hyperparameter Tuning Diagnostics'
    alt: 'Animated flow diagram showing training and validation error curves across model capacity identifying the optimal bias-variance tradeoff sweet spot.'
    description: 'An animated diagnostic chart demonstrating the U-shaped validation curve behavior across hyperparameter complexity sweeps.'
  - id: bias-variance
    file: assets/bias-variance.svg
    type: diagram
    title: 'The decomposition'
    alt: 'Diagram: the three components of prediction error'
    description: 'A three-stage description of the error decomposition covering bias, variance and irreducible noise.'
  - id: learning-curves
    file: assets/learning-curves.svg
    type: diagram
    title: 'Reading a learning curve'
    alt: 'Diagram: how a learning curve reveals whether more data will help'
    description: 'A four-stage description of learning curves covering the two lines, the gap, convergence and the conclusion.'
  - id: bias-variance-diagnosis
    file: assets/bias-variance-diagnosis.svg
    type: diagram
    title: 'Underfitting against overfitting'
    alt: 'Diagram: the symptoms and remedies of underfitting compared with overfitting'
    description: 'A two-column comparison of underfitting against overfitting.'
  - id: validation-curves
    file: assets/validation-curves.svg
    type: diagram
    title: 'The validation curve'
    alt: 'Diagram: how a validation curve locates the best complexity setting'
    description: 'A four-stage description of validation curves covering the sweep, the two lines, the divergence point and the choice.'
  - id: diagnostics-not
    file: assets/diagnostics-not.svg
    type: diagram
    title: 'What diagnostics are not'
    alt: 'Diagram: four misconceptions about model diagnostics'
    description: 'A two-column comparison of misconceptions about diagnostics against what is true.'
  - id: diagnostics-history
    file: assets/diagnostics-history.svg
    type: diagram
    title: 'Four steps in model diagnostics'
    alt: 'Diagram: the historical progression of model diagnostic practice'
    description: 'A four-stage description of diagnostics history covering residual analysis, the decomposition, learning curves and modern loss curves.'
  - id: medical-diagnosis
    file: assets/medical-diagnosis.svg
    type: diagram
    title: 'Diagnose before treating'
    alt: 'Diagram: treating symptoms blindly compared with diagnosing first'
    description: 'A two-column comparison of untargeted remedies against diagnosis-led ones.'
  - id: diagnostics-implications
    file: assets/diagnostics-implications.svg
    type: diagram
    title: 'Four consequences of diagnosing first'
