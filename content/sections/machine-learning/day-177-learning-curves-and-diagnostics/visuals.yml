  - id: diagnostics-why
    file: assets/diagnostics-why.svg
    type: diagram
    title: 'What diagnostics solve'
    alt: 'Diagram: the four problems model diagnostics address'
    description: 'A four-stage description of the problems diagnostics address covering blind remedies, the data question, stopping criteria and expectation setting.'
