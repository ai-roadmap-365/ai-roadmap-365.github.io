<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Symptoms narrow the cause.">
  <title>Diagnose before treating</title>
  <style>
    .medical-diagnosis-bg   { fill: #f8fafc; }
    .medical-diagnosis-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-diagnosis-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-diagnosis-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-diagnosis-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-diagnosis-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .medical-diagnosis-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-diagnosis-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .medical-diagnosis-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .medical-diagnosis-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .medical-diagnosis-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .medical-diagnosis-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .medical-diagnosis-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .medical-diagnosis-row { opacity: 1; }
    .medical-diagnosis-r0 { animation-delay: 0.00s; }
    .medical-diagnosis-r1 { animation-delay: 0.45s; }
    .medical-diagnosis-r2 { animation-delay: 0.90s; }
    .medical-diagnosis-r3 { animation-delay: 1.35s; }
    .medical-diagnosis-r4 { animation-delay: 1.80s; }
    .medical-diagnosis-row { animation: medical-diagnosis-reveal 7.3s ease-in-out infinite; }
    @keyframes medical-diagnosis-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="medical-diagnosis-bg" width="980" height="390"/>
  <text class="medical-diagnosis-h1"  x="30" y="40">Diagnose before treating</text>
  <text class="medical-diagnosis-sub" x="30" y="64">Symptoms narrow the cause.</text>
  <rect class="medical-diagnosis-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="medical-diagnosis-name" x="46" y="122">Try remedies in turn</text>
  <text class="medical-diagnosis-desc" x="46" y="142">Expensive guessing.</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r0" x="46" y="182">Attempt whatever is at hand</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r1" x="46" y="216">Some make things worse</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r2" x="46" y="250">No way to know what helped</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r3" x="46" y="284">Slow, and costly</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r4" x="46" y="318">This is untargeted model search</text>
  <rect class="medical-diagnosis-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="medical-diagnosis-name" x="526" y="122">Diagnose, then treat</text>
  <text class="medical-diagnosis-desc" x="526" y="142">One targeted fix.</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r0" x="526" y="182">Read the symptoms first</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r1" x="526" y="216">The cause narrows the options</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r2" x="526" y="250">The remedy follows from the cause</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r3" x="526" y="284">Fast, and cheap</text>
  <text class="medical-diagnosis-desc medical-diagnosis-row medical-diagnosis-r4" x="526" y="318">This is bias-variance diagnosis</text>
  <text class="medical-diagnosis-sub" x="30" y="372">The remedies for the two conditions are opposites, which is exactly why guessing is worse than useless here: the wrong treatment actively harms.</text>
</svg>
