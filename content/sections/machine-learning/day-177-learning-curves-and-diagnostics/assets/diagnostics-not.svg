<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What diagnostics are not</title>
  <style>
    .diagnostics-not-bg   { fill: #f8fafc; }
    .diagnostics-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .diagnostics-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .diagnostics-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .diagnostics-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .diagnostics-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .diagnostics-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .diagnostics-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .diagnostics-not-row { opacity: 1; }
    .diagnostics-not-r0 { animation-delay: 0.00s; }
    .diagnostics-not-r1 { animation-delay: 0.45s; }
    .diagnostics-not-r2 { animation-delay: 0.90s; }
    .diagnostics-not-r3 { animation-delay: 1.35s; }
    .diagnostics-not-r4 { animation-delay: 1.80s; }
    .diagnostics-not-row { animation: diagnostics-not-reveal 7.3s ease-in-out infinite; }
    @keyframes diagnostics-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="diagnostics-not-bg" width="980" height="390"/>
  <text class="diagnostics-not-h1"  x="30" y="40">What diagnostics are not</text>
  <text class="diagnostics-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="diagnostics-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="diagnostics-not-name" x="46" y="122">The misconception</text>
  <text class="diagnostics-not-desc" x="46" y="142">Commonly held.</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r0" x="46" y="182">A gap between curves is always overfitting</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r1" x="46" y="216">More data always helps</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r2" x="46" y="250">Low training error means the model works</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r3" x="46" y="284">Diagnostics are for when things go wrong</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r4" x="46" y="318">Complexity is a single dial</text>
  <rect class="diagnostics-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="diagnostics-not-name" x="526" y="122">What is true</text>
  <text class="diagnostics-not-desc" x="526" y="142">Actually.</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r0" x="526" y="182">Some gap is normal; a growing one is not</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r1" x="526" y="216">Not when the model underfits</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r2" x="526" y="250">It may mean pure memorisation</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r3" x="526" y="284">They tell you what to try before you try it</text>
  <text class="diagnostics-not-desc diagnostics-not-row diagnostics-not-r4" x="526" y="318">Depth, features and regularisation all move it</text>
  <text class="diagnostics-not-sub" x="30" y="372">Running diagnostics before choosing a remedy rather than after a disappointment is the habit worth forming, because it narrows the options from many to one or two.</text>
</svg>
