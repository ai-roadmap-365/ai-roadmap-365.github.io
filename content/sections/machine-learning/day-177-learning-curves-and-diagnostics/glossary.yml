terms:
  - term: 'Learning Curve'
    definition: 'A plot of model training error and validation error as a function of the training dataset sample size.'
  - term: 'High Bias (Underfitting)'
    definition: 'A failure regime where model capacity is insufficient, resulting in high training error and high validation error with a small generalization gap.'
  - term: 'High Variance (Overfitting)'
    definition: 'A failure regime where model capacity is too high, resulting in low training error but high validation error and a wide generalization gap.'
  - term: 'Generalization Gap'
    definition: 'The numerical difference between validation loss and training loss.'
  - term: 'Validation Curve'
    definition: 'A plot showing training and validation scores as a function of a single model hyperparameter (such as max depth or regularization lambda).'
  - term: 'Irreducible Error'
    definition: 'Noise inherent in the data-generating process that cannot be eliminated by any model regardless of capacity or dataset size.'
  - term: 'Structural Risk Minimization'
    definition: 'An inductive principle for model selection that balances empirical risk against functional capacity bounds.'
  - term: 'Data Saturation'
    definition: 'The point on a learning curve where collecting additional training samples yields negligible improvement in validation performance.'
