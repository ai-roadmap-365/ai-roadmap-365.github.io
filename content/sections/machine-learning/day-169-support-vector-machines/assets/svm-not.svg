<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What support vector machines are not</title>
  <style>
    .svm-not-bg   { fill: #f8fafc; }
    .svm-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .svm-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .svm-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .svm-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .svm-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .svm-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .svm-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .svm-not-row { opacity: 1; }
    .svm-not-r0 { animation-delay: 0.00s; }
    .svm-not-r1 { animation-delay: 0.45s; }
    .svm-not-r2 { animation-delay: 0.90s; }
    .svm-not-r3 { animation-delay: 1.35s; }
    .svm-not-r4 { animation-delay: 1.80s; }
    .svm-not-row { animation: svm-not-reveal 7.3s ease-in-out infinite; }
    @keyframes svm-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="svm-not-bg" width="980" height="390"/>
  <text class="svm-not-h1"  x="30" y="40">What support vector machines are not</text>
  <text class="svm-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="svm-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="svm-not-name" x="46" y="122">The misconception</text>
  <text class="svm-not-desc" x="46" y="142">Commonly held.</text>
  <text class="svm-not-desc svm-not-row svm-not-r0" x="46" y="182">They are obsolete</text>
  <text class="svm-not-desc svm-not-row svm-not-r1" x="46" y="216">They output probabilities</text>
  <text class="svm-not-desc svm-not-row svm-not-r2" x="46" y="250">They scale to any dataset</text>
  <text class="svm-not-desc svm-not-row svm-not-r3" x="46" y="284">The kernel choice is a minor detail</text>
  <text class="svm-not-desc svm-not-row svm-not-r4" x="46" y="318">Scaling is optional</text>
  <rect class="svm-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="svm-not-name" x="526" y="122">What is true</text>
  <text class="svm-not-desc" x="526" y="142">Actually.</text>
  <text class="svm-not-desc svm-not-row svm-not-r0" x="526" y="182">Still strong on small, high-dimensional data</text>
  <text class="svm-not-desc svm-not-row svm-not-r1" x="526" y="216">They output distances; probabilities need calibration</text>
  <text class="svm-not-desc svm-not-row svm-not-r2" x="526" y="250">Training is superlinear; they do not</text>
  <text class="svm-not-desc svm-not-row svm-not-r3" x="526" y="284">It determines the boundary family entirely</text>
  <text class="svm-not-desc svm-not-row svm-not-r4" x="526" y="318">Scaling is mandatory, as for any distance method</text>
  <text class="svm-not-sub" x="30" y="372">The scaling requirement follows directly from the kernel being a distance-based similarity, which puts support vector machines in the same category as nearest neighbours.</text>
</svg>
