<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Solving it by gradient descent</title>
  <style>
    .pegasos-bg   { fill: #f8fafc; }
    .pegasos-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pegasos-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pegasos-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pegasos-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pegasos-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pegasos-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pegasos-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pegasos-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pegasos-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pegasos-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pegasos-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pegasos-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pegasos-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pegasos-stage { opacity: 1; }

    .pegasos-s0 { animation-delay: 0.00s; }
    .pegasos-e0 { animation-delay: 0.00s; }
    .pegasos-s1 { animation-delay: 1.28s; }
    .pegasos-e1 { animation-delay: 1.28s; }
    .pegasos-s2 { animation-delay: 2.56s; }
    .pegasos-e2 { animation-delay: 2.56s; }
    .pegasos-s3 { animation-delay: 3.84s; }
    .pegasos-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pegasos-conn  { animation: pegasos-trace 6.4s ease-in-out infinite; }
      .pegasos-stage { animation: pegasos-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pegasos-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pegasos-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pegasos-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pegasos-stage { animation: pegasos-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pegasos-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pegasos-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pegasos-bg" width="980" height="322"/>
  <text class="pegasos-h1"  x="30" y="40">Solving it by gradient descent</text>
  <text class="pegasos-sub" x="30" y="64">Four steps.</text>
  <g class="pegasos-stage pegasos-s0">
    <rect class="pegasos-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pegasos-step" x="44" y="142">01</text>
    <text class="pegasos-name" x="70" y="142">Write the objective as hinge loss plus a penalty</text>
    <text class="pegasos-desc" x="44" y="166">Which turns it into an ordinary</text>
    <text class="pegasos-desc" x="44" y="182">loss minimisation.</text>
  </g>
  <line class="pegasos-line pegasos-conn pegasos-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pegasos-tip)"/>
  <g class="pegasos-stage pegasos-s1">
    <rect class="pegasos-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pegasos-step" x="280" y="142">02</text>
    <text class="pegasos-name" x="306" y="142">The hinge is not differentiable at its kink</text>
    <text class="pegasos-desc" x="280" y="166">So ordinary gradients do not</text>
    <text class="pegasos-desc" x="280" y="182">strictly apply.</text>
  </g>
  <line class="pegasos-line pegasos-conn pegasos-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pegasos-tip)"/>
  <g class="pegasos-stage pegasos-s2">
    <rect class="pegasos-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pegasos-step" x="516" y="142">03</text>
    <text class="pegasos-name" x="542" y="142">But a subgradient works</text>
    <text class="pegasos-desc" x="516" y="166">Any valid slope at the kink will</text>
    <text class="pegasos-desc" x="516" y="182">do.</text>
  </g>
  <line class="pegasos-line pegasos-conn pegasos-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pegasos-tip)"/>
  <g class="pegasos-stage pegasos-s3">
    <rect class="pegasos-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pegasos-step" x="752" y="142">04</text>
    <text class="pegasos-name" x="778" y="142">So it trains by the same loop as everything else</text>
    <text class="pegasos-desc" x="752" y="166">Which scales far better than the</text>
    <text class="pegasos-desc" x="752" y="182">dual solvers.</text>
  </g>
  <text class="pegasos-sub" x="30" y="304">Solving the primal by gradient descent is what keeps linear support vector machines practical at scale, and it is the version used in most large-scale text pipelines.</text>
</svg>
