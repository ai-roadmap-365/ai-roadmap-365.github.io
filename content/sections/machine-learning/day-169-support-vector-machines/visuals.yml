visuals:
  - id: svm-margin-geometry
    file: assets/svm-margin-geometry.svg
    type: diagram
    title: 'Support Vector Machine Margin Geometry and Slack Variables'
    alt: 'Geometric diagram showing the separating hyperplane w^T x + b = 0, positive and negative margin boundaries, support vectors, and slack variable violations.'
    description: 'A static architecture diagram illustrating the maximum margin geometry, support vectors, and soft-margin slack variables in linear SVMs.'
  - id: kernel-trick-projection
    file: assets/kernel-trick-projection.svg
    type: flow-animated
    title: 'The Kernel Trick: Non-Linear Mapping to Higher Dimensions'
    alt: 'Animated diagram showing 2D non-linearly separable concentric circles projected into 3D parabolic space where a linear hyperplane cleanly separates classes.'
    description: 'An animated diagram demonstrating how non-linear kernels project complex data into higher-dimensional linear feature spaces.'
  - id: svm-idea
    file: assets/svm-idea.svg
    type: diagram
    title: 'The margin idea'
    alt: 'Diagram: why the widest-margin boundary is preferred'
    description: 'A four-stage description of margin maximisation covering many boundaries, the margin, the widest one and the support vectors.'
  - id: soft-margin
    file: assets/soft-margin.svg
    type: diagram
    title: 'The soft margin'
    alt: 'Diagram: how slack variables allow a margin on non-separable data'
    description: 'A four-stage description of the soft margin covering the separability assumption, its failure, slack variables and the trade-off parameter.'
  - id: dual-support
    file: assets/dual-support.svg
    type: diagram
    title: 'The dual form'
    alt: 'Diagram: what the dual formulation of the margin problem enables'
    description: 'A four-stage description of the dual formulation covering the reformulation, the dot products, sparsity and the kernel opening.'
  - id: kernel-trick
    file: assets/kernel-trick.svg
    type: diagram
    title: 'The kernel trick'
    alt: 'Diagram: how a kernel computes high-dimensional similarity without the mapping'
    description: 'A four-stage description of the kernel trick covering the explicit mapping, its cost, the kernel shortcut and the condition.'
  - id: svm-not
    file: assets/svm-not.svg
    type: diagram
    title: 'What support vector machines are not'
    alt: 'Diagram: four misconceptions about support vector machines'
    description: 'A two-column comparison of misconceptions about support vector machines against what is true.'
  - id: svm-history
    file: assets/svm-history.svg
    type: diagram
    title: 'Four steps for support vector machines'
    alt: 'Diagram: the historical progression of support vector machines'
    description: 'A four-stage description of support vector machine history covering the margin idea, the soft margin, dominance and displacement.'
  - id: widest-path
    file: assets/widest-path.svg
    type: diagram
    title: 'The widest safe path'
    alt: 'Diagram: a path close to obstacles compared with the widest available path'
    description: 'A two-column comparison of a narrow path against the widest available one.'
  - id: svm-implications
    file: assets/svm-implications.svg
    type: diagram
    title: 'Four consequences of support vector machines'
    alt: 'Diagram: the accuracy, scaling, interpretability and calibration implications of support vector machines'
    description: 'A four-stage description of implications covering small-data strength, training cost, interpretability and probability calibration.'
  - id: svm-when
    file: assets/svm-when.svg
    type: diagram
    title: 'When to use a support vector machine'
    alt: 'Diagram: when support vector machines are appropriate'
    description: 'A two-column comparison of situations favouring support vector machines against alternatives.'
  - id: hard-margin
    file: assets/hard-margin.svg
    type: diagram
    title: 'The hard margin'
    alt: 'Diagram: how the hard-margin problem is stated as an optimisation'
    description: 'A four-stage description of the hard-margin formulation covering the constraint, the margin width, the objective and the limitation.'
  - id: pegasos
    file: assets/pegasos.svg
    type: diagram
    title: 'Solving it by gradient descent'
    alt: 'Diagram: how the margin problem is solved by stochastic subgradient descent'
    description: 'A four-stage description of subgradient optimisation covering the hinge loss, non-differentiability, the subgradient and the update.'
  - id: svm-why
    file: assets/svm-why.svg
    type: diagram
    title: 'What support vector machines solved'
    alt: 'Diagram: the four problems support vector machines were created to address'
    description: 'A four-stage description of the problems addressed covering boundary selection, generalisation theory, non-linearity and high dimensions.'
