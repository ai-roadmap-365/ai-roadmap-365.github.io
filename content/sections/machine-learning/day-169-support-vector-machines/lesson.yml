slug: support-vector-machines
title: Support Vector Machines
section: machine-learning
subsection: supervised-learning
week: 25
learning_promise: >-
  Master the theory and practical mathematics of Support Vector Machines (SVMs): understand geometric margin maximization,
  primal and dual Quadratic Programming formulations (Cortes & Vapnik, 1995), slack variables and Hinge Loss regularization (C),
  the revolutionary Kernel Trick (Mercer's Theorem) mapping non-linear data into infinite-dimensional Hilbert spaces with RBF kernels,
  why feature scaling is strictly mandatory, and when to use LinearSVC vs Kernel SVMs vs Tree Ensembles.
objectives:
  - 'Derive the geometric margin gamma = y(w^T x + b) / ||w|| and the primal quadratic optimization problem'
  - 'Explain soft-margin SVMs with slack variables xi and regularization parameter C'
  - 'Formulate the dual Lagrangian problem and characterize Support Vectors via KKT conditions'
  - 'Derive the Kernel Trick and Mercer Theorem conditions for non-linear mappings'
  - 'Implement vectorized RBF (Gaussian) kernel Gram matrix computation from scratch'
  - 'Implement Linear SVM training via Pegasos subgradient descent on Hinge Loss'
  - 'Analyze why feature scaling (StandardScaler) is strictly mandatory for distance-based kernel methods'
  - 'Contrast SVM O(N^2) computational bottlenecks with modern Tree Ensembles and Linear SGD'
prerequisites:
  - 'Day 156 -- Decision Boundaries'
  - 'Day 151 -- Regularization (Ridge and Lasso)'
reading_time_minutes: 50
practical_time_minutes: 60
