sources:
  - title: 'Support-Vector Networks'
    url: 'https://link.springer.com/article/10.1007/BF00994018'
    publisher: 'Machine Learning (Corinna Cortes and Vladimir Vapnik)'
    accessed: '2026-08-29'
    year: 1995
    description: 'The foundational paper introducing soft-margin Support Vector Machines with slack variables and non-linear kernel transformations.'
  - title: 'Pegasos: Primal Estimated sub-GrAdient SOlver for SVM'
    url: 'https://link.springer.com/article/10.1007/s10107-010-0420-4'
    publisher: 'Mathematical Programming (Shai Shalev-Shwartz, Yoram Singer, Nathan Srebro, Andrew Cotter)'
    accessed: '2026-08-29'
    year: 2011
    description: 'Introduced the Pegasos stochastic subgradient descent algorithm, proving fast O(1/epsilon) convergence in the primal formulation.'
  - title: 'LIBLINEAR: A Library for Large Linear Classification'
    url: 'https://www.jmlr.org/papers/v9/fan08a.html'
    publisher: 'Journal of Machine Learning Research (Rong-En Fan, Kai-Wei Chang, Cho-Jui Hsieh, et al.)'
    accessed: '2026-08-29'
    year: 2008
    description: 'Seminal paper detailing the architecture and coordinate descent solvers for large-scale linear SVMs.'
