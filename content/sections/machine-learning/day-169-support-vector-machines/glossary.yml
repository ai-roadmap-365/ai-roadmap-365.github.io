terms:
  - term: 'Support Vector Machine (SVM)'
    definition: 'A supervised learning model that finds the optimal maximum-margin hyperplane separating classes in feature space.'
  - term: 'Geometric Margin'
    definition: 'The shortest Euclidean distance from the decision boundary hyperplane to the closest data points in the training set.'
  - term: 'Support Vectors'
    definition: 'The critical training instances that lie on the margin boundary or violate the margin, possessing non-zero Lagrange multipliers (alpha_i > 0).'
  - term: 'Hinge Loss'
    definition: 'A convex loss function L(y, f(x)) = max(0, 1 - y * f(x)) used in maximum-margin classification that penalizes margin violations linearly.'
  - term: 'Slack Variable (xi)'
    definition: 'A non-negative penalty variable introduced in soft-margin SVMs to quantify the degree to which a sample violates the margin boundary.'
  - term: 'Kernel Trick'
    definition: 'A mathematical technique enabling linear algorithms to operate in high-dimensional implicit feature spaces by replacing inner products with kernel functions.'
  - term: 'RBF Kernel (Radial Basis Function)'
    definition: 'A stationary kernel function K(x, z) = exp(-gamma * ||x - z||^2) corresponding to an infinite-dimensional feature mapping.'
  - term: 'Mercer Theorem'
    definition: 'A mathematical theorem stating that any continuous, symmetric, positive semi-definite kernel function corresponds to an inner product in some Hilbert space.'
  - term: 'Pegasos Algorithm'
    definition: 'Primal Estimated sub-GrAdient Solver for SVM, an efficient stochastic subgradient descent algorithm for linear SVM optimization.'
  - term: 'LibLinear'
    definition: 'An open-source C++ library for large-scale linear classification and regression, serving as the backend for scikit-learn LinearSVC.'
