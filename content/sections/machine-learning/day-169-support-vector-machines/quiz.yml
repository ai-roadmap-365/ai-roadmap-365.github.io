questions:
  - question: 'What is the primary geometric objective of a Hard-Margin Support Vector Machine?'
    options:
      - 'To find the unique hyperplane w^T x + b = 0 that separates two classes while maximizing the geometric margin 2 / ||w||_2 to the closest data points (the support vectors)'
      - 'To minimize the sum of squared residuals'
      - 'To build an orthogonal decision tree'
      - 'To compute the posterior class probability using Bayes theorem'
    answer_index: 0
    explanation: 'SVMs find the maximum-margin hyperplane, maximizing the buffer zone between the decision boundary and the nearest training points to minimize generalization error.'

  - question: 'In a Soft-Margin SVM (Cortes & Vapnik, 1995), what does the regularization hyperparameter C control?'
    options:
      - 'The trade-off between maximizing the margin (small C, wider margin, more tolerance for misclassifications) and minimizing training errors / slack variables (large C, narrow margin, strict penalty for misclassifications)'
      - 'The learning rate of gradient descent'
      - 'The number of trees in the forest'
      - 'The polynomial degree'
    answer_index: 0
    explanation: 'Large C penalizes slack violations heavily, forcing a hard margin that may overfit. Small C permits points inside the margin, creating a softer boundary that generalizes better on noisy data.'

  - question: 'What is the "Kernel Trick" in Support Vector Machines (Mercer Theorem)?'
    options:
      - 'Computing the inner product of two vectors in a high-dimensional (or infinite-dimensional) feature space phi(x)^T phi(z) implicitly using a kernel function K(x, z) in the original low-dimensional space, without ever calculating the explicit transformation phi(x)'
      - 'A method for speeding up CPU caches'
      - 'A trick to convert classification into regression'
      - 'A technique for handling missing values'
    answer_index: 0
    explanation: 'The kernel trick allows linear algorithms to learn complex non-linear decision boundaries by computing cheap pairwise similarities K(x, z) equivalent to dot products in higher dimensions.'

  - question: 'What are "Support Vectors" in a trained SVM model?'
    options:
      - 'The subset of training data points that lie directly on the margin hyperplanes or violate the margin (Lagrange multipliers alpha_i > 0); only these points determine the final decision boundary w = sum alpha_i y_i x_i'
      - 'All data points in the training set'
      - 'The eigenvectors of the covariance matrix'
      - 'The gradient vectors during optimization'
    answer_index: 0
    explanation: 'Points located comfortably outside the margin have alpha_i = 0 and exert zero influence on the decision boundary. Removing all non-support vectors leaves the fitted SVM model completely unchanged.'

  - question: 'Why is Feature Standardization (e.g. StandardScaler) strictly MANDATORY before training an SVM?'
    options:
      - 'Because SVM optimization relies on Euclidean distances and dot products; unscaled features with large numerical magnitudes (e.g. income in $100,000s) will dominate distance calculations and render small features (e.g. age in years) completely invisible'
      - 'Because SVMs only accept floating-point numbers between -1 and 1'
      - 'Because unscaled data causes division by zero in the kernel'
      - 'Standardization is optional and only affects training speed'
    answer_index: 0
    explanation: 'Both the linear margin calculation ||w|| and non-linear kernels like RBF exp(-gamma ||x - z||^2) depend directly on Euclidean geometry. Unscaled features distort distance metrics catastrophically.'

  - question: 'In the Radial Basis Function (RBF / Gaussian) kernel K(x, z) = exp(-gamma ||x - z||^2), what is the effect of setting gamma to an excessively large value?'
    options:
      - 'Severe Overfitting: each individual training sample creates a tiny, isolated bell-shaped decision island around itself, achieving 100% training accuracy but failing to generalize to unseen test samples'
      - 'Severe Underfitting: the decision boundary becomes a flat plane'
      - 'The kernel matrix becomes singular'
      - 'Inference speed increases by 10x'
    answer_index: 0
    explanation: 'Large gamma concentrates RBF influence to immediate neighborhoods, creating overfitted isolated islands around individual training points. Small gamma produces smooth, generalized boundaries.'

  - question: 'What is the primary computational limitation of Kernel SVMs (such as SVC with RBF kernel) on large-scale enterprise datasets?'
    options:
      - 'Training time scales quadratically to cubically with sample size O(N^2 to N^3) and requires storing an N x N Gram matrix, making standard kernel SVMs intractable on datasets with N > 50,000 samples'
      - 'SVMs cannot run on multiple CPU cores'
      - 'SVMs can only perform binary classification'
      - 'SVMs do not support categorical variables'
    answer_index: 0
    explanation: 'Solving the dual Quadratic Programming problem requires computing and factoring the N x N kernel matrix. For N = 1,000,000, storing the matrix requires 8,000 GB of RAM.'

  - question: 'What is the difference between scikit-learn LinearSVC and SVC(kernel="linear")?'
    options:
      - 'LinearSVC is built on LibLinear and optimizes the primal objective in linear time O(N), scaling to millions of samples; SVC(kernel="linear") is built on LibSVM and solves the dual problem in O(N^2) time'
      - 'LinearSVC only works for regression'
      - 'SVC(kernel="linear") uses GPU acceleration'
      - 'There is no difference'
    answer_index: 0
    explanation: 'For linear decision boundaries, LinearSVC (LibLinear) is vastly faster and more memory-efficient than standard SVC (LibSVM).'
