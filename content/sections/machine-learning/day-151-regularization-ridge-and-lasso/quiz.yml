questions:
  - question: >-
      At every alpha from 0.001 to 1.0 on the diabetes dataset, ridge zeros 0 of 10 coefficients while
      lasso's zero count climbs to 8 of 10. Why does the ridge column matter to the argument, rather than
      being a footnote?
    options:
      - 'It shows ridge is a worse model, since it never simplifies'
      - 'It is the control — only the penalty shape changed'
      - 'It shows ridge needs a larger alpha to start zeroing coefficients too'
      - 'It is not important; only the lasso column is measured in this lesson'
    answer_index: 1
    explanation: >-
      Without the ridge column, lasso's climbing zero count could be explained by almost anything about
      this particular dataset or fitting procedure. With it, exactly one thing differs between the two
      columns -- the penalty shape -- and the ridge column staying at zero for every alpha isolates that
      as the cause. Ridge never zeros a coefficient at any alpha in this lesson's sweeps, including much
      larger ones than 1.0, so the first option is wrong on the evidence, and the third option invents an
      alpha where ridge starts zeroing that was never measured.
  - question: >-
      Explain why an L1 penalty can produce an exact zero coefficient while an L2 penalty essentially
      never does, in terms of the constraint region each one defines.
    options:
      - 'L2''s constraint region is unbounded, so it can never reach zero, while L1''s is bounded'
      - 'L1 is a stronger penalty than L2 at the same alpha, so it pushes coefficients further toward zero'
      - 'L1''s region has corners on the axes; L2''s circle has none'
      - 'The difference is a numerical artifact of how scikit-learn''s solvers are implemented, not a property of the penalties themselves'
    answer_index: 2
    explanation: >-
      The geometric explanation is the one that generalises: a diamond (the L1 feasible region,
      sum of absolute values <= t) has corners exactly on the axes, and those corners are where one or
      more coordinates are exactly zero. A circle or sphere (the L2 region) has no such corners, so the
      point where a loss ellipse first touches it generically has every coordinate nonzero. Neither
      penalty is simply "stronger" at a given alpha in a way that explains this -- the effect is about
      shape, not magnitude -- and this lesson measured the geometry directly with real coefficient
      values, not as a solver artifact.
  - question: >-
      The same alpha, on the same diabetes data, selects 10 features in raw units, 7 after standardizing
      to unit variance, and 3 under scikit-learn's own unit-L2-norm "scaled" convention. What is the one
      practical rule this measurement establishes?
    options:
      - 'Always use scikit-learn''s bundled scaled=True version of any dataset, since it gives the sparsest result'
      - 'Lasso should never be used on datasets with more than 3 informative features'
      - 'The three results are all equally valid, since they come from the same underlying data'
      - 'A penalty applies in whatever units the coefficients are in'
    answer_index: 3
    explanation: >-
      The penalty term sums functions of the raw coefficient values, and a coefficient's raw size depends
      entirely on the units its feature happens to be measured in -- nothing in the fitting procedure
      corrects for that automatically. The fix is scaling, applied consistently, before fitting. The
      measurement also shows that "scaled" is not one convention: unit-variance and unit-L2-norm scaling
      disagree with each other (7 vs 3 features) at the identical nominal alpha, so the first option is
      wrong to treat one particular scaling as the universally correct choice, and the third option's
      apparent equivalence is exactly what the measurement rules out.
  - question: >-
      Comparing Ridge(alpha=0.1) to ElasticNet(alpha=0.1, l1_ratio=0.0) directly gives R2 0.3690 for
      ridge and 0.0555 for the "equivalent" ElasticNet call, on identical data. What causes the gap, and
      what resolves it?
    options:
      - 'Ridge sums residuals while ElasticNet averages them'
      - 'ElasticNet''s coordinate-descent solver has not converged; raising max_iter fixes the gap'
      - 'l1_ratio=0.0 is not a valid setting for ElasticNet and silently falls back to a different penalty'
      - 'The gap is measurement noise from the random_state used in the train/test split'
    answer_index: 0
    explanation: >-
      This is an alpha-scale mismatch, not a convergence or randomness issue: correcting for the n_train
      factor (fitting Ridge at alpha * 331 on this split) brought the two models' coefficients to within
      0.0001 of each other, confirming the mechanism. l1_ratio=0.0 is a fully valid, well-defined
      ElasticNet setting -- it just is not automatically the same alpha scale as Ridge's own.
  - question: >-
      On two predictors correlated at 0.999918, with a true combined coefficient of 6.0, ridge lands on
      roughly [3.05, 2.97] at alpha=1.0. What does lasso do to the same two predictors at the same alpha,
      and why?
    options:
      - 'Lasso also splits the weight evenly, since both penalties respond the same way to correlated predictors'
      - 'Lasso puts 5.0848 on one and exactly 0.0 on the other'
      - 'Lasso raises an error, since scikit-learn does not permit fitting on collinear features'
      - 'Lasso averages the two predictors into a single new feature before fitting'
    answer_index: 1
    explanation: >-
      This is the same shrink-versus-select distinction playing out on correlated predictors specifically:
      ridge's marginal cost falls as a coefficient shrinks, so splitting the weight is cheap and there is
      no pressure to consolidate; lasso's marginal cost per nonzero coefficient does not fall the same
      way, so once a feature's individual contribution is small enough relative to the flat cost of
      keeping it nonzero, dropping it entirely is the cheaper move. Ridge measurably keeps the split even
      at ten times the alpha; lasso measurably zeros the second coefficient outright.
  - question: >-
      Lasso recovers a known sparse ground truth with precision 1.0 and recall 1.0 at alpha=1.0 and low
      noise, but recall falls to 0.0 at alpha=80 and high noise -- every informative feature is zeroed.
      What general claim about regularization does this pair of results rule out?
    options:
      - 'That lasso can ever be used for feature selection at all'
      - 'That precision and recall are meaningful metrics for a regression problem'
      - 'That more penalty is always at least as safe as less'
      - 'That noise in the data has any effect on which features lasso selects'
    answer_index: 2
    explanation: >-
      The low-noise result already rules out the first option -- lasso recovered the exact truth there.
      The point of pairing both results is specifically to rule out treating "more regularization" as a
      strictly safe or monotonically improving choice: at alpha=80 with noise=10, every one of the five
      truly informative features was zeroed, which is a genuine failure mode, not a smaller version of
      success. Noise clearly does affect the outcome, which rules out the fourth option directly.
  - question: >-
      A fitted Ridge model has no n_iter_ attribute; a fitted Lasso model always does, and its value
      varies with alpha (368 iterations at alpha=0.001, 6 at alpha=1.0 in this lesson's measurement).
      What property of the L1 penalty causes this difference?
    options:
      - 'Lasso is a more complex model with more parameters to fit than ridge'
      - 'n_iter_ is simply not implemented for Ridge in this version of scikit-learn, though it could be added'
      - 'Ridge is only ever fit on small datasets, where an iterative solver would be unnecessary overhead'
      - 'The L1 term is not differentiable at zero, so no closed form'
    answer_index: 3
    explanation: >-
      Ridge and lasso fit the same number of coefficients on the same data -- model complexity is not the
      difference. The absolute-value function in the L1 penalty has a sharp corner at zero where its
      derivative is undefined, which is exactly what makes the exact-zero solutions possible but also
      what rules out the same direct linear-algebra solve ridge's smooth, everywhere-differentiable
      penalty permits. This is a structural fact about the two penalties' shapes, not a version-specific
      omission or a matter of dataset size.
  - question: >-
      Weight decay in a neural-network optimizer is described as ridge regression's direct descendant.
      Based on what this lesson measured about the L2 penalty, what does weight decay alone NOT do to a
      network's weights?
    options:
      - 'It does not produce exact zeros — L2 only shrinks'
      - 'It does not stabilize an otherwise poorly conditioned optimization problem'
      - 'It does not shrink the weights toward zero at all'
      - 'It does not apply to the bias terms, only to the weights, which makes it identical to lasso in effect'
    answer_index: 0
    explanation: >-
      This follows directly from the geometry measured earlier in the lesson: an L2 penalty's smooth,
      cornerless constraint region means the marginal cost of the last bit of a small coefficient
      approaches zero, so there is no pressure to reach exactly zero -- confirmed directly by ridge's zero
      count staying at 0 of 10 across every alpha tested. Weight decay does shrink weights and does help
      stabilize training, so the first two options are wrong; getting an actually sparse network needs an
      L1-style term or a dedicated pruning method layered on top, which is the opposite of the fourth
      option's claim that weight decay alone behaves like lasso.
