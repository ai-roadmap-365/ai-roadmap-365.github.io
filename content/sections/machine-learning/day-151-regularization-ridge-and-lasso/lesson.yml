slug: regularization-ridge-and-lasso
title: 'Regularization: Ridge and Lasso'
section: machine-learning
subsection: core-concepts
week: 22
learning_promise: >-
  After this lesson you will know why an L2 penalty and an L1 penalty are not two flavors of the same
  idea but two different shapes, because you will have measured the consequence directly: ridge zeros
  zero of ten coefficients at every alpha from 0.001 to 1.0 on real data, while lasso's zero count
  climbs from 0 to 8 of 10 over the same sweep, and neither ridge coefficient in a 60-point sweep up to
  alpha=100 ever reaches exactly zero while every one of lasso's ten does. You will trace the exact alpha
  at which each coefficient crosses zero and see that the order is not arbitrary -- the weakest predictor
  drops first and the strongest survives longest. You will measure that lasso recovers a KNOWN sparse
  ground truth with perfect precision and recall at a sensible alpha, and that it can also fail
  completely, zeroing every informative feature when the penalty is too strong on noisy data. You will
  measure the single most practically important result in the lesson: the identical alpha, on the
  identical data, selects 10, 7, or 3 features depending only on whether the data is raw, standardized to
  unit variance, or scaled to unit L2 norm. You will measure that Ridge and ElasticNet do not share an
  alpha scale, and see the uncorrected comparison actually fail (R2 0.0555 against 0.3690) before you
  correct it. You will measure what ridge and lasso each do to two near-duplicate predictors -- ridge
  splits the combined weight evenly, lasso picks one and drops the other -- connecting directly back to
  Day 150's multicollinearity. And you will measure the constraint-region geometry itself, on the
  smallest case that shows it: two correlated features, where lasso's coefficient lands exactly on an
  axis at a specific alpha and ridge's never does, at any alpha tried.
objectives:
  - 'State, from a measurement rather than a rule of thumb, that ridge never zeros a coefficient while lasso zeros progressively more as alpha grows'
  - 'Explain the L1-versus-L2 difference in terms of constraint-region geometry -- a diamond has corners on the axes, a circle does not -- and point to the exact alpha where a lasso coefficient reaches zero'
  - 'Distinguish lasso as simultaneous shrinkage and feature selection from ridge as shrinkage alone'
  - 'Measure whether lasso recovers a KNOWN set of informative features against a synthetic ground truth, and report honestly when it does not'
  - 'Demonstrate that regularization requires scaled features, with three different feature-selection outcomes from the same alpha in three different units'
  - 'Use ElasticNet as the combination of both penalties and know when it outperforms either alone'
  - 'State that Ridge and ElasticNet do NOT share an alpha scale, and apply the n_train correction that resolves the mismatch'
  - 'Predict what ridge and lasso each do to a pair of near-duplicate (highly correlated) predictors, connecting back to Day 150'
  - 'State that ridge has a closed-form solution while lasso requires an iterative solve, and explain why the L1 penalty forces that'
  - 'Choose between ridge, lasso, and ElasticNet for a given regression project, and defend the choice with a measured number rather than a general statement'
  - 'Select alpha by cross-validation (LassoCV, RidgeCV) rather than by eye, and interpret the alpha a cross-validated search returns'
  - 'Recognise weight decay in a neural-network optimizer as ridge regression''s direct descendant, and explain why it alone does not produce a sparse network'
prerequisites:
  - 'Day 145 -- the measured trade-off between variance and bias from a regularization penalty in general; this lesson does not re-measure that trade, it measures the shape of the penalty itself'
  - 'Day 148 -- the one-predictor linear model'
  - 'Day 149 -- loss functions, the normal equations, and Gauss-Markov'
  - 'Day 150 -- many predictors, the design matrix, and multicollinearity; today''s correlated-predictors exercise builds directly on this'
  - 'Comfort with NumPy arrays and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment and needs no GPU'
reading_time_minutes: 50
practical_time_minutes: 60
