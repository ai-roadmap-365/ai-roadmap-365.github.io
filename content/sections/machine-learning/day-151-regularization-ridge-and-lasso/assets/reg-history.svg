<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From numerical fix to standard.">
  <title>Four steps in regularisation</title>
  <style>
    .reg-history-bg   { fill: #f8fafc; }
    .reg-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reg-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reg-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reg-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reg-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reg-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .reg-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .reg-history-stage { opacity: 1; }

    .reg-history-s0 { animation-delay: 0.00s; }
    .reg-history-e0 { animation-delay: 0.00s; }
    .reg-history-s1 { animation-delay: 1.28s; }
    .reg-history-e1 { animation-delay: 1.28s; }
    .reg-history-s2 { animation-delay: 2.56s; }
    .reg-history-e2 { animation-delay: 2.56s; }
    .reg-history-s3 { animation-delay: 3.84s; }
    .reg-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .reg-history-conn  { animation: reg-history-trace 6.4s ease-in-out infinite; }
      .reg-history-stage { animation: reg-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes reg-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes reg-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .reg-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .reg-history-stage { animation: reg-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes reg-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="reg-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="reg-history-bg" width="980" height="322"/>
  <text class="reg-history-h1"  x="30" y="40">Four steps in regularisation</text>
  <text class="reg-history-sub" x="30" y="64">From numerical fix to standard.</text>
  <g class="reg-history-stage reg-history-s0">
    <rect class="reg-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="reg-history-step" x="44" y="142">01</text>
    <text class="reg-history-name" x="70" y="142">Introduced to stabilise ill-conditioned systems</text>
    <text class="reg-history-desc" x="44" y="166">A numerical fix, not a</text>
    <text class="reg-history-desc" x="44" y="182">statistical one.</text>
  </g>
  <line class="reg-history-line reg-history-conn reg-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#reg-history-tip)"/>
  <g class="reg-history-stage reg-history-s1">
    <rect class="reg-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="reg-history-step" x="280" y="142">02</text>
    <text class="reg-history-name" x="306" y="142">Then understood as a bias-variance trade</text>
    <text class="reg-history-desc" x="280" y="166">Accepting bias to reduce</text>
    <text class="reg-history-desc" x="280" y="182">variance.</text>
  </g>
  <line class="reg-history-line reg-history-conn reg-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#reg-history-tip)"/>
  <g class="reg-history-stage reg-history-s2">
    <rect class="reg-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="reg-history-step" x="516" y="142">03</text>
    <text class="reg-history-name" x="542" y="142">The absolute penalty added feature selection</text>
    <text class="reg-history-desc" x="516" y="166">Which made it an interpretation</text>
    <text class="reg-history-desc" x="516" y="182">tool too.</text>
  </g>
  <line class="reg-history-line reg-history-conn reg-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#reg-history-tip)"/>
  <g class="reg-history-stage reg-history-s3">
    <rect class="reg-history-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="reg-history-step" x="752" y="142">04</text>
    <text class="reg-history-name" x="778" y="142">And it is now in every model, under many names</text>
    <text class="reg-history-desc" x="752" y="166">Weight decay, dropout, early</text>
    <text class="reg-history-desc" x="752" y="182">stopping.</text>
  </g>
  <text class="reg-history-sub" x="30" y="304">Weight decay in neural network training is this same squared penalty, which is why the intuition built here transfers directly to the deep learning course.</text>
</svg>
