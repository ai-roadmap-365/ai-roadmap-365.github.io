<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Different behaviour.">
  <title>Two penalties</title>
  <style>
    .three-objectives-bg   { fill: #f8fafc; }
    .three-objectives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-objectives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-objectives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-objectives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-objectives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-objectives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-objectives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-objectives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-objectives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-objectives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-objectives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-objectives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-objectives-row { opacity: 1; }
    .three-objectives-r0 { animation-delay: 0.00s; }
    .three-objectives-r1 { animation-delay: 0.45s; }
    .three-objectives-r2 { animation-delay: 0.90s; }
    .three-objectives-r3 { animation-delay: 1.35s; }
    .three-objectives-r4 { animation-delay: 1.80s; }
    .three-objectives-row { animation: three-objectives-reveal 7.3s ease-in-out infinite; }
    @keyframes three-objectives-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="three-objectives-bg" width="980" height="390"/>
  <text class="three-objectives-h1"  x="30" y="40">Two penalties</text>
  <text class="three-objectives-sub" x="30" y="64">Different behaviour.</text>
  <rect class="three-objectives-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="three-objectives-name" x="46" y="122">Squared magnitude</text>
  <text class="three-objectives-desc" x="46" y="142">Shrinks everything.</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r0" x="46" y="182">Penalises the sum of squared coefficients</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r1" x="46" y="216">Shrinks all of them smoothly</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r2" x="46" y="250">Never sets any to exactly zero</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r3" x="46" y="284">Handles correlated predictors gracefully</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r4" x="46" y="318">The safer default</text>
  <rect class="three-objectives-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="three-objectives-name" x="526" y="122">Absolute magnitude</text>
  <text class="three-objectives-desc" x="526" y="142">Zeroes some.</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r0" x="526" y="182">Penalises the sum of absolute coefficients</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r1" x="526" y="216">Shrinks, and sets some to exactly zero</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r2" x="526" y="250">Performs feature selection while fitting</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r3" x="526" y="284">Picks arbitrarily among correlated predictors</text>
  <text class="three-objectives-desc three-objectives-row three-objectives-r4" x="526" y="318">Right when sparsity is wanted</text>
  <text class="three-objectives-sub" x="30" y="372">Never setting a coefficient to exactly zero is a measured property of the squared penalty rather than a tendency, which is what makes the distinction sharp.</text>
</svg>
