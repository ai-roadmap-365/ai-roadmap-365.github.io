<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why one produces zeros</title>
  <style>
    .corners-bg   { fill: #f8fafc; }
    .corners-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corners-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corners-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corners-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corners-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .corners-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .corners-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .corners-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .corners-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .corners-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .corners-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .corners-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .corners-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .corners-stage { opacity: 1; }

    .corners-s0 { animation-delay: 0.00s; }
    .corners-e0 { animation-delay: 0.00s; }
    .corners-s1 { animation-delay: 1.28s; }
    .corners-e1 { animation-delay: 1.28s; }
    .corners-s2 { animation-delay: 2.56s; }
    .corners-e2 { animation-delay: 2.56s; }
    .corners-s3 { animation-delay: 3.84s; }
    .corners-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .corners-conn  { animation: corners-trace 6.4s ease-in-out infinite; }
      .corners-stage { animation: corners-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes corners-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes corners-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .corners-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .corners-stage { animation: corners-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes corners-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="corners-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="corners-bg" width="980" height="322"/>
  <text class="corners-h1"  x="30" y="40">Why one produces zeros</text>
  <text class="corners-sub" x="30" y="64">Four steps.</text>
  <g class="corners-stage corners-s0">
    <rect class="corners-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="corners-step" x="44" y="142">01</text>
    <text class="corners-name" x="70" y="142">The penalty defines a region the coefficients must stay within</text>
    <text class="corners-desc" x="44" y="166">Whose shape depends on the</text>
    <text class="corners-desc" x="44" y="182">penalty.</text>
  </g>
  <line class="corners-line corners-conn corners-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#corners-tip)"/>
  <g class="corners-stage corners-s1">
    <rect class="corners-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="corners-step" x="280" y="142">02</text>
    <text class="corners-name" x="306" y="142">Squared magnitude gives a smooth round region</text>
    <text class="corners-desc" x="280" y="166">With no corners anywhere.</text>
  </g>
  <line class="corners-line corners-conn corners-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#corners-tip)"/>
  <g class="corners-stage corners-s2">
    <rect class="corners-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="corners-step" x="516" y="142">03</text>
    <text class="corners-name" x="542" y="142">Absolute magnitude gives a diamond, with corners on the axes</text>
    <text class="corners-desc" x="516" y="166">Where one coefficient is exactly</text>
    <text class="corners-desc" x="516" y="182">zero.</text>
  </g>
  <line class="corners-line corners-conn corners-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#corners-tip)"/>
  <g class="corners-stage corners-s3">
    <rect class="corners-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="corners-step" x="752" y="142">04</text>
    <text class="corners-name" x="778" y="142">And the solution touches the region at a corner</text>
    <text class="corners-desc" x="752" y="166">Which is why zeros appear.</text>
  </g>
  <text class="corners-sub" x="30" y="304">The zeros are a consequence of geometry rather than of the optimiser, which is why they are exact rather than merely small.</text>
</svg>
