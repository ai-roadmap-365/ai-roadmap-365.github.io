<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each claim must be paid for.">
  <title>A budget for evidence</title>
  <style>
    .budget-bg   { fill: #f8fafc; }
    .budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .budget-row { opacity: 1; }
    .budget-r0 { animation-delay: 0.00s; }
    .budget-r1 { animation-delay: 0.45s; }
    .budget-r2 { animation-delay: 0.90s; }
    .budget-r3 { animation-delay: 1.35s; }
    .budget-r4 { animation-delay: 1.80s; }
    .budget-row { animation: budget-reveal 7.3s ease-in-out infinite; }
    @keyframes budget-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="budget-bg" width="980" height="390"/>
  <text class="budget-h1"  x="30" y="40">A budget for evidence</text>
  <text class="budget-sub" x="30" y="64">Each claim must be paid for.</text>
  <rect class="budget-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="budget-name" x="46" y="122">No budget</text>
  <text class="budget-desc" x="46" y="142">Every claim free.</text>
  <text class="budget-desc budget-row budget-r0" x="46" y="182">Any coefficient may be any size</text>
  <text class="budget-desc budget-row budget-r1" x="46" y="216">Weak evidence gets a strong claim</text>
  <text class="budget-desc budget-row budget-r2" x="46" y="250">Fits the sample perfectly</text>
  <text class="budget-desc budget-row budget-r3" x="46" y="284">Does not survive new data</text>
  <text class="budget-desc budget-row budget-r4" x="46" y="318">This is unpenalised fitting</text>
  <rect class="budget-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="budget-name" x="526" y="122">A fixed budget</text>
  <text class="budget-desc" x="526" y="142">Claims must be earned.</text>
  <text class="budget-desc budget-row budget-r0" x="526" y="182">Total coefficient size is capped</text>
  <text class="budget-desc budget-row budget-r1" x="526" y="216">Weak evidence cannot afford a strong claim</text>
  <text class="budget-desc budget-row budget-r2" x="526" y="250">Fits the sample slightly worse</text>
  <text class="budget-desc budget-row budget-r3" x="526" y="284">Survives new data better</text>
  <text class="budget-desc budget-row budget-r4" x="526" y="318">This is regularisation</text>
  <text class="budget-sub" x="30" y="372">The budget forces the fit to allocate its claims where the evidence is strongest, which is exactly what makes it generalise better.</text>
</svg>
