<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="By what you need.">
  <title>Which penalty when</title>
  <style>
    .reg-when-bg   { fill: #f8fafc; }
    .reg-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reg-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .reg-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .reg-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .reg-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .reg-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .reg-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .reg-when-row { opacity: 1; }
    .reg-when-r0 { animation-delay: 0.00s; }
    .reg-when-r1 { animation-delay: 0.45s; }
    .reg-when-r2 { animation-delay: 0.90s; }
    .reg-when-r3 { animation-delay: 1.35s; }
    .reg-when-r4 { animation-delay: 1.80s; }
    .reg-when-row { animation: reg-when-reveal 7.3s ease-in-out infinite; }
    @keyframes reg-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="reg-when-bg" width="980" height="390"/>
  <text class="reg-when-h1"  x="30" y="40">Which penalty when</text>
  <text class="reg-when-sub" x="30" y="64">By what you need.</text>
  <rect class="reg-when-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="reg-when-name" x="46" y="122">The requirement</text>
  <text class="reg-when-desc" x="46" y="142">What you need.</text>
  <text class="reg-when-desc reg-when-row reg-when-r0" x="46" y="182">Many correlated predictors</text>
  <text class="reg-when-desc reg-when-row reg-when-r1" x="46" y="216">A sparse, small feature set</text>
  <text class="reg-when-desc reg-when-row reg-when-r2" x="46" y="250">Both: correlated, and want sparsity</text>
  <text class="reg-when-desc reg-when-row reg-when-r3" x="46" y="284">Interpretable, unbiased coefficients</text>
  <text class="reg-when-desc reg-when-row reg-when-r4" x="46" y="318">Prediction only, no interpretation</text>
  <rect class="reg-when-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="reg-when-name" x="526" y="122">The penalty</text>
  <text class="reg-when-desc" x="526" y="142">What to use.</text>
  <text class="reg-when-desc reg-when-row reg-when-r0" x="526" y="182">Squared magnitude, which handles them gracefully</text>
  <text class="reg-when-desc reg-when-row reg-when-r1" x="526" y="216">Absolute magnitude, which zeroes the rest</text>
  <text class="reg-when-desc reg-when-row reg-when-r2" x="526" y="250">A blend of the two</text>
  <text class="reg-when-desc reg-when-row reg-when-r3" x="526" y="284">No penalty, and accept the variance</text>
  <text class="reg-when-desc reg-when-row reg-when-r4" x="526" y="318">Either; tune the strength and stop worrying</text>
  <text class="reg-when-sub" x="30" y="372">The last row is the common case: when nothing is being interpreted, the choice between the two penalties matters far less than tuning the strength.</text>
</svg>
