terms:
  - term: Regularization
    definition: >-
      A term added to a model's training objective that penalizes some measure of complexity -- here, the
      size of the coefficients -- pushing the fit toward simpler solutions even when a more complex one
      fits the training data slightly better.
  - term: Ridge regression
    definition: >-
      Linear regression with an L2 penalty: the sum of squared residuals plus alpha times the sum of the
      SQUARED coefficients. Measured here to zero zero of ten coefficients at every alpha tried, from
      0.001 to 100.
  - term: Lasso
    definition: >-
      Linear regression with an L1 penalty: the sum of squared residuals plus alpha times the sum of the
      ABSOLUTE VALUES of the coefficients. Measured to zero progressively more coefficients as alpha
      grows -- 0, then 1, then 3, then 8 of 10 over the same sweep ridge never moved on.
  - term: ElasticNet
    definition: >-
      Both penalties combined, with l1_ratio controlling the mix -- l1_ratio=1.0 recovers plain lasso
      exactly (confirmed here down to the same zero count and R2), l1_ratio=0.0 recovers ridge's penalty
      shape but NOT its alpha scale.
  - term: Alpha (regularization strength)
    definition: >-
      The hyperparameter that scales how much the penalty term matters relative to the residual sum of
      squares. alpha=0 recovers plain least squares in every model here. Not portable between model
      classes without correction -- see the Ridge/ElasticNet alpha-scale mismatch.
  - term: Constraint region
    definition: >-
      The equivalent way to view a penalty: minimizing the plain loss subject to a hard budget on the
      coefficients. Ridge's region is a circle (or sphere); lasso's is a diamond (or octahedron), and the
      diamond's corners, sitting on the coordinate axes, are what makes exact zeros possible.
  - term: Corner solution
    definition: >-
      A solution that lands exactly on a corner of the L1 constraint region, meaning one or more
      coefficients are exactly zero. Measured directly on a two-feature demonstration: lasso's second
      coefficient equals exactly 0.0 at alpha=3.0, while ridge's is 1.9141 at the same alpha.
  - term: Coefficient path
    definition: >-
      Every coefficient's value as alpha is swept from small to large. Lasso's path hits exactly zero for
      every one of ten features somewhere in a 60-point sweep; ridge's never hits zero at any point in
      the same sweep. The order lasso's coefficients zero in tracks how much each feature contributes --
      the weakest first, the strongest last.
  - term: Sparse ground truth
    definition: >-
      A synthetic dataset (built with make_regression) where the exact set of informative features is
      known in advance, used to measure whether lasso's selection is actually CORRECT rather than merely
      sparse. Measured precision 1.0 and recall 1.0 at a sensible alpha and low noise; recall 0.0 at a
      heavy penalty and high noise.
  - term: Scale-dependence
    definition: >-
      The fact that a penalty is applied in whatever units the coefficients happen to be in. The single
      most practically important measurement in this lesson: the identical alpha, on identical data,
      selected 10, 7 and 3 features under raw, standardized, and scikit-learn's own unit-norm scaling
      respectively.
  - term: Standardization
    definition: >-
      Rescaling each feature to zero mean and unit variance (StandardScaler), the ordinary fix for
      scale-dependence. Not the same convention scikit-learn's own load_diabetes(scaled=True) uses --
      that dataset is unit-L2-norm scaled instead, and the two conventions select different feature sets
      at the same nominal alpha.
  - term: Feature selection (as a side effect of fitting)
    definition: >-
      What lasso does that ridge does not: driving some coefficients to exactly zero as part of a single
      convex optimization, rather than as a separate discrete search step the way stepwise selection
      works.
  - term: Coordinate descent
    definition: >-
      The iterative algorithm scikit-learn's Lasso and ElasticNet use to find a solution, needed because
      the L1 penalty is not differentiable at zero and has no closed form. Measured iteration counts on
      the diabetes split: 368 at alpha=0.001, falling to 6 at alpha=1.0.
  - term: Closed-form solution
    definition: >-
      A solution obtained by a single direct calculation rather than an iterative search -- ridge's
      normal equations, adjusted by adding alpha to the diagonal before inverting. A fitted Ridge model
      carries no n_iter_ attribute, confirmed here directly, because there was nothing to iterate.
  - term: Weight decay
    definition: >-
      The L2 penalty applied to a neural network's weights during training, and ridge regression's direct
      descendant. Shrinks every weight toward zero but, by the same geometry measured in this lesson,
      never produces an exact zero -- getting a sparse network needs an L1-style term or pruning on top.
  - term: Grouping effect
    definition: >-
      What ElasticNet was designed to restore that plain lasso lacks: treating a group of correlated
      predictors as a unit, splitting weight among them roughly the way ridge does, rather than picking
      one arbitrarily and zeroing the rest.
  - term: Near-duplicate predictors
    definition: >-
      Two columns correlated at 0.999918 in this lesson's measurement, used to show ridge splitting a
      true combined coefficient of 6.0 almost evenly (3.048 and 2.9742) while lasso concentrates nearly
      all of it on one (5.0848) and zeros the other.
  - term: Tikhonov regularization
    definition: >-
      The general mathematical technique -- adding a stabilizing penalty term to an ill-posed problem --
      introduced by Andrey Tikhonov, of which ridge regression is the linear-regression special case,
      named and popularized in statistics by Hoerl and Kennard's 1970 paper.
  - term: LassoCV
    definition: >-
      Scikit-learn's cross-validated lasso, which searches an alpha grid automatically rather than
      requiring a value chosen by eye. Measured here to pick alpha=0.07874, zeroing 4 of 10 coefficients
      and keeping sex, bmi, bp, s1, s3 and s5.
