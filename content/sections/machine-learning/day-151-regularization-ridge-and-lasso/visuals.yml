visuals:
  - id: penalty-geometry-architecture
    file: assets/penalty-geometry-architecture.svg
    type: diagram
    title: >-
      Why a diamond produces a corner and a circle does not: the constraint-region geometry behind ridge
      and lasso, with the two-feature measurement that makes it concrete
    alt: >-
      Diagram: two panels, side by side, each showing a two-dimensional coefficient space with a shaded
      constraint region, a set of tilted elliptical loss contours centered on the unconstrained
      least-squares solution, and a marked point where the smallest contour first touches the region. The
      left panel, labeled Ridge, L2 penalty, shows a circular region; its contact point sits off both
      axes, so both coefficients stay nonzero, and a caption reports that ridge zeroed 0 of 10 measured
      coefficients at every alpha tried. The right panel, labeled Lasso, L1 penalty, shows a
      diamond-shaped region with corners sitting exactly on the axes; its contact point sits at one of
      those corners, on the horizontal axis, so the vertical coefficient is exactly zero, and a caption
      reports that lasso zeroed 8 of 10 measured coefficients by alpha=1.0. Below both panels, a measured
      table on two features correlated at 0.9999 lists ridge and lasso coefficients at alpha 0.001, 1.0,
      3.0 and 8.0: ridge's two coefficients stay nonzero the whole way, ending at 1.9345 and 1.8820, while
      lasso's second coefficient reaches exactly 0.0000 at alpha=3.0 and both of lasso's coefficients are
      exactly 0.0000 by alpha=8.0
    description: >-
      A static architecture diagram in two side-by-side panels, each drawing a two-dimensional
      coefficient space: axes for two coefficients, a shaded constraint region for the penalty, tilted
      elliptical loss contours centered on the unconstrained least-squares solution (offset from the
      origin to represent correlated predictors), and a marked contact point where the smallest contour
      first touches the constraint region's boundary. The left panel draws ridge's circular region, whose
      smooth boundary has no corners, so the contact point sits generically off both axes with both
      coefficients nonzero; a caption states the measured fact that ridge zeroed 0 of 10 coefficients at
      every alpha tried, from 0.001 to 100. The right panel draws lasso's diamond-shaped region, whose
      corners sit exactly on the coordinate axes, so the contact point lands on a corner where one
      coefficient is exactly zero; a caption states that lasso zeroed 8 of 10 coefficients by alpha=1.0.
      Beneath both panels, a measured data table gives the two-feature demonstration in full: an
      unregularized (OLS) reference of [1.9564, 1.9381], and ridge and lasso coefficients at alpha 0.001,
      1.0, 3.0 and 8.0, ending with ridge still at [1.9345, 1.8820] while lasso has reached exactly
      [0.0000, 0.0000].
  - id: coefficient-path-flow
    file: assets/coefficient-path-flow.svg
    type: flow-animated
    title: >-
      The coefficient path, animated: lasso's bars fall to exactly zero in sequence as alpha rises,
      ridge's never do
    alt: >-
      Diagram: two panels of ten coefficient bars each, ridge on the left and lasso on the right, as
      alpha sweeps from 0.001 to 100. In the ridge panel every bar shrinks together and stays visibly
      above a dashed floor at every point along the sweep. In the lasso panel eight of ten bars shrink
      further and then drop to exactly the floor, one after another in sequence, and stay there for the
      rest of the sweep, while the remaining two bars shrink but never reach the floor. A caption
      beneath both panels states the measured results: every one of lasso's ten coefficients hits
      exactly zero somewhere in the sweep, not one of ridge's ten ever does, the order is not arbitrary
      since s3 zeros first at alpha=0.0032 and bmi zeros last at alpha=2.4538, and at alpha=1.0 on the
      real data lasso has zeroed 8 of 10 coefficients with test R2 0.2782 while ridge has zeroed 0 of 10
      with test R2 0.3570
    description: >-
      An animated flow diagram in two panels of ten coefficient bars each. In the ridge panel, every bar
      shrinks in height together as an alpha marker sweeps left to right beneath it, and every bar stays
      visibly above a dashed baseline at every point in the animation. In the lasso panel, eight of the
      ten bars shrink further than the ridge bars do and then, staggered one after another over the
      course of the sweep, collapse to exactly the baseline and remain there -- rendered with a dashed
      outline and muted fill once zeroed, to distinguish a genuinely zero coefficient from one that is
      merely small -- while the remaining two bars shrink but never collapse to the baseline. The
      animation loops on an 8-second cycle. Beneath both panels, a static measured summary states the
      results the animation dramatizes: every one of lasso's ten coefficients hits exactly zero
      somewhere in a 60-point alpha sweep, not one of ridge's ten ever does, the zeroing order is s3
      first (alpha=0.0032) and bmi last (alpha=2.4538), and at alpha=1.0 on the real diabetes split
      lasso has zeroed 8 of 10 coefficients (test R2 0.2782) against ridge's 0 of 10 (test R2 0.3570). A
      prefers-reduced-motion block freezes every bar at its final state -- ridge's ten bars shrunk but
      visible, lasso's eight zeroed bars flat at the baseline and its two survivors shrunk but visible --
      so the still frame carries the entire result on its own.
