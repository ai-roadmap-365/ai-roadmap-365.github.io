visuals:
  - id: xgboost-vs-lightgbm-architecture
    file: assets/xgboost-vs-lightgbm-architecture.svg
    type: diagram
    title: 'XGBoost vs LightGBM Architectural Innovations Comparison'
    alt: 'Architecture comparison diagram contrasting Level-Wise growth vs Leaf-Wise growth, and Exact float64 sorting vs uint8 Histogram binning.'
    description: 'A static architecture diagram comparing XGBoost exact second-order level-wise trees with LightGBM leaf-wise histogram-binned trees.'
  - id: goss-efb-flow
    file: assets/goss-efb-flow.svg
    type: flow-animated
    title: 'LightGBM Acceleration: GOSS Subsampling and Exclusive Feature Bundling'
    alt: 'Animated flow chart illustrating how GOSS filters small-gradient samples and EFB merges sparse orthogonal features.'
    description: 'An animated flow chart demonstrating the data compression mechanics of GOSS and EFB in modern gradient boosting.'
  - id: library-idea
    file: assets/library-idea.svg
    type: diagram
    title: 'What the libraries added'
