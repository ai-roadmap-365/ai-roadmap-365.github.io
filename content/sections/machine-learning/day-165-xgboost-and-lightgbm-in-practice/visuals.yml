  - id: split-gain
    file: assets/split-gain.svg
    type: diagram
    title: 'The split gain'
    alt: 'Diagram: the four components of the regularised split gain formula'
    description: 'A four-stage description of split gain covering the left child, the right child, the parent and the complexity penalty.'
  - id: leafwise-levelwise
    file: assets/leafwise-levelwise.svg
    type: diagram
    title: 'Level-wise against leaf-wise growth'
