    description: 'A four-stage description of boosting library advances covering the second-order objective, histogram binning, regularisation and system engineering.'
  - id: taylor-objective
    file: assets/taylor-objective.svg
    type: diagram
    title: 'The second-order objective'
    alt: 'Diagram: how a second-order expansion of the loss guides tree building'
