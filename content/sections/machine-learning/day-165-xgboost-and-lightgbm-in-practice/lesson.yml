slug: xgboost-and-lightgbm-in-practice
title: XGBoost and LightGBM in Practice
section: machine-learning
subsection: supervised-learning
week: 24
learning_promise: >-
  Master the modern industrial gradient boosting ecosystem -- XGBoost, LightGBM, CatBoost, and HistGradientBoosting:
  why exact second-order Taylor expansion unifies loss optimization and tree regularization, how histogram-based binning
  achieves an 8x memory reduction and 10x training speedup, how leaf-wise growth differs from level-wise growth, how GOSS
  and EFB optimize million-row datasets, and how modern tree libraries handle missing values and categoricals natively.
objectives:
  - 'Derive XGBoost exact second-order Taylor expansion objective and optimal split gain formula'
  - 'Explain the role of L2 regularization (lambda) and complexity penalty (gamma) in tree growth'
  - 'Implement histogram-based feature discretization into 256 uint8 integer bins'
  - 'Contrast level-wise (depth-first) vs leaf-wise (best-first) tree growth paradigms'
  - 'Analyze LightGBM Gradient-based One-Side Sampling (GOSS) and Exclusive Feature Bundling (EFB)'
  - 'Examine CatBoost Ordered Target Encoding and Oblivious (Symmetric) Decision Trees'
  - 'Train histogram gradient boosting models with native missing-value (NaN) and categorical support'
  - 'Benchmark modern boosted tree libraries against traditional ensembles on tabular benchmarks'
prerequisites:
  - 'Day 164 -- Gradient Boosting and pseudo-residuals'
  - 'Day 163 -- Random Forests'
