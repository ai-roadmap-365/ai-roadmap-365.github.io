questions:
  - question: 'What is the key mathematical difference between standard Gradient Boosting (Friedman, 2001) and XGBoost (Chen & Guestrin, 2016)?'
    options:
      - 'Standard gradient boosting requires normalized features; XGBoost does not'
      - 'Standard gradient boosting uses neural networks; XGBoost uses decision trees'
      - 'XGBoost uses a second-order Taylor expansion'
      - 'Standard gradient boosting is parallel; XGBoost is strictly single-threaded'
    answer_index: 2
    explanation: 'XGBoost expands the loss to second order L(y, y_hat + f) approx L + g*f + 0.5*h*f^2, allowing exact closed-form optimal leaf weights and split gain without heuristic line searches.'

  - question: 'How does Histogram-Based Binning (introduced in LightGBM and adopted by XGBoost and scikit-learn HistGradientBoosting) achieve a 10x training speedup?'
    options:
      - 'It runs exclusively on quantum processors'
      - 'It removes 90% of the training dataset'
      - 'It replaces decision trees with logistic regressions'
      - 'It bins features into 256 integer buckets'
    answer_index: 3
    explanation: 'By grouping continuous values into 256 discrete bins, feature values can be stored in 1 byte (uint8) rather than 8 bytes, and building histograms for split evaluation takes O(n_bins) rather than O(N log N).'

  - question: 'What is the difference between Level-Wise tree growth (XGBoost traditional / scikit-learn) and Leaf-Wise tree growth (LightGBM)?'
    options:
      - 'Level-wise grows balanced; leaf-wise picks the best leaf'
      - 'Level-wise is for regression; Leaf-wise is for classification'
      - 'Level-wise uses Gini; Leaf-wise uses Entropy'
      - 'Level-wise cannot handle categorical features'
    answer_index: 0
    explanation: 'Leaf-wise (best-first) growth achieves lower loss with fewer leaves, but can produce deep, asymmetric branches that require max_depth or min_child_samples regularization to prevent overfitting.'

  - question: 'What is Gradient-based One-Side Sampling (GOSS) in LightGBM?'
    options:
      - 'A method that discards all negative targets'
      - 'It keeps large-gradient rows and subsamples the rest'
      - 'A technique that trains trees on a single feature at a time'
      - 'A loss function for imbalanced datasets'
    answer_index: 1
    explanation: 'Samples with small gradients contribute little to the split search. GOSS discards most small-gradient instances while applying a constant multiplier to maintain unbiased gradient estimates.'

  - question: 'How does modern XGBoost / LightGBM handle missing values (NaNs) in tabular data?'
    options:
      - 'It replaces all NaNs with the column mean before training'
      - 'It automatically deletes any row containing a NaN'
      - 'Natively — it learns a default direction per feature'
      - 'It throws a ValueError if NaNs are present'
    answer_index: 2
    explanation: 'Sparsity-aware split finding learns an optimal default routing (left or right) for missing values at each split node, completely eliminating the need for mean or median imputation.'

  - question: 'What is the architectural hallmark of CatBoost compared to XGBoost and LightGBM?'
    options:
      - 'It is restricted to binary classification'
      - 'It only runs on GPU'
      - 'It does not use decision trees'
      - 'Oblivious trees plus ordered target encoding'
    answer_index: 3
    explanation: 'CatBoost uses symmetric oblivious trees that evaluate splits via SIMD vector operations, and Ordered Target Statistics to handle high-cardinality categoricals without overfitting.'

  - question: 'What is the role of the lambda parameter in XGBoost second-order split score w_j* = - sum(g_i) / (sum(h_i) + lambda)?'
    options:
      - 'It is L2 regularization on the leaf weights'
      - 'It controls the learning rate'
      - 'It sets the maximum tree depth'
      - 'It sets the percentage of bootstrap samples'
    answer_index: 0
    explanation: 'Lambda penalizes large leaf weights in the objective function. When a leaf contains few samples or low Hessian curvature, lambda dominates the denominator and shrinks the leaf weight to near zero.'

  - question: 'Why does scikit-learn HistGradientBoostingClassifier require NO One-Hot Encoding for categorical features?'
    options:
      - 'It converts all strings to random numbers'
      - 'It partitions categories by their target statistics'
      - 'It ignores categorical columns during training'
      - 'It uses PCA on categoricals'
    answer_index: 1
    explanation: 'Modern histogram boosting natively sorts categorical categories by their target mean and searches for the optimal subset split directly in O(K log K) time, outperforming one-hot encoding.'
