terms:
  - term: 'XGBoost (Extreme Gradient Boosting)'
    definition: 'An open-source library implementing exact second-order Taylor boosting, sparsity-aware split finding, and explicit L1/L2 leaf regularization.'
  - term: 'LightGBM'
    definition: 'A Microsoft open-source gradient boosting framework optimized for high speed and low memory using histogram binning, leaf-wise growth, GOSS, and EFB.'
  - term: 'CatBoost'
    definition: 'A Yandex open-source gradient boosting library renowned for native categorical feature handling via ordered target statistics and symmetric oblivious trees.'
  - term: 'Histogram-Based Binning'
    definition: 'Discretizing continuous floating-point features into integer bins (typically 256 uint8 bins) to construct split histograms in O(n_bins) constant time.'
  - term: 'Leaf-Wise (Best-First) Growth'
    definition: 'A tree growth strategy that greedily splits the leaf node with the highest loss reduction across the entire tree, resulting in asymmetric depth.'
  - term: 'Level-Wise (Depth-First) Growth'
    definition: 'A tree growth strategy that splits all nodes at the current depth simultaneously before moving to the next level, producing balanced trees.'
  - term: 'GOSS (Gradient-based One-Side Sampling)'
    definition: 'A subsampling algorithm that retains all instances with large gradients and samples a small fraction of small-gradient instances to accelerate training.'
  - term: 'EFB (Exclusive Feature Bundling)'
    definition: 'Combining mutually exclusive sparse features (rarely non-zero simultaneously) into a single dense feature bundle to reduce feature dimension.'
  - term: 'Oblivious (Symmetric) Tree'
    definition: 'A decision tree where every node at the same tree depth uses the exact same feature and split threshold, enabling ultra-fast SIMD evaluation.'
  - term: 'Sparsity-Aware Split Finding'
    definition: 'An algorithm that evaluates splits on non-missing values and learns an optimal default branch direction (left or right) for missing values.'
