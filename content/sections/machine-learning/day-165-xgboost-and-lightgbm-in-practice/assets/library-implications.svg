<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical.">
  <title>Four consequences of the libraries</title>
  <style>
    .library-implications-bg   { fill: #f8fafc; }
    .library-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .library-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .library-implications-stage { opacity: 1; }

    .library-implications-s0 { animation-delay: 0.00s; }
    .library-implications-e0 { animation-delay: 0.00s; }
    .library-implications-s1 { animation-delay: 1.28s; }
    .library-implications-e1 { animation-delay: 1.28s; }
    .library-implications-s2 { animation-delay: 2.56s; }
    .library-implications-e2 { animation-delay: 2.56s; }
    .library-implications-s3 { animation-delay: 3.84s; }
    .library-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .library-implications-conn  { animation: library-implications-trace 6.4s ease-in-out infinite; }
      .library-implications-stage { animation: library-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes library-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes library-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .library-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .library-implications-stage { animation: library-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes library-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="library-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="library-implications-bg" width="980" height="322"/>
  <text class="library-implications-h1"  x="30" y="40">Four consequences of the libraries</text>
  <text class="library-implications-sub" x="30" y="64">Two are practical.</text>
  <g class="library-implications-stage library-implications-s0">
    <rect class="library-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="library-implications-step" x="44" y="142">01</text>
    <text class="library-implications-name" x="70" y="142">Strong tabular models are available to anyone</text>
    <text class="library-implications-desc" x="44" y="166">In a few lines, on a laptop.</text>
  </g>
  <line class="library-implications-line library-implications-conn library-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#library-implications-tip)"/>
  <g class="library-implications-stage library-implications-s1">
    <rect class="library-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="library-implications-step" x="280" y="142">02</text>
    <text class="library-implications-name" x="306" y="142">But the parameter surface is large</text>
    <text class="library-implications-desc" x="280" y="166">Most of it not worth tuning.</text>
  </g>
  <line class="library-implications-line library-implications-conn library-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#library-implications-tip)"/>
  <g class="library-implications-stage library-implications-s2">
    <rect class="library-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="library-implications-step" x="516" y="142">03</text>
    <text class="library-implications-name" x="542" y="142">Histogram binning cut memory sharply</text>
    <text class="library-implications-desc" x="516" y="166">Which made larger datasets</text>
    <text class="library-implications-desc" x="516" y="182">feasible in memory.</text>
  </g>
  <line class="library-implications-line library-implications-conn library-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#library-implications-tip)"/>
  <g class="library-implications-stage library-implications-s3">
    <rect class="library-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="library-implications-step" x="752" y="142">04</text>
    <text class="library-implications-name" x="778" y="142">And models export to portable formats</text>
    <text class="library-implications-desc" x="752" y="166">So serving does not need the</text>
    <text class="library-implications-desc" x="752" y="182">training library.</text>
  </g>
  <text class="library-implications-sub" x="30" y="304">The large parameter surface is a genuine trap for newcomers: it invites exhaustive search where five parameters and early stopping would do better.</text>
</svg>
