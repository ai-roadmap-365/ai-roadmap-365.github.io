<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two strategies.">
  <title>Level-wise against leaf-wise growth</title>
  <style>
    .leafwise-levelwise-bg   { fill: #f8fafc; }
    .leafwise-levelwise-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leafwise-levelwise-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leafwise-levelwise-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leafwise-levelwise-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leafwise-levelwise-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leafwise-levelwise-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leafwise-levelwise-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .leafwise-levelwise-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .leafwise-levelwise-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .leafwise-levelwise-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .leafwise-levelwise-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .leafwise-levelwise-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .leafwise-levelwise-row { opacity: 1; }
    .leafwise-levelwise-r0 { animation-delay: 0.00s; }
    .leafwise-levelwise-r1 { animation-delay: 0.45s; }
    .leafwise-levelwise-r2 { animation-delay: 0.90s; }
    .leafwise-levelwise-r3 { animation-delay: 1.35s; }
    .leafwise-levelwise-r4 { animation-delay: 1.80s; }
    .leafwise-levelwise-row { animation: leafwise-levelwise-reveal 7.3s ease-in-out infinite; }
    @keyframes leafwise-levelwise-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="leafwise-levelwise-bg" width="980" height="390"/>
  <text class="leafwise-levelwise-h1"  x="30" y="40">Level-wise against leaf-wise growth</text>
  <text class="leafwise-levelwise-sub" x="30" y="64">Two strategies.</text>
  <rect class="leafwise-levelwise-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="leafwise-levelwise-name" x="46" y="122">Level-wise</text>
  <text class="leafwise-levelwise-desc" x="46" y="142">Grow evenly.</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r0" x="46" y="182">Splits every node at a depth before going deeper</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r1" x="46" y="216">Balanced, predictable trees</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r2" x="46" y="250">Depth alone controls complexity</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r3" x="46" y="284">Wastes effort on unhelpful splits</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r4" x="46" y="318">Harder to overfit</text>
  <rect class="leafwise-levelwise-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="leafwise-levelwise-name" x="526" y="122">Leaf-wise</text>
  <text class="leafwise-levelwise-desc" x="526" y="142">Grow where it helps.</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r0" x="526" y="182">Always splits the highest-gain leaf anywhere</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r1" x="526" y="216">Deep, unbalanced trees</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r2" x="526" y="250">Needs a leaf-count limit as well</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r3" x="526" y="284">Reaches lower loss per node</text>
  <text class="leafwise-levelwise-desc leafwise-levelwise-row leafwise-levelwise-r4" x="526" y="318">Overfits readily on small data</text>
  <text class="leafwise-levelwise-sub" x="30" y="372">Leaf-wise growth needing a leaf limit rather than only a depth limit is the practical gotcha: setting depth alone leaves it effectively unconstrained.</text>
</svg>
