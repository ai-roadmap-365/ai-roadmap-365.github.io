<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four things.">
  <title>What the libraries added</title>
  <style>
    .library-idea-bg   { fill: #f8fafc; }
    .library-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .library-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .library-idea-stage { opacity: 1; }

    .library-idea-s0 { animation-delay: 0.00s; }
    .library-idea-e0 { animation-delay: 0.00s; }
    .library-idea-s1 { animation-delay: 1.28s; }
    .library-idea-e1 { animation-delay: 1.28s; }
    .library-idea-s2 { animation-delay: 2.56s; }
    .library-idea-e2 { animation-delay: 2.56s; }
    .library-idea-s3 { animation-delay: 3.84s; }
    .library-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .library-idea-conn  { animation: library-idea-trace 6.4s ease-in-out infinite; }
      .library-idea-stage { animation: library-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes library-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes library-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .library-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .library-idea-stage { animation: library-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes library-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="library-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="library-idea-bg" width="980" height="322"/>
  <text class="library-idea-h1"  x="30" y="40">What the libraries added</text>
  <text class="library-idea-sub" x="30" y="64">Four things.</text>
  <g class="library-idea-stage library-idea-s0">
    <rect class="library-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="library-idea-step" x="44" y="142">01</text>
    <text class="library-idea-name" x="70" y="142">A second-order objective</text>
    <text class="library-idea-desc" x="44" y="166">Using curvature, so fewer trees</text>
    <text class="library-idea-desc" x="44" y="182">are needed.</text>
  </g>
  <line class="library-idea-line library-idea-conn library-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#library-idea-tip)"/>
  <g class="library-idea-stage library-idea-s1">
    <rect class="library-idea-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="library-idea-step" x="280" y="142">02</text>
    <text class="library-idea-name" x="306" y="142">Histogram binning of feature values</text>
    <text class="library-idea-desc" x="280" y="166">Turning a continuous search into</text>
    <text class="library-idea-desc" x="280" y="182">a bucketed one.</text>
  </g>
  <line class="library-idea-line library-idea-conn library-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#library-idea-tip)"/>
  <g class="library-idea-stage library-idea-s2">
    <rect class="library-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="library-idea-step" x="516" y="142">03</text>
    <text class="library-idea-name" x="542" y="142">Regularisation built into the split criterion</text>
    <text class="library-idea-desc" x="516" y="166">Rather than applied afterwards.</text>
  </g>
  <line class="library-idea-line library-idea-conn library-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#library-idea-tip)"/>
  <g class="library-idea-stage library-idea-s3">
    <rect class="library-idea-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="library-idea-step" x="752" y="142">04</text>
    <text class="library-idea-name" x="778" y="142">And cache-aware, parallel, out-of-core engineering</text>
    <text class="library-idea-desc" x="752" y="166">Which is most of the speed.</text>
    <text class="library-idea-edge" x="752" y="242">systems work</text>
  </g>
  <text class="library-idea-sub" x="30" y="304">The systems engineering deserves equal billing with the mathematics: binning and cache-aware layouts are what turned hours of training into minutes.</text>
</svg>
