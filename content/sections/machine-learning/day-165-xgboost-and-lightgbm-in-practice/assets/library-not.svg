<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Four misreadings.">
  <title>What these libraries are not</title>
  <style>
    .library-not-bg   { fill: #f8fafc; }
    .library-not-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-not-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-not-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-not-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-not-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .library-not-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-not-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .library-not-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .library-not-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .library-not-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .library-not-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .library-not-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .library-not-row { opacity: 1; }
    .library-not-r0 { animation-delay: 0.00s; }
    .library-not-r1 { animation-delay: 0.45s; }
    .library-not-r2 { animation-delay: 0.90s; }
    .library-not-r3 { animation-delay: 1.35s; }
    .library-not-r4 { animation-delay: 1.80s; }
    .library-not-row { animation: library-not-reveal 7.3s ease-in-out infinite; }
    @keyframes library-not-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="library-not-bg" width="980" height="390"/>
  <text class="library-not-h1"  x="30" y="40">What these libraries are not</text>
  <text class="library-not-sub" x="30" y="64">Four misreadings.</text>
  <rect class="library-not-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="library-not-name" x="46" y="122">The misconception</text>
  <text class="library-not-desc" x="46" y="142">Commonly held.</text>
  <text class="library-not-desc library-not-row library-not-r0" x="46" y="182">They are different algorithms</text>
  <text class="library-not-desc library-not-row library-not-r1" x="46" y="216">More parameters tuned means better results</text>
  <text class="library-not-desc library-not-row library-not-r2" x="46" y="250">Defaults are a starting point only</text>
  <text class="library-not-desc library-not-row library-not-r3" x="46" y="284">One library is simply best</text>
  <text class="library-not-desc library-not-row library-not-r4" x="46" y="318">They handle categorical features identically</text>
  <rect class="library-not-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="library-not-name" x="526" y="122">What is true</text>
  <text class="library-not-desc" x="526" y="142">Actually.</text>
  <text class="library-not-desc library-not-row library-not-r0" x="526" y="182">Same algorithm, different engineering</text>
  <text class="library-not-desc library-not-row library-not-r1" x="526" y="216">Five parameters carry nearly all the gain</text>
  <text class="library-not-desc library-not-row library-not-r2" x="526" y="250">Defaults are strong; start there</text>
  <text class="library-not-desc library-not-row library-not-r3" x="526" y="284">They trade speed against small accuracy differences</text>
  <text class="library-not-desc library-not-row library-not-r4" x="526" y="318">Their categorical handling differs substantially</text>
  <text class="library-not-sub" x="30" y="372">Five parameters carrying most of the gain is the practically useful fact: learning rate, tree count, depth, subsampling and one regularisation term.</text>
</svg>
