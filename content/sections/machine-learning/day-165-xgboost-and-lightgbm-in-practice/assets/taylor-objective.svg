<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The second-order objective</title>
  <style>
    .taylor-objective-bg   { fill: #f8fafc; }
    .taylor-objective-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taylor-objective-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taylor-objective-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taylor-objective-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taylor-objective-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .taylor-objective-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .taylor-objective-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .taylor-objective-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .taylor-objective-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .taylor-objective-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .taylor-objective-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .taylor-objective-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .taylor-objective-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .taylor-objective-stage { opacity: 1; }

    .taylor-objective-s0 { animation-delay: 0.00s; }
    .taylor-objective-e0 { animation-delay: 0.00s; }
    .taylor-objective-s1 { animation-delay: 1.28s; }
    .taylor-objective-e1 { animation-delay: 1.28s; }
    .taylor-objective-s2 { animation-delay: 2.56s; }
    .taylor-objective-e2 { animation-delay: 2.56s; }
    .taylor-objective-s3 { animation-delay: 3.84s; }
    .taylor-objective-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .taylor-objective-conn  { animation: taylor-objective-trace 6.4s ease-in-out infinite; }
      .taylor-objective-stage { animation: taylor-objective-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes taylor-objective-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes taylor-objective-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .taylor-objective-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .taylor-objective-stage { animation: taylor-objective-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes taylor-objective-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="taylor-objective-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="taylor-objective-bg" width="980" height="322"/>
  <text class="taylor-objective-h1"  x="30" y="40">The second-order objective</text>
  <text class="taylor-objective-sub" x="30" y="64">Four steps.</text>
  <g class="taylor-objective-stage taylor-objective-s0">
    <rect class="taylor-objective-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="taylor-objective-step" x="44" y="142">01</text>
    <text class="taylor-objective-name" x="70" y="142">Expand the loss to second order around the current prediction</text>
    <text class="taylor-objective-desc" x="44" y="166">A Taylor expansion, truncated.</text>
  </g>
  <line class="taylor-objective-line taylor-objective-conn taylor-objective-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#taylor-objective-tip)"/>
  <g class="taylor-objective-stage taylor-objective-s1">
    <rect class="taylor-objective-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="taylor-objective-step" x="280" y="142">02</text>
    <text class="taylor-objective-name" x="306" y="142">Which leaves a gradient term and a curvature term</text>
    <text class="taylor-objective-desc" x="280" y="166">Per training example.</text>
  </g>
  <line class="taylor-objective-line taylor-objective-conn taylor-objective-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#taylor-objective-tip)"/>
  <g class="taylor-objective-stage taylor-objective-s2">
    <rect class="taylor-objective-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="taylor-objective-step" x="516" y="142">03</text>
    <text class="taylor-objective-name" x="542" y="142">Giving a closed form for the best leaf value</text>
    <text class="taylor-objective-desc" x="516" y="166">And for the gain of any</text>
    <text class="taylor-objective-desc" x="516" y="182">candidate split.</text>
  </g>
  <line class="taylor-objective-line taylor-objective-conn taylor-objective-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#taylor-objective-tip)"/>
  <g class="taylor-objective-stage taylor-objective-s3">
    <rect class="taylor-objective-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="taylor-objective-step" x="752" y="142">04</text>
    <text class="taylor-objective-name" x="778" y="142">So splits are chosen by their actual effect on the loss</text>
    <text class="taylor-objective-desc" x="752" y="166">Not by a proxy impurity measure.</text>
    <text class="taylor-objective-edge" x="752" y="242">exact</text>
  </g>
  <text class="taylor-objective-sub" x="30" y="304">Choosing splits by their effect on the real loss rather than on an impurity proxy is the substantive improvement, and it applies to any differentiable objective.</text>
</svg>
