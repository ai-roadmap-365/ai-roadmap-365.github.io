<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Speed changes what is possible.">
  <title>The same recipe, better equipment</title>
  <style>
    .kitchen-equipment-bg   { fill: #f8fafc; }
    .kitchen-equipment-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-equipment-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-equipment-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-equipment-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-equipment-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-equipment-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-equipment-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-equipment-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-equipment-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-equipment-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-equipment-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-equipment-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-equipment-row { opacity: 1; }
    .kitchen-equipment-r0 { animation-delay: 0.00s; }
    .kitchen-equipment-r1 { animation-delay: 0.45s; }
    .kitchen-equipment-r2 { animation-delay: 0.90s; }
    .kitchen-equipment-r3 { animation-delay: 1.35s; }
    .kitchen-equipment-r4 { animation-delay: 1.80s; }
    .kitchen-equipment-row { animation: kitchen-equipment-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-equipment-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-equipment-bg" width="980" height="390"/>
  <text class="kitchen-equipment-h1"  x="30" y="40">The same recipe, better equipment</text>
  <text class="kitchen-equipment-sub" x="30" y="64">Speed changes what is possible.</text>
  <rect class="kitchen-equipment-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-equipment-name" x="46" y="122">Slow equipment</text>
  <text class="kitchen-equipment-desc" x="46" y="142">Same result, eventually.</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r0" x="46" y="182">The method is identical</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r1" x="46" y="216">Hours per attempt</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r2" x="46" y="250">One or two attempts a day</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r3" x="46" y="284">Little iteration possible</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r4" x="46" y="318">This is a research implementation</text>
  <rect class="kitchen-equipment-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-equipment-name" x="526" y="122">Fast equipment</text>
  <text class="kitchen-equipment-desc" x="526" y="142">Same result, quickly.</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r0" x="526" y="182">The method is still identical</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r1" x="526" y="216">Minutes per attempt</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r2" x="526" y="250">Dozens of attempts a day</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r3" x="526" y="284">Iteration becomes the workflow</text>
  <text class="kitchen-equipment-desc kitchen-equipment-row kitchen-equipment-r4" x="526" y="318">This is an engineered library</text>
  <text class="kitchen-equipment-sub" x="30" y="372">Speed changing the workflow rather than only the runtime is the real effect: iteration that takes minutes is done, and iteration that takes hours is not.</text>
</svg>
