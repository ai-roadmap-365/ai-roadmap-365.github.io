sources:
  - title: 'XGBoost: A Scalable Tree Boosting System'
    url: 'https://doi.org/10.1145/2939672.2939785'
    publisher: 'ACM KDD (Tianqi Chen and Carlos Guestrin)'
    accessed: '2026-08-29'
    year: 2016
    description: 'The definitive paper introducing XGBoost second-order Taylor expansion objective, sparsity-aware split finding, and out-of-core block compression.'
  - title: 'LightGBM: A Highly Efficient Gradient Boosting Decision Tree'
    url: 'https://proceedings.neurips.cc/paper/2017/hash/6449f44a102fde848669bdd9eb6b76fa-Abstract.html'
    publisher: 'NeurIPS (Guolin Ke, Qi Meng, Thomas Finley, et al.)'
    accessed: '2026-08-29'
    year: 2017
    description: 'The landmark paper introducing Histogram Binning, Leaf-Wise Tree Growth, GOSS, and Exclusive Feature Bundling.'
  - title: 'CatBoost: unbiased boosting with categorical features'
    url: 'https://proceedings.neurips.cc/paper/2018/hash/14491b756b3a51daac41c24863285549-Abstract.html'
    publisher: 'NeurIPS (Liudmila Prokhorenkova, Gleb Gusev, et al.)'
    accessed: '2026-08-29'
    year: 2018
    description: 'Formulation of Ordered Boosting to eliminate target leakage and symmetric oblivious decision trees for robust tabular learning.'
