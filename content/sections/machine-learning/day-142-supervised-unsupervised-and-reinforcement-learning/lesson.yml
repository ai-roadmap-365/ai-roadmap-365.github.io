title: 'Supervised, Unsupervised, and Reinforcement Learning'
section: machine-learning
subsection: core-concepts
week: 21
learning_promise: >-
  After this lesson you will classify a learning problem by the shape of its feedback signal rather
  than by its algorithm, and you will have measured why that distinction is the one that pays. You
  will produce two accuracy scores, 0.24 and 0.8933, for the identical clustering of the identical
  data, and understand that the 0.6533 between them came from cluster numbering alone. You will read
  a confusion table showing k-means isolating one iris species perfectly and blending the other two,
  and notice that you needed labels to find that out. You will watch standardising the features --
  the advice in every clustering tutorial -- move the result measurably away from the species, from
  an adjusted Rand index of 0.7302 to 0.6201, and be able to explain the mechanism. You will see
  inertia fall at every value of k and understand why that is a theorem rather than a measurement,
  and watch a silhouette score confidently choose two clusters for a dataset with three species. You
  will build a ten-armed bandit and a tabular Q-learning agent from scratch in NumPy and measure that
  never exploring costs 0.3949 of optimal-action rate. You will count a terminal-only reward
  travelling backwards through a gridworld exactly one state per episode, and meet a one-line
  tie-breaking bug that makes the same agent reach the goal 0 times in 300 without raising a single
  warning. And you will find out why a clean, honest log of a working policy is not a supervised
  dataset -- five of eight greedy logs name the wrong action, four of them contain only one action,
  and even a well-explored log loses once to the winner's curse.
objectives:
  - 'Classify a learning problem by its feedback signal -- instructive, absent, or evaluative -- rather than by the algorithm somebody used on it'
  - 'Apply the three diagnostic questions in the order that matters, asking whether your actions change your data before asking whether you have labels'
  - 'Demonstrate that cluster identifiers are arbitrary and that comparing them to class labels produces a number with no meaning'
  - 'Read a cluster-versus-class confusion table and state precisely what an unsupervised method did and did not recover'
  - 'Explain why inertia falls monotonically in k as a theorem, and why that makes it useless for choosing k'
  - 'Report a case where standard preprocessing advice measurably harms a clustering, and explain the mechanism'
  - 'Implement epsilon-greedy action-value learning from scratch and measure the price of pure exploitation'
  - 'Implement tabular Q-learning from scratch and count how far a terminal-only reward has propagated after n episodes'
  - 'Diagnose a silent reinforcement-learning failure caused by argmax tie-breaking on an all-zero value table'
  - 'Explain why logged policy data cannot be treated as a supervised dataset, in terms of what the log does not contain'
  - 'Recognise the winner''s curse in an argmax over noisy estimates, and connect it to model selection'
  - 'Use unsupervised structure to spend a small label budget better, and quantify what choosing is worth'
prerequisites:
  - 'Day 141 -- machine learning as function approximation from examples, and why a training-set number persuades you of nothing. This day assumes you will not be impressed by an accuracy'
  - 'Days 117-118 -- the standard error and the sampling distribution, which is why today averages the bandit over 200 problems and the label-budget curve over 40 splits'
  - 'Day 136 -- the forking-paths problem, which returns today as the winner''s curse in a different setting'
  - 'Day 119 -- randomisation and what an observational record cannot tell you, which is exactly the objection to training on a policy log'
  - 'Comfort with NumPy array indexing and reading a pytest failure, and a working python3 3.11 or newer on your PATH; the lab builds its own virtual environment from requirements/requirements.txt'
