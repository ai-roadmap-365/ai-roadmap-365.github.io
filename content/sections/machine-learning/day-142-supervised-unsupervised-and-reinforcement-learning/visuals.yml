visuals:
  - id: three-kinds-of-feedback-architecture
    file: assets/three-kinds-of-feedback-architecture.svg
    type: diagram
    title: >-
      The three learning settings shown as three shapes of feedback, each with what the learner
      is told and what it is never told, above the question that actually decides which setting
      you are in
    alt: >-
      Diagram: three columns headed supervised, unsupervised and reinforcement. Each column shows a
      solid blue panel for what the learner is told and a dashed grey panel for what it is never told.
      Supervised is told the correct output for every single input and is told nothing back, scoring
      0.92 with a 5-NN on iris. Unsupervised is told only the inputs and is never told whether what it
      found is right, scoring either 0.24 or 0.8933 on iris depending only on how its clusters are
      numbered. Reinforcement is told a score for the action it actually took and is never told the
      counterfactual, reaching the best arm 0.313 of the time when greedy and 0.708 when it explores.
      Below, a note states that the deciding question is not whether you have labels but whether the
      learner's own actions change the data it sees next
    description: >-
      A static architecture diagram in three columns, one per learning setting, above a shared
      conclusion. Each column carries the same internal structure so the three can be read
      against one another: a heading naming the setting and the shape of its feedback, a solid
      blue panel headed "told" describing what information actually reaches the learner, a
      dashed grey panel headed "withheld" describing what never does, a horizontal rule, and a
      measured figure from the day's lab underneath. The supervised column is told the correct
      output for every single input, has nothing withheld because it holds the answer key, and
      records a 5-NN scoring 0.92 on iris with all 100 training rows carrying an answer. The
      unsupervised column is told the inputs and nothing else, is never told whether anything it
      found is right, and records the same k-means partition of iris scoring either 0.24 or
      0.8933 depending only on how the clusters are numbered. The reinforcement column is told a
      score for the action it actually took, is never told the counterfactual, and records the
      best arm being chosen 0.313 of the time by a greedy agent against 0.708 by one exploring
      at epsilon 0.1. Three arrows lead down from the columns into a single highlighted note,
      which states that the deciding question is not whether you have labels but whether the
      learner's own actions change the data it sees next -- and that if they do, the setting is
      reinforcement learning however many labels you have, because the log records only what was
      chosen.
  - id: reward-travels-backwards-flow
    file: assets/reward-travels-backwards-flow.svg
    type: flow-animated
    title: >-
      A terminal-only reward propagating backwards through a five by five gridworld, one state
      per episode, with the measured counts and the silent tie-breaking failure recorded beside
      it
    alt: >-
      Diagram: a five by five grid whose bottom-right square is the goal paying plus one, filled with
      the state values a tabular Q-learning agent actually learned in three hundred episodes. Squares
      light up outward from the goal in the order the reward reached them, and three squares stay at
      zero including the goal itself, which the episode ends before updating. A left panel counts the
      states carrying value after 1, 2, 3, 5, 10, 25, 50, 100 and 300 episodes as 1, 2, 3, 5, 10, 18,
      20, 21 and 22 out of 25. A right panel records that the greedy policy has no path at 10 episodes
      and walks the shortest 8 steps from 25 episodes onward, that mean episode length falls from 46.8
      to 10.4, and that letting numpy argmax break ties makes the same agent reach the goal 0 times in
      300 without any warning
    description: >-
      An animated flow diagram built directly from the state values a tabular Q-learning agent
      actually learned in 300 episodes on the day's gridworld. The centre is a five by five grid
      of squares. The bottom-right square is the goal, filled solid blue and labelled as paying
      plus one; the top-left square is the start, outlined in heavy dark stroke. Every square
      that carries a non-zero learned value prints that value to two decimal places, and the
      three squares that stay at zero print 0.00 -- the goal itself, whose action-values are
      never updated because the episode terminates on arrival, and two opposite corners the
      agent had no reason to route through. The animation fills the squares outward from the
      goal in eight rings, one ring roughly every 0.8 seconds on a 7-second loop, so the order
      in which the reward reached them is visible as motion; each ring, once filled, stays
      filled for the rest of the cycle. A left panel lists the measured count of states carrying
      value after 1, 2, 3, 5, 10, 25, 50, 100 and 300 episodes as 1, 2, 3, 5, 10, 18, 20, 21 and
      22 out of 25, and notes that this is exactly one new state per episode for the first ten.
      A right panel records the greedy policy: 8 steps is the shortest possible path, at 10
      episodes it has no path at all, and from 25 episodes onward it walks exactly 8 steps,
      while mean episode length falls from 46.8 over the first ten episodes to 10.4 over the
      last ten. The same panel records the silent failure: letting NumPy's argmax break ties
      makes the greedy branch a constant action, and the same agent then reaches the goal 0
      times in 300 episodes without raising any warning. A caption beneath explains that the
      reward at the goal becomes a value for the square before it, and that value becomes one
      for the square before that, so the signal walks backwards through the grid -- and that
      until it arrives there is nothing to be greedy about, which is why the greedy policy has
      no path at 10 episodes. A prefers-reduced-motion block disables every ring animation and
      leaves all squares filled at rest, so the still frame carries every value, every count and
      every conclusion.
