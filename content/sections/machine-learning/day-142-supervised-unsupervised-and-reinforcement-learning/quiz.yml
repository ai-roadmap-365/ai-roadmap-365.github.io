questions:
  - question: >-
      A colleague clusters the 150 iris flowers into three groups with k-means, compares the cluster
      identifiers to the species codes, gets 0.24, and concludes the method failed. Their partition is
      in fact a reasonable one. What went wrong?
    options:
      - 'Nothing went wrong; 0.24 is a legitimate score and the clustering genuinely is poor'
      - 'The cluster identifiers are arbitrary, so comparing them directly to labels measures the numbering rather than the partition -- the same partition scores 0.8933 after the best relabelling'
      - 'Three clusters is the wrong choice for iris, and k should have been 2'
      - 'k-means needs a random_state, and without one the identifiers change between runs'
    answer_index: 1
    explanation: >-
      k-means numbers its clusters by where its centroids happened to land during a numerical
      optimisation, and those numbers have no relationship to the species codes. In this lesson the
      identical partition scores 0.2400 read literally and 0.8933333333333333 under the best relabelling
      -- 0.6533 of difference produced by a labelling convention alone. The missing random_state is a real
      concern, and is why every number here fixes it, but it is not the cause of this gap. Whether k
      should be 2 is a separate question the lesson also measures. And note the deeper problem: computing
      the 0.8933 requires labels the method does not have.
  - question: >-
      Why can the k-means inertia never be used to choose the number of clusters?
    options:
      - 'Because inertia is only defined for spherical clusters, and real clusters rarely are'
      - 'Because inertia is measured on the training data, so it is optimistically biased'
      - 'Because inertia falls monotonically in k as a matter of theorem -- the best solution at k plus one is never worse than at k -- so minimising it always answers one cluster per point'
      - 'Because inertia depends on feature scaling, and scaling is a choice'
    answer_index: 2
    explanation: >-
      Take any k-cluster solution and split one cluster; the result is a valid k-plus-one solution with an
      objective at least as good. So the minimum can only ever fall, on every dataset, forever. The
      measured curve in this lesson is 152.348, 78.851, 57.228, 46.446 and 39.040 for k from 2 to 6 --
      strictly decreasing, as it must be. That inertia assumes spherical clusters and that it moves with
      scaling are both true, and neither is the reason it cannot choose k. Elbow plots work around the
      monotonicity by asking a human to find a bend, which is a judgement rather than a computation.
  - question: >-
      Standardising the features before clustering iris moved the adjusted Rand index against the true
      species from 0.7302 down to 0.6201. What is the best explanation?
    options:
      - 'Standardising is a mistake in clustering and should be avoided'
      - 'The measurement is noise; with a different random_state the ordering would reverse'
      - 'Adjusted Rand index is the wrong metric here, and accuracy would have shown the opposite'
      - 'Iris''s four features are already comparable centimetre lengths, so standardising does not fix a scale problem -- it equalises the features, promoting the noisiest one to the same influence as the most discriminative'
    answer_index: 3
    explanation: >-
      Standardising exists to stop a feature measured in thousands from dominating one measured in tenths.
      Iris has no such problem: all four features are lengths in centimetres on comparable scales. What
      standardisation does instead is raise sepal width -- the least discriminative of the four -- to equal
      footing with petal length, which carries most of the separation. The right conclusion is not that
      standardising is a mistake; it remains a good default. It is that preprocessing is part of the
      definition of the structure you are looking for. And note the trap: you could only tell which was
      better by consulting labels that a real unsupervised problem does not have.
  - question: >-
      A greedy bandit agent -- always taking the action with the highest current estimate, never exploring
      -- takes the best of ten arms only 31.3 percent of the time. The implementation is correct. How?
    options:
      - 'Its first few pulls fix its estimates, and an arm that was unlucky on its only pull is never tried again -- so it locks on, and usually to the wrong arm'
      - 'The estimates are initialised to zero, which biases the agent toward arms with negative true means'
      - 'A thousand steps is too few for the estimates to converge; with more steps the greedy agent catches up'
      - 'Averaging over 200 independent problems introduces a bias against the greedy policy'
    answer_index: 0
    explanation: >-
      This is the exploration problem in its purest form. The agent does exactly what it was told; the
      trouble is that what it was told depends on estimates formed from almost no data, and it never
      collects more data about the alternatives. The tempting wrong answer is that more steps would fix
      it -- they would not, because the greedy agent will spend all of them on the same arm. Spending one
      pull in ten at random raises the optimal-action rate to 70.8 percent and mean reward by about 30
      percent, a gain of 0.3949 in optimal-action rate bought with a tenth of the budget.
  - question: >-
      A Q-learning agent on a five by five gridworld with reward only at the goal has, after ten episodes,
      ten of twenty-five states carrying a non-zero value -- yet its greedy policy still cannot reach the
      goal at all. Reconcile those two facts.
    options:
      - 'The learning rate is too low, so the values are non-zero but too small to act on'
      - 'Ten episodes is not enough for the Q-table to become consistent, so the values present are wrong'
      - 'The greedy policy is being evaluated with exploration switched off, which is the bug'
      - 'The value signal has not yet reached the start state, so at the start every action still looks equally good and there is nothing to be greedy about'
    answer_index: 3
    explanation: >-
      The reward propagates backwards exactly one state per episode at first: 1, 2, 3, 5 and 10 states
      valued after 1, 2, 3, 5 and 10 episodes. The square next to the goal learns from the goal, the
      square before it learns from that square, and nothing can skip ahead. Until the signal arrives where
      the agent starts, the greedy policy has no gradient to follow. At 25 episodes, with 18 states
      valued, the greedy policy walks the shortest 8-step path immediately. Evaluating with exploration
      switched off is the correct way to measure a policy, not a bug -- and an engineer who sees the flat
      curve at episode 10 and concludes the algorithm does not work is making exactly the mistake this
      question is about.
  - question: >-
      Two thousand rows of production decisions and their rewards, honestly logged by a working policy.
      Why is this not a supervised dataset?
    options:
      - 'The log records only what the policy chose, so information about the alternatives was never collected -- and the absence correlates precisely with what you want to know'
      - 'It is one; a logged action and its reward are exactly an input and a target'
      - 'The rewards are noisy, and supervised learning needs clean labels'
      - 'The rows are not independent, which violates the assumption behind supervised learning'
    answer_index: 0
    explanation: >-
      In this lesson''s measurement, an epsilon-greedy agent pulled its favourite arm 1813 of 2000 times,
      leaving 187 pulls for the other nine. With a greedy policy it is worse: four of eight logs contain
      exactly one arm, and five of eight name the wrong arm as best. No model, no feature engineering and
      no additional volume recovers rows that were never collected. The dependence between rows is a real
      concern and worth handling, but it is not the decisive objection -- the decisive one is that the
      data is absent rather than merely awkward.
  - question: >-
      In one logged bandit run, the truly best arm was pulled 1524 times and lost to an arm pulled 274
      times. Why did more data make the better arm lose?
    options:
      - 'The 274-pull arm improved over time, and the average across all pulls hid that'
      - 'The incremental-mean update weights early pulls too heavily, which penalises heavily-pulled arms'
      - 'The two arms'' true means were too close to distinguish, so the result is a coin flip and carries no lesson'
      - 'With 1524 samples the better arm''s estimate sits close to its true mean; with 274 samples the other arm''s estimate is free to wander, and an argmax over noisy estimates picks whichever is most inflated'
    answer_index: 3
    explanation: >-
      This is the winner''s curse. The best arm had true mean 0.9054 and read 0.8634; the runner-up had
      true mean 0.8216 and read 0.9262. Accuracy is precisely what cost the good arm the comparison -- it
      had no room left to be lucky. Calling it a coin flip is half right, in that the true means are
      close, but it misses the systematic direction: the bias favours thinly-sampled options every time,
      not at random. You will meet this again on Day 144 as model-selection bias, where the thing being
      argmaxed is a set of validation scores.
  - question: >-
      Your recommender changes what users click, and those clicks become your next training set. You have
      abundant labels. Which setting are you in?
    options:
      - 'A reinforcement setting -- most likely a contextual bandit -- because your actions determine your data, and that is the question that decides, regardless of how many labels you have'
      - 'Supervised, because you have labels; the feedback loop is a data-freshness problem to be handled by retraining'
      - 'Unsupervised, because the true relevance of an item is never observed'
      - 'None of the three; recommendation is a ranking problem and sits outside this taxonomy'
    answer_index: 0
    explanation: >-
      The ordering of the three diagnostic questions is the point. Most engineers ask about labels first,
      call it supervised, and then discover in production that their logs contain only items they already
      chose to show. Because feedback here is immediate, this is a contextual bandit rather than full
      sequential reinforcement learning -- a much more tractable setting, and where a great deal of
      industrial work actually lives. It still inherits the exploration requirement and the trap in the
      logs, which is why deliberately randomising a small fraction of decisions is standard practice.
