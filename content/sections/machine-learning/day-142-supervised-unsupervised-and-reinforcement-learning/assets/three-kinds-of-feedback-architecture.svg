<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="d142a-title d142a-desc" width="1000" height="640">
  <title id="d142a-title">The three learning settings are three shapes of feedback</title>
  <desc id="d142a-desc">Three columns, one per setting, each showing what the learner is told and what it is never told, above a shared note that the deciding question is whether the learner's actions change the data it sees next.</desc>
  <style>
    .d142a-bg { fill: #f8fafc; }
    .d142a-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; }
    .d142a-col-title { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; }
    .d142a-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d142a-strong { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d142a-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d142a-num { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
    .d142a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d142a-given { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .d142a-withheld { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; }
    .d142a-rule { stroke: #cbd5e1; stroke-width: 2; }
    .d142a-arrow { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .d142a-note { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
  </style>
  <rect class="d142a-bg" x="0" y="0" width="1000" height="640"/>
  <marker id="d142a-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
  </marker>

  <text class="d142a-title" x="500" y="40" text-anchor="middle">Three settings, three shapes of feedback</text>
  <text class="d142a-muted" x="500" y="66" text-anchor="middle">Solid blue is what the learner is told. Dashed grey is what it is never told.</text>

  <!-- Column 1: supervised -->
  <rect class="d142a-card" x="30" y="90" width="290" height="380" rx="10"/>
  <text class="d142a-col-title" x="175" y="122" text-anchor="middle">Supervised</text>
  <text class="d142a-muted" x="175" y="145" text-anchor="middle">instructive feedback</text>
  <rect class="d142a-given" x="55" y="165" width="240" height="120" rx="8"/>
  <text class="d142a-strong" x="175" y="192" text-anchor="middle">told: the correct output</text>
  <text class="d142a-label" x="175" y="216" text-anchor="middle">for every single input</text>
  <text class="d142a-muted" x="175" y="240" text-anchor="middle">error is defined per example,</text>
  <text class="d142a-muted" x="175" y="260" text-anchor="middle">so it can be reduced directly</text>
  <rect class="d142a-withheld" x="55" y="305" width="240" height="80" rx="8"/>
  <text class="d142a-label" x="175" y="333" text-anchor="middle">withheld: nothing</text>
  <text class="d142a-muted" x="175" y="357" text-anchor="middle">you were handed the answer key</text>
  <line class="d142a-rule" x1="55" y1="405" x2="295" y2="405"/>
  <text class="d142a-num" x="175" y="432" text-anchor="middle">5-NN on iris: 0.92</text>
  <text class="d142a-muted" x="175" y="454" text-anchor="middle">all 100 training rows carry an answer</text>

  <!-- Column 2: unsupervised -->
  <rect class="d142a-card" x="355" y="90" width="290" height="380" rx="10"/>
  <text class="d142a-col-title" x="500" y="122" text-anchor="middle">Unsupervised</text>
  <text class="d142a-muted" x="500" y="145" text-anchor="middle">no feedback at all</text>
  <rect class="d142a-given" x="380" y="165" width="240" height="120" rx="8"/>
  <text class="d142a-strong" x="500" y="192" text-anchor="middle">told: the inputs</text>
  <text class="d142a-label" x="500" y="216" text-anchor="middle">and nothing else</text>
  <text class="d142a-muted" x="500" y="240" text-anchor="middle">structure can be found,</text>
  <text class="d142a-muted" x="500" y="260" text-anchor="middle">but structure is not unique</text>
  <rect class="d142a-withheld" x="380" y="305" width="240" height="80" rx="8"/>
  <text class="d142a-label" x="500" y="333" text-anchor="middle">withheld: whether it is right</text>
  <text class="d142a-muted" x="500" y="357" text-anchor="middle">there is no correct answer to check</text>
  <line class="d142a-rule" x1="380" y1="405" x2="620" y2="405"/>
  <text class="d142a-num" x="500" y="432" text-anchor="middle">k-means on iris: 0.24 or 0.8933</text>
  <text class="d142a-muted" x="500" y="454" text-anchor="middle">same partition, different numbering</text>

  <!-- Column 3: reinforcement -->
  <rect class="d142a-card" x="680" y="90" width="290" height="380" rx="10"/>
  <text class="d142a-col-title" x="825" y="122" text-anchor="middle">Reinforcement</text>
  <text class="d142a-muted" x="825" y="145" text-anchor="middle">evaluative, often delayed</text>
  <rect class="d142a-given" x="705" y="165" width="240" height="120" rx="8"/>
  <text class="d142a-strong" x="825" y="192" text-anchor="middle">told: a score for what</text>
  <text class="d142a-strong" x="825" y="212" text-anchor="middle">you actually did</text>
  <text class="d142a-muted" x="825" y="240" text-anchor="middle">one number, for one action,</text>
  <text class="d142a-muted" x="825" y="260" text-anchor="middle">sometimes much later</text>
  <rect class="d142a-withheld" x="705" y="305" width="240" height="80" rx="8"/>
  <text class="d142a-label" x="825" y="333" text-anchor="middle">withheld: the counterfactual</text>
  <text class="d142a-muted" x="825" y="357" text-anchor="middle">what the other actions would have paid</text>
  <line class="d142a-rule" x1="705" y1="405" x2="945" y2="405"/>
  <text class="d142a-num" x="825" y="432" text-anchor="middle">greedy 0.313, epsilon 0.1 gives 0.708</text>
  <text class="d142a-muted" x="825" y="454" text-anchor="middle">the price of never finding out</text>

  <!-- the deciding question -->
  <path class="d142a-arrow" d="M 175 470 L 175 505 L 500 505" marker-end="url(#d142a-arrowhead)"/>
  <path class="d142a-arrow" d="M 500 470 L 500 505"/>
  <path class="d142a-arrow" d="M 825 470 L 825 505 L 500 505"/>
  <rect class="d142a-note" x="120" y="530" width="760" height="86" rx="10"/>
  <text class="d142a-strong" x="500" y="562" text-anchor="middle">The question that decides the most is not whether you have labels.</text>
  <text class="d142a-label" x="500" y="588" text-anchor="middle">It is whether the learner's own actions change the data it sees next. If they do, the setting is</text>
  <text class="d142a-label" x="500" y="608" text-anchor="middle">reinforcement learning however many labels you have, because your log records only what you chose.</text>
</svg>
