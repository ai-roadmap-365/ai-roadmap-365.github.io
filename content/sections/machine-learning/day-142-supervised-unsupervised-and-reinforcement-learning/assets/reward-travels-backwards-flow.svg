<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="d142f-title d142f-desc" width="1000" height="720">
  <title id="d142f-title">A terminal-only reward travels backwards one state per episode</title>
  <desc id="d142f-desc">A five by five grid whose only reward is at the bottom-right goal, filled with the state values a tabular Q-learning agent actually learned after three hundred episodes. Squares light up outward from the goal in the order the reward reached them. Three squares stay at zero. Measured counts and policy lengths are listed in panels on either side.</desc>
  <style>
    .d142f-bg { fill: #f8fafc; }
    .d142f-title { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 25px; font-weight: 700; }
    .d142f-head { fill: #1d4ed8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; }
    .d142f-label { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    .d142f-muted { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d142f-cellText { fill: #1a202c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; }
    .d142f-cellNote { fill: #475569; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .d142f-cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d142f-start { fill: #ffffff; stroke: #1a202c; stroke-width: 3; }
    .d142f-goal { fill: #1d4ed8; stroke: #1d4ed8; stroke-width: 2; }
    .d142f-wash { fill: #bfdbfe; stroke: #1d4ed8; stroke-width: 2; opacity: 0.85; }
    .d142f-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .d142f-key { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; }
    .d142f-ring1 { animation: d142f-fill 7s linear 0.0s infinite; }
    .d142f-ring2 { animation: d142f-fill 7s linear 0.8s infinite; }
    .d142f-ring3 { animation: d142f-fill 7s linear 1.6s infinite; }
    .d142f-ring4 { animation: d142f-fill 7s linear 2.4s infinite; }
    .d142f-ring5 { animation: d142f-fill 7s linear 3.2s infinite; }
    .d142f-ring6 { animation: d142f-fill 7s linear 4.0s infinite; }
    .d142f-ring7 { animation: d142f-fill 7s linear 4.8s infinite; }
    .d142f-ring8 { animation: d142f-fill 7s linear 5.6s infinite; }
    @keyframes d142f-fill {
      0%   { opacity: 0; }
      7%   { opacity: 0.85; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d142f-ring1 { animation: none; opacity: 0.85; }
      .d142f-ring2 { animation: none; opacity: 0.85; }
      .d142f-ring3 { animation: none; opacity: 0.85; }
      .d142f-ring4 { animation: none; opacity: 0.85; }
      .d142f-ring5 { animation: none; opacity: 0.85; }
      .d142f-ring6 { animation: none; opacity: 0.85; }
      .d142f-ring7 { animation: none; opacity: 0.85; }
      .d142f-ring8 { animation: none; opacity: 0.85; }
    }
  </style>
  <rect class="d142f-bg" x="0" y="0" width="1000" height="720"/>

  <text class="d142f-title" x="500" y="42" text-anchor="middle">Credit assignment, counted</text>
  <text class="d142f-muted" x="500" y="68" text-anchor="middle">The only reward in this world sits at the goal. Every other step pays exactly nothing.</text>
  <text class="d142f-muted" x="500" y="94" text-anchor="middle">These are the state values a tabular Q-learning agent actually learned in 300 episodes.</text>

  <rect class="d142f-start" x="300" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="378" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="456" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="534" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="612" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="300" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="378" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="456" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="534" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="612" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="300" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="378" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="456" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="534" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="612" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="300" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="378" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="456" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="534" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="612" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="300" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="378" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="456" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-cell" x="534" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-goal" x="612" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring8" x="300" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring7" x="378" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring6" x="456" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring5" x="534" y="130" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring7" x="300" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring6" x="378" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring5" x="456" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring4" x="534" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring3" x="612" y="208" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring6" x="300" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring5" x="378" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring4" x="456" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring3" x="534" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring2" x="612" y="286" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring5" x="300" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring4" x="378" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring3" x="456" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring2" x="534" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring1" x="612" y="364" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring3" x="378" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring2" x="456" y="442" width="72" height="72" rx="6"/>
  <rect class="d142f-wash d142f-ring1" x="534" y="442" width="72" height="72" rx="6"/>
  <text class="d142f-cellNote" x="336" y="158" text-anchor="middle">start</text>
  <text class="d142f-cellText" x="336" y="180" text-anchor="middle">0.70</text>
  <text class="d142f-cellText" x="414" y="172" text-anchor="middle">0.74</text>
  <text class="d142f-cellText" x="492" y="172" text-anchor="middle">0.70</text>
  <text class="d142f-cellText" x="570" y="172" text-anchor="middle">0.77</text>
  <text class="d142f-cellNote" x="648" y="172" text-anchor="middle">0.00</text>
  <text class="d142f-cellText" x="336" y="250" text-anchor="middle">0.74</text>
  <text class="d142f-cellText" x="414" y="250" text-anchor="middle">0.77</text>
  <text class="d142f-cellText" x="492" y="250" text-anchor="middle">0.81</text>
  <text class="d142f-cellText" x="570" y="250" text-anchor="middle">0.86</text>
  <text class="d142f-cellText" x="648" y="250" text-anchor="middle">0.90</text>
  <text class="d142f-cellText" x="336" y="328" text-anchor="middle">0.77</text>
  <text class="d142f-cellText" x="414" y="328" text-anchor="middle">0.81</text>
  <text class="d142f-cellText" x="492" y="328" text-anchor="middle">0.86</text>
  <text class="d142f-cellText" x="570" y="328" text-anchor="middle">0.89</text>
  <text class="d142f-cellText" x="648" y="328" text-anchor="middle">0.95</text>
  <text class="d142f-cellText" x="336" y="406" text-anchor="middle">0.56</text>
  <text class="d142f-cellText" x="414" y="406" text-anchor="middle">0.86</text>
  <text class="d142f-cellText" x="492" y="406" text-anchor="middle">0.90</text>
  <text class="d142f-cellText" x="570" y="406" text-anchor="middle">0.95</text>
  <text class="d142f-cellText" x="648" y="406" text-anchor="middle">1.00</text>
  <text class="d142f-cellNote" x="336" y="484" text-anchor="middle">0.00</text>
  <text class="d142f-cellText" x="414" y="484" text-anchor="middle">0.67</text>
  <text class="d142f-cellText" x="492" y="484" text-anchor="middle">0.95</text>
  <text class="d142f-cellText" x="570" y="484" text-anchor="middle">1.00</text>
  <text class="d142f-cellText" x="648" y="474" text-anchor="middle" fill="#ffffff">goal</text>
  <text class="d142f-cellNote" x="648" y="494" text-anchor="middle" fill="#ffffff">pays +1</text>

  <rect class="d142f-panel" x="30" y="120" width="240" height="400" rx="10"/>
  <text class="d142f-head" x="150" y="150" text-anchor="middle">states carrying value</text>
  <text class="d142f-muted" x="150" y="171" text-anchor="middle">measured, out of 25</text>
  <text class="d142f-label" x="60" y="203">after   1 episode</text><text class="d142f-label" x="240" y="203" text-anchor="end">1</text>
  <text class="d142f-label" x="60" y="228">after   2 episodes</text><text class="d142f-label" x="240" y="228" text-anchor="end">2</text>
  <text class="d142f-label" x="60" y="253">after   3 episodes</text><text class="d142f-label" x="240" y="253" text-anchor="end">3</text>
  <text class="d142f-label" x="60" y="278">after   5 episodes</text><text class="d142f-label" x="240" y="278" text-anchor="end">5</text>
  <text class="d142f-label" x="60" y="303">after  10 episodes</text><text class="d142f-label" x="240" y="303" text-anchor="end">10</text>
  <text class="d142f-label" x="60" y="328">after  25 episodes</text><text class="d142f-label" x="240" y="328" text-anchor="end">18</text>
  <text class="d142f-label" x="60" y="353">after  50 episodes</text><text class="d142f-label" x="240" y="353" text-anchor="end">20</text>
  <text class="d142f-label" x="60" y="378">after 100 episodes</text><text class="d142f-label" x="240" y="378" text-anchor="end">21</text>
  <text class="d142f-label" x="60" y="403">after 300 episodes</text><text class="d142f-label" x="240" y="403" text-anchor="end">22</text>
  <text class="d142f-muted" x="150" y="437" text-anchor="middle">exactly one new state per</text>
  <text class="d142f-muted" x="150" y="456" text-anchor="middle">episode, for the first ten</text>
  <text class="d142f-muted" x="150" y="482" text-anchor="middle">the goal stays at 0.00: the</text>
  <text class="d142f-muted" x="150" y="501" text-anchor="middle">episode ends before it updates</text>

  <rect class="d142f-panel" x="730" y="120" width="240" height="400" rx="10"/>
  <text class="d142f-head" x="850" y="150" text-anchor="middle">greedy policy</text>
  <text class="d142f-muted" x="850" y="171" text-anchor="middle">exploration switched off</text>
  <text class="d142f-label" x="760" y="205">shortest possible</text><text class="d142f-label" x="940" y="205" text-anchor="end">8 steps</text>
  <text class="d142f-label" x="760" y="235">at 10 episodes</text><text class="d142f-label" x="940" y="235" text-anchor="end">no path</text>
  <text class="d142f-label" x="760" y="265">at 25 episodes</text><text class="d142f-label" x="940" y="265" text-anchor="end">8 steps</text>
  <text class="d142f-label" x="760" y="295">at 300 episodes</text><text class="d142f-label" x="940" y="295" text-anchor="end">8 steps</text>
  <text class="d142f-muted" x="850" y="330" text-anchor="middle">episode length falls from a</text>
  <text class="d142f-muted" x="850" y="349" text-anchor="middle">46.8 mean over the first ten</text>
  <text class="d142f-muted" x="850" y="368" text-anchor="middle">to 10.4 over the last ten</text>
  <text class="d142f-head" x="850" y="404" text-anchor="middle">the silent failure</text>
  <text class="d142f-muted" x="850" y="428" text-anchor="middle">let numpy argmax break ties</text>
  <text class="d142f-muted" x="850" y="447" text-anchor="middle">and the greedy branch becomes</text>
  <text class="d142f-muted" x="850" y="466" text-anchor="middle">a constant. The same agent then</text>
  <text class="d142f-muted" x="850" y="485" text-anchor="middle">reaches the goal 0 times in 300,</text>
  <text class="d142f-muted" x="850" y="504" text-anchor="middle">and never raises a warning.</text>

  <rect class="d142f-key" x="120" y="560" width="760" height="130" rx="10"/>
  <text class="d142f-label" x="500" y="592" text-anchor="middle">Nobody ever tells this agent which action was correct. The reward at the goal becomes a value for the square</text>
  <text class="d142f-label" x="500" y="616" text-anchor="middle">before it, that value becomes one for the square before that, and the signal walks backwards through the grid.</text>
  <text class="d142f-label" x="500" y="640" text-anchor="middle">Until it arrives there is nothing to be greedy about, which is why the greedy policy has no path at 10 episodes.</text>
  <text class="d142f-muted" x="500" y="668" text-anchor="middle">With motion switched off, every square is already filled and every measured number is already printed.</text>
</svg>
