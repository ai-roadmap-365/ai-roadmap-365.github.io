<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>The price of not exploring</title>
  <style>
    .exploration-price-bg   { fill: #f8fafc; }
    .exploration-price-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exploration-price-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exploration-price-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exploration-price-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exploration-price-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .exploration-price-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .exploration-price-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .exploration-price-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .exploration-price-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .exploration-price-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .exploration-price-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .exploration-price-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .exploration-price-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .exploration-price-stage { opacity: 1; }

    .exploration-price-s0 { animation-delay: 0.00s; }
    .exploration-price-e0 { animation-delay: 0.00s; }
    .exploration-price-s1 { animation-delay: 1.28s; }
    .exploration-price-e1 { animation-delay: 1.28s; }
    .exploration-price-s2 { animation-delay: 2.56s; }
    .exploration-price-e2 { animation-delay: 2.56s; }
    .exploration-price-s3 { animation-delay: 3.84s; }
    .exploration-price-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .exploration-price-conn  { animation: exploration-price-trace 6.4s ease-in-out infinite; }
      .exploration-price-stage { animation: exploration-price-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes exploration-price-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes exploration-price-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .exploration-price-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .exploration-price-stage { animation: exploration-price-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes exploration-price-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="exploration-price-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="exploration-price-bg" width="980" height="322"/>
  <text class="exploration-price-h1"  x="30" y="40">The price of not exploring</text>
  <text class="exploration-price-sub" x="30" y="64">Four steps.</text>
  <g class="exploration-price-stage exploration-price-s0">
    <rect class="exploration-price-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="exploration-price-step" x="44" y="142">01</text>
    <text class="exploration-price-name" x="70" y="142">Evaluative feedback says how good, not what was best</text>
    <text class="exploration-price-desc" x="44" y="166">So other options remain</text>
    <text class="exploration-price-desc" x="44" y="182">unmeasured.</text>
  </g>
  <line class="exploration-price-line exploration-price-conn exploration-price-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#exploration-price-tip)"/>
  <g class="exploration-price-stage exploration-price-s1">
    <rect class="exploration-price-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="exploration-price-step" x="280" y="142">02</text>
    <text class="exploration-price-name" x="306" y="142">An early lucky result makes one option look best</text>
    <text class="exploration-price-desc" x="280" y="166">On very little evidence.</text>
  </g>
  <line class="exploration-price-line exploration-price-conn exploration-price-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#exploration-price-tip)"/>
  <g class="exploration-price-stage exploration-price-s2">
    <rect class="exploration-price-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="exploration-price-step" x="516" y="142">03</text>
    <text class="exploration-price-name" x="542" y="142">So a greedy agent keeps choosing it and never learns otherwise</text>
    <text class="exploration-price-desc" x="516" y="166">The better option is never</text>
    <text class="exploration-price-desc" x="516" y="182">sampled.</text>
  </g>
  <line class="exploration-price-line exploration-price-conn exploration-price-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#exploration-price-tip)"/>
  <g class="exploration-price-stage exploration-price-s3">
    <rect class="exploration-price-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="exploration-price-step" x="752" y="142">04</text>
    <text class="exploration-price-name" x="778" y="142">Which is why deliberate exploration is required</text>
    <text class="exploration-price-desc" x="752" y="166">And its cost is measurable.</text>
  </g>
  <text class="exploration-price-sub" x="30" y="304">The lock-in is self-reinforcing rather than merely unlucky, which is why exploration has to be built in rather than left to chance.</text>
</svg>
