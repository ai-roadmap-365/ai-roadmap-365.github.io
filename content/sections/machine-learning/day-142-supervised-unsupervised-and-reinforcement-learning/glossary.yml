terms:
  - term: Instructive feedback
    definition: >-
      Feedback that names the correct answer, independent of what you did. This is what supervised
      learning receives, and it is why the error on a training example is computable by subtraction --
      which in turn is why gradient descent and every evaluation habit built on it are available.
  - term: Evaluative feedback
    definition: >-
      Feedback that scores the action you actually took, and says nothing about the alternatives. This is
      what reinforcement learning receives. It is not weakened supervision but a different kind of
      information, and the difference has a measurable price: a bandit agent that never explores takes the
      best of ten actions 31.3 percent of the time against 70.8 for one that does.
  - term: Supervised learning
    definition: >-
      The setting in which every input arrives with its correct output attached. Defined by the
      information available, not by the algorithm used -- a neural network, a decision tree and a
      nearest-neighbour lookup are all supervised when handed labelled pairs.
  - term: Unsupervised learning
    definition: >-
      The setting in which only inputs are available and no target exists. Because no error is computable,
      every evaluation is a proxy for a judgement somebody has to make and own -- which is the setting's
      real difficulty, and it is not a computational one.
  - term: Reinforcement learning
    definition: >-
      The setting in which a learner chooses actions, receives evaluative rewards, and -- decisively --
      influences what data it will see next. That last property is what makes a problem reinforcement
      learning even when labels are abundant, because the resulting log records only what was chosen.
  - term: Cluster identifier
    definition: >-
      The integer a clustering algorithm writes on each group. It is determined by the algorithm's
      internal bookkeeping and carries no relationship to any external class code. Comparing identifiers
      to labels directly is what turns a partition worth 0.8933 into a reported 0.24.
  - term: Inertia
    definition: >-
      The k-means objective: the total squared distance from each point to its assigned centroid. It falls
      monotonically as k increases -- provably, because any k-cluster solution can be split into a valid
      k-plus-one solution that is no worse -- so minimising it always answers one cluster per point.
  - term: Silhouette score
    definition: >-
      An internal clustering criterion comparing each point's distance to its own cluster against its
      distance to the nearest other cluster. It measures separation and says so honestly. On iris it picks
      k equals 2, for a dataset with three species, because two of those species overlap.
  - term: Adjusted Rand index
    definition: >-
      An external criterion measuring agreement between two partitions while ignoring their labelling,
      corrected so that a random partition scores about zero. Available only when you have the labels the
      unsupervised method does not, which is why it is a diagnostic tool rather than a selection tool.
  - term: Multi-armed bandit
    definition: >-
      The smallest honest reinforcement problem: several actions, each paying from an unknown
      distribution, and a fixed budget of pulls. There are no states, so credit assignment does not arise
      and the exploration-exploitation trade-off can be studied on its own.
  - term: Epsilon-greedy
    definition: >-
      A policy that takes the currently best-looking action with probability one minus epsilon and a
      uniformly random action otherwise. Crude, and hard to beat as a baseline: at epsilon 0.1 it more
      than doubles a greedy agent's optimal-action rate for a tenth of the budget.
  - term: Exploration-exploitation trade-off
    definition: >-
      The tension between taking the action that currently looks best and taking one that would tell you
      more. It exists only under evaluative feedback -- a supervised learner is handed every label whether
      it asked for the example or not.
  - term: Credit assignment
    definition: >-
      The problem of deciding which of many earlier decisions earned a later reward. In this lesson it is
      made countable: with a reward only at the goal, the value signal reaches exactly one new gridworld
      state per episode for the first ten episodes.
  - term: Q-learning
    definition: >-
      A tabular reinforcement algorithm that stores an estimated value for every state-action pair and
      updates each toward the reward plus the discounted best value of where it landed. That bootstrap is
      the mechanism by which a terminal reward walks backwards through a world.
  - term: Winner's curse
    definition: >-
      The systematic optimism of an argmax taken over noisy estimates. Whichever option is most inflated
      wins, and thinly-sampled options have the most room to inflate -- which is how an arm with 274 pulls
      beat one with 1524. The same effect appears in model selection on Day 144.
  - term: Logged policy data
    definition: >-
      A record of the actions a policy took and the rewards they earned. It is not a supervised dataset,
      because the alternatives were never observed and the missing rows correlate exactly with the
      question you want answered.
  - term: Semi-supervised learning
    definition: >-
      Learning from a small labelled set alongside a large unlabelled one. Not a fourth setting but a
      practical response to label cost: clustering the unlabelled data and labelling one representative
      per cluster scored 0.876 on iris against 0.6455 for three labels chosen at random.
  - term: Self-supervised learning
    definition: >-
      Supervised learning in which the target is manufactured from the input itself -- next-token
      prediction being the case that matters most. Mechanically it is ordinary supervised learning; what
      changes is that the labels are free, which changes the economics completely.
  - term: Contextual bandit
    definition: >-
      A reinforcement setting with state and immediate feedback but no long-horizon credit assignment.
      Much more tractable than full sequential reinforcement learning, and where most industrial
      decision-making problems actually live.
  - term: Argmax tie-breaking
    definition: >-
      What an implementation does when several options share the maximum value. NumPy's argmax returns the
      lowest such index, which on an all-zero value table makes a greedy policy a constant action -- and
      an agent that reaches its goal 0 times in 300 episodes with no error raised.
