questions:
  - question: >-
      A grid search over sum((v - c)^2) for the values [2.0, 3.0, 5.0, 7.0, 100.0] lands at 23.39975.
      The true mean is 23.4. What does this experiment actually demonstrate?
    options:
      - 'That the grid needed to be finer to find the exact minimiser'
      - 'That the grid search has a bug, since the mean should not depend on a single value like 100.0'
      - 'That squared error is the wrong loss to use whenever an outlier is present'
      - 'The mean IS the minimiser of squared error'
    answer_index: 3
    explanation: >-
      The mean is not a natural summary that squared error happens to agree with -- it is the exact
      quantity you get by setting the derivative of sum-of-squares to zero and solving. The grid
      search finds this without ever computing an average, which is the point: it is discovering the
      mean, not confirming a formula. The mean genuinely IS pulled toward 100.0 (that is squared
      error's known property, not a bug), and while a finer grid gets closer to 23.4 exactly, the
      0.00025 gap here is expected grid resolution, not evidence of anything broken.
  - question: >-
      Sweeping a candidate slope produces a squared-error curve whose second differences have
      standard deviation 0.000000, and an absolute-error curve whose second differences have
      standard deviation 1.9366. What does that contrast explain?
    options:
      - 'Squared error is a smooth parabola; absolute error has kinks'
      - 'That squared error is more accurate than absolute error at finding the true slope'
      - 'That absolute error is a buggier implementation than squared error in this library'
      - 'Nothing about the fitting itself -- second differences are only a numerical curiosity'
    answer_index: 0
    explanation: >-
      A constant second difference is the numerical signature of a parabola -- one smooth minimum,
      differentiable everywhere. A varying second difference means the curve is a sequence of
      straight segments meeting at kinks, which is what absolute error's landscape actually looks
      like. This directly explains the normal equations: they exist because squared error's
      derivative is defined everywhere and can be set to zero and solved, which is not available for
      a function with a corner. Neither curve says anything about which loss finds a more "accurate"
      slope on this particular dataset -- both landscapes were minimised at the identical slope here.
  - question: >-
      Moving one point 80 units off a fitted line moves an ordinary-least-squares slope by 0.7545, a
      Huber fit's slope by 0.0437, and a median-regression fit's slope by 0.0104. What is the
      mechanism behind that seventeen-to-seventy-two-times difference?
    options:
      - 'HuberRegressor and QuantileRegressor use a different, more accurate optimizer than LinearRegression'
      - 'Squaring 80 makes it contribute 6,400, distorting the fit'
      - 'The three estimators were fit on different subsets of the same data'
      - 'LinearRegression has a bug that the other two estimators do not share'
    answer_index: 1
    explanation: >-
      All three estimators are fit on the identical sixty rows, including the identical moved point,
      so neither differing data nor differing optimizer quality is the explanation. The mechanism is
      arithmetic: squaring turns a residual of 80 into a term of 6,400 in the total loss, so
      minimising that total means trading away a great deal of fit elsewhere to shrink the one huge
      squared term. Absolute error keeps that same residual's contribution at 80 -- proportional, not
      squared -- and Huber caps a large residual's contribution once it passes its threshold,
      whichever regime it uses.
  - question: >-
      Huber's epsilon parameter is swept from 1.0 to 100.0 on outlier-contaminated data and the fitted
      slope climbs smoothly from 3.0064 to 3.8010, landing exactly on the plain-least-squares answer
      at the high end. What does that describe?
    options:
      - 'A bug: HuberRegressor should never reproduce LinearRegression exactly'
      - 'Epsilon controls how many iterations the solver runs, which happens to correlate with the slope'
      - 'Raising the threshold hands more of the loss to squared error'
      - 'The outlier stopped affecting the fit once epsilon passed a certain value'
    answer_index: 2
    explanation: >-
      As epsilon grows, fewer and fewer residuals exceed the threshold, so more and more of the loss
      behaves like squared error -- and in the limit, every residual falls inside the threshold and
      Huber's loss becomes squared error exactly, which is why the sweep converges precisely to the
      OLS slope rather than merely approaching it. This is a genuine one-parameter family, not two
      discrete behaviours with a cutover, and the outlier is never excluded -- it is just weighted
      less severely as epsilon shrinks.
  - question: >-
      The Gauss-Markov theorem says ordinary least squares is the "best linear unbiased estimator."
      Which reading of that phrase is correct?
    options:
      - 'OLS is unbiased, and separately, it happens to also be the fastest algorithm to compute'
      - "'Best' means OLS achieves zero variance under its assumptions"
      - 'OLS has the lowest possible error of any estimator, linear or not, under any error distribution'
      - 'Among linear unbiased estimators, OLS has the lowest variance'
    answer_index: 3
    explanation: >-
      Every qualifying word restricts the claim: LINEAR excludes anything like Huber that is not a
      simple linear combination of y; UNBIASED excludes estimators that trade some bias for lower
      variance; and the whole statement is conditional on Gauss-Markov's assumptions about the
      errors. It is not a claim that OLS beats every possible estimator, and it says nothing about
      what happens once those assumptions are violated -- which is exactly what the heavy-tailed
      experiment in this lesson tests.
  - question: >-
      Over 500 replications with a true slope of 3.0, Gaussian errors give OLS a standard deviation of
      0.0560 against Huber's 0.0588, while heavy-tailed errors give OLS 0.0589 against Huber's 0.0422.
      Both estimators' means stay within 0.01 of 3.0 in both settings. What is the correct conclusion?
    options:
      - 'The ranking that changes is precision, not correctness'
      - "Huber is unbiased and OLS is biased under heavy-tailed errors"
      - 'The results are contradictory and one of the two experiments must contain an error'
      - 'Huber should always be preferred, since it is closer to OLS under Gaussian errors and better under heavy-tailed errors'
    answer_index: 0
    explanation: >-
      Both means staying within 0.01 of 3.0 in both settings is the evidence that bias is not what
      changed -- both estimators track the truth on average, in both error regimes. What changed is
      the spread: OLS's standard deviation is smaller under Gaussian errors (Gauss-Markov's promise
      holding), and Huber's is smaller under heavy-tailed errors (Gauss-Markov's promise no longer
      applying, since its assumptions were violated). The two results are not contradictory; they are
      the same experiment measuring the same conditional claim under two different conditions. And
      "always prefer Huber" ignores that it lost the Gaussian comparison.
  - question: >-
      This lesson repeatedly measures a "loss," while a later day covers "metrics." What is the
      distinction, stated precisely?
    options:
      - 'A loss applies only to regression, and a metric applies only to classification'
      - 'A loss is optimised; a metric is reported, and they can differ'
      - 'A metric is always a rescaled version of the loss the model was fit with'
      - "A loss and a metric are two names for the same idea, used interchangeably by convention"
    answer_index: 1
    explanation: >-
      They serve different jobs and can diverge freely: a model fit by minimising squared error is
      routinely reported using mean absolute error or R squared, and a model fit with Huber loss can
      be reported with root mean squared error. Neither is restricted to one task type -- absolute
      and squared losses both apply to regression here, and classification has its own losses and
      metrics that follow the identical split. Treating them as interchangeable, or assuming the
      report is always a rescaling of the objective, misses why the two exist as separate concepts.
  - question: >-
      Before building any exercise on HuberRegressor and QuantileRegressor, this lab's author checked
      that both estimators exist and converge without warning in the pinned scikit-learn release. Why
      does that check matter, as a matter of intellectual honesty rather than mere caution?
    options:
      - 'It matters only for performance reasons, not correctness'
      - "It doesn't matter much -- any reasonably recent scikit-learn version supports every estimator ever documented"
      - 'Assuming a tool''s behaviour instead of verifying it'
      - 'It was unnecessary, since QuantileRegressor has been part of scikit-learn since its very first release'
    answer_index: 2
    explanation: >-
      Estimator APIs, defaults and even availability change between scikit-learn releases --
      QuantileRegressor is a comparatively recent addition, and solver defaults have changed across
      versions. Writing an exercise around behavior that was never actually run against the pinned
      version would be exactly the fabricated-output problem this course is built against, just
      relocated from a data claim to a tool claim. The fix is the same either way: run it, watch it
      converge, and only then build on it.
