visuals:
  - id: loss-landscape-architecture
    file: assets/loss-landscape-architecture.svg
    type: diagram
    title: >-
      Two loss landscapes, one outlier, and what Gauss-Markov actually promises
    alt: >-
      Diagram: two side-by-side loss-landscape panels. The left panel shows squared error as a smooth
      parabola with one minimum at slope 3.0, its second differences constant at 0.000000. The right
      panel shows absolute error as a piecewise-linear, kinked curve also minimised at slope 3.0, its
      second differences varying with a standard deviation of 1.9366. Below both, a note states that
      the normal equations solve squared error directly, matching LinearRegression to within 1e-14,
      while absolute error has no equivalent closed form because it has no derivative at a residual
      of zero. Beneath that, three horizontal bars show how far each estimator's slope moved when one
      point was pushed 80 units off the line: ordinary least squares moved 0.7545, Huber regression
      moved 0.0437, seventeen times less, and median regression moved 0.0104, seventy-two times less.
      A final panel states the Gauss-Markov theorem precisely -- OLS is the best linear unbiased
      estimator, conditional on the errors -- and shows two measured boxes: under Gaussian errors
      OLS's standard deviation is 0.0560 against Huber's 0.0588, a ratio of 0.9524 favouring OLS,
      while under heavy-tailed errors OLS's standard deviation is 0.0589 against Huber's 0.0422, a
      ratio of 1.3957 favouring Huber. A closing note says the ranking flips with the errors, but bias
      never does
    description: >-
      A static architecture diagram in three vertically stacked sections. The top section holds two
      loss-landscape panels side by side: the left panel plots squared error as a smooth parabola with
      a single marked minimum at slope 3.0, annotated with its constant second differences; the right
      panel plots absolute error as a piecewise-linear curve with visible kinks, also minimised at
      slope 3.0, annotated with its varying second differences. A wide panel beneath both states that
      squared error's smoothness gives it the closed-form normal equations, quotes the matching slope
      to many decimal places against LinearRegression, and states plainly that absolute error has no
      equivalent because its derivative does not exist at a residual of zero. The middle section is a
      small horizontal bar chart with three bars of dramatically different lengths, one per estimator,
      each labelled with the exact slope movement caused by moving one point 80 units off the fitted
      line, and the ratio by which the smaller two undercut the first. The bottom section is a shaded
      panel stating the Gauss-Markov theorem's exact wording -- best linear unbiased estimator -- and
      containing two measured sub-panels, one for Gaussian errors and one for heavy-tailed errors,
      each giving both estimators' standard deviations from 500 replications and the ratio between
      them, with the winning estimator named in each case.
  - id: huber-epsilon-sweep-flow
    file: assets/huber-epsilon-sweep-flow.svg
    type: flow-animated
    title: >-
      Huber's epsilon sweeping from absolute-error-like toward the exact least-squares answer
    alt: >-
      Diagram: a bar chart with one bar per value of Huber's epsilon parameter, at 1.0, 1.35, 1.5,
      2.0, 5.0, 20 and 100, on data where a single point has been moved 80 units off the line. The
      bars climb steadily from a fitted slope of 3.0064 at epsilon 1.0 through 3.0308, 3.0505, 3.0906
      and 3.1511, reaching 3.8010 at both epsilon 20 and epsilon 100 and landing exactly on a dashed
      reference line marking the plain least-squares slope on the same contaminated data. A caption
      explains that small epsilon leans on absolute error and barely reacts to the outlier, large
      epsilon leans on squared error and reacts fully, and the climb is continuous rather than a
      switch between two modes
    description: >-
      An animated bar chart with seven bars, one per value of Huber's epsilon parameter tested: 1.0,
      1.35, 1.5, 2.0, 5.0, 20 and 100. Each bar's height is the fitted slope at that epsilon on a
      60-row dataset where one point has been moved 80 units off the line, with the exact value
      printed above the bar. The bars climb steadily from 3.0064 at the smallest epsilon to 3.8010 at
      the two largest, where they land exactly on a dashed horizontal reference line marking the slope
      of a plain least-squares fit on the identical contaminated data. The animation reveals the seven
      bars left to right, roughly one every half second on a seven-second loop, so the climb toward
      the reference line is visible as motion; each bar, once revealed, stays at full opacity for the
      rest of the cycle. A legend names the bars as the fitted slope at each epsilon. A caption beneath
      explains that small epsilon leans on absolute error and barely reacts to the outlier, large
      epsilon leans on squared error and reacts fully, the climb is continuous rather than a switch
      between two modes, and the two largest bars landing exactly on the reference line confirms that
      Huber's loss becomes squared error exactly once every residual falls inside its threshold. A
      prefers-reduced-motion block disables every reveal and leaves all bars and all printed values in
      their final positions, so the still frame carries the entire result.
