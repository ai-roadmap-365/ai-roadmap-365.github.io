<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Mean or median</title>
  <style>
    .what-each-minimises-bg   { fill: #f8fafc; }
    .what-each-minimises-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-each-minimises-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-each-minimises-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-each-minimises-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-each-minimises-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .what-each-minimises-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .what-each-minimises-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .what-each-minimises-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .what-each-minimises-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .what-each-minimises-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .what-each-minimises-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .what-each-minimises-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .what-each-minimises-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .what-each-minimises-stage { opacity: 1; }

    .what-each-minimises-s0 { animation-delay: 0.00s; }
    .what-each-minimises-e0 { animation-delay: 0.00s; }
    .what-each-minimises-s1 { animation-delay: 1.28s; }
    .what-each-minimises-e1 { animation-delay: 1.28s; }
    .what-each-minimises-s2 { animation-delay: 2.56s; }
    .what-each-minimises-e2 { animation-delay: 2.56s; }
    .what-each-minimises-s3 { animation-delay: 3.84s; }
    .what-each-minimises-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .what-each-minimises-conn  { animation: what-each-minimises-trace 6.4s ease-in-out infinite; }
      .what-each-minimises-stage { animation: what-each-minimises-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes what-each-minimises-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes what-each-minimises-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .what-each-minimises-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .what-each-minimises-stage { animation: what-each-minimises-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes what-each-minimises-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="what-each-minimises-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="what-each-minimises-bg" width="980" height="322"/>
  <text class="what-each-minimises-h1"  x="30" y="40">Mean or median</text>
  <text class="what-each-minimises-sub" x="30" y="64">Four steps.</text>
  <g class="what-each-minimises-stage what-each-minimises-s0">
    <rect class="what-each-minimises-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="what-each-minimises-step" x="44" y="142">01</text>
    <text class="what-each-minimises-name" x="70" y="142">Minimising squared distance to a set of numbers</text>
    <text class="what-each-minimises-desc" x="44" y="166">Gives the mean, exactly.</text>
  </g>
  <line class="what-each-minimises-line what-each-minimises-conn what-each-minimises-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#what-each-minimises-tip)"/>
  <g class="what-each-minimises-stage what-each-minimises-s1">
    <rect class="what-each-minimises-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="what-each-minimises-step" x="280" y="142">02</text>
    <text class="what-each-minimises-name" x="306" y="142">Minimising absolute distance gives the median</text>
    <text class="what-each-minimises-desc" x="280" y="166">Which is a different number</text>
    <text class="what-each-minimises-desc" x="280" y="182">entirely.</text>
  </g>
  <line class="what-each-minimises-line what-each-minimises-conn what-each-minimises-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#what-each-minimises-tip)"/>
  <g class="what-each-minimises-stage what-each-minimises-s2">
    <rect class="what-each-minimises-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="what-each-minimises-step" x="516" y="142">03</text>
    <text class="what-each-minimises-name" x="542" y="142">On one, two, three, four and a hundred</text>
    <text class="what-each-minimises-desc" x="516" y="166">The mean is twenty-two; the</text>
    <text class="what-each-minimises-desc" x="516" y="182">median is three.</text>
  </g>
  <line class="what-each-minimises-line what-each-minimises-conn what-each-minimises-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#what-each-minimises-tip)"/>
  <g class="what-each-minimises-stage what-each-minimises-s3">
    <rect class="what-each-minimises-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="what-each-minimises-step" x="752" y="142">04</text>
    <text class="what-each-minimises-name" x="778" y="142">So one extreme value moves one estimate and not the other</text>
    <text class="what-each-minimises-desc" x="752" y="166">Which is outlier sensitivity,</text>
    <text class="what-each-minimises-desc" x="752" y="182">exactly.</text>
  </g>
  <text class="what-each-minimises-sub" x="30" y="304">Two numbers from the same five values, nineteen apart, is a more convincing demonstration of robustness than any amount of description.</text>
</svg>
