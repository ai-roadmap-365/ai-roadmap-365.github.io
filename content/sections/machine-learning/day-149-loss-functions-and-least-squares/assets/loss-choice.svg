<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four consequences.">
  <title>The loss is a choice</title>
  <style>
    .loss-choice-bg   { fill: #f8fafc; }
    .loss-choice-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-choice-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-choice-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-choice-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-choice-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-choice-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-choice-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-choice-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-choice-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-choice-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-choice-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-choice-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loss-choice-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loss-choice-stage { opacity: 1; }

    .loss-choice-s0 { animation-delay: 0.00s; }
    .loss-choice-e0 { animation-delay: 0.00s; }
    .loss-choice-s1 { animation-delay: 1.28s; }
    .loss-choice-e1 { animation-delay: 1.28s; }
    .loss-choice-s2 { animation-delay: 2.56s; }
    .loss-choice-e2 { animation-delay: 2.56s; }
    .loss-choice-s3 { animation-delay: 3.84s; }
    .loss-choice-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loss-choice-conn  { animation: loss-choice-trace 6.4s ease-in-out infinite; }
      .loss-choice-stage { animation: loss-choice-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loss-choice-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loss-choice-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loss-choice-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loss-choice-stage { animation: loss-choice-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loss-choice-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loss-choice-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loss-choice-bg" width="980" height="322"/>
  <text class="loss-choice-h1"  x="30" y="40">The loss is a choice</text>
  <text class="loss-choice-sub" x="30" y="64">Four consequences.</text>
  <g class="loss-choice-stage loss-choice-s0">
    <rect class="loss-choice-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loss-choice-step" x="44" y="142">01</text>
    <text class="loss-choice-name" x="70" y="142">The loss says how bad each error is</text>
    <text class="loss-choice-desc" x="44" y="166">Which is a value judgment, not a</text>
    <text class="loss-choice-desc" x="44" y="182">fact about the data.</text>
  </g>
  <line class="loss-choice-line loss-choice-conn loss-choice-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loss-choice-tip)"/>
  <g class="loss-choice-stage loss-choice-s1">
    <rect class="loss-choice-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loss-choice-step" x="280" y="142">02</text>
    <text class="loss-choice-name" x="306" y="142">Squared error punishes large errors disproportionately</text>
    <text class="loss-choice-desc" x="280" y="166">And is minimised at the mean.</text>
  </g>
  <line class="loss-choice-line loss-choice-conn loss-choice-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loss-choice-tip)"/>
  <g class="loss-choice-stage loss-choice-s2">
    <rect class="loss-choice-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loss-choice-step" x="516" y="142">03</text>
    <text class="loss-choice-name" x="542" y="142">Absolute error treats all errors proportionally</text>
    <text class="loss-choice-desc" x="516" y="166">And is minimised at the median.</text>
  </g>
  <line class="loss-choice-line loss-choice-conn loss-choice-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loss-choice-tip)"/>
  <g class="loss-choice-stage loss-choice-s3">
    <rect class="loss-choice-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loss-choice-step" x="752" y="142">04</text>
    <text class="loss-choice-name" x="778" y="142">So the loss decides which points the model listens to</text>
    <text class="loss-choice-desc" x="752" y="166">Before any fitting happens.</text>
    <text class="loss-choice-edge" x="752" y="242">a choice</text>
  </g>
  <text class="loss-choice-sub" x="30" y="304">The mean-versus-median result is the whole mechanism of outlier sensitivity, and it is demonstrable on five numbers rather than argued about.</text>
</svg>
