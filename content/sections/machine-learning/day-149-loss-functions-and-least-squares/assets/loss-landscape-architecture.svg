<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d149a-title d149a-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="d149a-title">Two loss landscapes, one outlier, and what Gauss-Markov actually promises</title>
  <desc id="d149a-desc">A static diagram comparing squared error and absolute error, the outlier-shift measurement across three estimators, and the Gauss-Markov efficiency result under two error distributions.</desc>
  <style>
    .d149a-bg { fill: #f8fafc; }
    .d149a-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .d149a-axis { stroke: #64748b; stroke-width: 1.5; }
    .d149a-curve-sq { fill: none; stroke: #1d4ed8; stroke-width: 3; }
    .d149a-curve-abs { fill: none; stroke: #1d4ed8; stroke-width: 3; }
    .d149a-min-dot { fill: #1d4ed8; }
    .d149a-title-text { font-size: 18px; font-weight: 700; fill: #1a202c; }
    .d149a-panel-title { font-size: 15px; font-weight: 700; fill: #1a202c; }
    .d149a-label { font-size: 14px; fill: #1a202c; }
    .d149a-small { font-size: 14px; fill: #334155; }
    .d149a-mono { font-size: 14px; fill: #1a202c; font-family: "SFMono-Regular", Consolas, monospace; }
    .d149a-bar-ols { fill: #1d4ed8; }
    .d149a-bar-huber { fill: #60a5fa; }
    .d149a-bar-quantile { fill: #93c5fd; }
    .d149a-bar-label { font-size: 14px; fill: #1a202c; }
    .d149a-gm-box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
    .d149a-gm-text { font-size: 14px; fill: #1a202c; }
    .d149a-gm-strong { font-size: 15px; font-weight: 700; fill: #1a202c; }
  </style>

  <rect class="d149a-bg" x="0" y="0" width="900" height="760"/>

  <text class="d149a-title-text" x="30" y="34">One dataset, two losses, and the outlier that tells them apart</text>

  <!-- Left panel: squared error, smooth parabola -->
  <rect class="d149a-panel" x="30" y="56" width="400" height="230" rx="6"/>
  <text class="d149a-panel-title" x="46" y="80">Squared error: smooth, one minimum</text>
  <line class="d149a-axis" x1="70" y1="250" x2="400" y2="250"/>
  <line class="d149a-axis" x1="70" y1="100" x2="70" y2="250"/>
  <text class="d149a-small" x="200" y="270" text-anchor="middle">candidate slope</text>
  <text class="d149a-small" x="55" y="175" text-anchor="middle" transform="rotate(-90 55 175)">total loss</text>
  <path class="d149a-curve-sq" d="M 90 120 Q 235 260 380 120"/>
  <circle class="d149a-min-dot" cx="235" cy="248" r="5"/>
  <text class="d149a-label" x="235" y="230" text-anchor="middle">min at slope 3.0</text>
  <text class="d149a-small" x="90" y="105">second differences: constant (sd 0.000000)</text>

  <!-- Right panel: absolute error, kinked -->
  <rect class="d149a-panel" x="470" y="56" width="400" height="230" rx="6"/>
  <text class="d149a-panel-title" x="486" y="80">Absolute error: piecewise linear, kinked</text>
  <line class="d149a-axis" x1="510" y1="250" x2="840" y2="250"/>
  <line class="d149a-axis" x1="510" y1="100" x2="510" y2="250"/>
  <text class="d149a-small" x="640" y="270" text-anchor="middle">candidate slope</text>
  <text class="d149a-small" x="495" y="175" text-anchor="middle" transform="rotate(-90 495 175)">total loss</text>
  <polyline class="d149a-curve-abs" points="530,115 585,175 610,192 675,247 705,205 760,168 820,118"/>
  <circle class="d149a-min-dot" cx="675" cy="247" r="5"/>
  <text class="d149a-label" x="675" y="230" text-anchor="middle">min at slope 3.0</text>
  <text class="d149a-small" x="530" y="105">second differences: vary (sd 1.9366)</text>

  <!-- Normal equations note, spanning both panels -->
  <rect class="d149a-panel" x="30" y="300" width="840" height="70" rx="6"/>
  <text class="d149a-panel-title" x="46" y="324">Squared error's smoothness gives it a closed form; absolute error has none</text>
  <text class="d149a-mono" x="46" y="348">normal equations: (X^T X) beta = X^T y  --  slope 2.977853, matches LinearRegression to 1e-14</text>
  <text class="d149a-small" x="46" y="366">absolute error has no derivative at a residual of zero, so no equivalent system exists to solve</text>

  <!-- Outlier movement bars -->
  <text class="d149a-panel-title" x="30" y="400">One point, moved 80 units off the line: how far each estimator's slope moved</text>
  <text class="d149a-bar-label" x="180" y="425">ordinary least squares</text>
  <rect class="d149a-bar-ols" x="380" y="412" width="340" height="20"/>
  <text class="d149a-bar-label" x="726" y="427">+0.7545</text>

  <text class="d149a-bar-label" x="180" y="457">Huber regression</text>
  <rect class="d149a-bar-huber" x="380" y="444" width="20" height="20"/>
  <text class="d149a-bar-label" x="406" y="459">+0.0437 (17.3x less)</text>

  <text class="d149a-bar-label" x="180" y="489">median regression</text>
  <rect class="d149a-bar-quantile" x="380" y="476" width="5" height="20"/>
  <text class="d149a-bar-label" x="391" y="491">+0.0104 (72.5x less)</text>

  <!-- Gauss-Markov panel -->
  <rect class="d149a-gm-box" x="30" y="524" width="840" height="200" rx="6"/>
  <text class="d149a-gm-strong" x="46" y="550">Gauss-Markov: OLS is the BEST LINEAR UNBIASED ESTIMATOR -- conditional on the errors</text>
  <text class="d149a-gm-text" x="46" y="578">"Best" means lowest variance among estimators that are (a) linear in y and (b) unbiased.</text>
  <text class="d149a-gm-text" x="46" y="600">500 replications, true slope 3.0, both estimators within 0.01 of the truth in both settings:</text>

  <rect class="d149a-panel" x="46" y="618" width="380" height="86" rx="6"/>
  <text class="d149a-panel-title" x="60" y="642">Gaussian errors</text>
  <text class="d149a-gm-text" x="60" y="664">OLS sd 0.0560  vs  Huber sd 0.0588</text>
  <text class="d149a-gm-strong" x="60" y="688">ratio 0.9524 -- OLS is tighter</text>

  <rect class="d149a-panel" x="454" y="618" width="380" height="86" rx="6"/>
  <text class="d149a-panel-title" x="468" y="642">Heavy-tailed errors</text>
  <text class="d149a-gm-text" x="468" y="664">OLS sd 0.0589  vs  Huber sd 0.0422</text>
  <text class="d149a-gm-strong" x="468" y="688">ratio 1.3957 -- Huber is tighter</text>

  <text class="d149a-small" x="46" y="740">Change what the errors look like, and the ranking measurably flips. Bias never does.</text>
</svg>
