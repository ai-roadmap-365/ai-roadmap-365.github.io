terms:
  - term: Loss function
    definition: >-
      A rule that turns one candidate line's residuals into a single number to minimise. Not a fixed
      property of "doing regression" -- a choice, made explicitly here between squared error,
      absolute error and a blend of the two.
  - term: Squared error
    definition: >-
      The loss `sum((y - prediction)^2)`. Minimised by the mean; smooth everywhere, with one minimum;
      squares every residual, so an 80-unit error contributes 6,400 to the total, seventeen to
      seventy-two times more than the loss below moves for the same outlier.
  - term: Absolute error
    definition: >-
      The loss `sum(|y - prediction|)`. Minimised by the median; piecewise-linear, with a kink at
      every point where a residual crosses zero; has no closed-form minimiser because its derivative
      does not exist at a residual of exactly zero.
  - term: Mean squared error
    definition: >-
      Squared error divided by the row count. The per-row average of the loss actually minimised;
      distinct from root mean squared error, which is a metric reported in the target's own units --
      Day 152's subject, not this lesson's.
  - term: Normal equations
    definition: >-
      The closed-form solution to squared-error linear regression, `(X^T X) beta = X^T y`, obtained
      by setting the loss's derivative to zero and solving. Measured here to match
      `LinearRegression` to within 6e-14.
  - term: Huber loss
    definition: >-
      A loss that is squared error inside a threshold `epsilon` and (scaled) absolute error outside
      it. Continuous, not a hard switch: sweeping epsilon from 1.0 to 100.0 moved the fitted slope
      smoothly from 3.0064 to 3.8010, the exact OLS answer on the same data.
  - term: Quantile regression
    definition: >-
      Regression that minimises a loss asymmetric around one target quantile. At quantile 0.5 it
      minimises absolute error and estimates the conditional median; scikit-learn's
      `QuantileRegressor(quantile=0.5, alpha=0.0)` is what this lesson used for that case.
  - term: Outlier sensitivity
    definition: >-
      How far an estimator's fit moves in response to one extreme point. Measured directly here:
      moving a single point 80 units off the line moved OLS's slope by 0.7545, Huber's by 0.0437 and
      the median fit's by 0.0104.
  - term: Robust regression
    definition: >-
      Any regression method designed to bound the influence of extreme points, typically by using a
      loss that grows slower than squared for large residuals. Huber and quantile regression are both
      robust in this sense; ridge and lasso, covered on Day 151, are not -- they change the penalty,
      not the loss's shape.
  - term: Gauss-Markov theorem
    definition: >-
      Under linearity, unbiasedness of the errors, constant error variance and no correlation between
      errors, ordinary least squares is the best linear unbiased estimator -- lowest variance among
      estimators that are linear in y and unbiased. Every qualifying word is load-bearing; the
      guarantee is conditional on those assumptions, not universal.
  - term: Best linear unbiased estimator (BLUE)
    definition: >-
      The specific claim Gauss-Markov makes about OLS: among all estimators that are (a) linear
      combinations of the observed y values and (b) correct on average, OLS has the smallest
      variance. It says nothing about estimators that are nonlinear or biased, some of which can do
      better -- which is exactly what Huber demonstrated under heavy-tailed errors here.
  - term: Statistical efficiency
    definition: >-
      How small an unbiased estimator's variance is, relative to alternatives. Measured here as the
      ratio of two standard deviations across 500 replications: 0.9524 in OLS's favour under Gaussian
      errors, 1.3957 in Huber's favour under heavy-tailed errors.
  - term: Heavy-tailed distribution
    definition: >-
      A distribution whose extreme values occur far more often than a Gaussian's. Constructed here
      with a Student's t distribution at 3 degrees of freedom, scaled to a similar central spread as
      the Gaussian comparison, so the two settings differ only in how often big errors occur.
  - term: Unbiasedness
    definition: >-
      An estimator's average value, over many independent datasets, equals the true parameter.
      Confirmed separately from efficiency here: both OLS and Huber stayed within 0.01 of the true
      slope of 3.0 in both error settings, so bias was never what changed between them.
  - term: Loss versus metric
    definition: >-
      A loss is the function an algorithm optimises during fitting; a metric is the function you
      report to judge the result. They need not be the same function -- a model can be fit with
      squared error and reported with mean absolute error, or fit with Huber and reported with R
      squared. Day 152 owns metrics as a subject.
  - term: Convex loss
    definition: >-
      A loss whose landscape has no separate local minima to get trapped in -- squared error,
      absolute error and Huber are all convex in the model's coefficients, which is part of why the
      normal equations and iterative solvers alike reliably find the global minimum.
  - term: Differentiability
    definition: >-
      Whether a function has a well-defined slope at every point. Squared error is differentiable
      everywhere, which is what makes the normal equations possible; absolute error is not
      differentiable at a residual of zero, which is why it has no equivalent closed form.
  - term: Second difference
    definition: >-
      The discrete analogue of a second derivative: `diff(diff(values))`. Constant across a swept
      squared-error curve here (standard deviation 0.000000, a parabola); varying across the matching
      absolute-error curve (standard deviation 1.9366, a kinked, piecewise-linear shape).
