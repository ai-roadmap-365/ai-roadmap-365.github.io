<svg role="img" aria-label="Scree plot bar chart showing individual and cumulative explained variance ratio across principal components with 90 percent threshold" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Scree Plot and Cumulative Explained Variance Ratio</title>
  <defs>
    <linearGradient id="bg185b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg185b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SCREE PLOT: INDIVIDUAL &amp; CUMULATIVE EXPLAINED VARIANCE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Eigendecomposition Spectrum: lambda_k / sum(lambda) with 90% Preservation Cutoff</text>
  <g transform="translate(60, 90)">
    <rect width="730" height="290" fill="url(#screeCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <rect x="80" y="80" width="50" height="160" fill="#38bdf8" rx="4"/>
    <text x="105" y="70" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">58%</text>
    <rect x="170" y="145" width="50" height="95" fill="#38bdf8" rx="4"/>
    <text x="195" y="135" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">24%</text>
    <rect x="260" y="200" width="50" height="40" fill="#38bdf8" rx="4"/>
    <text x="285" y="190" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">10%</text>
    <rect x="350" y="225" width="50" height="15" fill="#38bdf8" rx="4"/>
    <text x="375" y="215" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">5%</text>
    <polyline points="105,140 195,85 285,60 375,48 465,40" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="105" cy="140" r="5" fill="#10b981"/>
    <circle cx="195" cy="85" r="5" fill="#10b981"/>
    <circle cx="285" cy="60" r="5" fill="#10b981"/>
    <circle cx="375" cy="48" r="5" fill="#10b981"/>
    <line x1="60" y1="65" x2="680" y2="65" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="600" y="55" fill="#ef4444" font-family="system-ui" font-size="11" font-weight="700">90% Variance Threshold</text>
  </g>
</svg>
