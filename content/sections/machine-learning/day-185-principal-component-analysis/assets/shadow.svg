<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Choosing the angle.">
  <title>Casting a shadow</title>
  <style>
    .shadow-bg   { fill: #f8fafc; }
    .shadow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shadow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shadow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shadow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shadow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shadow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shadow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shadow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shadow-row { opacity: 1; }
    .shadow-r0 { animation-delay: 0.00s; }
    .shadow-r1 { animation-delay: 0.45s; }
    .shadow-r2 { animation-delay: 0.90s; }
    .shadow-r3 { animation-delay: 1.35s; }
    .shadow-r4 { animation-delay: 1.80s; }
    .shadow-row { animation: shadow-reveal 7.3s ease-in-out infinite; }
    @keyframes shadow-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shadow-bg" width="980" height="390"/>
  <text class="shadow-h1"  x="30" y="40">Casting a shadow</text>
  <text class="shadow-sub" x="30" y="64">Choosing the angle.</text>
  <rect class="shadow-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shadow-name" x="46" y="122">A bad angle</text>
  <text class="shadow-desc" x="46" y="142">Structure collapses.</text>
  <text class="shadow-desc shadow-row shadow-r0" x="46" y="182">The shadow of a hand can be a blob</text>
  <text class="shadow-desc shadow-row shadow-r1" x="46" y="216">Distinct parts overlap</text>
  <text class="shadow-desc shadow-row shadow-r2" x="46" y="250">Information is lost in the projection</text>
  <text class="shadow-desc shadow-row shadow-r3" x="46" y="284">The object is unrecognisable</text>
  <text class="shadow-desc shadow-row shadow-r4" x="46" y="318">This is an arbitrary projection</text>
  <rect class="shadow-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shadow-name" x="526" y="122">A good angle</text>
  <text class="shadow-desc" x="526" y="142">Structure survives.</text>
  <text class="shadow-desc shadow-row shadow-r0" x="526" y="182">The shadow shows the outline clearly</text>
  <text class="shadow-desc shadow-row shadow-r1" x="526" y="216">Distinct parts stay distinct</text>
  <text class="shadow-desc shadow-row shadow-r2" x="526" y="250">Most of the shape is preserved</text>
  <text class="shadow-desc shadow-row shadow-r3" x="526" y="284">The object is recognisable</text>
  <text class="shadow-desc shadow-row shadow-r4" x="526" y="318">This is a principal component</text>
  <text class="shadow-sub" x="30" y="372">Projection always loses a dimension; the method's contribution is choosing the angle that loses the least, which is exactly what maximising variance does.</text>
</svg>
