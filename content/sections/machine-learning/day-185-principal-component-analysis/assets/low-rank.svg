<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Reconstruction</title>
  <style>
    .low-rank-bg   { fill: #f8fafc; }
    .low-rank-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .low-rank-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .low-rank-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .low-rank-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .low-rank-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .low-rank-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .low-rank-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .low-rank-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .low-rank-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .low-rank-stage { opacity: 1; }

    .low-rank-s0 { animation-delay: 0.00s; }
    .low-rank-e0 { animation-delay: 0.00s; }
    .low-rank-s1 { animation-delay: 1.28s; }
    .low-rank-e1 { animation-delay: 1.28s; }
    .low-rank-s2 { animation-delay: 2.56s; }
    .low-rank-e2 { animation-delay: 2.56s; }
    .low-rank-s3 { animation-delay: 3.84s; }
    .low-rank-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .low-rank-conn  { animation: low-rank-trace 6.4s ease-in-out infinite; }
      .low-rank-stage { animation: low-rank-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes low-rank-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes low-rank-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .low-rank-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .low-rank-stage { animation: low-rank-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes low-rank-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="low-rank-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="low-rank-bg" width="980" height="322"/>
  <text class="low-rank-h1"  x="30" y="40">Reconstruction</text>
  <text class="low-rank-sub" x="30" y="64">Four steps.</text>
  <g class="low-rank-stage low-rank-s0">
    <rect class="low-rank-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-step" x="44" y="142">01</text>
    <text class="low-rank-name" x="70" y="142">Project onto the kept components</text>
    <text class="low-rank-desc" x="44" y="166">Which discards the rest.</text>
  </g>
  <line class="low-rank-line low-rank-conn low-rank-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#low-rank-tip)"/>
  <g class="low-rank-stage low-rank-s1">
    <rect class="low-rank-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-step" x="280" y="142">02</text>
    <text class="low-rank-name" x="306" y="142">Then project back into the original space</text>
    <text class="low-rank-desc" x="280" y="166">Using the same components.</text>
  </g>
  <line class="low-rank-line low-rank-conn low-rank-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#low-rank-tip)"/>
  <g class="low-rank-stage low-rank-s2">
    <rect class="low-rank-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-step" x="516" y="142">03</text>
    <text class="low-rank-name" x="542" y="142">The result differs from the original</text>
    <text class="low-rank-desc" x="516" y="166">By exactly the variance that was</text>
    <text class="low-rank-desc" x="516" y="182">discarded.</text>
  </g>
  <line class="low-rank-line low-rank-conn low-rank-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#low-rank-tip)"/>
  <g class="low-rank-stage low-rank-s3">
    <rect class="low-rank-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="low-rank-step" x="752" y="142">04</text>
    <text class="low-rank-name" x="778" y="142">And that error is itself useful</text>
    <text class="low-rank-desc" x="752" y="166">A large one flags an anomaly.</text>
  </g>
  <text class="low-rank-sub" x="30" y="304">Reconstruction error as an anomaly score is a genuinely useful side effect: a point that the components cannot reconstruct is unlike the data they were fitted on.</text>
</svg>
