<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are costs.">
  <title>Four consequences of dimensionality reduction</title>
  <style>
    .pca-implications-bg   { fill: #f8fafc; }
    .pca-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pca-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pca-implications-stage { opacity: 1; }

    .pca-implications-s0 { animation-delay: 0.00s; }
    .pca-implications-e0 { animation-delay: 0.00s; }
    .pca-implications-s1 { animation-delay: 1.28s; }
    .pca-implications-e1 { animation-delay: 1.28s; }
    .pca-implications-s2 { animation-delay: 2.56s; }
    .pca-implications-e2 { animation-delay: 2.56s; }
    .pca-implications-s3 { animation-delay: 3.84s; }
    .pca-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pca-implications-conn  { animation: pca-implications-trace 6.4s ease-in-out infinite; }
      .pca-implications-stage { animation: pca-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pca-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pca-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pca-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pca-implications-stage { animation: pca-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pca-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pca-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pca-implications-bg" width="980" height="322"/>
  <text class="pca-implications-h1"  x="30" y="40">Four consequences of dimensionality reduction</text>
  <text class="pca-implications-sub" x="30" y="64">Two are costs.</text>
  <g class="pca-implications-stage pca-implications-s0">
    <rect class="pca-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pca-implications-step" x="44" y="142">01</text>
    <text class="pca-implications-name" x="70" y="142">Downstream models train and serve faster</text>
    <text class="pca-implications-desc" x="44" y="166">On far fewer dimensions.</text>
  </g>
  <line class="pca-implications-line pca-implications-conn pca-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pca-implications-tip)"/>
  <g class="pca-implications-stage pca-implications-s1">
    <rect class="pca-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pca-implications-step" x="280" y="142">02</text>
    <text class="pca-implications-name" x="306" y="142">And low-variance noise is often removed</text>
    <text class="pca-implications-desc" x="280" y="166">Which can improve accuracy.</text>
  </g>
  <line class="pca-implications-line pca-implications-conn pca-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pca-implications-tip)"/>
  <g class="pca-implications-stage pca-implications-s2">
    <rect class="pca-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pca-implications-step" x="516" y="142">03</text>
    <text class="pca-implications-name" x="542" y="142">But components are not interpretable features</text>
    <text class="pca-implications-desc" x="516" y="166">Which matters where explanations</text>
    <text class="pca-implications-desc" x="516" y="182">are required.</text>
  </g>
  <line class="pca-implications-line pca-implications-conn pca-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pca-implications-tip)"/>
  <g class="pca-implications-stage pca-implications-s3">
    <rect class="pca-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pca-implications-step" x="752" y="142">04</text>
    <text class="pca-implications-name" x="778" y="142">And discarded directions may hold the signal</text>
    <text class="pca-implications-desc" x="752" y="166">So always compare against the</text>
    <text class="pca-implications-desc" x="752" y="182">unreduced model.</text>
  </g>
  <text class="pca-implications-sub" x="30" y="304">Comparing against the unreduced model is the check that catches the failure case, and it costs one extra fit.</text>
</svg>
