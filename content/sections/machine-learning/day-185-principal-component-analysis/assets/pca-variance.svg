<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps.">
  <title>Why variance</title>
  <style>
    .pca-variance-bg   { fill: #f8fafc; }
    .pca-variance-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-variance-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-variance-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-variance-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-variance-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pca-variance-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pca-variance-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pca-variance-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pca-variance-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pca-variance-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pca-variance-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pca-variance-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pca-variance-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pca-variance-stage { opacity: 1; }

    .pca-variance-s0 { animation-delay: 0.00s; }
    .pca-variance-e0 { animation-delay: 0.00s; }
    .pca-variance-s1 { animation-delay: 1.28s; }
    .pca-variance-e1 { animation-delay: 1.28s; }
    .pca-variance-s2 { animation-delay: 2.56s; }
    .pca-variance-e2 { animation-delay: 2.56s; }
    .pca-variance-s3 { animation-delay: 3.84s; }
    .pca-variance-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pca-variance-conn  { animation: pca-variance-trace 6.4s ease-in-out infinite; }
      .pca-variance-stage { animation: pca-variance-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pca-variance-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pca-variance-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pca-variance-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pca-variance-stage { animation: pca-variance-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pca-variance-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pca-variance-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pca-variance-bg" width="980" height="322"/>
  <text class="pca-variance-h1"  x="30" y="40">Why variance</text>
  <text class="pca-variance-sub" x="30" y="64">Four steps.</text>
  <g class="pca-variance-stage pca-variance-s0">
    <rect class="pca-variance-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pca-variance-step" x="44" y="142">01</text>
    <text class="pca-variance-name" x="70" y="142">Project the data onto a candidate direction</text>
    <text class="pca-variance-desc" x="44" y="166">And measure the variance of the</text>
    <text class="pca-variance-desc" x="44" y="182">result.</text>
  </g>
  <line class="pca-variance-line pca-variance-conn pca-variance-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pca-variance-tip)"/>
  <g class="pca-variance-stage pca-variance-s1">
    <rect class="pca-variance-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pca-variance-step" x="280" y="142">02</text>
    <text class="pca-variance-name" x="306" y="142">Maximise that, subject to unit length</text>
    <text class="pca-variance-desc" x="280" y="166">Which is a constrained</text>
    <text class="pca-variance-desc" x="280" y="182">optimisation.</text>
  </g>
  <line class="pca-variance-line pca-variance-conn pca-variance-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pca-variance-tip)"/>
  <g class="pca-variance-stage pca-variance-s2">
    <rect class="pca-variance-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pca-variance-step" x="516" y="142">03</text>
    <text class="pca-variance-name" x="542" y="142">The solution is an eigenvector of the covariance matrix</text>
    <text class="pca-variance-desc" x="516" y="166">Which is why the linear algebra</text>
    <text class="pca-variance-desc" x="516" y="182">appears.</text>
  </g>
  <line class="pca-variance-line pca-variance-conn pca-variance-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pca-variance-tip)"/>
  <g class="pca-variance-stage pca-variance-s3">
    <rect class="pca-variance-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pca-variance-step" x="752" y="142">04</text>
    <text class="pca-variance-name" x="778" y="142">And its eigenvalue is the variance captured</text>
    <text class="pca-variance-desc" x="752" y="166">So ordering by eigenvalue orders</text>
    <text class="pca-variance-desc" x="752" y="182">the components.</text>
  </g>
  <text class="pca-variance-sub" x="30" y="304">Variance is used as a proxy for information, which is an assumption rather than a fact: a low-variance direction can carry the signal that matters.</text>
</svg>
