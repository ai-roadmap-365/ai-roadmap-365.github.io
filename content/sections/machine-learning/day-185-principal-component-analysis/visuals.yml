visuals:
  - id: pca-orthogonal-projection-geometry
    file: assets/pca-orthogonal-projection-geometry.svg
    type: diagram
    title: PCA Orthogonal Projection Geometry
    alt: Geometric diagram showing orthogonal projection of 2D data onto the first principal component axis PC1 and orthogonal axis PC2
    description: Geometric formulation of maximal variance projection and minimal reconstruction error along principal eigenvectors.
  - id: scree-plot-explained-variance
    file: assets/scree-plot-explained-variance.svg
    type: diagram
    title: Scree Plot and Cumulative Explained Variance Ratio
    alt: Scree plot bar chart showing individual and cumulative explained variance ratio across principal components with 90 percent threshold
    description: Visualizing eigenvalue decay spectrum and cumulative explained variance ratio for dimensionality reduction cutoff.
  - id: pca-idea
    file: assets/pca-idea.svg
    type: diagram
    title: 'Principal component analysis'
    alt: 'Diagram: the four steps of principal component analysis'
    description: 'A four-stage description of principal component analysis covering centring, the variance directions, ordering and projection.'
  - id: pca-variance
    file: assets/pca-variance.svg
    type: diagram
    title: 'Why variance'
    alt: 'Diagram: why principal components maximise variance'
    description: 'A four-stage description of the variance criterion covering the projection, the objective, the eigenvector solution and the ordering.'
  - id: svd
    file: assets/svd.svg
    type: diagram
    title: 'Why the decomposition is used'
    alt: 'Diagram: why singular value decomposition is used to compute principal components'
    description: 'A four-stage description of the numerical approach covering the covariance route, its instability, the direct decomposition and the equivalence.'
  - id: scree
    file: assets/scree.svg
    type: diagram
    title: 'Choosing how many components'
    alt: 'Diagram: how the explained variance ratio guides component selection'
    description: 'A four-stage description of component selection covering the ratio, the cumulative curve, the threshold and the elbow.'
  - id: low-rank
    file: assets/low-rank.svg
    type: diagram
    title: 'Reconstruction'
    alt: 'Diagram: how data is reconstructed from a reduced set of components'
    description: 'A four-stage description of low-rank reconstruction covering projection, reconstruction, the error and its use.'
  - id: pca-not
    file: assets/pca-not.svg
    type: diagram
    title: 'What it is not'
    alt: 'Diagram: four misconceptions about principal component analysis'
    description: 'A two-column comparison of misconceptions about principal component analysis against what is true.'
  - id: pca-history
    file: assets/pca-history.svg
    type: diagram
    title: 'Four steps for principal components'
    alt: 'Diagram: the historical progression of principal component analysis'
    description: 'A four-stage description of the method''s history covering the original formulation, independent rediscovery, computational practicality and modern uses.'
  - id: shadow
    file: assets/shadow.svg
    type: diagram
    title: 'Casting a shadow'
    alt: 'Diagram: an uninformative projection compared with an informative one'
    description: 'A two-column comparison of a poorly chosen projection against a well chosen one.'
  - id: pca-implications
    file: assets/pca-implications.svg
    type: diagram
    title: 'Four consequences of dimensionality reduction'
    alt: 'Diagram: the speed, noise, interpretability and information implications of principal component analysis'
    description: 'A four-stage description of implications covering computational savings, noise reduction, lost interpretability and discarded signal.'
  - id: pca-when
    file: assets/pca-when.svg
    type: diagram
    title: 'When to use principal components'
    alt: 'Diagram: when principal component analysis is appropriate'
    description: 'A two-column comparison of situations favouring dimensionality reduction against those that do not.'
