terms:
  - term: 'Principal Component Analysis (PCA)'
    definition: 'An unsupervised linear dimensionality reduction technique that transforms correlated features into orthogonal maximal-variance components.'
  - term: 'Covariance Matrix'
    definition: 'A square symmetric matrix containing pairwise covariances between all feature dimensions: Sigma = (1/(N-1)) X^T X.'
  - term: 'Eigenvector (Loading Vector)'
    definition: 'A directional unit vector w representing a principal axis of variation that satisfies Sigma w = lambda w.'
  - term: 'Eigenvalue'
    definition: 'A scalar lambda representing the magnitude of variance captured along the direction of its corresponding eigenvector.'
  - term: 'Singular Value Decomposition (SVD)'
    definition: 'The matrix factorization X = U Sigma V^T decomposing a data matrix into left singular vectors, singular values, and right singular vectors.'
  - term: 'Explained Variance Ratio (EVR)'
    definition: 'The percentage of total dataset variance accounted for by an individual principal component.'
  - term: 'Reconstruction Error'
    definition: 'The mean squared Euclidean distance between the original high-dimensional data X and its low-rank reconstruction X_hat.'
  - term: 'Whitening'
    definition: 'A linear transformation scaling principal components to unit variance, producing an uncorrelated identity covariance matrix.'
