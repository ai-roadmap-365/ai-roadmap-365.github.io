questions:
  - question: 'What mathematical quantity does the first Principal Component (PC1) maximize in standardized feature space?'
    options:
      - 'The variance of the projected data points along the unit direction vector w_1'
      - 'The pairwise Euclidean distance between the two closest points'
      - 'The sum of the diagonal elements of the raw input matrix X'
      - 'The classification accuracy of a downstream logistic regression'
    answer_index: 0
    explanation: 'PC1 is defined as the unit vector w_1 that maximizes Var(X w_1) = w_1^T Sigma w_1, which is mathematically equivalent to minimizing the mean squared reconstruction error.'
  - question: 'How are the eigenvalues lambda_i of the sample covariance matrix Sigma related to the singular values sigma_i of centered data matrix X?'
    options:
      - 'lambda_i = (sigma_i^2) / (N - 1)'
      - 'lambda_i = sigma_i * sqrt(N - 1)'
      - 'lambda_i = 1 / sigma_i'
      - 'lambda_i = sigma_i + N'
    answer_index: 0
    explanation: 'Since Sigma = (1/(N-1)) X^T X and X = U Sigma_svd V^T, the covariance matrix simplifies to V ((Sigma_svd^2)/(N-1)) V^T, proving lambda_i = sigma_i^2 / (N - 1).'
  - question: 'Why is centering the data matrix X (subtracting the feature column means) mandatory before running PCA?'
    options:
      - 'Without centering, the first principal component points toward the global data mean rather than the axis of maximum variance'
      - 'Without centering, the covariance matrix contains complex imaginary numbers'
      - 'Centering converts negative feature values into positive values'
      - 'Centering guarantees that all singular values equal 1.0'
    answer_index: 0
    explanation: 'PCA models variance around the origin. If data is not zero-centered, the first component will capture the offset from the origin to the center of mass instead of the internal variance axis.'
  - question: 'What does the Explained Variance Ratio (EVR) for component k quantify?'
    options:
      - 'The proportion of total dataset variance explained by the k-th principal component: lambda_k / sum(lambda)'
      - 'The classification error rate on holdout test data'
      - 'The ratio of rows to columns in matrix X'
      - 'The percentage of non-zero entries in the sparse representation'
    answer_index: 0
    explanation: 'EVR_k = lambda_k / sum(lambda_j) indicates what fraction of the total multidimensional variance is preserved by projecting onto component k.'
  - question: 'What is the effect of setting whiten=True during PCA transformation?'
    options:
      - 'It scales each principal component by dividing by the square root of its eigenvalue, ensuring all output dimensions have unit variance and zero covariance'
      - 'It sets all negative feature values to zero'
      - 'It inverts the sign of all principal loading vectors'
      - 'It multiplies the reconstructed matrix by the identity matrix'
    answer_index: 0
    explanation: 'Whitening divides projected coordinates by sqrt(lambda_k), transforming the feature covariance into the identity matrix I, removing collinearity for downstream estimators.'
