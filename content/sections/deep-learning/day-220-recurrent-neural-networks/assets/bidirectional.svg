<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="When the whole sequence is available.">
  <title>Reading in both directions</title>
  <style>
    .bidirectional-bg   { fill: #f8fafc; }
    .bidirectional-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bidirectional-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bidirectional-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bidirectional-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bidirectional-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bidirectional-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bidirectional-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bidirectional-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bidirectional-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bidirectional-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bidirectional-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bidirectional-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bidirectional-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bidirectional-stage { opacity: 1; }

    .bidirectional-s0 { animation-delay: 0.00s; }
    .bidirectional-e0 { animation-delay: 0.00s; }
    .bidirectional-s1 { animation-delay: 1.50s; }
    .bidirectional-e1 { animation-delay: 1.50s; }
    .bidirectional-s2 { animation-delay: 3.00s; }
    .bidirectional-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .bidirectional-conn  { animation: bidirectional-trace 6s ease-in-out infinite; }
      .bidirectional-stage { animation: bidirectional-arrive 6s ease-in-out infinite; }
    }
    @keyframes bidirectional-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bidirectional-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bidirectional-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bidirectional-stage { animation: bidirectional-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bidirectional-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bidirectional-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bidirectional-bg" width="980" height="322"/>
  <text class="bidirectional-h1"  x="30" y="40">Reading in both directions</text>
  <text class="bidirectional-sub" x="30" y="64">When the whole sequence is available.</text>
  <g class="bidirectional-stage bidirectional-s0">
    <rect class="bidirectional-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="bidirectional-step" x="44" y="142">01</text>
    <text class="bidirectional-name" x="70" y="142">One pass forward</text>
    <text class="bidirectional-desc" x="44" y="166">State accumulating left to right.</text>
  </g>
  <line class="bidirectional-line bidirectional-conn bidirectional-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#bidirectional-tip)"/>
  <g class="bidirectional-stage bidirectional-s1">
    <rect class="bidirectional-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="bidirectional-step" x="359" y="142">02</text>
    <text class="bidirectional-name" x="385" y="142">One pass backward</text>
    <text class="bidirectional-desc" x="359" y="166">State accumulating right to left, with</text>
    <text class="bidirectional-desc" x="359" y="182">separate weights.</text>
  </g>
  <line class="bidirectional-line bidirectional-conn bidirectional-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#bidirectional-tip)"/>
  <g class="bidirectional-stage bidirectional-s2">
    <rect class="bidirectional-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="bidirectional-step" x="674" y="142">03</text>
    <text class="bidirectional-name" x="700" y="142">Concatenated per position</text>
    <text class="bidirectional-desc" x="674" y="166">Each position sees the whole sequence. And</text>
    <text class="bidirectional-desc" x="674" y="182">generation becomes impossible.</text>
  </g>
  <text class="bidirectional-sub" x="30" y="304">The constraint is absolute: a bidirectional model needs the entire sequence before producing anything, which rules it out for generation and makes it excellent for classification.</text>
</svg>
