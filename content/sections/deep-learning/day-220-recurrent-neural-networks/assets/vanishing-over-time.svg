<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same product, two directions.">
  <title>Vanishing and exploding, over time</title>
  <style>
    .vanishing-over-time-bg   { fill: #f8fafc; }
    .vanishing-over-time-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-over-time-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-over-time-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-over-time-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-over-time-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vanishing-over-time-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vanishing-over-time-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vanishing-over-time-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vanishing-over-time-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vanishing-over-time-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vanishing-over-time-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vanishing-over-time-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vanishing-over-time-row { opacity: 1; }
    .vanishing-over-time-r0 { animation-delay: 0.00s; }
    .vanishing-over-time-r1 { animation-delay: 0.45s; }
    .vanishing-over-time-r2 { animation-delay: 0.90s; }
    .vanishing-over-time-r3 { animation-delay: 1.35s; }
    .vanishing-over-time-r4 { animation-delay: 1.80s; }
    .vanishing-over-time-row { animation: vanishing-over-time-reveal 7.3s ease-in-out infinite; }
    @keyframes vanishing-over-time-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="vanishing-over-time-bg" width="980" height="390"/>
  <text class="vanishing-over-time-h1"  x="30" y="40">Vanishing and exploding, over time</text>
  <text class="vanishing-over-time-sub" x="30" y="64">The same product, two directions.</text>
  <rect class="vanishing-over-time-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="vanishing-over-time-name" x="46" y="122">Vanishing</text>
  <text class="vanishing-over-time-desc" x="46" y="142">Factors below one.</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r0" x="46" y="182">Repeated multiplication shrinks the gradient</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r1" x="46" y="216">After ten to fifteen steps, nothing reaches back</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r2" x="46" y="250">The model cannot learn long dependencies</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r3" x="46" y="284">No error, and no warning</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r4" x="46" y="318">Architecture is the fix — gating</text>
  <rect class="vanishing-over-time-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="vanishing-over-time-name" x="526" y="122">Exploding</text>
  <text class="vanishing-over-time-desc" x="526" y="142">Factors above one.</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r0" x="526" y="182">Repeated multiplication grows the gradient</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r1" x="526" y="216">One step can destroy every weight</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r2" x="526" y="250">Loss becomes NaN, visibly</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r3" x="526" y="284">Easy to detect</text>
  <text class="vanishing-over-time-desc vanishing-over-time-row vanishing-over-time-r4" x="526" y="318">Clipping is the fix</text>
  <text class="vanishing-over-time-sub" x="30" y="372">The asymmetry in difficulty is worth noticing: exploding gradients are dramatic and easily fixed by clipping, and vanishing gradients are silent and required a new architecture.</text>
</svg>
