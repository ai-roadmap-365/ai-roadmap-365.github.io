<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One state, carried forward.">
  <title>What recurrence adds</title>
  <style>
    .rnn-mechanics-bg   { fill: #f8fafc; }
    .rnn-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rnn-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rnn-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rnn-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rnn-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rnn-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rnn-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rnn-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rnn-mechanics-stage { opacity: 1; }

    .rnn-mechanics-s0 { animation-delay: 0.00s; }
    .rnn-mechanics-e0 { animation-delay: 0.00s; }
    .rnn-mechanics-s1 { animation-delay: 1.28s; }
    .rnn-mechanics-e1 { animation-delay: 1.28s; }
    .rnn-mechanics-s2 { animation-delay: 2.56s; }
    .rnn-mechanics-e2 { animation-delay: 2.56s; }
    .rnn-mechanics-s3 { animation-delay: 3.84s; }
    .rnn-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rnn-mechanics-conn  { animation: rnn-mechanics-trace 6.4s ease-in-out infinite; }
      .rnn-mechanics-stage { animation: rnn-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rnn-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rnn-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rnn-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rnn-mechanics-stage { animation: rnn-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rnn-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rnn-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rnn-mechanics-bg" width="980" height="322"/>
  <text class="rnn-mechanics-h1"  x="30" y="40">What recurrence adds</text>
  <text class="rnn-mechanics-sub" x="30" y="64">One state, carried forward.</text>
  <g class="rnn-mechanics-stage rnn-mechanics-s0">
    <rect class="rnn-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-mechanics-step" x="44" y="142">01</text>
    <text class="rnn-mechanics-name" x="70" y="142">A hidden state vector</text>
    <text class="rnn-mechanics-desc" x="44" y="166">Everything the network remembers</text>
    <text class="rnn-mechanics-desc" x="44" y="182">about what it has seen.</text>
  </g>
  <line class="rnn-mechanics-line rnn-mechanics-conn rnn-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rnn-mechanics-tip)"/>
  <g class="rnn-mechanics-stage rnn-mechanics-s1">
    <rect class="rnn-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-mechanics-step" x="280" y="142">02</text>
    <text class="rnn-mechanics-name" x="306" y="142">Updated at every step</text>
    <text class="rnn-mechanics-desc" x="280" y="166">From the previous state and the</text>
    <text class="rnn-mechanics-desc" x="280" y="182">current input.</text>
  </g>
  <line class="rnn-mechanics-line rnn-mechanics-conn rnn-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rnn-mechanics-tip)"/>
  <g class="rnn-mechanics-stage rnn-mechanics-s2">
    <rect class="rnn-mechanics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-mechanics-step" x="516" y="142">03</text>
    <text class="rnn-mechanics-name" x="542" y="142">With the same weights each step</text>
    <text class="rnn-mechanics-desc" x="516" y="166">Shared across time, exactly as</text>
    <text class="rnn-mechanics-desc" x="516" y="182">convolution shares across space.</text>
    <text class="rnn-mechanics-edge" x="516" y="242">sharing</text>
  </g>
  <line class="rnn-mechanics-line rnn-mechanics-conn rnn-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rnn-mechanics-tip)"/>
  <g class="rnn-mechanics-stage rnn-mechanics-s3">
    <rect class="rnn-mechanics-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-mechanics-step" x="752" y="142">04</text>
    <text class="rnn-mechanics-name" x="778" y="142">Which makes it strictly sequential</text>
    <text class="rnn-mechanics-desc" x="752" y="166">Step t needs step t-1. Nothing</text>
    <text class="rnn-mechanics-desc" x="752" y="182">can be parallelised across time.</text>
  </g>
  <text class="rnn-mechanics-sub" x="30" y="304">The last property is the one that eventually decided the architecture's fate: it is not slower per operation, it is unable to use hardware built to do many operations at once.</text>
</svg>
