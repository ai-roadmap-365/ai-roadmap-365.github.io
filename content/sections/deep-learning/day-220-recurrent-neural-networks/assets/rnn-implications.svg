<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are hardware.">
  <title>Four consequences of recurrence</title>
  <style>
    .rnn-implications-bg   { fill: #f8fafc; }
    .rnn-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rnn-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rnn-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rnn-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rnn-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rnn-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rnn-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rnn-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rnn-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rnn-implications-stage { opacity: 1; }

    .rnn-implications-s0 { animation-delay: 0.00s; }
    .rnn-implications-e0 { animation-delay: 0.00s; }
    .rnn-implications-s1 { animation-delay: 1.28s; }
    .rnn-implications-e1 { animation-delay: 1.28s; }
    .rnn-implications-s2 { animation-delay: 2.56s; }
    .rnn-implications-e2 { animation-delay: 2.56s; }
    .rnn-implications-s3 { animation-delay: 3.84s; }
    .rnn-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rnn-implications-conn  { animation: rnn-implications-trace 6.4s ease-in-out infinite; }
      .rnn-implications-stage { animation: rnn-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rnn-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rnn-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rnn-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rnn-implications-stage { animation: rnn-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rnn-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rnn-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rnn-implications-bg" width="980" height="322"/>
  <text class="rnn-implications-h1"  x="30" y="40">Four consequences of recurrence</text>
  <text class="rnn-implications-sub" x="30" y="64">Two are hardware.</text>
  <g class="rnn-implications-stage rnn-implications-s0">
    <rect class="rnn-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-implications-step" x="44" y="142">01</text>
    <text class="rnn-implications-name" x="70" y="142">Training cannot parallelise across time</text>
    <text class="rnn-implications-desc" x="44" y="166">Which leaves modern accelerators</text>
    <text class="rnn-implications-desc" x="44" y="182">mostly idle.</text>
  </g>
  <line class="rnn-implications-line rnn-implications-conn rnn-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rnn-implications-tip)"/>
  <g class="rnn-implications-stage rnn-implications-s1">
    <rect class="rnn-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-implications-step" x="280" y="142">02</text>
    <text class="rnn-implications-name" x="306" y="142">Unrolling holds every step's activations</text>
    <text class="rnn-implications-desc" x="280" y="166">Memory scales with sequence</text>
    <text class="rnn-implications-desc" x="280" y="182">length.</text>
  </g>
  <line class="rnn-implications-line rnn-implications-conn rnn-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rnn-implications-tip)"/>
  <g class="rnn-implications-stage rnn-implications-s2">
    <rect class="rnn-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-implications-step" x="516" y="142">03</text>
    <text class="rnn-implications-name" x="542" y="142">Effective memory is short</text>
    <text class="rnn-implications-desc" x="516" y="166">Ten to fifteen steps without</text>
    <text class="rnn-implications-desc" x="516" y="182">gating.</text>
  </g>
  <line class="rnn-implications-line rnn-implications-conn rnn-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rnn-implications-tip)"/>
  <g class="rnn-implications-stage rnn-implications-s3">
    <rect class="rnn-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rnn-implications-step" x="752" y="142">04</text>
    <text class="rnn-implications-name" x="778" y="142">But inference is cheap and constant</text>
    <text class="rnn-implications-desc" x="752" y="166">One state vector, regardless of</text>
    <text class="rnn-implications-desc" x="752" y="182">how much has been read.</text>
  </g>
  <text class="rnn-implications-sub" x="30" y="304">The inference property is genuinely attractive and is why recurrent formulations keep returning: a transformer's cost per generated token grows with context, and a recurrent model's does not.</text>
</svg>
