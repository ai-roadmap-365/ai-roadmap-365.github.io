terms:
  - term: 'Recurrent Neural Network (RNN)'
    definition: 'A class of neural networks where connections between nodes form a directed cycle along a temporal sequence, enabling internal memory states.'
  - term: 'Hidden State'
    definition: 'A continuous vector (h_t) serving as the sequential memory buffer updated at each time step based on current input and past hidden state.'
  - term: 'Backpropagation Through Time (BPTT)'
    definition: 'The algorithm that unrolls an RNN across sequential time steps and applies the chain rule backward from the final loss to early steps.'
  - term: 'Vanishing Gradient Problem'
    definition: 'The exponential decay of error gradients as they backpropagate across multiple recurrent time steps, preventing long-range dependency learning.'
  - term: 'Exploding Gradient Problem'
    definition: 'The exponential growth of error gradients across time steps, causing catastrophic numerical overflow and model divergence.'
  - term: 'Gradient Norm Clipping'
    definition: 'A regularization technique that rescales gradient vectors whose L2 norm exceeds a maximum threshold C to prevent optimization instability.'
  - term: 'Truncated BPTT'
    definition: 'An engineering practice of splitting long sequences into chunks of k time steps, limiting backpropagation depth to bound compute and memory.'
  - term: 'Temporal Equivariance'
    definition: 'The mathematical property ensuring that a sequential pattern is processed identically regardless of its absolute timestamp in the sequence.'
