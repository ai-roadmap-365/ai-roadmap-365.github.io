questions:
  - question: 'What is the core mathematical mechanism that distinguishes a Recurrent Neural Network (RNN) from a standard Feedforward Multilayer Perceptron (MLP)?'
    options:
      - 'RNNs only process images'
      - 'RNNs use two-dimensional convolutional kernels instead'
      - 'RNNs have no activation functions'
      - 'A hidden state carried and updated at every step'
    answer_index: 3
    explanation: 'Recurrent networks maintain a hidden state vector passed from step to step, allowing information to persist across sequential inputs.'
  - question: 'Why are the weight matrices W_xh, W_hh, and W_hy shared (identical) across all sequential time steps in an unrolled RNN?'
    options:
      - 'Sharing weights handles any length with fixed parameters'
      - 'It prevents PyTorch from running out of RAM'
      - 'Because backpropagation cannot calculate gradients for different matrices'
      - 'It converts the network into a Transformer'
    answer_index: 0
    explanation: 'Parameter sharing across time enforces temporal equivariance and allows the model to process sequences of arbitrary lengths.'
  - question: 'What is the primary cause of the Vanishing Gradient problem during Backpropagation Through Time (BPTT) in vanilla RNNs?'
    options:
      - 'The learning rate is too high'
      - 'Repeated multiplication by W_hh shrinks gradients'
      - 'The vocabulary size is too small'
      - 'Using float32 instead of float64'
    answer_index: 1
    explanation: 'Repeated Jacobian matrix products over long temporal horizons cause gradients to vanish exponentially, preventing long-range dependency learning.'
  - question: 'How does Gradient Norm Clipping prevent training divergence when encountering exploding gradients in RNNs?'
    options:
      - 'It stops training immediately'
      - 'It sets all of the negative gradients to zero instead'
      - 'It rescales the gradient when its norm exceeds C'
      - 'It reduces the batch size to 1'
    answer_index: 2
    explanation: 'Gradient clipping rescales the gradient vector proportionally when its total L2 norm exceeds threshold C, preserving the optimization descent direction.'
  - question: 'Which sequence modeling topology is used when an RNN takes a variable-length paragraph as input and predicts a single binary sentiment label?'
    options:
      - 'Many-to-Many (Synchronized)'
      - 'One-to-One'
      - 'One-to-Many'
      - 'Many-to-one, reading the final hidden state'
    answer_index: 3
    explanation: 'Many-to-one processes a full input sequence and uses the final time step hidden state for global sequence classification.'
