visuals:
  - id: rnn-unfolding-through-time
    file: assets/rnn-unfolding-through-time.svg
    type: diagram
    title: 'Recurrent Neural Network: Folded vs Unfolded Through Time'
    alt: Recurrent neural network folded loop representation unrolled into an explicit sequence of time steps with shared weight matrices
    description: 'Computational graph of a standard Recurrent Neural Network unfolded over sequential time steps showing shared weight matrices across time.'
  - id: bptt-gradient-vanishing-exploding
    file: assets/bptt-gradient-vanishing-exploding.svg
    type: diagram
    title: 'Backpropagation Through Time (BPTT) and Gradient Dynamics'
    alt: Backpropagation Through Time BPTT gradient propagation demonstrating exponential vanishing and exploding gradients across sequential steps
    description: 'Diagnostic visualization of gradient dynamics during Backpropagation Through Time (BPTT) causing exponential vanishing or exploding gradients.'
  - id: rnn-mechanics
    file: assets/rnn-mechanics.svg
    type: diagram
    title: 'What recurrence adds'
    alt: 'Diagram: how a recurrent network carries state across time steps'
    description: 'A four-stage description of recurrent computation covering the hidden state, the transition function, shared weights and the sequential dependency.'
  - id: bptt
    file: assets/bptt.svg
    type: diagram
    title: 'Backpropagation through time'
    alt: 'Diagram: how backpropagation through time unrolls a recurrent network'
    description: 'A four-stage description of BPTT covering unrolling, gradient accumulation across steps, the Jacobian product and truncation.'
  - id: vanishing-over-time
    file: assets/vanishing-over-time.svg
    type: diagram
    title: 'Vanishing and exploding, over time'
    alt: 'Diagram: vanishing and exploding gradients in recurrent networks'
    description: 'A two-column comparison of vanishing and exploding gradients in backpropagation through time.'
  - id: bidirectional
    file: assets/bidirectional.svg
    type: diagram
    title: 'Reading in both directions'
    alt: 'Diagram: unidirectional compared with bidirectional recurrent processing'
    description: 'A three-stage description of bidirectional recurrence covering the forward pass, the backward pass and the constraint it imposes.'
  - id: teacher-forcing
    file: assets/teacher-forcing.svg
    type: diagram
    title: 'Teacher forcing and exposure bias'
    alt: 'Diagram: teacher forcing during training compared with free-running generation'
    description: 'A four-stage description of teacher forcing covering the training regime, the generation regime, the resulting mismatch and its consequence.'
  - id: telephone
    file: assets/telephone.svg
    type: diagram
    title: 'A whispering game down a line'
    alt: 'Diagram: message degradation along a chain as an analogy for recurrent memory'
    description: 'A two-column comparison of a short and a long chain of message passing, as an analogy for recurrent memory span.'
  - id: rnn-alternatives
    file: assets/rnn-alternatives.svg
    type: diagram
    title: 'Where recurrence went'
    alt: 'Diagram: the trajectory of recurrent architectures from dominance to revival'
    description: 'A four-stage progression of recurrent architectures from vanilla RNNs through gating and transformer displacement to state space models.'
  - id: rnn-implications
    file: assets/rnn-implications.svg
    type: diagram
    title: 'Four consequences of recurrence'
    alt: 'Diagram: the parallelism, memory, length and inference implications of recurrent networks'
    description: 'A four-stage description of recurrent network implications covering training parallelism, memory during unrolling, sequence length limits and inference efficiency.'
  - id: rnn-when
    file: assets/rnn-when.svg
    type: diagram
    title: 'Where recurrence still fits'
    alt: 'Diagram: when recurrent architectures remain appropriate'
    description: 'A two-column comparison of situations where recurrence is still appropriate against those where attention dominates.'
