learning_promise: 'Master stateful sequential computation: derive recurrent hidden state transition equations, unroll computational graphs across time, implement Backpropagation Through Time (BPTT) from scratch, analyze vanishing and exploding gradient mechanics, apply gradient norm clipping, and build a character-level sequence generator in PyTorch.'
objectives:
  - 'Derive the hidden state recurrence equation h_t = tanh(W_hh * h_prev + W_xh * x_t + b_h) from first principles.'
  - 'Unroll recurrent computational graphs across time and implement Backpropagation Through Time (BPTT).'
  - 'Mathematically analyze the Jacobian product leading to exponential vanishing and exploding gradients.'
  - 'Implement gradient norm clipping to stabilize recurrent training loops.'
  - 'Construct, train, and sample from a character-level language generation RNN in pure PyTorch.'
