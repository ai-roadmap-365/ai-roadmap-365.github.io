terms:
  - term: 'torch.utils.data.Dataset'
    definition: 'An abstract class representing a dataset. Subclasses implement __len__ and __getitem__ to retrieve individual data samples.'
  - term: 'torch.utils.data.DataLoader'
    definition: 'A multi-process batching engine that combines a dataset and a sampler to yield mini-batches with automatic shuffling and worker management.'
  - term: 'collate_fn'
    definition: 'A callable argument in DataLoader that takes a list of sample objects and merges them into a batched tensor.'
  - term: 'num_workers'
    definition: 'The number of subprocesses spawned by DataLoader to load data asynchronously in parallel.'
  - term: 'pin_memory'
    definition: 'A boolean flag allocating CPU tensors in page-locked host memory for accelerated DMA transfers to accelerator devices.'
  - term: 'IterableDataset'
    definition: 'A PyTorch dataset subclass implementing __iter__ for sequential, out-of-core streaming data access.'
  - term: 'drop_last'
    definition: 'A DataLoader flag indicating whether to discard the final incomplete mini-batch if dataset size is not divisible by batch_size.'
  - term: 'Dynamic Padding'
    definition: 'Padding sequences in a mini-batch to the maximum length of that specific batch, rather than a global fixed maximum length.'
