questions:
  - question: 'What two magic methods must you implement when subclassing torch.utils.data.Dataset for map-style index access?'
    options:
      - '__len__ and __getitem__'
      - '__init__ and __repr__'
      - '__call__ and __iter__'
      - '__enter__ and __exit__'
    answer_index: 0
    explanation: 'Map-style Datasets require __len__ to know the dataset size and __getitem__ to retrieve a single item given an integer index.'
  - question: 'How does setting num_workers > 0 in a PyTorch DataLoader prevent GPU starvation during training?'
    options:
      - 'It increases GPU clock speeds'
      - 'It loads and transforms future batches in parallel'
      - 'It compresses tensors using gzip'
      - 'It automatically downloads more RAM'
    answer_index: 1
    explanation: 'num_workers parallelizes CPU-bound I/O and data transformations across worker processes, ensuring pre-fetched batches are immediately ready for model execution.'
  - question: 'What is the primary role of a custom collate_fn passed to a DataLoader?'
    options:
      - 'It computes weight gradients'
      - 'It calculates the model''s cross-entropy loss value'
      - 'How individual samples are merged into one batch'
      - 'It shuffles samples across epochs'
    answer_index: 2
    explanation: 'collate_fn defines how raw sample lists are collated, stacked, or padded into uniform mini-batch tensors.'
  - question: 'Why should you set pin_memory=True when training on CUDA/GPU hardware with a DataLoader?'
    options:
      - 'It forces weights to zero'
      - 'It prevents RAM from overheating'
      - 'It saves dataset tensors to a permanent USB flash drive'
      - 'It uses pinned memory for fast async GPU copies'
    answer_index: 3
    explanation: 'Pinned host memory allows the GPU DMA controller to copy batch tensors directly into device RAM without OS page-fault interruptions.'
  - question: 'When is it appropriate to use an IterableDataset instead of a map-style Dataset in PyTorch?'
    options:
      - 'For huge streams where random indexing is impossible'
      - 'When the dataset has fewer than 10 samples'
      - 'When training on a spreadsheet'
      - 'Never, IterableDataset is deprecated'
    answer_index: 0
    explanation: 'IterableDataset is designed for streaming data from cloud storage, message queues, or massive file shards where random seeking is impractical.'
