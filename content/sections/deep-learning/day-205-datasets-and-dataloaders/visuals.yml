visuals:
  - id: pytorch-dataset-dataloader-pipeline
    file: assets/pytorch-dataset-dataloader-pipeline.svg
    type: diagram
    title: PyTorch Dataset and DataLoader Multi-Process Pipeline Architecture
    alt: PyTorch data pipeline architecture showing Dataset index retrieval multi process workers batch collation and pinned memory transfer to training loop
    description: High-throughput PyTorch data pipeline illustrating custom Dataset definition, multi-worker process pools for asynchronous I/O, batch collation, and pinned host memory transfers.
  - id: custom-collate-padding-architecture
    file: assets/custom-collate-padding-architecture.svg
    type: diagram
    title: Custom collate_fn Dynamic Sequence Padding and Collation Architecture
    alt: Custom collate function showing variable length sequences padded with padding tokens to uniform batch tensor dimensions
    description: Dynamic batch collation workflow demonstrating how custom collate functions pad ragged variable-length sequences to batch-local maximum length and construct attention masks.
  - id: two-tier
    file: assets/two-tier.svg
    type: diagram
    title: 'Two abstractions, two jobs'
    alt: 'Diagram: the dataset and dataloader abstractions compared'
    description: 'A two-column comparison of the dataset abstraction against the dataloader abstraction by responsibility.'
  - id: getitem-rules
    file: assets/getitem-rules.svg
    type: diagram
    title: 'Two rules for `__getitem__`'
    alt: 'Diagram: the two rules governing sample loading in a dataset'
    description: 'A three-stage description of dataset implementation rules covering lazy loading, per-sample augmentation and the memory consequence.'
  - id: loader-params
    file: assets/loader-params.svg
    type: diagram
    title: 'Five loader parameters'
    alt: 'Diagram: the five DataLoader parameters that determine throughput and correctness'
    description: 'A five-stage description of DataLoader parameters covering batch size, shuffling, workers, pinned memory and dropping the last batch.'
  - id: collate
    file: assets/collate.svg
    type: diagram
    title: 'Why sequences need a custom collate'
    alt: 'Diagram: default collation compared with padded collation for variable-length sequences'
    description: 'A four-stage description of collation covering the default assumption, variable-length failure, padding and the length mask.'
  - id: map-or-iterable
    file: assets/map-or-iterable.svg
    type: diagram
    title: 'Indexed, or streamed'
    alt: 'Diagram: map-style datasets compared with iterable streaming datasets'
    description: 'A two-column comparison of indexed map-style datasets against streaming iterable datasets.'
  - id: sampling-strategies
    file: assets/sampling-strategies.svg
    type: diagram
    title: 'Sampling is a modelling decision'
    alt: 'Diagram: uniform, weighted and distributed sampling compared'
    description: 'A three-stage description of sampling strategies covering uniform shuffling, weighted sampling for imbalance and distributed sampling across ranks.'
  - id: kitchen-pipeline
    file: assets/kitchen-pipeline.svg
    type: diagram
    title: 'A restaurant kitchen'
    alt: 'Diagram: serial preparation compared with prep running in parallel with service'
    description: 'A two-column comparison of serial kitchen work against parallel preparation and service.'
  - id: loader-implications
    file: assets/loader-implications.svg
    type: diagram
    title: 'Four operational consequences'
    alt: 'Diagram: the throughput, memory, determinism and debugging implications of data loaders'
    description: 'A four-stage description of data loading implications covering GPU starvation, worker memory, reproducibility and debugging.'
  - id: loader-when
    file: assets/loader-when.svg
    type: diagram
    title: 'When the abstraction earns its cost'
    alt: 'Diagram: when to use dataset and dataloader abstractions'
    description: 'A two-column comparison of situations requiring a full data pipeline against those where in-memory arrays suffice.'
  - id: loader-pathologies
    file: assets/loader-pathologies.svg
    type: diagram
    title: 'Four pathologies without a pipeline'
    alt: 'Diagram: the four data pipeline pathologies a dataset abstraction prevents'
    description: 'A four-stage description of data pipeline failures covering memory exhaustion, serial loading, fixed augmentation and unreproducible ordering.'
