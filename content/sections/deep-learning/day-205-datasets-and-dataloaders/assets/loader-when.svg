<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when arrays are enough.">
  <title>When the abstraction earns its cost</title>
  <style>
    .loader-when-bg   { fill: #f8fafc; }
    .loader-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loader-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loader-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loader-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loader-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loader-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loader-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loader-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loader-when-row { opacity: 1; }
    .loader-when-r0 { animation-delay: 0.00s; }
    .loader-when-r1 { animation-delay: 0.45s; }
    .loader-when-r2 { animation-delay: 0.90s; }
    .loader-when-r3 { animation-delay: 1.35s; }
    .loader-when-r4 { animation-delay: 1.80s; }
    .loader-when-row { animation: loader-when-reveal 7.3s ease-in-out infinite; }
    @keyframes loader-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loader-when-bg" width="980" height="390"/>
  <text class="loader-when-h1"  x="30" y="40">When the abstraction earns its cost</text>
  <text class="loader-when-sub" x="30" y="64">And when arrays are enough.</text>
  <rect class="loader-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loader-when-name" x="46" y="122">Use the pipeline</text>
  <text class="loader-when-desc" x="46" y="142">Anything beyond memory.</text>
  <text class="loader-when-desc loader-when-row loader-when-r0" x="46" y="182">Data larger than a few megabytes</text>
  <text class="loader-when-desc loader-when-row loader-when-r1" x="46" y="216">Per-sample augmentation</text>
  <text class="loader-when-desc loader-when-row loader-when-r2" x="46" y="250">Variable-length or structured samples</text>
  <text class="loader-when-desc loader-when-row loader-when-r3" x="46" y="284">Multi-process loading</text>
  <text class="loader-when-desc loader-when-row loader-when-r4" x="46" y="318">Distributed training</text>
  <rect class="loader-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loader-when-name" x="526" y="122">Arrays are enough</text>
  <text class="loader-when-desc" x="526" y="142">Small and static.</text>
  <text class="loader-when-desc loader-when-row loader-when-r0" x="526" y="182">Small tabular datasets</text>
  <text class="loader-when-desc loader-when-row loader-when-r1" x="526" y="216">Classical models</text>
  <text class="loader-when-desc loader-when-row loader-when-r2" x="526" y="250">No augmentation</text>
  <text class="loader-when-desc loader-when-row loader-when-r3" x="526" y="284">Everything fits in memory</text>
  <text class="loader-when-desc loader-when-row loader-when-r4" x="526" y="318">The abstraction adds nothing</text>
  <text class="loader-when-sub" x="30" y="372">The threshold arrives sooner than expected on images: a dataset of ten thousand photographs is comfortably beyond in-memory handling once decoding and augmentation are involved.</text>
</svg>
