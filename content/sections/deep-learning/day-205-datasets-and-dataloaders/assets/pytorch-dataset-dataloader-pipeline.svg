<svg role="img" aria-label="PyTorch data pipeline architecture showing Dataset index retrieval multi process workers batch collation and pinned memory transfer to training loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PyTorch Dataset and DataLoader Multi-Process Pipeline Architecture</title>
  <defs>
    <linearGradient id="bg205a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card205" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg205a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PYTORCH DATASET &amp; DATALOADER PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Raw Disk Samples to Multi-Worker Pinned Memory Mini-Batches</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card205)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Stage 1: Custom Dataset -->
    <rect x="25" y="35" width="155" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="102" y="60" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Custom Dataset</text>
    <text x="102" y="85" fill="#cbd5e1" font-size="9" text-anchor="middle">class ImageDS(Dataset):</text>
    <rect x="40" y="100" width="125" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="102" y="118" fill="#f8fafc" font-size="8" text-anchor="middle">def __len__(self):</text>
    <text x="102" y="132" fill="#94a3b8" font-size="8" text-anchor="middle">return len(samples)</text>
    <rect x="40" y="150" width="125" height="50" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="102" y="168" fill="#f8fafc" font-size="8" text-anchor="middle">def __getitem__(self, idx):</text>
    <text x="102" y="182" fill="#94a3b8" font-size="8" text-anchor="middle">image, label = load(idx)</text>
    <text x="102" y="194" fill="#34d399" font-size="8" text-anchor="middle">return transform(img), y</text>
    <text x="102" y="235" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Sample-Level Logic</text>

    <!-- Arrow 1 -->
    <line x1="180" y1="147" x2="230" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="205" y="137" fill="#fbbf24" font-size="8" text-anchor="middle">Indices</text>

    <!-- Stage 2: Sampler & Multi-Workers -->
    <rect x="230" y="35" width="165" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="312" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Multi-Workers</text>
    <rect x="245" y="80" width="135" height="32" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="312" y="100" fill="#cbd5e1" font-size="8" text-anchor="middle">Worker 0 (Proc 101)</text>
    <rect x="245" y="120" width="135" height="32" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="312" y="140" fill="#cbd5e1" font-size="8" text-anchor="middle">Worker 1 (Proc 102)</text>
    <rect x="245" y="160" width="135" height="32" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="312" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">Worker 2 (Proc 103)</text>
    <text x="312" y="225" fill="#94a3b8" font-size="8" text-anchor="middle">num_workers=4 (Async I/O)</text>
    <text x="312" y="245" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Parallel Loading</text>

    <!-- Arrow 2 -->
    <line x1="395" y1="147" x2="445" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="420" y="137" fill="#fbbf24" font-size="8" text-anchor="middle">Samples</text>

    <!-- Stage 3: Collate Function -->
    <rect x="445" y="35" width="145" height="225" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="517" y="60" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Collate Function</text>
    <text x="517" y="90" fill="#cbd5e1" font-size="8" text-anchor="middle">collate_fn(batch_list)</text>
    <rect x="460" y="110" width="115" height="75" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="517" y="130" fill="#f8fafc" font-size="8" text-anchor="middle">Stack Tensors:</text>
    <text x="517" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">torch.stack(imgs)</text>
    <text x="517" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">torch.tensor(lbls)</text>
    <text x="517" y="215" fill="#94a3b8" font-size="8" text-anchor="middle">Shape: (B, C, H, W)</text>
    <text x="517" y="235" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Batch Assembly</text>

    <!-- Arrow 3 -->
    <line x1="590" y1="147" x2="635" y2="147" stroke="#94a3b8" stroke-width="2"/>
    <text x="612" y="137" fill="#fbbf24" font-size="8" text-anchor="middle">Batch</text>

    <!-- Stage 4: Training Step -->
    <rect x="635" y="35" width="105" height="225" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="687" y="60" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Training</text>
    <rect x="645" y="85" width="85" height="40" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="687" y="103" fill="#38bdf8" font-size="8" text-anchor="middle">pin_memory</text>
    <text x="687" y="117" fill="#94a3b8" font-size="7" text-anchor="middle">Non-blocking DMA</text>
    <rect x="645" y="140" width="85" height="50" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="687" y="158" fill="#f8fafc" font-size="8" text-anchor="middle">for X, y in</text>
    <text x="687" y="172" fill="#34d399" font-size="8" text-anchor="middle">dataloader:</text>
    <text x="687" y="235" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">Model Forward</text>
  </g>
</svg>
