<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One sample, and one batch.">
  <title>Two abstractions, two jobs</title>
  <style>
    .two-tier-bg   { fill: #f8fafc; }
    .two-tier-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-tier-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-tier-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-tier-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-tier-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .two-tier-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-tier-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .two-tier-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .two-tier-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .two-tier-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .two-tier-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .two-tier-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .two-tier-row { opacity: 1; }
    .two-tier-r0 { animation-delay: 0.00s; }
    .two-tier-r1 { animation-delay: 0.45s; }
    .two-tier-r2 { animation-delay: 0.90s; }
    .two-tier-r3 { animation-delay: 1.35s; }
    .two-tier-r4 { animation-delay: 1.80s; }
    .two-tier-row { animation: two-tier-reveal 7.3s ease-in-out infinite; }
    @keyframes two-tier-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="two-tier-bg" width="980" height="390"/>
  <text class="two-tier-h1"  x="30" y="40">Two abstractions, two jobs</text>
  <text class="two-tier-sub" x="30" y="64">One sample, and one batch.</text>
  <rect class="two-tier-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="two-tier-name" x="46" y="122">Dataset</text>
  <text class="two-tier-desc" x="46" y="142">One sample.</text>
  <text class="two-tier-desc two-tier-row two-tier-r0" x="46" y="182">How many samples are there?</text>
  <text class="two-tier-desc two-tier-row two-tier-r1" x="46" y="216">Give me sample i</text>
  <text class="two-tier-desc two-tier-row two-tier-r2" x="46" y="250">Read the file, decode it</text>
  <text class="two-tier-desc two-tier-row two-tier-r3" x="46" y="284">Apply per-sample augmentation</text>
  <text class="two-tier-desc two-tier-row two-tier-r4" x="46" y="318">Knows nothing about batches</text>
  <rect class="two-tier-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="two-tier-name" x="526" y="122">DataLoader</text>
  <text class="two-tier-desc" x="526" y="142">Orchestration.</text>
  <text class="two-tier-desc two-tier-row two-tier-r0" x="526" y="182">Shuffling and sampling order</text>
  <text class="two-tier-desc two-tier-row two-tier-r1" x="526" y="216">Batching and collation</text>
  <text class="two-tier-desc two-tier-row two-tier-r2" x="526" y="250">Worker processes and prefetching</text>
  <text class="two-tier-desc two-tier-row two-tier-r3" x="526" y="284">Pinned memory and transfer</text>
  <text class="two-tier-desc two-tier-row two-tier-r4" x="526" y="318">Knows nothing about your data format</text>
  <text class="two-tier-sub" x="30" y="372">The separation is what makes both reusable: a dataset written once works with any batching strategy, and a loader configuration transfers across every dataset you own.</text>
</svg>
