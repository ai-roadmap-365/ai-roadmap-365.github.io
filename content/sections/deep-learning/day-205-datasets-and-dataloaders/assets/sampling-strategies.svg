<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three strategies, three purposes.">
  <title>Sampling is a modelling decision</title>
  <style>
    .sampling-strategies-bg   { fill: #f8fafc; }
    .sampling-strategies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-strategies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-strategies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-strategies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-strategies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sampling-strategies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sampling-strategies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sampling-strategies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sampling-strategies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sampling-strategies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sampling-strategies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sampling-strategies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sampling-strategies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sampling-strategies-stage { opacity: 1; }

    .sampling-strategies-s0 { animation-delay: 0.00s; }
    .sampling-strategies-e0 { animation-delay: 0.00s; }
    .sampling-strategies-s1 { animation-delay: 1.50s; }
    .sampling-strategies-e1 { animation-delay: 1.50s; }
    .sampling-strategies-s2 { animation-delay: 3.00s; }
    .sampling-strategies-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .sampling-strategies-conn  { animation: sampling-strategies-trace 6s ease-in-out infinite; }
      .sampling-strategies-stage { animation: sampling-strategies-arrive 6s ease-in-out infinite; }
    }
    @keyframes sampling-strategies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sampling-strategies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sampling-strategies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sampling-strategies-stage { animation: sampling-strategies-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sampling-strategies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sampling-strategies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sampling-strategies-bg" width="980" height="322"/>
  <text class="sampling-strategies-h1"  x="30" y="40">Sampling is a modelling decision</text>
  <text class="sampling-strategies-sub" x="30" y="64">Three strategies, three purposes.</text>
  <g class="sampling-strategies-stage sampling-strategies-s0">
    <rect class="sampling-strategies-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="sampling-strategies-step" x="44" y="142">01</text>
    <text class="sampling-strategies-name" x="70" y="142">Uniform shuffling</text>
    <text class="sampling-strategies-desc" x="44" y="166">The default. Every sample equally likely,</text>
    <text class="sampling-strategies-desc" x="44" y="182">once per epoch.</text>
  </g>
  <line class="sampling-strategies-line sampling-strategies-conn sampling-strategies-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#sampling-strategies-tip)"/>
  <g class="sampling-strategies-stage sampling-strategies-s1">
    <rect class="sampling-strategies-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="sampling-strategies-step" x="359" y="142">02</text>
    <text class="sampling-strategies-name" x="385" y="142">Weighted sampling</text>
    <text class="sampling-strategies-desc" x="359" y="166">Probability inverse to class frequency.</text>
    <text class="sampling-strategies-desc" x="359" y="182">Changes what the model optimises.</text>
  </g>
  <line class="sampling-strategies-line sampling-strategies-conn sampling-strategies-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#sampling-strategies-tip)"/>
  <g class="sampling-strategies-stage sampling-strategies-s2">
    <rect class="sampling-strategies-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="sampling-strategies-step" x="674" y="142">03</text>
    <text class="sampling-strategies-name" x="700" y="142">Distributed sampling</text>
    <text class="sampling-strategies-desc" x="674" y="166">Each rank gets a disjoint shard, reshuffled</text>
    <text class="sampling-strategies-desc" x="674" y="182">per epoch by a shared seed.</text>
  </g>
  <text class="sampling-strategies-sub" x="30" y="304">Weighted sampling is a modelling choice made in the data pipeline, which is worth stating explicitly: it alters the effective loss before any loss function has been written.</text>
</svg>
