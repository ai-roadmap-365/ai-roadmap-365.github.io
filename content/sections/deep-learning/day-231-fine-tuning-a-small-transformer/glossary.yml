terms:
  - term: 'Transfer Learning'
    definition: 'Adapting a model pretrained on a massive general corpus to a specific downstream domain task using a small labeled dataset.'
  - term: 'Catastrophic Forgetting'
    definition: 'The destructive phenomenon where fine-tuning abruptly overwrites foundational pretraining feature representations.'
  - term: 'Layer-wise Learning Rate Decay (LLRD)'
    definition: 'A hyperparameter schedule applying exponentially decaying learning rates to lower layers of a transformer.'
  - term: 'AdamW'
    definition: 'An adaptive optimizer decoupling L2 weight decay from moving average gradient moment updates.'
  - term: 'Learning Rate Warmup'
    definition: 'Linearly scaling the learning rate from 0 to peak value over initial steps to protect early weights from violent updates.'
  - term: 'ONNX Runtime'
    definition: 'A high-performance inference engine for executing neural network computational graphs across heterogeneous hardware.'
  - term: 'Early Stopping'
    definition: 'A regularization technique halting training when validation loss fails to improve for a patience threshold.'
  - term: 'Knowledge Distillation'
    definition: 'A compression technique training a compact student model to mimic the output probability distributions of a large teacher.'
