questions:
  - question: 'What is Catastrophic Forgetting in the context of fine-tuning pretrained transformer models?'
    options:
      - 'When the computer runs out of disk space'
      - 'Updates overwrite what pretraining learned'
      - 'When the tokenizer deletes the vocabulary'
      - 'When the model switches from PyTorch to TensorFlow'
    answer_index: 1
    explanation: 'Catastrophic forgetting occurs when downstream optimization wipes out pre-existing pretraining representations.'
  - question: 'How does Layer-wise Learning Rate Decay (LLRD) protect early transformer layers from catastrophic forgetting?'
    options:
      - 'It doubles the learning rate after every epoch'
      - 'It sets the learning rate to zero for all layers'
      - 'Lower layers get smaller learning rates'
      - 'It trains only on even-numbered days'
    answer_index: 2
    explanation: 'LLRD assigns smaller learning rates to bottom layers, preserving generalized linguistic representations while specializing top layers.'
  - question: 'Why is AdamW (Loshchilov & Hutter, 2017) preferred over standard Adam with L2 regularization when fine-tuning transformers?'
    options:
      - 'AdamW eliminates the need for backpropagation'
      - 'AdamW runs on CPUs only'
      - 'AdamW deletes negative gradients'
      - 'AdamW decouples weight decay from the gradient'
    answer_index: 3
    explanation: 'Decoupled weight decay in AdamW ensures correct regularization behavior in adaptive gradient methods.'
  - question: 'What is the primary benefit of exporting a fine-tuned transformer model to ONNX (Open Neural Network Exchange) Runtime format?'
    options:
      - 'Graph fusion and INT8 quantization'
      - 'ONNX makes the model train 10 times faster'
      - 'ONNX converts text into images'
      - 'ONNX requires no dependencies'
    answer_index: 0
    explanation: 'ONNX Runtime performs graph level operator fusion and quantization, delivering low-latency production inference.'
  - question: 'What is the recommended rule of thumb for fine-tuning learning rates on small transformer models (e.g. DistilBERT / BERT-Base)?'
    options:
      - 'Use 0.1 to train as fast as possible'
      - '2e-5 to 5e-5 with a short warmup'
      - 'Use 1e-9'
      - 'Keep learning rate constant at 1.0'
    answer_index: 1
    explanation: 'Pretrained transformers require gentle fine-tuning learning rates (2e-5 to 5e-5) with warmup to avoid destroying pretrained weights.'
