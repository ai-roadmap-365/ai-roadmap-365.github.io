week: 33
learning_promise: 'Master end-to-end transfer learning and fine-tuning on a lightweight transformer model (DistilBERT / MiniLM / RoBERTa-Small): understand catastrophic forgetting and parameter regularization, configure Layer-wise Learning Rate Decay (LLRD), implement learning rate warmup and cosine annealing, prevent small-dataset overfitting, and export to ONNX Runtime for sub-millisecond production inference.'
objectives:
  - 'Derive the Layer-wise Learning Rate Decay (LLRD) equation: eta_l = eta_top * xi^(L - l) to prevent catastrophic forgetting.'
  - 'Implement a complete transfer learning pipeline using DistilBERT on a custom domain classification dataset.'
  - 'Configure training regularizations: AdamW decoupled weight decay, linear warmup schedules, and early stopping callbacks.'
  - 'Diagnose and mitigate fine-tuning instability: gradient clipping, label smoothing, and evaluation loss divergence.'
  - 'Export a fine-tuned transformer model to ONNX Runtime format and benchmark CPU inference latency.'
