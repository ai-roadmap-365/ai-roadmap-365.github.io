<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And the fix that costs nothing.">
  <title>Catastrophic forgetting</title>
  <style>
    .forgetting-bg   { fill: #f8fafc; }
    .forgetting-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forgetting-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forgetting-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forgetting-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forgetting-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forgetting-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forgetting-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forgetting-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forgetting-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forgetting-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forgetting-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forgetting-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forgetting-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forgetting-stage { opacity: 1; }

    .forgetting-s0 { animation-delay: 0.00s; }
    .forgetting-e0 { animation-delay: 0.00s; }
    .forgetting-s1 { animation-delay: 1.28s; }
    .forgetting-e1 { animation-delay: 1.28s; }
    .forgetting-s2 { animation-delay: 2.56s; }
    .forgetting-e2 { animation-delay: 2.56s; }
    .forgetting-s3 { animation-delay: 3.84s; }
    .forgetting-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forgetting-conn  { animation: forgetting-trace 6.4s ease-in-out infinite; }
      .forgetting-stage { animation: forgetting-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forgetting-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forgetting-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forgetting-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forgetting-stage { animation: forgetting-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forgetting-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forgetting-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forgetting-bg" width="980" height="322"/>
  <text class="forgetting-h1"  x="30" y="40">Catastrophic forgetting</text>
  <text class="forgetting-sub" x="30" y="64">And the fix that costs nothing.</text>
  <g class="forgetting-stage forgetting-s0">
    <rect class="forgetting-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forgetting-step" x="44" y="142">01</text>
    <text class="forgetting-name" x="70" y="142">The new head is random</text>
    <text class="forgetting-desc" x="44" y="166">Its first predictions are wrong</text>
    <text class="forgetting-desc" x="44" y="182">by a lot.</text>
  </g>
  <line class="forgetting-line forgetting-conn forgetting-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forgetting-tip)"/>
  <g class="forgetting-stage forgetting-s1">
    <rect class="forgetting-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forgetting-step" x="280" y="142">02</text>
    <text class="forgetting-name" x="306" y="142">So the first gradients are large</text>
    <text class="forgetting-desc" x="280" y="166">And they flow back through every</text>
    <text class="forgetting-desc" x="280" y="182">layer.</text>
  </g>
  <line class="forgetting-line forgetting-conn forgetting-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forgetting-tip)"/>
  <g class="forgetting-stage forgetting-s2">
    <rect class="forgetting-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forgetting-step" x="516" y="142">03</text>
    <text class="forgetting-name" x="542" y="142">Damaging what was already learned</text>
    <text class="forgetting-desc" x="516" y="166">General language representations</text>
    <text class="forgetting-desc" x="516" y="182">overwritten by noise.</text>
  </g>
  <line class="forgetting-line forgetting-conn forgetting-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forgetting-tip)"/>
  <g class="forgetting-stage forgetting-s3">
    <rect class="forgetting-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forgetting-step" x="752" y="142">04</text>
    <text class="forgetting-name" x="778" y="142">Give lower layers smaller rates</text>
    <text class="forgetting-desc" x="752" y="166">Decaying downward. The head</text>
    <text class="forgetting-desc" x="752" y="182">adapts, the base survives.</text>
  </g>
  <text class="forgetting-sub" x="30" y="304">Warmup addresses the same problem from a different direction, which is why the two are almost always used together rather than as alternatives.</text>
</svg>
