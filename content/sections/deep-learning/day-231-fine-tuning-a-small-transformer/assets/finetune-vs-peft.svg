<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What you update.">
  <title>Full fine-tuning against adapters</title>
  <style>
    .finetune-vs-peft-bg   { fill: #f8fafc; }
    .finetune-vs-peft-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-peft-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-peft-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-peft-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-peft-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-vs-peft-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-vs-peft-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-vs-peft-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-vs-peft-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-vs-peft-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-vs-peft-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-vs-peft-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-vs-peft-row { opacity: 1; }
    .finetune-vs-peft-r0 { animation-delay: 0.00s; }
    .finetune-vs-peft-r1 { animation-delay: 0.45s; }
    .finetune-vs-peft-r2 { animation-delay: 0.90s; }
    .finetune-vs-peft-r3 { animation-delay: 1.35s; }
    .finetune-vs-peft-r4 { animation-delay: 1.80s; }
    .finetune-vs-peft-row { animation: finetune-vs-peft-reveal 7.3s ease-in-out infinite; }
    @keyframes finetune-vs-peft-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="finetune-vs-peft-bg" width="980" height="390"/>
  <text class="finetune-vs-peft-h1"  x="30" y="40">Full fine-tuning against adapters</text>
  <text class="finetune-vs-peft-sub" x="30" y="64">What you update.</text>
  <rect class="finetune-vs-peft-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-vs-peft-name" x="46" y="122">Full fine-tuning</text>
  <text class="finetune-vs-peft-desc" x="46" y="142">Every weight moves.</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r0" x="46" y="182">Highest ceiling on accuracy</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r1" x="46" y="216">Needs optimiser state for every parameter</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r2" x="46" y="250">One full model per task</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r3" x="46" y="284">Best for a single high-value task</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r4" x="46" y="318">Practical below a billion parameters</text>
  <rect class="finetune-vs-peft-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-vs-peft-name" x="526" y="122">Adapters</text>
  <text class="finetune-vs-peft-desc" x="526" y="142">A fraction moves.</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r0" x="526" y="182">Nearly the same accuracy, usually</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r1" x="526" y="216">A small fraction of the memory</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r2" x="526" y="250">One backbone, many small task files</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r3" x="526" y="284">Best when serving many tasks</text>
  <text class="finetune-vs-peft-desc finetune-vs-peft-row finetune-vs-peft-r4" x="526" y="318">Practical far above a billion parameters</text>
  <text class="finetune-vs-peft-sub" x="30" y="372">The deployment shape matters as much as the training cost: one shared backbone with swappable adapters is a different serving architecture, not just a cheaper training run.</text>
</svg>
