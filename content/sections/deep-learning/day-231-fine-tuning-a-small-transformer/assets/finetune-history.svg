<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fifteen years, compressed.">
  <title>Four steps to modern fine-tuning</title>
  <style>
    .finetune-history-bg   { fill: #f8fafc; }
    .finetune-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .finetune-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .finetune-history-stage { opacity: 1; }

    .finetune-history-s0 { animation-delay: 0.00s; }
    .finetune-history-e0 { animation-delay: 0.00s; }
    .finetune-history-s1 { animation-delay: 1.28s; }
    .finetune-history-e1 { animation-delay: 1.28s; }
    .finetune-history-s2 { animation-delay: 2.56s; }
    .finetune-history-e2 { animation-delay: 2.56s; }
    .finetune-history-s3 { animation-delay: 3.84s; }
    .finetune-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .finetune-history-conn  { animation: finetune-history-trace 6.4s ease-in-out infinite; }
      .finetune-history-stage { animation: finetune-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes finetune-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes finetune-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .finetune-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .finetune-history-stage { animation: finetune-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes finetune-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="finetune-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="finetune-history-bg" width="980" height="322"/>
  <text class="finetune-history-h1"  x="30" y="40">Four steps to modern fine-tuning</text>
  <text class="finetune-history-sub" x="30" y="64">Fifteen years, compressed.</text>
  <g class="finetune-history-stage finetune-history-s0">
    <rect class="finetune-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="finetune-history-step" x="44" y="142">01</text>
    <text class="finetune-history-name" x="70" y="142">Frozen features</text>
    <text class="finetune-history-desc" x="44" y="166">Use a pretrained network's</text>
    <text class="finetune-history-desc" x="44" y="182">outputs as inputs to a new</text>
    <text class="finetune-history-desc" x="44" y="198">classifier.</text>
  </g>
  <line class="finetune-history-line finetune-history-conn finetune-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#finetune-history-tip)"/>
  <g class="finetune-history-stage finetune-history-s1">
    <rect class="finetune-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="finetune-history-step" x="280" y="142">02</text>
    <text class="finetune-history-name" x="306" y="142">Pretrained word vectors</text>
    <text class="finetune-history-desc" x="280" y="166">Transfer at the embedding layer</text>
    <text class="finetune-history-desc" x="280" y="182">only. A partial answer.</text>
  </g>
  <line class="finetune-history-line finetune-history-conn finetune-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#finetune-history-tip)"/>
  <g class="finetune-history-stage finetune-history-s2">
    <rect class="finetune-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="finetune-history-step" x="516" y="142">03</text>
    <text class="finetune-history-name" x="542" y="142">Fine-tune the whole model</text>
    <text class="finetune-history-desc" x="516" y="166">Which turned out to work far</text>
    <text class="finetune-history-desc" x="516" y="182">better than anyone expected.</text>
  </g>
  <line class="finetune-history-line finetune-history-conn finetune-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#finetune-history-tip)"/>
  <g class="finetune-history-stage finetune-history-s3">
    <rect class="finetune-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="finetune-history-step" x="752" y="142">04</text>
    <text class="finetune-history-name" x="778" y="142">Then fine-tune almost none of it</text>
    <text class="finetune-history-desc" x="752" y="166">Small adapters on a frozen base,</text>
    <text class="finetune-history-desc" x="752" y="182">at a fraction of the cost.</text>
  </g>
  <text class="finetune-history-sub" x="30" y="304">The pattern moved from transferring less to transferring everything and back again, but the return was for cost reasons rather than because full fine-tuning stopped working.</text>
</svg>
