<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a prompt is enough.">
  <title>When to fine-tune</title>
  <style>
    .finetune-when-bg   { fill: #f8fafc; }
    .finetune-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .finetune-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .finetune-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .finetune-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .finetune-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .finetune-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .finetune-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .finetune-when-row { opacity: 1; }
    .finetune-when-r0 { animation-delay: 0.00s; }
    .finetune-when-r1 { animation-delay: 0.45s; }
    .finetune-when-r2 { animation-delay: 0.90s; }
    .finetune-when-r3 { animation-delay: 1.35s; }
    .finetune-when-r4 { animation-delay: 1.80s; }
    .finetune-when-row { animation: finetune-when-reveal 7.3s ease-in-out infinite; }
    @keyframes finetune-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="finetune-when-bg" width="980" height="390"/>
  <text class="finetune-when-h1"  x="30" y="40">When to fine-tune</text>
  <text class="finetune-when-sub" x="30" y="64">And when a prompt is enough.</text>
  <rect class="finetune-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-when-name" x="46" y="122">Fine-tune</text>
  <text class="finetune-when-desc" x="46" y="142">Narrow, repeated, high volume.</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r0" x="46" y="182">A fixed task run millions of times</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r1" x="46" y="216">Latency budgets under ten milliseconds</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r2" x="46" y="250">Data that cannot leave your infrastructure</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r3" x="46" y="284">Domain language a general model misreads</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r4" x="46" y="318">Where labelled examples already exist</text>
  <rect class="finetune-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="finetune-when-name" x="526" y="122">Prompt instead</text>
  <text class="finetune-when-desc" x="526" y="142">Broad or changing.</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r0" x="526" y="182">Requirements still moving</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r1" x="526" y="216">Fewer than a few hundred examples</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r2" x="526" y="250">Many varied tasks, low volume</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r3" x="526" y="284">Open-ended generation</text>
  <text class="finetune-when-desc finetune-when-row finetune-when-r4" x="526" y="318">Where a prototype is the goal</text>
  <text class="finetune-when-sub" x="30" y="372">The volume threshold is the practical deciding factor: below a few hundred thousand calls, the engineering cost of a fine-tune rarely repays the per-call saving.</text>
</svg>
