visuals:
  - id: fine-tuning-transfer-learning-transformer-pipeline
    file: assets/fine-tuning-transfer-learning-transformer-pipeline.svg
    type: diagram
    title: 'Transformer Fine-Tuning Pipeline and LLRD'
    alt: End-to-end transformer fine-tuning pipeline showing pretrained backbone layer-wise learning rates classifier head backpropagation and checkpointing
    description: 'Transfer learning framework with layer-wise learning rate decay across transformer depth.'
  - id: catastrophic-forgetting-vs-llrd-regularization
    file: assets/catastrophic-forgetting-vs-llrd-regularization.svg
    type: diagram
    title: 'Catastrophic Forgetting vs. LLRD Regularization'
    alt: Catastrophic forgetting versus layer-wise learning rate decay diagram comparing weight disruption
    description: 'Comparison of naive uniform fine-tuning vs Layer-wise Learning Rate Decay (LLRD) preserving foundational representations.'
  - id: finetune-loop
    file: assets/finetune-loop.svg
    type: diagram
    title: 'Fine-tuning, end to end'
    alt: 'Diagram: the five stages of fine-tuning a pretrained transformer'
    description: 'A five-stage description of fine-tuning covering the pretrained start, a new head, gentle updates, early stopping and export.'
  - id: forgetting
    file: assets/forgetting.svg
    type: diagram
    title: 'Catastrophic forgetting'
    alt: 'Diagram: how a randomly initialised head damages pretrained layers and how decayed learning rates prevent it'
    description: 'A four-stage description of catastrophic forgetting covering the random head, large early gradients, damage to lower layers and layer-wise decay.'
  - id: finetune-vs-scratch
    file: assets/finetune-vs-scratch.svg
    type: diagram
    title: 'Fine-tuning against training from scratch'
    alt: 'Diagram: fine-tuning compared with training a model from random initialisation'
    description: 'A two-column comparison of fine-tuning against from-scratch training.'
  - id: finetune-history
    file: assets/finetune-history.svg
    type: diagram
    title: 'Four steps to modern fine-tuning'
    alt: 'Diagram: the historical progression from feature extraction to parameter-efficient fine-tuning'
    description: 'A four-stage description of the history of transfer learning covering frozen features, word embeddings, full fine-tuning and adapters.'
  - id: warmup
    file: assets/warmup.svg
    type: diagram
    title: 'Warmup and decay'
    alt: 'Diagram: the three phases of a learning rate schedule for fine-tuning'
    description: 'A three-stage description of a learning rate schedule covering warmup, the peak and cosine decay.'
  - id: finetune-vs-peft
    file: assets/finetune-vs-peft.svg
    type: diagram
    title: 'Full fine-tuning against adapters'
    alt: 'Diagram: full-parameter fine-tuning compared with adapter-based fine-tuning'
    description: 'A two-column comparison of updating all parameters against updating small adapters.'
  - id: distillation
    file: assets/distillation.svg
    type: diagram
    title: 'Knowledge distillation'
    alt: 'Diagram: how a small student model learns from a large teacher''s full output distribution'
    description: 'A four-stage description of distillation covering the teacher, soft targets, the combined loss and the resulting small model.'
  - id: quantisation
    file: assets/quantisation.svg
    type: diagram
    title: 'Post-training quantisation'
    alt: 'Diagram: how integer quantisation reduces model size and latency after training'
    description: 'A four-stage description of quantisation covering full-precision weights, integer mapping, the size and speed effect and accuracy loss.'
  - id: finetune-implications
    file: assets/finetune-implications.svg
    type: diagram
    title: 'What fine-tuning costs'
    alt: 'Diagram: the cost, privacy, drift and licensing implications of fine-tuning'
    description: 'A two-column comparison of the benefits and risks of fine-tuning a pretrained model.'
  - id: finetune-when
    file: assets/finetune-when.svg
    type: diagram
    title: 'When to fine-tune'
    alt: 'Diagram: when fine-tuning is worthwhile compared with prompting a general model'
    description: 'A two-column comparison of situations favouring fine-tuning against those favouring prompting.'
