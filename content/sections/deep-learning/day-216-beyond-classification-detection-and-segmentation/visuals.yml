visuals:
  - id: computer-vision-tasks-classification-to-segmentation
    file: assets/computer-vision-tasks-classification-to-segmentation.svg
    type: diagram
    title: 'Computer Vision Task Taxonomy: Classification to Segmentation'
    alt: Visual taxonomy of computer vision tasks comparing image classification object detection semantic segmentation and instance segmentation
    description: 'Visual taxonomy structuring the progression of computer vision tasks from image classification to bounding-box detection, semantic segmentation, and instance segmentation.'
  - id: unet-encoder-decoder-skip-connections
    file: assets/unet-encoder-decoder-skip-connections.svg
    type: diagram
    title: 'U-Net Architecture: Encoder-Decoder with Skip Connections'
    alt: UNet architecture diagram showing contracting encoder path bottleneck expanding decoder path and lateral skip connections
    description: 'Structural diagram of the U-Net architecture detailing contracting encoder, bottleneck latent code, expanding decoder, and lateral skip connections.'
  - id: three-vision-tasks
    file: assets/three-vision-tasks.svg
    type: diagram
    title: 'Three questions about an image'
    alt: 'Diagram: classification, detection and segmentation compared by output structure'
    description: 'A three-stage description of vision tasks covering classification, detection and segmentation by what each predicts.'
  - id: iou
    file: assets/iou.svg
    type: diagram
    title: 'Intersection over union'
    alt: 'Diagram: how intersection over union measures spatial overlap'
    description: 'A four-stage description of IoU covering the intersection, the union, the ratio and the threshold convention.'
  - id: nms
    file: assets/nms.svg
    type: diagram
    title: 'Non-maximum suppression'
    alt: 'Diagram: how non-maximum suppression reduces overlapping detections'
    description: 'A four-stage description of non-maximum suppression covering the candidate flood, sorting, suppression by overlap and the threshold trade-off.'
  - id: unet
    file: assets/unet.svg
    type: diagram
    title: 'The U-Net shape'
    alt: 'Diagram: the three stages of a U-Net segmentation architecture'
    description: 'A four-stage description of U-Net covering the contracting path, the bottleneck, the expanding path and skip connections.'
  - id: dice-or-crossentropy
    file: assets/dice-or-crossentropy.svg
    type: diagram
    title: 'Cross-entropy, or an overlap loss'
    alt: 'Diagram: pixel-wise cross-entropy compared with overlap-based segmentation losses'
    description: 'A two-column comparison of cross-entropy against Dice loss for heavily imbalanced segmentation masks.'
  - id: one-stage-two-stage
    file: assets/one-stage-two-stage.svg
    type: diagram
    title: 'One stage, or two'
    alt: 'Diagram: single-stage detectors compared with two-stage detectors'
    description: 'A two-column comparison of single-stage and two-stage object detection architectures.'
  - id: fpn
    file: assets/fpn.svg
    type: diagram
    title: 'Why scale needs its own structure'
    alt: 'Diagram: how a feature pyramid handles objects at multiple scales'
    description: 'A four-stage description of feature pyramids covering the downsampling problem, multi-scale features, top-down fusion and the resulting detection at all scales.'
  - id: tailoring
    file: assets/tailoring.svg
    type: diagram
    title: 'Off-the-peg, or tailored'
    alt: 'Diagram: a size label compared with a full set of measurements'
    description: 'A two-column comparison of coarse sizing against detailed measurement, as an analogy for classification against segmentation.'
  - id: foundation-vision
    file: assets/foundation-vision.svg
    type: diagram
    title: 'Promptable segmentation'
    alt: 'Diagram: task-specific segmentation models compared with a promptable foundation model'
    description: 'A four-stage description of promptable segmentation covering the traditional approach, the foundation model, prompting and the remaining gap.'
  - id: dense-when
    file: assets/dense-when.svg
    type: diagram
    title: 'Choosing the right task'
    alt: 'Diagram: choosing between classification, detection and segmentation'
    description: 'A two-column comparison of task selection by application requirement and annotation cost.'
