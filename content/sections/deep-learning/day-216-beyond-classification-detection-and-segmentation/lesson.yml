learning_promise: 'Master dense spatial Computer Vision beyond classification: Object Detection (bounding boxes, IoU, NMS, mAP, YOLO vs Faster R-CNN), Semantic Segmentation (U-Net encoder-decoder skip architecture, Dice loss), and Instance Segmentation (Mask R-CNN, SAM).'
objectives:
  - 'Distinguish between Classification, Object Detection, Semantic Segmentation, and Instance Segmentation.'
  - 'Calculate Intersection over Union (IoU) and explain Non-Maximum Suppression (NMS) for object detection.'
  - 'Contrast two-stage object detectors (Faster R-CNN) with single-stage real-time detectors (YOLOv8).'
  - 'Derive and implement the U-Net architecture with lateral skip connections in PyTorch.'
  - 'Formulate Dice Loss and Jaccard Index for pixel-level semantic segmentation evaluation.'
