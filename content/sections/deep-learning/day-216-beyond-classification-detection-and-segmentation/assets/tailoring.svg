<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="How precisely the shape must match.">
  <title>Off-the-peg, or tailored</title>
  <style>
    .tailoring-bg   { fill: #f8fafc; }
    .tailoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tailoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tailoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tailoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tailoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tailoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tailoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tailoring-row { opacity: 1; }
    .tailoring-r0 { animation-delay: 0.00s; }
    .tailoring-r1 { animation-delay: 0.45s; }
    .tailoring-r2 { animation-delay: 0.90s; }
    .tailoring-r3 { animation-delay: 1.35s; }
    .tailoring-r4 { animation-delay: 1.80s; }
    .tailoring-row { animation: tailoring-reveal 7.3s ease-in-out infinite; }
    @keyframes tailoring-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tailoring-bg" width="980" height="390"/>
  <text class="tailoring-h1"  x="30" y="40">Off-the-peg, or tailored</text>
  <text class="tailoring-sub" x="30" y="64">How precisely the shape must match.</text>
  <rect class="tailoring-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tailoring-name" x="46" y="122">A size label</text>
  <text class="tailoring-desc" x="46" y="142">One category.</text>
  <text class="tailoring-desc tailoring-row tailoring-r0" x="46" y="182">"Medium"</text>
  <text class="tailoring-desc tailoring-row tailoring-r1" x="46" y="216">Fast to determine</text>
  <text class="tailoring-desc tailoring-row tailoring-r2" x="46" y="250">Enough for many purposes</text>
  <text class="tailoring-desc tailoring-row tailoring-r3" x="46" y="284">No information about shape</text>
  <text class="tailoring-desc tailoring-row tailoring-r4" x="46" y="318">This is classification</text>
  <rect class="tailoring-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tailoring-name" x="526" y="122">Full measurements</text>
  <text class="tailoring-desc" x="526" y="142">Every contour.</text>
  <text class="tailoring-desc tailoring-row tailoring-r0" x="526" y="182">Chest, waist, inseam, shoulder</text>
  <text class="tailoring-desc tailoring-row tailoring-r1" x="526" y="216">Slow to take</text>
  <text class="tailoring-desc tailoring-row tailoring-r2" x="526" y="250">Necessary for a fitted garment</text>
  <text class="tailoring-desc tailoring-row tailoring-r3" x="526" y="284">Complete shape information</text>
  <text class="tailoring-desc tailoring-row tailoring-r4" x="526" y="318">This is segmentation</text>
  <text class="tailoring-sub" x="30" y="372">The tailoring analogy makes the cost visible: complete measurements take far longer to gather, which is exactly the annotation cost that separates segmentation datasets from classification ones.</text>
</svg>
