<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Ninety-eight percent background.">
  <title>Cross-entropy, or an overlap loss</title>
  <style>
    .dice-or-crossentropy-bg   { fill: #f8fafc; }
    .dice-or-crossentropy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dice-or-crossentropy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dice-or-crossentropy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dice-or-crossentropy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dice-or-crossentropy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dice-or-crossentropy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dice-or-crossentropy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dice-or-crossentropy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dice-or-crossentropy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dice-or-crossentropy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dice-or-crossentropy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dice-or-crossentropy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dice-or-crossentropy-row { opacity: 1; }
    .dice-or-crossentropy-r0 { animation-delay: 0.00s; }
    .dice-or-crossentropy-r1 { animation-delay: 0.45s; }
    .dice-or-crossentropy-r2 { animation-delay: 0.90s; }
    .dice-or-crossentropy-r3 { animation-delay: 1.35s; }
    .dice-or-crossentropy-r4 { animation-delay: 1.80s; }
    .dice-or-crossentropy-row { animation: dice-or-crossentropy-reveal 7.3s ease-in-out infinite; }
    @keyframes dice-or-crossentropy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dice-or-crossentropy-bg" width="980" height="390"/>
  <text class="dice-or-crossentropy-h1"  x="30" y="40">Cross-entropy, or an overlap loss</text>
  <text class="dice-or-crossentropy-sub" x="30" y="64">Ninety-eight percent background.</text>
  <rect class="dice-or-crossentropy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dice-or-crossentropy-name" x="46" y="122">Pixel cross-entropy</text>
  <text class="dice-or-crossentropy-desc" x="46" y="142">Dominated by background.</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r0" x="46" y="182">Every pixel contributes equally</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r1" x="46" y="216">Background is 98% of them</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r2" x="46" y="250">Predicting all background scores well</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r3" x="46" y="284">The small structure is a rounding error</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r4" x="46" y="318">Common in medical and satellite imagery</text>
  <rect class="dice-or-crossentropy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dice-or-crossentropy-name" x="526" y="122">An overlap loss</text>
  <text class="dice-or-crossentropy-desc" x="526" y="142">Measures the region.</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r0" x="526" y="182">Based on intersection over the sum</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r1" x="526" y="216">Empty prediction scores zero</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r2" x="526" y="250">Small structures carry real weight</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r3" x="526" y="284">Smoothed to avoid division by zero</text>
  <text class="dice-or-crossentropy-desc dice-or-crossentropy-row dice-or-crossentropy-r4" x="526" y="318">Often combined with cross-entropy</text>
  <text class="dice-or-crossentropy-sub" x="30" y="372">Predicting all background and scoring well is not hypothetical: on a mask that is two percent foreground, a model that outputs nothing achieves ninety-eight percent pixel accuracy.</text>
</svg>
