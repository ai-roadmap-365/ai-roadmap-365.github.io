questions:
  - question: 'What is Intersection over Union (IoU), and what does an IoU of 1.0 indicate between a predicted bounding box and a ground-truth bounding box?'
    options:
      - 'IoU is the Area of Overlap divided by the Area of Union between two bounding boxes; an IoU of 1.0 indicates exact, perfect spatial alignment'
      - 'IoU is the ratio of image width to image height'
      - 'IoU measures the number of classes detected'
      - 'IoU is the learning rate divided by batch size'
    answer_index: 0
    explanation: 'IoU = Area(Box_A intersect Box_B) / Area(Box_A union Box_B). It ranges from 0.0 (no overlap) to 1.0 (exact match).'
  - question: 'Why does the U-Net segmentation architecture concatenate high-resolution feature maps from the contracting encoder directly to the expanding decoder via lateral skip connections?'
    options:
      - 'Downsampling in the encoder discards fine-grained spatial pixel coordinates; lateral skip connections provide direct high-resolution spatial details to the decoder, enabling millimeter-precise boundary segmentation'
      - 'Skip connections reduce the number of channels to zero'
      - 'Skip connections convert RGB images to grayscale'
      - 'Skip connections eliminate the need for training labels'
    answer_index: 0
    explanation: 'Pooling layers discard spatial coordinates while extracting high-level semantics. U-Net skip connections recover exact boundary locations by passing uncompressed spatial features to the decoder.'
  - question: 'What is the role of Non-Maximum Suppression (NMS) in object detection algorithms like YOLO and Faster R-CNN?'
    options:
      - 'It eliminates redundant overlapping bounding boxes predicted for the same physical object by keeping the highest-scoring box and discarding overlapping boxes with IoU above a specified threshold'
      - 'It suppresses negative loss gradients'
      - 'It darkens the brightest pixels in an image'
      - 'It suppresses CPU utilization'
    answer_index: 0
    explanation: 'Dense object detectors predict dozens of candidate boxes for a single object. NMS iteratively retains the highest-confidence box and removes all neighboring boxes overlapping with IoU > threshold.'
  - question: 'What is the difference between Semantic Segmentation and Instance Segmentation?'
    options:
      - 'Semantic Segmentation labels every pixel with a class category without distinguishing between separate individual objects of the same class; Instance Segmentation identifies, bounds, and segments each unique individual object entity separately'
      - 'Semantic segmentation is only for text'
      - 'Instance segmentation uses no neural networks'
      - 'Semantic segmentation produces 3D point clouds'
    answer_index: 0
    explanation: 'If three sheep stand in a pasture, semantic segmentation colors all sheep pixels yellow as one blob. Instance segmentation assigns distinct masks: Sheep #1, Sheep #2, and Sheep #3.'
  - question: 'Why is the Dice Loss (Sørensen-Dice coefficient) commonly used instead of standard Cross-Entropy loss in medical image segmentation tasks?'
    options:
      - 'Medical scans suffer from severe class imbalance (where background healthy tissue accounts for 99% of pixels and the tumor is only 1%); Dice loss directly measures mask overlap and is robust to extreme background dominance'
      - 'Dice loss works without GPU memory'
      - 'Dice loss can only be computed on integers'
      - 'Dice loss replaces convolution with random guessing'
    answer_index: 0
    explanation: 'Standard Cross-Entropy is overwhelmed by the 99% background pixels. Dice Loss measures 2 * |A intersect B| / (|A| + |B|), penalizing false negatives on small lesion regions.'
