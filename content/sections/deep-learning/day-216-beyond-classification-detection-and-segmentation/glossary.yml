terms:
  - term: 'Object Detection'
    definition: 'Locating instances of semantic objects in images and predicting their categorical class and bounding box coordinates.'
  - term: 'Semantic Segmentation'
    definition: 'Predicting a categorical class label for every individual pixel in an image.'
  - term: 'Instance Segmentation'
    definition: 'Detecting individual object entities and generating a pixel-level binary mask for each specific instance.'
  - term: 'Intersection over Union'
    definition: 'Evaluation metric measuring the overlap ratio between predicted and ground-truth bounding boxes or masks.'
  - term: 'Non-Maximum Suppression'
    definition: 'Post-processing algorithm that eliminates duplicate overlapping bounding boxes for the same detected object.'
  - term: 'Mean Average Precision'
    definition: 'The standard benchmark metric for object detection, averaging Precision-Recall curve areas across IoU thresholds and classes.'
  - term: 'U-Net'
    definition: 'An encoder-decoder architecture with lateral skip connections connecting contracting stages directly to expansive stages.'
  - term: 'Dice Loss'
    definition: 'A loss function based on the Dice-Sørensen coefficient measuring spatial overlap between predicted and target segmentation masks.'
