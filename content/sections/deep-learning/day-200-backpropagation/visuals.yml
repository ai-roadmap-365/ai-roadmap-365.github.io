visuals:
  - id: vectorized-backpropagation-graph
    file: assets/vectorized-backpropagation-graph.svg
    type: diagram
    title: Vectorized Backpropagation Computational Graph
    alt: Vectorized backward propagation computational graph showing chain rule error flow from loss through hidden layers to weights
    description: Computational graph detailing reverse-mode automatic differentiation, upstream activation gradients, and parameter derivative evaluation.
  - id: fundamental-backpropagation-equations
    file: assets/fundamental-backpropagation-equations.svg
    type: diagram
    title: Four Fundamental Equations of Backpropagation
    alt: Step by step chain rule derivation matrix showing analytical gradient equations for multi layer backpropagation
    description: Mathematical reference matrix summarizing the four canonical vectorized backpropagation equations for output error, hidden error, weight gradient, and bias gradient.
  - id: backprop-idea
    file: assets/backprop-idea.svg
    type: diagram
    title: 'One backward sweep'
    alt: 'Diagram: what backpropagation computes in a single backward pass'
    description: 'A four-stage description of backpropagation covering the loss gradient, the chain rule sweep, per-layer gradients and the resulting update signal.'
  - id: backprop-or-finite
    file: assets/backprop-or-finite.svg
    type: diagram
    title: 'Analytical gradients, or finite differences'
    alt: 'Diagram: backpropagation compared with numerical finite differences'
    description: 'A two-column comparison of analytical backpropagation against finite-difference gradient estimation.'
  - id: backprop-lineage
    file: assets/backprop-lineage.svg
    type: diagram
    title: 'Four steps to autograd'
    alt: 'Diagram: the progression from reverse-mode differentiation to modern autograd'
    description: 'A four-stage progression of backpropagation from reverse-mode automatic differentiation through neural network application to dynamic autograd engines.'
  - id: chain-rule
    file: assets/chain-rule.svg
    type: diagram
    title: 'The chain rule, applied'
    alt: 'Diagram: how the chain rule produces per-layer gradients'
    description: 'A four-stage description of the chain rule in backpropagation covering the error residual, weight gradients, bias gradients and the residual passed backward.'
  - id: backprop-not-optimiser
    file: assets/backprop-not-optimiser.svg
    type: diagram
    title: 'Backpropagation is not an optimiser'
    alt: 'Diagram: backpropagation compared with the optimiser that consumes its output'
    description: 'A two-column comparison of what backpropagation produces against what an optimiser does with it.'
  - id: orchestra
    file: assets/orchestra.svg
    type: diagram
    title: 'An orchestra tracing a sour chord'
    alt: 'Diagram: tracing a musical error backward through an orchestra'
    description: 'A two-column comparison of the forward performance against tracing the error backward to its origin.'
  - id: softmax-cancellation
    file: assets/softmax-cancellation.svg
    type: diagram
    title: 'The softmax gradient simplification'
    alt: 'Diagram: how the softmax and cross-entropy gradients cancel to a simple difference'
    description: 'A four-stage description of the softmax cross-entropy gradient covering the two derivatives, their product, the cancellation and the practical consequence.'
  - id: gradient-flow-consequences
    file: assets/gradient-flow-consequences.svg
    type: diagram
    title: 'What the chain rule product implies'
    alt: 'Diagram: the downstream consequences of the chain rule''s multiplicative structure'
    description: 'A four-stage description of consequences of the chain rule product covering vanishing gradients, exploding gradients, residual connections and clipping.'
  - id: backprop-implications
    file: assets/backprop-implications.svg
    type: diagram
    title: 'Four consequences of the backward pass'
    alt: 'Diagram: the cost, memory, precision and verification implications of backpropagation'
    description: 'A four-stage description of backpropagation implications covering computational cost, activation memory, numerical precision and gradient checking.'
  - id: backprop-when
    file: assets/backprop-when.svg
    type: diagram
    title: 'Where backpropagation applies'
    alt: 'Diagram: when backpropagation is the right training mechanism'
    description: 'A two-column comparison of models trainable by backpropagation against those requiring other methods.'
