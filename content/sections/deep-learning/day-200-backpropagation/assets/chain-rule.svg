<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three quantities per layer.">
  <title>The chain rule, applied</title>
  <style>
    .chain-rule-bg   { fill: #f8fafc; }
    .chain-rule-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-rule-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-rule-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-rule-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-rule-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chain-rule-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .chain-rule-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .chain-rule-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .chain-rule-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .chain-rule-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .chain-rule-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .chain-rule-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .chain-rule-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .chain-rule-stage { opacity: 1; }

    .chain-rule-s0 { animation-delay: 0.00s; }
    .chain-rule-e0 { animation-delay: 0.00s; }
    .chain-rule-s1 { animation-delay: 1.28s; }
    .chain-rule-e1 { animation-delay: 1.28s; }
    .chain-rule-s2 { animation-delay: 2.56s; }
    .chain-rule-e2 { animation-delay: 2.56s; }
    .chain-rule-s3 { animation-delay: 3.84s; }
    .chain-rule-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .chain-rule-conn  { animation: chain-rule-trace 6.4s ease-in-out infinite; }
      .chain-rule-stage { animation: chain-rule-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes chain-rule-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes chain-rule-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .chain-rule-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .chain-rule-stage { animation: chain-rule-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes chain-rule-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="chain-rule-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="chain-rule-bg" width="980" height="322"/>
  <text class="chain-rule-h1"  x="30" y="40">The chain rule, applied</text>
  <text class="chain-rule-sub" x="30" y="64">Three quantities per layer.</text>
  <g class="chain-rule-stage chain-rule-s0">
    <rect class="chain-rule-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="chain-rule-step" x="44" y="142">01</text>
    <text class="chain-rule-name" x="70" y="142">The error residual at this layer</text>
    <text class="chain-rule-desc" x="44" y="166">How much the loss changes with</text>
    <text class="chain-rule-desc" x="44" y="182">this layer's pre-activation.</text>
    <text class="chain-rule-edge" x="44" y="242">dZ</text>
  </g>
  <line class="chain-rule-line chain-rule-conn chain-rule-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#chain-rule-tip)"/>
  <g class="chain-rule-stage chain-rule-s1">
    <rect class="chain-rule-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="chain-rule-step" x="280" y="142">02</text>
    <text class="chain-rule-name" x="306" y="142">Weight gradient</text>
    <text class="chain-rule-desc" x="280" y="166">The residual times the cached</text>
    <text class="chain-rule-desc" x="280" y="182">input from the layer below.</text>
  </g>
  <line class="chain-rule-line chain-rule-conn chain-rule-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#chain-rule-tip)"/>
  <g class="chain-rule-stage chain-rule-s2">
    <rect class="chain-rule-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="chain-rule-step" x="516" y="142">03</text>
    <text class="chain-rule-name" x="542" y="142">Bias gradient</text>
    <text class="chain-rule-desc" x="516" y="166">The residual, summed across the</text>
    <text class="chain-rule-desc" x="516" y="182">batch.</text>
  </g>
  <line class="chain-rule-line chain-rule-conn chain-rule-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#chain-rule-tip)"/>
  <g class="chain-rule-stage chain-rule-s3">
    <rect class="chain-rule-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="chain-rule-step" x="752" y="142">04</text>
    <text class="chain-rule-name" x="778" y="142">And the residual for the layer below</text>
    <text class="chain-rule-desc" x="752" y="166">The weights transposed, times</text>
    <text class="chain-rule-desc" x="752" y="182">this residual, times the</text>
    <text class="chain-rule-desc" x="752" y="198">activation derivative.</text>
  </g>
  <text class="chain-rule-sub" x="30" y="304">The fourth quantity is what makes it a sweep rather than four independent calculations: each layer's residual is computed from the one above it, which is why the pass must run backward.</text>
</svg>
