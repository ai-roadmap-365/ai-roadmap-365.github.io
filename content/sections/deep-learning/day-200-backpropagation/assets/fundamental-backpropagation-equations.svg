<svg role="img" aria-label="Step by step chain rule derivation matrix showing analytical gradient equations for multi layer backpropagation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Four Fundamental Equations of Backpropagation</title>
  <defs>
    <linearGradient id="bg200b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="eqCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg200b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE FOUR FUNDAMENTAL EQUATIONS OF BACKPROPAGATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Vectorized Matrix Equations for Computing Exact Loss Gradients</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#eqCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- EQ 1 -->
    <rect x="25" y="25" width="345" height="115" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="45" y="50" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700">EQ 1: Output Error (dZ^[L])</text>
    <text x="197" y="85" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">dZ^[L] = A^[L] - Y</text>
    <text x="197" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">For Softmax + Cross-Entropy or Sigmoid + BCE</text>

    <!-- EQ 2 -->
    <rect x="390" y="25" width="345" height="115" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="410" y="50" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700">EQ 2: Hidden Error (dZ^[l])</text>
    <text x="562" y="85" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">dZ^[l] = ((W^[l+1])^T dZ^[l+1]) * g&#39;(Z^[l])</text>
    <text x="562" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Upstream gradient propagated through activation derivative</text>

    <!-- EQ 3 -->
    <rect x="25" y="155" width="345" height="115" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="45" y="180" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700">EQ 3: Weight Gradient (dW^[l])</text>
    <text x="197" y="215" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">dW^[l] = (1/m) * dZ^[l] * (A^[l-1])^T</text>
    <text x="197" y="245" fill="#94a3b8" font-size="9" text-anchor="middle">Averaged over m batch samples | Shape: (n^[l], n^[l-1])</text>

    <!-- EQ 4 -->
    <rect x="390" y="155" width="345" height="115" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="410" y="180" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">EQ 4: Bias Gradient (db^[l])</text>
    <text x="562" y="215" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">db^[l] = (1/m) * sum(dZ^[l], axis=1)</text>
    <text x="562" y="245" fill="#94a3b8" font-size="9" text-anchor="middle">Summed across all batch columns | Shape: (n^[l], 1)</text>
  </g>
</svg>
