<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Every parameter's gradient, at once.">
  <title>One backward sweep</title>
  <style>
    .backprop-idea-bg   { fill: #f8fafc; }
    .backprop-idea-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-idea-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-idea-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-idea-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-idea-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backprop-idea-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backprop-idea-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backprop-idea-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backprop-idea-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backprop-idea-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backprop-idea-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backprop-idea-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .backprop-idea-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .backprop-idea-stage { opacity: 1; }

    .backprop-idea-s0 { animation-delay: 0.00s; }
    .backprop-idea-e0 { animation-delay: 0.00s; }
    .backprop-idea-s1 { animation-delay: 1.28s; }
    .backprop-idea-e1 { animation-delay: 1.28s; }
    .backprop-idea-s2 { animation-delay: 2.56s; }
    .backprop-idea-e2 { animation-delay: 2.56s; }
    .backprop-idea-s3 { animation-delay: 3.84s; }
    .backprop-idea-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .backprop-idea-conn  { animation: backprop-idea-trace 6.4s ease-in-out infinite; }
      .backprop-idea-stage { animation: backprop-idea-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes backprop-idea-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes backprop-idea-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .backprop-idea-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .backprop-idea-stage { animation: backprop-idea-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes backprop-idea-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="backprop-idea-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="backprop-idea-bg" width="980" height="322"/>
  <text class="backprop-idea-h1"  x="30" y="40">One backward sweep</text>
  <text class="backprop-idea-sub" x="30" y="64">Every parameter's gradient, at once.</text>
  <g class="backprop-idea-stage backprop-idea-s0">
    <rect class="backprop-idea-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-idea-step" x="44" y="142">01</text>
    <text class="backprop-idea-name" x="70" y="142">Start at the loss</text>
    <text class="backprop-idea-desc" x="44" y="166">A single scalar, and its</text>
    <text class="backprop-idea-desc" x="44" y="182">derivative with respect to the</text>
    <text class="backprop-idea-desc" x="44" y="198">output.</text>
  </g>
  <line class="backprop-idea-line backprop-idea-conn backprop-idea-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#backprop-idea-tip)"/>
  <g class="backprop-idea-stage backprop-idea-s1">
    <rect class="backprop-idea-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-idea-step" x="280" y="142">02</text>
    <text class="backprop-idea-name" x="306" y="142">Sweep backward by the chain rule</text>
    <text class="backprop-idea-desc" x="280" y="166">Each layer's error residual</text>
    <text class="backprop-idea-desc" x="280" y="182">computed from the next layer's.</text>
    <text class="backprop-idea-edge" x="280" y="242">one pass</text>
  </g>
  <line class="backprop-idea-line backprop-idea-conn backprop-idea-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#backprop-idea-tip)"/>
  <g class="backprop-idea-stage backprop-idea-s2">
    <rect class="backprop-idea-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-idea-step" x="516" y="142">03</text>
    <text class="backprop-idea-name" x="542" y="142">Extract gradients per layer</text>
    <text class="backprop-idea-desc" x="516" y="166">For weights and biases, from the</text>
    <text class="backprop-idea-desc" x="516" y="182">residual and the cached input.</text>
  </g>
  <line class="backprop-idea-line backprop-idea-conn backprop-idea-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#backprop-idea-tip)"/>
  <g class="backprop-idea-stage backprop-idea-s3">
    <rect class="backprop-idea-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="backprop-idea-step" x="752" y="142">04</text>
    <text class="backprop-idea-name" x="778" y="142">Hand them to an optimiser</text>
    <text class="backprop-idea-desc" x="752" y="166">Which decides what to do with</text>
    <text class="backprop-idea-desc" x="752" y="182">them. That is a separate lesson.</text>
  </g>
  <text class="backprop-idea-sub" x="30" y="304">The cost of the whole sweep is roughly the cost of one forward pass, which is the property that makes training with ten million parameters possible at all.</text>
</svg>
