<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four later lessons, one cause.">
  <title>What the chain rule product implies</title>
  <style>
    .gradient-flow-consequences-bg   { fill: #f8fafc; }
    .gradient-flow-consequences-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-flow-consequences-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-flow-consequences-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-flow-consequences-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-flow-consequences-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-flow-consequences-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradient-flow-consequences-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradient-flow-consequences-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradient-flow-consequences-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradient-flow-consequences-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradient-flow-consequences-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradient-flow-consequences-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradient-flow-consequences-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradient-flow-consequences-stage { opacity: 1; }

    .gradient-flow-consequences-s0 { animation-delay: 0.00s; }
    .gradient-flow-consequences-e0 { animation-delay: 0.00s; }
    .gradient-flow-consequences-s1 { animation-delay: 1.28s; }
    .gradient-flow-consequences-e1 { animation-delay: 1.28s; }
    .gradient-flow-consequences-s2 { animation-delay: 2.56s; }
    .gradient-flow-consequences-e2 { animation-delay: 2.56s; }
    .gradient-flow-consequences-s3 { animation-delay: 3.84s; }
    .gradient-flow-consequences-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradient-flow-consequences-conn  { animation: gradient-flow-consequences-trace 6.4s ease-in-out infinite; }
      .gradient-flow-consequences-stage { animation: gradient-flow-consequences-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradient-flow-consequences-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradient-flow-consequences-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradient-flow-consequences-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradient-flow-consequences-stage { animation: gradient-flow-consequences-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradient-flow-consequences-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradient-flow-consequences-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradient-flow-consequences-bg" width="980" height="322"/>
  <text class="gradient-flow-consequences-h1"  x="30" y="40">What the chain rule product implies</text>
  <text class="gradient-flow-consequences-sub" x="30" y="64">Four later lessons, one cause.</text>
  <g class="gradient-flow-consequences-stage gradient-flow-consequences-s0">
    <rect class="gradient-flow-consequences-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-flow-consequences-step" x="44" y="142">01</text>
    <text class="gradient-flow-consequences-name" x="70" y="142">Derivatives multiply across layers</text>
    <text class="gradient-flow-consequences-desc" x="44" y="166">One factor per layer, by</text>
    <text class="gradient-flow-consequences-desc" x="44" y="182">construction.</text>
  </g>
  <line class="gradient-flow-consequences-line gradient-flow-consequences-conn gradient-flow-consequences-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradient-flow-consequences-tip)"/>
  <g class="gradient-flow-consequences-stage gradient-flow-consequences-s1">
    <rect class="gradient-flow-consequences-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-flow-consequences-step" x="280" y="142">02</text>
    <text class="gradient-flow-consequences-name" x="306" y="142">Small factors vanish</text>
    <text class="gradient-flow-consequences-desc" x="280" y="166">Saturating activations, deep</text>
    <text class="gradient-flow-consequences-desc" x="280" y="182">networks, early layers frozen.</text>
    <text class="gradient-flow-consequences-edge" x="280" y="242">Day 198</text>
  </g>
  <line class="gradient-flow-consequences-line gradient-flow-consequences-conn gradient-flow-consequences-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradient-flow-consequences-tip)"/>
  <g class="gradient-flow-consequences-stage gradient-flow-consequences-s2">
    <rect class="gradient-flow-consequences-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-flow-consequences-step" x="516" y="142">03</text>
    <text class="gradient-flow-consequences-name" x="542" y="142">Large factors explode</text>
    <text class="gradient-flow-consequences-desc" x="516" y="166">Gradients overflow; training</text>
    <text class="gradient-flow-consequences-desc" x="516" y="182">diverges in one step.</text>
  </g>
  <line class="gradient-flow-consequences-line gradient-flow-consequences-conn gradient-flow-consequences-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradient-flow-consequences-tip)"/>
  <g class="gradient-flow-consequences-stage gradient-flow-consequences-s3">
    <rect class="gradient-flow-consequences-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-flow-consequences-step" x="752" y="142">04</text>
    <text class="gradient-flow-consequences-name" x="778" y="142">Which is why skip connections and clipping exist</text>
    <text class="gradient-flow-consequences-desc" x="752" y="166">A path around the product, and a</text>
    <text class="gradient-flow-consequences-desc" x="752" y="182">ceiling on its magnitude.</text>
  </g>
  <text class="gradient-flow-consequences-sub" x="30" y="304">Almost every architectural trick in deep learning traces back to this product: residual connections, normalisation layers and careful initialisation are all ways of keeping it near one.</text>
</svg>
