terms:
  - term: 'Backpropagation'
    definition: 'An algorithm for efficiently calculating the gradient of a scalar loss function with respect to all network parameters using reverse-mode automatic differentiation.'
  - term: 'Chain Rule'
    definition: 'A fundamental theorem of calculus stating that the derivative of a composite function f(g(x)) is f prime(g(x)) * g prime(x).'
  - term: 'Reverse-Mode Automatic Differentiation'
    definition: 'A technique for computing gradients of a scalar objective with respect to many inputs in a single backward pass through a computational graph.'
  - term: 'Error Residual (dZ)'
    definition: 'The partial derivative of the scalar loss with respect to the linear pre-activation tensor Z^[l].'
  - term: 'Weight Gradient (dW)'
    definition: 'The matrix of partial derivatives dL/dW indicating the direction of steepest increase in loss for each weight parameter.'
  - term: 'Bias Gradient (db)'
    definition: 'The vector of partial derivatives dL/db indicating the gradient direction for each layer bias parameter.'
  - term: 'Jacobian Matrix'
    definition: 'A matrix of all first-order partial derivatives of a vector-valued function.'
  - term: 'Numerical Gradient Checking'
    definition: 'A debugging validation protocol comparing analytical backpropagation gradients against two-sided finite difference approximations.'
