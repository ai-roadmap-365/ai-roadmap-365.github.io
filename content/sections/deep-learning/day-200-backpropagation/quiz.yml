questions:
  - question: 'What is the remarkable mathematical simplification when computing the derivative of Cross-Entropy Loss with respect to output logits Z^[L] when using Softmax activation: dL/dZ^[L]?'
    options:
      - 'dL/dZ^[L] simplifies exactly to A^[L] - Y (predicted probability minus one-hot ground truth), as complex exponential derivative terms cancel out completely'
      - 'dL/dZ^[L] = A^[L] * Y'
      - 'dL/dZ^[L] = (1 / A^[L]) + Y'
      - 'dL/dZ^[L] = 0'
    answer_index: 0
    explanation: 'When differentiating the Categorical Cross-Entropy loss through the Softmax Jacobian, all complex derivative fractions cancel into the beautifully elegant error residual: A^[L] - Y.'
  - question: 'Given mini-batch size m, pre-activation gradient dZ^[l] with shape (n^[l], m), and previous layer activation A^[l-1] with shape (n^[l-1], m), what is the exact vectorized formula for weight gradient dW^[l]?'
    options:
      - 'dW^[l] = (1 / m) * np.dot(dZ^[l], (A^[l-1])^T)'
      - 'dW^[l] = (1 / m) * np.dot(A^[l-1], dZ^[l])'
      - 'dW^[l] = dZ^[l] * A^[l-1]'
      - 'dW^[l] = np.sum(dZ^[l])'
    answer_index: 0
    explanation: 'Multiplying dZ^[l] (shape n^[l], m) by the transpose of A^[l-1] (shape m, n^[l-1]) produces the exact required weight matrix shape (n^[l], n^[l-1]), averaging gradients across all m batch samples.'
  - question: 'How is the bias gradient db^[l] calculated from the pre-activation error matrix dZ^[l]?'
    options:
      - 'db^[l] = (1 / m) * np.sum(dZ^[l], axis=1, keepdims=True), summing across all m columns to yield shape (n^[l], 1)'
      - 'db^[l] = dZ^[l]'
      - 'db^[l] = np.max(dZ^[l])'
      - 'db^[l] = (1 / m) * np.sum(dZ^[l], axis=0)'
    answer_index: 0
    explanation: 'Because the bias vector was broadcast across all m columns during the forward pass, its total gradient is the sum of error signals across all m columns, averaged by 1/m.'
  - question: 'How is the upstream error signal dA^[l-1] propagated backward from layer l to layer l-1?'
    options:
      - 'dA^[l-1] = np.dot((W^[l])^T, dZ^[l])'
      - 'dA^[l-1] = np.dot(W^[l], dZ^[l])'
      - 'dA^[l-1] = dZ^[l] * W^[l]'
      - 'dA^[l-1] = np.sum(W^[l])'
    answer_index: 0
    explanation: 'By the chain rule, dA^[l-1] = (W^[l])^T * dZ^[l], multiplying transpose weight matrix (n^[l-1], n^[l]) by dZ^[l] (n^[l], m) to yield shape (n^[l-1], m).'
  - question: 'What is the primary computational benefit of Reverse-Mode Automatic Differentiation (Backpropagation) over Forward-Mode Differentiation when training neural networks with millions of parameters?'
    options:
      - 'Reverse-mode computes the exact gradient of a single scalar loss L with respect to all N parameters in a single backward pass O(N), whereas forward-mode would require N separate forward passes O(N^2)'
      - 'Reverse-mode eliminates floating point rounding'
      - 'Reverse-mode does not require calculus'
      - 'Reverse-mode runs without CPU memory'
    answer_index: 0
    explanation: 'When output dimension is 1 (scalar loss L) and input dimension is huge (millions of weights), reverse-mode backpropagation computes all gradients in a single sweep through the computational graph.'
