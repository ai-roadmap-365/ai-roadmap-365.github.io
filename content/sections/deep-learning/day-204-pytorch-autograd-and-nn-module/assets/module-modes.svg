<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two layers behave differently.">
  <title>Train mode and eval mode</title>
  <style>
    .module-modes-bg   { fill: #f8fafc; }
    .module-modes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-modes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-modes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-modes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-modes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .module-modes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .module-modes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .module-modes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .module-modes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .module-modes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .module-modes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .module-modes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .module-modes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .module-modes-stage { opacity: 1; }

    .module-modes-s0 { animation-delay: 0.00s; }
    .module-modes-e0 { animation-delay: 0.00s; }
    .module-modes-s1 { animation-delay: 1.28s; }
    .module-modes-e1 { animation-delay: 1.28s; }
    .module-modes-s2 { animation-delay: 2.56s; }
    .module-modes-e2 { animation-delay: 2.56s; }
    .module-modes-s3 { animation-delay: 3.84s; }
    .module-modes-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .module-modes-conn  { animation: module-modes-trace 6.4s ease-in-out infinite; }
      .module-modes-stage { animation: module-modes-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes module-modes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes module-modes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .module-modes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .module-modes-stage { animation: module-modes-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes module-modes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="module-modes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="module-modes-bg" width="980" height="322"/>
  <text class="module-modes-h1"  x="30" y="40">Train mode and eval mode</text>
  <text class="module-modes-sub" x="30" y="64">Two layers behave differently.</text>
  <g class="module-modes-stage module-modes-s0">
    <rect class="module-modes-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="module-modes-step" x="44" y="142">01</text>
    <text class="module-modes-name" x="70" y="142">Dropout: active in training</text>
    <text class="module-modes-desc" x="44" y="166">Units randomly zeroed. Disabled</text>
    <text class="module-modes-desc" x="44" y="182">entirely at evaluation.</text>
  </g>
  <line class="module-modes-line module-modes-conn module-modes-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#module-modes-tip)"/>
  <g class="module-modes-stage module-modes-s1">
    <rect class="module-modes-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="module-modes-step" x="280" y="142">02</text>
    <text class="module-modes-name" x="306" y="142">Batch normalisation: batch statistics in training</text>
    <text class="module-modes-desc" x="280" y="166">Running averages at evaluation.</text>
    <text class="module-modes-edge" x="280" y="242">different maths</text>
  </g>
  <line class="module-modes-line module-modes-conn module-modes-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#module-modes-tip)"/>
  <g class="module-modes-stage module-modes-s2">
    <rect class="module-modes-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="module-modes-step" x="516" y="142">03</text>
    <text class="module-modes-name" x="542" y="142">Forgetting to switch is a silent error</text>
    <text class="module-modes-desc" x="516" y="166">Evaluation numbers are wrong,</text>
    <text class="module-modes-desc" x="516" y="182">and nothing raises.</text>
  </g>
  <line class="module-modes-line module-modes-conn module-modes-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#module-modes-tip)"/>
  <g class="module-modes-stage module-modes-s3">
    <rect class="module-modes-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="module-modes-step" x="752" y="142">04</text>
    <text class="module-modes-name" x="778" y="142">And the checkpoint carries both</text>
    <text class="module-modes-desc" x="752" y="166">Parameters and buffers, so</text>
    <text class="module-modes-desc" x="752" y="182">running statistics survive a</text>
    <text class="module-modes-desc" x="752" y="198">reload.</text>
  </g>
  <text class="module-modes-sub" x="30" y="304">This produces one of the most common quiet bugs in deep learning: evaluation run in training mode reports noisy, usually worse numbers, and nothing anywhere indicates why.</text>
</svg>
