<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and one that surprises people.">
  <title>What backward() does</title>
  <style>
    .backward-mechanics-bg   { fill: #f8fafc; }
    .backward-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backward-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backward-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backward-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backward-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .backward-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .backward-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .backward-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .backward-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .backward-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .backward-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .backward-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .backward-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .backward-mechanics-stage { opacity: 1; }

    .backward-mechanics-s0 { animation-delay: 0.00s; }
    .backward-mechanics-e0 { animation-delay: 0.00s; }
    .backward-mechanics-s1 { animation-delay: 1.28s; }
    .backward-mechanics-e1 { animation-delay: 1.28s; }
    .backward-mechanics-s2 { animation-delay: 2.56s; }
    .backward-mechanics-e2 { animation-delay: 2.56s; }
    .backward-mechanics-s3 { animation-delay: 3.84s; }
    .backward-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .backward-mechanics-conn  { animation: backward-mechanics-trace 6.4s ease-in-out infinite; }
      .backward-mechanics-stage { animation: backward-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes backward-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes backward-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .backward-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .backward-mechanics-stage { animation: backward-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes backward-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="backward-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="backward-mechanics-bg" width="980" height="322"/>
  <text class="backward-mechanics-h1"  x="30" y="40">What backward() does</text>
  <text class="backward-mechanics-sub" x="30" y="64">Four steps, and one that surprises people.</text>
  <g class="backward-mechanics-stage backward-mechanics-s0">
    <rect class="backward-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="backward-mechanics-step" x="44" y="142">01</text>
    <text class="backward-mechanics-name" x="70" y="142">Traverse the graph in reverse</text>
    <text class="backward-mechanics-desc" x="44" y="166">From the scalar loss back toward</text>
    <text class="backward-mechanics-desc" x="44" y="182">the leaves.</text>
  </g>
  <line class="backward-mechanics-line backward-mechanics-conn backward-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#backward-mechanics-tip)"/>
  <g class="backward-mechanics-stage backward-mechanics-s1">
    <rect class="backward-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="backward-mechanics-step" x="280" y="142">02</text>
    <text class="backward-mechanics-name" x="306" y="142">Apply each node's known derivative</text>
    <text class="backward-mechanics-desc" x="280" y="166">Every operation carries its own</text>
    <text class="backward-mechanics-desc" x="280" y="182">backward rule.</text>
  </g>
  <line class="backward-mechanics-line backward-mechanics-conn backward-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#backward-mechanics-tip)"/>
  <g class="backward-mechanics-stage backward-mechanics-s2">
    <rect class="backward-mechanics-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="backward-mechanics-step" x="516" y="142">03</text>
    <text class="backward-mechanics-name" x="542" y="142">Accumulate into leaf gradients</text>
    <text class="backward-mechanics-desc" x="516" y="166">Added to what is there, not</text>
    <text class="backward-mechanics-desc" x="516" y="182">replacing it.</text>
    <text class="backward-mechanics-edge" x="516" y="242">zero them</text>
  </g>
  <line class="backward-mechanics-line backward-mechanics-conn backward-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#backward-mechanics-tip)"/>
  <g class="backward-mechanics-stage backward-mechanics-s3">
    <rect class="backward-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="backward-mechanics-step" x="752" y="142">04</text>
    <text class="backward-mechanics-name" x="778" y="142">Free the graph</text>
    <text class="backward-mechanics-desc" x="752" y="166">Unless told to retain it. A</text>
    <text class="backward-mechanics-desc" x="752" y="182">second backward call then fails.</text>
  </g>
  <text class="backward-mechanics-sub" x="30" y="304">Accumulation is deliberate and useful — it is how gradient accumulation across micro-batches works — and it is also why every training loop begins by zeroing gradients.</text>
</svg>
