<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And where it is overhead.">
  <title>Where autograd earns its cost</title>
  <style>
    .autograd-when-bg   { fill: #f8fafc; }
    .autograd-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .autograd-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autograd-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .autograd-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .autograd-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .autograd-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .autograd-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .autograd-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .autograd-when-row { opacity: 1; }
    .autograd-when-r0 { animation-delay: 0.00s; }
    .autograd-when-r1 { animation-delay: 0.45s; }
    .autograd-when-r2 { animation-delay: 0.90s; }
    .autograd-when-r3 { animation-delay: 1.35s; }
    .autograd-when-r4 { animation-delay: 1.80s; }
    .autograd-when-row { animation: autograd-when-reveal 7.3s ease-in-out infinite; }
    @keyframes autograd-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="autograd-when-bg" width="980" height="390"/>
  <text class="autograd-when-h1"  x="30" y="40">Where autograd earns its cost</text>
  <text class="autograd-when-sub" x="30" y="64">And where it is overhead.</text>
  <rect class="autograd-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="autograd-when-name" x="46" y="122">Use it</text>
  <text class="autograd-when-desc" x="46" y="142">Anything with a gradient.</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r0" x="46" y="182">Any neural network</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r1" x="46" y="216">Custom optimisation problems</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r2" x="46" y="250">Physics-informed models</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r3" x="46" y="284">Anywhere the architecture changes often</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r4" x="46" y="318">Which is most research and most products</text>
  <rect class="autograd-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="autograd-when-name" x="526" y="122">Not needed</text>
  <text class="autograd-when-desc" x="526" y="142">No derivatives involved.</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r0" x="526" y="182">Data preprocessing</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r1" x="526" y="216">Classical machine learning</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r2" x="526" y="250">Plain array arithmetic</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r3" x="526" y="284">Disable tracking explicitly there</text>
  <text class="autograd-when-desc autograd-when-row autograd-when-r4" x="526" y="318">It costs memory for nothing</text>
  <text class="autograd-when-sub" x="30" y="372">Disabling tracking in preprocessing is a small habit with a measurable effect: array manipulation inside a training loop that inadvertently tracks gradients builds a graph nobody will ever traverse.</text>
</svg>
