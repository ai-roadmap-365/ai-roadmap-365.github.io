<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Every transaction recorded, then reconciled.">
  <title>An accounting ledger</title>
  <style>
    .ledger-bg   { fill: #f8fafc; }
    .ledger-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ledger-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ledger-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ledger-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ledger-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ledger-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ledger-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ledger-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ledger-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ledger-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ledger-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ledger-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ledger-row { opacity: 1; }
    .ledger-r0 { animation-delay: 0.00s; }
    .ledger-r1 { animation-delay: 0.45s; }
    .ledger-r2 { animation-delay: 0.90s; }
    .ledger-r3 { animation-delay: 1.35s; }
    .ledger-r4 { animation-delay: 1.80s; }
    .ledger-row { animation: ledger-reveal 7.3s ease-in-out infinite; }
    @keyframes ledger-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ledger-bg" width="980" height="390"/>
  <text class="ledger-h1"  x="30" y="40">An accounting ledger</text>
  <text class="ledger-sub" x="30" y="64">Every transaction recorded, then reconciled.</text>
  <rect class="ledger-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ledger-name" x="46" y="122">Untracked</text>
  <text class="ledger-desc" x="46" y="142">You know the total.</text>
  <text class="ledger-desc ledger-row ledger-r0" x="46" y="182">Money went out</text>
  <text class="ledger-desc ledger-row ledger-r1" x="46" y="216">The balance is lower</text>
  <text class="ledger-desc ledger-row ledger-r2" x="46" y="250">No record of which purchase</text>
  <text class="ledger-desc ledger-row ledger-r3" x="46" y="284">No way to attribute the change</text>
  <text class="ledger-desc ledger-row ledger-r4" x="46" y="318">Every audit starts from scratch</text>
  <rect class="ledger-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ledger-name" x="526" y="122">A ledger</text>
  <text class="ledger-desc" x="526" y="142">Every entry, in order.</text>
  <text class="ledger-desc ledger-row ledger-r0" x="526" y="182">Each transaction recorded as it happens</text>
  <text class="ledger-desc ledger-row ledger-r1" x="526" y="216">With what produced it</text>
  <text class="ledger-desc ledger-row ledger-r2" x="526" y="250">Reconciled in reverse when needed</text>
  <text class="ledger-desc ledger-row ledger-r3" x="526" y="284">Every contribution attributable</text>
  <text class="ledger-desc ledger-row ledger-r4" x="526" y="318">And discarded once reconciled</text>
  <text class="ledger-sub" x="30" y="372">Discarding the ledger after reconciliation is the memory behaviour that matters: the graph exists only until backward runs, which is why holding a reference to a loss keeps a whole graph alive.</text>
</svg>
