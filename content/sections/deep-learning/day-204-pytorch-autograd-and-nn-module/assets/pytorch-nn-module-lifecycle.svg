<svg role="img" aria-label="PyTorch nn Module architecture showing parameter encapsulation submodules state dict serialization and forward execution hook" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>PyTorch nn.Module Encapsulation and Lifecycle Architecture</title>
  <defs>
    <linearGradient id="bg204b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card204b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg204b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PYTORCH NN.MODULE ANATOMY &amp; LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Layer Encapsulation, Parameter Tracking, and Execution Pipeline</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card204b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Outer Module Box -->
    <rect x="25" y="20" width="710" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" rx="8"/>
    <text x="45" y="45" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700">class DeepClassifier(nn.Module):</text>

    <!-- Submodule 1: nn.Linear -->
    <rect x="45" y="65" width="200" height="190" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="145" y="90" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">self.fc1 = nn.Linear(784, 128)</text>
    <text x="145" y="115" fill="#cbd5e1" font-size="9" text-anchor="middle">W: nn.Parameter(128, 784)</text>
    <text x="145" y="135" fill="#cbd5e1" font-size="9" text-anchor="middle">b: nn.Parameter(128)</text>
    <text x="145" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">Automatic Kaiming/He Init</text>
    <text x="145" y="185" fill="#94a3b8" font-size="8" text-anchor="middle">Tracked in self.parameters()</text>
    <text x="145" y="225" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Device: .to(device)</text>

    <!-- Submodule 2: nn.ReLU -->
    <rect x="275" y="65" width="180" height="190" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="365" y="90" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">self.relu = nn.ReLU()</text>
    <text x="365" y="115" fill="#cbd5e1" font-size="9" text-anchor="middle">Non-linear Activation</text>
    <text x="365" y="135" fill="#94a3b8" font-size="8" text-anchor="middle">Stateless (No Parameters)</text>
    <text x="365" y="175" fill="#38bdf8" font-size="9" text-anchor="middle">def forward(self, x):</text>
    <text x="365" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">h = self.relu(self.fc1(x))</text>
    <text x="365" y="225" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">Executes __call__ Hooks</text>

    <!-- Submodule 3: nn.Linear (Out) -->
    <rect x="485" y="65" width="230" height="190" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="600" y="90" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">self.fc2 = nn.Linear(128, 10)</text>
    <text x="600" y="115" fill="#cbd5e1" font-size="9" text-anchor="middle">W: nn.Parameter(10, 128)</text>
    <text x="600" y="135" fill="#cbd5e1" font-size="9" text-anchor="middle">b: nn.Parameter(10)</text>
    <text x="600" y="165" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">state_dict() Serialization</text>
    <text x="600" y="185" fill="#94a3b8" font-size="8" text-anchor="middle">model.eval() / model.train()</text>
    <text x="600" y="225" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Named Parameters Generator</text>
  </g>
</svg>
