questions:
  - question: 'What happens under the hood when you invoke loss.backward() on a scalar tensor in PyTorch?'
    options:
      - 'It walks the graph backwards from the loss node'
      - 'It deletes all tensors in RAM'
      - 'It resets all model weights to random numbers'
      - 'It compiles Python code into C++ binaries'
    answer_index: 0
    explanation: 'loss.backward() executes reverse-mode automatic differentiation along the dynamically recorded tape, populating .grad on all leaf parameters.'
  - question: 'Why is it mandatory to call optimizer.zero_grad() (or model.zero_grad()) before executing loss.backward() in a standard training loop?'
    options:
      - 'To free up GPU memory'
      - 'Gradients accumulate, so old batches would corrupt them'
      - 'To prevent the model from overfitting'
      - 'To normalize inputs to zero mean'
    answer_index: 1
    explanation: 'PyTorch accumulates gradients by default (which enables gradient accumulation across mini-batches). Without zero_grad(), subsequent batches would add to previous gradients.'
  - question: 'When evaluating a trained PyTorch model on a validation dataset, which context manager should you wrap the forward pass in to disable graph construction and reduce memory overhead?'
    options:
      - 'with torch.enable_grad():'
      - 'with torch.autograd.detect_anomaly():'
      - 'with torch.no_grad():'
      - 'with open("eval.txt"):'
    answer_index: 2
    explanation: 'with torch.no_grad(): deactivates autograd tracking, preventing intermediate activation caching in the computation graph and significantly reducing inference memory consumption.'
  - question: 'What is the critical difference between invoking model(x) versus invoking model.forward(x) on an instance of torch.nn.Module?'
    options:
      - 'There is no difference'
      - 'model(x) runs on GPU while model.forward(x) runs on CPU'
      - 'model(x) is slower by 50%'
      - 'model(x) runs the hooks; forward(x) skips them'
    answer_index: 3
    explanation: 'Always call model(x) rather than model.forward(x). The Module __call__ wrapper ensures internal hooks, profilers, and autograd callbacks execute correctly.'
  - question: 'What does model.state_dict() return, and how is it used for checkpoint persistence?'
    options:
      - 'An OrderedDict of parameter and buffer tensors'
      - 'It returns the accuracy of the model on the training set'
      - 'It returns the Python source code of the class'
      - 'It returns a list of CPU hardware specifications'
    answer_index: 0
    explanation: 'state_dict() serializes the exact parameter and buffer tensors of a model, providing a robust format for model checkpointing and deployment.'
