terms:
  - term: 'Autograd'
    definition: 'PyTorch reverse-mode automatic differentiation engine that dynamically builds a Directed Acyclic Graph (DAG) during the forward pass to compute analytical gradients.'
  - term: 'torch.nn.Module'
    definition: 'The fundamental base class for all neural network architectures in PyTorch, encapsulating layers, parameters, forward logic, and hooks.'
  - term: 'requires_grad'
    definition: 'A boolean tensor flag instructing autograd whether to record operations on this tensor in the computational graph.'
  - term: 'grad_fn'
    definition: 'A reference on a non-leaf tensor pointing to the backward function node that generated it during forward execution.'
  - term: 'Leaf Tensor'
    definition: 'A tensor created directly by the user (such as model weights or inputs) that is not the output of a tracked operation.'
  - term: 'torch.no_grad()'
    definition: 'A Python context manager that disables autograd tracking to accelerate evaluation and reduce memory consumption.'
  - term: 'state_dict'
    definition: 'A Python dictionary mapping layer names to their corresponding parameter and persistent buffer tensors.'
  - term: 'Gradient Accumulation'
    definition: 'The default behavior in PyTorch where new gradients computed by backward() are summed into existing .grad buffers rather than overwriting them.'
