visuals:
  - id: pytorch-autograd-dynamic-graph
    file: assets/pytorch-autograd-dynamic-graph.svg
    type: diagram
    title: PyTorch Autograd Dynamic Computation Graph and grad_fn Engine
    alt: PyTorch dynamic computation graph and autograd engine showing tensor forward execution and reverse gradient propagation through grad_fn nodes
    description: Visual decomposition of PyTorch reverse-mode automatic differentiation showing leaf tensors with requires_grad, intermediate grad_fn functions, loss.backward() invocation, and gradient accumulation.
  - id: pytorch-nn-module-lifecycle
    file: assets/pytorch-nn-module-lifecycle.svg
    type: diagram
    title: PyTorch nn.Module Anatomy and Lifecycle Architecture
    alt: PyTorch nn Module architecture showing parameter encapsulation submodules state dict serialization and forward execution hook
    description: Architectural anatomy of torch.nn.Module illustrating parameter tracking, submodule nesting, forward call hooks, device migration, and model state dictionary serialization.
  - id: autograd-attributes
    file: assets/autograd-attributes.svg
    type: diagram
    title: 'Three tensor attributes'
    alt: 'Diagram: the three tensor attributes that govern automatic differentiation'
    description: 'A three-stage description of autograd tensor metadata covering the gradient flag, leaf status and the graph node reference.'
  - id: module-benefits
    file: assets/module-benefits.svg
    type: diagram
    title: 'What nn.Module inherits for you'
    alt: 'Diagram: manual parameter management compared with a module base class'
    description: 'A two-column comparison of managing parameters by hand against inheriting module machinery.'
  - id: autograd-lineage
    file: assets/autograd-lineage.svg
    type: diagram
    title: 'Three generations of differentiation'
    alt: 'Diagram: the progression from hand-derived gradients to dynamic tape-based autograd'
    description: 'A three-stage progression of gradient computation from manual derivation through static symbolic graphs to dynamic tape-based differentiation.'
  - id: backward-mechanics
    file: assets/backward-mechanics.svg
    type: diagram
    title: 'What backward() does'
    alt: 'Diagram: the four steps performed by a backward call'
    description: 'A four-stage description of the backward pass covering graph traversal, local derivatives, accumulation into leaves and graph release.'
  - id: module-modes
    file: assets/module-modes.svg
    type: diagram
    title: 'Train mode and eval mode'
    alt: 'Diagram: how training and evaluation modes change layer behaviour'
    description: 'A four-stage description of module modes covering dropout, normalisation statistics, the resulting evaluation error and the checkpoint.'
  - id: advanced-autograd
    file: assets/advanced-autograd.svg
    type: diagram
    title: 'Three advanced autograd features'
    alt: 'Diagram: hooks, custom functions and in-place operation hazards in autograd'
    description: 'A three-stage description of advanced autograd covering execution hooks, custom differentiable functions and in-place operation hazards.'
  - id: ledger
    file: assets/ledger.svg
    type: diagram
    title: 'An accounting ledger'
    alt: 'Diagram: an accounting ledger as an analogy for a tape-based autograd graph'
    description: 'A two-column comparison of untracked spending against a recorded ledger, as an analogy for autograd.'
  - id: framework-implications
    file: assets/framework-implications.svg
    type: diagram
    title: 'Four practical consequences'
    alt: 'Diagram: the memory, correctness, portability and performance implications of autograd'
    description: 'A four-stage description of framework implications covering graph memory, inference mode, checkpoint portability and kernel dispatch.'
  - id: autograd-when
    file: assets/autograd-when.svg
    type: diagram
    title: 'Where autograd earns its cost'
    alt: 'Diagram: when automatic differentiation is the right tool'
    description: 'A two-column comparison of workloads benefiting from autograd against those that do not need it.'
