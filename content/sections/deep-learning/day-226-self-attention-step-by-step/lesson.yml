section: deep-learning
subsection: sequence-models-and-transformers
week: 33
learning_promise: 'Master the multi-head subspace projection mechanics and positional encoding foundations of Transformers: understand why splitting into h heads enables diverse relationship tracking, derive Sinusoidal Positional Encodings, understand modern Rotary Position Embeddings (RoPE), and build a complete Multi-Head Self-Attention module in PyTorch.'
objectives:
  - 'Derive the Multi-Head Attention projection equations: Q_i = X W_Q^i, K_i = X W_K^i, V_i = X W_V^i.'
  - 'Explain why multi-head attention outperforms single-head attention by attending to information at different positions and representation subspaces simultaneously.'
  - 'Derive Sinusoidal Positional Encodings and prove the linear transformation property for relative positional shifts.'
  - 'Explain modern Rotary Position Embeddings (RoPE) and how 2D complex plane rotations enforce relative distance encoding.'
  - 'Implement a fully vectorized Multi-Head Self-Attention module in PyTorch with head splitting and recombination.'
