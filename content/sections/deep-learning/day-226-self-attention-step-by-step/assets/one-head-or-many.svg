<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Same cost, more relationships.">
  <title>One head, or many</title>
  <style>
    .one-head-or-many-bg   { fill: #f8fafc; }
    .one-head-or-many-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-head-or-many-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-head-or-many-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-head-or-many-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-head-or-many-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-head-or-many-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-head-or-many-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-head-or-many-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-head-or-many-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-head-or-many-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-head-or-many-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-head-or-many-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-head-or-many-row { opacity: 1; }
    .one-head-or-many-r0 { animation-delay: 0.00s; }
    .one-head-or-many-r1 { animation-delay: 0.45s; }
    .one-head-or-many-r2 { animation-delay: 0.90s; }
    .one-head-or-many-r3 { animation-delay: 1.35s; }
    .one-head-or-many-r4 { animation-delay: 1.80s; }
    .one-head-or-many-row { animation: one-head-or-many-reveal 7.3s ease-in-out infinite; }
    @keyframes one-head-or-many-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="one-head-or-many-bg" width="980" height="390"/>
  <text class="one-head-or-many-h1"  x="30" y="40">One head, or many</text>
  <text class="one-head-or-many-sub" x="30" y="64">Same cost, more relationships.</text>
  <rect class="one-head-or-many-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="one-head-or-many-name" x="46" y="122">One wide head</text>
  <text class="one-head-or-many-desc" x="46" y="142">One relationship per layer.</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r0" x="46" y="182">Full model dimension in one attention</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r1" x="46" y="216">One softmax distribution per position</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r2" x="46" y="250">One kind of relationship attended to</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r3" x="46" y="284">Same total arithmetic</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r4" x="46" y="318">Simpler to reason about</text>
  <rect class="one-head-or-many-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="one-head-or-many-name" x="526" y="122">Several narrow heads</text>
  <text class="one-head-or-many-desc" x="526" y="142">Several, simultaneously.</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r0" x="526" y="182">Model dimension split across heads</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r1" x="526" y="216">One distribution per head, per position</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r2" x="526" y="250">Syntax in one, coreference in another</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r3" x="526" y="284">Identical total arithmetic</text>
  <text class="one-head-or-many-desc one-head-or-many-row one-head-or-many-r4" x="526" y="318">Consistently better in practice</text>
  <text class="one-head-or-many-sub" x="30" y="372">"Identical total arithmetic" is the part people miss: multi-head attention is not a more expensive variant, it is the same computation partitioned differently.</text>
</svg>
