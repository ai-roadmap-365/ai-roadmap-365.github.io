<svg role="img" aria-label="Multi-Head Attention architecture diagram showing linear projection into multiple subspace heads parallel attention concatenation and output projection" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Multi-Head Attention Subspace Architecture</title>
  <defs>
    <linearGradient id="bg226a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card226" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg226a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MULTI-HEAD ATTENTION ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">MultiHead(Q, K, V) = Concat(head_1, ..., head_h) W_O</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card226)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Input Vectors at Bottom -->
    <rect x="250" y="235" width="260" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="380" y="260" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Input Vectors: X (Batch × Seq × d_model)</text>

    <!-- Parallel Linear Projections -->
    <rect x="50" y="160" width="180" height="45" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="140" y="180" fill="#fbbf24" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Head 1: [W_Q1, W_K1, W_V1]</text>
    <text x="140" y="196" fill="#94a3b8" font-size="8" text-anchor="middle">Syntactic Subject-Verb Head</text>

    <rect x="290" y="160" width="180" height="45" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="380" y="180" fill="#c084fc" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Head 2: [W_Q2, W_K2, W_V2]</text>
    <text x="380" y="196" fill="#94a3b8" font-size="8" text-anchor="middle">Coreference ("it" -> "animal")</text>

    <rect x="530" y="160" width="180" height="45" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="620" y="180" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Head h: [W_Qh, W_Kh, W_Vh]</text>
    <text x="620" y="196" fill="#94a3b8" font-size="8" text-anchor="middle">Prepositional / Modifier Head</text>

    <!-- Connectors Upward -->
    <line x1="320" y1="235" x2="140" y2="205" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="380" y1="235" x2="380" y2="205" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="440" y1="235" x2="620" y2="205" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Scaled Dot-Product Boxes -->
    <rect x="50" y="95" width="180" height="40" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="140" y="120" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Scaled Attention (Head 1)</text>

    <rect x="290" y="95" width="180" height="40" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="380" y="120" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">Scaled Attention (Head 2)</text>

    <rect x="530" y="95" width="180" height="40" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="620" y="120" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Scaled Attention (Head h)</text>

    <line x1="140" y1="160" x2="140" y2="135" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="380" y1="160" x2="380" y2="135" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="620" y1="160" x2="620" y2="135" stroke="#10b981" stroke-width="1.5"/>

    <!-- Concat & Linear W_O at Top -->
    <rect x="200" y="20" width="360" height="50" fill="#0f172a" stroke="#f43f5e" stroke-width="2" rx="6"/>
    <text x="380" y="42" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Concat(head_1, ..., head_h) × W_O Projection</text>
    <text x="380" y="60" fill="#f8fafc" font-size="9" text-anchor="middle">Final Multi-Head Output: (Batch × Seq × d_model)</text>

    <line x1="140" y1="95" x2="280" y2="70" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="380" y1="95" x2="380" y2="70" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="620" y1="95" x2="480" y2="70" stroke="#f43f5e" stroke-width="1.5"/>
  </g>
</svg>
