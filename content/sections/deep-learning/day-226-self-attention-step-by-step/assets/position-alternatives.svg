<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fixed, learned, rotary, or biased.">
  <title>Four ways to encode position</title>
  <style>
    .position-alternatives-bg   { fill: #f8fafc; }
    .position-alternatives-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .position-alternatives-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .position-alternatives-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .position-alternatives-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .position-alternatives-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .position-alternatives-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .position-alternatives-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .position-alternatives-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .position-alternatives-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .position-alternatives-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .position-alternatives-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .position-alternatives-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .position-alternatives-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .position-alternatives-stage { opacity: 1; }

    .position-alternatives-s0 { animation-delay: 0.00s; }
    .position-alternatives-e0 { animation-delay: 0.00s; }
    .position-alternatives-s1 { animation-delay: 1.28s; }
    .position-alternatives-e1 { animation-delay: 1.28s; }
    .position-alternatives-s2 { animation-delay: 2.56s; }
    .position-alternatives-e2 { animation-delay: 2.56s; }
    .position-alternatives-s3 { animation-delay: 3.84s; }
    .position-alternatives-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .position-alternatives-conn  { animation: position-alternatives-trace 6.4s ease-in-out infinite; }
      .position-alternatives-stage { animation: position-alternatives-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes position-alternatives-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes position-alternatives-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .position-alternatives-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .position-alternatives-stage { animation: position-alternatives-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes position-alternatives-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="position-alternatives-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="position-alternatives-bg" width="980" height="322"/>
  <text class="position-alternatives-h1"  x="30" y="40">Four ways to encode position</text>
  <text class="position-alternatives-sub" x="30" y="64">Fixed, learned, rotary, or biased.</text>
  <g class="position-alternatives-stage position-alternatives-s0">
    <rect class="position-alternatives-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="position-alternatives-step" x="44" y="142">01</text>
    <text class="position-alternatives-name" x="70" y="142">Fixed sinusoids</text>
    <text class="position-alternatives-desc" x="44" y="166">No parameters. Deterministic,</text>
    <text class="position-alternatives-desc" x="44" y="182">and extrapolates poorly.</text>
  </g>
  <line class="position-alternatives-line position-alternatives-conn position-alternatives-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#position-alternatives-tip)"/>
  <g class="position-alternatives-stage position-alternatives-s1">
    <rect class="position-alternatives-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="position-alternatives-step" x="280" y="142">02</text>
    <text class="position-alternatives-name" x="306" y="142">Learned embeddings</text>
    <text class="position-alternatives-desc" x="280" y="166">A vector per position, trained.</text>
    <text class="position-alternatives-desc" x="280" y="182">Cannot exceed the trained length</text>
    <text class="position-alternatives-desc" x="280" y="198">at all.</text>
  </g>
  <line class="position-alternatives-line position-alternatives-conn position-alternatives-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#position-alternatives-tip)"/>
  <g class="position-alternatives-stage position-alternatives-s2">
    <rect class="position-alternatives-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="position-alternatives-step" x="516" y="142">03</text>
    <text class="position-alternatives-name" x="542" y="142">Rotary</text>
    <text class="position-alternatives-desc" x="516" y="166">Relative position, rotated into</text>
    <text class="position-alternatives-desc" x="516" y="182">queries and keys.</text>
  </g>
  <line class="position-alternatives-line position-alternatives-conn position-alternatives-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#position-alternatives-tip)"/>
  <g class="position-alternatives-stage position-alternatives-s3">
    <rect class="position-alternatives-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="position-alternatives-step" x="752" y="142">04</text>
    <text class="position-alternatives-name" x="778" y="142">Linear bias on scores</text>
    <text class="position-alternatives-desc" x="752" y="166">Penalise distance directly. No</text>
    <text class="position-alternatives-desc" x="752" y="182">embedding at all, and</text>
    <text class="position-alternatives-desc" x="752" y="198">extrapolates well.</text>
  </g>
  <text class="position-alternatives-sub" x="30" y="304">The learned-embedding limitation is absolute and worth knowing: a model with learned positions has no representation for position 5,000 if it was trained to 2,048.</text>
</svg>
