<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which says something about why they help.">
  <title>Heads are prunable after training</title>
  <style>
    .head-redundancy-bg   { fill: #f8fafc; }
    .head-redundancy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-redundancy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-redundancy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-redundancy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-redundancy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head-redundancy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .head-redundancy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .head-redundancy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .head-redundancy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .head-redundancy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .head-redundancy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .head-redundancy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .head-redundancy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .head-redundancy-stage { opacity: 1; }

    .head-redundancy-s0 { animation-delay: 0.00s; }
    .head-redundancy-e0 { animation-delay: 0.00s; }
    .head-redundancy-s1 { animation-delay: 1.50s; }
    .head-redundancy-e1 { animation-delay: 1.50s; }
    .head-redundancy-s2 { animation-delay: 3.00s; }
    .head-redundancy-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .head-redundancy-conn  { animation: head-redundancy-trace 6s ease-in-out infinite; }
      .head-redundancy-stage { animation: head-redundancy-arrive 6s ease-in-out infinite; }
    }
    @keyframes head-redundancy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes head-redundancy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .head-redundancy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .head-redundancy-stage { animation: head-redundancy-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes head-redundancy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="head-redundancy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="head-redundancy-bg" width="980" height="322"/>
  <text class="head-redundancy-h1"  x="30" y="40">Heads are prunable after training</text>
  <text class="head-redundancy-sub" x="30" y="64">Which says something about why they help.</text>
  <g class="head-redundancy-stage head-redundancy-s0">
    <rect class="head-redundancy-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="head-redundancy-step" x="44" y="142">01</text>
    <text class="head-redundancy-name" x="70" y="142">Many heads can be removed after training</text>
    <text class="head-redundancy-desc" x="44" y="166">With little loss in performance.</text>
  </g>
  <line class="head-redundancy-line head-redundancy-conn head-redundancy-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#head-redundancy-tip)"/>
  <g class="head-redundancy-stage head-redundancy-s1">
    <rect class="head-redundancy-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="head-redundancy-step" x="359" y="142">02</text>
    <text class="head-redundancy-name" x="385" y="142">And are necessary during training</text>
    <text class="head-redundancy-desc" x="359" y="166">Removing them from the start hurts</text>
    <text class="head-redundancy-desc" x="359" y="182">considerably.</text>
  </g>
  <line class="head-redundancy-line head-redundancy-conn head-redundancy-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#head-redundancy-tip)"/>
  <g class="head-redundancy-stage head-redundancy-s2">
    <rect class="head-redundancy-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="head-redundancy-step" x="674" y="142">03</text>
    <text class="head-redundancy-name" x="700" y="142">So they help optimisation, not only capacity</text>
    <text class="head-redundancy-desc" x="674" y="166">Extra heads make the loss surface easier to</text>
    <text class="head-redundancy-desc" x="674" y="182">traverse.</text>
  </g>
  <text class="head-redundancy-sub" x="30" y="304">This is a recurring pattern in deep learning: over-parameterisation helps training more than it helps the final function, which is also why distillation works.</text>
</svg>
