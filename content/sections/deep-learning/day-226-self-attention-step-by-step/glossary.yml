terms:
  - term: 'Multi-Head Attention (MHA)'
    definition: 'An attention module that linearly projects queries, keys, and values into h parallel subspaces before performing attention.'
  - term: 'Subspace'
    definition: 'A lower-dimensional representation slice (dimension d_k = d_model / h) dedicated to capturing specific feature patterns.'
  - term: 'Sinusoidal Positional Encoding'
    definition: 'Deterministic geometric position vectors generated using sine and cosine functions across geometric frequency spectra.'
  - term: 'Rotary Position Embedding (RoPE)'
    definition: 'A relative position encoding method that rotates query and key vectors in 2D coordinate pairs by position-dependent angles.'
  - term: 'Permutation Equivariance'
    definition: 'A mathematical property where permuting input elements results in an identically permuted output sequence.'
  - term: 'Output Projection (W_O)'
    definition: 'A linear transformation layer that recombines the concatenated outputs of all attention heads.'
  - term: 'Relative Position Encoding'
    definition: 'A positional mechanism where attention depends on the relative distance (i - j) between tokens rather than absolute indices.'
  - term: 'Head Dimension (d_k)'
    definition: 'The dimensionality of an individual attention head, typically computed as d_model / num_heads (e.g. 768 / 12 = 64).'
