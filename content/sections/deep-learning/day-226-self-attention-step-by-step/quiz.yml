questions:
  - question: 'Why does Multi-Head Attention split the total hidden dimension d_model into h parallel heads of dimension d_k = d_model / h rather than using a single giant attention head?'
    options:
      - 'To make the output matrix smaller'
      - 'Because a single attention head cannot run on GPUs'
      - 'Heads attend to different subspaces at once'
      - 'To eliminate the need for training weights'
    answer_index: 2
    explanation: 'Splitting into multiple heads allows different heads to specialize in distinct linguistic and semantic relationships across different subspaces.'
  - question: 'What is the fundamental purpose of Positional Encodings in Transformer models?'
    options:
      - 'To normalize gradients to zero'
      - 'To encrypt the input text for extra security'
      - 'To reduce vocabulary size'
      - 'Attention is permutation-equivariant'
    answer_index: 3
    explanation: 'Pure self-attention has no inherent concept of word order; positional encodings explicitly inject position information into token vectors.'
  - question: 'How do Rotary Position Embeddings (RoPE / Su et al., 2021) encode token positions in modern LLMs like Llama 3 and Mistral?'
    options:
      - 'It rotates pairs by an angle proportional to position'
      - 'By adding a random integer to each word'
      - 'By sorting the words alphabetically'
      - 'By deleting every second token'
    answer_index: 0
    explanation: 'RoPE applies complex rotations to query and key vectors such that their inner product naturally encodes relative positional offsets.'
  - question: 'What is the computational cost of Multi-Head Attention compared to a Single-Head Attention layer of dimension d_model?'
    options:
      - 'Multi-head attention is 100 times slower'
      - 'Roughly identical — each head works on d_model / h'
      - 'Multi-head attention requires 100 times more parameters'
      - 'Single-head attention requires O(N^3) compute'
    answer_index: 1
    explanation: 'Because d_k = d_model / h, computing h parallel heads of size d_k requires the exact same total FLOPs as one head of size d_model.'
  - question: 'What does the final output projection matrix W_O in Multi-Head Attention accomplish?'
    options:
      - 'It computes the loss'
      - 'It normalizes the weights to zero'
      - 'It projects the concatenated heads back to d_model'
      - 'It tokenizes the output words'
    answer_index: 2
    explanation: 'W_O acts as an integration layer that blends the multi-head subspace features back into a unified representation vector.'
