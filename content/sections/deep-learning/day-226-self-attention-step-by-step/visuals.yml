visuals:
  - id: multi-head-attention-subspace-architecture
    file: assets/multi-head-attention-subspace-architecture.svg
    type: diagram
    title: 'Multi-Head Attention Subspace Architecture'
    alt: Multi-Head Attention architecture diagram showing linear projection into multiple subspace heads parallel attention concatenation and output projection
    description: 'Vaswani et al. (2017) Multi-Head Attention splitting hidden representations into parallel subspaces for diverse syntactic and semantic relation tracking.'
  - id: sinusoidal-vs-rotary-positional-embeddings
    file: assets/sinusoidal-vs-rotary-positional-embeddings.svg
    type: diagram
    title: 'Positional Encoding Mechanics'
    alt: Positional Encoding comparison illustrating Vaswani Sinusoidal absolute positions versus modern Rotary Position Embeddings rotation in the complex plane
    description: 'Comparison of Vaswani (2017) additive sinusoidal positional encodings with Su et al. (2021) Rotary Position Embeddings (RoPE).'
  - id: multihead
    file: assets/multihead.svg
    type: diagram
    title: 'Multi-head attention'
    alt: 'Diagram: how multi-head attention splits and recombines the representation'
    description: 'A four-stage description of multi-head attention covering the split into heads, parallel attention, concatenation and the output projection.'
  - id: one-head-or-many
    file: assets/one-head-or-many.svg
    type: diagram
    title: 'One head, or many'
    alt: 'Diagram: single-head attention compared with multi-head attention'
    description: 'A two-column comparison of single-head and multi-head attention by capacity and cost.'
  - id: positional-encoding
    file: assets/positional-encoding.svg
    type: diagram
    title: 'Why position must be added'
    alt: 'Diagram: why self-attention requires explicit positional information'
    description: 'A four-stage description of positional encoding covering permutation equivariance, the consequence, sinusoidal encoding and the relative-shift property.'
  - id: rope-or-additive
    file: assets/rope-or-additive.svg
    type: diagram
    title: 'Additive, or rotary'
    alt: 'Diagram: additive positional encodings compared with rotary position embeddings'
    description: 'A two-column comparison of additive positional encodings against rotary embeddings applied inside attention.'
  - id: position-alternatives
    file: assets/position-alternatives.svg
    type: diagram
    title: 'Four ways to encode position'
    alt: 'Diagram: four approaches to positional information in transformers'
    description: 'A four-stage description of positional approaches covering sinusoidal, learned, rotary and bias-based methods.'
  - id: gqa
    file: assets/gqa.svg
    type: diagram
    title: 'Grouped-query attention'
    alt: 'Diagram: multi-head, grouped-query and multi-query attention compared by cache size'
    description: 'A four-stage description of attention head sharing covering the KV cache problem, multi-query attention, grouped-query attention and the trade.'
  - id: head-redundancy
    file: assets/head-redundancy.svg
    type: diagram
    title: 'Heads are prunable after training'
    alt: 'Diagram: attention head importance and prunability after training'
    description: 'A three-stage description of head redundancy covering the pruning finding, the training-time necessity and what it implies.'
  - id: studio-recording
    file: assets/studio-recording.svg
    type: diagram
    title: 'A multi-track recording'
    alt: 'Diagram: single-microphone recording compared with multi-track recording'
    description: 'A two-column comparison of a single mixed recording against separate tracks combined afterwards.'
  - id: mha-implications
    file: assets/mha-implications.svg
    type: diagram
    title: 'Four consequences of multi-head attention'
    alt: 'Diagram: the interpretability, serving, pruning and design implications of multi-head attention'
    description: 'A four-stage description of multi-head attention implications covering head interpretability, cache memory, pruning and head count selection.'
  - id: mha-when
    file: assets/mha-when.svg
    type: diagram
    title: 'Choosing attention configuration'
    alt: 'Diagram: the configuration decisions for multi-head attention'
    description: 'A two-column comparison of attention configuration choices for training against those for serving.'
