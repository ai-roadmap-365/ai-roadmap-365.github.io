<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Beyond a held-out accuracy figure.">
  <title>Behavioural testing</title>
  <style>
    .checklist-testing-bg   { fill: #f8fafc; }
    .checklist-testing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checklist-testing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checklist-testing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checklist-testing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checklist-testing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checklist-testing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checklist-testing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .checklist-testing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .checklist-testing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .checklist-testing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .checklist-testing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .checklist-testing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checklist-testing-row { opacity: 1; }
    .checklist-testing-r0 { animation-delay: 0.00s; }
    .checklist-testing-r1 { animation-delay: 0.45s; }
    .checklist-testing-r2 { animation-delay: 0.90s; }
    .checklist-testing-r3 { animation-delay: 1.35s; }
    .checklist-testing-r4 { animation-delay: 1.80s; }
    .checklist-testing-row { animation: checklist-testing-reveal 7.3s ease-in-out infinite; }
    @keyframes checklist-testing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="checklist-testing-bg" width="980" height="390"/>
  <text class="checklist-testing-h1"  x="30" y="40">Behavioural testing</text>
  <text class="checklist-testing-sub" x="30" y="64">Beyond a held-out accuracy figure.</text>
  <rect class="checklist-testing-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="checklist-testing-name" x="46" y="122">Test-set accuracy</text>
  <text class="checklist-testing-desc" x="46" y="142">One number.</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r0" x="46" y="182">Averaged over the whole test set</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r1" x="46" y="216">Hides systematic failures</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r2" x="46" y="250">A capability failing on 2% of cases is invisible</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r3" x="46" y="284">Says nothing about robustness</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r4" x="46" y="318">Comparable, and shallow</text>
  <rect class="checklist-testing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="checklist-testing-name" x="526" y="122">Behavioural tests</text>
  <text class="checklist-testing-desc" x="526" y="142">Capability by capability.</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r0" x="526" y="182">Negation handled correctly?</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r1" x="526" y="216">Robust to a typo, or a synonym?</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r2" x="526" y="250">Consistent when a name changes?</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r3" x="526" y="284">Each a targeted suite</text>
  <text class="checklist-testing-desc checklist-testing-row checklist-testing-r4" x="526" y="318">Failures are specific and fixable</text>
  <text class="checklist-testing-sub" x="30" y="372">This is the software-testing idea imported into machine learning: a unit test per capability finds systematic defects that an aggregate number averages into invisibility.</text>
</svg>
