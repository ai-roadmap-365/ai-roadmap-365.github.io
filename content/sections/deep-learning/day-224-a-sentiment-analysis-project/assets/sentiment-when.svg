<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to measure either way.">
  <title>When to build, and when to buy</title>
  <style>
    .sentiment-when-bg   { fill: #f8fafc; }
    .sentiment-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sentiment-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sentiment-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sentiment-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sentiment-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sentiment-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sentiment-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sentiment-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sentiment-when-row { opacity: 1; }
    .sentiment-when-r0 { animation-delay: 0.00s; }
    .sentiment-when-r1 { animation-delay: 0.45s; }
    .sentiment-when-r2 { animation-delay: 0.90s; }
    .sentiment-when-r3 { animation-delay: 1.35s; }
    .sentiment-when-r4 { animation-delay: 1.80s; }
    .sentiment-when-row { animation: sentiment-when-reveal 7.3s ease-in-out infinite; }
    @keyframes sentiment-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="sentiment-when-bg" width="980" height="390"/>
  <text class="sentiment-when-h1"  x="30" y="40">When to build, and when to buy</text>
  <text class="sentiment-when-sub" x="30" y="64">And what to measure either way.</text>
  <rect class="sentiment-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="sentiment-when-name" x="46" y="122">Build custom</text>
  <text class="sentiment-when-desc" x="46" y="142">Domain-specific.</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r0" x="46" y="182">Domain vocabulary a general model misreads</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r1" x="46" y="216">Aspect categories specific to your product</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r2" x="46" y="250">High volume where per-call cost matters</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r3" x="46" y="284">Latency requirements under a few milliseconds</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r4" x="46" y="318">Where you have labelled data</text>
  <rect class="sentiment-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="sentiment-when-name" x="526" y="122">Use a general model</text>
  <text class="sentiment-when-desc" x="526" y="142">General text, low volume.</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r0" x="526" y="182">Ordinary consumer text</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r1" x="526" y="216">No aspect structure needed</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r2" x="526" y="250">Volume that does not justify training</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r3" x="526" y="284">Working this week rather than this quarter</text>
  <text class="sentiment-when-desc sentiment-when-row sentiment-when-r4" x="526" y="318">But evaluate it on your data anyway</text>
  <text class="sentiment-when-sub" x="30" y="372">The caveat on the right is the one that gets skipped: a general model's published accuracy is on general text, and its accuracy on your domain is a number only you can measure.</text>
</svg>
