visuals:
  - id: sentiment-analysis-pipeline-architecture
    file: assets/sentiment-analysis-pipeline-architecture.svg
    type: diagram
    title: 'End-to-End Sentiment Analysis System Architecture'
    alt: End to end sentiment analysis system engineering pipeline architecture from text ingestion to explainability and REST API
    description: 'Complete industrial pipeline for sentiment classification: ingestion, dynamic batching, model benchmarking, evaluation, and serving.'
  - id: sentiment-model-explainability-token-attribution
    file: assets/sentiment-model-explainability-token-attribution.svg
    type: diagram
    title: 'Sentiment Explainability: Token Attribution Map'
    alt: Token attribution and saliency explanation heatmap showing positive and negative word feature contributions to predicted sentiment
    description: 'Integrated Gradients saliency scores isolating positive vs negative decision drivers for model interpretability.'
  - id: sentiment-pipeline
    file: assets/sentiment-pipeline.svg
    type: diagram
    title: 'Seven stages, end to end'
    alt: 'Diagram: the seven stages of a production sentiment analysis system'
    description: 'A seven-stage description of a sentiment pipeline covering ingestion, cleaning, batching, modelling, evaluation, explanation and serving.'
  - id: keywords-or-model
    file: assets/keywords-or-model.svg
    type: diagram
    title: 'Keyword matching, or a model'
    alt: 'Diagram: dictionary-based sentiment compared with a learned classifier'
    description: 'A two-column comparison of lexicon-based sentiment scoring against a trained neural classifier.'
  - id: attribution
    file: assets/attribution.svg
    type: diagram
    title: 'Attributing a prediction to tokens'
    alt: 'Diagram: how gradient-based attribution identifies influential tokens'
    description: 'A four-stage description of token attribution covering gradient computation, magnitude, the resulting heatmap and its use in debugging.'
  - id: integrated-gradients
    file: assets/integrated-gradients.svg
    type: diagram
    title: 'Why plain gradients are not enough'
    alt: 'Diagram: the axioms plain gradients violate and how integrated gradients satisfy them'
    description: 'A four-stage description of integrated gradients covering the sensitivity failure, the completeness failure, the baseline path and the resulting attributions.'
  - id: absa
    file: assets/absa.svg
    type: diagram
    title: 'Aspect-based sentiment'
    alt: 'Diagram: overall sentiment compared with aspect-based sentiment'
    description: 'A three-stage description of aspect-based sentiment covering the mixed-review problem, aspect extraction and per-aspect polarity.'
  - id: checklist-testing
    file: assets/checklist-testing.svg
    type: diagram
    title: 'Behavioural testing'
    alt: 'Diagram: test-set accuracy compared with behavioural capability testing'
    description: 'A two-column comparison of aggregate test-set evaluation against structured behavioural tests.'
  - id: airline-qa
    file: assets/airline-qa.svg
    type: diagram
    title: 'Airline feedback at volume'
    alt: 'Diagram: manual review compared with automated triage at volume'
    description: 'A two-column comparison of manually reading feedback against automated classification with human escalation.'
  - id: sentiment-implications
    file: assets/sentiment-implications.svg
    type: diagram
    title: 'Four consequences of deploying sentiment'
    alt: 'Diagram: the calibration, drift, governance and fairness implications of sentiment systems'
    description: 'A four-stage description of sentiment deployment implications covering calibration, language drift, governance documentation and demographic fairness.'
  - id: sentiment-when
    file: assets/sentiment-when.svg
    type: diagram
    title: 'When to build, and when to buy'
    alt: 'Diagram: when a custom sentiment model is warranted'
    description: 'A two-column comparison of building a custom sentiment classifier against using a general model or service.'
