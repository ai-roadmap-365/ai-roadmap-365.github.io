section: deep-learning
subsection: sequence-models-and-transformers
week: 32
learning_promise: 'Engineer an end-to-end sentiment classification pipeline in PyTorch: build vocabulary tokenizers with frequency pruning, implement and benchmark 3 model families (Baseline Logistic Regression, fastText EmbeddingBag, and BiLSTM with Attention Pooling), compute precision-recall curves and calibration error, and implement token attribution explainability.'
objectives:
  - 'Build a production-grade NLP preprocessing and vocabulary collation pipeline in PyTorch.'
  - 'Implement and compare three sentiment classifiers: Baseline TF-IDF, EmbeddingBag, and BiLSTM with Attention Pooling.'
  - 'Evaluate models using Macro F1-Score, ROC-AUC, confusion matrices, and Expected Calibration Error (ECE).'
  - 'Implement token attribution using gradient-based saliency to explain individual review predictions.'
  - 'Package the trained sentiment classifier for sub-millisecond local inference.'
