questions:
  - question: 'Why is evaluating a sentiment analysis model using only Accuracy misleading on real-world datasets?'
    options:
      - 'Accuracy requires floating-point quantization'
      - 'Accuracy cannot be calculated on text'
      - 'PyTorch does not support accuracy calculations'
      - 'Reviews are imbalanced, so a constant scores 85%'
    answer_index: 3
    explanation: 'Class imbalance makes accuracy misleading; Precision, Recall, and Macro F1-Score are required to measure true performance across all sentiment categories.'
  - question: 'How does Gradient-Based Token Attribution (Saliency / Integrated Gradients) compute the importance of individual words in a predicted review?'
    options:
      - 'The gradient of the output w.r.t. each word embedding'
      - 'By counting the number of letters in each word'
      - 'By checking the word against a hardcoded positive dictionary'
      - 'By deleting random words and checking if the computer restarts'
    answer_index: 0
    explanation: 'Gradient saliency measures the sensitivity of the output score to infinitesimal shifts in each word embedding vector.'
  - question: 'What is Expected Calibration Error (ECE) in production NLP classification systems?'
    options:
      - 'The clock drift of the GPU server'
      - 'Whether stated confidence matches empirical accuracy'
      - 'The difference between train and test loss'
      - 'The time taken to tokenize 1,000 words'
    answer_index: 1
    explanation: 'ECE quantifies probability calibration, ensuring downstream automated systems can trust the models predicted confidence scores.'
  - question: 'In a customer service sentiment routing system, what is the best strategy for handling ambiguous predictions with low confidence (< 65%)?'
    options:
      - 'Delete the review from the database entirely'
      - 'Always guess positive'
      - 'Send ambiguous reviews to a human queue'
      - 'Double the batch size'
    answer_index: 2
    explanation: 'Selective classification routes low-confidence predictions to human annotators, maintaining high precision on automated actions.'
  - question: 'Why does a BiLSTM with Attention Pooling outperform simple Global Max Pooling on nuanced sentiment reviews with contrastive clauses ("The food was great, but the service was completely unacceptable")?'
    options:
      - 'Attention pooling only runs on GPUs'
      - 'BiLSTM has fewer parameters'
      - 'Max pooling requires sorted words'
      - 'Attention weights the contrastive clause in context'
    answer_index: 3
    explanation: 'Attention pooling captures the relative syntactic dominance of contrastive clauses, resolving complex sentiment transitions.'
