terms:
  - term: 'Sentiment Analysis'
    definition: 'The automated classification of subjective text data into emotional polarity categories (e.g. Positive, Negative, Neutral).'
  - term: 'Macro F1-Score'
    definition: 'The unweighted arithmetic mean of F1-scores calculated independently across each target class, treating all classes equally.'
  - term: 'ROC-AUC'
    definition: 'Receiver Operating Characteristic Area Under the Curve: measures the models ability to discriminate between positive and negative classes across all classification thresholds.'
  - term: 'Integrated Gradients'
    definition: 'An axiomatic feature attribution method that calculates word importance by integrating gradients along the straight line from a baseline embedding to the input embedding.'
  - term: 'Expected Calibration Error (ECE)'
    definition: 'The weighted average difference between predicted confidence bin probabilities and empirical accuracy rates.'
  - term: 'Selective Classification'
    definition: 'A deployment strategy where predictions below a confidence threshold are rejected and routed to human review.'
  - term: 'Token Saliency'
    definition: 'The sensitivity of the model output score to individual token embedding vectors calculated via first-order gradients.'
  - term: 'Contrastive Clause'
    definition: 'A linguistic construction (e.g. "although X, Y") where sentiment shifts across the sentence.'
