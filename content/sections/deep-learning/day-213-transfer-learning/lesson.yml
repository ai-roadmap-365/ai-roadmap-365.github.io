  - 'Explain why transfer learning is the dominant paradigm in computer vision and deep learning.'
  - 'Distinguish between Feature Extraction (Linear Probing) and Full Fine-Tuning with differential learning rates.'
  - 'Freeze and unfreeze parameter subsets in PyTorch using requires_grad.'
  - 'Replace classification heads to adapt pretrained models to custom class counts.'
  - 'Implement a two-stage transfer learning training regimen to prevent catastrophic forgetting.'
