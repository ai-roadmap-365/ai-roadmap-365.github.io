questions:
  - question: 'What is Catastrophic Forgetting during deep neural network fine-tuning, and how does a two-stage training schedule prevent it?'
    options:
      - 'When batch size is set to a prime number'
      - 'When a model loses its connection to the GPU memory bus'
      - 'When the validation dataset is accidentally deleted'
      - 'A random head''s gradients wreck the pretrained backbone'
    answer_index: 3
    explanation: 'A newly initialized linear head produces huge random losses. If the backbone is trainable immediately, large gradients scramble the carefully pretrained feature extractors. Freezing the backbone first stabilizes the head before gentle fine-tuning.'
  - question: 'How do you freeze all convolutional backbone parameters in a PyTorch vision model so that they do not receive gradient updates?'
    options:
      - 'requires_grad = False'
      - 'model.eval()'
      - 'torch.no_grad()'
      - 'del model.backbone'
    answer_index: 0
    explanation: 'Setting param.requires_grad = False excludes those tensors from autograd graph tracking and gradient computation during backward().'
  - question: 'If you have a very small target dataset (e.g. 200 medical X-ray images) that is visually distinct from ImageNet, which transfer learning strategy is most mathematically and empirically sound?'
    options:
      - 'Train a 152-layer ResNet from scratch with random initialization'
      - 'Freeze the backbone and train a linear head on its features'
      - 'Fine-tune all 152 layers with a huge learning rate (0.1)'
      - 'Delete all convolution layers and use an MLP'
    answer_index: 1
    explanation: 'With only 200 samples, fine-tuning millions of parameters guarantees severe overfitting. Freezing early/mid universal features and training a linear head is the optimal strategy.'
  - question: 'How are differential (layer-wise) learning rates configured in a PyTorch optimizer?'
    options:
      - 'Set learning rate in model.forward()'
      - 'Create two separate Python scripts'
      - 'Pass per-group learning rates to the optimizer'
      - 'Multiply the loss by 0.01'
    answer_index: 2
    explanation: 'PyTorch optimizers natively accept lists of dicts containing specific param subsets and custom learning rates, enabling fine-grained layer-wise tuning.'
  - question: 'Why is it critical to normalize input images with the exact mean and standard deviation of the pretraining dataset (e.g. ImageNet mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])?'
    options:
      - 'It converts RGB images to CMYK'
      - 'PyTorch throws a compile error if standard deviation is not 0.229'
      - 'It makes the image file sizes smaller on disk'
      - 'The filters were trained under that exact input distribution'
    answer_index: 3
    explanation: 'Convolutional kernels learn specific numerical scales for edge responses. Using the exact pretraining normalization ensures the input aligns with the distribution the weights expect.'
