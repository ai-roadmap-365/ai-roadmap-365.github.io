<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Data, compute and time.">
  <title>Three bottlenecks transfer removes</title>
  <style>
    .transfer-benefits-bg   { fill: #f8fafc; }
    .transfer-benefits-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-benefits-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-benefits-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-benefits-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-benefits-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transfer-benefits-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transfer-benefits-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transfer-benefits-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transfer-benefits-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transfer-benefits-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transfer-benefits-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transfer-benefits-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .transfer-benefits-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .transfer-benefits-stage { opacity: 1; }

    .transfer-benefits-s0 { animation-delay: 0.00s; }
    .transfer-benefits-e0 { animation-delay: 0.00s; }
    .transfer-benefits-s1 { animation-delay: 1.50s; }
    .transfer-benefits-e1 { animation-delay: 1.50s; }
    .transfer-benefits-s2 { animation-delay: 3.00s; }
    .transfer-benefits-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .transfer-benefits-conn  { animation: transfer-benefits-trace 6s ease-in-out infinite; }
      .transfer-benefits-stage { animation: transfer-benefits-arrive 6s ease-in-out infinite; }
    }
    @keyframes transfer-benefits-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes transfer-benefits-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .transfer-benefits-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .transfer-benefits-stage { animation: transfer-benefits-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes transfer-benefits-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="transfer-benefits-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="transfer-benefits-bg" width="980" height="322"/>
  <text class="transfer-benefits-h1"  x="30" y="40">Three bottlenecks transfer removes</text>
  <text class="transfer-benefits-sub" x="30" y="64">Data, compute and time.</text>
  <g class="transfer-benefits-stage transfer-benefits-s0">
    <rect class="transfer-benefits-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="transfer-benefits-step" x="44" y="142">01</text>
    <text class="transfer-benefits-name" x="70" y="142">Data</text>
    <text class="transfer-benefits-desc" x="44" y="166">Thousands of labelled images instead of</text>
    <text class="transfer-benefits-desc" x="44" y="182">millions.</text>
    <text class="transfer-benefits-edge" x="44" y="242">1000x less</text>
  </g>
  <line class="transfer-benefits-line transfer-benefits-conn transfer-benefits-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#transfer-benefits-tip)"/>
  <g class="transfer-benefits-stage transfer-benefits-s1">
    <rect class="transfer-benefits-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="transfer-benefits-step" x="359" y="142">02</text>
    <text class="transfer-benefits-name" x="385" y="142">Compute</text>
    <text class="transfer-benefits-desc" x="359" y="166">Minutes on one accelerator instead of days on</text>
    <text class="transfer-benefits-desc" x="359" y="182">many.</text>
  </g>
  <line class="transfer-benefits-line transfer-benefits-conn transfer-benefits-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#transfer-benefits-tip)"/>
  <g class="transfer-benefits-stage transfer-benefits-s2">
    <rect class="transfer-benefits-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="transfer-benefits-step" x="674" y="142">03</text>
    <text class="transfer-benefits-name" x="700" y="142">Time</text>
    <text class="transfer-benefits-desc" x="674" y="166">A working model in hours rather than weeks.</text>
  </g>
  <text class="transfer-benefits-sub" x="30" y="304">The data reduction is the one that decides whether a project is possible at all: most organisations can label a few thousand images and cannot label a million.</text>
</svg>
