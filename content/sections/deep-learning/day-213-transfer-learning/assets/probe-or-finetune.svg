<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Data size decides.">
  <title>Linear probing, or fine-tuning</title>
  <style>
    .probe-or-finetune-bg   { fill: #f8fafc; }
    .probe-or-finetune-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-or-finetune-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-or-finetune-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-or-finetune-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-or-finetune-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-or-finetune-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .probe-or-finetune-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .probe-or-finetune-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .probe-or-finetune-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .probe-or-finetune-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .probe-or-finetune-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .probe-or-finetune-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .probe-or-finetune-row { opacity: 1; }
    .probe-or-finetune-r0 { animation-delay: 0.00s; }
    .probe-or-finetune-r1 { animation-delay: 0.45s; }
    .probe-or-finetune-r2 { animation-delay: 0.90s; }
    .probe-or-finetune-r3 { animation-delay: 1.35s; }
    .probe-or-finetune-r4 { animation-delay: 1.80s; }
    .probe-or-finetune-row { animation: probe-or-finetune-reveal 7.3s ease-in-out infinite; }
    @keyframes probe-or-finetune-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="probe-or-finetune-bg" width="980" height="390"/>
  <text class="probe-or-finetune-h1"  x="30" y="40">Linear probing, or fine-tuning</text>
  <text class="probe-or-finetune-sub" x="30" y="64">Data size decides.</text>
  <rect class="probe-or-finetune-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="probe-or-finetune-name" x="46" y="122">Linear probing</text>
  <text class="probe-or-finetune-desc" x="46" y="142">Backbone frozen.</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r0" x="46" y="182">Train only a new classification head</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r1" x="46" y="216">Embeddings can be precomputed and cached</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r2" x="46" y="250">Extremely fast, minutes rather than hours</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r3" x="46" y="284">No risk of damaging the backbone</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r4" x="46" y="318">Right for small datasets</text>
  <rect class="probe-or-finetune-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="probe-or-finetune-name" x="526" y="122">Fine-tuning</text>
  <text class="probe-or-finetune-desc" x="526" y="142">Backbone unfrozen.</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r0" x="526" y="182">Update the backbone too, gently</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r1" x="526" y="216">Higher ceiling on accuracy</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r2" x="526" y="250">Learning rates 10 to 1000 times smaller</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r3" x="526" y="284">Risks catastrophic forgetting</text>
  <text class="probe-or-finetune-desc probe-or-finetune-row probe-or-finetune-r4" x="526" y="318">Right for larger, more distant datasets</text>
  <text class="probe-or-finetune-sub" x="30" y="372">Caching embeddings is an underrated property of the left column: with a frozen backbone the expensive forward pass runs once, and every head experiment afterwards is nearly free.</text>
</svg>
