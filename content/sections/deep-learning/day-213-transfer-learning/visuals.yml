visuals:
  - id: transfer-learning-feature-extractor-vs-finetuning
    file: assets/transfer-learning-feature-extractor-vs-finetuning.svg
    type: diagram
    title: 'Transfer Learning Paradigms: Feature Extraction vs Fine-Tuning'
    alt: Transfer learning paradigms comparing feature extraction linear probing with frozen backbone versus full fine-tuning with differential learning rates
    description: Comparative architectural visualization contrasting linear probing with a frozen backbone against differential layer-wise fine-tuning.
  - id: feature-transferability-and-layer-depth
    file: assets/feature-transferability-and-layer-depth.svg
    type: diagram
    title: 'Layer-Wise Feature Transferability and Semantic Specialization'
    alt: Feature transferability spectrum showing how early layers learn universal low-level visual primitives while late layers learn task-specific semantic representations
    description: Transferability spectrum mapping early-layer universal primitives (edges, gradients) versus late-layer task-specific semantic features.
  - id: transferability
    file: assets/transferability.svg
    type: diagram
    title: 'Features transfer in a spectrum'
    alt: 'Diagram: how feature transferability changes with depth in a pretrained network'
    description: 'A four-stage description of layer-wise transferability covering edges, textures, parts and class-specific features.'
  - id: probe-or-finetune
    file: assets/probe-or-finetune.svg
    type: diagram
    title: 'Linear probing, or fine-tuning'
    alt: 'Diagram: linear probing compared with full fine-tuning'
    description: 'A two-column comparison of freezing a backbone and training a head against fine-tuning the whole network.'
  - id: two-stage-protocol
    file: assets/two-stage-protocol.svg
    type: diagram
    title: 'The two-phase protocol'
    alt: 'Diagram: the two-phase transfer learning protocol'
    description: 'A four-stage description of the transfer protocol covering the frozen warmup phase, unfreezing, differential rates and the reason for the ordering.'
  - id: pretraining-sources
    file: assets/pretraining-sources.svg
    type: diagram
    title: 'Three sources of pretrained features'
    alt: 'Diagram: three pretraining paradigms for vision backbones'
    description: 'A three-stage description of vision pretraining covering supervised classification, self-supervised objectives and vision-language contrastive training.'
  - id: peft-vision
    file: assets/peft-vision.svg
    type: diagram
    title: 'Full fine-tuning, or parameter-efficient'
    alt: 'Diagram: full fine-tuning compared with parameter-efficient adaptation'
    description: 'A two-column comparison of full backbone fine-tuning against low-rank parameter-efficient adaptation.'
  - id: chef-analogy
    file: assets/chef-analogy.svg
    type: diagram
    title: 'An experienced chef, retrained'
    alt: 'Diagram: retraining an experienced professional compared with training from nothing'
    description: 'A two-column comparison of adapting an experienced practitioner against training a novice from scratch.'
  - id: transfer-benefits
    file: assets/transfer-benefits.svg
    type: diagram
    title: 'Three bottlenecks transfer removes'
    alt: 'Diagram: the three constraints transfer learning removes'
    description: 'A three-stage description of transfer learning benefits covering data requirements, compute cost and development time.'
  - id: transfer-implications
    file: assets/transfer-implications.svg
    type: diagram
    title: 'Four consequences of using pretrained weights'
    alt: 'Diagram: the licensing, bias, distribution and efficiency implications of transfer learning'
    description: 'A four-stage description of transfer learning implications covering weight licensing, inherited bias, distribution shift and inference cost.'
  - id: transfer-when
    file: assets/transfer-when.svg
    type: diagram
    title: 'When to transfer'
    alt: 'Diagram: when transfer learning is the right approach'
    description: 'A two-column comparison of situations favouring transfer learning against those requiring training from scratch.'
