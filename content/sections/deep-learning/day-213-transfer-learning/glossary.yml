terms:
  - term: 'Transfer Learning'
    definition: 'A machine learning paradigm where knowledge gained from solving one problem is applied to a different but related problem.'
  - term: 'Linear Probing'
    definition: 'Training only a linear classifier head on top of frozen pretrained feature representations.'
  - term: 'Fine-Tuning'
    definition: 'Continuing gradient descent training across the entire pretrained network (or subset of layers) on target dataset data.'
  - term: 'Catastrophic Forgetting'
    definition: 'The phenomenon where a neural network abruptly forgets previously learned knowledge upon learning new information.'
  - term: 'Differential Learning Rates'
    definition: 'Assigning smaller learning rates to early pretrained layers and larger learning rates to newly initialized decision heads.'
  - term: 'Pretrained Weights'
    definition: 'Neural network weight matrices saved after extensive training on a massive dataset (such as ImageNet-1k or LAION-5B).'
  - term: 'Backbone'
    definition: 'The core convolutional or transformer feature extractor that generates dense visual representations before the classifier head.'
  - term: 'Distribution Shift'
    definition: 'A change in the statistical distribution of input data between the source pretraining dataset and the target downstream task.'
