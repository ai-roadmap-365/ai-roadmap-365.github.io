<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each driven by deployment.">
  <title>Four steps to model compression</title>
  <style>
    .compression-history-bg   { fill: #f8fafc; }
    .compression-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compression-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compression-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compression-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compression-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compression-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compression-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compression-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compression-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compression-history-stage { opacity: 1; }

    .compression-history-s0 { animation-delay: 0.00s; }
    .compression-history-e0 { animation-delay: 0.00s; }
    .compression-history-s1 { animation-delay: 1.28s; }
    .compression-history-e1 { animation-delay: 1.28s; }
    .compression-history-s2 { animation-delay: 2.56s; }
    .compression-history-e2 { animation-delay: 2.56s; }
    .compression-history-s3 { animation-delay: 3.84s; }
    .compression-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .compression-history-conn  { animation: compression-history-trace 6.4s ease-in-out infinite; }
      .compression-history-stage { animation: compression-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes compression-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compression-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compression-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compression-history-stage { animation: compression-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compression-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compression-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compression-history-bg" width="980" height="322"/>
  <text class="compression-history-h1"  x="30" y="40">Four steps to model compression</text>
  <text class="compression-history-sub" x="30" y="64">Each driven by deployment.</text>
  <g class="compression-history-stage compression-history-s0">
    <rect class="compression-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="compression-history-step" x="44" y="142">01</text>
    <text class="compression-history-name" x="70" y="142">Early pruning work</text>
    <text class="compression-history-desc" x="44" y="166">Which showed most weights could</text>
    <text class="compression-history-desc" x="44" y="182">be removed. Largely ignored at</text>
    <text class="compression-history-desc" x="44" y="198">the time.</text>
  </g>
  <line class="compression-history-line compression-history-conn compression-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#compression-history-tip)"/>
  <g class="compression-history-stage compression-history-s1">
    <rect class="compression-history-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="compression-history-step" x="280" y="142">02</text>
    <text class="compression-history-name" x="306" y="142">Distillation</text>
    <text class="compression-history-desc" x="280" y="166">Small models trained to imitate</text>
    <text class="compression-history-desc" x="280" y="182">large ones.</text>
  </g>
  <line class="compression-history-line compression-history-conn compression-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#compression-history-tip)"/>
  <g class="compression-history-stage compression-history-s2">
    <rect class="compression-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="compression-history-step" x="516" y="142">03</text>
    <text class="compression-history-name" x="542" y="142">Eight-bit integer deployment</text>
    <text class="compression-history-desc" x="516" y="166">Standard once mobile inference</text>
    <text class="compression-history-desc" x="516" y="182">mattered commercially.</text>
  </g>
  <line class="compression-history-line compression-history-conn compression-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#compression-history-tip)"/>
  <g class="compression-history-stage compression-history-s3">
    <rect class="compression-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="compression-history-step" x="752" y="142">04</text>
    <text class="compression-history-name" x="778" y="142">Then four bits and below</text>
    <text class="compression-history-desc" x="752" y="166">Driven entirely by the size of</text>
    <text class="compression-history-desc" x="752" y="182">language models.</text>
  </g>
  <text class="compression-history-sub" x="30" y="304">The early results sat unused for years because nothing needed them: compression became urgent only when models outgrew the hardware people wanted to run them on.</text>
</svg>
