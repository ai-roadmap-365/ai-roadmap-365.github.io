<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A few values ruin the range.">
  <title>The outlier problem</title>
  <style>
    .outliers-bg   { fill: #f8fafc; }
    .outliers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .outliers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .outliers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .outliers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .outliers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .outliers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .outliers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .outliers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .outliers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .outliers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .outliers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .outliers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .outliers-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .outliers-stage { opacity: 1; }

    .outliers-s0 { animation-delay: 0.00s; }
    .outliers-e0 { animation-delay: 0.00s; }
    .outliers-s1 { animation-delay: 1.28s; }
    .outliers-e1 { animation-delay: 1.28s; }
    .outliers-s2 { animation-delay: 2.56s; }
    .outliers-e2 { animation-delay: 2.56s; }
    .outliers-s3 { animation-delay: 3.84s; }
    .outliers-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .outliers-conn  { animation: outliers-trace 6.4s ease-in-out infinite; }
      .outliers-stage { animation: outliers-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes outliers-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes outliers-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .outliers-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .outliers-stage { animation: outliers-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes outliers-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="outliers-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="outliers-bg" width="980" height="322"/>
  <text class="outliers-h1"  x="30" y="40">The outlier problem</text>
  <text class="outliers-sub" x="30" y="64">A few values ruin the range.</text>
  <g class="outliers-stage outliers-s0">
    <rect class="outliers-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="outliers-step" x="44" y="142">01</text>
    <text class="outliers-name" x="70" y="142">Most activations sit in a narrow band</text>
    <text class="outliers-desc" x="44" y="166">Which would quantise cleanly on</text>
    <text class="outliers-desc" x="44" y="182">its own.</text>
  </g>
  <line class="outliers-line outliers-conn outliers-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#outliers-tip)"/>
  <g class="outliers-stage outliers-s1">
    <rect class="outliers-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="outliers-step" x="280" y="142">02</text>
    <text class="outliers-name" x="306" y="142">But a few channels are enormously larger</text>
    <text class="outliers-desc" x="280" y="166">Consistently, in the same</text>
    <text class="outliers-desc" x="280" y="182">channels.</text>
  </g>
  <line class="outliers-line outliers-conn outliers-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#outliers-tip)"/>
  <g class="outliers-stage outliers-s2">
    <rect class="outliers-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="outliers-step" x="516" y="142">03</text>
    <text class="outliers-name" x="542" y="142">So the scale is set by those few</text>
    <text class="outliers-desc" x="516" y="166">And everything else collapses to</text>
    <text class="outliers-desc" x="516" y="182">a handful of levels.</text>
  </g>
  <line class="outliers-line outliers-conn outliers-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#outliers-tip)"/>
  <g class="outliers-stage outliers-s3">
    <rect class="outliers-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="outliers-step" x="752" y="142">04</text>
    <text class="outliers-name" x="778" y="142">Move the difficulty into the weights</text>
    <text class="outliers-desc" x="752" y="166">Divide the activations, multiply</text>
    <text class="outliers-desc" x="752" y="182">the weights. Both become</text>
    <text class="outliers-desc" x="752" y="198">quantisable.</text>
  </g>
  <text class="outliers-sub" x="30" y="304">That the outlier channels are consistent rather than random is what makes the fix possible: a fixed per-channel rescaling can be folded into the weights ahead of time.</text>
</svg>
