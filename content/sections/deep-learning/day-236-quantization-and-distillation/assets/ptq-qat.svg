<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Effort against accuracy.">
  <title>Quantise after, or during</title>
  <style>
    .ptq-qat-bg   { fill: #f8fafc; }
    .ptq-qat-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ptq-qat-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ptq-qat-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ptq-qat-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ptq-qat-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ptq-qat-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ptq-qat-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ptq-qat-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ptq-qat-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ptq-qat-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ptq-qat-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ptq-qat-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ptq-qat-row { opacity: 1; }
    .ptq-qat-r0 { animation-delay: 0.00s; }
    .ptq-qat-r1 { animation-delay: 0.45s; }
    .ptq-qat-r2 { animation-delay: 0.90s; }
    .ptq-qat-r3 { animation-delay: 1.35s; }
    .ptq-qat-r4 { animation-delay: 1.80s; }
    .ptq-qat-row { animation: ptq-qat-reveal 7.3s ease-in-out infinite; }
    @keyframes ptq-qat-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ptq-qat-bg" width="980" height="390"/>
  <text class="ptq-qat-h1"  x="30" y="40">Quantise after, or during</text>
  <text class="ptq-qat-sub" x="30" y="64">Effort against accuracy.</text>
  <rect class="ptq-qat-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ptq-qat-name" x="46" y="122">After training</text>
  <text class="ptq-qat-desc" x="46" y="142">Minutes of work.</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r0" x="46" y="182">Applied to an existing checkpoint</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r1" x="46" y="216">Needs only a small calibration set</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r2" x="46" y="250">Minutes, not hours</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r3" x="46" y="284">Small accuracy loss at eight bits</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r4" x="46" y="318">Try this first, always</text>
  <rect class="ptq-qat-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ptq-qat-name" x="526" y="122">During training</text>
  <text class="ptq-qat-desc" x="526" y="142">A full training run.</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r0" x="526" y="182">Rounding simulated in the forward pass</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r1" x="526" y="216">The model adapts to the error</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r2" x="526" y="250">Requires the training pipeline and data</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r3" x="526" y="284">Better at four bits and below</text>
  <text class="ptq-qat-desc ptq-qat-row ptq-qat-r4" x="526" y="318">Worth it only when the loss is unacceptable</text>
  <text class="ptq-qat-sub" x="30" y="372">Starting with the cheap method and escalating only on a measured failure is the right order, and it is frequently skipped in favour of the more complex option.</text>
</svg>
