<svg role="img" aria-label="Quantization mapping diagram showing continuous FP32 range mapped to discrete INT8 scale and zero point" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Quantization: Linear Symmetric vs. Asymmetric Mapping</title>
  <defs>
    <linearGradient id="bg236a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card236" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg236a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MODEL QUANTIZATION: CONTINUOUS FP32 TO DISCRETE INT8/INT4</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mapping Formula: q = clamp(round(x / Scale) + ZeroPoint, qmin, qmax)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="305" fill="url(#card236)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- 1. Symmetric Quantization (ZeroPoint = 0) -->
    <g transform="translate(30, 25)">
      <rect width="335" height="255" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
      <text x="167" y="30" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">1. Symmetric Quantization (INT8)</text>
      
      <!-- FP32 Continuous Range -->
      <text x="30" y="65" fill="#cbd5e1" font-size="9">Continuous FP32: [-alpha, +alpha]</text>
      <line x1="30" y1="85" x2="305" y2="85" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="167" cy="85" r="5" fill="#fbbf24"/>
      <text x="167" y="105" fill="#fbbf24" font-size="8" text-anchor="middle">0.0 (Zero Point Z = 0)</text>

      <!-- Downward Arrow -->
      <line x1="167" y1="115" x2="167" y2="145" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="167,145 162,137 172,137" fill="#38bdf8"/>
      <text x="180" y="135" fill="#38bdf8" font-size="8">Scale S = alpha / 127</text>

      <!-- Discrete INT8 Range -->
      <text x="30" y="170" fill="#cbd5e1" font-size="9">Discrete INT8: [-127, +127]</text>
      <rect x="30" y="185" width="275" height="20" fill="#1e293b" stroke="#38bdf8" rx="3"/>
      <text x="45" y="200" fill="#fb7185" font-size="8">-127</text>
      <text x="167" y="200" fill="#fbbf24" font-size="8" text-anchor="middle">0</text>
      <text x="290" y="200" fill="#34d399" font-size="8" text-anchor="end">+127</text>

      <text x="167" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Zero computational overhead during GEMM</text>
    </g>

    <!-- 2. Asymmetric Quantization (Arbitrary ZeroPoint Z) -->
    <g transform="translate(395, 25)">
      <rect width="335" height="255" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
      <text x="167" y="30" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">2. Asymmetric Quantization (UINT8)</text>
      
      <!-- FP32 Continuous Range (e.g. ReLU/Activations [0, beta]) -->
      <text x="30" y="65" fill="#cbd5e1" font-size="9">Continuous FP32: [min_val, max_val]</text>
      <line x1="30" y1="85" x2="305" y2="85" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="85" r="5" fill="#fbbf24"/>
      <text x="60" y="105" fill="#fbbf24" font-size="8">min (Mapped to Z)</text>

      <!-- Downward Arrow -->
      <line x1="167" y1="115" x2="167" y2="145" stroke="#10b981" stroke-width="2"/>
      <polygon points="167,145 162,137 172,137" fill="#10b981"/>
      <text x="180" y="135" fill="#10b981" font-size="8">S = (max - min) / 255</text>

      <!-- Discrete UINT8 Range -->
      <text x="30" y="170" fill="#cbd5e1" font-size="9">Discrete UINT8: [0, 255]</text>
      <rect x="30" y="185" width="275" height="20" fill="#1e293b" stroke="#10b981" rx="3"/>
      <text x="45" y="200" fill="#fbbf24" font-size="8">0</text>
      <text x="167" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">128</text>
      <text x="290" y="200" fill="#34d399" font-size="8" text-anchor="end">255</text>

      <text x="167" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Higher fidelity for skewed activation distributions</text>
    </g>
  </g>
</svg>
