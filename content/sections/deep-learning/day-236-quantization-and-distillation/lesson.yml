title: 'Quantization and Distillation'
section: deep-learning
subsection: sequence-models-and-transformers
week: 34
learning_promise: 'Master deep learning model compression and edge deployment: understand Quantization principles (Post-Training Quantization vs Quantization-Aware Training), implement linear integer quantization (scale S and zero-point Z), analyze modern LLM 4-bit algorithms (GPTQ, AWQ, GGUF, bitsandbytes NF4), derive Knowledge Distillation with temperature scaling and KL-divergence, and build a complete student distillation pipeline in PyTorch.'
objectives:
  - 'Derive linear symmetric and asymmetric quantization equations: q = clamp(round(x / S) + Z).'
  - 'Compare Post-Training Quantization (PTQ) with Quantization-Aware Training (QAT).'
  - 'Analyze sub-8-bit LLM quantization techniques: GPTQ second-order Hessian inverse, AWQ activation-aware scaling, and NF4 NormalFloat4.'
  - 'Formulate Knowledge Distillation loss combining soft-target KL-Divergence with hard cross-entropy: L = alpha * tau^2 * KL(p_tau || q_tau) + (1-alpha) * CE.'
  - 'Implement a PyTorch Teacher-Student distillation training loop.'
