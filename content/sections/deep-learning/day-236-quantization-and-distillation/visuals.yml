visuals:
  - id: quantization-symmetric-asymmetric-mapping
    file: assets/quantization-symmetric-asymmetric-mapping.svg
    type: diagram
    title: 'Quantization: Linear Symmetric vs. Asymmetric Mapping'
    alt: Quantization mapping diagram showing continuous FP32 range mapped to discrete INT8 scale and zero point
    description: 'Mathematical mapping from continuous 32-bit floating point tensors to discrete INT8/UINT8 integer representations.'
  - id: knowledge-distillation-teacher-student-architecture
    file: assets/knowledge-distillation-teacher-student-architecture.svg
    type: diagram
    title: 'Knowledge Distillation: Teacher-Student Logit Matching'
    alt: Knowledge Distillation teacher student architecture showing soft probability logit matching with temperature tau and ground truth cross entropy
    description: 'Knowledge distillation workflow transferring dark knowledge from a large teacher to a lightweight student via temperature-scaled soft targets.'
  - id: compression-idea
    file: assets/compression-idea.svg
    type: diagram
    title: 'Three ways to make a model smaller'
    alt: 'Diagram: the three families of model compression'
    description: 'A three-stage description of model compression covering quantisation, distillation and sparsity.'
  - id: quant-math
    file: assets/quant-math.svg
    type: diagram
    title: 'How quantisation works'
    alt: 'Diagram: how floating point weights are mapped to integers and back'
    description: 'A four-stage description of linear quantisation covering the value range, the scale factor, integer storage and dequantisation.'
  - id: ptq-qat
    file: assets/ptq-qat.svg
    type: diagram
    title: 'Quantise after, or during'
    alt: 'Diagram: post-training quantisation compared with quantisation-aware training'
    description: 'A two-column comparison of quantising a trained model against training with quantisation simulated.'
  - id: outliers
    file: assets/outliers.svg
    type: diagram
    title: 'The outlier problem'
    alt: 'Diagram: how activation outliers degrade quantisation and how scaling mitigates them'
    description: 'A four-stage description of the activation outlier problem covering the distribution, the outliers, their effect on scale and the migration remedy.'
  - id: qlora
    file: assets/qlora.svg
    type: diagram
    title: 'Fine-tuning a quantised model'
    alt: 'Diagram: how adapters are trained on top of a four-bit frozen base model'
    description: 'A four-stage description of quantised fine-tuning covering the four-bit base, frozen weights, full-precision adapters and the memory result.'
  - id: photo-compression
    file: assets/photo-compression.svg
    type: diagram
    title: 'Compressing a photograph'
    alt: 'Diagram: lossless storage compared with perceptually lossy compression'
    description: 'A two-column comparison of uncompressed image storage against lossy compression.'
  - id: compression-implications
    file: assets/compression-implications.svg
    type: diagram
    title: 'Four consequences of compression'
    alt: 'Diagram: the cost, reach, accuracy and safety implications of model compression'
    description: 'A four-stage description of compression implications covering serving cost, deployment reach, measured accuracy loss and behaviour changes.'
  - id: compression-when
    file: assets/compression-when.svg
    type: diagram
    title: 'When to compress'
    alt: 'Diagram: when model compression is worthwhile and when it is premature'
    description: 'A two-column comparison of situations favouring compression against those where it should be deferred.'
  - id: compression-history
    file: assets/compression-history.svg
    type: diagram
    title: 'Four steps to model compression'
    alt: 'Diagram: the historical progression of neural network compression techniques'
    description: 'A four-stage description of compression history covering early pruning, distillation, eight-bit deployment and sub-four-bit language models.'
  - id: quant-vs-distill
    file: assets/quant-vs-distill.svg
    type: diagram
    title: 'Quantisation against distillation'
    alt: 'Diagram: quantisation compared with distillation as compression strategies'
    description: 'A two-column comparison of reducing weight precision against training a smaller model.'
