terms:
  - term: 'Quantization'
    definition: 'Mapping continuous 32-bit or 16-bit floating-point weights and activations to low-bitwidth discrete integer representations (INT8, INT4).'
  - term: 'Knowledge Distillation'
    definition: 'A compression technique where a compact student neural network is trained to reproduce the softened probability distributions of a large teacher model.'
  - term: 'Temperature Scaling (tau)'
    definition: 'Dividing raw logits by a scalar temperature tau before Softmax to soften probability distributions and reveal relative class similarities.'
  - term: 'Post-Training Quantization (PTQ)'
    definition: 'Quantizing model parameters after training without fine-tuning weights.'
  - term: 'Quantization-Aware Training (QAT)'
    definition: 'Simulating discrete integer rounding errors during training using the Straight-Through Estimator (STE).'
  - term: 'GPTQ'
    definition: 'A second-order post-training quantization algorithm utilizing inverse Hessian matrix updates to compress LLM weights to 4 bits with near-zero perplexity loss.'
  - term: 'AWQ (Activation-aware Weight Quantization)'
    definition: 'A 4-bit quantization method that protects salient weight channels associated with high-magnitude activation outliers.'
  - term: 'NormalFloat4 (NF4)'
    definition: 'An information-theoretically optimal 4-bit quantile data type for zero-mean, unit-variance normally distributed neural network weights.'
