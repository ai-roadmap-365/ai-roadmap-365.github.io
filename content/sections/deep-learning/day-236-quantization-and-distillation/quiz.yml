questions:
  - question: 'What is the mathematical definition of the scale factor S in symmetric INT8 quantization across range [-alpha, +alpha]?'
    options:
      - 'S = alpha / 127 (mapping the dynamic range [-alpha, +alpha] linearly to the discrete integer range [-127, +127] with ZeroPoint Z = 0)'
      - 'S = alpha * 127'
      - 'S = 255 / alpha'
      - 'S = alpha^2'
    answer_index: 0
    explanation: 'In symmetric quantization, scale S = max(|x|) / 127 maps the dynamic range centered at zero.'
  - question: 'What is "Dark Knowledge" in Hinton et al. Knowledge Distillation?'
    options:
      - 'The subtle relative probability ratios between incorrect non-target classes in the soft logit distribution (e.g. recognizing that an image of a BMW is 10^-3 likely to be a garbage truck but 10^-1 likely to be an Audi), which reveal the semantic manifold learned by the teacher'
      - 'Encrypted passwords in model weights'
      - 'Data that was deleted from the training set'
      - 'Unlabeled text scraped from the dark web'
    answer_index: 0
    explanation: 'Softened non-target logits reveal semantic class similarities and structural geometry learned by the teacher.'
  - question: 'Why is the KL-divergence distillation loss multiplied by tau^2 (temperature squared) during student training?'
    options:
      - 'Because dividing logits by tau during softmax scales the gradients by 1/tau^2; multiplying the loss by tau^2 restores gradient magnitudes to match the scale of the standard cross-entropy loss'
      - 'Because tau^2 makes the model run 2x faster'
      - 'Because temperatures must always be positive'
      - 'Because Hinton preferred square numbers'
    answer_index: 0
    explanation: 'Multiplying by tau^2 compensates for the 1/tau^2 gradient attenuation introduced by temperature softening.'
  - question: 'How does Activation-aware Weight Quantization (AWQ / Lin et al., 2023) protect LLM accuracy at 4-bit precision?'
    options:
      - 'It observes that only 1% of weight channels are salient (those multiplied by high-magnitude activation outliers) and protects them from quantization error by applying per-channel scale factors before quantization'
      - 'It deletes all activation layers'
      - 'It rounds all numbers to the nearest power of 2'
      - 'It trains a separate model for every token'
    answer_index: 0
    explanation: 'AWQ selectively protects the 1% most salient weight channels corresponding to high-magnitude activation outliers.'
  - question: 'What is the difference between Post-Training Quantization (PTQ) and Quantization-Aware Training (QAT)?'
    options:
      - 'PTQ quantizes an already-trained model directly without retraining; QAT simulates quantization noise during training using the Straight-Through Estimator (STE), allowing the network to adapt its weights to discrete rounding errors'
      - 'PTQ is for text; QAT is for images'
      - 'QAT deletes the optimizer'
      - 'PTQ requires 1,000 GPUs'
    answer_index: 0
    explanation: 'QAT models quantization noise during backpropagation, yielding superior accuracy at ultra-low bit widths.'
