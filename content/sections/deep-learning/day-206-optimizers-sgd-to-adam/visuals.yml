visuals:
  - id: optimizer-loss-landscape-trajectories
    file: assets/optimizer-loss-landscape-trajectories.svg
    type: diagram
    title: Deep Learning Optimizer Trajectories across Loss Landscapes
    alt: Optimization trajectories on a non-convex loss surface showing SGD oscillations Momentum acceleration RMSprop adaptive scaling and AdamW convergence
    description: Comparative trajectory map contrasting the severe ravines oscillations of vanilla SGD against the inertia-smoothed path of Momentum, the coordinate scaling of RMSprop, and the direct convergence of AdamW.
  - id: adamw-mathematical-update-engine
    file: assets/adamw-mathematical-update-engine.svg
    type: diagram
    title: AdamW Mathematical Update Engine and Decoupled Weight Decay
    alt: AdamW optimizer mathematical update pipeline showing first moment estimation second uncentered moment calculation bias corrections and decoupled weight decay step
    description: Step-by-step mathematical decomposition of the AdamW optimizer illustrating exponentially decaying first and second moment accumulation, initial time-step bias corrections, and decoupled weight decay regularization.
  - id: optimiser-evolution
    file: assets/optimiser-evolution.svg
    type: diagram
    title: 'Four optimisers, one lineage'
    alt: 'Diagram: the progression from vanilla SGD to AdamW'
    description: 'A four-stage progression of optimisers from stochastic gradient descent through momentum and adaptive scaling to decoupled weight decay.'
  - id: first-or-second-order
    file: assets/first-or-second-order.svg
    type: diagram
    title: 'First-order, deliberately'
    alt: 'Diagram: first-order optimisers compared with second-order methods'
    description: 'A two-column comparison of first-order gradient methods against second-order curvature methods for large models.'
  - id: adam-mechanics
    file: assets/adam-mechanics.svg
    type: diagram
    title: 'How Adam works'
    alt: 'Diagram: the four steps of an Adam optimiser update'
    description: 'A four-stage description of the Adam update covering the first moment, second moment, bias correction and the parameter step.'
  - id: adam-or-adamw
    file: assets/adam-or-adamw.svg
    type: diagram
    title: 'Why AdamW replaced Adam'
    alt: 'Diagram: L2 regularisation inside the gradient compared with decoupled weight decay'
    description: 'A two-column comparison of adding an L2 penalty to the loss against applying weight decay directly to the parameters.'
  - id: nesterov
    file: assets/nesterov.svg
    type: diagram
    title: 'Nesterov''s look-ahead'
    alt: 'Diagram: standard momentum compared with Nesterov look-ahead momentum'
    description: 'A three-stage description of Nesterov acceleration covering the standard gradient location, the look-ahead position and the braking effect.'
  - id: param-groups
    file: assets/param-groups.svg
    type: diagram
    title: 'Not every parameter wants decay'
    alt: 'Diagram: parameter groups with different weight decay settings'
    description: 'A three-stage description of parameter group isolation covering weight matrices, biases and normalisation parameters.'
  - id: sailboat
    file: assets/sailboat.svg
    type: diagram
    title: 'Sailing across an ocean'
    alt: 'Diagram: fixed-heading sailing compared with adaptive course correction'
    description: 'A two-column comparison of holding a fixed heading against adapting to conditions, as an analogy for optimiser adaptivity.'
  - id: optimiser-implications
    file: assets/optimiser-implications.svg
    type: diagram
    title: 'Four consequences of optimiser choice'
    alt: 'Diagram: the memory, tuning, stability and default implications of optimiser choice'
    description: 'A four-stage description of optimiser implications covering state memory, hyperparameter sensitivity, numerical stability and domain defaults.'
  - id: optimiser-when
    file: assets/optimiser-when.svg
    type: diagram
    title: 'Choosing an optimiser'
    alt: 'Diagram: when to choose SGD with momentum and when to choose AdamW'
    description: 'A two-column comparison of momentum SGD against AdamW by domain and constraint.'
  - id: sgd-failures
    file: assets/sgd-failures.svg
    type: diagram
    title: 'Three failures plain descent has'
    alt: 'Diagram: the three failure modes of plain gradient descent and their remedies'
    description: 'A three-stage description of gradient descent failures covering ravine oscillation, uniform step size and saddle plateaus.'
