visuals:
  - id: optimizer-loss-landscape-trajectories
    file: assets/optimizer-loss-landscape-trajectories.svg
    type: diagram
    title: Deep Learning Optimizer Trajectories across Loss Landscapes
    alt: Optimization trajectories on a non-convex loss surface showing SGD oscillations Momentum acceleration RMSprop adaptive scaling and AdamW convergence
    description: Comparative trajectory map contrasting the severe ravines oscillations of vanilla SGD against the inertia-smoothed path of Momentum, the coordinate scaling of RMSprop, and the direct convergence of AdamW.
  - id: adamw-mathematical-update-engine
    file: assets/adamw-mathematical-update-engine.svg
    type: diagram
    title: AdamW Mathematical Update Engine and Decoupled Weight Decay
    alt: AdamW optimizer mathematical update pipeline showing first moment estimation second uncentered moment calculation bias corrections and decoupled weight decay step
    description: Step-by-step mathematical decomposition of the AdamW optimizer illustrating exponentially decaying first and second moment accumulation, initial time-step bias corrections, and decoupled weight decay regularization.
