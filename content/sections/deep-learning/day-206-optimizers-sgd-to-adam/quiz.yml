questions:
  - question: 'What fundamental flaw in standard Adam was identified and resolved by Ilya Loshchilov and Frank Hutter in their AdamW paper?'
    options:
      - 'Standard Adam combined L2 regularization into the gradient before computing the second moment v_t, which caused weights with large historical gradients to experience less weight decay than weights with small gradients; AdamW decouples weight decay by subtracting it directly from weights'
      - 'Standard Adam forgot to compute gradients'
      - 'Standard Adam only worked on CPU'
      - 'Standard Adam had no learning rate parameter'
    answer_index: 0
    explanation: 'L2 regularization in Adam adds lambda * theta into g_t, which gets scaled down by 1 / sqrt(v_t), breaking the regularization effect. AdamW decouples weight decay so it acts as true L2 regularization.'
  - question: 'Why does the Adam optimizer apply bias corrections m_hat = m_t / (1 - beta1^t) and v_hat = v_t / (1 - beta2^t) during the initial training steps (t = 1, 2, ...)?'
    options:
      - 'Because m_0 and v_0 are initialized to zero vectors, which biases the exponential moving averages towards zero during early time steps; dividing by (1 - beta^t) corrects this initialization bias'
      - 'To prevent division by zero'
      - 'To accelerate GPU memory bandwidth'
      - 'To convert float32 to float16'
    answer_index: 0
    explanation: 'At t=1, m_1 = (1-beta1)*g_1. Since beta1=0.9, m_1 is only 0.1 * g_1. The factor 1/(1-0.9^1) = 10 scales it back to the true gradient scale g_1.'
  - question: 'In torch.optim.AdamW, what are the standard default values for beta1, beta2, and epsilon?'
    options:
      - 'beta1 = 0.9, beta2 = 0.999, eps = 1e-8'
      - 'beta1 = 0.5, beta2 = 0.5, eps = 1.0'
      - 'beta1 = 0.0, beta2 = 0.0, eps = 0.0'
      - 'beta1 = 0.99, beta2 = 0.99, eps = 1e-2'
    answer_index: 0
    explanation: 'beta1=0.9 tracks the first moment (momentum), beta2=0.999 tracks uncentered variance over ~1000 steps, and eps=1e-8 prevents division by zero.'
  - question: 'What is the primary operational advantage of SGD with Momentum over Vanilla SGD when traversing long narrow ravines on a loss surface?'
    options:
      - 'Momentum accumulates velocity along the consistent downward direction of the ravine floor while canceling out high-frequency oscillating gradients along the steep ravine walls'
      - 'Momentum doubles the batch size automatically'
      - 'Momentum eliminates the need for a backward pass'
      - 'Momentum prevents model overfitting completely'
    answer_index: 0
    explanation: 'In ravines, orthogonal oscillating gradients cancel out over time in the velocity buffer, while consistent longitudinal gradients build momentum.'
  - question: 'Why is it common practice to exclude 1D parameters (such as LayerNorm/BatchNorm weights and linear layer biases) from weight decay in AdamW?'
    options:
      - 'Biases and normalization scale/shift parameters do not contribute to model capacity overfitting in the same way high-dimensional weight matrices do; shrinking them towards zero harms model calibration'
      - 'Because PyTorch raises an error if biases are regularized'
      - 'To make training faster'
      - 'Because biases are already zero'
    answer_index: 0
    explanation: 'Regularizing 1D biases and scale parameters leads to underfitting without providing meaningful capacity reduction. Pytorch parameter groups allow selective weight decay.'
