terms:
  - term: 'Polyak Momentum'
    definition: 'An optimization technique that adds an exponentially decaying moving average of past gradients to the parameter update vector.'
  - term: 'AdaGrad'
    definition: 'An adaptive gradient algorithm that scales the learning rate inversely proportional to the square root of the sum of all historical squared gradients.'
  - term: 'RMSprop'
    definition: 'An adaptive learning rate algorithm that replaces AdaGrad monotonic sum with an exponentially decaying moving average of squared gradients.'
  - term: 'Adam'
    definition: 'Adaptive Moment Estimation combining first-moment momentum with second-moment RMSprop curvature scaling and initialization bias corrections.'
  - term: 'AdamW'
    definition: 'A formulation of Adam that decouples weight decay from the gradient update, applying true L2 penalty directly to parameter weights.'
  - term: 'Decoupled Weight Decay'
    definition: 'Subtracting a fraction of the current weight value directly during parameter updates, independent of the adaptive gradient scale.'
  - term: 'Bias Correction'
    definition: 'Dividing first and second moment buffers by (1 - beta^t) to counteract the zero-initialization bias during early training steps.'
  - term: 'Parameter Groups'
    definition: 'A PyTorch optimizer feature allowing different learning rates, weight decays, and hyperparameters for distinct subsets of model parameters.'
