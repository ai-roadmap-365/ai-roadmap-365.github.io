<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Evaluate where momentum is taking you.">
  <title>Nesterov's look-ahead</title>
  <style>
    .nesterov-bg   { fill: #f8fafc; }
    .nesterov-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nesterov-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nesterov-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nesterov-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nesterov-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nesterov-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nesterov-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nesterov-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nesterov-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nesterov-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nesterov-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nesterov-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nesterov-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nesterov-stage { opacity: 1; }

    .nesterov-s0 { animation-delay: 0.00s; }
    .nesterov-e0 { animation-delay: 0.00s; }
    .nesterov-s1 { animation-delay: 1.50s; }
    .nesterov-e1 { animation-delay: 1.50s; }
    .nesterov-s2 { animation-delay: 3.00s; }
    .nesterov-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .nesterov-conn  { animation: nesterov-trace 6s ease-in-out infinite; }
      .nesterov-stage { animation: nesterov-arrive 6s ease-in-out infinite; }
    }
    @keyframes nesterov-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nesterov-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nesterov-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nesterov-stage { animation: nesterov-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nesterov-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nesterov-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nesterov-bg" width="980" height="322"/>
  <text class="nesterov-h1"  x="30" y="40">Nesterov's look-ahead</text>
  <text class="nesterov-sub" x="30" y="64">Evaluate where momentum is taking you.</text>
  <g class="nesterov-stage nesterov-s0">
    <rect class="nesterov-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="nesterov-step" x="44" y="142">01</text>
    <text class="nesterov-name" x="70" y="142">Standard momentum</text>
    <text class="nesterov-desc" x="44" y="166">Gradient at the current position, added to</text>
    <text class="nesterov-desc" x="44" y="182">existing velocity.</text>
  </g>
  <line class="nesterov-line nesterov-conn nesterov-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#nesterov-tip)"/>
  <g class="nesterov-stage nesterov-s1">
    <rect class="nesterov-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="nesterov-step" x="359" y="142">02</text>
    <text class="nesterov-name" x="385" y="142">Nesterov</text>
    <text class="nesterov-desc" x="359" y="166">Gradient at the position momentum will carry</text>
    <text class="nesterov-desc" x="359" y="182">you to.</text>
    <text class="nesterov-edge" x="359" y="242">look-ahead</text>
  </g>
  <line class="nesterov-line nesterov-conn nesterov-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#nesterov-tip)"/>
  <g class="nesterov-stage nesterov-s2">
    <rect class="nesterov-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="nesterov-step" x="674" y="142">03</text>
    <text class="nesterov-name" x="700" y="142">Which brakes before overshoot</text>
    <text class="nesterov-desc" x="674" y="166">Anticipatory rather than corrective, near a</text>
    <text class="nesterov-desc" x="674" y="182">steep minimum.</text>
  </g>
  <text class="nesterov-sub" x="30" y="304">The difference is small per step and compounds: standard momentum discovers the overshoot after making it, and Nesterov sees the slope ahead and reduces the step before arriving.</text>
</svg>
