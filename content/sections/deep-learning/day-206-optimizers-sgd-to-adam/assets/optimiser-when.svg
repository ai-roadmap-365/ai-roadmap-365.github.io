<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Domain, and a caveat.">
  <title>Choosing an optimiser</title>
  <style>
    .optimiser-when-bg   { fill: #f8fafc; }
    .optimiser-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimiser-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .optimiser-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .optimiser-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .optimiser-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .optimiser-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .optimiser-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimiser-when-row { opacity: 1; }
    .optimiser-when-r0 { animation-delay: 0.00s; }
    .optimiser-when-r1 { animation-delay: 0.45s; }
    .optimiser-when-r2 { animation-delay: 0.90s; }
    .optimiser-when-r3 { animation-delay: 1.35s; }
    .optimiser-when-r4 { animation-delay: 1.80s; }
    .optimiser-when-row { animation: optimiser-when-reveal 7.3s ease-in-out infinite; }
    @keyframes optimiser-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="optimiser-when-bg" width="980" height="390"/>
  <text class="optimiser-when-h1"  x="30" y="40">Choosing an optimiser</text>
  <text class="optimiser-when-sub" x="30" y="64">Domain, and a caveat.</text>
  <rect class="optimiser-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="optimiser-when-name" x="46" y="122">SGD with momentum</text>
  <text class="optimiser-when-desc" x="46" y="142">Vision, mostly.</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r0" x="46" y="182">Convolutional networks</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r1" x="46" y="216">Often better final accuracy</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r2" x="46" y="250">One state tensor, not two</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r3" x="46" y="284">Needs a learning rate schedule</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r4" x="46" y="318">And more careful tuning</text>
  <rect class="optimiser-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="optimiser-when-name" x="526" y="122">AdamW</text>
  <text class="optimiser-when-desc" x="526" y="142">Language, and defaults.</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r0" x="526" y="182">Transformers and language models</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r1" x="526" y="216">Robust across a wide rate range</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r2" x="526" y="250">Two state tensors — more memory</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r3" x="526" y="284">The reasonable first choice</text>
  <text class="optimiser-when-desc optimiser-when-row optimiser-when-r4" x="526" y="318">And the honest answer is empirical</text>
  <text class="optimiser-when-sub" x="30" y="372">No optimiser fixes bad data: unnormalised inputs, corrupted labels or a mis-specified loss will defeat every method here, and reaching for a different optimiser is a common way to avoid finding that out.</text>
</svg>
