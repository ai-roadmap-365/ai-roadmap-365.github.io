<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, and one correction.">
  <title>How Adam works</title>
  <style>
    .adam-mechanics-bg   { fill: #f8fafc; }
    .adam-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adam-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .adam-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .adam-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .adam-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .adam-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .adam-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .adam-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .adam-mechanics-stage { opacity: 1; }

    .adam-mechanics-s0 { animation-delay: 0.00s; }
    .adam-mechanics-e0 { animation-delay: 0.00s; }
    .adam-mechanics-s1 { animation-delay: 1.28s; }
    .adam-mechanics-e1 { animation-delay: 1.28s; }
    .adam-mechanics-s2 { animation-delay: 2.56s; }
    .adam-mechanics-e2 { animation-delay: 2.56s; }
    .adam-mechanics-s3 { animation-delay: 3.84s; }
    .adam-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .adam-mechanics-conn  { animation: adam-mechanics-trace 6.4s ease-in-out infinite; }
      .adam-mechanics-stage { animation: adam-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes adam-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes adam-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .adam-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .adam-mechanics-stage { animation: adam-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes adam-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="adam-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="adam-mechanics-bg" width="980" height="322"/>
  <text class="adam-mechanics-h1"  x="30" y="40">How Adam works</text>
  <text class="adam-mechanics-sub" x="30" y="64">Four steps, and one correction.</text>
  <g class="adam-mechanics-stage adam-mechanics-s0">
    <rect class="adam-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="adam-mechanics-step" x="44" y="142">01</text>
    <text class="adam-mechanics-name" x="70" y="142">First moment: a gradient average</text>
    <text class="adam-mechanics-desc" x="44" y="166">The direction, smoothed. This is</text>
    <text class="adam-mechanics-desc" x="44" y="182">momentum.</text>
  </g>
  <line class="adam-mechanics-line adam-mechanics-conn adam-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#adam-mechanics-tip)"/>
  <g class="adam-mechanics-stage adam-mechanics-s1">
    <rect class="adam-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="adam-mechanics-step" x="280" y="142">02</text>
    <text class="adam-mechanics-name" x="306" y="142">Second moment: a squared-gradient average</text>
    <text class="adam-mechanics-desc" x="280" y="166">The magnitude, per parameter.</text>
    <text class="adam-mechanics-desc" x="280" y="182">This is RMSprop.</text>
  </g>
  <line class="adam-mechanics-line adam-mechanics-conn adam-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#adam-mechanics-tip)"/>
  <g class="adam-mechanics-stage adam-mechanics-s2">
    <rect class="adam-mechanics-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="adam-mechanics-step" x="516" y="142">03</text>
    <text class="adam-mechanics-name" x="542" y="142">Bias correction</text>
    <text class="adam-mechanics-desc" x="516" y="166">Both start at zero, so early</text>
    <text class="adam-mechanics-desc" x="516" y="182">estimates are biased low. Divide</text>
    <text class="adam-mechanics-desc" x="516" y="198">by the decay factor.</text>
  </g>
  <line class="adam-mechanics-line adam-mechanics-conn adam-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#adam-mechanics-tip)"/>
  <g class="adam-mechanics-stage adam-mechanics-s3">
    <rect class="adam-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="adam-mechanics-step" x="752" y="142">04</text>
    <text class="adam-mechanics-name" x="778" y="142">Step: first over root second</text>
    <text class="adam-mechanics-desc" x="752" y="166">Direction scaled by inverse</text>
    <text class="adam-mechanics-desc" x="752" y="182">recent magnitude.</text>
  </g>
  <text class="adam-mechanics-sub" x="30" y="304">The bias correction is easy to dismiss and matters most in the first few dozen steps, which is exactly when a bad update can put the model somewhere it takes a long time to leave.</text>
</svg>
