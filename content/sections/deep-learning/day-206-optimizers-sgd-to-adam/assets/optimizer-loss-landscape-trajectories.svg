<svg role="img" aria-label="Optimization trajectories on a non-convex loss surface showing SGD oscillations Momentum acceleration RMSprop adaptive scaling and AdamW convergence" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Deep Learning Optimizer Trajectories across Loss Landscapes</title>
  <defs>
    <linearGradient id="bg206a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card206" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg206a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">OPTIMIZER LOSS LANDSCAPE TRAJECTORIES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Comparing Vanilla SGD, Momentum, RMSprop, and AdamW on Ravines and Saddles</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card206)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Contour background -->
    <ellipse cx="620" cy="145" rx="360" ry="125" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <ellipse cx="620" cy="145" rx="260" ry="85" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <ellipse cx="620" cy="145" rx="140" ry="45" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="620" cy="145" r="10" fill="#10b981"/>
    <text x="620" y="170" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Global Minimum</text>

    <!-- Start Point -->
    <circle cx="70" cy="70" r="8" fill="#f43f5e"/>
    <text x="70" y="55" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Start Point</text>

    <!-- Path 1: Vanilla SGD (Oscillating severely) -->
    <path d="M 70 70 L 120 220 L 180 80 L 230 210 L 290 90 L 340 190 L 390 110 L 430 170" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="230" y="235" fill="#fb7185" font-size="9" font-weight="700">Vanilla SGD: High Ravine Oscillation</text>

    <!-- Path 2: SGD Momentum (Dampened oscillations) -->
    <path d="M 70 70 Q 140 190, 240 120 T 420 135 T 560 142" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="320" y="75" fill="#fbbf24" font-size="9" font-weight="700">SGD + Momentum: Inertia Smooths Path</text>

    <!-- Path 3: RMSprop (Adapts coordinate scale) -->
    <path d="M 70 70 Q 180 110, 320 130 T 580 144" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="430" y="115" fill="#38bdf8" font-size="9" font-weight="700">RMSprop: Adaptive Coordinate Scaling</text>

    <!-- Path 4: AdamW (Fastest, Direct) -->
    <path d="M 70 70 C 180 85, 380 120, 615 145" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="470" y="185" fill="#34d399" font-size="10" font-weight="700">AdamW: Fast Direct Descent + Decoupled Weight Decay</text>
  </g>
</svg>
