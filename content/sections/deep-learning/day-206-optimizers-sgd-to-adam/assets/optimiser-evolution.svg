<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each fixes the last one's failure.">
  <title>Four optimisers, one lineage</title>
  <style>
    .optimiser-evolution-bg   { fill: #f8fafc; }
    .optimiser-evolution-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-evolution-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-evolution-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-evolution-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-evolution-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .optimiser-evolution-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .optimiser-evolution-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .optimiser-evolution-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .optimiser-evolution-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .optimiser-evolution-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .optimiser-evolution-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .optimiser-evolution-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .optimiser-evolution-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .optimiser-evolution-stage { opacity: 1; }

    .optimiser-evolution-s0 { animation-delay: 0.00s; }
    .optimiser-evolution-e0 { animation-delay: 0.00s; }
    .optimiser-evolution-s1 { animation-delay: 1.28s; }
    .optimiser-evolution-e1 { animation-delay: 1.28s; }
    .optimiser-evolution-s2 { animation-delay: 2.56s; }
    .optimiser-evolution-e2 { animation-delay: 2.56s; }
    .optimiser-evolution-s3 { animation-delay: 3.84s; }
    .optimiser-evolution-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .optimiser-evolution-conn  { animation: optimiser-evolution-trace 6.4s ease-in-out infinite; }
      .optimiser-evolution-stage { animation: optimiser-evolution-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes optimiser-evolution-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes optimiser-evolution-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .optimiser-evolution-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .optimiser-evolution-stage { animation: optimiser-evolution-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes optimiser-evolution-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="optimiser-evolution-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="optimiser-evolution-bg" width="980" height="322"/>
  <text class="optimiser-evolution-h1"  x="30" y="40">Four optimisers, one lineage</text>
  <text class="optimiser-evolution-sub" x="30" y="64">Each fixes the last one's failure.</text>
  <g class="optimiser-evolution-stage optimiser-evolution-s0">
    <rect class="optimiser-evolution-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-evolution-step" x="44" y="142">01</text>
    <text class="optimiser-evolution-name" x="70" y="142">SGD</text>
    <text class="optimiser-evolution-desc" x="44" y="166">Step against the gradient.</text>
    <text class="optimiser-evolution-desc" x="44" y="182">Simple, and oscillates in</text>
    <text class="optimiser-evolution-desc" x="44" y="198">ravines.</text>
  </g>
  <line class="optimiser-evolution-line optimiser-evolution-conn optimiser-evolution-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#optimiser-evolution-tip)"/>
  <g class="optimiser-evolution-stage optimiser-evolution-s1">
    <rect class="optimiser-evolution-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-evolution-step" x="280" y="142">02</text>
    <text class="optimiser-evolution-name" x="306" y="142">Momentum</text>
    <text class="optimiser-evolution-desc" x="280" y="166">An exponentially decaying</text>
    <text class="optimiser-evolution-desc" x="280" y="182">velocity. Damps oscillation,</text>
    <text class="optimiser-evolution-desc" x="280" y="198">carries through plateaus.</text>
    <text class="optimiser-evolution-edge" x="280" y="242">first moment</text>
  </g>
  <line class="optimiser-evolution-line optimiser-evolution-conn optimiser-evolution-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#optimiser-evolution-tip)"/>
  <g class="optimiser-evolution-stage optimiser-evolution-s2">
    <rect class="optimiser-evolution-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-evolution-step" x="516" y="142">03</text>
    <text class="optimiser-evolution-name" x="542" y="142">RMSprop</text>
    <text class="optimiser-evolution-desc" x="516" y="166">Scale each parameter's step by</text>
    <text class="optimiser-evolution-desc" x="516" y="182">its recent gradient magnitude.</text>
    <text class="optimiser-evolution-edge" x="516" y="242">second moment</text>
  </g>
  <line class="optimiser-evolution-line optimiser-evolution-conn optimiser-evolution-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#optimiser-evolution-tip)"/>
  <g class="optimiser-evolution-stage optimiser-evolution-s3">
    <rect class="optimiser-evolution-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="optimiser-evolution-step" x="752" y="142">04</text>
    <text class="optimiser-evolution-name" x="778" y="142">Adam, then AdamW</text>
    <text class="optimiser-evolution-desc" x="752" y="166">Both moments, bias-corrected —</text>
    <text class="optimiser-evolution-desc" x="752" y="182">and weight decay decoupled.</text>
  </g>
  <text class="optimiser-evolution-sub" x="30" y="304">Each step adds state per parameter, which is why the memory cost of training rises with the sophistication of the optimiser: Adam stores two extra values for every weight in the model.</text>
</svg>
