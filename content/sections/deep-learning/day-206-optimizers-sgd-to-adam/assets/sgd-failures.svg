<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each answered by one mechanism.">
  <title>Three failures plain descent has</title>
  <style>
    .sgd-failures-bg   { fill: #f8fafc; }
    .sgd-failures-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-failures-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-failures-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-failures-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-failures-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sgd-failures-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sgd-failures-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sgd-failures-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sgd-failures-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sgd-failures-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sgd-failures-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sgd-failures-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sgd-failures-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sgd-failures-stage { opacity: 1; }

    .sgd-failures-s0 { animation-delay: 0.00s; }
    .sgd-failures-e0 { animation-delay: 0.00s; }
    .sgd-failures-s1 { animation-delay: 1.50s; }
    .sgd-failures-e1 { animation-delay: 1.50s; }
    .sgd-failures-s2 { animation-delay: 3.00s; }
    .sgd-failures-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .sgd-failures-conn  { animation: sgd-failures-trace 6s ease-in-out infinite; }
      .sgd-failures-stage { animation: sgd-failures-arrive 6s ease-in-out infinite; }
    }
    @keyframes sgd-failures-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sgd-failures-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sgd-failures-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sgd-failures-stage { animation: sgd-failures-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sgd-failures-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sgd-failures-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sgd-failures-bg" width="980" height="322"/>
  <text class="sgd-failures-h1"  x="30" y="40">Three failures plain descent has</text>
  <text class="sgd-failures-sub" x="30" y="64">Each answered by one mechanism.</text>
  <g class="sgd-failures-stage sgd-failures-s0">
    <rect class="sgd-failures-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="sgd-failures-step" x="44" y="142">01</text>
    <text class="sgd-failures-name" x="70" y="142">Oscillation in ravines</text>
    <text class="sgd-failures-desc" x="44" y="166">Steepest descent points across the valley,</text>
    <text class="sgd-failures-desc" x="44" y="182">not along it.</text>
    <text class="sgd-failures-edge" x="44" y="242">momentum</text>
  </g>
  <line class="sgd-failures-line sgd-failures-conn sgd-failures-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#sgd-failures-tip)"/>
  <g class="sgd-failures-stage sgd-failures-s1">
    <rect class="sgd-failures-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="sgd-failures-step" x="359" y="142">02</text>
    <text class="sgd-failures-name" x="385" y="142">One step size for every parameter</text>
    <text class="sgd-failures-desc" x="359" y="166">Too large for some, too small for others,</text>
    <text class="sgd-failures-desc" x="359" y="182">simultaneously.</text>
    <text class="sgd-failures-edge" x="359" y="242">adaptivity</text>
  </g>
  <line class="sgd-failures-line sgd-failures-conn sgd-failures-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#sgd-failures-tip)"/>
  <g class="sgd-failures-stage sgd-failures-s2">
    <rect class="sgd-failures-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="sgd-failures-step" x="674" y="142">03</text>
    <text class="sgd-failures-name" x="700" y="142">Stalling on flat plateaus</text>
    <text class="sgd-failures-desc" x="674" y="166">A near-zero gradient produces a near-zero</text>
    <text class="sgd-failures-desc" x="674" y="182">step, indefinitely.</text>
    <text class="sgd-failures-edge" x="674" y="242">momentum</text>
  </g>
  <text class="sgd-failures-sub" x="30" y="304">The second failure is what adaptive methods address and the other two are what momentum addresses, which is why Adam combines both rather than choosing between them.</text>
</svg>
