<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="L2 and weight decay stopped being the same thing.">
  <title>Why AdamW replaced Adam</title>
  <style>
    .adam-or-adamw-bg   { fill: #f8fafc; }
    .adam-or-adamw-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-or-adamw-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-or-adamw-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-or-adamw-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-or-adamw-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .adam-or-adamw-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adam-or-adamw-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .adam-or-adamw-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .adam-or-adamw-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .adam-or-adamw-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .adam-or-adamw-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .adam-or-adamw-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .adam-or-adamw-row { opacity: 1; }
    .adam-or-adamw-r0 { animation-delay: 0.00s; }
    .adam-or-adamw-r1 { animation-delay: 0.45s; }
    .adam-or-adamw-r2 { animation-delay: 0.90s; }
    .adam-or-adamw-r3 { animation-delay: 1.35s; }
    .adam-or-adamw-r4 { animation-delay: 1.80s; }
    .adam-or-adamw-row { animation: adam-or-adamw-reveal 7.3s ease-in-out infinite; }
    @keyframes adam-or-adamw-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="adam-or-adamw-bg" width="980" height="390"/>
  <text class="adam-or-adamw-h1"  x="30" y="40">Why AdamW replaced Adam</text>
  <text class="adam-or-adamw-sub" x="30" y="64">L2 and weight decay stopped being the same thing.</text>
  <rect class="adam-or-adamw-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="adam-or-adamw-name" x="46" y="122">L2 in the loss</text>
  <text class="adam-or-adamw-desc" x="46" y="142">Adam's original form.</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r0" x="46" y="182">The penalty gradient joins the gradient</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r1" x="46" y="216">Then gets adaptively scaled</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r2" x="46" y="250">So parameters with large gradients decay less</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r3" x="46" y="284">Which is not what regularisation intended</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r4" x="46" y="318">Equivalent under plain SGD, and not under Adam</text>
  <rect class="adam-or-adamw-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="adam-or-adamw-name" x="526" y="122">Decoupled decay</text>
  <text class="adam-or-adamw-desc" x="526" y="142">AdamW.</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r0" x="526" y="182">Decay applied directly to the parameters</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r1" x="526" y="216">Outside the adaptive scaling</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r2" x="526" y="250">Every parameter decays at the same rate</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r3" x="526" y="284">Which is what was meant all along</text>
  <text class="adam-or-adamw-desc adam-or-adamw-row adam-or-adamw-r4" x="526" y="318">Consistently better in practice</text>
  <text class="adam-or-adamw-sub" x="30" y="372">This is an unusually clean example of a subtle bug persisting in a widely used tool: the two formulations are identical under SGD, which is why nobody noticed until adaptive methods became the default.</text>
</svg>
