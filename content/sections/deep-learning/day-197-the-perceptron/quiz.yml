questions:
  - question: 'What is the exact mathematical update rule for weights w_j in Rosenblatt Perceptron Learning Algorithm when a sample (x, y) is misclassified?'
    options:
      - 'w_j <- w_j + eta * (y - y_hat) * x_j'
      - 'w_j <- w_j * 2'
      - 'w_j <- (1 / x_j) + b'
      - 'w_j <- w_j - eta * (y + y_hat)'
    answer_index: 0
    explanation: 'If y = 1 and y_hat = 0 (false negative), the error is +1 and weights increase in the direction of x_j. If y = 0 and y_hat = 1 (false positive), the error is -1 and weights decrease.'
  - question: 'What does the Perceptron Convergence Theorem (Novikoff, 1962) formally guarantee?'
    options:
      - 'That the perceptron will converge on any dataset including XOR'
      - 'If separable by margin gamma, it converges in finite steps'
      - 'That training loss decreases by exactly 50% on every epoch'
      - 'That the learning rate eta must equal 1.0'
    answer_index: 1
    explanation: 'Novikoff theorem proves that for any linearly separable dataset bounded by radius R and margin gamma, the algorithm will find a separating hyperplane in finite iterations.'
  - question: 'Why did Marvin Minsky and Seymour Papert 1969 book Perceptrons trigger the first historic AI Winter?'
    options:
      - 'They demonstrated that Python was too slow for matrix math'
      - 'They proved that computers could never store floating point numbers'
      - 'A single layer cannot compute XOR'
      - 'They discovered that gradient descent was mathematically invalid'
    answer_index: 2
    explanation: 'Minsky and Papert proved the geometric limitation of single hyperplanes on non-linear parity (XOR), leading funding agencies to pull research grants until backpropagation revitalized multi-layer networks in 1986.'
  - question: 'How does adding a hidden layer (Multi-Layer Perceptron / MLP) resolve the XOR classification problem?'
    options:
      - 'Hidden layers convert floating point values to integers'
      - 'Hidden layers increase the CPU clock speed'
      - 'Hidden layers eliminate the need for weights'
      - 'Hidden units map XOR into a space where a plane separates it'
    answer_index: 3
    explanation: 'A hidden layer transforms the non-linear input manifold into an intermediate representation space where classes become linearly separable by the output neuron.'
  - question: 'What is the primary mathematical reason why the Heaviside Step Activation function f(z) = 1 if z >= 0 else 0 was replaced by Sigmoid and ReLU in modern deep learning?'
    options:
      - 'The step function''s derivative is zero everywhere'
      - 'The step function takes too much memory in GPU registers'
      - 'The step function cannot output positive numbers'
      - 'Scikit-learn cannot import step functions'
    answer_index: 0
    explanation: 'Because d(step)/dz = 0 almost everywhere, backpropagating error gradients through multiple hidden layers multiplies by zero, freezing weight updates entirely.'
