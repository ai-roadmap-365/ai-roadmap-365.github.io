<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A cutting board and four pieces of fruit.">
  <title>One straight chop</title>
  <style>
    .knife-analogy-bg   { fill: #f8fafc; }
    .knife-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knife-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knife-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knife-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knife-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knife-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knife-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .knife-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .knife-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .knife-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .knife-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .knife-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .knife-analogy-row { opacity: 1; }
    .knife-analogy-r0 { animation-delay: 0.00s; }
    .knife-analogy-r1 { animation-delay: 0.45s; }
    .knife-analogy-r2 { animation-delay: 0.90s; }
    .knife-analogy-r3 { animation-delay: 1.35s; }
    .knife-analogy-r4 { animation-delay: 1.80s; }
    .knife-analogy-row { animation: knife-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes knife-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="knife-analogy-bg" width="980" height="390"/>
  <text class="knife-analogy-h1"  x="30" y="40">One straight chop</text>
  <text class="knife-analogy-sub" x="30" y="64">A cutting board and four pieces of fruit.</text>
  <rect class="knife-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="knife-analogy-name" x="46" y="122">Apples left, limes right</text>
  <text class="knife-analogy-desc" x="46" y="142">One chop.</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r0" x="46" y="182">All apples on one side</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r1" x="46" y="216">All limes on the other</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r2" x="46" y="250">A single straight cut separates them</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r3" x="46" y="284">The angle barely matters</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r4" x="46" y="318">This is AND, or OR</text>
  <rect class="knife-analogy-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="knife-analogy-name" x="526" y="122">A checkerboard</text>
  <text class="knife-analogy-desc" x="526" y="142">No angle works.</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r0" x="526" y="182">Lime, apple, apple, lime</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r1" x="526" y="216">Diagonally opposite pairs</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r2" x="526" y="250">No single straight cut separates them</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r3" x="526" y="284">Try every angle — none works</text>
  <text class="knife-analogy-desc knife-analogy-row knife-analogy-r4" x="526" y="318">This is XOR</text>
  <text class="knife-analogy-sub" x="30" y="372">You cannot cut your way out of the second arrangement with one blade, and the multi-layer answer is equivalent to rearranging the board before cutting.</text>
</svg>
