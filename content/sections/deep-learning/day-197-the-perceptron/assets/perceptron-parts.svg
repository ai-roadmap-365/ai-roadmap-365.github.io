<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The atom every deep network is built from.">
  <title>Four parts, and that is all</title>
  <style>
    .perceptron-parts-bg   { fill: #f8fafc; }
    .perceptron-parts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-parts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-parts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-parts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-parts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .perceptron-parts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .perceptron-parts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .perceptron-parts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .perceptron-parts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .perceptron-parts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .perceptron-parts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .perceptron-parts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .perceptron-parts-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .perceptron-parts-stage { opacity: 1; }

    .perceptron-parts-s0 { animation-delay: 0.00s; }
    .perceptron-parts-e0 { animation-delay: 0.00s; }
    .perceptron-parts-s1 { animation-delay: 1.28s; }
    .perceptron-parts-e1 { animation-delay: 1.28s; }
    .perceptron-parts-s2 { animation-delay: 2.56s; }
    .perceptron-parts-e2 { animation-delay: 2.56s; }
    .perceptron-parts-s3 { animation-delay: 3.84s; }
    .perceptron-parts-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .perceptron-parts-conn  { animation: perceptron-parts-trace 6.4s ease-in-out infinite; }
      .perceptron-parts-stage { animation: perceptron-parts-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes perceptron-parts-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes perceptron-parts-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .perceptron-parts-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .perceptron-parts-stage { animation: perceptron-parts-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes perceptron-parts-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="perceptron-parts-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="perceptron-parts-bg" width="980" height="322"/>
  <text class="perceptron-parts-h1"  x="30" y="40">Four parts, and that is all</text>
  <text class="perceptron-parts-sub" x="30" y="64">The atom every deep network is built from.</text>
  <g class="perceptron-parts-stage perceptron-parts-s0">
    <rect class="perceptron-parts-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="perceptron-parts-step" x="44" y="142">01</text>
    <text class="perceptron-parts-name" x="70" y="142">Weighted inputs</text>
    <text class="perceptron-parts-desc" x="44" y="166">Each feature multiplied by a</text>
    <text class="perceptron-parts-desc" x="44" y="182">weight the model learns.</text>
  </g>
  <line class="perceptron-parts-line perceptron-parts-conn perceptron-parts-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#perceptron-parts-tip)"/>
  <g class="perceptron-parts-stage perceptron-parts-s1">
    <rect class="perceptron-parts-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="perceptron-parts-step" x="280" y="142">02</text>
    <text class="perceptron-parts-name" x="306" y="142">A bias</text>
    <text class="perceptron-parts-desc" x="280" y="166">One more learned number,</text>
    <text class="perceptron-parts-desc" x="280" y="182">shifting the threshold away from</text>
    <text class="perceptron-parts-desc" x="280" y="198">the origin.</text>
    <text class="perceptron-parts-edge" x="280" y="242">offset</text>
  </g>
  <line class="perceptron-parts-line perceptron-parts-conn perceptron-parts-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#perceptron-parts-tip)"/>
  <g class="perceptron-parts-stage perceptron-parts-s2">
    <rect class="perceptron-parts-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="perceptron-parts-step" x="516" y="142">03</text>
    <text class="perceptron-parts-name" x="542" y="142">A threshold</text>
    <text class="perceptron-parts-desc" x="516" y="166">Above zero, output one. Below,</text>
    <text class="perceptron-parts-desc" x="516" y="182">output zero.</text>
    <text class="perceptron-parts-edge" x="516" y="242">step</text>
  </g>
  <line class="perceptron-parts-line perceptron-parts-conn perceptron-parts-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#perceptron-parts-tip)"/>
  <g class="perceptron-parts-stage perceptron-parts-s3">
    <rect class="perceptron-parts-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="perceptron-parts-step" x="752" y="142">04</text>
    <text class="perceptron-parts-name" x="778" y="142">Which draws a hyperplane</text>
    <text class="perceptron-parts-desc" x="752" y="166">In D dimensions, a flat</text>
    <text class="perceptron-parts-desc" x="752" y="182">(D-1)-dimensional surface</text>
    <text class="perceptron-parts-desc" x="752" y="198">separating the classes.</text>
  </g>
  <text class="perceptron-parts-sub" x="30" y="304">The bias is what stops the boundary being forced through the origin, and it is the reason a perceptron with no bias cannot separate classes that are both on the same side of zero.</text>
</svg>
