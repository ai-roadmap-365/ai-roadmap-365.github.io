<svg role="img" aria-label="Geometric 2D decision boundary comparison showing linearly separable AND OR logic gates versus non linear XOR parity failure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Perceptron Linear Separability and the XOR Barrier</title>
  <defs>
    <linearGradient id="bg197b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gateCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg197b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LINEAR SEPARABILITY &amp; THE FAMOUS XOR BARRIER (MINSKY &amp; PAPERT, 1969)</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Why a Single Hyperplane Solves AND/OR Gates but Fails Completely on Non-Linear XOR</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#gateCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- AND Gate -->
    <rect x="25" y="25" width="220" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="135" y="50" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">AND Gate (Separable)</text>
    <circle cx="65" cy="200" r="8" fill="#ef4444"/> <text x="80" y="204" fill="#94a3b8" font-size="9">(0,0): 0</text>
    <circle cx="180" cy="200" r="8" fill="#ef4444"/> <text x="195" y="204" fill="#94a3b8" font-size="9">(1,0): 0</text>
    <circle cx="65" cy="100" r="8" fill="#ef4444"/> <text x="80" y="104" fill="#94a3b8" font-size="9">(0,1): 0</text>
    <circle cx="180" cy="100" r="8" fill="#10b981"/> <text x="195" y="104" fill="#34d399" font-size="9">(1,1): 1</text>
    <line x1="120" y1="70" x2="220" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="135" y="250" fill="#34d399" font-family="system-ui" font-size="9" text-anchor="middle">Single Line Separates</text>

    <!-- OR Gate -->
    <rect x="270" y="25" width="220" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="380" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">OR Gate (Separable)</text>
    <circle cx="310" cy="200" r="8" fill="#ef4444"/> <text x="325" y="204" fill="#94a3b8" font-size="9">(0,0): 0</text>
    <circle cx="425" cy="200" r="8" fill="#10b981"/> <text x="440" y="204" fill="#34d399" font-size="9">(1,0): 1</text>
    <circle cx="310" cy="100" r="8" fill="#10b981"/> <text x="325" y="104" fill="#34d399" font-size="9">(0,1): 1</text>
    <circle cx="425" cy="100" r="8" fill="#10b981"/> <text x="440" y="104" fill="#34d399" font-size="9">(1,1): 1</text>
    <line x1="285" y1="170" x2="385" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="380" y="250" fill="#38bdf8" font-family="system-ui" font-size="9" text-anchor="middle">Single Line Separates</text>

    <!-- XOR Gate -->
    <rect x="515" y="25" width="220" height="245" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="6"/>
    <text x="625" y="50" fill="#f87171" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">XOR Gate (Non-Separable)</text>
    <circle cx="555" cy="200" r="8" fill="#ef4444"/> <text x="570" y="204" fill="#94a3b8" font-size="9">(0,0): 0</text>
    <circle cx="670" cy="200" r="8" fill="#10b981"/> <text x="685" y="204" fill="#34d399" font-size="9">(1,0): 1</text>
    <circle cx="555" cy="100" r="8" fill="#10b981"/> <text x="570" y="104" fill="#34d399" font-size="9">(0,1): 1</text>
    <circle cx="670" cy="100" r="8" fill="#ef4444"/> <text x="685" y="104" fill="#94a3b8" font-size="9">(1,1): 0</text>
    <text x="625" y="160" fill="#ef4444" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">IMPOSSIBLE</text>
    <text x="625" y="178" fill="#fca5a5" font-family="system-ui" font-size="8" text-anchor="middle">No single line can separate</text>
    <text x="625" y="250" fill="#fca5a5" font-family="system-ui" font-size="9" text-anchor="middle">Requires Multi-Layer MLP</text>
  </g>
</svg>
