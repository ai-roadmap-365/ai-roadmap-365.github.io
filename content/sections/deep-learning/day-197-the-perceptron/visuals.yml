visuals:
  - id: rosenblatt-perceptron-architecture
    file: assets/rosenblatt-perceptron-architecture.svg
    type: diagram
    title: Rosenblatt Artificial Perceptron Model
    alt: Rosenblatt artificial perceptron architectural diagram showing input weights linear sum step activation function and binary output
    description: Architectural block diagram of Frank Rosenblatt's single-layer artificial neuron showing weighted inputs, bias sum, and Heaviside step activation.
  - id: linear-separability-xor-barrier
    file: assets/linear-separability-xor-barrier.svg
    type: diagram
    title: Perceptron Linear Separability and the XOR Barrier
    alt: Geometric 2D decision boundary comparison showing linearly separable AND OR logic gates versus non linear XOR parity failure
    description: Geometric proof comparing linearly separable boolean logic functions (AND, OR) against non-linear parity (XOR), detailing the single-layer perceptron limitation.
  - id: perceptron-parts
    file: assets/perceptron-parts.svg
    type: diagram
    title: 'Four parts, and that is all'
    alt: 'Diagram: the four components of a perceptron'
    description: 'A four-stage description of a perceptron covering weighted inputs, the bias, the threshold and the resulting decision boundary.'
  - id: perceptron-is-not
    file: assets/perceptron-is-not.svg
    type: diagram
    title: 'What a perceptron is and is not'
    alt: 'Diagram: the perceptron compared with a deep network and with logistic regression'
    description: 'A two-column comparison of what a perceptron is against what it is commonly confused with.'
  - id: neural-lineage
    file: assets/neural-lineage.svg
    type: diagram
    title: 'Five dates that made the field'
    alt: 'Diagram: the progression from the McCulloch-Pitts neuron to backpropagation'
    description: 'A five-stage progression of early neural network history from the threshold neuron through the perceptron, convergence proof, the XOR critique and backpropagation.'
  - id: learning-rule
    file: assets/learning-rule.svg
    type: diagram
    title: 'The update rule'
    alt: 'Diagram: the three cases of the perceptron update rule'
    description: 'A three-stage description of the perceptron learning rule covering correct classification, false negatives and false positives.'
  - id: convergence-bound
    file: assets/convergence-bound.svg
    type: diagram
    title: 'The convergence bound'
    alt: 'Diagram: the quantities that bound the perceptron''s convergence'
    description: 'A four-stage description of the convergence theorem covering separability, the margin, the input radius and the resulting bound.'
  - id: separable-or-not
    file: assets/separable-or-not.svg
    type: diagram
    title: 'Separable, or not'
    alt: 'Diagram: perceptron behaviour on separable and non-separable data'
    description: 'A two-column comparison of the perceptron''s behaviour on linearly separable data against non-separable data.'
  - id: xor-barrier
    file: assets/xor-barrier.svg
    type: diagram
    title: 'Why XOR breaks it'
    alt: 'Diagram: why AND and OR are linearly separable and XOR is not'
    description: 'A four-stage description of the XOR barrier covering AND, OR, XOR and the multi-layer solution.'
  - id: knife-analogy
    file: assets/knife-analogy.svg
    type: diagram
    title: 'One straight chop'
    alt: 'Diagram: separating fruit with one straight cut compared with a checkerboard arrangement'
    description: 'A two-column comparison of a separable and a non-separable arrangement of items on a cutting board.'
  - id: perceptron-implications
    file: assets/perceptron-implications.svg
    type: diagram
    title: 'Three properties worth knowing'
    alt: 'Diagram: the performance, interpretability and capacity properties of a perceptron'
    description: 'A three-stage description of perceptron properties covering computational cost, interpretability and representational limits.'
  - id: perceptron-when
    file: assets/perceptron-when.svg
    type: diagram
    title: 'Where a perceptron still fits'
    alt: 'Diagram: when a perceptron is appropriate and what replaces it'
    description: 'A two-column comparison of situations suiting a perceptron against situations requiring a different model.'
  - id: perceptron-to-deep
    file: assets/perceptron-to-deep.svg
    type: diagram
    title: 'From one unit to a network'
    alt: 'Diagram: the three changes that turn a perceptron into a trainable deep network'
    description: 'A three-stage description of the changes from a perceptron to a deep network covering stacking, smooth activations and gradient-based training.'
