terms:
  - term: 'Artificial Perceptron'
    definition: 'The simplest artificial neural network architecture: a single computational unit that computes a weighted sum of inputs and applies a threshold step function.'
  - term: 'Perceptron Learning Rule'
    definition: 'An iterative online optimization algorithm that updates weights proportional to the classification error and input feature values.'
  - term: 'Linear Separability'
    definition: 'A geometric property where two classes of data points can be completely divided in N-dimensional space by a single (N-1)-dimensional hyperplane.'
  - term: 'XOR Problem'
    definition: 'A classic non-linearly separable binary classification task where a single-layer perceptron fails to separate (0,0) and (1,1) from (0,1) and (1,0).'
  - term: 'Heaviside Step Function'
    definition: 'A discontinuous threshold function returning 1 for non-negative inputs and 0 for negative inputs.'
  - term: 'Perceptron Convergence Theorem'
    definition: 'A mathematical theorem proving that the perceptron learning algorithm will converge in finite steps if the data is linearly separable.'
  - term: 'Multi-Layer Perceptron (MLP)'
    definition: 'A feedforward artificial neural network consisting of an input layer, one or more hidden layers, and an output layer with non-linear activations.'
  - term: 'AI Winter'
    definition: 'A historical period of reduced funding and interest in artificial intelligence research, triggered in 1969 by Minsky and Papert analysis of perceptrons.'
