terms:
  - term: 'Transformer'
    definition: 'A neural architecture introduced by Vaswani et al. (2017) based entirely on self-attention mechanisms and feedforward networks.'
  - term: 'Self-Attention'
    definition: 'An attention mechanism relating different positions of a single sequence to compute a representation of the sequence.'
  - term: 'Scaled Dot-Product Attention'
    definition: 'An attention scoring function that computes softmax(Q K^T / sqrt(d_k)) V using scaled matrix multiplication.'
  - term: 'Query (Q)'
    definition: 'A representation of the current token seeking relevant context from other tokens in the sequence.'
  - term: 'Key (K)'
    definition: 'A representation of a token used to match against queries to determine relevance weights.'
  - term: 'Value (V)'
    definition: 'The actual semantic content representation that is weighted and aggregated based on query-key attention scores.'
  - term: 'Scaling Factor (1/sqrt(d_k))'
    definition: 'A normalization divisor that stabilizes the variance of dot products to 1.0, preventing softmax saturation.'
  - term: 'Maximum Path Length'
    definition: 'The maximum number of sequential operational steps information must traverse between any two positions in a network.'
