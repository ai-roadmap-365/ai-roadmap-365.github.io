week: 33
learning_promise: 'Master the foundational paper that sparked the modern generative AI revolution: understand why replacing recurrence with self-attention unlocked massive GPU parallelism, derive the mathematical formula for Scaled Dot-Product Attention, explain the variance-scaling factor 1/sqrt(d_k), and build a vectorized attention module from scratch in PyTorch.'
objectives:
  - 'Derive the fundamental computational bottleneck of recurrent networks that prevented large-scale pretraining.'
  - 'Derive the complete mathematical equation for Scaled Dot-Product Attention: Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V.'
  - 'Explain mathematically why scaling by 1/sqrt(d_k) is required to prevent vanishing gradients in high-dimensional softmax.'
  - 'Compare the theoretical computational complexity and maximum path length of Self-Attention vs Recurrence vs Convolutions.'
  - 'Implement a vectorized Scaled Dot-Product Attention layer in PyTorch supporting causal and padding masks.'
