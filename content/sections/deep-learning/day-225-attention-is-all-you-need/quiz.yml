questions:
  - question: 'What was the primary architectural breakthrough introduced in the 2017 paper "Attention Is All You Need" by Vaswani et al.?'
    options:
      - 'Eliminating recurrence and convolutions entirely, relying exclusively on multi-head self-attention mechanisms, which enabled massive parallel computation across entire sequences on GPUs'
      - 'Replacing floating point numbers with integers'
      - 'Inventing the sigmoid activation function'
      - 'Eliminating the need for training data'
    answer_index: 0
    explanation: 'By eliminating sequential recurrent loops, Transformers allow all tokens in a sequence to be processed in parallel via matrix multiplications on GPUs.'
  - question: 'Why is the dot-product Q K^T scaled by 1 / sqrt(d_k) in Scaled Dot-Product Attention?'
    options:
      - 'For large embedding dimensions d_k, the dot products grow large in magnitude, pushing the softmax function into regions with extremely small gradients; scaling by 1/sqrt(d_k) maintains unit variance and prevents vanishing gradients'
      - 'To make the output negative'
      - 'To convert the matrix into an integer'
      - 'To reduce the memory consumption by 50%'
    answer_index: 0
    explanation: 'Assuming independent components with zero mean and unit variance, the dot product has variance d_k; dividing by sqrt(d_k) stabilizes variance to 1.0.'
  - question: 'What is the "Maximum Path Length" between any two arbitrary tokens in a Transformer Self-Attention layer versus a Recurrent Neural Network (RNN)?'
    options:
      - 'O(1) in Self-Attention (direct pairwise dot product) versus O(N) in an RNN (information must traverse through N intermediate recurrent steps)'
      - 'O(N^2) in Self-Attention versus O(1) in an RNN'
      - 'O(log N) in both models'
      - 'Infinite in Self-Attention'
    answer_index: 0
    explanation: 'Self-attention connects every token directly to every other token in O(1) sequential operations, eliminating the long-range degradation of RNNs.'
  - question: 'In the equation Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V, what do the Query (Q), Key (K), and Value (V) matrices represent intuitively?'
    options:
      - 'Q is what a token is searching for, K is the index/identifier of what each token contains, and V is the actual substantive information/content to be extracted and aggregated'
      - 'Q is the loss function, K is the optimizer, and V is the dataset'
      - 'Q is the input sentence, K is the output translation, and V is the vocabulary'
      - 'Q, K, and V are identical copies of the learning rate'
    answer_index: 0
    explanation: 'Like a database lookup: Queries search against Keys to compute similarity weights, which are then used to retrieve a weighted mixture of Values.'
  - question: 'What is the primary computational drawback of standard full Self-Attention as sequence length N grows?'
    options:
      - 'Quadratic time and memory complexity O(N^2) in sequence length, making attention over sequences longer than 100,000 tokens computationally expensive without specialized optimizations'
      - 'It cannot run on NVIDIA GPUs'
      - 'It cannot process English words'
      - 'It causes gradient explosion on short sentences'
    answer_index: 0
    explanation: 'Computing the N x N attention matrix requires O(N^2) memory and compute, which becomes a bottleneck on ultra-long sequences.'
