visuals:
  - id: recurrent-vs-transformer-parallelism
    file: assets/recurrent-vs-transformer-parallelism.svg
    type: diagram
    title: 'Recurrent Sequential Processing vs. Transformer Parallel Matrix Execution'
    alt: Comparison of sequential recurrent neural network processing versus fully parallelized Transformer self-attention on GPUs
    description: 'Structural comparison illustrating how Transformers eliminate recurrent time-step bottlenecks to saturate parallel GPU matrix tensor cores.'
  - id: scaled-dot-product-attention-pipeline
    file: assets/scaled-dot-product-attention-pipeline.svg
    type: diagram
    title: 'Scaled Dot-Product Attention Pipeline'
    alt: Scaled Dot Product Attention computational graph showing matrix multiplication scaling masking softmax and value weighting
    description: 'Step-by-step computational graph of Vaswani et al. (2017) Scaled Dot-Product Attention from Query, Key, and Value matrices to output.'
  - id: qkv
    file: assets/qkv.svg
    type: diagram
    title: 'Queries, keys and values'
    alt: 'Diagram: the query, key and value roles in attention'
    description: 'A four-stage description of attention''s three projections covering the query, the key, the value and the soft lookup they perform together.'
  - id: attention-steps
    file: assets/attention-steps.svg
    type: diagram
    title: 'Four steps, two matrix multiplies'
    alt: 'Diagram: the four steps of scaled dot-product attention'
    description: 'A four-stage description of scaled dot-product attention covering the score matrix, scaling, softmax and the weighted value sum.'
  - id: why-scale
    file: assets/why-scale.svg
    type: diagram
    title: 'Why the scaling factor exists'
    alt: 'Diagram: attention scores with and without the scaling factor'
    description: 'A two-column comparison of unscaled and scaled attention scores and their effect on softmax gradients.'
  - id: masking
    file: assets/masking.svg
    type: diagram
    title: 'Two masks, one mechanism'
    alt: 'Diagram: padding masks and causal masks in attention'
    description: 'A four-stage description of attention masking covering padding masks, causal masks, the implementation and the architectural consequence.'
  - id: transformer-motivation
    file: assets/transformer-motivation.svg
    type: diagram
    title: 'Three problems attention solved'
    alt: 'Diagram: the three limitations of recurrent sequence models that attention removed'
    description: 'A three-stage description of the problems attention solved covering sequential computation, long-range dependencies and the fixed-size bottleneck.'
  - id: panel-discussion
    file: assets/panel-discussion.svg
    type: diagram
    title: 'A panel of experts'
    alt: 'Diagram: a sequential briefing chain compared with a panel where all participants hear each other'
    description: 'A two-column comparison of sequential information passing against simultaneous access.'
  - id: attention-cost
    file: assets/attention-cost.svg
    type: diagram
    title: 'The quadratic cost'
    alt: 'Diagram: how attention cost scales with sequence length'
    description: 'A four-stage description of attention''s cost scaling covering the score matrix, memory, the consequences for context length and the mitigations.'
  - id: attention-variants
    file: assets/attention-variants.svg
    type: diagram
    title: 'Full attention, or an approximation'
    alt: 'Diagram: full attention compared with efficient attention variants'
    description: 'A two-column comparison of exact attention against approximate and sparse variants.'
  - id: attention-when
    file: assets/attention-when.svg
    type: diagram
    title: 'Where attention belongs'
    alt: 'Diagram: when scaled dot-product attention is appropriate'
    description: 'A two-column comparison of workloads suited to attention against those where its memory profile rules it out.'
