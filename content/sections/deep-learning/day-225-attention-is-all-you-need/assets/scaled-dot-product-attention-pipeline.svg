<svg role="img" aria-label="Scaled Dot Product Attention computational graph showing matrix multiplication scaling masking softmax and value weighting" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Scaled Dot-Product Attention Pipeline</title>
  <defs>
    <linearGradient id="bg225b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card225b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg225b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SCALED DOT-PRODUCT ATTENTION PIPELINE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Attention(Q, K, V) = Softmax( (Q K^T) / √d_k ) V</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card225b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Inputs: Q, K, V at Bottom -->
    <rect x="100" y="225" width="100" height="45" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="150" y="248" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Query (Q)</text>
    <text x="150" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">(N × d_k)</text>

    <rect x="250" y="225" width="100" height="45" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="300" y="248" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Key (K)</text>
    <text x="300" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">(M × d_k)</text>

    <rect x="560" y="225" width="100" height="45" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="610" y="248" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Value (V)</text>
    <text x="610" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">(M × d_v)</text>

    <!-- Step 1: MatMul (Q * K^T) -->
    <rect x="175" y="150" width="150" height="40" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="250" y="175" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">MatMul (Q · K^T)</text>
    <line x1="150" y1="225" x2="210" y2="190" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="300" y1="225" x2="280" y2="190" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Step 2: Scale (1 / sqrt(d_k)) -->
    <rect x="175" y="90" width="150" height="35" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="250" y="112" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Scale (÷ √d_k)</text>
    <line x1="250" y1="150" x2="250" y2="125" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Step 3: Mask & Softmax -->
    <rect x="175" y="30" width="150" height="35" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="250" y="52" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Softmax (Weights α)</text>
    <line x1="250" y1="90" x2="250" y2="65" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Step 4: MatMul with V -->
    <rect x="420" y="30" width="160" height="40" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="500" y="55" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">MatMul (α · V)</text>
    <line x1="325" y1="48" x2="420" y2="48" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 610 225 L 610 50 L 580 50" stroke="#10b981" stroke-width="2" fill="none"/>

    <!-- Final Output -->
    <rect x="420" y="110" width="160" height="50" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="6"/>
    <text x="500" y="132" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Attention Output</text>
    <text x="500" y="148" fill="#f8fafc" font-size="9" text-anchor="middle">Shape: (N × d_v)</text>
    <line x1="500" y1="70" x2="500" y2="110" stroke="#fbbf24" stroke-width="2.5"/>
  </g>
</svg>
