<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which defines everything downstream.">
  <title>The quadratic cost</title>
  <style>
    .attention-cost-bg   { fill: #f8fafc; }
    .attention-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attention-cost-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attention-cost-stage { opacity: 1; }

    .attention-cost-s0 { animation-delay: 0.00s; }
    .attention-cost-e0 { animation-delay: 0.00s; }
    .attention-cost-s1 { animation-delay: 1.28s; }
    .attention-cost-e1 { animation-delay: 1.28s; }
    .attention-cost-s2 { animation-delay: 2.56s; }
    .attention-cost-e2 { animation-delay: 2.56s; }
    .attention-cost-s3 { animation-delay: 3.84s; }
    .attention-cost-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .attention-cost-conn  { animation: attention-cost-trace 6.4s ease-in-out infinite; }
      .attention-cost-stage { animation: attention-cost-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes attention-cost-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attention-cost-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attention-cost-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attention-cost-stage { animation: attention-cost-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attention-cost-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attention-cost-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attention-cost-bg" width="980" height="322"/>
  <text class="attention-cost-h1"  x="30" y="40">The quadratic cost</text>
  <text class="attention-cost-sub" x="30" y="64">Which defines everything downstream.</text>
  <g class="attention-cost-stage attention-cost-s0">
    <rect class="attention-cost-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="attention-cost-step" x="44" y="142">01</text>
    <text class="attention-cost-name" x="70" y="142">The score matrix is N by N</text>
    <text class="attention-cost-desc" x="44" y="166">Every position against every</text>
    <text class="attention-cost-desc" x="44" y="182">other.</text>
  </g>
  <line class="attention-cost-line attention-cost-conn attention-cost-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#attention-cost-tip)"/>
  <g class="attention-cost-stage attention-cost-s1">
    <rect class="attention-cost-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="attention-cost-step" x="280" y="142">02</text>
    <text class="attention-cost-name" x="306" y="142">So compute and memory are quadratic</text>
    <text class="attention-cost-desc" x="280" y="166">Doubling the sequence quadruples</text>
    <text class="attention-cost-desc" x="280" y="182">both.</text>
  </g>
  <line class="attention-cost-line attention-cost-conn attention-cost-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#attention-cost-tip)"/>
  <g class="attention-cost-stage attention-cost-s2">
    <rect class="attention-cost-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="attention-cost-step" x="516" y="142">03</text>
    <text class="attention-cost-name" x="542" y="142">Which is why context windows were small</text>
    <text class="attention-cost-desc" x="516" y="166">Memory, not capability, was the</text>
    <text class="attention-cost-desc" x="516" y="182">binding constraint.</text>
  </g>
  <line class="attention-cost-line attention-cost-conn attention-cost-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#attention-cost-tip)"/>
  <g class="attention-cost-stage attention-cost-s3">
    <rect class="attention-cost-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="attention-cost-step" x="752" y="142">04</text>
    <text class="attention-cost-name" x="778" y="142">Tiled implementations fixed the memory</text>
    <text class="attention-cost-desc" x="752" y="166">Never materialising the full</text>
    <text class="attention-cost-desc" x="752" y="182">matrix, without changing the</text>
    <text class="attention-cost-desc" x="752" y="198">result.</text>
  </g>
  <text class="attention-cost-sub" x="30" y="304">The tiled implementations are worth understanding as an engineering achievement rather than an approximation: they compute exactly the same output with linear memory, purely by reordering the computation.</text>
</svg>
