<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Exactness against scaling.">
  <title>Full attention, or an approximation</title>
  <style>
    .attention-variants-bg   { fill: #f8fafc; }
    .attention-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-variants-row { opacity: 1; }
    .attention-variants-r0 { animation-delay: 0.00s; }
    .attention-variants-r1 { animation-delay: 0.45s; }
    .attention-variants-r2 { animation-delay: 0.90s; }
    .attention-variants-r3 { animation-delay: 1.35s; }
    .attention-variants-r4 { animation-delay: 1.80s; }
    .attention-variants-row { animation: attention-variants-reveal 7.3s ease-in-out infinite; }
    @keyframes attention-variants-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="attention-variants-bg" width="980" height="390"/>
  <text class="attention-variants-h1"  x="30" y="40">Full attention, or an approximation</text>
  <text class="attention-variants-sub" x="30" y="64">Exactness against scaling.</text>
  <rect class="attention-variants-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="attention-variants-name" x="46" y="122">Full attention</text>
  <text class="attention-variants-desc" x="46" y="142">Exact.</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r0" x="46" y="182">Every position against every other</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r1" x="46" y="216">Quadratic compute and memory</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r2" x="46" y="250">Tiled implementations fix the memory</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r3" x="46" y="284">Standard for moderate context lengths</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r4" x="46" y="318">And what every published result assumes</text>
  <rect class="attention-variants-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="attention-variants-name" x="526" y="122">Approximations</text>
  <text class="attention-variants-desc" x="526" y="142">Sub-quadratic.</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r0" x="526" y="182">Sparse patterns: attend to a subset</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r1" x="526" y="216">Low-rank: approximate the score matrix</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r2" x="526" y="250">Linear: reorder to avoid forming it</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r3" x="526" y="284">Each loses something specific</text>
  <text class="attention-variants-desc attention-variants-row attention-variants-r4" x="526" y="318">Adoption has been limited</text>
  <text class="attention-variants-sub" x="30" y="372">Limited adoption is the honest summary: the approximations are mathematically sound and the exact version with a tiled implementation has proved fast enough that most systems keep it.</text>
</svg>
