<svg role="img" aria-label="Comparison of sequential recurrent neural network processing versus fully parallelized Transformer self-attention on GPUs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Recurrent Sequential Processing vs. Transformer Parallel Matrix Execution</title>
  <defs>
    <linearGradient id="bg225a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card225" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg225a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RECURRENCE VS. TRANSFORMER SELF-ATTENTION PARALLELISM</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Eliminating Sequential Dependencies Unlocked Massive GPU Hardware Acceleration</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card225)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Recurrent Processing (Sequential O(N)) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">1. Sequential Recurrence (RNN/LSTM)</text>
    <text x="195" y="68" fill="#94a3b8" font-size="9" text-anchor="middle">Sequential Path Length = O(N) Steps</text>
    
    <!-- Step t=1 -->
    <circle cx="75" cy="120" r="18" fill="#38bdf8"/>
    <text x="75" y="125" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">h_1</text>
    <text x="75" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">t = 1</text>

    <!-- Arrow t1 -> t2 -->
    <line x1="93" y1="120" x2="147" y2="120" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="120" y="112" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Wait!</text>

    <!-- Step t=2 -->
    <circle cx="165" cy="120" r="18" fill="#38bdf8"/>
    <text x="165" y="125" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">h_2</text>
    <text x="165" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">t = 2</text>

    <!-- Arrow t2 -> t3 -->
    <line x1="183" y1="120" x2="237" y2="120" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="210" y="112" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Wait!</text>

    <!-- Step t=3 -->
    <circle cx="255" cy="120" r="18" fill="#38bdf8"/>
    <text x="255" y="125" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">h_3</text>
    <text x="255" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">t = 3</text>

    <rect x="40" y="185" width="310" height="70" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="195" y="205" fill="#fecdd3" font-size="9" font-weight="700" text-anchor="middle">Sequential GPU Barrier</text>
    <text x="195" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">• Token 500 cannot execute until token 499 completes</text>
    <text x="195" y="238" fill="#cbd5e1" font-size="8" text-anchor="middle">• Thousands of GPU cores sit idle</text>

    <!-- Right: Transformer Self-Attention (Parallel O(1)) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">2. Transformer Self-Attention (Vaswani 2017)</text>
    <text x="565" y="68" fill="#94a3b8" font-size="9" text-anchor="middle">Sequential Path Length = O(1) Matrix Multiply</text>

    <!-- Parallel Tokens -->
    <rect x="420" y="95" width="60" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="450" y="120" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Token 1</text>

    <rect x="495" y="95" width="60" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="525" y="120" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Token 2</text>

    <rect x="570" y="95" width="60" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="600" y="120" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Token 3</text>

    <rect x="645" y="95" width="65" height="40" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="677" y="120" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Token N</text>

    <!-- Bi-directional All-to-All Arrows -->
    <path d="M 450 135 C 525 170, 600 170, 677 135" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <text x="565" y="175" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Full All-to-All Self-Attention Matrix (Q K^T)</text>

    <rect x="410" y="185" width="310" height="70" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="205" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">100% Parallel GPU Saturation</text>
    <text x="565" y="222" fill="#cbd5e1" font-size="8" text-anchor="middle">• All N tokens processed simultaneously in single GEMM kernel</text>
    <text x="565" y="238" fill="#cbd5e1" font-size="8" text-anchor="middle">• Direct O(1) connection between any pair of words</text>
  </g>
</svg>
