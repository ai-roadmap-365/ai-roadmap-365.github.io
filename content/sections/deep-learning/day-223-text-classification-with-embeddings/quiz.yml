questions:
  - question: 'Why is PyTorch nn.EmbeddingBag significantly faster and more memory-efficient than executing nn.Embedding followed by torch.mean()?'
    options:
      - 'nn.EmbeddingBag computes the reduction (sum, mean, or max) directly in a single fused C++ kernel without allocating a giant intermediate 3D tensor (Batch, Seq_Len, Dim) in GPU VRAM'
      - 'It quantizes weights to 1-bit integers'
      - 'It skips all embedding lookups'
      - 'It automatically downloads pre-trained weights from HuggingFace'
    answer_index: 0
    explanation: 'EmbeddingBag uses a fused kernel that computes the mean/sum reduction directly without instantiating the memory-heavy intermediate 3D embedding tensor.'
  - question: 'What is the purpose of using multiple parallel convolution filter sizes (e.g. k=3, 4, 5) in Yoon Kims TextCNN architecture?'
    options:
      - 'To simultaneously extract linguistic patterns across different n-gram resolutions: trigrams (k=3), 4-grams (k=4), and 5-grams (k=5) representing short phrases, idioms, and negation clauses'
      - 'To downsample the spatial resolution of text'
      - 'To colorize the text characters'
      - 'To eliminate the need for an embedding layer'
    answer_index: 0
    explanation: 'Different kernel heights correspond directly to different n-gram window sizes, capturing diverse phrase lengths in parallel.'
  - question: 'How does "1-Max-Pooling over Time" in TextCNN achieve variable-length sequence invariance?'
    options:
      - 'It extracts the single highest activation value across the entire temporal sequence for each feature map filter, collapsing variable-length feature maps into a fixed-length vector equal to the number of filters'
      - 'It averages all pixel values to zero'
      - 'It deletes all sentences shorter than 10 words'
      - 'It selects the last token in the document'
    answer_index: 0
    explanation: 'Global max-over-time pooling picks the most salient feature triggered anywhere in the sequence, producing a fixed-size vector regardless of input length.'
  - question: 'When fine-tuning a text classifier with pretrained GloVe embeddings, what is the recommended strategy for the embedding layer weights?'
    options:
      - 'Initialize with pretrained vectors, freeze the embedding layer for the first 2-3 warmup epochs to train the classifier head, then unfreeze with a lower learning rate for end-to-end domain fine-tuning'
      - 'Randomly re-initialize all embedding weights'
      - 'Keep embeddings frozen permanently under all circumstances'
      - 'Delete the vocabulary words not present in the target dataset'
    answer_index: 0
    explanation: 'Two-stage transfer learning (warmup head then unfreeze embeddings with differential learning rate) preserves pretrained semantics while adapting to domain jargon.'
  - question: 'Which document representation architecture is best suited for an ultra-low-latency production microservice requiring < 0.5 ms CPU response times?'
    options:
      - 'Neural Bag-of-Words / fastText (nn.EmbeddingBag)'
      - 'A 24-layer deep Bidirectional LSTM'
      - 'A 100-layer CNN'
      - 'An autoregressive GPT model'
    answer_index: 0
    explanation: 'EmbeddingBag requires only a single vector lookup and average, executing in sub-millisecond speeds on standard CPUs.'
