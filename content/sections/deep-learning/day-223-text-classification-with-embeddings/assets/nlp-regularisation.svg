<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three techniques specific to text.">
  <title>Regularising a text classifier</title>
  <style>
    .nlp-regularisation-bg   { fill: #f8fafc; }
    .nlp-regularisation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nlp-regularisation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nlp-regularisation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nlp-regularisation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nlp-regularisation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .nlp-regularisation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .nlp-regularisation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .nlp-regularisation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .nlp-regularisation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .nlp-regularisation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .nlp-regularisation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .nlp-regularisation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .nlp-regularisation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .nlp-regularisation-stage { opacity: 1; }

    .nlp-regularisation-s0 { animation-delay: 0.00s; }
    .nlp-regularisation-e0 { animation-delay: 0.00s; }
    .nlp-regularisation-s1 { animation-delay: 1.50s; }
    .nlp-regularisation-e1 { animation-delay: 1.50s; }
    .nlp-regularisation-s2 { animation-delay: 3.00s; }
    .nlp-regularisation-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .nlp-regularisation-conn  { animation: nlp-regularisation-trace 6s ease-in-out infinite; }
      .nlp-regularisation-stage { animation: nlp-regularisation-arrive 6s ease-in-out infinite; }
    }
    @keyframes nlp-regularisation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes nlp-regularisation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .nlp-regularisation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .nlp-regularisation-stage { animation: nlp-regularisation-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes nlp-regularisation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="nlp-regularisation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="nlp-regularisation-bg" width="980" height="322"/>
  <text class="nlp-regularisation-h1"  x="30" y="40">Regularising a text classifier</text>
  <text class="nlp-regularisation-sub" x="30" y="64">Three techniques specific to text.</text>
  <g class="nlp-regularisation-stage nlp-regularisation-s0">
    <rect class="nlp-regularisation-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="nlp-regularisation-step" x="44" y="142">01</text>
    <text class="nlp-regularisation-name" x="70" y="142">Embedding dropout</text>
    <text class="nlp-regularisation-desc" x="44" y="166">Drop whole embedding dimensions, not</text>
    <text class="nlp-regularisation-desc" x="44" y="182">individual values.</text>
  </g>
  <line class="nlp-regularisation-line nlp-regularisation-conn nlp-regularisation-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#nlp-regularisation-tip)"/>
  <g class="nlp-regularisation-stage nlp-regularisation-s1">
    <rect class="nlp-regularisation-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="nlp-regularisation-step" x="359" y="142">02</text>
    <text class="nlp-regularisation-name" x="385" y="142">Word dropout</text>
    <text class="nlp-regularisation-desc" x="359" y="166">Replace whole tokens with the unknown token,</text>
    <text class="nlp-regularisation-desc" x="359" y="182">so the model cannot rely on any one word.</text>
    <text class="nlp-regularisation-edge" x="359" y="242">robustness</text>
  </g>
  <line class="nlp-regularisation-line nlp-regularisation-conn nlp-regularisation-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#nlp-regularisation-tip)"/>
  <g class="nlp-regularisation-stage nlp-regularisation-s2">
    <rect class="nlp-regularisation-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="nlp-regularisation-step" x="674" y="142">03</text>
    <text class="nlp-regularisation-name" x="700" y="142">Freezing pretrained embeddings</text>
    <text class="nlp-regularisation-desc" x="674" y="166">On small datasets, fine-tuning them overfits</text>
    <text class="nlp-regularisation-desc" x="674" y="182">quickly.</text>
  </g>
  <text class="nlp-regularisation-sub" x="30" y="304">Word dropout is the most text-specific of these and it targets a real failure: a classifier that keys on one distinctive word breaks the moment a paraphrase omits it.</text>
</svg>
