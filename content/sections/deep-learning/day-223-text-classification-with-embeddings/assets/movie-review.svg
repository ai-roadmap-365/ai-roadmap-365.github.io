<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Impressions, phrases, or the whole arc.">
  <title>Assessing a film</title>
  <style>
    .movie-review-bg   { fill: #f8fafc; }
    .movie-review-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .movie-review-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .movie-review-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .movie-review-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .movie-review-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .movie-review-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .movie-review-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .movie-review-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .movie-review-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .movie-review-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .movie-review-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .movie-review-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .movie-review-row { opacity: 1; }
    .movie-review-r0 { animation-delay: 0.00s; }
    .movie-review-r1 { animation-delay: 0.45s; }
    .movie-review-r2 { animation-delay: 0.90s; }
    .movie-review-r3 { animation-delay: 1.35s; }
    .movie-review-r4 { animation-delay: 1.80s; }
    .movie-review-row { animation: movie-review-reveal 7.3s ease-in-out infinite; }
    @keyframes movie-review-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="movie-review-bg" width="980" height="390"/>
  <text class="movie-review-h1"  x="30" y="40">Assessing a film</text>
  <text class="movie-review-sub" x="30" y="64">Impressions, phrases, or the whole arc.</text>
  <rect class="movie-review-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="movie-review-name" x="46" y="122">Words and phrases</text>
  <text class="movie-review-desc" x="46" y="142">Order-free.</text>
  <text class="movie-review-desc movie-review-row movie-review-r0" x="46" y="182">"Gripping", "slow middle", "strong cast"</text>
  <text class="movie-review-desc movie-review-row movie-review-r1" x="46" y="216">Which phrases appeared, not where</text>
  <text class="movie-review-desc movie-review-row movie-review-r2" x="46" y="250">Enough to judge a recommendation</text>
  <text class="movie-review-desc movie-review-row movie-review-r3" x="46" y="284">Fast to form</text>
  <text class="movie-review-desc movie-review-row movie-review-r4" x="46" y="318">This is bag-of-embeddings, or a text CNN</text>
  <rect class="movie-review-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="movie-review-name" x="526" y="122">The narrative arc</text>
  <text class="movie-review-desc" x="526" y="142">Order matters.</text>
  <text class="movie-review-desc movie-review-row movie-review-r0" x="526" y="182">How the opinion develops across the review</text>
  <text class="movie-review-desc movie-review-row movie-review-r1" x="526" y="216">"Started badly but won me over"</text>
  <text class="movie-review-desc movie-review-row movie-review-r2" x="526" y="250">Order changes the conclusion</text>
  <text class="movie-review-desc movie-review-row movie-review-r3" x="526" y="284">Slower to process</text>
  <text class="movie-review-desc movie-review-row movie-review-r4" x="526" y="318">This is a recurrent model</text>
  <text class="movie-review-sub" x="30" y="372">The second column's example is the case that defeats order-free models: a review containing both praise and criticism has a conclusion determined entirely by which came last.</text>
</svg>
