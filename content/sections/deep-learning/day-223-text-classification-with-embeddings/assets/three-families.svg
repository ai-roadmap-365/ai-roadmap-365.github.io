<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="About what carries the signal.">
  <title>Three architectures, three assumptions</title>
  <style>
    .three-families-bg   { fill: #f8fafc; }
    .three-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-families-stage { opacity: 1; }

    .three-families-s0 { animation-delay: 0.00s; }
    .three-families-e0 { animation-delay: 0.00s; }
    .three-families-s1 { animation-delay: 1.50s; }
    .three-families-e1 { animation-delay: 1.50s; }
    .three-families-s2 { animation-delay: 3.00s; }
    .three-families-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-families-conn  { animation: three-families-trace 6s ease-in-out infinite; }
      .three-families-stage { animation: three-families-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-families-stage { animation: three-families-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-families-bg" width="980" height="322"/>
  <text class="three-families-h1"  x="30" y="40">Three architectures, three assumptions</text>
  <text class="three-families-sub" x="30" y="64">About what carries the signal.</text>
  <g class="three-families-stage three-families-s0">
    <rect class="three-families-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-families-step" x="44" y="142">01</text>
    <text class="three-families-name" x="70" y="142">Averaged embeddings</text>
    <text class="three-families-desc" x="44" y="166">Order does not matter. Just which words</text>
    <text class="three-families-desc" x="44" y="182">appeared.</text>
    <text class="three-families-edge" x="44" y="242">fastest</text>
  </g>
  <line class="three-families-line three-families-conn three-families-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-families-tip)"/>
  <g class="three-families-stage three-families-s1">
    <rect class="three-families-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-families-step" x="359" y="142">02</text>
    <text class="three-families-name" x="385" y="142">1D convolutions</text>
    <text class="three-families-desc" x="359" y="166">Local phrases matter. Detect n-grams anywhere</text>
    <text class="three-families-desc" x="359" y="182">in the text.</text>
  </g>
  <line class="three-families-line three-families-conn three-families-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-families-tip)"/>
  <g class="three-families-stage three-families-s2">
    <rect class="three-families-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-families-step" x="674" y="142">03</text>
    <text class="three-families-name" x="700" y="142">Recurrent with pooling</text>
    <text class="three-families-desc" x="674" y="166">Order and long-range structure matter.</text>
    <text class="three-families-edge" x="674" y="242">slowest</text>
  </g>
  <text class="three-families-sub" x="30" y="304">Each is an assumption about the task rather than a capability ranking, which is why the simplest often wins: for topic classification, word presence genuinely is most of the signal.</text>
</svg>
