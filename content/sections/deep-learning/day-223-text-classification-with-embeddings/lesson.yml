week: 32
learning_promise: 'Master the core deep learning architectures for text classification: build and benchmark Neural Bag-of-Words (EmbeddingBag), Yoon Kim 1D TextCNN with multi-scale filter banks, and Bidirectional LSTM pooling models, and fine-tune pretrained word embeddings in PyTorch.'
objectives:
  - 'Implement high-throughput document classification using PyTorch nn.EmbeddingBag with mean and sum pooling.'
  - 'Derive and build the Yoon Kim (2014) TextCNN architecture with multi-scale 1D convolutions (k=3, 4, 5) and global 1-max pooling.'
  - 'Implement Bidirectional LSTM classification with custom pooling strategies (mean, max, and final hidden state).'
  - 'Handle variable-length text batches with custom collate functions and dynamic padding.'
  - 'Benchmark accuracy, parameter count, and inference latency trade-offs across all three model families.'
