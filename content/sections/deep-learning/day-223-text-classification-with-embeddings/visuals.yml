visuals:
  - id: text-classification-architectures-comparison
    file: assets/text-classification-architectures-comparison.svg
    type: diagram
    title: 'Neural Text Classification Architecture Comparison'
    alt: Comparison of neural text classification architectures including EmbeddingBag average pooling TextCNN 1D convolutions and Bidirectional LSTM pooling
    description: 'Tradeoff comparison of EmbeddingBag average pooling, Yoon Kim TextCNN 1D convolutions, and Bidirectional LSTM sequence classification.'
  - id: textcnn-1d-convolution-mechanism
    file: assets/textcnn-1d-convolution-mechanism.svg
    type: diagram
    title: 'TextCNN (1D Convolution for Text) Mechanics'
    alt: Yoon Kim TextCNN 1D convolutional feature map extraction showing multiple parallel filter window sizes sliding over word embedding matrix
    description: 'Detailed computational flow of Yoon Kim (2014) TextCNN: multi-scale 1D convolution filter banks (k=2,3,4) followed by 1-max pooling over time.'
  - id: three-families
    file: assets/three-families.svg
    type: diagram
    title: 'Three architectures, three assumptions'
    alt: 'Diagram: the three neural text classification architectures and what each assumes'
    description: 'A three-stage description of text classification architectures covering averaged embeddings, convolutional phrase detection and recurrent sequence modelling.'
  - id: bow-or-neural
    file: assets/bow-or-neural.svg
    type: diagram
    title: 'Bag of words, or bag of embeddings'
    alt: 'Diagram: classical bag-of-words features compared with averaged embeddings'
    description: 'A two-column comparison of sparse count-based text features against averaged dense embeddings.'
  - id: textcnn
    file: assets/textcnn.svg
    type: diagram
    title: 'How a text CNN works'
    alt: 'Diagram: how one-dimensional convolution detects phrases in text'
    description: 'A four-stage description of TextCNN covering the embedding matrix, sliding filters, max pooling and the concatenated features.'
  - id: embeddingbag
    file: assets/embeddingbag.svg
    type: diagram
    title: 'Why a fused kernel matters'
    alt: 'Diagram: separate embedding lookup and pooling compared with a fused kernel'
    description: 'A four-stage description of fused embedding pooling covering the naive path, the intermediate tensor, the fused alternative and the resulting saving.'
  - id: imbalance
    file: assets/imbalance.svg
    type: diagram
    title: 'Classifying rare classes'
    alt: 'Diagram: how focal loss addresses extreme class imbalance'
    description: 'A four-stage description of imbalanced classification covering the base rate, the accuracy trap, class weighting and focal loss.'
  - id: movie-review
    file: assets/movie-review.svg
    type: diagram
    title: 'Assessing a film'
    alt: 'Diagram: three ways of summarising a film as an analogy for text classification architectures'
    description: 'A two-column comparison of summarising by impressions against summarising by narrative sequence.'
  - id: dynamic-padding
    file: assets/dynamic-padding.svg
    type: diagram
    title: 'Padding per batch'
    alt: 'Diagram: global padding compared with per-batch dynamic padding'
    description: 'A three-stage description of dynamic padding covering the global-maximum approach, per-batch padding and length bucketing.'
  - id: nlp-regularisation
    file: assets/nlp-regularisation.svg
    type: diagram
    title: 'Regularising a text classifier'
    alt: 'Diagram: three regularisation techniques for neural text classifiers'
    description: 'A three-stage description of NLP regularisation covering embedding dropout, word dropout and frozen embeddings.'
  - id: text-classifier-when
    file: assets/text-classifier-when.svg
    type: diagram
    title: 'Choosing a text classifier'
    alt: 'Diagram: choosing between lightweight and transformer text classifiers'
    description: 'A two-column comparison of lightweight neural classifiers against transformer-based ones.'
