terms:
  - term: 'EmbeddingBag'
    definition: 'A fused PyTorch module that computes the sum or mean of embedding bags directly without allocating intermediate 3D memory.'
  - term: 'TextCNN'
    definition: 'A deep learning architecture that applies parallel 1D convolutional filter banks over word embeddings followed by max-over-time pooling.'
  - term: '1-Max-Pooling over Time'
    definition: 'A global pooling operation that extracts the maximum activation along the temporal sequence dimension for each feature map channel.'
  - term: 'Neural Bag-of-Words (NBoW)'
    definition: 'A document classification model that averages dense word vectors across a text and passes the result through a linear classifier.'
  - term: 'Collate Function'
    definition: 'A custom DataLoader utility that dynamically batches and pads variable-length sequence tensors.'
  - term: 'BiLSTM Pooling'
    definition: 'Aggregating hidden states from forward and backward LSTM streams via mean pooling, max pooling, or attention pooling.'
  - term: 'Static vs Non-Static Embeddings'
    definition: 'Static embeddings remain frozen during training; non-static embeddings are fine-tuned via backpropagation gradients.'
  - term: 'Temporal Convolutions'
    definition: 'Convolutions where kernels slide exclusively across the time/sequence dimension while spanning the entire embedding channel dimension.'
