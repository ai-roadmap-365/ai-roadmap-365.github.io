learning_promise: 'Transition from pure NumPy to PyTorch: master multidimensional tensor operations, memory strides, contiguous views, device-agnostic execution (CPU/CUDA/MPS), and dynamic automatic differentiation with PyTorch Autograd.'
objectives:
  - 'Explain the architectural differences between NumPy ndarrays and PyTorch Tensors.'
  - 'Perform vectorized tensor transformations: creation, indexing, slicing, broadcasting, reshaping, and permutations.'
  - 'Master tensor memory contiguity and the distinction between view() and reshape().'
  - 'Write device-agnostic code running seamlessly on CPU, Apple Silicon MPS, and NVIDIA CUDA.'
  - 'Leverage PyTorch Autograd (requires_grad, backward, grad, torch.no_grad) for automatic differentiation.'
