terms:
  - term: 'PyTorch Tensor'
    definition: 'A multi-dimensional array with hardware acceleration support (CUDA/MPS) and automatic differentiation tracking via Autograd.'
  - term: 'Autograd'
    definition: 'PyTorch automatic differentiation engine that dynamically builds a directed acyclic computational graph during forward execution.'
  - term: 'Dynamic Computational Graph'
    definition: 'A graph structure built on-the-fly during forward execution, allowing dynamic control flow, loops, and variable tensor shapes.'
  - term: 'Strides'
    definition: 'The number of memory elements in flat 1D storage that must be stepped over to advance by one position along a given tensor dimension.'
  - term: 'Contiguous Memory'
    definition: 'A memory buffer where tensor elements along consecutive dimensions are stored sequentially without strides gaps.'
  - term: 'Device Agnosticism'
    definition: 'Writing code that dynamically selects and executes on available hardware (CPU, NVIDIA CUDA, Apple MPS) without platform hardcoding.'
  - term: 'requires_grad'
    definition: 'A boolean flag on PyTorch tensors instructing Autograd to record operations for backward gradient calculation.'
  - term: 'torch.no_grad()'
    definition: 'A context manager that disables Autograd graph construction to conserve memory and accelerate inference.'
