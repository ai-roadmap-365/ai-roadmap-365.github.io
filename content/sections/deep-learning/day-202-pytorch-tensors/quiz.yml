questions:
  - question: 'What is the key functional difference between PyTorch tensor.view() and tensor.reshape()?'
    options:
      - 'view() runs on GPU while reshape() runs on CPU'
      - 'view() only works on 1D arrays'
      - 'reshape() deletes the autograd computational graph'
      - 'view() needs contiguity; reshape() may copy'
    answer_index: 3
    explanation: 'view() operates strictly on contiguous memory without copying data. If a tensor has been transposed or permuted, view() throws a RuntimeError; reshape() safely falls back to cloning memory.'
  - question: 'What is the standard, best-practice device-agnostic idiom for selecting the fastest available hardware accelerator in modern PyTorch?'
    options:
      - 'torch.device("cuda" if available else "mps" else "cpu")'
      - 'device = "gpu"'
      - 'device = torch.set_default_device("fast")'
      - 'device = 0'
    answer_index: 0
    explanation: 'This idiom checks for NVIDIA CUDA first, Apple Silicon Metal Performance Shaders (MPS) second, and falls back to standard CPU gracefully on any machine.'
  - question: 'Why should forward evaluation during model validation or inference always be wrapped inside with torch.no_grad(): block?'
    options:
      - 'It prevents PyTorch from checking array shapes'
      - 'It stops graph recording, saving memory and time'
      - 'It converts all weights to 8-bit integers'
      - 'It automatically downloads pretrained weights'
    answer_index: 1
    explanation: 'torch.no_grad() prevents Autograd from allocating backward computational graph nodes and activation caches, saving up to 75% VRAM and accelerating inference.'
  - question: 'What does the tensor attribute .grad_fn represent in PyTorch Autograd?'
    options:
      - 'The Python garbage collector memory hook'
      - 'A function that prints the tensor shape'
      - 'The backward op that produced this tensor'
      - 'A random number generator seed'
    answer_index: 2
    explanation: 'Every tensor created by an operation with requires_grad=True receives a grad_fn pointing to the backward differentiation node used during .backward() graph traversal.'
  - question: 'Why does PyTorch require calling optimizer.zero_grad() or tensor.grad.zero_() before calling loss.backward() in a training loop?'
    options:
      - 'To reset the learning rate schedule'
      - 'To clear the GPU cache memory'
      - 'To prevent floating point underflow'
      - 'Autograd accumulates gradients into .grad'
    answer_index: 3
    explanation: 'Gradient accumulation enables simulating larger batch sizes across multiple mini-steps, but requires explicit zeroing before standard single-step optimization.'
