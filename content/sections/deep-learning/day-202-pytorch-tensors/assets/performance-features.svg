<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Broadcasting, pinning, and precision.">
  <title>Three performance features</title>
  <style>
    .performance-features-bg   { fill: #f8fafc; }
    .performance-features-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .performance-features-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .performance-features-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .performance-features-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .performance-features-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .performance-features-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .performance-features-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .performance-features-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .performance-features-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .performance-features-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .performance-features-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .performance-features-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .performance-features-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .performance-features-stage { opacity: 1; }

    .performance-features-s0 { animation-delay: 0.00s; }
    .performance-features-e0 { animation-delay: 0.00s; }
    .performance-features-s1 { animation-delay: 1.50s; }
    .performance-features-e1 { animation-delay: 1.50s; }
    .performance-features-s2 { animation-delay: 3.00s; }
    .performance-features-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .performance-features-conn  { animation: performance-features-trace 6s ease-in-out infinite; }
      .performance-features-stage { animation: performance-features-arrive 6s ease-in-out infinite; }
    }
    @keyframes performance-features-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes performance-features-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .performance-features-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .performance-features-stage { animation: performance-features-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes performance-features-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="performance-features-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="performance-features-bg" width="980" height="322"/>
  <text class="performance-features-h1"  x="30" y="40">Three performance features</text>
  <text class="performance-features-sub" x="30" y="64">Broadcasting, pinning, and precision.</text>
  <g class="performance-features-stage performance-features-s0">
    <rect class="performance-features-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="performance-features-step" x="44" y="142">01</text>
    <text class="performance-features-name" x="70" y="142">Broadcasting</text>
    <text class="performance-features-desc" x="44" y="166">Shapes aligned from the right; size-one</text>
    <text class="performance-features-desc" x="44" y="182">dimensions expand without copying.</text>
    <text class="performance-features-edge" x="44" y="242">no memory</text>
  </g>
  <line class="performance-features-line performance-features-conn performance-features-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#performance-features-tip)"/>
  <g class="performance-features-stage performance-features-s1">
    <rect class="performance-features-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="performance-features-step" x="359" y="142">02</text>
    <text class="performance-features-name" x="385" y="142">Pinned memory</text>
    <text class="performance-features-desc" x="359" y="166">Page-locked host buffers allow direct</text>
    <text class="performance-features-desc" x="359" y="182">transfer, skipping an intermediate copy.</text>
  </g>
  <line class="performance-features-line performance-features-conn performance-features-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#performance-features-tip)"/>
  <g class="performance-features-stage performance-features-s2">
    <rect class="performance-features-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="performance-features-step" x="674" y="142">03</text>
    <text class="performance-features-name" x="700" y="142">Mixed precision</text>
    <text class="performance-features-desc" x="674" y="166">Half-precision matrix units run several times</text>
    <text class="performance-features-desc" x="674" y="182">faster and halve memory.</text>
  </g>
  <text class="performance-features-sub" x="30" y="304">Broadcasting is convenient and occasionally dangerous: two shapes that broadcast when you expected an error produce a result of the wrong size that runs perfectly well.</text>
</svg>
