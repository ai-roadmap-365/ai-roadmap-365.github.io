<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the contiguity trap.">
  <title>Views and copies</title>
  <style>
    .view-or-copy-bg   { fill: #f8fafc; }
    .view-or-copy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .view-or-copy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .view-or-copy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .view-or-copy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .view-or-copy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .view-or-copy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .view-or-copy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .view-or-copy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .view-or-copy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .view-or-copy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .view-or-copy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .view-or-copy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .view-or-copy-row { opacity: 1; }
    .view-or-copy-r0 { animation-delay: 0.00s; }
    .view-or-copy-r1 { animation-delay: 0.45s; }
    .view-or-copy-r2 { animation-delay: 0.90s; }
    .view-or-copy-r3 { animation-delay: 1.35s; }
    .view-or-copy-r4 { animation-delay: 1.80s; }
    .view-or-copy-row { animation: view-or-copy-reveal 7.3s ease-in-out infinite; }
    @keyframes view-or-copy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="view-or-copy-bg" width="980" height="390"/>
  <text class="view-or-copy-h1"  x="30" y="40">Views and copies</text>
  <text class="view-or-copy-sub" x="30" y="64">And the contiguity trap.</text>
  <rect class="view-or-copy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="view-or-copy-name" x="46" y="122">A view</text>
  <text class="view-or-copy-desc" x="46" y="142">New metadata, same memory.</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r0" x="46" y="182">Transpose, slice, expand</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r1" x="46" y="216">Instant, whatever the tensor size</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r2" x="46" y="250">Shares storage with the original</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r3" x="46" y="284">Mutating one changes the other</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r4" x="46" y="318">Strides may be non-contiguous</text>
  <rect class="view-or-copy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="view-or-copy-name" x="526" y="122">A copy</text>
  <text class="view-or-copy-desc" x="526" y="142">New memory.</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r0" x="526" y="182">Required when strides cannot express the result</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r1" x="526" y="216">Reshaping a transposed tensor needs one</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r2" x="526" y="250">Costs time proportional to size</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r3" x="526" y="284">Independent of the original</text>
  <text class="view-or-copy-desc view-or-copy-row view-or-copy-r4" x="526" y="318">Ask for it explicitly when you mean it</text>
  <text class="view-or-copy-sub" x="30" y="372">The contiguity trap catches everyone once: a transpose followed by a reshape raises an error that reads like a shape problem and is a memory-layout problem.</text>
</svg>
