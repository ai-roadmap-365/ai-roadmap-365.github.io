<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Storage plus a view of it.">
  <title>What a tensor actually is</title>
  <style>
    .tensor-anatomy-bg   { fill: #f8fafc; }
    .tensor-anatomy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-anatomy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-anatomy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-anatomy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-anatomy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tensor-anatomy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tensor-anatomy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tensor-anatomy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tensor-anatomy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tensor-anatomy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tensor-anatomy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tensor-anatomy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tensor-anatomy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tensor-anatomy-stage { opacity: 1; }

    .tensor-anatomy-s0 { animation-delay: 0.00s; }
    .tensor-anatomy-e0 { animation-delay: 0.00s; }
    .tensor-anatomy-s1 { animation-delay: 1.28s; }
    .tensor-anatomy-e1 { animation-delay: 1.28s; }
    .tensor-anatomy-s2 { animation-delay: 2.56s; }
    .tensor-anatomy-e2 { animation-delay: 2.56s; }
    .tensor-anatomy-s3 { animation-delay: 3.84s; }
    .tensor-anatomy-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tensor-anatomy-conn  { animation: tensor-anatomy-trace 6.4s ease-in-out infinite; }
      .tensor-anatomy-stage { animation: tensor-anatomy-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tensor-anatomy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tensor-anatomy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tensor-anatomy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tensor-anatomy-stage { animation: tensor-anatomy-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tensor-anatomy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tensor-anatomy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tensor-anatomy-bg" width="980" height="322"/>
  <text class="tensor-anatomy-h1"  x="30" y="40">What a tensor actually is</text>
  <text class="tensor-anatomy-sub" x="30" y="64">Storage plus a view of it.</text>
  <g class="tensor-anatomy-stage tensor-anatomy-s0">
    <rect class="tensor-anatomy-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-anatomy-step" x="44" y="142">01</text>
    <text class="tensor-anatomy-name" x="70" y="142">A flat contiguous buffer</text>
    <text class="tensor-anatomy-desc" x="44" y="166">Typed memory, laid out for</text>
    <text class="tensor-anatomy-desc" x="44" y="182">vector units and GPU warps.</text>
  </g>
  <line class="tensor-anatomy-line tensor-anatomy-conn tensor-anatomy-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tensor-anatomy-tip)"/>
  <g class="tensor-anatomy-stage tensor-anatomy-s1">
    <rect class="tensor-anatomy-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-anatomy-step" x="280" y="142">02</text>
    <text class="tensor-anatomy-name" x="306" y="142">A shape</text>
    <text class="tensor-anatomy-desc" x="280" y="166">How to interpret that buffer as</text>
    <text class="tensor-anatomy-desc" x="280" y="182">dimensions.</text>
  </g>
  <line class="tensor-anatomy-line tensor-anatomy-conn tensor-anatomy-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tensor-anatomy-tip)"/>
  <g class="tensor-anatomy-stage tensor-anatomy-s2">
    <rect class="tensor-anatomy-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-anatomy-step" x="516" y="142">03</text>
    <text class="tensor-anatomy-name" x="542" y="142">Strides</text>
    <text class="tensor-anatomy-desc" x="516" y="166">How many elements to step for</text>
    <text class="tensor-anatomy-desc" x="516" y="182">each dimension.</text>
    <text class="tensor-anatomy-edge" x="516" y="242">the view</text>
  </g>
  <line class="tensor-anatomy-line tensor-anatomy-conn tensor-anatomy-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tensor-anatomy-tip)"/>
  <g class="tensor-anatomy-stage tensor-anatomy-s3">
    <rect class="tensor-anatomy-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tensor-anatomy-step" x="752" y="142">04</text>
    <text class="tensor-anatomy-name" x="778" y="142">So a view costs nothing</text>
    <text class="tensor-anatomy-desc" x="752" y="166">A transpose changes strides, not</text>
    <text class="tensor-anatomy-desc" x="752" y="182">data.</text>
  </g>
  <text class="tensor-anatomy-sub" x="30" y="304">Understanding strides explains most confusing tensor errors: an operation that demands contiguous memory is refusing a view whose stride pattern it cannot handle, not rejecting the data.</text>
</svg>
