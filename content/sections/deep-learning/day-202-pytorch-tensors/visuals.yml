visuals:
  - id: pytorch-tensor-autograd-architecture
    file: assets/pytorch-tensor-autograd-architecture.svg
    type: diagram
    title: PyTorch Tensor Architecture and Autograd Engine
    alt: PyTorch Tensor memory layout and computational autograd graph showing tensor storage stride device mapping and automatic differentiation
    description: Architectural diagram of PyTorch tensor storage layout, multidimensional strides, device memory abstraction, and dynamic computational graph tape recording.
  - id: pytorch-tensor-strides-reshaping
    file: assets/pytorch-tensor-strides-reshaping.svg
    type: diagram
    title: PyTorch Tensor Memory Strides and Reshaping Taxonomy
    alt: PyTorch tensor reshaping and memory stride operations comparing view contiguous reshape permute and transpose
    description: Comparative reference illustrating memory layout behavior across tensor view, reshape, permute, and contiguous operations in PyTorch.
  - id: tensor-anatomy
    file: assets/tensor-anatomy.svg
    type: diagram
    title: 'What a tensor actually is'
    alt: 'Diagram: the internal structure of a framework tensor'
    description: 'A four-stage description of tensor internals covering the storage buffer, shape, strides and the metadata that makes views cheap.'
  - id: view-or-copy
    file: assets/view-or-copy.svg
    type: diagram
    title: 'Views and copies'
    alt: 'Diagram: tensor views compared with copies, and the transpose contiguity trap'
    description: 'A two-column comparison of tensor views against copies, including the failure produced by reshaping a transposed tensor.'
  - id: pytorch-lineage
    file: assets/pytorch-lineage.svg
    type: diagram
    title: 'Why eager execution won'
    alt: 'Diagram: static graph frameworks compared with eager execution'
    description: 'A three-stage description of the shift to eager execution covering debuggability, control flow and adoption.'
  - id: autograd-graph
    file: assets/autograd-graph.svg
    type: diagram
    title: 'How autograd works'
    alt: 'Diagram: how a dynamic autograd graph is built and traversed'
    description: 'A four-stage description of autograd covering operation recording, graph construction, the backward traversal and gradient accumulation.'
  - id: device-agnostic
    file: assets/device-agnostic.svg
    type: diagram
    title: 'Writing device-agnostic code'
    alt: 'Diagram: device-agnostic tensor code compared with hardcoded device placement'
    description: 'A three-stage description of device-agnostic code covering device selection, consistent placement and the failure hardcoding causes.'
  - id: performance-features
    file: assets/performance-features.svg
    type: diagram
    title: 'Three performance features'
    alt: 'Diagram: broadcasting, pinned memory and mixed precision as performance features'
    description: 'A three-stage description of tensor performance features covering broadcasting semantics, page-locked host memory and automatic mixed precision.'
  - id: freight-analogy
    file: assets/freight-analogy.svg
    type: diagram
    title: 'Drawing boards and CAD'
    alt: 'Diagram: manual drafting compared with computer-aided design'
    description: 'A two-column comparison of manual drafting against computer-aided design, as an analogy for NumPy against a tensor framework.'
  - id: tensor-implications
    file: assets/tensor-implications.svg
    type: diagram
    title: 'Four practical consequences'
    alt: 'Diagram: the memory, transfer, precision and graph implications of tensor frameworks'
    description: 'A four-stage description of tensor framework implications covering shared storage, host-device transfer, precision choices and graph retention.'
  - id: pytorch-when
    file: assets/pytorch-when.svg
    type: diagram
    title: 'When to reach for tensors'
    alt: 'Diagram: when a tensor framework is the right tool'
    description: 'A two-column comparison of workloads requiring a tensor framework against those better served by other libraries.'
