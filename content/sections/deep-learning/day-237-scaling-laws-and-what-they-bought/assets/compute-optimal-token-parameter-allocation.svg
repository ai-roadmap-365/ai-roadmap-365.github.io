<svg role="img" aria-label="Compute optimal token and parameter allocation curves showing parameter count N and token count D as function of total FLOPs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Compute-Optimal Resource Allocation: C = 6ND</title>
  <defs>
    <linearGradient id="bg237b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card237b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg237b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COMPUTE BUDGET ALLOCATION: PARAMETERS VS. TOKENS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">IsoFLOP Contours and Optimal Model Sizing for Given Training Budgets</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card237b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Axes -->
    <line x1="80" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <text x="370" y="270" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">Total Training Compute C (FLOPs, Log Scale: 1e21 to 1e26)</text>

    <line x1="80" y1="240" x2="80" y2="30" stroke="#94a3b8" stroke-width="2"/>
    <text x="35" y="135" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 35 135)">Optimal Scale (N in Billions &amp; D in Trillions)</text>

    <!-- Curve 1: Parameters N (Blue) -->
    <path d="M 100 210 Q 350 150 620 50" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="560" y="45" fill="#38bdf8" font-size="10" font-weight="700">Parameters N_opt ∝ C^0.50</text>

    <!-- Curve 2: Tokens D (Green) -->
    <path d="M 100 215 Q 350 155 620 65" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="560" y="80" fill="#34d399" font-size="10" font-weight="700">Tokens D_opt ∝ C^0.50</text>

    <!-- Formula Box -->
    <g transform="translate(100, 30)">
      <rect width="400" height="45" fill="#0f172a" stroke="#64748b" rx="4"/>
      <text x="200" y="20" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Chinchilla Optimal Rule: D = 20 * N</text>
      <text x="200" y="38" fill="#cbd5e1" font-size="8" text-anchor="middle">Given Compute C: N_opt = sqrt(C / 120), D_opt = 20 * N_opt</text>
    </g>
  </g>
</svg>
