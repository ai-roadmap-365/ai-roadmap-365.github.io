<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Including who can compete.">
  <title>Four consequences of scaling laws</title>
  <style>
    .scaling-implications-bg   { fill: #f8fafc; }
    .scaling-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scaling-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scaling-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scaling-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scaling-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scaling-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scaling-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scaling-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .scaling-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .scaling-implications-stage { opacity: 1; }

    .scaling-implications-s0 { animation-delay: 0.00s; }
    .scaling-implications-e0 { animation-delay: 0.00s; }
    .scaling-implications-s1 { animation-delay: 1.28s; }
    .scaling-implications-e1 { animation-delay: 1.28s; }
    .scaling-implications-s2 { animation-delay: 2.56s; }
    .scaling-implications-e2 { animation-delay: 2.56s; }
    .scaling-implications-s3 { animation-delay: 3.84s; }
    .scaling-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .scaling-implications-conn  { animation: scaling-implications-trace 6.4s ease-in-out infinite; }
      .scaling-implications-stage { animation: scaling-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes scaling-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes scaling-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .scaling-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .scaling-implications-stage { animation: scaling-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes scaling-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="scaling-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="scaling-implications-bg" width="980" height="322"/>
  <text class="scaling-implications-h1"  x="30" y="40">Four consequences of scaling laws</text>
  <text class="scaling-implications-sub" x="30" y="64">Including who can compete.</text>
  <g class="scaling-implications-stage scaling-implications-s0">
    <rect class="scaling-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-implications-step" x="44" y="142">01</text>
    <text class="scaling-implications-name" x="70" y="142">Training runs became plannable</text>
    <text class="scaling-implications-desc" x="44" y="166">Budget, schedule and expected</text>
    <text class="scaling-implications-desc" x="44" y="182">result, in advance.</text>
  </g>
  <line class="scaling-implications-line scaling-implications-conn scaling-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#scaling-implications-tip)"/>
  <g class="scaling-implications-stage scaling-implications-s1">
    <rect class="scaling-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-implications-step" x="280" y="142">02</text>
    <text class="scaling-implications-name" x="306" y="142">But the frontier concentrated</text>
    <text class="scaling-implications-desc" x="280" y="166">Into the few organisations that</text>
    <text class="scaling-implications-desc" x="280" y="182">can fund it.</text>
  </g>
  <line class="scaling-implications-line scaling-implications-conn scaling-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#scaling-implications-tip)"/>
  <g class="scaling-implications-stage scaling-implications-s2">
    <rect class="scaling-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-implications-step" x="516" y="142">03</text>
    <text class="scaling-implications-name" x="542" y="142">With substantial energy and water cost</text>
    <text class="scaling-implications-desc" x="516" y="166">Which is now a reported figure,</text>
    <text class="scaling-implications-desc" x="516" y="182">not a footnote.</text>
  </g>
  <line class="scaling-implications-line scaling-implications-conn scaling-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#scaling-implications-tip)"/>
  <g class="scaling-implications-stage scaling-implications-s3">
    <rect class="scaling-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="scaling-implications-step" x="752" y="142">04</text>
    <text class="scaling-implications-name" x="778" y="142">And capability became partly forecastable</text>
    <text class="scaling-implications-desc" x="752" y="166">Which is why the policy</text>
    <text class="scaling-implications-desc" x="752" y="182">conversation exists at all.</text>
  </g>
  <text class="scaling-implications-sub" x="30" y="304">Predictability cutting both ways is the interesting consequence: the same curves that let a lab plan a run let regulators anticipate what the next one will be able to do.</text>
</svg>
