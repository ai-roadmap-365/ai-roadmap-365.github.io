terms:
  - term: 'Neural Scaling Laws'
    definition: 'Empirical power-law relationships demonstrating that cross-entropy loss decreases smoothly and predictably as a function of compute, model size, and dataset tokens.'
  - term: 'Chinchilla Optimal'
    definition: 'The compute-optimal allocation principle where model parameter count N and dataset token count D scale in equal proportion: D approx 20 * N.'
  - term: 'Compute Budget (C)'
    definition: 'The total floating-point operations required to train a model, approximated by C approx 6 * N * D for dense transformers.'
  - term: 'Irreducible Loss (E)'
    definition: 'The fundamental theoretical minimum cross-entropy loss (entropy) of natural language text that cannot be compressed further.'
  - term: 'Inference-Optimal Overtraining'
    definition: 'Training a compact model on far more tokens than the Chinchilla optimum (D >> 20N) to minimize downstream inference latency and serving costs.'
  - term: 'IsoFLOP Profile'
    definition: 'A curve plotting validation loss across various parameter counts N for a fixed, constant compute budget C.'
  - term: 'Test-Time Compute'
    definition: 'Computational FLOPs expended during inference (e.g. reasoning tokens, tree search, self-correction) to solve complex tasks.'
  - term: 'Emergent Abilities'
    definition: 'Capabilities that appear suddenly at specific compute scales (often an artifact of non-linear evaluation metrics on smooth underlying loss curves).'
