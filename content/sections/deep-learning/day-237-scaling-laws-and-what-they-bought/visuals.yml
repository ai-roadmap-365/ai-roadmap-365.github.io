visuals:
  - id: neural-scaling-laws-kaplan-vs-chinchilla
    file: assets/neural-scaling-laws-kaplan-vs-chinchilla.svg
    type: diagram
    title: 'Neural Scaling Laws: Kaplan vs. Chinchilla Formulations'
    alt: Neural Scaling Laws comparison plotting cross-entropy loss against compute FLOPs comparing Kaplan and Chinchilla
    description: 'Empirical comparison between OpenAI Kaplan (parameter-heavy) and DeepMind Chinchilla (token-balanced) scaling formulations.'
  - id: compute-optimal-token-parameter-allocation
    file: assets/compute-optimal-token-parameter-allocation.svg
    type: diagram
    title: 'Compute-Optimal Resource Allocation: C = 6ND'
    alt: Compute optimal token and parameter allocation curves showing parameter count N and token count D as function of total FLOPs
    description: 'IsoFLOP compute allocation curves showing joint 1:1 scaling of model parameters and dataset tokens.'
  - id: scaling-idea
    file: assets/scaling-idea.svg
    type: diagram
    title: 'What a scaling law is'
    alt: 'Diagram: how scaling laws predict the performance of a large training run'
    description: 'A four-stage description of scaling laws covering small runs, the fitted relationship, extrapolation and the resulting decision.'
  - id: compute-optimal
    file: assets/compute-optimal.svg
    type: diagram
    title: 'Splitting a compute budget'
    alt: 'Diagram: how a fixed compute budget is divided between model size and training data'
    description: 'A four-stage description of compute-optimal allocation covering the fixed budget, the trade-off, the optimum and the earlier error.'
  - id: train-vs-serve
    file: assets/train-vs-serve.svg
    type: diagram
    title: 'Optimal to train, optimal to serve'
    alt: 'Diagram: compute-optimal training compared with inference-optimal overtraining'
    description: 'A two-column comparison of minimising training cost against minimising lifetime serving cost.'
  - id: emergence
    file: assets/emergence.svg
    type: diagram
    title: 'Abrupt capability, or abrupt metric'
    alt: 'Diagram: how a discontinuous metric makes smooth improvement look abrupt'
    description: 'A four-stage description of the emergence debate covering the observation, the metric, the smooth underlying improvement and the remaining open question.'
  - id: engine-scaling
    file: assets/engine-scaling.svg
    type: diagram
    title: 'Predicting an engine''s power'
    alt: 'Diagram: extrapolating from small prototypes compared with building the full-scale version blind'
    description: 'A two-column comparison of predicting large-scale behaviour from small tests against building at full scale directly.'
  - id: data-wall
    file: assets/data-wall.svg
    type: diagram
    title: 'Running out of data'
    alt: 'Diagram: how data scarcity changes the compute-optimal training strategy'
    description: 'A four-stage description of the data constraint covering the optimal ratio, finite high-quality text, repeated passes and the diminishing return.'
  - id: scaling-implications
    file: assets/scaling-implications.svg
    type: diagram
    title: 'Four consequences of scaling laws'
    alt: 'Diagram: the planning, concentration, environmental and forecasting implications of scaling laws'
    description: 'A four-stage description of scaling law implications covering budget planning, capital concentration, energy use and capability forecasting.'
  - id: scaling-when
    file: assets/scaling-when.svg
    type: diagram
    title: 'When scaling laws apply'
    alt: 'Diagram: when scaling law reasoning is valid and when it does not transfer'
    description: 'A two-column comparison of situations where scaling laws apply against situations where they do not.'
  - id: scaling-history
    file: assets/scaling-history.svg
    type: diagram
    title: 'Four steps in scaling research'
    alt: 'Diagram: the historical progression of neural scaling law research'
    description: 'A four-stage description of scaling law history covering the first power laws, parameter-heavy scaling, the compute-optimal correction and inference-driven overtraining.'
  - id: scaling-vs-emergence
    file: assets/scaling-vs-emergence.svg
    type: diagram
    title: 'Predictable loss, unpredictable capability'
    alt: 'Diagram: predictable loss curves compared with unpredictable downstream capability'
    description: 'A two-column comparison of loss scaling against downstream capability.'
