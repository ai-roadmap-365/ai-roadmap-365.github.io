questions:
  - question: 'Why does training an autoregressive transformer require approximately 6 FLOPs per parameter per token (C = 6ND)?'
    options:
      - 'Because the forward pass requires 2 FLOPs per parameter (1 multiply + 1 accumulate in GEMMs), and the backward pass requires 4 FLOPs per parameter (2 FLOPs to compute gradients with respect to activations + 2 FLOPs to compute gradients with respect to weights), totaling 6 FLOPs'
      - 'Because transformers have 6 attention heads'
      - 'Because there are 6 days in a working week'
      - 'Because 6 is the atomic number of carbon'
    answer_index: 0
    explanation: 'Forward pass takes 2 FLOPs/param/token; backward pass takes 4 FLOPs/param/token (gradient of inputs + gradient of weights), totaling 6 FLOPs.'
  - question: 'What was the revolutionary finding of the DeepMind Chinchilla paper (Hoffmann et al., 2022)?'
    options:
      - 'Given a compute budget C, model parameters N and training tokens D should scale equally (both proportional to C^0.5), requiring approximately 20 tokens per parameter for compute-optimal training; previously, Kaplan et al. had erroneously recommended scaling parameters much faster than tokens'
      - 'That neural networks cannot learn from text'
      - 'That GPUs should be replaced with quantum computers'
      - 'That models should only be trained on 1,000 tokens'
    answer_index: 0
    explanation: 'Chinchilla proved that parameters and tokens should scale in equal 1:1 proportion (~20 tokens per parameter).'
  - question: 'Why did Meta train LLaMA-3 8B on 15 Trillion tokens (nearly 1,875 tokens per parameter), drastically violating the Chinchilla compute-optimal rule (20 tokens/param)?'
    options:
      - 'Because Chinchilla optimizes only for training compute; for models that will be queried by billions of users at inference time, spending extra training compute to overtrain a small model dramatically reduces downstream per-token inference serving latency and memory costs'
      - 'Because Meta ran out of disk space'
      - 'Because 8B models stop learning at 1 billion tokens'
      - 'Because of an error in the training script'
    answer_index: 0
    explanation: 'Inference-optimal overtraining trades excess training compute for permanent reductions in per-query serving costs.'
  - question: 'What is Test-Time Compute Scaling (the reasoning model paradigm behind OpenAI o1/o3)?'
    options:
      - 'Scaling computational effort during inference (generating long chains-of-thought, tree-search exploration, and majority voting) to solve complex reasoning problems, demonstrating a new power-law scaling dimension independent of pretraining compute'
      - 'Buying more GPUs to install on a laptop'
      - 'Testing the model on a larger test dataset'
      - 'Running unit tests 1,000 times'
    answer_index: 0
    explanation: 'Test-time compute scaling trades inference thinking tokens and tree search for dramatic gains in complex reasoning.'
  - question: 'In the empirical power law L(N, D) = E + A/N^alpha + B/D^beta, what does the constant E represent?'
    options:
      - 'The irreducible entropy of natural language (the theoretical minimum cross-entropy loss of human text that no model can surpass regardless of infinite parameters or data)'
      - 'The energy consumed by the datacenter in Joules'
      - 'The learning rate of the optimizer'
      - 'The number of GPUs in the cluster'
    answer_index: 0
    explanation: 'E represents the Bayes optimal irreducible loss / entropy of the natural language data distribution.'
