learning_promise: 'Master empirical Neural Scaling Laws and compute budgeting: analyze the power-law formulation L(N, D) = E + A/N^alpha + B/D^beta, calculate training FLOPs (C ≈ 6ND), compare OpenAI Kaplan et al. with DeepMind Chinchilla (Hoffmann et al.), derive the compute-optimal 20 tokens-per-parameter ratio, analyze inference-optimal overtraining (LLaMA), understand test-time compute scaling (reasoning models), and build a complete scaling law simulation in Python.'
objectives:
  - 'Derive the empirical power-law equation relating cross-entropy loss to parameter count N, dataset tokens D, and compute C.'
  - 'Calculate total training compute FLOPs using the foundational 6ND approximation (2 FLOPs forward + 4 FLOPs backward per parameter per token).'
  - 'Contrast OpenAI Kaplan et al. scaling with DeepMind Chinchilla (Hoffmann et al.) compute-optimal allocation.'
  - 'Explain why modern models (e.g. LLaMA-3 8B on 15T tokens) deliberately overtrain past the Chinchilla frontier to minimize downstream inference serving costs.'
  - 'Analyze test-time reasoning compute scaling (search, verifiers, and chain-of-thought exploration).'
