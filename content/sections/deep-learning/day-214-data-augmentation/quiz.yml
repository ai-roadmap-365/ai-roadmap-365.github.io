questions:
  - question: 'Why must data augmentation transforms (e.g. RandomCrop, RandomHorizontalFlip, MixUp) ONLY be applied during training, while validation and testing use deterministic transforms (e.g. Resize, CenterCrop, Normalize)?'
    options:
      - 'Training requires synthetic diversity to expand the empirical data distribution and prevent overfitting; validation requires deterministic, reproducible evaluation on unmodified real-world representations'
      - 'PyTorch crashes if RandomHorizontalFlip is called on validation data'
      - 'Validation images are always grayscale'
      - 'Validation loss cannot be computed if images are cropped'
    answer_index: 0
    explanation: 'Data augmentation expands the training manifold. Validation must remain a fixed, deterministic benchmark to fairly assess model generalization.'
  - question: 'How does MixUp compute its augmented input image x_tilde and target label vector y_tilde given two samples (x_i, y_i) and (x_j, y_j) with mixing coefficient lambda?'
    options:
      - 'x_tilde = lambda * x_i + (1 - lambda) * x_j, and y_tilde = lambda * y_i + (1 - lambda) * y_j'
      - 'x_tilde = x_i + x_j, and y_tilde = y_i'
      - 'x_tilde = max(x_i, x_j), and y_tilde = y_i * y_j'
      - 'x_tilde = x_i / x_j, and y_tilde = 0'
    answer_index: 0
    explanation: 'MixUp performs a linear convex combination on both the raw input pixels and the one-hot target vectors, enforcing linear behavior between class clusters.'
  - question: 'What is the primary advantage of CutMix over standard MixUp?'
    options:
      - 'CutMix replaces a rectangular spatial patch from image i with a patch from image j, preserving natural local pixel textures and edge statistics rather than creating unnatural transparent ghosting artifacts'
      - 'CutMix requires zero GPU memory'
      - 'CutMix converts images into text strings'
      - 'CutMix only works on audio'
    answer_index: 0
    explanation: 'MixUp blends pixel intensities globally, producing unnatural ghosting. CutMix cuts and pastes real image patches, preserving realistic spatial texture gradients.'
  - question: 'What is RandAugment, and why did it replace complex Reinforcement Learning AutoAugment search algorithms?'
    options:
      - 'RandAugment applies N randomly selected augmentation transforms with a single shared distortion magnitude M, matching or beating AutoAugment performance with zero expensive search overhead'
      - 'RandAugment deletes random images from the hard drive'
      - 'RandAugment converts neural networks into random decision trees'
      - 'RandAugment replaces PyTorch with C++'
    answer_index: 0
    explanation: 'Cubuk et al. showed that tuning just two global hyperparameters (N = number of transforms, M = magnitude) matches expensive neural architecture search AutoAugment policies.'
  - question: 'Why is Random Horizontal Flip generally safe for natural outdoor photos (dogs, cars, landscapes), but potentially disastrous for medical chest X-rays or street sign reading datasets?'
    options:
      - 'In medical radiology, organ positioning (situs inversus vs normal heart on the left) is diagnostic, and in street signs, flipping "STOP" or a "One Way Right" arrow alters the ground-truth semantic label'
      - 'X-ray images cannot be represented as tensors'
      - 'Street signs are patented'
      - 'Flipping an X-ray makes it invisible to CNNs'
    answer_index: 0
    explanation: 'Augmentations must reflect valid domain invariances. If spatial orientation carries semantic meaning (text, directional signs, anatomical symmetry), flipping corrupts the ground-truth label.'
