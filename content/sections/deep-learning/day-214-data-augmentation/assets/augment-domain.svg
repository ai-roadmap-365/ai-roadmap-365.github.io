<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And never applied at evaluation.">
  <title>Augmentation is domain-specific</title>
  <style>
    .augment-domain-bg   { fill: #f8fafc; }
    .augment-domain-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-domain-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-domain-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-domain-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-domain-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-domain-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augment-domain-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augment-domain-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augment-domain-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augment-domain-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augment-domain-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augment-domain-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augment-domain-row { opacity: 1; }
    .augment-domain-r0 { animation-delay: 0.00s; }
    .augment-domain-r1 { animation-delay: 0.45s; }
    .augment-domain-r2 { animation-delay: 0.90s; }
    .augment-domain-r3 { animation-delay: 1.35s; }
    .augment-domain-r4 { animation-delay: 1.80s; }
    .augment-domain-row { animation: augment-domain-reveal 7.3s ease-in-out infinite; }
    @keyframes augment-domain-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="augment-domain-bg" width="980" height="390"/>
  <text class="augment-domain-h1"  x="30" y="40">Augmentation is domain-specific</text>
  <text class="augment-domain-sub" x="30" y="64">And never applied at evaluation.</text>
  <rect class="augment-domain-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="augment-domain-name" x="46" y="122">Valid</text>
  <text class="augment-domain-desc" x="46" y="142">The label survives.</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r0" x="46" y="182">Horizontally flipping a photograph of a dog</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r1" x="46" y="216">Adjusting brightness on a natural image</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r2" x="46" y="250">Random cropping, within reason</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r3" x="46" y="284">Small rotations on most objects</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r4" x="46" y="318">The invariance genuinely holds</text>
  <rect class="augment-domain-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="augment-domain-name" x="526" y="122">Label-corrupting</text>
  <text class="augment-domain-desc" x="526" y="142">The label changes.</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r0" x="526" y="182">Flipping a handwritten six into a nine</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r1" x="526" y="216">Rotating a chest X-ray beyond anatomy</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r2" x="526" y="250">Colour jitter on a colour-coded diagram</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r3" x="526" y="284">Vertical flips on text</text>
  <text class="augment-domain-desc augment-domain-row augment-domain-r4" x="526" y="318">And never any of it at evaluation</text>
  <text class="augment-domain-sub" x="30" y="372">Evaluation augmentation is a separate and absolute rule: a benchmark with random transformations produces a number that cannot be compared with anything, including itself.</text>
</svg>
