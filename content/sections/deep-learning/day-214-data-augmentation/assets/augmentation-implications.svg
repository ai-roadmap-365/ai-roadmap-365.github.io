<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Cost, tuning, evaluation and interaction.">
  <title>Four consequences of augmenting</title>
  <style>
    .augmentation-implications-bg   { fill: #f8fafc; }
    .augmentation-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augmentation-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augmentation-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augmentation-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augmentation-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augmentation-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augmentation-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .augmentation-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .augmentation-implications-stage { opacity: 1; }

    .augmentation-implications-s0 { animation-delay: 0.00s; }
    .augmentation-implications-e0 { animation-delay: 0.00s; }
    .augmentation-implications-s1 { animation-delay: 1.28s; }
    .augmentation-implications-e1 { animation-delay: 1.28s; }
    .augmentation-implications-s2 { animation-delay: 2.56s; }
    .augmentation-implications-e2 { animation-delay: 2.56s; }
    .augmentation-implications-s3 { animation-delay: 3.84s; }
    .augmentation-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .augmentation-implications-conn  { animation: augmentation-implications-trace 6.4s ease-in-out infinite; }
      .augmentation-implications-stage { animation: augmentation-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes augmentation-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes augmentation-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .augmentation-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .augmentation-implications-stage { animation: augmentation-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes augmentation-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="augmentation-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="augmentation-implications-bg" width="980" height="322"/>
  <text class="augmentation-implications-h1"  x="30" y="40">Four consequences of augmenting</text>
  <text class="augmentation-implications-sub" x="30" y="64">Cost, tuning, evaluation and interaction.</text>
  <g class="augmentation-implications-stage augmentation-implications-s0">
    <rect class="augmentation-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-implications-step" x="44" y="142">01</text>
    <text class="augmentation-implications-name" x="70" y="142">It costs CPU per sample</text>
    <text class="augmentation-implications-desc" x="44" y="166">Which is why loader workers</text>
    <text class="augmentation-implications-desc" x="44" y="182">exist. Heavy augmentation can</text>
    <text class="augmentation-implications-desc" x="44" y="198">starve the accelerator.</text>
  </g>
  <line class="augmentation-implications-line augmentation-implications-conn augmentation-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#augmentation-implications-tip)"/>
  <g class="augmentation-implications-stage augmentation-implications-s1">
    <rect class="augmentation-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-implications-step" x="280" y="142">02</text>
    <text class="augmentation-implications-name" x="306" y="142">Too much slows convergence</text>
    <text class="augmentation-implications-desc" x="280" y="166">An input distribution too far</text>
    <text class="augmentation-implications-desc" x="280" y="182">from the real one wastes</text>
    <text class="augmentation-implications-desc" x="280" y="198">capacity.</text>
  </g>
  <line class="augmentation-implications-line augmentation-implications-conn augmentation-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#augmentation-implications-tip)"/>
  <g class="augmentation-implications-stage augmentation-implications-s2">
    <rect class="augmentation-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-implications-step" x="516" y="142">03</text>
    <text class="augmentation-implications-name" x="542" y="142">Evaluation must be deterministic</text>
    <text class="augmentation-implications-desc" x="516" y="166">Resize, centre crop, normalise.</text>
    <text class="augmentation-implications-desc" x="516" y="182">Nothing random.</text>
  </g>
  <line class="augmentation-implications-line augmentation-implications-conn augmentation-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#augmentation-implications-tip)"/>
  <g class="augmentation-implications-stage augmentation-implications-s3">
    <rect class="augmentation-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="augmentation-implications-step" x="752" y="142">04</text>
    <text class="augmentation-implications-name" x="778" y="142">And it interacts with other regularisers</text>
    <text class="augmentation-implications-desc" x="752" y="166">Strong augmentation may make</text>
    <text class="augmentation-implications-desc" x="752" y="182">dropout unnecessary.</text>
  </g>
  <text class="augmentation-implications-sub" x="30" y="304">The interaction explains why modern convolutional recipes use much less dropout than early ones: heavy augmentation is doing the regularising work that dropout used to.</text>
</svg>
