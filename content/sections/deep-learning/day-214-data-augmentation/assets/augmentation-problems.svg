<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All of them overfitting, differently.">
  <title>Three failures augmentation addresses</title>
  <style>
    .augmentation-problems-bg   { fill: #f8fafc; }
    .augmentation-problems-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-problems-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-problems-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-problems-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-problems-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augmentation-problems-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augmentation-problems-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augmentation-problems-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augmentation-problems-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augmentation-problems-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augmentation-problems-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augmentation-problems-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .augmentation-problems-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .augmentation-problems-stage { opacity: 1; }

    .augmentation-problems-s0 { animation-delay: 0.00s; }
    .augmentation-problems-e0 { animation-delay: 0.00s; }
    .augmentation-problems-s1 { animation-delay: 1.50s; }
    .augmentation-problems-e1 { animation-delay: 1.50s; }
    .augmentation-problems-s2 { animation-delay: 3.00s; }
    .augmentation-problems-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .augmentation-problems-conn  { animation: augmentation-problems-trace 6s ease-in-out infinite; }
      .augmentation-problems-stage { animation: augmentation-problems-arrive 6s ease-in-out infinite; }
    }
    @keyframes augmentation-problems-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes augmentation-problems-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .augmentation-problems-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .augmentation-problems-stage { animation: augmentation-problems-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes augmentation-problems-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="augmentation-problems-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="augmentation-problems-bg" width="980" height="322"/>
  <text class="augmentation-problems-h1"  x="30" y="40">Three failures augmentation addresses</text>
  <text class="augmentation-problems-sub" x="30" y="64">All of them overfitting, differently.</text>
  <g class="augmentation-problems-stage augmentation-problems-s0">
    <rect class="augmentation-problems-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="augmentation-problems-step" x="44" y="142">01</text>
    <text class="augmentation-problems-name" x="70" y="142">Memorisation</text>
    <text class="augmentation-problems-desc" x="44" y="166">Tens of millions of parameters on thousands</text>
    <text class="augmentation-problems-desc" x="44" y="182">of images.</text>
  </g>
  <line class="augmentation-problems-line augmentation-problems-conn augmentation-problems-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#augmentation-problems-tip)"/>
  <g class="augmentation-problems-stage augmentation-problems-s1">
    <rect class="augmentation-problems-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="augmentation-problems-step" x="359" y="142">02</text>
    <text class="augmentation-problems-name" x="385" y="142">Spurious correlation</text>
    <text class="augmentation-problems-desc" x="359" y="166">Learning the background rather than the</text>
    <text class="augmentation-problems-desc" x="359" y="182">object, because they co-occur.</text>
  </g>
  <line class="augmentation-problems-line augmentation-problems-conn augmentation-problems-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#augmentation-problems-tip)"/>
  <g class="augmentation-problems-stage augmentation-problems-s2">
    <rect class="augmentation-problems-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="augmentation-problems-step" x="674" y="142">03</text>
    <text class="augmentation-problems-name" x="700" y="142">Brittleness to nuisance variation</text>
    <text class="augmentation-problems-desc" x="674" y="166">Failing on the same object in different</text>
    <text class="augmentation-problems-desc" x="674" y="182">lighting or position.</text>
  </g>
  <text class="augmentation-problems-sub" x="30" y="304">The middle failure is the one augmentation addresses least directly: random cropping helps, and a model that has only ever seen cows on grass will still struggle with a cow on a beach.</text>
</svg>
