<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same transformations, different effect.">
  <title>Applied once, or every epoch</title>
  <style>
    .augment-or-preprocess-bg   { fill: #f8fafc; }
    .augment-or-preprocess-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-or-preprocess-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-or-preprocess-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-or-preprocess-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-or-preprocess-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .augment-or-preprocess-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augment-or-preprocess-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .augment-or-preprocess-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .augment-or-preprocess-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .augment-or-preprocess-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .augment-or-preprocess-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .augment-or-preprocess-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .augment-or-preprocess-row { opacity: 1; }
    .augment-or-preprocess-r0 { animation-delay: 0.00s; }
    .augment-or-preprocess-r1 { animation-delay: 0.45s; }
    .augment-or-preprocess-r2 { animation-delay: 0.90s; }
    .augment-or-preprocess-r3 { animation-delay: 1.35s; }
    .augment-or-preprocess-r4 { animation-delay: 1.80s; }
    .augment-or-preprocess-row { animation: augment-or-preprocess-reveal 7.3s ease-in-out infinite; }
    @keyframes augment-or-preprocess-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="augment-or-preprocess-bg" width="980" height="390"/>
  <text class="augment-or-preprocess-h1"  x="30" y="40">Applied once, or every epoch</text>
  <text class="augment-or-preprocess-sub" x="30" y="64">The same transformations, different effect.</text>
  <rect class="augment-or-preprocess-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="augment-or-preprocess-name" x="46" y="122">Once, at preprocessing</text>
  <text class="augment-or-preprocess-desc" x="46" y="142">A larger dataset.</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r0" x="46" y="182">Each image transformed a fixed number of times</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r1" x="46" y="216">Stored, and reused every epoch</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r2" x="46" y="250">The model can still memorise them</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r3" x="46" y="284">Disk usage multiplies</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r4" x="46" y="318">A weak version of the benefit</text>
  <rect class="augment-or-preprocess-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="augment-or-preprocess-name" x="526" y="122">Every epoch, on the fly</text>
  <text class="augment-or-preprocess-desc" x="526" y="142">A regulariser.</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r0" x="526" y="182">A new random transformation each pass</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r1" x="526" y="216">Effectively unbounded variation</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r2" x="526" y="250">Memorisation stops helping</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r3" x="526" y="284">No extra storage at all</text>
  <text class="augment-or-preprocess-desc augment-or-preprocess-row augment-or-preprocess-r4" x="526" y="318">This is what augmentation means</text>
  <text class="augment-or-preprocess-sub" x="30" y="372">The distinction rarely appears in a metric until the validation curve diverges, which is why it is worth getting right at the start rather than diagnosing later.</text>
</svg>
