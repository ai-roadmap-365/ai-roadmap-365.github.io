<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Conditions the trainee will not otherwise meet.">
  <title>A flight simulator</title>
  <style>
    .flight-simulator-bg   { fill: #f8fafc; }
    .flight-simulator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flight-simulator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flight-simulator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flight-simulator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flight-simulator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .flight-simulator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flight-simulator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .flight-simulator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .flight-simulator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .flight-simulator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .flight-simulator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .flight-simulator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .flight-simulator-row { opacity: 1; }
    .flight-simulator-r0 { animation-delay: 0.00s; }
    .flight-simulator-r1 { animation-delay: 0.45s; }
    .flight-simulator-r2 { animation-delay: 0.90s; }
    .flight-simulator-r3 { animation-delay: 1.35s; }
    .flight-simulator-r4 { animation-delay: 1.80s; }
    .flight-simulator-row { animation: flight-simulator-reveal 7.3s ease-in-out infinite; }
    @keyframes flight-simulator-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="flight-simulator-bg" width="980" height="390"/>
  <text class="flight-simulator-h1"  x="30" y="40">A flight simulator</text>
  <text class="flight-simulator-sub" x="30" y="64">Conditions the trainee will not otherwise meet.</text>
  <rect class="flight-simulator-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="flight-simulator-name" x="46" y="122">Fair weather only</text>
  <text class="flight-simulator-desc" x="46" y="142">Competent, and brittle.</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r0" x="46" y="182">Every training flight in clear conditions</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r1" x="46" y="216">The trainee handles them perfectly</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r2" x="46" y="250">Crosswinds never encountered</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r3" x="46" y="284">Instrument failure never encountered</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r4" x="46" y="318">First encounter is in the real aircraft</text>
  <rect class="flight-simulator-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="flight-simulator-name" x="526" y="122">A simulator</text>
  <text class="flight-simulator-desc" x="526" y="142">Deliberately varied.</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r0" x="526" y="182">Crosswinds, rain, night approaches</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r1" x="526" y="216">Engine failure on takeoff</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r2" x="526" y="250">Conditions the trainee must handle</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r3" x="526" y="284">None of them change what a landing is</text>
  <text class="flight-simulator-desc flight-simulator-row flight-simulator-r4" x="526" y="318">This is augmentation</text>
  <text class="flight-simulator-sub" x="30" y="372">"None of them change what a landing is" is exactly the invariance claim: the conditions vary and the correct response does not, which is what the transformation is asserting.</text>
</svg>
