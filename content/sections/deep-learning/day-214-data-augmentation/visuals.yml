visuals:
  - id: data-augmentation-taxonomy-transforms
    file: assets/data-augmentation-taxonomy-transforms.svg
    type: diagram
    title: 'Computer Vision Data Augmentation Taxonomy'
    alt: Taxonomy of computer vision data augmentation techniques categorized into geometric transformations photometric alterations and advanced mixing strategies
    description: Visual taxonomy structuring data augmentations into geometric transforms, photometric adjustments, and cross-sample mixing regularizers.
  - id: mixup-cutmix-mathematical-formulation
    file: assets/mixup-cutmix-mathematical-formulation.svg
    type: diagram
    title: 'MixUp and CutMix Visual & Mathematical Formulations'
    alt: Mathematical and visual formulation of MixUp and CutMix image regularizers blending pixels and interpolating class probability targets
    description: Mathematical and architectural comparison of MixUp linear convex interpolation against CutMix bounding box patch replacement.
  - id: augmentation-purpose
    file: assets/augmentation-purpose.svg
    type: diagram
    title: 'What augmentation encodes'
    alt: 'Diagram: how augmentation encodes domain knowledge as transformations'
    description: 'A four-stage description of augmentation covering the invariance claim, the transformation, per-epoch randomness and the regularising effect.'
  - id: augment-or-preprocess
    file: assets/augment-or-preprocess.svg
    type: diagram
    title: 'Applied once, or every epoch'
    alt: 'Diagram: augmentation applied at preprocessing compared with per-epoch augmentation'
    description: 'A two-column comparison of one-time augmentation against stochastic per-epoch augmentation.'
  - id: augmentation-families
    file: assets/augmentation-families.svg
    type: diagram
    title: 'Four families of transformation'
    alt: 'Diagram: the four families of image augmentation'
    description: 'A four-stage description of augmentation families covering geometric transforms, photometric jitter, sample mixing and automated policies.'
  - id: mixup-cutmix
    file: assets/mixup-cutmix.svg
    type: diagram
    title: 'MixUp and CutMix'
    alt: 'Diagram: MixUp blending compared with CutMix patch replacement'
    description: 'A four-stage description of sample mixing covering the MixUp blend, the CutMix patch, the label proportion and the loss requirement.'
  - id: augment-domain
    file: assets/augment-domain.svg
    type: diagram
    title: 'Augmentation is domain-specific'
    alt: 'Diagram: valid augmentation compared with label-corrupting augmentation'
    description: 'A two-column comparison of augmentations that preserve the label against those that change it.'
  - id: flight-simulator
    file: assets/flight-simulator.svg
    type: diagram
    title: 'A flight simulator'
    alt: 'Diagram: training in fair conditions compared with a simulator''s varied scenarios'
    description: 'A two-column comparison of training only in ideal conditions against deliberately varied ones.'
  - id: augmentation-problems
    file: assets/augmentation-problems.svg
    type: diagram
    title: 'Three failures augmentation addresses'
    alt: 'Diagram: the three failure modes data augmentation addresses'
    description: 'A three-stage description of augmentation benefits covering memorisation, spurious correlation and brittleness to nuisance variation.'
  - id: augmentation-implications
    file: assets/augmentation-implications.svg
    type: diagram
    title: 'Four consequences of augmenting'
    alt: 'Diagram: the compute, tuning, evaluation and interaction implications of augmentation'
    description: 'A four-stage description of augmentation implications covering CPU cost, over-augmentation, evaluation determinism and interaction with regularisers.'
  - id: augmentation-when
    file: assets/augmentation-when.svg
    type: diagram
    title: 'How much to augment'
    alt: 'Diagram: choosing an augmentation strength'
    description: 'A two-column comparison of light and heavy augmentation regimes by dataset size and training length.'
