terms:
  - term: 'Data Augmentation'
    definition: 'Techniques used to increase the diversity of training data without collecting new real samples by applying realistic synthetic transformations.'
  - term: 'MixUp'
    definition: 'A data augmentation technique that creates convex linear interpolations between pairs of images and their corresponding one-hot labels.'
  - term: 'CutMix'
    definition: 'A data augmentation strategy that cuts a rectangular region from one image and pastes it onto another, with label weights proportional to the area.'
  - term: 'Cutout'
    definition: 'Randomly masking out square regions of an input image with zeros or mean pixel values to enforce distributed feature learning.'
  - term: 'RandAugment'
    definition: 'An automated augmentation policy parameterized by only two values: number of sequential transforms N and global magnitude M.'
  - term: 'Color Jitter'
    definition: 'Randomly altering the brightness, contrast, saturation, and hue of an image to induce lighting invariance.'
  - term: 'Random Resized Crop'
    definition: 'Cropping a random bounding box with variable aspect ratio from an image and resizing it to target model resolution.'
  - term: 'Domain Invariance'
    definition: 'The property where a model prediction remains constant when input data undergoes task-irrelevant physical transformations.'
