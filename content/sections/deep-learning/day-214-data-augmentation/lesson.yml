learning_promise: 'Master modern Computer Vision Data Augmentation: geometric transforms, photometric jitter, regularizing mixing algorithms (MixUp, CutMix, Random Erasing), automated policies (RandAugment), and production pipelines using torchvision.transforms.v2.'
objectives:
  - 'Differentiate between training-time stochastic augmentation and deterministic validation/testing preprocessing.'
  - 'Apply geometric (flips, random crops, affine) and photometric (color jitter, blur) transformations in PyTorch.'
  - 'Derive and implement MixUp convex linear interpolation and CutMix spatial patch masking from mathematical first principles.'
  - 'Construct high-throughput GPU-accelerated vision pipelines using torchvision.transforms.v2.'
  - 'Analyze the inductive biases of translation, rotation, scale, and lighting invariance.'
