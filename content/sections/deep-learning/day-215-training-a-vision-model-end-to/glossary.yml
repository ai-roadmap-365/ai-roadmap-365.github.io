terms:
  - term: 'Automatic Mixed Precision'
    definition: 'A training technique that executes operations in FP16/BF16 where safe to double throughput while keeping weights in FP32.'
  - term: 'GradScaler'
    definition: 'A dynamic loss scaling controller that scales loss values up before backpropagation to prevent underflow in FP16 gradients.'
  - term: 'Top-1 Accuracy'
    definition: 'The percentage of test samples where the single highest-probability predicted class matches the true class label.'
  - term: 'Top-5 Accuracy'
    definition: 'The percentage of test samples where the true class label is contained within the model top 5 predicted classes.'
  - term: 'Pinned Memory'
    definition: 'Page-locked host memory that can be transferred directly to GPU memory via DMA without CPU staging.'
  - term: 'Confusion Matrix'
    definition: 'A square matrix where rows represent actual classes and columns represent predicted classes, visualizing error patterns.'
  - term: 'Macro F1'
    definition: 'The unweighted arithmetic mean of F1 scores across all classes, evaluating performance equally across imbalanced classes.'
  - term: 'Checkpointing'
    definition: 'Atomically serializing the complete state of a model, optimizer, scheduler, and training progress to non-volatile storage.'
