learning_promise: 'Build and execute an industrial-grade Computer Vision training harness in PyTorch: orchestrate custom image datasets, mixed-precision GPU execution (torch.cuda.amp), learning rate scheduling, multi-metric evaluation (Top-1/Top-5 accuracy, Confusion Matrices), and atomic checkpointing.'
objectives:
  - 'Construct a robust PyTorch vision training pipeline with ImageFolder and DataLoader optimizations.'
  - 'Implement Automatic Mixed Precision (AMP) using autocast and GradScaler for 2x faster GPU training.'
  - 'Calculate Top-1 and Top-5 classification accuracy from raw model logits.'
  - 'Compute and interpret normalized multi-class confusion matrices and Macro F1 scores.'
  - 'Implement an industrial Trainer harness with Early Stopping and atomic checkpoint saving.'
