<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Instruments, checklists and recorded state.">
  <title>A flight management system</title>
  <style>
    .cockpit-harness-bg   { fill: #f8fafc; }
    .cockpit-harness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-harness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-harness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-harness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-harness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-harness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-harness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cockpit-harness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cockpit-harness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cockpit-harness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cockpit-harness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cockpit-harness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-harness-row { opacity: 1; }
    .cockpit-harness-r0 { animation-delay: 0.00s; }
    .cockpit-harness-r1 { animation-delay: 0.45s; }
    .cockpit-harness-r2 { animation-delay: 0.90s; }
    .cockpit-harness-r3 { animation-delay: 1.35s; }
    .cockpit-harness-r4 { animation-delay: 1.80s; }
    .cockpit-harness-row { animation: cockpit-harness-reveal 7.3s ease-in-out infinite; }
    @keyframes cockpit-harness-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cockpit-harness-bg" width="980" height="390"/>
  <text class="cockpit-harness-h1"  x="30" y="40">A flight management system</text>
  <text class="cockpit-harness-sub" x="30" y="64">Instruments, checklists and recorded state.</text>
  <rect class="cockpit-harness-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-harness-name" x="46" y="122">Managed</text>
  <text class="cockpit-harness-desc" x="46" y="142">Instrumented throughout.</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r0" x="46" y="182">Every phase has a checklist</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r1" x="46" y="216">Instruments report continuously</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r2" x="46" y="250">State recorded for the whole flight</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r3" x="46" y="284">A diversion is a procedure, not a panic</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r4" x="46" y="318">Repeatable by any qualified crew</text>
  <rect class="cockpit-harness-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-harness-name" x="526" y="122">Unmanaged</text>
  <text class="cockpit-harness-desc" x="526" y="142">Skill, and memory.</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r0" x="526" y="182">Steps performed from memory</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r1" x="526" y="216">Something is eventually forgotten</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r2" x="526" y="250">No record of what was done</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r3" x="526" y="284">Recovery depends on the individual</text>
  <text class="cockpit-harness-desc cockpit-harness-row cockpit-harness-r4" x="526" y="318">And nobody else can repeat the flight</text>
  <text class="cockpit-harness-sub" x="30" y="372">"Repeatable by any qualified crew" is the property a training harness provides: the result belongs to the configuration rather than to whoever happened to run it.</text>
</svg>
