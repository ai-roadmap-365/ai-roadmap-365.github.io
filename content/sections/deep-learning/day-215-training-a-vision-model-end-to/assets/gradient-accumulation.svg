<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A large batch on a small accelerator.">
  <title>Gradient accumulation</title>
  <style>
    .gradient-accumulation-bg   { fill: #f8fafc; }
    .gradient-accumulation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-accumulation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-accumulation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-accumulation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-accumulation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-accumulation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradient-accumulation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradient-accumulation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradient-accumulation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradient-accumulation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradient-accumulation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradient-accumulation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradient-accumulation-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradient-accumulation-stage { opacity: 1; }

    .gradient-accumulation-s0 { animation-delay: 0.00s; }
    .gradient-accumulation-e0 { animation-delay: 0.00s; }
    .gradient-accumulation-s1 { animation-delay: 1.28s; }
    .gradient-accumulation-e1 { animation-delay: 1.28s; }
    .gradient-accumulation-s2 { animation-delay: 2.56s; }
    .gradient-accumulation-e2 { animation-delay: 2.56s; }
    .gradient-accumulation-s3 { animation-delay: 3.84s; }
    .gradient-accumulation-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradient-accumulation-conn  { animation: gradient-accumulation-trace 6.4s ease-in-out infinite; }
      .gradient-accumulation-stage { animation: gradient-accumulation-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradient-accumulation-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradient-accumulation-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradient-accumulation-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradient-accumulation-stage { animation: gradient-accumulation-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradient-accumulation-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradient-accumulation-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradient-accumulation-bg" width="980" height="322"/>
  <text class="gradient-accumulation-h1"  x="30" y="40">Gradient accumulation</text>
  <text class="gradient-accumulation-sub" x="30" y="64">A large batch on a small accelerator.</text>
  <g class="gradient-accumulation-stage gradient-accumulation-s0">
    <rect class="gradient-accumulation-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-accumulation-step" x="44" y="142">01</text>
    <text class="gradient-accumulation-name" x="70" y="142">Split the batch into micro-batches</text>
    <text class="gradient-accumulation-desc" x="44" y="166">Each small enough to fit in</text>
    <text class="gradient-accumulation-desc" x="44" y="182">memory.</text>
  </g>
  <line class="gradient-accumulation-line gradient-accumulation-conn gradient-accumulation-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradient-accumulation-tip)"/>
  <g class="gradient-accumulation-stage gradient-accumulation-s1">
    <rect class="gradient-accumulation-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-accumulation-step" x="280" y="142">02</text>
    <text class="gradient-accumulation-name" x="306" y="142">Backward on each, without stepping</text>
    <text class="gradient-accumulation-desc" x="280" y="166">Gradients accumulate rather than</text>
    <text class="gradient-accumulation-desc" x="280" y="182">being replaced.</text>
    <text class="gradient-accumulation-edge" x="280" y="242">by design</text>
  </g>
  <line class="gradient-accumulation-line gradient-accumulation-conn gradient-accumulation-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradient-accumulation-tip)"/>
  <g class="gradient-accumulation-stage gradient-accumulation-s2">
    <rect class="gradient-accumulation-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-accumulation-step" x="516" y="142">03</text>
    <text class="gradient-accumulation-name" x="542" y="142">Step after the last micro-batch</text>
    <text class="gradient-accumulation-desc" x="516" y="166">The update reflects the full</text>
    <text class="gradient-accumulation-desc" x="516" y="182">effective batch.</text>
  </g>
  <line class="gradient-accumulation-line gradient-accumulation-conn gradient-accumulation-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradient-accumulation-tip)"/>
  <g class="gradient-accumulation-stage gradient-accumulation-s3">
    <rect class="gradient-accumulation-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-accumulation-step" x="752" y="142">04</text>
    <text class="gradient-accumulation-name" x="778" y="142">Scale the loss per micro-batch</text>
    <text class="gradient-accumulation-desc" x="752" y="166">Or the gradient magnitude scales</text>
    <text class="gradient-accumulation-desc" x="752" y="182">with the number of</text>
    <text class="gradient-accumulation-desc" x="752" y="198">micro-batches.</text>
  </g>
  <text class="gradient-accumulation-sub" x="30" y="304">The scaling caveat is the bug people hit: without dividing the loss, an eight-step accumulation produces gradients eight times too large and a learning rate that is effectively eight times higher.</text>
</svg>
