<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One parameter, fitted after training.">
  <title>Calibrating confidence</title>
  <style>
    .calibration-bg   { fill: #f8fafc; }
    .calibration-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .calibration-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .calibration-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .calibration-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .calibration-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .calibration-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .calibration-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .calibration-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .calibration-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .calibration-stage { opacity: 1; }

    .calibration-s0 { animation-delay: 0.00s; }
    .calibration-e0 { animation-delay: 0.00s; }
    .calibration-s1 { animation-delay: 1.28s; }
    .calibration-e1 { animation-delay: 1.28s; }
    .calibration-s2 { animation-delay: 2.56s; }
    .calibration-e2 { animation-delay: 2.56s; }
    .calibration-s3 { animation-delay: 3.84s; }
    .calibration-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .calibration-conn  { animation: calibration-trace 6.4s ease-in-out infinite; }
      .calibration-stage { animation: calibration-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes calibration-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes calibration-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .calibration-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .calibration-stage { animation: calibration-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes calibration-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="calibration-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="calibration-bg" width="980" height="322"/>
  <text class="calibration-h1"  x="30" y="40">Calibrating confidence</text>
  <text class="calibration-sub" x="30" y="64">One parameter, fitted after training.</text>
  <g class="calibration-stage calibration-s0">
    <rect class="calibration-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-step" x="44" y="142">01</text>
    <text class="calibration-name" x="70" y="142">Softmax outputs are overconfident</text>
    <text class="calibration-desc" x="44" y="166">A model saying 99% may be right</text>
    <text class="calibration-desc" x="44" y="182">90% of the time.</text>
  </g>
  <line class="calibration-line calibration-conn calibration-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#calibration-tip)"/>
  <g class="calibration-stage calibration-s1">
    <rect class="calibration-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-step" x="280" y="142">02</text>
    <text class="calibration-name" x="306" y="142">Divide the logits by a temperature</text>
    <text class="calibration-desc" x="280" y="166">One scalar, softening or</text>
    <text class="calibration-desc" x="280" y="182">sharpening the distribution.</text>
  </g>
  <line class="calibration-line calibration-conn calibration-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#calibration-tip)"/>
  <g class="calibration-stage calibration-s2">
    <rect class="calibration-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-step" x="516" y="142">03</text>
    <text class="calibration-name" x="542" y="142">Fit it on a held-out set</text>
    <text class="calibration-desc" x="516" y="166">After training. It does not</text>
    <text class="calibration-desc" x="516" y="182">change any prediction's ranking.</text>
    <text class="calibration-edge" x="516" y="242">one parameter</text>
  </g>
  <line class="calibration-line calibration-conn calibration-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#calibration-tip)"/>
  <g class="calibration-stage calibration-s3">
    <rect class="calibration-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="calibration-step" x="752" y="142">04</text>
    <text class="calibration-name" x="778" y="142">Which matters wherever confidence is used</text>
    <text class="calibration-desc" x="752" y="166">Triage thresholds, abstention,</text>
    <text class="calibration-desc" x="752" y="182">downstream decisions.</text>
  </g>
  <text class="calibration-sub" x="30" y="304">Temperature scaling not changing the argmax is what makes it safe to adopt: accuracy is untouched, and the reported confidence becomes something you can act on.</text>
</svg>
