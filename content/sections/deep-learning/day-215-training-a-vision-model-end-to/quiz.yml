questions:
  - question: 'What is the purpose of torch.cuda.amp.GradScaler in mixed-precision FP16 training?'
    options:
      - 'It doubles the learning rate after every epoch'
      - 'It scales up the image resolution from 224x224 to 4K'
      - 'It scales the loss so small gradients survive fp16'
      - 'It automatically increases the batch size'
    answer_index: 2
    explanation: 'In FP16, exponent ranges are narrow (min positive normal is ~6e-5). Small gradients underflow to zero unless scaled up during backward and unscaled before optimizer step.'
  - question: 'How is Top-5 accuracy calculated given a model logit tensor of shape (N, C) and integer target labels of shape (N,)?'
    options:
      - 'Take the 5th highest logit and check if it equals the target'
      - 'Average the top 5 class probabilities and check if the sum is greater than 0.5'
      - 'Multiply the top 5 predictions together'
      - 'Correct if the true class is among the top 5 logits'
    answer_index: 3
    explanation: 'Top-5 accuracy evaluates whether the correct class is among the top 5 most confident model predictions.'
  - question: 'Why is pin_memory=True recommended in PyTorch DataLoaders when training on CUDA GPUs?'
    options:
      - 'It uses pinned memory for asynchronous GPU transfers'
      - 'It prevents the CPU from running out of disk space'
      - 'It pins the neural network layers to specific CPU threads'
      - 'It prevents images from being cropped'
    answer_index: 0
    explanation: 'Pinned host memory enables non-blocking asynchronous DMA copies directly to GPU VRAM without intermediate CPU buffer copying.'
  - question: 'What does an off-diagonal element at row i, column j represent in a Confusion Matrix?'
    options:
      - 'The learning rate of class i'
      - 'Samples of class i that were predicted as class j'
      - 'The total number of parameters in layer i'
      - 'The execution time of batch j'
    answer_index: 1
    explanation: 'In standard confusion matrices, rows represent true classes and columns represent predicted classes. Off-diagonal entries represent misclassifications.'
  - question: 'What should be saved inside an atomic PyTorch training checkpoint file (.pt) to ensure exact reproducibility and resumption of a vision training run?'
    options:
      - 'The raw image training files'
      - 'Only the final accuracy float number'
      - 'Model, optimizer, scheduler, scaler, epoch, metric, config'
      - 'A screenshot of the loss curve'
    answer_index: 2
    explanation: 'A complete checkpoint must save all state dictionaries (model, optimizer, scheduler, scaler) plus metadata (epoch, best metric, config) to allow seamless resumption.'
