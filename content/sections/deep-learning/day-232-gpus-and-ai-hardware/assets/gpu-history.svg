<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="None of them planned for AI.">
  <title>Four steps to the AI accelerator</title>
  <style>
    .gpu-history-bg   { fill: #f8fafc; }
    .gpu-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gpu-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gpu-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gpu-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gpu-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gpu-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gpu-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gpu-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gpu-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gpu-history-stage { opacity: 1; }

    .gpu-history-s0 { animation-delay: 0.00s; }
    .gpu-history-e0 { animation-delay: 0.00s; }
    .gpu-history-s1 { animation-delay: 1.28s; }
    .gpu-history-e1 { animation-delay: 1.28s; }
    .gpu-history-s2 { animation-delay: 2.56s; }
    .gpu-history-e2 { animation-delay: 2.56s; }
    .gpu-history-s3 { animation-delay: 3.84s; }
    .gpu-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gpu-history-conn  { animation: gpu-history-trace 6.4s ease-in-out infinite; }
      .gpu-history-stage { animation: gpu-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gpu-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gpu-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gpu-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gpu-history-stage { animation: gpu-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gpu-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gpu-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gpu-history-bg" width="980" height="322"/>
  <text class="gpu-history-h1"  x="30" y="40">Four steps to the AI accelerator</text>
  <text class="gpu-history-sub" x="30" y="64">None of them planned for AI.</text>
  <g class="gpu-history-stage gpu-history-s0">
    <rect class="gpu-history-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-history-step" x="44" y="142">01</text>
    <text class="gpu-history-name" x="70" y="142">Hardware built for graphics</text>
    <text class="gpu-history-desc" x="44" y="166">Shading millions of pixels with</text>
    <text class="gpu-history-desc" x="44" y="182">the same operation.</text>
  </g>
  <line class="gpu-history-line gpu-history-conn gpu-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gpu-history-tip)"/>
  <g class="gpu-history-stage gpu-history-s1">
    <rect class="gpu-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-history-step" x="280" y="142">02</text>
    <text class="gpu-history-name" x="306" y="142">Opened to general programming</text>
    <text class="gpu-history-desc" x="280" y="166">Which scientists immediately</text>
    <text class="gpu-history-desc" x="280" y="182">used for linear algebra.</text>
  </g>
  <line class="gpu-history-line gpu-history-conn gpu-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gpu-history-tip)"/>
  <g class="gpu-history-stage gpu-history-s2">
    <rect class="gpu-history-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-history-step" x="516" y="142">03</text>
    <text class="gpu-history-name" x="542" y="142">A vision model trained on two of them</text>
    <text class="gpu-history-desc" x="516" y="166">And won a competition by a</text>
    <text class="gpu-history-desc" x="516" y="182">margin nobody could ignore.</text>
  </g>
  <line class="gpu-history-line gpu-history-conn gpu-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gpu-history-tip)"/>
  <g class="gpu-history-stage gpu-history-s3">
    <rect class="gpu-history-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gpu-history-step" x="752" y="142">04</text>
    <text class="gpu-history-name" x="778" y="142">Then matrix units built for the purpose</text>
    <text class="gpu-history-desc" x="752" y="166">Hardware shaped by the workload</text>
    <text class="gpu-history-desc" x="752" y="182">rather than borrowed.</text>
  </g>
  <text class="gpu-history-sub" x="30" y="304">The accidental part is the interesting part: the hardware that enabled deep learning existed for entirely unrelated commercial reasons, and the field grew into a capability that was already there.</text>
</svg>
