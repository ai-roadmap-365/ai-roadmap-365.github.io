<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Depends on the order.">
  <title>One expert baker, or fifty apprentices</title>
  <style>
    .bakery-bg   { fill: #f8fafc; }
    .bakery-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bakery-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bakery-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bakery-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bakery-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bakery-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bakery-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bakery-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bakery-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bakery-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bakery-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bakery-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bakery-row { opacity: 1; }
    .bakery-r0 { animation-delay: 0.00s; }
    .bakery-r1 { animation-delay: 0.45s; }
    .bakery-r2 { animation-delay: 0.90s; }
    .bakery-r3 { animation-delay: 1.35s; }
    .bakery-r4 { animation-delay: 1.80s; }
    .bakery-row { animation: bakery-reveal 7.3s ease-in-out infinite; }
    @keyframes bakery-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bakery-bg" width="980" height="390"/>
  <text class="bakery-h1"  x="30" y="40">One expert baker, or fifty apprentices</text>
  <text class="bakery-sub" x="30" y="64">Depends on the order.</text>
  <rect class="bakery-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bakery-name" x="46" y="122">One expert baker</text>
  <text class="bakery-desc" x="46" y="142">Anything, one at a time.</text>
  <text class="bakery-desc bakery-row bakery-r0" x="46" y="182">Handles any recipe</text>
  <text class="bakery-desc bakery-row bakery-r1" x="46" y="216">Fast at complex, varied work</text>
  <text class="bakery-desc bakery-row bakery-r2" x="46" y="250">Switches task instantly</text>
  <text class="bakery-desc bakery-row bakery-r3" x="46" y="284">One order at a time</text>
  <text class="bakery-desc bakery-row bakery-r4" x="46" y="318">This is a general-purpose processor</text>
  <rect class="bakery-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bakery-name" x="526" y="122">Fifty apprentices</text>
  <text class="bakery-desc" x="526" y="142">One thing, all at once.</text>
  <text class="bakery-desc bakery-row bakery-r0" x="526" y="182">All doing the identical step</text>
  <text class="bakery-desc bakery-row bakery-r1" x="526" y="216">Useless for varied work</text>
  <text class="bakery-desc bakery-row bakery-r2" x="526" y="250">Enormous throughput on uniform orders</text>
  <text class="bakery-desc bakery-row bakery-r3" x="526" y="284">Thousands of loaves at once</text>
  <text class="bakery-desc bakery-row bakery-r4" x="526" y="318">This is an accelerator</text>
  <text class="bakery-sub" x="30" y="372">The analogy holds precisely on the failure case: give the apprentices fifty different recipes and the arrangement collapses, which is exactly what branching does to parallel hardware.</text>
</svg>
