<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Control against productivity.">
  <title>Two ways to write a kernel</title>
  <style>
    .kernel-languages-bg   { fill: #f8fafc; }
    .kernel-languages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-languages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-languages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-languages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-languages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-languages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-languages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kernel-languages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kernel-languages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kernel-languages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kernel-languages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kernel-languages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-languages-row { opacity: 1; }
    .kernel-languages-r0 { animation-delay: 0.00s; }
    .kernel-languages-r1 { animation-delay: 0.45s; }
    .kernel-languages-r2 { animation-delay: 0.90s; }
    .kernel-languages-r3 { animation-delay: 1.35s; }
    .kernel-languages-r4 { animation-delay: 1.80s; }
    .kernel-languages-row { animation: kernel-languages-reveal 7.3s ease-in-out infinite; }
    @keyframes kernel-languages-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kernel-languages-bg" width="980" height="390"/>
  <text class="kernel-languages-h1"  x="30" y="40">Two ways to write a kernel</text>
  <text class="kernel-languages-sub" x="30" y="64">Control against productivity.</text>
  <rect class="kernel-languages-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-languages-name" x="46" y="122">Low-level</text>
  <text class="kernel-languages-desc" x="46" y="142">Every detail is yours.</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r0" x="46" y="182">Manual thread and memory management</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r1" x="46" y="216">Explicit synchronisation barriers</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r2" x="46" y="250">Highest achievable performance</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r3" x="46" y="284">Weeks per kernel</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r4" x="46" y="318">And easy to get subtly wrong</text>
  <rect class="kernel-languages-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kernel-languages-name" x="526" y="122">High-level</text>
  <text class="kernel-languages-desc" x="526" y="142">Blocks, not threads.</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r0" x="526" y="182">Written in a familiar language</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r1" x="526" y="216">The compiler handles scheduling</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r2" x="526" y="250">Usually within a small margin of hand-tuned</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r3" x="526" y="284">Days per kernel</text>
  <text class="kernel-languages-desc kernel-languages-row kernel-languages-r4" x="526" y="318">Which is why most new kernels use it</text>
  <text class="kernel-languages-sub" x="30" y="372">Reaching close to hand-tuned performance from a Python-like language is what changed here: custom kernels stopped being the preserve of a small number of specialists.</text>
</svg>
