<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Supply included.">
  <title>Four consequences of accelerator economics</title>
  <style>
    .hardware-implications-bg   { fill: #f8fafc; }
    .hardware-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hardware-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hardware-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hardware-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hardware-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hardware-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hardware-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hardware-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .hardware-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .hardware-implications-stage { opacity: 1; }

    .hardware-implications-s0 { animation-delay: 0.00s; }
    .hardware-implications-e0 { animation-delay: 0.00s; }
    .hardware-implications-s1 { animation-delay: 1.28s; }
    .hardware-implications-e1 { animation-delay: 1.28s; }
    .hardware-implications-s2 { animation-delay: 2.56s; }
    .hardware-implications-e2 { animation-delay: 2.56s; }
    .hardware-implications-s3 { animation-delay: 3.84s; }
    .hardware-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .hardware-implications-conn  { animation: hardware-implications-trace 6.4s ease-in-out infinite; }
      .hardware-implications-stage { animation: hardware-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes hardware-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes hardware-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .hardware-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .hardware-implications-stage { animation: hardware-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes hardware-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="hardware-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="hardware-implications-bg" width="980" height="322"/>
  <text class="hardware-implications-h1"  x="30" y="40">Four consequences of accelerator economics</text>
  <text class="hardware-implications-sub" x="30" y="64">Supply included.</text>
  <g class="hardware-implications-stage hardware-implications-s0">
    <rect class="hardware-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="hardware-implications-step" x="44" y="142">01</text>
    <text class="hardware-implications-name" x="70" y="142">Capital cost is substantial</text>
    <text class="hardware-implications-desc" x="44" y="166">A single training node costs as</text>
    <text class="hardware-implications-desc" x="44" y="182">much as a house.</text>
  </g>
  <line class="hardware-implications-line hardware-implications-conn hardware-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#hardware-implications-tip)"/>
  <g class="hardware-implications-stage hardware-implications-s1">
    <rect class="hardware-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="hardware-implications-step" x="280" y="142">02</text>
    <text class="hardware-implications-name" x="306" y="142">And supply is constrained</text>
    <text class="hardware-implications-desc" x="280" y="166">Lead times measured in quarters,</text>
    <text class="hardware-implications-desc" x="280" y="182">not days.</text>
  </g>
  <line class="hardware-implications-line hardware-implications-conn hardware-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#hardware-implications-tip)"/>
  <g class="hardware-implications-stage hardware-implications-s2">
    <rect class="hardware-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="hardware-implications-step" x="516" y="142">03</text>
    <text class="hardware-implications-name" x="542" y="142">Power and cooling bound the site</text>
    <text class="hardware-implications-desc" x="516" y="166">Often before the budget does.</text>
  </g>
  <line class="hardware-implications-line hardware-implications-conn hardware-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#hardware-implications-tip)"/>
  <g class="hardware-implications-stage hardware-implications-s3">
    <rect class="hardware-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="hardware-implications-step" x="752" y="142">04</text>
    <text class="hardware-implications-name" x="778" y="142">And the software stack locks you in</text>
    <text class="hardware-implications-desc" x="752" y="166">Portability is improving but is</text>
    <text class="hardware-implications-desc" x="752" y="182">not yet free.</text>
  </g>
  <text class="hardware-implications-sub" x="30" y="304">Power has become the binding constraint for many operators, which is why efficiency per watt now shapes hardware choice more than peak throughput does.</text>
</svg>
