<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four levels of grouping.">
  <title>Inside one processing unit</title>
  <style>
    .sm-engine-bg   { fill: #f8fafc; }
    .sm-engine-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm-engine-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm-engine-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm-engine-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm-engine-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm-engine-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .sm-engine-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .sm-engine-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .sm-engine-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sm-engine-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .sm-engine-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .sm-engine-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .sm-engine-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .sm-engine-stage { opacity: 1; }

    .sm-engine-s0 { animation-delay: 0.00s; }
    .sm-engine-e0 { animation-delay: 0.00s; }
    .sm-engine-s1 { animation-delay: 1.28s; }
    .sm-engine-e1 { animation-delay: 1.28s; }
    .sm-engine-s2 { animation-delay: 2.56s; }
    .sm-engine-e2 { animation-delay: 2.56s; }
    .sm-engine-s3 { animation-delay: 3.84s; }
    .sm-engine-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .sm-engine-conn  { animation: sm-engine-trace 6.4s ease-in-out infinite; }
      .sm-engine-stage { animation: sm-engine-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes sm-engine-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes sm-engine-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .sm-engine-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .sm-engine-stage { animation: sm-engine-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes sm-engine-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="sm-engine-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="sm-engine-bg" width="980" height="322"/>
  <text class="sm-engine-h1"  x="30" y="40">Inside one processing unit</text>
  <text class="sm-engine-sub" x="30" y="64">Four levels of grouping.</text>
  <g class="sm-engine-stage sm-engine-s0">
    <rect class="sm-engine-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="sm-engine-step" x="44" y="142">01</text>
    <text class="sm-engine-name" x="70" y="142">The chip holds many processing units</text>
    <text class="sm-engine-desc" x="44" y="166">Over a hundred on a current</text>
    <text class="sm-engine-desc" x="44" y="182">training device.</text>
  </g>
  <line class="sm-engine-line sm-engine-conn sm-engine-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#sm-engine-tip)"/>
  <g class="sm-engine-stage sm-engine-s1">
    <rect class="sm-engine-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="sm-engine-step" x="280" y="142">02</text>
    <text class="sm-engine-name" x="306" y="142">Each runs many thread groups concurrently</text>
    <text class="sm-engine-desc" x="280" y="166">Switching between them to hide</text>
    <text class="sm-engine-desc" x="280" y="182">memory latency.</text>
  </g>
  <line class="sm-engine-line sm-engine-conn sm-engine-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#sm-engine-tip)"/>
  <g class="sm-engine-stage sm-engine-s2">
    <rect class="sm-engine-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="sm-engine-step" x="516" y="142">03</text>
    <text class="sm-engine-name" x="542" y="142">Threads execute in fixed-size lockstep groups</text>
    <text class="sm-engine-desc" x="516" y="166">All doing the same instruction,</text>
    <text class="sm-engine-desc" x="516" y="182">or waiting.</text>
  </g>
  <line class="sm-engine-line sm-engine-conn sm-engine-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#sm-engine-tip)"/>
  <g class="sm-engine-stage sm-engine-s3">
    <rect class="sm-engine-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="sm-engine-step" x="752" y="142">04</text>
    <text class="sm-engine-name" x="778" y="142">Plus dedicated matrix units</text>
    <text class="sm-engine-desc" x="752" y="166">Which do most of the arithmetic</text>
    <text class="sm-engine-desc" x="752" y="182">that matters.</text>
  </g>
  <text class="sm-engine-sub" x="30" y="304">The lockstep grouping is why branching hurts: when threads in a group take different paths, both paths execute and half the units sit idle for each.</text>
</svg>
