<svg role="img" aria-label="The Roofline Model diagram plotting Arithmetic Intensity vs Attainable Performance showing Memory Bound vs Compute Bound regimes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>The Roofline Model: Arithmetic Intensity &amp; Hardware Ceilings</title>
  <defs>
    <linearGradient id="bg232b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card232b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg232b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE ROOFLINE MODEL: MEMORY-BOUND VS. COMPUTE-BOUND</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Arithmetic Intensity I = FLOPs / Byte Transferred across HBM</text>
  <g transform="translate(65, 85)">
    <rect width="720" height="295" fill="url(#card232b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Axes -->
    <line x1="80" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <text x="370" y="270" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">Arithmetic Intensity (FLOPs / Byte)</text>

    <line x1="80" y1="240" x2="80" y2="30" stroke="#94a3b8" stroke-width="2"/>
    <text x="35" y="135" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 35 135)">Attainable Performance (TFLOPs/s)</text>

    <!-- Roofline Curve -->
    <!-- Sloped Memory-Bound Line: (80, 240) -> (360, 70) -->
    <line x1="80" y1="240" x2="360" y2="70" stroke="#f43f5e" stroke-width="4"/>
    <!-- Flat Compute-Bound Line: (360, 70) -> (640, 70) -->
    <line x1="360" y1="70" x2="640" y2="70" stroke="#10b981" stroke-width="4"/>

    <!-- Point of Inflexion / Machine Balance Ridge Point -->
    <circle cx="360" cy="70" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <text x="360" y="55" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Ridge Point (Machine Balance)</text>

    <!-- Memory Bound Area -->
    <text x="200" y="130" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">MEMORY-BANDWIDTH BOUND</text>
    <text x="200" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">Attainable = Intensity x Peak Bandwidth</text>
    <text x="200" y="170" fill="#94a3b8" font-size="8" text-anchor="middle">• LayerNorm, Dropout, Softmax</text>
    <text x="200" y="188" fill="#94a3b8" font-size="8" text-anchor="middle">• Single-Token Autoregressive Generation</text>

    <!-- Compute Bound Area -->
    <text x="510" y="100" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">COMPUTE BOUND</text>
    <text x="510" y="120" fill="#cbd5e1" font-size="8" text-anchor="middle">Attainable = Peak Tensor Core FLOPs</text>
    <text x="510" y="140" fill="#a7f3d0" font-size="8" text-anchor="middle">• Large Batch GEMM (Dense QKV Projections)</text>
    <text x="510" y="158" fill="#a7f3d0" font-size="8" text-anchor="middle">• Pretraining Large Transformer Batches</text>
  </g>
</svg>
