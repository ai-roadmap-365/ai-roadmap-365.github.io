questions:
  - question: 'What is the fundamental architectural difference between a CPU and a modern AI GPU (e.g. NVIDIA H100)?'
    options:
      - 'A CPU uses electricity while a GPU uses optical light'
      - 'A CPU optimises latency; a GPU optimises throughput'
      - 'A GPU cannot perform addition'
      - 'A CPU only runs Python'
    answer_index: 1
    explanation: 'CPUs optimize for sequential latency and branch prediction; GPUs optimize for massive parallel arithmetic throughput.'
  - question: 'What is Arithmetic Intensity (I) in the Roofline Model?'
    options:
      - 'The number of layers in the neural network'
      - 'The clock speed of the processor in Gigahertz'
      - 'FLOPs performed per byte moved from memory'
      - 'The temperature of the cooling liquid'
    answer_index: 2
    explanation: 'Arithmetic intensity measures how much computation is performed per byte of memory bandwidth consumed.'
  - question: 'Why is single-token autoregressive generation in LLMs almost always Memory-Bandwidth Bound rather than Compute Bound?'
    options:
      - 'Because Python executes single threads'
      - 'Because GPUs disable Tensor Cores during generation'
      - 'Because tokenizers use too much disk space'
      - 'Every token reloads all the weights from memory'
    answer_index: 3
    explanation: 'Batch-1 generation reads massive weight matrices from memory for minimal compute, saturating memory bandwidth while leaving ALUs mostly idle.'
  - question: 'How do Tensor Cores achieve an order-of-magnitude speedup over standard CUDA cores during deep learning training?'
    options:
      - 'Fused matrix multiply-accumulate per cycle'
      - 'They skip multiplying zeros'
      - 'They reduce the number of tokens in the prompt'
      - 'They run at 100 GHz clock speed'
    answer_index: 0
    explanation: 'Tensor Cores compute entire matrix multiply-accumulate tiles in single hardware clock cycles using mixed precision.'
  - question: 'What role does SRAM Shared Memory / L1 Cache play in modern GPU optimizations like FlashAttention?'
    options:
      - 'It stores operating system kernel logs'
      - 'Fast on-chip memory inside each SM'
      - 'It replaces the hard drive'
      - 'It encrypts network packets'
    answer_index: 1
    explanation: 'SRAM on-chip shared memory enables kernel fusion and block tiling, bypassing the HBM memory bandwidth bottleneck.'
