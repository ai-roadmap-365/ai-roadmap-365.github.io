terms:
  - term: 'Streaming Multiprocessor (SM)'
    definition: 'The fundamental compute building block of an NVIDIA GPU containing warp schedulers, CUDA cores, Tensor Cores, and SRAM shared memory.'
  - term: 'Tensor Core'
    definition: 'A specialized hardware execution unit executing fused mixed-precision matrix multiply-accumulate operations (D = A * B + C) in a single clock cycle.'
  - term: 'Arithmetic Intensity'
    definition: 'The ratio of arithmetic operations (FLOPs) to memory traffic (Bytes) transferred across High Bandwidth Memory: I = FLOPs / Byte.'
  - term: 'Roofline Model'
    definition: 'A visual performance model that plots attainable computational throughput against arithmetic intensity, bounding performance by memory bandwidth and peak compute ceilings.'
  - term: 'High Bandwidth Memory (HBM3e)'
    definition: '3D-stacked DRAM on the GPU interposer providing multi-terabyte-per-second memory bandwidth.'
  - term: 'SRAM Shared Memory'
    definition: 'Ultra-low-latency on-chip memory directly integrated into each SM, delivering ~19 TB/s aggregate bandwidth.'
  - term: 'Memory-Bound Operation'
    definition: 'An algorithm whose execution speed is limited by memory bandwidth transfer rates rather than processor arithmetic capacity.'
  - term: 'Compute-Bound Operation'
    definition: 'An algorithm whose execution speed is limited by raw processor arithmetic throughput rather than memory data transfer.'
