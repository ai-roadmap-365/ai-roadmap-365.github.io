section: deep-learning
subsection: sequence-models-and-transformers
week: 34
learning_promise: 'Master AI hardware architecture: compare GPUs, TPUs, and CPUs, understand Streaming Multiprocessors, Tensor Cores, High Bandwidth Memory (HBM), compute Arithmetic Intensity via the Roofline Model, diagnose memory-bandwidth vs compute bottlenecks in transformer training and inference, and write PyTorch GPU benchmarking harnesses.'
objectives:
  - 'Compare CPU latency-oriented architecture with GPU high-throughput SIMT (Single Instruction Multiple Threads) parallelism.'
  - 'Analyze the GPU memory hierarchy: Registers, SRAM Shared Memory, L2 Cache, and HBM3e High Bandwidth Memory.'
  - 'Explain how Tensor Cores execute fused matrix multiply-accumulate operations (D = A x B + C) in hardware.'
  - 'Apply the Roofline Model to calculate Arithmetic Intensity (FLOPs/Byte) and identify memory-bound vs compute-bound operations.'
  - 'Benchmark tensor operation throughput (TFLOPs/s and GB/s) in PyTorch across different precision modes.'
