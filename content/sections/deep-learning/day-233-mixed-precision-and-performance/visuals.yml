visuals:
  - id: floating-point-formats-fp32-fp16-bf16-fp8
    file: assets/floating-point-formats-fp32-fp16-bf16-fp8.svg
    type: diagram
    title: 'Floating-Point Formats: FP32, FP16, BF16, and FP8'
    alt: Floating point number formats comparison showing sign exponent and mantissa bits for FP32 FP16 BF16 and FP8
    description: 'Bitwise layout comparison across single precision FP32, half precision FP16, bfloat16 BF16, and micro-precision FP8 formats.'
  - id: automatic-mixed-precision-training-flow
    file: assets/automatic-mixed-precision-training-flow.svg
    type: diagram
    title: 'Automatic Mixed Precision (AMP) Workflow'
    alt: Automatic Mixed Precision training loop flow showing FP16 forward pass loss scaling backpropagation and FP32 optimizer update
    description: 'PyTorch Automatic Mixed Precision training loop with dynamic loss scaling and FP32 master weight updates.'
  - id: precision-idea
    file: assets/precision-idea.svg
    type: diagram
    title: 'Mixed precision, in four steps'
    alt: 'Diagram: how mixed-precision training combines low and full precision'
    description: 'A four-stage description of mixed-precision training covering low-precision matrix operations, full-precision sensitive operations, master weights and the resulting speedup.'
  - id: precision-history
    file: assets/precision-history.svg
    type: diagram
    title: 'Four steps to low-precision training'
    alt: 'Diagram: the historical progression of numerical formats in deep learning training'
    description: 'A four-stage description of precision history covering full precision, half precision with scaling, a wider-range format and eight-bit training.'
  - id: fp16-bf16
    file: assets/fp16-bf16.svg
    type: diagram
    title: 'Two sixteen-bit formats'
    alt: 'Diagram: two sixteen-bit floating point formats compared by range and precision'
    description: 'A two-column comparison of the two common sixteen-bit floating point formats.'
  - id: loss-scaling
    file: assets/loss-scaling.svg
    type: diagram
    title: 'Loss scaling'
    alt: 'Diagram: how dynamic loss scaling prevents gradient underflow in low precision'
    description: 'A four-stage description of loss scaling covering underflow, multiplication of the loss, unscaling before the update and dynamic adjustment.'
  - id: vram-budget
    file: assets/vram-budget.svg
    type: diagram
    title: 'Where the memory goes'
    alt: 'Diagram: the four consumers of training memory per parameter'
    description: 'A four-stage description of training memory covering parameters, gradients, optimiser state and activations.'
  - id: kernel-fusion
    file: assets/kernel-fusion.svg
    type: diagram
    title: 'Kernel fusion'
    alt: 'Diagram: separate elementwise kernels compared with one fused kernel'
    description: 'A four-stage description of kernel fusion covering separate operations, repeated memory traffic, fusion and the resulting speedup.'
  - id: eight-bit-optim
    file: assets/eight-bit-optim.svg
    type: diagram
    title: 'Eight-bit optimiser state'
    alt: 'Diagram: how quantised optimiser state reduces training memory'
    description: 'A four-stage description of eight-bit optimiser state covering the full-precision default, its size, block-wise quantisation and the memory saving.'
  - id: lecture-notes
    file: assets/lecture-notes.svg
    type: diagram
    title: 'Full notes, or shorthand'
    alt: 'Diagram: verbatim transcription compared with abbreviated note-taking'
    description: 'A two-column comparison of writing everything down against writing an abbreviation.'
  - id: precision-implications
    file: assets/precision-implications.svg
    type: diagram
    title: 'Four consequences of low precision'
    alt: 'Diagram: the throughput, memory, reproducibility and debugging implications of mixed precision'
    description: 'A four-stage description of mixed precision implications covering speed, capacity, reproducibility and silent failure modes.'
  - id: precision-when
    file: assets/precision-when.svg
    type: diagram
    title: 'When to use low precision'
    alt: 'Diagram: when mixed precision is appropriate and when full precision is required'
    description: 'A two-column comparison of workloads suited to mixed precision against those requiring full precision.'
