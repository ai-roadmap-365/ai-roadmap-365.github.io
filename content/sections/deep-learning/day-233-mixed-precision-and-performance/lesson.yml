learning_promise: 'Master mixed-precision acceleration and deep learning performance engineering: understand FP32, FP16, BF16, and FP8 numerical formats, implement PyTorch Automatic Mixed Precision (AMP) with autocast and dynamic loss scaling (GradScaler), analyze training VRAM memory allocation across weights and optimizer states, optimize execution with torch.compile, and build a high-throughput benchmarking suite.'
objectives:
  - 'Compare floating-point numerical representations: IEEE 754 FP32, FP16, Google BF16, and NVIDIA FP8 (E4M3/E5M2).'
  - 'Implement Automatic Mixed Precision (AMP) in PyTorch using torch.autocast and GradScaler.'
  - 'Explain gradient underflow in FP16 and derive the dynamic loss scaling algorithm.'
  - 'Calculate exact GPU VRAM memory breakdown during mixed-precision AdamW training.'
  - 'Apply PyTorch 2.0 torch.compile graph capture and kernel fusion to eliminate memory bandwidth bottlenecks.'
