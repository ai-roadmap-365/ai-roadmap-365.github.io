<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them keeps up.">
  <title>Full notes, or shorthand</title>
  <style>
    .lecture-notes-bg   { fill: #f8fafc; }
    .lecture-notes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lecture-notes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lecture-notes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lecture-notes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lecture-notes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lecture-notes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lecture-notes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lecture-notes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lecture-notes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lecture-notes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lecture-notes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lecture-notes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lecture-notes-row { opacity: 1; }
    .lecture-notes-r0 { animation-delay: 0.00s; }
    .lecture-notes-r1 { animation-delay: 0.45s; }
    .lecture-notes-r2 { animation-delay: 0.90s; }
    .lecture-notes-r3 { animation-delay: 1.35s; }
    .lecture-notes-r4 { animation-delay: 1.80s; }
    .lecture-notes-row { animation: lecture-notes-reveal 7.3s ease-in-out infinite; }
    @keyframes lecture-notes-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lecture-notes-bg" width="980" height="390"/>
  <text class="lecture-notes-h1"  x="30" y="40">Full notes, or shorthand</text>
  <text class="lecture-notes-sub" x="30" y="64">One of them keeps up.</text>
  <rect class="lecture-notes-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lecture-notes-name" x="46" y="122">Writing every word</text>
  <text class="lecture-notes-desc" x="46" y="142">Complete, and too slow.</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r0" x="46" y="182">Nothing lost</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r1" x="46" y="216">But you fall behind</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r2" x="46" y="250">Pages of paper used</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r3" x="46" y="284">Exhausting to sustain</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r4" x="46" y="318">This is full precision</text>
  <rect class="lecture-notes-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lecture-notes-name" x="526" y="122">Shorthand</text>
  <text class="lecture-notes-desc" x="526" y="142">Enough, and fast.</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r0" x="526" y="182">Detail dropped where it does not matter</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r1" x="526" y="216">But you keep pace</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r2" x="526" y="250">Half the paper</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r3" x="526" y="284">And you write the formulae out fully</text>
  <text class="lecture-notes-desc lecture-notes-row lecture-notes-r4" x="526" y="318">This is mixed precision</text>
  <text class="lecture-notes-sub" x="30" y="372">The last row is the analogy's real point: shorthand works because the few things that must be exact are still written out in full, which is precisely what mixed precision does with reductions and losses.</text>
</svg>
