<svg role="img" aria-label="Automatic Mixed Precision training loop flow showing FP16 forward pass loss scaling backpropagation and FP32 optimizer update" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Automatic Mixed Precision (AMP) Training Loop</title>
  <defs>
    <linearGradient id="bg233b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card233b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg233b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">AUTOMATIC MIXED PRECISION (AMP) WORKFLOW</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">FP16 / BF16 Fast Forward &amp; Backward Passes with FP32 Master Weight Optimization</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card233b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Step 1: FP32 Master Weights -->
    <rect x="25" y="30" width="145" height="100" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="97" y="55" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. FP32 Master</text>
    <text x="97" y="78" fill="#cbd5e1" font-size="9" text-anchor="middle">Weights &amp; Optimizer</text>
    <text x="97" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">Stable accumulation</text>
    <text x="97" y="115" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Cast to FP16 -> </text>

    <!-- Arrow 1 -> 2 -->
    <line x1="170" y1="80" x2="200" y2="80" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="200,80 192,75 192,85" fill="#38bdf8"/>

    <!-- Step 2: FP16 Forward Pass -->
    <rect x="205" y="30" width="160" height="100" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="285" y="55" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Fast Forward Pass</text>
    <text x="285" y="78" fill="#cbd5e1" font-size="9" text-anchor="middle">Tensor Cores (FP16)</text>
    <text x="285" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">autocast(device_type)</text>
    <text x="285" y="115" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Loss scaled by S</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="365" y1="80" x2="395" y2="80" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="395,80 387,75 387,85" fill="#fbbf24"/>

    <!-- Step 3: Scaled Backward Pass -->
    <rect x="400" y="30" width="160" height="100" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="480" y="55" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Scaled Backward</text>
    <text x="480" y="78" fill="#cbd5e1" font-size="9" text-anchor="middle">Grads in FP16</text>
    <text x="480" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">scaler.scale(loss).backward()</text>
    <text x="480" y="115" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Prevents Underflow</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="560" y1="80" x2="590" y2="80" stroke="#a855f7" stroke-width="2"/>
    <polygon points="590,80 582,75 582,85" fill="#a855f7"/>

    <!-- Step 4: Unscale & Master Update -->
    <rect x="595" y="30" width="140" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="665" y="55" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Master Update</text>
    <text x="665" y="78" fill="#cbd5e1" font-size="9" text-anchor="middle">scaler.step(optimizer)</text>
    <text x="665" y="98" fill="#94a3b8" font-size="8" text-anchor="middle">Updates FP32 Weights</text>
    <text x="665" y="115" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">scaler.update()</text>

    <!-- Bottom Code Flow -->
    <rect x="25" y="155" width="710" height="115" fill="#0f172a" stroke="#64748b" rx="6"/>
    <text x="380" y="180" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">PYTORCH AUTOMATIC MIXED PRECISION (AMP) CODE TEMPLATE</text>
    <text x="50" y="205" fill="#38bdf8" font-family="monospace" font-size="9">scaler = torch.cuda.amp.GradScaler()</text>
    <text x="50" y="223" fill="#fbbf24" font-family="monospace" font-size="9">with torch.cuda.amp.autocast(dtype=torch.float16):</text>
    <text x="80" y="241" fill="#cbd5e1" font-family="monospace" font-size="9">outputs = model(inputs); loss = criterion(outputs, targets)</text>
    <text x="50" y="259" fill="#34d399" font-family="monospace" font-size="9">scaler.scale(loss).backward(); scaler.step(optimizer); scaler.update()</text>
  </g>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M 170 80 L 200 80" stroke="#38bdf8" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M 365 80 L 395 80" stroke="#fbbf24" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M 560 80 L 590 80" stroke="#a855f7" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
