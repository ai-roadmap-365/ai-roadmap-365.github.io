<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Range beat precision.">
  <title>Two sixteen-bit formats</title>
  <style>
    .fp16-bf16-bg   { fill: #f8fafc; }
    .fp16-bf16-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fp16-bf16-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fp16-bf16-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fp16-bf16-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fp16-bf16-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .fp16-bf16-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fp16-bf16-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .fp16-bf16-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .fp16-bf16-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .fp16-bf16-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .fp16-bf16-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .fp16-bf16-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .fp16-bf16-row { opacity: 1; }
    .fp16-bf16-r0 { animation-delay: 0.00s; }
    .fp16-bf16-r1 { animation-delay: 0.45s; }
    .fp16-bf16-r2 { animation-delay: 0.90s; }
    .fp16-bf16-r3 { animation-delay: 1.35s; }
    .fp16-bf16-r4 { animation-delay: 1.80s; }
    .fp16-bf16-row { animation: fp16-bf16-reveal 7.3s ease-in-out infinite; }
    @keyframes fp16-bf16-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="fp16-bf16-bg" width="980" height="390"/>
  <text class="fp16-bf16-h1"  x="30" y="40">Two sixteen-bit formats</text>
  <text class="fp16-bf16-sub" x="30" y="64">Range beat precision.</text>
  <rect class="fp16-bf16-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="fp16-bf16-name" x="46" y="122">More precision, less range</text>
  <text class="fp16-bf16-desc" x="46" y="142">Needs a loss scaler.</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r0" x="46" y="182">Ten mantissa bits, five exponent bits</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r1" x="46" y="216">Finer resolution near a value</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r2" x="46" y="250">But a narrow dynamic range</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r3" x="46" y="284">Small gradients vanish to zero</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r4" x="46" y="318">So the loss must be scaled up first</text>
  <rect class="fp16-bf16-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="fp16-bf16-name" x="526" y="122">Less precision, full range</text>
  <text class="fp16-bf16-desc" x="526" y="142">Needs nothing.</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r0" x="526" y="182">Seven mantissa bits, eight exponent bits</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r1" x="526" y="216">Coarser resolution</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r2" x="526" y="250">But the same range as full precision</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r3" x="526" y="284">Gradients never underflow</text>
  <text class="fp16-bf16-desc fp16-bf16-row fp16-bf16-r4" x="526" y="318">Drop-in, with no scaler</text>
  <text class="fp16-bf16-sub" x="30" y="372">That the coarser format won is the counter-intuitive result here: gradients spanning many orders of magnitude need range far more than they need decimal places.</text>
</svg>
