<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fewer round trips to memory.">
  <title>Kernel fusion</title>
  <style>
    .kernel-fusion-bg   { fill: #f8fafc; }
    .kernel-fusion-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-fusion-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-fusion-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-fusion-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-fusion-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kernel-fusion-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kernel-fusion-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kernel-fusion-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kernel-fusion-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kernel-fusion-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kernel-fusion-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kernel-fusion-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .kernel-fusion-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .kernel-fusion-stage { opacity: 1; }

    .kernel-fusion-s0 { animation-delay: 0.00s; }
    .kernel-fusion-e0 { animation-delay: 0.00s; }
    .kernel-fusion-s1 { animation-delay: 1.28s; }
    .kernel-fusion-e1 { animation-delay: 1.28s; }
    .kernel-fusion-s2 { animation-delay: 2.56s; }
    .kernel-fusion-e2 { animation-delay: 2.56s; }
    .kernel-fusion-s3 { animation-delay: 3.84s; }
    .kernel-fusion-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .kernel-fusion-conn  { animation: kernel-fusion-trace 6.4s ease-in-out infinite; }
      .kernel-fusion-stage { animation: kernel-fusion-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes kernel-fusion-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes kernel-fusion-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .kernel-fusion-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .kernel-fusion-stage { animation: kernel-fusion-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes kernel-fusion-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="kernel-fusion-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="kernel-fusion-bg" width="980" height="322"/>
  <text class="kernel-fusion-h1"  x="30" y="40">Kernel fusion</text>
  <text class="kernel-fusion-sub" x="30" y="64">Fewer round trips to memory.</text>
  <g class="kernel-fusion-stage kernel-fusion-s0">
    <rect class="kernel-fusion-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-fusion-step" x="44" y="142">01</text>
    <text class="kernel-fusion-name" x="70" y="142">Each operation is a separate kernel</text>
    <text class="kernel-fusion-desc" x="44" y="166">Add, then multiply, then</text>
    <text class="kernel-fusion-desc" x="44" y="182">activate.</text>
  </g>
  <line class="kernel-fusion-line kernel-fusion-conn kernel-fusion-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#kernel-fusion-tip)"/>
  <g class="kernel-fusion-stage kernel-fusion-s1">
    <rect class="kernel-fusion-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-fusion-step" x="280" y="142">02</text>
    <text class="kernel-fusion-name" x="306" y="142">And each reads and writes device memory</text>
    <text class="kernel-fusion-desc" x="280" y="166">Four round trips for four cheap</text>
    <text class="kernel-fusion-desc" x="280" y="182">operations.</text>
  </g>
  <line class="kernel-fusion-line kernel-fusion-conn kernel-fusion-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#kernel-fusion-tip)"/>
  <g class="kernel-fusion-stage kernel-fusion-s2">
    <rect class="kernel-fusion-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-fusion-step" x="516" y="142">03</text>
    <text class="kernel-fusion-name" x="542" y="142">Fuse them into one</text>
    <text class="kernel-fusion-desc" x="516" y="166">Read once, do all the</text>
    <text class="kernel-fusion-desc" x="516" y="182">arithmetic, write once.</text>
  </g>
  <line class="kernel-fusion-line kernel-fusion-conn kernel-fusion-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#kernel-fusion-tip)"/>
  <g class="kernel-fusion-stage kernel-fusion-s3">
    <rect class="kernel-fusion-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="kernel-fusion-step" x="752" y="142">04</text>
    <text class="kernel-fusion-name" x="778" y="142">Several times faster</text>
    <text class="kernel-fusion-desc" x="752" y="166">Because these operations were</text>
    <text class="kernel-fusion-desc" x="752" y="182">never compute bound.</text>
  </g>
  <text class="kernel-fusion-sub" x="30" y="304">This is the roofline model made actionable: fusion helps exactly the bandwidth-bound operations and does almost nothing for a large matrix multiplication.</text>
</svg>
