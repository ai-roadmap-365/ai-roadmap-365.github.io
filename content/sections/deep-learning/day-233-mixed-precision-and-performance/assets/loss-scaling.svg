<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Moving gradients into representable range.">
  <title>Loss scaling</title>
  <style>
    .loss-scaling-bg   { fill: #f8fafc; }
    .loss-scaling-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-scaling-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-scaling-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-scaling-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-scaling-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loss-scaling-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loss-scaling-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loss-scaling-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loss-scaling-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loss-scaling-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loss-scaling-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loss-scaling-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .loss-scaling-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .loss-scaling-stage { opacity: 1; }

    .loss-scaling-s0 { animation-delay: 0.00s; }
    .loss-scaling-e0 { animation-delay: 0.00s; }
    .loss-scaling-s1 { animation-delay: 1.28s; }
    .loss-scaling-e1 { animation-delay: 1.28s; }
    .loss-scaling-s2 { animation-delay: 2.56s; }
    .loss-scaling-e2 { animation-delay: 2.56s; }
    .loss-scaling-s3 { animation-delay: 3.84s; }
    .loss-scaling-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .loss-scaling-conn  { animation: loss-scaling-trace 6.4s ease-in-out infinite; }
      .loss-scaling-stage { animation: loss-scaling-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes loss-scaling-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes loss-scaling-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .loss-scaling-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .loss-scaling-stage { animation: loss-scaling-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes loss-scaling-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="loss-scaling-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="loss-scaling-bg" width="980" height="322"/>
  <text class="loss-scaling-h1"  x="30" y="40">Loss scaling</text>
  <text class="loss-scaling-sub" x="30" y="64">Moving gradients into representable range.</text>
  <g class="loss-scaling-stage loss-scaling-s0">
    <rect class="loss-scaling-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="loss-scaling-step" x="44" y="142">01</text>
    <text class="loss-scaling-name" x="70" y="142">Small gradients round to zero</text>
    <text class="loss-scaling-desc" x="44" y="166">Below the format's smallest</text>
    <text class="loss-scaling-desc" x="44" y="182">representable value.</text>
  </g>
  <line class="loss-scaling-line loss-scaling-conn loss-scaling-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#loss-scaling-tip)"/>
  <g class="loss-scaling-stage loss-scaling-s1">
    <rect class="loss-scaling-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="loss-scaling-step" x="280" y="142">02</text>
    <text class="loss-scaling-name" x="306" y="142">So multiply the loss first</text>
    <text class="loss-scaling-desc" x="280" y="166">Which scales every gradient by</text>
    <text class="loss-scaling-desc" x="280" y="182">the same factor.</text>
  </g>
  <line class="loss-scaling-line loss-scaling-conn loss-scaling-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#loss-scaling-tip)"/>
  <g class="loss-scaling-stage loss-scaling-s2">
    <rect class="loss-scaling-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="loss-scaling-step" x="516" y="142">03</text>
    <text class="loss-scaling-name" x="542" y="142">Then divide before the update</text>
    <text class="loss-scaling-desc" x="516" y="166">Mathematically identical,</text>
    <text class="loss-scaling-desc" x="516" y="182">numerically survivable.</text>
  </g>
  <line class="loss-scaling-line loss-scaling-conn loss-scaling-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#loss-scaling-tip)"/>
  <g class="loss-scaling-stage loss-scaling-s3">
    <rect class="loss-scaling-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="loss-scaling-step" x="752" y="142">04</text>
    <text class="loss-scaling-name" x="778" y="142">And adjust the factor automatically</text>
    <text class="loss-scaling-desc" x="752" y="166">Raise it until overflow, then</text>
    <text class="loss-scaling-desc" x="752" y="182">back off.</text>
  </g>
  <text class="loss-scaling-sub" x="30" y="304">The dynamic adjustment is the practical part: a fixed scale that works at the start of training frequently overflows later, so the factor has to track the gradients as they change.</text>
</svg>
