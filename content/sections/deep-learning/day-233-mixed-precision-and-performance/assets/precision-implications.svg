<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are subtle.">
  <title>Four consequences of low precision</title>
  <style>
    .precision-implications-bg   { fill: #f8fafc; }
    .precision-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .precision-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .precision-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .precision-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .precision-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .precision-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .precision-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .precision-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .precision-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .precision-implications-stage { opacity: 1; }

    .precision-implications-s0 { animation-delay: 0.00s; }
    .precision-implications-e0 { animation-delay: 0.00s; }
    .precision-implications-s1 { animation-delay: 1.28s; }
    .precision-implications-e1 { animation-delay: 1.28s; }
    .precision-implications-s2 { animation-delay: 2.56s; }
    .precision-implications-e2 { animation-delay: 2.56s; }
    .precision-implications-s3 { animation-delay: 3.84s; }
    .precision-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .precision-implications-conn  { animation: precision-implications-trace 6.4s ease-in-out infinite; }
      .precision-implications-stage { animation: precision-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes precision-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes precision-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .precision-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .precision-implications-stage { animation: precision-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes precision-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="precision-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="precision-implications-bg" width="980" height="322"/>
  <text class="precision-implications-h1"  x="30" y="40">Four consequences of low precision</text>
  <text class="precision-implications-sub" x="30" y="64">Two are subtle.</text>
  <g class="precision-implications-stage precision-implications-s0">
    <rect class="precision-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="precision-implications-step" x="44" y="142">01</text>
    <text class="precision-implications-name" x="70" y="142">Roughly twice the throughput</text>
    <text class="precision-implications-desc" x="44" y="166">Which halves the cost of every</text>
    <text class="precision-implications-desc" x="44" y="182">training run.</text>
  </g>
  <line class="precision-implications-line precision-implications-conn precision-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#precision-implications-tip)"/>
  <g class="precision-implications-stage precision-implications-s1">
    <rect class="precision-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="precision-implications-step" x="280" y="142">02</text>
    <text class="precision-implications-name" x="306" y="142">And twice the model or batch size</text>
    <text class="precision-implications-desc" x="280" y="166">Often the difference between</text>
    <text class="precision-implications-desc" x="280" y="182">feasible and not.</text>
  </g>
  <line class="precision-implications-line precision-implications-conn precision-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#precision-implications-tip)"/>
  <g class="precision-implications-stage precision-implications-s2">
    <rect class="precision-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="precision-implications-step" x="516" y="142">03</text>
    <text class="precision-implications-name" x="542" y="142">But results are less reproducible</text>
    <text class="precision-implications-desc" x="516" y="166">Accumulation order changes the</text>
    <text class="precision-implications-desc" x="516" y="182">last bits.</text>
  </g>
  <line class="precision-implications-line precision-implications-conn precision-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#precision-implications-tip)"/>
  <g class="precision-implications-stage precision-implications-s3">
    <rect class="precision-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="precision-implications-step" x="752" y="142">04</text>
    <text class="precision-implications-name" x="778" y="142">And failures are silent</text>
    <text class="precision-implications-desc" x="752" y="166">Underflow gives zeros, not</text>
    <text class="precision-implications-desc" x="752" y="182">errors. Watch for a stalled</text>
    <text class="precision-implications-desc" x="752" y="198">loss.</text>
  </g>
  <text class="precision-implications-sub" x="30" y="304">Silent failure is what makes this worth understanding rather than merely enabling: a training run producing zeros looks identical to one that has simply converged.</text>
</svg>
