<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Weights are the small part.">
  <title>Where the memory goes</title>
  <style>
    .vram-budget-bg   { fill: #f8fafc; }
    .vram-budget-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-budget-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-budget-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-budget-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-budget-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vram-budget-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .vram-budget-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .vram-budget-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .vram-budget-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .vram-budget-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .vram-budget-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .vram-budget-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .vram-budget-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .vram-budget-stage { opacity: 1; }

    .vram-budget-s0 { animation-delay: 0.00s; }
    .vram-budget-e0 { animation-delay: 0.00s; }
    .vram-budget-s1 { animation-delay: 1.28s; }
    .vram-budget-e1 { animation-delay: 1.28s; }
    .vram-budget-s2 { animation-delay: 2.56s; }
    .vram-budget-e2 { animation-delay: 2.56s; }
    .vram-budget-s3 { animation-delay: 3.84s; }
    .vram-budget-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .vram-budget-conn  { animation: vram-budget-trace 6.4s ease-in-out infinite; }
      .vram-budget-stage { animation: vram-budget-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes vram-budget-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes vram-budget-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .vram-budget-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .vram-budget-stage { animation: vram-budget-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes vram-budget-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="vram-budget-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="vram-budget-bg" width="980" height="322"/>
  <text class="vram-budget-h1"  x="30" y="40">Where the memory goes</text>
  <text class="vram-budget-sub" x="30" y="64">Weights are the small part.</text>
  <g class="vram-budget-stage vram-budget-s0">
    <rect class="vram-budget-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="vram-budget-step" x="44" y="142">01</text>
    <text class="vram-budget-name" x="70" y="142">Parameters</text>
    <text class="vram-budget-desc" x="44" y="166">Two bytes each in low precision,</text>
    <text class="vram-budget-desc" x="44" y="182">four in the master copy.</text>
  </g>
  <line class="vram-budget-line vram-budget-conn vram-budget-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#vram-budget-tip)"/>
  <g class="vram-budget-stage vram-budget-s1">
    <rect class="vram-budget-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="vram-budget-step" x="280" y="142">02</text>
    <text class="vram-budget-name" x="306" y="142">Gradients</text>
    <text class="vram-budget-desc" x="280" y="166">One per parameter, held through</text>
    <text class="vram-budget-desc" x="280" y="182">the backward pass.</text>
  </g>
  <line class="vram-budget-line vram-budget-conn vram-budget-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#vram-budget-tip)"/>
  <g class="vram-budget-stage vram-budget-s2">
    <rect class="vram-budget-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="vram-budget-step" x="516" y="142">03</text>
    <text class="vram-budget-name" x="542" y="142">Optimiser state</text>
    <text class="vram-budget-desc" x="516" y="166">Two more full-precision tensors</text>
    <text class="vram-budget-desc" x="516" y="182">per parameter. The largest fixed</text>
    <text class="vram-budget-desc" x="516" y="198">cost.</text>
  </g>
  <line class="vram-budget-line vram-budget-conn vram-budget-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#vram-budget-tip)"/>
  <g class="vram-budget-stage vram-budget-s3">
    <rect class="vram-budget-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="vram-budget-step" x="752" y="142">04</text>
    <text class="vram-budget-name" x="778" y="142">Activations</text>
    <text class="vram-budget-desc" x="752" y="166">Which scale with batch size and</text>
    <text class="vram-budget-desc" x="752" y="182">sequence length, not parameter</text>
    <text class="vram-budget-desc" x="752" y="198">count.</text>
    <text class="vram-budget-edge" x="752" y="242">variable</text>
  </g>
  <text class="vram-budget-sub" x="30" y="304">Optimiser state being larger than the model itself is why a model that fits comfortably for inference often cannot be trained on the same device at all.</text>
</svg>
