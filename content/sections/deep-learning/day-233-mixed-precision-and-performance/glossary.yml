terms:
  - term: 'Automatic Mixed Precision (AMP)'
    definition: 'A framework executing performance-critical matrix operations in 16-bit half precision while maintaining 32-bit master weights for stability.'
  - term: 'GradScaler'
    definition: 'A dynamic loss scaling engine that multiplies loss by a scale factor to prevent gradient underflow during FP16 backward passes.'
  - term: 'Bfloat16 (BF16)'
    definition: 'A 16-bit floating point format with 1 sign bit, 8 exponent bits (matching FP32 range), and 7 mantissa bits.'
  - term: 'FP8 (E4M3 / E5M2)'
    definition: 'An 8-bit floating point format delivering double the throughput of 16-bit on modern NVIDIA Hopper and Blackwell architectures.'
  - term: 'Kernel Fusion'
    definition: 'Combining multiple sequential operations into a single GPU kernel to eliminate intermediate memory reads and writes across HBM.'
  - term: 'torch.compile'
    definition: 'The PyTorch 2.0 JIT compiler utilizing TorchDynamo and TorchInductor to optimize PyTorch code into high-speed Triton/C++ kernels.'
  - term: 'Master Weights'
    definition: 'A full-precision FP32 copy of model parameters maintained by the optimizer to accumulate small parameter updates.'
  - term: 'Gradient Underflow'
    definition: 'The numerical failure when small backpropagation gradients drop below the minimum representable value of FP16 and vanish to zero.'
