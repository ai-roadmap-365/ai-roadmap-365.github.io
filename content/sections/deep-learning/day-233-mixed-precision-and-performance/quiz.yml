questions:
  - question: 'Why does Bfloat16 (BF16) avoid the gradient underflow issues that affect standard FP16 during deep neural network training?'
    options:
      - 'BF16 allocates 8 bits to the exponent (the exact same dynamic range as standard FP32: ~1e-38 to 3e38), preventing gradient values from underflowing to zero, whereas FP16 allocates only 5 bits to the exponent (~6e-8 min value)'
      - 'BF16 uses integer arithmetic instead of floating point'
      - 'BF16 eliminates negative numbers'
      - 'BF16 requires 64 bits of storage'
    answer_index: 0
    explanation: 'BF16 preserves FP32 wide 8-bit dynamic range, eliminating the need for loss scaling during training.'
  - question: 'What is the purpose of the GradScaler in PyTorch Automatic Mixed Precision (AMP) with FP16?'
    options:
      - 'It multiplies the forward loss by a large scale factor (e.g. 65,536) prior to backpropagation, shifting small gradient values into FP16 representable range to prevent underflow, and unscales gradients before the optimizer update'
      - 'It scales up the learning rate by 10x'
      - 'It doubles the batch size'
      - 'It shrinks the vocabulary size'
    answer_index: 0
    explanation: 'GradScaler prevents small backpropagation gradients from underflowing to zero in 16-bit half precision.'
  - question: 'How much GPU VRAM does a 7-billion parameter model require just to store training states in mixed-precision AdamW?'
    options:
      - 'Approximately 112 GB (14 GB for FP16 weights, 14 GB for FP16 gradients, 28 GB for FP32 master weights, 28 GB for Adam 1st momentum, 28 GB for Adam 2nd variance: total 16 bytes per parameter)'
      - '7 GB'
      - '1 GB'
      - '500 MB'
    answer_index: 0
    explanation: 'Mixed-precision AdamW requires 16 bytes per parameter (2B model + 2B grad + 4B master + 4B moment 1 + 4B moment 2), totaling 112 GB for 7B parameters.'
  - question: 'What is the primary optimization performed by torch.compile (PyTorch 2.0 TorchDynamo / Inductor)?'
    options:
      - 'It captures the Python computation graph and fuses adjacent elementwise and reduction operations (e.g. Linear + Bias + GELU + LayerNorm) into single, unified C++/Triton GPU kernels, eliminating intermediate HBM memory roundtrips'
      - 'It translates Python into Java'
      - 'It compresses dataset text'
      - 'It disables backpropagation'
    answer_index: 0
    explanation: 'torch.compile automatically fuses elementwise kernels, keeping activations in fast SRAM and bypassing HBM bandwidth limits.'
  - question: 'What are the two distinct FP8 numerical variants defined for deep learning (Hopper/Blackwell architecture)?'
    options:
      - 'E4M3 (4 exponent bits, 3 mantissa bits: higher precision for weights and forward activations) and E5M2 (5 exponent bits, 2 mantissa bits: wider dynamic range for backward gradients)'
      - 'FP8-Left and FP8-Right'
      - 'FP8-CPU and FP8-GPU'
      - 'FP8-Int and FP8-Float'
    answer_index: 0
    explanation: 'E4M3 maximizes precision for forward passes; E5M2 maximizes dynamic range to capture gradient distributions.'
