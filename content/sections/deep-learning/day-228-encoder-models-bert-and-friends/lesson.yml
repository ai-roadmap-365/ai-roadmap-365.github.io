learning_promise: 'Master Encoder-only Transformer foundation models: understand Devlin et al. (2018) BERT, Masked Language Modeling (MLM) and Next Sentence Prediction (NSP), analyze RoBERTa dynamic masking, learn ALBERT parameter reduction via cross-layer weight sharing, understand DeBERTa disentangled attention, and extract contextual representations in PyTorch.'
objectives:
  - 'Derive the Masked Language Modeling (MLM) objective and the 80/10/10 token corruption rule.'
  - 'Explain why bidirectional self-attention is optimal for discriminative tasks (classification, NER, extractive QA).'
  - 'Analyze the structural improvements in RoBERTa: removing NSP, dynamic masking, and massive batch scaling.'
  - 'Derive ALBERT parameter reduction techniques: factorized embedding parameterization and cross-layer weight sharing.'
  - 'Explain DeBERTa disentangled attention (content-to-position and position-to-content matrices) and Enhanced Mask Decoding.'
