questions:
  - question: 'What is the "80/10/10 rule" used in BERT Masked Language Modeling (MLM) for the 15% selected token positions?'
    options:
      - '80% of the time the token is replaced with the special [MASK] token, 10% of the time it is replaced with a random vocabulary token, and 10% of the time it is kept unchanged; this prevents the model from relying solely on the presence of [MASK] during downstream fine-tuning'
      - '80% of tokens are deleted, 10% are duplicated, and 10% are converted to uppercase'
      - '80% train, 10% validation, 10% test'
      - '80% English, 10% French, 10% German'
    answer_index: 0
    explanation: 'The 80/10/10 rule bridges the pretraining-finetuning discrepancy by ensuring the encoder maintains rich contextual representations even when [MASK] is absent.'
  - question: 'Why did Liu et al. (2019) remove the Next Sentence Prediction (NSP) task in RoBERTa?'
    options:
      - 'Careful empirical ablation studies revealed that the NSP task did not improve and slightly degraded downstream task performance when training on continuous full-length sequences (FULL-SENTENCES)'
      - 'NSP was patented'
      - 'NSP caused GPU overheating'
      - 'NSP made the model generate text'
    answer_index: 0
    explanation: 'RoBERTa showed that BERT was significantly undertrained and that removing NSP while training on contiguous full sequences yielded superior representations.'
  - question: 'How does ALBERT (Lan et al., 2019) achieve an 18x reduction in parameter count compared to BERT-Large while maintaining comparable accuracy?'
    options:
      - '1. Factorized Embedding Parameterization (splitting V x H into V x E followed by E x H, where E << H), and 2. Cross-Layer Parameter Sharing (sharing all attention and FFN weights across all 12/24 layers)'
      - 'By quantizing weights to 1-bit'
      - 'By discarding the vocabulary table'
      - 'By running on a single CPU core'
    answer_index: 0
    explanation: 'Cross-layer weight sharing and factorized embedding projections drastically compress parameter counts without sacrificing model depth.'
  - question: 'What is "Disentangled Attention" in DeBERTa (He et al., 2020)?'
    options:
      - 'Representing each token by two separate vectors (content vector c_i and relative position vector p_i), computing attention via four disentangled components: content-to-content, content-to-position, position-to-content, and position-to-position'
      - 'Disabling attention for even-numbered tokens'
      - 'Separating nouns from verbs'
      - 'Running attention on separate GPU threads'
    answer_index: 0
    explanation: 'Disentangled attention explicitly models semantic content-to-position and position-to-content cross-terms, achieving state-of-the-art encoder performance.'
  - question: 'Why are Encoder-only models (BERT/RoBERTa/DeBERTa) preferred over Decoder-only models (GPT) for extractive question answering and token classification (NER)?'
    options:
      - 'Encoder models utilize unmasked bidirectional attention, allowing every token to observe full left-and-right context simultaneously, whereas decoder models are constrained by causal left-to-right masks'
      - 'Encoder models are smaller'
      - 'Decoder models cannot process punctuation'
      - 'Encoder models do not use PyTorch'
    answer_index: 0
    explanation: 'Bidirectional context allows tokens to observe surrounding words on both sides, essential for classification and span extraction.'
