terms:
  - term: 'BERT'
    definition: 'Bidirectional Encoder Representations from Transformers: an encoder foundation model pretrained with MLM and NSP.'
  - term: 'Masked Language Modeling (MLM)'
    definition: 'A self-supervised pretraining objective where 15% of tokens are corrupted and the model predicts their original IDs.'
  - term: 'Next Sentence Prediction (NSP)'
    definition: 'A binary classification pretraining task predicting whether sentence B logically follows sentence A.'
  - term: 'RoBERTa'
    definition: 'A robustly optimized BERT variant trained with dynamic masking, larger batches, longer steps, and no NSP task.'
  - term: 'ALBERT'
    definition: 'A Lite BERT architecture using cross-layer weight sharing and factorized embedding projections to slash parameters.'
  - term: 'DeBERTa'
    definition: 'Decoding-enhanced BERT utilizing disentangled content-position attention and Enhanced Mask Decoding.'
  - term: 'Disentangled Attention'
    definition: 'Computing separate attention matrices for content-to-content, content-to-position, and position-to-content interactions.'
  - term: 'Special Tokens ([CLS], [SEP], [MASK])'
    definition: 'Reserved tokens used for sequence classification ([CLS]), sentence separation ([SEP]), and cloze pretraining ([MASK]).'
