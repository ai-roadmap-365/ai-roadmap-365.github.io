<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are practical, two are cautionary.">
  <title>Four consequences of encoder models</title>
  <style>
    .encoder-implications-bg   { fill: #f8fafc; }
    .encoder-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoder-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoder-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoder-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoder-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoder-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoder-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoder-implications-stage { opacity: 1; }

    .encoder-implications-s0 { animation-delay: 0.00s; }
    .encoder-implications-e0 { animation-delay: 0.00s; }
    .encoder-implications-s1 { animation-delay: 1.28s; }
    .encoder-implications-e1 { animation-delay: 1.28s; }
    .encoder-implications-s2 { animation-delay: 2.56s; }
    .encoder-implications-e2 { animation-delay: 2.56s; }
    .encoder-implications-s3 { animation-delay: 3.84s; }
    .encoder-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoder-implications-conn  { animation: encoder-implications-trace 6.4s ease-in-out infinite; }
      .encoder-implications-stage { animation: encoder-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes encoder-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoder-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoder-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoder-implications-stage { animation: encoder-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoder-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoder-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoder-implications-bg" width="980" height="322"/>
  <text class="encoder-implications-h1"  x="30" y="40">Four consequences of encoder models</text>
  <text class="encoder-implications-sub" x="30" y="64">Two are practical, two are cautionary.</text>
  <g class="encoder-implications-stage encoder-implications-s0">
    <rect class="encoder-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-implications-step" x="44" y="142">01</text>
    <text class="encoder-implications-name" x="70" y="142">One forward pass per input</text>
    <text class="encoder-implications-desc" x="44" y="166">No autoregressive loop. Orders</text>
    <text class="encoder-implications-desc" x="44" y="182">of magnitude cheaper than</text>
    <text class="encoder-implications-desc" x="44" y="198">generation.</text>
  </g>
  <line class="encoder-implications-line encoder-implications-conn encoder-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#encoder-implications-tip)"/>
  <g class="encoder-implications-stage encoder-implications-s1">
    <rect class="encoder-implications-good" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-implications-step" x="280" y="142">02</text>
    <text class="encoder-implications-name" x="306" y="142">Small enough to run anywhere</text>
    <text class="encoder-implications-desc" x="280" y="166">Hundreds of millions of</text>
    <text class="encoder-implications-desc" x="280" y="182">parameters, not hundreds of</text>
    <text class="encoder-implications-desc" x="280" y="198">billions.</text>
  </g>
  <line class="encoder-implications-line encoder-implications-conn encoder-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#encoder-implications-tip)"/>
  <g class="encoder-implications-stage encoder-implications-s2">
    <rect class="encoder-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-implications-step" x="516" y="142">03</text>
    <text class="encoder-implications-name" x="542" y="142">Bias from the pretraining corpus</text>
    <text class="encoder-implications-desc" x="516" y="166">Measurable, and inherited by</text>
    <text class="encoder-implications-desc" x="516" y="182">every downstream head.</text>
  </g>
  <line class="encoder-implications-line encoder-implications-conn encoder-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#encoder-implications-tip)"/>
  <g class="encoder-implications-stage encoder-implications-s3">
    <rect class="encoder-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="encoder-implications-step" x="752" y="142">04</text>
    <text class="encoder-implications-name" x="778" y="142">And a hard length limit</text>
    <text class="encoder-implications-desc" x="752" y="166">Positional embeddings trained to</text>
    <text class="encoder-implications-desc" x="752" y="182">a fixed maximum.</text>
  </g>
  <text class="encoder-implications-sub" x="30" y="304">The efficiency point deserves more attention than it gets: a classification task solved by an encoder costs a fraction of the same task handed to a generative model, at comparable or better accuracy.</text>
</svg>
