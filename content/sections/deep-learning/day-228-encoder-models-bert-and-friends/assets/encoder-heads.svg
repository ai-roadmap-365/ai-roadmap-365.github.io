<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Which output you read from.">
  <title>Three heads on one encoder</title>
  <style>
    .encoder-heads-bg   { fill: #f8fafc; }
    .encoder-heads-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-heads-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-heads-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-heads-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-heads-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-heads-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-heads-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoder-heads-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoder-heads-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoder-heads-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoder-heads-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoder-heads-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .encoder-heads-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .encoder-heads-stage { opacity: 1; }

    .encoder-heads-s0 { animation-delay: 0.00s; }
    .encoder-heads-e0 { animation-delay: 0.00s; }
    .encoder-heads-s1 { animation-delay: 1.50s; }
    .encoder-heads-e1 { animation-delay: 1.50s; }
    .encoder-heads-s2 { animation-delay: 3.00s; }
    .encoder-heads-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .encoder-heads-conn  { animation: encoder-heads-trace 6s ease-in-out infinite; }
      .encoder-heads-stage { animation: encoder-heads-arrive 6s ease-in-out infinite; }
    }
    @keyframes encoder-heads-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes encoder-heads-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .encoder-heads-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .encoder-heads-stage { animation: encoder-heads-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes encoder-heads-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="encoder-heads-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="encoder-heads-bg" width="980" height="322"/>
  <text class="encoder-heads-h1"  x="30" y="40">Three heads on one encoder</text>
  <text class="encoder-heads-sub" x="30" y="64">Which output you read from.</text>
  <g class="encoder-heads-stage encoder-heads-s0">
    <rect class="encoder-heads-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="encoder-heads-step" x="44" y="142">01</text>
    <text class="encoder-heads-name" x="70" y="142">Sequence classification</text>
    <text class="encoder-heads-desc" x="44" y="166">One label for the whole input. Read from a</text>
    <text class="encoder-heads-desc" x="44" y="182">pooled representation.</text>
  </g>
  <line class="encoder-heads-line encoder-heads-conn encoder-heads-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#encoder-heads-tip)"/>
  <g class="encoder-heads-stage encoder-heads-s1">
    <rect class="encoder-heads-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="encoder-heads-step" x="359" y="142">02</text>
    <text class="encoder-heads-name" x="385" y="142">Token classification</text>
    <text class="encoder-heads-desc" x="359" y="166">A label per token. Named entities, part of</text>
    <text class="encoder-heads-desc" x="359" y="182">speech.</text>
    <text class="encoder-heads-edge" x="359" y="242">per token</text>
  </g>
  <line class="encoder-heads-line encoder-heads-conn encoder-heads-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#encoder-heads-tip)"/>
  <g class="encoder-heads-stage encoder-heads-s2">
    <rect class="encoder-heads-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="encoder-heads-step" x="674" y="142">03</text>
    <text class="encoder-heads-name" x="700" y="142">Span extraction</text>
    <text class="encoder-heads-desc" x="674" y="166">Two predictions: where an answer starts and</text>
    <text class="encoder-heads-desc" x="674" y="182">where it ends.</text>
  </g>
  <text class="encoder-heads-sub" x="30" y="304">The same pretrained encoder serves all three with a different small head, which is the practical realisation of transfer learning in language: the representation is shared, the task head is not.</text>
</svg>
