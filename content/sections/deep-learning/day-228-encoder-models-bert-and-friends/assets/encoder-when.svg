<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when not to.">
  <title>When to reach for an encoder</title>
  <style>
    .encoder-when-bg   { fill: #f8fafc; }
    .encoder-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .encoder-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .encoder-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .encoder-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .encoder-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .encoder-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .encoder-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .encoder-when-row { opacity: 1; }
    .encoder-when-r0 { animation-delay: 0.00s; }
    .encoder-when-r1 { animation-delay: 0.45s; }
    .encoder-when-r2 { animation-delay: 0.90s; }
    .encoder-when-r3 { animation-delay: 1.35s; }
    .encoder-when-r4 { animation-delay: 1.80s; }
    .encoder-when-row { animation: encoder-when-reveal 7.3s ease-in-out infinite; }
    @keyframes encoder-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="encoder-when-bg" width="980" height="390"/>
  <text class="encoder-when-h1"  x="30" y="40">When to reach for an encoder</text>
  <text class="encoder-when-sub" x="30" y="64">And when not to.</text>
  <rect class="encoder-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="encoder-when-name" x="46" y="122">Use an encoder</text>
  <text class="encoder-when-desc" x="46" y="142">Understanding, not producing.</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r0" x="46" y="182">Classification and routing</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r1" x="46" y="216">Named entity recognition</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r2" x="46" y="250">Dense retrieval and reranking</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r3" x="46" y="284">Extractive question answering</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r4" x="46" y="318">High volume, low latency</text>
  <rect class="encoder-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="encoder-when-name" x="526" y="122">Use a decoder</text>
  <text class="encoder-when-desc" x="526" y="142">Producing text.</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r0" x="526" y="182">Open-ended generation</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r1" x="526" y="216">Summarisation and rewriting</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r2" x="526" y="250">Conversation</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r3" x="526" y="284">Anything where the output is novel text</text>
  <text class="encoder-when-desc encoder-when-row encoder-when-r4" x="526" y="318">Or where zero-shot flexibility matters</text>
  <text class="encoder-when-sub" x="30" y="372">The zero-shot flexibility on the right is the honest reason generative models are reached for so often: an encoder needs fine-tuning per task, and a prompted decoder needs a sentence.</text>
</svg>
