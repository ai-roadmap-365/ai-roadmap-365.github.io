visuals:
  - id: bert-pretraining-objectives-mlm-nsp
    file: assets/bert-pretraining-objectives-mlm-nsp.svg
    type: diagram
    title: 'BERT Pretraining Objectives: MLM and NSP'
    alt: BERT pretraining architecture diagram showing input tokens with CLS SEP and MASK tokens bidirectional self attention and dual MLM and NSP heads
    description: 'Devlin et al. (2018) BERT pretraining framework demonstrating Masked Language Modeling and Next Sentence Prediction.'
  - id: encoder-models-evolution-bert-to-deberta
    file: assets/encoder-models-evolution-bert-to-deberta.svg
    type: diagram
    title: 'Encoder Models Evolution: BERT to DeBERTa-v3'
    alt: Evolution roadmap of encoder transformer models from BERT to RoBERTa ALBERT and DeBERTa-v3
    description: 'Chronological comparison of architectural refinements across BERT, RoBERTa, ALBERT, and DeBERTa-v3.'
  - id: mlm
    file: assets/mlm.svg
    type: diagram
    title: 'Masked language modelling'
    alt: 'Diagram: the masked language modelling pretraining objective'
    description: 'A four-stage description of masked language modelling covering token masking, bidirectional context, prediction and the label-free property.'
  - id: encoder-or-decoder
    file: assets/encoder-or-decoder.svg
    type: diagram
    title: 'Encoders and decoders'
    alt: 'Diagram: encoder models compared with decoder models'
    description: 'A two-column comparison of bidirectional encoder models against causal decoder models.'
  - id: encoder-lineage
    file: assets/encoder-lineage.svg
    type: diagram
    title: 'Four refinements after BERT'
    alt: 'Diagram: the progression of encoder model refinements after BERT'
    description: 'A four-stage progression of encoder improvements covering training recipe, parameter sharing, disentangled position and sample-efficient objectives.'
  - id: electra-efficiency
    file: assets/electra-efficiency.svg
    type: diagram
    title: 'Why masking is sample-inefficient'
    alt: 'Diagram: masked language modelling compared with replaced token detection by loss coverage'
    description: 'A four-stage description of the sample-efficiency problem covering masked fraction, unused tokens, the discriminative alternative and its benefit.'
  - id: sentence-embeddings
    file: assets/sentence-embeddings.svg
    type: diagram
    title: 'From token vectors to sentence vectors'
    alt: 'Diagram: how encoder outputs become sentence embeddings'
    description: 'A four-stage description of sentence embedding covering token outputs, naive pooling, contrastive training and the resulting search capability.'
  - id: bi-or-cross
    file: assets/bi-or-cross.svg
    type: diagram
    title: 'Bi-encoder, or cross-encoder'
    alt: 'Diagram: bi-encoder retrieval compared with cross-encoder reranking'
    description: 'A two-column comparison of bi-encoders and cross-encoders by computation pattern and use.'
  - id: pathology-lab
    file: assets/pathology-lab.svg
    type: diagram
    title: 'A pathology lab'
    alt: 'Diagram: analytical characterisation compared with narrative generation'
    description: 'A two-column comparison of a laboratory producing measurements against a report writer producing prose.'
  - id: encoder-heads
    file: assets/encoder-heads.svg
    type: diagram
    title: 'Three heads on one encoder'
    alt: 'Diagram: the three output heads attached to an encoder model'
    description: 'A three-stage description of encoder task heads covering sequence classification, token classification and span extraction.'
  - id: encoder-implications
    file: assets/encoder-implications.svg
    type: diagram
    title: 'Four consequences of encoder models'
    alt: 'Diagram: the efficiency, deployment, bias and length implications of encoder models'
    description: 'A four-stage description of encoder implications covering inference efficiency, deployment footprint, inherited bias and sequence length limits.'
  - id: encoder-when
    file: assets/encoder-when.svg
    type: diagram
    title: 'When to reach for an encoder'
    alt: 'Diagram: when encoder models are the right choice'
    description: 'A two-column comparison of tasks suited to encoder models against those requiring generation.'
