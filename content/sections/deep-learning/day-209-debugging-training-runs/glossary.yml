terms:
  - term: 'Gradient Clipping'
    definition: 'A technique that rescales gradient vectors when their global Euclidean norm exceeds a threshold, preventing explosive parameter divergence.'
  - term: 'Single-Batch Overfit Test'
    definition: 'A foundational sanity check where a model is trained on 10-32 samples to verify it can drive loss to zero and achieve 100% accuracy.'
  - term: 'Anomaly Detection'
    definition: 'A PyTorch debugging mode (torch.autograd.set_detect_anomaly) that identifies the exact forward operation that generated NaN or Inf values.'
  - term: 'Vanishing Gradients'
    definition: 'A condition where gradients shrink exponentially as they propagate backward through layers, stalling parameter updates in early layers.'
  - term: 'Exploding Gradients'
    definition: 'A condition where gradients grow exponentially during backpropagation, causing weights to overflow to NaN or Infinity.'
  - term: 'Dead ReLU'
    definition: 'A state where a ReLU neuron pre-activation is persistently negative across all samples, resulting in permanent zero gradient flow.'
  - term: 'Theoretical Initial Loss'
    definition: 'The expected cross-entropy loss value under uniform random guessing: -ln(1/K) for K balanced classes.'
  - term: 'Activation Sparsity'
    definition: 'The fraction of neuron outputs in a layer that are exactly zero after applying a non-linear activation like ReLU.'
