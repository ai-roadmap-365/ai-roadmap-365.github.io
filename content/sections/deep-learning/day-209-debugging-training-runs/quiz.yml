questions:
  - question: 'What is the single most powerful initial sanity check when debugging a newly written neural network architecture that fails to converge?'
    options:
      - 'Buy a faster GPU'
      - 'Train the model for 1000 epochs on the full dataset'
      - 'Overfit a single tiny batch and see loss reach zero'
      - 'Change all activation functions to linear'
    answer_index: 2
    explanation: 'A deep neural network has sufficient capacity to memorize 10-32 samples with zero loss. If it cannot overfit a single batch, it proves a code bug exists in forward or backward logic.'
  - question: 'How does torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0) prevent exploding gradients without distorting the direction of parameter updates?'
    options:
      - 'It clamps individual elements between -1 and 1 independently'
      - 'It sets all negative gradients to zero'
      - 'It replaces gradients with random Gaussian noise'
      - 'It rescales all gradients when the global norm is too big'
    answer_index: 3
    explanation: 'Norm clipping scales the entire gradient vector uniformly by max_norm / ||G||. Unlike elementwise value clamping, norm clipping does not distort the directional angle of the gradient step.'
  - question: 'When training a 10-class classifier with cross-entropy loss, what should the initial loss value be on step 0 before any gradient updates are applied?'
    options:
      - '2.3026'
      - '0.0000'
      - '100.000'
      - '0.5000'
    answer_index: 0
    explanation: 'At initialization with symmetric random weights, the model assigns uniform 1/K probability to all K classes. The loss is -ln(1/K). Checking this at step 0 confirms loss scaling is correct.'
  - question: 'What is the primary operational penalty of leaving torch.autograd.set_detect_anomaly(True) enabled during normal production training?'
    options:
      - 'It causes the model to delete its saved checkpoints on exit'
      - 'It records stack traces for every op, slowing runs 3-5x'
      - 'It reduces test accuracy by 10%'
      - 'It crashes the operating system'
    answer_index: 1
    explanation: 'Anomaly detection is an intensive debugging diagnostic tool. Because it records stack traces for every forward node, it introduces significant runtime overhead and should only be enabled when hunting NaNs.'
  - question: 'What is the "Dead ReLU" problem, and how can you diagnose it in a deep network?'
    options:
      - 'When ReLU outputs negative values'
      - 'When the computer runs out of battery'
      - 'A neuron whose pre-activation is negative for every sample'
      - 'When ReLU is replaced by Sigmoid'
    answer_index: 2
    explanation: 'Dead ReLUs output zero for all inputs and have zero gradient. They can be detected by logging activation sparsity (percentage of zeros output by the layer).'
