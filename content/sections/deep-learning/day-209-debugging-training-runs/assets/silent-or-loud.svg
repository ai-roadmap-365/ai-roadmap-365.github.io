<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Wrong code still runs.">
  <title>Why deep learning needs its own debugging</title>
  <style>
    .silent-or-loud-bg   { fill: #f8fafc; }
    .silent-or-loud-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-or-loud-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-or-loud-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-or-loud-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-or-loud-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .silent-or-loud-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-or-loud-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .silent-or-loud-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .silent-or-loud-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .silent-or-loud-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .silent-or-loud-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .silent-or-loud-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .silent-or-loud-row { opacity: 1; }
    .silent-or-loud-r0 { animation-delay: 0.00s; }
    .silent-or-loud-r1 { animation-delay: 0.45s; }
    .silent-or-loud-r2 { animation-delay: 0.90s; }
    .silent-or-loud-r3 { animation-delay: 1.35s; }
    .silent-or-loud-r4 { animation-delay: 1.80s; }
    .silent-or-loud-row { animation: silent-or-loud-reveal 7.3s ease-in-out infinite; }
    @keyframes silent-or-loud-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="silent-or-loud-bg" width="980" height="390"/>
  <text class="silent-or-loud-h1"  x="30" y="40">Why deep learning needs its own debugging</text>
  <text class="silent-or-loud-sub" x="30" y="64">Wrong code still runs.</text>
  <rect class="silent-or-loud-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="silent-or-loud-name" x="46" y="122">Conventional software</text>
  <text class="silent-or-loud-desc" x="46" y="142">Fails loudly.</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r0" x="46" y="182">A wrong type raises</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r1" x="46" y="216">A wrong index raises</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r2" x="46" y="250">A crash names a line</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r3" x="46" y="284">The stack trace is the diagnosis</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r4" x="46" y="318">Wrong behaviour is usually visible</text>
  <rect class="silent-or-loud-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="silent-or-loud-name" x="526" y="122">A neural network</text>
  <text class="silent-or-loud-desc" x="526" y="142">Fails silently.</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r0" x="526" y="182">A transposed tensor still multiplies</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r1" x="526" y="216">Shuffled labels still produce a loss</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r2" x="526" y="250">The curve still goes down, slowly</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r3" x="526" y="284">No exception, no stack trace</text>
  <text class="silent-or-loud-desc silent-or-loud-row silent-or-loud-r4" x="526" y="318">Just a model that is quietly worse</text>
  <text class="silent-or-loud-sub" x="30" y="372">Randomly adjusting learning rates when the actual bug is a transposed label tensor is the characteristic failure of undisciplined debugging, and the protocol exists to make that impossible.</text>
</svg>
