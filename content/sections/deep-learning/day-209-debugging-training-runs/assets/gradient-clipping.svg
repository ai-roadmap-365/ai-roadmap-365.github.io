<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One preserves direction; one does not.">
  <title>Clipping by norm, not by value</title>
  <style>
    .gradient-clipping-bg   { fill: #f8fafc; }
    .gradient-clipping-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-clipping-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-clipping-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-clipping-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-clipping-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-clipping-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradient-clipping-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradient-clipping-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradient-clipping-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradient-clipping-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradient-clipping-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradient-clipping-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradient-clipping-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradient-clipping-stage { opacity: 1; }

    .gradient-clipping-s0 { animation-delay: 0.00s; }
    .gradient-clipping-e0 { animation-delay: 0.00s; }
    .gradient-clipping-s1 { animation-delay: 1.28s; }
    .gradient-clipping-e1 { animation-delay: 1.28s; }
    .gradient-clipping-s2 { animation-delay: 2.56s; }
    .gradient-clipping-e2 { animation-delay: 2.56s; }
    .gradient-clipping-s3 { animation-delay: 3.84s; }
    .gradient-clipping-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradient-clipping-conn  { animation: gradient-clipping-trace 6.4s ease-in-out infinite; }
      .gradient-clipping-stage { animation: gradient-clipping-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradient-clipping-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradient-clipping-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradient-clipping-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradient-clipping-stage { animation: gradient-clipping-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradient-clipping-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradient-clipping-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradient-clipping-bg" width="980" height="322"/>
  <text class="gradient-clipping-h1"  x="30" y="40">Clipping by norm, not by value</text>
  <text class="gradient-clipping-sub" x="30" y="64">One preserves direction; one does not.</text>
  <g class="gradient-clipping-stage gradient-clipping-s0">
    <rect class="gradient-clipping-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-clipping-step" x="44" y="142">01</text>
    <text class="gradient-clipping-name" x="70" y="142">A steep cliff produces a huge gradient</text>
    <text class="gradient-clipping-desc" x="44" y="166">One step catapults the weights</text>
    <text class="gradient-clipping-desc" x="44" y="182">into infinity.</text>
  </g>
  <line class="gradient-clipping-line gradient-clipping-conn gradient-clipping-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradient-clipping-tip)"/>
  <g class="gradient-clipping-stage gradient-clipping-s1">
    <rect class="gradient-clipping-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-clipping-step" x="280" y="142">02</text>
    <text class="gradient-clipping-name" x="306" y="142">Norm clipping scales the whole vector</text>
    <text class="gradient-clipping-desc" x="280" y="166">One scalar factor applied to</text>
    <text class="gradient-clipping-desc" x="280" y="182">every component.</text>
    <text class="gradient-clipping-edge" x="280" y="242">uniform</text>
  </g>
  <line class="gradient-clipping-line gradient-clipping-conn gradient-clipping-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradient-clipping-tip)"/>
  <g class="gradient-clipping-stage gradient-clipping-s2">
    <rect class="gradient-clipping-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-clipping-step" x="516" y="142">03</text>
    <text class="gradient-clipping-name" x="542" y="142">So the direction is preserved</text>
    <text class="gradient-clipping-desc" x="516" y="166">Still the steepest descent</text>
    <text class="gradient-clipping-desc" x="516" y="182">direction, just a shorter step.</text>
  </g>
  <line class="gradient-clipping-line gradient-clipping-conn gradient-clipping-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradient-clipping-tip)"/>
  <g class="gradient-clipping-stage gradient-clipping-s3">
    <rect class="gradient-clipping-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-clipping-step" x="752" y="142">04</text>
    <text class="gradient-clipping-name" x="778" y="142">Value clamping does not</text>
    <text class="gradient-clipping-desc" x="752" y="166">Clamping components individually</text>
    <text class="gradient-clipping-desc" x="752" y="182">rotates the vector.</text>
  </g>
  <text class="gradient-clipping-sub" x="30" y="304">The distinction is geometric rather than stylistic: clamping components changes which direction you move in, and the whole premise of gradient descent is that the direction is correct.</text>
</svg>
