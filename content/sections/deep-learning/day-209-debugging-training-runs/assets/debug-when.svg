<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And which one is always.">
  <title>When to run each check</title>
  <style>
    .debug-when-bg   { fill: #f8fafc; }
    .debug-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debug-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debug-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debug-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debug-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .debug-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .debug-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .debug-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .debug-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .debug-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .debug-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .debug-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .debug-when-row { opacity: 1; }
    .debug-when-r0 { animation-delay: 0.00s; }
    .debug-when-r1 { animation-delay: 0.45s; }
    .debug-when-r2 { animation-delay: 0.90s; }
    .debug-when-r3 { animation-delay: 1.35s; }
    .debug-when-r4 { animation-delay: 1.80s; }
    .debug-when-row { animation: debug-when-reveal 7.3s ease-in-out infinite; }
    @keyframes debug-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="debug-when-bg" width="980" height="390"/>
  <text class="debug-when-h1"  x="30" y="40">When to run each check</text>
  <text class="debug-when-sub" x="30" y="64">And which one is always.</text>
  <rect class="debug-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="debug-when-name" x="46" y="122">Always</text>
  <text class="debug-when-desc" x="46" y="142">Two, on every new model.</text>
  <text class="debug-when-desc debug-when-row debug-when-r0" x="46" y="182">The single-batch overfit test</text>
  <text class="debug-when-desc debug-when-row debug-when-r1" x="46" y="216">Before any full training run</text>
  <text class="debug-when-desc debug-when-row debug-when-r2" x="46" y="250">The initial loss check</text>
  <text class="debug-when-desc debug-when-row debug-when-r3" x="46" y="284">Both cost seconds</text>
  <text class="debug-when-desc debug-when-row debug-when-r4" x="46" y="318">Both catch whole categories of bug</text>
  <rect class="debug-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="debug-when-name" x="526" y="122">On symptoms</text>
  <text class="debug-when-desc" x="526" y="142">Three, when needed.</text>
  <text class="debug-when-desc debug-when-row debug-when-r0" x="526" y="182">Clipping for transformers and recurrent nets</text>
  <text class="debug-when-desc debug-when-row debug-when-r1" x="526" y="216">And whenever loss spikes appear</text>
  <text class="debug-when-desc debug-when-row debug-when-r2" x="526" y="250">Anomaly detection when NaNs arrive</text>
  <text class="debug-when-desc debug-when-row debug-when-r3" x="526" y="284">Activation hooks when learning stalls</text>
  <text class="debug-when-desc debug-when-row debug-when-r4" x="526" y="318">Each has a cost; enable deliberately</text>
  <text class="debug-when-sub" x="30" y="372">Gradient clipping is close to always-on for language models specifically: loss spikes are a normal part of transformer training at scale, and clipping is what makes them survivable.</text>
</svg>
