<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Gradients too small to represent.">
  <title>The mixed precision failure</title>
  <style>
    .amp-underflow-bg   { fill: #f8fafc; }
    .amp-underflow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-underflow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-underflow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-underflow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-underflow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .amp-underflow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .amp-underflow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .amp-underflow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .amp-underflow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .amp-underflow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .amp-underflow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .amp-underflow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .amp-underflow-row { opacity: 1; }
    .amp-underflow-r0 { animation-delay: 0.00s; }
    .amp-underflow-r1 { animation-delay: 0.45s; }
    .amp-underflow-r2 { animation-delay: 0.90s; }
    .amp-underflow-r3 { animation-delay: 1.35s; }
    .amp-underflow-r4 { animation-delay: 1.80s; }
    .amp-underflow-row { animation: amp-underflow-reveal 7.3s ease-in-out infinite; }
    @keyframes amp-underflow-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="amp-underflow-bg" width="980" height="390"/>
  <text class="amp-underflow-h1"  x="30" y="40">The mixed precision failure</text>
  <text class="amp-underflow-sub" x="30" y="64">Gradients too small to represent.</text>
  <rect class="amp-underflow-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="amp-underflow-name" x="46" y="122">Unscaled half precision</text>
  <text class="amp-underflow-desc" x="46" y="142">Gradients vanish to zero.</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r0" x="46" y="182">Half precision has a limited exponent range</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r1" x="46" y="216">Small gradients round to exactly zero</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r2" x="46" y="250">Those parameters stop updating</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r3" x="46" y="284">The loss plateaus for no visible reason</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r4" x="46" y="318">And nothing reports an error</text>
  <rect class="amp-underflow-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="amp-underflow-name" x="526" y="122">With loss scaling</text>
  <text class="amp-underflow-desc" x="526" y="142">Shifted into range.</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r0" x="526" y="182">Multiply the loss by a large factor</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r1" x="526" y="216">Gradients scale up with it</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r2" x="526" y="250">Unscale before the optimiser step</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r3" x="526" y="284">The scale adapts if overflow occurs</text>
  <text class="amp-underflow-desc amp-underflow-row amp-underflow-r4" x="526" y="318">Which is what a gradient scaler does</text>
  <text class="amp-underflow-sub" x="30" y="372">This is a numerical problem rather than a modelling one, and it is worth recognising by its symptom: a run that plateaus after switching to mixed precision and not before.</text>
</svg>
