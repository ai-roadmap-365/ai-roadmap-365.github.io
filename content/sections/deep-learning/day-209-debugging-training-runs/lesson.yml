learning_promise: 'Master systematic debugging protocols for deep learning: detect vanishing and exploding gradients, implement gradient clipping with torch.nn.utils.clip_grad_norm_, use autograd anomaly detection to trace NaNs, execute the single-batch overfitting sanity test, and inspect activation histograms.'
objectives:
  - 'Diagnose and resolve vanishing and exploding gradients across deep neural network architectures.'
  - 'Implement gradient norm clipping using torch.nn.utils.clip_grad_norm_ to stabilize training on steep loss surfaces.'
  - 'Activate PyTorch autograd anomaly detection (torch.autograd.set_detect_anomaly) to isolate exact NaN/Inf origin nodes.'
  - 'Execute the single-batch overfitting sanity test to verify architectural and computational graph integrity.'
  - 'Log and visualize loss curves, gradient norms, and activation distributions in TensorBoard.'
