visuals:
  - id: neural-training-failure-diagnostics
    file: assets/neural-training-failure-diagnostics.svg
    type: diagram
    title: Neural Network Training Failure Diagnostic Decision Tree
    alt: Diagnostic decision flowchart for debugging neural network training failures mapping loss symptoms to root causes and fixes
    description: Comprehensive diagnostic triage matrix mapping classical deep learning failure symptoms (NaN loss, stagnation at chance accuracy, inability to overfit, generalization gap) to concrete technical root causes and remediation protocols.
  - id: gradient-clipping-norm-threshold
    file: assets/gradient-clipping-norm-threshold.svg
    type: diagram
    title: Gradient Norm Clipping Geometry and Threshold Scaling
    alt: Gradient clipping by norm showing unconstrained exploding gradient vector scaled back within maximum threshold circle
    description: Geometric vector analysis of gradient norm clipping illustrating how total parameter gradients exceeding the Euclidean maximum norm threshold are scaled down uniformly without altering descent direction.
