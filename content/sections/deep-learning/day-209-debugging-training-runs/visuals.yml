visuals:
  - id: neural-training-failure-diagnostics
    file: assets/neural-training-failure-diagnostics.svg
    type: diagram
    title: Neural Network Training Failure Diagnostic Decision Tree
    alt: Diagnostic decision flowchart for debugging neural network training failures mapping loss symptoms to root causes and fixes
    description: Comprehensive diagnostic triage matrix mapping classical deep learning failure symptoms (NaN loss, stagnation at chance accuracy, inability to overfit, generalization gap) to concrete technical root causes and remediation protocols.
  - id: gradient-clipping-norm-threshold
    file: assets/gradient-clipping-norm-threshold.svg
    type: diagram
    title: Gradient Norm Clipping Geometry and Threshold Scaling
    alt: Gradient clipping by norm showing unconstrained exploding gradient vector scaled back within maximum threshold circle
    description: Geometric vector analysis of gradient norm clipping illustrating how total parameter gradients exceeding the Euclidean maximum norm threshold are scaled down uniformly without altering descent direction.
  - id: golden-protocol
    file: assets/golden-protocol.svg
    type: diagram
    title: 'Four checks, before any training'
    alt: 'Diagram: the four-step debugging protocol before a full training run'
    description: 'A four-stage description of the debugging protocol covering initial loss verification, single-batch overfitting, gradient norms and data alignment.'
  - id: silent-or-loud
    file: assets/silent-or-loud.svg
    type: diagram
    title: 'Why deep learning needs its own debugging'
    alt: 'Diagram: conventional software failure compared with neural network failure'
    description: 'A two-column comparison of how conventional software fails against how a neural network fails.'
  - id: initial-loss
    file: assets/initial-loss.svg
    type: diagram
    title: 'The predictable initial loss'
    alt: 'Diagram: what an untrained model''s loss should be and what deviation means'
    description: 'A four-stage description of the initial loss check covering the theoretical value, the uniform-prediction assumption, and what high and low deviations indicate.'
  - id: gradient-clipping
    file: assets/gradient-clipping.svg
    type: diagram
    title: 'Clipping by norm, not by value'
    alt: 'Diagram: gradient norm clipping compared with element-wise value clamping'
    description: 'A four-stage description of gradient clipping covering the cliff problem, norm-based scaling, direction preservation and the alternative''s distortion.'
  - id: nan-hunting
    file: assets/nan-hunting.svg
    type: diagram
    title: 'Finding where a NaN was born'
    alt: 'Diagram: locating the operation that produced a NaN in the backward pass'
    description: 'A four-stage description of NaN diagnosis covering the symptom, anomaly detection, common causes and the performance cost.'
  - id: amp-underflow
    file: assets/amp-underflow.svg
    type: diagram
    title: 'The mixed precision failure'
    alt: 'Diagram: gradient underflow in half precision and the loss scaling remedy'
    description: 'A two-column comparison of unscaled half-precision gradients against loss-scaled ones.'
  - id: activation-hooks
    file: assets/activation-hooks.svg
    type: diagram
    title: 'Watching activations without editing the model'
    alt: 'Diagram: what activation distribution tracking reveals about a training run'
    description: 'A four-stage description of activation monitoring covering hooks, dead units, saturation and representation collapse.'
  - id: jet-engine
    file: assets/jet-engine.svg
    type: diagram
    title: 'Diagnosing a jet engine'
    alt: 'Diagram: systematic engine diagnosis compared with replacing parts at random'
    description: 'A two-column comparison of instrument-driven diagnosis against trial-and-error part replacement.'
  - id: debug-implications
    file: assets/debug-implications.svg
    type: diagram
    title: 'Four practical consequences'
    alt: 'Diagram: the cost, coverage and habit implications of systematic debugging'
    description: 'A four-stage description of debugging implications covering check cost, protocol coverage, tooling overhead and post-mortem practice.'
  - id: debug-when
    file: assets/debug-when.svg
    type: diagram
    title: 'When to run each check'
    alt: 'Diagram: when each debugging technique applies'
    description: 'A two-column comparison of checks to run always against those reserved for specific symptoms.'
