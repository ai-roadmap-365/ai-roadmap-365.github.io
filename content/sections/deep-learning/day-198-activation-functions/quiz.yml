questions:
  - question: 'What happens mathematically if all activation functions in an L-layer deep neural network are purely linear: f(z) = z?'
    options:
      - 'The network trains 100 times faster without losing accuracy'
      - 'The whole network collapses into one linear map'
      - 'The gradients explode to infinity on epoch 1'
      - 'The weights automatically normalize to unit length'
    answer_index: 1
    explanation: 'Matrix multiplication is associative. A product of linear weight matrices W_L * W_{L-1} * ... * W_1 is simply a single matrix W_effective, rendering depth completely useless.'
  - question: 'What is the maximum value of the derivative of the standard Logistic Sigmoid function sigma(z) = 1 / (1 + exp(-z)), and where does it occur?'
    options:
      - 'Max derivative is 0.50 at z = -1'
      - 'Max derivative is 1.0 at z = 10'
      - '0.25, at z = 0'
      - 'Max derivative is undefined'
    answer_index: 2
    explanation: 'At z=0, sigma(0) = 0.5. The derivative is 0.5 * (1 - 0.5) = 0.25. When chained across 10 layers, 0.25^10 ~ 9.5e-7, causing total vanishing gradient.'
  - question: 'Why does the standard Rectified Linear Unit (ReLU) f(z) = max(0, z) suffer from the Dying ReLU problem?'
    options:
      - 'ReLU produces NaN values when inputs exceed 100'
      - 'ReLU divides by zero when z is negative'
      - 'ReLU cannot be executed on GPUs'
      - 'A neuron stuck negative gets zero gradient forever'
    answer_index: 3
    explanation: 'When z < 0, d(ReLU)/dz = 0. Zero gradient means gradient descent will never update the incoming weights, leaving the neuron permanently dead.'
  - question: 'Why is GeLU (Gaussian Error Linear Unit) widely adopted in modern Transformer architectures like GPT, BERT, and LLaMA over standard ReLU?'
    options:
      - 'GeLU is smooth and weights inputs by the Gaussian CDF'
      - 'GeLU uses less RAM than ReLU'
      - 'GeLU eliminates the need for matrix multiplication'
      - 'GeLU converts floating point tensors to strings'
    answer_index: 0
    explanation: 'GeLU(z) = z * Phi(z) introduces a smooth curvature with non-zero curvature near zero, avoiding the harsh discontinuous derivative corner of ReLU while providing probabilistic gating.'
  - question: 'What is the mathematically robust, numerically stable formula for computing the Softmax function over logits z = [z_1, ..., z_K]?'
    options:
      - 'Divide all logits by 100 before exponentiating'
      - 'Subtract max(z) before exponentiating'
      - 'Take the logarithm of logits before exponentiating'
      - 'Add 1.0 to all negative logits'
    answer_index: 1
    explanation: 'Subtracting max(z) ensures the largest exponent is exp(0) = 1.0, preventing 64-bit/32-bit floating point overflow (inf) while leaving output probabilities mathematically unchanged.'
