visuals:
  - id: neural-activation-functions-landscape
    file: assets/neural-activation-functions-landscape.svg
    type: diagram
    title: Neural Network Activation Functions and Gradient Landscapes
    alt: Comparative mathematical curves of neural activation functions showing Sigmoid Tanh ReLU Leaky ReLU and GeLU with forward output and gradient derivatives
    description: Comprehensive mathematical comparison of Sigmoid, Tanh, ReLU, Leaky ReLU, and GeLU showing output ranges, derivative maximums, and zero-centering properties.
  - id: vanishing-gradient-pathology
    file: assets/vanishing-gradient-pathology.svg
    type: diagram
    title: Vanishing Gradient Pathology vs ReLU Constant Gradient Flow
    alt: Vanishing gradient mathematical decay through deep neural network layers comparing saturated Sigmoid against non saturating ReLU
    description: Analytical step-by-step chain rule visualization showing how Sigmoid derivatives decay exponentially across deep layers while ReLU preserves constant gradient flow.
  - id: activation-role
    file: assets/activation-role.svg
    type: diagram
    title: 'What an activation function is for'
    alt: 'Diagram: the role and requirements of an activation function'
    description: 'A four-stage description of activation functions covering their purpose, differentiability, non-saturation and computational cost.'
  - id: linear-collapse
    file: assets/linear-collapse.svg
    type: diagram
    title: 'Why linear layers collapse'
    alt: 'Diagram: why stacked linear layers reduce to a single linear layer'
    description: 'A three-stage explanation of linear collapse covering composition of linear maps, the resulting single matrix, and the consequence for depth.'
  - id: sigmoid-or-tanh
    file: assets/sigmoid-or-tanh.svg
    type: diagram
    title: 'Sigmoid and tanh'
    alt: 'Diagram: the logistic sigmoid compared with the hyperbolic tangent'
    description: 'A two-column comparison of the sigmoid and tanh activation functions by range, centring and gradient behaviour.'
  - id: vanishing-gradient
    file: assets/vanishing-gradient.svg
    type: diagram
    title: 'Why deep networks stopped learning'
    alt: 'Diagram: how small derivatives compound into vanishing gradients across layers'
    description: 'A four-stage explanation of the vanishing gradient problem covering per-layer derivatives, the chain rule product, exponential decay and its effect on early layers.'
  - id: relu-properties
    file: assets/relu-properties.svg
    type: diagram
    title: 'Why ReLU worked'
    alt: 'Diagram: the four properties that made ReLU the default activation'
    description: 'A four-stage description of ReLU covering its definition, gradient behaviour, sparsity and the dying-unit failure mode.'
  - id: relu-variants
    file: assets/relu-variants.svg
    type: diagram
    title: 'Variants that fix the zero'
    alt: 'Diagram: ReLU variants compared by their treatment of negative inputs'
    description: 'A two-column comparison of ReLU''s hard zero against variants that allow a non-zero negative response.'
  - id: gelu-swish
    file: assets/gelu-swish.svg
    type: diagram
    title: 'Why transformers use smooth activations'
    alt: 'Diagram: ReLU''s hard corner compared with the smooth GeLU and Swish curves'
    description: 'A two-column comparison of ReLU against smooth modern activations used in transformer models.'
  - id: softmax
    file: assets/softmax.svg
    type: diagram
    title: 'Softmax is different in kind'
    alt: 'Diagram: how softmax differs from element-wise activation functions'
    description: 'A four-stage description of softmax covering exponentiation, normalisation, the coupling between outputs and where it belongs.'
  - id: activation-analogy
    file: assets/activation-analogy.svg
    type: diagram
    title: 'A dimmer switch, or a valve'
    alt: 'Diagram: a linear amplifier compared with a threshold valve'
    description: 'A two-column comparison of passing a signal through unchanged against passing it through a non-linear response.'
  - id: activation-choice
    file: assets/activation-choice.svg
    type: diagram
    title: 'Choosing an activation'
    alt: 'Diagram: activation function defaults by network type'
    description: 'A four-stage description of activation choices for hidden layers, transformers, output layers and legacy architectures.'
  - id: activation-when
    file: assets/activation-when.svg
    type: diagram
    title: 'When the choice matters'
    alt: 'Diagram: when activation function choice affects results'
    description: 'A two-column comparison of situations where the activation choice matters against those where it does not.'
