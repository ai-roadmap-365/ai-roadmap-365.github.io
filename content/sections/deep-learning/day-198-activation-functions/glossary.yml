terms:
  - term: 'Activation Function'
    definition: 'A non-linear mathematical transformation applied to the linear weighted sum of a neural network layer to enable representation of non-linear functions.'
  - term: 'Vanishing Gradient Problem'
    definition: 'A pathology in deep networks where backpropagated error gradients decay exponentially toward zero as they pass through saturating activation layers.'
  - term: 'Rectified Linear Unit (ReLU)'
    definition: 'An activation function defined as f(z) = max(0, z), possessing a constant unit derivative for positive inputs and zero upper saturation.'
  - term: 'Dying ReLU'
    definition: 'A failure mode where neurons become permanently inactive because their pre-activation falls into the negative regime where the gradient is zero.'
  - term: 'Leaky ReLU'
    definition: 'A variant of ReLU that introduces a small positive slope alpha (e.g., 0.01) for negative inputs to prevent gradient starvation.'
  - term: 'Gaussian Error Linear Unit (GeLU)'
    definition: 'A smooth non-monotonic activation function weighting inputs by the standard Gaussian cumulative distribution function.'
  - term: 'Softmax'
    definition: 'A normalized exponential function that maps a K-dimensional vector of arbitrary real logits into a categorical probability distribution summing to 1.0.'
  - term: 'Numerical Gradient Checking'
    definition: 'A diagnostic technique comparing analytical backpropagation derivatives against finite-difference approximations (f(z+eps) - f(z-eps)) / (2*eps).'
