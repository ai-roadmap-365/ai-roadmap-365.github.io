<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A small slope, or a smooth curve.">
  <title>Variants that fix the zero</title>
  <style>
    .relu-variants-bg   { fill: #f8fafc; }
    .relu-variants-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-variants-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-variants-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-variants-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-variants-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .relu-variants-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .relu-variants-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .relu-variants-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .relu-variants-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .relu-variants-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .relu-variants-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .relu-variants-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .relu-variants-row { opacity: 1; }
    .relu-variants-r0 { animation-delay: 0.00s; }
    .relu-variants-r1 { animation-delay: 0.45s; }
    .relu-variants-r2 { animation-delay: 0.90s; }
    .relu-variants-r3 { animation-delay: 1.35s; }
    .relu-variants-r4 { animation-delay: 1.80s; }
    .relu-variants-row { animation: relu-variants-reveal 7.3s ease-in-out infinite; }
    @keyframes relu-variants-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="relu-variants-bg" width="980" height="390"/>
  <text class="relu-variants-h1"  x="30" y="40">Variants that fix the zero</text>
  <text class="relu-variants-sub" x="30" y="64">A small slope, or a smooth curve.</text>
  <rect class="relu-variants-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="relu-variants-name" x="46" y="122">Hard zero</text>
  <text class="relu-variants-desc" x="46" y="142">Plain ReLU.</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r0" x="46" y="182">Exactly zero for negative inputs</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r1" x="46" y="216">Maximum sparsity</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r2" x="46" y="250">Cheapest possible</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r3" x="46" y="284">No gradient below zero</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r4" x="46" y="318">Units can die permanently</text>
  <rect class="relu-variants-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="relu-variants-name" x="526" y="122">A negative slope</text>
  <text class="relu-variants-desc" x="526" y="142">Three variants.</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r0" x="526" y="182">Leaky ReLU: a small fixed slope</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r1" x="526" y="216">PReLU: that slope is learned</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r2" x="526" y="250">ELU: a smooth exponential curve</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r3" x="526" y="284">Units always have some gradient</text>
  <text class="relu-variants-desc relu-variants-row relu-variants-r4" x="526" y="318">At a small cost in sparsity and speed</text>
  <text class="relu-variants-sub" x="30" y="372">The variants solve a real problem and are not universally adopted, which is worth noticing: plain ReLU remains competitive because dying units are less common in practice than the failure mode suggests.</text>
</svg>
