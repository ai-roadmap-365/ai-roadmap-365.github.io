<svg role="img" aria-label="Vanishing gradient mathematical decay through deep neural network layers comparing saturated Sigmoid against non saturating ReLU" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Vanishing Gradient Pathology vs ReLU Constant Gradient Flow</title>
  <defs>
    <linearGradient id="bg198b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="vanishCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg198b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">THE VANISHING GRADIENT PATHOLOGY IN DEEP NETWORKS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">How Chain Rule Derivative Multiplication Shrinks Gradients to Zero in Deep Architectures</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#vanishCard)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Sigmoid Chain Rule Decay -->
    <rect x="25" y="25" width="710" height="115" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="6"/>
    <text x="45" y="50" fill="#f87171" font-family="system-ui" font-size="12" font-weight="700">Deep Sigmoid Network Gradient Flow: dL/dW_1 = dL/da_L * prod(sigma&#39; * W_l)</text>
    <!-- Stages -->
    <circle cx="100" cy="90" r="18" fill="#ef4444"/> <text x="100" y="94" fill="#fff" font-size="9" text-anchor="middle">Grad: 1.0</text>
    <line x1="120" y1="90" x2="230" y2="90" stroke="#f87171" stroke-width="2"/>
    <text x="175" y="80" fill="#fca5a5" font-size="8" text-anchor="middle">x 0.25</text>
    <circle cx="250" cy="90" r="18" fill="#ef4444"/> <text x="250" y="94" fill="#fff" font-size="9" text-anchor="middle">0.25</text>
    <line x1="270" y1="90" x2="380" y2="90" stroke="#f87171" stroke-width="2"/>
    <text x="325" y="80" fill="#fca5a5" font-size="8" text-anchor="middle">x 0.25</text>
    <circle cx="400" cy="90" r="18" fill="#ef4444"/> <text x="400" y="94" fill="#fff" font-size="9" text-anchor="middle">0.062</text>
    <line x1="420" y1="90" x2="530" y2="90" stroke="#f87171" stroke-width="2"/>
    <text x="475" y="80" fill="#fca5a5" font-size="8" text-anchor="middle">x 0.25</text>
    <circle cx="550" cy="90" r="18" fill="#ef4444"/> <text x="550" y="94" fill="#fff" font-size="9" text-anchor="middle">0.015</text>
    <line x1="570" y1="90" x2="660" y2="90" stroke="#ef4444" stroke-width="2"/>
    <text x="695" y="94" fill="#ef4444" font-size="10" font-weight="700">~ 0.000 (FROZEN)</text>

    <!-- ReLU Unblocked Flow -->
    <rect x="25" y="155" width="710" height="115" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="45" y="180" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700">Deep ReLU Network Gradient Flow: dL/dW_1 = dL/da_L * prod(1.0 * W_l)</text>
    <circle cx="100" cy="220" r="18" fill="#10b981"/> <text x="100" y="224" fill="#fff" font-size="9" text-anchor="middle">Grad: 1.0</text>
    <line x1="120" y1="220" x2="230" y2="220" stroke="#34d399" stroke-width="2"/>
    <text x="175" y="210" fill="#6ee7b7" font-size="8" text-anchor="middle">x 1.0</text>
    <circle cx="250" cy="220" r="18" fill="#10b981"/> <text x="250" y="224" fill="#fff" font-size="9" text-anchor="middle">1.0</text>
    <line x1="270" y1="220" x2="380" y2="220" stroke="#34d399" stroke-width="2"/>
    <text x="325" y="210" fill="#6ee7b7" font-size="8" text-anchor="middle">x 1.0</text>
    <circle cx="400" cy="220" r="18" fill="#10b981"/> <text x="400" y="224" fill="#fff" font-size="9" text-anchor="middle">1.0</text>
    <line x1="420" y1="220" x2="530" y2="220" stroke="#34d399" stroke-width="2"/>
    <text x="475" y="210" fill="#6ee7b7" font-size="8" text-anchor="middle">x 1.0</text>
    <circle cx="550" cy="220" r="18" fill="#10b981"/> <text x="550" y="224" fill="#fff" font-size="9" text-anchor="middle">1.0</text>
    <line x1="570" y1="220" x2="660" y2="220" stroke="#10b981" stroke-width="2"/>
    <text x="695" y="224" fill="#10b981" font-size="10" font-weight="700">CONSTANT FLOW</text>
  </g>
</svg>
