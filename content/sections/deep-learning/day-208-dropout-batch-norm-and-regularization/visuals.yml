visuals:
  - id: dropout-ensemble-subnetworks
    file: assets/dropout-ensemble-subnetworks.svg
    type: diagram
    title: Dropout Regularization and Implicit Ensemble Architecture
    alt: Dropout regularization mechanics showing random neuron deactivation during training creating an implicit ensemble of subnetworks and deterministic scaling at test time
    description: Structural comparison of inverted dropout during training (stochastically disabling neurons with probability p and scaling by 1/(1-p)) versus deterministic full-capacity evaluation during inference.
  - id: batch-norm-vs-layer-norm-geometry
    file: assets/batch-norm-vs-layer-norm-geometry.svg
    type: diagram
    title: Batch Normalization vs Layer Normalization Geometric Comparison
    alt: Comparison of normalization geometry contrasting Batch Normalization across batch dimension against Layer Normalization across feature dimensions
    description: Geometric 3D tensor slice comparison showing how BatchNorm computes statistics across the mini-batch dimension per channel, whereas LayerNorm normalizes across feature/embedding dimensions per sample.
  - id: three-mechanisms
    file: assets/three-mechanisms.svg
    type: diagram
    title: 'Three mechanisms, two problems'
    alt: 'Diagram: dropout, normalisation and weight decay as responses to two training problems'
    description: 'A three-stage description of regularisation and normalisation covering dropout, normalisation layers and weight decay.'
  - id: inverted-dropout
    file: assets/inverted-dropout.svg
    type: diagram
    title: 'Inverted dropout'
    alt: 'Diagram: why dropout scales activations during training rather than at inference'
    description: 'A four-stage description of inverted dropout covering the mask, the scaling factor, the expectation and the inference behaviour.'
  - id: batchnorm-steps
    file: assets/batchnorm-steps.svg
    type: diagram
    title: 'Batch normalisation, step by step'
    alt: 'Diagram: the five steps of a batch normalisation layer'
    description: 'A five-stage description of batch normalisation covering mean, variance, standardisation, the learned affine transform and running statistics.'
  - id: batchnorm-or-layernorm
    file: assets/batchnorm-or-layernorm.svg
    type: diagram
    title: 'BatchNorm or LayerNorm'
    alt: 'Diagram: batch normalisation compared with layer normalisation by averaging axis'
    description: 'A two-column comparison of batch and layer normalisation by the axis they normalise over and their consequences.'
  - id: train-eval-modes
    file: assets/train-eval-modes.svg
    type: diagram
    title: 'The mode bug'
    alt: 'Diagram: what happens when evaluation runs in training mode'
    description: 'A four-stage description of the train/eval mode bug covering dropout during evaluation, unstable batch statistics, the resulting metrics and the absence of any error.'
  - id: team-analogy
    file: assets/team-analogy.svg
    type: diagram
    title: 'A team where nobody is indispensable'
    alt: 'Diagram: a team with single points of failure compared with one where roles overlap'
    description: 'A two-column comparison of a specialised team against one where members are randomly unavailable, as an analogy for dropout.'
  - id: advanced-regularisation
    file: assets/advanced-regularisation.svg
    type: diagram
    title: 'Three advanced techniques'
    alt: 'Diagram: group normalisation, label smoothing and stochastic depth compared'
    description: 'A three-stage description of advanced regularisation covering group normalisation, label smoothing and stochastic depth.'
  - id: regularisation-implications
    file: assets/regularisation-implications.svg
    type: diagram
    title: 'Four consequences'
    alt: 'Diagram: the cost, batch size, calibration and interaction implications of regularisation layers'
    description: 'A four-stage description of regularisation implications covering compute cost, batch size sensitivity, calibration and layer interactions.'
  - id: regularisation-when
    file: assets/regularisation-when.svg
    type: diagram
    title: 'Which mechanism, and when'
    alt: 'Diagram: choosing between regularisation and normalisation mechanisms'
    description: 'A two-column comparison of regularisation choices for convolutional vision against sequence models.'
