terms:
  - term: 'Inverted Dropout'
    definition: 'A regularization technique that randomly zeros activations with probability p during training and scales surviving activations by 1/(1-p).'
  - term: 'Batch Normalization'
    definition: 'A normalization layer that standardizes layer pre-activations across the mini-batch dimension, applying learned affine scale and shift parameters.'
  - term: 'Layer Normalization'
    definition: 'A normalization layer that standardizes activations across the feature/channel dimensions of a single sample independently of other batch samples.'
  - term: 'Internal Covariate Shift'
    definition: 'The historical hypothesis that the distribution of layer inputs changes during training as preceding layer parameters are updated.'
  - term: 'Running Statistics'
    definition: 'Exponential moving averages of mean and variance accumulated by BatchNorm during training to use for deterministic inference.'
  - term: 'Co-adaptation'
    definition: 'A pathological condition where neurons depend heavily on the specific presence of other neurons to correct their errors.'
  - term: 'model.eval()'
    definition: 'A PyTorch method setting the module and all submodules into evaluation mode, deactivating Dropout and freezing BatchNorm running stats.'
  - term: 'RMSNorm'
    definition: 'Root Mean Square Normalization, a streamlined variant of LayerNorm that scales by root mean square without subtracting the mean.'
