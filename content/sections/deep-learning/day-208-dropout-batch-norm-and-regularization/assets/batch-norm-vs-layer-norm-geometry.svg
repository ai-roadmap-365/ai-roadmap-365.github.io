<svg role="img" aria-label="Comparison of normalization geometry contrasting Batch Normalization across batch dimension against Layer Normalization across feature dimensions" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Batch Normalization vs Layer Normalization Geometric Comparison</title>
  <defs>
    <linearGradient id="bg208b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card208b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg208b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BATCH NORMALIZATION VS LAYER NORMALIZATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Feature Scaling across the Batch Dimension (N) vs across Channels/Embeddings (C, H, W)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card208b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Left Box: Batch Normalization -->
    <rect x="30" y="25" width="335" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Batch Normalization (BatchNorm1d/2d)</text>
    <!-- Visual 3D Block representation -->
    <rect x="75" y="75" width="240" height="75" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="195" y="95" fill="#f8fafc" font-size="9" text-anchor="middle">Normalizes across BATCH (N samples)</text>
    <text x="195" y="115" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Independent per Channel / Feature C</text>
    <text x="195" y="135" fill="#94a3b8" font-size="8" text-anchor="middle">mu_B = (1/m) sum(x), sigma_B^2 = (1/m) sum((x - mu)^2)</text>

    <text x="197" y="180" fill="#cbd5e1" font-size="9" text-anchor="middle">Learned Parameters: gamma (scale), beta (shift)</text>
    <text x="197" y="200" fill="#cbd5e1" font-size="9" text-anchor="middle">Maintains running_mean &amp; running_var for eval</text>
    <text x="197" y="225" fill="#fbbf24" font-size="9" text-anchor="middle">Dominant in Computer Vision (CNNs)</text>
    <text x="197" y="245" fill="#f43f5e" font-size="8" text-anchor="middle">Fails when batch size is small (N &lt; 8)</text>

    <!-- Right Box: Layer Normalization -->
    <rect x="395" y="25" width="335" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Layer Normalization (LayerNorm)</text>
    <!-- Visual 3D Block representation -->
    <rect x="440" y="75" width="240" height="75" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="560" y="95" fill="#f8fafc" font-size="9" text-anchor="middle">Normalizes across FEATURES / HIDDEN CHANNELS</text>
    <text x="560" y="115" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Independent per Individual Sample N</text>
    <text x="560" y="135" fill="#94a3b8" font-size="8" text-anchor="middle">mu_L = (1/d) sum(x), sigma_L^2 = (1/d) sum((x - mu)^2)</text>

    <text x="562" y="180" fill="#cbd5e1" font-size="9" text-anchor="middle">No batch-size dependency; identical in train &amp; eval</text>
    <text x="562" y="200" fill="#cbd5e1" font-size="9" text-anchor="middle">Works seamlessly on batch size 1</text>
    <text x="562" y="225" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Universal Standard for Transformers &amp; LLMs</text>
    <text x="562" y="245" fill="#38bdf8" font-size="8" text-anchor="middle">Natural Language, Audio &amp; Sequential Models</text>
  </g>
</svg>
