<svg role="img" aria-label="Dropout regularization mechanics showing random neuron deactivation during training creating an implicit ensemble of subnetworks and deterministic scaling at test time" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Dropout Regularization and Implicit Ensemble Architecture</title>
  <defs>
    <linearGradient id="bg208a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card208" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg208a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DROPOUT REGULARIZATION &amp; IMPLICIT ENSEMBLES</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Inverted Dropout Training (p=0.5) vs Deterministic Inference Evaluation</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card208)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Left Box: Training Mode (model.train()) -->
    <rect x="30" y="25" width="335" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="197" y="50" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Training Phase (model.train())</text>
    <text x="197" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Bernoulli Mask M ~ Bern(1-p), Inverted Scaling / (1-p)</text>
    <!-- Neurons: Active and Dropped -->
    <circle cx="80" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="80" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h1</text>
    <circle cx="160" cy="115" r="16" fill="#334155" stroke="#f43f5e" stroke-dasharray="3,3"/>
    <text x="160" y="119" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">X</text>
    <circle cx="240" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="240" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h3</text>
    <circle cx="320" cy="115" r="16" fill="#334155" stroke="#f43f5e" stroke-dasharray="3,3"/>
    <text x="320" y="119" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">X</text>

    <text x="197" y="170" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h_train = (h * M) / (1 - p)</text>
    <text x="197" y="195" fill="#cbd5e1" font-size="9" text-anchor="middle">Prevents complex neuron co-adaptation</text>
    <text x="197" y="215" fill="#cbd5e1" font-size="9" text-anchor="middle">Forces every feature detector to be self-reliant</text>
    <text x="197" y="245" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">Implicit Ensemble of 2^N Subnets</text>

    <!-- Right Box: Eval Mode (model.eval()) -->
    <rect x="395" y="25" width="335" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="562" y="50" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Inference Phase (model.eval())</text>
    <text x="562" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Dropout Disabled, All Neurons Active (Identity Pass)</text>
    <!-- All Neurons Active -->
    <circle cx="445" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="445" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h1</text>
    <circle cx="525" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="525" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h2</text>
    <circle cx="605" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="605" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h3</text>
    <circle cx="685" cy="115" r="16" fill="#10b981" stroke="#34d399"/>
    <text x="685" y="119" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h4</text>

    <text x="562" y="170" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">h_eval = h (Exact Identity)</text>
    <text x="562" y="195" fill="#cbd5e1" font-size="9" text-anchor="middle">Zero scaling needed at test time!</text>
    <text x="562" y="215" fill="#cbd5e1" font-size="9" text-anchor="middle">Inverted scaling during training preserved E[h]</text>
    <text x="562" y="245" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Deterministic Fast Prediction</text>
  </g>
</svg>
