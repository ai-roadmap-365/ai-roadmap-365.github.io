questions:
  - question: 'What is Inverted Dropout, and why is it preferred over original classical Dropout in modern deep learning frameworks like PyTorch?'
    options:
      - 'It doubles the learning rate during testing'
      - 'It drops weights instead of activations'
      - 'It inverts every negative number into a positive number'
      - 'It divides by (1-p) so the expected activation is unchanged'
    answer_index: 3
    explanation: 'By scaling by 1/(1-p) during training, no scaling or modification is needed at test time. The inference pass runs faster and with zero extra hyperparameter dependencies.'
  - question: 'What are the two learnable affine parameters in Batch Normalization, and what mathematical role do they play?'
    options:
      - 'Gamma and Beta, restoring representational capacity'
      - 'Learning rate and momentum'
      - 'Batch size and worker count'
      - 'Weight decay and epsilon'
    answer_index: 0
    explanation: 'Gamma scales the normalized tensor y = gamma * x_hat + beta. If the optimal representation requires a different variance or non-zero mean, the network learns gamma and beta via gradient descent.'
  - question: 'Why does Batch Normalization behave differently during model.train() versus model.eval()?'
    options:
      - 'BatchNorm is deleted during eval'
      - 'Batch statistics in training; running ones in eval'
      - 'BatchNorm reverses the direction of gradients in eval'
      - 'BatchNorm only runs on GPU in train mode'
    answer_index: 1
    explanation: 'In eval mode, predictions on a single sample should not depend on what other samples happen to be in the batch; using running statistics ensures deterministic, sample-independent inference.'
  - question: 'Why is Layer Normalization (LayerNorm) universally preferred over Batch Normalization in Transformer architectures and Large Language Models?'
    options:
      - 'LayerNorm does not require floating point numbers at all'
      - 'LayerNorm uses less disk space'
      - 'LayerNorm normalises per sample, so batch size is irrelevant'
      - 'LayerNorm has no parameters'
    answer_index: 2
    explanation: 'In NLP and sequence modeling, variable sequence lengths and small batch sizes make batch statistics unstable. LayerNorm normalizes across the feature dimension per token independently.'
  - question: 'What severe silent bug occurs if an engineer evaluates a model containing BatchNorm and Dropout without calling model.eval()?'
    options:
      - 'The model parameters are permanently erased'
      - 'Python throws a fatal SyntaxError immediately'
      - 'The GPU runs out of memory'
      - 'Dropout keeps zeroing units and BatchNorm uses test batches'
    answer_index: 3
    explanation: 'Forgetting model.eval() leaves Dropout active and corrupts BatchNorm statistics, producing noisy, degraded test predictions without throwing an explicit error.'
