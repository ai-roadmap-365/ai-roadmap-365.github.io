terms:
  - term: 'Transformer Block'
    definition: 'A fundamental repeating structural unit composed of a Multi-Head Attention layer, a Feedforward Network, Layer Normalization, and Residual Connections.'
  - term: 'Position-Wise Feedforward Network (FFN)'
    definition: 'A two-layer MLP applied identically and independently to each token position, expanding the hidden dimension by 4x.'
  - term: 'Pre-LN (Pre-Layer Normalization)'
    definition: 'A Transformer block topology where LayerNorm is applied to the input branch before Multi-Head Attention and FFN sublayers.'
  - term: 'Post-LN (Post-Layer Normalization)'
    definition: 'The original Vaswani topology where LayerNorm is applied directly after the residual addition.'
  - term: 'Cross-Attention (Encoder-Decoder Attention)'
    definition: 'An attention sublayer where decoder queries attend across encoder key-value memory representations.'
  - term: 'Residual Connection'
    definition: 'An additive skip connection (x + SubLayer(x)) that preserves gradient magnitude across deep layers.'
  - term: 'SwiGLU'
    definition: 'A Swish-gated linear unit activation function used in modern Transformer FFNs.'
  - term: 'Layer Normalization'
    definition: 'An operation that normalizes features across the embedding channel dimension independently for each token.'
