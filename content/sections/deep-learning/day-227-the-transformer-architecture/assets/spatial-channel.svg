<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Neither substitutes for the other.">
  <title>Two mixers, two jobs</title>
  <style>
    .spatial-channel-bg   { fill: #f8fafc; }
    .spatial-channel-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-channel-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-channel-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-channel-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-channel-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-channel-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spatial-channel-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spatial-channel-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spatial-channel-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spatial-channel-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spatial-channel-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spatial-channel-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spatial-channel-row { opacity: 1; }
    .spatial-channel-r0 { animation-delay: 0.00s; }
    .spatial-channel-r1 { animation-delay: 0.45s; }
    .spatial-channel-r2 { animation-delay: 0.90s; }
    .spatial-channel-r3 { animation-delay: 1.35s; }
    .spatial-channel-r4 { animation-delay: 1.80s; }
    .spatial-channel-row { animation: spatial-channel-reveal 7.3s ease-in-out infinite; }
    @keyframes spatial-channel-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="spatial-channel-bg" width="980" height="390"/>
  <text class="spatial-channel-h1"  x="30" y="40">Two mixers, two jobs</text>
  <text class="spatial-channel-sub" x="30" y="64">Neither substitutes for the other.</text>
  <rect class="spatial-channel-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="spatial-channel-name" x="46" y="122">Attention</text>
  <text class="spatial-channel-desc" x="46" y="142">Across positions.</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r0" x="46" y="182">Each token sees every other token</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r1" x="46" y="216">Weights depend on the content</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r2" x="46" y="250">Mixes information between positions</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r3" x="46" y="284">Does not transform features within a token</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r4" x="46" y="318">Quadratic in sequence length</text>
  <rect class="spatial-channel-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="spatial-channel-name" x="526" y="122">Feedforward</text>
  <text class="spatial-channel-desc" x="526" y="142">Across features.</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r0" x="526" y="182">Each token processed independently</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r1" x="526" y="216">The same weights for every position</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r2" x="526" y="250">Transforms the feature vector</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r3" x="526" y="284">No information moves between positions</text>
  <text class="spatial-channel-desc spatial-channel-row spatial-channel-r4" x="526" y="318">Linear in sequence length</text>
  <text class="spatial-channel-sub" x="30" y="372">A stack of attention layers with no feedforward between them has surprisingly little capacity: mixing is not the same as transforming, and the block needs both.</text>
</svg>
