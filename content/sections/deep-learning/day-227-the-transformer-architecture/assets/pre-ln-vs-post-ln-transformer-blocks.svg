<svg role="img" aria-label="Pre-LN versus Post-LN Transformer block architecture comparison demonstrating direct identity residual gradient flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Pre-LN vs. Post-LN Transformer Architecture</title>
  <defs>
    <linearGradient id="bg227b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card227b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg227b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRE-LN VS. POST-LN TRANSFORMER BLOCKS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Why Pre-LN Enables Deep Transformer Stability Without Warmup Tuning</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card227b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Original Post-LN (Vaswani 2017) -->
    <rect x="25" y="25" width="340" height="245" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="195" y="48" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Post-LN (Original Vaswani 2017)</text>
    
    <rect x="35" y="65" width="320" height="190" fill="#1e293b" stroke="#f43f5e" rx="4"/>
    <text x="195" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">x_{l+1} = LayerNorm( x_l + SubLayer(x_l) )</text>
    <text x="195" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• LayerNorm placed ON the residual addition</text>
    <text x="195" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Gradients through residual branch are rescaled</text>
    <text x="195" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Unstable on deep networks (&gt;12 layers)</text>
    <text x="195" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• STRICTLY REQUIRES warm-up learning rate</text>
    <text x="195" y="235" fill="#fb7185" font-size="8" font-weight="700" text-anchor="middle">Fragile Deep Gradient Flow</text>

    <!-- Right: Modern Pre-LN (Standard in GPT/LLaMA) -->
    <rect x="395" y="25" width="340" height="245" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="565" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Pre-LN (Modern Standard: GPT / LLaMA)</text>
    
    <rect x="405" y="65" width="320" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="565" y="88" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">x_{l+1} = x_l + SubLayer( LayerNorm(x_l) )</text>
    <text x="565" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• LayerNorm placed BEFORE the sublayer</text>
    <text x="565" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Unimpeded identity highway x_l -&gt; x_{l+1}</text>
    <text x="565" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Rock-solid stability on 100+ layer networks</text>
    <text x="565" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Trains reliably even without warmup</text>
    <text x="565" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Direct Unscaled Identity Gradient Flow</text>
  </g>
</svg>
