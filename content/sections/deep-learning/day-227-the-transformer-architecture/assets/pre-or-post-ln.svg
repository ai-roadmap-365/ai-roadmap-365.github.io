<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="On the branch, or on the sum.">
  <title>Where normalisation goes</title>
  <style>
    .pre-or-post-ln-bg   { fill: #f8fafc; }
    .pre-or-post-ln-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-or-post-ln-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-or-post-ln-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-or-post-ln-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-or-post-ln-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pre-or-post-ln-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pre-or-post-ln-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pre-or-post-ln-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pre-or-post-ln-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pre-or-post-ln-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pre-or-post-ln-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pre-or-post-ln-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pre-or-post-ln-row { opacity: 1; }
    .pre-or-post-ln-r0 { animation-delay: 0.00s; }
    .pre-or-post-ln-r1 { animation-delay: 0.45s; }
    .pre-or-post-ln-r2 { animation-delay: 0.90s; }
    .pre-or-post-ln-r3 { animation-delay: 1.35s; }
    .pre-or-post-ln-r4 { animation-delay: 1.80s; }
    .pre-or-post-ln-row { animation: pre-or-post-ln-reveal 7.3s ease-in-out infinite; }
    @keyframes pre-or-post-ln-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pre-or-post-ln-bg" width="980" height="390"/>
  <text class="pre-or-post-ln-h1"  x="30" y="40">Where normalisation goes</text>
  <text class="pre-or-post-ln-sub" x="30" y="64">On the branch, or on the sum.</text>
  <rect class="pre-or-post-ln-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pre-or-post-ln-name" x="46" y="122">Post-normalisation</text>
  <text class="pre-or-post-ln-desc" x="46" y="142">On the residual sum.</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r0" x="46" y="182">Normalise after adding the sublayer output</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r1" x="46" y="216">The residual path is rescaled at every layer</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r2" x="46" y="250">Gradients are attenuated with depth</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r3" x="46" y="284">Needs careful warmup to train at all</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r4" x="46" y="318">The original 2017 formulation</text>
  <rect class="pre-or-post-ln-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pre-or-post-ln-name" x="526" y="122">Pre-normalisation</text>
  <text class="pre-or-post-ln-desc" x="526" y="142">On the branch.</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r0" x="526" y="182">Normalise before the sublayer</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r1" x="526" y="216">The residual stream is an untouched identity path</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r2" x="526" y="250">Gradients reach the earliest layers</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r3" x="526" y="284">Trains stably without elaborate warmup</text>
  <text class="pre-or-post-ln-desc pre-or-post-ln-row pre-or-post-ln-r4" x="526" y="318">The modern standard</text>
  <text class="pre-or-post-ln-sub" x="30" y="372">This is the residual-connection argument again: anything placed on the identity path attenuates the gradient, and moving the normalisation off it is what made hundred-layer transformers routine.</text>
</svg>
