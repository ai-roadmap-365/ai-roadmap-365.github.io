<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the two places they do not.">
  <title>Where transformer blocks belong</title>
  <style>
    .transformer-when-bg   { fill: #f8fafc; }
    .transformer-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .transformer-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transformer-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .transformer-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .transformer-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .transformer-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .transformer-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .transformer-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .transformer-when-row { opacity: 1; }
    .transformer-when-r0 { animation-delay: 0.00s; }
    .transformer-when-r1 { animation-delay: 0.45s; }
    .transformer-when-r2 { animation-delay: 0.90s; }
    .transformer-when-r3 { animation-delay: 1.35s; }
    .transformer-when-r4 { animation-delay: 1.80s; }
    .transformer-when-row { animation: transformer-when-reveal 7.3s ease-in-out infinite; }
    @keyframes transformer-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="transformer-when-bg" width="980" height="390"/>
  <text class="transformer-when-h1"  x="30" y="40">Where transformer blocks belong</text>
  <text class="transformer-when-sub" x="30" y="64">And the two places they do not.</text>
  <rect class="transformer-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="transformer-when-name" x="46" y="122">Use transformers</text>
  <text class="transformer-when-desc" x="46" y="142">Nearly all sequence work.</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r0" x="46" y="182">Language modelling and understanding</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r1" x="46" y="216">Vision, as patch sequences</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r2" x="46" y="250">Audio, code and multimodal reasoning</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r3" x="46" y="284">Anywhere a foundation model exists</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r4" x="46" y="318">The default architecture</text>
  <rect class="transformer-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="transformer-when-name" x="526" y="122">Do not</text>
  <text class="transformer-when-desc" x="526" y="142">Two clear cases.</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r0" x="526" y="182">Simple tabular data — boosted trees win</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r1" x="526" y="216">Microcontrollers with kilobytes of memory</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r2" x="526" y="250">Where quadratic buffers do not fit</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r3" x="526" y="284">Where a linear model suffices</text>
  <text class="transformer-when-desc transformer-when-row transformer-when-r4" x="526" y="318">Reaching for a transformer is not free</text>
  <text class="transformer-when-sub" x="30" y="372">The tabular case is worth stating because it is so often ignored: gradient-boosted trees remain stronger than transformers on most tabular problems and cost a fraction as much to train.</text>
</svg>
