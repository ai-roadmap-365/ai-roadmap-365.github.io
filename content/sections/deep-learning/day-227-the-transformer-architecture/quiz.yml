questions:
  - question: 'Why does almost every modern foundation model (e.g. GPT-3/4, Llama 3, Mistral) use Pre-Layer Normalization (Pre-LN) instead of original Post-LN (Vaswani et al., 2017)?'
    options:
      - 'Pre-LN makes the model run on CPUs only'
      - 'Pre-LN keeps a clean residual path'
      - 'Pre-LN eliminates the need for attention matrices'
      - 'Post-LN requires 10 times more memory'
    answer_index: 1
    explanation: 'Pre-LN preserves an uninterrupted residual identity highway, enabling robust gradient backpropagation in deep architectures.'
  - question: 'What is the structural role of the Position-Wise Feedforward Network (FFN / MLP) in a Transformer block?'
    options:
      - 'The FFN computes the learning rate'
      - 'The FFN sorts the tokens in alphabetical order'
      - 'Attention mixes tokens; the FFN transforms each'
      - 'The FFN encrypts the weights'
    answer_index: 2
    explanation: 'Self-attention mixes information across tokens; the FFN operates position-wise to transform representations non-linearly.'
  - question: 'In a Transformer Decoder layer, where do the Queries (Q), Keys (K), and Values (V) originate during Cross-Attention?'
    options:
      - 'They are randomly initialized at every generation step'
      - 'All three originate from the dataset labels'
      - 'Queries originate from the encoder; Keys and Values originate from the decoder'
      - 'Q from the decoder; K and V from the encoder'
    answer_index: 3
    explanation: 'In cross-attention, decoder queries search against the memory keys and values produced by the encoder.'
  - question: 'What is the SwiGLU activation function used in modern Transformer feedforward networks (LLaMA, PaLM) instead of standard ReLU?'
    options:
      - 'A Swish-gated linear unit'
      - 'A convolutional filter'
      - 'A replacement for the softmax function'
      - 'A linear activation with zero bias'
    answer_index: 0
    explanation: 'SwiGLU (Shazeer, 2020) provides superior gradient flow and empirical performance over standard ReLU/GELU activations.'
  - question: 'Why are Residual Connections (He et al., 2016) essential to the functioning of deep Transformer stacks?'
    options:
      - 'They reduce the number of tokens in the sentence'
      - 'They give gradients a direct path to the embeddings'
      - 'They prevent the model from using GPU memory'
      - 'They eliminate the need for Layer Normalization'
    answer_index: 1
    explanation: 'Residual shortcuts prevent gradient vanishing, allowing gradients to propagate directly through deep Transformer stacks.'
