visuals:
  - id: transformer-full-architecture-encoder-decoder
    file: assets/transformer-full-architecture-encoder-decoder.svg
    type: diagram
    title: 'Complete Transformer Encoder-Decoder Architecture'
    alt: Complete Transformer Encoder Decoder architecture diagram showing stacked attention blocks residual connections feed forward networks and cross attention
    description: 'Vaswani et al. (2017) full Transformer architecture: Encoder stack, Decoder stack, Cross-Attention bridging, and classification head.'
  - id: pre-ln-vs-post-ln-transformer-blocks
    file: assets/pre-ln-vs-post-ln-transformer-blocks.svg
    type: diagram
    title: 'Pre-LN vs. Post-LN Transformer Architecture'
    alt: Pre-LN versus Post-LN Transformer block architecture comparison demonstrating direct identity residual gradient flow
    description: 'Structural comparison of Pre-LN vs Post-LN transformer blocks highlighting residual gradient highway stability.'
  - id: block-anatomy
    file: assets/block-anatomy.svg
    type: diagram
    title: 'What a transformer block contains'
    alt: 'Diagram: the four components of a transformer block'
    description: 'A four-stage description of a transformer block covering attention, the residual connection, the feedforward network and the second residual.'
  - id: spatial-channel
    file: assets/spatial-channel.svg
    type: diagram
    title: 'Two mixers, two jobs'
    alt: 'Diagram: attention as a spatial mixer compared with the feedforward network as a channel mixer'
    description: 'A two-column comparison of attention and feedforward layers by what each mixes.'
  - id: pre-or-post-ln
    file: assets/pre-or-post-ln.svg
    type: diagram
    title: 'Where normalisation goes'
    alt: 'Diagram: post-normalisation compared with pre-normalisation in a transformer block'
    description: 'A two-column comparison of post-layer-norm and pre-layer-norm transformer configurations.'
  - id: ffn
    file: assets/ffn.svg
    type: diagram
    title: 'The feedforward network'
    alt: 'Diagram: the structure and parameter share of the position-wise feedforward network'
    description: 'A four-stage description of the feedforward sublayer covering expansion, non-linearity, projection and its share of model parameters.'
  - id: modern-refinements
    file: assets/modern-refinements.svg
    type: diagram
    title: 'Four modern refinements'
    alt: 'Diagram: four refinements to the standard transformer block'
    description: 'A four-stage description of transformer refinements covering RMS normalisation, gated feedforward activations, depth scaling and layer scaling.'
  - id: moe
    file: assets/moe.svg
    type: diagram
    title: 'Mixture of experts'
    alt: 'Diagram: how sparse expert routing decouples parameter count from per-token compute'
    description: 'A four-stage description of mixture-of-experts covering the expert set, routing, sparse activation and the resulting trade.'
  - id: camera-lens
    file: assets/camera-lens.svg
    type: diagram
    title: 'A camera lens assembly'
    alt: 'Diagram: a compound lens as an analogy for stacked transformer blocks'
    description: 'A two-column comparison of a single lens element against a compound assembly.'
  - id: dropout-placement
    file: assets/dropout-placement.svg
    type: diagram
    title: 'Three dropout positions'
    alt: 'Diagram: the three dropout positions in a transformer block'
    description: 'A three-stage description of transformer dropout covering attention weights, sublayer outputs and the embedding layer.'
  - id: transformer-when
    file: assets/transformer-when.svg
    type: diagram
    title: 'Where transformer blocks belong'
    alt: 'Diagram: when stacked transformer blocks are appropriate'
    description: 'A two-column comparison of workloads suited to transformers against those better served by other architectures.'
