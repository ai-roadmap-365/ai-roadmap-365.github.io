learning_promise: 'Master the full Transformer block and Encoder-Decoder architecture: understand Pre-LN vs Post-LN Layer Normalization, Residual Connections, Position-Wise Feedforward Networks (FFN / MLP with 4x dimension expansion and GELU/SwiGLU), Cross-Attention mechanisms, and build a full stacked Transformer block in PyTorch.'
objectives:
  - 'Construct the full Transformer Encoder and Decoder stacks with residual streams and layer normalization.'
  - 'Derive the Position-Wise Feedforward Network: FFN(x) = max(0, x W_1 + b_1) W_2 + b_2 with 4x dimension expansion.'
  - 'Compare Pre-LN vs Post-LN architectures and explain why Pre-LN enables training 100+ layer deep transformers.'
  - 'Explain the mechanics of Cross-Attention connecting Decoder queries to Encoder key-value memories.'
  - 'Implement a complete, modular TransformerEncoderLayer and TransformerDecoderLayer in PyTorch.'
