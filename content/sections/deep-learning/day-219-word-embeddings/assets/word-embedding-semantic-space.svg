<svg role="img" aria-label="Geometric semantic vector space diagram showing linear relationship analogies such as King minus Man plus Woman equals Queen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Embedding Space Geometric Analogies &amp; Relationships</title>
  <defs>
    <linearGradient id="bg219b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card219b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg219b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EMBEDDING SPACE VECTOR GEOMETRY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Linear Vector Offsets Encoding Gender, Geography, and Verb Tenses</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card219b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Vector Analogy 1: Gender -->
    <g transform="translate(40, 30)">
      <rect width="320" height="235" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
      <text x="160" y="25" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Gender Relationship Vector</text>
      
      <!-- Nodes -->
      <circle cx="60" cy="70" r="14" fill="#38bdf8"/>
      <text x="60" y="74" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Man</text>
      
      <circle cx="240" cy="70" r="14" fill="#f43f5e"/>
      <text x="240" y="74" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Woman</text>
      
      <circle cx="60" cy="170" r="14" fill="#38bdf8"/>
      <text x="60" y="174" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">King</text>
      
      <circle cx="240" cy="170" r="14" fill="#f43f5e"/>
      <text x="240" y="174" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Queen</text>
      
      <!-- Vectors -->
      <line x1="75" y1="70" x2="225" y2="70" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4"/>
      <line x1="75" y1="170" x2="225" y2="170" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4"/>
      <text x="150" y="60" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">+ Female Vector Offset</text>
      <text x="150" y="160" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">+ Female Vector Offset</text>
      <text x="160" y="215" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">v(King) - v(Man) + v(Woman) ≈ v(Queen)</text>
    </g>

    <!-- Vector Analogy 2: Capital Cities -->
    <g transform="translate(400, 30)">
      <rect width="320" height="235" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
      <text x="160" y="25" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Capital City Vector</text>
      
      <!-- Nodes -->
      <circle cx="60" cy="70" r="14" fill="#fbbf24"/>
      <text x="60" y="74" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Paris</text>
      
      <circle cx="240" cy="70" r="14" fill="#38bdf8"/>
      <text x="240" y="74" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">France</text>
      
      <circle cx="60" cy="170" r="14" fill="#fbbf24"/>
      <text x="60" y="174" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Tokyo</text>
      
      <circle cx="240" cy="170" r="14" fill="#38bdf8"/>
      <text x="240" y="174" fill="#0f172a" font-size="8" font-weight="700" text-anchor="middle">Japan</text>
      
      <!-- Vectors -->
      <line x1="75" y1="70" x2="225" y2="70" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4"/>
      <line x1="75" y1="170" x2="225" y2="170" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="4"/>
      <text x="150" y="60" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">+ Country-of Vector</text>
      <text x="150" y="160" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">+ Country-of Vector</text>
      <text x="160" y="215" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">v(Tokyo) - v(Japan) + v(France) ≈ v(Paris)</text>
    </g>
  </g>
</svg>
