<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Real structure, overstated results.">
  <title>Vector arithmetic and its limits</title>
  <style>
    .analogies-bg   { fill: #f8fafc; }
    .analogies-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analogies-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analogies-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analogies-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analogies-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analogies-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .analogies-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .analogies-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .analogies-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .analogies-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .analogies-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .analogies-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .analogies-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .analogies-stage { opacity: 1; }

    .analogies-s0 { animation-delay: 0.00s; }
    .analogies-e0 { animation-delay: 0.00s; }
    .analogies-s1 { animation-delay: 1.28s; }
    .analogies-e1 { animation-delay: 1.28s; }
    .analogies-s2 { animation-delay: 2.56s; }
    .analogies-e2 { animation-delay: 2.56s; }
    .analogies-s3 { animation-delay: 3.84s; }
    .analogies-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .analogies-conn  { animation: analogies-trace 6.4s ease-in-out infinite; }
      .analogies-stage { animation: analogies-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes analogies-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes analogies-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .analogies-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .analogies-stage { animation: analogies-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes analogies-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="analogies-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="analogies-bg" width="980" height="322"/>
  <text class="analogies-h1"  x="30" y="40">Vector arithmetic and its limits</text>
  <text class="analogies-sub" x="30" y="64">Real structure, overstated results.</text>
  <g class="analogies-stage analogies-s0">
    <rect class="analogies-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="analogies-step" x="44" y="142">01</text>
    <text class="analogies-name" x="70" y="142">The famous analogy result</text>
    <text class="analogies-desc" x="44" y="166">Subtracting and adding vectors</text>
    <text class="analogies-desc" x="44" y="182">lands near a semantically</text>
    <text class="analogies-desc" x="44" y="198">related word.</text>
  </g>
  <line class="analogies-line analogies-conn analogies-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#analogies-tip)"/>
  <g class="analogies-stage analogies-s1">
    <rect class="analogies-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="analogies-step" x="280" y="142">02</text>
    <text class="analogies-name" x="306" y="142">Which reflects real linear structure</text>
    <text class="analogies-desc" x="280" y="166">Some relationships are</text>
    <text class="analogies-desc" x="280" y="182">approximately consistent</text>
    <text class="analogies-desc" x="280" y="198">directions in the space.</text>
  </g>
  <line class="analogies-line analogies-conn analogies-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#analogies-tip)"/>
  <g class="analogies-stage analogies-s2">
    <rect class="analogies-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="analogies-step" x="516" y="142">03</text>
    <text class="analogies-name" x="542" y="142">And is far less reliable than advertised</text>
    <text class="analogies-desc" x="516" y="166">The demonstrations exclude the</text>
    <text class="analogies-desc" x="516" y="182">input words, which does a great</text>
    <text class="analogies-desc" x="516" y="198">deal of work.</text>
  </g>
  <line class="analogies-line analogies-conn analogies-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#analogies-tip)"/>
  <g class="analogies-stage analogies-s3">
    <rect class="analogies-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="analogies-step" x="752" y="142">04</text>
    <text class="analogies-name" x="778" y="142">The same structure encodes bias</text>
    <text class="analogies-desc" x="752" y="166">Which is measurable, and</text>
    <text class="analogies-desc" x="752" y="182">transfers to everything built on</text>
    <text class="analogies-desc" x="752" y="198">it.</text>
  </g>
  <text class="analogies-sub" x="30" y="304">The exclusion of input words from the nearest-neighbour search is worth knowing about: without it, many published analogies return one of the inputs rather than the expected answer.</text>
</svg>
