<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One vector per word, or per occurrence.">
  <title>Static, or contextual</title>
  <style>
    .static-or-contextual-bg   { fill: #f8fafc; }
    .static-or-contextual-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-contextual-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-contextual-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-contextual-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-contextual-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-contextual-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-contextual-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .static-or-contextual-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .static-or-contextual-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .static-or-contextual-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .static-or-contextual-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .static-or-contextual-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-contextual-row { opacity: 1; }
    .static-or-contextual-r0 { animation-delay: 0.00s; }
    .static-or-contextual-r1 { animation-delay: 0.45s; }
    .static-or-contextual-r2 { animation-delay: 0.90s; }
    .static-or-contextual-r3 { animation-delay: 1.35s; }
    .static-or-contextual-r4 { animation-delay: 1.80s; }
    .static-or-contextual-row { animation: static-or-contextual-reveal 7.3s ease-in-out infinite; }
    @keyframes static-or-contextual-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="static-or-contextual-bg" width="980" height="390"/>
  <text class="static-or-contextual-h1"  x="30" y="40">Static, or contextual</text>
  <text class="static-or-contextual-sub" x="30" y="64">One vector per word, or per occurrence.</text>
  <rect class="static-or-contextual-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-contextual-name" x="46" y="122">Static</text>
  <text class="static-or-contextual-desc" x="46" y="142">One vector per word.</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r0" x="46" y="182">"Bank" has a single vector</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r1" x="46" y="216">The river and the institution share it</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r2" x="46" y="250">A lookup table, precomputable</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r3" x="46" y="284">Fast, and tiny to serve</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r4" x="46" y="318">Adequate for many classification tasks</text>
  <rect class="static-or-contextual-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-contextual-name" x="526" y="122">Contextual</text>
  <text class="static-or-contextual-desc" x="526" y="142">One per occurrence.</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r0" x="526" y="182">The vector depends on the sentence</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r1" x="526" y="216">River and institution separate naturally</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r2" x="526" y="250">Computed by a model, per input</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r3" x="526" y="284">Far more expensive</text>
  <text class="static-or-contextual-desc static-or-contextual-row static-or-contextual-r4" x="526" y="318">Necessary for anything ambiguous</text>
  <text class="static-or-contextual-sub" x="30" y="372">The polysemy limitation is what motivated contextual models, and it is also why static embeddings remain perfectly adequate for topic classification where the ambiguity rarely matters.</text>
</svg>
