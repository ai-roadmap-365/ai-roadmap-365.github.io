<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Position, rather than attributes.">
  <title>Describing people by who they know</title>
  <style>
    .social-network-bg   { fill: #f8fafc; }
    .social-network-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .social-network-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .social-network-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .social-network-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .social-network-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .social-network-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .social-network-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .social-network-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .social-network-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .social-network-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .social-network-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .social-network-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .social-network-row { opacity: 1; }
    .social-network-r0 { animation-delay: 0.00s; }
    .social-network-r1 { animation-delay: 0.45s; }
    .social-network-r2 { animation-delay: 0.90s; }
    .social-network-r3 { animation-delay: 1.35s; }
    .social-network-r4 { animation-delay: 1.80s; }
    .social-network-row { animation: social-network-reveal 7.3s ease-in-out infinite; }
    @keyframes social-network-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="social-network-bg" width="980" height="390"/>
  <text class="social-network-h1"  x="30" y="40">Describing people by who they know</text>
  <text class="social-network-sub" x="30" y="64">Position, rather than attributes.</text>
  <rect class="social-network-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="social-network-name" x="46" y="122">Listed attributes</text>
  <text class="social-network-desc" x="46" y="142">Enumerated by hand.</text>
  <text class="social-network-desc social-network-row social-network-r0" x="46" y="182">Occupation, age, location, interests</text>
  <text class="social-network-desc social-network-row social-network-r1" x="46" y="216">Someone must decide the categories</text>
  <text class="social-network-desc social-network-row social-network-r2" x="46" y="250">Missing categories are invisible</text>
  <text class="social-network-desc social-network-row social-network-r3" x="46" y="284">Two people either match or do not</text>
  <text class="social-network-desc social-network-row social-network-r4" x="46" y="318">This is hand-engineered features</text>
  <rect class="social-network-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="social-network-name" x="526" y="122">Position in the network</text>
  <text class="social-network-desc" x="526" y="142">Learned from connections.</text>
  <text class="social-network-desc social-network-row social-network-r0" x="526" y="182">Who they know, and who those people know</text>
  <text class="social-network-desc social-network-row social-network-r1" x="526" y="216">No categories decided in advance</text>
  <text class="social-network-desc social-network-row social-network-r2" x="526" y="250">Similarity is a distance</text>
  <text class="social-network-desc social-network-row social-network-r3" x="526" y="284">Emergent structure nobody specified</text>
  <text class="social-network-desc social-network-row social-network-r4" x="526" y="318">This is a learned embedding</text>
  <text class="social-network-sub" x="30" y="372">"No categories decided in advance" is the substantive difference: the dimensions of an embedding space are not interpretable individually, and the geometry they produce is.</text>
</svg>
