terms:
  - term: 'Word Embedding'
    definition: 'A dense, continuous real-valued vector representing a word in a multi-dimensional semantic space (typically 100-1024 dimensions).'
  - term: 'Distributional Hypothesis'
    definition: 'The linguistic principle that words occurring in similar textual contexts possess similar semantic meanings.'
  - term: 'Continuous Bag-of-Words (CBOW)'
    definition: 'A Word2Vec model architecture that predicts a center target word given the average vector of its surrounding context words.'
  - term: 'Skip-Gram'
    definition: 'A Word2Vec model architecture that predicts surrounding context words given a single center target word.'
  - term: 'Negative Sampling'
    definition: 'An efficient training approximation for Word2Vec that maximizes the probability of true context pairs while minimizing K randomly sampled noise words.'
  - term: 'Cosine Similarity'
    definition: 'A metric measuring the cosine of the angle between two vectors, quantifying directional semantic alignment independent of vector magnitude.'
  - term: 'GloVe'
    definition: 'Global Vectors: an unsupervised learning algorithm that factors global word-word co-occurrence statistics across a corpus.'
  - term: 'FastText'
    definition: 'An extension of Word2Vec that computes word representations as the sum of character n-gram subword embeddings.'
