learning_promise: 'Master dense distributed representations of language: derive Word2Vec (CBOW and Skip-Gram), implement Negative Sampling loss from scratch, understand GloVe co-occurrence matrix factorization and FastText subword n-grams, compute cosine similarity, and execute semantic vector arithmetic in PyTorch.'
objectives:
  - 'Derive the mathematical limitations of one-hot sparse vectors and the distributional semantic hypothesis.'
  - 'Implement the Word2Vec Skip-Gram objective with Negative Sampling loss in pure PyTorch.'
  - 'Compare the foundational trade-offs between Word2Vec, GloVe (Global Vectors), and FastText.'
  - 'Perform linear vector analogy arithmetic and nearest-neighbor cosine similarity queries.'
  - 'Build and initialize a PyTorch nn.Embedding lookup table with custom and pretrained weight tensors.'
