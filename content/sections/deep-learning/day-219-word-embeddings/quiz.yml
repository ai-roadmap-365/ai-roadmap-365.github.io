questions:
  - question: 'What is the fundamental limitation of one-hot encoded word vectors that dense word embeddings resolve?'
    options:
      - 'One-hot vectors are orthogonal, so all similarities are zero'
      - 'One-hot vectors cannot be processed on GPUs'
      - 'One-hot vectors only work with numbers, not words'
      - 'One-hot vectors require square root calculations'
    answer_index: 0
    explanation: 'Because every one-hot vector has a 1 in a distinct position and 0 everywhere else, all pairs are orthogonal and possess zero geometric similarity.'
  - question: 'What is the core premise of the Distributional Hypothesis formulated by linguist J.R. Firth in 1957?'
    options:
      - 'All words in a sentence must have identical lengths'
      - 'A word is known by the company it keeps'
      - 'Language models must be trained for at least 100 epochs'
      - 'Grammar is entirely determined by alphabetical order'
    answer_index: 1
    explanation: 'Firths distributional hypothesis is the foundation of Word2Vec and modern language embeddings: context co-occurrence defines semantic meaning.'
  - question: 'Why is Negative Sampling necessary when training large-vocabulary Word2Vec Skip-Gram models?'
    options:
      - 'It prevents gradients from exploding in float32'
      - 'It deletes all punctuation from the text'
      - 'The exact softmax over 500k words is far too expensive'
      - 'It reduces the batch size to 1'
    answer_index: 2
    explanation: 'Negative sampling replaces an intractable full-vocabulary softmax with efficient binary classifications distinguishing true context words from K random noise words.'
  - question: 'How does FastText (Bojanowski et al., 2017) improve upon Word2Vec when encountering rare or out-of-vocabulary words?'
    options:
      - 'It uses a recurrent neural network'
      - 'It increases the embedding dimension from 300 to 10,000'
      - 'It downloads translations from Wikipedia'
      - 'It sums character n-gram vectors to build the word'
    answer_index: 3
    explanation: 'By embedding subword character n-grams, FastText can construct accurate embeddings for unseen words from their morphological root pieces.'
  - question: 'In a trained 300-dimensional semantic embedding space, what does the vector operation v(Paris) - v(France) + v(Italy) approximate?'
    options:
      - 'v(Rome)'
      - 'v(Europe)'
      - 'v(London)'
      - 'v(Zero vector)'
    answer_index: 0
    explanation: 'Linear vector offsets in dense embedding spaces encode relational analogies across capitals, gender, and verb tenses.'
