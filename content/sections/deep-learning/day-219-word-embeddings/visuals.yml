visuals:
  - id: word2vec-cbow-vs-skipgram
    file: assets/word2vec-cbow-vs-skipgram.svg
    type: diagram
    title: 'Word2Vec Architectures: CBOW vs Skip-Gram'
    alt: Word2Vec architecture comparison showing Continuous Bag of Words CBOW predicting center word from context and Skip-Gram predicting context words from center word
    description: 'Structural architecture comparison of Continuous Bag-of-Words (CBOW) and Continuous Skip-Gram models for distributed representation learning.'
  - id: word-embedding-semantic-space
    file: assets/word-embedding-semantic-space.svg
    type: diagram
    title: 'Embedding Space Geometric Analogies & Relationships'
    alt: Geometric semantic vector space diagram showing linear relationship analogies such as King minus Man plus Woman equals Queen
    description: 'Vector space geometric alignment demonstrating linear vector offset arithmetic across semantic categories including gender and national capitals.'
  - id: embedding-idea
    file: assets/embedding-idea.svg
    type: diagram
    title: 'What an embedding is'
    alt: 'Diagram: what a word embedding matrix is and what it encodes'
    description: 'A four-stage description of embeddings covering the lookup table, dimensionality, learned similarity and the distributional assumption.'
  - id: onehot-or-embedding
    file: assets/onehot-or-embedding.svg
    type: diagram
    title: 'One-hot, or embedded'
    alt: 'Diagram: one-hot encoding compared with a learned embedding'
    description: 'A two-column comparison of one-hot token representation against dense learned embeddings.'
  - id: embedding-lineage
    file: assets/embedding-lineage.svg
    type: diagram
    title: 'Three approaches to learning embeddings'
    alt: 'Diagram: the progression of static word embedding methods'
    description: 'A three-stage progression of embedding methods covering local window prediction, global co-occurrence factorisation and subword composition.'
  - id: negative-sampling
    file: assets/negative-sampling.svg
    type: diagram
    title: 'Why negative sampling exists'
    alt: 'Diagram: the softmax bottleneck and the negative sampling solution'
    description: 'A four-stage description of negative sampling covering the softmax cost, the binary reformulation, noise word sampling and the resulting efficiency.'
  - id: analogies
    file: assets/analogies.svg
    type: diagram
    title: 'Vector arithmetic and its limits'
    alt: 'Diagram: what vector arithmetic on embeddings does and does not reliably do'
    description: 'A four-stage description of embedding arithmetic covering the analogy result, the geometric structure, the reliability caveat and the bias consequence.'
  - id: static-or-contextual
    file: assets/static-or-contextual.svg
    type: diagram
    title: 'Static, or contextual'
    alt: 'Diagram: static word embeddings compared with contextual embeddings'
    description: 'A two-column comparison of static per-word embeddings against contextual per-occurrence representations.'
  - id: social-network
    file: assets/social-network.svg
    type: diagram
    title: 'Describing people by who they know'
    alt: 'Diagram: describing individuals by listed attributes compared with describing them by position in a network'
    description: 'A two-column comparison of explicit attribute description against positional description in a social network.'
  - id: embedding-implications
    file: assets/embedding-implications.svg
    type: diagram
    title: 'Four consequences of embeddings'
    alt: 'Diagram: the memory, bias, retrieval and initialisation implications of embeddings'
    description: 'A four-stage description of embedding implications covering parameter share, inherited bias, similarity search and pretrained initialisation.'
  - id: embeddings-when
    file: assets/embeddings-when.svg
    type: diagram
    title: 'When static embeddings suffice'
    alt: 'Diagram: when static word embeddings are adequate'
    description: 'A two-column comparison of tasks suited to static embeddings against those requiring contextual representations.'
