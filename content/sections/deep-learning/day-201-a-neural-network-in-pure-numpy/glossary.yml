terms:
  - term: 'He Initialization'
    definition: 'A weight initialization scheme drawing random values from a normal distribution with variance 2 / n_in, optimized for ReLU activation layers.'
  - term: 'Xavier (Glorot) Initialization'
    definition: 'A weight initialization scheme setting variance to 2 / (n_in + n_out), designed for Tanh and Sigmoid activations.'
  - term: 'Symmetry Breaking'
    definition: 'Initializing weights with random non-zero values so that individual neurons in a hidden layer compute different functions and learn distinct features.'
  - term: 'Mini-Batch SGD'
    definition: 'An optimization method computing parameter gradients and updating weights on small random subsets (e.g., 32, 64, 128 samples) of the training dataset.'
  - term: 'Momentum'
    definition: 'An optimization enhancement that adds a fraction beta of the previous parameter update vector to the current step to dampen oscillations.'
  - term: 'Learning Rate Schedule'
    definition: 'A predefined policy that dynamically reduces the learning rate alpha across training epochs to ensure fine convergence near the minimum.'
  - term: 'Epoch'
    definition: 'One complete pass through the entire training dataset during neural network training.'
  - term: 'Decision Manifold'
    definition: 'The high-dimensional non-linear geometric boundary separating classification regions in feature space.'
