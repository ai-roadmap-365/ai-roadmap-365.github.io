<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Then buying the movement.">
  <title>Building the watch by hand</title>
  <style>
    .watchmaker-numpy-bg   { fill: #f8fafc; }
    .watchmaker-numpy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-numpy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-numpy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-numpy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-numpy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .watchmaker-numpy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .watchmaker-numpy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .watchmaker-numpy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .watchmaker-numpy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .watchmaker-numpy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .watchmaker-numpy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .watchmaker-numpy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .watchmaker-numpy-row { opacity: 1; }
    .watchmaker-numpy-r0 { animation-delay: 0.00s; }
    .watchmaker-numpy-r1 { animation-delay: 0.45s; }
    .watchmaker-numpy-r2 { animation-delay: 0.90s; }
    .watchmaker-numpy-r3 { animation-delay: 1.35s; }
    .watchmaker-numpy-r4 { animation-delay: 1.80s; }
    .watchmaker-numpy-row { animation: watchmaker-numpy-reveal 7.3s ease-in-out infinite; }
    @keyframes watchmaker-numpy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="watchmaker-numpy-bg" width="980" height="390"/>
  <text class="watchmaker-numpy-h1"  x="30" y="40">Building the watch by hand</text>
  <text class="watchmaker-numpy-sub" x="30" y="64">Then buying the movement.</text>
  <rect class="watchmaker-numpy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="watchmaker-numpy-name" x="46" y="122">By hand</text>
  <text class="watchmaker-numpy-desc" x="46" y="142">You know every gear.</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r0" x="46" y="182">Every equation written out</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r1" x="46" y="216">Every shape checked deliberately</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r2" x="46" y="250">A bug is yours, and findable</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r3" x="46" y="284">Runs on a CPU, on one core</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r4" x="46" y="318">The right way to learn it once</text>
  <rect class="watchmaker-numpy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="watchmaker-numpy-name" x="526" y="122">A framework</text>
  <text class="watchmaker-numpy-desc" x="526" y="142">You know what it does.</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r0" x="526" y="182">Autograd traces the graph for you</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r1" x="526" y="216">GPU execution, without changing the code</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r2" x="526" y="250">Optimisers, layers and losses provided</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r3" x="526" y="284">Orders of magnitude faster</text>
  <text class="watchmaker-numpy-desc watchmaker-numpy-row watchmaker-numpy-r4" x="526" y="318">The right way to work afterwards</text>
  <text class="watchmaker-numpy-sub" x="30" y="372">Having built the first column is what makes the second legible: a framework's error message about a shape mismatch means something specific once you have written the multiply it refers to.</text>
</svg>
