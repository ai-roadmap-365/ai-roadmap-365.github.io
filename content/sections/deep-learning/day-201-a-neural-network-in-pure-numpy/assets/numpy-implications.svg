<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fast enough, and bounded.">
  <title>Three properties of the NumPy engine</title>
  <style>
    .numpy-implications-bg   { fill: #f8fafc; }
    .numpy-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .numpy-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .numpy-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .numpy-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .numpy-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .numpy-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .numpy-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .numpy-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .numpy-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .numpy-implications-stage { opacity: 1; }

    .numpy-implications-s0 { animation-delay: 0.00s; }
    .numpy-implications-e0 { animation-delay: 0.00s; }
    .numpy-implications-s1 { animation-delay: 1.50s; }
    .numpy-implications-e1 { animation-delay: 1.50s; }
    .numpy-implications-s2 { animation-delay: 3.00s; }
    .numpy-implications-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .numpy-implications-conn  { animation: numpy-implications-trace 6s ease-in-out infinite; }
      .numpy-implications-stage { animation: numpy-implications-arrive 6s ease-in-out infinite; }
    }
    @keyframes numpy-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes numpy-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .numpy-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .numpy-implications-stage { animation: numpy-implications-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes numpy-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="numpy-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="numpy-implications-bg" width="980" height="322"/>
  <text class="numpy-implications-h1"  x="30" y="40">Three properties of the NumPy engine</text>
  <text class="numpy-implications-sub" x="30" y="64">Fast enough, and bounded.</text>
  <g class="numpy-implications-stage numpy-implications-s0">
    <rect class="numpy-implications-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="numpy-implications-step" x="44" y="142">01</text>
    <text class="numpy-implications-name" x="70" y="142">BLAS makes it genuinely fast</text>
    <text class="numpy-implications-desc" x="44" y="166">Matrix multiplies run at optimised library</text>
    <text class="numpy-implications-desc" x="44" y="182">speed, not Python speed.</text>
  </g>
  <line class="numpy-implications-line numpy-implications-conn numpy-implications-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#numpy-implications-tip)"/>
  <g class="numpy-implications-stage numpy-implications-s1">
    <rect class="numpy-implications-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="numpy-implications-step" x="359" y="142">02</text>
    <text class="numpy-implications-name" x="385" y="142">It deploys anywhere NumPy runs</text>
    <text class="numpy-implications-desc" x="359" y="166">Useful for embedded targets where a framework</text>
    <text class="numpy-implications-desc" x="359" y="182">runtime is impractical.</text>
  </g>
  <line class="numpy-implications-line numpy-implications-conn numpy-implications-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#numpy-implications-tip)"/>
  <g class="numpy-implications-stage numpy-implications-s2">
    <rect class="numpy-implications-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="numpy-implications-step" x="674" y="142">03</text>
    <text class="numpy-implications-name" x="700" y="142">And it stops at one CPU</text>
    <text class="numpy-implications-desc" x="674" y="166">No GPU, no autograd, no distributed training.</text>
  </g>
  <text class="numpy-implications-sub" x="30" y="304">The portability point is real rather than academic: a small trained network exported as weight matrices needs nothing but NumPy to run, which is a genuinely useful deployment property.</text>
</svg>
