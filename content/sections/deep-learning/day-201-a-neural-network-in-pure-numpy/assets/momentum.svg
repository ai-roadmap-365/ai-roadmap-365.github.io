<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="An exponentially weighted average of gradients.">
  <title>What momentum does</title>
  <style>
    .momentum-bg   { fill: #f8fafc; }
    .momentum-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .momentum-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .momentum-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .momentum-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .momentum-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .momentum-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .momentum-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .momentum-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .momentum-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .momentum-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .momentum-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .momentum-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .momentum-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .momentum-stage { opacity: 1; }

    .momentum-s0 { animation-delay: 0.00s; }
    .momentum-e0 { animation-delay: 0.00s; }
    .momentum-s1 { animation-delay: 1.28s; }
    .momentum-e1 { animation-delay: 1.28s; }
    .momentum-s2 { animation-delay: 2.56s; }
    .momentum-e2 { animation-delay: 2.56s; }
    .momentum-s3 { animation-delay: 3.84s; }
    .momentum-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .momentum-conn  { animation: momentum-trace 6.4s ease-in-out infinite; }
      .momentum-stage { animation: momentum-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes momentum-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes momentum-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .momentum-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .momentum-stage { animation: momentum-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes momentum-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="momentum-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="momentum-bg" width="980" height="322"/>
  <text class="momentum-h1"  x="30" y="40">What momentum does</text>
  <text class="momentum-sub" x="30" y="64">An exponentially weighted average of gradients.</text>
  <g class="momentum-stage momentum-s0">
    <rect class="momentum-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="momentum-step" x="44" y="142">01</text>
    <text class="momentum-name" x="70" y="142">Keep a velocity term</text>
    <text class="momentum-desc" x="44" y="166">An exponentially decaying</text>
    <text class="momentum-desc" x="44" y="182">average of past gradients.</text>
  </g>
  <line class="momentum-line momentum-conn momentum-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#momentum-tip)"/>
  <g class="momentum-stage momentum-s1">
    <rect class="momentum-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="momentum-step" x="280" y="142">02</text>
    <text class="momentum-name" x="306" y="142">Oscillating components cancel</text>
    <text class="momentum-desc" x="280" y="166">Successive updates with opposite</text>
    <text class="momentum-desc" x="280" y="182">signs sum toward zero.</text>
    <text class="momentum-edge" x="280" y="242">damping</text>
  </g>
  <line class="momentum-line momentum-conn momentum-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#momentum-tip)"/>
  <g class="momentum-stage momentum-s2">
    <rect class="momentum-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="momentum-step" x="516" y="142">03</text>
    <text class="momentum-name" x="542" y="142">Consistent components accumulate</text>
    <text class="momentum-desc" x="516" y="166">Repeated agreement in one</text>
    <text class="momentum-desc" x="516" y="182">direction builds speed.</text>
  </g>
  <line class="momentum-line momentum-conn momentum-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#momentum-tip)"/>
  <g class="momentum-stage momentum-s3">
    <rect class="momentum-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="momentum-step" x="752" y="142">04</text>
    <text class="momentum-name" x="778" y="142">Coefficient near 0.9</text>
    <text class="momentum-desc" x="752" y="166">Roughly a ten-step memory of</text>
    <text class="momentum-desc" x="752" y="182">past gradients.</text>
  </g>
  <text class="momentum-sub" x="30" y="304">The two effects are the same mechanism seen from different directions: averaging damps what disagrees and accumulates what agrees, which is exactly the behaviour a ravine requires.</text>
</svg>
