<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Symmetry that never breaks.">
  <title>Why zero initialisation fails</title>
  <style>
    .zero-init-fails-bg   { fill: #f8fafc; }
    .zero-init-fails-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zero-init-fails-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zero-init-fails-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zero-init-fails-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zero-init-fails-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zero-init-fails-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .zero-init-fails-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .zero-init-fails-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .zero-init-fails-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .zero-init-fails-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .zero-init-fails-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .zero-init-fails-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .zero-init-fails-row { opacity: 1; }
    .zero-init-fails-r0 { animation-delay: 0.00s; }
    .zero-init-fails-r1 { animation-delay: 0.45s; }
    .zero-init-fails-r2 { animation-delay: 0.90s; }
    .zero-init-fails-r3 { animation-delay: 1.35s; }
    .zero-init-fails-r4 { animation-delay: 1.80s; }
    .zero-init-fails-row { animation: zero-init-fails-reveal 7.3s ease-in-out infinite; }
    @keyframes zero-init-fails-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="zero-init-fails-bg" width="980" height="390"/>
  <text class="zero-init-fails-h1"  x="30" y="40">Why zero initialisation fails</text>
  <text class="zero-init-fails-sub" x="30" y="64">Symmetry that never breaks.</text>
  <rect class="zero-init-fails-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="zero-init-fails-name" x="46" y="122">All zeros</text>
  <text class="zero-init-fails-desc" x="46" y="142">Every neuron identical.</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r0" x="46" y="182">Every neuron in a layer sees the same input</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r1" x="46" y="216">Computes the same output</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r2" x="46" y="250">Receives the same gradient</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r3" x="46" y="284">Updates identically, forever</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r4" x="46" y="318">A hundred-unit layer behaves as one</text>
  <rect class="zero-init-fails-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="zero-init-fails-name" x="526" y="122">Random, scaled</text>
  <text class="zero-init-fails-desc" x="526" y="142">Symmetry broken.</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r0" x="526" y="182">Each neuron starts differently</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r1" x="526" y="216">Gradients differ from the first step</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r2" x="526" y="250">Units specialise as training proceeds</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r3" x="526" y="284">Scale chosen so variance is preserved</text>
  <text class="zero-init-fails-desc zero-init-fails-row zero-init-fails-r4" x="526" y="318">He for ReLU, Xavier for tanh</text>
  <text class="zero-init-fails-sub" x="30" y="372">Symmetry breaking is a requirement rather than a heuristic: identical units receiving identical gradients are mathematically guaranteed to remain identical for the whole run.</text>
</svg>
