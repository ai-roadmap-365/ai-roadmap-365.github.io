<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Both preserve variance; the factor differs.">
  <title>Two initialisation schemes</title>
  <style>
    .init-schemes-bg   { fill: #f8fafc; }
    .init-schemes-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-schemes-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-schemes-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-schemes-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-schemes-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .init-schemes-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .init-schemes-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .init-schemes-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .init-schemes-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .init-schemes-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .init-schemes-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .init-schemes-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .init-schemes-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .init-schemes-stage { opacity: 1; }

    .init-schemes-s0 { animation-delay: 0.00s; }
    .init-schemes-e0 { animation-delay: 0.00s; }
    .init-schemes-s1 { animation-delay: 1.50s; }
    .init-schemes-e1 { animation-delay: 1.50s; }
    .init-schemes-s2 { animation-delay: 3.00s; }
    .init-schemes-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .init-schemes-conn  { animation: init-schemes-trace 6s ease-in-out infinite; }
      .init-schemes-stage { animation: init-schemes-arrive 6s ease-in-out infinite; }
    }
    @keyframes init-schemes-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes init-schemes-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .init-schemes-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .init-schemes-stage { animation: init-schemes-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes init-schemes-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="init-schemes-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="init-schemes-bg" width="980" height="322"/>
  <text class="init-schemes-h1"  x="30" y="40">Two initialisation schemes</text>
  <text class="init-schemes-sub" x="30" y="64">Both preserve variance; the factor differs.</text>
  <g class="init-schemes-stage init-schemes-s0">
    <rect class="init-schemes-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="init-schemes-step" x="44" y="142">01</text>
    <text class="init-schemes-name" x="70" y="142">The goal: preserve variance</text>
    <text class="init-schemes-desc" x="44" y="166">Activations should neither shrink nor blow up</text>
    <text class="init-schemes-desc" x="44" y="182">as depth increases.</text>
  </g>
  <line class="init-schemes-line init-schemes-conn init-schemes-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#init-schemes-tip)"/>
  <g class="init-schemes-stage init-schemes-s1">
    <rect class="init-schemes-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="init-schemes-step" x="359" y="142">02</text>
    <text class="init-schemes-name" x="385" y="142">Xavier: scale by 1 over fan-in</text>
    <text class="init-schemes-desc" x="359" y="166">For symmetric activations like tanh, which</text>
    <text class="init-schemes-desc" x="359" y="182">pass both signs through.</text>
  </g>
  <line class="init-schemes-line init-schemes-conn init-schemes-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#init-schemes-tip)"/>
  <g class="init-schemes-stage init-schemes-s2">
    <rect class="init-schemes-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="init-schemes-step" x="674" y="142">03</text>
    <text class="init-schemes-name" x="700" y="142">He: scale by 2 over fan-in</text>
    <text class="init-schemes-desc" x="674" y="166">ReLU zeroes half its inputs, so the variance</text>
    <text class="init-schemes-desc" x="674" y="182">needs twice the compensation.</text>
  </g>
  <text class="init-schemes-sub" x="30" y="304">The factor of two follows directly from ReLU's behaviour rather than from tuning: half the activations are exactly zero, so the surviving half must carry twice the variance.</text>
</svg>
