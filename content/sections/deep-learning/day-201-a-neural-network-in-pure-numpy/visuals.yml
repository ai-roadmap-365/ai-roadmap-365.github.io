visuals:
  - id: pure-numpy-neural-network-training-loop
    file: assets/pure-numpy-neural-network-training-loop.svg
    type: diagram
    title: Pure NumPy Neural Network Training Lifecycle Architecture
    alt: Modular pure NumPy neural network training lifecycle loop showing mini batch sampling forward pass loss backward pass and optimizer update
    description: High-level architectural flowchart of a complete deep neural network engine in pure NumPy detailing weight initialization, forward caching, loss calculation, backward propagation, and SGD momentum updates.
  - id: non-linear-decision-manifold-learning
    file: assets/non-linear-decision-manifold-learning.svg
    type: diagram
    title: Non-Linear Decision Manifold Learning in Pure NumPy
    alt: Non linear decision boundary classification results on moons and spiral datasets showing smooth probability contours separating interlocking classes
    description: 2D geometric visualization demonstrating how a pure NumPy Multi-Layer Perceptron learns non-linear decision boundaries on challenging datasets including Two Moons and Concentric Circles.
  - id: numpy-net-parts
    file: assets/numpy-net-parts.svg
    type: diagram
    title: 'Five pieces, no framework'
    alt: 'Diagram: the five components of a neural network written in pure NumPy'
    description: 'A five-stage description of a from-scratch neural network covering initialisation, the forward pass, the loss, the backward pass and the update.'
  - id: zero-init-fails
    file: assets/zero-init-fails.svg
    type: diagram
    title: 'Why zero initialisation fails'
    alt: 'Diagram: zero initialisation compared with random scaled initialisation'
    description: 'A two-column comparison of zero-initialised weights against randomly initialised ones, and the symmetry problem.'
  - id: init-schemes
    file: assets/init-schemes.svg
    type: diagram
    title: 'Two initialisation schemes'
    alt: 'Diagram: He initialisation compared with Xavier initialisation'
    description: 'A three-stage description of weight initialisation covering the variance goal, the Xavier factor and the He factor.'
  - id: momentum
    file: assets/momentum.svg
    type: diagram
    title: 'What momentum does'
    alt: 'Diagram: how momentum accumulates and damps gradient updates'
    description: 'A four-stage description of momentum covering the velocity term, oscillation cancellation, consistent-direction acceleration and the coefficient.'
  - id: ravine-problem
    file: assets/ravine-problem.svg
    type: diagram
    title: 'The ill-conditioned ravine'
    alt: 'Diagram: vanilla gradient descent compared with momentum in an elongated ravine'
    description: 'A two-column comparison of plain gradient descent against momentum on an ill-conditioned loss surface.'
  - id: saddle-points
    file: assets/saddle-points.svg
    type: diagram
    title: 'Saddle points, not local minima'
    alt: 'Diagram: why saddle points rather than local minima dominate high-dimensional loss surfaces'
    description: 'A four-stage explanation of saddle points covering the gradient-zero condition, the curvature mix, dimensional probability and the escape mechanism.'
  - id: watchmaker-numpy
    file: assets/watchmaker-numpy.svg
    type: diagram
    title: 'Building the watch by hand'
    alt: 'Diagram: hand-building a mechanism compared with using a manufactured one'
    description: 'A two-column comparison of implementing a neural network from scratch against using a framework.'
  - id: numpy-implications
    file: assets/numpy-implications.svg
    type: diagram
    title: 'Three properties of the NumPy engine'
    alt: 'Diagram: the performance, portability and capability properties of a NumPy neural network'
    description: 'A three-stage description of pure NumPy neural network properties covering BLAS performance, deployment portability and capability limits.'
  - id: numpy-when
    file: assets/numpy-when.svg
    type: diagram
    title: 'When to write it yourself'
    alt: 'Diagram: when a from-scratch implementation is worthwhile'
    description: 'A two-column comparison of situations favouring a from-scratch neural network against those requiring a framework.'
  - id: symmetry-and-scale
    file: assets/symmetry-and-scale.svg
    type: diagram
    title: 'Two failures initialisation prevents'
    alt: 'Diagram: the two failure modes that weight initialisation prevents'
    description: 'A three-stage description of initialisation failures covering symmetry, exploding activations and vanishing activations.'
  - id: numpy-not-autograd
    file: assets/numpy-not-autograd.svg
    type: diagram
    title: 'What the NumPy engine is not'
    alt: 'Diagram: a pure NumPy network compared with a GPU framework'
    description: 'A two-column comparison of a pure NumPy implementation against a full deep learning framework.'
