questions:
  - question: 'What is the exact formula for He (Kaiming) Normal Weight Initialization for a layer with n^[l-1] input connections using ReLU activation?'
    options:
      - 'W^[l] ~ Normal(0, 100)'
      - 'W^[l] ~ Uniform(-1, 1)'
      - 'W^[l] = 0'
      - 'W^[l] ~ Normal(0, sqrt(2 / n^[l-1]))'
    answer_index: 3
    explanation: 'He initialization scales Gaussian random weights by sqrt(2 / n_in) to compensate for the fact that ReLU zeroes out roughly 50% of activations, preserving activation variance across deep layers.'
  - question: 'What happens if all weights in a neural network are initialized to exact zeros: W^[l] = 0?'
    options:
      - 'Symmetry never breaks — every neuron stays identical'
      - 'The network trains 10x faster'
      - 'The gradients explode to infinity on the first epoch'
      - 'The loss function returns NaN'
    answer_index: 0
    explanation: 'Zero initialization causes all neurons in a hidden layer to compute identical outputs and gradients, preventing hidden units from learning distinct feature representations.'
  - question: 'How does SGD with Momentum (beta = 0.9) accelerate convergence compared to standard vanilla SGD?'
    options:
      - 'It doubles the learning rate on every epoch'
      - 'It keeps a decaying average of past gradients'
      - 'It reduces the number of parameters by 50%'
      - 'It removes the need for backpropagation'
    answer_index: 1
    explanation: 'Momentum acts like a heavy bowling ball rolling down the loss surface, smoothing out noise and maintaining high velocity along consistent downward trajectories.'
  - question: 'Why is mini-batch shuffling crucial before each training epoch?'
    options:
      - 'Shuffling increases the number of training samples'
      - 'Shuffling reduces CPU temperature'
      - 'Shuffling keeps the gradient estimates unbiased'
      - 'Shuffling converts 32-bit floats to 64-bit'
    answer_index: 2
    explanation: 'Without random shuffling, repeating fixed sequences of mini-batches can trap gradient descent in periodic limit cycles instead of converging to low-loss minima.'
  - question: 'When training a 3-layer MLP on the non-linear Two Moons dataset, what training behavior indicates that the network is learning successfully?'
    options:
      - 'Training accuracy stays constant at 0%'
      - 'The loss increases to infinity'
      - 'All weights converge to exact zero'
      - 'Loss falls steadily while accuracy climbs past 95%'
    answer_index: 3
    explanation: 'Healthy neural network training is characterized by a smoothly decaying loss curve and climbing accuracy as decision boundaries align with the dataset manifold.'
