<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One short sweep, one curve.">
  <title>Finding the peak rate</title>
  <style>
    .lr-finder-bg   { fill: #f8fafc; }
    .lr-finder-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-finder-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-finder-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-finder-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-finder-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lr-finder-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lr-finder-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lr-finder-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lr-finder-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lr-finder-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lr-finder-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lr-finder-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .lr-finder-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .lr-finder-stage { opacity: 1; }

    .lr-finder-s0 { animation-delay: 0.00s; }
    .lr-finder-e0 { animation-delay: 0.00s; }
    .lr-finder-s1 { animation-delay: 1.28s; }
    .lr-finder-e1 { animation-delay: 1.28s; }
    .lr-finder-s2 { animation-delay: 2.56s; }
    .lr-finder-e2 { animation-delay: 2.56s; }
    .lr-finder-s3 { animation-delay: 3.84s; }
    .lr-finder-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .lr-finder-conn  { animation: lr-finder-trace 6.4s ease-in-out infinite; }
      .lr-finder-stage { animation: lr-finder-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes lr-finder-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes lr-finder-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .lr-finder-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .lr-finder-stage { animation: lr-finder-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes lr-finder-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="lr-finder-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="lr-finder-bg" width="980" height="322"/>
  <text class="lr-finder-h1"  x="30" y="40">Finding the peak rate</text>
  <text class="lr-finder-sub" x="30" y="64">One short sweep, one curve.</text>
  <g class="lr-finder-stage lr-finder-s0">
    <rect class="lr-finder-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="lr-finder-step" x="44" y="142">01</text>
    <text class="lr-finder-name" x="70" y="142">Start absurdly small</text>
    <text class="lr-finder-desc" x="44" y="166">Around a ten-millionth. Nothing</text>
    <text class="lr-finder-desc" x="44" y="182">will happen yet.</text>
  </g>
  <line class="lr-finder-line lr-finder-conn lr-finder-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#lr-finder-tip)"/>
  <g class="lr-finder-stage lr-finder-s1">
    <rect class="lr-finder-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="lr-finder-step" x="280" y="142">02</text>
    <text class="lr-finder-name" x="306" y="142">Increase exponentially per batch</text>
    <text class="lr-finder-desc" x="280" y="166">For a hundred or so batches, up</text>
    <text class="lr-finder-desc" x="280" y="182">to a large value.</text>
    <text class="lr-finder-edge" x="280" y="242">one sweep</text>
  </g>
  <line class="lr-finder-line lr-finder-conn lr-finder-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#lr-finder-tip)"/>
  <g class="lr-finder-stage lr-finder-s2">
    <rect class="lr-finder-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="lr-finder-step" x="516" y="142">03</text>
    <text class="lr-finder-name" x="542" y="142">Plot loss against rate</text>
    <text class="lr-finder-desc" x="516" y="166">It falls, flattens, then</text>
    <text class="lr-finder-desc" x="516" y="182">diverges sharply.</text>
  </g>
  <line class="lr-finder-line lr-finder-conn lr-finder-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#lr-finder-tip)"/>
  <g class="lr-finder-stage lr-finder-s3">
    <rect class="lr-finder-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="lr-finder-step" x="752" y="142">04</text>
    <text class="lr-finder-name" x="778" y="142">Pick just below the steepest descent</text>
    <text class="lr-finder-desc" x="752" y="166">An order of magnitude below</text>
    <text class="lr-finder-desc" x="752" y="182">divergence.</text>
  </g>
  <text class="lr-finder-sub" x="30" y="304">This converts the single most consequential hyperparameter from a guess into a measurement, and it costs about a minute of training — which is a remarkable return.</text>
</svg>
