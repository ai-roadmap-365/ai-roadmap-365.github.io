<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And not a substitute for tuning.">
  <title>A scheduler is not an optimiser</title>
  <style>
    .scheduler-not-optimiser-bg   { fill: #f8fafc; }
    .scheduler-not-optimiser-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheduler-not-optimiser-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheduler-not-optimiser-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheduler-not-optimiser-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheduler-not-optimiser-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scheduler-not-optimiser-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scheduler-not-optimiser-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .scheduler-not-optimiser-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .scheduler-not-optimiser-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .scheduler-not-optimiser-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .scheduler-not-optimiser-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .scheduler-not-optimiser-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .scheduler-not-optimiser-row { opacity: 1; }
    .scheduler-not-optimiser-r0 { animation-delay: 0.00s; }
    .scheduler-not-optimiser-r1 { animation-delay: 0.45s; }
    .scheduler-not-optimiser-r2 { animation-delay: 0.90s; }
    .scheduler-not-optimiser-r3 { animation-delay: 1.35s; }
    .scheduler-not-optimiser-r4 { animation-delay: 1.80s; }
    .scheduler-not-optimiser-row { animation: scheduler-not-optimiser-reveal 7.3s ease-in-out infinite; }
    @keyframes scheduler-not-optimiser-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="scheduler-not-optimiser-bg" width="980" height="390"/>
  <text class="scheduler-not-optimiser-h1"  x="30" y="40">A scheduler is not an optimiser</text>
  <text class="scheduler-not-optimiser-sub" x="30" y="64">And not a substitute for tuning.</text>
  <rect class="scheduler-not-optimiser-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="scheduler-not-optimiser-name" x="46" y="122">What it does</text>
  <text class="scheduler-not-optimiser-desc" x="46" y="142">Adjusts one number.</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r0" x="46" y="182">Modifies the optimiser's learning rate</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r1" x="46" y="216">Deterministically by step, or reactively by metric</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r2" x="46" y="250">Wraps an existing optimiser</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r3" x="46" y="284">Composable — warmup then decay</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r4" x="46" y="318">Cheap, and high leverage</text>
  <rect class="scheduler-not-optimiser-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="scheduler-not-optimiser-name" x="526" y="122">What it does not</text>
  <text class="scheduler-not-optimiser-desc" x="526" y="142">Two limits.</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r0" x="526" y="182">Does not compute gradients or moments</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r1" x="526" y="216">That is the optimiser's job</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r2" x="526" y="250">Does not fix a wrong peak rate</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r3" x="526" y="284">Orders of magnitude off fails in any shape</text>
  <text class="scheduler-not-optimiser-desc scheduler-not-optimiser-row scheduler-not-optimiser-r4" x="526" y="318">Find the peak first</text>
  <text class="scheduler-not-optimiser-sub" x="30" y="372">Composability is worth knowing about: modern frameworks let a warmup scheduler and a decay scheduler run in sequence without hand-written arithmetic, which removes a common source of off-by-one bugs.</text>
</svg>
