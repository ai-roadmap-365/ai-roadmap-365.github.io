<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three phases, three needs.">
  <title>Why the rate changes over training</title>
  <style>
    .schedule-shape-bg   { fill: #f8fafc; }
    .schedule-shape-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-shape-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-shape-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-shape-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-shape-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-shape-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-shape-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-shape-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-shape-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-shape-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-shape-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-shape-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-shape-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-shape-stage { opacity: 1; }

    .schedule-shape-s0 { animation-delay: 0.00s; }
    .schedule-shape-e0 { animation-delay: 0.00s; }
    .schedule-shape-s1 { animation-delay: 1.50s; }
    .schedule-shape-e1 { animation-delay: 1.50s; }
    .schedule-shape-s2 { animation-delay: 3.00s; }
    .schedule-shape-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-shape-conn  { animation: schedule-shape-trace 6s ease-in-out infinite; }
      .schedule-shape-stage { animation: schedule-shape-arrive 6s ease-in-out infinite; }
    }
    @keyframes schedule-shape-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-shape-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-shape-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-shape-stage { animation: schedule-shape-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-shape-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-shape-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-shape-bg" width="980" height="322"/>
  <text class="schedule-shape-h1"  x="30" y="40">Why the rate changes over training</text>
  <text class="schedule-shape-sub" x="30" y="64">Three phases, three needs.</text>
  <g class="schedule-shape-stage schedule-shape-s0">
    <rect class="schedule-shape-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="schedule-shape-step" x="44" y="142">01</text>
    <text class="schedule-shape-name" x="70" y="142">Warmup: start small, rise</text>
    <text class="schedule-shape-desc" x="44" y="166">Early gradients and moment estimates are</text>
    <text class="schedule-shape-desc" x="44" y="182">unreliable. A large first step can be</text>
    <text class="schedule-shape-desc" x="44" y="198">unrecoverable.</text>
  </g>
  <line class="schedule-shape-line schedule-shape-conn schedule-shape-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#schedule-shape-tip)"/>
  <g class="schedule-shape-stage schedule-shape-s1">
    <rect class="schedule-shape-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="schedule-shape-step" x="359" y="142">02</text>
    <text class="schedule-shape-name" x="385" y="142">Peak: explore</text>
    <text class="schedule-shape-desc" x="359" y="166">Large steps cross saddle plateaus and escape</text>
    <text class="schedule-shape-desc" x="359" y="182">poor basins.</text>
    <text class="schedule-shape-edge" x="359" y="242">exploration</text>
  </g>
  <line class="schedule-shape-line schedule-shape-conn schedule-shape-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#schedule-shape-tip)"/>
  <g class="schedule-shape-stage schedule-shape-s2">
    <rect class="schedule-shape-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="schedule-shape-step" x="674" y="142">03</text>
    <text class="schedule-shape-name" x="700" y="142">Anneal: settle</text>
    <text class="schedule-shape-desc" x="674" y="166">Small steps toward the end, so the model</text>
    <text class="schedule-shape-desc" x="674" y="182">lands in a minimum rather than bouncing</text>
    <text class="schedule-shape-desc" x="674" y="198">around it.</text>
  </g>
  <text class="schedule-shape-sub" x="30" y="304">The three phases want opposite things from the same number, which is precisely why a constant rate is a compromise between them rather than a simplification.</text>
</svg>
