<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And which one to reach for.">
  <title>Four schedule shapes</title>
  <style>
    .schedule-families-bg   { fill: #f8fafc; }
    .schedule-families-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-families-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-families-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-families-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-families-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .schedule-families-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .schedule-families-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .schedule-families-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .schedule-families-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .schedule-families-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .schedule-families-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .schedule-families-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .schedule-families-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .schedule-families-stage { opacity: 1; }

    .schedule-families-s0 { animation-delay: 0.00s; }
    .schedule-families-e0 { animation-delay: 0.00s; }
    .schedule-families-s1 { animation-delay: 1.28s; }
    .schedule-families-e1 { animation-delay: 1.28s; }
    .schedule-families-s2 { animation-delay: 2.56s; }
    .schedule-families-e2 { animation-delay: 2.56s; }
    .schedule-families-s3 { animation-delay: 3.84s; }
    .schedule-families-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .schedule-families-conn  { animation: schedule-families-trace 6.4s ease-in-out infinite; }
      .schedule-families-stage { animation: schedule-families-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes schedule-families-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes schedule-families-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .schedule-families-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .schedule-families-stage { animation: schedule-families-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes schedule-families-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="schedule-families-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="schedule-families-bg" width="980" height="322"/>
  <text class="schedule-families-h1"  x="30" y="40">Four schedule shapes</text>
  <text class="schedule-families-sub" x="30" y="64">And which one to reach for.</text>
  <g class="schedule-families-stage schedule-families-s0">
    <rect class="schedule-families-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-families-step" x="44" y="142">01</text>
    <text class="schedule-families-name" x="70" y="142">Step decay</text>
    <text class="schedule-families-desc" x="44" y="166">Multiply by a factor at fixed</text>
    <text class="schedule-families-desc" x="44" y="182">epochs. Simple, and abrupt.</text>
  </g>
  <line class="schedule-families-line schedule-families-conn schedule-families-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#schedule-families-tip)"/>
  <g class="schedule-families-stage schedule-families-s1">
    <rect class="schedule-families-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-families-step" x="280" y="142">02</text>
    <text class="schedule-families-name" x="306" y="142">Plateau decay</text>
    <text class="schedule-families-desc" x="280" y="166">Watch a validation metric;</text>
    <text class="schedule-families-desc" x="280" y="182">reduce when it stops improving.</text>
    <text class="schedule-families-edge" x="280" y="242">reactive</text>
  </g>
  <line class="schedule-families-line schedule-families-conn schedule-families-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#schedule-families-tip)"/>
  <g class="schedule-families-stage schedule-families-s2">
    <rect class="schedule-families-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-families-step" x="516" y="142">03</text>
    <text class="schedule-families-name" x="542" y="142">Cosine annealing</text>
    <text class="schedule-families-desc" x="516" y="166">A smooth half-period curve from</text>
    <text class="schedule-families-desc" x="516" y="182">peak to near zero.</text>
  </g>
  <line class="schedule-families-line schedule-families-conn schedule-families-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#schedule-families-tip)"/>
  <g class="schedule-families-stage schedule-families-s3">
    <rect class="schedule-families-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="schedule-families-step" x="752" y="142">04</text>
    <text class="schedule-families-name" x="778" y="142">Warmup plus cosine</text>
    <text class="schedule-families-desc" x="752" y="166">Linear rise, then cosine decay.</text>
    <text class="schedule-families-desc" x="752" y="182">The modern default.</text>
  </g>
  <text class="schedule-families-sub" x="30" y="304">Plateau decay is the one to use when the total step count is unknown, and the others all assume you know how long training will run — which is a real constraint rather than a detail.</text>
</svg>
