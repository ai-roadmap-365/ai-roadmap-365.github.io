<svg role="img" aria-label="Linear warmup transitioning into half period cosine decay showing mathematical equations and parameter bounds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Linear Warmup and Cosine Annealing Mathematical Formulation</title>
  <defs>
    <linearGradient id="bg207b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card207b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg207b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">WARMUP + COSINE ANNEALING MECHANICS</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mathematical Formulations of Phase 1 (Warmup) and Phase 2 (Decay)</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card207b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Phase 1 Box: Warmup -->
    <rect x="30" y="35" width="330" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="195" y="60" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Phase 1: Linear Warmup (t &lt;= T_warmup)</text>
    <rect x="45" y="80" width="300" height="45" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="195" y="108" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">eta_t = eta_max * (t / T_warmup)</text>
    <text x="195" y="150" fill="#cbd5e1" font-size="9" text-anchor="middle">Prevents early gradient explosion</text>
    <text x="195" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">Allows Adam second moments (v_t) to stabilize</text>
    <text x="195" y="195" fill="#94a3b8" font-size="8" text-anchor="middle">Standard T_warmup: 5% - 10% of total steps</text>
    <text x="195" y="235" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">Stabilizes Initial Weights</text>

    <!-- Phase 2 Box: Cosine Decay -->
    <rect x="395" y="35" width="335" height="225" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="562" y="60" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Phase 2: Cosine Decay (t &gt; T_warmup)</text>
    <rect x="410" y="80" width="305" height="55" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="562" y="102" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">eta_t = eta_min + 0.5*(eta_max - eta_min)*</text>
    <text x="562" y="122" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">(1 + cos(pi * (t - T_warmup) / (T_total - T_warmup)))</text>
    <text x="562" y="160" fill="#cbd5e1" font-size="9" text-anchor="middle">Smooth continuous reduction down to eta_min</text>
    <text x="562" y="180" fill="#cbd5e1" font-size="9" text-anchor="middle">Allows exploration early, fine-tuning late</text>
    <text x="562" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">No sudden discontinuous loss spikes</text>
    <text x="562" y="235" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">Optimal Generalization</text>
  </g>
</svg>
