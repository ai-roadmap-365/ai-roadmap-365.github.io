<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Rate and momentum moving in opposite directions.">
  <title>The one-cycle policy</title>
  <style>
    .one-cycle-bg   { fill: #f8fafc; }
    .one-cycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-cycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-cycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-cycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-cycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .one-cycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .one-cycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .one-cycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .one-cycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .one-cycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .one-cycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .one-cycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .one-cycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .one-cycle-stage { opacity: 1; }

    .one-cycle-s0 { animation-delay: 0.00s; }
    .one-cycle-e0 { animation-delay: 0.00s; }
    .one-cycle-s1 { animation-delay: 1.28s; }
    .one-cycle-e1 { animation-delay: 1.28s; }
    .one-cycle-s2 { animation-delay: 2.56s; }
    .one-cycle-e2 { animation-delay: 2.56s; }
    .one-cycle-s3 { animation-delay: 3.84s; }
    .one-cycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .one-cycle-conn  { animation: one-cycle-trace 6.4s ease-in-out infinite; }
      .one-cycle-stage { animation: one-cycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes one-cycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes one-cycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .one-cycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .one-cycle-stage { animation: one-cycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes one-cycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="one-cycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="one-cycle-bg" width="980" height="322"/>
  <text class="one-cycle-h1"  x="30" y="40">The one-cycle policy</text>
  <text class="one-cycle-sub" x="30" y="64">Rate and momentum moving in opposite directions.</text>
  <g class="one-cycle-stage one-cycle-s0">
    <rect class="one-cycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="one-cycle-step" x="44" y="142">01</text>
    <text class="one-cycle-name" x="70" y="142">Phase one: rate rises</text>
    <text class="one-cycle-desc" x="44" y="166">From a fraction of the peak up</text>
    <text class="one-cycle-desc" x="44" y="182">to it, over the first third of</text>
    <text class="one-cycle-desc" x="44" y="198">training.</text>
  </g>
  <line class="one-cycle-line one-cycle-conn one-cycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#one-cycle-tip)"/>
  <g class="one-cycle-stage one-cycle-s1">
    <rect class="one-cycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="one-cycle-step" x="280" y="142">02</text>
    <text class="one-cycle-name" x="306" y="142">While momentum falls</text>
    <text class="one-cycle-desc" x="280" y="166">Reducing inertia exactly when</text>
    <text class="one-cycle-desc" x="280" y="182">steps are largest, to prevent</text>
    <text class="one-cycle-desc" x="280" y="198">divergence.</text>
    <text class="one-cycle-edge" x="280" y="242">the trick</text>
  </g>
  <line class="one-cycle-line one-cycle-conn one-cycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#one-cycle-tip)"/>
  <g class="one-cycle-stage one-cycle-s2">
    <rect class="one-cycle-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="one-cycle-step" x="516" y="142">03</text>
    <text class="one-cycle-name" x="542" y="142">Phase two: rate anneals</text>
    <text class="one-cycle-desc" x="516" y="166">Cosine down to a thousandth of</text>
    <text class="one-cycle-desc" x="516" y="182">the peak, while momentum rises</text>
    <text class="one-cycle-desc" x="516" y="198">back.</text>
  </g>
  <line class="one-cycle-line one-cycle-conn one-cycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#one-cycle-tip)"/>
  <g class="one-cycle-stage one-cycle-s3">
    <rect class="one-cycle-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="one-cycle-step" x="752" y="142">04</text>
    <text class="one-cycle-name" x="778" y="142">Convergence in far fewer epochs</text>
    <text class="one-cycle-desc" x="752" y="166">Sometimes several times fewer.</text>
  </g>
  <text class="one-cycle-sub" x="30" y="304">The inverse relationship between rate and momentum is the non-obvious part: large steps with high inertia diverge, and lowering momentum is what makes the large exploratory steps survivable.</text>
</svg>
