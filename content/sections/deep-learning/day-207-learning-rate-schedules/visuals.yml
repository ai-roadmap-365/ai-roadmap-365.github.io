    alt: Linear warmup transitioning into half period cosine decay showing mathematical equations and parameter bounds
    description: Mathematical formulation and parameter mechanics of two-phase scheduling showing linear warmup for early gradient stabilization and half-period cosine decay for late-stage fine-tuning.
