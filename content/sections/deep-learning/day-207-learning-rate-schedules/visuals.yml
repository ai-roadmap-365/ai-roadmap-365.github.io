visuals:
  - id: learning-rate-schedules-comparison
    file: assets/learning-rate-schedules-comparison.svg
    type: diagram
    title: Deep Learning Learning Rate Schedules Comparison
    alt: Comparison of learning rate schedules showing StepLR ExponentialLR ReduceLROnPlateau and CosineAnnealing trajectories across training epochs
    description: Comparative trajectory curves illustrating StepLR staircase drops, ExponentialLR decay, smooth CosineAnnealingLR, and modern Linear Warmup with Cosine Decay across training epochs.
  - id: cosine-annealing-warmup-trajectory
    file: assets/cosine-annealing-warmup-trajectory.svg
    type: diagram
    title: Linear Warmup and Cosine Annealing Mathematical Formulation
    alt: Linear warmup transitioning into half period cosine decay showing mathematical equations and parameter bounds
    description: Mathematical formulation and parameter mechanics of two-phase scheduling showing linear warmup for early gradient stabilization and half-period cosine decay for late-stage fine-tuning.
  - id: schedule-shape
    file: assets/schedule-shape.svg
    type: diagram
    title: 'Why the rate changes over training'
    alt: 'Diagram: the three phases of a learning rate schedule and what each is for'
    description: 'A three-stage description of a learning rate schedule covering warmup, the peak exploration phase and the annealing phase.'
  - id: static-or-scheduled
    file: assets/static-or-scheduled.svg
    type: diagram
    title: 'A fixed rate, or a schedule'
    alt: 'Diagram: a constant learning rate compared with a scheduled one'
    description: 'A two-column comparison of a fixed learning rate against a scheduled one across the phases of training.'
  - id: schedule-families
    file: assets/schedule-families.svg
    type: diagram
    title: 'Four schedule shapes'
    alt: 'Diagram: four learning rate schedule families compared'
    description: 'A four-stage description of schedule families covering step decay, plateau decay, cosine annealing and warmup with cosine.'
  - id: lr-finder
    file: assets/lr-finder.svg
    type: diagram
    title: 'Finding the peak rate'
    alt: 'Diagram: how a learning rate range test locates the usable maximum rate'
    description: 'A four-stage description of the learning rate finder covering the exponential sweep, the loss curve, the divergence point and the chosen rate.'
  - id: one-cycle
    file: assets/one-cycle.svg
    type: diagram
    title: 'The one-cycle policy'
    alt: 'Diagram: the two phases of the one-cycle learning rate and momentum policy'
    description: 'A four-stage description of the one-cycle policy covering the rising phase, momentum reduction, the annealing phase and the resulting speedup.'
  - id: landing
    file: assets/landing.svg
    type: diagram
    title: 'Landing an aircraft'
    alt: 'Diagram: a constant approach speed compared with a staged descent'
    description: 'A two-column comparison of maintaining one speed throughout an approach against reducing it in stages.'
  - id: scheduler-not-optimiser
    file: assets/scheduler-not-optimiser.svg
    type: diagram
    title: 'A scheduler is not an optimiser'
    alt: 'Diagram: what a learning rate scheduler does compared with what it does not'
    description: 'A two-column comparison of the scheduler''s role against two things it is mistaken for.'
  - id: schedule-implications
    file: assets/schedule-implications.svg
    type: diagram
    title: 'Four consequences of scheduling'
    alt: 'Diagram: the reproducibility, resumption, tuning and generalisation implications of schedules'
    description: 'A four-stage description of scheduling implications covering step counting, checkpoint resumption, reduced tuning burden and generalisation.'
  - id: schedule-when
    file: assets/schedule-when.svg
    type: diagram
    title: 'Choosing a schedule'
    alt: 'Diagram: when to use warmup with cosine decay and when to use plateau reduction'
    description: 'A two-column comparison of schedule choice by whether the total training budget is known in advance.'
