questions:
  - question: 'Why is linear learning rate warmup (scaling lr linearly from 0 to lr_max over the first 5-10% of training steps) critical when training deep transformers with AdamW?'
    options:
      - 'During early steps, weights are random and gradient variances are massive, while Adam second moment v_t is still uncalibrated; large early updates can blow weights into unrecoverable regions before gradients stabilize'
      - 'To allow GPU fans to spin up slowly'
      - 'To prevent PyTorch from timing out'
      - 'Warmup is only used to make loss curves look prettier'
    answer_index: 0
    explanation: 'Uncalibrated early gradients with high learning rates cause parameter divergence. Warming up gradually allows the optimizer moments to build accurate directional estimates.'
  - question: 'What is the mathematical equation for Cosine Annealing learning rate decay from eta_max to eta_min over T_max total steps?'
    options:
      - 'eta_t = eta_min + 0.5 * (eta_max - eta_min) * (1 + cos(pi * t / T_max))'
      - 'eta_t = eta_max - t * eta_min'
      - 'eta_t = eta_max * (0.5 ** t)'
      - 'eta_t = eta_max / (1 + t)'
    answer_index: 0
    explanation: 'Cosine Annealing follows a half-period cosine wave, decaying smoothly from eta_max at t=0 down to eta_min at t=T_max without abrupt loss spikes.'
  - question: 'Where in the training loop should you invoke scheduler.step() when using an epoch-based scheduler (such as StepLR or CosineAnnealingLR)?'
    options:
      - 'At the end of each training epoch, outside the inner mini-batch loop'
      - 'Before loss.backward()'
      - 'Before optimizer.zero_grad()'
      - 'Inside the Dataset __getitem__ method'
    answer_index: 0
    explanation: 'Standard epoch-based schedulers are stepped once per epoch after all mini-batches have completed. (Iteration-level schedulers like OneCycleLR are stepped after every optimizer.step()).'
  - question: 'How does ReduceLROnPlateau decide when to reduce the learning rate?'
    options:
      - 'It monitors a validation metric (such as validation loss), and if the metric fails to improve by at least threshold over a specified patience number of epochs, it multiplies lr by factor (e.g. 0.1)'
      - 'It checks the system clock and reduces lr every 5 minutes'
      - 'It reduces lr whenever training loss reaches zero'
      - 'It randomly drops lr by 50% every epoch'
    answer_index: 0
    explanation: 'ReduceLROnPlateau dynamically adapts learning rate based on real validation feedback, decaying only when learning stagnates.'
  - question: 'When implementing a custom schedule via torch.optim.lr_scheduler.LambdaLR, what does the user-provided lambda function compute?'
    options:
      - 'A multiplicative scaling factor (between 0.0 and 1.0) that is multiplied by the base learning rate defined in the optimizer param_groups'
      - 'The absolute learning rate value in floating point'
      - 'The number of layers in the model'
      - 'The batch size of the dataloader'
    answer_index: 0
    explanation: 'LambdaLR expects a function `lr_lambda(epoch)` that returns a multiplicative factor `factor`, setting `current_lr = base_lr * factor`.'
