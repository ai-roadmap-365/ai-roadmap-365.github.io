terms:
  - term: 'Learning Rate Schedule'
    definition: 'A predetermined or metric-driven policy that adjusts the optimizer learning rate dynamically across training epochs or steps.'
  - term: 'Linear Warmup'
    definition: 'Gradually increasing the learning rate from near zero to the peak target learning rate over the initial training iterations.'
  - term: 'Cosine Annealing'
    definition: 'A learning rate policy that decays the step size following a half-period cosine curve from a maximum to a minimum value.'
  - term: 'StepLR'
    definition: 'A scheduler that reduces the learning rate by a multiplicative factor gamma every step_size epochs.'
  - term: 'ReduceLROnPlateau'
    definition: 'An adaptive scheduler that reduces learning rate when a monitored validation metric stops improving for a given patience.'
  - term: 'OneCycleLR'
    definition: 'A super-convergence schedule that warms up learning rate to a peak while decreasing momentum, followed by long cosine decay.'
  - term: 'patience'
    definition: 'The number of non-improving epochs allowed by ReduceLROnPlateau before triggering a learning rate reduction.'
  - term: 'LambdaLR'
    definition: 'A PyTorch scheduler that sets the learning rate of each parameter group to the initial lr times a user-defined lambda function.'
