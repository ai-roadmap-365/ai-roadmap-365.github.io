questions:
  - question: 'What is the primary operational advantage of using DataCollatorWithPadding over padding all sequences in the dataset to max_length during tokenization?'
    options:
      - 'It removes the need for learning rates'
      - 'It makes the model run without a GPU'
      - 'It pads per batch, not to a global maximum'
      - 'It converts text to audio'
    answer_index: 2
    explanation: 'Dynamic padding pads only to the batch maximum length, significantly reducing computation and memory overhead.'
  - question: 'How do Hugging Face AutoClasses (such as AutoModelForSequenceClassification) resolve the underlying neural architecture?'
    options:
      - 'They convert all models to PyTorch Linear layers'
      - 'They guess based on file size'
      - 'They train a classifier to predict the architecture'
      - 'They read model_type from config.json'
    answer_index: 3
    explanation: 'AutoClasses read configuration metadata to dynamically instantiate the correct model subclass.'
  - question: 'Why is the Safetensors serialization format preferred over standard PyTorch .bin (pickle) files for storing model checkpoints?'
    options:
      - 'No arbitrary code execution, and mmap loading'
      - 'Safetensors makes models 100 times smaller'
      - 'Safetensors only works with BERT'
      - 'Safetensors eliminates the need for weights'
    answer_index: 0
    explanation: 'Safetensors guarantees safe deserialization with zero code execution risk and blazing fast zero-copy memory mapping.'
  - question: 'In the Hugging Face Trainer, how should the custom compute_metrics function process the EvalPrediction tuple (logits, labels)?'
    options:
      - 'Multiply logits by labels directly'
      - 'argmax over the logits'
      - 'Sort the logits alphabetically'
      - 'Return the raw loss value'
    answer_index: 1
    explanation: 'Applying argmax converts continuous class logits into discrete prediction classes for evaluation metric computation.'
  - question: 'What is the purpose of setting warmup_ratio or warmup_steps in TrainingArguments?'
    options:
      - 'It slows down disk reads'
      - 'It heats up the physical GPU hardware'
      - 'It ramps the rate up from zero'
      - 'It increases the batch size automatically'
    answer_index: 2
    explanation: 'Learning rate warmup stabilizes initial optimization and protects pretrained feature representations.'
