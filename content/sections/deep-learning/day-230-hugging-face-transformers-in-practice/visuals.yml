visuals:
  - id: hugging-face-ecosystem-pipeline-workflow
    file: assets/hugging-face-ecosystem-pipeline-workflow.svg
    type: diagram
    title: 'Hugging Face Ecosystem Training Pipeline'
    alt: Hugging Face ecosystem pipeline diagram showing Hub model download AutoTokenizer tokenization Dataset collation Trainer execution and evaluation
    description: 'End-to-end workflow in the Hugging Face ecosystem: Datasets, Tokenizers, Dynamic Collators, Trainer, and Evaluator.'
  - id: autoclass-dynamic-architecture-resolution
    file: assets/autoclass-dynamic-architecture-resolution.svg
    type: diagram
    title: 'AutoClass Dynamic Architecture Resolution'
    alt: AutoClass dynamic architecture resolution diagram illustrating how Hugging Face automatically detects model topology from config json
    description: 'Mechanism of AutoClass inspecting configuration metadata and dynamically instantiating task-specific transformer classes.'
  - id: hf-components
    file: assets/hf-components.svg
    type: diagram
    title: 'Five components, one ecosystem'
    alt: 'Diagram: the five components of the transformers ecosystem'
    description: 'A five-stage description of the model ecosystem covering the hub, auto classes, tokenizers, datasets and the training loop.'
  - id: scratch-or-library
    file: assets/scratch-or-library.svg
    type: diagram
    title: 'From scratch, or from the library'
    alt: 'Diagram: implementing transformers from scratch compared with using a library'
    description: 'A two-column comparison of from-scratch implementation against library use.'
  - id: dynamic-padding-hf
    file: assets/dynamic-padding-hf.svg
    type: diagram
    title: 'Dynamic padding'
    alt: 'Diagram: fixed-length padding compared with per-batch dynamic padding'
    description: 'A four-stage description of dynamic padding covering fixed padding waste, per-batch padding, the measured saving and the correctness guarantee.'
  - id: safetensors
    file: assets/safetensors.svg
    type: diagram
    title: 'Why the checkpoint format changed'
    alt: 'Diagram: pickle-based checkpoints compared with a non-executable tensor format'
    description: 'A four-stage description of the checkpoint format change covering pickle execution, the vulnerability, the safe format and its performance benefit.'
  - id: peft-hf
    file: assets/peft-hf.svg
    type: diagram
    title: 'Parameter-efficient fine-tuning'
    alt: 'Diagram: full fine-tuning compared with low-rank adapter fine-tuning'
    description: 'A four-stage description of parameter-efficient fine-tuning covering the frozen base, low-rank updates, the trainable fraction and the deployment shape.'
  - id: race-cars
    file: assets/race-cars.svg
    type: diagram
    title: 'Building a race car, or driving one'
    alt: 'Diagram: building a vehicle from components compared with driving a prepared one'
    description: 'A two-column comparison of constructing a machine against operating a prepared one.'
  - id: distributed-options
    file: assets/distributed-options.svg
    type: diagram
    title: 'Three distribution strategies'
    alt: 'Diagram: three distributed training strategies by what they shard'
    description: 'A three-stage description of distributed training covering data parallelism, sharded states and full model sharding.'
  - id: hf-implications
    file: assets/hf-implications.svg
    type: diagram
    title: 'Four consequences of the ecosystem'
    alt: 'Diagram: the reproducibility, security, versioning and licensing implications of a model hub'
    description: 'A four-stage description of model ecosystem implications covering reproducibility, checkpoint trust, version pinning and licensing.'
  - id: library-when
    file: assets/library-when.svg
    type: diagram
    title: 'When to use the library'
    alt: 'Diagram: when to use a transformer library and when to implement directly'
    description: 'A two-column comparison of situations favouring library use against direct implementation.'
