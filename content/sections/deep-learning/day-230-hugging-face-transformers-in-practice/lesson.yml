learning_promise: 'Master the Hugging Face Transformers ecosystem for production deep learning: understand AutoModel and AutoTokenizer dynamic resolution, implement efficient tokenization pipelines with dynamic padding, configure TrainingArguments and the production Trainer API, evaluate models with precision/recall/F1 metrics, and save production safetensors checkpoints.'
objectives:
  - 'Use AutoModelForSequenceClassification and AutoTokenizer to load pretrained checkpoints from the Hugging Face Hub.'
  - 'Implement dynamic batch padding using DataCollatorWithPadding to eliminate unnecessary computation on padded tokens.'
  - 'Configure TrainingArguments with mixed precision (fp16/bf16), cosine learning rate schedules, and evaluation strategies.'
  - 'Implement custom compute_metrics functions to calculate classification accuracy, precision, recall, and F1 scores.'
  - 'Save, reload, and package fine-tuned transformer models using the Safetensors serialization format.'
