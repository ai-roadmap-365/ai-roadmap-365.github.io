<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="By what does not fit.">
  <title>Three distribution strategies</title>
  <style>
    .distributed-options-bg   { fill: #f8fafc; }
    .distributed-options-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-options-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-options-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-options-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-options-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .distributed-options-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .distributed-options-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .distributed-options-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .distributed-options-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .distributed-options-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .distributed-options-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .distributed-options-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .distributed-options-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .distributed-options-stage { opacity: 1; }

    .distributed-options-s0 { animation-delay: 0.00s; }
    .distributed-options-e0 { animation-delay: 0.00s; }
    .distributed-options-s1 { animation-delay: 1.50s; }
    .distributed-options-e1 { animation-delay: 1.50s; }
    .distributed-options-s2 { animation-delay: 3.00s; }
    .distributed-options-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .distributed-options-conn  { animation: distributed-options-trace 6s ease-in-out infinite; }
      .distributed-options-stage { animation: distributed-options-arrive 6s ease-in-out infinite; }
    }
    @keyframes distributed-options-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes distributed-options-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .distributed-options-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .distributed-options-stage { animation: distributed-options-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes distributed-options-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="distributed-options-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="distributed-options-bg" width="980" height="322"/>
  <text class="distributed-options-h1"  x="30" y="40">Three distribution strategies</text>
  <text class="distributed-options-sub" x="30" y="64">By what does not fit.</text>
  <g class="distributed-options-stage distributed-options-s0">
    <rect class="distributed-options-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-options-step" x="44" y="142">01</text>
    <text class="distributed-options-name" x="70" y="142">Data parallel</text>
    <text class="distributed-options-desc" x="44" y="166">Every device holds the whole model; batches</text>
    <text class="distributed-options-desc" x="44" y="182">split between them. Simple.</text>
  </g>
  <line class="distributed-options-line distributed-options-conn distributed-options-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#distributed-options-tip)"/>
  <g class="distributed-options-stage distributed-options-s1">
    <rect class="distributed-options-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-options-step" x="359" y="142">02</text>
    <text class="distributed-options-name" x="385" y="142">Shard the optimiser state</text>
    <text class="distributed-options-desc" x="359" y="166">When Adam's extra tensors are what does not</text>
    <text class="distributed-options-desc" x="359" y="182">fit.</text>
    <text class="distributed-options-edge" x="359" y="242">memory</text>
  </g>
  <line class="distributed-options-line distributed-options-conn distributed-options-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#distributed-options-tip)"/>
  <g class="distributed-options-stage distributed-options-s2">
    <rect class="distributed-options-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="distributed-options-step" x="674" y="142">03</text>
    <text class="distributed-options-name" x="700" y="142">Shard parameters and gradients too</text>
    <text class="distributed-options-desc" x="674" y="166">When the model itself does not fit on one</text>
    <text class="distributed-options-desc" x="674" y="182">device.</text>
  </g>
  <text class="distributed-options-sub" x="30" y="304">The progression follows what runs out first, which is usually optimiser state rather than parameters: a model that fits for inference frequently does not fit for training.</text>
</svg>
