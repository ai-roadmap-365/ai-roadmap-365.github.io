<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Small adapters on a frozen backbone.">
  <title>Parameter-efficient fine-tuning</title>
  <style>
    .peft-hf-bg   { fill: #f8fafc; }
    .peft-hf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-hf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-hf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-hf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-hf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .peft-hf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .peft-hf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .peft-hf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .peft-hf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .peft-hf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .peft-hf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .peft-hf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .peft-hf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .peft-hf-stage { opacity: 1; }

    .peft-hf-s0 { animation-delay: 0.00s; }
    .peft-hf-e0 { animation-delay: 0.00s; }
    .peft-hf-s1 { animation-delay: 1.28s; }
    .peft-hf-e1 { animation-delay: 1.28s; }
    .peft-hf-s2 { animation-delay: 2.56s; }
    .peft-hf-e2 { animation-delay: 2.56s; }
    .peft-hf-s3 { animation-delay: 3.84s; }
    .peft-hf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .peft-hf-conn  { animation: peft-hf-trace 6.4s ease-in-out infinite; }
      .peft-hf-stage { animation: peft-hf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes peft-hf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes peft-hf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .peft-hf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .peft-hf-stage { animation: peft-hf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes peft-hf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="peft-hf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="peft-hf-bg" width="980" height="322"/>
  <text class="peft-hf-h1"  x="30" y="40">Parameter-efficient fine-tuning</text>
  <text class="peft-hf-sub" x="30" y="64">Small adapters on a frozen backbone.</text>
  <g class="peft-hf-stage peft-hf-s0">
    <rect class="peft-hf-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="peft-hf-step" x="44" y="142">01</text>
    <text class="peft-hf-name" x="70" y="142">Freeze the pretrained weights</text>
    <text class="peft-hf-desc" x="44" y="166">None of them are updated.</text>
  </g>
  <line class="peft-hf-line peft-hf-conn peft-hf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#peft-hf-tip)"/>
  <g class="peft-hf-stage peft-hf-s1">
    <rect class="peft-hf-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="peft-hf-step" x="280" y="142">02</text>
    <text class="peft-hf-name" x="306" y="142">Add small low-rank matrices</text>
    <text class="peft-hf-desc" x="280" y="166">Trained alongside, injected into</text>
    <text class="peft-hf-desc" x="280" y="182">selected layers.</text>
  </g>
  <line class="peft-hf-line peft-hf-conn peft-hf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#peft-hf-tip)"/>
  <g class="peft-hf-stage peft-hf-s2">
    <rect class="peft-hf-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="peft-hf-step" x="516" y="142">03</text>
    <text class="peft-hf-name" x="542" y="142">A fraction of a percent trainable</text>
    <text class="peft-hf-desc" x="516" y="166">Dramatically less memory for</text>
    <text class="peft-hf-desc" x="516" y="182">optimiser state.</text>
    <text class="peft-hf-edge" x="516" y="242">&lt;1%</text>
  </g>
  <line class="peft-hf-line peft-hf-conn peft-hf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#peft-hf-tip)"/>
  <g class="peft-hf-stage peft-hf-s3">
    <rect class="peft-hf-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="peft-hf-step" x="752" y="142">04</text>
    <text class="peft-hf-name" x="778" y="142">And adapters are megabytes</text>
    <text class="peft-hf-desc" x="752" y="166">One backbone, many tasks, small</text>
    <text class="peft-hf-desc" x="752" y="182">files.</text>
  </g>
  <text class="peft-hf-sub" x="30" y="304">The optimiser-state saving is what makes this a memory technique as much as a storage one: Adam's two extra tensors per trainable parameter is what usually prevents fine-tuning a large model at all.</text>
</svg>
