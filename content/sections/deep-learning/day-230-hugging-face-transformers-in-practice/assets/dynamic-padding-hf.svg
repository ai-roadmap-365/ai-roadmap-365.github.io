<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The largest free speedup in the loop.">
  <title>Dynamic padding</title>
  <style>
    .dynamic-padding-hf-bg   { fill: #f8fafc; }
    .dynamic-padding-hf-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-hf-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-hf-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-hf-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-hf-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dynamic-padding-hf-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dynamic-padding-hf-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dynamic-padding-hf-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dynamic-padding-hf-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dynamic-padding-hf-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dynamic-padding-hf-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dynamic-padding-hf-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dynamic-padding-hf-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dynamic-padding-hf-stage { opacity: 1; }

    .dynamic-padding-hf-s0 { animation-delay: 0.00s; }
    .dynamic-padding-hf-e0 { animation-delay: 0.00s; }
    .dynamic-padding-hf-s1 { animation-delay: 1.28s; }
    .dynamic-padding-hf-e1 { animation-delay: 1.28s; }
    .dynamic-padding-hf-s2 { animation-delay: 2.56s; }
    .dynamic-padding-hf-e2 { animation-delay: 2.56s; }
    .dynamic-padding-hf-s3 { animation-delay: 3.84s; }
    .dynamic-padding-hf-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .dynamic-padding-hf-conn  { animation: dynamic-padding-hf-trace 6.4s ease-in-out infinite; }
      .dynamic-padding-hf-stage { animation: dynamic-padding-hf-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes dynamic-padding-hf-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dynamic-padding-hf-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dynamic-padding-hf-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dynamic-padding-hf-stage { animation: dynamic-padding-hf-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dynamic-padding-hf-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dynamic-padding-hf-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dynamic-padding-hf-bg" width="980" height="322"/>
  <text class="dynamic-padding-hf-h1"  x="30" y="40">Dynamic padding</text>
  <text class="dynamic-padding-hf-sub" x="30" y="64">The largest free speedup in the loop.</text>
  <g class="dynamic-padding-hf-stage dynamic-padding-hf-s0">
    <rect class="dynamic-padding-hf-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="dynamic-padding-hf-step" x="44" y="142">01</text>
    <text class="dynamic-padding-hf-name" x="70" y="142">Padding to a fixed maximum</text>
    <text class="dynamic-padding-hf-desc" x="44" y="166">Most sequences are far shorter.</text>
    <text class="dynamic-padding-hf-desc" x="44" y="182">Attention runs over emptiness.</text>
  </g>
  <line class="dynamic-padding-hf-line dynamic-padding-hf-conn dynamic-padding-hf-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#dynamic-padding-hf-tip)"/>
  <g class="dynamic-padding-hf-stage dynamic-padding-hf-s1">
    <rect class="dynamic-padding-hf-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="dynamic-padding-hf-step" x="280" y="142">02</text>
    <text class="dynamic-padding-hf-name" x="306" y="142">Which can be most of the compute</text>
    <text class="dynamic-padding-hf-desc" x="280" y="166">On a corpus with varied lengths.</text>
  </g>
  <line class="dynamic-padding-hf-line dynamic-padding-hf-conn dynamic-padding-hf-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#dynamic-padding-hf-tip)"/>
  <g class="dynamic-padding-hf-stage dynamic-padding-hf-s2">
    <rect class="dynamic-padding-hf-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="dynamic-padding-hf-step" x="516" y="142">03</text>
    <text class="dynamic-padding-hf-name" x="542" y="142">Pad to the longest in each batch</text>
    <text class="dynamic-padding-hf-desc" x="516" y="166">A collator that computes the</text>
    <text class="dynamic-padding-hf-desc" x="516" y="182">length per batch.</text>
  </g>
  <line class="dynamic-padding-hf-line dynamic-padding-hf-conn dynamic-padding-hf-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#dynamic-padding-hf-tip)"/>
  <g class="dynamic-padding-hf-stage dynamic-padding-hf-s3">
    <rect class="dynamic-padding-hf-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="dynamic-padding-hf-step" x="752" y="142">04</text>
    <text class="dynamic-padding-hf-name" x="778" y="142">Substantially faster, identically accurate</text>
    <text class="dynamic-padding-hf-desc" x="752" y="166">Masking makes the results</text>
    <text class="dynamic-padding-hf-desc" x="752" y="182">identical.</text>
  </g>
  <text class="dynamic-padding-hf-sub" x="30" y="304">Identical results is the important guarantee: this is not an approximation or a trade, it is removing computation whose output was masked out anyway.</text>
</svg>
