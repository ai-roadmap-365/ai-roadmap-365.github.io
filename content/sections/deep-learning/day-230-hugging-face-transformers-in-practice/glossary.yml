terms:
  - term: 'Hugging Face Transformers'
    definition: 'The industry-standard open-source Python library for downloading, training, fine-tuning, and evaluating transformer models.'
  - term: 'AutoModel'
    definition: 'A factory wrapper class that dynamically resolves and instantiates the correct underlying neural architecture from configuration metadata.'
  - term: 'AutoTokenizer'
    definition: 'A factory class providing high-performance Rust-backed tokenization pipelines matched to specific model checkpoints.'
  - term: 'DataCollatorWithPadding'
    definition: 'A dynamic batching collation function that pads sequences to the maximum length within each batch rather than global max length.'
  - term: 'Trainer API'
    definition: 'A unified training and evaluation abstraction handling gradient accumulation, mixed precision, multi-GPU DDP, and logging.'
  - term: 'TrainingArguments'
    definition: 'A comprehensive configuration dataclass specifying optimization hyperparameters, checkpointing schedules, and evaluation strategies.'
  - term: 'Safetensors'
    definition: 'A secure, non-executable, zero-copy binary format for storing neural network tensor weights.'
  - term: 'Dynamic Padding'
    definition: 'The practice of padding batches to variable batch-specific lengths to maximize training throughput and minimize wasted FLOPs.'
