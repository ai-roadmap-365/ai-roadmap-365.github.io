terms:
  - term: 'Sequence-to-Sequence (Seq2Seq)'
    definition: 'A neural architecture consisting of an Encoder that processes an input sequence and a Decoder that generates an output sequence.'
  - term: 'Information Bottleneck'
    definition: 'The performance degradation caused by compressing an arbitrary-length sequence into a single fixed-size context vector.'
  - term: 'Additive Attention (Bahdanau)'
    definition: 'An alignment scoring function that combines query and key vectors using a feedforward neural layer with tanh activation.'
  - term: 'Multiplicative Attention (Luong)'
    definition: 'An alignment scoring function that calculates the direct dot product or bilinear projection between query and key vectors.'
  - term: 'Attention Weights'
    definition: 'A normalized probability distribution (alpha_t) produced via softmax indicating the relative importance of each source token.'
  - term: 'Dynamic Context Vector'
    definition: 'A weighted sum of all encoder hidden states (c_t = sum_i alpha_{t,i} h_i) computed uniquely at each decoder time step.'
  - term: 'Teacher Forcing'
    definition: 'A training strategy where ground-truth tokens are fed as decoder inputs to stabilize and accelerate convergence.'
  - term: 'Alignment Matrix'
    definition: 'A 2D heatmap matrix mapping source sequence positions to target sequence positions via attention weights.'
