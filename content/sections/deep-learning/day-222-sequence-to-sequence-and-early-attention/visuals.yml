visuals:
  - id: seq2seq-encoder-decoder-bottleneck
    file: assets/seq2seq-encoder-decoder-bottleneck.svg
    type: diagram
    title: 'Classic Seq2Seq Encoder-Decoder and Information Bottleneck'
    alt: Sequence to sequence encoder decoder architecture demonstrating the fixed size context vector information bottleneck
    description: 'Sutskever et al. (2014) Seq2Seq architecture highlighting the single fixed-size context vector bottleneck between encoder and decoder.'
  - id: bahdanau-additive-attention-mechanism
    file: assets/bahdanau-additive-attention-mechanism.svg
    type: diagram
    title: 'Bahdanau Additive Attention Alignment Mechanism'
    alt: Bahdanau Additive Attention mechanism showing dynamic soft attention weights connecting decoder query state to all encoder keys
    description: 'Bahdanau et al. (2014) additive attention mechanism computing dynamic soft alignment weights over all encoder hidden states.'
  - id: seq2seq-bottleneck
    file: assets/seq2seq-bottleneck.svg
    type: diagram
    title: 'The bottleneck attention removed'
    alt: 'Diagram: the fixed-size context bottleneck in encoder-decoder models'
    description: 'A four-stage description of the sequence-to-sequence bottleneck covering encoding, the single context vector, the decoding constraint and the length failure.'
  - id: attention-mechanics
    file: assets/attention-mechanics.svg
    type: diagram
    title: 'How attention works'
    alt: 'Diagram: the four steps of an attention computation'
    description: 'A four-stage description of attention covering score computation, softmax normalisation, weighted summation and the resulting context vector.'
  - id: soft-or-hard
    file: assets/soft-or-hard.svg
    type: diagram
    title: 'Soft attention, or hard selection'
    alt: 'Diagram: soft attention weights compared with discrete selection'
    description: 'A two-column comparison of soft fractional attention weights against hard discrete position selection.'
  - id: bahdanau-luong
    file: assets/bahdanau-luong.svg
    type: diagram
    title: 'Two scoring functions'
    alt: 'Diagram: additive attention scoring compared with multiplicative scoring'
    description: 'A two-column comparison of additive and multiplicative attention alignment functions.'
  - id: cross-to-self
    file: assets/cross-to-self.svg
    type: diagram
    title: 'From cross-attention to self-attention'
    alt: 'Diagram: cross-attention compared with self-attention by where queries and keys originate'
    description: 'A three-stage description of the step from cross-attention to self-attention covering the encoder-decoder case, the same-sequence case and the consequence.'
  - id: decoding-strategies
    file: assets/decoding-strategies.svg
    type: diagram
    title: 'Decoding strategies'
    alt: 'Diagram: greedy decoding compared with beam search'
    description: 'A four-stage description of decoding covering greedy selection, its myopia, beam search and the length bias.'
  - id: coverage
    file: assets/coverage.svg
    type: diagram
    title: 'Repetition, and coverage'
    alt: 'Diagram: how a coverage mechanism prevents repeated attention to the same source positions'
    description: 'A three-stage description of the repetition problem covering the symptom, the cause and the coverage remedy.'
  - id: stenographer
    file: assets/stenographer.svg
    type: diagram
    title: 'A stenographer and an interpreter'
    alt: 'Diagram: translating from memory compared with referring to the source'
    description: 'A two-column comparison of translating from a memorised summary against consulting the source throughout.'
  - id: attention-implications
    file: assets/attention-implications.svg
    type: diagram
    title: 'Four consequences of attention'
    alt: 'Diagram: the interpretability, cost, alignment and architectural implications of attention'
    description: 'A four-stage description of attention implications covering interpretable weights, quadratic cost, learned alignment and the path to transformers.'
  - id: attention-when
    file: assets/attention-when.svg
    type: diagram
    title: 'Where cross-attention still appears'
    alt: 'Diagram: where cross-attention is used in modern architectures'
    description: 'A two-column comparison of tasks using cross-attention against those using self-attention alone.'
