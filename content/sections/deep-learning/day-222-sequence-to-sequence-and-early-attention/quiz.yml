questions:
  - question: 'What was the fatal "Information Bottleneck" in the original 2014 Sutskever Seq2Seq encoder-decoder architecture that attention solved?'
    options:
      - 'Backpropagation was impossible'
      - 'The decoder could only generate numbers'
      - 'The model required 500 GPUs'
      - 'The whole sentence had to fit one fixed-length vector'
    answer_index: 3
    explanation: 'Compressing arbitrary-length documents into a single fixed vector creates a severe information bottleneck, degrading performance on long sequences.'
  - question: 'How does Bahdanau Additive Attention (1914) construct the dynamic context vector c_t at each decoder step t?'
    options:
      - 'It takes a weighted sum over all encoder states'
      - 'It takes the maximum value of the first token'
      - 'It averages the entire vocabulary embedding table'
      - 'It randomly drops 50% of the encoder states'
    answer_index: 0
    explanation: 'Attention computes dynamic soft weights over all encoder hidden states, allowing the decoder to look back at relevant source words at every decoding step.'
  - question: 'What is the mathematical difference between Bahdanau Additive Attention and Luong Multiplicative Attention?'
    options:
      - 'Luong attention uses convolutional layers throughout'
      - 'Bahdanau uses an MLP; Luong uses a matrix product'
      - 'Bahdanau attention only works in French'
      - 'Luong attention does not use softmax'
    answer_index: 1
    explanation: 'Bahdanau uses an additive MLP with tanh, while Luong uses efficient bilinear dot products (s^T W h).'
  - question: 'What is "Teacher Forcing" during Seq2Seq training, and why is it used?'
    options:
      - 'Freezing the encoder weights'
      - 'Training the model with an automated grading script'
      - 'Feeding the true previous token instead of the predicted one'
      - 'Multiplying the learning rate by 10'
    answer_index: 2
    explanation: 'Teacher forcing feeds ground-truth tokens during training to prevent compounding error cascades during early training iterations.'
  - question: 'Why are Attention Alignment Heatmaps considered one of the earliest forms of interpretable neural network visualizations?'
    options:
      - 'They display the dataset''s folder hierarchy on disk'
      - 'They display the GPU temperature'
      - 'They show the loss curve'
      - 'The attention matrix shows the word alignments'
    answer_index: 3
    explanation: 'Visualizing alpha_{t,i} displays a soft alignment matrix showing exact source-to-target semantic correspondences.'
