learning_promise: 'Master the architectural bridge to modern Transformers: understand classic Seq2Seq encoder-decoder networks, diagnose the fixed-size context vector bottleneck, derive Bahdanau Additive Attention and Luong Multiplicative Attention, visualize soft alignment matrices, and build an Attention-augmented Seq2Seq model in PyTorch.'
objectives:
  - 'Derive the classical Seq2Seq encoder-decoder architecture and explain its fixed-context bottleneck.'
  - 'Derive the Bahdanau Additive Attention mathematical formulation: score, softmax weights, and dynamic context vector.'
  - 'Compare Bahdanau Additive Attention with Luong Multiplicative (Dot-Product) Attention.'
  - 'Implement Teacher Forcing scheduled sampling vs greedy autoregressive inference loops.'
  - 'Extract and visualize cross-attention alignment heatmaps demonstrating word-to-word translation correspondences.'
