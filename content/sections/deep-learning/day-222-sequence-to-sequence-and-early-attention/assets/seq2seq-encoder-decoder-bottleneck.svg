<svg role="img" aria-label="Sequence to sequence encoder decoder architecture demonstrating the fixed size context vector information bottleneck" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Classic Seq2Seq Encoder-Decoder and Information Bottleneck</title>
  <defs>
    <linearGradient id="bg222a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card222" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg222a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CLASSIC SEQ2SEQ ENCODER-DECODER ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sutskever et al. (2014) &amp; Cho et al. (2014) Fixed Context Vector Information Bottleneck</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card222)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Left: Encoder (Blue) -->
    <rect x="25" y="25" width="280" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="165" y="48" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Encoder Network (Input Text)</text>
    
    <circle cx="75" cy="200" r="15" fill="#10b981"/>
    <text x="75" y="204" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_1</text>
    <line x1="75" y1="185" x2="75" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="75" cy="120" r="16" fill="#38bdf8"/>
    <text x="75" y="124" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_1</text>

    <line x1="91" y1="120" x2="149" y2="120" stroke="#fbbf24" stroke-width="2"/>
    
    <circle cx="165" cy="200" r="15" fill="#10b981"/>
    <text x="165" y="204" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_2</text>
    <line x1="165" y1="185" x2="165" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="165" cy="120" r="16" fill="#38bdf8"/>
    <text x="165" y="124" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_2</text>

    <line x1="181" y1="120" x2="239" y2="120" stroke="#fbbf24" stroke-width="2"/>

    <circle cx="255" cy="200" r="15" fill="#10b981"/>
    <text x="255" y="204" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">x_3</text>
    <line x1="255" y1="185" x2="255" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="255" cy="120" r="16" fill="#38bdf8"/>
    <text x="255" y="124" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">h_3</text>

    <!-- Center: The Bottleneck Vector -->
    <g transform="translate(325, 80)">
      <rect width="110" height="85" fill="#0f172a" stroke="#f43f5e" stroke-width="2" rx="6"/>
      <text x="55" y="25" fill="#fb7185" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">Bottleneck Vector</text>
      <text x="55" y="48" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">c = h_T</text>
      <text x="55" y="70" fill="#fb7185" font-size="8" text-anchor="middle">Memory Collapse!</text>
    </g>
    <line x1="271" y1="120" x2="325" y2="120" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="435" y1="120" x2="480" y2="120" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Right: Decoder (Purple) -->
    <rect x="455" y="25" width="280" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="595" y="48" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Decoder Network (Generated Text)</text>

    <circle cx="505" cy="120" r="16" fill="#a855f7"/>
    <text x="505" y="124" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">s_1</text>
    <line x1="505" y1="104" x2="505" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="505" cy="55" r="14" fill="#f43f5e"/>
    <text x="505" y="59" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">y_1</text>

    <line x1="521" y1="120" x2="579" y2="120" stroke="#fbbf24" stroke-width="2"/>

    <circle cx="595" cy="120" r="16" fill="#a855f7"/>
    <text x="595" y="124" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">s_2</text>
    <line x1="595" y1="104" x2="595" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="595" cy="55" r="14" fill="#f43f5e"/>
    <text x="595" y="59" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">y_2</text>

    <line x1="611" y1="120" x2="669" y2="120" stroke="#fbbf24" stroke-width="2"/>

    <circle cx="685" cy="120" r="16" fill="#a855f7"/>
    <text x="685" y="124" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">s_3</text>
    <line x1="685" y1="104" x2="685" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="685" cy="55" r="14" fill="#f43f5e"/>
    <text x="685" y="59" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">y_3</text>
  </g>
</svg>
