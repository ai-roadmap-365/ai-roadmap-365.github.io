<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Additive, or multiplicative.">
  <title>Two scoring functions</title>
  <style>
    .bahdanau-luong-bg   { fill: #f8fafc; }
    .bahdanau-luong-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bahdanau-luong-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bahdanau-luong-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bahdanau-luong-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bahdanau-luong-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bahdanau-luong-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bahdanau-luong-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bahdanau-luong-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bahdanau-luong-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bahdanau-luong-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bahdanau-luong-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bahdanau-luong-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bahdanau-luong-row { opacity: 1; }
    .bahdanau-luong-r0 { animation-delay: 0.00s; }
    .bahdanau-luong-r1 { animation-delay: 0.45s; }
    .bahdanau-luong-r2 { animation-delay: 0.90s; }
    .bahdanau-luong-r3 { animation-delay: 1.35s; }
    .bahdanau-luong-r4 { animation-delay: 1.80s; }
    .bahdanau-luong-row { animation: bahdanau-luong-reveal 7.3s ease-in-out infinite; }
    @keyframes bahdanau-luong-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bahdanau-luong-bg" width="980" height="390"/>
  <text class="bahdanau-luong-h1"  x="30" y="40">Two scoring functions</text>
  <text class="bahdanau-luong-sub" x="30" y="64">Additive, or multiplicative.</text>
  <rect class="bahdanau-luong-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bahdanau-luong-name" x="46" y="122">Additive</text>
  <text class="bahdanau-luong-desc" x="46" y="142">A small network.</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r0" x="46" y="182">Concatenate, transform, then project</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r1" x="46" y="216">Learned parameters in the scorer</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r2" x="46" y="250">Handles different encoder and decoder dimensions</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r3" x="46" y="284">More computation per score</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r4" x="46" y="318">The original formulation</text>
  <rect class="bahdanau-luong-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bahdanau-luong-name" x="526" y="122">Multiplicative</text>
  <text class="bahdanau-luong-desc" x="526" y="142">A dot product.</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r0" x="526" y="182">Query against key directly</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r1" x="526" y="216">Optionally with a learned matrix between</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r2" x="526" y="250">Far faster — one matrix multiply</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r3" x="526" y="284">Requires compatible dimensions</text>
  <text class="bahdanau-luong-desc bahdanau-luong-row bahdanau-luong-r4" x="526" y="318">What transformers use</text>
  <text class="bahdanau-luong-sub" x="30" y="372">The multiplicative form won on efficiency: a batched dot product maps directly onto hardware built for matrix multiplication, and the additive form does not.</text>
</svg>
