<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, per output token.">
  <title>How attention works</title>
  <style>
    .attention-mechanics-bg   { fill: #f8fafc; }
    .attention-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .attention-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .attention-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .attention-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .attention-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .attention-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .attention-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .attention-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .attention-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .attention-mechanics-stage { opacity: 1; }

    .attention-mechanics-s0 { animation-delay: 0.00s; }
    .attention-mechanics-e0 { animation-delay: 0.00s; }
    .attention-mechanics-s1 { animation-delay: 1.28s; }
    .attention-mechanics-e1 { animation-delay: 1.28s; }
    .attention-mechanics-s2 { animation-delay: 2.56s; }
    .attention-mechanics-e2 { animation-delay: 2.56s; }
    .attention-mechanics-s3 { animation-delay: 3.84s; }
    .attention-mechanics-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .attention-mechanics-conn  { animation: attention-mechanics-trace 6.4s ease-in-out infinite; }
      .attention-mechanics-stage { animation: attention-mechanics-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes attention-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes attention-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .attention-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .attention-mechanics-stage { animation: attention-mechanics-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes attention-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="attention-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="attention-mechanics-bg" width="980" height="322"/>
  <text class="attention-mechanics-h1"  x="30" y="40">How attention works</text>
  <text class="attention-mechanics-sub" x="30" y="64">Four steps, per output token.</text>
  <g class="attention-mechanics-stage attention-mechanics-s0">
    <rect class="attention-mechanics-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="attention-mechanics-step" x="44" y="142">01</text>
    <text class="attention-mechanics-name" x="70" y="142">Score the query against every key</text>
    <text class="attention-mechanics-desc" x="44" y="166">How relevant is each encoder</text>
    <text class="attention-mechanics-desc" x="44" y="182">position to what is being</text>
    <text class="attention-mechanics-desc" x="44" y="198">generated now?</text>
  </g>
  <line class="attention-mechanics-line attention-mechanics-conn attention-mechanics-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#attention-mechanics-tip)"/>
  <g class="attention-mechanics-stage attention-mechanics-s1">
    <rect class="attention-mechanics-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="attention-mechanics-step" x="280" y="142">02</text>
    <text class="attention-mechanics-name" x="306" y="142">Normalise the scores</text>
    <text class="attention-mechanics-desc" x="280" y="166">A softmax, so they form a</text>
    <text class="attention-mechanics-desc" x="280" y="182">distribution over source</text>
    <text class="attention-mechanics-desc" x="280" y="198">positions.</text>
    <text class="attention-mechanics-edge" x="280" y="242">weights</text>
  </g>
  <line class="attention-mechanics-line attention-mechanics-conn attention-mechanics-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#attention-mechanics-tip)"/>
  <g class="attention-mechanics-stage attention-mechanics-s2">
    <rect class="attention-mechanics-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="attention-mechanics-step" x="516" y="142">03</text>
    <text class="attention-mechanics-name" x="542" y="142">Weight and sum the values</text>
    <text class="attention-mechanics-desc" x="516" y="166">A context vector: a blend of</text>
    <text class="attention-mechanics-desc" x="516" y="182">encoder states, weighted by</text>
    <text class="attention-mechanics-desc" x="516" y="198">relevance.</text>
  </g>
  <line class="attention-mechanics-line attention-mechanics-conn attention-mechanics-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#attention-mechanics-tip)"/>
  <g class="attention-mechanics-stage attention-mechanics-s3">
    <rect class="attention-mechanics-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="attention-mechanics-step" x="752" y="142">04</text>
    <text class="attention-mechanics-name" x="778" y="142">Recomputed at every output step</text>
    <text class="attention-mechanics-desc" x="752" y="166">Different output words attend to</text>
    <text class="attention-mechanics-desc" x="752" y="182">different source words.</text>
  </g>
  <text class="attention-mechanics-sub" x="30" y="304">Recomputation per step is the property that removes the bottleneck: the decoder is not working from a fixed summary, it is querying the whole source each time it produces a word.</text>
</svg>
