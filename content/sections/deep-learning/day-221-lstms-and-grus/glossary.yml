terms:
  - term: 'LSTM'
    definition: 'Long Short-Term Memory: a recurrent neural architecture featuring an additive cell state conveyor belt regulated by three multiplicative gates.'
  - term: 'Cell State'
    definition: 'The persistent internal memory highway (C_t) of an LSTM that transports information across long sequence horizons with minimal attenuation.'
  - term: 'Forget Gate'
    definition: 'A sigmoid gate (f_t) in an LSTM that controls what fraction of past cell state memory is discarded versus retained.'
  - term: 'Input Gate'
    definition: 'A sigmoid gate (i_t) in an LSTM that modulates how much new candidate information is written into the cell state.'
  - term: 'Output Gate'
    definition: 'A sigmoid gate (o_t) in an LSTM that filters the non-linear activated cell state into the visible hidden state h_t.'
  - term: 'GRU'
    definition: 'Gated Recurrent Unit: a simplified 2-gate recurrent architecture (Reset and Update gates) that interpolates directly between hidden states.'
  - term: 'PackedSequence'
    definition: 'A PyTorch memory layout that packs variable-length padded sequences to skip redundant computation on padding tokens.'
  - term: 'Constant Error Carousel (CEC)'
    definition: 'The theoretical principle in LSTMs ensuring unit derivative flow through linear recurrent connections during backpropagation.'
