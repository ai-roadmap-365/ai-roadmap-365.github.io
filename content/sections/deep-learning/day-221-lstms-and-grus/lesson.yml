learning_promise: 'Master gated sequence memory: derive Long Short-Term Memory (LSTM) gating equations and the Constant Error Carousel, understand the Gated Recurrent Unit (GRU) convex interpolation mechanism, compare computational complexity, handle variable-length sequence batching with packed padded sequences, and build a production BiLSTM in PyTorch.'
objectives:
  - 'Derive the full LSTM mathematical gating system: forget gate, input gate, cell state update, and output gate.'
  - 'Explain how the additive Cell State conveyor belt eliminates the vanishing gradient problem.'
  - 'Derive the Gated Recurrent Unit (GRU) update and reset gate formulation.'
  - 'Implement variable-length sequence batch collation using pack_padded_sequence and pad_packed_sequence.'
  - 'Construct and train a multi-layer Bidirectional LSTM classifier in PyTorch.'
