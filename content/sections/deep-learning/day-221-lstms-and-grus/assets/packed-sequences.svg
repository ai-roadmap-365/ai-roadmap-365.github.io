<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Not computing over padding.">
  <title>Packed sequences</title>
  <style>
    .packed-sequences-bg   { fill: #f8fafc; }
    .packed-sequences-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packed-sequences-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packed-sequences-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packed-sequences-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packed-sequences-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .packed-sequences-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .packed-sequences-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .packed-sequences-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .packed-sequences-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .packed-sequences-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .packed-sequences-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .packed-sequences-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .packed-sequences-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .packed-sequences-stage { opacity: 1; }

    .packed-sequences-s0 { animation-delay: 0.00s; }
    .packed-sequences-e0 { animation-delay: 0.00s; }
    .packed-sequences-s1 { animation-delay: 1.28s; }
    .packed-sequences-e1 { animation-delay: 1.28s; }
    .packed-sequences-s2 { animation-delay: 2.56s; }
    .packed-sequences-e2 { animation-delay: 2.56s; }
    .packed-sequences-s3 { animation-delay: 3.84s; }
    .packed-sequences-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .packed-sequences-conn  { animation: packed-sequences-trace 6.4s ease-in-out infinite; }
      .packed-sequences-stage { animation: packed-sequences-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes packed-sequences-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes packed-sequences-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .packed-sequences-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .packed-sequences-stage { animation: packed-sequences-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes packed-sequences-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="packed-sequences-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="packed-sequences-bg" width="980" height="322"/>
  <text class="packed-sequences-h1"  x="30" y="40">Packed sequences</text>
  <text class="packed-sequences-sub" x="30" y="64">Not computing over padding.</text>
  <g class="packed-sequences-stage packed-sequences-s0">
    <rect class="packed-sequences-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="packed-sequences-step" x="44" y="142">01</text>
    <text class="packed-sequences-name" x="70" y="142">Padding wastes computation</text>
    <text class="packed-sequences-desc" x="44" y="166">The recurrence runs over</text>
    <text class="packed-sequences-desc" x="44" y="182">positions that are not real.</text>
  </g>
  <line class="packed-sequences-line packed-sequences-conn packed-sequences-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#packed-sequences-tip)"/>
  <g class="packed-sequences-stage packed-sequences-s1">
    <rect class="packed-sequences-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="packed-sequences-step" x="280" y="142">02</text>
    <text class="packed-sequences-name" x="306" y="142">And corrupts the final state</text>
    <text class="packed-sequences-desc" x="280" y="166">The last hidden state reflects</text>
    <text class="packed-sequences-desc" x="280" y="182">padding, not the last real</text>
    <text class="packed-sequences-desc" x="280" y="198">token.</text>
  </g>
  <line class="packed-sequences-line packed-sequences-conn packed-sequences-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#packed-sequences-tip)"/>
  <g class="packed-sequences-stage packed-sequences-s2">
    <rect class="packed-sequences-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="packed-sequences-step" x="516" y="142">03</text>
    <text class="packed-sequences-name" x="542" y="142">Packing tells the layer the true lengths</text>
    <text class="packed-sequences-desc" x="516" y="166">So each sequence stops where it</text>
    <text class="packed-sequences-desc" x="516" y="182">actually ends.</text>
  </g>
  <line class="packed-sequences-line packed-sequences-conn packed-sequences-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#packed-sequences-tip)"/>
  <g class="packed-sequences-stage packed-sequences-s3">
    <rect class="packed-sequences-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="packed-sequences-step" x="752" y="142">04</text>
    <text class="packed-sequences-name" x="778" y="142">The returned final state is correct</text>
    <text class="packed-sequences-desc" x="752" y="166">Per sequence, at its own last</text>
    <text class="packed-sequences-desc" x="752" y="182">real position.</text>
  </g>
  <text class="packed-sequences-sub" x="30" y="304">The corrupted final state is the bug that matters: a classifier reading the last hidden state of a padded batch is classifying based on however many padding steps followed the text.</text>
</svg>
