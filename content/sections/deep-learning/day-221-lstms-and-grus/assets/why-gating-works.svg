<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Addition instead of repeated multiplication.">
  <title>Why gating fixes vanishing gradients</title>
  <style>
    .why-gating-works-bg   { fill: #f8fafc; }
    .why-gating-works-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gating-works-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gating-works-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gating-works-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gating-works-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-gating-works-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-gating-works-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-gating-works-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-gating-works-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-gating-works-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-gating-works-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-gating-works-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-gating-works-row { opacity: 1; }
    .why-gating-works-r0 { animation-delay: 0.00s; }
    .why-gating-works-r1 { animation-delay: 0.45s; }
    .why-gating-works-r2 { animation-delay: 0.90s; }
    .why-gating-works-r3 { animation-delay: 1.35s; }
    .why-gating-works-r4 { animation-delay: 1.80s; }
    .why-gating-works-row { animation: why-gating-works-reveal 7.3s ease-in-out infinite; }
    @keyframes why-gating-works-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="why-gating-works-bg" width="980" height="390"/>
  <text class="why-gating-works-h1"  x="30" y="40">Why gating fixes vanishing gradients</text>
  <text class="why-gating-works-sub" x="30" y="64">Addition instead of repeated multiplication.</text>
  <rect class="why-gating-works-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="why-gating-works-name" x="46" y="122">Vanilla recurrence</text>
  <text class="why-gating-works-desc" x="46" y="142">Multiplied at every step.</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r0" x="46" y="182">The state passes through a weight matrix</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r1" x="46" y="216">And an activation, each step</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r2" x="46" y="250">Gradients multiply T Jacobians</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r3" x="46" y="284">Below one, they vanish in ten steps</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r4" x="46" y="318">No path around it</text>
  <rect class="why-gating-works-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="why-gating-works-name" x="526" y="122">Gated cell state</text>
  <text class="why-gating-works-desc" x="526" y="142">Added at every step.</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r0" x="526" y="182">The old state is scaled and added to</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r1" x="526" y="216">Not transformed by a matrix</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r2" x="526" y="250">The derivative has a direct path</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r3" x="526" y="284">Gradients survive hundreds of steps</text>
  <text class="why-gating-works-desc why-gating-works-row why-gating-works-r4" x="526" y="318">The same idea as a skip connection</text>
  <text class="why-gating-works-sub" x="30" y="372">This is the same insight that residual connections apply to depth, arriving two decades earlier and in a different guise: give the gradient a path that does not multiply.</text>
</svg>
