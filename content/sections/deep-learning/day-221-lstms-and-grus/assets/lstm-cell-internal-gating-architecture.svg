<svg role="img" aria-label="Long Short-Term Memory LSTM cell internal architecture showing cell state conveyor belt forget gate input gate and output gate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>LSTM Cell Internal Gating Architecture</title>
  <defs>
    <linearGradient id="bg221a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card221" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg221a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LONG SHORT-TERM MEMORY (LSTM) CELL ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Hochreiter &amp; Schmidhuber (1997) Constant Error Carousel (CEC) with Additive Cell State</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card221)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Cell State Highway (Top) -->
    <line x1="40" y1="50" x2="720" y2="50" stroke="#10b981" stroke-width="4"/>
    <text x="40" y="38" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700">C_{t-1} (Cell State)</text>
    <text x="710" y="38" fill="#34d399" font-family="system-ui" font-size="10" font-weight="700" text-anchor="end">C_t</text>

    <!-- Pointwise Multiply 1 (Forget) -->
    <circle cx="180" cy="50" r="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="180" y="54" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">×</text>

    <!-- Pointwise Add (Input update) -->
    <circle cx="440" cy="50" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="54" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">+</text>

    <!-- Pointwise Multiply 2 (Output) -->
    <circle cx="640" cy="180" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="640" y="184" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">×</text>

    <!-- Gate 1: Forget Gate (f_t) -->
    <rect x="150" y="140" width="60" height="40" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="4"/>
    <text x="180" y="165" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">σ (f_t)</text>
    <line x1="180" y1="140" x2="180" y2="64" stroke="#f43f5e" stroke-width="2"/>
    <text x="180" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Forget Gate</text>

    <!-- Gate 2: Input Gate (i_t) & Candidate Cell (~C_t) -->
    <rect x="330" y="140" width="60" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="360" y="165" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">σ (i_t)</text>
    <text x="360" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Input Gate</text>

    <rect x="410" y="140" width="60" height="40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
    <text x="440" y="165" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">tanh (~C)</text>
    <text x="440" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Candidate</text>

    <!-- Sub-Multiply i_t x ~C_t -->
    <circle cx="440" cy="100" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="440" y="103" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">×</text>
    <line x1="360" y1="140" x2="430" y2="100" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="440" y1="140" x2="440" y2="110" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="440" y1="90" x2="440" y2="64" stroke="#10b981" stroke-width="2"/>

    <!-- Gate 3: Output Gate (o_t) -->
    <rect x="540" y="140" width="60" height="40" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <text x="570" y="165" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">σ (o_t)</text>
    <text x="570" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Output Gate</text>
    
    <line x1="600" y1="160" x2="626" y2="180" stroke="#a855f7" stroke-width="1.5"/>
    
    <!-- Cell State -> tanh -> Output Mult -->
    <path d="M 520,50 L 520,100 L 640,100 L 640,166" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="615" y="90" width="50" height="25" fill="#0f172a" stroke="#10b981" rx="3"/>
    <text x="640" y="106" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">tanh</text>

    <!-- Inputs at Bottom: [h_{t-1}, x_t] -->
    <line x1="40" y1="250" x2="600" y2="250" stroke="#cbd5e1" stroke-width="2"/>
    <text x="40" y="270" fill="#94a3b8" font-size="10" font-weight="700">[ h_{t-1}, x_t ] Combined Input Vector</text>

    <line x1="180" y1="250" x2="180" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="360" y1="250" x2="360" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="440" y1="250" x2="440" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="570" y1="250" x2="570" y2="180" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Hidden State Output h_t -->
    <line x1="654" y1="180" x2="730" y2="180" stroke="#a855f7" stroke-width="3"/>
    <text x="730" y="170" fill="#c084fc" font-size="10" font-weight="700">h_t</text>
  </g>
</svg>
