<svg role="img" aria-label="Gated Recurrent Unit GRU cell internal architecture showing reset gate update gate and candidate hidden state" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Gated Recurrent Unit (GRU) Internal Architecture</title>
  <defs>
    <linearGradient id="bg221b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card221b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg221b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GATED RECURRENT UNIT (GRU) ARCHITECTURE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Cho et al. (2014) Streamlined 2-Gate Architecture Merging Cell State and Hidden State</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card221b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Main Hidden State Flow -->
    <line x1="40" y1="60" x2="720" y2="60" stroke="#38bdf8" stroke-width="3.5"/>
    <text x="40" y="48" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700">h_{t-1}</text>
    <text x="710" y="48" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="700" text-anchor="end">h_t</text>

    <!-- Gate 1: Reset Gate (r_t) -->
    <rect x="150" y="140" width="70" height="40" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="4"/>
    <text x="185" y="165" fill="#fb7185" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">σ (r_t)</text>
    <text x="185" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Reset Gate</text>

    <!-- Gate 2: Update Gate (z_t) -->
    <rect x="300" y="140" width="70" height="40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
    <text x="335" y="165" fill="#fbbf24" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">σ (z_t)</text>
    <text x="335" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Update Gate</text>

    <!-- Candidate Hidden State (~h_t) -->
    <rect x="470" y="140" width="70" height="40" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="505" y="165" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">tanh (~h)</text>
    <text x="505" y="200" fill="#cbd5e1" font-size="8" text-anchor="middle">Candidate State</text>

    <!-- Interpolation Junction -->
    <circle cx="620" cy="60" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="620" y="65" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Blend</text>
    <text x="620" y="105" fill="#cbd5e1" font-size="8" text-anchor="middle">(1-z)*h_{t-1} + z*~h</text>

    <!-- Input connections -->
    <line x1="40" y1="240" x2="520" y2="240" stroke="#cbd5e1" stroke-width="2"/>
    <text x="40" y="260" fill="#94a3b8" font-size="10" font-weight="700">[ h_{t-1}, x_t ] Input</text>
    
    <line x1="185" y1="240" x2="185" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="335" y1="240" x2="335" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="505" y1="240" x2="505" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="505" y1="140" x2="604" y2="60" stroke="#10b981" stroke-width="1.5"/>
    <line x1="335" y1="140" x2="608" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
</svg>
