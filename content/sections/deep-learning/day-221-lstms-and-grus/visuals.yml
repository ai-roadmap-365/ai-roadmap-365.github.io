visuals:
  - id: lstm-cell-internal-gating-architecture
    file: assets/lstm-cell-internal-gating-architecture.svg
    type: diagram
    title: 'LSTM Cell Internal Gating Architecture'
    alt: Long Short-Term Memory LSTM cell internal architecture showing cell state conveyor belt forget gate input gate and output gate
    description: 'Detailed schematic of an LSTM cell: cell state conveyor belt, forget gate, input candidate gate, additive state update, and output hidden gate.'
  - id: gru-cell-internal-architecture
    file: assets/gru-cell-internal-architecture.svg
    type: diagram
    title: 'Gated Recurrent Unit (GRU) Internal Architecture'
    alt: Gated Recurrent Unit GRU cell internal architecture showing reset gate update gate and candidate hidden state
    description: 'Architectural breakdown of the Gated Recurrent Unit (GRU) showing reset gate, update gate, and linear convex state interpolation.'
  - id: lstm-gates
    file: assets/lstm-gates.svg
    type: diagram
    title: 'Three gates and a cell state'
    alt: 'Diagram: the three gates of an LSTM cell and the cell state they control'
    description: 'A four-stage description of LSTM gating covering the forget gate, input gate, cell state update and output gate.'
  - id: why-gating-works
    file: assets/why-gating-works.svg
    type: diagram
    title: 'Why gating fixes vanishing gradients'
    alt: 'Diagram: the multiplicative recurrent path compared with the additive gated path'
    description: 'A two-column comparison of a vanilla recurrent state update against a gated additive cell state update.'
  - id: lstm-or-gru
    file: assets/lstm-or-gru.svg
    type: diagram
    title: 'LSTM or GRU'
    alt: 'Diagram: the LSTM compared with the gated recurrent unit'
    description: 'A two-column comparison of LSTM and GRU architectures by gate count, state and efficiency.'
  - id: packed-sequences
    file: assets/packed-sequences.svg
    type: diagram
    title: 'Packed sequences'
    alt: 'Diagram: why variable-length recurrent batches need packing rather than padding alone'
    description: 'A four-stage description of packed sequences covering padding waste, incorrect final states, packing and the correct result.'
  - id: gating-legacy
    file: assets/gating-legacy.svg
    type: diagram
    title: 'Where gating went next'
    alt: 'Diagram: how the gated additive path propagated into later architectures'
    description: 'A three-stage progression from LSTM cell states through highway networks to residual connections.'
  - id: reservoir
    file: assets/reservoir.svg
    type: diagram
    title: 'A reservoir with sluice gates'
    alt: 'Diagram: a reservoir with controlled inflow and outflow as an analogy for gated memory'
    description: 'A two-column comparison of an uncontrolled channel against a reservoir with controlled gates.'
  - id: attention-pooling
    file: assets/attention-pooling.svg
    type: diagram
    title: 'Pooling over hidden states'
    alt: 'Diagram: three ways to summarise a sequence of recurrent hidden states'
    description: 'A three-stage description of sequence pooling covering final state, mean pooling and attention pooling.'
  - id: lstm-implications
    file: assets/lstm-implications.svg
    type: diagram
    title: 'Four consequences of gated recurrence'
    alt: 'Diagram: the memory, speed, streaming and capacity implications of gated recurrent networks'
    description: 'A four-stage description of gated recurrence implications covering memory span, sequential cost, streaming efficiency and state compression limits.'
  - id: lstm-when
    file: assets/lstm-when.svg
    type: diagram
    title: 'Where gated recurrence still fits'
    alt: 'Diagram: when LSTMs and GRUs remain the right choice'
    description: 'A two-column comparison of situations suited to gated recurrent networks against those requiring attention.'
