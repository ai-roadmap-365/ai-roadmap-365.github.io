questions:
  - question: 'How does the LSTM Cell State (C_t) eliminate the vanishing gradient problem that plagues vanilla RNNs?'
    options:
      - 'The Cell State functions as an additive conveyor belt (C_t = f_t * C_{t-1} + i_t * ~C_t); because updates are linear and additive rather than repeated non-linear matrix products, error gradients can flow backward across hundreds of time steps with near-zero attenuation (Constant Error Carousel)'
      - 'It multiplies all gradients by 1000'
      - 'It deletes negative numbers'
      - 'It stops backpropagation after 5 steps'
    answer_index: 0
    explanation: 'The additive identity gradient path of the cell state allows error signals to flow back across time without exponential decay.'
  - question: 'What is the role of the Forget Gate (f_t) in an LSTM cell?'
    options:
      - 'It outputs a vector of values between 0 (completely discard) and 1 (completely retain) via a sigmoid activation, determining what proportion of the previous cell state C_{t-1} should be preserved'
      - 'It resets the model weights to random noise'
      - 'It deletes corrupted input text files'
      - 'It clears GPU cache memory'
    answer_index: 0
    explanation: 'The forget gate uses a sigmoid activation to selectively attenuate or preserve past cell state information.'
  - question: 'What is the primary architectural simplification that distinguishes a Gated Recurrent Unit (GRU) from an LSTM?'
    options:
      - 'The GRU merges the cell state and hidden state into a single vector h_t and uses only 2 gates (Reset and Update gates) instead of 3 gates, reducing parameter count by 25% and accelerating training'
      - 'The GRU removes all activation functions'
      - 'The GRU only processes numbers, not text'
      - 'The GRU requires no matrix multiplications'
    answer_index: 0
    explanation: 'GRUs eliminate the separate cell state and use a single update gate to interpolate between past hidden state and candidate state, saving 25% of weights.'
  - question: 'Why is torch.nn.utils.rnn.pack_padded_sequence used when feeding variable-length padded sentence batches into PyTorch RNNs/LSTMs?'
    options:
      - 'It bypasses computation on padding tokens (<pad>), preventing zero-padding tokens from corrupting the final hidden state and accelerating GPU execution'
      - 'It encrypts the model tensors on disk'
      - 'It converts float32 tensors to int8'
      - 'It sorts the vocabulary alphabetically'
    answer_index: 0
    explanation: 'PackedSequence objects store only valid sequence elements and their lengths, skipping redundant computations on padding slots.'
  - question: 'In a Bidirectional LSTM (BiLSTM) with hidden_dim = 128, what is the dimension of the concatenated output hidden state vector at each time step?'
    options:
      - '256 (128 from the forward pass + 128 from the backward pass)'
      - '128'
      - '512'
      - '64'
    answer_index: 0
    explanation: 'A bidirectional layer concatenates forward and backward hidden state vectors, doubling the feature dimension (128 * 2 = 256).'
