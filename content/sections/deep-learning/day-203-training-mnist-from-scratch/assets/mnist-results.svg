<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="96.4% in twelve seconds.">
  <title>What the numbers say</title>
  <style>
    .mnist-results-bg   { fill: #f8fafc; }
    .mnist-results-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-results-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-results-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-results-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-results-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mnist-results-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mnist-results-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mnist-results-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mnist-results-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mnist-results-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mnist-results-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mnist-results-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .mnist-results-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .mnist-results-stage { opacity: 1; }

    .mnist-results-s0 { animation-delay: 0.00s; }
    .mnist-results-e0 { animation-delay: 0.00s; }
    .mnist-results-s1 { animation-delay: 1.28s; }
    .mnist-results-e1 { animation-delay: 1.28s; }
    .mnist-results-s2 { animation-delay: 2.56s; }
    .mnist-results-e2 { animation-delay: 2.56s; }
    .mnist-results-s3 { animation-delay: 3.84s; }
    .mnist-results-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .mnist-results-conn  { animation: mnist-results-trace 6.4s ease-in-out infinite; }
      .mnist-results-stage { animation: mnist-results-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes mnist-results-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes mnist-results-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .mnist-results-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .mnist-results-stage { animation: mnist-results-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes mnist-results-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="mnist-results-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="mnist-results-bg" width="980" height="322"/>
  <text class="mnist-results-h1"  x="30" y="40">What the numbers say</text>
  <text class="mnist-results-sub" x="30" y="64">96.4% in twelve seconds.</text>
  <g class="mnist-results-stage mnist-results-s0">
    <rect class="mnist-results-good" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="mnist-results-step" x="44" y="142">01</text>
    <text class="mnist-results-name" x="70" y="142">Pure NumPy, two layers</text>
    <text class="mnist-results-desc" x="44" y="166">101,770 parameters. 96.4%, in</text>
    <text class="mnist-results-desc" x="44" y="182">about twelve seconds on a CPU.</text>
  </g>
  <line class="mnist-results-line mnist-results-conn mnist-results-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#mnist-results-tip)"/>
  <g class="mnist-results-stage mnist-results-s1">
    <rect class="mnist-results-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="mnist-results-step" x="280" y="142">02</text>
    <text class="mnist-results-name" x="306" y="142">A framework network, three layers</text>
    <text class="mnist-results-desc" x="280" y="166">Roughly double the parameters,</text>
    <text class="mnist-results-desc" x="280" y="182">98.1%, and faster to train.</text>
  </g>
  <line class="mnist-results-line mnist-results-conn mnist-results-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#mnist-results-tip)"/>
  <g class="mnist-results-stage mnist-results-s2">
    <rect class="mnist-results-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="mnist-results-step" x="516" y="142">03</text>
    <text class="mnist-results-name" x="542" y="142">A convolutional network</text>
    <text class="mnist-results-desc" x="516" y="166">Fewer parameters, higher</text>
    <text class="mnist-results-desc" x="516" y="182">accuracy — because it uses</text>
    <text class="mnist-results-desc" x="516" y="198">spatial structure.</text>
    <text class="mnist-results-edge" x="516" y="242">Day 211</text>
  </g>
  <line class="mnist-results-line mnist-results-conn mnist-results-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#mnist-results-tip)"/>
  <g class="mnist-results-stage mnist-results-s3">
    <rect class="mnist-results-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="mnist-results-step" x="752" y="142">04</text>
    <text class="mnist-results-name" x="778" y="142">The gap is architectural</text>
    <text class="mnist-results-desc" x="752" y="166">Not compute, and not data. The</text>
    <text class="mnist-results-desc" x="752" y="182">dense model discards</text>
    <text class="mnist-results-desc" x="752" y="198">information.</text>
  </g>
  <text class="mnist-results-sub" x="30" y="304">The convolutional result is the interesting one because it uses fewer parameters for better accuracy, which is the clearest possible argument that architecture encodes assumptions about the data.</text>
</svg>
