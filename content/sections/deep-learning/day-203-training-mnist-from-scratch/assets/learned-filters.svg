<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Reshape a weight row and look at it.">
  <title>What the first layer learned</title>
  <style>
    .learned-filters-bg   { fill: #f8fafc; }
    .learned-filters-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learned-filters-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learned-filters-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learned-filters-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learned-filters-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .learned-filters-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .learned-filters-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .learned-filters-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .learned-filters-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .learned-filters-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .learned-filters-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .learned-filters-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .learned-filters-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .learned-filters-stage { opacity: 1; }

    .learned-filters-s0 { animation-delay: 0.00s; }
    .learned-filters-e0 { animation-delay: 0.00s; }
    .learned-filters-s1 { animation-delay: 1.28s; }
    .learned-filters-e1 { animation-delay: 1.28s; }
    .learned-filters-s2 { animation-delay: 2.56s; }
    .learned-filters-e2 { animation-delay: 2.56s; }
    .learned-filters-s3 { animation-delay: 3.84s; }
    .learned-filters-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .learned-filters-conn  { animation: learned-filters-trace 6.4s ease-in-out infinite; }
      .learned-filters-stage { animation: learned-filters-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes learned-filters-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes learned-filters-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .learned-filters-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .learned-filters-stage { animation: learned-filters-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes learned-filters-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="learned-filters-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="learned-filters-bg" width="980" height="322"/>
  <text class="learned-filters-h1"  x="30" y="40">What the first layer learned</text>
  <text class="learned-filters-sub" x="30" y="64">Reshape a weight row and look at it.</text>
  <g class="learned-filters-stage learned-filters-s0">
    <rect class="learned-filters-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="learned-filters-step" x="44" y="142">01</text>
    <text class="learned-filters-name" x="70" y="142">Each row of W1 has 784 numbers</text>
    <text class="learned-filters-desc" x="44" y="166">One per input pixel, for one</text>
    <text class="learned-filters-desc" x="44" y="182">hidden unit.</text>
  </g>
  <line class="learned-filters-line learned-filters-conn learned-filters-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#learned-filters-tip)"/>
  <g class="learned-filters-stage learned-filters-s1">
    <rect class="learned-filters-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="learned-filters-step" x="280" y="142">02</text>
    <text class="learned-filters-name" x="306" y="142">Reshape it back to 28 by 28</text>
    <text class="learned-filters-desc" x="280" y="166">The same layout the pixels came</text>
    <text class="learned-filters-desc" x="280" y="182">from.</text>
  </g>
  <line class="learned-filters-line learned-filters-conn learned-filters-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#learned-filters-tip)"/>
  <g class="learned-filters-stage learned-filters-s2">
    <rect class="learned-filters-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="learned-filters-step" x="516" y="142">03</text>
    <text class="learned-filters-name" x="542" y="142">Stroke and edge patterns appear</text>
    <text class="learned-filters-desc" x="516" y="166">Nobody designed them. They</text>
    <text class="learned-filters-desc" x="516" y="182">emerged from the gradient.</text>
  </g>
  <line class="learned-filters-line learned-filters-conn learned-filters-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#learned-filters-tip)"/>
  <g class="learned-filters-stage learned-filters-s3">
    <rect class="learned-filters-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="learned-filters-step" x="752" y="142">04</text>
    <text class="learned-filters-name" x="778" y="142">This is representation learning, visible</text>
    <text class="learned-filters-desc" x="752" y="166">The features were discovered</text>
    <text class="learned-filters-desc" x="752" y="182">rather than specified.</text>
    <text class="learned-filters-edge" x="752" y="242">the point</text>
  </g>
  <text class="learned-filters-sub" x="30" y="304">This is the most direct evidence available that the network is learning features rather than memorising examples, and it is worth doing once precisely because later architectures make it much harder to see.</text>
</svg>
