<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when it does not.">
  <title>When a dense network suits images</title>
  <style>
    .dense-for-vision-bg   { fill: #f8fafc; }
    .dense-for-vision-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-for-vision-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-for-vision-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-for-vision-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-for-vision-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-for-vision-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-for-vision-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dense-for-vision-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dense-for-vision-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dense-for-vision-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dense-for-vision-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dense-for-vision-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-for-vision-row { opacity: 1; }
    .dense-for-vision-r0 { animation-delay: 0.00s; }
    .dense-for-vision-r1 { animation-delay: 0.45s; }
    .dense-for-vision-r2 { animation-delay: 0.90s; }
    .dense-for-vision-r3 { animation-delay: 1.35s; }
    .dense-for-vision-r4 { animation-delay: 1.80s; }
    .dense-for-vision-row { animation: dense-for-vision-reveal 7.3s ease-in-out infinite; }
    @keyframes dense-for-vision-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dense-for-vision-bg" width="980" height="390"/>
  <text class="dense-for-vision-h1"  x="30" y="40">When a dense network suits images</text>
  <text class="dense-for-vision-sub" x="30" y="64">And when it does not.</text>
  <rect class="dense-for-vision-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dense-for-vision-name" x="46" y="122">A dense network works</text>
  <text class="dense-for-vision-desc" x="46" y="142">Small, centred, uniform.</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r0" x="46" y="182">Normalised, centred digits or symbols</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r1" x="46" y="216">Fixed size and orientation</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r2" x="46" y="250">A fast baseline to beat</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r3" x="46" y="284">Constrained compute budgets</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r4" x="46" y="318">Where spatial invariance does not matter</text>
  <rect class="dense-for-vision-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dense-for-vision-name" x="526" y="122">It does not</text>
  <text class="dense-for-vision-desc" x="526" y="142">Real photographs.</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r0" x="526" y="182">Translation, rotation, scale variation</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r1" x="526" y="216">Large images — parameters explode</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r2" x="526" y="250">Objects anywhere in the frame</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r3" x="526" y="284">A convolutional network shares weights</text>
  <text class="dense-for-vision-desc dense-for-vision-row dense-for-vision-r4" x="526" y="318">Which is exactly the invariance needed</text>
  <text class="dense-for-vision-sub" x="30" y="372">The parameter explosion is the practical barrier: a 224 by 224 colour image flattened into a dense first layer needs tens of millions of parameters before the network has learned anything.</text>
</svg>
