<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Each looking for one thing.">
  <title>A panel of handwriting analysts</title>
  <style>
    .analysts-bg   { fill: #f8fafc; }
    .analysts-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analysts-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analysts-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analysts-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analysts-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .analysts-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .analysts-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .analysts-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .analysts-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .analysts-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .analysts-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .analysts-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .analysts-row { opacity: 1; }
    .analysts-r0 { animation-delay: 0.00s; }
    .analysts-r1 { animation-delay: 0.45s; }
    .analysts-r2 { animation-delay: 0.90s; }
    .analysts-r3 { animation-delay: 1.35s; }
    .analysts-r4 { animation-delay: 1.80s; }
    .analysts-row { animation: analysts-reveal 7.3s ease-in-out infinite; }
    @keyframes analysts-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="analysts-bg" width="980" height="390"/>
  <text class="analysts-h1"  x="30" y="40">A panel of handwriting analysts</text>
  <text class="analysts-sub" x="30" y="64">Each looking for one thing.</text>
  <rect class="analysts-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="analysts-name" x="46" y="122">One reader</text>
  <text class="analysts-desc" x="46" y="142">Judges the whole digit.</text>
  <text class="analysts-desc analysts-row analysts-r0" x="46" y="182">Looks at the image as a whole</text>
  <text class="analysts-desc analysts-row analysts-r1" x="46" y="216">Forms one overall impression</text>
  <text class="analysts-desc analysts-row analysts-r2" x="46" y="250">No decomposition of the decision</text>
  <text class="analysts-desc analysts-row analysts-r3" x="46" y="284">Hard to improve systematically</text>
  <text class="analysts-desc analysts-row analysts-r4" x="46" y="318">This is a single linear model</text>
  <rect class="analysts-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="analysts-name" x="526" y="122">A panel of 128</text>
  <text class="analysts-desc" x="526" y="142">Each looks for one pattern.</text>
  <text class="analysts-desc analysts-row analysts-r0" x="526" y="182">One watches for a horizontal stroke</text>
  <text class="analysts-desc analysts-row analysts-r1" x="526" y="216">One for a closed loop</text>
  <text class="analysts-desc analysts-row analysts-r2" x="526" y="250">One for a diagonal</text>
  <text class="analysts-desc analysts-row analysts-r3" x="526" y="284">Their votes are combined by the output layer</text>
  <text class="analysts-desc analysts-row analysts-r4" x="526" y="318">This is the hidden layer</text>
  <text class="analysts-sub" x="30" y="372">The output layer's job in this picture is not to look at the image at all: it weighs 128 opinions about strokes and loops, which is a much easier problem than reading pixels.</text>
</svg>
