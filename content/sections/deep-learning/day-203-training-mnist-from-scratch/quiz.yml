questions:
  - question: 'Why are raw pixel values in MNIST (which range as unsigned 8-bit integers from 0 to 255) normalized by dividing by 255.0 to [0.0, 1.0] before feeding into the neural network?'
    options:
      - 'Normalization keeps input features in a small numerical range, preventing large pre-activation values Z^[1] that would saturate activations and cause numerical gradient instability'
      - 'To convert the images from color to black and white'
      - 'To compress the image file size on disk'
      - 'To make the image transparent'
    answer_index: 0
    explanation: 'Unscaled pixel inputs (up to 255) multiplied by weights would produce huge linear sums Z^[1], causing exploding gradients or saturation. Scaling to [0, 1] ensures stable, well-conditioned optimization.'
  - question: 'In the [784, 128, 10] MNIST network architecture, how many total trainable parameters (weights + biases) exist across both layers?'
    options:
      - '101,770 parameters (Layer 1: 128 * 784 = 100,352 weights + 128 biases; Layer 2: 10 * 128 = 1,280 weights + 10 biases)'
      - '784 parameters'
      - '10,000 parameters'
      - '1,000,000 parameters'
    answer_index: 0
    explanation: 'Layer 1 has 100,352 weights and 128 biases (100,480 total). Layer 2 has 1,280 weights and 10 biases (1,290 total). Sum = 100,480 + 1,290 = 101,770 parameters.'
  - question: 'What theoretical value is the initial cross-entropy loss expected to be on epoch 0 before training begins when weights are randomly initialized?'
    options:
      - 'Approximately ln(10) ~ 2.3026, because random weights assign equal 10% probability (0.10) to all 10 digit classes: -ln(0.10) = 2.3026'
      - '0.0000'
      - '100.00'
      - '1.0000'
    answer_index: 0
    explanation: 'Prior to learning, a symmetric classifier assigns uniform probability 1/K = 1/10 to each class. The initial loss is -ln(1/10) = ln(10) = 2.3026. Verifying this at epoch 0 is a standard sanity check.'
  - question: 'What do the 128 rows of the first-layer weight matrix W^[1] (each containing 784 numbers) represent visually when reshaped back into 28x28 images?'
    options:
      - 'They represent learned spatial feature detectors (receptive fields) that fire when specific visual patterns — like horizontal crossbars, loops, diagonals, or corners — appear in the input digit'
      - 'They represent corrupted noise images'
      - 'They represent JPEG compression artifacts'
      - 'They represent random Gaussian noise that never changes'
    answer_index: 0
    explanation: 'Each hidden neuron acts as a specialized template matcher: its 784 weights form a spatial filter tuned to detect specific pen stroke features across the 28x28 canvas.'
  - question: 'When analyzing the confusion matrix of a trained MNIST model, which pairs of digits are most commonly confused by the network, and why?'
    options:
      - 'Digits (4 and 9), (3 and 5), or (7 and 1), because human handwriting variations in these digit pairs share nearly identical pen stroke geometry'
      - 'Digits 0 and 1, because they look identical'
      - 'Digits 8 and 8'
      - 'No digits are ever confused'
    answer_index: 0
    explanation: 'Handwritten 4s with closed tops resemble 9s, and sloppy 7s resemble 1s. Inspecting these confusion clusters provides insight into dataset ambiguity.'
