visuals:
  - id: mnist-neural-network-architecture
    file: assets/mnist-neural-network-architecture.svg
    type: diagram
    title: MNIST Handwritten Digit Classification Network Architecture
    alt: MNIST handwritten digit classification pipeline showing 28x28 image flattening 784 input neurons 128 hidden ReLU units and 10 Softmax output probabilities
    description: Full architectural diagram of the two-layer pure NumPy MNIST classifier detailing input image normalization, 784-dimensional flattening, 128-neuron ReLU hidden layer, and 10-class Softmax probabilities.
  - id: mnist-training-loss-accuracy-curves
    file: assets/mnist-training-loss-accuracy-curves.svg
    type: diagram
    title: MNIST Training Loss Convergence and Accuracy Curves
    alt: MNIST neural network training curves showing cross entropy loss decay and validation accuracy reaching 96 percent across training epochs
    description: Empirical benchmark training trajectories showing cross-entropy loss decay from ln(10)=2.302 down to 0.145 and validation accuracy surpassing the 95% milestone.
