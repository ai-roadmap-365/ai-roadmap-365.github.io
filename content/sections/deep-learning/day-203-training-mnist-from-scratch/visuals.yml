visuals:
  - id: mnist-neural-network-architecture
    file: assets/mnist-neural-network-architecture.svg
    type: diagram
    title: MNIST Handwritten Digit Classification Network Architecture
    alt: MNIST handwritten digit classification pipeline showing 28x28 image flattening 784 input neurons 128 hidden ReLU units and 10 Softmax output probabilities
    description: Full architectural diagram of the two-layer pure NumPy MNIST classifier detailing input image normalization, 784-dimensional flattening, 128-neuron ReLU hidden layer, and 10-class Softmax probabilities.
  - id: mnist-training-loss-accuracy-curves
    file: assets/mnist-training-loss-accuracy-curves.svg
    type: diagram
    title: MNIST Training Loss Convergence and Accuracy Curves
    alt: MNIST neural network training curves showing cross entropy loss decay and validation accuracy reaching 96 percent across training epochs
    description: Empirical benchmark training trajectories showing cross-entropy loss decay from ln(10)=2.302 down to 0.145 and validation accuracy surpassing the 95% milestone.
  - id: mnist-pipeline
    file: assets/mnist-pipeline.svg
    type: diagram
    title: 'From pixels to a prediction'
    alt: 'Diagram: the five stages of a from-scratch MNIST training pipeline'
    description: 'A five-stage description of an MNIST pipeline covering normalisation, flattening, one-hot encoding, the network and the metrics.'
  - id: toy-or-real
    file: assets/toy-or-real.svg
    type: diagram
    title: 'Two features, or seven hundred'
    alt: 'Diagram: a two-dimensional toy dataset compared with a high-dimensional benchmark'
    description: 'A two-column comparison of synthetic two-feature datasets against a real high-dimensional benchmark.'
  - id: mnist-lineage
    file: assets/mnist-lineage.svg
    type: diagram
    title: 'Why MNIST mattered'
    alt: 'Diagram: the role of MNIST in establishing benchmark-driven progress'
    description: 'A three-stage progression of benchmark-driven machine learning from MNIST through its saturation to successor benchmarks.'
  - id: parameter-count
    file: assets/parameter-count.svg
    type: diagram
    title: 'Where the parameters are'
    alt: 'Diagram: the parameter distribution across a two-layer MNIST network'
    description: 'A four-stage description of parameter counts in a two-layer network covering each weight matrix, the biases and the resulting distribution.'
  - id: learned-filters
    file: assets/learned-filters.svg
    type: diagram
    title: 'What the first layer learned'
    alt: 'Diagram: how first-layer weights can be viewed as learned image filters'
    description: 'A four-stage description of visualising learned filters covering the weight row, the reshape, what appears and why it matters.'
  - id: analysts
    file: assets/analysts.svg
    type: diagram
    title: 'A panel of handwriting analysts'
    alt: 'Diagram: a panel of specialists as an analogy for a hidden layer'
    description: 'A two-column comparison of one generalist reader against a panel of specialists whose opinions are combined.'
  - id: mnist-results
    file: assets/mnist-results.svg
    type: diagram
    title: 'What the numbers say'
    alt: 'Diagram: the measured accuracy and cost of three MNIST architectures'
    description: 'A four-stage comparison of MNIST results across a dense NumPy network, a framework network and a convolutional network.'
  - id: mnist-implications
    file: assets/mnist-implications.svg
    type: diagram
    title: 'Three things this benchmark teaches'
    alt: 'Diagram: the error analysis, normalisation and generalisation lessons of MNIST'
    description: 'A three-stage description of MNIST lessons covering error analysis, input scaling and the limits of the benchmark.'
  - id: dense-for-vision
    file: assets/dense-for-vision.svg
    type: diagram
    title: 'When a dense network suits images'
    alt: 'Diagram: when a dense network is adequate for image data'
    description: 'A two-column comparison of image problems suited to dense networks against those requiring convolutional architectures.'
