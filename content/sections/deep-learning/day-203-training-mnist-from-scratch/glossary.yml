terms:
  - term: 'MNIST Benchmark'
    definition: 'The canonical machine learning dataset consisting of 70,000 28x28 grayscale images of handwritten digits from 0 to 9.'
  - term: 'Feature Flattening'
    definition: 'Transforming a multi-dimensional spatial grid (e.g., 28x28 pixels) into a 1D vector of length 784.'
  - term: 'Pixel Normalization'
    definition: 'Rescaling raw integer pixel intensities from [0, 255] to floating-point values in [0.0, 1.0].'
  - term: 'Receptive Field Filter'
    definition: 'Visualizing a neuron 784 weights as a 28x28 spatial image to observe the learned visual pattern it detects.'
  - term: 'Confusion Matrix'
    definition: 'A K x K contingency table recording actual versus predicted digit class frequencies to identify systematic classification errors.'
  - term: 'Two-Layer Multi-Layer Perceptron'
    definition: 'A neural network architecture with one hidden layer and one output layer, capable of learning non-linear classification boundaries.'
  - term: 'One-Hot Encoding'
    definition: 'Representing a categorical digit target k in {0..9} as a 10-dimensional binary vector with a 1 at index k and 0s elsewhere.'
  - term: 'Error Analysis'
    definition: 'The practice of manually inspecting misclassified samples to diagnose dataset noise, label ambiguity, or model blind spots.'
