learning_promise: 'Build, audit, and deploy your own production image classifier: collect and deduplicate raw visual data, fine-tune a modern pretrained backbone with data augmentation, construct an interactive Error-Case Gallery, inspect class confusion, and export production ONNX runtime artifacts.'
objectives:
  - 'Curate, structure, and deduplicate a custom multi-class image dataset using perceptual hashing (pHash).'
  - 'Fine-tune a pretrained vision backbone (ResNet/ConvNeXt) on custom domain images with two-stage optimization.'
  - 'Build an Error-Case Gallery script surfacing the top most confident model misclassifications.'
  - 'Perform a rigorous class confusion audit to distinguish model error from human ground-truth label noise.'
  - 'Export and validate the trained classifier to ONNX format with dynamic batching.'
