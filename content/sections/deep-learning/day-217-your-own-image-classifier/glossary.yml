terms:
  - term: 'Error-Case Gallery'
    definition: 'A visual audit report displaying the top most confident model misclassifications to diagnose failure modes.'
  - term: 'Perceptual Hash'
    definition: 'A visual fingerprint algorithm (pHash) that generates matching or near-matching hashes for visually identical images.'
  - term: 'Data-Centric AI'
    definition: 'The engineering paradigm of systematically engineering and cleaning dataset quality rather than solely tweaking model code.'
  - term: 'Label Noise'
    definition: 'Incorrect, ambiguous, or inconsistent ground-truth annotations present within training or validation datasets.'
  - term: 'ONNX Runtime'
    definition: 'A high-performance cross-platform inference engine for executing serialized Open Neural Network Exchange models.'
  - term: 'Stratified Split'
    definition: 'Partitioning a dataset into train/val/test sets such that each split preserves identical class proportion percentages.'
  - term: 'Dynamic Axes'
    definition: 'Configuring exported ONNX tensors to accept variable batch sizes or variable spatial image dimensions at runtime.'
  - term: 'Class Imbalance'
    definition: 'A dataset condition where certain categories contain orders of magnitude more samples than minority categories.'
