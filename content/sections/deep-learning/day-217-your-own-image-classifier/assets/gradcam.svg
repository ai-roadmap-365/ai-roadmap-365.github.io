<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Which distinguishes two very different models.">
  <title>Where the model looked</title>
  <style>
    .gradcam-bg   { fill: #f8fafc; }
    .gradcam-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradcam-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradcam-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradcam-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradcam-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradcam-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradcam-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradcam-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradcam-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradcam-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradcam-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradcam-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradcam-row { opacity: 1; }
    .gradcam-r0 { animation-delay: 0.00s; }
    .gradcam-r1 { animation-delay: 0.45s; }
    .gradcam-r2 { animation-delay: 0.90s; }
    .gradcam-r3 { animation-delay: 1.35s; }
    .gradcam-r4 { animation-delay: 1.80s; }
    .gradcam-row { animation: gradcam-reveal 7.3s ease-in-out infinite; }
    @keyframes gradcam-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gradcam-bg" width="980" height="390"/>
  <text class="gradcam-h1"  x="30" y="40">Where the model looked</text>
  <text class="gradcam-sub" x="30" y="64">Which distinguishes two very different models.</text>
  <rect class="gradcam-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gradcam-name" x="46" y="122">Attending to the object</text>
  <text class="gradcam-desc" x="46" y="142">What you hoped for.</text>
  <text class="gradcam-desc gradcam-row gradcam-r0" x="46" y="182">Attribution concentrated on the subject</text>
  <text class="gradcam-desc gradcam-row gradcam-r1" x="46" y="216">Consistent across examples of the class</text>
  <text class="gradcam-desc gradcam-row gradcam-r2" x="46" y="250">Survives a changed background</text>
  <text class="gradcam-desc gradcam-row gradcam-r3" x="46" y="284">The feature is the object</text>
  <text class="gradcam-desc gradcam-row gradcam-r4" x="46" y="318">Generalises</text>
  <rect class="gradcam-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gradcam-name" x="526" y="122">Attending to the background</text>
  <text class="gradcam-desc" x="526" y="142">A spurious correlation.</text>
  <text class="gradcam-desc gradcam-row gradcam-r0" x="526" y="182">Attribution on grass, or a watermark</text>
  <text class="gradcam-desc gradcam-row gradcam-r1" x="526" y="216">Correct predictions for the wrong reason</text>
  <text class="gradcam-desc gradcam-row gradcam-r2" x="526" y="250">Fails when the background changes</text>
  <text class="gradcam-desc gradcam-row gradcam-r3" x="526" y="284">High validation accuracy, brittle deployment</text>
  <text class="gradcam-desc gradcam-row gradcam-r4" x="526" y="318">And nothing in the metrics shows it</text>
  <text class="gradcam-sub" x="30" y="372">This is the diagnostic no aggregate metric provides: two models with identical validation accuracy can be attending to entirely different things, and only one of them will survive deployment.</text>
</svg>
