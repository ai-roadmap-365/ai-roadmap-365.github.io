<svg role="img" aria-label="End-to-end workflow lifecycle of a custom image classifier from data ingestion and augmentation to transfer fine-tuning error-case auditing and deployment" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Custom Image Classifier Engineering Lifecycle</title>
  <defs>
    <linearGradient id="bg217a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card217" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg217a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CUSTOM IMAGE CLASSIFIER ENGINEERING LIFECYCLE</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">From Data Harvesting and Curation to Transfer Learning, Error Auditing, and Production Export</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card217)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Stage 1: Data Curation -->
    <rect x="25" y="25" width="165" height="245" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="107" y="48" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">1. Data Curation</text>
    <rect x="35" y="65" width="145" height="190" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="107" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Folder Organization</text>
    <text x="107" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• ImageFolder directory</text>
    <text x="107" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Deduplication with pHash</text>
    <text x="107" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Corrupt image filtering</text>
    <text x="107" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• Stratified train/val split</text>
    <text x="107" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Class balance audit</text>
    <text x="107" y="235" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Clean Verified Data</text>

    <!-- Stage 2: Augmentation -->
    <rect x="205" y="25" width="165" height="245" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="287" y="48" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">2. Augmentation</text>
    <rect x="215" y="65" width="145" height="190" fill="#1e293b" stroke="#fbbf24" rx="4"/>
    <text x="287" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">v2 Stochastic Pipeline</text>
    <text x="287" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• RandomResizedCrop</text>
    <text x="287" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• ColorJitter &amp; AutoAugment</text>
    <text x="287" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• MixUp / CutMix blending</text>
    <text x="287" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• ImageNet Normalization</text>
    <text x="287" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Multi-worker DataLoaders</text>
    <text x="287" y="235" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Synthetic Manifold</text>

    <!-- Stage 3: Fine-Tuning -->
    <rect x="385" y="25" width="165" height="245" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="467" y="48" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">3. Fine-Tuning</text>
    <rect x="395" y="65" width="145" height="190" fill="#1e293b" stroke="#10b981" rx="4"/>
    <text x="467" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Transfer Engine</text>
    <text x="467" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Pretrained ResNet/ConvNeXt</text>
    <text x="467" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Phase 1: Frozen Head Warmup</text>
    <text x="467" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Phase 2: Differential LR</text>
    <text x="467" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• AMP FP16 + GradScaler</text>
    <text x="467" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Cosine Annealing Decay</text>
    <text x="467" y="235" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">Converged Weights</text>

    <!-- Stage 4: Error Audit & Deploy -->
    <rect x="565" y="25" width="170" height="245" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="650" y="48" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">4. Audit &amp; Deploy</text>
    <rect x="575" y="65" width="150" height="190" fill="#1e293b" stroke="#a855f7" rx="4"/>
    <text x="650" y="90" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">Diagnostics &amp; Export</text>
    <text x="650" y="115" fill="#cbd5e1" font-size="8" text-anchor="middle">• Error-Case Gallery</text>
    <text x="650" y="135" fill="#cbd5e1" font-size="8" text-anchor="middle">• Confusion Matrix Audit</text>
    <text x="650" y="155" fill="#cbd5e1" font-size="8" text-anchor="middle">• Temperature Calibration</text>
    <text x="650" y="175" fill="#cbd5e1" font-size="8" text-anchor="middle">• ONNX Runtime Export</text>
    <text x="650" y="195" fill="#cbd5e1" font-size="8" text-anchor="middle">• Latency &amp; Memory Benchmark</text>
    <text x="650" y="235" fill="#c084fc" font-size="8" font-weight="700" text-anchor="middle">Production Artifact</text>
  </g>
</svg>
