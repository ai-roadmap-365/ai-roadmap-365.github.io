questions:
  - question: 'What is an Error-Case Gallery in computer vision engineering, and why is it superior to relying solely on aggregate validation accuracy?'
    options:
      - 'A structured visual review of the validation samples that the model misclassified with the highest predicted confidence; it immediately reveals human annotation errors, optical glare artifacts, and poorly defined class boundaries that aggregate accuracy scores obscure'
      - 'A museum of deleted Python scripts'
      - 'A list of GPU hardware crashes'
      - 'A gallery of images where the model achieved 100% accuracy'
    answer_index: 0
    explanation: 'Surfacing the most confident false positives and false negatives exposes ground truth annotation errors, optical artifacts, and taxonomic overlap.'
  - question: 'How does Perceptual Hashing (pHash) detect duplicate or near-duplicate images during custom dataset curation?'
    options:
      - 'It computes a discrete cosine transform (DCT) of low-frequency image luminance, producing a compact 64-bit hash where small visual edits, compressions, or watermarks produce identical or low Hamming distance hashes'
      - 'It computes the MD5 checksum of the raw file bytes'
      - 'It counts the total number of pixels'
      - 'It checks the file name string'
    answer_index: 0
    explanation: 'Unlike cryptographic hashes (MD5/SHA256) where changing 1 pixel changes the entire hash, perceptual hashes (pHash) produce small Hamming distances for visually similar images.'
  - question: 'When fine-tuning a custom vision model, what does it mean if the model achieves 99% training accuracy but only 68% validation accuracy despite using transfer learning?'
    options:
      - 'Severe Overfitting: the model has memorized specific background textures or noise in the small training set; solution: increase data augmentation (MixUp/CutMix), increase dropout/weight decay, or freeze more backbone layers'
      - 'The learning rate is too low'
      - 'The model needs 1000 more layers'
      - 'The batch size is too large'
    answer_index: 0
    explanation: 'A large gap between training and validation accuracy is the definition of overfitting, remedied by regularization, augmentation, and parameter freezing.'
  - question: 'Why should you verify ONNX model exports with ONNX Runtime using sample inputs after exporting from PyTorch?'
    options:
      - 'To guarantee that dynamic operators, custom activation functions, and dimension shapes match PyTorch forward pass outputs within tight numerical tolerances before deploying to production'
      - 'To compress the image files on disk'
      - 'To re-train the model weights in C++'
      - 'To upload the model to social media'
    answer_index: 0
    explanation: 'Verifying ONNX Runtime numerical outputs against PyTorch ensures operator export fidelity and eliminates runtime crashes in production inference engines.'
  - question: 'What is the recommended directory structure for custom multi-class image datasets processed with PyTorch torchvision.datasets.ImageFolder?'
    options:
      - 'root/train/class_a/img1.jpg, root/train/class_b/img2.jpg, root/val/class_a/img3.jpg, root/val/class_b/img4.jpg'
      - 'All images dumped into a single root directory with text file mappings'
      - 'A single giant ZIP archive containing JSON metadata'
      - 'Images stored inside a SQLite binary database column'
    answer_index: 0
    explanation: 'ImageFolder standard expects subdirectories named after each class under separate train/val/test splits.'
