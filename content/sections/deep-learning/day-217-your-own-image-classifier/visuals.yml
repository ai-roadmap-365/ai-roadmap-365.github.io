visuals:
  - id: custom-image-classifier-lifecycle
    file: assets/custom-image-classifier-lifecycle.svg
    type: diagram
    title: 'Custom Image Classifier Engineering Lifecycle'
    alt: End-to-end workflow lifecycle of a custom image classifier from data ingestion and augmentation to transfer fine-tuning error-case auditing and deployment
    description: 'Engineering lifecycle of a custom vision classifier: data harvesting, deduplication, transfer fine-tuning, error-case gallery auditing, and ONNX deployment.'
  - id: error-case-gallery-diagnostic-flow
    file: assets/error-case-gallery-diagnostic-flow.svg
    type: diagram
    title: 'Error-Case Gallery Diagnostic and Failure Mode Taxonomy'
    alt: Error case gallery diagnostic workflow surfacing high confidence misclassifications ambiguous samples and dataset label noise
    description: 'Diagnostic workflow for surfacing and categorizing high-confidence vision failures into human label noise, optical occlusion, and taxonomic ambiguity.'
  - id: classifier-phases
    file: assets/classifier-phases.svg
    type: diagram
    title: 'Five phases'
    alt: 'Diagram: the five phases of building a custom image classifier'
    description: 'A five-stage description of a custom classifier project covering curation, fine-tuning, error analysis, export and monitoring.'
  - id: perceptual-hashing
    file: assets/perceptual-hashing.svg
    type: diagram
    title: 'Finding near-duplicates'
    alt: 'Diagram: how perceptual hashing detects near-duplicate images'
    description: 'A four-stage description of perceptual hashing covering downscaling, frequency analysis, the binary hash and Hamming distance comparison.'
  - id: error-gallery
    file: assets/error-gallery.svg
    type: diagram
    title: 'Three causes of confident errors'
    alt: 'Diagram: the three causes of high-confidence classification errors'
    description: 'A three-stage description of error gallery findings covering label noise, occlusion and taxonomic ambiguity.'
  - id: active-learning
    file: assets/active-learning.svg
    type: diagram
    title: 'Labelling what matters'
    alt: 'Diagram: uncertainty sampling compared with random sampling for labelling'
    description: 'A four-stage description of active learning covering random labelling, uncertainty scoring, targeted labelling and the resulting efficiency.'
  - id: gradcam
    file: assets/gradcam.svg
    type: diagram
    title: 'Where the model looked'
    alt: 'Diagram: a model attending to the object compared with one attending to the background'
    description: 'A two-column comparison of attribution maps showing correct and spurious model attention.'
  - id: label-noise
    file: assets/label-noise.svg
    type: diagram
    title: 'Finding mislabelled data automatically'
    alt: 'Diagram: how confident learning identifies probable label errors'
    description: 'A four-stage description of automated label noise detection covering annotator disagreement rates, cross-validated predictions, confident disagreement and review.'
  - id: coffee-sorter
    file: assets/coffee-sorter.svg
    type: diagram
    title: 'A bean sorting machine'
    alt: 'Diagram: a sorter calibrated on catalogue images compared with one calibrated on real product'
    description: 'A two-column comparison of calibrating a sorting machine on idealised samples against real production output.'
  - id: drift-monitoring
    file: assets/drift-monitoring.svg
    type: diagram
    title: 'Two kinds of drift'
    alt: 'Diagram: data drift compared with concept drift in a deployed vision model'
    description: 'A three-stage description of production drift covering data drift, concept drift and the monitoring response.'
  - id: custom-or-zeroshot
    file: assets/custom-or-zeroshot.svg
    type: diagram
    title: 'Custom model, or a prompted one'
    alt: 'Diagram: building a custom classifier compared with prompting a foundation model'
    description: 'A two-column comparison of training a custom classifier against using a zero-shot multimodal model.'
