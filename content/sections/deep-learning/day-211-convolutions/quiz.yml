questions:
  - question: 'What is the primary architectural advantage of a 2D Convolutional layer over a Fully Connected Linear layer when processing 2D image data?'
    options:
      - 'Convolutional layers only work on grayscale images'
      - 'Convolutional layers do not require activation functions'
      - 'Weight sharing and local connectivity'
      - 'Linear layers require GPU hardware while convolutions only run on CPU'
    answer_index: 2
    explanation: 'A fully connected layer on a 1000x1000 RGB image would require billions of parameters, ignoring spatial locality. Convolutions use small shared kernels (e.g. 3x3), enforcing local connectivity and translation equivariance.'
  - question: 'If an input feature map has dimensions (C_in=3, H=32, W=32), what is the spatial resolution of the output feature map after passing through a convolutional layer with Kernel=3, Stride=2, and Padding=1?'
    options:
      - '(C_out, 8, 8)'
      - '(C_out, 30, 30)'
      - '(C_out, 32, 32)'
      - '(C_out, 16, 16)'
    answer_index: 3
    explanation: 'Using H_out = floor((H_in - K + 2*P) / S) + 1: floor((32 - 3 + 2(1)) / 2) + 1 = floor(31 / 2) + 1 = 15 + 1 = 16.'
  - question: 'How many learnable weight parameters (excluding bias) are contained in a standard PyTorch nn.Conv2d(in_channels=64, out_channels=128, kernel_size=3)?'
    options:
      - '64 * 128 * 3 * 3 = 73,728'
      - '64 * 128 = 8,192'
      - '128 * 3 * 3 = 1,152'
      - '64 * 3 * 3 = 576'
    answer_index: 0
    explanation: 'Each of the 128 output channels requires a 3D kernel of shape (in_channels, kernel_height, kernel_width) = (64, 3, 3). Total weights = 128 * 64 * 3 * 3 = 73,728.'
  - question: 'What is the key difference between mathematical convolution and the cross-correlation operation implemented in PyTorch nn.Conv2d?'
    options:
      - 'Cross-correlation uses division instead of multiplication'
      - 'True convolution flips the kernel; PyTorch does not'
      - 'PyTorch convolution only works on 1D vectors'
      - 'Mathematical convolution cannot compute gradients'
    answer_index: 1
    explanation: 'True convolution flips the filter kernel by 180 degrees. Deep learning libraries implement cross-correlation without flipping for efficiency; the learned weights simply adapt to the un-flipped orientation.'
  - question: 'What property describes how a convolutional feature map shifts predictably when the input image is translated spatially?'
    options:
      - 'Scale Invariance'
      - 'Translation Invariance'
      - 'Translation equivariance'
      - 'Rotational Symmetry'
    answer_index: 2
    explanation: 'Convolutions are equivariant to translation: translating an input shifts its feature map activations identically. Pooling layers and deep classification heads subsequently introduce translation invariance.'
