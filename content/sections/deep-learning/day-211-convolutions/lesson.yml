learning_promise: 'Master the fundamental mechanics of 2D convolutions in computer vision: derive spatial weight sharing, sliding kernel cross-correlation, padding and stride arithmetic, multi-channel feature maps, Sobel edge detectors, and PyTorch nn.Conv2d implementation.'
objectives:
  - 'Derive 2D convolution and cross-correlation mathematically from first principles.'
  - 'Calculate output spatial dimensions using the canonical formula for arbitrary input sizes, kernel dimensions, padding, and stride.'
  - 'Explain how weight sharing and translation equivariance reduce parameter counts compared to fully connected layers.'
  - 'Implement multi-channel 2D convolution from scratch in pure NumPy and verify equivalence with PyTorch nn.Conv2d.'
  - 'Apply classical spatial filter kernels (Sobel, Gaussian blur, Laplacian edge detection) to image tensors.'
