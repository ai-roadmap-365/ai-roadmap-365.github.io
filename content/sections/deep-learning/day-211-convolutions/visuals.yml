visuals:
  - id: convolution-kernel-sliding-window
    file: assets/convolution-kernel-sliding-window.svg
    type: diagram
    title: 2D Convolution Kernel Sliding Window and Feature Map Extraction
    alt: 2D Convolution operation showing sliding 3x3 kernel over 5x5 input feature map computing dot product and generating output feature map
    description: Visual decomposition of the 2D cross-correlation sliding window operation, mapping an input tensor patch through a learned filter kernel to produce an element in the output feature map.
  - id: padding-and-stride-spatial-effects
    file: assets/padding-and-stride-spatial-effects.svg
    type: diagram
    title: Convolution Padding and Stride Spatial Transformations
    alt: Padding and Stride effects on feature map spatial resolution showing valid padding, same padding, and downsampling with stride 2
    description: Comparative analysis of spatial transformations contrasting valid padding (P=0), same padding (P=1), and strided downsampling (S=2) on feature map resolution.
