visuals:
  - id: convolution-kernel-sliding-window
    file: assets/convolution-kernel-sliding-window.svg
    type: diagram
    title: 2D Convolution Kernel Sliding Window and Feature Map Extraction
    alt: 2D Convolution operation showing sliding 3x3 kernel over 5x5 input feature map computing dot product and generating output feature map
    description: Visual decomposition of the 2D cross-correlation sliding window operation, mapping an input tensor patch through a learned filter kernel to produce an element in the output feature map.
  - id: padding-and-stride-spatial-effects
    file: assets/padding-and-stride-spatial-effects.svg
    type: diagram
    title: Convolution Padding and Stride Spatial Transformations
    alt: Padding and Stride effects on feature map spatial resolution showing valid padding, same padding, and downsampling with stride 2
    description: Comparative analysis of spatial transformations contrasting valid padding (P=0), same padding (P=1), and strided downsampling (S=2) on feature map resolution.
  - id: conv-assumptions
    file: assets/conv-assumptions.svg
    type: diagram
    title: 'Three assumptions convolution encodes'
    alt: 'Diagram: the three assumptions a convolution makes about image data'
    description: 'A three-stage description of the assumptions built into convolution covering locality, weight sharing and translation equivariance.'
  - id: dense-or-conv
    file: assets/dense-or-conv.svg
    type: diagram
    title: 'A dense layer, or a convolution'
    alt: 'Diagram: a dense layer compared with a convolutional layer on image input'
    description: 'A two-column comparison of dense and convolutional layers on image data by parameter count and inductive bias.'
  - id: conv-lineage
    file: assets/conv-lineage.svg
    type: diagram
    title: 'Where convolution came from'
    alt: 'Diagram: the progression from receptive fields to learned convolutional filters'
    description: 'A three-stage progression from biological receptive fields through hand-designed filters to learned convolution kernels.'
  - id: conv-or-correlation
    file: assets/conv-or-correlation.svg
    type: diagram
    title: 'Convolution, or cross-correlation'
    alt: 'Diagram: mathematical convolution compared with the cross-correlation frameworks implement'
    description: 'A two-column comparison of formal convolution against the cross-correlation implemented in deep learning frameworks.'
  - id: spatial-arithmetic
    file: assets/spatial-arithmetic.svg
    type: diagram
    title: 'Output size arithmetic'
    alt: 'Diagram: how kernel size, padding and stride determine output spatial dimensions'
    description: 'A four-stage description of convolution output size covering the base shrinkage, padding, stride and the common conventions.'
  - id: conv-variants
    file: assets/conv-variants.svg
    type: diagram
    title: 'Three convolution variants'
    alt: 'Diagram: standard, depthwise separable and transposed convolutions compared'
    description: 'A three-stage description of convolution variants covering standard convolution, depthwise separable convolution and transposed convolution.'
  - id: cookie-cutter
    file: assets/cookie-cutter.svg
    type: diagram
    title: 'A cookie cutter on dough'
    alt: 'Diagram: one stamp applied across a surface as an analogy for weight sharing'
    description: 'A two-column comparison of one reusable stamp against a separate tool per position.'
  - id: conv-implications
    file: assets/conv-implications.svg
    type: diagram
    title: 'Four consequences of convolution'
    alt: 'Diagram: the parameter, compute, memory and inductive bias implications of convolution'
    description: 'A four-stage description of convolution implications covering parameter efficiency, compute cost, activation memory and inductive bias.'
  - id: conv-when
    file: assets/conv-when.svg
    type: diagram
    title: 'Where convolution belongs'
    alt: 'Diagram: when convolution is the right operation'
    description: 'A two-column comparison of data types suited to convolution against those where its assumptions do not hold.'
  - id: conv-bottlenecks
    file: assets/conv-bottlenecks.svg
    type: diagram
    title: 'Three bottlenecks convolution removes'
    alt: 'Diagram: the three limitations of dense layers on images that convolution addresses'
    description: 'A three-stage description of dense-layer limitations covering parameter explosion, lost spatial structure and position dependence.'
