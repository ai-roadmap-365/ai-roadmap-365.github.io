<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="On the same image.">
  <title>A dense layer, or a convolution</title>
  <style>
    .dense-or-conv-bg   { fill: #f8fafc; }
    .dense-or-conv-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-conv-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-conv-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-conv-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-conv-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dense-or-conv-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-or-conv-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dense-or-conv-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dense-or-conv-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dense-or-conv-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dense-or-conv-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dense-or-conv-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dense-or-conv-row { opacity: 1; }
    .dense-or-conv-r0 { animation-delay: 0.00s; }
    .dense-or-conv-r1 { animation-delay: 0.45s; }
    .dense-or-conv-r2 { animation-delay: 0.90s; }
    .dense-or-conv-r3 { animation-delay: 1.35s; }
    .dense-or-conv-r4 { animation-delay: 1.80s; }
    .dense-or-conv-row { animation: dense-or-conv-reveal 7.3s ease-in-out infinite; }
    @keyframes dense-or-conv-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="dense-or-conv-bg" width="980" height="390"/>
  <text class="dense-or-conv-h1"  x="30" y="40">A dense layer, or a convolution</text>
  <text class="dense-or-conv-sub" x="30" y="64">On the same image.</text>
  <rect class="dense-or-conv-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="dense-or-conv-name" x="46" y="122">Dense</text>
  <text class="dense-or-conv-desc" x="46" y="142">Every pixel to every unit.</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r0" x="46" y="182">A separate weight per pixel position</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r1" x="46" y="216">Millions of parameters for a small image</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r2" x="46" y="250">No notion of adjacency</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r3" x="46" y="284">A shifted object is a different input</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r4" x="46" y="318">Must learn each position independently</text>
  <rect class="dense-or-conv-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="dense-or-conv-name" x="526" y="122">Convolutional</text>
  <text class="dense-or-conv-desc" x="526" y="142">One kernel, every position.</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r0" x="526" y="182">Nine weights for a 3x3 kernel</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r1" x="526" y="216">Independent of image size</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r2" x="526" y="250">Adjacency is built in</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r3" x="526" y="284">A shifted object shifts the response</text>
  <text class="dense-or-conv-desc dense-or-conv-row dense-or-conv-r4" x="526" y="318">Learned once, applied everywhere</text>
  <text class="dense-or-conv-sub" x="30" y="372">The parameter independence from image size is what makes convolution scale: a dense first layer on a large photograph needs tens of millions of weights before learning anything.</text>
</svg>
