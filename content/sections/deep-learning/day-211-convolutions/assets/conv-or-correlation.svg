<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And why it does not matter.">
  <title>Convolution, or cross-correlation</title>
  <style>
    .conv-or-correlation-bg   { fill: #f8fafc; }
    .conv-or-correlation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-or-correlation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-or-correlation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-or-correlation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-or-correlation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-or-correlation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-or-correlation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-or-correlation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-or-correlation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-or-correlation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-or-correlation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-or-correlation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-or-correlation-row { opacity: 1; }
    .conv-or-correlation-r0 { animation-delay: 0.00s; }
    .conv-or-correlation-r1 { animation-delay: 0.45s; }
    .conv-or-correlation-r2 { animation-delay: 0.90s; }
    .conv-or-correlation-r3 { animation-delay: 1.35s; }
    .conv-or-correlation-r4 { animation-delay: 1.80s; }
    .conv-or-correlation-row { animation: conv-or-correlation-reveal 7.3s ease-in-out infinite; }
    @keyframes conv-or-correlation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="conv-or-correlation-bg" width="980" height="390"/>
  <text class="conv-or-correlation-h1"  x="30" y="40">Convolution, or cross-correlation</text>
  <text class="conv-or-correlation-sub" x="30" y="64">And why it does not matter.</text>
  <rect class="conv-or-correlation-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="conv-or-correlation-name" x="46" y="122">Formal convolution</text>
  <text class="conv-or-correlation-desc" x="46" y="142">The kernel is flipped.</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r0" x="46" y="182">Rotate the kernel 180 degrees first</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r1" x="46" y="216">Then compute the dot product</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r2" x="46" y="250">Required for signal-processing identities</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r3" x="46" y="284">Associativity and the convolution theorem</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r4" x="46" y="318">Matters when the kernel is given</text>
  <rect class="conv-or-correlation-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="conv-or-correlation-name" x="526" y="122">What frameworks do</text>
  <text class="conv-or-correlation-desc" x="526" y="142">No flip.</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r0" x="526" y="182">Slide and dot product, unflipped</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r1" x="526" y="216">Called convolution by convention</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r2" x="526" y="250">The kernel is learned, not given</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r3" x="526" y="284">So it learns the unflipped orientation</text>
  <text class="conv-or-correlation-desc conv-or-correlation-row conv-or-correlation-r4" x="526" y="318">Identical results, different bookkeeping</text>
  <text class="conv-or-correlation-sub" x="30" y="372">The distinction is worth knowing to avoid confusion when reading signal-processing literature, and it has no consequence for training: an optimiser learns whichever orientation the implementation uses.</text>
</svg>
