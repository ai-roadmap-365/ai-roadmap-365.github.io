<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same shape, everywhere.">
  <title>A cookie cutter on dough</title>
  <style>
    .cookie-cutter-bg   { fill: #f8fafc; }
    .cookie-cutter-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-cutter-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-cutter-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-cutter-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-cutter-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cookie-cutter-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cookie-cutter-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cookie-cutter-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cookie-cutter-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cookie-cutter-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cookie-cutter-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cookie-cutter-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cookie-cutter-row { opacity: 1; }
    .cookie-cutter-r0 { animation-delay: 0.00s; }
    .cookie-cutter-r1 { animation-delay: 0.45s; }
    .cookie-cutter-r2 { animation-delay: 0.90s; }
    .cookie-cutter-r3 { animation-delay: 1.35s; }
    .cookie-cutter-r4 { animation-delay: 1.80s; }
    .cookie-cutter-row { animation: cookie-cutter-reveal 7.3s ease-in-out infinite; }
    @keyframes cookie-cutter-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cookie-cutter-bg" width="980" height="390"/>
  <text class="cookie-cutter-h1"  x="30" y="40">A cookie cutter on dough</text>
  <text class="cookie-cutter-sub" x="30" y="64">The same shape, everywhere.</text>
  <rect class="cookie-cutter-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cookie-cutter-name" x="46" y="122">One cutter</text>
  <text class="cookie-cutter-desc" x="46" y="142">Reused across the sheet.</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r0" x="46" y="182">The same shape, stamped anywhere</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r1" x="46" y="216">One tool to make and maintain</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r2" x="46" y="250">Works wherever the dough is</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r3" x="46" y="284">Position is irrelevant to the shape</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r4" x="46" y="318">This is a shared kernel</text>
  <rect class="cookie-cutter-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cookie-cutter-name" x="526" y="122">A tool per position</text>
  <text class="cookie-cutter-desc" x="526" y="142">Absurd, and what a dense layer does.</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r0" x="526" y="182">A separate cutter for each spot</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r1" x="526" y="216">Each learned independently</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r2" x="526" y="250">A shape learned at one spot is useless at another</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r3" x="526" y="284">Enormously more to make</text>
  <text class="cookie-cutter-desc cookie-cutter-row cookie-cutter-r4" x="526" y="318">This is a dense layer on pixels</text>
  <text class="cookie-cutter-sub" x="30" y="372">The absurdity of the right-hand column is the point: a dense layer must learn to recognise a vertical edge separately at every position it might appear.</text>
</svg>
