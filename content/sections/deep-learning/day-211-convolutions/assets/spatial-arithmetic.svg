<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three parameters decide it.">
  <title>Output size arithmetic</title>
  <style>
    .spatial-arithmetic-bg   { fill: #f8fafc; }
    .spatial-arithmetic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-arithmetic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-arithmetic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-arithmetic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-arithmetic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .spatial-arithmetic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .spatial-arithmetic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .spatial-arithmetic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .spatial-arithmetic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .spatial-arithmetic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .spatial-arithmetic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .spatial-arithmetic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .spatial-arithmetic-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .spatial-arithmetic-stage { opacity: 1; }

    .spatial-arithmetic-s0 { animation-delay: 0.00s; }
    .spatial-arithmetic-e0 { animation-delay: 0.00s; }
    .spatial-arithmetic-s1 { animation-delay: 1.28s; }
    .spatial-arithmetic-e1 { animation-delay: 1.28s; }
    .spatial-arithmetic-s2 { animation-delay: 2.56s; }
    .spatial-arithmetic-e2 { animation-delay: 2.56s; }
    .spatial-arithmetic-s3 { animation-delay: 3.84s; }
    .spatial-arithmetic-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .spatial-arithmetic-conn  { animation: spatial-arithmetic-trace 6.4s ease-in-out infinite; }
      .spatial-arithmetic-stage { animation: spatial-arithmetic-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes spatial-arithmetic-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes spatial-arithmetic-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .spatial-arithmetic-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .spatial-arithmetic-stage { animation: spatial-arithmetic-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes spatial-arithmetic-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="spatial-arithmetic-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="spatial-arithmetic-bg" width="980" height="322"/>
  <text class="spatial-arithmetic-h1"  x="30" y="40">Output size arithmetic</text>
  <text class="spatial-arithmetic-sub" x="30" y="64">Three parameters decide it.</text>
  <g class="spatial-arithmetic-stage spatial-arithmetic-s0">
    <rect class="spatial-arithmetic-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="spatial-arithmetic-step" x="44" y="142">01</text>
    <text class="spatial-arithmetic-name" x="70" y="142">Without padding, the output shrinks</text>
    <text class="spatial-arithmetic-desc" x="44" y="166">By the kernel size minus one,</text>
    <text class="spatial-arithmetic-desc" x="44" y="182">per dimension.</text>
  </g>
  <line class="spatial-arithmetic-line spatial-arithmetic-conn spatial-arithmetic-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#spatial-arithmetic-tip)"/>
  <g class="spatial-arithmetic-stage spatial-arithmetic-s1">
    <rect class="spatial-arithmetic-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="spatial-arithmetic-step" x="280" y="142">02</text>
    <text class="spatial-arithmetic-name" x="306" y="142">Padding restores it</text>
    <text class="spatial-arithmetic-desc" x="280" y="166">Half the kernel size on each</text>
    <text class="spatial-arithmetic-desc" x="280" y="182">side keeps dimensions equal.</text>
    <text class="spatial-arithmetic-edge" x="280" y="242">same</text>
  </g>
  <line class="spatial-arithmetic-line spatial-arithmetic-conn spatial-arithmetic-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#spatial-arithmetic-tip)"/>
  <g class="spatial-arithmetic-stage spatial-arithmetic-s2">
    <rect class="spatial-arithmetic-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="spatial-arithmetic-step" x="516" y="142">03</text>
    <text class="spatial-arithmetic-name" x="542" y="142">Stride downsamples</text>
    <text class="spatial-arithmetic-desc" x="516" y="166">A step of two halves the</text>
    <text class="spatial-arithmetic-desc" x="516" y="182">resolution.</text>
    <text class="spatial-arithmetic-edge" x="516" y="242">halved</text>
  </g>
  <line class="spatial-arithmetic-line spatial-arithmetic-conn spatial-arithmetic-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#spatial-arithmetic-tip)"/>
  <g class="spatial-arithmetic-stage spatial-arithmetic-s3">
    <rect class="spatial-arithmetic-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="spatial-arithmetic-step" x="752" y="142">04</text>
    <text class="spatial-arithmetic-name" x="778" y="142">Which is how depth reduces resolution</text>
    <text class="spatial-arithmetic-desc" x="752" y="166">Resolution falls while channel</text>
    <text class="spatial-arithmetic-desc" x="752" y="182">count rises.</text>
  </g>
  <text class="spatial-arithmetic-sub" x="30" y="304">The trade of spatial resolution for channel depth is the standard shape of a convolutional network: each stage sees a larger region of the original image through fewer, richer positions.</text>
</svg>
