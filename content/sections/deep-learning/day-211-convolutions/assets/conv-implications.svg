<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Parameters, compute, memory and bias.">
  <title>Four consequences of convolution</title>
  <style>
    .conv-implications-bg   { fill: #f8fafc; }
    .conv-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conv-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conv-implications-stage { opacity: 1; }

    .conv-implications-s0 { animation-delay: 0.00s; }
    .conv-implications-e0 { animation-delay: 0.00s; }
    .conv-implications-s1 { animation-delay: 1.28s; }
    .conv-implications-e1 { animation-delay: 1.28s; }
    .conv-implications-s2 { animation-delay: 2.56s; }
    .conv-implications-e2 { animation-delay: 2.56s; }
    .conv-implications-s3 { animation-delay: 3.84s; }
    .conv-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .conv-implications-conn  { animation: conv-implications-trace 6.4s ease-in-out infinite; }
      .conv-implications-stage { animation: conv-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes conv-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conv-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conv-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conv-implications-stage { animation: conv-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conv-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conv-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conv-implications-bg" width="980" height="322"/>
  <text class="conv-implications-h1"  x="30" y="40">Four consequences of convolution</text>
  <text class="conv-implications-sub" x="30" y="64">Parameters, compute, memory and bias.</text>
  <g class="conv-implications-stage conv-implications-s0">
    <rect class="conv-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="conv-implications-step" x="44" y="142">01</text>
    <text class="conv-implications-name" x="70" y="142">Parameters are independent of input size</text>
    <text class="conv-implications-desc" x="44" y="166">A kernel is the same size for</text>
    <text class="conv-implications-desc" x="44" y="182">any image.</text>
  </g>
  <line class="conv-implications-line conv-implications-conn conv-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#conv-implications-tip)"/>
  <g class="conv-implications-stage conv-implications-s1">
    <rect class="conv-implications-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="conv-implications-step" x="280" y="142">02</text>
    <text class="conv-implications-name" x="306" y="142">Compute is not</text>
    <text class="conv-implications-desc" x="280" y="166">Multiply-accumulates scale with</text>
    <text class="conv-implications-desc" x="280" y="182">the output area times channels.</text>
  </g>
  <line class="conv-implications-line conv-implications-conn conv-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#conv-implications-tip)"/>
  <g class="conv-implications-stage conv-implications-s2">
    <rect class="conv-implications-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="conv-implications-step" x="516" y="142">03</text>
    <text class="conv-implications-name" x="542" y="142">Activation memory dominates</text>
    <text class="conv-implications-desc" x="516" y="166">Early layers hold</text>
    <text class="conv-implications-desc" x="516" y="182">full-resolution feature maps</text>
    <text class="conv-implications-desc" x="516" y="198">across many channels.</text>
  </g>
  <line class="conv-implications-line conv-implications-conn conv-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#conv-implications-tip)"/>
  <g class="conv-implications-stage conv-implications-s3">
    <rect class="conv-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="conv-implications-step" x="752" y="142">04</text>
    <text class="conv-implications-name" x="778" y="142">The inductive bias helps and constrains</text>
    <text class="conv-implications-desc" x="752" y="166">Excellent on images; wrong on</text>
    <text class="conv-implications-desc" x="752" y="182">tabular data.</text>
  </g>
  <text class="conv-implications-sub" x="30" y="304">The compute point catches people out: convolutions are parameter-efficient and not compute-efficient, and an early layer at full resolution can dominate a network's total operations.</text>
</svg>
