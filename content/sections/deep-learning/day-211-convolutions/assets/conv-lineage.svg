<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Biology, then classical vision, then learning.">
  <title>Where convolution came from</title>
  <style>
    .conv-lineage-bg   { fill: #f8fafc; }
    .conv-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .conv-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .conv-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .conv-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .conv-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .conv-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .conv-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .conv-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .conv-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .conv-lineage-stage { opacity: 1; }

    .conv-lineage-s0 { animation-delay: 0.00s; }
    .conv-lineage-e0 { animation-delay: 0.00s; }
    .conv-lineage-s1 { animation-delay: 1.50s; }
    .conv-lineage-e1 { animation-delay: 1.50s; }
    .conv-lineage-s2 { animation-delay: 3.00s; }
    .conv-lineage-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .conv-lineage-conn  { animation: conv-lineage-trace 6s ease-in-out infinite; }
      .conv-lineage-stage { animation: conv-lineage-arrive 6s ease-in-out infinite; }
    }
    @keyframes conv-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes conv-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .conv-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .conv-lineage-stage { animation: conv-lineage-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes conv-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="conv-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="conv-lineage-bg" width="980" height="322"/>
  <text class="conv-lineage-h1"  x="30" y="40">Where convolution came from</text>
  <text class="conv-lineage-sub" x="30" y="64">Biology, then classical vision, then learning.</text>
  <g class="conv-lineage-stage conv-lineage-s0">
    <rect class="conv-lineage-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="conv-lineage-step" x="44" y="142">01</text>
    <text class="conv-lineage-name" x="70" y="142">Biological receptive fields</text>
    <text class="conv-lineage-desc" x="44" y="166">Visual cortex neurons responding to oriented</text>
    <text class="conv-lineage-desc" x="44" y="182">edges in small regions.</text>
  </g>
  <line class="conv-lineage-line conv-lineage-conn conv-lineage-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#conv-lineage-tip)"/>
  <g class="conv-lineage-stage conv-lineage-s1">
    <rect class="conv-lineage-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="conv-lineage-step" x="359" y="142">02</text>
    <text class="conv-lineage-name" x="385" y="142">Hand-designed filters</text>
    <text class="conv-lineage-desc" x="359" y="166">Edge detectors and blurs, engineered</text>
    <text class="conv-lineage-desc" x="359" y="182">deliberately for decades.</text>
    <text class="conv-lineage-edge" x="359" y="242">specified</text>
  </g>
  <line class="conv-lineage-line conv-lineage-conn conv-lineage-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#conv-lineage-tip)"/>
  <g class="conv-lineage-stage conv-lineage-s2">
    <rect class="conv-lineage-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="conv-lineage-step" x="674" y="142">03</text>
    <text class="conv-lineage-name" x="700" y="142">Learned kernels</text>
    <text class="conv-lineage-desc" x="674" y="166">The same filters emerging from gradient</text>
    <text class="conv-lineage-desc" x="674" y="182">descent, unprompted.</text>
  </g>
  <text class="conv-lineage-sub" x="30" y="304">The third step is the one worth dwelling on: decades of hand-engineered feature design turned out to be recoverable by an optimiser given enough labelled data.</text>
</svg>
