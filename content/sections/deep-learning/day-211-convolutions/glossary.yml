terms:
  - term: 'Convolution'
    definition: 'A mathematical operation on two functions producing a third function expressing how the shape of one is modified by the other.'
  - term: 'Kernel'
    definition: 'A small matrix of learnable weights (e.g. 3x3) that slides over an input tensor to extract local spatial features.'
  - term: 'Feature Map'
    definition: 'The 2D output tensor generated by convolving a specific filter kernel across an input feature volume.'
  - term: 'Stride'
    definition: 'The step size (in pixels) by which the convolution kernel moves across the input spatial dimensions.'
  - term: 'Padding'
    definition: 'Adding extra border pixels (typically zeros) around the input tensor perimeter to control output spatial resolution.'
  - term: 'Receptive Field'
    definition: 'The specific spatial region in the input image that directly influences the activation of a particular neuron in a feature map.'
  - term: 'Translation Equivariance'
    definition: 'A mathematical property where transforming an input shifts the resulting output representation by the exact same transformation.'
  - term: 'Sobel Filter'
    definition: 'A classical discrete differentiation filter kernel used to compute horizontal or vertical image gradient approximations.'
