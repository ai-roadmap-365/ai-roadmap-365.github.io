terms:
  - term: 'Experiment Tracking'
    definition: 'The systematic recording of code versions, datasets, hyperparameters, training metrics, hardware telemetry, and model artifacts across training runs.'
  - term: 'Lineage'
    definition: 'The complete provenance graph linking a trained model artifact back to the exact code commit, training script, hyperparameters, and dataset version that created it.'
  - term: 'JSONL (JSON Lines)'
    definition: 'A structured text file format where each line is a self-contained, valid JSON object, enabling crash-safe atomic logging.'
  - term: 'Weights & Biases (W&B)'
    definition: 'An enterprise MLOps platform for experiment tracking, dashboard visualization, hyperparameter sweeps, and artifact management.'
  - term: 'MLflow'
    definition: 'An open-source machine learning lifecycle platform featuring tracking, project packaging, model serving, and a central model registry.'
  - term: 'Hyperparameter Sweep'
    definition: 'An automated search process evaluating multiple hyperparameter combinations across a predefined search space to optimize a target validation metric.'
  - term: 'Hyperband'
    definition: 'An adaptive hyperparameter optimization algorithm combining random exploration with principled early stopping via successive halving.'
  - term: 'Model Registry'
    definition: 'A centralized catalog for storing, staging, versioning, and deploying trained neural network model weights with metadata.'
