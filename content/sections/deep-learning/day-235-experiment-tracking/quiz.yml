questions:
  - question: 'What are the 5 foundational metadata elements required to guarantee 100% scientific reproducibility of a deep learning training run?'
    options:
      - '1. Exact Git commit SHA (with uncommitted diffs), 2. Exact Dataset version/hash (DVC/manifest), 3. Complete environment specification (pip freeze/Docker image), 4. Exhaustive hyperparameter config dictionary, 5. Deterministic random seeds across Python, NumPy, and PyTorch'
      - 'Only the model weights file'
      - 'The computer username and wallpaper'
      - 'The time of day the training started'
    answer_index: 0
    explanation: 'Reproducibility requires capturing the exact code commit, dataset hash, environment lockfile, hyperparameter configuration, and random seeds.'
  - question: 'Why is logging experiment metrics to structured JSON Lines (JSONL) files superior to printing raw strings to standard output or CSV files?'
    options:
      - 'JSONL allows atomic appending of semi-structured dictionaries on every step without corrupting the file on training crash, supports nested metrics and metadata, and is easily ingested by distributed log aggregators'
      - 'JSONL compresses files into audio'
      - 'JSONL disables backpropagation'
      - 'CSV files cannot store numbers'
    answer_index: 0
    explanation: 'JSONL provides crash-safe line-by-line atomic appending of flexible schema dictionaries.'
  - question: 'What is the primary advantage of Bayesian Hyperparameter Optimization over brute-force Grid Search?'
    options:
      - 'Bayesian optimization builds a probabilistic surrogate model (e.g. Gaussian Process) of the objective function, using past trial results to intelligently sample the most promising unseen hyperparameter regions rather than wasting compute evaluating unpromising combinations'
      - 'Bayesian optimization tries every single number from 1 to 1,000,000'
      - 'Bayesian optimization runs without a CPU'
      - 'Grid search is illegal in deep learning'
    answer_index: 0
    explanation: 'Bayesian optimization uses prior trial history to guide intelligent exploration toward the global minimum.'
  - question: 'How does the Hyperband algorithm accelerate hyperparameter sweeps?'
    options:
      - 'It dynamically allocates compute by training many candidate configurations for a few initial epochs, terminating the worst-performing 50-75% early (Successive Halving), and allocating more training epochs only to top-performing models'
      - 'It doubles the learning rate on every epoch'
      - 'It compresses the dataset text'
      - 'It deletes failed runs from git'
    answer_index: 0
    explanation: 'Hyperband uses Successive Halving to terminate unpromising runs early and focus compute on top configurations.'
  - question: 'What is a Model Artifact Registry and why is it necessary in production MLOps?'
    options:
      - 'A centralized, version-controlled repository storing trained model weights alongside their exact evaluation metrics, tokenizer configs, license metadata, and lineage links to the training run that generated them'
      - 'A list of GPU serial numbers'
      - 'A folder on a personal laptop desktop'
      - 'A software license agreement'
    answer_index: 0
    explanation: 'A model registry provides immutable versioning, lineage tracking, and deployment governance for trained models.'
