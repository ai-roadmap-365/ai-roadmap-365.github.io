<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Where a checkpoint becomes a release.">
  <title>The model registry</title>
  <style>
    .registry-bg   { fill: #f8fafc; }
    .registry-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .registry-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .registry-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .registry-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .registry-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .registry-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .registry-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .registry-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .registry-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .registry-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .registry-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .registry-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .registry-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .registry-stage { opacity: 1; }

    .registry-s0 { animation-delay: 0.00s; }
    .registry-e0 { animation-delay: 0.00s; }
    .registry-s1 { animation-delay: 1.28s; }
    .registry-e1 { animation-delay: 1.28s; }
    .registry-s2 { animation-delay: 2.56s; }
    .registry-e2 { animation-delay: 2.56s; }
    .registry-s3 { animation-delay: 3.84s; }
    .registry-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .registry-conn  { animation: registry-trace 6.4s ease-in-out infinite; }
      .registry-stage { animation: registry-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes registry-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes registry-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .registry-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .registry-stage { animation: registry-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes registry-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="registry-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="registry-bg" width="980" height="322"/>
  <text class="registry-h1"  x="30" y="40">The model registry</text>
  <text class="registry-sub" x="30" y="64">Where a checkpoint becomes a release.</text>
  <g class="registry-stage registry-s0">
    <rect class="registry-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="registry-step" x="44" y="142">01</text>
    <text class="registry-name" x="70" y="142">Register the candidate</text>
    <text class="registry-desc" x="44" y="166">With its full lineage attached.</text>
  </g>
  <line class="registry-line registry-conn registry-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#registry-tip)"/>
  <g class="registry-stage registry-s1">
    <rect class="registry-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="registry-step" x="280" y="142">02</text>
    <text class="registry-name" x="306" y="142">Evaluate against the current production model</text>
    <text class="registry-desc" x="280" y="166">On a fixed held-out set, with</text>
    <text class="registry-desc" x="280" y="182">the same code.</text>
  </g>
  <line class="registry-line registry-conn registry-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#registry-tip)"/>
  <g class="registry-stage registry-s2">
    <rect class="registry-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="registry-step" x="516" y="142">03</text>
    <text class="registry-name" x="542" y="142">Promote with an approval</text>
    <text class="registry-desc" x="516" y="166">Recorded, attributable, and</text>
    <text class="registry-desc" x="516" y="182">reversible.</text>
  </g>
  <line class="registry-line registry-conn registry-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#registry-tip)"/>
  <g class="registry-stage registry-s3">
    <rect class="registry-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="registry-step" x="752" y="142">04</text>
    <text class="registry-name" x="778" y="142">And roll back by version</text>
    <text class="registry-desc" x="752" y="166">Which is only possible because</text>
    <text class="registry-desc" x="752" y="182">every version was kept.</text>
  </g>
  <text class="registry-sub" x="30" y="304">Rollback is the capability that justifies the whole apparatus: without a registry, reverting a bad model means finding a file somebody hopes is the right one.</text>
</svg>
