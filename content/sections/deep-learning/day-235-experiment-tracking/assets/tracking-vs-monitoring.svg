<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Before and after deployment.">
  <title>Tracking against monitoring</title>
  <style>
    .tracking-vs-monitoring-bg   { fill: #f8fafc; }
    .tracking-vs-monitoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-monitoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-monitoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-monitoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-monitoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-vs-monitoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-vs-monitoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-vs-monitoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-vs-monitoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-vs-monitoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-vs-monitoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-vs-monitoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-vs-monitoring-row { opacity: 1; }
    .tracking-vs-monitoring-r0 { animation-delay: 0.00s; }
    .tracking-vs-monitoring-r1 { animation-delay: 0.45s; }
    .tracking-vs-monitoring-r2 { animation-delay: 0.90s; }
    .tracking-vs-monitoring-r3 { animation-delay: 1.35s; }
    .tracking-vs-monitoring-r4 { animation-delay: 1.80s; }
    .tracking-vs-monitoring-row { animation: tracking-vs-monitoring-reveal 7.3s ease-in-out infinite; }
    @keyframes tracking-vs-monitoring-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="tracking-vs-monitoring-bg" width="980" height="390"/>
  <text class="tracking-vs-monitoring-h1"  x="30" y="40">Tracking against monitoring</text>
  <text class="tracking-vs-monitoring-sub" x="30" y="64">Before and after deployment.</text>
  <rect class="tracking-vs-monitoring-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-vs-monitoring-name" x="46" y="122">Experiment tracking</text>
  <text class="tracking-vs-monitoring-desc" x="46" y="142">Before deployment.</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r0" x="46" y="182">Records training runs</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r1" x="46" y="216">Metrics against a held-out set</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r2" x="46" y="250">Compares candidates</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r3" x="46" y="284">Answers which model to ship</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r4" x="46" y="318">Read by the team that built it</text>
  <rect class="tracking-vs-monitoring-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="tracking-vs-monitoring-name" x="526" y="122">Production monitoring</text>
  <text class="tracking-vs-monitoring-desc" x="526" y="142">After deployment.</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r0" x="526" y="182">Records live requests</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r1" x="526" y="216">Latency, errors and drift</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r2" x="526" y="250">Compares against yesterday</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r3" x="526" y="284">Answers whether it still works</text>
  <text class="tracking-vs-monitoring-desc tracking-vs-monitoring-row tracking-vs-monitoring-r4" x="526" y="318">Read by whoever is on call</text>
  <text class="tracking-vs-monitoring-sub" x="30" y="372">They meet at the registry: the version that monitoring reports on is the one tracking selected, and a broken link between the two is what makes an incident unexplainable.</text>
</svg>
