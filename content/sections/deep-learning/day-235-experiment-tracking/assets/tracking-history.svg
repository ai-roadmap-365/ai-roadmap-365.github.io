<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From spreadsheets to lineage.">
  <title>Four steps to experiment tracking</title>
  <style>
    .tracking-history-bg   { fill: #f8fafc; }
    .tracking-history-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-history-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-history-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-history-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-history-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tracking-history-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .tracking-history-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .tracking-history-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .tracking-history-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .tracking-history-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .tracking-history-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .tracking-history-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .tracking-history-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .tracking-history-stage { opacity: 1; }

    .tracking-history-s0 { animation-delay: 0.00s; }
    .tracking-history-e0 { animation-delay: 0.00s; }
    .tracking-history-s1 { animation-delay: 1.28s; }
    .tracking-history-e1 { animation-delay: 1.28s; }
    .tracking-history-s2 { animation-delay: 2.56s; }
    .tracking-history-e2 { animation-delay: 2.56s; }
    .tracking-history-s3 { animation-delay: 3.84s; }
    .tracking-history-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .tracking-history-conn  { animation: tracking-history-trace 6.4s ease-in-out infinite; }
      .tracking-history-stage { animation: tracking-history-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes tracking-history-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes tracking-history-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .tracking-history-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .tracking-history-stage { animation: tracking-history-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes tracking-history-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="tracking-history-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="tracking-history-bg" width="980" height="322"/>
  <text class="tracking-history-h1"  x="30" y="40">Four steps to experiment tracking</text>
  <text class="tracking-history-sub" x="30" y="64">From spreadsheets to lineage.</text>
  <g class="tracking-history-stage tracking-history-s0">
    <rect class="tracking-history-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-history-step" x="44" y="142">01</text>
    <text class="tracking-history-name" x="70" y="142">Spreadsheets and filenames</text>
    <text class="tracking-history-desc" x="44" y="166">Which worked while runs were</text>
    <text class="tracking-history-desc" x="44" y="182">counted in dozens.</text>
  </g>
  <line class="tracking-history-line tracking-history-conn tracking-history-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#tracking-history-tip)"/>
  <g class="tracking-history-stage tracking-history-s1">
    <rect class="tracking-history-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-history-step" x="280" y="142">02</text>
    <text class="tracking-history-name" x="306" y="142">Scalar logging libraries</text>
    <text class="tracking-history-desc" x="280" y="166">Curves in a browser, but no</text>
    <text class="tracking-history-desc" x="280" y="182">configuration or lineage.</text>
  </g>
  <line class="tracking-history-line tracking-history-conn tracking-history-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#tracking-history-tip)"/>
  <g class="tracking-history-stage tracking-history-s2">
    <rect class="tracking-history-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-history-step" x="516" y="142">03</text>
    <text class="tracking-history-name" x="542" y="142">Hosted tracking platforms</text>
    <text class="tracking-history-desc" x="516" y="166">Configuration, metrics and</text>
    <text class="tracking-history-desc" x="516" y="182">artefacts together.</text>
  </g>
  <line class="tracking-history-line tracking-history-conn tracking-history-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#tracking-history-tip)"/>
  <g class="tracking-history-stage tracking-history-s3">
    <rect class="tracking-history-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="tracking-history-step" x="752" y="142">04</text>
    <text class="tracking-history-name" x="778" y="142">Then data and pipeline lineage</text>
    <text class="tracking-history-desc" x="752" y="166">Which is what regulated</text>
    <text class="tracking-history-desc" x="752" y="182">deployment actually requires.</text>
  </g>
  <text class="tracking-history-sub" x="30" y="304">Each step absorbed something people had been doing by hand, which is the usual shape of tooling maturing in a field that is moving faster than its practices.</text>
</svg>
