visuals:
  - id: experiment-tracking-system-architecture
    file: assets/experiment-tracking-system-architecture.svg
    type: diagram
    title: 'MLOps Experiment Tracking Architecture'
    alt: Experiment Tracking system architecture diagram showing training loop telemetry artifact registry and dashboard comparison
    description: 'System architecture of an enterprise experiment tracking system: capturing Git SHA, data hashes, training metrics, hardware telemetry, and model artifact registries.'
  - id: hyperparameter-sweep-pareto-frontier
    file: assets/hyperparameter-sweep-pareto-frontier.svg
    type: diagram
    title: 'Hyperparameter Sweeps & Pareto Frontier'
    alt: Hyperparameter sweep Pareto frontier plotting learning rate vs validation loss identifying optimal configuration
    description: 'Hyperparameter sweep visualization showing optimal learning rate valleys, early-stopped trials, and Pareto frontiers.'
  - id: tracking-idea
    file: assets/tracking-idea.svg
    type: diagram
    title: 'What a tracked run records'
    alt: 'Diagram: the four things an experiment tracking system records for every run'
    description: 'A four-stage description of experiment tracking covering configuration, metrics, artefacts and environment.'
  - id: five-pillars
    file: assets/five-pillars.svg
    type: diagram
    title: 'Five things must be pinned'
    alt: 'Diagram: the five components required for a reproducible training run'
    description: 'A five-stage description of reproducibility requirements covering code, data, environment, randomness and hardware.'
  - id: tracking-vs-notes
    file: assets/tracking-vs-notes.svg
    type: diagram
    title: 'Tracking against remembering'
    alt: 'Diagram: informal experiment records compared with systematic tracking'
    description: 'A two-column comparison of ad hoc experiment notes against systematic tracking.'
  - id: sweeps
    file: assets/sweeps.svg
    type: diagram
    title: 'Sweeps and the frontier'
    alt: 'Diagram: how a hyperparameter sweep produces a frontier of trade-offs'
    description: 'A four-stage description of hyperparameter sweeps covering the search space, parallel runs, the trade-off frontier and the selection decision.'
  - id: registry
    file: assets/registry.svg
    type: diagram
    title: 'The model registry'
    alt: 'Diagram: the four stages a model passes through in a registry'
    description: 'A four-stage description of a model registry covering registration, evaluation, promotion and rollback.'
  - id: lab-notebook
    file: assets/lab-notebook.svg
    type: diagram
    title: 'The laboratory notebook'
    alt: 'Diagram: an untracked experiment compared with a recorded one'
    description: 'A two-column comparison of unrecorded laboratory work against a properly kept notebook.'
  - id: tracking-implications
    file: assets/tracking-implications.svg
    type: diagram
    title: 'Four consequences of tracking everything'
    alt: 'Diagram: the storage, privacy, velocity and audit implications of experiment tracking'
    description: 'A four-stage description of tracking implications covering storage cost, sensitive data in logs, development speed and auditability.'
  - id: tracking-when
    file: assets/tracking-when.svg
    type: diagram
    title: 'When to track'
    alt: 'Diagram: when systematic experiment tracking is warranted'
    description: 'A two-column comparison of situations requiring tracking against those where it is unnecessary.'
  - id: tracking-history
    file: assets/tracking-history.svg
    type: diagram
    title: 'Four steps to experiment tracking'
    alt: 'Diagram: the historical progression of experiment record-keeping in machine learning'
    description: 'A four-stage description of tracking history covering manual notes, logging libraries, hosted platforms and full lineage systems.'
  - id: tracking-vs-monitoring
    file: assets/tracking-vs-monitoring.svg
    type: diagram
    title: 'Tracking against monitoring'
    alt: 'Diagram: experiment tracking compared with production model monitoring'
    description: 'A two-column comparison of experiment tracking against production monitoring.'
