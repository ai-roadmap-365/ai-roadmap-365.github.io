visuals:
  - id: distributed-training-3d-parallelism-taxonomy
    file: assets/distributed-training-3d-parallelism-taxonomy.svg
    type: diagram
    title: '3D Parallelism: Data, Tensor, and Pipeline Parallelism'
    alt: Taxonomy of 3D Parallelism showing Data Parallelism Tensor Parallelism and Pipeline Parallelism across multi-GPU clusters
    description: 'Taxonomy of distributed scaling techniques: Data Parallelism (DDP/FSDP), Tensor Parallelism (Megatron-LM), and Pipeline Parallelism (PP).'
  - id: zero-memory-sharding-stages-fsdp
    file: assets/zero-memory-sharding-stages-fsdp.svg
    type: diagram
    title: 'ZeRO Memory Sharding Stages (ZeRO-1, ZeRO-2, ZeRO-3 / FSDP)'
    alt: ZeRO memory sharding stages comparison showing Baseline DDP ZeRO 1 ZeRO 2 and ZeRO 3 Fully Sharded Data Parallel
    description: 'DeepSpeed ZeRO memory sharding stages and PyTorch Fully Sharded Data Parallel (FSDP) mechanics.'
  - id: distributed-idea
    file: assets/distributed-idea.svg
    type: diagram
    title: 'Distributed training in four steps'
    alt: 'Diagram: the four steps of synchronous data-parallel training'
    description: 'A four-stage description of data-parallel training covering the replicated model, split batches, gradient averaging and synchronised updates.'
  - id: distributed-history
    file: assets/distributed-history.svg
    type: diagram
    title: 'Four steps to cluster-scale training'
    alt: 'Diagram: the historical progression of distributed deep learning strategies'
    description: 'A four-stage description of distributed training history covering parameter servers, ring reduction, sharded state and combined parallelism.'
  - id: ring-allreduce
    file: assets/ring-allreduce.svg
    type: diagram
    title: 'Averaging without a bottleneck'
    alt: 'Diagram: centralised gradient averaging compared with ring-based averaging'
    description: 'A four-stage description of ring all-reduce covering the central bottleneck, the ring arrangement, the two passes and the scaling property.'
  - id: ddp-overlap
    file: assets/ddp-overlap.svg
    type: diagram
    title: 'Overlapping compute and communication'
    alt: 'Diagram: how gradient communication overlaps with the backward pass'
    description: 'A four-stage description of gradient bucketing covering the naive sequence, the wasted time, bucketed gradients and overlapped communication.'
  - id: ddp-vs-fsdp
    file: assets/ddp-vs-fsdp.svg
    type: diagram
    title: 'Replicating against sharding'
    alt: 'Diagram: full model replication compared with sharded parameters and optimiser state'
    description: 'A two-column comparison of replicated distributed training against sharded distributed training.'
  - id: three-d
    file: assets/three-d.svg
    type: diagram
    title: 'Three axes of parallelism'
    alt: 'Diagram: data, tensor and pipeline parallelism as three combined axes'
    description: 'A three-stage description of parallelism axes covering data parallelism, tensor parallelism and pipeline parallelism.'
  - id: context-parallel
    file: assets/context-parallel.svg
    type: diagram
    title: 'Splitting the sequence itself'
    alt: 'Diagram: how attention is computed when the sequence is split across devices'
    description: 'A four-stage description of context parallelism covering the memory problem, sequence splitting, rotating keys and values, and the resulting context length.'
  - id: moe
    file: assets/moe.svg
    type: diagram
    title: 'Sparse expert models'
    alt: 'Diagram: how mixture-of-experts routing activates only part of the model per token'
    description: 'A four-stage description of mixture-of-experts covering many expert blocks, routing, sparse activation and the parameter-to-compute decoupling.'
  - id: translation
    file: assets/translation.svg
    type: diagram
    title: 'Splitting a translation job'
    alt: 'Diagram: dividing work by chapter compared with dividing by task'
    description: 'A two-column comparison of splitting a large task by input against splitting it by stage.'
  - id: distributed-implications
    file: assets/distributed-implications.svg
    type: diagram
    title: 'Four consequences of scaling out'
    alt: 'Diagram: the cost, failure, efficiency and complexity implications of distributed training'
    description: 'A four-stage description of distributed training implications covering cost, hardware failure, scaling efficiency and debugging difficulty.'
  - id: distributed-when
    file: assets/distributed-when.svg
    type: diagram
    title: 'When to distribute'
    alt: 'Diagram: when distributed training is warranted and when a single device is better'
    description: 'A two-column comparison of situations requiring distribution against those better served by one device.'
