questions:
  - question: 'Why is PyTorch DistributedDataParallel (DDP) fundamentally superior to legacy DataParallel (DP)?'
    options:
      - 'DDP spawns a separate dedicated operating system process per GPU (eliminating Python GIL contention) and synchronizes gradients via ring-based collective communications; DP runs on a single Python process where GPU 0 acts as a central bottleneck scattering inputs and gathering outputs over the slow PCIe bus'
      - 'DDP runs without electricity'
      - 'DP is only for audio models'
      - 'DDP deletes optimizer states'
    answer_index: 0
    explanation: 'DDP eliminates Python GIL bottlenecks and master-GPU single-point congestion through multi-process ring all-reduce.'
  - question: 'What is the total data transmitted per GPU in a Ring-AllReduce across P GPUs with tensor volume V?'
    options:
      - '2 * (P - 1) / P * V (which is strictly bounded and independent of cluster size P, approaching 2V as P grows)'
      - 'P * V'
      - 'V^2'
      - 'P * V^2'
    answer_index: 0
    explanation: 'Ring-AllReduce requires two passes (Scatter-Reduce and All-Gather), transferring 2*(P-1)/P * V bytes per GPU.'
  - question: 'What does ZeRO-3 (Zero Redundancy Optimizer Stage 3 / PyTorch FSDP) shard across GPUs?'
    options:
      - 'It shards all three components: Optimizer states (12 bytes/param), Gradients (2 bytes/param), and Model Parameters (2 bytes/param), gathering parameter layers on-demand just-in-time during forward and backward passes'
      - 'It only shards text tokens'
      - 'It only shards the loss function'
      - 'It deletes the test set'
    answer_index: 0
    explanation: 'ZeRO-3 shards optimizer states, gradients, and model parameters, achieving near-linear memory reduction across ranks.'
  - question: 'Why does Megatron-LM Tensor Parallelism (TP) require high-bandwidth NVLink interconnects rather than standard Ethernet networking?'
    options:
      - 'Because TP executes an All-Reduce communication operation inside every single Transformer attention head and MLP layer (twice per layer per forward pass, and twice per backward pass), requiring 900+ GB/s bandwidth to avoid severe communication stalls'
      - 'Because Ethernet does not support floating point numbers'
      - 'Because NVLink is cheaper than Ethernet'
      - 'Because GPUs cannot plug into Ethernet cables'
    answer_index: 0
    explanation: 'TP communicates multiple times per Transformer layer; without NVLink wire speed, training stalls completely on network transfer.'
  - question: 'What is the primary problem with naive Pipeline Parallelism, and how does the 1F1B (One-Forward-One-Backward) schedule solve it?'
    options:
      - 'Naive pipeline parallelism introduces massive idle time (the pipeline bubble) while downstream GPUs wait for upstream activations; 1F1B interleaves micro-batch forward and backward passes so GPUs stay continuously busy while capping peak activation memory'
      - 'Naive pipeline parallelism causes loss to become negative'
      - '1F1B deletes the model weights'
      - 'Naive pipeline parallelism requires liquid helium'
    answer_index: 0
    explanation: '1F1B schedule minimizes the pipeline bubble and stabilizes activation memory by executing 1 backward pass for every forward pass.'
