terms:
  - term: 'DistributedDataParallel (DDP)'
    definition: 'PyTorch multi-process data parallelism running one process per GPU and overlapping gradient all-reduce with backward pass computation.'
  - term: 'Ring-AllReduce'
    definition: 'A bandwidth-optimal collective communication algorithm where logical rings of processors aggregate tensors in Scatter-Reduce and All-Gather phases.'
  - term: 'ZeRO (Zero Redundancy Optimizer)'
    definition: 'A memory optimization technology that eliminates redundant memory states across data-parallel processes by sharding optimizer states, gradients, and parameters.'
  - term: 'Fully Sharded Data Parallel (FSDP)'
    definition: 'PyTorch native implementation of ZeRO-3, dynamically gathering parameter shards just-in-time and discarding them immediately after layer execution.'
  - term: 'Tensor Parallelism (TP)'
    definition: 'Intra-node model parallelism that splits individual weight matrices (e.g. QKV projections and MLP layers) across multiple GPUs within an NVLink domain.'
  - term: 'Pipeline Parallelism (PP)'
    definition: 'Inter-node model parallelism that partitions consecutive Transformer layers across multiple GPUs, executing micro-batches in a 1F1B pipeline schedule.'
  - term: 'Pipeline Bubble'
    definition: 'The idle time experienced by pipeline parallel stages waiting for data from preceding or succeeding stages.'
  - term: '3D Parallelism'
    definition: 'The orthogonal combination of Data Parallelism (DP/FSDP), Tensor Parallelism (TP), and Pipeline Parallelism (PP) to train trillion-parameter models.'
