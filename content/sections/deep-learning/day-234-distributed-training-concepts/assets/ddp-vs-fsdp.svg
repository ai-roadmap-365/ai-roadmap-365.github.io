<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="What each device holds.">
  <title>Replicating against sharding</title>
  <style>
    .ddp-vs-fsdp-bg   { fill: #f8fafc; }
    .ddp-vs-fsdp-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-vs-fsdp-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-vs-fsdp-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-vs-fsdp-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-vs-fsdp-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ddp-vs-fsdp-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ddp-vs-fsdp-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ddp-vs-fsdp-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ddp-vs-fsdp-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ddp-vs-fsdp-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ddp-vs-fsdp-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ddp-vs-fsdp-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ddp-vs-fsdp-row { opacity: 1; }
    .ddp-vs-fsdp-r0 { animation-delay: 0.00s; }
    .ddp-vs-fsdp-r1 { animation-delay: 0.45s; }
    .ddp-vs-fsdp-r2 { animation-delay: 0.90s; }
    .ddp-vs-fsdp-r3 { animation-delay: 1.35s; }
    .ddp-vs-fsdp-r4 { animation-delay: 1.80s; }
    .ddp-vs-fsdp-row { animation: ddp-vs-fsdp-reveal 7.3s ease-in-out infinite; }
    @keyframes ddp-vs-fsdp-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ddp-vs-fsdp-bg" width="980" height="390"/>
  <text class="ddp-vs-fsdp-h1"  x="30" y="40">Replicating against sharding</text>
  <text class="ddp-vs-fsdp-sub" x="30" y="64">What each device holds.</text>
  <rect class="ddp-vs-fsdp-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ddp-vs-fsdp-name" x="46" y="122">Replicated</text>
  <text class="ddp-vs-fsdp-desc" x="46" y="142">Everything, everywhere.</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r0" x="46" y="182">Each device holds the whole model</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r1" x="46" y="216">And the whole optimiser state</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r2" x="46" y="250">Simple, and communication-light</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r3" x="46" y="284">Bounded by one device's memory</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r4" x="46" y="318">Right when the model fits</text>
  <rect class="ddp-vs-fsdp-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ddp-vs-fsdp-name" x="526" y="122">Sharded</text>
  <text class="ddp-vs-fsdp-desc" x="526" y="142">A fraction each.</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r0" x="526" y="182">Parameters split across devices</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r1" x="526" y="216">Gathered per layer, then discarded</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r2" x="526" y="250">More communication</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r3" x="526" y="284">Memory per device falls with cluster size</text>
  <text class="ddp-vs-fsdp-desc ddp-vs-fsdp-row ddp-vs-fsdp-r4" x="526" y="318">Right when the model does not fit</text>
  <text class="ddp-vs-fsdp-sub" x="30" y="372">The choice follows directly from what runs out first: sharding buys memory with network traffic, which is a poor trade when the model already fits.</text>
</svg>
