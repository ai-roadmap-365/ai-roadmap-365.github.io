<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="A ring, not a hub.">
  <title>Averaging without a bottleneck</title>
  <style>
    .ring-allreduce-bg   { fill: #f8fafc; }
    .ring-allreduce-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring-allreduce-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring-allreduce-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring-allreduce-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring-allreduce-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ring-allreduce-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ring-allreduce-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ring-allreduce-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ring-allreduce-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ring-allreduce-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ring-allreduce-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ring-allreduce-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .ring-allreduce-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .ring-allreduce-stage { opacity: 1; }

    .ring-allreduce-s0 { animation-delay: 0.00s; }
    .ring-allreduce-e0 { animation-delay: 0.00s; }
    .ring-allreduce-s1 { animation-delay: 1.28s; }
    .ring-allreduce-e1 { animation-delay: 1.28s; }
    .ring-allreduce-s2 { animation-delay: 2.56s; }
    .ring-allreduce-e2 { animation-delay: 2.56s; }
    .ring-allreduce-s3 { animation-delay: 3.84s; }
    .ring-allreduce-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .ring-allreduce-conn  { animation: ring-allreduce-trace 6.4s ease-in-out infinite; }
      .ring-allreduce-stage { animation: ring-allreduce-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes ring-allreduce-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes ring-allreduce-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .ring-allreduce-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .ring-allreduce-stage { animation: ring-allreduce-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes ring-allreduce-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ring-allreduce-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="ring-allreduce-bg" width="980" height="322"/>
  <text class="ring-allreduce-h1"  x="30" y="40">Averaging without a bottleneck</text>
  <text class="ring-allreduce-sub" x="30" y="64">A ring, not a hub.</text>
  <g class="ring-allreduce-stage ring-allreduce-s0">
    <rect class="ring-allreduce-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="ring-allreduce-step" x="44" y="142">01</text>
    <text class="ring-allreduce-name" x="70" y="142">A central collector saturates</text>
    <text class="ring-allreduce-desc" x="44" y="166">Every device sending to one. It</text>
    <text class="ring-allreduce-desc" x="44" y="182">becomes the limit.</text>
  </g>
  <line class="ring-allreduce-line ring-allreduce-conn ring-allreduce-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#ring-allreduce-tip)"/>
  <g class="ring-allreduce-stage ring-allreduce-s1">
    <rect class="ring-allreduce-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="ring-allreduce-step" x="280" y="142">02</text>
    <text class="ring-allreduce-name" x="306" y="142">Arrange devices in a ring instead</text>
    <text class="ring-allreduce-desc" x="280" y="166">Each talks only to its two</text>
    <text class="ring-allreduce-desc" x="280" y="182">neighbours.</text>
  </g>
  <line class="ring-allreduce-line ring-allreduce-conn ring-allreduce-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#ring-allreduce-tip)"/>
  <g class="ring-allreduce-stage ring-allreduce-s2">
    <rect class="ring-allreduce-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="ring-allreduce-step" x="516" y="142">03</text>
    <text class="ring-allreduce-name" x="542" y="142">Two passes around it</text>
    <text class="ring-allreduce-desc" x="516" y="166">One to reduce, one to distribute</text>
    <text class="ring-allreduce-desc" x="516" y="182">the result.</text>
  </g>
  <line class="ring-allreduce-line ring-allreduce-conn ring-allreduce-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#ring-allreduce-tip)"/>
  <g class="ring-allreduce-stage ring-allreduce-s3">
    <rect class="ring-allreduce-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="ring-allreduce-step" x="752" y="142">04</text>
    <text class="ring-allreduce-name" x="778" y="142">And traffic per device stops growing</text>
    <text class="ring-allreduce-desc" x="752" y="166">Independent of how many devices</text>
    <text class="ring-allreduce-desc" x="752" y="182">there are.</text>
  </g>
  <text class="ring-allreduce-sub" x="30" y="304">That per-device traffic is independent of cluster size is the property that makes near-linear scaling possible, and it is why this algorithm is in every distributed framework.</text>
</svg>
