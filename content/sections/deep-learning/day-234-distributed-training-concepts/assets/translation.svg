<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two ways to divide it.">
  <title>Splitting a translation job</title>
  <style>
    .translation-bg   { fill: #f8fafc; }
    .translation-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translation-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translation-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translation-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translation-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .translation-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .translation-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .translation-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .translation-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .translation-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .translation-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .translation-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .translation-row { opacity: 1; }
    .translation-r0 { animation-delay: 0.00s; }
    .translation-r1 { animation-delay: 0.45s; }
    .translation-r2 { animation-delay: 0.90s; }
    .translation-r3 { animation-delay: 1.35s; }
    .translation-r4 { animation-delay: 1.80s; }
    .translation-row { animation: translation-reveal 7.3s ease-in-out infinite; }
    @keyframes translation-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="translation-bg" width="980" height="390"/>
  <text class="translation-h1"  x="30" y="40">Splitting a translation job</text>
  <text class="translation-sub" x="30" y="64">Two ways to divide it.</text>
  <rect class="translation-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="translation-name" x="46" y="122">By chapter</text>
  <text class="translation-desc" x="46" y="142">Everyone does everything.</text>
  <text class="translation-desc translation-row translation-r0" x="46" y="182">Each translator takes a section</text>
  <text class="translation-desc translation-row translation-r1" x="46" y="216">All need the full dictionary</text>
  <text class="translation-desc translation-row translation-r2" x="46" y="250">They meet to agree terminology</text>
  <text class="translation-desc translation-row translation-r3" x="46" y="284">Simple to organise</text>
  <text class="translation-desc translation-row translation-r4" x="46" y="318">This is data parallelism</text>
  <rect class="translation-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="translation-name" x="526" y="122">By stage</text>
  <text class="translation-desc" x="526" y="142">Everyone does one thing.</text>
  <text class="translation-desc translation-row translation-r0" x="526" y="182">One drafts, one edits, one proofs</text>
  <text class="translation-desc translation-row translation-r1" x="526" y="216">Each needs only their own reference</text>
  <text class="translation-desc translation-row translation-r2" x="526" y="250">Work flows between them constantly</text>
  <text class="translation-desc translation-row translation-r3" x="526" y="284">Idle time at the start and end</text>
  <text class="translation-desc translation-row translation-r4" x="526" y="318">This is pipeline parallelism</text>
  <text class="translation-sub" x="30" y="372">The idle time at the ends is a real cost rather than an artefact of the analogy, and reducing it is exactly what the interleaved scheduling in production pipelines is for.</text>
</svg>
