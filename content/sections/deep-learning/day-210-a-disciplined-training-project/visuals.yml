visuals:
  - id: disciplined-training-harness-architecture
    file: assets/disciplined-training-harness-architecture.svg
    type: diagram
    title: Disciplined Deep Learning Training Engine Architecture
    alt: End-to-end disciplined deep learning training framework architecture connecting configuration, seeding, data loaders, training engine, checkpointer, and early stopping
    description: High-level architectural blueprint of a production PyTorch training harness, illustrating modular separation of dataclass configuration, deterministic seeding, dataset ingestion, modular train/val loops, checkpoint serialization, and early stopping.
  - id: early-stopping-checkpoint-timeline
    file: assets/early-stopping-checkpoint-timeline.svg
    type: diagram
    title: Early Stopping Patience and Checkpoint Capture Timeline
    alt: Early stopping timeline showing training and validation loss curves with patience countdown and best model checkpoint capture
    description: Epoch-by-epoch loss curve visualization contrasting monotonic training loss reduction against validation loss divergence, detailing the patience window countdown and automated best checkpoint restoration.
  - id: harness-pillars
    file: assets/harness-pillars.svg
    type: diagram
    title: 'Five pillars of a training harness'
    alt: 'Diagram: the five separated concerns of a disciplined training harness'
    description: 'A five-stage description of a training harness covering configuration, data, model, optimisation and persistence.'
  - id: harness-or-script
    file: assets/harness-or-script.svg
    type: diagram
    title: 'A harness, or a training script'
    alt: 'Diagram: a disciplined training harness compared with an ad-hoc training script'
    description: 'A two-column comparison of a modular reproducible harness against an ad-hoc script.'
  - id: seeding
    file: assets/seeding.svg
    type: diagram
    title: 'Where randomness enters'
    alt: 'Diagram: the four sources of randomness in a training run'
    description: 'A four-stage description of randomness sources covering weight initialisation, data shuffling, augmentation and non-deterministic kernels.'
  - id: checkpoint-contents
    file: assets/checkpoint-contents.svg
    type: diagram
    title: 'What a checkpoint must contain'
    alt: 'Diagram: the five components a complete training checkpoint must contain'
    description: 'A five-stage description of checkpoint contents covering weights, optimiser state, scheduler position, epoch and random state.'
  - id: early-stopping
    file: assets/early-stopping.svg
    type: diagram
    title: 'Early stopping as a stated rule'
    alt: 'Diagram: the parameters of an early stopping rule'
    description: 'A four-stage description of early stopping covering the monitored metric, patience, the minimum improvement and best-checkpoint restoration.'
  - id: export
    file: assets/export.svg
    type: diagram
    title: 'Two export paths'
    alt: 'Diagram: tracing to a framework runtime compared with exporting to a portable format'
    description: 'A three-stage description of model export covering tracing, portable interchange formats and the constraints each imposes.'
  - id: clinical-trial
    file: assets/clinical-trial.svg
    type: diagram
    title: 'A clinical trial protocol'
    alt: 'Diagram: a pre-registered protocol compared with decisions made after seeing results'
    description: 'A two-column comparison of a pre-specified trial protocol against post-hoc decisions.'
  - id: experiment-metadata
    file: assets/experiment-metadata.svg
    type: diagram
    title: 'What a run must record'
    alt: 'Diagram: the metadata that makes a training run reproducible later'
    description: 'A five-stage description of experiment metadata covering configuration, code version, data version, environment and metrics.'
  - id: harness-implications
    file: assets/harness-implications.svg
    type: diagram
    title: 'Four consequences of discipline'
    alt: 'Diagram: the reproducibility, resumption, comparison and deployment implications of a training harness'
    description: 'A four-stage description of harness implications covering determinism cost, resumption, comparability and deployment readiness.'
  - id: harness-when
    file: assets/harness-when.svg
    type: diagram
    title: 'When the harness is worth building'
    alt: 'Diagram: when a disciplined training harness earns its structure'
    description: 'A two-column comparison of projects requiring a full harness against exploratory work.'
