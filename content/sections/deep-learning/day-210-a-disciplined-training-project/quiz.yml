questions:
  - question: 'What complete payload must be serialized into a PyTorch checkpoint dictionary to ensure a training run can be resumed seamlessly without loss of optimization state?'
    options:
      - 'model.state_dict(), optimizer.state_dict(), scheduler.state_dict(), current epoch number, best validation metric, and random number generator states'
      - 'Only the model.state_dict()'
      - 'The Python script source code'
      - 'Only the learning rate float'
    answer_index: 0
    explanation: 'Optimizers (like AdamW) and schedulers maintain internal momentum buffers and step counters. Saving only the model weights loses all accumulated optimizer momentum and resets the LR schedule.'
  - question: 'How does an EarlyStopping mechanism prevent overfitting while ensuring the final deployed model achieves the absolute peak validation performance?'
    options:
      - 'It tracks validation loss every epoch; if loss fails to improve by at least min_delta for patience consecutive epochs, training terminates, and the checkpointer restores the saved weights from the best historical epoch'
      - 'It deletes the training dataset when loss reaches zero'
      - 'It increases learning rate by 10x'
      - 'It sets all weights to zero'
    answer_index: 0
    explanation: 'Early stopping halts training when validation performance degrades for patience epochs, and automatically restores the saved best checkpoint state_dict rather than keeping the final overfitted weights.'
  - question: 'Why is it critical to seed random, np.random, torch.manual_seed, and configure torch.backends.cudnn.deterministic = True simultaneously?'
    options:
      - 'Different components of a deep learning pipeline (Python shuffle, NumPy transforms, PyTorch weight initialization, and CUDA GPU kernels) draw from distinct random number generators; seeding all of them is necessary for 100% bitwise reproducibility'
      - 'It makes the model train twice as fast'
      - 'It prevents GPU memory leaks'
      - 'PyTorch will crash if NumPy is not seeded'
    answer_index: 0
    explanation: 'A deep learning pipeline utilizes multiple RNG sources. Seeding only torch leaves data augmentation or dataset shuffling non-deterministic.'
  - question: 'Why should training hyperparameters always be structured into a strongly typed dataclass or configuration dictionary rather than hardcoded scattered variables?'
    options:
      - 'It enables atomic serialization into experiment logs, eliminates silent variable shadowing bugs, facilitates automated hyperparameter sweeps, and makes every training run 100% auditable'
      - 'Dataclasses make Python compile to C++'
      - 'Dataclasses use less RAM'
      - 'PyTorch requires dataclasses by law'
    answer_index: 0
    explanation: 'A centralized configuration dataclass guarantees that every hyperparameter can be saved into JSON metadata alongside model weights for full auditability and reproducibility.'
  - question: 'What is the correct protocol for calculating average validation loss across mini-batches of unequal sizes (e.g. when drop_last=False)?'
    options:
      - 'Multiply each batch mean loss by its batch sample count (batch_size), accumulate the total loss sum, and divide by the total number of validation samples at the end of the epoch'
      - 'Simply take the unweighted mean of the batch loss scalars'
      - 'Only evaluate on the first batch'
      - 'Ignore the last batch'
    answer_index: 0
    explanation: 'Taking a simple unweighted mean of batch losses slightly misweights the final smaller batch. Accumulating total loss sum and dividing by total sample count gives the exact mathematical sample mean.'
