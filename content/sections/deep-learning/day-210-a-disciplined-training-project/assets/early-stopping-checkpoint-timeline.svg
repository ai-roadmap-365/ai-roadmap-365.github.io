<svg role="img" aria-label="Early stopping timeline showing training and validation loss curves with patience countdown and best model checkpoint capture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <title>Early Stopping Patience and Checkpoint Capture Timeline</title>
  <defs>
    <linearGradient id="bg210b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card210b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="420" fill="url(#bg210b)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EARLY STOPPING &amp; CHECKPOINT RESTORATION</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Monitoring Generalization Gap to Prevent Overfitting and Restore Optimum Weights</text>
  <g transform="translate(45, 85)">
    <rect width="760" height="295" fill="url(#card210b)" stroke="#475569" stroke-width="1.5" rx="8"/>
    <!-- Plot Axes -->
    <line x1="60" y1="240" x2="700" y2="240" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="240" x2="60" y2="30" stroke="#64748b" stroke-width="2"/>
    <text x="700" y="255" fill="#94a3b8" font-size="10" text-anchor="end">Training Epochs -&gt;</text>
    <text x="50" y="30" fill="#94a3b8" font-size="10" text-anchor="end">Loss</text>

    <!-- Training Loss Curve (Blue, monotonically decreasing) -->
    <path d="M 70 50 Q 200 180 320 200 T 500 220 T 680 230" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="680" y="225" fill="#38bdf8" font-size="10" font-weight="700">Train Loss</text>

    <!-- Validation Loss Curve (Red, reaches minimum then rises) -->
    <path d="M 70 70 Q 180 160 320 170 Q 450 180 550 205 Q 620 225 680 245" fill="none" stroke="#f43f5e" stroke-width="3" transform="scale(1, -1) translate(0, -290)"/>
    <text x="680" y="60" fill="#f43f5e" font-size="10" font-weight="700">Val Loss (Overfitting)</text>

    <!-- Minimum Point (Best Checkpoint) -->
    <circle cx="320" cy="120" r="7" fill="#10b981" stroke="#f8fafc" stroke-width="2"/>
    <line x1="320" y1="120" x2="320" y2="240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="230" y="65" width="180" height="40" fill="#0f172a" stroke="#10b981" rx="4"/>
    <text x="320" y="82" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">BEST CHECKPOINT SAVED</text>
    <text x="320" y="96" fill="#f8fafc" font-size="8" text-anchor="middle">Epoch 12: Val Loss = 0.312</text>

    <!-- Patience Zone -->
    <rect x="320" y="110" width="230" height="130" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-dasharray="4,4"/>
    <text x="435" y="150" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Patience Window (patience=5)</text>
    <text x="435" y="170" fill="#cbd5e1" font-size="8" text-anchor="middle">Epoch 13..17: No Val Improvement</text>

    <!-- Early Stop Trigger -->
    <circle cx="550" cy="135" r="7" fill="#f43f5e" stroke="#f8fafc" stroke-width="2"/>
    <rect x="490" y="35" width="160" height="40" fill="#0f172a" stroke="#f43f5e" rx="4"/>
    <text x="570" y="52" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">EARLY STOP TRIGGERED</text>
    <text x="570" y="66" fill="#f8fafc" font-size="8" text-anchor="middle">Restore Epoch 12 state_dict!</text>
  </g>
</svg>
