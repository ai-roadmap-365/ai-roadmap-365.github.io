<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five things, and weights are one.">
  <title>What a checkpoint must contain</title>
  <style>
    .checkpoint-contents-bg   { fill: #f8fafc; }
    .checkpoint-contents-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-contents-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-contents-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-contents-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-contents-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .checkpoint-contents-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .checkpoint-contents-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .checkpoint-contents-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .checkpoint-contents-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .checkpoint-contents-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .checkpoint-contents-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .checkpoint-contents-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .checkpoint-contents-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .checkpoint-contents-stage { opacity: 1; }

    .checkpoint-contents-s0 { animation-delay: 0.00s; }
    .checkpoint-contents-e0 { animation-delay: 0.00s; }
    .checkpoint-contents-s1 { animation-delay: 1.33s; }
    .checkpoint-contents-e1 { animation-delay: 1.33s; }
    .checkpoint-contents-s2 { animation-delay: 2.67s; }
    .checkpoint-contents-e2 { animation-delay: 2.67s; }
    .checkpoint-contents-s3 { animation-delay: 4.00s; }
    .checkpoint-contents-e3 { animation-delay: 4.00s; }
    .checkpoint-contents-s4 { animation-delay: 5.33s; }
    .checkpoint-contents-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .checkpoint-contents-conn  { animation: checkpoint-contents-trace 8s ease-in-out infinite; }
      .checkpoint-contents-stage { animation: checkpoint-contents-arrive 8s ease-in-out infinite; }
    }
    @keyframes checkpoint-contents-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes checkpoint-contents-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .checkpoint-contents-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .checkpoint-contents-stage { animation: checkpoint-contents-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes checkpoint-contents-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="checkpoint-contents-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="checkpoint-contents-bg" width="980" height="322"/>
  <text class="checkpoint-contents-h1"  x="30" y="40">What a checkpoint must contain</text>
  <text class="checkpoint-contents-sub" x="30" y="64">Five things, and weights are one.</text>
  <g class="checkpoint-contents-stage checkpoint-contents-s0">
    <rect class="checkpoint-contents-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="checkpoint-contents-step" x="44" y="142">01</text>
    <text class="checkpoint-contents-name" x="70" y="142">Model weights</text>
    <text class="checkpoint-contents-desc" x="44" y="166">The obvious part, and the</text>
    <text class="checkpoint-contents-desc" x="44" y="182">smallest fraction of what</text>
    <text class="checkpoint-contents-desc" x="44" y="198">matters.</text>
  </g>
  <line class="checkpoint-contents-line checkpoint-contents-conn checkpoint-contents-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#checkpoint-contents-tip)"/>
  <g class="checkpoint-contents-stage checkpoint-contents-s1">
    <rect class="checkpoint-contents-warn" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="checkpoint-contents-step" x="233" y="142">02</text>
    <text class="checkpoint-contents-name" x="259" y="142">Optimiser state</text>
    <text class="checkpoint-contents-desc" x="233" y="166">Momentum and adaptive</text>
    <text class="checkpoint-contents-desc" x="233" y="182">moments. Losing these</text>
    <text class="checkpoint-contents-desc" x="233" y="198">restarts the optimiser</text>
  </g>
  <line class="checkpoint-contents-line checkpoint-contents-conn checkpoint-contents-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#checkpoint-contents-tip)"/>
  <g class="checkpoint-contents-stage checkpoint-contents-s2">
    <rect class="checkpoint-contents-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="checkpoint-contents-step" x="422" y="142">03</text>
    <text class="checkpoint-contents-name" x="448" y="142">Scheduler position</text>
    <text class="checkpoint-contents-desc" x="422" y="166">Or the resumed run</text>
    <text class="checkpoint-contents-desc" x="422" y="182">restarts warmup and</text>
    <text class="checkpoint-contents-desc" x="422" y="198">destroys progress.</text>
  </g>
  <line class="checkpoint-contents-line checkpoint-contents-conn checkpoint-contents-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#checkpoint-contents-tip)"/>
  <g class="checkpoint-contents-stage checkpoint-contents-s3">
    <rect class="checkpoint-contents-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="checkpoint-contents-step" x="611" y="142">04</text>
    <text class="checkpoint-contents-name" x="637" y="142">Epoch and step counters</text>
    <text class="checkpoint-contents-desc" x="611" y="166">So the schedule and the</text>
    <text class="checkpoint-contents-desc" x="611" y="182">data order continue</text>
    <text class="checkpoint-contents-desc" x="611" y="198">correctly.</text>
  </g>
  <line class="checkpoint-contents-line checkpoint-contents-conn checkpoint-contents-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#checkpoint-contents-tip)"/>
  <g class="checkpoint-contents-stage checkpoint-contents-s4">
    <rect class="checkpoint-contents-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="checkpoint-contents-step" x="800" y="142">05</text>
    <text class="checkpoint-contents-name" x="826" y="142">Random generator states</text>
    <text class="checkpoint-contents-desc" x="800" y="166">For genuine</text>
    <text class="checkpoint-contents-desc" x="800" y="182">reproducibility across a</text>
    <text class="checkpoint-contents-desc" x="800" y="198">resume.</text>
  </g>
  <text class="checkpoint-contents-sub" x="30" y="304">Saving only the weights is the default in most tutorial code and produces a resume that looks correct and is not: the optimiser starts cold and the learning rate returns to its warmup value.</text>
</svg>
