<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Separated deliberately.">
  <title>Five pillars of a training harness</title>
  <style>
    .harness-pillars-bg   { fill: #f8fafc; }
    .harness-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .harness-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .harness-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .harness-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .harness-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .harness-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .harness-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .harness-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .harness-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .harness-pillars-stage { opacity: 1; }

    .harness-pillars-s0 { animation-delay: 0.00s; }
    .harness-pillars-e0 { animation-delay: 0.00s; }
    .harness-pillars-s1 { animation-delay: 1.33s; }
    .harness-pillars-e1 { animation-delay: 1.33s; }
    .harness-pillars-s2 { animation-delay: 2.67s; }
    .harness-pillars-e2 { animation-delay: 2.67s; }
    .harness-pillars-s3 { animation-delay: 4.00s; }
    .harness-pillars-e3 { animation-delay: 4.00s; }
    .harness-pillars-s4 { animation-delay: 5.33s; }
    .harness-pillars-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .harness-pillars-conn  { animation: harness-pillars-trace 8s ease-in-out infinite; }
      .harness-pillars-stage { animation: harness-pillars-arrive 8s ease-in-out infinite; }
    }
    @keyframes harness-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes harness-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .harness-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .harness-pillars-stage { animation: harness-pillars-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes harness-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="harness-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="harness-pillars-bg" width="980" height="322"/>
  <text class="harness-pillars-h1"  x="30" y="40">Five pillars of a training harness</text>
  <text class="harness-pillars-sub" x="30" y="64">Separated deliberately.</text>
  <g class="harness-pillars-stage harness-pillars-s0">
    <rect class="harness-pillars-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pillars-step" x="44" y="142">01</text>
    <text class="harness-pillars-name" x="70" y="142">Configuration</text>
    <text class="harness-pillars-desc" x="44" y="166">Typed, in one object. Not</text>
    <text class="harness-pillars-desc" x="44" y="182">a dozen loose arguments.</text>
    <text class="harness-pillars-edge" x="44" y="242">describable</text>
  </g>
  <line class="harness-pillars-line harness-pillars-conn harness-pillars-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#harness-pillars-tip)"/>
  <g class="harness-pillars-stage harness-pillars-s1">
    <rect class="harness-pillars-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pillars-step" x="233" y="142">02</text>
    <text class="harness-pillars-name" x="259" y="142">Data</text>
    <text class="harness-pillars-desc" x="233" y="166">Datasets and loaders,</text>
    <text class="harness-pillars-desc" x="233" y="182">independent of the model.</text>
  </g>
  <line class="harness-pillars-line harness-pillars-conn harness-pillars-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#harness-pillars-tip)"/>
  <g class="harness-pillars-stage harness-pillars-s2">
    <rect class="harness-pillars-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pillars-step" x="422" y="142">03</text>
    <text class="harness-pillars-name" x="448" y="142">Model</text>
    <text class="harness-pillars-desc" x="422" y="166">Architecture, independent</text>
    <text class="harness-pillars-desc" x="422" y="182">of how it is trained.</text>
  </g>
  <line class="harness-pillars-line harness-pillars-conn harness-pillars-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#harness-pillars-tip)"/>
  <g class="harness-pillars-stage harness-pillars-s3">
    <rect class="harness-pillars-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pillars-step" x="611" y="142">04</text>
    <text class="harness-pillars-name" x="637" y="142">Optimisation</text>
    <text class="harness-pillars-desc" x="611" y="166">Optimiser, scheduler and</text>
    <text class="harness-pillars-desc" x="611" y="182">loss, configured rather</text>
    <text class="harness-pillars-desc" x="611" y="198">than hardcoded.</text>
  </g>
  <line class="harness-pillars-line harness-pillars-conn harness-pillars-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#harness-pillars-tip)"/>
  <g class="harness-pillars-stage harness-pillars-s4">
    <rect class="harness-pillars-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="harness-pillars-step" x="800" y="142">05</text>
    <text class="harness-pillars-name" x="826" y="142">Persistence</text>
    <text class="harness-pillars-desc" x="800" y="166">Checkpoints, metrics and</text>
    <text class="harness-pillars-desc" x="800" y="182">artefacts.</text>
  </g>
  <text class="harness-pillars-sub" x="30" y="304">The separation is what makes the harness reusable across projects: each pillar can be swapped without touching the others, which is the difference between a framework and a script that happens to work.</text>
</svg>
