<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five pieces of metadata.">
  <title>What a run must record</title>
  <style>
    .experiment-metadata-bg   { fill: #f8fafc; }
    .experiment-metadata-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-metadata-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-metadata-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-metadata-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-metadata-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .experiment-metadata-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .experiment-metadata-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .experiment-metadata-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .experiment-metadata-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .experiment-metadata-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .experiment-metadata-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .experiment-metadata-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .experiment-metadata-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .experiment-metadata-stage { opacity: 1; }

    .experiment-metadata-s0 { animation-delay: 0.00s; }
    .experiment-metadata-e0 { animation-delay: 0.00s; }
    .experiment-metadata-s1 { animation-delay: 1.33s; }
    .experiment-metadata-e1 { animation-delay: 1.33s; }
    .experiment-metadata-s2 { animation-delay: 2.67s; }
    .experiment-metadata-e2 { animation-delay: 2.67s; }
    .experiment-metadata-s3 { animation-delay: 4.00s; }
    .experiment-metadata-e3 { animation-delay: 4.00s; }
    .experiment-metadata-s4 { animation-delay: 5.33s; }
    .experiment-metadata-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .experiment-metadata-conn  { animation: experiment-metadata-trace 8s ease-in-out infinite; }
      .experiment-metadata-stage { animation: experiment-metadata-arrive 8s ease-in-out infinite; }
    }
    @keyframes experiment-metadata-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes experiment-metadata-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .experiment-metadata-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .experiment-metadata-stage { animation: experiment-metadata-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes experiment-metadata-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="experiment-metadata-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="experiment-metadata-bg" width="980" height="322"/>
  <text class="experiment-metadata-h1"  x="30" y="40">What a run must record</text>
  <text class="experiment-metadata-sub" x="30" y="64">Five pieces of metadata.</text>
  <g class="experiment-metadata-stage experiment-metadata-s0">
    <rect class="experiment-metadata-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="experiment-metadata-step" x="44" y="142">01</text>
    <text class="experiment-metadata-name" x="70" y="142">The full configuration</text>
    <text class="experiment-metadata-desc" x="44" y="166">Every hyperparameter,</text>
    <text class="experiment-metadata-desc" x="44" y="182">serialised with the</text>
    <text class="experiment-metadata-desc" x="44" y="198">checkpoint.</text>
  </g>
  <line class="experiment-metadata-line experiment-metadata-conn experiment-metadata-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#experiment-metadata-tip)"/>
  <g class="experiment-metadata-stage experiment-metadata-s1">
    <rect class="experiment-metadata-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="experiment-metadata-step" x="233" y="142">02</text>
    <text class="experiment-metadata-name" x="259" y="142">The code version</text>
    <text class="experiment-metadata-desc" x="233" y="166">A commit hash. "The</text>
    <text class="experiment-metadata-desc" x="233" y="182">version on my machine" is</text>
    <text class="experiment-metadata-desc" x="233" y="198">not a version.</text>
  </g>
  <line class="experiment-metadata-line experiment-metadata-conn experiment-metadata-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#experiment-metadata-tip)"/>
  <g class="experiment-metadata-stage experiment-metadata-s2">
    <rect class="experiment-metadata-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="experiment-metadata-step" x="422" y="142">03</text>
    <text class="experiment-metadata-name" x="448" y="142">The data version</text>
    <text class="experiment-metadata-desc" x="422" y="166">Which snapshot, which</text>
    <text class="experiment-metadata-desc" x="422" y="182">split, which</text>
    <text class="experiment-metadata-desc" x="422" y="198">preprocessing.</text>
  </g>
  <line class="experiment-metadata-line experiment-metadata-conn experiment-metadata-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#experiment-metadata-tip)"/>
  <g class="experiment-metadata-stage experiment-metadata-s3">
    <rect class="experiment-metadata-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="experiment-metadata-step" x="611" y="142">04</text>
    <text class="experiment-metadata-name" x="637" y="142">The environment</text>
    <text class="experiment-metadata-desc" x="611" y="166">Library versions and</text>
    <text class="experiment-metadata-desc" x="611" y="182">hardware. Numerics differ</text>
    <text class="experiment-metadata-desc" x="611" y="198">between them.</text>
  </g>
  <line class="experiment-metadata-line experiment-metadata-conn experiment-metadata-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#experiment-metadata-tip)"/>
  <g class="experiment-metadata-stage experiment-metadata-s4">
    <rect class="experiment-metadata-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="experiment-metadata-step" x="800" y="142">05</text>
    <text class="experiment-metadata-name" x="826" y="142">The metrics</text>
    <text class="experiment-metadata-desc" x="800" y="166">Per epoch, not just the</text>
    <text class="experiment-metadata-desc" x="800" y="182">final number.</text>
  </g>
  <text class="experiment-metadata-sub" x="30" y="304">The data version is the one most often omitted and most often needed: a result that cannot be reproduced six months later is usually a dataset that changed rather than code that did.</text>
</svg>
