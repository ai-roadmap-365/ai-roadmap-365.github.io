terms:
  - term: 'state_dict'
    definition: 'A Python dictionary mapping each layer parameter and buffer tensor to its corresponding PyTorch Tensor values.'
  - term: 'Early Stopping'
    definition: 'A regularization technique that halts optimization when validation loss fails to improve after a set number of patience epochs.'
  - term: 'Patience'
    definition: 'The number of consecutive validation checks allowed without metric improvement before early stopping is triggered.'
  - term: 'Checkpointing'
    definition: 'Persisting complete training state (model, optimizer, scheduler, epoch) to disk to enable recovery and auditability.'
  - term: 'Deterministic Seeding'
    definition: 'Setting identical initial seed states across all random number generators to ensure identical execution results.'
  - term: 'Training Harness'
    definition: 'A structured software engine (Trainer class) orchestrating data loading, forward/backward passes, metric logging, and persistence.'
  - term: 'Generalization Gap'
    definition: 'The performance difference between training metric and validation metric, indicating the degree of overfitting.'
  - term: 'Atomic Serialization'
    definition: 'Saving checkpoints to a temporary file before renaming to prevent corrupted half-written files on crash.'
