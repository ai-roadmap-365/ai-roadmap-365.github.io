learning_promise: 'Synthesize all foundational deep learning principles into an industrial-grade PyTorch training harness: implement dataclass configuration, deterministic multi-library seeding, robust train/validation loops, atomic checkpointing with state_dict, and early stopping with best-weight recovery.'
objectives:
  - 'Architect an end-to-end modular PyTorch Trainer class separating data, model, optimization, and logging.'
  - 'Implement multi-library deterministic seeding across Python random, NumPy, PyTorch CPU, and CUDA backends.'
  - 'Serialize and deserialize complete training checkpoints containing model state_dict, optimizer state, scheduler state, and epoch counters.'
  - 'Implement an EarlyStopping controller with configurable patience, minimum delta, and automatic best-model restoration.'
  - 'Track and export structured JSON/CSV training metrics across epochs for reproducible auditing.'
