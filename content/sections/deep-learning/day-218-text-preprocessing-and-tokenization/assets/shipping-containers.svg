<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Everything fits, at some cost.">
  <title>Standardised shipping containers</title>
  <style>
    .shipping-containers-bg   { fill: #f8fafc; }
    .shipping-containers-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-containers-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-containers-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-containers-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-containers-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shipping-containers-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shipping-containers-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .shipping-containers-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .shipping-containers-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .shipping-containers-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .shipping-containers-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .shipping-containers-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .shipping-containers-row { opacity: 1; }
    .shipping-containers-r0 { animation-delay: 0.00s; }
    .shipping-containers-r1 { animation-delay: 0.45s; }
    .shipping-containers-r2 { animation-delay: 0.90s; }
    .shipping-containers-r3 { animation-delay: 1.35s; }
    .shipping-containers-r4 { animation-delay: 1.80s; }
    .shipping-containers-row { animation: shipping-containers-reveal 7.3s ease-in-out infinite; }
    @keyframes shipping-containers-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="shipping-containers-bg" width="980" height="390"/>
  <text class="shipping-containers-h1"  x="30" y="40">Standardised shipping containers</text>
  <text class="shipping-containers-sub" x="30" y="64">Everything fits, at some cost.</text>
  <rect class="shipping-containers-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="shipping-containers-name" x="46" y="122">Bespoke packaging</text>
  <text class="shipping-containers-desc" x="46" y="142">Nothing wasted.</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r0" x="46" y="182">Each item packed to its own size</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r1" x="46" y="216">No empty space at all</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r2" x="46" y="250">Every crate handled differently</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r3" x="46" y="284">Cannot be stacked or automated</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r4" x="46" y="318">This is per-sample processing</text>
  <rect class="shipping-containers-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="shipping-containers-name" x="526" y="122">Standard containers</text>
  <text class="shipping-containers-desc" x="526" y="142">Some empty space.</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r0" x="526" y="182">Everything fits a fixed size</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r1" x="526" y="216">Small items leave the container part-empty</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r2" x="526" y="250">Oversized items must be split</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r3" x="526" y="284">Stackable, and machine-handled</text>
  <text class="shipping-containers-desc shipping-containers-row shipping-containers-r4" x="526" y="318">This is a padded batch</text>
  <text class="shipping-containers-sub" x="30" y="372">Choosing the container size per shipment rather than globally is the per-batch padding decision, and it is the difference between a little waste and a great deal of it.</text>
</svg>
