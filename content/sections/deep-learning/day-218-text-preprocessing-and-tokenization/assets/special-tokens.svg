<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Reserved slots with structural meaning.">
  <title>Special tokens</title>
  <style>
    .special-tokens-bg   { fill: #f8fafc; }
    .special-tokens-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .special-tokens-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .special-tokens-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .special-tokens-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .special-tokens-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .special-tokens-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .special-tokens-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .special-tokens-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .special-tokens-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .special-tokens-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .special-tokens-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .special-tokens-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .special-tokens-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .special-tokens-stage { opacity: 1; }

    .special-tokens-s0 { animation-delay: 0.00s; }
    .special-tokens-e0 { animation-delay: 0.00s; }
    .special-tokens-s1 { animation-delay: 1.28s; }
    .special-tokens-e1 { animation-delay: 1.28s; }
    .special-tokens-s2 { animation-delay: 2.56s; }
    .special-tokens-e2 { animation-delay: 2.56s; }
    .special-tokens-s3 { animation-delay: 3.84s; }
    .special-tokens-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .special-tokens-conn  { animation: special-tokens-trace 6.4s ease-in-out infinite; }
      .special-tokens-stage { animation: special-tokens-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes special-tokens-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes special-tokens-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .special-tokens-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .special-tokens-stage { animation: special-tokens-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes special-tokens-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="special-tokens-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="special-tokens-bg" width="980" height="322"/>
  <text class="special-tokens-h1"  x="30" y="40">Special tokens</text>
  <text class="special-tokens-sub" x="30" y="64">Reserved slots with structural meaning.</text>
  <g class="special-tokens-stage special-tokens-s0">
    <rect class="special-tokens-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="special-tokens-step" x="44" y="142">01</text>
    <text class="special-tokens-name" x="70" y="142">Padding</text>
    <text class="special-tokens-desc" x="44" y="166">Fills short sequences to a</text>
    <text class="special-tokens-desc" x="44" y="182">common length, and is masked</text>
    <text class="special-tokens-desc" x="44" y="198">out.</text>
  </g>
  <line class="special-tokens-line special-tokens-conn special-tokens-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#special-tokens-tip)"/>
  <g class="special-tokens-stage special-tokens-s1">
    <rect class="special-tokens-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="special-tokens-step" x="280" y="142">02</text>
    <text class="special-tokens-name" x="306" y="142">Sequence boundaries</text>
    <text class="special-tokens-desc" x="280" y="166">Start and end markers, so the</text>
    <text class="special-tokens-desc" x="280" y="182">model knows where text begins</text>
    <text class="special-tokens-desc" x="280" y="198">and stops.</text>
  </g>
  <line class="special-tokens-line special-tokens-conn special-tokens-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#special-tokens-tip)"/>
  <g class="special-tokens-stage special-tokens-s2">
    <rect class="special-tokens-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="special-tokens-step" x="516" y="142">03</text>
    <text class="special-tokens-name" x="542" y="142">Unknown</text>
    <text class="special-tokens-desc" x="516" y="166">Rarely needed with byte-level</text>
    <text class="special-tokens-desc" x="516" y="182">vocabularies, and reserved</text>
    <text class="special-tokens-desc" x="516" y="198">anyway.</text>
    <text class="special-tokens-edge" x="516" y="242">legacy</text>
  </g>
  <line class="special-tokens-line special-tokens-conn special-tokens-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#special-tokens-tip)"/>
  <g class="special-tokens-stage special-tokens-s3">
    <rect class="special-tokens-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="special-tokens-step" x="752" y="142">04</text>
    <text class="special-tokens-name" x="778" y="142">Task markers</text>
    <text class="special-tokens-desc" x="752" y="166">Separators, classification</text>
    <text class="special-tokens-desc" x="752" y="182">slots, and chat role delimiters.</text>
  </g>
  <text class="special-tokens-sub" x="30" y="304">The chat role delimiters are the modern addition worth noticing: the conversation structure a chat model relies on is expressed as special tokens, not as formatting the model infers.</text>
</svg>
