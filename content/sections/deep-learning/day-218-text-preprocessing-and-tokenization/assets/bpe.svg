<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Merge the most frequent pair, repeatedly.">
  <title>How byte-pair encoding learns a vocabulary</title>
  <style>
    .bpe-bg   { fill: #f8fafc; }
    .bpe-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpe-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpe-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpe-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpe-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bpe-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bpe-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bpe-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bpe-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bpe-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bpe-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bpe-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .bpe-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .bpe-stage { opacity: 1; }

    .bpe-s0 { animation-delay: 0.00s; }
    .bpe-e0 { animation-delay: 0.00s; }
    .bpe-s1 { animation-delay: 1.28s; }
    .bpe-e1 { animation-delay: 1.28s; }
    .bpe-s2 { animation-delay: 2.56s; }
    .bpe-e2 { animation-delay: 2.56s; }
    .bpe-s3 { animation-delay: 3.84s; }
    .bpe-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .bpe-conn  { animation: bpe-trace 6.4s ease-in-out infinite; }
      .bpe-stage { animation: bpe-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes bpe-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes bpe-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .bpe-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .bpe-stage { animation: bpe-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes bpe-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="bpe-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="bpe-bg" width="980" height="322"/>
  <text class="bpe-h1"  x="30" y="40">How byte-pair encoding learns a vocabulary</text>
  <text class="bpe-sub" x="30" y="64">Merge the most frequent pair, repeatedly.</text>
  <g class="bpe-stage bpe-s0">
    <rect class="bpe-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="bpe-step" x="44" y="142">01</text>
    <text class="bpe-name" x="70" y="142">Start from characters</text>
    <text class="bpe-desc" x="44" y="166">Every word split into individual</text>
    <text class="bpe-desc" x="44" y="182">symbols.</text>
  </g>
  <line class="bpe-line bpe-conn bpe-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#bpe-tip)"/>
  <g class="bpe-stage bpe-s1">
    <rect class="bpe-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="bpe-step" x="280" y="142">02</text>
    <text class="bpe-name" x="306" y="142">Count adjacent pairs</text>
    <text class="bpe-desc" x="280" y="166">Across the whole corpus,</text>
    <text class="bpe-desc" x="280" y="182">weighted by word frequency.</text>
  </g>
  <line class="bpe-line bpe-conn bpe-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#bpe-tip)"/>
  <g class="bpe-stage bpe-s2">
    <rect class="bpe-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="bpe-step" x="516" y="142">03</text>
    <text class="bpe-name" x="542" y="142">Merge the most frequent, and repeat</text>
    <text class="bpe-desc" x="516" y="166">Until the vocabulary reaches the</text>
    <text class="bpe-desc" x="516" y="182">target size.</text>
    <text class="bpe-edge" x="516" y="242">iterative</text>
  </g>
  <line class="bpe-line bpe-conn bpe-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#bpe-tip)"/>
  <g class="bpe-stage bpe-s3">
    <rect class="bpe-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="bpe-step" x="752" y="142">04</text>
    <text class="bpe-name" x="778" y="142">At inference, replay the merges in order</text>
    <text class="bpe-desc" x="752" y="166">The same rules, applied in the</text>
    <text class="bpe-desc" x="752" y="182">order they were learned.</text>
  </g>
  <text class="bpe-sub" x="30" y="304">Replaying merges in discovery order is what makes encoding deterministic: the vocabulary alone is not enough, and the ordered merge list is part of the tokeniser.</text>
</svg>
