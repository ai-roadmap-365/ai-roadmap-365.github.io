questions:
  - question: 'Why have subword tokenization algorithms (such as Byte-Pair Encoding and WordPiece) completely superseded word-level tokenization in modern deep learning and LLMs?'
    options:
      - 'Subword keeps the vocabulary small with no OOV tokens'
      - 'Subword tokenization eliminates the need for GPUs'
      - 'Word-level tokenization cannot process English words'
      - 'Subword tokenization compresses text files on disk by 99%'
    answer_index: 0
    explanation: 'Subword algorithms handle rare and unseen compound words by breaking them into familiar root subwords, keeping vocabularies bounded.'
  - question: 'What is the core iterative mechanism of the Byte-Pair Encoding (BPE) vocabulary training algorithm?'
    options:
      - 'Compute the gradient descent of word loss'
      - 'Merge the most frequent adjacent pair, repeatedly'
      - 'Randomly delete vowels from the text corpus'
      - 'Sort words alphabetically and pick the top 50,000'
    answer_index: 1
    explanation: 'BPE iteratively finds the most frequent adjacent bigram in the segmented corpus and replaces all occurrences with a newly minted merged token.'
  - question: 'What is the purpose of the special token <pad> (Padding) in batch sequence processing for neural networks?'
    options:
      - 'It speeds up tokenization by skipping punctuation'
      - 'It encrypts the text input'
      - 'It pads short sequences so the batch is rectangular'
      - 'It marks the beginning of a document'
    answer_index: 2
    explanation: 'Neural networks require rectangular batch tensors; padding fills empty sequence slots and is masked during attention and loss computation.'
  - question: 'How does Byte-level BPE (as used in GPT-2, RoBERTa, and GPT-4) guarantee zero Out-Of-Vocabulary (OOV) tokens for any arbitrary unicode text?'
    options:
      - 'It replaces unknown symbols with spaces'
      - 'It downloads a dictionary of every language in the world'
      - 'It ignores non-English characters'
      - 'It starts from all 256 bytes, so any text is representable'
    answer_index: 3
    explanation: 'Because every Unicode character decomposes into UTF-8 bytes (0-255), starting BPE at the byte level means every string has a valid byte decomposition.'
  - question: 'Why is Unicode normalization (e.g. NFC or NFKD) an essential preprocessing step before text tokenization?'
    options:
      - 'Identical-looking characters can have different codepoints'
      - 'It translates text into English automatically'
      - 'It converts lowercase letters to uppercase'
      - 'It strips HTML tags from raw web pages'
    answer_index: 0
    explanation: 'Unicode normalization converts distinct byte representations of equivalent characters (e.g. precomposed vs decomposed accents) into a canonical form.'
