learning_promise: 'Master the fundamental bridge between raw human text and deep sequence models: implement whitespace, regex, character, and Byte-Pair Encoding (BPE) tokenizers from scratch, manage special tokens and vocabularies, and eliminate out-of-vocabulary failures.'
objectives:
  - 'Differentiate the tradeoffs between word-level, character-level, and subword tokenization algorithms.'
  - 'Implement a Byte-Pair Encoding (BPE) merge training loop from first principles in pure Python.'
  - 'Structure vocabulary registries with special tokens (<pad>, <unk>, <bos>, <eos>) and handle OOV fallbacks.'
  - 'Apply Unicode normalization (NFC/NFKD) and regex pre-tokenization rules used in GPT-2 and Llama tokenizers.'
  - 'Encode, pad, and truncate variable-length text sequences into fixed PyTorch tensor batches.'
