visuals:
  - id: tokenization-strategies-comparison
    file: assets/tokenization-strategies-comparison.svg
    type: diagram
    title: 'Tokenization Strategies: Word vs Character vs Subword'
    alt: Comparison of character level word level and subword tokenization strategies showing vocabulary size out of vocabulary handling and sequence length tradeoffs
    description: 'Comparative analysis of word-level, character-level, and subword (BPE/WordPiece) tokenization strategies across vocabulary size, sequence length, and OOV rates.'
  - id: bpe-merge-mechanics
    file: assets/bpe-merge-mechanics.svg
    type: diagram
    title: 'Byte-Pair Encoding (BPE) Iterative Merge Mechanics'
    alt: Byte Pair Encoding BPE merge algorithm iterating over character pairs merging most frequent bigrams into vocabulary
    description: 'Step-by-step trace of the Byte-Pair Encoding algorithm: base alphabet initialization, frequency counting, and iterative bigram merging.'
  - id: tokenisation-role
    file: assets/tokenisation-role.svg
    type: diagram
    title: 'What a tokeniser does'
    alt: 'Diagram: the role of a tokeniser between text and a model'
    description: 'A four-stage description of tokenisation covering the mapping, its reversibility, the vocabulary trade-off and the absence of meaning.'
  - id: words-or-subwords
    file: assets/words-or-subwords.svg
    type: diagram
    title: 'Words, characters, or subwords'
    alt: 'Diagram: word-level, character-level and subword tokenisation compared'
    description: 'A two-column comparison of word and character tokenisation extremes against subword tokenisation.'
  - id: bpe
    file: assets/bpe.svg
    type: diagram
    title: 'How byte-pair encoding learns a vocabulary'
    alt: 'Diagram: the byte-pair encoding training and encoding procedures'
    description: 'A four-stage description of BPE covering character initialisation, frequency counting, iterative merging and inference-time encoding.'
  - id: special-tokens
    file: assets/special-tokens.svg
    type: diagram
    title: 'Special tokens'
    alt: 'Diagram: the special tokens reserved in a sequence pipeline'
    description: 'A four-stage description of special tokens covering padding, sequence boundaries, unknown handling and task-specific markers.'
  - id: padding-masks
    file: assets/padding-masks.svg
    type: diagram
    title: 'Batching variable-length text'
    alt: 'Diagram: padding, truncation and attention masking for batched sequences'
    description: 'A four-stage description of sequence batching covering padding, the mask, truncation and the per-batch length choice.'
  - id: tokeniser-algorithms
    file: assets/tokeniser-algorithms.svg
    type: diagram
    title: 'Three subword algorithms'
    alt: 'Diagram: byte-pair encoding compared with WordPiece and unigram tokenisation'
    description: 'A two-column comparison of frequency-based merging against likelihood-based subword selection.'
  - id: shipping-containers
    file: assets/shipping-containers.svg
    type: diagram
    title: 'Standardised shipping containers'
    alt: 'Diagram: standardised containers as an analogy for fixed-length tokenised batches'
    description: 'A two-column comparison of bespoke packaging against standardised containers, as an analogy for padding and truncation.'
  - id: tokeniser-pitfalls
    file: assets/tokeniser-pitfalls.svg
    type: diagram
    title: 'Four failures tokenisation explains'
    alt: 'Diagram: the language model behaviours that tokenisation explains'
    description: 'A four-stage description of tokenisation-caused model behaviours covering arithmetic, character counting, rare strings and multilingual efficiency.'
  - id: tokenisation-implications
    file: assets/tokenisation-implications.svg
    type: diagram
    title: 'Four consequences of the tokeniser'
    alt: 'Diagram: the cost, context, security and portability implications of tokenisation'
    description: 'A four-stage description of tokenisation implications covering billing, context windows, adversarial inputs and tokeniser-model coupling.'
  - id: tokenisation-when
    file: assets/tokenisation-when.svg
    type: diagram
    title: 'When to think about tokenisation'
    alt: 'Diagram: when tokeniser choices matter'
    description: 'A two-column comparison of situations where tokenisation decisions matter against those where the default suffices.'
