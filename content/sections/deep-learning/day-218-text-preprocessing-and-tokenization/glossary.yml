terms:
  - term: 'Tokenization'
    definition: 'The computational process of segmenting a continuous raw string of text into discrete numerical units (tokens).'
  - term: 'Byte-Pair Encoding (BPE)'
    definition: 'A subword tokenization algorithm that iteratively merges the most frequent pairs of adjacent characters or tokens.'
  - term: 'Out-Of-Vocabulary (OOV)'
    definition: 'Words or symbols encountered during inference that do not exist in the models pre-trained vocabulary registry.'
  - term: 'Special Tokens'
    definition: 'Reserved structural markers (<pad>, <unk>, <bos>, <eos>, <mask>) used to indicate sequence boundaries and control flags.'
  - term: 'Unicode Normalization'
    definition: 'Standardizing Unicode text strings (NFC/NFKD) so equivalent character representations share identical binary bytes.'
  - term: 'WordPiece'
    definition: 'A subword segmentation algorithm (used in BERT) that chooses pair merges maximizing training data language model likelihood.'
  - term: 'SentencePiece'
    definition: 'A language-independent tokenizer that treats the input text as a raw stream of characters including whitespace as a meta-symbol.'
  - term: 'Attention Mask'
    definition: 'A binary mask tensor indicating which tokens are valid sequence content (1) versus padding tokens (0) to be ignored.'
