terms:
  - term: 'Paper Reproduction'
    definition: 'The independent implementation and empirical validation of a published scientific machine learning algorithm from textual descriptions and code.'
  - term: 'Ablation Study'
    definition: 'An experimental control protocol systematically disabling specific model components to quantify their individual contribution to overall performance.'
  - term: 'Overfit Single Batch'
    definition: 'A fundamental debugging sanity test verifying that a model can drive training loss to zero on 16-32 fixed samples.'
  - term: 'Seed Sensitivity'
    definition: 'The variance in final evaluation metrics caused purely by different pseudorandom number generator initializations.'
  - term: 'Hidden Hyperparameters'
    definition: 'Crucial training parameters (such as Adam epsilon, gradient clipping thresholds, or warmup schedules) omitted from published paper text.'
  - term: 'Reproduction Discrepancy'
    definition: 'The measurable divergence between claimed published performance and independently observed experimental metrics.'
  - term: 'Negative Result'
    definition: 'An empirical finding showing that a proposed technique fails to deliver claimed improvements under controlled baseline comparisons.'
  - term: 'Reproducibility Checklist'
    definition: 'A formalized verification protocol documenting code, data, dependencies, hyperparameter search ranges, and statistical significance.'
