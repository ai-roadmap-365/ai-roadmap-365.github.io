<svg role="img" aria-label="Scientific paper reproduction methodology workflow diagram showing 6 rigorous stages from paper deconstruction to reproduction report" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <title>Scientific Paper Reproduction Protocol</title>
  <defs>
    <linearGradient id="bg238a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card238" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="850" height="430" fill="url(#bg238a)" rx="12"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SCIENTIFIC PAPER REPRODUCTION METHODOLOGY</text>
  <text x="425" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Rigorous 6-Stage Framework for Validating Published Deep Learning Claims</text>
  <g transform="translate(35, 85)">
    <rect width="780" height="305" fill="url(#card238)" stroke="#475569" stroke-width="1.5" rx="8"/>
    
    <!-- Stage 1 -->
    <rect x="20" y="25" width="230" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="135" y="48" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Stage 1: Paper Deconstruction</text>
    <text x="35" y="70" fill="#cbd5e1" font-size="8">• Identify Primary Claim &amp; Metrics</text>
    <text x="35" y="88" fill="#cbd5e1" font-size="8">• Extract Hidden Hyperparameters</text>
    <text x="35" y="106" fill="#cbd5e1" font-size="8">• Check Weight Initialization Rules</text>
    <text x="35" y="124" fill="#94a3b8" font-size="8">• Audit Tokenizer &amp; Vocab Specs</text>

    <!-- Stage 2 -->
    <rect x="275" y="25" width="230" height="120" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="390" y="48" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Stage 2: Data &amp; Split Alignment</text>
    <text x="290" y="70" fill="#cbd5e1" font-size="8">• Replicate Exact Data Preprocessing</text>
    <text x="290" y="88" fill="#cbd5e1" font-size="8">• Match Train / Val / Test Splits</text>
    <text x="290" y="106" fill="#cbd5e1" font-size="8">• Compute Data SHA-256 Hashes</text>
    <text x="290" y="124" fill="#94a3b8" font-size="8">• Verify Zero Label Leakage</text>

    <!-- Stage 3 -->
    <rect x="530" y="25" width="230" height="120" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="645" y="48" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Stage 3: Verification Harness</text>
    <text x="545" y="70" fill="#cbd5e1" font-size="8">• Unit Test Tensor Shapes &amp; Heads</text>
    <text x="545" y="88" fill="#cbd5e1" font-size="8">• Overfit Single Batch to Zero Loss</text>
    <text x="545" y="106" fill="#cbd5e1" font-size="8">• Instrument Structured JSONL Logger</text>
    <text x="545" y="124" fill="#94a3b8" font-size="8">• Set Deterministic PRNG Seeds</text>

    <!-- Stage 4 -->
    <rect x="20" y="160" width="230" height="120" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <text x="135" y="183" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">Stage 4: Controlled Training</text>
    <text x="35" y="205" fill="#cbd5e1" font-size="8">• Train across 3+ Random Seeds</text>
    <text x="35" y="223" fill="#cbd5e1" font-size="8">• Monitor Dynamic Loss Scaling</text>
    <text x="35" y="241" fill="#cbd5e1" font-size="8">• Save Best Checkpoints + Sidecars</text>
    <text x="35" y="259" fill="#94a3b8" font-size="8">• Track MFU Hardware Telemetry</text>

    <!-- Stage 5 -->
    <rect x="275" y="160" width="230" height="120" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="390" y="183" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Stage 5: Ablation Studies</text>
    <text x="290" y="205" fill="#cbd5e1" font-size="8">• Isolate Key Architectural Claims</text>
    <text x="290" y="223" fill="#cbd5e1" font-size="8">• Remove Component (e.g. Pre-LN)</text>
    <text x="290" y="241" fill="#cbd5e1" font-size="8">• Compare Against Baseline Controls</text>
    <text x="290" y="259" fill="#94a3b8" font-size="8">• Quantify Marginal Gain of Novelty</text>

    <!-- Stage 6 -->
    <rect x="530" y="160" width="230" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="645" y="183" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Stage 6: Reproduction Report</text>
    <text x="545" y="205" fill="#cbd5e1" font-size="8">• Report Mean ± Std Across Seeds</text>
    <text x="545" y="223" fill="#cbd5e1" font-size="8">• Document Unclaimed Gotchas</text>
    <text x="545" y="241" fill="#cbd5e1" font-size="8">• State Discrepancies with Honesty</text>
    <text x="545" y="259" fill="#38bdf8" font-size="8" font-weight="700">• Publish Code &amp; Log Artifacts</text>
  </g>
</svg>
