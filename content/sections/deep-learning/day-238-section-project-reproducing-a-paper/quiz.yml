questions:
  - question: 'What is the "First Milestone" when attempting to reproduce a published neural network architecture in PyTorch?'
    options:
      - 'Writing a tweet about the paper'
      - 'Buying 1,000 GPUs immediately'
      - 'Submitting a paper to NeurIPS'
      - 'Overfit a single mini-batch'
    answer_index: 3
    explanation: 'Overfitting a single batch proves that model capacity and gradient backpropagation are bug-free before spending compute.'
  - question: 'Why is it critical to report the mean and standard deviation across multiple random seeds (e.g. 3-5 seeds) in a reproduction study?'
    options:
      - 'Small models are very sensitive to the seed'
      - 'Because PyTorch requires 5 seeds to compile'
      - 'Because seeds increase GPU memory'
      - 'Because random seeds change the programming language'
    answer_index: 0
    explanation: 'Multi-seed evaluation prevents false claims caused by lucky random initialization or cherry-picking.'
  - question: 'What is the purpose of an Ablation Study in deep learning research?'
    options:
      - 'To delete corrupted training data'
      - 'To isolate each component''s effect'
      - 'To speed up downloading weights'
      - 'To reduce electricity bills'
    answer_index: 1
    explanation: 'Ablations verify which specific component is responsible for claimed empirical gains.'
  - question: 'What constitutes an "Honest Reproduction Report" when empirical results fall short of published claims?'
    options:
      - 'Deleting the code repository'
      - 'Falsifying numbers to match the published paper'
      - 'A report comparing observed against claimed metrics'
      - 'Blaming the GPU manufacturer'
    answer_index: 2
    explanation: 'Scientific integrity requires transparently documenting gaps between published claims and observed results.'
  - question: 'Which hidden hyperparameter is most frequently omitted in academic NLP papers but dramatically alters Transformer training stability?'
    options:
      - 'The operating system wallpaper'
      - 'The computer monitor resolution'
      - 'The font size in the code editor'
      - 'Adam''s epsilon and warmup steps'
    answer_index: 3
    explanation: 'Adam epsilon and warmup schedules are critical to Transformer stability and often omitted in papers.'
