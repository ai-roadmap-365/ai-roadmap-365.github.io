visuals:
  - id: scientific-paper-reproduction-protocol
    file: assets/scientific-paper-reproduction-protocol.svg
    type: diagram
    title: 'Scientific Paper Reproduction Protocol'
    alt: Scientific paper reproduction methodology workflow diagram showing 6 rigorous stages from paper deconstruction to reproduction report
    description: 'A 6-stage engineering framework for reproducing published deep learning results: deconstruction, data alignment, verification harness, training, ablations, and reporting.'
  - id: reproduction-discrepancy-taxonomy-radar
    file: assets/reproduction-discrepancy-taxonomy-radar.svg
    type: diagram
    title: 'Reproduction Discrepancy Taxonomy'
    alt: Reproduction discrepancy taxonomy radar comparing published claimed metrics against observed experimental results
    description: 'Taxonomy of root causes explaining why reproduced empirical results diverge from published academic literature.'
  - id: repro-protocol
    file: assets/repro-protocol.svg
    type: diagram
    title: 'Reproducing a paper'
    alt: 'Diagram: the six stages of reproducing a published machine learning result'
    description: 'A six-stage description of paper reproduction covering reading, data, implementation, single-batch verification, the full run and comparison.'
  - id: repro-vs-reimpl
    file: assets/repro-vs-reimpl.svg
    type: diagram
    title: 'Reproduction against reimplementation'
    alt: 'Diagram: reproducing a published result compared with reimplementing a method'
    description: 'A two-column comparison of reproducing a result against reimplementing a technique.'
  - id: discrepancy
    file: assets/discrepancy.svg
    type: diagram
    title: 'Where the numbers diverge'
    alt: 'Diagram: the four common causes of a reproduction failing to match published numbers'
    description: 'A four-stage description of reproduction discrepancies covering implementation bugs, unstated details, evaluation differences and genuine variance.'
  - id: significance
    file: assets/significance.svg
    type: diagram
    title: 'Is the difference real'
    alt: 'Diagram: how run-to-run variance determines whether a measured improvement is meaningful'
    description: 'A four-stage description of significance testing covering single-run comparison, seed variance, repeated runs and the confidence interval.'
  - id: recipe
    file: assets/recipe.svg
    type: diagram
    title: 'Cooking from a published recipe'
    alt: 'Diagram: following a written recipe compared with watching it made'
    description: 'A two-column comparison of following written instructions against learning from demonstration.'
  - id: repro-ci
    file: assets/repro-ci.svg
    type: diagram
    title: 'Continuous verification'
    alt: 'Diagram: the four automated checks that keep a training pipeline reproducible'
    description: 'A four-stage description of continuous integration for models covering the fast smoke run, metric thresholds, environment pinning and failure alerts.'
  - id: repro-implications
    file: assets/repro-implications.svg
    type: diagram
    title: 'Four consequences of reproduction work'
    alt: 'Diagram: the learning, credibility, cost and publication implications of reproduction'
    description: 'A four-stage description of reproduction implications covering skill development, verification of claims, compute cost and publication norms.'
  - id: repro-when
    file: assets/repro-when.svg
    type: diagram
    title: 'When to reproduce a paper'
    alt: 'Diagram: when reproducing a published result is worth the effort'
    description: 'A two-column comparison of situations warranting a full reproduction against those where it is not worthwhile.'
  - id: repro-history
    file: assets/repro-history.svg
    type: diagram
    title: 'Four steps toward reproducible research'
    alt: 'Diagram: the historical progression of reproducibility practice in machine learning'
    description: 'A four-stage description of reproducibility history covering unreleased code, the reproducibility crisis, checklists and reproduction as publication.'
  - id: repro-vs-ablation
    file: assets/repro-vs-ablation.svg
    type: diagram
    title: 'Reproduction against ablation'
    alt: 'Diagram: reproducing a result compared with ablating its components'
    description: 'A two-column comparison of reproducing a published number against ablating the method''s components.'
