learning_promise: 'Synthesize all deep learning and transformer concepts by executing an end-to-end scientific paper reproduction: master the 6-stage reproduction protocol, audit published architectures for hidden hyperparameters and data leakage, construct an isolated PyTorch training and verification harness, execute multi-seed controlled trials, conduct ablation experiments to isolate the source of performance gains, and write an honest reproduction report.'
objectives:
  - 'Execute the 6-stage scientific deep learning paper reproduction protocol.'
  - 'Deconstruct academic papers to uncover undocumented hyperparameters, initialization schemes, and data preprocessing quirks.'
  - 'Build a clean, reproducible PyTorch experimental harness with seed averaging and structured JSONL logging.'
  - 'Design and execute controlled ablation studies to isolate the true source of empirical improvements.'
  - 'Author an honest reproduction report documenting both successful replications and unresolved discrepancies.'
