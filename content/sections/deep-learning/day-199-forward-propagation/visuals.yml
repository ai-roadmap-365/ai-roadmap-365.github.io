visuals:
  - id: vectorized-forward-propagation-architecture
    file: assets/vectorized-forward-propagation-architecture.svg
    type: diagram
    title: Vectorized Multi-Layer Forward Propagation Architecture
    alt: Vectorized multi layer forward propagation computational graph showing input layer hidden activations linear transformations and output loss
    description: Computational graph showing layer-by-layer linear transformations, activation caching, and output loss computation in multi-layer neural networks.
  - id: matrix-dimension-compatibility-rules
    file: assets/matrix-dimension-compatibility-rules.svg
    type: diagram
    title: Vectorized Matrix Dimension Compatibility Rules
    alt: Matrix dimension alignment and batch tensor shapes across neural network forward propagation layers
    description: Mathematical dimensional contract illustrating matrix multiplication shapes (n^[l], n^[l-1]) x (n^[l-1], m) + (n^[l], 1) across batch forward passes.
  - id: forward-pass-loop
    file: assets/forward-pass-loop.svg
    type: diagram
    title: 'One layer, two operations'
    alt: 'Diagram: the two operations that make up one layer of a forward pass'
    description: 'A four-stage description of a forward pass covering the linear transformation, the activation, the repetition across layers and the final loss.'
  - id: loop-or-vectorised
    file: assets/loop-or-vectorised.svg
    type: diagram
    title: 'One sample at a time, or a batch'
    alt: 'Diagram: per-sample scalar loops compared with vectorised batch matrix multiplication'
    description: 'A two-column comparison of processing samples individually against processing a batch as one matrix operation.'
  - id: forward-lineage
    file: assets/forward-lineage.svg
    type: diagram
    title: 'Four steps to the modern forward pass'
    alt: 'Diagram: the progression from early multi-layer networks to GPU-vectorised forward passes'
    description: 'A four-stage progression of forward propagation from the Group Method of Data Handling through backpropagation and deep architectures to GPU vectorisation.'
  - id: shape-contracts
    file: assets/shape-contracts.svg
    type: diagram
    title: 'The shape contract'
    alt: 'Diagram: the matrix shape contract of one layer in a vectorised forward pass'
    description: 'A four-stage description of layer shape contracts covering the weight matrix, the input batch, the inner dimension and bias broadcasting.'
  - id: caching-activations
    file: assets/caching-activations.svg
    type: diagram
    title: 'Why the forward pass caches'
    alt: 'Diagram: why intermediate activations are cached during a forward pass'
    description: 'A four-stage description of activation caching covering what is stored, why backpropagation needs it, the memory cost and the inference difference.'
  - id: loss-functions
    file: assets/loss-functions.svg
    type: diagram
    title: 'Two losses, one pattern'
    alt: 'Diagram: categorical and binary cross-entropy losses compared'
    description: 'A three-stage description of cross-entropy losses covering the multi-class case, the binary case and the numerical stability guard.'
  - id: assembly-line
    file: assets/assembly-line.svg
    type: diagram
    title: 'An assembly line'
    alt: 'Diagram: an assembly line as an analogy for layered forward propagation'
    description: 'A two-column comparison of assembly line stations against neural network layers.'
  - id: forward-not-training
    file: assets/forward-not-training.svg
    type: diagram
    title: 'A forward pass is not training'
    alt: 'Diagram: forward propagation compared with training and with recurrent computation'
    description: 'A two-column comparison of what forward propagation does against two things it is confused with.'
  - id: forward-implications
    file: assets/forward-implications.svg
    type: diagram
    title: 'Four consequences of the forward pass'
    alt: 'Diagram: the memory, throughput, precision and determinism implications of forward propagation'
    description: 'A four-stage description of forward pass implications covering activation memory, batch throughput, numerical precision and reproducibility.'
  - id: forward-when
    file: assets/forward-when.svg
    type: diagram
    title: 'Where the forward pass is the cost'
    alt: 'Diagram: when forward pass efficiency dominates and when it does not'
    description: 'A two-column comparison of workloads dominated by forward pass cost against those dominated by other stages.'
