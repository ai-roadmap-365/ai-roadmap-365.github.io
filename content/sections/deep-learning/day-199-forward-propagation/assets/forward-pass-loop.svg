<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Repeated, and that is the whole pass.">
  <title>One layer, two operations</title>
  <style>
    .forward-pass-loop-bg   { fill: #f8fafc; }
    .forward-pass-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-pass-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-pass-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-pass-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-pass-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-pass-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-pass-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forward-pass-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forward-pass-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forward-pass-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forward-pass-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forward-pass-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forward-pass-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forward-pass-loop-stage { opacity: 1; }

    .forward-pass-loop-s0 { animation-delay: 0.00s; }
    .forward-pass-loop-e0 { animation-delay: 0.00s; }
    .forward-pass-loop-s1 { animation-delay: 1.28s; }
    .forward-pass-loop-e1 { animation-delay: 1.28s; }
    .forward-pass-loop-s2 { animation-delay: 2.56s; }
    .forward-pass-loop-e2 { animation-delay: 2.56s; }
    .forward-pass-loop-s3 { animation-delay: 3.84s; }
    .forward-pass-loop-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forward-pass-loop-conn  { animation: forward-pass-loop-trace 6.4s ease-in-out infinite; }
      .forward-pass-loop-stage { animation: forward-pass-loop-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forward-pass-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forward-pass-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forward-pass-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forward-pass-loop-stage { animation: forward-pass-loop-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forward-pass-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forward-pass-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forward-pass-loop-bg" width="980" height="322"/>
  <text class="forward-pass-loop-h1"  x="30" y="40">One layer, two operations</text>
  <text class="forward-pass-loop-sub" x="30" y="64">Repeated, and that is the whole pass.</text>
  <g class="forward-pass-loop-stage forward-pass-loop-s0">
    <rect class="forward-pass-loop-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forward-pass-loop-step" x="44" y="142">01</text>
    <text class="forward-pass-loop-name" x="70" y="142">Linear: Z = WA + b</text>
    <text class="forward-pass-loop-desc" x="44" y="166">A matrix multiply and a</text>
    <text class="forward-pass-loop-desc" x="44" y="182">broadcast add. This is where the</text>
    <text class="forward-pass-loop-desc" x="44" y="198">parameters are.</text>
  </g>
  <line class="forward-pass-loop-line forward-pass-loop-conn forward-pass-loop-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forward-pass-loop-tip)"/>
  <g class="forward-pass-loop-stage forward-pass-loop-s1">
    <rect class="forward-pass-loop-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forward-pass-loop-step" x="280" y="142">02</text>
    <text class="forward-pass-loop-name" x="306" y="142">Non-linear: A = g(Z)</text>
    <text class="forward-pass-loop-desc" x="280" y="166">Element-wise. Without it, the</text>
    <text class="forward-pass-loop-desc" x="280" y="182">layers collapse — Day 198.</text>
    <text class="forward-pass-loop-edge" x="280" y="242">the activation</text>
  </g>
  <line class="forward-pass-loop-line forward-pass-loop-conn forward-pass-loop-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forward-pass-loop-tip)"/>
  <g class="forward-pass-loop-stage forward-pass-loop-s2">
    <rect class="forward-pass-loop-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forward-pass-loop-step" x="516" y="142">03</text>
    <text class="forward-pass-loop-name" x="542" y="142">Repeat, layer by layer</text>
    <text class="forward-pass-loop-desc" x="516" y="166">Each layer's activation is the</text>
    <text class="forward-pass-loop-desc" x="516" y="182">next layer's input.</text>
  </g>
  <line class="forward-pass-loop-line forward-pass-loop-conn forward-pass-loop-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forward-pass-loop-tip)"/>
  <g class="forward-pass-loop-stage forward-pass-loop-s3">
    <rect class="forward-pass-loop-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forward-pass-loop-step" x="752" y="142">04</text>
    <text class="forward-pass-loop-name" x="778" y="142">Then the loss</text>
    <text class="forward-pass-loop-desc" x="752" y="166">A single scalar comparing the</text>
    <text class="forward-pass-loop-desc" x="752" y="182">output to the target.</text>
  </g>
  <text class="forward-pass-loop-sub" x="30" y="304">Everything else in deep learning is a variation on these two operations: convolutions are structured matrix multiplies, and attention is three of them with a softmax in the middle.</text>
</svg>
