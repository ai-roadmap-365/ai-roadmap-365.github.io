<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From polynomial layers to tensor cores.">
  <title>Four steps to the modern forward pass</title>
  <style>
    .forward-lineage-bg   { fill: #f8fafc; }
    .forward-lineage-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-lineage-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-lineage-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-lineage-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-lineage-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .forward-lineage-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .forward-lineage-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .forward-lineage-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .forward-lineage-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .forward-lineage-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .forward-lineage-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .forward-lineage-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .forward-lineage-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .forward-lineage-stage { opacity: 1; }

    .forward-lineage-s0 { animation-delay: 0.00s; }
    .forward-lineage-e0 { animation-delay: 0.00s; }
    .forward-lineage-s1 { animation-delay: 1.28s; }
    .forward-lineage-e1 { animation-delay: 1.28s; }
    .forward-lineage-s2 { animation-delay: 2.56s; }
    .forward-lineage-e2 { animation-delay: 2.56s; }
    .forward-lineage-s3 { animation-delay: 3.84s; }
    .forward-lineage-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .forward-lineage-conn  { animation: forward-lineage-trace 6.4s ease-in-out infinite; }
      .forward-lineage-stage { animation: forward-lineage-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes forward-lineage-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes forward-lineage-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .forward-lineage-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .forward-lineage-stage { animation: forward-lineage-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes forward-lineage-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="forward-lineage-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="forward-lineage-bg" width="980" height="322"/>
  <text class="forward-lineage-h1"  x="30" y="40">Four steps to the modern forward pass</text>
  <text class="forward-lineage-sub" x="30" y="64">From polynomial layers to tensor cores.</text>
  <g class="forward-lineage-stage forward-lineage-s0">
    <rect class="forward-lineage-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="forward-lineage-step" x="44" y="142">01</text>
    <text class="forward-lineage-name" x="70" y="142">1965: multi-layer feedforward</text>
    <text class="forward-lineage-desc" x="44" y="166">Ivakhnenko's polynomial</text>
    <text class="forward-lineage-desc" x="44" y="182">networks. Forward propagation,</text>
    <text class="forward-lineage-desc" x="44" y="198">before the name.</text>
  </g>
  <line class="forward-lineage-line forward-lineage-conn forward-lineage-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#forward-lineage-tip)"/>
  <g class="forward-lineage-stage forward-lineage-s1">
    <rect class="forward-lineage-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="forward-lineage-step" x="280" y="142">02</text>
    <text class="forward-lineage-name" x="306" y="142">1986: vectorised formulation</text>
    <text class="forward-lineage-desc" x="280" y="166">Rumelhart, Hinton and Williams.</text>
    <text class="forward-lineage-desc" x="280" y="182">Continuous activations, end to</text>
    <text class="forward-lineage-desc" x="280" y="198">end.</text>
  </g>
  <line class="forward-lineage-line forward-lineage-conn forward-lineage-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#forward-lineage-tip)"/>
  <g class="forward-lineage-stage forward-lineage-s2">
    <rect class="forward-lineage-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="forward-lineage-step" x="516" y="142">03</text>
    <text class="forward-lineage-name" x="542" y="142">2006: depth becomes practical</text>
    <text class="forward-lineage-desc" x="516" y="166">Five to ten stacked layers</text>
    <text class="forward-lineage-desc" x="516" y="182">capturing hierarchical features.</text>
    <text class="forward-lineage-edge" x="516" y="242">depth</text>
  </g>
  <line class="forward-lineage-line forward-lineage-conn forward-lineage-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#forward-lineage-tip)"/>
  <g class="forward-lineage-stage forward-lineage-s3">
    <rect class="forward-lineage-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="forward-lineage-step" x="752" y="142">04</text>
    <text class="forward-lineage-name" x="778" y="142">2012 onward: GPU vectorisation</text>
    <text class="forward-lineage-desc" x="752" y="166">Forward passes as tensor-core</text>
    <text class="forward-lineage-desc" x="752" y="182">matrix multiplies, at teraflop</text>
    <text class="forward-lineage-desc" x="752" y="198">rates.</text>
  </g>
  <text class="forward-lineage-sub" x="30" y="304">The last step changed nothing mathematically and everything practically, which is a recurring pattern in this field: the algorithm was correct for decades before the hardware made it worth running.</text>
</svg>
