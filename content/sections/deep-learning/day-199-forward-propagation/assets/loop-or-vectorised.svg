<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The same arithmetic, a thousand times faster.">
  <title>One sample at a time, or a batch</title>
  <style>
    .loop-or-vectorised-bg   { fill: #f8fafc; }
    .loop-or-vectorised-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-or-vectorised-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-or-vectorised-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-or-vectorised-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-or-vectorised-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loop-or-vectorised-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-or-vectorised-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .loop-or-vectorised-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .loop-or-vectorised-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .loop-or-vectorised-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .loop-or-vectorised-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .loop-or-vectorised-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .loop-or-vectorised-row { opacity: 1; }
    .loop-or-vectorised-r0 { animation-delay: 0.00s; }
    .loop-or-vectorised-r1 { animation-delay: 0.45s; }
    .loop-or-vectorised-r2 { animation-delay: 0.90s; }
    .loop-or-vectorised-r3 { animation-delay: 1.35s; }
    .loop-or-vectorised-r4 { animation-delay: 1.80s; }
    .loop-or-vectorised-row { animation: loop-or-vectorised-reveal 7.3s ease-in-out infinite; }
    @keyframes loop-or-vectorised-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="loop-or-vectorised-bg" width="980" height="390"/>
  <text class="loop-or-vectorised-h1"  x="30" y="40">One sample at a time, or a batch</text>
  <text class="loop-or-vectorised-sub" x="30" y="64">The same arithmetic, a thousand times faster.</text>
  <rect class="loop-or-vectorised-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="loop-or-vectorised-name" x="46" y="122">Per sample</text>
  <text class="loop-or-vectorised-desc" x="46" y="142">Nested Python loops.</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r0" x="46" y="182">One sample, one neuron, one multiply</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r1" x="46" y="216">Billions of interpreter iterations per epoch</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r2" x="46" y="250">The hardware sits idle between them</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r3" x="46" y="284">Cache locality is poor</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r4" x="46" y="318">Deep networks were impossibly slow</text>
  <rect class="loop-or-vectorised-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="loop-or-vectorised-name" x="526" y="122">Vectorised</text>
  <text class="loop-or-vectorised-desc" x="526" y="142">One matrix multiply.</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r0" x="526" y="182">The whole batch as one operation</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r1" x="526" y="216">A single call into optimised linear algebra</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r2" x="526" y="250">Thousands of cores working in parallel</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r3" x="526" y="284">Memory accessed in contiguous blocks</text>
  <text class="loop-or-vectorised-desc loop-or-vectorised-row loop-or-vectorised-r4" x="526" y="318">This is what made the field practical</text>
  <text class="loop-or-vectorised-sub" x="30" y="372">The mathematics is identical in both columns, which is worth stating plainly: vectorisation is an implementation concern that turned out to be the difference between a research curiosity and a field.</text>
</svg>
