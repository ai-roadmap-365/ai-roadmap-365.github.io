questions:
  - question: 'In a deep neural network with layer l having n^[l] neurons and previous layer l-1 having n^[l-1] neurons, what are the exact matrix dimensions of weight matrix W^[l] and bias vector b^[l]?'
    options:
      - 'W^[l] has shape (n^[l], n^[l-1]) and b^[l] has shape (n^[l], 1)'
      - 'W^[l] has shape (n^[l-1], n^[l]) and b^[l] has shape (1, n^[l])'
      - 'W^[l] has shape (m, n^[l]) and b^[l] has shape (m, 1)'
      - 'W^[l] has shape (n^[l], n^[l]) and b^[l] has shape (n^[l], n^[l])'
    answer_index: 0
    explanation: 'W^[l] has rows equal to current layer neurons n^[l] and columns equal to previous layer neurons n^[l-1]. Bias b^[l] is a column vector (n^[l], 1) broadcast across mini-batch examples.'
  - question: 'Why is it critical to cache intermediate values (A^[l-1], Z^[l], W^[l]) during the forward propagation pass?'
    options:
      - 'During backpropagation, the analytical chain rule gradients (dL/dZ^[l] and dL/dW^[l]) depend directly on the forward linear pre-activations Z^[l] and previous activations A^[l-1]'
      - 'To save disk space on the training server'
      - 'To prevent the GPU from entering sleep mode'
      - 'To display real-time animations in TensorBoard'
    answer_index: 0
    explanation: 'Backpropagation requires A^[l-1] to compute dW^[l] = (1/m) * dZ^[l] * (A^[l-1])^T and Z^[l] to evaluate activation derivatives g^[l] prime (Z^[l]).'
  - question: 'Given a mini-batch of m = 128 samples with input dimension n^[0] = 784, what is the shape of input matrix X in column-vector orientation?'
    options:
      - '(784, 128), where each column represents a single training sample'
      - '(128, 784), where each row is a sample'
      - '(784, 784)'
      - '(128, 128)'
    answer_index: 0
    explanation: 'In standard Deep Learning notation (Andrew Ng convention), X has shape (n^[0], m) where columns are samples. In PyTorch row-convention, it is (m, n^[0]). Both are mathematically equivalent via transpose.'
  - question: 'What is the formula for Categorical Cross-Entropy (CCE) loss over m samples with one-hot encoded targets Y and predicted probabilities A^[L]?'
    options:
      - 'Loss = - (1 / m) * sum_{i=1}^m sum_{k=1}^K Y_{k, i} * ln(A^[L]_{k, i} + eps)'
      - 'Loss = (1 / m) * sum (Y - A^[L])^2'
      - 'Loss = max(Y - A^[L])'
      - 'Loss = sum (W^[l])^2'
    answer_index: 0
    explanation: 'Categorical Cross-Entropy penalizes the negative log probability assigned to the true target class, averaged over the mini-batch of m samples.'
  - question: 'What happens during vectorized bias addition Z^[l] = W^[l] A^[l-1] + b^[l] when b^[l] has shape (n^[l], 1) and W^[l] A^[l-1] has shape (n^[l], m)?'
    options:
      - 'NumPy broadcasting automatically replicates the single column vector b^[l] across all m columns of the matrix'
      - 'NumPy raises a ValueError: operands could not be broadcast together'
      - 'The bias is added only to the first training sample'
      - 'The bias replaces the weight matrix'
    answer_index: 0
    explanation: 'NumPy broadcasting expands dimension 1 of shape (n^[l], 1) to match (n^[l], m), adding the layer bias vector identically to every sample in the batch.'
