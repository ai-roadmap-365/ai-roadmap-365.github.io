terms:
  - term: 'Forward Propagation'
    definition: 'The computational pass that feeds input features through successive layers of linear transformations and non-linear activations to produce predictions and calculate loss.'
  - term: 'Linear Pre-Activation (Z)'
    definition: 'The intermediate affine transformation Z = W * A_prev + b computed at each neuron before applying the non-linear activation function.'
  - term: 'Activation Cache'
    definition: 'A structured memory store saving intermediate activations A and pre-activations Z during the forward pass for reuse in backpropagation.'
  - term: 'Broadcasting'
    definition: 'The automatic arithmetic expansion of lower-dimensional tensors to match the shape of higher-dimensional arrays during elementwise operations.'
  - term: 'Categorical Cross-Entropy (CCE)'
    definition: 'A loss function measuring the divergence between true categorical distributions and predicted multi-class probability distributions.'
  - term: 'Binary Cross-Entropy (BCE)'
    definition: 'The negative log-likelihood loss for binary classification measuring cross-entropy between two Bernoulli probability distributions.'
  - term: 'Logits'
    definition: 'The raw, unnormalized real-valued outputs of the final linear layer prior to probability calibration via Sigmoid or Softmax.'
  - term: 'Mini-Batch Vectorization'
    definition: 'Stacking m training examples into a single multi-dimensional matrix to execute matrix-matrix multiplications in parallel on CPU/GPU hardware.'
