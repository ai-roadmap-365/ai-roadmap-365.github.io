terms:
  - term: 'Residual Connection'
    definition: 'A skip connection that adds the input of a layer block directly to its output: y = F(x) + x.'
  - term: 'Degradation Problem'
    definition: 'The phenomenon where increasing network depth beyond a certain point leads to higher training error due to optimization difficulties.'
  - term: 'Global Average Pooling'
    definition: 'A spatial reduction operation that computes the mean of each 2D feature map channel, producing a 1D feature vector.'
  - term: 'Receptive Field'
    definition: 'The spatial extent in the raw input image that contributes to the activation of a particular neuron in a feature map.'
  - term: 'Bottleneck Block'
    definition: 'A residual block utilizing 1x1 convolutions to compress and restore channel dimensions around a 3x3 convolution.'
  - term: 'VGG Block'
    definition: 'A sequence of multiple 3x3 convolutions followed by a single 2x2 Max Pooling layer.'
  - term: 'Feature Hierarchy'
    definition: 'The progression in deep vision networks where early layers detect edges, middle layers detect textures/parts, and late layers detect objects.'
  - term: 'Pointwise Convolution'
    definition: 'A 1x1 convolution used for cross-channel linear combination and dimension reduction without spatial transformation.'
