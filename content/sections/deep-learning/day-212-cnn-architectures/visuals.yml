visuals:
  - id: cnn-evolution-lenet-to-resnet
    file: assets/cnn-evolution-lenet-to-resnet.svg
    type: diagram
    title: 'CNN Architectural Evolution: LeNet-5 to ResNet-50'
    alt: Timeline evolution of modern CNN architectures from LeNet-5 and AlexNet to VGG-16 and ResNet showing layer depth and structural innovations
    description: Historical progression of landmark convolutional network architectures detailing layer depth, parameter scaling, filter sizing, and structural breakthroughs from 1998 to 2015.
  - id: resnet-residual-block-gradient-highway
    file: assets/resnet-residual-block-gradient-highway.svg
    type: diagram
    title: 'ResNet Residual Block and Gradient Highway Mechanics'
    alt: ResNet residual block architecture showing convolutional path and identity shortcut connection creating direct gradient flow
    description: Structural schematic of the residual block demonstrating how the identity skip connection y = F(x) + x creates an unattenuated gradient highway during backpropagation.
