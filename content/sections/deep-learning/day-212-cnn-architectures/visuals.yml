visuals:
  - id: cnn-evolution-lenet-to-resnet
    file: assets/cnn-evolution-lenet-to-resnet.svg
    type: diagram
    title: 'CNN Architectural Evolution: LeNet-5 to ResNet-50'
    alt: Timeline evolution of modern CNN architectures from LeNet-5 and AlexNet to VGG-16 and ResNet showing layer depth and structural innovations
    description: Historical progression of landmark convolutional network architectures detailing layer depth, parameter scaling, filter sizing, and structural breakthroughs from 1998 to 2015.
  - id: resnet-residual-block-gradient-highway
    file: assets/resnet-residual-block-gradient-highway.svg
    type: diagram
    title: 'ResNet Residual Block and Gradient Highway Mechanics'
    alt: ResNet residual block architecture showing convolutional path and identity shortcut connection creating direct gradient flow
    description: Structural schematic of the residual block demonstrating how the identity skip connection y = F(x) + x creates an unattenuated gradient highway during backpropagation.
  - id: depth-problem
    file: assets/depth-problem.svg
    type: diagram
    title: 'Why depth stopped working'
    alt: 'Diagram: the degradation problem in deep plain networks and the residual solution'
    description: 'A four-stage description of the depth degradation problem covering plain network limits, the surprising symptom, the residual formulation and the result.'
  - id: gradient-highway
    file: assets/gradient-highway.svg
    type: diagram
    title: 'Why the skip connection works'
    alt: 'Diagram: how a residual connection preserves gradient magnitude across depth'
    description: 'A four-stage explanation of the residual gradient path covering the block output, its derivative, the identity term and the effect on the chain rule product.'
  - id: vgg-stacking
    file: assets/vgg-stacking.svg
    type: diagram
    title: 'Why small kernels stacked'
    alt: 'Diagram: one large convolution kernel compared with three stacked small ones'
    description: 'A four-stage comparison of a single large kernel against stacked small kernels by receptive field, parameters and non-linearity.'
  - id: block-types
    file: assets/block-types.svg
    type: diagram
    title: 'Two residual block shapes'
    alt: 'Diagram: the basic residual block compared with the bottleneck block'
    description: 'A three-stage description of residual block variants covering the basic block, the bottleneck block and where each is used.'
  - id: architecture-families
    file: assets/architecture-families.svg
    type: diagram
    title: 'Four architectural families'
    alt: 'Diagram: four convolutional architecture families and their defining ideas'
    description: 'A four-stage description of convolutional architecture families covering VGG stacking, residual connections, inception multi-scale and compound scaling.'
  - id: gap-or-dense
    file: assets/gap-or-dense.svg
    type: diagram
    title: 'Global pooling, or a dense head'
    alt: 'Diagram: a dense classification head compared with global average pooling'
    description: 'A two-column comparison of dense classifier heads against global average pooling.'
  - id: skyscraper
    file: assets/skyscraper.svg
    type: diagram
    title: 'Building a skyscraper'
    alt: 'Diagram: adding floors without structural support compared with a designed frame'
    description: 'A two-column comparison of naive vertical extension against structural engineering, as an analogy for depth in networks.'
  - id: receptive-field
    file: assets/receptive-field.svg
    type: diagram
    title: 'The receptive field'
    alt: 'Diagram: how the receptive field grows with depth in a convolutional network'
    description: 'A four-stage description of receptive field growth covering the single layer, composition across layers, the effect of stride and the architectural consequence.'
  - id: cnn-implications
    file: assets/cnn-implications.svg
    type: diagram
    title: 'Four consequences of these architectures'
    alt: 'Diagram: the depth, memory, transfer and default implications of convolutional architectures'
    description: 'A four-stage description of architectural implications covering trainable depth, activation memory, pretrained transfer and the resulting defaults.'
  - id: cnn-when
    file: assets/cnn-when.svg
    type: diagram
    title: 'Choosing an architecture'
    alt: 'Diagram: how to choose a convolutional architecture'
    description: 'A two-column comparison of selecting a pretrained architecture against designing one.'
