learning_promise: 'Master landmark Convolutional Neural Network architectures: trace the evolution from LeNet-5 and AlexNet to VGG-16 and ResNet, derive receptive fields, implement residual skip connections from scratch in PyTorch, and understand feature hierarchy emergence.'
objectives:
  - 'Trace the structural evolution of CNNs from LeNet-5 through AlexNet, VGG-16, Inception, and ResNet.'
  - 'Explain why stacking two 3x3 convolutions matches the effective receptive field of a single 5x5 convolution with 28% fewer parameters.'
  - 'Derive the mathematics of Residual Skip Connections and explain why y = F(x) + x prevents vanishing gradients in 100+ layer networks.'
  - 'Implement a modular BasicBlock and ResNet architecture from scratch in PyTorch.'
  - 'Inspect how hierarchical representations progress from Gabor-like edges to part detectors and semantic object representations.'
