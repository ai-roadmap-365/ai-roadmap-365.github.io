questions:
  - question: 'Why did VGG-16 replace large convolutional filters (like 11x11 and 5x5 in AlexNet) with stacks of small 3x3 convolutional filters?'
    options:
      - 'Two 3x3s match a 5x5 with fewer parameters and two ReLUs'
      - '3x3 convolutions do not require GPUs'
      - '5x5 convolutions are banned by PyTorch'
      - '3x3 convolutions eliminate the need for training data'
    answer_index: 0
    explanation: 'A stack of two 3x3 convolutions has a 5x5 receptive field with 2 * (3^2 * C^2) = 18 C^2 parameters versus 25 C^2 for a single 5x5 layer (28% parameter reduction), plus an extra non-linear activation.'
  - question: 'What fundamental optimization barrier did Kaiming He et al. identify that caused deep 56-layer networks to perform worse on both training and test sets than 20-layer networks, and how did ResNet solve it?'
    options:
      - 'Lack of RAM on GPUs; solved by deleting layers'
      - 'Degradation, solved by residual skip connections'
      - 'Overfitting; solved by adding 90% dropout'
      - 'Floating point rounding errors; solved by 64-bit precision'
    answer_index: 1
    explanation: 'The degradation problem was not overfitting (since training loss was worse too). Residual skip connections allow gradients to flow directly through the identity mapping dL/dx = dL/dy * (dF/dx + 1).'
  - question: 'In a ResNet BasicBlock, what must be done when the residual function F(x) halves the spatial resolution (stride=2) or increases the number of feature channels?'
    options:
      - 'Discard the skip connection entirely for that block'
      - 'Pad x with random Gaussian noise'
      - 'Use a 1x1 convolution with stride 2 on the shortcut'
      - 'Downsample the output using MaxPool3D'
    answer_index: 2
    explanation: 'Tensor addition F(x) + x requires identical shapes. When channels increase or spatial size decreases, a 1x1 projection conv with matching stride aligns x to F(x).'
  - question: 'What is Global Average Pooling (GAP), and why did modern CNNs (ResNet, Inception) replace giant fully connected classifier heads with GAP?'
    options:
      - 'GAP replaces the loss function'
      - 'GAP doubles the image resolution'
      - 'GAP multiplies all pixel values by 255'
      - 'GAP averages each map to one number, dropping dense params'
    answer_index: 3
    explanation: 'In VGG-16, the first dense layer FC1 accounted for over 100 million parameters. Modern networks use Global Average Pooling to reduce (C, H, W) to a C-dimensional vector, requiring only a single small linear layer.'
  - question: 'How does the effective receptive field of a neuron change as we go deeper into a convolutional neural network?'
    options:
      - 'It grows with depth, so deep layers see global context'
      - 'It shrinks to a single pixel'
      - 'It stays fixed at exactly 3x3 pixels forever'
      - 'It inverts horizontally'
    answer_index: 0
    explanation: 'Receptive fields expand with each successive convolution and pooling layer, allowing the network to form a spatial hierarchy from local edges to object parts to full semantic objects.'
