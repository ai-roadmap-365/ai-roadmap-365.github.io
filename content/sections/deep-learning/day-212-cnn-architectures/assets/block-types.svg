<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="By depth and width.">
  <title>Two residual block shapes</title>
  <style>
    .block-types-bg   { fill: #f8fafc; }
    .block-types-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-types-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-types-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-types-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-types-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .block-types-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .block-types-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .block-types-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .block-types-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .block-types-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .block-types-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .block-types-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .block-types-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .block-types-stage { opacity: 1; }

    .block-types-s0 { animation-delay: 0.00s; }
    .block-types-e0 { animation-delay: 0.00s; }
    .block-types-s1 { animation-delay: 1.50s; }
    .block-types-e1 { animation-delay: 1.50s; }
    .block-types-s2 { animation-delay: 3.00s; }
    .block-types-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .block-types-conn  { animation: block-types-trace 6s ease-in-out infinite; }
      .block-types-stage { animation: block-types-arrive 6s ease-in-out infinite; }
    }
    @keyframes block-types-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes block-types-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .block-types-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .block-types-stage { animation: block-types-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes block-types-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="block-types-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="block-types-bg" width="980" height="322"/>
  <text class="block-types-h1"  x="30" y="40">Two residual block shapes</text>
  <text class="block-types-sub" x="30" y="64">By depth and width.</text>
  <g class="block-types-stage block-types-s0">
    <rect class="block-types-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="block-types-step" x="44" y="142">01</text>
    <text class="block-types-name" x="70" y="142">Basic block</text>
    <text class="block-types-desc" x="44" y="166">Two 3x3 convolutions and a skip. Used in</text>
    <text class="block-types-desc" x="44" y="182">shallower networks.</text>
  </g>
  <line class="block-types-line block-types-conn block-types-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#block-types-tip)"/>
  <g class="block-types-stage block-types-s1">
    <rect class="block-types-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="block-types-step" x="359" y="142">02</text>
    <text class="block-types-name" x="385" y="142">Bottleneck block</text>
    <text class="block-types-desc" x="359" y="166">Reduce channels, convolve, expand. Cheaper at</text>
    <text class="block-types-desc" x="359" y="182">high channel counts.</text>
    <text class="block-types-edge" x="359" y="242">1x1, 3x3, 1x1</text>
  </g>
  <line class="block-types-line block-types-conn block-types-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#block-types-tip)"/>
  <g class="block-types-stage block-types-s2">
    <rect class="block-types-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="block-types-step" x="674" y="142">03</text>
    <text class="block-types-name" x="700" y="142">Depth decides</text>
    <text class="block-types-desc" x="674" y="166">Basic for tens of layers; bottleneck for a</text>
    <text class="block-types-desc" x="674" y="182">hundred or more.</text>
  </g>
  <text class="block-types-sub" x="30" y="304">The bottleneck's one-by-one convolutions do no spatial work at all — they exist purely to reduce and restore channel count around the expensive spatial operation.</text>
</svg>
