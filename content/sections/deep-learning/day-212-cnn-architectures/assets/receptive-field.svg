<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="What one output unit can see.">
  <title>The receptive field</title>
  <style>
    .receptive-field-bg   { fill: #f8fafc; }
    .receptive-field-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .receptive-field-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .receptive-field-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .receptive-field-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .receptive-field-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .receptive-field-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .receptive-field-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .receptive-field-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .receptive-field-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .receptive-field-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .receptive-field-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .receptive-field-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .receptive-field-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .receptive-field-stage { opacity: 1; }

    .receptive-field-s0 { animation-delay: 0.00s; }
    .receptive-field-e0 { animation-delay: 0.00s; }
    .receptive-field-s1 { animation-delay: 1.28s; }
    .receptive-field-e1 { animation-delay: 1.28s; }
    .receptive-field-s2 { animation-delay: 2.56s; }
    .receptive-field-e2 { animation-delay: 2.56s; }
    .receptive-field-s3 { animation-delay: 3.84s; }
    .receptive-field-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .receptive-field-conn  { animation: receptive-field-trace 6.4s ease-in-out infinite; }
      .receptive-field-stage { animation: receptive-field-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes receptive-field-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes receptive-field-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .receptive-field-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .receptive-field-stage { animation: receptive-field-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes receptive-field-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="receptive-field-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="receptive-field-bg" width="980" height="322"/>
  <text class="receptive-field-h1"  x="30" y="40">The receptive field</text>
  <text class="receptive-field-sub" x="30" y="64">What one output unit can see.</text>
  <g class="receptive-field-stage receptive-field-s0">
    <rect class="receptive-field-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="receptive-field-step" x="44" y="142">01</text>
    <text class="receptive-field-name" x="70" y="142">One 3x3 layer sees three pixels</text>
    <text class="receptive-field-desc" x="44" y="166">Per dimension. A tiny window.</text>
  </g>
  <line class="receptive-field-line receptive-field-conn receptive-field-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#receptive-field-tip)"/>
  <g class="receptive-field-stage receptive-field-s1">
    <rect class="receptive-field-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="receptive-field-step" x="280" y="142">02</text>
    <text class="receptive-field-name" x="306" y="142">Stacking composes it</text>
    <text class="receptive-field-desc" x="280" y="166">Each layer widens what the next</text>
    <text class="receptive-field-desc" x="280" y="182">can see.</text>
  </g>
  <line class="receptive-field-line receptive-field-conn receptive-field-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#receptive-field-tip)"/>
  <g class="receptive-field-stage receptive-field-s2">
    <rect class="receptive-field-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="receptive-field-step" x="516" y="142">03</text>
    <text class="receptive-field-name" x="542" y="142">Stride widens it faster</text>
    <text class="receptive-field-desc" x="516" y="166">Downsampling multiplies the</text>
    <text class="receptive-field-desc" x="516" y="182">effective coverage.</text>
    <text class="receptive-field-edge" x="516" y="242">faster</text>
  </g>
  <line class="receptive-field-line receptive-field-conn receptive-field-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#receptive-field-tip)"/>
  <g class="receptive-field-stage receptive-field-s3">
    <rect class="receptive-field-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="receptive-field-step" x="752" y="142">04</text>
    <text class="receptive-field-name" x="778" y="142">Depth is how you see the whole image</text>
    <text class="receptive-field-desc" x="752" y="166">A final layer's units must cover</text>
    <text class="receptive-field-desc" x="752" y="182">the object to classify it.</text>
  </g>
  <text class="receptive-field-sub" x="30" y="304">This is why depth is not merely capacity in a convolutional network: without enough layers, no output unit has ever seen a large enough region to recognise a large object.</text>
</svg>
