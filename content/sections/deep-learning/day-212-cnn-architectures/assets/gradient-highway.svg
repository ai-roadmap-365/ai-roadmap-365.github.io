<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One term in the derivative.">
  <title>Why the skip connection works</title>
  <style>
    .gradient-highway-bg   { fill: #f8fafc; }
    .gradient-highway-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-highway-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-highway-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-highway-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-highway-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gradient-highway-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gradient-highway-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gradient-highway-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gradient-highway-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gradient-highway-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gradient-highway-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gradient-highway-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gradient-highway-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gradient-highway-stage { opacity: 1; }

    .gradient-highway-s0 { animation-delay: 0.00s; }
    .gradient-highway-e0 { animation-delay: 0.00s; }
    .gradient-highway-s1 { animation-delay: 1.28s; }
    .gradient-highway-e1 { animation-delay: 1.28s; }
    .gradient-highway-s2 { animation-delay: 2.56s; }
    .gradient-highway-e2 { animation-delay: 2.56s; }
    .gradient-highway-s3 { animation-delay: 3.84s; }
    .gradient-highway-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .gradient-highway-conn  { animation: gradient-highway-trace 6.4s ease-in-out infinite; }
      .gradient-highway-stage { animation: gradient-highway-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes gradient-highway-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gradient-highway-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gradient-highway-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gradient-highway-stage { animation: gradient-highway-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gradient-highway-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gradient-highway-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gradient-highway-bg" width="980" height="322"/>
  <text class="gradient-highway-h1"  x="30" y="40">Why the skip connection works</text>
  <text class="gradient-highway-sub" x="30" y="64">One term in the derivative.</text>
  <g class="gradient-highway-stage gradient-highway-s0">
    <rect class="gradient-highway-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-highway-step" x="44" y="142">01</text>
    <text class="gradient-highway-name" x="70" y="142">The block outputs x plus F(x)</text>
    <text class="gradient-highway-desc" x="44" y="166">The input, plus whatever the</text>
    <text class="gradient-highway-desc" x="44" y="182">block learned to add.</text>
  </g>
  <line class="gradient-highway-line gradient-highway-conn gradient-highway-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#gradient-highway-tip)"/>
  <g class="gradient-highway-stage gradient-highway-s1">
    <rect class="gradient-highway-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-highway-step" x="280" y="142">02</text>
    <text class="gradient-highway-name" x="306" y="142">So the derivative is one plus dF/dx</text>
    <text class="gradient-highway-desc" x="280" y="166">The identity contributes a term</text>
    <text class="gradient-highway-desc" x="280" y="182">of exactly one.</text>
    <text class="gradient-highway-edge" x="280" y="242">the key</text>
  </g>
  <line class="gradient-highway-line gradient-highway-conn gradient-highway-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#gradient-highway-tip)"/>
  <g class="gradient-highway-stage gradient-highway-s2">
    <rect class="gradient-highway-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-highway-step" x="516" y="142">03</text>
    <text class="gradient-highway-name" x="542" y="142">The chain rule product cannot collapse</text>
    <text class="gradient-highway-desc" x="516" y="166">Even if every learned term is</text>
    <text class="gradient-highway-desc" x="516" y="182">small, the ones survive.</text>
  </g>
  <line class="gradient-highway-line gradient-highway-conn gradient-highway-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#gradient-highway-tip)"/>
  <g class="gradient-highway-stage gradient-highway-s3">
    <rect class="gradient-highway-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="gradient-highway-step" x="752" y="142">04</text>
    <text class="gradient-highway-name" x="778" y="142">Gradients reach the earliest layers</text>
    <text class="gradient-highway-desc" x="752" y="166">Which is what makes hundreds of</text>
    <text class="gradient-highway-desc" x="752" y="182">layers trainable.</text>
  </g>
  <text class="gradient-highway-sub" x="30" y="304">This is the cleanest example in deep learning of an architectural change with a one-line mathematical justification: a plus-one in the derivative is the whole mechanism.</text>
</svg>
