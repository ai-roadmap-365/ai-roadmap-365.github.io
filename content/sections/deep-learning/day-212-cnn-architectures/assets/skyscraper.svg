<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Structure, not just height.">
  <title>Building a skyscraper</title>
  <style>
    .skyscraper-bg   { fill: #f8fafc; }
    .skyscraper-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skyscraper-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skyscraper-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skyscraper-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skyscraper-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .skyscraper-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skyscraper-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .skyscraper-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .skyscraper-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .skyscraper-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .skyscraper-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .skyscraper-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .skyscraper-row { opacity: 1; }
    .skyscraper-r0 { animation-delay: 0.00s; }
    .skyscraper-r1 { animation-delay: 0.45s; }
    .skyscraper-r2 { animation-delay: 0.90s; }
    .skyscraper-r3 { animation-delay: 1.35s; }
    .skyscraper-r4 { animation-delay: 1.80s; }
    .skyscraper-row { animation: skyscraper-reveal 7.3s ease-in-out infinite; }
    @keyframes skyscraper-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="skyscraper-bg" width="980" height="390"/>
  <text class="skyscraper-h1"  x="30" y="40">Building a skyscraper</text>
  <text class="skyscraper-sub" x="30" y="64">Structure, not just height.</text>
  <rect class="skyscraper-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="skyscraper-name" x="46" y="122">Just add floors</text>
  <text class="skyscraper-desc" x="46" y="142">It stops standing up.</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r0" x="46" y="182">Each floor supported by the one below</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r1" x="46" y="216">Load accumulates downward</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r2" x="46" y="250">Past a height, the base cannot carry it</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r3" x="46" y="284">More floors makes it worse</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r4" x="46" y="318">This is a plain deep network</text>
  <rect class="skyscraper-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="skyscraper-name" x="526" y="122">A structural frame</text>
  <text class="skyscraper-desc" x="526" y="142">Load paths, deliberately.</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r0" x="526" y="182">A core carries load directly to the foundation</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r1" x="526" y="216">Each floor adds to it rather than bearing everything</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r2" x="526" y="250">Height becomes an engineering choice</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r3" x="526" y="284">Hundreds of floors are possible</text>
  <text class="skyscraper-desc skyscraper-row skyscraper-r4" x="526" y="318">This is a residual connection</text>
  <text class="skyscraper-sub" x="30" y="372">The core carrying load directly to the foundation is the skip connection: it gives the signal a path that does not depend on every intermediate floor being perfect.</text>
</svg>
