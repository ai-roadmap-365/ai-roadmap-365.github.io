terms:
  - term: 'Autoregressive Language Model'
    definition: 'A model that predicts the next token in a sequence conditioned on all previously generated tokens: P(w_1, ..., w_N) = prod P(w_t | w_<t).'
  - term: 'Causal Mask'
    definition: 'An upper-triangular negative infinity attention mask that prevents information flow from future token positions.'
  - term: 'KV Cache (Key-Value Cache)'
    definition: 'A GPU memory buffer storing computed Key and Value tensors across generation steps to enable O(1) single-token rollout.'
  - term: 'Chinchilla Optimal Frontier'
    definition: 'The empirical compute-optimal scaling balance dictating ~20 training tokens per model parameter.'
  - term: 'Temperature'
    definition: 'A hyperparameter scaling logit magnitudes prior to softmax to modulate output entropy and randomness.'
  - term: 'Top-p (Nucleus) Sampling'
    definition: 'A decoding strategy restricting token sampling to the minimal cumulative probability mass exceeding threshold p.'
  - term: 'Top-k Sampling'
    definition: 'A decoding strategy restricting token sampling strictly to the k highest-probability candidates.'
  - term: 'In-Context Learning'
    definition: 'The emergent ability of LLMs to execute new tasks from natural language prompts without gradient updates.'
