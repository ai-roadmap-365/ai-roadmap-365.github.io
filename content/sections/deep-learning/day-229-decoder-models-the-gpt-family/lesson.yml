learning_promise: 'Master Autoregressive Decoder-only Transformer foundation models: understand GPT-1, GPT-2, and GPT-3, derive Causal Self-Attention masking matrices, analyze KV Caching for O(1) step latency, understand Neural Scaling Laws (Kaplan vs Chinchilla compute-optimal frontier), master generation decoding strategies (Temperature, Top-k, Top-p, Min-p), and build an autoregressive generation loop in PyTorch.'
objectives:
  - 'Derive Causal Self-Attention masking and explain why upper-triangular negative infinity masks prevent future token leakage.'
  - 'Implement the Key-Value (KV) Cache mechanism and prove why it reduces token rollout complexity from O(N) to O(1) FLOPs.'
  - 'Analyze the evolution of the GPT family: GPT-1 (unsupervised pretraining + supervised fine-tuning) to GPT-2 (zero-shot multitask learning) to GPT-3 (few-shot in-context learning).'
  - 'Derive the Chinchilla Scaling Law (Hoffmann et al., 2022) and calculate compute-optimal parameter-to-token ratios.'
  - 'Implement and compare token sampling strategies: Greedy, Temperature, Top-k, and Top-p (Nucleus) sampling.'
