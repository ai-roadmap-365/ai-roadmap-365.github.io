questions:
  - question: 'What is the mathematical purpose of the Causal Attention Mask (lower-triangular mask) in GPT decoder models?'
    options:
      - 'It sets attention scores for all future token positions (j > i) to negative infinity (-inf) before the softmax operation, ensuring token i can only attend to previous tokens (j <= i) and preserving the autoregressive property'
      - 'It masks out punctuation characters'
      - 'It forces the weights to sum to zero'
      - 'It converts text to uppercase'
    answer_index: 0
    explanation: 'Causal masking ensures that during training and generation, the model cannot cheat by looking ahead at future tokens.'
  - question: 'Why is the Key-Value (KV) Cache critical for low-latency autoregressive generation in Large Language Models?'
    options:
      - 'Without KV caching, generating the N-th token requires re-computing Key and Value tensors for all N-1 preceding tokens (O(N^2) total compute); with KV caching, previous keys and values are stored in GPU memory, reducing each new token step to O(1) new FLOPs'
      - 'KV caching encrypts the prompts for security'
      - 'KV caching makes the vocabulary 10 times larger'
      - 'KV caching converts floating-point numbers to integers'
    answer_index: 0
    explanation: 'KV caching stores previously computed key and value states, eliminating redundant recomputation during step-by-step rollout.'
  - question: 'What was the fundamental paradigm shift introduced by Chinchilla (Hoffmann et al., 2022) over Kaplan et al. (2020)?'
    options:
      - 'Hoffmann et al. proved that for compute-optimal training, model parameters (N) and training tokens (D) should be scaled in equal proportion (~20 tokens per parameter), showing that earlier models like GPT-3 (175B on 300B tokens) were severely undertrained'
      - 'That neural networks cannot scale beyond 1 billion parameters'
      - 'That Transformers should be replaced with recurrent networks'
      - 'That models should only be trained on Wikipedia'
    answer_index: 0
    explanation: 'Chinchilla demonstrated that training smaller models on significantly more data yields better performance and far lower inference serving costs.'
  - question: 'How does Temperature scaling (T) affect next-token probability distribution sampling?'
    options:
      - 'Dividing logits by temperature T before softmax (z / T): T < 1.0 sharpens the distribution toward the highest-probability tokens (more deterministic), while T > 1.0 flattens the distribution across diverse choices (more creative/random)'
      - 'T increases the physical clock frequency of the GPU'
      - 'T deletes rare vocabulary words'
      - 'T doubles the model hidden dimension'
    answer_index: 0
    explanation: 'Temperature scales logit magnitudes, controlling the sharpness or flatness of the resulting categorical probability distribution.'
  - question: 'What is Top-p (Nucleus) sampling (Holtzman et al., 2019)?'
    options:
      - 'Sampling from the smallest dynamic subset of top-ranked tokens whose cumulative probability mass exceeds threshold p (e.g. p = 0.9), filtering out the unreliable tail while adapting candidate set size to context confidence'
      - 'Selecting always the top p tokens alphabetically'
      - 'Selecting only tokens containing the letter p'
      - 'Padding the input sequence to length p'
    answer_index: 0
    explanation: 'Nucleus sampling dynamically adjusts the candidate pool size based on the model confidence distribution.'
