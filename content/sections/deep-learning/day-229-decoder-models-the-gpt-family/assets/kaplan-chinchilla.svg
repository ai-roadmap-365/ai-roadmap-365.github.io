<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the models built on the wrong one.">
  <title>Two scaling laws</title>
  <style>
    .kaplan-chinchilla-bg   { fill: #f8fafc; }
    .kaplan-chinchilla-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kaplan-chinchilla-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kaplan-chinchilla-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kaplan-chinchilla-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kaplan-chinchilla-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kaplan-chinchilla-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kaplan-chinchilla-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kaplan-chinchilla-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kaplan-chinchilla-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kaplan-chinchilla-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kaplan-chinchilla-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kaplan-chinchilla-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kaplan-chinchilla-row { opacity: 1; }
    .kaplan-chinchilla-r0 { animation-delay: 0.00s; }
    .kaplan-chinchilla-r1 { animation-delay: 0.45s; }
    .kaplan-chinchilla-r2 { animation-delay: 0.90s; }
    .kaplan-chinchilla-r3 { animation-delay: 1.35s; }
    .kaplan-chinchilla-r4 { animation-delay: 1.80s; }
    .kaplan-chinchilla-row { animation: kaplan-chinchilla-reveal 7.3s ease-in-out infinite; }
    @keyframes kaplan-chinchilla-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kaplan-chinchilla-bg" width="980" height="390"/>
  <text class="kaplan-chinchilla-h1"  x="30" y="40">Two scaling laws</text>
  <text class="kaplan-chinchilla-sub" x="30" y="64">And the models built on the wrong one.</text>
  <rect class="kaplan-chinchilla-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kaplan-chinchilla-name" x="46" y="122">Parameter-heavy scaling</text>
  <text class="kaplan-chinchilla-desc" x="46" y="142">Grow the model faster.</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r0" x="46" y="182">Parameters scaled faster than data</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r1" x="46" y="216">Produced very large, data-starved models</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r2" x="46" y="250">175 billion parameters on 300 billion tokens</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r3" x="46" y="284">Which is far below the optimum</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r4" x="46" y="318">And left performance on the table</text>
  <rect class="kaplan-chinchilla-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kaplan-chinchilla-name" x="526" y="122">Compute-optimal scaling</text>
  <text class="kaplan-chinchilla-desc" x="526" y="142">Grow both equally.</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r0" x="526" y="182">Parameters and data scaled together</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r1" x="526" y="216">Roughly twenty tokens per parameter</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r2" x="526" y="250">A smaller model trained longer wins</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r3" x="526" y="284">At the same total compute</text>
  <text class="kaplan-chinchilla-desc kaplan-chinchilla-row kaplan-chinchilla-r4" x="526" y="318">Which reshaped every subsequent recipe</text>
  <text class="kaplan-chinchilla-sub" x="30" y="372">The finding was corrective rather than incremental: a substantially smaller model trained on more data outperformed a much larger one at equal compute, which invalidated a generation of scaling plans.</text>
</svg>
