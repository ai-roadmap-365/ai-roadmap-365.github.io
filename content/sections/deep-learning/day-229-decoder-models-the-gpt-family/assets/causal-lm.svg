<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One objective, every task.">
  <title>Next-token prediction</title>
  <style>
    .causal-lm-bg   { fill: #f8fafc; }
    .causal-lm-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .causal-lm-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .causal-lm-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .causal-lm-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .causal-lm-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .causal-lm-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .causal-lm-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .causal-lm-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .causal-lm-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .causal-lm-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .causal-lm-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .causal-lm-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .causal-lm-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .causal-lm-stage { opacity: 1; }

    .causal-lm-s0 { animation-delay: 0.00s; }
    .causal-lm-e0 { animation-delay: 0.00s; }
    .causal-lm-s1 { animation-delay: 1.28s; }
    .causal-lm-e1 { animation-delay: 1.28s; }
    .causal-lm-s2 { animation-delay: 2.56s; }
    .causal-lm-e2 { animation-delay: 2.56s; }
    .causal-lm-s3 { animation-delay: 3.84s; }
    .causal-lm-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .causal-lm-conn  { animation: causal-lm-trace 6.4s ease-in-out infinite; }
      .causal-lm-stage { animation: causal-lm-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes causal-lm-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes causal-lm-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .causal-lm-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .causal-lm-stage { animation: causal-lm-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes causal-lm-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="causal-lm-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="causal-lm-bg" width="980" height="322"/>
  <text class="causal-lm-h1"  x="30" y="40">Next-token prediction</text>
  <text class="causal-lm-sub" x="30" y="64">One objective, every task.</text>
  <g class="causal-lm-stage causal-lm-s0">
    <rect class="causal-lm-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="causal-lm-step" x="44" y="142">01</text>
    <text class="causal-lm-name" x="70" y="142">Factorise the sequence probability</text>
    <text class="causal-lm-desc" x="44" y="166">Each token conditioned on</text>
    <text class="causal-lm-desc" x="44" y="182">everything before it. The chain</text>
    <text class="causal-lm-desc" x="44" y="198">rule.</text>
  </g>
  <line class="causal-lm-line causal-lm-conn causal-lm-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#causal-lm-tip)"/>
  <g class="causal-lm-stage causal-lm-s1">
    <rect class="causal-lm-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="causal-lm-step" x="280" y="142">02</text>
    <text class="causal-lm-name" x="306" y="142">Mask future positions</text>
    <text class="causal-lm-desc" x="280" y="166">So position t cannot see t+1</text>
    <text class="causal-lm-desc" x="280" y="182">onward.</text>
    <text class="causal-lm-edge" x="280" y="242">triangular</text>
  </g>
  <line class="causal-lm-line causal-lm-conn causal-lm-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#causal-lm-tip)"/>
  <g class="causal-lm-stage causal-lm-s2">
    <rect class="causal-lm-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="causal-lm-step" x="516" y="142">03</text>
    <text class="causal-lm-name" x="542" y="142">Train the whole sequence at once</text>
    <text class="causal-lm-desc" x="516" y="166">Every position predicts its</text>
    <text class="causal-lm-desc" x="516" y="182">successor, in parallel.</text>
  </g>
  <line class="causal-lm-line causal-lm-conn causal-lm-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#causal-lm-tip)"/>
  <g class="causal-lm-stage causal-lm-s3">
    <rect class="causal-lm-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="causal-lm-step" x="752" y="142">04</text>
    <text class="causal-lm-name" x="778" y="142">Generate one token at a time</text>
    <text class="causal-lm-desc" x="752" y="166">Sequentially, feeding each</text>
    <text class="causal-lm-desc" x="752" y="182">output back as input.</text>
  </g>
  <text class="causal-lm-sub" x="30" y="304">The asymmetry between training and generation is the architecture's defining property: training is fully parallel and generation is strictly sequential, which is why serving is the harder engineering problem.</text>
</svg>
