visuals:
  - id: gpt-causal-autoregressive-architecture-kv-cache
    file: assets/gpt-causal-autoregressive-architecture-kv-cache.svg
    type: diagram
    title: 'GPT Causal Architecture and KV-Cache Mechanism'
    alt: GPT causal autoregressive architecture diagram showing lower triangular causal attention mask next token prediction and KV cache mechanism
    description: 'Radford et al. (2018-2020) causal left-to-right generation pipeline and memory-efficient KV-caching rollout.'
  - id: neural-scaling-laws-kaplan-vs-chinchilla
    file: assets/neural-scaling-laws-kaplan-vs-chinchilla.svg
    type: diagram
    title: 'Neural Scaling Laws: Kaplan vs. Chinchilla'
    alt: Neural scaling laws comparison showing Kaplan empirical power laws versus Chinchilla compute optimal tokens per parameter balance
    description: 'Comparison of Kaplan et al. (2020) parameter-heavy scaling vs Hoffmann et al. (2022) Chinchilla compute-optimal frontier.'
  - id: causal-lm
    file: assets/causal-lm.svg
    type: diagram
    title: 'Next-token prediction'
    alt: 'Diagram: how autoregressive next-token prediction works'
    description: 'A four-stage description of causal language modelling covering the chain rule factorisation, causal masking, training in parallel and generation one token at a time.'
  - id: kv-cache
    file: assets/kv-cache.svg
    type: diagram
    title: 'The key-value cache'
    alt: 'Diagram: how the key-value cache avoids recomputing attention over the prefix'
    description: 'A four-stage description of KV caching covering the naive recomputation, the cache, the saving and the memory cost.'
  - id: kaplan-chinchilla
    file: assets/kaplan-chinchilla.svg
    type: diagram
    title: 'Two scaling laws'
    alt: 'Diagram: parameter-heavy scaling compared with compute-optimal scaling'
    description: 'A two-column comparison of the earlier and later neural scaling law recommendations.'
  - id: decoding
    file: assets/decoding.svg
    type: diagram
    title: 'Four decoding strategies'
    alt: 'Diagram: four decoding strategies for autoregressive generation'
    description: 'A four-stage description of decoding strategies covering greedy, temperature sampling, nucleus sampling and beam search.'
  - id: repetition
    file: assets/repetition.svg
    type: diagram
    title: 'Degenerate repetition'
    alt: 'Diagram: the causes and remedies of repetitive generation'
    description: 'A four-stage description of repetition covering the failure, its cause, penalties and sampling remedies.'
  - id: paged-attention
    file: assets/paged-attention.svg
    type: diagram
    title: 'Paging the KV cache'
    alt: 'Diagram: contiguous key-value cache allocation compared with paged allocation'
    description: 'A four-stage description of paged attention covering contiguous reservation, fragmentation, block allocation and prefix sharing.'
  - id: autopilot
    file: assets/autopilot.svg
    type: diagram
    title: 'A storyteller improvising'
    alt: 'Diagram: improvised narration compared with a written draft'
    description: 'A two-column comparison of live improvisation against writing with revision.'
  - id: speculative
    file: assets/speculative.svg
    type: diagram
    title: 'Why generation is bandwidth bound'
    alt: 'Diagram: why autoregressive generation is memory-bandwidth bound'
    description: 'A four-stage explanation of the memory-bandwidth bound covering parameter reads, arithmetic intensity, the resulting idle compute and speculative decoding.'
  - id: decoder-implications
    file: assets/decoder-implications.svg
    type: diagram
    title: 'Four consequences of autoregressive generation'
    alt: 'Diagram: the latency, memory, cost and safety implications of autoregressive decoding'
    description: 'A four-stage description of decoder implications covering sequential latency, cache memory, per-token cost and output unpredictability.'
  - id: decoder-when
    file: assets/decoder-when.svg
    type: diagram
    title: 'When to use a decoder'
    alt: 'Diagram: when autoregressive decoders are the right choice'
    description: 'A two-column comparison of tasks requiring generation against those better served by classification models.'
