questions:
- question: What is the primary objective of an Enterprise AI Security Review?
  options:
  - To buy expensive hardware
  - To systematically evaluate, threat-model, and architecturally harden an AI application across prompt
    ingress, data privacy, model supply chain, agent tool permissions, and regulatory governance
  - To write a marketing brochure
  - To benchmark GPU clock speeds
  answer_index: 1
  explanation: An AI security review audits and hardens the entire AI application lifecycle against adversarial
    threats and compliance breaches.
- question: In an integrated AI security architecture, what happens when an attacker injects a malicious
    prompt attempting to exfiltrate database credentials?
  options:
  - The server shuts down permanently
  - 'Defense-in-depth layers engage: (1) Input firewall detects heuristic keywords; (2) XML delimiters
    isolate the text as data; (3) Read-only DB connection prevents unauthorized writes; and (4) Outbound
    canary monitor drops any leaked secrets'
  - The LLM sends an apology email
  - The database automatically creates a new table
  answer_index: 1
  explanation: Multi-layered perimeters ensure that even if one defensive barrier fails, redundant architectural
    controls prevent exploitation.
- question: How does an integrated security platform demonstrate compliance with the EU AI Act High-Risk
    requirements?
  options:
  - By posting on social media
  - By generating automated technical documentation, maintaining continuous risk management logs (DREAD),
    auditing demographic fairness, and enforcing human oversight kill switches
  - By deleting all customer accounts
  - By running only on open-source hardware
  answer_index: 1
  explanation: High-risk compliance mandates documented risk systems, fairness testing, audit logs, and
    human oversight.
- question: Why must PII tokenization occur BEFORE prompt transmission to an LLM rather than after?
  options:
  - To make the prompt longer
  - To ensure that unencrypted raw customer PII (names, SSNs, credit cards) never crosses network boundaries
    into third-party cloud LLM logs or model training buffers
  - Because Python strings are immutable
  - To speed up GPU matrix multiplication
  answer_index: 1
  explanation: Ingress tokenization prevents raw personal data from ever leaving the secure local perimeter.
- question: What is the final deliverable of an automated AI security review pipeline?
  options:
  - A paper invoice
  - An Executive AI Security & Compliance Report detailing DREAD threat priorities, prompt firewall efficacy,
    AIBOM supply chain integrity, ASR red teaming benchmarks, and prioritized remediation actions
  - A new Python package release
  - A screenshot of a terminal window
  answer_index: 1
  explanation: An executive security report synthesizes quantitative metrics, vulnerability findings,
    and actionable remediation priorities.
