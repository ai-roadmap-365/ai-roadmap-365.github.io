visuals:
- id: unified-enterprise-ai-security-architecture-topology
  file: assets/unified-enterprise-ai-security-architecture-topology.svg
  type: diagram
  title: Unified Enterprise AI Security Architecture Topology
  alt: Unified Enterprise AI Security Architecture Topology showing Client Ingress, Multi-Layer Security
    Gateway (Firewall, PII Vault, Canary), SafeTensors Inference Engine, Scoped Agent Sandbox, and Governance
    Audit Logger
  description: Comprehensive system topology diagram illustrating the multi-layer AI security architecture.
- id: end-to-end-ai-security-audit-and-remediation-flow
  file: assets/end-to-end-ai-security-audit-and-remediation-flow.svg
  type: diagram
  title: End-to-End AI Security Audit and Remediation Flow
  alt: End-to-End AI Security Audit and Remediation Flow showing Threat Modeling, Supply Chain AST Scanning,
    Automated Red Teaming, DREAD Risk Scoring, and Executive Report Generation
  description: Lifecycle workflow diagram detailing the complete AI security review process.
- id: six-pillars
  file: assets/six-pillars.svg
  type: diagram
  title: 'Six pillars, one review'
  alt: 'Diagram: the six pillars of an end-to-end AI security review'
  description: 'A six-stage description of the pillars of an AI security review from threat modelling through prompt defence, privacy, supply chain, governance and red teaming.'
- id: layers-hold
  file: assets/layers-hold.svg
  type: diagram
  title: 'What happens when one layer fails'
  alt: 'Diagram: how remaining layers contain a failure of the prompt firewall'
  description: 'A two-column comparison of a single-control system against a layered one when a novel jailbreak bypasses the input firewall.'
- id: security-eras
  file: assets/security-eras.svg
  type: diagram
  title: 'Three generations of AI security'
  alt: 'Diagram: the progression from siloed AppSec to unified AI security platforms'
  description: 'A three-stage progression of enterprise AI security from siloed teams through reactive keyword guardrails to integrated defence-in-depth platforms.'
- id: review-not-checklist
  file: assets/review-not-checklist.svg
  type: diagram
  title: 'Two failure modes of a review'
  alt: 'Diagram: an executable security review compared with a paper checklist'
  description: 'A two-column comparison of an automated multi-pillar security audit against a documentary checklist and a point-in-time test.'
- id: audit-workflow
  file: assets/audit-workflow.svg
  type: diagram
  title: 'The audit, in order'
  alt: 'Diagram: the stages of an end-to-end AI security audit'
  description: 'A five-stage description of a security audit covering threat modelling, supply chain scanning, red teaming, risk scoring and report generation.'
- id: submarine-commissioning
  file: assets/submarine-commissioning.svg
  type: diagram
  title: 'Commissioning a submarine'
  alt: 'Diagram: submarine commissioning as an analogy for a layered AI security review'
  description: 'A two-column comparison mapping submarine commissioning checks onto the pillars of an AI security review.'
- id: hardening-pillars
  file: assets/hardening-pillars.svg
  type: diagram
  title: 'The six thresholds'
  alt: 'Diagram: the numeric threshold each security pillar must meet'
  description: 'A six-stage description of the measurable thresholds for each security pillar before general availability.'
- id: review-hazards
  file: assets/review-hazards.svg
  type: diagram
  title: 'Four ways the review itself fails'
  alt: 'Diagram: the four failure modes of a comprehensive AI security review'
  description: 'A four-stage description of security review failure modes covering unverified checklists, single-pillar coverage, untested controls and stale scope.'
- id: latency-budget
  file: assets/latency-budget.svg
  type: diagram
  title: 'What the whole gateway costs'
  alt: 'Diagram: the latency cost of the full security pipeline against the protection it provides'
  description: 'A two-column comparison of the measured latency of all security controls against the exposures they remove.'
- id: review-when
  file: assets/review-when.svg
  type: diagram
  title: 'Where the full review applies'
  alt: 'Diagram: when the complete security review is required and what applies regardless'
  description: 'A two-column comparison of systems requiring the full six-pillar review against lighter contexts, and the controls that apply at any scale.'
