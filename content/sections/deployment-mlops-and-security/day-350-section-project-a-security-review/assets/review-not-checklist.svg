<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One shallow, one stale.">
  <title>Two failure modes of a review</title>
  <style>
    .review-not-checklist-bg   { fill: #f8fafc; }
    .review-not-checklist-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-not-checklist-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-not-checklist-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-not-checklist-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-not-checklist-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-not-checklist-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-not-checklist-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-not-checklist-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-not-checklist-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-not-checklist-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-not-checklist-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-not-checklist-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-not-checklist-row { opacity: 1; }
    .review-not-checklist-r0 { animation-delay: 0.00s; }
    .review-not-checklist-r1 { animation-delay: 0.45s; }
    .review-not-checklist-r2 { animation-delay: 0.90s; }
    .review-not-checklist-r3 { animation-delay: 1.35s; }
    .review-not-checklist-r4 { animation-delay: 1.80s; }
    .review-not-checklist-row { animation: review-not-checklist-reveal 7.3s ease-in-out infinite; }
    @keyframes review-not-checklist-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-not-checklist-bg" width="980" height="390"/>
  <text class="review-not-checklist-h1"  x="30" y="40">Two failure modes of a review</text>
  <text class="review-not-checklist-sub" x="30" y="64">One shallow, one stale.</text>
  <rect class="review-not-checklist-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-not-checklist-name" x="46" y="122">An executable review</text>
  <text class="review-not-checklist-desc" x="46" y="142">Verified in code.</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r0" x="46" y="182">Six pillars, each producing an artefact</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r1" x="46" y="216">DREAD scores and empirical ASR</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r2" x="46" y="250">Runs on every pull request</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r3" x="46" y="284">Findings become code changes</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r4" x="46" y="318">An executive report generated, not written</text>
  <rect class="review-not-checklist-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-not-checklist-name" x="526" y="122">Two failure modes</text>
  <text class="review-not-checklist-desc" x="526" y="142">Both feel complete.</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r0" x="526" y="182">A paper checklist with no verification</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r1" x="526" y="216">Ticked once, by someone reading</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r2" x="526" y="250">A point-in-time test, then discarded</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r3" x="526" y="284">Each new tool moves a boundary</text>
  <text class="review-not-checklist-desc review-not-checklist-row review-not-checklist-r4" x="526" y="318">And nothing re-checks it</text>
  <text class="review-not-checklist-sub" x="30" y="372">Day 344's re-review triggers apply to the whole review, not only the threat model: a new tool, a widened scope or a new data source invalidates findings across several pillars at once.</text>
</svg>
