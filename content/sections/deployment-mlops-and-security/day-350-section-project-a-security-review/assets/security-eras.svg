<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From silos to a platform.">
  <title>Three generations of AI security</title>
  <style>
    .security-eras-bg   { fill: #f8fafc; }
    .security-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .security-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .security-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .security-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .security-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .security-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .security-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .security-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .security-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .security-eras-stage { opacity: 1; }

    .security-eras-s0 { animation-delay: 0.00s; }
    .security-eras-e0 { animation-delay: 0.00s; }
    .security-eras-s1 { animation-delay: 1.50s; }
    .security-eras-e1 { animation-delay: 1.50s; }
    .security-eras-s2 { animation-delay: 3.00s; }
    .security-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .security-eras-conn  { animation: security-eras-trace 6s ease-in-out infinite; }
      .security-eras-stage { animation: security-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes security-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes security-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .security-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .security-eras-stage { animation: security-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes security-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="security-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="security-eras-bg" width="980" height="322"/>
  <text class="security-eras-h1"  x="30" y="40">Three generations of AI security</text>
  <text class="security-eras-sub" x="30" y="64">From silos to a platform.</text>
  <g class="security-eras-stage security-eras-s0">
    <rect class="security-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="security-eras-step" x="44" y="142">01</text>
    <text class="security-eras-name" x="70" y="142">Silos, 2020-2022</text>
    <text class="security-eras-desc" x="44" y="166">AppSec audited ports and SQL; data science</text>
    <text class="security-eras-desc" x="44" y="182">trained in unmonitored notebooks.</text>
  </g>
  <line class="security-eras-line security-eras-conn security-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#security-eras-tip)"/>
  <g class="security-eras-stage security-eras-s1">
    <rect class="security-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="security-eras-step" x="359" y="142">02</text>
    <text class="security-eras-name" x="385" y="142">Reactive guardrails, 2023-2024</text>
    <text class="security-eras-desc" x="359" y="166">Regex filters in front of an LLM, bypassed by</text>
    <text class="security-eras-desc" x="359" y="182">phrasing and by RAG injection.</text>
  </g>
  <line class="security-eras-line security-eras-conn security-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#security-eras-tip)"/>
  <g class="security-eras-stage security-eras-s2">
    <rect class="security-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="security-eras-step" x="674" y="142">03</text>
    <text class="security-eras-name" x="700" y="142">Unified platforms, 2025</text>
    <text class="security-eras-desc" x="674" y="166">Threat modelling, vaults, signed registries</text>
    <text class="security-eras-desc" x="674" y="182">and red teaming, in CI.</text>
  </g>
  <text class="security-eras-sub" x="30" y="304">The blind spot in the first generation is worth naming precisely: model deserialisation and prompt handling belonged to neither team, so neither team was looking at them.</text>
</svg>
