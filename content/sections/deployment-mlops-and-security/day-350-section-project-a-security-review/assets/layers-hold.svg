<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The others are why it is not an incident.">
  <title>What happens when one layer fails</title>
  <style>
    .layers-hold-bg   { fill: #f8fafc; }
    .layers-hold-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layers-hold-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layers-hold-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layers-hold-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layers-hold-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .layers-hold-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layers-hold-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .layers-hold-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .layers-hold-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .layers-hold-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .layers-hold-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .layers-hold-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .layers-hold-row { opacity: 1; }
    .layers-hold-r0 { animation-delay: 0.00s; }
    .layers-hold-r1 { animation-delay: 0.45s; }
    .layers-hold-r2 { animation-delay: 0.90s; }
    .layers-hold-r3 { animation-delay: 1.35s; }
    .layers-hold-r4 { animation-delay: 1.80s; }
    .layers-hold-row { animation: layers-hold-reveal 7.3s ease-in-out infinite; }
    @keyframes layers-hold-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="layers-hold-bg" width="980" height="390"/>
  <text class="layers-hold-h1"  x="30" y="40">What happens when one layer fails</text>
  <text class="layers-hold-sub" x="30" y="64">The others are why it is not an incident.</text>
  <rect class="layers-hold-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="layers-hold-name" x="46" y="122">One control</text>
  <text class="layers-hold-desc" x="46" y="142">The firewall was the system.</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r0" x="46" y="182">A novel jailbreak gets through</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r1" x="46" y="216">Raw PII is in the context</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r2" x="46" y="250">The agent has write access</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r3" x="46" y="284">The system prompt leaves in the answer</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r4" x="46" y="318">One bypass, total compromise</text>
  <rect class="layers-hold-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="layers-hold-name" x="526" y="122">Six layers</text>
  <text class="layers-hold-desc" x="526" y="142">The bypass is contained.</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r0" x="526" y="182">The jailbreak gets through</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r1" x="526" y="216">The vault kept the data pseudonymous</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r2" x="526" y="250">The connection is read-only</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r3" x="526" y="284">The canary intercepts the exfiltration</text>
  <text class="layers-hold-desc layers-hold-row layers-hold-r4" x="526" y="318">One bypass, one logged event</text>
  <text class="layers-hold-sub" x="30" y="372">This is the argument for depth stated concretely: the layers are not redundant, because each one contains a different consequence of the same successful attack.</text>
</svg>
