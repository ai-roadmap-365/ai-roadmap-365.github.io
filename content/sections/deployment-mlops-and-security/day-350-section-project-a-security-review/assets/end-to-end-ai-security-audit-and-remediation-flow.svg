<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End AI Security Audit and Remediation Flow">
  <title>End-to-End AI Security Audit and Remediation Flow</title>
  <defs>
    <style>
      .d350b-bg { fill: #f8fafc; }
      .d350b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d350b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d350b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d350b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d350b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d350b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d350b-bg" />
  
  <text x="40" y="40" class="d350a-title">AI Security Audit &amp; Remediation Lifecycle</text>
  <text x="40" y="65" class="d350a-subtitle">End-to-End AI Security Audit and Remediation Flow showing Threat Modeling, Supply Chain AST Scanning, Automated Red Teaming, DREAD Risk Scoring, and Executive Report Generation</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d350b-step" />
  <text x="55" y="145" class="d350b-header" fill="#1d4ed8">1. Threat Model</text>
  <text x="55" y="180" class="d350b-text">• Map data flows</text>
  <text x="55" y="205" class="d350b-text">• STRIDE AI analysis</text>
  <text x="55" y="230" class="d350b-text">• OWASP Top 10 map</text>
  <text x="55" y="255" class="d350b-text">• Draw trust perimeters</text>
  <text x="55" y="300" class="d350b-text" font-weight="600">Architectural Baseline</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d350b-step" />
  <text x="265" y="145" class="d350b-header" fill="#1d4ed8">2. Supply Chain</text>
  <text x="265" y="180" class="d350b-text">• Ban .pt / .pkl</text>
  <text x="265" y="205" class="d350b-text">• SafeTensors verify</text>
  <text x="265" y="230" class="d350b-text">• SHA256 checksums</text>
  <text x="265" y="255" class="d350b-text">• CycloneDX AIBOM</text>
  <text x="265" y="300" class="d350b-text" font-weight="600">Artifact Integrity</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d350b-step" />
  <text x="475" y="145" class="d350b-header" fill="#1d4ed8">3. Red Team Fuzz</text>
  <text x="475" y="180" class="d350b-text">• Automated probes</text>
  <text x="475" y="205" class="d350b-text">• Crescendo multi-turn</text>
  <text x="475" y="230" class="d350b-text">• Safety Judge scoring</text>
  <text x="475" y="255" class="d350b-text">• Measure ASR metric</text>
  <text x="475" y="300" class="d350b-text" font-weight="600">Empirical Attack Test</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d350b-step" />
  <text x="685" y="145" class="d350b-header" fill="#1d4ed8">4. Remediation</text>
  <text x="685" y="180" class="d350b-text">• DREAD risk ranking</text>
  <text x="685" y="205" class="d350b-text">• Deploy PII Vault</text>
  <text x="685" y="230" class="d350b-text">• Deploy Prompt WAF</text>
  <text x="685" y="255" class="d350b-text">• Executive audit sign-off</text>
  <text x="685" y="300" class="d350b-text" font-weight="600">Hardened Production</text>
</svg>