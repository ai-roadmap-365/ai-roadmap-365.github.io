<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each is a day of this week.">
  <title>Six pillars, one review</title>
  <style>
    .six-pillars-bg   { fill: #f8fafc; }
    .six-pillars-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .six-pillars-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .six-pillars-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .six-pillars-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .six-pillars-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .six-pillars-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .six-pillars-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .six-pillars-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .six-pillars-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .six-pillars-stage { opacity: 1; }

    .six-pillars-s0 { animation-delay: 0.00s; }
    .six-pillars-e0 { animation-delay: 0.00s; }
    .six-pillars-s1 { animation-delay: 1.37s; }
    .six-pillars-e1 { animation-delay: 1.37s; }
    .six-pillars-s2 { animation-delay: 2.74s; }
    .six-pillars-e2 { animation-delay: 2.74s; }
    .six-pillars-s3 { animation-delay: 4.11s; }
    .six-pillars-e3 { animation-delay: 4.11s; }
    .six-pillars-s4 { animation-delay: 5.49s; }
    .six-pillars-e4 { animation-delay: 5.49s; }
    .six-pillars-s5 { animation-delay: 6.86s; }
    .six-pillars-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .six-pillars-conn  { animation: six-pillars-trace 9.600000000000001s ease-in-out infinite; }
      .six-pillars-stage { animation: six-pillars-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes six-pillars-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes six-pillars-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .six-pillars-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .six-pillars-stage { animation: six-pillars-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes six-pillars-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="six-pillars-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="six-pillars-bg" width="980" height="322"/>
  <text class="six-pillars-h1"  x="30" y="40">Six pillars, one review</text>
  <text class="six-pillars-sub" x="30" y="64">Each is a day of this week.</text>
  <g class="six-pillars-stage six-pillars-s0">
    <rect class="six-pillars-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="44" y="142">01</text>
    <text class="six-pillars-name" x="70" y="142">Threat model</text>
    <text class="six-pillars-desc" x="44" y="166">Trust boundaries,</text>
    <text class="six-pillars-desc" x="44" y="182">STRIDE, DREAD</text>
    <text class="six-pillars-desc" x="44" y="198">priorities.</text>
    <text class="six-pillars-edge" x="44" y="242">Day 344</text>
  </g>
  <line class="six-pillars-line six-pillars-conn six-pillars-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#six-pillars-tip)"/>
  <g class="six-pillars-stage six-pillars-s1">
    <rect class="six-pillars-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="201" y="142">02</text>
    <text class="six-pillars-name" x="227" y="142">Prompt defence</text>
    <text class="six-pillars-desc" x="201" y="166">Escaping,</text>
    <text class="six-pillars-desc" x="201" y="182">delimiters,</text>
    <text class="six-pillars-desc" x="201" y="198">quarantine, canary</text>
    <text class="six-pillars-edge" x="201" y="242">Day 345</text>
  </g>
  <line class="six-pillars-line six-pillars-conn six-pillars-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#six-pillars-tip)"/>
  <g class="six-pillars-stage six-pillars-s2">
    <rect class="six-pillars-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="358" y="142">03</text>
    <text class="six-pillars-name" x="384" y="142">Privacy</text>
    <text class="six-pillars-desc" x="358" y="166">Token vault,</text>
    <text class="six-pillars-desc" x="358" y="182">differential</text>
    <text class="six-pillars-desc" x="358" y="198">privacy, key-based</text>
    <text class="six-pillars-edge" x="358" y="242">Day 346</text>
  </g>
  <line class="six-pillars-line six-pillars-conn six-pillars-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#six-pillars-tip)"/>
  <g class="six-pillars-stage six-pillars-s3">
    <rect class="six-pillars-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="515" y="142">04</text>
    <text class="six-pillars-name" x="541" y="142">Supply chain</text>
    <text class="six-pillars-desc" x="515" y="166">SafeTensors,</text>
    <text class="six-pillars-desc" x="515" y="182">signatures, AIBOM,</text>
    <text class="six-pillars-desc" x="515" y="198">admission control.</text>
    <text class="six-pillars-edge" x="515" y="242">Day 347</text>
  </g>
  <line class="six-pillars-line six-pillars-conn six-pillars-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#six-pillars-tip)"/>
  <g class="six-pillars-stage six-pillars-s4">
    <rect class="six-pillars-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="672" y="142">05</text>
    <text class="six-pillars-name" x="698" y="142">Governance</text>
    <text class="six-pillars-desc" x="672" y="166">Risk tier, fairness</text>
    <text class="six-pillars-desc" x="672" y="182">metrics, model card,</text>
    <text class="six-pillars-desc" x="672" y="198">human oversight.</text>
    <text class="six-pillars-edge" x="672" y="242">Day 348</text>
  </g>
  <line class="six-pillars-line six-pillars-conn six-pillars-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#six-pillars-tip)"/>
  <g class="six-pillars-stage six-pillars-s5">
    <rect class="six-pillars-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="six-pillars-step" x="829" y="142">06</text>
    <text class="six-pillars-name" x="855" y="142">Red teaming</text>
    <text class="six-pillars-desc" x="829" y="166">Automated fuzzing,</text>
    <text class="six-pillars-desc" x="829" y="182">per-category ASR, a</text>
    <text class="six-pillars-desc" x="829" y="198">release gate.</text>
    <text class="six-pillars-edge" x="829" y="242">Day 349</text>
  </g>
  <text class="six-pillars-sub" x="30" y="304">Each pillar produces a machine-checkable artefact rather than a document, which is what makes the whole review runnable on a pull request rather than scheduled as a quarterly exercise.</text>
</svg>
