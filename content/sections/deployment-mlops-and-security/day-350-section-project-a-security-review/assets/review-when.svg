<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what never gets skipped.">
  <title>Where the full review applies</title>
  <style>
    .review-when-bg   { fill: #f8fafc; }
    .review-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .review-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .review-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .review-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .review-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .review-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .review-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .review-when-row { opacity: 1; }
    .review-when-r0 { animation-delay: 0.00s; }
    .review-when-r1 { animation-delay: 0.45s; }
    .review-when-r2 { animation-delay: 0.90s; }
    .review-when-r3 { animation-delay: 1.35s; }
    .review-when-r4 { animation-delay: 1.80s; }
    .review-when-row { animation: review-when-reveal 7.3s ease-in-out infinite; }
    @keyframes review-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="review-when-bg" width="980" height="390"/>
  <text class="review-when-h1"  x="30" y="40">Where the full review applies</text>
  <text class="review-when-sub" x="30" y="64">And what never gets skipped.</text>
  <rect class="review-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="review-when-name" x="46" y="122">The full review</text>
  <text class="review-when-desc" x="46" y="142">Anything in production.</text>
  <text class="review-when-desc review-when-row review-when-r0" x="46" y="182">All production AI applications</text>
  <text class="review-when-desc review-when-row review-when-r1" x="46" y="216">Customer-facing services</text>
  <text class="review-when-desc review-when-row review-when-r2" x="46" y="250">Enterprise agent workflows</text>
  <text class="review-when-desc review-when-row review-when-r3" x="46" y="284">Capstone projects</text>
  <text class="review-when-desc review-when-row review-when-r4" x="46" y="318">Regulatory compliance audits</text>
  <rect class="review-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="review-when-name" x="526" y="122">Regardless</text>
  <text class="review-when-desc" x="526" y="142">Four cheap things.</text>
  <text class="review-when-desc review-when-row review-when-r0" x="526" y="182">SafeTensors, never pickle</text>
  <text class="review-when-desc review-when-row review-when-r1" x="526" y="216">PII scrubbed before any write</text>
  <text class="review-when-desc review-when-row review-when-r2" x="526" y="250">Tools least-privilege and parameterised</text>
  <text class="review-when-desc review-when-row review-when-r3" x="526" y="284">A canary in the system prompt</text>
  <text class="review-when-desc review-when-row review-when-r4" x="526" y="318">Offline experiments are not an exception for the first</text>
  <text class="review-when-sub" x="30" y="372">The first item on the right has no size threshold worth honouring: loading an untrusted pickle on a laptop runs a stranger's code on the machine that holds your credentials.</text>
</svg>
