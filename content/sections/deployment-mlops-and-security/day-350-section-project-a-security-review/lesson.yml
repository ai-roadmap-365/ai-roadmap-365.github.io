learning_promise: 'Synthesize the entire Section 08 security discipline: conduct an end-to-end security
  review of an enterprise AI application, threat model attack trees, deploy prompt firewalls, enforce
  PII vaults, verify SafeTensors supply chains, and build an integrated security review platform in Python.'
objectives:
- Synthesize STRIDE for AI, OWASP Top 10 for LLMs, and DREAD scoring into a unified threat model review.
- Implement a production Multi-Layer Security Perimeter combining prompt injection defense, XML delimiter
  wrapping, and canary exfiltration monitors.
- Integrate an In-Memory Zero-Knowledge PII Token Vault with bidirectional pseudonymization and GDPR right-to-be-forgotten
  deletion.
- Validate model supply chain integrity, blocking pickle checkpoints and generating CycloneDX-AI bills
  of materials (AIBOM).
- Build a Unified Enterprise AI Security Platform in Python that automates audits, runs adversarial red
  teaming, and produces executive security reports.
