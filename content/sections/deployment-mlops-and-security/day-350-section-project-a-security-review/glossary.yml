terms:
- term: AI Security Review
  definition: A comprehensive assessment evaluating threat models, prompt safety, privacy, and supply
    chain integrity.
- term: Defense-in-Depth for AI
  definition: Deploying multiple redundant security layers so no single failure compromises the system.
- term: Unified Security Gateway
  definition: An architectural ingress/egress proxy orchestrating prompt firewalls, PII vaults, and canary
    monitors.
- term: Executive Security Report
  definition: A structured summary synthesizing technical vulnerability findings and business risk ratings.
- term: Remediation Action Plan
  definition: A prioritized engineering backlog detailing code and architectural fixes for identified
    threats.
- term: Trust Perimeter
  definition: The hardened boundary separating untrusted user data from enterprise databases and credentials.
- term: Zero-Trust AI Architecture
  definition: A security model treating all model inputs, outputs, and third-party weights as untrusted.
- term: Conformity Evidence
  definition: Cryptographic and analytical artifacts proving compliance with regulations like the EU AI
    Act.
