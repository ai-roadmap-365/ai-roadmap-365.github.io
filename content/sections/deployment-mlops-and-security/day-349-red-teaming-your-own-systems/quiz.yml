questions:
- question: What is the core operational principle of Prompt Automatic Iterative Refinement (PAIR) red
    teaming?
  options:
  - Using a human red teamer typing for 24 hours straight
  - An attacker LLM automatically generates candidate jailbreaks, evaluates target model responses, and
    iteratively refines linguistic adversarial prompts over multiple rounds until safety guardrails are
    bypassed
  - Deleting the target model's weights
  - Fuzzing network TCP packets with random bytes
  answer_index: 1
  explanation: PAIR uses an attacker LLM in a feedback loop to automatically craft and refine semantic
    jailbreaks.
- question: What is a 'Crescendo Attack' in conversational AI red teaming?
  options:
  - Playing loud music into the microphone
  - A multi-turn adversarial dialogue strategy where an attacker starts with benign, innocuous questions
    and gradually escalates conversational framing across 5–10 turns to erode safety guardrails without
    triggering single-turn keyword filters
  - Overloading the server CPU with infinite loops
  - Translating text into musical notes
  answer_index: 1
  explanation: Crescendo attacks bypass safety guardrails by gradually escalating context across multi-turn
    dialogues.
- question: How is the 'Attack Success Rate' (ASR) calculated in an AI red team evaluation?
  options:
  - ASR = Total Requests / CPU Time
  - ASR = (Number of Successful Safety Guardrail Bypasses / Total Adversarial Attack Probes Attempted)
    * 100
  - ASR = Model Size in GB / Token Count
  - ASR = 100 - Epsilon
  answer_index: 1
  explanation: ASR measures the percentage of adversarial probes that successfully trigger unsafe model
    behavior.
- question: What role does an 'LLM-as-a-Judge' play in automated red teaming harnesses (like PyRIT)?
  options:
  - It serves as a legal judge in a courtroom
  - An auxiliary evaluator model evaluates the target application's completion against a formal safety
    rubric to automatically score whether a response constitutes a successful jailbreak, refusal, or benign
    answer
  - It compiles C++ binaries
  - It generates cryptographic SSL certificates
  answer_index: 1
  explanation: Judge models automate the scoring and classification of target responses during high-throughput
    fuzzing.
- question: Why must AI red teaming be run as a continuous regression test in CI/CD pipelines?
  options:
  - To make CI pipelines run slower
  - Because prompt engineering changes, system prompt updates, or underlying model checkpoint upgrades
    frequently introduce subtle safety regressions that re-open previously patched jailbreaks
  - Because the law requires daily code commits
  - Because GPU memory degrades over time
  answer_index: 1
  explanation: Continuous automated red teaming prevents regression vulnerabilities when prompts and models
    are updated.
