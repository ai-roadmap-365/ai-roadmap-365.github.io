learning_promise: 'Master automated AI red teaming: orchestrate multi-turn adversarial jailbreak fuzzing
  (PAIR, Crescendo attacks), benchmark against PyRIT and Garak taxonomies, evaluate Attack Success Rates
  (ASR), and build an automated red-team harness in Python.'
objectives:
- Contrast manual penetration testing with Automated AI Red Teaming using algorithmic attack frameworks
  (PAIR, GCG, TAP).
- Implement Multi-Turn Adversarial Dialogue (Crescendo attacks) testing gradual boundary erosion in conversational
  agents.
- Benchmark prompt defenses against standardized vulnerability probes across the Garak and PyRIT threat
  taxonomies.
- Calculate Attack Success Rate (ASR) and Defense Bypass F-Score across diverse adversarial persona and
  obfuscation vectors.
- Build an Automated Red Teaming Fuzzer in Python with automated LLM-as-a-Judge vulnerability scoring
  and regression reporting.
