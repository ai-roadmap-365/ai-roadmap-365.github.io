terms:
- term: AI Red Teaming
  definition: A systematic adversarial testing practice attempting to trigger failures, jailbreaks, and
    leaks in AI systems.
- term: PAIR (Iterative Refinement)
  definition: An algorithm where an attacker LLM iteratively refines jailbreak prompts based on target
    responses.
- term: Crescendo Attack
  definition: A multi-turn adversarial technique gradually steering conversations from benign topics into
    prohibited domains.
- term: Attack Success Rate (ASR)
  definition: The percentage of adversarial attack attempts that successfully bypass system guardrails.
- term: PyRIT
  definition: Python Risk Identification Toolkit for Generative AI (Microsoft's open-source automated
    red team framework).
- term: Garak
  definition: An open-source LLM vulnerability scanner probing hallucination, prompt injection, and toxic
    generations.
- term: LLM-as-a-Judge (Safety)
  definition: Using an evaluator LLM to classify target completions as safe refusals or successful jailbreaks.
- term: Adversarial Persona
  definition: A roleplaying technique (e.g. 'DAN', 'Academic Researcher') framing malicious queries as
    hypothetical analysis.
