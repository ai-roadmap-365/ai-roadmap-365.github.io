<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two mechanisms, both structural.">
  <title>Why models yield to crescendos</title>
  <style>
    .why-multi-turn-works-bg   { fill: #f8fafc; }
    .why-multi-turn-works-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-multi-turn-works-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-multi-turn-works-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-multi-turn-works-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-multi-turn-works-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .why-multi-turn-works-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .why-multi-turn-works-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .why-multi-turn-works-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .why-multi-turn-works-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .why-multi-turn-works-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .why-multi-turn-works-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .why-multi-turn-works-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .why-multi-turn-works-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .why-multi-turn-works-stage { opacity: 1; }

    .why-multi-turn-works-s0 { animation-delay: 0.00s; }
    .why-multi-turn-works-e0 { animation-delay: 0.00s; }
    .why-multi-turn-works-s1 { animation-delay: 1.50s; }
    .why-multi-turn-works-e1 { animation-delay: 1.50s; }
    .why-multi-turn-works-s2 { animation-delay: 3.00s; }
    .why-multi-turn-works-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .why-multi-turn-works-conn  { animation: why-multi-turn-works-trace 6s ease-in-out infinite; }
      .why-multi-turn-works-stage { animation: why-multi-turn-works-arrive 6s ease-in-out infinite; }
    }
    @keyframes why-multi-turn-works-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes why-multi-turn-works-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .why-multi-turn-works-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .why-multi-turn-works-stage { animation: why-multi-turn-works-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes why-multi-turn-works-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="why-multi-turn-works-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="why-multi-turn-works-bg" width="980" height="322"/>
  <text class="why-multi-turn-works-h1"  x="30" y="40">Why models yield to crescendos</text>
  <text class="why-multi-turn-works-sub" x="30" y="64">Two mechanisms, both structural.</text>
  <g class="why-multi-turn-works-stage why-multi-turn-works-s0">
    <rect class="why-multi-turn-works-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="why-multi-turn-works-step" x="44" y="142">01</text>
    <text class="why-multi-turn-works-name" x="70" y="142">Attention primes on the context</text>
    <text class="why-multi-turn-works-desc" x="44" y="166">Accumulated benign exchanges raise the weight</text>
    <text class="why-multi-turn-works-desc" x="44" y="182">on maintaining flow and helpfulness.</text>
  </g>
  <line class="why-multi-turn-works-line why-multi-turn-works-conn why-multi-turn-works-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#why-multi-turn-works-tip)"/>
  <g class="why-multi-turn-works-stage why-multi-turn-works-s1">
    <rect class="why-multi-turn-works-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="why-multi-turn-works-step" x="359" y="142">02</text>
    <text class="why-multi-turn-works-name" x="385" y="142">Commitment accumulates</text>
    <text class="why-multi-turn-works-desc" x="359" y="166">By turn 4 the model has already agreed to</text>
    <text class="why-multi-turn-works-desc" x="359" y="182">discuss precursors of the topic.</text>
  </g>
  <line class="why-multi-turn-works-line why-multi-turn-works-conn why-multi-turn-works-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#why-multi-turn-works-tip)"/>
  <g class="why-multi-turn-works-stage why-multi-turn-works-s2">
    <rect class="why-multi-turn-works-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="why-multi-turn-works-step" x="674" y="142">03</text>
    <text class="why-multi-turn-works-name" x="700" y="142">Which outweighs the system prompt</text>
    <text class="why-multi-turn-works-desc" x="674" y="166">A short instruction against a long</text>
    <text class="why-multi-turn-works-desc" x="674" y="182">conversation the model has been consistent</text>
    <text class="why-multi-turn-works-desc" x="674" y="198">with.</text>
  </g>
  <text class="why-multi-turn-works-sub" x="30" y="304">Framed this way it is a context-length problem as much as a safety one: the system prompt is a small fraction of the tokens by turn four, and everything else in the window points the other way.</text>
</svg>
