<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what triggers a run.">
  <title>Where continuous red teaming belongs</title>
  <style>
    .red-team-when-bg   { fill: #f8fafc; }
    .red-team-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .red-team-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .red-team-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .red-team-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .red-team-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .red-team-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .red-team-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .red-team-when-row { opacity: 1; }
    .red-team-when-r0 { animation-delay: 0.00s; }
    .red-team-when-r1 { animation-delay: 0.45s; }
    .red-team-when-r2 { animation-delay: 0.90s; }
    .red-team-when-r3 { animation-delay: 1.35s; }
    .red-team-when-r4 { animation-delay: 1.80s; }
    .red-team-when-row { animation: red-team-when-reveal 7.3s ease-in-out infinite; }
    @keyframes red-team-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="red-team-when-bg" width="980" height="390"/>
  <text class="red-team-when-h1"  x="30" y="40">Where continuous red teaming belongs</text>
  <text class="red-team-when-sub" x="30" y="64">And what triggers a run.</text>
  <rect class="red-team-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="red-team-when-name" x="46" y="122">Continuous</text>
  <text class="red-team-when-desc" x="46" y="142">Anything public or tool-enabled.</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r0" x="46" y="182">Production AI endpoints</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r1" x="46" y="216">Public chat interfaces</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r2" x="46" y="250">Autonomous tool-calling agents</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r3" x="46" y="284">Before every release</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r4" x="46" y="318">And every checkpoint upgrade</text>
  <rect class="red-team-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="red-team-when-name" x="526" y="122">Spot checks</text>
  <text class="red-team-when-desc" x="526" y="142">Sandboxes only.</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r0" x="526" y="182">Internal developer environments</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r1" x="526" y="216">Zero external tool permissions</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r2" x="526" y="250">No users to protect</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r3" x="526" y="284">Run the suite before it ships anyway</text>
  <text class="red-team-when-desc red-team-when-row red-team-when-r4" x="526" y="318">It costs four minutes</text>
  <text class="red-team-when-sub" x="30" y="372">"Every checkpoint upgrade" is the trigger people forget: swapping a base model or a LoRA adapter changes the behaviour the guardrails were tuned against, and the suite is the only thing that will notice.</text>
</svg>
