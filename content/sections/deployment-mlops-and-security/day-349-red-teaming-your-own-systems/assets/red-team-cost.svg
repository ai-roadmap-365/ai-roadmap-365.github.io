<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Against what it replaces.">
  <title>What continuous red teaming costs</title>
  <style>
    .red-team-cost-bg   { fill: #f8fafc; }
    .red-team-cost-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-cost-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-cost-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-cost-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-cost-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .red-team-cost-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .red-team-cost-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .red-team-cost-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .red-team-cost-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .red-team-cost-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .red-team-cost-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .red-team-cost-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .red-team-cost-row { opacity: 1; }
    .red-team-cost-r0 { animation-delay: 0.00s; }
    .red-team-cost-r1 { animation-delay: 0.45s; }
    .red-team-cost-r2 { animation-delay: 0.90s; }
    .red-team-cost-r3 { animation-delay: 1.35s; }
    .red-team-cost-r4 { animation-delay: 1.80s; }
    .red-team-cost-row { animation: red-team-cost-reveal 7.3s ease-in-out infinite; }
    @keyframes red-team-cost-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="red-team-cost-bg" width="980" height="390"/>
  <text class="red-team-cost-h1"  x="30" y="40">What continuous red teaming costs</text>
  <text class="red-team-cost-sub" x="30" y="64">Against what it replaces.</text>
  <rect class="red-team-cost-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="red-team-cost-name" x="46" y="122">Automated</text>
  <text class="red-team-cost-desc" x="46" y="142">$3.50 and four minutes.</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r0" x="46" y="182">1,000 probes with an attacker-judge loop</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r1" x="46" y="216">Under four minutes</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r2" x="46" y="250">Runs on every release</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r3" x="46" y="284">ASR tracked as a trendline</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r4" x="46" y="318">Blocks a deploy above a threshold</text>
  <rect class="red-team-cost-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="red-team-cost-name" x="526" y="122">Manual, annually</text>
  <text class="red-team-cost-desc" x="526" y="142">A consultant and a report.</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r0" x="526" y="182">Deep, creative, genuinely valuable</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r1" x="526" y="216">Once a year</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r2" x="526" y="250">A snapshot, immediately stale</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r3" x="526" y="284">No trendline</text>
  <text class="red-team-cost-desc red-team-cost-row red-team-cost-r4" x="526" y="318">And no gate</text>
  <text class="red-team-cost-sub" x="30" y="372">The two are complements rather than alternatives: automation gives coverage and a trend, and a human red teamer finds the class of attack nobody thought to encode into the suite.</text>
</svg>
