<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four steps, repeated automatically.">
  <title>The attacker-judge loop</title>
  <style>
    .pair-loop-bg   { fill: #f8fafc; }
    .pair-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pair-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pair-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pair-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pair-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pair-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pair-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pair-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pair-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pair-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pair-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pair-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pair-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pair-loop-stage { opacity: 1; }

    .pair-loop-s0 { animation-delay: 0.00s; }
    .pair-loop-e0 { animation-delay: 0.00s; }
    .pair-loop-s1 { animation-delay: 1.28s; }
    .pair-loop-e1 { animation-delay: 1.28s; }
    .pair-loop-s2 { animation-delay: 2.56s; }
    .pair-loop-e2 { animation-delay: 2.56s; }
    .pair-loop-s3 { animation-delay: 3.84s; }
    .pair-loop-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .pair-loop-conn  { animation: pair-loop-trace 6.4s ease-in-out infinite; }
      .pair-loop-stage { animation: pair-loop-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes pair-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pair-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pair-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pair-loop-stage { animation: pair-loop-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pair-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pair-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pair-loop-bg" width="980" height="322"/>
  <text class="pair-loop-h1"  x="30" y="40">The attacker-judge loop</text>
  <text class="pair-loop-sub" x="30" y="64">Four steps, repeated automatically.</text>
  <g class="pair-loop-stage pair-loop-s0">
    <rect class="pair-loop-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="pair-loop-step" x="44" y="142">01</text>
    <text class="pair-loop-name" x="70" y="142">An attacker model proposes</text>
    <text class="pair-loop-desc" x="44" y="166">A candidate prompt, mutated from</text>
    <text class="pair-loop-desc" x="44" y="182">the last attempt.</text>
  </g>
  <line class="pair-loop-line pair-loop-conn pair-loop-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#pair-loop-tip)"/>
  <g class="pair-loop-stage pair-loop-s1">
    <rect class="pair-loop-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="pair-loop-step" x="280" y="142">02</text>
    <text class="pair-loop-name" x="306" y="142">The target system answers</text>
    <text class="pair-loop-desc" x="280" y="166">Exactly as it would for a user.</text>
  </g>
  <line class="pair-loop-line pair-loop-conn pair-loop-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#pair-loop-tip)"/>
  <g class="pair-loop-stage pair-loop-s2">
    <rect class="pair-loop-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="pair-loop-step" x="516" y="142">03</text>
    <text class="pair-loop-name" x="542" y="142">A judge scores the response</text>
    <text class="pair-loop-desc" x="516" y="166">Refusal or compliance, against a</text>
    <text class="pair-loop-desc" x="516" y="182">deterministic rubric.</text>
    <text class="pair-loop-edge" x="516" y="242">the signal</text>
  </g>
  <line class="pair-loop-line pair-loop-conn pair-loop-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#pair-loop-tip)"/>
  <g class="pair-loop-stage pair-loop-s3">
    <rect class="pair-loop-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="pair-loop-step" x="752" y="142">04</text>
    <text class="pair-loop-name" x="778" y="142">Refine and repeat</text>
    <text class="pair-loop-desc" x="752" y="166">The score drives the next</text>
    <text class="pair-loop-desc" x="752" y="182">mutation. Thousands of attempts,</text>
    <text class="pair-loop-desc" x="752" y="198">unattended.</text>
    <text class="pair-loop-edge" x="752" y="242">1000x</text>
  </g>
  <text class="pair-loop-sub" x="30" y="304">The judge is the component that makes this automatable: without a reliable refusal signal there is no gradient to follow, and the loop degenerates into random prompting at scale.</text>
</svg>
