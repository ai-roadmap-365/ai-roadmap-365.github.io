week: 48
learning_promise:
  'Reduce Kubernetes to its one idea — a loop that compares declared state against
  actual state and takes one step — then implement it and watch a node failure, a manual deletion and
  a rolling update turn out to be the same situation. Learn why Running is not serving, and why a pass
  with no actions does not mean a rollout has finished.'
objectives:
  - Implement a reconciliation step that compares desired against actual and acts.
  - Distinguish a Running pod from a serving one, and say what a Service routes to.
  - Show that node failure, manual deletion and scaling are one mechanism.
  - Enforce maxUnavailable and maxSurge through a rolling update.
  - Explain why editing a running pod changes nothing durably.
