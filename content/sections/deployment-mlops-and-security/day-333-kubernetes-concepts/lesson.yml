section: deployment-mlops-and-security
subsection: deploying-ai-systems
week: 48
learning_promise: >-
  Master local and on-device model deployment: implement modern weight quantization formats (GGUF, AWQ, EXL2,
  bitsandbytes 4-bit), execute local C++ inference with llama.cpp, and optimize memory bandwidth in Python.
objectives:
  - >-
    Deconstruct the mathematical trade-offs between FP16, INT8, INT4, and ternary quantization formats
    (Perplexity vs VRAM).
  - >-
    Implement AWQ (Activation-aware Weight Quantization) protecting critical 1% salient weight channels from
    precision loss.
  - >-
    Deploy GGUF format models using llama.cpp with unified CPU/GPU offloading on Apple Silicon and edge
    hardware.
  - >-
    Build a production-grade Model Quantizer & Memory Profiler in Python computing scale factors, zero points,
    and perplexity degradation.
  - >-
    Evaluate on-device token generation speed (tokens/sec), thermal throttling, and battery consumption on
    edge devices.
