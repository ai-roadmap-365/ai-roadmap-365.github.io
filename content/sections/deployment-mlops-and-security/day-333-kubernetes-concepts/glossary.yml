terms:
  - term: Reconciliation Loop
    definition: A controller that repeatedly compares declared state against actual state and takes
      one step to close the gap. Kubernetes' single organising idea.
  - term: Desired State
    definition: What you declared — image, replica count, update budget. It describes an outcome and
      contains no instructions for reaching it.
  - term: Level-Triggered
    definition: Reacting to current state rather than to events. A missed event costs one pass of the
      loop instead of correctness, which is why the system self-corrects.
  - term: Pod
    definition: The running unit. It has a phase — Pending, Running, Failed — and separately an answer
      to whether it is ready.
  - term: Readiness Probe
    definition: A check deciding whether a pod may receive traffic. A Service routes only to ready
      pods, which makes the probe a traffic control rather than diagnostics.
  - term: Liveness Probe
    definition: A check deciding whether a container should be restarted. Distinct from readiness in
      consequence, and dangerous when it tests a downstream dependency.
  - term: Deployment
    definition: The declared state for a set of identical pods, including how many may be unavailable
      or surplus during an update.
  - term: maxUnavailable
    definition: The floor on how many pods must keep serving during a rollout. What stops an update
      from being an outage.
  - term: maxSurge
    definition: The ceiling on how many extra pods may exist temporarily during a rollout. What lets
      the update make progress without breaching the floor.
  - term: Service
    definition: A stable address that routes to the ready pods behind it. Membership changes
      automatically as readiness changes.
  - term: Scheduler
    definition: The component choosing which node a pod runs on. A pod it cannot place stays Pending
      indefinitely, which is the most common "why is nothing happening".
