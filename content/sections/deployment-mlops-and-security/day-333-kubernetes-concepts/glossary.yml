terms:
- term: Quantization
  definition: Compressing high-precision float weights (FP32/FP16) into low-bit integers (INT8/INT4).
- term: GGUF
  definition: The standard binary format used by llama.cpp encapsulating weights, metadata, and tokenizers.
- term: AWQ (Activation-aware Weight Quantization)
  definition: A 4-bit quantization method protecting the top 1% salient activation channels.
- term: llama.cpp
  definition: A high-performance C++ LLM inference engine optimized for Apple Silicon, CPU, and edge devices.
- term: Layer Offloading
  definition: Splitting model layers between GPU VRAM and CPU system RAM based on available hardware capacity.
- term: Memory Bandwidth
  definition: The rate at which data can be read from or written to memory (GB/s), governing decode speed.
- term: Perplexity (PPL)
  definition: A mathematical measure of how well a probability model predicts a sample; lower is better.
- term: Zero-Point & Scale Factor
  definition: The affine transformation parameters used to map floating-point values into low-bit integers.
