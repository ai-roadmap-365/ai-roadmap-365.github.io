visuals:
  - id: the-reconciliation-loop
    file: assets/the-reconciliation-loop.svg
    type: diagram
    title: The Reconciliation Loop
    alt: The Reconciliation Loop showing desired state compared against actual state producing one step
      of actions
    description: Desired state, actual state and one step of actions, with the loop feeding back, and
      the contrast between level-triggered and edge-triggered behaviour.
  - id: four-situations-one-loop
    file: assets/four-situations-one-loop.svg
    type: diagram
    title: Four Situations, One Loop
    alt: Four Situations, One Loop showing a first deploy, node failure, manual deletion and a rolling
      update handled identically
    description: The four scenarios from the lab with node failure and manual deletion highlighted as
      producing the same action, plus the rollout step that has no actions and is not finished.
  - id: desired-actual-loop
    file: assets/desired-actual-loop.svg
    type: diagram
    title: 'Three parts, and that is all of it'
    alt: 'Diagram: the three components of the reconciliation loop'
    description: 'A three-stage description of Kubernetes reconciliation covering the declared desired state, the observed actual state, and the level-triggered loop that closes the gap.'
  - id: running-or-ready
    file: assets/running-or-ready.svg
    type: diagram
    title: 'Running is not ready'
    alt: 'Diagram: a pod that is Running compared with one that is ready'
    description: 'A two-column comparison of the Running phase against readiness, and what each says about whether a pod can serve traffic.'
  - id: k8s-lineage
    file: assets/k8s-lineage.svg
    type: diagram
    title: 'Where the loop came from'
    alt: 'Diagram: the progression from Borg to the operator pattern'
    description: 'A five-stage progression from Borg through Kubernetes, the operator pattern, level-triggered design and controller-side rolling updates.'
  - id: not-a-deploy-script
    file: assets/not-a-deploy-script.svg
    type: diagram
    title: 'Not a deployment script'
    alt: 'Diagram: what Kubernetes is compared with three things it is mistaken for'
    description: 'A two-column comparison of the declarative reconciliation model against three common misconceptions about what Kubernetes provides.'
  - id: pod-lifecycle
    file: assets/pod-lifecycle.svg
    type: diagram
    title: 'From submitted to serving'
    alt: 'Diagram: the stages from submitting a Deployment to a pod serving traffic'
    description: 'A six-stage description of the path from an accepted Deployment through controller reconciliation, scheduling, container start, readiness and Service membership.'
  - id: rolling-update-budget
    file: assets/rolling-update-budget.svg
    type: diagram
    title: 'Why a rollout pass does nothing'
    alt: 'Diagram: how maxUnavailable and maxSurge bound a rolling update'
    description: 'A four-stage description of a rolling update showing the replacement budget, the blocked pass, and the guarantee the two limits provide.'
  - id: thermostat-analogy
    file: assets/thermostat-analogy.svg
    type: diagram
    title: 'A thermostat, not a schedule'
    alt: 'Diagram: a heating schedule compared with a thermostat'
    description: 'A two-column comparison of an imperative heating schedule against a declarative thermostat, and what each does when something unexpected happens.'
  - id: four-situations
    file: assets/four-situations.svg
    type: diagram
    title: 'Four situations, one loop'
    alt: 'Diagram: the measured behaviour of one loop across four different situations'
    description: 'A four-stage reading of measured reconciliation results for a first deploy, a node failure, a manual deletion and a rolling update.'
  - id: probe-what-this-pod-can-do
    file: assets/probe-what-this-pod-can-do.svg
    type: diagram
    title: 'Probe this pod, not the world'
    alt: 'Diagram: a readiness probe scoped to the pod compared with one that checks a downstream dependency'
    description: 'A two-column comparison of a readiness probe testing only local capability against one that tests a shared downstream dependency.'
  - id: k8s-implications
    file: assets/k8s-implications.svg
    type: diagram
    title: 'Five consequences of the loop'
    alt: 'Diagram: the security, traffic, performance, scaling and cost implications of reconciliation'
    description: 'A five-stage description of Kubernetes implications covering the short half-life of manual changes, probes as traffic controls, scheduling latency, where scaling limits move, and requested capacity.'
  - id: readiness-versus-liveness
    file: assets/readiness-versus-liveness.svg
    type: diagram
    title: 'Readiness gates; liveness restarts'
    alt: 'Diagram: a readiness probe compared with a liveness probe'
    description: 'A two-column comparison of readiness and liveness probes by what each controls and what happens when they are confused.'
  - id: k8s-when
    file: assets/k8s-when.svg
    type: diagram
    title: 'When Kubernetes earns its cost'
    alt: 'Diagram: when to adopt Kubernetes and when to avoid it'
    description: 'A two-column comparison of situations where Kubernetes is worth its complexity against those where it adds a control plane for no benefit.'
