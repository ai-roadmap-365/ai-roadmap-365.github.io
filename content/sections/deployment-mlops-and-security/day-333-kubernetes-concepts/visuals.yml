visuals:
  - id: the-reconciliation-loop
    file: assets/the-reconciliation-loop.svg
    type: diagram
    title: The Reconciliation Loop
    alt: The Reconciliation Loop showing desired state compared against actual state producing one step
      of actions
    description: Desired state, actual state and one step of actions, with the loop feeding back, and
      the contrast between level-triggered and edge-triggered behaviour.
  - id: four-situations-one-loop
    file: assets/four-situations-one-loop.svg
    type: diagram
    title: Four Situations, One Loop
    alt: Four Situations, One Loop showing a first deploy, node failure, manual deletion and a rolling
      update handled identically
    description: The four scenarios from the lab with node failure and manual deletion highlighted as
      producing the same action, plus the rollout step that has no actions and is not finished.
