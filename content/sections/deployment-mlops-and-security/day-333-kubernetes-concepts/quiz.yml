questions:
  - question: Why do a node failure and a person running `kubectl delete pod` produce identical
      behaviour from the controller?
    options:
      - 'The loop compares declared state against what exists'
      - Because Kubernetes logs both events under the same category
      - Because both are treated as node failures internally
      - Because the API server rewrites manual deletions as node events
    answer_index: 0
    explanation: This is why deleting a pod is not destructive. Deletion is just another gap, and the
      next pass of the loop closes it.
  - question: Why does a first deploy of three replicas take two reconciliation steps rather than one?
    options:
      - Because the scheduler runs on a separate cycle from the controller
      - 'A pod needs a tick to run and another to pass readiness'
      - Because Kubernetes creates replicas one at a time
      - Because the first step only validates the manifest
    answer_index: 1
    explanation: The spec is satisfied after step one and a Service would route to nothing. That gap
      between Running and ready is the second idea of the day.
  - question: A reconcile pass returns no actions during a rolling update that is plainly unfinished.
      What is happening?
    options:
      - The controller has crashed and needs restarting
      - The rollout has silently failed and rolled back
      - 'maxUnavailable is already spent until replacements pass'
      - The desired state was overwritten by a competing controller
    answer_index: 2
    explanation: Having nothing to do this pass and having finished the work are different
      questions. Conflating them makes a half-finished rollout report success.
  - question: Why must replacement pods be scheduled onto a live node, and what happens if they are
      not?
    options:
      - It is only a performance optimisation
      - Because the API server refuses pods without a node label
      - Because dead nodes reject the container image
      - 'A pod on a dead node is reaped and recreated forever'
    answer_index: 3
    explanation: This is a real failure mode when a scheduler's node filter is wrong, and the lab's
      converge raises rather than spinning silently.
  - question: Why is editing a running pod not a durable way to change anything?
    options:
      - 'Anything not in the declaration is erased'
      - Because pods are read-only after creation
      - Because edits require a rolling restart to apply
      - Because the change applies only until the next readiness probe
    answer_index: 0
    explanation: An attacker who modifies a pod has made a change with a short half-life; one who
      modifies your manifests has made a permanent one.
