questions:
- question: What is the primary operational advantage of 4-bit quantization (e.g. AWQ, GGUF Q4_K_M) over
    FP16 baseline weights?
  options:
  - It makes the model think in four languages
  - It reduces model memory footprint by ~70% (e.g. shrinking a 7B model from 14GB in FP16 to ~4.2GB in
    4-bit), allowing it to fit into consumer GPUs (8GB VRAM) or smartphone RAM while retaining >99% of
    original perplexity quality
  - It increases training speed by 100x
  - It converts text into audio
  answer_index: 1
  explanation: 4-bit quantization reduces memory by 70% with negligible loss in reasoning accuracy.
- question: What core insight enables AWQ (Activation-aware Weight Quantization) to outperform naive Round-to-Nearest
    (RTN) quantization?
  options:
  - AWQ deletes 50% of the weights
  - 'Not all weights are equally important: AWQ observes activation magnitudes during forward passes,
    identifying that protecting only the top 1% most active weight channels from quantization error prevents
    perplexity degradation'
  - AWQ rounds all numbers to zero
  - AWQ only quantizes vowels
  answer_index: 1
  explanation: AWQ identifies and preserves salient weight channels corresponding to large activation
    magnitudes.
- question: What is the GGUF binary format (developed for llama.cpp)?
  options:
  - A video file container
  - A single-file binary format encapsulating model architecture metadata, tokenizer vocabulary, tensor
    shapes, and quantized weights in a structured endian-safe layout designed for fast `mmap` loading
    and unified CPU/GPU inference
  - A Python script
  - An encrypted database backup
  answer_index: 1
  explanation: GGUF packages weights, metadata, and tokenizers into a single mmap-able binary file for
    llama.cpp.
- question: How does `llama.cpp` handle running a 14GB model on a machine with only 6GB of GPU VRAM?
  options:
  - It crashes immediately
  - 'Layer Offloading (`-ngl / --n-gpu-layers`): it loads the first N layers onto the 6GB GPU VRAM and
    computes the remaining layers on the host CPU and system RAM seamlessly in a hybrid pipeline'
  - It deletes the remaining layers
  - It converts the model to pure text
  answer_index: 1
  explanation: Layer offloading splits transformer layers dynamically between GPU VRAM and CPU system
    RAM.
- question: Why is auto-regressive decode generation speed on edge devices primarily bounded by Memory
    Bandwidth rather than Compute FLOPs?
  options:
  - Because edge devices have no CPU
  - During decoding, every single generated token requires transferring all billions of model parameters
    from RAM to the compute cores; the arithmetic intensity is low (~1 FLOP per byte loaded), making RAM
    bandwidth (GB/s) the ultimate speed ceiling
  - Because Python is single-threaded
  - Because WiFi latency slows down memory
  answer_index: 1
  explanation: Auto-regressive token generation loads all model weights for every single token, making
    memory bandwidth the bottleneck.
