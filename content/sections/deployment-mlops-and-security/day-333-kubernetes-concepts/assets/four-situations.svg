<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two of them are indistinguishable.">
  <title>Four situations, one loop</title>
  <style>
    .four-situations-bg   { fill: #f8fafc; }
    .four-situations-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-situations-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-situations-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-situations-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-situations-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .four-situations-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .four-situations-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .four-situations-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .four-situations-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .four-situations-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .four-situations-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .four-situations-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .four-situations-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .four-situations-stage { opacity: 1; }

    .four-situations-s0 { animation-delay: 0.00s; }
    .four-situations-e0 { animation-delay: 0.00s; }
    .four-situations-s1 { animation-delay: 1.28s; }
    .four-situations-e1 { animation-delay: 1.28s; }
    .four-situations-s2 { animation-delay: 2.56s; }
    .four-situations-e2 { animation-delay: 2.56s; }
    .four-situations-s3 { animation-delay: 3.84s; }
    .four-situations-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .four-situations-conn  { animation: four-situations-trace 6.4s ease-in-out infinite; }
      .four-situations-stage { animation: four-situations-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes four-situations-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes four-situations-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .four-situations-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .four-situations-stage { animation: four-situations-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes four-situations-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="four-situations-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="four-situations-bg" width="980" height="322"/>
  <text class="four-situations-h1"  x="30" y="40">Four situations, one loop</text>
  <text class="four-situations-sub" x="30" y="64">Two of them are indistinguishable.</text>
  <g class="four-situations-stage four-situations-s0">
    <rect class="four-situations-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="four-situations-step" x="44" y="142">01</text>
    <text class="four-situations-name" x="70" y="142">First deploy: two steps, not one</text>
    <text class="four-situations-desc" x="44" y="166">After pass one, three pods exist</text>
    <text class="four-situations-desc" x="44" y="182">and none serves. The spec is</text>
    <text class="four-situations-desc" x="44" y="198">satisfied.</text>
    <text class="four-situations-edge" x="44" y="242">2 steps</text>
  </g>
  <line class="four-situations-line four-situations-conn four-situations-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#four-situations-tip)"/>
  <g class="four-situations-stage four-situations-s1">
    <rect class="four-situations-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="four-situations-step" x="280" y="142">02</text>
    <text class="four-situations-name" x="306" y="142">A node dies</text>
    <text class="four-situations-desc" x="280" y="166">delete api-001, create api-004.</text>
    <text class="four-situations-desc" x="280" y="182">2 of 3 replicas present.</text>
    <text class="four-situations-edge" x="280" y="242">same</text>
  </g>
  <line class="four-situations-line four-situations-conn four-situations-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#four-situations-tip)"/>
  <g class="four-situations-stage four-situations-s2">
    <rect class="four-situations-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="four-situations-step" x="516" y="142">03</text>
    <text class="four-situations-name" x="542" y="142">Somebody deletes a pod by hand</text>
    <text class="four-situations-desc" x="516" y="166">create api-005. Same reason</text>
    <text class="four-situations-desc" x="516" y="182">string, same action.</text>
    <text class="four-situations-edge" x="516" y="242">identical</text>
  </g>
  <line class="four-situations-line four-situations-conn four-situations-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#four-situations-tip)"/>
  <g class="four-situations-stage four-situations-s3">
    <rect class="four-situations-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="four-situations-step" x="752" y="142">04</text>
    <text class="four-situations-name" x="778" y="142">Rolling update</text>
    <text class="four-situations-desc" x="752" y="166">Serving during rollout: 2, 4, 2,</text>
    <text class="four-situations-desc" x="752" y="182">3. Minimum exactly two.</text>
  </g>
  <text class="four-situations-sub" x="30" y="304">The loop has no notion of cause: a hardware failure and a person typing `kubectl delete pod` produce the same input, which is why deleting a pod is not destructive and why editing one is not durable.</text>
</svg>
