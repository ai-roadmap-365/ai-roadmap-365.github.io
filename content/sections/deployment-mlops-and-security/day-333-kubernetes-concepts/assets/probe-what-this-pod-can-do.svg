<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A dependency check empties the whole Service.">
  <title>Probe this pod, not the world</title>
  <style>
    .probe-what-this-pod-can-do-bg   { fill: #f8fafc; }
    .probe-what-this-pod-can-do-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-what-this-pod-can-do-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-what-this-pod-can-do-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-what-this-pod-can-do-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-what-this-pod-can-do-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .probe-what-this-pod-can-do-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .probe-what-this-pod-can-do-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .probe-what-this-pod-can-do-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .probe-what-this-pod-can-do-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .probe-what-this-pod-can-do-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .probe-what-this-pod-can-do-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .probe-what-this-pod-can-do-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .probe-what-this-pod-can-do-row { opacity: 1; }
    .probe-what-this-pod-can-do-r0 { animation-delay: 0.00s; }
    .probe-what-this-pod-can-do-r1 { animation-delay: 0.45s; }
    .probe-what-this-pod-can-do-r2 { animation-delay: 0.90s; }
    .probe-what-this-pod-can-do-r3 { animation-delay: 1.35s; }
    .probe-what-this-pod-can-do-r4 { animation-delay: 1.80s; }
    .probe-what-this-pod-can-do-row { animation: probe-what-this-pod-can-do-reveal 7.3s ease-in-out infinite; }
    @keyframes probe-what-this-pod-can-do-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="probe-what-this-pod-can-do-bg" width="980" height="390"/>
  <text class="probe-what-this-pod-can-do-h1"  x="30" y="40">Probe this pod, not the world</text>
  <text class="probe-what-this-pod-can-do-sub" x="30" y="64">A dependency check empties the whole Service.</text>
  <rect class="probe-what-this-pod-can-do-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="probe-what-this-pod-can-do-name" x="46" y="122">Probe this pod</text>
  <text class="probe-what-this-pod-can-do-desc" x="46" y="142">Local capability only.</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r0" x="46" y="182">Is the model loaded?</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r1" x="46" y="216">Is the local index open?</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r2" x="46" y="250">Can this process answer a request?</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r3" x="46" y="284">One bad pod leaves the Service</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r4" x="46" y="318">The other pods keep serving</text>
  <rect class="probe-what-this-pod-can-do-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="probe-what-this-pod-can-do-name" x="526" y="122">Probe the dependency</text>
  <text class="probe-what-this-pod-can-do-desc" x="526" y="142">Correlated failure.</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r0" x="526" y="182">Is the database reachable?</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r1" x="526" y="216">Is the model provider up?</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r2" x="526" y="250">Every pod answers the same way</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r3" x="526" y="284">A wobble removes all of them at once</text>
  <text class="probe-what-this-pod-can-do-desc probe-what-this-pod-can-do-row probe-what-this-pod-can-do-r4" x="526" y="318">A partial outage becomes a total one</text>
  <text class="probe-what-this-pod-can-do-sub" x="30" y="372">A probe is a traffic control rather than diagnostics, which is what makes this dangerous: the probe does not report a problem, it causes one by withdrawing every replica simultaneously.</text>
</svg>
