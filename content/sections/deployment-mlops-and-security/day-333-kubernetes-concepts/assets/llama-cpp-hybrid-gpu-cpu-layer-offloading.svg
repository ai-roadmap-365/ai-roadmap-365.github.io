<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="llama.cpp Hybrid GPU/CPU Layer Offloading">
  <title>llama.cpp Hybrid GPU/CPU Layer Offloading</title>
  <defs>
    <style>
      .d333b-bg { fill: #f8fafc; }
      .d333b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d333b-gpu { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d333b-cpu { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .d333b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d333b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d333b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d333b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d333b-bg" />
  
  <text x="40" y="40" class="d333a-title">Hybrid Layer Offloading Architecture (llama.cpp)</text>
  <text x="40" y="65" class="d333a-subtitle">llama.cpp Hybrid GPU/CPU Layer Offloading showing Layers 0 to 20 loaded in GPU VRAM (6GB) and Layers 21 to 32 computed in Host System RAM (16GB) via Unified Memory Bus</text>
  
  <!-- GPU Partition -->
  <rect x="40" y="110" width="390" height="270" class="d333b-gpu" />
  <text x="60" y="145" class="d333b-header" fill="#1d4ed8">GPU VRAM Partition (Layers 0 ➔ 20)</text>
  <text x="60" y="180" class="d333b-text">• **Hardware:** NVIDIA RTX 3060 (6GB VRAM)</text>
  <text x="60" y="205" class="d333b-text">• **Command:** `--n-gpu-layers 20`</text>
  <text x="60" y="230" class="d333b-text">• **Allocated VRAM:** 5.2 GB</text>
  <text x="60" y="255" class="d333b-text">• Executes first 20 transformer layers at 900 GB/s</text>
  <text x="60" y="300" class="d333b-text" font-weight="600" fill="#1d4ed8">High-Speed GPU Compute</text>
  
  <!-- CPU Partition -->
  <rect x="470" y="110" width="390" height="270" class="d333b-cpu" />
  <text x="490" y="145" class="d333b-header" fill="#b45309">Host CPU / RAM Partition (Layers 21 ➔ 32)</text>
  <text x="490" y="180" class="d333b-text">• **Hardware:** Host CPU + 16GB DDR5 System RAM</text>
  <text x="490" y="205" class="d333b-text">• **Allocated RAM:** 3.1 GB</text>
  <text x="490" y="230" class="d333b-text">• Executes remaining 12 layers via AVX-512 / NEON</text>
  <text x="490" y="255" class="d333b-text">• Activations transferred via PCIe / Unified Memory</text>
  <text x="490" y="300" class="d333b-text" font-weight="600" fill="#b45309">Enables Massive Models on Budget Hardware</text>
</svg>