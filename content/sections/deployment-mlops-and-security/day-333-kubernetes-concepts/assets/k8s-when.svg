<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And three times it does not.">
  <title>When Kubernetes earns its cost</title>
  <style>
    .k8s-when-bg   { fill: #f8fafc; }
    .k8s-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .k8s-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .k8s-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .k8s-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .k8s-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .k8s-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .k8s-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .k8s-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .k8s-when-row { opacity: 1; }
    .k8s-when-r0 { animation-delay: 0.00s; }
    .k8s-when-r1 { animation-delay: 0.45s; }
    .k8s-when-r2 { animation-delay: 0.90s; }
    .k8s-when-r3 { animation-delay: 1.35s; }
    .k8s-when-r4 { animation-delay: 1.80s; }
    .k8s-when-row { animation: k8s-when-reveal 7.3s ease-in-out infinite; }
    @keyframes k8s-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="k8s-when-bg" width="980" height="390"/>
  <text class="k8s-when-h1"  x="30" y="40">When Kubernetes earns its cost</text>
  <text class="k8s-when-sub" x="30" y="64">And three times it does not.</text>
  <rect class="k8s-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="k8s-when-name" x="46" y="122">Use it</text>
  <text class="k8s-when-desc" x="46" y="142">Several of everything.</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r0" x="46" y="182">More machines than you want to think about</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r1" x="46" y="216">Things must be rescheduled when one dies</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r2" x="46" y="250">Many services, one uniform way to deploy</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r3" x="46" y="284">Your organisation already has a cluster</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r4" x="46" y="318">The marginal workload is cheap</text>
  <rect class="k8s-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="k8s-when-name" x="526" y="122">Do not</text>
  <text class="k8s-when-desc" x="526" y="142">Three specific cases.</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r0" x="526" y="182">One service on one machine</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r1" x="526" y="216">To make an unreliable application reliable</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r2" x="526" y="250">During an incident, or a week before a deadline</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r3" x="526" y="284">The learning curve is not front-loaded</text>
  <text class="k8s-when-desc k8s-when-row k8s-when-r4" x="526" y="318">The surprises arrive later</text>
  <text class="k8s-when-sub" x="30" y="372">"The first workload is expensive and the tenth is nearly free" is the honest shape of the decision: the cost is the control plane and the learning, and both are paid once.</text>
</svg>
