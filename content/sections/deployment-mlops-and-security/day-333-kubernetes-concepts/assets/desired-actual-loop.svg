<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Desired, actual, and a loop between them.">
  <title>Three parts, and that is all of it</title>
  <style>
    .desired-actual-loop-bg   { fill: #f8fafc; }
    .desired-actual-loop-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desired-actual-loop-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desired-actual-loop-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desired-actual-loop-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desired-actual-loop-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .desired-actual-loop-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .desired-actual-loop-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .desired-actual-loop-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .desired-actual-loop-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .desired-actual-loop-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .desired-actual-loop-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .desired-actual-loop-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .desired-actual-loop-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .desired-actual-loop-stage { opacity: 1; }

    .desired-actual-loop-s0 { animation-delay: 0.00s; }
    .desired-actual-loop-e0 { animation-delay: 0.00s; }
    .desired-actual-loop-s1 { animation-delay: 1.50s; }
    .desired-actual-loop-e1 { animation-delay: 1.50s; }
    .desired-actual-loop-s2 { animation-delay: 3.00s; }
    .desired-actual-loop-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .desired-actual-loop-conn  { animation: desired-actual-loop-trace 6s ease-in-out infinite; }
      .desired-actual-loop-stage { animation: desired-actual-loop-arrive 6s ease-in-out infinite; }
    }
    @keyframes desired-actual-loop-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes desired-actual-loop-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .desired-actual-loop-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .desired-actual-loop-stage { animation: desired-actual-loop-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes desired-actual-loop-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="desired-actual-loop-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="desired-actual-loop-bg" width="980" height="322"/>
  <text class="desired-actual-loop-h1"  x="30" y="40">Three parts, and that is all of it</text>
  <text class="desired-actual-loop-sub" x="30" y="64">Desired, actual, and a loop between them.</text>
  <g class="desired-actual-loop-stage desired-actual-loop-s0">
    <rect class="desired-actual-loop-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="desired-actual-loop-step" x="44" y="142">01</text>
    <text class="desired-actual-loop-name" x="70" y="142">Desired state</text>
    <text class="desired-actual-loop-desc" x="44" y="166">A Deployment: this image, this many replicas,</text>
    <text class="desired-actual-loop-desc" x="44" y="182">this surge tolerance. An outcome, no</text>
    <text class="desired-actual-loop-desc" x="44" y="198">instructions.</text>
  </g>
  <line class="desired-actual-loop-line desired-actual-loop-conn desired-actual-loop-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#desired-actual-loop-tip)"/>
  <g class="desired-actual-loop-stage desired-actual-loop-s1">
    <rect class="desired-actual-loop-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="desired-actual-loop-step" x="359" y="142">02</text>
    <text class="desired-actual-loop-name" x="385" y="142">Actual state</text>
    <text class="desired-actual-loop-desc" x="359" y="166">The pods that exist right now, each with a</text>
    <text class="desired-actual-loop-desc" x="359" y="182">phase and a readiness answer.</text>
  </g>
  <line class="desired-actual-loop-line desired-actual-loop-conn desired-actual-loop-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#desired-actual-loop-tip)"/>
  <g class="desired-actual-loop-stage desired-actual-loop-s2">
    <rect class="desired-actual-loop-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="desired-actual-loop-step" x="674" y="142">03</text>
    <text class="desired-actual-loop-name" x="700" y="142">The loop</text>
    <text class="desired-actual-loop-desc" x="674" y="166">Compute the difference, issue actions, repeat</text>
    <text class="desired-actual-loop-desc" x="674" y="182">forever. Level-triggered.</text>
    <text class="desired-actual-loop-edge" x="674" y="242">self-correcting</text>
  </g>
  <text class="desired-actual-loop-sub" x="30" y="304">Level-triggered is the word to keep: the loop responds to the current gap rather than to events, so a missed event costs one pass rather than correctness — which is why the system recovers from its own outages.</text>
</svg>
