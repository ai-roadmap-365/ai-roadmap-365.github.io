<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="The Reconciliation Loop showing desired state compared against actual state producing one step of actions">
  <title>The Reconciliation Loop</title>
  <defs>
    <style>
      .d333a-bg { fill: #f8fafc; }
      .d333a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d333a-want { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2px; }
      .d333a-have { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d333a-act { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d333a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d333a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d333a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d333a-m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .d333a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d333a-arrow { stroke: #64748b; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d333a-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="d333a-bg" width="900" height="420" />
  <text class="d333a-title" x="30" y="36">The Reconciliation Loop</text>
  <text class="d333a-s" x="30" y="58">Compare, act, repeat. It never asks how the gap appeared.</text>

  <rect class="d333a-want" x="30" y="84" width="250" height="110" rx="8" />
  <text class="d333a-h" x="48" y="110">DESIRED — what you declared</text>
  <text class="d333a-m" x="48" y="138">replicas: 3</text>
  <text class="d333a-m" x="48" y="160">image: app:1.4</text>
  <text class="d333a-s" x="48" y="182">An outcome. No instructions.</text>

  <rect class="d333a-have" x="325" y="84" width="250" height="110" rx="8" />
  <text class="d333a-h" x="343" y="110">ACTUAL — what exists</text>
  <text class="d333a-m" x="343" y="138">api-002  Running  ready</text>
  <text class="d333a-m" x="343" y="160">api-003  Running  ready</text>
  <text class="d333a-s" x="343" y="182">2 pods. One node just died.</text>

  <rect class="d333a-act" x="620" y="84" width="250" height="110" rx="8" />
  <text class="d333a-h" x="638" y="110">ONE STEP of actions</text>
  <text class="d333a-m" x="638" y="138">delete api-001</text>
  <text class="d333a-m" x="638" y="160">create api-004</text>
  <text class="d333a-s" x="638" y="182">Then compare again.</text>

  <path class="d333a-arrow" d="M280 139 L320 139" marker-end="url(#d333a-head)" />
  <path class="d333a-arrow" d="M575 139 L615 139" marker-end="url(#d333a-head)" />
  <path class="d333a-arrow" d="M745 194 L745 226 L155 226 L155 198" marker-end="url(#d333a-head)" />
  <text class="d333a-s" x="400" y="245">the loop runs forever — a missed event costs one pass, not correctness</text>

  <rect class="d333a-card" x="30" y="266" width="410" height="60" rx="8" />
  <text class="d333a-h" x="48" y="292">Level-triggered</text>
  <text class="d333a-s" x="48" y="314">Reacts to STATE. Self-correcting by construction.</text>

  <rect class="d333a-card" x="460" y="266" width="410" height="60" rx="8" />
  <text class="d333a-h" x="478" y="292">Not edge-triggered</text>
  <text class="d333a-s" x="478" y="314">An events-based system breaks when one is lost.</text>

  <rect class="d333a-card" x="30" y="342" width="840" height="60" rx="6" />
  <text class="d333a-t" x="48" y="366">Running is not serving. A pod passes its readiness probe before a Service routes to it —</text>
  <text class="d333a-t" x="48" y="388">which is why a first deploy of 3 replicas converges in two steps, not one.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}.dx-f2{animation-delay:0.84s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M280 139 L320 139" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M575 139 L615 139" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f2" d="M745 194 L745 226 L155 226 L155 198" stroke="#64748b" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
