<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six stages, and traffic starts at the fifth.">
  <title>From submitted to serving</title>
  <style>
    .pod-lifecycle-bg   { fill: #f8fafc; }
    .pod-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pod-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pod-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pod-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pod-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pod-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pod-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pod-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pod-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pod-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pod-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pod-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pod-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pod-lifecycle-stage { opacity: 1; }

    .pod-lifecycle-s0 { animation-delay: 0.00s; }
    .pod-lifecycle-e0 { animation-delay: 0.00s; }
    .pod-lifecycle-s1 { animation-delay: 1.37s; }
    .pod-lifecycle-e1 { animation-delay: 1.37s; }
    .pod-lifecycle-s2 { animation-delay: 2.74s; }
    .pod-lifecycle-e2 { animation-delay: 2.74s; }
    .pod-lifecycle-s3 { animation-delay: 4.11s; }
    .pod-lifecycle-e3 { animation-delay: 4.11s; }
    .pod-lifecycle-s4 { animation-delay: 5.49s; }
    .pod-lifecycle-e4 { animation-delay: 5.49s; }
    .pod-lifecycle-s5 { animation-delay: 6.86s; }
    .pod-lifecycle-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .pod-lifecycle-conn  { animation: pod-lifecycle-trace 9.600000000000001s ease-in-out infinite; }
      .pod-lifecycle-stage { animation: pod-lifecycle-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes pod-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pod-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pod-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pod-lifecycle-stage { animation: pod-lifecycle-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pod-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pod-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pod-lifecycle-bg" width="980" height="322"/>
  <text class="pod-lifecycle-h1"  x="30" y="40">From submitted to serving</text>
  <text class="pod-lifecycle-sub" x="30" y="64">Six stages, and traffic starts at the fifth.</text>
  <g class="pod-lifecycle-stage pod-lifecycle-s0">
    <rect class="pod-lifecycle-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="44" y="142">01</text>
    <text class="pod-lifecycle-name" x="70" y="142">Submit the Deployment</text>
    <text class="pod-lifecycle-desc" x="44" y="166">The API server</text>
    <text class="pod-lifecycle-desc" x="44" y="182">stores it. Nothing</text>
    <text class="pod-lifecycle-desc" x="44" y="198">has happened yet.</text>
  </g>
  <line class="pod-lifecycle-line pod-lifecycle-conn pod-lifecycle-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#pod-lifecycle-tip)"/>
  <g class="pod-lifecycle-stage pod-lifecycle-s1">
    <rect class="pod-lifecycle-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="201" y="142">02</text>
    <text class="pod-lifecycle-name" x="227" y="142">A controller notices the difference</text>
    <text class="pod-lifecycle-desc" x="201" y="166">Declared replicas</text>
    <text class="pod-lifecycle-desc" x="201" y="182">against existing</text>
    <text class="pod-lifecycle-desc" x="201" y="198">pods, and creates</text>
  </g>
  <line class="pod-lifecycle-line pod-lifecycle-conn pod-lifecycle-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#pod-lifecycle-tip)"/>
  <g class="pod-lifecycle-stage pod-lifecycle-s2">
    <rect class="pod-lifecycle-warn" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="358" y="142">03</text>
    <text class="pod-lifecycle-name" x="384" y="142">The scheduler assigns a node</text>
    <text class="pod-lifecycle-desc" x="358" y="166">A live one. Placing</text>
    <text class="pod-lifecycle-desc" x="358" y="182">replacements on the</text>
    <text class="pod-lifecycle-desc" x="358" y="198">dead node churns</text>
    <text class="pod-lifecycle-edge" x="358" y="242">real bug</text>
  </g>
  <line class="pod-lifecycle-line pod-lifecycle-conn pod-lifecycle-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#pod-lifecycle-tip)"/>
  <g class="pod-lifecycle-stage pod-lifecycle-s3">
    <rect class="pod-lifecycle-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="515" y="142">04</text>
    <text class="pod-lifecycle-name" x="541" y="142">The kubelet starts the container</text>
    <text class="pod-lifecycle-desc" x="515" y="166">The pod becomes</text>
    <text class="pod-lifecycle-desc" x="515" y="182">Running.</text>
  </g>
  <line class="pod-lifecycle-line pod-lifecycle-conn pod-lifecycle-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#pod-lifecycle-tip)"/>
  <g class="pod-lifecycle-stage pod-lifecycle-s4">
    <rect class="pod-lifecycle-good" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="672" y="142">05</text>
    <text class="pod-lifecycle-name" x="698" y="142">The readiness probe passes</text>
    <text class="pod-lifecycle-desc" x="672" y="166">Now the Service</text>
    <text class="pod-lifecycle-desc" x="672" y="182">routes to it.</text>
    <text class="pod-lifecycle-desc" x="672" y="198">Between Running and</text>
    <text class="pod-lifecycle-edge" x="672" y="242">traffic</text>
  </g>
  <line class="pod-lifecycle-line pod-lifecycle-conn pod-lifecycle-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#pod-lifecycle-tip)"/>
  <g class="pod-lifecycle-stage pod-lifecycle-s5">
    <rect class="pod-lifecycle-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="pod-lifecycle-step" x="829" y="142">06</text>
    <text class="pod-lifecycle-name" x="855" y="142">And it is re-asked, forever</text>
    <text class="pod-lifecycle-desc" x="829" y="166">A pod that stops</text>
    <text class="pod-lifecycle-desc" x="829" y="182">being ready leaves</text>
    <text class="pod-lifecycle-desc" x="829" y="198">the load balancer.</text>
  </g>
  <text class="pod-lifecycle-sub" x="30" y="304">The third stage is explicit in the lab because an earlier version got it wrong: replacements placed on the node that had just died were reaped immediately, and the loop churned indefinitely without ever converging.</text>
</svg>
