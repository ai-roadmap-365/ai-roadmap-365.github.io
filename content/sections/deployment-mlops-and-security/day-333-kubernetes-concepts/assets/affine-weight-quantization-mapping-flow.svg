<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Affine Weight Quantization Mapping Flow">
  <title>Affine Weight Quantization Mapping Flow</title>
  <defs>
    <style>
      .d333a-bg { fill: #f8fafc; }
      .d333a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d333a-f16 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d333a-q4 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d333a-dq { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d333a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d333a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d333a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d333a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d333a-bg" />
  
  <text x="40" y="40" class="d333a-title">Affine Linear Quantization (FP16 ➔ INT4)</text>
  <text x="40" y="65" class="d333a-subtitle">Affine Weight Quantization Mapping Flow showing 32-bit Floating Point Range mapped through Scale Factor and Zero Point into 4-bit Integer Grid with Dequantization Reconstruction</text>
  
  <!-- Float Range -->
  <rect x="40" y="110" width="250" height="270" class="d333a-f16" />
  <text x="55" y="145" class="d333a-header" fill="#1d4ed8">1. Continuous FP16 Range</text>
  <text x="55" y="180" class="d333a-text">• Weight range: `[-1.42, +1.86]`</text>
  <text x="55" y="205" class="d333a-text">• Precision: 16-bit Float</text>
  <text x="55" y="230" class="d333a-text">• Memory: 2.0 Bytes / weight</text>
  <text x="55" y="255" class="d333a-text">• 7B Model Size: ~14.0 GB VRAM</text>
  <text x="55" y="295" class="d333a-text" font-weight="600" fill="#1d4ed8">High VRAM Footprint</text>
  <text x="55" y="320" class="d333a-text">Cannot fit on consumer edge</text>
  
  <!-- Quantization Transform -->
  <rect x="325" y="110" width="250" height="270" class="d333a-q4" />
  <text x="340" y="145" class="d333a-header" fill="#7e22ce">2. Affine INT4 Mapping</text>
  <text x="340" y="180" class="d333a-text">• Scale: `S = (max - min) / 15`</text>
  <text x="340" y="205" class="d333a-text">• Zero Point: `Z = round(-min / S)`</text>
  <text x="340" y="230" class="d333a-text">• `q = clamp(round(w / S) + Z, 0, 15)`</text>
  <text x="340" y="255" class="d333a-text">• Stored as 4-bit unsigned integers</text>
  <text x="340" y="295" class="d333a-text" font-weight="600" fill="#7e22ce">Compression Ratio: 3.5x</text>
  <text x="340" y="320" class="d333a-text">7B Model ➔ 4.1 GB Footprint</text>
  
  <!-- Dequantization -->
  <rect x="610" y="110" width="250" height="270" class="d333a-dq" />
  <text x="625" y="145" class="d333a-header" fill="#15803d">3. Runtime Dequantization</text>
  <text x="625" y="180" class="d333a-text">• Reconstruction: `w_hat = S * (q - Z)`</text>
  <text x="625" y="205" class="d333a-text">• Computed in high-speed registers</text>
  <text x="625" y="230" class="d333a-text">• Fused GEMM / GEMV kernels</text>
  <text x="625" y="255" class="d333a-text">• Perplexity Loss: &lt; 0.05 PPL</text>
  <text x="625" y="295" class="d333a-text" font-weight="600" fill="#15803d">Outcome: 60+ Tok/s Local</text>
  <text x="625" y="320" class="d333a-text">Runs on Mac, iPhone &amp; Edge</text>
</svg>