<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Confusing them is worse than the original problem.">
  <title>Readiness gates; liveness restarts</title>
  <style>
    .readiness-versus-liveness-bg   { fill: #f8fafc; }
    .readiness-versus-liveness-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-versus-liveness-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-versus-liveness-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-versus-liveness-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-versus-liveness-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .readiness-versus-liveness-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-versus-liveness-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .readiness-versus-liveness-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .readiness-versus-liveness-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .readiness-versus-liveness-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .readiness-versus-liveness-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .readiness-versus-liveness-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .readiness-versus-liveness-row { opacity: 1; }
    .readiness-versus-liveness-r0 { animation-delay: 0.00s; }
    .readiness-versus-liveness-r1 { animation-delay: 0.45s; }
    .readiness-versus-liveness-r2 { animation-delay: 0.90s; }
    .readiness-versus-liveness-r3 { animation-delay: 1.35s; }
    .readiness-versus-liveness-r4 { animation-delay: 1.80s; }
    .readiness-versus-liveness-row { animation: readiness-versus-liveness-reveal 7.3s ease-in-out infinite; }
    @keyframes readiness-versus-liveness-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="readiness-versus-liveness-bg" width="980" height="390"/>
  <text class="readiness-versus-liveness-h1"  x="30" y="40">Readiness gates; liveness restarts</text>
  <text class="readiness-versus-liveness-sub" x="30" y="64">Confusing them is worse than the original problem.</text>
  <rect class="readiness-versus-liveness-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="readiness-versus-liveness-name" x="46" y="122">Readiness</text>
  <text class="readiness-versus-liveness-desc" x="46" y="142">Should this receive traffic?</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r0" x="46" y="182">Gates Service membership</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r1" x="46" y="216">Failing removes it from the load balancer</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r2" x="46" y="250">The pod keeps running</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r3" x="46" y="284">Right for "busy" or "still loading"</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r4" x="46" y="318">Re-asked continuously</text>
  <rect class="readiness-versus-liveness-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="readiness-versus-liveness-name" x="526" y="122">Liveness</text>
  <text class="readiness-versus-liveness-desc" x="526" y="142">Should this be restarted?</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r0" x="526" y="182">Triggers a container restart</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r1" x="526" y="216">Failing kills the process</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r2" x="526" y="250">Right for a deadlocked process</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r3" x="526" y="284">Wrong for a briefly busy one</text>
  <text class="readiness-versus-liveness-desc readiness-versus-liveness-row readiness-versus-liveness-r4" x="526" y="318">A restart loop looks like a crash</text>
  <text class="readiness-versus-liveness-sub" x="30" y="372">Using a liveness probe where readiness belongs produces a service that restarts pods for being busy under load — which removes capacity at exactly the moment the system needed more of it.</text>
</svg>
