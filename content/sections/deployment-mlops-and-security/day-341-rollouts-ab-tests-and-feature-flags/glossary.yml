terms:
- term: Shadow Traffic Mirroring
  definition: Duplicating live production requests to candidate models asynchronously with zero user impact.
- term: Feature Flag
  definition: A software switch enabling dynamic toggling of code paths or model variants at runtime without
    redeploying.
- term: Canary Deployment
  definition: Gradually routing a small percentage of production traffic to a candidate revision while
    monitoring health.
- term: Multi-Armed Bandit
  definition: An online learning algorithm that dynamically routes traffic to higher-performing variants
    to maximize reward.
- term: Deterministic Hashing
  definition: Hashing user identifiers to integer buckets ensuring consistent variant assignment across
    sessions.
- term: Blast Radius
  definition: The maximum proportion of users or systems impacted if a newly deployed version experiences
    an outage.
- term: Online A/B Testing
  definition: Evaluating two competing model variants simultaneously across randomized user cohorts to
    measure KPIs.
- term: Regret Minimization
  definition: Optimizing traffic routing during experimentation to minimize exposure to suboptimal variants.
