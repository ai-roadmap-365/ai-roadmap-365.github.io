questions:
- question: What is 'Shadow Traffic Mirroring' (Dark Launching) in AI system deployments?
  options:
  - Running models only at nighttime
  - Asynchronously duplicating live production user requests to a candidate model revision in the background,
    logging candidate outputs and latency metrics for comparison without returning candidate responses
    to the end user
  - Deleting user traffic before it hits the model
  - Hiding the server IP address
  answer_index: 1
  explanation: Shadow traffic mirrors live requests to test new models safely against real-world distributions
    with zero user impact.
- question: Why is deterministic user hashing (e.g. `hash(user_id + salt) % 100`) used for AI feature
    flags instead of random coin flips?
  options:
  - Because random numbers do not exist in Python
  - Deterministic hashing guarantees that a specific user consistently receives the exact same model variant
    and prompt version across multiple sessions, preventing jarring UX inconsistencies
  - To make the model run 10x faster
  - To encrypt the user's password
  answer_index: 1
  explanation: Deterministic hashing ensures consistent user experiences across multiple sessions and
    requests.
- question: How does a Multi-Armed Bandit (e.g. Thompson Sampling or Epsilon-Greedy) differ from traditional
    A/B testing?
  options:
  - Bandits are illegal gambling machines
  - Traditional A/B testing maintains a fixed 50/50 traffic split for weeks; Multi-Armed Bandits dynamically
    shift traffic toward the better-performing model variant in real-time as statistical evidence accumulates,
    minimizing regret
  - A/B testing only works on mobile phones
  - Bandits delete underperforming models permanently
  answer_index: 1
  explanation: Multi-armed bandits dynamically allocate traffic to winning variants, reducing cumulative
    regret during experimentation.
- question: What is a 'Canary Blast Radius' in production AI releases?
  options:
  - The physical damage caused by an exploding GPU
  - The maximum percentage of total user traffic (e.g. 2% or 5%) exposed to a new, potentially buggy model
    version during initial rollout, strictly bounding the impact of unexpected regressions
  - The volume of cooling fans in the server room
  - The number of characters in the system prompt
  answer_index: 1
  explanation: Blast radius bounding ensures that any unforeseen model errors impact only a tiny fraction
    of users.
- question: When should an automated canary rollback trigger during an A/B model rollout?
  options:
  - Whenever a user asks a question in Spanish
  - Instantly upon detecting an automated health violation, such as candidate error rate exceeding 1%
    or candidate P95 latency spiking by more than 25% relative to the baseline model
  - At the end of every calendar month
  - Never; rollbacks should always be manual
  answer_index: 1
  explanation: Automated rollbacks trigger immediately when candidate metrics violate predefined latency
    or error thresholds.
