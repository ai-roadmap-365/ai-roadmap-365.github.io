visuals:
- id: shadow-traffic-mirroring-and-canary-router
  file: assets/shadow-traffic-mirroring-and-canary-router.svg
  type: diagram
  title: Shadow Traffic Mirroring and Canary Router
  alt: Shadow Traffic Mirroring and Canary Router showing Live Ingress Request sent to Production Model
    (100% User Return) while Async Shadow Copy is evaluated on Candidate Model with Metrics Comparison
  description: System architecture diagram illustrating asynchronous shadow traffic mirroring and progressive
    canary routing.
- id: multi-armed-bandit-vs-fixed-ab-testing
  file: assets/multi-armed-bandit-vs-fixed-ab-testing.svg
  type: diagram
  title: Multi-Armed Bandit vs Fixed A/B Testing
  alt: Multi-Armed Bandit vs Fixed A/B Testing comparing static 50/50 traffic allocation with fixed regret
    against dynamic Thompson Sampling bandit traffic shifts
  description: Comparative diagram illustrating cumulative regret reduction with multi-armed bandit traffic
    allocation.
- id: release-ladder
  file: assets/release-ladder.svg
  type: diagram
  title: 'The ladder from zero risk to full'
  alt: 'Diagram: the progression from shadow traffic to a full rollout'
  description: 'A four-stage description of AI release progression from shadow mirroring through canary percentages to full traffic, with what each stage proves.'
- id: deterministic-or-random
  file: assets/deterministic-or-random.svg
  type: diagram
  title: 'Hash the user, never roll a die'
  alt: 'Diagram: deterministic cohort assignment compared with unseeded random assignment'
  description: 'A two-column comparison of assigning users to variants by hashing an identifier against assigning randomly on each request.'
- id: rollout-eras
  file: assets/rollout-eras.svg
  type: diagram
  title: 'Three eras of release engineering'
  alt: 'Diagram: the progression from big-bang deployments to AI shadow mirroring and bandits'
  description: 'A three-stage progression of release practice from midnight maintenance windows through feature flags to shadow mirroring and multi-armed bandits.'
- id: not-random-not-blind
  file: assets/not-random-not-blind.svg
  type: diagram
  title: 'Two practices it rules out'
  alt: 'Diagram: correct AI release practice compared with two shortcuts'
  description: 'A two-column comparison of progressive AI release practice against unseeded assignment and unverified full deployment.'
- id: shadow-mechanics
  file: assets/shadow-mechanics.svg
  type: diagram
  title: 'How shadow traffic works'
  alt: 'Diagram: how a shadow request is mirrored, executed and discarded'
  description: 'A four-stage description of shadow traffic covering mirroring, asynchronous execution, metric comparison and strict response isolation.'
- id: thompson-sampling
  file: assets/thompson-sampling.svg
  type: diagram
  title: 'How Thompson sampling routes'
  alt: 'Diagram: the Thompson sampling loop for routing between prompt variants'
  description: 'A four-stage description of Beta-Bernoulli Thompson sampling covering the posterior per variant, sampling, routing and updating on feedback.'
- id: bandit-or-ab
  file: assets/bandit-or-ab.svg
  type: diagram
  title: 'A bandit or a fixed split'
  alt: 'Diagram: a fixed A/B split compared with a multi-armed bandit'
  description: 'A two-column comparison of a fixed 50/50 experiment against an adaptive bandit allocation.'
- id: theatre-preview
  file: assets/theatre-preview.svg
  type: diagram
  title: 'A Broadway preview run'
  alt: 'Diagram: opening a show cold compared with rehearsals and preview performances'
  description: 'A two-column comparison of opening a production to a full house on night one against rehearsing and running discounted previews.'
- id: rollout-hazards
  file: assets/rollout-hazards.svg
  type: diagram
  title: 'Four rollout hazards'
  alt: 'Diagram: the four failure modes of an AI rollout and the control for each'
  description: 'A four-stage description of AI rollout hazards covering unstable assignment, leaked shadow responses, shadow compute cost and missing rollback triggers.'
- id: flags-as-guardrails
  file: assets/flags-as-guardrails.svg
  type: diagram
  title: 'Flags as a runtime control'
  alt: 'Diagram: feature flags used for releases compared with flags used as runtime guardrails'
  description: 'A two-column comparison of feature flags for progressive delivery against flags used to adjust safety and capacity policy at run time.'
- id: rollout-implications
  file: assets/rollout-implications.svg
  type: diagram
  title: 'Four consequences of progressive release'
  alt: 'Diagram: the safety, cost, performance and statistical implications of progressive AI rollouts'
  description: 'A four-stage description of rollout implications covering shadow isolation, mirroring cost, flag evaluation latency and required sample size.'
- id: rollout-when
  file: assets/rollout-when.svg
  type: diagram
  title: 'What gets a flag'
  alt: 'Diagram: when progressive rollout machinery is warranted'
  description: 'A two-column comparison of changes that warrant feature flags and progressive rollout against those that do not.'
