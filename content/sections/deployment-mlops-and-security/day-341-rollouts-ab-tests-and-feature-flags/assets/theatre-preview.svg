<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Rehearsal, previews, opening night.">
  <title>A Broadway preview run</title>
  <style>
    .theatre-preview-bg   { fill: #f8fafc; }
    .theatre-preview-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .theatre-preview-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .theatre-preview-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .theatre-preview-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .theatre-preview-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .theatre-preview-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .theatre-preview-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .theatre-preview-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .theatre-preview-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .theatre-preview-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .theatre-preview-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .theatre-preview-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .theatre-preview-row { opacity: 1; }
    .theatre-preview-r0 { animation-delay: 0.00s; }
    .theatre-preview-r1 { animation-delay: 0.45s; }
    .theatre-preview-r2 { animation-delay: 0.90s; }
    .theatre-preview-r3 { animation-delay: 1.35s; }
    .theatre-preview-r4 { animation-delay: 1.80s; }
    .theatre-preview-row { animation: theatre-preview-reveal 7.3s ease-in-out infinite; }
    @keyframes theatre-preview-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="theatre-preview-bg" width="980" height="390"/>
  <text class="theatre-preview-h1"  x="30" y="40">A Broadway preview run</text>
  <text class="theatre-preview-sub" x="30" y="64">Rehearsal, previews, opening night.</text>
  <rect class="theatre-preview-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="theatre-preview-name" x="46" y="122">Opening cold</text>
  <text class="theatre-preview-desc" x="46" y="142">2,000 critics on night one.</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r0" x="46" y="182">No rehearsal</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r1" x="46" y="216">Every problem found in public</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r2" x="46" y="250">Reviews written from the worst performance</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r3" x="46" y="284">No way to adjust first</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r4" x="46" y="318">This is a full cutover</text>
  <rect class="theatre-preview-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="theatre-preview-name" x="526" y="122">Rehearse, then preview</text>
  <text class="theatre-preview-desc" x="526" y="142">Empty theatre, then 5%.</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r0" x="526" y="182">The cast performs to an empty house</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r1" x="526" y="216">Sound engineers test the microphones</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r2" x="526" y="250">5% of seats to invited guests, three nights</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r3" x="526" y="284">Five-star reviews open the box office</text>
  <text class="theatre-preview-desc theatre-preview-row theatre-preview-r4" x="526" y="318">This is shadow, then canary</text>
  <text class="theatre-preview-sub" x="30" y="372">The empty-theatre rehearsal is the closest everyday analogue to shadow traffic: the performance is real and complete, and the audience's experience is entirely unaffected by how it goes.</text>
</svg>
