<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both feel faster.">
  <title>Two practices it rules out</title>
  <style>
    .not-random-not-blind-bg   { fill: #f8fafc; }
    .not-random-not-blind-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-random-not-blind-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-random-not-blind-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-random-not-blind-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-random-not-blind-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-random-not-blind-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-random-not-blind-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-random-not-blind-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-random-not-blind-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-random-not-blind-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-random-not-blind-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-random-not-blind-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-random-not-blind-row { opacity: 1; }
    .not-random-not-blind-r0 { animation-delay: 0.00s; }
    .not-random-not-blind-r1 { animation-delay: 0.45s; }
    .not-random-not-blind-r2 { animation-delay: 0.90s; }
    .not-random-not-blind-r3 { animation-delay: 1.35s; }
    .not-random-not-blind-r4 { animation-delay: 1.80s; }
    .not-random-not-blind-row { animation: not-random-not-blind-reveal 7.3s ease-in-out infinite; }
    @keyframes not-random-not-blind-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-random-not-blind-bg" width="980" height="390"/>
  <text class="not-random-not-blind-h1"  x="30" y="40">Two practices it rules out</text>
  <text class="not-random-not-blind-sub" x="30" y="64">Both feel faster.</text>
  <rect class="not-random-not-blind-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-random-not-blind-name" x="46" y="122">The practice</text>
  <text class="not-random-not-blind-desc" x="46" y="142">Four mechanisms.</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r0" x="46" y="182">Deterministic hashing for cohorts</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r1" x="46" y="216">Asynchronous shadow mirroring</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r2" x="46" y="250">A graded canary ramp with monitoring</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r3" x="46" y="284">Bandits to route toward the winner</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r4" x="46" y="318">Automated rollback armed throughout</text>
  <rect class="not-random-not-blind-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-random-not-blind-name" x="526" y="122">Two shortcuts</text>
  <text class="not-random-not-blind-desc" x="526" y="142">Both common.</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r0" x="526" y="182">Unseeded randomness per request</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r1" x="526" y="216">No stable cohort, no valid experiment</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r2" x="526" y="250">100% traffic to an unverified checkpoint</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r3" x="526" y="284">Every enterprise customer at once</text>
  <text class="not-random-not-blind-desc not-random-not-blind-row not-random-not-blind-r4" x="526" y="318">No evidence, and no way back</text>
  <text class="not-random-not-blind-sub" x="30" y="372">The right-hand column is faster to write and produces neither a safe release nor a usable measurement, which makes it the rare shortcut that saves nothing at all.</text>
</svg>
