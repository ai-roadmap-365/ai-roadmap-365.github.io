<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Or the model changes mid-conversation.">
  <title>Hash the user, never roll a die</title>
  <style>
    .deterministic-or-random-bg   { fill: #f8fafc; }
    .deterministic-or-random-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-random-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-random-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-random-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-random-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deterministic-or-random-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deterministic-or-random-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deterministic-or-random-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deterministic-or-random-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deterministic-or-random-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deterministic-or-random-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deterministic-or-random-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deterministic-or-random-row { opacity: 1; }
    .deterministic-or-random-r0 { animation-delay: 0.00s; }
    .deterministic-or-random-r1 { animation-delay: 0.45s; }
    .deterministic-or-random-r2 { animation-delay: 0.90s; }
    .deterministic-or-random-r3 { animation-delay: 1.35s; }
    .deterministic-or-random-r4 { animation-delay: 1.80s; }
    .deterministic-or-random-row { animation: deterministic-or-random-reveal 7.3s ease-in-out infinite; }
    @keyframes deterministic-or-random-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="deterministic-or-random-bg" width="980" height="390"/>
  <text class="deterministic-or-random-h1"  x="30" y="40">Hash the user, never roll a die</text>
  <text class="deterministic-or-random-sub" x="30" y="64">Or the model changes mid-conversation.</text>
  <rect class="deterministic-or-random-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="deterministic-or-random-name" x="46" y="122">hash(user_id + salt) % 100</text>
  <text class="deterministic-or-random-desc" x="46" y="142">Stable across the session.</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r0" x="46" y="182">User A always sees variant B</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r1" x="46" y="216">Consistent across consecutive turns</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r2" x="46" y="250">Reproducible when debugging a complaint</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r3" x="46" y="284">No state to store</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r4" x="46" y="318">Sub-millisecond to evaluate</text>
  <rect class="deterministic-or-random-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="deterministic-or-random-name" x="526" y="122">random.random()</text>
  <text class="deterministic-or-random-desc" x="526" y="142">Re-rolled on every click.</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r0" x="526" y="182">The variant changes mid-conversation</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r1" x="526" y="216">The assistant's personality shifts</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r2" x="526" y="250">The experiment measures nothing</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r3" x="526" y="284">A complaint cannot be reproduced</text>
  <text class="deterministic-or-random-desc deterministic-or-random-row deterministic-or-random-r4" x="526" y="318">And the user files it as a bug</text>
  <text class="deterministic-or-random-sub" x="30" y="372">For a chat interface the cost of the right-hand column is larger than a spoiled experiment: the user experiences a coherent assistant becoming a different one between two messages, which reads as a defect.</text>
</svg>
