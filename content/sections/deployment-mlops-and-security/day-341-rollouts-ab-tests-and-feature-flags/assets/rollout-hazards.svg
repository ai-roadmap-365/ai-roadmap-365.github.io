<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each has a specific control.">
  <title>Four rollout hazards</title>
  <style>
    .rollout-hazards-bg   { fill: #f8fafc; }
    .rollout-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .rollout-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rollout-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .rollout-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .rollout-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .rollout-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .rollout-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .rollout-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .rollout-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .rollout-hazards-stage { opacity: 1; }

    .rollout-hazards-s0 { animation-delay: 0.00s; }
    .rollout-hazards-e0 { animation-delay: 0.00s; }
    .rollout-hazards-s1 { animation-delay: 1.28s; }
    .rollout-hazards-e1 { animation-delay: 1.28s; }
    .rollout-hazards-s2 { animation-delay: 2.56s; }
    .rollout-hazards-e2 { animation-delay: 2.56s; }
    .rollout-hazards-s3 { animation-delay: 3.84s; }
    .rollout-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .rollout-hazards-conn  { animation: rollout-hazards-trace 6.4s ease-in-out infinite; }
      .rollout-hazards-stage { animation: rollout-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes rollout-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes rollout-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .rollout-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .rollout-hazards-stage { animation: rollout-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes rollout-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="rollout-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="rollout-hazards-bg" width="980" height="322"/>
  <text class="rollout-hazards-h1"  x="30" y="40">Four rollout hazards</text>
  <text class="rollout-hazards-sub" x="30" y="64">Each has a specific control.</text>
  <g class="rollout-hazards-stage rollout-hazards-s0">
    <rect class="rollout-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-hazards-step" x="44" y="142">01</text>
    <text class="rollout-hazards-name" x="70" y="142">Unstable cohort assignment</text>
    <text class="rollout-hazards-desc" x="44" y="166">The model changes between turns.</text>
    <text class="rollout-hazards-edge" x="44" y="242">hash it</text>
  </g>
  <line class="rollout-hazards-line rollout-hazards-conn rollout-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#rollout-hazards-tip)"/>
  <g class="rollout-hazards-stage rollout-hazards-s1">
    <rect class="rollout-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-hazards-step" x="280" y="142">02</text>
    <text class="rollout-hazards-name" x="306" y="142">A shadow response reaching a user</text>
    <text class="rollout-hazards-desc" x="280" y="166">Unvalidated output, delivered.</text>
    <text class="rollout-hazards-edge" x="280" y="242">isolate</text>
  </g>
  <line class="rollout-hazards-line rollout-hazards-conn rollout-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#rollout-hazards-tip)"/>
  <g class="rollout-hazards-stage rollout-hazards-s2">
    <rect class="rollout-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-hazards-step" x="516" y="142">03</text>
    <text class="rollout-hazards-name" x="542" y="142">100% shadow mirroring</text>
    <text class="rollout-hazards-desc" x="516" y="166">Doubles GPU spend. Sample at</text>
    <text class="rollout-hazards-desc" x="516" y="182">5-10%.</text>
    <text class="rollout-hazards-edge" x="516" y="242">budget</text>
  </g>
  <line class="rollout-hazards-line rollout-hazards-conn rollout-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#rollout-hazards-tip)"/>
  <g class="rollout-hazards-stage rollout-hazards-s3">
    <rect class="rollout-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="rollout-hazards-step" x="752" y="142">04</text>
    <text class="rollout-hazards-name" x="778" y="142">No automated rollback</text>
    <text class="rollout-hazards-desc" x="752" y="166">A regression rides the ramp all</text>
    <text class="rollout-hazards-desc" x="752" y="182">the way to 100%.</text>
    <text class="rollout-hazards-edge" x="752" y="242">arm it</text>
  </g>
  <text class="rollout-hazards-sub" x="30" y="304">The third is the one that surprises teams who treat shadow mode as free: every mirrored request is a real inference on real hardware, and at full mirroring the experiment costs exactly as much as production.</text>
</svg>
