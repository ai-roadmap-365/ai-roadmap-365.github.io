<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One measures; one earns.">
  <title>A bandit or a fixed split</title>
  <style>
    .bandit-or-ab-bg   { fill: #f8fafc; }
    .bandit-or-ab-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandit-or-ab-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandit-or-ab-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandit-or-ab-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandit-or-ab-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bandit-or-ab-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bandit-or-ab-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .bandit-or-ab-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .bandit-or-ab-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .bandit-or-ab-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .bandit-or-ab-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bandit-or-ab-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .bandit-or-ab-row { opacity: 1; }
    .bandit-or-ab-r0 { animation-delay: 0.00s; }
    .bandit-or-ab-r1 { animation-delay: 0.45s; }
    .bandit-or-ab-r2 { animation-delay: 0.90s; }
    .bandit-or-ab-r3 { animation-delay: 1.35s; }
    .bandit-or-ab-r4 { animation-delay: 1.80s; }
    .bandit-or-ab-row { animation: bandit-or-ab-reveal 7.3s ease-in-out infinite; }
    @keyframes bandit-or-ab-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="bandit-or-ab-bg" width="980" height="390"/>
  <text class="bandit-or-ab-h1"  x="30" y="40">A bandit or a fixed split</text>
  <text class="bandit-or-ab-sub" x="30" y="64">One measures; one earns.</text>
  <rect class="bandit-or-ab-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="bandit-or-ab-name" x="46" y="122">Fixed A/B</text>
  <text class="bandit-or-ab-desc" x="46" y="142">Half the traffic to the loser.</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r0" x="46" y="182">50/50 for the whole experiment</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r1" x="46" y="216">Clean statistics, a clear p-value</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r2" x="46" y="250">Sample size computable in advance</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r3" x="46" y="284">Regret is fixed and paid in full</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r4" x="46" y="318">Right when you need a defensible result</text>
  <rect class="bandit-or-ab-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="bandit-or-ab-name" x="526" y="122">Bandit</text>
  <text class="bandit-or-ab-desc" x="526" y="142">Traffic follows the winner.</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r0" x="526" y="182">Allocation shifts as evidence arrives</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r1" x="526" y="216">Regret minimised while learning</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r2" x="526" y="250">No arbitrary epsilon to tune</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r3" x="526" y="284">Harder to report as a significance test</text>
  <text class="bandit-or-ab-desc bandit-or-ab-row bandit-or-ab-r4" x="526" y="318">Right when the goal is the outcome</text>
  <text class="bandit-or-ab-sub" x="30" y="372">The choice is between wanting a defensible measurement and wanting the best outcome during the measurement, and those are genuinely different goals rather than two routes to one.</text>
</svg>
