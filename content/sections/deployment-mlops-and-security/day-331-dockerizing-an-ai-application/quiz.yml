questions:
- question: What is the primary cause of GPU memory waste in traditional HuggingFace Transformers inference
    serving?
  options:
  - Using Python instead of Rust
  - Static contiguous memory allocation for KV caches based on maximum theoretical sequence length (e.g.
    4,096 tokens); because real requests vary in length, 60% to 80% of allocated GPU VRAM sits idle as
    internal and external memory fragmentation
  - Transformers do not support GPUs
  - CUDA drivers require 90% of memory for logging
  answer_index: 1
  explanation: Pre-allocating contiguous memory for worst-case sequence lengths results in massive VRAM
    fragmentation.
- question: How does PagedAttention (as implemented in vLLM) eliminate KV cache memory fragmentation?
  options:
  - By deleting the KV cache after every token
  - By dividing the KV cache into fixed-size virtual memory blocks (e.g. 16 tokens per block) managed
    via an OS-style page table; blocks do not need to be stored contiguously in physical GPU memory, achieving
    near-zero memory waste
  - By compressing all tokens into single floating point numbers
  - By storing KV caches on mechanical hard drives
  answer_index: 1
  explanation: PagedAttention treats KV cache memory like virtual memory pages, dynamically allocating
    physical blocks on demand.
- question: What is 'Continuous Batching' (Iteration-Level Scheduling) compared to Static Batching?
  options:
  - Running requests sequentially one by one
  - 'Scheduling at the token iteration level rather than the request level: new arriving requests immediately
    join the active batch for prefill while completed requests leave immediately, eliminating idle GPU
    bubbles'
  - Batching 100 requests on a timer once per hour
  - Restarting the model on every batch
  answer_index: 1
  explanation: Continuous batching schedules dynamically after every token iteration, maximizing GPU compute
    utilization.
- question: How does Tensor Parallelism (TP) distribute a 70B parameter model across 4 GPUs?
  options:
  - By placing Layer 1-8 on GPU 0, Layer 9-16 on GPU 1
  - By splitting individual linear weight matrices (Column-Parallel for Self-Attention QKV and Row-Parallel
    for Attention Output) across the 4 GPUs, synchronizing activations via NCCL AllReduce operations at
    each layer
  - By running 4 identical copies of the model
  - By converting the model to audio format
  answer_index: 1
  explanation: Tensor parallelism shards individual weight matrices within each layer across multiple
    GPUs.
- question: What is the difference between Time-to-First-Token (TTFT) and Inter-Token Latency (ITL)?
  options:
  - They are identical metrics
  - TTFT measures the time to process the input prompt and emit the very first output token (Prefill phase);
    ITL measures the average time elapsed between generating each subsequent token (Decode phase)
  - TTFT is only for audio models
  - ITL is the time to download the container image
  answer_index: 1
  explanation: TTFT reflects prefill compute latency; ITL reflects auto-regressive decode generation speed.
