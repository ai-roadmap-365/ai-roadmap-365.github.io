questions:
  - question: Why does a multi-stage build save proportionally much less on an AI image than on a web
      application image?
    options:
      - Because multi-stage builds do not work correctly with GPU base images
      - Because compressed layers behave differently when they contain binary data
      - Because AI frameworks cannot be compiled in a separate stage
      - 'The weights are runtime data, not build tooling'
    answer_index: 3
    explanation: Most Docker guidance was written for applications where the biggest thing is the
      framework. In an AI image the biggest thing is usually the model.
  - question: What is the difference between cuda-devel and cuda-runtime, and which belongs in the
      final stage?
    options:
      - 'devel builds at 4.1 GB; runtime links at 1.6 GB'
      - They are the same image under two names; either is fine
      - cuda-runtime is for inference and cuda-devel is for training, so both ship
      - cuda-devel is smaller because it excludes the drivers
    answer_index: 0
    explanation: NVIDIA publishing them as separate images is the vendor signalling which one belongs
      in a runtime stage. Confusing them is a multi-gigabyte error.
  - question: Why is image size a deployment problem rather than a disk-space problem?
    options:
      - Because container registries charge by image size regardless of pulls
      - 'Size times node count is time before anything serves'
      - Because large images run more slowly once started
      - Because disk is cheap only on cloud providers
    answer_index: 1
    explanation: In the lab a 21 GB image costs 16,902 seconds across twenty nodes. The same service
      at 4.5 GB costs 3,642.
  - question: Mounting weights instead of baking them in makes the image far smaller. What does it add
      that you must then handle?
    options:
      - Nothing; it is strictly better in every respect
      - A requirement to run the container as root
      - 'A supply-chain input — verify a checksum on load'
      - A dependency on a specific container runtime
    answer_index: 2
    explanation: Decoupling the lifecycles is the win. The cost is that the model now arrives from
      somewhere the image does not control.
  - question: Why does copying a build artefact forward preserve the benefit of a multi-stage build
      while copying the toolchain forward destroys it?
    options:
      - Because artefacts compress better than binaries
      - Because the toolchain has to be reinstalled anyway
      - Because COPY --from cannot copy directories
      - 'The builder stage is meant to be discarded'
    answer_index: 3
    explanation: This is why the lab's review checks the carried components as well as the final
      stage's own -- carrying the toolchain forward is a silent way to undo the whole arrangement.
