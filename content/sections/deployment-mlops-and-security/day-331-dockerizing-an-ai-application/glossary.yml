terms:
  - term: Multi-Stage Build
    definition: A Dockerfile with several FROM instructions where a later stage copies artefacts out
      of an earlier one. Only the final stage ships; the builder is discarded entirely.
  - term: Builder Stage
    definition: An early stage carrying compilers and headers, used to produce artefacts. Its size
      does not affect the shipped image, which is why it can use a full base.
  - term: Build-Only Component
    definition: Something needed to produce artefacts and never at run time — build-essential,
      cuda-devel. In a final image it is pure waste and an available toolchain.
  - term: Runtime Component
    definition: Something the running process genuinely needs — the interpreter, cuda-runtime, the
      framework, your code. It can be made slimmer but not dropped.
  - term: Data Component
    definition: Model weights and assets. Needed at run time but not needed IN the image, which is the
      distinction that produces the larger saving.
  - term: cuda-devel versus cuda-runtime
    definition: The CUDA compiler toolkit against the libraries a compiled program links against —
      roughly 4.1 GB against 1.6 GB. Only the runtime belongs in a final stage.
  - term: Slim Base
    definition: A base image carrying the interpreter without the build toolchain. Smaller, and fewer
      packages that can carry a vulnerability.
  - term: Distroless
    definition: An image containing an application's runtime dependencies and nothing else — no shell,
      no package manager. Excellent for security, harder to debug.
  - term: Rollout Time
    definition: Image size multiplied by the number of nodes that must pull it. The unit in which
      image size is actually experienced.
  - term: Baked-In Weights
    definition: Model weights copied into the image. Simple and reproducible, and it couples the
      model's lifecycle to the code's, so a one-line fix re-pulls gigabytes.
  - term: Mounted Weights
    definition: Weights supplied at run time from a volume or object storage. Decouples the
      lifecycles, shrinks the image, and makes the mount a supply-chain input to verify.
