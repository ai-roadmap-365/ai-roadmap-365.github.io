terms:
- term: vLLM
  definition: A high-throughput LLM serving engine featuring PagedAttention and continuous batching.
- term: Text Generation Inference (TGI)
  definition: HuggingFace's enterprise production inference server optimized for fast LLM deployment.
- term: PagedAttention
  definition: An attention algorithm storing Key-Value tensors in non-contiguous virtual memory blocks.
- term: Continuous Batching
  definition: Dynamic iteration-level request scheduling eliminating idle GPU execution bubbles.
- term: Tensor Parallelism (TP)
  definition: Sharding model weight matrices within each layer across multiple GPUs using NCCL AllReduce.
- term: KV Cache
  definition: Saved Key and Value attention tensors from preceding tokens avoiding redundant matrix recomputation.
- term: Prefill Phase
  definition: Processing the entire input prompt in parallel to generate the initial KV cache and first
    token.
- term: Decode Phase
  definition: Generating output tokens auto-regressively one token at a time using the accumulated KV
    cache.
