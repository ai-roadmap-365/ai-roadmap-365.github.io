week: 48
learning_promise: 'Master high-throughput LLM serving engines: implement PagedAttention virtual memory
  management, iteration-level Continuous Batching, and Tensor Parallelism across multi-GPU clusters in
  Python.'
objectives:
- Deconstruct the memory fragmentation bottleneck of standard KV caches and how PagedAttention achieves
  near-zero VRAM waste.
- Implement Continuous (Iteration-Level) Batching interleaving new prefill requests with active decode
  token generation.
- Architect Tensor Parallelism (TP) splitting multi-head attention weight matrices across multiple GPUs
  using NCCL AllReduce.
- Build a production-grade LLM Inference Server Simulator in Python supporting Paged KV cache allocation
  and continuous scheduling.
- Evaluate throughput (tokens/sec), Time-to-First-Token (TTFT), and Inter-Token Latency (ITL) under heavy
  concurrent load.
