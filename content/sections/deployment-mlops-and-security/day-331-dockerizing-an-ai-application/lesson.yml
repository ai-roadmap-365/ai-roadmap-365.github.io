week: 48
learning_promise:
  'Sort everything that could go into an AI image into build-only, runtime and data, then
  measure what each decision costs. Discover that the multi-stage build every tutorial teaches saves
  1.17x while moving the model weights out saves 3.97x, and that a rollout to twenty nodes falls from
  four and a half hours to one.'
objectives:
  - Compute an image size from its stages, and explain why only the final stage ships.
  - Separate build-only components from runtime ones, which is what multi-stage removes.
  - Separate runtime components from data, which is what mounting relocates.
  - Convert image size into rollout time across a fleet, the unit that is actually felt.
  - Choose between cuda-devel and cuda-runtime, and say why the vendor ships both.
