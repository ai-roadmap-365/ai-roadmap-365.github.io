<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The industry reached this conclusion too.">
  <title>Why weights became their own artefact</title>
  <style>
    .weights-lifecycle-bg   { fill: #f8fafc; }
    .weights-lifecycle-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-lifecycle-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-lifecycle-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-lifecycle-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-lifecycle-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .weights-lifecycle-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .weights-lifecycle-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .weights-lifecycle-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .weights-lifecycle-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .weights-lifecycle-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .weights-lifecycle-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .weights-lifecycle-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .weights-lifecycle-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .weights-lifecycle-stage { opacity: 1; }

    .weights-lifecycle-s0 { animation-delay: 0.00s; }
    .weights-lifecycle-e0 { animation-delay: 0.00s; }
    .weights-lifecycle-s1 { animation-delay: 1.28s; }
    .weights-lifecycle-e1 { animation-delay: 1.28s; }
    .weights-lifecycle-s2 { animation-delay: 2.56s; }
    .weights-lifecycle-e2 { animation-delay: 2.56s; }
    .weights-lifecycle-s3 { animation-delay: 3.84s; }
    .weights-lifecycle-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .weights-lifecycle-conn  { animation: weights-lifecycle-trace 6.4s ease-in-out infinite; }
      .weights-lifecycle-stage { animation: weights-lifecycle-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes weights-lifecycle-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes weights-lifecycle-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .weights-lifecycle-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .weights-lifecycle-stage { animation: weights-lifecycle-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes weights-lifecycle-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="weights-lifecycle-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="weights-lifecycle-bg" width="980" height="322"/>
  <text class="weights-lifecycle-h1"  x="30" y="40">Why weights became their own artefact</text>
  <text class="weights-lifecycle-sub" x="30" y="64">The industry reached this conclusion too.</text>
  <g class="weights-lifecycle-stage weights-lifecycle-s0">
    <rect class="weights-lifecycle-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="weights-lifecycle-step" x="44" y="142">01</text>
    <text class="weights-lifecycle-name" x="70" y="142">Static linking</text>
    <text class="weights-lifecycle-desc" x="44" y="166">Size for independence. The same</text>
    <text class="weights-lifecycle-desc" x="44" y="182">trade, at a different</text>
    <text class="weights-lifecycle-desc" x="44" y="198">granularity.</text>
  </g>
  <line class="weights-lifecycle-line weights-lifecycle-conn weights-lifecycle-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#weights-lifecycle-tip)"/>
  <g class="weights-lifecycle-stage weights-lifecycle-s1">
    <rect class="weights-lifecycle-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="weights-lifecycle-step" x="280" y="142">02</text>
    <text class="weights-lifecycle-name" x="306" y="142">Multi-stage builds, 2017</text>
    <text class="weights-lifecycle-desc" x="280" y="166">FROM ... AS builder collapsed a</text>
    <text class="weights-lifecycle-desc" x="280" y="182">two-file shell dance into one</text>
    <text class="weights-lifecycle-desc" x="280" y="198">file.</text>
  </g>
  <line class="weights-lifecycle-line weights-lifecycle-conn weights-lifecycle-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#weights-lifecycle-tip)"/>
  <g class="weights-lifecycle-stage weights-lifecycle-s2">
    <rect class="weights-lifecycle-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="weights-lifecycle-step" x="516" y="142">03</text>
    <text class="weights-lifecycle-name" x="542" y="142">Distroless, 2017</text>
    <text class="weights-lifecycle-desc" x="516" y="166">Runtime dependencies and nothing</text>
    <text class="weights-lifecycle-desc" x="516" y="182">else. No shell for an attacker</text>
    <text class="weights-lifecycle-desc" x="516" y="198">to find.</text>
  </g>
  <line class="weights-lifecycle-line weights-lifecycle-conn weights-lifecycle-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#weights-lifecycle-tip)"/>
  <g class="weights-lifecycle-stage weights-lifecycle-s3">
    <rect class="weights-lifecycle-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="weights-lifecycle-step" x="752" y="142">04</text>
    <text class="weights-lifecycle-name" x="778" y="142">Model registries</text>
    <text class="weights-lifecycle-desc" x="752" y="166">Hugging Face Hub, MLflow,</text>
    <text class="weights-lifecycle-desc" x="752" y="182">safetensors. Weights are data</text>
    <text class="weights-lifecycle-desc" x="752" y="198">with a lifecycle.</text>
    <text class="weights-lifecycle-edge" x="752" y="242">separate</text>
  </g>
  <text class="weights-lifecycle-sub" x="30" y="304">The last row is the industry arriving at this lesson's conclusion independently: versioning, access control and distribution for weights want to be separate from the code that loads them.</text>
</svg>
