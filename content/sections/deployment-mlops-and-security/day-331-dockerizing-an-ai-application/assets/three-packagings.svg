<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Three Packagings of the Same Service showing sizes falling from 21 gigabytes to 4.5 and rollout time from nearly five hours to one">
  <title>Three Packagings of the Same Service</title>
  <defs>
    <style>
      .d331b-bg { fill: #f8fafc; }
      .d331b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d331b-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d331b-mid { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d331b-good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d331b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d331b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d331b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d331b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d331b-ax { stroke: #94a3b8; stroke-width: 1.5px; }
    </style>
  </defs>
  <rect class="d331b-bg" width="900" height="430" />
  <text class="d331b-title" x="30" y="36">Three Packagings of the Same Service</text>
  <text class="d331b-s" x="30" y="58">Same framework, same model, same code. Bars drawn to scale.</text>

  <line class="d331b-ax" x1="250" y1="196" x2="870" y2="196" />
  <text class="d331b-s" x="250" y="216">0</text>
  <text class="d331b-s" x="530" y="216">10 GB</text>
  <text class="d331b-s" x="820" y="216">21 GB</text>

  <text class="d331b-t" x="30" y="94">1. single stage</text>
  <rect class="d331b-bad" x="250" y="76" width="590" height="26" rx="4" />
  <text class="d331b-s" x="640" y="94" fill="#7f1d1d">21,128 MB</text>

  <text class="d331b-t" x="30" y="136">2. multi-stage</text>
  <rect class="d331b-mid" x="250" y="118" width="504" height="26" rx="4" />
  <text class="d331b-s" x="560" y="136" fill="#a16207">18,053 MB — a correctly written Dockerfile</text>

  <text class="d331b-t" x="30" y="178">3. weights mounted</text>
  <rect class="d331b-good" x="250" y="160" width="127" height="26" rx="4" />
  <text class="d331b-s" x="390" y="178" fill="#15803d">4,553 MB</text>

  <rect class="d331b-card" x="30" y="244" width="410" height="88" rx="8" />
  <text class="d331b-h" x="48" y="270">The famous optimisation</text>
  <text class="d331b-t" x="48" y="296">multi-stage build: 3,075 MB saved</text>
  <text class="d331b-s" x="48" y="318">1.17x smaller</text>

  <rect class="d331b-card" x="460" y="244" width="410" height="88" rx="8" />
  <text class="d331b-h" x="478" y="270">The one nobody mentions</text>
  <text class="d331b-t" x="478" y="296">mount the weights: 13,500 MB saved</text>
  <text class="d331b-s" x="478" y="318">3.97x smaller</text>

  <rect class="d331b-good" x="30" y="350" width="840" height="56" rx="6" />
  <text class="d331b-h" x="48" y="374">Rollout to 20 nodes: 16,902s → 3,642s</text>
  <text class="d331b-s" x="48" y="394">Four hours 42 minutes down to one hour. A rollout pays the pull once per node.</text>
</svg>
