<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Continuous Iteration-Level Batching vs Static Batching">
  <title>Continuous Iteration-Level Batching vs Static Batching</title>
  <defs>
    <style>
      .d331b-bg { fill: #f8fafc; }
      .d331b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d331b-stat { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d331b-cont { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d331b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d331b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d331b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d331b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d331b-bg" />
  
  <text x="40" y="40" class="d331a-title">Batch Scheduling: Static vs Continuous (vLLM / TGI)</text>
  <text x="40" y="65" class="d331a-subtitle">Continuous Iteration-Level Batching vs Static Batching comparing Static Batching with massive GPU idle bubbles against Continuous Batching interleaving new requests dynamically at every iteration</text>
  
  <!-- Static Batching -->
  <rect x="40" y="110" width="390" height="270" class="d331b-stat" />
  <text x="60" y="145" class="d331b-header" fill="#1d4ed8">Traditional Static Request Batching</text>
  <text x="60" y="180" class="d331b-text">• Waits for N requests to arrive</text>
  <text x="60" y="205" class="d331b-text">• Pads all requests to longest sequence</text>
  <text x="60" y="230" class="d331b-text">• **Short request completes in 10 tokens:**</text>
  <text x="60" y="250" class="d331b-text">  GPU sits idle waiting for 500-token request!</text>
  <text x="60" y="280" class="d331b-text">• New incoming requests must wait for batch</text>
  <text x="60" y="320" class="d331b-text" font-weight="600" fill="#1d4ed8">Flaw: Severe GPU Underutilization (Bubbles)</text>
  
  <!-- Continuous Batching -->
  <rect x="470" y="110" width="390" height="270" class="d331b-cont" />
  <text x="490" y="145" class="d331b-header" fill="#15803d">Continuous Iteration-Level Batching (vLLM / TGI)</text>
  <text x="490" y="180" class="d331b-text">• Dynamic scheduling after EVERY token generation</text>
  <text x="490" y="205" class="d331b-text">• Completed requests leave batch instantly</text>
  <text x="490" y="230" class="d331b-text">• New arriving requests inserted into active batch</text>
  <text x="490" y="255" class="d331b-text">• Prefill and Decode interleaved seamlessly</text>
  <text x="490" y="280" class="d331b-text">• Zero padding tokens processed</text>
  <text x="490" y="320" class="d331b-text" font-weight="600" fill="#15803d">Outcome: 5x Higher Throughput (Tokens/Sec)</text>
</svg>