<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="The decisions follow from the sort.">
  <title>Sort everything into three buckets</title>
  <style>
    .three-buckets-bg   { fill: #f8fafc; }
    .three-buckets-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-buckets-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-buckets-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-buckets-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-buckets-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-buckets-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-buckets-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-buckets-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-buckets-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-buckets-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-buckets-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-buckets-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-buckets-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-buckets-stage { opacity: 1; }

    .three-buckets-s0 { animation-delay: 0.00s; }
    .three-buckets-e0 { animation-delay: 0.00s; }
    .three-buckets-s1 { animation-delay: 1.28s; }
    .three-buckets-e1 { animation-delay: 1.28s; }
    .three-buckets-s2 { animation-delay: 2.56s; }
    .three-buckets-e2 { animation-delay: 2.56s; }
    .three-buckets-s3 { animation-delay: 3.84s; }
    .three-buckets-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-buckets-conn  { animation: three-buckets-trace 6.4s ease-in-out infinite; }
      .three-buckets-stage { animation: three-buckets-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes three-buckets-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-buckets-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-buckets-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-buckets-stage { animation: three-buckets-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-buckets-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-buckets-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-buckets-bg" width="980" height="322"/>
  <text class="three-buckets-h1"  x="30" y="40">Sort everything into three buckets</text>
  <text class="three-buckets-sub" x="30" y="64">The decisions follow from the sort.</text>
  <g class="three-buckets-stage three-buckets-s0">
    <rect class="three-buckets-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="three-buckets-step" x="44" y="142">01</text>
    <text class="three-buckets-name" x="70" y="142">Build-only</text>
    <text class="three-buckets-desc" x="44" y="166">Compilers, headers, cuda-devel.</text>
    <text class="three-buckets-desc" x="44" y="182">The running process never calls</text>
    <text class="three-buckets-desc" x="44" y="198">them.</text>
    <text class="three-buckets-edge" x="44" y="242">multi-stage</text>
  </g>
  <line class="three-buckets-line three-buckets-conn three-buckets-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#three-buckets-tip)"/>
  <g class="three-buckets-stage three-buckets-s1">
    <rect class="three-buckets-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="three-buckets-step" x="280" y="142">02</text>
    <text class="three-buckets-name" x="306" y="142">Runtime</text>
    <text class="three-buckets-desc" x="280" y="166">Interpreter, cuda-runtime,</text>
    <text class="three-buckets-desc" x="280" y="182">framework, your code. It ships.</text>
    <text class="three-buckets-edge" x="280" y="242">slim base</text>
  </g>
  <line class="three-buckets-line three-buckets-conn three-buckets-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#three-buckets-tip)"/>
  <g class="three-buckets-stage three-buckets-s2">
    <rect class="three-buckets-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="three-buckets-step" x="516" y="142">03</text>
    <text class="three-buckets-name" x="542" y="142">Data</text>
    <text class="three-buckets-desc" x="516" y="166">Weights, embeddings, assets.</text>
    <text class="three-buckets-desc" x="516" y="182">Needed at run time, not</text>
    <text class="three-buckets-desc" x="516" y="198">necessarily in the image.</text>
    <text class="three-buckets-edge" x="516" y="242">mount it</text>
  </g>
  <line class="three-buckets-line three-buckets-conn three-buckets-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#three-buckets-tip)"/>
  <g class="three-buckets-stage three-buckets-s3">
    <rect class="three-buckets-warn" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="three-buckets-step" x="752" y="142">04</text>
    <text class="three-buckets-name" x="778" y="142">The third bucket is empty for web apps</text>
    <text class="three-buckets-desc" x="752" y="166">Which is why no general guide</text>
    <text class="three-buckets-desc" x="752" y="182">draws it — and why it is 13.5 GB</text>
    <text class="three-buckets-desc" x="752" y="198">here.</text>
  </g>
  <text class="three-buckets-sub" x="30" y="304">Drawing the third bucket is the difference between an 18 GB image and a 4.5 GB one, and it is invisible in every piece of Dockerfile advice written for a web service.</text>
</svg>
