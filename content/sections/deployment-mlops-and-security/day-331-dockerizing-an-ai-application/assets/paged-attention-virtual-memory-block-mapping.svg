<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="PagedAttention Virtual Memory Block Mapping">
  <title>PagedAttention Virtual Memory Block Mapping</title>
  <defs>
    <style>
      .d331a-bg { fill: #f8fafc; }
      .d331a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d331a-log { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d331a-tbl { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d331a-phy { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d331a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d331a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d331a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d331a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d331a-bg" />
  
  <text x="40" y="40" class="d331a-title">PagedAttention Virtual Memory Architecture (vLLM)</text>
  <text x="40" y="65" class="d331a-subtitle">PagedAttention Virtual Memory Block Mapping showing Logical KV Cache mapped through a Block Table to Non-Contiguous Physical GPU VRAM Blocks with Zero Fragmentation</text>
  
  <!-- Logical Blocks -->
  <rect x="40" y="110" width="240" height="270" class="d331a-log" />
  <text x="55" y="145" class="d331a-header" fill="#1d4ed8">1. Logical Sequence Blocks</text>
  <text x="55" y="180" class="d331a-text">• Request A: "Tell me a story..."</text>
  <text x="55" y="205" class="d331a-text">• Block 0: Tokens 0 - 15</text>
  <text x="55" y="230" class="d331a-text">• Block 1: Tokens 16 - 31</text>
  <text x="55" y="255" class="d331a-text">• Block 2: Tokens 32 - 47</text>
  <text x="55" y="295" class="d331a-text" font-weight="600" fill="#1d4ed8">Logical Continuity</text>
  <text x="55" y="320" class="d331a-text">Appears contiguous to LLM</text>
  
  <!-- Block Table -->
  <rect x="315" y="110" width="240" height="270" class="d331a-tbl" />
  <text x="330" y="145" class="d331a-header" fill="#7e22ce">2. Block Translation Table</text>
  <text x="330" y="180" class="d331a-text">• Logical Block 0 ➔ Physical #7</text>
  <text x="330" y="205" class="d331a-text">• Logical Block 1 ➔ Physical #1</text>
  <text x="330" y="230" class="d331a-text">• Logical Block 2 ➔ Physical #12</text>
  <text x="330" y="260" class="d331a-text">• Reference Count: `ref_count=1`</text>
  <text x="330" y="295" class="d331a-text" font-weight="600" fill="#7e22ce">Copy-on-Write Enabled</text>
  <text x="330" y="320" class="d331a-text">Shared prefix memory sharing</text>
  
  <!-- Physical VRAM Blocks -->
  <rect x="590" y="110" width="270" height="270" class="d331a-phy" />
  <text x="605" y="145" class="d331a-header" fill="#15803d">3. Physical GPU VRAM Pool</text>
  <text x="605" y="180" class="d331a-text">• Physical Block #1: [Req A Block 1]</text>
  <text x="605" y="205" class="d331a-text">• Physical Block #2: [Req B Block 0]</text>
  <text x="605" y="230" class="d331a-text">• Physical Block #7: [Req A Block 0]</text>
  <text x="605" y="255" class="d331a-text">• Physical Block #12: [Req A Block 2]</text>
  <text x="605" y="295" class="d331a-text" font-weight="600" fill="#15803d">Outcome: 0% Memory Waste</text>
  <text x="605" y="320" class="d331a-text">4x Concurrent Batch Throughput</text>
</svg>