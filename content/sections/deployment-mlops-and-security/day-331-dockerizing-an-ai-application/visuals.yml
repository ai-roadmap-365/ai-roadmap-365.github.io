visuals:
  - id: what-is-in-an-ai-image
    file: assets/what-is-in-an-ai-image.svg
    type: diagram
    title: What Is Actually In An AI Image
    alt: What Is Actually In An AI Image showing build tooling, framework and weights as proportions of
      a twenty-one gigabyte image
    description: A 21 GB image drawn to scale across the three buckets, with the note that the data
      bucket is empty in a web application and is why most Docker guidance never mentions it.
  - id: three-packagings
    file: assets/three-packagings.svg
    type: diagram
    title: Three Packagings of the Same Service
    alt: Three Packagings of the Same Service showing sizes falling from 21 gigabytes to 4.5 and
      rollout time from nearly five hours to one
    description: Single-stage, multi-stage and weights-mounted plans drawn to scale, contrasting the
      1.17x saving from the famous optimisation with the 3.97x from the one nobody mentions.
  - id: three-buckets
    file: assets/three-buckets.svg
    type: diagram
    title: 'Sort everything into three buckets'
    alt: 'Diagram: sorting image contents into build-only, runtime and data'
    description: 'A four-stage description of sorting image contents into build-only components, runtime components and data, and the mechanism that removes each.'
  - id: famous-versus-large
    file: assets/famous-versus-large.svg
    type: diagram
    title: 'The famous win and the large one'
    alt: 'Diagram: the size reduction from a multi-stage build compared with mounting the weights'
    description: 'A two-column comparison of the measured savings from multi-stage builds against the savings from moving model weights out of the image.'
  - id: weights-lifecycle
    file: assets/weights-lifecycle.svg
    type: diagram
    title: 'Why weights became their own artefact'
    alt: 'Diagram: the progression from fat binaries to model registries'
    description: 'A four-stage progression from static linking through multi-stage builds and distroless images to model registries treating weights as versioned data.'
  - id: not-smallest-possible
    file: assets/not-smallest-possible.svg
    type: diagram
    title: 'Not "as small as possible"'
    alt: 'Diagram: what image optimisation is for compared with three misreadings of it'
    description: 'A two-column comparison of the actual goal of image optimisation against three common misinterpretations.'
  - id: packaging-procedure
    file: assets/packaging-procedure.svg
    type: diagram
    title: 'How to package the service'
    alt: 'Diagram: the six steps of packaging an AI service into a container'
    description: 'A six-stage procedure covering the builder stage, the slim final stage, copying artefacts rather than tooling, leaving weights out, adding a non-root user, and measuring in rollout seconds.'
  - id: cuda-devel-or-runtime
    file: assets/cuda-devel-or-runtime.svg
    type: diagram
    title: 'cuda-devel or cuda-runtime'
    alt: 'Diagram: the CUDA development image compared with the runtime image'
    description: 'A two-column comparison of the CUDA devel image against the runtime image, by contents, size and where each belongs.'
  - id: moving-house
    file: assets/moving-house.svg
    type: diagram
    title: 'Moving house'
    alt: 'Diagram: moving house as an analogy for build-only, runtime and data'
    description: 'A two-column comparison mapping the three image buckets onto moving house, and identifying the mistake the analogy exposes.'
  - id: size-is-rollout
    file: assets/size-is-rollout.svg
    type: diagram
    title: 'Size is a rollout number'
    alt: 'Diagram: image size expressed as disk space compared with rollout time'
    description: 'A two-column comparison of thinking about image size as storage against thinking about it as pull time multiplied by node count.'
  - id: ai-image-implications
    file: assets/ai-image-implications.svg
    type: diagram
    title: 'Where size and security agree'
    alt: 'Diagram: the security, supply-chain, licensing, performance and cost implications of AI image packaging'
    description: 'A five-stage description of packaging implications covering build tooling as an attack surface, mounted volumes as inputs, licensing, when size is felt, and registry egress.'
  - id: baked-or-mounted
    file: assets/baked-or-mounted.svg
    type: diagram
    title: 'Baked in, or mounted'
    alt: 'Diagram: baking model weights into an image compared with mounting them'
    description: 'A two-column comparison of baking weights into the image against mounting or fetching them at runtime.'
  - id: packaging-decisions
    file: assets/packaging-decisions.svg
    type: diagram
    title: 'The decisions, and their thresholds'
    alt: 'Diagram: when to separate stages, mount weights, and stop optimising'
    description: 'A two-column comparison of packaging practices to apply unconditionally against those that depend on model size and licensing.'
  - id: packaging-cost-gradient
    file: assets/packaging-cost-gradient.svg
    type: diagram
    title: 'Three packagings, one service'
    alt: 'Diagram: the measured size and rollout time of three packagings of one service'
    description: 'A four-stage reading of measured results for single-stage, multi-stage and weights-mounted packagings of the same AI service.'
