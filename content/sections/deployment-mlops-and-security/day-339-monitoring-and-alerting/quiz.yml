questions:
- question: What are the SRE Four Golden Signals specifically tailored for Large Language Model serving?
  options:
  - Screen size, font weight, cursor color, and window width
  - 'Latency, traffic, errors, and saturation'
  - Number of lines of Python code
  - The brand of the computer monitor
  answer_index: 1
  explanation: Latency, Traffic, Errors, and Saturation form the foundational operational health metrics
    for LLM serving.
- question: Why is measuring average (mean) latency dangerous for monitoring LLM serving health?
  options:
  - Because Python does not support math averages
  - Because mean latency is always negative
  - 'A fast mean can hide a very slow tail'
  - Because averages only work for audio models
  answer_index: 2
  explanation: Heavy-tailed LLM response distributions require percentile metrics (P95, P99) to detect
    severe tail latency.
- question: What is an 'Error Budget Burn Rate' alert in SRE monitoring?
  options:
  - Burning paper money in the office
  - The electricity bill of the datacenter
  - A metric for GPU temperature
  - 'It fires when the error budget is burning too fast'
  answer_index: 3
  explanation: Error budget burn rate alerting detects rapid SLA degradation before contractual violation
    occurs.
- question: What is OpenTelemetry (OTel) and why is it the vendor-neutral standard for AI observability?
  options:
  - 'A vendor-neutral standard for traces and metrics'
  - A proprietary database owned by Oracle
  - A Python compiler
  - A Docker container replacement
  answer_index: 0
  explanation: OpenTelemetry provides standardized vendor-neutral instrumentation for traces, metrics,
    and logs.
- question: What is the difference between a Warning Alert and a Paging Alert in an SRE escalation policy?
  options:
  - There is no difference
  - 'Warnings go to chat; pages wake someone up'
  - Warning alerts are sent by postal mail
  - Paging alerts restart the server automatically
  answer_index: 1
  explanation: Paging alerts are reserved for active user-facing emergencies requiring immediate on-call
    intervention.
