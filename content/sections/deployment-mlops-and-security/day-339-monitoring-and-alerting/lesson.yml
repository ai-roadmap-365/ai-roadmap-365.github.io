learning_promise: 'Master production AI observability: implement OpenTelemetry instrumentation, Prometheus
  metrics scrapers, SRE Four Golden Signals, Grafana dashboards, and automated P95 latency alerts in Python.'
objectives:
- Deconstruct the SRE Four Golden Signals (Latency, Traffic, Errors, Saturation) adapted specifically
  for GenAI inference workloads.
- Implement OpenTelemetry custom metrics tracking Time-to-First-Token (TTFT), Inter-Token Latency (ITL),
  and prompt/completion token consumption.
- Configure Prometheus alerting rules with P95/P99 latency thresholds, error budget burn rates, and PagerDuty
  escalations.
- Build a production-grade AI Observability & Alerting Engine in Python calculating moving-window percentiles
  and triggering alert state machines.
- 'Evaluate anomaly detection on inference metrics: distinguishing transient network jitter from critical
  GPU driver degradation.'
