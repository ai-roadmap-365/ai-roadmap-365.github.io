terms:
- term: OpenTelemetry (OTel)
  definition: A CNCF open-source observability framework for standardized metrics, traces, and logs.
- term: SRE Golden Signals
  definition: 'The four foundational operational metrics: Latency, Traffic, Errors, and Saturation.'
- term: P95 / P99 Percentile
  definition: The latency threshold below which 95% or 99% of all observed requests fall.
- term: Prometheus
  definition: An open-source time-series database and monitoring system scraping custom `/metrics` endpoints.
- term: Grafana
  definition: An open-source multi-platform visualization and interactive analytics dashboarding platform.
- term: Service Level Objective (SLO)
  definition: A target level of reliability (e.g. 99.9% availability, P95 TTFT < 300ms) agreed with stakeholders.
- term: Error Budget
  definition: The allowable margin of unreliability (e.g. 0.1% for a 99.9% SLO) within a given billing
    period.
- term: Alert Fatigue
  definition: The state where engineers ignore alerts due to excessive noisy or non-actionable notifications.
