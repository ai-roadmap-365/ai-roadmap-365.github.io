visuals:
- id: opentelemetry-prometheus-grafana-observability-pipeline
  file: assets/opentelemetry-prometheus-grafana-observability-pipeline.svg
  type: diagram
  title: OpenTelemetry, Prometheus, and Grafana Observability Pipeline
  alt: OpenTelemetry, Prometheus, and Grafana Observability Pipeline showing Application Metrics Export,
    Prometheus Scrape Collector, Grafana Real-Time Dashboard, and Alertmanager PagerDuty Escalation
  description: System architecture diagram illustrating end-to-end AI observability, scraping, dashboarding,
    and alerting.
- id: sre-golden-signals-and-percentile-latency-distributions
  file: assets/sre-golden-signals-and-percentile-latency-distributions.svg
  type: diagram
  title: SRE Golden Signals and Percentile Latency Distributions
  alt: SRE Golden Signals and Percentile Latency Distributions comparing Mean Latency against P50, P95,
    and P99 tail latency spikes and Error Budget Burn Rates
  description: Analytical diagram detailing heavy-tailed latency percentiles and error budget burn rate
    tracking.
- id: golden-signals-ai
  file: assets/golden-signals-ai.svg
  type: diagram
  title: 'The four golden signals, for AI'
  alt: 'Diagram: the four SRE golden signals adapted for an AI serving system'
  description: 'A four-stage description of latency, traffic, errors and saturation with the AI-specific metric that expresses each.'
- id: mean-or-percentile
  file: assets/mean-or-percentile.svg
  type: diagram
  title: 'The mean describes no real request'
  alt: 'Diagram: mean latency compared with percentile latency on a heavy-tailed distribution'
  description: 'A two-column comparison of reporting mean latency against reporting percentiles for a workload with highly variable request durations.'
- id: monitoring-eras-ai
  file: assets/monitoring-eras-ai.svg
  type: diagram
  title: 'Three paradigms of monitoring'
  alt: 'Diagram: the progression from uptime checks to GenAI-native observability'
  description: 'A three-stage progression from HTTP health checks through the SRE golden signals to OpenTelemetry GenAI semantic conventions.'
- id: not-mean-not-cpu
  file: assets/not-mean-not-cpu.svg
  type: diagram
  title: 'Two things monitoring is never'
  alt: 'Diagram: what AI monitoring is compared with two practices that defeat it'
  description: 'A two-column comparison of correct AI monitoring practice against reliance on means and paging on transient resource spikes.'
- id: burn-rate-windows
  file: assets/burn-rate-windows.svg
  type: diagram
  title: 'Two windows, two burn rates'
  alt: 'Diagram: fast-burn and slow-burn error budget alerting windows'
  description: 'A three-stage description of multi-window burn-rate alerting covering the fast window, the slow window, and why both are required.'
- id: ttft-playbook
  file: assets/ttft-playbook.svg
  type: diagram
  title: 'Triaging a TTFT alert'
  alt: 'Diagram: the four-step triage sequence for a high time-to-first-token alert'
  description: 'A four-stage incident playbook for high TTFT covering ingress concurrency, KV cache exhaustion, prompt length distribution and GPU thermal throttling.'
- id: tsa-analogy
  file: assets/tsa-analogy.svg
  type: diagram
  title: 'Airport security wait times'
  alt: 'Diagram: an advertised average security wait compared with the tail experience'
  description: 'A two-column comparison of an announced average airport security wait against the experience of passengers in the tail of the distribution.'
- id: slo-definitions
  file: assets/slo-definitions.svg
  type: diagram
  title: 'Three SLOs worth naming'
  alt: 'Diagram: the three service level objectives for a generative AI endpoint'
  description: 'A three-stage description of availability, latency and streaming-smoothness objectives with their thresholds and qualifying conditions.'
- id: pager-or-slack
  file: assets/pager-or-slack.svg
  type: diagram
  title: 'Page, or ticket'
  alt: 'Diagram: alerts routed to a pager compared with alerts routed to a ticket queue'
  description: 'A two-column comparison of alert conditions warranting an immediate page against those warranting a ticket or a Slack message.'
- id: observability-implications
  file: assets/observability-implications.svg
  type: diagram
  title: 'Four consequences of instrumenting'
  alt: 'Diagram: the privacy, cardinality, sampling and cost implications of AI observability'
  description: 'A four-stage description of observability implications covering PII in labels, cardinality limits, tail-based trace sampling and retention cost.'
- id: metrics-versus-traces
  file: assets/metrics-versus-traces.svg
  type: diagram
  title: 'Metrics notice; traces explain'
  alt: 'Diagram: metrics compared with distributed traces'
  description: 'A two-column comparison of aggregate metrics against distributed traces by what each answers and what each costs.'
- id: observability-when
  file: assets/observability-when.svg
  type: diagram
  title: 'Where full observability belongs'
  alt: 'Diagram: when to deploy full AI observability and when it is disproportionate'
  description: 'A two-column comparison of systems that require full observability tooling against those where it adds no value.'
