<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Business impact decides.">
  <title>Page, or ticket</title>
  <style>
    .pager-or-slack-bg   { fill: #f8fafc; }
    .pager-or-slack-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pager-or-slack-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pager-or-slack-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pager-or-slack-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pager-or-slack-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pager-or-slack-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pager-or-slack-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pager-or-slack-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pager-or-slack-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pager-or-slack-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pager-or-slack-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pager-or-slack-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pager-or-slack-row { opacity: 1; }
    .pager-or-slack-r0 { animation-delay: 0.00s; }
    .pager-or-slack-r1 { animation-delay: 0.45s; }
    .pager-or-slack-r2 { animation-delay: 0.90s; }
    .pager-or-slack-r3 { animation-delay: 1.35s; }
    .pager-or-slack-r4 { animation-delay: 1.80s; }
    .pager-or-slack-row { animation: pager-or-slack-reveal 7.3s ease-in-out infinite; }
    @keyframes pager-or-slack-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="pager-or-slack-bg" width="980" height="390"/>
  <text class="pager-or-slack-h1"  x="30" y="40">Page, or ticket</text>
  <text class="pager-or-slack-sub" x="30" y="64">Business impact decides.</text>
  <rect class="pager-or-slack-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="pager-or-slack-name" x="46" y="122">Page</text>
  <text class="pager-or-slack-desc" x="46" y="142">Human action, now.</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r0" x="46" y="182">Fast error-budget burn</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r1" x="46" y="216">P95 TTFT above the SLO, sustained</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r2" x="46" y="250">Every replica unhealthy</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r3" x="46" y="284">A user is affected right now</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r4" x="46" y="318">And there is something to do about it</text>
  <rect class="pager-or-slack-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="pager-or-slack-name" x="526" y="122">Ticket or Slack</text>
  <text class="pager-or-slack-desc" x="526" y="142">Human action, eventually.</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r0" x="526" y="182">Slow error-budget burn</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r1" x="526" y="216">A single replica restarting</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r2" x="526" y="250">Rising cardinality in a metric</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r3" x="526" y="284">Real, and not urgent</text>
  <text class="pager-or-slack-desc pager-or-slack-row pager-or-slack-r4" x="526" y="318">Read during working hours</text>
  <text class="pager-or-slack-sub" x="30" y="372">The final row on the left is the test that matters: an alert nobody can act on at 3am is a ticket regardless of severity, and routing it to a pager only teaches people to acknowledge without reading.</text>
</svg>
