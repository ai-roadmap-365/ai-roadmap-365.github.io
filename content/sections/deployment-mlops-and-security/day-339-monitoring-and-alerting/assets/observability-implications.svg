<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two of them are storage bills.">
  <title>Four consequences of instrumenting</title>
  <style>
    .observability-implications-bg   { fill: #f8fafc; }
    .observability-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .observability-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .observability-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .observability-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .observability-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .observability-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .observability-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .observability-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .observability-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .observability-implications-stage { opacity: 1; }

    .observability-implications-s0 { animation-delay: 0.00s; }
    .observability-implications-e0 { animation-delay: 0.00s; }
    .observability-implications-s1 { animation-delay: 1.28s; }
    .observability-implications-e1 { animation-delay: 1.28s; }
    .observability-implications-s2 { animation-delay: 2.56s; }
    .observability-implications-e2 { animation-delay: 2.56s; }
    .observability-implications-s3 { animation-delay: 3.84s; }
    .observability-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .observability-implications-conn  { animation: observability-implications-trace 6.4s ease-in-out infinite; }
      .observability-implications-stage { animation: observability-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes observability-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes observability-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .observability-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .observability-implications-stage { animation: observability-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes observability-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="observability-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="observability-implications-bg" width="980" height="322"/>
  <text class="observability-implications-h1"  x="30" y="40">Four consequences of instrumenting</text>
  <text class="observability-implications-sub" x="30" y="64">Two of them are storage bills.</text>
  <g class="observability-implications-stage observability-implications-s0">
    <rect class="observability-implications-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="observability-implications-step" x="44" y="142">01</text>
    <text class="observability-implications-name" x="70" y="142">No PII in metric labels</text>
    <text class="observability-implications-desc" x="44" y="166">Never prompt text, usernames or</text>
    <text class="observability-implications-desc" x="44" y="182">IP addresses.</text>
    <text class="observability-implications-edge" x="44" y="242">privacy</text>
  </g>
  <line class="observability-implications-line observability-implications-conn observability-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#observability-implications-tip)"/>
  <g class="observability-implications-stage observability-implications-s1">
    <rect class="observability-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="observability-implications-step" x="280" y="142">02</text>
    <text class="observability-implications-name" x="306" y="142">Cardinality kills the database</text>
    <text class="observability-implications-desc" x="280" y="166">A label per user is millions of</text>
    <text class="observability-implications-desc" x="280" y="182">series and an unusable backend.</text>
    <text class="observability-implications-edge" x="280" y="242">scalability</text>
  </g>
  <line class="observability-implications-line observability-implications-conn observability-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#observability-implications-tip)"/>
  <g class="observability-implications-stage observability-implications-s2">
    <rect class="observability-implications-good" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="observability-implications-step" x="516" y="142">03</text>
    <text class="observability-implications-name" x="542" y="142">Tail-based sampling</text>
    <text class="observability-implications-desc" x="516" y="166">Keep 100% of errors and slow</text>
    <text class="observability-implications-desc" x="516" y="182">requests, 1% of fast ones.</text>
    <text class="observability-implications-edge" x="516" y="242">traces</text>
  </g>
  <line class="observability-implications-line observability-implications-conn observability-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#observability-implications-tip)"/>
  <g class="observability-implications-stage observability-implications-s3">
    <rect class="observability-implications-box" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="observability-implications-step" x="752" y="142">04</text>
    <text class="observability-implications-name" x="778" y="142">Retention is a decision</text>
    <text class="observability-implications-desc" x="752" y="166">Not a default that stores</text>
    <text class="observability-implications-desc" x="752" y="182">everything for a year.</text>
    <text class="observability-implications-edge" x="752" y="242">money</text>
  </g>
  <text class="observability-implications-sub" x="30" y="304">The first two are the same mistake with two different consequences: a prompt as a label is both personal data you did not intend to keep and an unbounded label value that will take the time-series database down.</text>
</svg>
