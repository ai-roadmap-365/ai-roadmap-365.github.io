<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Fast catches outages; slow catches bugs.">
  <title>Two windows, two burn rates</title>
  <style>
    .burn-rate-windows-bg   { fill: #f8fafc; }
    .burn-rate-windows-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .burn-rate-windows-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .burn-rate-windows-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .burn-rate-windows-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .burn-rate-windows-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .burn-rate-windows-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .burn-rate-windows-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .burn-rate-windows-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .burn-rate-windows-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .burn-rate-windows-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .burn-rate-windows-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .burn-rate-windows-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .burn-rate-windows-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .burn-rate-windows-stage { opacity: 1; }

    .burn-rate-windows-s0 { animation-delay: 0.00s; }
    .burn-rate-windows-e0 { animation-delay: 0.00s; }
    .burn-rate-windows-s1 { animation-delay: 1.50s; }
    .burn-rate-windows-e1 { animation-delay: 1.50s; }
    .burn-rate-windows-s2 { animation-delay: 3.00s; }
    .burn-rate-windows-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .burn-rate-windows-conn  { animation: burn-rate-windows-trace 6s ease-in-out infinite; }
      .burn-rate-windows-stage { animation: burn-rate-windows-arrive 6s ease-in-out infinite; }
    }
    @keyframes burn-rate-windows-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes burn-rate-windows-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .burn-rate-windows-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .burn-rate-windows-stage { animation: burn-rate-windows-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes burn-rate-windows-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="burn-rate-windows-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="burn-rate-windows-bg" width="980" height="322"/>
  <text class="burn-rate-windows-h1"  x="30" y="40">Two windows, two burn rates</text>
  <text class="burn-rate-windows-sub" x="30" y="64">Fast catches outages; slow catches bugs.</text>
  <g class="burn-rate-windows-stage burn-rate-windows-s0">
    <rect class="burn-rate-windows-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="burn-rate-windows-step" x="44" y="142">01</text>
    <text class="burn-rate-windows-name" x="70" y="142">Fast burn: 5 minutes, 14.4x</text>
    <text class="burn-rate-windows-desc" x="44" y="166">2% of the monthly budget in an hour. Pages</text>
    <text class="burn-rate-windows-desc" x="44" y="182">immediately.</text>
    <text class="burn-rate-windows-edge" x="44" y="242">page</text>
  </g>
  <line class="burn-rate-windows-line burn-rate-windows-conn burn-rate-windows-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#burn-rate-windows-tip)"/>
  <g class="burn-rate-windows-stage burn-rate-windows-s1">
    <rect class="burn-rate-windows-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="burn-rate-windows-step" x="359" y="142">02</text>
    <text class="burn-rate-windows-name" x="385" y="142">Slow burn: 6 hours, 3x</text>
    <text class="burn-rate-windows-desc" x="359" y="166">5% of the budget in twelve hours. Opens a</text>
    <text class="burn-rate-windows-desc" x="359" y="182">ticket.</text>
    <text class="burn-rate-windows-edge" x="359" y="242">ticket</text>
  </g>
  <line class="burn-rate-windows-line burn-rate-windows-conn burn-rate-windows-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#burn-rate-windows-tip)"/>
  <g class="burn-rate-windows-stage burn-rate-windows-s2">
    <rect class="burn-rate-windows-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="burn-rate-windows-step" x="674" y="142">03</text>
    <text class="burn-rate-windows-name" x="700" y="142">Neither alone is enough</text>
    <text class="burn-rate-windows-desc" x="674" y="166">Fast misses a persistent subtle bug; slow</text>
    <text class="burn-rate-windows-desc" x="674" y="182">misses a catastrophe.</text>
  </g>
  <text class="burn-rate-windows-sub" x="30" y="304">The two windows exist because a single threshold has to choose between missing a slow leak and paging on a two-minute blip, and a budget-burn framing lets you have a different response to each.</text>
</svg>
