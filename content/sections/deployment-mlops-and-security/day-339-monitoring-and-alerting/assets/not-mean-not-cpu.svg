<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both produce confident silence.">
  <title>Two things monitoring is never</title>
  <style>
    .not-mean-not-cpu-bg   { fill: #f8fafc; }
    .not-mean-not-cpu-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-mean-not-cpu-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-mean-not-cpu-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-mean-not-cpu-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-mean-not-cpu-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-mean-not-cpu-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-mean-not-cpu-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-mean-not-cpu-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-mean-not-cpu-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-mean-not-cpu-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-mean-not-cpu-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-mean-not-cpu-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-mean-not-cpu-row { opacity: 1; }
    .not-mean-not-cpu-r0 { animation-delay: 0.00s; }
    .not-mean-not-cpu-r1 { animation-delay: 0.45s; }
    .not-mean-not-cpu-r2 { animation-delay: 0.90s; }
    .not-mean-not-cpu-r3 { animation-delay: 1.35s; }
    .not-mean-not-cpu-r4 { animation-delay: 1.80s; }
    .not-mean-not-cpu-row { animation: not-mean-not-cpu-reveal 7.3s ease-in-out infinite; }
    @keyframes not-mean-not-cpu-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-mean-not-cpu-bg" width="980" height="390"/>
  <text class="not-mean-not-cpu-h1"  x="30" y="40">Two things monitoring is never</text>
  <text class="not-mean-not-cpu-sub" x="30" y="64">Both produce confident silence.</text>
  <rect class="not-mean-not-cpu-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-mean-not-cpu-name" x="46" y="122">What it is</text>
  <text class="not-mean-not-cpu-desc" x="46" y="142">Four practices.</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r0" x="46" y="182">Golden signals, adapted for AI</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r1" x="46" y="216">Rolling percentiles, not averages</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r2" x="46" y="250">OpenTelemetry metrics and spans</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r3" x="46" y="284">Two tiers: Slack for warnings, pager for incidents</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r4" x="46" y="318">Alerts describe user impact</text>
  <rect class="not-mean-not-cpu-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-mean-not-cpu-name" x="526" y="122">What it is not</text>
  <text class="not-mean-not-cpu-desc" x="526" y="142">Two, both common.</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r0" x="526" y="182">Mean latency as the headline metric</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r1" x="526" y="216">Paging on a transient CPU blip</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r2" x="526" y="250">Self-healing spikes with zero user impact</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r3" x="526" y="284">Which trains people to ignore the channel</text>
  <text class="not-mean-not-cpu-desc not-mean-not-cpu-row not-mean-not-cpu-r4" x="526" y="318">And the real outage arrives on that channel</text>
  <text class="not-mean-not-cpu-sub" x="30" y="372">The second row is the same argument as Day 360's symptom rule: the cost of a false page is not the interruption, it is that the next page is read with less urgency than it deserves.</text>
</svg>
