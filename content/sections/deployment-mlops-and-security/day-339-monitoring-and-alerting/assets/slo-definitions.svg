<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each with a number and a scope.">
  <title>Three SLOs worth naming</title>
  <style>
    .slo-definitions-bg   { fill: #f8fafc; }
    .slo-definitions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-definitions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-definitions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-definitions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-definitions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .slo-definitions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .slo-definitions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .slo-definitions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .slo-definitions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .slo-definitions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .slo-definitions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .slo-definitions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .slo-definitions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .slo-definitions-stage { opacity: 1; }

    .slo-definitions-s0 { animation-delay: 0.00s; }
    .slo-definitions-e0 { animation-delay: 0.00s; }
    .slo-definitions-s1 { animation-delay: 1.50s; }
    .slo-definitions-e1 { animation-delay: 1.50s; }
    .slo-definitions-s2 { animation-delay: 3.00s; }
    .slo-definitions-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .slo-definitions-conn  { animation: slo-definitions-trace 6s ease-in-out infinite; }
      .slo-definitions-stage { animation: slo-definitions-arrive 6s ease-in-out infinite; }
    }
    @keyframes slo-definitions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes slo-definitions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .slo-definitions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .slo-definitions-stage { animation: slo-definitions-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes slo-definitions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="slo-definitions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="slo-definitions-bg" width="980" height="322"/>
  <text class="slo-definitions-h1"  x="30" y="40">Three SLOs worth naming</text>
  <text class="slo-definitions-sub" x="30" y="64">Each with a number and a scope.</text>
  <g class="slo-definitions-stage slo-definitions-s0">
    <rect class="slo-definitions-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="slo-definitions-step" x="44" y="142">01</text>
    <text class="slo-definitions-name" x="70" y="142">Availability: 99.9% over 30 days</text>
    <text class="slo-definitions-desc" x="44" y="166">Which permits about 43 minutes of monthly</text>
    <text class="slo-definitions-desc" x="44" y="182">downtime.</text>
    <text class="slo-definitions-edge" x="44" y="242">43 min</text>
  </g>
  <line class="slo-definitions-line slo-definitions-conn slo-definitions-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#slo-definitions-tip)"/>
  <g class="slo-definitions-stage slo-definitions-s1">
    <rect class="slo-definitions-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="slo-definitions-step" x="359" y="142">02</text>
    <text class="slo-definitions-name" x="385" y="142">Latency: P95 TTFT under 350 ms</text>
    <text class="slo-definitions-desc" x="359" y="166">For prompts under 2,048 tokens. The scope is</text>
    <text class="slo-definitions-desc" x="359" y="182">part of the objective.</text>
    <text class="slo-definitions-edge" x="359" y="242">scoped</text>
  </g>
  <line class="slo-definitions-line slo-definitions-conn slo-definitions-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#slo-definitions-tip)"/>
  <g class="slo-definitions-stage slo-definitions-s2">
    <rect class="slo-definitions-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="slo-definitions-step" x="674" y="142">03</text>
    <text class="slo-definitions-name" x="700" y="142">Smoothness: P99 ITL under 25 ms</text>
    <text class="slo-definitions-desc" x="674" y="166">Per token, for streaming responses.</text>
    <text class="slo-definitions-edge" x="674" y="242">per token</text>
  </g>
  <text class="slo-definitions-sub" x="30" y="304">The scoping clause on the second is what makes it enforceable: without "for prompts under 2,048 tokens", a single 32k-token request makes the objective unachievable and therefore ignorable.</text>
</svg>
