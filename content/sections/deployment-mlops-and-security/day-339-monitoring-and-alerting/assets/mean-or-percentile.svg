<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Because the distribution is heavy-tailed.">
  <title>The mean describes no real request</title>
  <style>
    .mean-or-percentile-bg   { fill: #f8fafc; }
    .mean-or-percentile-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-or-percentile-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-or-percentile-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-or-percentile-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-or-percentile-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mean-or-percentile-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mean-or-percentile-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .mean-or-percentile-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .mean-or-percentile-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mean-or-percentile-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .mean-or-percentile-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .mean-or-percentile-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .mean-or-percentile-row { opacity: 1; }
    .mean-or-percentile-r0 { animation-delay: 0.00s; }
    .mean-or-percentile-r1 { animation-delay: 0.45s; }
    .mean-or-percentile-r2 { animation-delay: 0.90s; }
    .mean-or-percentile-r3 { animation-delay: 1.35s; }
    .mean-or-percentile-r4 { animation-delay: 1.80s; }
    .mean-or-percentile-row { animation: mean-or-percentile-reveal 7.3s ease-in-out infinite; }
    @keyframes mean-or-percentile-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="mean-or-percentile-bg" width="980" height="390"/>
  <text class="mean-or-percentile-h1"  x="30" y="40">The mean describes no real request</text>
  <text class="mean-or-percentile-sub" x="30" y="64">Because the distribution is heavy-tailed.</text>
  <rect class="mean-or-percentile-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="mean-or-percentile-name" x="46" y="122">Mean latency</text>
  <text class="mean-or-percentile-desc" x="46" y="142">45 ms, and healthy.</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r0" x="46" y="182">Dominated by the many short requests</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r1" x="46" y="216">A 2,000-token summary is 100x a 5-token answer</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r2" x="46" y="250">5% of users time out at 10 seconds</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r3" x="46" y="284">The average never moves</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r4" x="46" y="318">Nothing on the dashboard changes</text>
  <rect class="mean-or-percentile-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="mean-or-percentile-name" x="526" y="122">Percentiles</text>
  <text class="mean-or-percentile-desc" x="526" y="142">P95 tells the truth.</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r0" x="526" y="182">P50, P90, P95, P99 computed on a rolling window</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r1" x="526" y="216">The tail is where the users are</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r2" x="526" y="250">P95 TTFT is the alertable number</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r3" x="526" y="284">Choose the percentile to match the event rate</text>
  <text class="mean-or-percentile-desc mean-or-percentile-row mean-or-percentile-r4" x="526" y="318">Day 360's resolution rule applies</text>
  <text class="mean-or-percentile-sub" x="30" y="372">The mean is not a wrong calculation, it is an answer to a question nobody asked: no user experiences the average of their request and everyone else's, and the tail is where the complaints originate.</text>
</svg>
