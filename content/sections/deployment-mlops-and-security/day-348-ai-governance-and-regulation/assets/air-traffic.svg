<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And a pre-flight checklist.">
  <title>An unregulated sky</title>
  <style>
    .air-traffic-bg   { fill: #f8fafc; }
    .air-traffic-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .air-traffic-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .air-traffic-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .air-traffic-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .air-traffic-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .air-traffic-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .air-traffic-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .air-traffic-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .air-traffic-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .air-traffic-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .air-traffic-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .air-traffic-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .air-traffic-row { opacity: 1; }
    .air-traffic-r0 { animation-delay: 0.00s; }
    .air-traffic-r1 { animation-delay: 0.45s; }
    .air-traffic-r2 { animation-delay: 0.90s; }
    .air-traffic-r3 { animation-delay: 1.35s; }
    .air-traffic-r4 { animation-delay: 1.80s; }
    .air-traffic-row { animation: air-traffic-reveal 7.3s ease-in-out infinite; }
    @keyframes air-traffic-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="air-traffic-bg" width="980" height="390"/>
  <text class="air-traffic-h1"  x="30" y="40">An unregulated sky</text>
  <text class="air-traffic-sub" x="30" y="64">And a pre-flight checklist.</text>
  <rect class="air-traffic-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="air-traffic-name" x="46" y="122">Unregulated</text>
  <text class="air-traffic-desc" x="46" y="142">Anyone takes off.</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r0" x="46" y="182">Unvetted experimental aircraft</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r1" x="46" y="216">No minimum pilot hours</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r2" x="46" y="250">No radio, no coordination</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r3" x="46" y="284">Nobody knows who is airborne</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r4" x="46" y="318">This is ungoverned AI deployment</text>
  <rect class="air-traffic-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="air-traffic-name" x="526" y="122">Regulated</text>
  <text class="air-traffic-desc" x="526" y="142">Rules, and a checklist.</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r0" x="526" y="182">Rules about who may fly what</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r1" x="526" y="216">Minimum hours and certifications</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r2" x="526" y="250">Emergency protocol standards</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r3" x="526" y="284">A standardised pre-flight instrument check</text>
  <text class="air-traffic-desc air-traffic-row air-traffic-r4" x="526" y="318">This is a CI compliance gate</text>
  <text class="air-traffic-sub" x="30" y="372">The pre-flight checklist is the part that maps most exactly: it is short, it is executed identically every time, and it exists because experienced people under time pressure skip steps they know.</text>
</svg>
