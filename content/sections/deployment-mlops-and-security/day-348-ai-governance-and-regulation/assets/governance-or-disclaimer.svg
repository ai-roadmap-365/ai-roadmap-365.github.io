<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not a footer and a memo.">
  <title>Governance is technical work</title>
  <style>
    .governance-or-disclaimer-bg   { fill: #f8fafc; }
    .governance-or-disclaimer-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-or-disclaimer-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-or-disclaimer-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-or-disclaimer-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-or-disclaimer-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .governance-or-disclaimer-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .governance-or-disclaimer-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .governance-or-disclaimer-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .governance-or-disclaimer-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .governance-or-disclaimer-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .governance-or-disclaimer-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .governance-or-disclaimer-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .governance-or-disclaimer-row { opacity: 1; }
    .governance-or-disclaimer-r0 { animation-delay: 0.00s; }
    .governance-or-disclaimer-r1 { animation-delay: 0.45s; }
    .governance-or-disclaimer-r2 { animation-delay: 0.90s; }
    .governance-or-disclaimer-r3 { animation-delay: 1.35s; }
    .governance-or-disclaimer-r4 { animation-delay: 1.80s; }
    .governance-or-disclaimer-row { animation: governance-or-disclaimer-reveal 7.3s ease-in-out infinite; }
    @keyframes governance-or-disclaimer-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="governance-or-disclaimer-bg" width="980" height="390"/>
  <text class="governance-or-disclaimer-h1"  x="30" y="40">Governance is technical work</text>
  <text class="governance-or-disclaimer-sub" x="30" y="64">Not a footer and a memo.</text>
  <rect class="governance-or-disclaimer-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="governance-or-disclaimer-name" x="46" y="122">Operational</text>
  <text class="governance-or-disclaimer-desc" x="46" y="142">In the pipeline.</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r0" x="46" y="182">Risk tier classified and recorded</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r1" x="46" y="216">Bias metrics computed in CI</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r2" x="46" y="250">Deploys blocked on a failing ratio</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r3" x="46" y="284">Model cards versioned with the weights</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r4" x="46" y="318">Kill switches that someone has tested</text>
  <rect class="governance-or-disclaimer-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="governance-or-disclaimer-name" x="526" y="122">Documentary</text>
  <text class="governance-or-disclaimer-desc" x="526" y="142">In a folder.</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r0" x="526" y="182">A disclaimer in a website footer</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r1" x="526" y="216">A one-time memo from legal</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r2" x="526" y="250">No technical verification in the codebase</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r3" x="526" y="284">Written before the model changed twice</text>
  <text class="governance-or-disclaimer-desc governance-or-disclaimer-row governance-or-disclaimer-r4" x="526" y="318">Accurate on the day it was signed</text>
  <text class="governance-or-disclaimer-sub" x="30" y="372">The distinction matters at audit time: a regulator asking how you know the system is unbiased is asking for a measurement, and a policy document is an answer to a different question.</text>
</svg>
