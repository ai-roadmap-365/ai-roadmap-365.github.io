<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="EU AI Act Risk Classification Pyramid">
  <title>EU AI Act Risk Classification Pyramid</title>
  <defs>
    <style>
      .d348a-bg { fill: #f8fafc; }
      .d348a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d348a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d348a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d348a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d348a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d348a-bg" />
  
  <text x="40" y="40" class="d348a-title">EU AI Act Risk Classification Framework</text>
  <text x="40" y="65" class="d348a-subtitle">EU AI Act Risk Classification Pyramid showing Unacceptable Risk (Banned), High Risk (Strict Obligations), GPAI / Specific Transparency Risk, and Minimal Risk (No Obligations)</text>
  
  <!-- Tier 1: Unacceptable Risk -->
  <rect x="250" y="100" width="400" height="55" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6" />
  <text x="270" y="125" class="d348a-header" fill="#b91c1c">1. Unacceptable Risk (STRICTLY PROHIBITED)</text>
  <text x="270" y="145" class="d348a-text">Social scoring, biometric categorization, subliminal manipulation</text>
  
  <!-- Tier 2: High Risk -->
  <rect x="190" y="165" width="520" height="65" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="6" />
  <text x="210" y="190" class="d348a-header" fill="#c2410c">2. High Risk (STRICT MANDATORY CONFORMITY)</text>
  <text x="210" y="210" class="d348a-text">Recruitment CV filters, credit scoring, medical devices, critical infra</text>
  <text x="210" y="225" class="d348a-text" font-weight="600">Requires: Risk Mgmt, Bias Audits, Human Oversight, CE Mark</text>
  
  <!-- Tier 3: Specific Transparency / GPAI -->
  <rect x="130" y="240" width="640" height="65" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6" />
  <text x="150" y="265" class="d348a-header" fill="#1d4ed8">3. GPAI &amp; Specific Transparency Risk</text>
  <text x="150" y="285" class="d348a-text">Chatbots, deepfakes, emotion recognition, GPAI foundation models (&gt;10^25 FLOPs)</text>
  <text x="150" y="300" class="d348a-text" font-weight="600">Requires: AI Disclosure Labeling, Copyright Policy, Red Teaming</text>
  
  <!-- Tier 4: Minimal Risk -->
  <rect x="70" y="315" width="760" height="55" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="6" />
  <text x="90" y="340" class="d348a-header" fill="#15803d">4. Minimal / No Risk (PERMITTED WITHOUT OBLIGATION)</text>
  <text x="90" y="360" class="d348a-text">AI spam filters, video game NPC AI, inventory optimization (Voluntary Codes of Conduct)</text>
</svg>