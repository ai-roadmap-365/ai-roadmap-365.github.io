<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="NIST AI RMF Governance Lifecycle Flow">
  <title>NIST AI RMF Governance Lifecycle Flow</title>
  <defs>
    <style>
      .d348b-bg { fill: #f8fafc; }
      .d348b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d348b-gov { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d348b-map { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d348b-msr { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d348b-mng { fill: #fff7ed; stroke: #f97316; stroke-width: 2px; rx: 8px; }
      .d348b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d348b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d348b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d348b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d348b-bg" />
  
  <text x="40" y="40" class="d348a-title">NIST AI Risk Management Framework (AI RMF 1.0)</text>
  <text x="40" y="65" class="d348a-subtitle">NIST AI RMF Governance Lifecycle Flow showing the continuous interaction between GOVERN, MAP, MEASURE, and MANAGE core functions</text>
  
  <!-- GOVERN -->
  <rect x="40" y="110" width="190" height="270" class="d348b-gov" />
  <text x="55" y="145" class="d348b-header" fill="#7e22ce">1. GOVERN</text>
  <text x="55" y="180" class="d348b-text">• Risk culture &amp; policies</text>
  <text x="55" y="205" class="d348b-text">• Legal compliance team</text>
  <text x="55" y="230" class="d348b-text">• Accountability matrix</text>
  <text x="55" y="255" class="d348b-text">• Third-party AI audits</text>
  <text x="55" y="295" class="d348b-text" font-weight="600" fill="#7e22ce">Cross-Cutting Core</text>
  <text x="55" y="320" class="d348b-text">Informs all functions</text>
  
  <!-- MAP -->
  <rect x="250" y="110" width="190" height="270" class="d348b-map" />
  <text x="265" y="145" class="d348b-header" fill="#1d4ed8">2. MAP</text>
  <text x="265" y="180" class="d348b-text">• Context &amp; intended use</text>
  <text x="265" y="205" class="d348b-text">• Stakeholder mapping</text>
  <text x="265" y="230" class="d348b-text">• System categorization</text>
  <text x="265" y="255" class="d348b-text">• Negative impacts</text>
  <text x="265" y="295" class="d348b-text" font-weight="600" fill="#1d4ed8">Context Discovery</text>
  <text x="265" y="320" class="d348b-text">Identifies risk scope</text>
  
  <!-- MEASURE -->
  <rect x="460" y="110" width="190" height="270" class="d348b-msr" />
  <text x="475" y="145" class="d348b-header" fill="#15803d">3. MEASURE</text>
  <text x="475" y="180" class="d348b-text">• Bias &amp; fairness metrics</text>
  <text x="475" y="205" class="d348b-text">• Robustness &amp; jailbreaks</text>
  <text x="475" y="230" class="d348b-text">• Differential privacy</text>
  <text x="475" y="255" class="d348b-text">• Model evaluation tests</text>
  <text x="475" y="295" class="d348b-text" font-weight="600" fill="#15803d">Quantitative Metrics</text>
  <text x="475" y="320" class="d348b-text">Tracks compliance data</text>
  
  <!-- MANAGE -->
  <rect x="670" y="110" width="190" height="270" class="d348b-mng" />
  <text x="685" y="145" class="d348b-header" fill="#c2410c">4. MANAGE</text>
  <text x="685" y="180" class="d348b-text">• Prioritize risk backlog</text>
  <text x="685" y="205" class="d348b-text">• Deploy guardrails &amp; WAF</text>
  <text x="685" y="230" class="d348b-text">• Circuit breaker policies</text>
  <text x="685" y="255" class="d348b-text">• Post-market telemetry</text>
  <text x="685" y="295" class="d348b-text" font-weight="600" fill="#c2410c">Mitigation &amp; Control</text>
  <text x="685" y="320" class="d348b-text">Continuous response</text>
</svg>