  compliance auditing pipeline in Python.'
objectives:
- Classify AI systems into the 4 risk tiers of the European Union AI Act (Unacceptable Risk, High Risk,
  General Purpose AI, Minimal Risk).
- 'Operationalize the 4 core functions of the NIST AI Risk Management Framework (NIST AI RMF 1.0: GOVERN,
  MAP, MEASURE, MANAGE).'
- Structure ISO/IEC 42001 compliant AI Management System (AIMS) policies and Algorithmic Impact Assessments.
- Generate standardized, verifiable Model Cards and Conformity Assessment documentation.
- Build an Automated AI Governance & Compliance Validator in Python that enforces regulatory requirements
  in CI/CD pipelines.
