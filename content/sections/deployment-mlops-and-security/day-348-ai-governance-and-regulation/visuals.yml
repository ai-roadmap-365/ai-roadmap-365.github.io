visuals:
- id: eu-ai-act-risk-classification-pyramid
  file: assets/eu-ai-act-risk-classification-pyramid.svg
  type: diagram
  title: EU AI Act Risk Classification Pyramid
  alt: EU AI Act Risk Classification Pyramid showing Unacceptable Risk (Banned), High Risk (Strict Obligations),
    GPAI / Specific Transparency Risk, and Minimal Risk (No Obligations)
  description: Pyramid diagram illustrating the 4 risk tiers of the EU AI Act.
- id: nist-ai-rmf-governance-lifecycle-flow
  file: assets/nist-ai-rmf-governance-lifecycle-flow.svg
  type: diagram
  title: NIST AI RMF Governance Lifecycle Flow
  alt: NIST AI RMF Governance Lifecycle Flow showing the continuous interaction between GOVERN, MAP, MEASURE,
    and MANAGE core functions
  description: Circular lifecycle diagram illustrating the NIST AI RMF framework.
- id: risk-tiers
  file: assets/risk-tiers.svg
  type: diagram
  title: 'Four risk tiers'
  alt: 'Diagram: the four EU AI Act risk tiers and the obligations of each'
  description: 'A four-stage description of the EU AI Act risk classification from prohibited practices through high-risk obligations to minimal risk.'
- id: governance-or-disclaimer
  file: assets/governance-or-disclaimer.svg
  type: diagram
  title: 'Governance is technical work'
  alt: 'Diagram: operational AI governance compared with documentary compliance'
  description: 'A two-column comparison of governance implemented as engineering controls against governance as legal documentation.'
- id: governance-eras
  file: assets/governance-eras.svg
  type: diagram
  title: 'Three regulatory milestones'
  alt: 'Diagram: the progression from voluntary AI principles to the EU AI Act'
  description: 'A three-stage progression of AI governance from voluntary ethical principles through NIST and ISO frameworks to binding regulation.'
- id: nist-functions
  file: assets/nist-functions.svg
  type: diagram
  title: 'The four NIST functions'
  alt: 'Diagram: the four core functions of the NIST AI Risk Management Framework'
  description: 'A two-column comparison of the NIST AI RMF governing function against the map, measure and manage cycle.'
- id: four-fifths
  file: assets/four-fifths.svg
  type: diagram
  title: 'The four-fifths rule'
  alt: 'Diagram: how the four-fifths rule computes disparate impact'
  description: 'A four-stage description of the four-fifths rule covering selection rates, the ratio, the 0.80 threshold and what a failing ratio means.'
- id: air-traffic
  file: assets/air-traffic.svg
  type: diagram
  title: 'An unregulated sky'
  alt: 'Diagram: uncontrolled flight compared with regulated aviation, as a governance analogy'
  description: 'A two-column comparison of unregulated flying against aviation regulation, standards and pre-flight verification.'
- id: high-risk-dossier
  file: assets/high-risk-dossier.svg
  type: diagram
  title: 'What a high-risk dossier contains'
  alt: 'Diagram: the four documentation requirements for a high-risk AI system'
  description: 'A four-stage description of EU AI Act conformity requirements covering risk management, data governance, technical records and human oversight.'
- id: governance-hazards
  file: assets/governance-hazards.svg
  type: diagram
  title: 'Four governance failures'
  alt: 'Diagram: the four failure modes of AI governance'
  description: 'A four-stage description of governance failure modes covering misclassified risk tier, untested bias, unreachable oversight and stale model cards.'
- id: compliance-cost
  file: assets/compliance-cost.svg
  type: diagram
  title: 'The cost of governance'
  alt: 'Diagram: the engineering cost of automated governance compared with the cost of non-compliance'
  description: 'A two-column comparison of the cost of building automated governance pipelines against the cost of regulatory non-compliance.'
- id: governance-when
  file: assets/governance-when.svg
  type: diagram
  title: 'Where governance is mandatory'
  alt: 'Diagram: when full AI governance is required and where it is voluntary'
  description: 'A two-column comparison of systems requiring full governance and model cards against internal prototypes.'
