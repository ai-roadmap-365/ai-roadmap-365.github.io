questions:
- question: Under the European Union AI Act, which category of AI systems is strictly prohibited (Unacceptable
    Risk)?
  options:
  - 'Manipulation, social scoring, and untargeted scraping'
  - E-commerce recommendation algorithms
  - Customer support chatbots
  - Spam email filters
  answer_index: 0
  explanation: The EU AI Act strictly bans unacceptable risk systems that manipulate human behavior or
    perform mass biometric mass surveillance.
- question: What are the four core operational functions defined in the NIST AI Risk Management Framework
    (AI RMF 1.0)?
  options:
  - Buy, Build, Sell, Deprecate
  - 'Govern, map, measure, and manage'
  - Prompt, Generate, Evaluate, Bill
  - Docker, Kubernetes, Prometheus, Grafana
  answer_index: 1
  explanation: NIST AI RMF structures enterprise AI risk across GOVERN, MAP, MEASURE, and MANAGE.
- question: What must a provider of a 'High-Risk AI System' (e.g. CV screening for employment, credit
    scoring) establish before deploying in the EU?
  options:
  - A social media marketing campaign
  - Nothing; all AI is unregulated
  - 'Risk management, clean data, docs, logging, oversight'
  - A minimum of 10,000 GPUs
  answer_index: 2
  explanation: High-risk AI systems must meet stringent conformity, data governance, logging, and human
    oversight obligations.
- question: What is an 'AI Model Card' as popularized by Mitchell et al.?
  options:
  - A trading card featuring famous computer scientists
  - A software license key
  - A receipt for cloud GPU compute
  - 'A standard document of use, limits, and performance'
  answer_index: 3
  explanation: Model cards provide standardized transparency regarding intended usage, evaluation benchmarks,
    and limitations.
- question: How does ISO/IEC 42001 define an AI Management System (AIMS)?
  options:
  - 'A standard for AI governance and risk processes'
  - A piece of software that auto-generates Python code
  - A hardware rack design for NVIDIA H100 servers
  - A database schema for storing vector embeddings
  answer_index: 0
  explanation: ISO/IEC 42001 provides the global certifiable standard for AI organizational governance.
