terms:
- term: EU AI Act
  definition: The European Union's comprehensive risk-based regulatory framework for artificial intelligence.
- term: NIST AI RMF 1.0
  definition: 'National Institute of Standards and Technology framework: Govern, Map, Measure, Manage.'
- term: High-Risk AI System
  definition: An AI application affecting health, safety, fundamental rights, employment, or credit scoring.
- term: GPAI with Systemic Risk
  definition: General-purpose AI models trained with over 10^25 FLOPs requiring red-teaming and risk assessments.
- term: ISO/IEC 42001
  definition: The international standard specifying requirements for an Artificial Intelligence Management
    System (AIMS).
- term: Model Card
  definition: A standardized document detailing model architecture, performance, bias evaluations, and
    intended uses.
- term: Conformity Assessment
  definition: The formal verification process ensuring an AI system complies with legal regulations prior
    to market entry.
- term: Human Oversight
  definition: Architectural mechanisms enabling human operators to intervene, override, or halt autonomous
    AI decisions.
