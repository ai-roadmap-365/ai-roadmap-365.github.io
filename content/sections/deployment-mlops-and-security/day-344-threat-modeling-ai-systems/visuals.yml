visuals:
- id: stride-ai-threat-matrix-and-trust-boundaries
  file: assets/stride-ai-threat-matrix-and-trust-boundaries.svg
  type: diagram
  title: STRIDE AI Threat Matrix and Trust Boundaries
  alt: STRIDE AI Threat Matrix and Trust Boundaries showing Untrusted Ingress Domain, AI Gateway Trust
    Boundary, Agent Tool Execution Sandbox, and Backend Enterprise Data Stores with STRIDE Threat Classification
  description: System architecture diagram illustrating trust boundaries and STRIDE threat classification
    across AI pipelines.
- id: hierarchical-ai-attack-tree-and-dread-scoring
  file: assets/hierarchical-ai-attack-tree-and-dread-scoring.svg
  type: diagram
  title: Hierarchical AI Attack Tree and DREAD Scoring
  alt: Hierarchical AI Attack Tree and DREAD Scoring decomposing an Adversarial Goal into Indirect Injection,
    Tool Poisoning, and Exfiltration paths with quantitative DREAD Risk Heatmap
  description: Security tree diagram illustrating attack path decomposition and DREAD risk quantification.
- id: stride-for-ai
  file: assets/stride-for-ai.svg
  type: diagram
  title: 'Threat modelling, in four steps'
  alt: 'Diagram: the four steps of threat modelling an AI system'
  description: 'A four-stage description of AI threat modelling covering trust boundaries, STRIDE classification, attack trees and DREAD scoring.'
- id: prompt-is-not-a-boundary
  file: assets/prompt-is-not-a-boundary.svg
  type: diagram
  title: 'The system prompt is not a control'
  alt: 'Diagram: a system prompt compared with an architectural trust boundary'
  description: 'A two-column comparison of relying on system-prompt instructions against enforcing an architectural boundary outside the model.'
- id: threat-model-eras
  file: assets/threat-model-eras.svg
  type: diagram
  title: 'Three paradigms of threat modelling'
  alt: 'Diagram: the progression from STRIDE to the OWASP Top 10 for LLM applications'
  description: 'A three-stage progression of threat modelling from classic STRIDE through cloud and microservice boundaries to generative AI and agent threats.'
- id: not-a-checkbox
  file: assets/not-a-checkbox.svg
  type: diagram
  title: 'Two misconceptions'
  alt: 'Diagram: what AI threat modelling is compared with two ways of getting it wrong'
  description: 'A two-column comparison of continuous architectural threat modelling against prompt-based assurance and one-time pre-launch review.'
- id: dread-scoring
  file: assets/dread-scoring.svg
  type: diagram
  title: 'How DREAD ranks a backlog'
  alt: 'Diagram: the five DREAD factors and how they produce a priority'
  description: 'A five-stage description of DREAD scoring covering damage, reproducibility, exploitability, affected users and discoverability.'
- id: indirect-injection-path
  file: assets/indirect-injection-path.svg
  type: diagram
  title: 'The indirect injection path'
  alt: 'Diagram: how an instruction in a third-party document reaches an agent''s tools'
  description: 'A four-stage description of an indirect prompt injection travelling from an external document through retrieval into an agent''s tool call.'
- id: cockpit-analogy
  file: assets/cockpit-analogy.svg
  type: diagram
  title: 'The reinforced cockpit door'
  alt: 'Diagram: relying on instructions compared with an architectural barrier, in a cockpit'
  description: 'A two-column comparison of trusting verbal commands against installing a physical barrier and requiring multi-party authorisation.'
- id: dual-llm
  file: assets/dual-llm.svg
  type: diagram
  title: 'Dual-LLM quarantine'
  alt: 'Diagram: how a quarantined model extracts structured data for a trusted controller'
  description: 'A four-stage description of dual-LLM sandboxing covering the quarantine worker, its lack of capability, the typed payload, and the trusted controller.'
- id: sandbox-cost
  file: assets/sandbox-cost.svg
  type: diagram
  title: 'What the sandbox costs'
  alt: 'Diagram: the latency and token cost of dual-LLM quarantine against the risk it removes'
  description: 'A two-column comparison of the measured overhead of dual-LLM sandboxing against the attack surface it eliminates.'
- id: threat-implications
  file: assets/threat-implications.svg
  type: diagram
  title: 'Four consequences of taking this seriously'
  alt: 'Diagram: the security, operational, cost and process implications of AI threat modelling'
  description: 'A four-stage description of threat-modelling implications covering least-privilege tools, continuous re-evaluation, sandbox overhead and backlog prioritisation.'
- id: model-or-redteam
  file: assets/model-or-redteam.svg
  type: diagram
  title: 'Threat model or red team'
  alt: 'Diagram: architectural threat modelling compared with automated red teaming'
  description: 'A two-column comparison of threat modelling against red-team tooling by what each finds and when each applies.'
- id: threat-model-when
  file: assets/threat-model-when.svg
  type: diagram
  title: 'When to threat model'
  alt: 'Diagram: when formal AI threat modelling is warranted and what triggers a re-run'
  description: 'A two-column comparison of systems requiring formal threat modelling against those that do not, with the events that trigger re-evaluation.'
