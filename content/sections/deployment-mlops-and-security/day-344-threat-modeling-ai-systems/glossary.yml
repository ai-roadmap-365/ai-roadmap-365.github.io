terms:
- term: STRIDE for AI
  definition: 'A structured methodology classifying threats: Spoofing, Tampering, Repudiation, Info Disclosure,
    DoS, Elevation.'
- term: OWASP Top 10 for LLMs
  definition: The industry-standard consensus list of the most critical security vulnerabilities in LLM
    applications.
- term: DREAD Scoring
  definition: A quantitative risk assessment model evaluating Damage, Reproducibility, Exploitability,
    Affected Users, Discoverability.
- term: Attack Tree
  definition: A tree diagram representing hierarchical paths and conditions an adversary uses to exploit
    a system.
- term: Trust Boundary
  definition: A perimeter separating system components of differing trust levels, requiring validation
    upon crossing.
- term: Indirect Prompt Injection
  definition: Exploiting an LLM via untrusted external third-party data (web pages, PDFs, emails) ingested
    at runtime.
- term: Token Depletion Attack
  definition: An adversarial exploit flooding an AI service with complex computations to exhaust API budgets
    or compute.
- term: Insecure Output Handling
  definition: Passing raw LLM generations directly into downstream parsers, SQL interpreters, or shells
    without sanitization.
