questions:
- question: How is the traditional STRIDE security framework (Spoofing, Tampering, Repudiation, Information
    Disclosure, Denial of Service, Elevation of Privilege) adapted for Generative AI applications?
  options:
  - It is completely discarded and replaced with random guessing
  - STRIDE only applies to desktop video games
  - 'It maps each STRIDE category onto AI-specific attacks'
  - STRIDE is only used for hardware CPU design
  answer_index: 2
  explanation: STRIDE for AI systematically categorizes vulnerabilities across agent identities, RAG data
    integrity, prompt extraction, and tool execution privileges.
- question: What is the primary risk identified in OWASP LLM01 (Prompt Injection)?
  options:
  - 'The model running out of electricity mid-request'
  - Typing in lowercase letters
  - The prompt being too short
  - 'Untrusted input bending the model''s instructions'
  answer_index: 3
  explanation: OWASP LLM01 occurs when untrusted input hijacks the LLM's operational control flow.
- question: In DREAD risk scoring (Damage, Reproducibility, Exploitability, Affected Users, Discoverability),
    what does a high score indicate?
  options:
  - 'An urgent risk to fix before deployment'
  - The system is 100% secure
  - 'The model is simply running at high speed'
  - The server needs more RAM
  answer_index: 0
  explanation: DREAD calculates composite risk severity; higher scores demand immediate remediation priority.
- question: What is a 'Trust Boundary' in an AI agent architecture?
  options:
  - A fence around the datacenter
  - 'The line between untrusted data and trusted execution'
  - The boundary between CPU and RAM
  - A legal nondisclosure agreement
  answer_index: 1
  explanation: Trust boundaries isolate unverified inputs from sensitive credentials and internal execution
    backends.
- question: What is an 'AI Attack Tree'?
  options:
  - A tree planted near the server room
  - A binary search algorithm
  - 'A diagram decomposing a goal into exploit paths'
  - A Python decision tree classifier
  answer_index: 2
  explanation: Attack trees break down adversarial objectives into actionable, structured technical attack
    paths.
