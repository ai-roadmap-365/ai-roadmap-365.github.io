learning_promise: 'Master systematic AI threat modeling: apply STRIDE for AI, map attack surfaces across
  OWASP Top 10 for LLMs, construct formal attack trees, and quantify threat risks using DREAD scoring
  in Python.'
objectives:
- Deconstruct the STRIDE threat modeling framework adapted specifically for machine learning and LLM agent
  architectures.
- Map the 10 vulnerabilities of the OWASP Top 10 for LLM Applications (Prompt Injection, Insecure Output
  Handling, Vector Denial of Service, Model Denial of Service).
- Construct hierarchical Attack Trees quantifying exploit paths, attacker skill requirements, and business
  financial impact.
- Build an AI Threat Modeling & DREAD Risk Scorer in Python calculating composite risk priorities and
  automated remediation action plans.
- 'Evaluate threat mitigation perimeters: defining trust boundaries between untrusted user prompts, tool
  calling sandboxes, and enterprise databases.'
