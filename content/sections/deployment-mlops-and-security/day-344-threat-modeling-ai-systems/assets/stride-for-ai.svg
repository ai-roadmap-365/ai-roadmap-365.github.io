<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From boundaries to a ranked backlog.">
  <title>Threat modelling, in four steps</title>
  <style>
    .stride-for-ai-bg   { fill: #f8fafc; }
    .stride-for-ai-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stride-for-ai-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stride-for-ai-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stride-for-ai-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stride-for-ai-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stride-for-ai-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .stride-for-ai-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .stride-for-ai-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .stride-for-ai-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .stride-for-ai-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .stride-for-ai-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .stride-for-ai-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .stride-for-ai-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .stride-for-ai-stage { opacity: 1; }

    .stride-for-ai-s0 { animation-delay: 0.00s; }
    .stride-for-ai-e0 { animation-delay: 0.00s; }
    .stride-for-ai-s1 { animation-delay: 1.28s; }
    .stride-for-ai-e1 { animation-delay: 1.28s; }
    .stride-for-ai-s2 { animation-delay: 2.56s; }
    .stride-for-ai-e2 { animation-delay: 2.56s; }
    .stride-for-ai-s3 { animation-delay: 3.84s; }
    .stride-for-ai-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .stride-for-ai-conn  { animation: stride-for-ai-trace 6.4s ease-in-out infinite; }
      .stride-for-ai-stage { animation: stride-for-ai-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes stride-for-ai-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes stride-for-ai-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .stride-for-ai-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .stride-for-ai-stage { animation: stride-for-ai-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes stride-for-ai-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="stride-for-ai-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="stride-for-ai-bg" width="980" height="322"/>
  <text class="stride-for-ai-h1"  x="30" y="40">Threat modelling, in four steps</text>
  <text class="stride-for-ai-sub" x="30" y="64">From boundaries to a ranked backlog.</text>
  <g class="stride-for-ai-stage stride-for-ai-s0">
    <rect class="stride-for-ai-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="stride-for-ai-step" x="44" y="142">01</text>
    <text class="stride-for-ai-name" x="70" y="142">Draw the trust boundaries</text>
    <text class="stride-for-ai-desc" x="44" y="166">Where untrusted data meets</text>
    <text class="stride-for-ai-desc" x="44" y="182">privileged capability. Usually</text>
    <text class="stride-for-ai-desc" x="44" y="198">the agent's tools.</text>
    <text class="stride-for-ai-edge" x="44" y="242">the map</text>
  </g>
  <line class="stride-for-ai-line stride-for-ai-conn stride-for-ai-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#stride-for-ai-tip)"/>
  <g class="stride-for-ai-stage stride-for-ai-s1">
    <rect class="stride-for-ai-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="stride-for-ai-step" x="280" y="142">02</text>
    <text class="stride-for-ai-name" x="306" y="142">Classify with STRIDE</text>
    <text class="stride-for-ai-desc" x="280" y="166">Spoofing, tampering,</text>
    <text class="stride-for-ai-desc" x="280" y="182">repudiation, disclosure, denial</text>
    <text class="stride-for-ai-desc" x="280" y="198">of service, elevation.</text>
  </g>
  <line class="stride-for-ai-line stride-for-ai-conn stride-for-ai-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#stride-for-ai-tip)"/>
  <g class="stride-for-ai-stage stride-for-ai-s2">
    <rect class="stride-for-ai-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="stride-for-ai-step" x="516" y="142">03</text>
    <text class="stride-for-ai-name" x="542" y="142">Build attack trees</text>
    <text class="stride-for-ai-desc" x="516" y="166">Decompose a goal into concrete</text>
    <text class="stride-for-ai-desc" x="516" y="182">exploit paths a person could</text>
    <text class="stride-for-ai-desc" x="516" y="198">actually take.</text>
  </g>
  <line class="stride-for-ai-line stride-for-ai-conn stride-for-ai-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#stride-for-ai-tip)"/>
  <g class="stride-for-ai-stage stride-for-ai-s3">
    <rect class="stride-for-ai-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="stride-for-ai-step" x="752" y="142">04</text>
    <text class="stride-for-ai-name" x="778" y="142">Score with DREAD</text>
    <text class="stride-for-ai-desc" x="752" y="166">Damage, reproducibility,</text>
    <text class="stride-for-ai-desc" x="752" y="182">exploitability, affected users,</text>
    <text class="stride-for-ai-desc" x="752" y="198">discoverability.</text>
    <text class="stride-for-ai-edge" x="752" y="242">ranked</text>
  </g>
  <text class="stride-for-ai-sub" x="30" y="304">The first step does most of the work: almost every AI-specific threat in this lesson is a boundary that was never drawn, between text somebody else wrote and an action your system can take.</text>
</svg>
