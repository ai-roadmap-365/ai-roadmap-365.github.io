<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="STRIDE AI Threat Matrix and Trust Boundaries">
  <title>STRIDE AI Threat Matrix and Trust Boundaries</title>
  <defs>
    <style>
      .d344a-bg { fill: #f8fafc; }
      .d344a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d344a-unt { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d344a-gtw { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d344a-sec { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d344a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d344a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d344a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d344a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d344a-bg" />
  
  <text x="40" y="40" class="d344a-title">STRIDE for AI &amp; Architectural Trust Boundaries</text>
  <text x="40" y="65" class="d344a-subtitle">STRIDE AI Threat Matrix and Trust Boundaries showing Untrusted Ingress Domain, AI Gateway Trust Boundary, Agent Tool Execution Sandbox, and Backend Enterprise Data Stores with STRIDE Threat Classification</text>
  
  <!-- Untrusted Domain -->
  <rect x="40" y="110" width="240" height="270" class="d344a-unt" />
  <text x="55" y="145" class="d344a-header" fill="#b91c1c">1. Untrusted Ingress Zone</text>
  <text x="55" y="180" class="d344a-text">• User Prompts (Direct Injection)</text>
  <text x="55" y="205" class="d344a-text">• Web Crawls (Indirect Injection)</text>
  <text x="55" y="230" class="d344a-text">• Document Uploads (Poisoning)</text>
  <text x="55" y="255" class="d344a-text">• Untrusted Third-Party APIs</text>
  <text x="55" y="295" class="d344a-text" font-weight="600" fill="#b91c1c">Threats: T, I, D</text>
  <text x="55" y="320" class="d344a-text">Tampering, Info Leak, DoS</text>
  
  <!-- Trust Boundary & Gateway -->
  <rect x="315" y="110" width="240" height="270" class="d344a-gtw" />
  <text x="330" y="145" class="d344a-header" fill="#1d4ed8">2. AI Gateway Perimeter</text>
  <text x="330" y="180" class="d344a-text">• Strict Schema Validation</text>
  <text x="330" y="205" class="d344a-text">• Dual-LLM Sandboxing</text>
  <text x="330" y="230" class="d344a-text">• In-Memory PII Scrubber</text>
  <text x="330" y="255" class="d344a-text">• Rate &amp; Token Limiting</text>
  <text x="330" y="295" class="d344a-text" font-weight="600" fill="#1d4ed8">Trust Boundary 1</text>
  <text x="330" y="320" class="d344a-text">Sanitizes untrusted payloads</text>
  
  <!-- Secure Agent Sandbox -->
  <rect x="590" y="110" width="270" height="270" class="d344a-sec" />
  <text x="605" y="145" class="d344a-header" fill="#7e22ce">3. Isolated Backend &amp; DB</text>
  <text x="605" y="180" class="d344a-text">• Sandboxed Tool Execution</text>
  <text x="605" y="205" class="d344a-text">• Least-Privilege IAM Roles</text>
  <text x="605" y="230" class="d344a-text">• Read-Only DB Connections</text>
  <text x="605" y="255" class="d344a-text">• Human-in-the-Loop Auth</text>
  <text x="605" y="295" class="d344a-text" font-weight="600" fill="#7e22ce">Threats: S, E (Mitigated)</text>
  <text x="605" y="320" class="d344a-text">Zero unauthorized privilege escalation</text>
</svg>