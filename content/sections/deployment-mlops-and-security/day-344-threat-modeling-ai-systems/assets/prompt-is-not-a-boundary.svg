<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="It is a request, in the same channel.">
  <title>The system prompt is not a control</title>
  <style>
    .prompt-is-not-a-boundary-bg   { fill: #f8fafc; }
    .prompt-is-not-a-boundary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-is-not-a-boundary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-is-not-a-boundary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-is-not-a-boundary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-is-not-a-boundary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .prompt-is-not-a-boundary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-is-not-a-boundary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .prompt-is-not-a-boundary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .prompt-is-not-a-boundary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .prompt-is-not-a-boundary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .prompt-is-not-a-boundary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .prompt-is-not-a-boundary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .prompt-is-not-a-boundary-row { opacity: 1; }
    .prompt-is-not-a-boundary-r0 { animation-delay: 0.00s; }
    .prompt-is-not-a-boundary-r1 { animation-delay: 0.45s; }
    .prompt-is-not-a-boundary-r2 { animation-delay: 0.90s; }
    .prompt-is-not-a-boundary-r3 { animation-delay: 1.35s; }
    .prompt-is-not-a-boundary-r4 { animation-delay: 1.80s; }
    .prompt-is-not-a-boundary-row { animation: prompt-is-not-a-boundary-reveal 7.3s ease-in-out infinite; }
    @keyframes prompt-is-not-a-boundary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="prompt-is-not-a-boundary-bg" width="980" height="390"/>
  <text class="prompt-is-not-a-boundary-h1"  x="30" y="40">The system prompt is not a control</text>
  <text class="prompt-is-not-a-boundary-sub" x="30" y="64">It is a request, in the same channel.</text>
  <rect class="prompt-is-not-a-boundary-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-is-not-a-boundary-name" x="46" y="122">"Never reveal secrets"</text>
  <text class="prompt-is-not-a-boundary-desc" x="46" y="142">A request.</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r0" x="46" y="182">Written in the same channel as the attack</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r1" x="46" y="216">The model cannot distinguish the two</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r2" x="46" y="250">Probabilistic, not enforced</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r3" x="46" y="284">Defeated by phrasings you did not anticipate</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r4" x="46" y="318">And you will not know when it fails</text>
  <rect class="prompt-is-not-a-boundary-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="prompt-is-not-a-boundary-name" x="526" y="122">An architectural boundary</text>
  <text class="prompt-is-not-a-boundary-desc" x="526" y="142">A control.</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r0" x="526" y="182">The secret is not in the context at all</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r1" x="526" y="216">The tool cannot perform the action</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r2" x="526" y="250">Parameterised calls, not composed ones</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r3" x="526" y="284">Deterministic, and testable</text>
  <text class="prompt-is-not-a-boundary-desc prompt-is-not-a-boundary-row prompt-is-not-a-boundary-r4" x="526" y="318">Fails closed, and loudly</text>
  <text class="prompt-is-not-a-boundary-sub" x="30" y="372">Day 361 reached the same conclusion and this lesson formalises it: the mitigation for prompt injection is the permission model, because the prompt is on the wrong side of the boundary to enforce anything.</text>
</svg>
