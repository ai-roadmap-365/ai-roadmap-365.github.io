<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Not a rule about who may shout.">
  <title>The reinforced cockpit door</title>
  <style>
    .cockpit-analogy-bg   { fill: #f8fafc; }
    .cockpit-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cockpit-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cockpit-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cockpit-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cockpit-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cockpit-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cockpit-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cockpit-analogy-row { opacity: 1; }
    .cockpit-analogy-r0 { animation-delay: 0.00s; }
    .cockpit-analogy-r1 { animation-delay: 0.45s; }
    .cockpit-analogy-r2 { animation-delay: 0.90s; }
    .cockpit-analogy-r3 { animation-delay: 1.35s; }
    .cockpit-analogy-r4 { animation-delay: 1.80s; }
    .cockpit-analogy-row { animation: cockpit-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes cockpit-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="cockpit-analogy-bg" width="980" height="390"/>
  <text class="cockpit-analogy-h1"  x="30" y="40">The reinforced cockpit door</text>
  <text class="cockpit-analogy-sub" x="30" y="64">Not a rule about who may shout.</text>
  <rect class="cockpit-analogy-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-analogy-name" x="46" y="122">Trusting the intercom</text>
  <text class="cockpit-analogy-desc" x="46" y="142">Anyone can issue orders.</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r0" x="46" y="182">The cockpit door is unlocked</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r1" x="46" y="216">Passengers can shout instructions</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r2" x="46" y="250">The rule is "do not listen to passengers"</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r3" x="46" y="284">Which depends on the pilot judging correctly</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r4" x="46" y="318">Every time, under pressure</text>
  <rect class="cockpit-analogy-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="cockpit-analogy-name" x="526" y="122">A reinforced door</text>
  <text class="cockpit-analogy-desc" x="526" y="142">A structural boundary.</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r0" x="526" y="182">Bulletproof, locked, architectural</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r1" x="526" y="216">Nobody has to judge anything</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r2" x="526" y="250">And a flight-plan change needs ATC confirmation</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r3" x="526" y="284">Defence in depth: two independent controls</text>
  <text class="cockpit-analogy-desc cockpit-analogy-row cockpit-analogy-r4" x="526" y="318">Neither depends on persuasion</text>
  <text class="cockpit-analogy-sub" x="30" y="372">The second control on the right is the one worth copying into agents: even if something does reach the pilot, the consequential action needs a second party, which is exactly what human-in-the-loop confirmation buys.</text>
</svg>
