<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And the trigger for re-running it.">
  <title>When to threat model</title>
  <style>
    .threat-model-when-bg   { fill: #f8fafc; }
    .threat-model-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .threat-model-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threat-model-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .threat-model-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .threat-model-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .threat-model-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .threat-model-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .threat-model-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .threat-model-when-row { opacity: 1; }
    .threat-model-when-r0 { animation-delay: 0.00s; }
    .threat-model-when-r1 { animation-delay: 0.45s; }
    .threat-model-when-r2 { animation-delay: 0.90s; }
    .threat-model-when-r3 { animation-delay: 1.35s; }
    .threat-model-when-r4 { animation-delay: 1.80s; }
    .threat-model-when-row { animation: threat-model-when-reveal 7.3s ease-in-out infinite; }
    @keyframes threat-model-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="threat-model-when-bg" width="980" height="390"/>
  <text class="threat-model-when-h1"  x="30" y="40">When to threat model</text>
  <text class="threat-model-when-sub" x="30" y="64">And the trigger for re-running it.</text>
  <rect class="threat-model-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="threat-model-when-name" x="46" y="122">Model it</text>
  <text class="threat-model-when-desc" x="46" y="142">Anywhere with data or authority.</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r0" x="46" y="182">Enterprise AI systems</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r1" x="46" y="216">Customer-facing LLM endpoints</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r2" x="46" y="250">Autonomous tool-calling agents</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r3" x="46" y="284">Healthcare, banking, anything regulated</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r4" x="46" y="318">Before general availability, not after</text>
  <rect class="threat-model-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="threat-model-when-name" x="526" y="122">Re-run when</text>
  <text class="threat-model-when-desc" x="526" y="142">Three triggers.</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r0" x="526" y="182">A tool is added</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r1" x="526" y="216">A tool's scope widens</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r2" x="526" y="250">A new external data source is connected</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r3" x="526" y="284">Not on a calendar — on these events</text>
  <text class="threat-model-when-desc threat-model-when-row threat-model-when-r4" x="526" y="318">Internal prototypes with no external data: skip</text>
  <text class="threat-model-when-sub" x="30" y="372">Those three triggers cover almost everything that changes an AI system's exposure, which makes them a better schedule than an annual review: the risk moves when the authority moves, not when the year does.</text>
</svg>
