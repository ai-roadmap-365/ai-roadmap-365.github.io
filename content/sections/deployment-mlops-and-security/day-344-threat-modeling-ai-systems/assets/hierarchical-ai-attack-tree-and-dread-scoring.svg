<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Hierarchical AI Attack Tree and DREAD Scoring">
  <title>Hierarchical AI Attack Tree and DREAD Scoring</title>
  <defs>
    <style>
      .d344b-bg { fill: #f8fafc; }
      .d344b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d344b-atk { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d344b-drd { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d344b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d344b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d344b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d344b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d344b-bg" />
  
  <text x="40" y="40" class="d344a-title">AI Attack Tree &amp; DREAD Risk Assessment</text>
  <text x="40" y="65" class="d344a-subtitle">Hierarchical AI Attack Tree and DREAD Scoring decomposing an Adversarial Goal into Indirect Injection, Tool Poisoning, and Exfiltration paths with quantitative DREAD Risk Heatmap</text>
  
  <!-- Attack Tree -->
  <rect x="40" y="110" width="410" height="270" class="d344b-atk" />
  <text x="60" y="145" class="d344b-header" fill="#1d4ed8">Adversarial Goal: Exfiltrate Customer DB</text>
  <text x="60" y="180" class="d344b-text">├── **Path A (Direct Prompt Injection):**</text>
  <text x="60" y="200" class="d344b-text">│    └── Bypass System Prompt ➔ Call `run_sql()`</text>
  <text x="60" y="225" class="d344b-text">├── **Path B (Indirect RAG Poisoning):**</text>
  <text x="60" y="245" class="d344b-text">│    └── Plant hidden payload in uploaded PDF</text>
  <text x="60" y="270" class="d344b-text">└── **Path C (Tool Parameter Tampering):**</text>
  <text x="60" y="290" class="d344b-text">     └── Inject SQL payload into `search_orders()`</text>
  <text x="60" y="325" class="d344b-text" font-weight="600" fill="#1d4ed8">Structured Vulnerability Decomposition</text>
  
  <!-- DREAD Scoring -->
  <rect x="480" y="110" width="380" height="270" class="d344b-drd" />
  <text x="500" y="145" class="d344b-header" fill="#b91c1c">DREAD Quantitative Risk Matrix</text>
  <text x="500" y="180" class="d344b-text">• **Damage (D):** 9/10 (High financial loss)</text>
  <text x="500" y="205" class="d344b-text">• **Reproducibility (R):** 8/10 (Easily scripted)</text>
  <text x="500" y="230" class="d344b-text">• **Exploitability (E):** 7/10 (Low attacker skill)</text>
  <text x="500" y="255" class="d344b-text">• **Affected Users (A):** 10/10 (All customers)</text>
  <text x="500" y="280" class="d344b-text">• **Discoverability (D):** 8/10 (Public API)</text>
  <text x="500" y="320" class="d344b-text" font-weight="600" fill="#b91c1c">Composite Score: 8.4 / 10 (CRITICAL RISK)</text>
</svg>