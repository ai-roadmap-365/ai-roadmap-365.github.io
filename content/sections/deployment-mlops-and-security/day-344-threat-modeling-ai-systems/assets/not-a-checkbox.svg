<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One about prompts, one about timing.">
  <title>Two misconceptions</title>
  <style>
    .not-a-checkbox-bg   { fill: #f8fafc; }
    .not-a-checkbox-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-checkbox-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-checkbox-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-checkbox-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-checkbox-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-checkbox-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-checkbox-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-checkbox-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-checkbox-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-checkbox-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-checkbox-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-checkbox-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-checkbox-row { opacity: 1; }
    .not-a-checkbox-r0 { animation-delay: 0.00s; }
    .not-a-checkbox-r1 { animation-delay: 0.45s; }
    .not-a-checkbox-r2 { animation-delay: 0.90s; }
    .not-a-checkbox-r3 { animation-delay: 1.35s; }
    .not-a-checkbox-r4 { animation-delay: 1.80s; }
    .not-a-checkbox-row { animation: not-a-checkbox-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-checkbox-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-checkbox-bg" width="980" height="390"/>
  <text class="not-a-checkbox-h1"  x="30" y="40">Two misconceptions</text>
  <text class="not-a-checkbox-sub" x="30" y="64">One about prompts, one about timing.</text>
  <rect class="not-a-checkbox-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-checkbox-name" x="46" y="122">What it is</text>
  <text class="not-a-checkbox-desc" x="46" y="142">Architectural and continuous.</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r0" x="46" y="182">Attack vectors across models, stores, pipelines and tools</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r1" x="46" y="216">STRIDE categories against trust boundaries</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r2" x="46" y="250">Attack trees down to concrete exploit paths</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r3" x="46" y="284">DREAD scores that rank a backlog</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r4" x="46" y="318">Re-run whenever authority changes</text>
  <rect class="not-a-checkbox-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-checkbox-name" x="526" y="122">Two misconceptions</text>
  <text class="not-a-checkbox-desc" x="526" y="142">Both very common.</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r0" x="526" y="182">"The safety prompt handles it"</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r1" x="526" y="216">A probabilistic model as a barrier</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r2" x="526" y="250">"We did the security review before launch"</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r3" x="526" y="284">A tool added afterwards changed the model</text>
  <text class="not-a-checkbox-desc not-a-checkbox-row not-a-checkbox-r4" x="526" y="318">And nobody re-ran it</text>
  <text class="not-a-checkbox-sub" x="30" y="372">The second misconception is the more expensive over time: the threat model was accurate on the day it was written, and every tool added since has moved a boundary it describes.</text>
</svg>
