<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five factors, one composite.">
  <title>How DREAD ranks a backlog</title>
  <style>
    .dread-scoring-bg   { fill: #f8fafc; }
    .dread-scoring-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dread-scoring-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dread-scoring-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dread-scoring-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dread-scoring-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dread-scoring-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .dread-scoring-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .dread-scoring-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .dread-scoring-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .dread-scoring-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .dread-scoring-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .dread-scoring-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .dread-scoring-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .dread-scoring-stage { opacity: 1; }

    .dread-scoring-s0 { animation-delay: 0.00s; }
    .dread-scoring-e0 { animation-delay: 0.00s; }
    .dread-scoring-s1 { animation-delay: 1.33s; }
    .dread-scoring-e1 { animation-delay: 1.33s; }
    .dread-scoring-s2 { animation-delay: 2.67s; }
    .dread-scoring-e2 { animation-delay: 2.67s; }
    .dread-scoring-s3 { animation-delay: 4.00s; }
    .dread-scoring-e3 { animation-delay: 4.00s; }
    .dread-scoring-s4 { animation-delay: 5.33s; }
    .dread-scoring-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .dread-scoring-conn  { animation: dread-scoring-trace 8s ease-in-out infinite; }
      .dread-scoring-stage { animation: dread-scoring-arrive 8s ease-in-out infinite; }
    }
    @keyframes dread-scoring-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes dread-scoring-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .dread-scoring-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .dread-scoring-stage { animation: dread-scoring-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes dread-scoring-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="dread-scoring-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="dread-scoring-bg" width="980" height="322"/>
  <text class="dread-scoring-h1"  x="30" y="40">How DREAD ranks a backlog</text>
  <text class="dread-scoring-sub" x="30" y="64">Five factors, one composite.</text>
  <g class="dread-scoring-stage dread-scoring-s0">
    <rect class="dread-scoring-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="dread-scoring-step" x="44" y="142">01</text>
    <text class="dread-scoring-name" x="70" y="142">Damage</text>
    <text class="dread-scoring-desc" x="44" y="166">What is lost if it</text>
    <text class="dread-scoring-desc" x="44" y="182">succeeds. Funds, data,</text>
    <text class="dread-scoring-desc" x="44" y="198">reputation.</text>
  </g>
  <line class="dread-scoring-line dread-scoring-conn dread-scoring-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#dread-scoring-tip)"/>
  <g class="dread-scoring-stage dread-scoring-s1">
    <rect class="dread-scoring-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="dread-scoring-step" x="233" y="142">02</text>
    <text class="dread-scoring-name" x="259" y="142">Reproducibility</text>
    <text class="dread-scoring-desc" x="233" y="166">Does it work every time,</text>
    <text class="dread-scoring-desc" x="233" y="182">or occasionally?</text>
  </g>
  <line class="dread-scoring-line dread-scoring-conn dread-scoring-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#dread-scoring-tip)"/>
  <g class="dread-scoring-stage dread-scoring-s2">
    <rect class="dread-scoring-warn" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="dread-scoring-step" x="422" y="142">03</text>
    <text class="dread-scoring-name" x="448" y="142">Exploitability</text>
    <text class="dread-scoring-desc" x="422" y="166">A sentence in a PDF, or a</text>
    <text class="dread-scoring-desc" x="422" y="182">week of research?</text>
  </g>
  <line class="dread-scoring-line dread-scoring-conn dread-scoring-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#dread-scoring-tip)"/>
  <g class="dread-scoring-stage dread-scoring-s3">
    <rect class="dread-scoring-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="dread-scoring-step" x="611" y="142">04</text>
    <text class="dread-scoring-name" x="637" y="142">Affected users</text>
    <text class="dread-scoring-desc" x="611" y="166">One tenant, or all of</text>
    <text class="dread-scoring-desc" x="611" y="182">them.</text>
  </g>
  <line class="dread-scoring-line dread-scoring-conn dread-scoring-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#dread-scoring-tip)"/>
  <g class="dread-scoring-stage dread-scoring-s4">
    <rect class="dread-scoring-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="dread-scoring-step" x="800" y="142">05</text>
    <text class="dread-scoring-name" x="826" y="142">Discoverability</text>
    <text class="dread-scoring-desc" x="800" y="166">How likely is somebody to</text>
    <text class="dread-scoring-desc" x="800" y="182">find it without looking?</text>
    <text class="dread-scoring-edge" x="800" y="242">composite</text>
  </g>
  <text class="dread-scoring-sub" x="30" y="304">The value of the composite is not precision — the inputs are judgements — it is that two engineers who disagree about priority end up disagreeing about a named factor rather than about a feeling.</text>
</svg>
