learning_promise: >-
  Unify all deployment, containerization, and scaling principles: architect an end-to-end multi-replica AI
  serving gateway with load balancing, circuit breaking, health probes, and live telemetry in Python.
objectives:
  - >-
    Synthesize containerization, vLLM continuous serving, KEDA queue autoscaling, edge quantization, and
    caching into a unified production architecture.
  - >-
    Implement a high-performance Reverse Proxy & Gateway with Least-Outstanding-Requests (LOR) load balancing
    and Circuit Breaking.
  - >-
    Configure Kubernetes Liveness, Readiness, and Startup Probes distinguishing model cold starts from server
    deadlocks.
  - >-
    Build a production-grade End-to-End Deployed AI Serving System in Python featuring multi-replica routing,
    health failover, and metrics.
  - >-
    Evaluate end-to-end reliability: maintain 99.99% availability during worker rolling updates and peak
    traffic surges.
