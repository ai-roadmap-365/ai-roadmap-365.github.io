visuals:
- id: end-to-end-production-ai-serving-architecture
  file: assets/end-to-end-production-ai-serving-architecture.svg
  type: diagram
  title: End-to-End Production AI Serving Architecture
  alt: End-to-End Production AI Serving Architecture showing Client Requests hitting AI Gateway Reverse
    Proxy with LOR Load Balancing, Multi-Replica vLLM GPU Pods, Prometheus Telemetry, and Circuit Breaker
    Failover
  description: Complete production topology diagram detailing the AI Gateway, load balancing, multi-replica
    GPU servers, and telemetry.
- id: circuit-breaker-and-health-probe-state-machine
  file: assets/circuit-breaker-and-health-probe-state-machine.svg
  type: diagram
  title: Circuit Breaker and Health Probe State Machine
  alt: Circuit Breaker and Health Probe State Machine showing Closed (Normal), Open (Failing Fast), and
    Half-Open (Canary Testing) States with Startup and Readiness Probes
  description: State transition diagram illustrating circuit breaker transitions and probe lifecycles.
- id: gateway-responsibilities
  file: assets/gateway-responsibilities.svg
  type: diagram
  title: 'What the gateway owns'
  alt: 'Diagram: the four responsibilities of an AI serving gateway'
  description: 'A four-stage description of an AI gateway''s responsibilities covering request routing by outstanding load, health tracking, circuit breaking and telemetry.'
- id: round-robin-or-lor
  file: assets/round-robin-or-lor.svg
  type: diagram
  title: 'Round robin against least-outstanding'
  alt: 'Diagram: round-robin routing compared with least-outstanding-requests routing'
  description: 'A two-column comparison of round-robin load balancing against least-outstanding-requests routing for workloads with highly variable request durations.'
- id: serving-eras
  file: assets/serving-eras.svg
  type: diagram
  title: 'Three generations of AI serving'
  alt: 'Diagram: the progression from Flask wrappers to intelligent AI gateways'
  description: 'A three-stage progression of AI serving architecture from monolithic Flask wrappers through multi-container microservices to modern AI gateways.'
- id: deployed-or-exposed
  file: assets/deployed-or-exposed.svg
  type: diagram
  title: 'A deployment, not an exposed container'
  alt: 'Diagram: a production AI deployment compared with a container exposed directly'
  description: 'A two-column comparison of a full AI serving deployment against a single container published to the internet.'
- id: three-probes
  file: assets/three-probes.svg
  type: diagram
  title: 'Three probes, three questions'
  alt: 'Diagram: the three Kubernetes probes and the distinct question each answers'
  description: 'A four-stage description of startup, readiness and liveness probes, the question each answers, and the failure produced by using one for all three.'
- id: circuit-states
  file: assets/circuit-states.svg
  type: diagram
  title: 'The circuit breaker''s three states'
  alt: 'Diagram: the closed, open and half-open states of a circuit breaker'
  description: 'A four-stage description of circuit breaker states covering normal operation, tripping, the cooldown, and the single canary request that decides recovery.'
- id: emergency-room
  file: assets/emergency-room.svg
  type: diagram
  title: 'A multi-lane emergency room'
  alt: 'Diagram: hospital triage as an analogy for gateway routing and circuit breaking'
  description: 'A two-column comparison mapping emergency-room practices onto gateway routing, circuit breaking and startup probes.'
- id: gateway-request-path
  file: assets/gateway-request-path.svg
  type: diagram
  title: 'One request through the gateway'
  alt: 'Diagram: the path of a request through circuit evaluation, replica selection and dispatch'
  description: 'A four-stage walkthrough of a request being evaluated against the circuit state, routed by least-outstanding-requests, dispatched and completed.'
- id: gateway-failure-modes
  file: assets/gateway-failure-modes.svg
  type: diagram
  title: 'Four failures and their controls'
  alt: 'Diagram: the four production failure modes of an AI serving system and their controls'
  description: 'A two-column comparison of AI serving failure modes against the specific control that prevents each.'
- id: telemetry-signals
  file: assets/telemetry-signals.svg
  type: diagram
  title: 'Four AI-specific signals'
  alt: 'Diagram: the four telemetry signals an AI serving system must record'
  description: 'A four-stage description of AI serving telemetry covering time to first token, inter-token latency, queue depth and error rate.'
- id: gateway-or-direct
  file: assets/gateway-or-direct.svg
  type: diagram
  title: 'When a gateway is worth it'
  alt: 'Diagram: when to deploy a full serving gateway and when a single container suffices'
  description: 'A two-column comparison of deployments that need a full AI gateway against those where a single container is proportionate.'
- id: readiness-checklist
  file: assets/readiness-checklist.svg
  type: diagram
  title: 'Ready, and not ready'
  alt: 'Diagram: the readiness checklist for a deployed AI serving system'
  description: 'A two-column comparison of a production-ready AI deployment against the specific omissions that make one fragile.'
