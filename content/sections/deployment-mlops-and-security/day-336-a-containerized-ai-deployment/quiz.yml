questions:
- question: Why is 'Least-Outstanding-Requests' (LOR) load balancing vastly superior to Round-Robin for
    LLM inference clusters?
  options:
  - 'Because Round-Robin is written entirely in JavaScript'
  - Round-Robin deletes requests randomly
  - LOR only works on Linux
  - 'LLM latency varies hugely; route to the least loaded'
  answer_index: 3
  explanation: Because LLM request durations vary drastically, Least-Outstanding-Requests prevents replica
    queue congestion.
- question: What is the primary role of a 'Startup Probe' (introduced in Kubernetes) for LLM container
    pods?
  options:
  - 'To let large models load before liveness kills them'
  - To play startup music
  - To format the local hard drive
  - To compile the Linux kernel
  answer_index: 0
  explanation: Startup probes prevent premature container restarts during lengthy model weight initialization.
- question: How does a 'Circuit Breaker' protect an AI Gateway when downstream GPU inference workers fail?
  options:
  - By cutting the physical power cord
  - 'It trips open and fails fast instead of cascading'
  - By doubling the request rate
  - By restarting all user laptops
  answer_index: 1
  explanation: Circuit breakers fail fast to protect struggling downstream services and enable graceful
    recovery.
- question: What is the purpose of a Kubernetes `PreStop` lifecycle hook in an LLM deployment?
  options:
  - To delete the container logs
  - To overclock the GPU
  - 'To drain connections before SIGTERM arrives'
  - 'To restart the whole model from scratch again'
  answer_index: 2
  explanation: PreStop hooks allow active streaming decode requests to finish cleanly before pod termination.
- question: What three core metrics form the fundamental Triad of LLM Serving Telemetry?
  options:
  - Color depth, monitor resolution, and mouse clicks
  - Disk free space, memory speed, and audio volume
  - CPU temperature, fan speed, and case LED status
  - 'TTFT, inter-token latency, and error rate'
  answer_index: 3
  explanation: TTFT, ITL, and queue depth/error rates provide the complete operational picture of LLM
    serving health.
