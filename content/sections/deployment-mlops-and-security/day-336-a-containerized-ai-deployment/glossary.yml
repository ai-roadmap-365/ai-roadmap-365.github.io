terms:
- term: AI Gateway
  definition: A high-performance reverse proxy managing authentication, rate limiting, and intelligent
    load balancing across AI backends.
- term: Least-Outstanding-Requests (LOR)
  definition: A load balancing strategy routing traffic to the replica with the fewest active running
    requests.
- term: Circuit Breaker
  definition: A resilience pattern tripping to OPEN state upon repeated backend failures to prevent cascading
    outages.
- term: Startup Probe
  definition: A Kubernetes probe disabling liveness checks until heavy model weight initialization completes.
- term: Readiness Probe
  definition: A probe determining whether a replica is ready to receive live user network traffic.
- term: Connection Draining
  definition: Allowing active streaming responses to finish before terminating a container during rolling
    deployments.
- term: Time-to-First-Token (TTFT)
  definition: The latency elapsed between receiving a prompt and generating the initial response token.
- term: Inter-Token Latency (ITL)
  definition: The average time elapsed between consecutive auto-regressive decode tokens.
