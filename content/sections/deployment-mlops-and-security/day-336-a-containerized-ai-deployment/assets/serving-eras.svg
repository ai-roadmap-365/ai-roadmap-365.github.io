<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each fixed what the last could not see.">
  <title>Three generations of AI serving</title>
  <style>
    .serving-eras-bg   { fill: #f8fafc; }
    .serving-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .serving-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .serving-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .serving-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .serving-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .serving-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .serving-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .serving-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .serving-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .serving-eras-stage { opacity: 1; }

    .serving-eras-s0 { animation-delay: 0.00s; }
    .serving-eras-e0 { animation-delay: 0.00s; }
    .serving-eras-s1 { animation-delay: 1.50s; }
    .serving-eras-e1 { animation-delay: 1.50s; }
    .serving-eras-s2 { animation-delay: 3.00s; }
    .serving-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .serving-eras-conn  { animation: serving-eras-trace 6s ease-in-out infinite; }
      .serving-eras-stage { animation: serving-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes serving-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes serving-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .serving-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .serving-eras-stage { animation: serving-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes serving-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="serving-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="serving-eras-bg" width="980" height="322"/>
  <text class="serving-eras-h1"  x="30" y="40">Three generations of AI serving</text>
  <text class="serving-eras-sub" x="30" y="64">Each fixed what the last could not see.</text>
  <g class="serving-eras-stage serving-eras-s0">
    <rect class="serving-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="serving-eras-step" x="44" y="142">01</text>
    <text class="serving-eras-name" x="70" y="142">Flask and Gunicorn, 2018-2021</text>
    <text class="serving-eras-desc" x="44" y="166">A model in a container, round-robin in front.</text>
    <text class="serving-eras-desc" x="44" y="182">An exception dropped the stream.</text>
  </g>
  <line class="serving-eras-line serving-eras-conn serving-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#serving-eras-tip)"/>
  <g class="serving-eras-stage serving-eras-s1">
    <rect class="serving-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="serving-eras-step" x="359" y="142">02</text>
    <text class="serving-eras-name" x="385" y="142">Microservices, 2021-2023</text>
    <text class="serving-eras-desc" x="359" y="166">Gateway split from Triton or TorchServe.</text>
    <text class="serving-eras-desc" x="359" y="182">Balancing still blind to KV cache saturation.</text>
  </g>
  <line class="serving-eras-line serving-eras-conn serving-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#serving-eras-tip)"/>
  <g class="serving-eras-stage serving-eras-s2">
    <rect class="serving-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="serving-eras-step" x="674" y="142">03</text>
    <text class="serving-eras-name" x="700" y="142">AI gateways, 2024</text>
    <text class="serving-eras-desc" x="674" y="166">LOR routing, SSE pass-through, circuit</text>
    <text class="serving-eras-desc" x="674" y="182">breaking, unified metrics.</text>
    <text class="serving-eras-edge" x="674" y="242">queue-aware</text>
  </g>
  <text class="serving-eras-sub" x="30" y="304">The second generation is the interesting failure: separating the gateway from the workers was correct and did nothing about routing, because the gateway still had no visibility into what each worker was actually carrying.</text>
</svg>
