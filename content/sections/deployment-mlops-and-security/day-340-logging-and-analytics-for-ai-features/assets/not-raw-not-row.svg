<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One legal, one architectural.">
  <title>Two storage mistakes</title>
  <style>
    .not-raw-not-row-bg   { fill: #f8fafc; }
    .not-raw-not-row-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-raw-not-row-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-raw-not-row-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-raw-not-row-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-raw-not-row-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-raw-not-row-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-raw-not-row-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-raw-not-row-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-raw-not-row-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-raw-not-row-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-raw-not-row-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-raw-not-row-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-raw-not-row-row { opacity: 1; }
    .not-raw-not-row-r0 { animation-delay: 0.00s; }
    .not-raw-not-row-r1 { animation-delay: 0.45s; }
    .not-raw-not-row-r2 { animation-delay: 0.90s; }
    .not-raw-not-row-r3 { animation-delay: 1.35s; }
    .not-raw-not-row-r4 { animation-delay: 1.80s; }
    .not-raw-not-row-row { animation: not-raw-not-row-reveal 7.3s ease-in-out infinite; }
    @keyframes not-raw-not-row-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-raw-not-row-bg" width="980" height="390"/>
  <text class="not-raw-not-row-h1"  x="30" y="40">Two storage mistakes</text>
  <text class="not-raw-not-row-sub" x="30" y="64">One legal, one architectural.</text>
  <rect class="not-raw-not-row-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-raw-not-row-name" x="46" y="122">Correct</text>
  <text class="not-raw-not-row-desc" x="46" y="142">Scrubbed and columnar.</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r0" x="46" y="182">PII redacted in application memory</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r1" x="46" y="216">Encrypted at rest</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r2" x="46" y="250">Columnar OLAP for token events</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r3" x="46" y="284">Compression, and a retention policy</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r4" x="46" y="318">Trace IDs propagated across services</text>
  <rect class="not-raw-not-row-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-raw-not-row-name" x="526" y="122">Two mistakes</text>
  <text class="not-raw-not-row-desc" x="526" y="142">Both very common.</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r0" x="526" y="182">Raw prompts to unencrypted files</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r1" x="526" y="216">A GDPR violation the moment it is written</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r2" x="526" y="250">Token analytics in SQLite or MySQL</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r3" x="526" y="284">Row-based storage for time-series scans</text>
  <text class="not-raw-not-row-desc not-raw-not-row-row not-raw-not-row-r4" x="526" y="318">Costs and query times both wrong</text>
  <text class="not-raw-not-row-sub" x="30" y="372">The first is a violation at the moment of writing rather than at the moment of a breach, which is why in-memory scrubbing before the disk write is the control rather than encryption after it.</text>
</svg>
