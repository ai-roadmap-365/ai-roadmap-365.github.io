<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One of them can answer a question.">
  <title>A napkin, or an itemised folio</title>
  <style>
    .napkin-or-folio-bg   { fill: #f8fafc; }
    .napkin-or-folio-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .napkin-or-folio-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .napkin-or-folio-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .napkin-or-folio-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .napkin-or-folio-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .napkin-or-folio-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .napkin-or-folio-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .napkin-or-folio-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .napkin-or-folio-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .napkin-or-folio-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .napkin-or-folio-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .napkin-or-folio-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .napkin-or-folio-row { opacity: 1; }
    .napkin-or-folio-r0 { animation-delay: 0.00s; }
    .napkin-or-folio-r1 { animation-delay: 0.45s; }
    .napkin-or-folio-r2 { animation-delay: 0.90s; }
    .napkin-or-folio-r3 { animation-delay: 1.35s; }
    .napkin-or-folio-r4 { animation-delay: 1.80s; }
    .napkin-or-folio-row { animation: napkin-or-folio-reveal 7.3s ease-in-out infinite; }
    @keyframes napkin-or-folio-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="napkin-or-folio-bg" width="980" height="390"/>
  <text class="napkin-or-folio-h1"  x="30" y="40">A napkin, or an itemised folio</text>
  <text class="napkin-or-folio-sub" x="30" y="64">One of them can answer a question.</text>
  <rect class="napkin-or-folio-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="napkin-or-folio-name" x="46" y="122">Unstructured text</text>
  <text class="napkin-or-folio-desc" x="46" y="142">"Someone bought some food."</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r0" x="46" y="182">Written for a human reading one line</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r1" x="46" y="216">Not queryable</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r2" x="46" y="250">No tenant, no trace, no tokens</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r3" x="46" y="284">grep across five services and timestamps</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r4" x="46" y="318">Hours of manual correlation</text>
  <rect class="napkin-or-folio-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="napkin-or-folio-name" x="526" y="122">Structured JSON</text>
  <text class="napkin-or-folio-desc" x="526" y="142">An itemised folio.</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r0" x="526" y="182">Room number, items, server badge, timestamp</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r1" x="526" y="216">One query answers a billing question</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r2" x="526" y="250">One query reconstructs a request</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r3" x="526" y="284">Machine-validated schema</text>
  <text class="napkin-or-folio-desc napkin-or-folio-row napkin-or-folio-r4" x="526" y="318">Milliseconds, not hours</text>
  <text class="napkin-or-folio-sub" x="30" y="372">The schema is what makes the difference rather than the format: JSON that omits `tenant_id` is exactly as unhelpful as a napkin when the question is which customer caused the spike.</text>
</svg>
