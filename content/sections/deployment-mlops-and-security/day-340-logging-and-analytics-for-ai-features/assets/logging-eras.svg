<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From files to columnar analytics.">
  <title>Three eras of logging</title>
  <style>
    .logging-eras-bg   { fill: #f8fafc; }
    .logging-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .logging-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .logging-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .logging-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .logging-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .logging-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .logging-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .logging-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .logging-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .logging-eras-stage { opacity: 1; }

    .logging-eras-s0 { animation-delay: 0.00s; }
    .logging-eras-e0 { animation-delay: 0.00s; }
    .logging-eras-s1 { animation-delay: 1.50s; }
    .logging-eras-e1 { animation-delay: 1.50s; }
    .logging-eras-s2 { animation-delay: 3.00s; }
    .logging-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .logging-eras-conn  { animation: logging-eras-trace 6s ease-in-out infinite; }
      .logging-eras-stage { animation: logging-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes logging-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes logging-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .logging-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .logging-eras-stage { animation: logging-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes logging-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="logging-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="logging-eras-bg" width="980" height="322"/>
  <text class="logging-eras-h1"  x="30" y="40">Three eras of logging</text>
  <text class="logging-eras-sub" x="30" y="64">From files to columnar analytics.</text>
  <g class="logging-eras-stage logging-eras-s0">
    <rect class="logging-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="logging-eras-step" x="44" y="142">01</text>
    <text class="logging-eras-name" x="70" y="142">Flat files, 2000-2015</text>
    <text class="logging-eras-desc" x="44" y="166">Lines in /var/log. grep for keywords, and</text>
    <text class="logging-eras-desc" x="44" y="182">crash the server on log I/O.</text>
  </g>
  <line class="logging-eras-line logging-eras-conn logging-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#logging-eras-tip)"/>
  <g class="logging-eras-stage logging-eras-s1">
    <rect class="logging-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="logging-eras-step" x="359" y="142">02</text>
    <text class="logging-eras-name" x="385" y="142">ELK, 2016-2022</text>
    <text class="logging-eras-desc" x="359" y="166">JSON structured logging becomes standard.</text>
    <text class="logging-eras-desc" x="359" y="182">Shippers parse into Elasticsearch.</text>
  </g>
  <line class="logging-eras-line logging-eras-conn logging-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#logging-eras-tip)"/>
  <g class="logging-eras-stage logging-eras-s2">
    <rect class="logging-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="logging-eras-step" x="674" y="142">03</text>
    <text class="logging-eras-name" x="700" y="142">OLAP and AI telemetry, 2023</text>
    <text class="logging-eras-desc" x="674" y="166">ClickHouse and Vector at billions of events.</text>
    <text class="logging-eras-desc" x="674" y="182">Token analytics split from log archiving.</text>
    <text class="logging-eras-edge" x="674" y="242">decoupled</text>
  </g>
  <text class="logging-eras-sub" x="30" y="304">The third era's split is the useful idea: financial token analytics and raw prompt archiving have completely different query patterns, retention needs and privacy constraints, so they stop being one system.</text>
</svg>
