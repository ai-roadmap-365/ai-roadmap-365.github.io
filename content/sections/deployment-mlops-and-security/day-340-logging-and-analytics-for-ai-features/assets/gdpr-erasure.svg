<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Pseudonymise, expire, encrypt.">
  <title>Three controls for erasure</title>
  <style>
    .gdpr-erasure-bg   { fill: #f8fafc; }
    .gdpr-erasure-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gdpr-erasure-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gdpr-erasure-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gdpr-erasure-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gdpr-erasure-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gdpr-erasure-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gdpr-erasure-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gdpr-erasure-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gdpr-erasure-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gdpr-erasure-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gdpr-erasure-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gdpr-erasure-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .gdpr-erasure-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .gdpr-erasure-stage { opacity: 1; }

    .gdpr-erasure-s0 { animation-delay: 0.00s; }
    .gdpr-erasure-e0 { animation-delay: 0.00s; }
    .gdpr-erasure-s1 { animation-delay: 1.50s; }
    .gdpr-erasure-e1 { animation-delay: 1.50s; }
    .gdpr-erasure-s2 { animation-delay: 3.00s; }
    .gdpr-erasure-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .gdpr-erasure-conn  { animation: gdpr-erasure-trace 6s ease-in-out infinite; }
      .gdpr-erasure-stage { animation: gdpr-erasure-arrive 6s ease-in-out infinite; }
    }
    @keyframes gdpr-erasure-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes gdpr-erasure-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .gdpr-erasure-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .gdpr-erasure-stage { animation: gdpr-erasure-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes gdpr-erasure-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="gdpr-erasure-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="gdpr-erasure-bg" width="980" height="322"/>
  <text class="gdpr-erasure-h1"  x="30" y="40">Three controls for erasure</text>
  <text class="gdpr-erasure-sub" x="30" y="64">Pseudonymise, expire, encrypt.</text>
  <g class="gdpr-erasure-stage gdpr-erasure-s0">
    <rect class="gdpr-erasure-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="gdpr-erasure-step" x="44" y="142">01</text>
    <text class="gdpr-erasure-name" x="70" y="142">Pseudonymise identifiers</text>
    <text class="gdpr-erasure-desc" x="44" y="166">HMAC with a rotating salt, so the ledger</text>
    <text class="gdpr-erasure-desc" x="44" y="182">cannot re-identify a user.</text>
    <text class="gdpr-erasure-edge" x="44" y="242">hashed</text>
  </g>
  <line class="gdpr-erasure-line gdpr-erasure-conn gdpr-erasure-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#gdpr-erasure-tip)"/>
  <g class="gdpr-erasure-stage gdpr-erasure-s1">
    <rect class="gdpr-erasure-good" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="gdpr-erasure-step" x="359" y="142">02</text>
    <text class="gdpr-erasure-name" x="385" y="142">Expire raw prompts automatically</text>
    <text class="gdpr-erasure-desc" x="359" y="166">A partition drop at 90 days, not a manual</text>
    <text class="gdpr-erasure-desc" x="359" y="182">cleanup nobody runs.</text>
    <text class="gdpr-erasure-edge" x="359" y="242">90 days</text>
  </g>
  <line class="gdpr-erasure-line gdpr-erasure-conn gdpr-erasure-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#gdpr-erasure-tip)"/>
  <g class="gdpr-erasure-stage gdpr-erasure-s2">
    <rect class="gdpr-erasure-box" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="gdpr-erasure-step" x="674" y="142">03</text>
    <text class="gdpr-erasure-name" x="700" y="142">Encrypt at rest</text>
    <text class="gdpr-erasure-desc" x="674" y="166">AES-256 or customer-managed keys, on every</text>
    <text class="gdpr-erasure-desc" x="674" y="182">storage tier.</text>
  </g>
  <text class="gdpr-erasure-sub" x="30" y="304">The second control is the one that makes erasure tractable rather than heroic: a retention policy that runs on a schedule means most of the data a request would have to cover has already gone.</text>
</svg>
