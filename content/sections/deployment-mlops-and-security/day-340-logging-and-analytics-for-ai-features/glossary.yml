terms:
- term: Structured JSON Logging
  definition: Emitting log events as machine-readable JSON objects with strictly defined schema fields.
- term: Trace Correlation
  definition: Linking distributed log records across microservices using a shared W3C trace ID.
- term: Cost Attribution
  definition: Calculating exact financial compute and API expenditure broken down by customer tenant ID.
- term: PII Scrubbing
  definition: Sanitizing sensitive personal data (emails, credit cards, SSNs) prior to persistent log
    storage.
- term: OLAP Database (ClickHouse)
  definition: Column-oriented analytical database designed for ultra-fast aggregation queries over billions
    of events.
- term: Log Shipper (Vector / Fluentbit)
  definition: Lightweight daemon that buffers, filters, and forwards application log streams to analytical
    sinks.
- term: Token Metering
  definition: Real-time accounting of prompt and completion tokens consumed per request.
- term: Audit Log
  definition: An immutable, tamper-evident record of administrative and model generation events for regulatory
    compliance.
