questions:
- question: Why is unstructured text logging (e.g. `logger.info(f'User {u} ran prompt {p}')`) considered
    an anti-pattern in production AI systems?
  options:
  - Because Python only supports JSON files
  - 'Text needs brittle regex and leaks unredacted data'
  - Because text logs take up zero disk space
  - Because text logs make the model forget its training weights
  answer_index: 1
  explanation: Structured JSON logging enables high-speed indexing, schema validation, and reliable PII
    redaction.
- question: What is the role of W3C `trace_id` correlation in structured AI event logs?
  options:
  - To count how many characters are in the prompt
  - To encrypt the hard drive
  - 'To link every stage of one request into a single trace'
  - To speed up GPU matrix multiplication
  answer_index: 2
  explanation: Trace IDs correlate events across all distributed microservices handling a single user
    request.
- question: How does Multi-Tenant Cost Attribution function in an AI analytics pipeline?
  options:
  - By charging every user a random flat fee
  - By turning off the server at midnight
  - By measuring the electricity used by the monitor
  - 'Track tokens per tenant and multiply by the rate'
  answer_index: 3
  explanation: Cost attribution aggregates token usage by tenant ID against model pricing tiers to bill
    customers accurately.
- question: What is the critical requirement for PII (Personally Identifiable Information) scrubbing in
    AI log streams?
  options:
  - 'Scrub before the payload leaves the process'
  - Only scrub logs on weekends
  - PII scrubbing is illegal
  - PII should be published to a public website
  answer_index: 0
  explanation: PII must be sanitized in-memory before leaving application memory boundaries to maintain
    regulatory compliance.
- question: Why are columnar OLAP databases like ClickHouse or Amazon Redshift preferred over transactional
    databases (PostgreSQL) for AI token analytics?
  options:
  - Because ClickHouse is written in HTML
  - 'Columnar stores compress and aggregate huge streams'
  - PostgreSQL cannot store numbers
  - OLAP databases only work on mobile phones
  answer_index: 1
  explanation: Columnar OLAP engines compress event logs and execute massive aggregations across billions
    of rows in milliseconds.
