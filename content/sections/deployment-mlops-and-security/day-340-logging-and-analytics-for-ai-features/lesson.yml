learning_promise: 'Master production AI logging and usage analytics: architect structured JSON event streams,
  correlate W3C distributed trace IDs, calculate granular multi-tenant token costs, and sanitize PII in
  Python.'
objectives:
- Deconstruct Structured JSON Event Logging schemas capturing trace_id, user_id, prompt_tokens, completion_tokens,
  model_name, and finish_reason.
- Implement real-time regex and NLP PII scrubbing filters sanitizing Social Security Numbers, emails,
  and API keys prior to disk emission.
- Configure multi-tenant Cost Attribution analytics aggregating prompt and completion token expenditures
  by customer organization.
- Build a Production AI Structured Logging & Analytics Engine in Python validating event schemas, sanitizing
  PII, and tracking billing totals.
- 'Evaluate log pipeline aggregation architectures: fluentbit / Vector ➔ ClickHouse / OpenSearch for high-throughput
  AI telemetry.'
