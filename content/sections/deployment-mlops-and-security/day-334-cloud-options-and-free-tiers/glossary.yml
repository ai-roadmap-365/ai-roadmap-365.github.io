terms:
  - term: Always-On Billing
    definition: Charging by the hour for a running machine regardless of usage. Predictable, and it
      pays for idle — a VM at 3am costs what it costs at noon.
  - term: Per-Request Billing
    definition: Charging for compute actually consumed. Costs nothing at zero traffic, and has no
      ceiling at high traffic.
  - term: Scale to Zero
    definition: The property that makes idle free. The single reason serverless wins decisively at
      launch, and irrelevant once traffic is steady.
  - term: Egress
    definition: Data leaving the provider, billed per gigabyte. Frequently exceeds compute at scale,
      rarely appears on a comparison page, and is the mechanism of cloud lock-in.
  - term: Free Tier
    definition: A permanent allowance across several dimensions. Distinct from a free trial, which is
      credit with an expiry date.
  - term: Headroom
    definition: A free allowance divided by current usage, expressed as a multiple of today's traffic.
      Computed per dimension.
  - term: Binding Constraint
    definition: The allowance with the smallest headroom — the one that ends the free tier. Almost
      never the one in the headline.
  - term: Crossover
    definition: The traffic multiple at which one option stops being cheaper than another. Its absence
      is also an answer, meaning the choice is insensitive to growth.
  - term: Cold Start
    definition: The delay while a scaled-to-zero service starts before serving a request. Seconds
      rather than milliseconds when a model must be loaded, and invisible to a cost model.
  - term: Committed Use Discount
    definition: A lower rate in exchange for a usage commitment. Changes always-on economics
      substantially and changes egress not at all.
  - term: Budget Alert
    definition: A provider notification when spend crosses a threshold. Free on every major provider
      and the difference between a surprising bill and a ruinous one.
