terms:
- term: Speculative Decoding
  definition: An algorithm using a fast draft model to propose tokens verified in parallel by a larger
    target model.
- term: Draft Model
  definition: A lightweight, low-latency model (e.g. 1B params) proposing speculative token candidates.
- term: Target Model
  definition: The primary high-capacity LLM (e.g. 70B params) verifying and accepting draft tokens.
- term: Acceptance Rate ($\alpha$)
  definition: The fraction of proposed draft tokens successfully validated and accepted by the target
    model.
- term: Radix Tree Prefix Caching
  definition: A tree-structured KV cache lookup reusing pre-computed attention tensors for shared prompt
    prefixes.
- term: Attention Sinks
  definition: The phenomenon where the initial tokens in a sequence absorb massive attention weights regardless
    of semantic meaning.
- term: StreamingLLM
  definition: A KV cache eviction framework preserving initial attention sinks and recent sliding-window
    tokens.
- term: Residual Sampling
  definition: Sampling rejected draft tokens from normalized residual probabilities to ensure exact mathematical
    fidelity.
