title: Cloud Options and Free Tiers
section: deployment-mlops-and-security
subsection: deployment-and-containers
week: 48
learning_promise:
  'Price hosting honestly, including the lines the front page omits. Find the traffic at
  which the cheapest option stops being cheapest, and find which free allowance actually runs out
  first — in the lab it is egress at 1.25x current traffic, while the advertised two million free
  requests would have lasted a hundred times longer.'
objectives:
  - Distinguish always-on billing from per-request billing, and say what each costs at zero traffic.
  - Price compute, egress and storage separately, deducting each free allowance from its own quantity.
  - Compute headroom per dimension and identify the binding constraint.
  - Find the traffic multiple at which two options change places.
  - State what a cost model does not tell you.
