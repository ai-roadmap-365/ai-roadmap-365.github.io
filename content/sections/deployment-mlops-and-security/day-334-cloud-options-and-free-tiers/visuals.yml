visuals:
  - id: where-the-free-tier-ends
    file: assets/where-the-free-tier-ends.svg
    type: diagram
    title: Where the Free Tier Actually Ends
    alt: Where the Free Tier Actually Ends showing four allowances with egress binding at 1.25x while
      requests would last 100x
    description: Headroom per free allowance drawn to scale, with egress binding at 1.25x against the
      advertised two million requests that would have lasted a hundred times longer.
  - id: cheapest-today-expensive-tomorrow
    file: assets/cheapest-today-expensive-tomorrow.svg
    type: diagram
    title: Cheapest Today, Expensive Tomorrow
    alt: Cheapest Today, Expensive Tomorrow showing serverless and a VM crossing over at forty-five
      times launch traffic
    description: Monthly cost against traffic for a serverless option and an always-on VM, with the
      crossover marked at 899,599 requests a month and the figures at launch and at 1000x.
  - id: four-cost-dimensions
    file: assets/four-cost-dimensions.svg
    type: diagram
    title: 'Four things decide the bill'
    alt: 'Diagram: the four dimensions of a hosting bill'
    description: 'A four-stage description of the components of a hosting bill covering compute billing models, egress, idle cost and storage.'
  - id: wrong-question
    file: assets/wrong-question.svg
    type: diagram
    title: 'The question is not "which is cheapest"'
    alt: 'Diagram: asking which option is cheapest compared with asking where the ranking changes'
    description: 'A two-column comparison of a fixed cheapest-option question against the two computable questions that actually decide a hosting choice.'
  - id: cloud-pricing-eras
    file: assets/cloud-pricing-eras.svg
    type: diagram
    title: 'Five pricing changes'
    alt: 'Diagram: the progression from hourly billing to pressure on egress pricing'
    description: 'A five-stage progression through hourly billing, per-second granularity, scale-to-zero, egress pricing and the free tier as an acquisition channel.'
  - id: not-a-headline-number
    file: assets/not-a-headline-number.svg
    type: diagram
    title: 'Not the headline number'
    alt: 'Diagram: what a hosting decision is compared with three misreadings of it'
    description: 'A two-column comparison of the properties of a hosting decision against three common misreadings.'
  - id: pricing-procedure
    file: assets/pricing-procedure.svg
    type: diagram
    title: 'How to price a workload'
    alt: 'Diagram: the seven steps of pricing a workload across hosting options'
    description: 'A seven-stage pricing procedure covering workload description, compute, egress, storage, per-dimension headroom, taking the minimum, and bisecting for the crossover.'
  - id: always-on-or-per-request
    file: assets/always-on-or-per-request.svg
    type: diagram
    title: 'Two billing shapes'
    alt: 'Diagram: always-on billing compared with per-request billing'
    description: 'A two-column comparison of always-on and per-request compute billing by predictability, idle cost and behaviour at scale.'
  - id: gym-membership
    file: assets/gym-membership.svg
    type: diagram
    title: 'A gym membership, and two towels'
    alt: 'Diagram: a gym membership compared with paying per visit, and the free trial''s hidden limit'
    description: 'A two-column comparison of pay-per-visit against a membership, and of a free trial''s advertised allowance against its binding one.'
  - id: measured-crossover
    file: assets/measured-crossover.svg
    type: diagram
    title: 'Four numbers worth carrying'
    alt: 'Diagram: the measured cost, headroom and crossover for one AI endpoint'
    description: 'A four-stage reading of measured hosting costs showing fixed VM compute, egress exceeding compute at scale, the binding free-tier dimension and the crossover point.'
  - id: headline-versus-binding
    file: assets/headline-versus-binding.svg
    type: diagram
    title: 'The advertised limit and the real one'
    alt: 'Diagram: the advertised free-tier allowance compared with the binding one'
    description: 'A two-column comparison of a free tier''s headline request allowance against the egress allowance that actually ends it.'
  - id: cloud-implications
    file: assets/cloud-implications.svg
    type: diagram
    title: 'Five consequences, and only one is code'
    alt: 'Diagram: the security, egress, jurisdiction, latency and capacity implications of a hosting choice'
    description: 'A five-stage description of hosting implications covering account security, egress as an attack surface, region and jurisdiction, cold starts, and unchecked capacity.'
  - id: tier-versus-trial
    file: assets/tier-versus-trial.svg
    type: diagram
    title: 'A tier is not a trial'
    alt: 'Diagram: a free tier compared with a free trial'
    description: 'A two-column comparison of a permanent free allowance against time-limited credit.'
  - id: hosting-when
    file: assets/hosting-when.svg
    type: diagram
    title: 'Where to start, and when to move'
    alt: 'Diagram: when to choose serverless, when to move to a VM, and what never to skip'
    description: 'A two-column comparison of hosting choices by traffic profile against three practices that apply regardless of choice.'
