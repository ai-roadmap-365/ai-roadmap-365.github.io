<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Radix Tree Prompt Prefix Caching Hierarchy">
  <title>Radix Tree Prompt Prefix Caching Hierarchy</title>
  <defs>
    <style>
      .d334b-bg { fill: #f8fafc; }
      .d334b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d334b-root { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d334b-br1 { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d334b-br2 { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d334b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d334b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d334b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d334b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d334b-bg" />
  
  <text x="40" y="40" class="d334a-title">Radix Tree Prefix Caching (RadixAttention)</text>
  <text x="40" y="65" class="d334a-subtitle">Radix Tree Prompt Prefix Caching Hierarchy showing Root System Prompt KV Cache shared across multiple child user chat branches with 0ms Prefill Recomputation</text>
  
  <!-- Root Node (System Prompt) -->
  <rect x="250" y="110" width="400" height="90" class="d334b-root" />
  <text x="270" y="140" class="d334b-header" fill="#1d4ed8">Root Node: System Prompt (1,500 Tokens)</text>
  <text x="270" y="165" class="d334b-text">"You are an expert Python software engineer..." [KV Blocks: 0-93]</text>
  <text x="270" y="185" class="d334b-text" font-weight="600">Prefill Cost: 0 ms (Cached in GPU VRAM)</text>
  
  <!-- Branch A -->
  <rect x="40" y="250" width="380" height="130" class="d334b-br1" />
  <text x="60" y="280" class="d334b-header" fill="#7e22ce">Branch A: User Query 1</text>
  <text x="60" y="305" class="d334b-text">• "Write a fast async web scraper in Python"</text>
  <text x="60" y="330" class="d334b-text">• Reuses Root KV Blocks 0-93</text>
  <text x="60" y="355" class="d334b-text" font-weight="600">TTFT: 24 ms (Only prefills 12 new tokens)</text>
  
  <!-- Branch B -->
  <rect x="480" y="250" width="380" height="130" class="d334b-br2" />
  <text x="500" y="280" class="d334b-header" fill="#15803d">Branch B: User Query 2</text>
  <text x="500" y="305" class="d334b-text">• "Explain binary search tree balancing"</text>
  <text x="500" y="330" class="d334b-text">• Reuses Root KV Blocks 0-93</text>
  <text x="500" y="355" class="d334b-text" font-weight="600">TTFT: 21 ms (Only prefills 9 new tokens)</text>
</svg>