<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Compute, egress, headroom, crossover.">
  <title>Four numbers worth carrying</title>
  <style>
    .measured-crossover-bg   { fill: #f8fafc; }
    .measured-crossover-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measured-crossover-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measured-crossover-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measured-crossover-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measured-crossover-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .measured-crossover-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .measured-crossover-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .measured-crossover-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .measured-crossover-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .measured-crossover-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .measured-crossover-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .measured-crossover-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .measured-crossover-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .measured-crossover-stage { opacity: 1; }

    .measured-crossover-s0 { animation-delay: 0.00s; }
    .measured-crossover-e0 { animation-delay: 0.00s; }
    .measured-crossover-s1 { animation-delay: 1.28s; }
    .measured-crossover-e1 { animation-delay: 1.28s; }
    .measured-crossover-s2 { animation-delay: 2.56s; }
    .measured-crossover-e2 { animation-delay: 2.56s; }
    .measured-crossover-s3 { animation-delay: 3.84s; }
    .measured-crossover-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .measured-crossover-conn  { animation: measured-crossover-trace 6.4s ease-in-out infinite; }
      .measured-crossover-stage { animation: measured-crossover-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes measured-crossover-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes measured-crossover-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .measured-crossover-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .measured-crossover-stage { animation: measured-crossover-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes measured-crossover-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="measured-crossover-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="measured-crossover-bg" width="980" height="322"/>
  <text class="measured-crossover-h1"  x="30" y="40">Four numbers worth carrying</text>
  <text class="measured-crossover-sub" x="30" y="64">Compute, egress, headroom, crossover.</text>
  <g class="measured-crossover-stage measured-crossover-s0">
    <rect class="measured-crossover-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="measured-crossover-step" x="44" y="142">01</text>
    <text class="measured-crossover-name" x="70" y="142">VM compute: $7.59 at both levels</text>
    <text class="measured-crossover-desc" x="44" y="166">Always-on billing, visible in</text>
    <text class="measured-crossover-desc" x="44" y="182">one column.</text>
    <text class="measured-crossover-edge" x="44" y="242">fixed</text>
  </g>
  <line class="measured-crossover-line measured-crossover-conn measured-crossover-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#measured-crossover-tip)"/>
  <g class="measured-crossover-stage measured-crossover-s1">
    <rect class="measured-crossover-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="measured-crossover-step" x="280" y="142">02</text>
    <text class="measured-crossover-name" x="306" y="142">At 20M: egress $63.00, compute $7.59</text>
    <text class="measured-crossover-desc" x="280" y="166">Egress is eight times compute,</text>
    <text class="measured-crossover-desc" x="280" y="182">on 40 kB responses.</text>
    <text class="measured-crossover-edge" x="280" y="242">8x</text>
  </g>
  <line class="measured-crossover-line measured-crossover-conn measured-crossover-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#measured-crossover-tip)"/>
  <g class="measured-crossover-stage measured-crossover-s2">
    <rect class="measured-crossover-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="measured-crossover-step" x="516" y="142">03</text>
    <text class="measured-crossover-name" x="542" y="142">Free tier binds on egress at 1.25x</text>
    <text class="measured-crossover-desc" x="516" y="166">Requests would have lasted to</text>
    <text class="measured-crossover-desc" x="516" y="182">100x. Storage 2.5x, compute</text>
    <text class="measured-crossover-desc" x="516" y="198">22.5x.</text>
  </g>
  <line class="measured-crossover-line measured-crossover-conn measured-crossover-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#measured-crossover-tip)"/>
  <g class="measured-crossover-stage measured-crossover-s3">
    <rect class="measured-crossover-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="measured-crossover-step" x="752" y="142">04</text>
    <text class="measured-crossover-name" x="778" y="142">Crossover at 899,599 requests/month</text>
    <text class="measured-crossover-desc" x="752" y="166">Serverless $8.66 against VM</text>
    <text class="measured-crossover-desc" x="752" y="182">$8.67. Under a million.</text>
    <text class="measured-crossover-edge" x="752" y="242">45x</text>
  </g>
  <text class="measured-crossover-sub" x="30" y="304">If the service works at all you will pass that crossover, and the right response is not regret but scheduling: knowing the number in advance turns a surprise bill into a planned migration.</text>
</svg>
