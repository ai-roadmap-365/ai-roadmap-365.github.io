<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each moved cost closer to use.">
  <title>Five pricing changes</title>
  <style>
    .cloud-pricing-eras-bg   { fill: #f8fafc; }
    .cloud-pricing-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-pricing-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-pricing-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-pricing-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-pricing-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cloud-pricing-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .cloud-pricing-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .cloud-pricing-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .cloud-pricing-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .cloud-pricing-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .cloud-pricing-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .cloud-pricing-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .cloud-pricing-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .cloud-pricing-eras-stage { opacity: 1; }

    .cloud-pricing-eras-s0 { animation-delay: 0.00s; }
    .cloud-pricing-eras-e0 { animation-delay: 0.00s; }
    .cloud-pricing-eras-s1 { animation-delay: 1.33s; }
    .cloud-pricing-eras-e1 { animation-delay: 1.33s; }
    .cloud-pricing-eras-s2 { animation-delay: 2.67s; }
    .cloud-pricing-eras-e2 { animation-delay: 2.67s; }
    .cloud-pricing-eras-s3 { animation-delay: 4.00s; }
    .cloud-pricing-eras-e3 { animation-delay: 4.00s; }
    .cloud-pricing-eras-s4 { animation-delay: 5.33s; }
    .cloud-pricing-eras-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .cloud-pricing-eras-conn  { animation: cloud-pricing-eras-trace 8s ease-in-out infinite; }
      .cloud-pricing-eras-stage { animation: cloud-pricing-eras-arrive 8s ease-in-out infinite; }
    }
    @keyframes cloud-pricing-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes cloud-pricing-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .cloud-pricing-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .cloud-pricing-eras-stage { animation: cloud-pricing-eras-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes cloud-pricing-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="cloud-pricing-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="cloud-pricing-eras-bg" width="980" height="322"/>
  <text class="cloud-pricing-eras-h1"  x="30" y="40">Five pricing changes</text>
  <text class="cloud-pricing-eras-sub" x="30" y="64">Each moved cost closer to use.</text>
  <g class="cloud-pricing-eras-stage cloud-pricing-eras-s0">
    <rect class="cloud-pricing-eras-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-pricing-eras-step" x="44" y="142">01</text>
    <text class="cloud-pricing-eras-name" x="70" y="142">Hourly billing, 2006</text>
    <text class="cloud-pricing-eras-desc" x="44" y="166">Rent a machine by the</text>
    <text class="cloud-pricing-eras-desc" x="44" y="182">hour. Capital expenditure</text>
    <text class="cloud-pricing-eras-desc" x="44" y="198">becomes operating cost.</text>
  </g>
  <line class="cloud-pricing-eras-line cloud-pricing-eras-conn cloud-pricing-eras-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#cloud-pricing-eras-tip)"/>
  <g class="cloud-pricing-eras-stage cloud-pricing-eras-s1">
    <rect class="cloud-pricing-eras-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-pricing-eras-step" x="233" y="142">02</text>
    <text class="cloud-pricing-eras-name" x="259" y="142">Per-second billing, 2017</text>
    <text class="cloud-pricing-eras-desc" x="233" y="166">The change that made</text>
    <text class="cloud-pricing-eras-desc" x="233" y="182">autoscaling economically</text>
    <text class="cloud-pricing-eras-desc" x="233" y="198">sensible rather than</text>
  </g>
  <line class="cloud-pricing-eras-line cloud-pricing-eras-conn cloud-pricing-eras-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#cloud-pricing-eras-tip)"/>
  <g class="cloud-pricing-eras-stage cloud-pricing-eras-s2">
    <rect class="cloud-pricing-eras-good" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-pricing-eras-step" x="422" y="142">03</text>
    <text class="cloud-pricing-eras-name" x="448" y="142">Scale-to-zero, 2014 onward</text>
    <text class="cloud-pricing-eras-desc" x="422" y="166">Pay nothing when nothing</text>
    <text class="cloud-pricing-eras-desc" x="422" y="182">happens. Categorical, not</text>
    <text class="cloud-pricing-eras-desc" x="422" y="198">a discount.</text>
  </g>
  <line class="cloud-pricing-eras-line cloud-pricing-eras-conn cloud-pricing-eras-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#cloud-pricing-eras-tip)"/>
  <g class="cloud-pricing-eras-stage cloud-pricing-eras-s3">
    <rect class="cloud-pricing-eras-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-pricing-eras-step" x="611" y="142">04</text>
    <text class="cloud-pricing-eras-name" x="637" y="142">Egress, priced above cost for two decades</text>
    <text class="cloud-pricing-eras-desc" x="611" y="166">The primary mechanism of</text>
    <text class="cloud-pricing-eras-desc" x="611" y="182">lock-in. Under pressure,</text>
    <text class="cloud-pricing-eras-desc" x="611" y="198">not collapsed.</text>
  </g>
  <line class="cloud-pricing-eras-line cloud-pricing-eras-conn cloud-pricing-eras-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#cloud-pricing-eras-tip)"/>
  <g class="cloud-pricing-eras-stage cloud-pricing-eras-s4">
    <rect class="cloud-pricing-eras-box" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="cloud-pricing-eras-step" x="800" y="142">05</text>
    <text class="cloud-pricing-eras-name" x="826" y="142">The free tier as marketing</text>
    <text class="cloud-pricing-eras-desc" x="800" y="166">Generous where a</text>
    <text class="cloud-pricing-eras-desc" x="800" y="182">developer notices, tight</text>
    <text class="cloud-pricing-eras-desc" x="800" y="198">where a growing service</text>
  </g>
  <text class="cloud-pricing-eras-sub" x="30" y="304">Reading the last row as cynicism misses the point: it is a budget with a purpose, and knowing the purpose is how to read the offer accurately rather than optimistically.</text>
</svg>
