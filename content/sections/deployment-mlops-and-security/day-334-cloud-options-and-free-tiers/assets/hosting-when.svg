<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both decidable in advance.">
  <title>Where to start, and when to move</title>
  <style>
    .hosting-when-bg   { fill: #f8fafc; }
    .hosting-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosting-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosting-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosting-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosting-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hosting-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hosting-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .hosting-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .hosting-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .hosting-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .hosting-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .hosting-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hosting-when-row { opacity: 1; }
    .hosting-when-r0 { animation-delay: 0.00s; }
    .hosting-when-r1 { animation-delay: 0.45s; }
    .hosting-when-r2 { animation-delay: 0.90s; }
    .hosting-when-r3 { animation-delay: 1.35s; }
    .hosting-when-r4 { animation-delay: 1.80s; }
    .hosting-when-row { animation: hosting-when-reveal 7.3s ease-in-out infinite; }
    @keyframes hosting-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="hosting-when-bg" width="980" height="390"/>
  <text class="hosting-when-h1"  x="30" y="40">Where to start, and when to move</text>
  <text class="hosting-when-sub" x="30" y="64">Both decidable in advance.</text>
  <rect class="hosting-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="hosting-when-name" x="46" y="122">The choice</text>
  <text class="hosting-when-desc" x="46" y="142">Traffic decides.</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r0" x="46" y="182">Serverless when traffic is unknown or spiky</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r1" x="46" y="216">Free at zero, and being wrong is cheap</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r2" x="46" y="250">A VM once you pass the crossover</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r3" x="46" y="284">Predictable billing when a surprise bill hurts</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r4" x="46" y="318">Worse on average, better at the tail</text>
  <rect class="hosting-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="hosting-when-name" x="526" y="122">Regardless</text>
  <text class="hosting-when-desc" x="526" y="142">Three, always.</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r0" x="526" y="182">Do not choose on the headline number</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r1" x="526" y="216">Compute the binding constraint</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r2" x="526" y="250">Never deploy without a budget alert</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r3" x="526" y="284">A runaway autoscaler is this lesson's version</text>
  <text class="hosting-when-desc hosting-when-row hosting-when-r4" x="526" y="318">And the choice is not permanent</text>
  <text class="hosting-when-sub" x="30" y="372">For a student project the tail matters more than the average: a capped VM is worse value most months and cannot produce the bill that ends the project, which is usually the right trade.</text>
</svg>
