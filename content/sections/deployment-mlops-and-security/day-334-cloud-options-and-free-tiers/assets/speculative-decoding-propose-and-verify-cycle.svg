<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Speculative Decoding Propose and Verify Cycle">
  <title>Speculative Decoding Propose and Verify Cycle</title>
  <defs>
    <style>
      .d334a-bg { fill: #f8fafc; }
      .d334a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d334a-drf { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d334a-tgt { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d334a-out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d334a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d334a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d334a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d334a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d334a-bg" />
  
  <text x="40" y="40" class="d334a-title">Speculative Decoding Execution Cycle (K=4)</text>
  <text x="40" y="65" class="d334a-subtitle">Speculative Decoding Propose and Verify Cycle showing 1B Draft Model proposing K=4 tokens, 70B Target Model verifying all 4 in 1 parallel forward pass, accepting 3 tokens and sampling 1 bonus token</text>
  
  <!-- Step 1: Draft Proposal -->
  <rect x="40" y="110" width="250" height="270" class="d334a-drf" />
  <text x="55" y="145" class="d334a-header" fill="#1d4ed8">1. Fast Draft Model (1B)</text>
  <text x="55" y="180" class="d334a-text">• Model: Llama-3.2-1B</text>
  <text x="55" y="205" class="d334a-text">• Generates K=4 draft tokens:</text>
  <text x="55" y="225" class="d334a-text">  ["the", "quick", "brown", "fox"]</text>
  <text x="55" y="255" class="d334a-text">• Draft Time: 8 ms total</text>
  <text x="55" y="295" class="d334a-text" font-weight="600" fill="#1d4ed8">Low Latency Proposal</text>
  <text x="55" y="320" class="d334a-text">Super-fast speculation</text>
  
  <!-- Step 2: Target Verification -->
  <rect x="325" y="110" width="250" height="270" class="d334a-tgt" />
  <text x="340" y="145" class="d334a-header" fill="#7e22ce">2. Target Model (70B)</text>
  <text x="340" y="180" class="d334a-text">• Model: Llama-3.1-70B</text>
  <text x="340" y="205" class="d334a-text">• **1 Parallel Forward Pass**</text>
  <text x="340" y="230" class="d334a-text">• Verifies all 4 tokens simultaneously</text>
  <text x="340" y="255" class="d334a-text">• Token 1 ("the"): Accepted (0.98)</text>
  <text x="340" y="275" class="d334a-text">• Token 2 ("quick"): Accepted (0.94)</text>
  <text x="340" y="295" class="d334a-text">• Token 3 ("brown"): Accepted (0.88)</text>
  <text x="340" y="315" class="d334a-text">• Token 4 ("dog"): Replaced ("fox")</text>
  
  <!-- Step 3: Yield Output -->
  <rect x="610" y="110" width="250" height="270" class="d334a-out" />
  <text x="625" y="145" class="d334a-header" fill="#15803d">3. Emitted Tokens</text>
  <text x="625" y="180" class="d334a-text">• **Accepted:** 3 tokens</text>
  <text x="625" y="205" class="d334a-text">• **Target Correction:** 1 token</text>
  <text x="625" y="230" class="d334a-text">• **Total Yield:** 4 tokens</text>
  <text x="625" y="255" class="d334a-text">• Target Forward Passes: 1</text>
  <text x="625" y="295" class="d334a-text" font-weight="600" fill="#15803d">Effective Speedup: 2.8x</text>
  <text x="625" y="320" class="d334a-text">Exact 70B output quality</text>
</svg>