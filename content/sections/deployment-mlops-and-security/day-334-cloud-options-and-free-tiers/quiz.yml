questions:
  - question: Why does the always-on VM show compute of $7.59 whether the service handles 20,000 or
      20,000,000 requests a month?
    options:
      - Because the model caps compute cost at a maximum
      - Because the extra requests are absorbed by a free allowance
      - 'Always-on bills by the hour, not by usage'
      - Because compute is rounded to the nearest ten dollars
    answer_index: 2
    explanation: The flat compute line is the defining property of always-on billing, and it is what
      makes the ranking a function of traffic rather than a fixed preference.
  - question: The free tier advertises two million requests and ends at 1.25x current traffic. What
      happened?
    options:
      - The request counter includes failed requests
      - Storage costs pushed the total above zero
      - The tier expired after a trial period
      - 'A free tier ends when the first allowance runs out'
    answer_index: 3
    explanation: Free tiers are generous on the dimension in the headline and tight on one that is
      not. Computing headroom per dimension is what reveals which.
  - question: At 1000x traffic the VM's egress is $63.00 against $7.59 of compute. What does that
      suggest?
    options:
      - 'Comparing on compute price alone is misleading'
      - That the VM is undersized and should be upgraded
      - That egress should be disabled for cost reasons
      - That storage is the real problem
    answer_index: 0
    explanation: Eight times the compute cost, on a service whose responses are forty kilobytes.
      Almost nobody chooses a host on egress and almost everybody should look at it.
  - question: Why is `None` a useful return from the crossover function rather than a failure?
    options:
      - Because it signals that the inputs were invalid
      - 'The ordering never changes across the range tested'
      - Because it indicates the two options are the same product
      - Because bisection cannot handle non-linear pricing
    answer_index: 1
    explanation: A crossover that does not exist is an answer. It means you can pick the cheaper
      option and stop thinking about it.
  - question: The model quotes a single 1 vCPU VM at $90.77 for twenty million requests a month. What
      is it not telling you?
    options:
      - That the price excludes tax
      - That the VM would need a different operating system
      - 'It prices a workload without asking if it can serve it'
      - That the figure is annual rather than monthly
    answer_index: 2
    explanation: A model that answers confidently outside its valid range is more dangerous than one
      that refuses, because the confident wrong answer gets pasted into a decision document.
