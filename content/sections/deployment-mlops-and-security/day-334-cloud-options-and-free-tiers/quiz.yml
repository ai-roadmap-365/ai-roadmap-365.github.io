questions:
- question: How does Speculative Decoding achieve 2x to 3x token generation speedups without altering
    the target model's output probability distribution?
  options:
  - By skipping every second layer
  - A fast, compact 'draft model' (e.g. 1B) speculatively generates K candidate tokens quickly; the large
    'target model' (e.g. 70B) evaluates all K tokens in parallel within a SINGLE forward pass, accepting
    matching tokens using modified rejection sampling
  - By generating random words
  - By quantizing the model to 1 bit
  answer_index: 1
  explanation: Speculative decoding generates K draft tokens quickly and verifies them in parallel in
    one target model forward pass.
- question: What is the mathematical condition for accepting a draft token $x$ proposed by draft distribution
    $q(x)$ under target distribution $p(x)$?
  options:
  - If the token length is greater than 5 characters
  - The token is accepted with probability $\min(1, \frac{p(x)}{q(x)})$; if rejected, a replacement token
    is sampled from the normalized residual distribution $\max(0, p(x) - q(x))$, mathematically guaranteeing
    the output matches target distribution $p(x)$ exactly
  - The token is accepted only if $p(x) == 1.0$
  - The token is accepted if the draft model is faster than 100 tok/s
  answer_index: 1
  explanation: Modified rejection sampling guarantees exact mathematical equivalence to sampling directly
    from the target model.
- question: How does Radix Tree Prompt Prefix Caching (as implemented in SGLang and vLLM) optimize multi-turn
    chat applications?
  options:
  - By deleting conversation history after 2 turns
  - By indexing previously computed KV cache blocks in a Radix Tree; when a new request shares a common
    system prompt or conversation prefix, the server reuses the stored KV tensors directly, bypassing
    100% of prefill compute for the shared tokens
  - By storing text on mechanical tape drives
  - By converting prompts to uppercase
  answer_index: 1
  explanation: Radix tree prefix caching reuses pre-computed KV tensors for shared prompt prefixes, slashing
    TTFT to near-zero.
- question: What is 'StreamingLLM' / Heavy Hitter (H2O) KV Cache Eviction?
  options:
  - Deleting the entire model on every token
  - Techniques that keep only the initial 'attention sink' tokens (first 4 tokens) and the most recent
    $N$ sliding-window tokens in the KV cache, allowing models to run infinite context lengths without
    VRAM exhaustion
  - Streaming audio while generating text
  - A method for compressing images
  answer_index: 1
  explanation: Retaining initial attention sinks and recent sliding tokens enables stable infinite-length
    stream generation in fixed VRAM.
- question: What is the primary factor that dictates the overall speedup in speculative decoding?
  options:
  - The color of the server chassis
  - 'The Draft Token Acceptance Rate ($\alpha$): if $\alpha > 0.70$ (70% of draft tokens accepted), generation
    speed doubles or triples; if $\alpha < 0.30$ (high rejection rate), speculative decoding overhead
    can be slower than baseline'
  - The number of GPUs
  - The length of the prompt
  answer_index: 1
  explanation: "High draft token acceptance rates ($\alpha$) drive speedup; low acceptance rates introduce\
    \ validation overhead."
