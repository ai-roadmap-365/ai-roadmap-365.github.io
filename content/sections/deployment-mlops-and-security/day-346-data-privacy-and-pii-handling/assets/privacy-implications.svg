<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="One of them is nearly free.">
  <title>Four consequences of doing this properly</title>
  <style>
    .privacy-implications-bg   { fill: #f8fafc; }
    .privacy-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-implications-stage { opacity: 1; }

    .privacy-implications-s0 { animation-delay: 0.00s; }
    .privacy-implications-e0 { animation-delay: 0.00s; }
    .privacy-implications-s1 { animation-delay: 1.28s; }
    .privacy-implications-e1 { animation-delay: 1.28s; }
    .privacy-implications-s2 { animation-delay: 2.56s; }
    .privacy-implications-e2 { animation-delay: 2.56s; }
    .privacy-implications-s3 { animation-delay: 3.84s; }
    .privacy-implications-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-implications-conn  { animation: privacy-implications-trace 6.4s ease-in-out infinite; }
      .privacy-implications-stage { animation: privacy-implications-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes privacy-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-implications-stage { animation: privacy-implications-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-implications-bg" width="980" height="322"/>
  <text class="privacy-implications-h1"  x="30" y="40">Four consequences of doing this properly</text>
  <text class="privacy-implications-sub" x="30" y="64">One of them is nearly free.</text>
  <g class="privacy-implications-stage privacy-implications-s0">
    <rect class="privacy-implications-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-implications-step" x="44" y="142">01</text>
    <text class="privacy-implications-name" x="70" y="142">Tokenisation costs about 1.5 ms</text>
    <text class="privacy-implications-desc" x="44" y="166">Regex forward and reverse, in</text>
    <text class="privacy-implications-desc" x="44" y="182">process. Negligible.</text>
    <text class="privacy-implications-edge" x="44" y="242">latency</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s1">
    <rect class="privacy-implications-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-implications-step" x="280" y="142">02</text>
    <text class="privacy-implications-name" x="306" y="142">Epsilon trades utility for privacy</text>
    <text class="privacy-implications-desc" x="280" y="166">0.5 to 2.0 is where reporting</text>
    <text class="privacy-implications-desc" x="280" y="182">stays accurate.</text>
    <text class="privacy-implications-edge" x="280" y="242">utility</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s2">
    <rect class="privacy-implications-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-implications-step" x="516" y="142">03</text>
    <text class="privacy-implications-name" x="542" y="142">Models memorise rare sequences</text>
    <text class="privacy-implications-desc" x="516" y="166">Sanitise before indexing and</text>
    <text class="privacy-implications-desc" x="516" y="182">before fine-tuning, not after.</text>
    <text class="privacy-implications-edge" x="516" y="242">memorisation</text>
  </g>
  <line class="privacy-implications-line privacy-implications-conn privacy-implications-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#privacy-implications-tip)"/>
  <g class="privacy-implications-stage privacy-implications-s3">
    <rect class="privacy-implications-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-implications-step" x="752" y="142">04</text>
    <text class="privacy-implications-name" x="778" y="142">Regulated industries can use frontier models</text>
    <text class="privacy-implications-desc" x="752" y="166">Because raw PII never crosses</text>
    <text class="privacy-implications-desc" x="752" y="182">the perimeter.</text>
    <text class="privacy-implications-edge" x="752" y="242">compliance</text>
  </g>
  <text class="privacy-implications-sub" x="30" y="304">The fourth is the commercial argument for the whole practice: a token vault is what makes a bank or a hospital able to use a commercial model at all, which is worth considerably more than the latency it costs.</text>
</svg>
