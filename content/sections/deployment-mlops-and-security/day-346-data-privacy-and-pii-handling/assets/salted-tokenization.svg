<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Sequential tokens correlate.">
  <title>Why surrogates need salting</title>
  <style>
    .salted-tokenization-bg   { fill: #f8fafc; }
    .salted-tokenization-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .salted-tokenization-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .salted-tokenization-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .salted-tokenization-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .salted-tokenization-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .salted-tokenization-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .salted-tokenization-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .salted-tokenization-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .salted-tokenization-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .salted-tokenization-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .salted-tokenization-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .salted-tokenization-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .salted-tokenization-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .salted-tokenization-stage { opacity: 1; }

    .salted-tokenization-s0 { animation-delay: 0.00s; }
    .salted-tokenization-e0 { animation-delay: 0.00s; }
    .salted-tokenization-s1 { animation-delay: 1.50s; }
    .salted-tokenization-e1 { animation-delay: 1.50s; }
    .salted-tokenization-s2 { animation-delay: 3.00s; }
    .salted-tokenization-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .salted-tokenization-conn  { animation: salted-tokenization-trace 6s ease-in-out infinite; }
      .salted-tokenization-stage { animation: salted-tokenization-arrive 6s ease-in-out infinite; }
    }
    @keyframes salted-tokenization-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes salted-tokenization-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .salted-tokenization-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .salted-tokenization-stage { animation: salted-tokenization-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes salted-tokenization-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="salted-tokenization-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="salted-tokenization-bg" width="980" height="322"/>
  <text class="salted-tokenization-h1"  x="30" y="40">Why surrogates need salting</text>
  <text class="salted-tokenization-sub" x="30" y="64">Sequential tokens correlate.</text>
  <g class="salted-tokenization-stage salted-tokenization-s0">
    <rect class="salted-tokenization-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="salted-tokenization-step" x="44" y="142">01</text>
    <text class="salted-tokenization-name" x="70" y="142">Per-tenant salts in an HSM</text>
    <text class="salted-tokenization-desc" x="44" y="166">HMAC-SHA256. The same value tokenises</text>
    <text class="salted-tokenization-desc" x="44" y="182">differently for different tenants.</text>
    <text class="salted-tokenization-edge" x="44" y="242">256-bit</text>
  </g>
  <line class="salted-tokenization-line salted-tokenization-conn salted-tokenization-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#salted-tokenization-tip)"/>
  <g class="salted-tokenization-stage salted-tokenization-s1">
    <rect class="salted-tokenization-warn" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="salted-tokenization-step" x="359" y="142">02</text>
    <text class="salted-tokenization-name" x="385" y="142">Ephemeral session IVs</text>
    <text class="salted-tokenization-desc" x="359" y="166">Identical inputs produce distinct surrogates</text>
    <text class="salted-tokenization-desc" x="359" y="182">across sessions.</text>
    <text class="salted-tokenization-edge" x="359" y="242">no linkage</text>
  </g>
  <line class="salted-tokenization-line salted-tokenization-conn salted-tokenization-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#salted-tokenization-tip)"/>
  <g class="salted-tokenization-stage salted-tokenization-s2">
    <rect class="salted-tokenization-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="salted-tokenization-step" x="674" y="142">03</text>
    <text class="salted-tokenization-name" x="700" y="142">Mappings inside an enclave</text>
    <text class="salted-tokenization-desc" x="674" y="166">Hardware-isolated pages that a host root user</text>
    <text class="salted-tokenization-desc" x="674" y="182">cannot inspect.</text>
  </g>
  <text class="salted-tokenization-sub" x="30" y="304">Without the second property the vault leaks by frequency analysis: a surrogate that is stable across sessions is itself an identifier, and correlating two conversations re-identifies the person.</text>
</svg>
