<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One legal, one cosmetic.">
  <title>Two things that are not controls</title>
  <style>
    .not-a-tos-bg   { fill: #f8fafc; }
    .not-a-tos-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tos-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tos-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tos-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tos-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-a-tos-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-tos-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-a-tos-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-a-tos-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-a-tos-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-a-tos-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-a-tos-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-a-tos-row { opacity: 1; }
    .not-a-tos-r0 { animation-delay: 0.00s; }
    .not-a-tos-r1 { animation-delay: 0.45s; }
    .not-a-tos-r2 { animation-delay: 0.90s; }
    .not-a-tos-r3 { animation-delay: 1.35s; }
    .not-a-tos-r4 { animation-delay: 1.80s; }
    .not-a-tos-row { animation: not-a-tos-reveal 7.3s ease-in-out infinite; }
    @keyframes not-a-tos-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-a-tos-bg" width="980" height="390"/>
  <text class="not-a-tos-h1"  x="30" y="40">Two things that are not controls</text>
  <text class="not-a-tos-sub" x="30" y="64">One legal, one cosmetic.</text>
  <rect class="not-a-tos-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-tos-name" x="46" y="122">Technical controls</text>
  <text class="not-a-tos-desc" x="46" y="142">Enforced at your boundary.</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r0" x="46" y="182">PII never leaves the perimeter unpseudonymised</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r1" x="46" y="216">Noise calibrated to a stated epsilon</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r2" x="46" y="250">k-anonymous equivalence classes</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r3" x="46" y="284">Key enclaves supporting targeted deletion</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r4" x="46" y="318">Verifiable, and auditable</text>
  <rect class="not-a-tos-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-a-tos-name" x="526" y="122">Not controls</text>
  <text class="not-a-tos-desc" x="526" y="142">Two, both common.</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r0" x="526" y="182">A vendor's terms of service</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r1" x="526" y="216">A promise, not a barrier</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r2" x="526" y="250">Asterisk masking</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r3" x="526" y="284">Defeated by correlation</text>
  <text class="not-a-tos-desc not-a-tos-row not-a-tos-r4" x="526" y="318">Neither survives a regulator's question</text>
  <text class="not-a-tos-sub" x="30" y="372">Terms of service are worth having and they are a remedy rather than a control: they describe what happens after the data has already left, which is not the same as it not leaving.</text>
</svg>
