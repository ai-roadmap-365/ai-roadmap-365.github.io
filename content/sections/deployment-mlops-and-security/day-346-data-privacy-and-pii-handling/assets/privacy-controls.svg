<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each answers a different question.">
  <title>Four privacy controls</title>
  <style>
    .privacy-controls-bg   { fill: #f8fafc; }
    .privacy-controls-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-controls-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-controls-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-controls-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-controls-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .privacy-controls-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .privacy-controls-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .privacy-controls-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .privacy-controls-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .privacy-controls-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .privacy-controls-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .privacy-controls-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .privacy-controls-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .privacy-controls-stage { opacity: 1; }

    .privacy-controls-s0 { animation-delay: 0.00s; }
    .privacy-controls-e0 { animation-delay: 0.00s; }
    .privacy-controls-s1 { animation-delay: 1.28s; }
    .privacy-controls-e1 { animation-delay: 1.28s; }
    .privacy-controls-s2 { animation-delay: 2.56s; }
    .privacy-controls-e2 { animation-delay: 2.56s; }
    .privacy-controls-s3 { animation-delay: 3.84s; }
    .privacy-controls-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .privacy-controls-conn  { animation: privacy-controls-trace 6.4s ease-in-out infinite; }
      .privacy-controls-stage { animation: privacy-controls-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes privacy-controls-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes privacy-controls-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .privacy-controls-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .privacy-controls-stage { animation: privacy-controls-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes privacy-controls-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="privacy-controls-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="privacy-controls-bg" width="980" height="322"/>
  <text class="privacy-controls-h1"  x="30" y="40">Four privacy controls</text>
  <text class="privacy-controls-sub" x="30" y="64">Each answers a different question.</text>
  <g class="privacy-controls-stage privacy-controls-s0">
    <rect class="privacy-controls-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-controls-step" x="44" y="142">01</text>
    <text class="privacy-controls-name" x="70" y="142">Token vault</text>
    <text class="privacy-controls-desc" x="44" y="166">Real identifiers replaced by</text>
    <text class="privacy-controls-desc" x="44" y="182">surrogates before the prompt</text>
    <text class="privacy-controls-desc" x="44" y="198">leaves your perimeter.</text>
    <text class="privacy-controls-edge" x="44" y="242">pseudonymise</text>
  </g>
  <line class="privacy-controls-line privacy-controls-conn privacy-controls-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#privacy-controls-tip)"/>
  <g class="privacy-controls-stage privacy-controls-s1">
    <rect class="privacy-controls-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-controls-step" x="280" y="142">02</text>
    <text class="privacy-controls-name" x="306" y="142">Differential privacy</text>
    <text class="privacy-controls-desc" x="280" y="166">Calibrated noise, with a</text>
    <text class="privacy-controls-desc" x="280" y="182">provable bound on what any</text>
    <text class="privacy-controls-desc" x="280" y="198">individual contributes.</text>
    <text class="privacy-controls-edge" x="280" y="242">epsilon</text>
  </g>
  <line class="privacy-controls-line privacy-controls-conn privacy-controls-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#privacy-controls-tip)"/>
  <g class="privacy-controls-stage privacy-controls-s2">
    <rect class="privacy-controls-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-controls-step" x="516" y="142">03</text>
    <text class="privacy-controls-name" x="542" y="142">k-anonymity</text>
    <text class="privacy-controls-desc" x="516" y="166">Equivalence classes of at least</text>
    <text class="privacy-controls-desc" x="516" y="182">k, so linkage cannot single</text>
    <text class="privacy-controls-desc" x="516" y="198">anybody out.</text>
  </g>
  <line class="privacy-controls-line privacy-controls-conn privacy-controls-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#privacy-controls-tip)"/>
  <g class="privacy-controls-stage privacy-controls-s3">
    <rect class="privacy-controls-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="privacy-controls-step" x="752" y="142">04</text>
    <text class="privacy-controls-name" x="778" y="142">Key erasure</text>
    <text class="privacy-controls-desc" x="752" y="166">Delete the mapping and every</text>
    <text class="privacy-controls-desc" x="752" y="182">downstream record is permanently</text>
    <text class="privacy-controls-desc" x="752" y="198">de-identified.</text>
    <text class="privacy-controls-edge" x="752" y="242">Article 17</text>
  </g>
  <text class="privacy-controls-sub" x="30" y="304">The fourth is the one that makes erasure tractable: you cannot delete a person from fine-tuned weights, and you can delete the key that connects a surrogate to a person.</text>
</svg>
