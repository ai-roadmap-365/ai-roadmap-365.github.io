<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="A dial with two labelled ends.">
  <title>Choosing epsilon</title>
  <style>
    .epsilon-tradeoff-bg   { fill: #f8fafc; }
    .epsilon-tradeoff-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .epsilon-tradeoff-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .epsilon-tradeoff-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .epsilon-tradeoff-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .epsilon-tradeoff-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .epsilon-tradeoff-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .epsilon-tradeoff-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .epsilon-tradeoff-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .epsilon-tradeoff-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .epsilon-tradeoff-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .epsilon-tradeoff-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .epsilon-tradeoff-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .epsilon-tradeoff-row { opacity: 1; }
    .epsilon-tradeoff-r0 { animation-delay: 0.00s; }
    .epsilon-tradeoff-r1 { animation-delay: 0.45s; }
    .epsilon-tradeoff-r2 { animation-delay: 0.90s; }
    .epsilon-tradeoff-r3 { animation-delay: 1.35s; }
    .epsilon-tradeoff-r4 { animation-delay: 1.80s; }
    .epsilon-tradeoff-row { animation: epsilon-tradeoff-reveal 7.3s ease-in-out infinite; }
    @keyframes epsilon-tradeoff-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="epsilon-tradeoff-bg" width="980" height="390"/>
  <text class="epsilon-tradeoff-h1"  x="30" y="40">Choosing epsilon</text>
  <text class="epsilon-tradeoff-sub" x="30" y="64">A dial with two labelled ends.</text>
  <rect class="epsilon-tradeoff-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="epsilon-tradeoff-name" x="46" y="122">epsilon = 0.1</text>
  <text class="epsilon-tradeoff-desc" x="46" y="142">Very strong privacy.</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r0" x="46" y="182">Large noise variance</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r1" x="46" y="216">Individual contribution near-undetectable</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r2" x="46" y="250">Aggregate answers become imprecise</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r3" x="46" y="284">Right for a public release</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r4" x="46" y="318">Often unusable for reporting</text>
  <rect class="epsilon-tradeoff-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="epsilon-tradeoff-name" x="526" y="122">epsilon = 0.5 to 2.0</text>
  <text class="epsilon-tradeoff-desc" x="526" y="142">The working range.</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r0" x="526" y="182">Noise proportionate to the query</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r1" x="526" y="216">Business reporting remains accurate</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r2" x="526" y="250">A defensible published number</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r3" x="526" y="284">Right for internal analytics</text>
  <text class="epsilon-tradeoff-desc epsilon-tradeoff-row epsilon-tradeoff-r4" x="526" y="318">The usual enterprise choice</text>
  <text class="epsilon-tradeoff-sub" x="30" y="372">The value of epsilon over any other privacy control is that it is a number you chose and can defend, which turns "is this private enough" from an argument into a stated parameter.</text>
</svg>
