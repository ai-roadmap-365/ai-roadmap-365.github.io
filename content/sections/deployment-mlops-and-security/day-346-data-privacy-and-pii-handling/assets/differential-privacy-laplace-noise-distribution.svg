<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Differential Privacy Laplace Noise Distribution">
  <title>Differential Privacy Laplace Noise Distribution</title>
  <defs>
    <style>
      .d346b-bg { fill: #f8fafc; }
      .d346b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d346b-chart { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d346b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d346b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d346b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d346b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d346b-bg" />
  
  <text x="40" y="40" class="d346a-title">Differential Privacy: Laplace Noise Scaling</text>
  <text x="40" y="65" class="d346a-subtitle">Differential Privacy Laplace Noise Distribution comparing probability density curves for different epsilon privacy budget parameters</text>
  
  <rect x="40" y="110" width="820" height="270" class="d346b-chart" />
  
  <text x="60" y="145" class="d346b-header" fill="#1d4ed8">Laplace Probability Density: PDF(x) = (1 / 2b) * exp(-|x| / b), where b = Delta f / epsilon</text>
  
  <!-- Curve 1: Low Epsilon (Strong Privacy, Wide Noise) -->
  <path d="M 100 330 Q 450 180 800 330" fill="none" stroke="#ef4444" stroke-width="3" />
  <text x="120" y="240" class="d346b-text" fill="#ef4444" font-weight="600">epsilon = 0.5 (Strong Privacy, High Noise / Dispersion)</text>
  
  <!-- Curve 2: Medium Epsilon (Balanced) -->
  <path d="M 200 330 Q 450 140 700 330" fill="none" stroke="#3b82f6" stroke-width="3" />
  <text x="240" y="200" class="d346b-text" fill="#3b82f6" font-weight="600">epsilon = 1.0 (Balanced Privacy &amp; Statistical Utility)</text>
  
  <!-- Curve 3: High Epsilon (Weak Privacy, Sharp Spike) -->
  <path d="M 320 330 Q 450 90 580 330" fill="none" stroke="#10b981" stroke-width="3" />
  <text x="360" y="160" class="d346b-text" fill="#10b981" font-weight="600">epsilon = 2.0 (High Utility, Lower Privacy Guarantee)</text>
  
  <line x1="60" y1="330" x2="840" y2="330" stroke="#64748b" stroke-width="2" />
  <text x="430" y="360" class="d346b-text" font-weight="600">Noise Value (x)</text>
</svg>