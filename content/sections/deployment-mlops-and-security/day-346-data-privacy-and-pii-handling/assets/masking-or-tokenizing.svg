<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Asterisks against a vault.">
  <title>Masking is not privacy</title>
  <style>
    .masking-or-tokenizing-bg   { fill: #f8fafc; }
    .masking-or-tokenizing-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-or-tokenizing-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-or-tokenizing-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-or-tokenizing-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-or-tokenizing-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .masking-or-tokenizing-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .masking-or-tokenizing-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .masking-or-tokenizing-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .masking-or-tokenizing-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .masking-or-tokenizing-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .masking-or-tokenizing-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .masking-or-tokenizing-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .masking-or-tokenizing-row { opacity: 1; }
    .masking-or-tokenizing-r0 { animation-delay: 0.00s; }
    .masking-or-tokenizing-r1 { animation-delay: 0.45s; }
    .masking-or-tokenizing-r2 { animation-delay: 0.90s; }
    .masking-or-tokenizing-r3 { animation-delay: 1.35s; }
    .masking-or-tokenizing-r4 { animation-delay: 1.80s; }
    .masking-or-tokenizing-row { animation: masking-or-tokenizing-reveal 7.3s ease-in-out infinite; }
    @keyframes masking-or-tokenizing-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="masking-or-tokenizing-bg" width="980" height="390"/>
  <text class="masking-or-tokenizing-h1"  x="30" y="40">Masking is not privacy</text>
  <text class="masking-or-tokenizing-sub" x="30" y="64">Asterisks against a vault.</text>
  <rect class="masking-or-tokenizing-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="masking-or-tokenizing-name" x="46" y="122">Masking</text>
  <text class="masking-or-tokenizing-desc" x="46" y="142">123-**-****</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r0" x="46" y="182">Looks redacted</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r1" x="46" y="216">Retains the distinguishing digits</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r2" x="46" y="250">Correlation attacks reassemble it</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r3" x="46" y="284">No mathematical claim at all</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r4" x="46" y="318">And it is irreversible when you need it back</text>
  <rect class="masking-or-tokenizing-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="masking-or-tokenizing-name" x="526" y="122">Tokenising</text>
  <text class="masking-or-tokenizing-desc" x="526" y="142">&lt;PATIENT_904&gt;</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r0" x="526" y="182">No fragment of the original survives</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r1" x="526" y="216">The mapping lives in a separate enclave</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r2" x="526" y="250">Salted per tenant, per session</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r3" x="526" y="284">Reversible for the physician, nobody else</text>
  <text class="masking-or-tokenizing-desc masking-or-tokenizing-row masking-or-tokenizing-r4" x="526" y="318">And erasable by deleting the key</text>
  <text class="masking-or-tokenizing-sub" x="30" y="372">The reversibility on the right is the practical win: the model reasons about a surrogate, the answer comes back, and the surrogate is swapped for a real name at the boundary rather than never being available.</text>
</svg>
