<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Zero-Knowledge PII Token Vault Pipeline">
  <title>Zero-Knowledge PII Token Vault Pipeline</title>
  <defs>
    <style>
      .d346a-bg { fill: #f8fafc; }
      .d346a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d346a-vlt { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d346a-llm { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d346a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d346a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d346a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d346a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d346a-bg" />
  
  <text x="40" y="40" class="d346a-title">Zero-Knowledge PII Token Vault Architecture</text>
  <text x="40" y="65" class="d346a-subtitle">Zero-Knowledge PII Token Vault Pipeline showing user prompt ingress, regex entity tokenization, isolated encrypted surrogate key mapping, sanitized LLM inference, and outbound detokenization</text>
  
  <!-- Ingress -->
  <rect x="40" y="110" width="240" height="270" class="d346a-card" />
  <text x="55" y="145" class="d346a-header" fill="#0f172a">1. Client Ingress</text>
  <text x="55" y="180" class="d346a-text">Raw User Message:</text>
  <text x="55" y="205" class="d346a-text" fill="#b91c1c">"My name is Alice Smith,</text>
  <text x="55" y="225" class="d346a-text" fill="#b91c1c">SSN is 987-65-4321,</text>
  <text x="55" y="245" class="d346a-text" fill="#b91c1c">email is alice@corp.com"</text>
  <text x="55" y="295" class="d346a-text" font-weight="600">Untrusted Raw PII Ingress</text>
  <text x="55" y="320" class="d346a-text">Sensitive Data Present</text>
  
  <!-- Token Vault Enclave -->
  <rect x="310" y="110" width="280" height="270" class="d346a-vlt" />
  <text x="325" y="145" class="d346a-header" fill="#15803d">2. Isolated PII Token Vault</text>
  <text x="325" y="180" class="d346a-text">• NER / Regex Entity Scrubber</text>
  <text x="325" y="205" class="d346a-text">• Encrypted Key-Value Enclave</text>
  <text x="325" y="235" class="d346a-text">Mappings (In-Memory Only):</text>
  <text x="325" y="255" class="d346a-text">Alice Smith ➔ &lt;PERSON_1&gt;</text>
  <text x="325" y="275" class="d346a-text">987-65-4321 ➔ &lt;SSN_1&gt;</text>
  <text x="325" y="295" class="d346a-text">alice@corp.com ➔ &lt;EMAIL_1&gt;</text>
  <text x="325" y="335" class="d346a-text" font-weight="600" fill="#15803d">Bidirectional Pseudonymization</text>
  
  <!-- Sanitized LLM Inference -->
  <rect x="620" y="110" width="240" height="270" class="d346a-llm" />
  <text x="635" y="145" class="d346a-header" fill="#1d4ed8">3. Public Cloud LLM API</text>
  <text x="635" y="180" class="d346a-text">Sanitized Prompt Received:</text>
  <text x="635" y="205" class="d346a-text" fill="#15803d">"My name is &lt;PERSON_1&gt;,</text>
  <text x="635" y="225" class="d346a-text" fill="#15803d">SSN is &lt;SSN_1&gt;,</text>
  <text x="635" y="245" class="d346a-text" fill="#15803d">email is &lt;EMAIL_1&gt;"</text>
  <text x="635" y="295" class="d346a-text" font-weight="600">Zero PII Leakage</text>
  <text x="635" y="320" class="d346a-text">100% GDPR / HIPAA Compliant</text>
</svg>