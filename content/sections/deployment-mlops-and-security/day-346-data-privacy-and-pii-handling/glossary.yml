terms:
- term: Differential Privacy (DP)
  definition: A mathematical framework bounding individual privacy loss in statistical releases.
- term: Epsilon (Privacy Budget)
  definition: The privacy parameter quantifying maximum allowable information leakage; smaller epsilon
    means stronger privacy.
- term: Laplace Mechanism
  definition: A DP algorithm adding noise drawn from a zero-mean Laplace distribution scaled by sensitivity/epsilon.
- term: PII Token Vault
  definition: An isolated enclave replacing sensitive personal data with cryptographic surrogates before
    LLM ingress.
- term: Pseudonymization
  definition: Processing personal data such that it can no longer be attributed to a specific subject
    without additional stored key information.
- term: k-Anonymity
  definition: A data protection standard where each combination of quasi-identifiers matches at least
    k records.
- term: Machine Unlearning
  definition: Algorithms designed to scrub memorized training samples from neural network weights without
    full re-training.
- term: Quasi-Identifier
  definition: Non-unique attributes (e.g. ZIP code, birth date, gender) that combine to uniquely identify
    an individual.
