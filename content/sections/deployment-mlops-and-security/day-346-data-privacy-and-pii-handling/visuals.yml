  description: Architectural pipeline diagram illustrating bidirectional PII tokenization.
- id: differential-privacy-laplace-noise-distribution
  file: assets/differential-privacy-laplace-noise-distribution.svg
  type: diagram
  title: Differential Privacy Laplace Noise Distribution
  alt: Differential Privacy Laplace Noise Distribution comparing probability density curves for different
    epsilon privacy budget parameters
  description: Mathematical chart illustrating Laplace noise scaling under varying epsilon privacy budgets.
- id: privacy-controls
  file: assets/privacy-controls.svg
  type: diagram
  title: 'Four privacy controls'
  alt: 'Diagram: the four privacy controls for an AI system'
  description: 'A four-stage description of AI privacy controls covering token vaults, differential privacy, k-anonymity and key-based erasure.'
- id: masking-or-tokenizing
  file: assets/masking-or-tokenizing.svg
  type: diagram
  title: 'Masking is not privacy'
  alt: 'Diagram: asterisk masking compared with reversible tokenisation'
  description: 'A two-column comparison of character masking against surrogate tokenisation with a separate key store.'
- id: privacy-eras
  file: assets/privacy-eras.svg
  type: diagram
  title: 'Four eras of privacy engineering'
  alt: 'Diagram: the progression from k-anonymity to machine unlearning'
  description: 'A four-stage progression of privacy engineering from quasi-identifier research through differential privacy and DP-SGD to token vaults and machine unlearning.'
- id: not-a-tos
  file: assets/not-a-tos.svg
  type: diagram
  title: 'Two things that are not controls'
  alt: 'Diagram: technical privacy controls compared with two substitutes for them'
  description: 'A two-column comparison of technical de-identification against relying on vendor terms or simple masking.'
- id: laplace-mechanism
  file: assets/laplace-mechanism.svg
  type: diagram
  title: 'The Laplace mechanism'
  alt: 'Diagram: how the Laplace mechanism produces a differentially private answer'
  description: 'A four-stage description of the Laplace mechanism covering sensitivity, the epsilon budget, noise scale and the resulting guarantee.'
- id: epsilon-tradeoff
  file: assets/epsilon-tradeoff.svg
  type: diagram
  title: 'Choosing epsilon'
  alt: 'Diagram: a small epsilon compared with a larger one'
  description: 'A two-column comparison of a strict privacy budget against a looser one, in terms of noise and analytical utility.'
- id: coin-flip-survey
  file: assets/coin-flip-survey.svg
  type: diagram
  title: 'The coin-flip survey'
  alt: 'Diagram: a randomised response protocol providing deniability and aggregate accuracy'
  description: 'A two-column comparison of what a randomised response protocol hides from an observer against what it preserves for the analyst.'
- id: unlearning-options
  file: assets/unlearning-options.svg
  type: diagram
  title: 'Three ways to forget'
