  description: 'A three-stage description of hardened tokenisation covering per-tenant HMAC salts, ephemeral session initialisation vectors and hardware enclave isolation.'
- id: privacy-implications
  file: assets/privacy-implications.svg
  type: diagram
  title: 'Four consequences of doing this properly'
  alt: 'Diagram: the latency, utility, memorisation and compliance implications of AI privacy controls'
  description: 'A four-stage description of privacy implications covering tokenisation latency, the epsilon trade-off, training memorisation and cloud model usage.'
- id: privacy-when
  file: assets/privacy-when.svg
  type: diagram
  title: 'Where the full stack is required'
  alt: 'Diagram: when full privacy engineering is required and what applies at any scale'
  description: 'A two-column comparison of systems requiring token vaults and differential privacy against those where lighter handling is proportionate.'
