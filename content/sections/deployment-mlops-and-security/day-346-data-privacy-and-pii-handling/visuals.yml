visuals:
- id: zero-knowledge-pii-token-vault-pipeline
  file: assets/zero-knowledge-pii-token-vault-pipeline.svg
  type: diagram
  title: Zero-Knowledge PII Token Vault Pipeline
  alt: Zero-Knowledge PII Token Vault Pipeline showing user prompt ingress, regex entity tokenization,
