questions:
- question: What is the primary mathematical guarantee provided by (epsilon, delta)-Differential Privacy?
  options:
  - 'One person''s record cannot noticeably change the output'
  - The database will run 10x faster
  - The data is encrypted on an optical disk
  - All text is translated into Latin
  answer_index: 0
  explanation: Differential privacy mathematically bounds the influence of any single training sample
    or user record.
- question: How does a 'Zero-Knowledge PII Token Vault' operate in an AI inference pipeline?
  options:
  - 'It deletes all of the customer records permanently'
  - 'It swaps real PII for surrogates, then restores them'
  - It asks the user to retype their password
  - It converts text into raw binary numbers
  answer_index: 1
  explanation: Token vaults ensure third-party LLMs and logs never see or store raw identifiable customer
    data.
- question: What is the definition of 'k-Anonymity' in tabular and text datasets?
  options:
  - A dataset where every record appears exactly k times
  - A dataset with k columns
  - 'Each record is indistinguishable from k-1 others'
  - An algorithm that compresses data by a factor of k
  answer_index: 2
  explanation: k-Anonymity prevents re-identification attacks by grouping quasi-identifiers into equivalence
    classes of size >= k.
- question: Why is GDPR Article 17 ('Right to Erasure / Right to be Forgotten') particularly challenging
    for Generative AI models?
  options:
  - Because hard drives cannot delete files
  - Because GPUs only support write-only memory
  - Because the EU AI Act prohibits retraining
  - 'Models memorise, so removal needs unlearning or retraining'
  answer_index: 3
  explanation: Extracting memorized knowledge from distributed neural network weights without full retraining
    is an active challenge.
- question: In the Laplace Mechanism for Differential Privacy, how is the scale parameter b calculated
    given sensitivity Delta f and privacy budget epsilon?
  options:
  - b = Delta f / epsilon
  - b = epsilon * Delta f
  - b = Delta f + epsilon
  - b = log(epsilon)
  answer_index: 0
  explanation: The Laplace scale parameter is b = Delta f / epsilon, adding noise proportional to global
    sensitivity and inversely proportional to epsilon.
