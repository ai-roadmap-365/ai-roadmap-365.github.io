questions:
- question: What is the primary architectural benefit of integrating GPU dynamic batching, OpenTelemetry
    metrics, and automated circuit breakers into a unified AI Gateway?
  options:
  - It reduces Python code to a single file
  - It creates a self-healing, observable inference pipeline that maximizes hardware throughput, provides
    real-time SLA visibility, and automatically mitigates customer outages in under 500ms without human
    intervention
  - It makes the model immune to spelling mistakes
  - It eliminates the need for unit tests
  answer_index: 1
  explanation: A unified AI gateway combines high-throughput batching, real-time observability, and automated
    self-healing.
- question: How do W3C trace IDs bridge Prometheus time-series metrics and ClickHouse structured logs?
  options:
  - By sorting numbers alphabetically
  - When a Prometheus alert flags a P95 latency spike, engineers can search ClickHouse logs by the corresponding
    `trace_id` to inspect the exact prompt tokens, model version, and microservice spans that caused the
    anomaly
  - Trace IDs only work in JavaScript
  - They encrypt the entire database
  answer_index: 1
  explanation: Trace IDs provide the vital correlation link between high-level metric anomalies and granular
    log diagnostics.
- question: What is the role of an in-memory PII sanitizer in the unified inference pipeline?
  options:
  - To speed up network transfers
  - To scrub emails, Social Security Numbers, and credit card numbers from user prompt text before the
    event is committed to persistent log storage or analytical databases
  - To translate text into French
  - To turn off the database during backups
  answer_index: 1
  explanation: In-memory PII sanitization prevents regulatory data leaks into persistent storage sinks.
- question: What constitutes an enterprise AI 'Production Readiness Review' (PRR)?
  options:
  - Checking if the computer is plugged into the wall
  - A formal verification assessing infrastructure IaC reproducibility, GPU autoscaling policies, P95/P99
    latency SLAs, automated rollback circuit breakers, PII compliance, and blameless on-call runbooks
    prior to general availability launch
  - A meeting where engineers celebrate with cake
  - Deleting all staging servers
  answer_index: 1
  explanation: A PRR is a rigorous audit ensuring security, reliability, scalability, and observability
    standards are met before launch.
- question: How does automated circuit breaker tripping support high availability SLAs (99.99%)?
  options:
  - By restarting all servers every hour
  - By isolating failing candidate model instances within milliseconds and rerouting traffic to proven
    baseline models, bounding MTTR and preserving user uptime
  - By rejecting all incoming user traffic permanently
  - By disabling logging
  answer_index: 1
  explanation: Fast automated rollback bounds MTTR to milliseconds, maintaining five-nines service availability.
