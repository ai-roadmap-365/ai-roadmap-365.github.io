terms:
- term: Unified AI Gateway
  definition: A centralized entrypoint orchestrating routing, dynamic batching, telemetry, and automated
    rollbacks.
- term: Production Readiness Review (PRR)
  definition: A formal audit assessing system scalability, reliability, and security before production
    release.
- term: End-to-End Observability
  definition: Correlating high-level time-series metrics with granular distributed trace spans and structured
    logs.
- term: Self-Healing AI System
  definition: An autonomous architecture that detects anomalies and executes remediations without human
    triage.
- term: Unit Economics
  definition: Direct revenue generated per request minus exact attributed model inference and infrastructure
    cost.
- term: SLA (Service Level Agreement)
  definition: A formal contractual commitment specifying expected availability and latency thresholds.
- term: Circuit Trip Latency
  definition: The elapsed time from metric anomaly detection to full traffic cutover to fallback baselines.
- term: Golden Signals Alignment
  definition: Standardizing monitoring across Latency, Traffic, Errors, and Saturation.
