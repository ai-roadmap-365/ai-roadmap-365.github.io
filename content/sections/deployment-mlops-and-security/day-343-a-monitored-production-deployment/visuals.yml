visuals:
- id: unified-monitored-production-ai-deployment-architecture
  file: assets/unified-monitored-production-ai-deployment-architecture.svg
  type: diagram
  title: Unified Monitored Production AI Deployment Architecture
  alt: Unified Monitored Production AI Deployment Architecture showing Client Traffic, AI Gateway with
    PII Redaction & Circuit Breaker, GPU Triton Serving Pool, Prometheus Metrics, and ClickHouse Financial
    Ledger
  description: Comprehensive system architecture diagram illustrating the complete unified production
    AI deployment pipeline.
- id: production-readiness-review-operational-pillars
  file: assets/production-readiness-review-operational-pillars.svg
  type: diagram
  title: Production Readiness Review Operational Pillars
  alt: Production Readiness Review Operational Pillars detailing Infrastructure IaC, GPU Optimization,
    Observability & Alerting, Data Privacy & Security, and Incident Response Governance
  description: Governance and architectural checklist diagram covering the five pillars of enterprise
    AI operational excellence.
- id: five-pillars
  file: assets/five-pillars.svg
  type: diagram
  title: 'Five pillars of a production platform'
  alt: 'Diagram: the five operational pillars of a monitored production AI deployment'
  description: 'A five-stage description of the pillars of a production AI platform covering infrastructure, serving, observability, privacy and incident response.'
- id: platform-or-scripts
  file: assets/platform-or-scripts.svg
  type: diagram
  title: 'A platform, not a pile of scripts'
  alt: 'Diagram: a unified operational platform compared with disconnected components'
  description: 'A two-column comparison of an integrated production platform against separately-working components with no correlation between them.'
- id: platform-eras
  file: assets/platform-eras.svg
  type: diagram
  title: 'Three generations of AI operations'
  alt: 'Diagram: the progression from ad-hoc scripts to unified GenAI operations platforms'
  description: 'A three-stage progression of AI operations from shell scripts and cron through container orchestration to integrated GenAI platforms.'
- id: unified-not-adhoc
  file: assets/unified-not-adhoc.svg
  type: diagram
  title: 'Two things it never is'
  alt: 'Diagram: what a monitored production deployment is compared with two failing patterns'
  description: 'A two-column comparison of an integrated monitored deployment against unmonitored scripts and unredacted persistent logs.'
- id: request-pipeline
  file: assets/request-pipeline.svg
  type: diagram
  title: 'One request, end to end'
  alt: 'Diagram: the path of a request through a fully monitored production AI platform'
  description: 'A six-stage description of a request traversing trace injection, PII redaction, flag routing, batched inference, telemetry emission and cost attribution.'
- id: readiness-pillars
  file: assets/readiness-pillars.svg
  type: diagram
  title: 'What a readiness review asks'
  alt: 'Diagram: the questions a production readiness review asks of each operational pillar'
  description: 'A five-stage description of readiness review questions covering infrastructure reproducibility, GPU efficiency, observability, privacy and incident preparedness.'
- id: control-room
  file: assets/control-room.svg
  type: diagram
  title: 'A power station control room'
  alt: 'Diagram: a nuclear control room as an analogy for a monitored AI platform'
  description: 'A two-column comparison mapping power station control systems onto AI platform components.'
- id: multi-region-dr
  file: assets/multi-region-dr.svg
  type: diagram
  title: 'Surviving a region'
  alt: 'Diagram: how an active-active multi-region deployment survives a regional outage'
  description: 'A four-stage description of active-active multi-region operation covering concurrent clusters, geo-routing, health-probe failover and asynchronous ledger replication.'
- id: end-to-end-hazards
  file: assets/end-to-end-hazards.svg
  type: diagram
  title: 'Four systemic hazards'
  alt: 'Diagram: the four systemic hazards of an end-to-end AI deployment'
  description: 'A four-stage description of systemic hazards covering telemetry silos, cascade failure, unattributed cost and PII reaching storage.'
- id: signed-images
  file: assets/signed-images.svg
  type: diagram
  title: 'Signed images, verified at admission'
  alt: 'Diagram: an image pinned by digest compared with one signed and verified at admission'
  description: 'A two-column comparison of pinning container images by digest against signing them and verifying signatures before execution.'
- id: platform-implications
  file: assets/platform-implications.svg
  type: diagram
  title: 'Four consequences of running a platform'
  alt: 'Diagram: the security, economic, reliability and operational implications of a unified platform'
  description: 'A four-stage description of platform implications covering signed images, per-tenant margin alerting, multi-region failover and correlated diagnosis.'
- id: platform-when
  file: assets/platform-when.svg
  type: diagram
  title: 'When the whole stack is warranted'
  alt: 'Diagram: when a full production platform is warranted and what applies regardless'
  description: 'A two-column comparison of deployments that justify the complete operational stack against smaller ones, and the controls that apply either way.'
