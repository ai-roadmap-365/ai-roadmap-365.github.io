<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="From glue scripts to platforms.">
  <title>Three generations of AI operations</title>
  <style>
    .platform-eras-bg   { fill: #f8fafc; }
    .platform-eras-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-eras-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-eras-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-eras-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-eras-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .platform-eras-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .platform-eras-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .platform-eras-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .platform-eras-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .platform-eras-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .platform-eras-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .platform-eras-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .platform-eras-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .platform-eras-stage { opacity: 1; }

    .platform-eras-s0 { animation-delay: 0.00s; }
    .platform-eras-e0 { animation-delay: 0.00s; }
    .platform-eras-s1 { animation-delay: 1.50s; }
    .platform-eras-e1 { animation-delay: 1.50s; }
    .platform-eras-s2 { animation-delay: 3.00s; }
    .platform-eras-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .platform-eras-conn  { animation: platform-eras-trace 6s ease-in-out infinite; }
      .platform-eras-stage { animation: platform-eras-arrive 6s ease-in-out infinite; }
    }
    @keyframes platform-eras-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes platform-eras-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .platform-eras-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .platform-eras-stage { animation: platform-eras-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes platform-eras-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="platform-eras-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="platform-eras-bg" width="980" height="322"/>
  <text class="platform-eras-h1"  x="30" y="40">Three generations of AI operations</text>
  <text class="platform-eras-sub" x="30" y="64">From glue scripts to platforms.</text>
  <g class="platform-eras-stage platform-eras-s0">
    <rect class="platform-eras-warn" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="platform-eras-step" x="44" y="142">01</text>
    <text class="platform-eras-name" x="70" y="142">Glue scripts, 2015-2019</text>
    <text class="platform-eras-desc" x="44" y="166">Shell, cron, unmonitored endpoints. Debugging</text>
    <text class="platform-eras-desc" x="44" y="182">meant SSH into production.</text>
  </g>
  <line class="platform-eras-line platform-eras-conn platform-eras-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#platform-eras-tip)"/>
  <g class="platform-eras-stage platform-eras-s1">
    <rect class="platform-eras-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="platform-eras-step" x="359" y="142">02</text>
    <text class="platform-eras-name" x="385" y="142">Containers and metrics, 2020-2023</text>
    <text class="platform-eras-desc" x="359" y="166">Kubernetes and Prometheus arrive. AI-specific</text>
    <text class="platform-eras-desc" x="359" y="182">metrics do not.</text>
  </g>
  <line class="platform-eras-line platform-eras-conn platform-eras-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#platform-eras-tip)"/>
  <g class="platform-eras-stage platform-eras-s2">
    <rect class="platform-eras-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="platform-eras-step" x="674" y="142">03</text>
    <text class="platform-eras-name" x="700" y="142">Unified platforms, 2024</text>
    <text class="platform-eras-desc" x="674" y="166">vLLM, semantic telemetry, columnar ledgers,</text>
    <text class="platform-eras-desc" x="674" y="182">automated breakers.</text>
  </g>
  <text class="platform-eras-sub" x="30" y="304">The middle generation is worth dwelling on: the infrastructure was modern and the instrumentation measured CPU and request counts, which for an LLM service is a dashboard about the wrong machine.</text>
</svg>
