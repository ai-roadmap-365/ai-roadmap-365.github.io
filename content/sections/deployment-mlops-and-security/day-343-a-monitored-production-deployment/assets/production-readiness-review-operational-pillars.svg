<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Production Readiness Review Operational Pillars">
  <title>Production Readiness Review Operational Pillars</title>
  <defs>
    <style>
      .d343b-bg { fill: #f8fafc; }
      .d343b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d343b-pil { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d343b-gov { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d343b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d343b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d343b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d343b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d343b-bg" />
  
  <text x="40" y="40" class="d343a-title">Enterprise AI Production Readiness Pillars</text>
  <text x="40" y="65" class="d343a-subtitle">Production Readiness Review Operational Pillars detailing Infrastructure IaC, GPU Optimization, Observability &amp; Alerting, Data Privacy &amp; Security, and Incident Response Governance</text>
  
  <!-- Pillars 1-3 -->
  <rect x="40" y="110" width="390" height="270" class="d343b-pil" />
  <text x="60" y="145" class="d343b-header" fill="#1d4ed8">Engineering &amp; Infrastructure Pillars</text>
  <text x="60" y="180" class="d343b-text">1. **IaC &amp; Reproducibility:** 100% Terraform codified</text>
  <text x="60" y="205" class="d343b-text">2. **GPU Saturation:** Dynamic batching &amp; PagedAttention</text>
  <text x="60" y="230" class="d343b-text">3. **Observability:** OTel TTFT / ITL &amp; P95 Prometheus</text>
  <text x="60" y="255" class="d343b-text">4. **Token Cost Metering:** Multi-tenant ClickHouse ledger</text>
  <text x="60" y="300" class="d343b-text" font-weight="600" fill="#1d4ed8">Technical Robustness</text>
  
  <!-- Pillars 4-5 -->
  <rect x="470" y="110" width="390" height="270" class="d343b-gov" />
  <text x="490" y="145" class="d343b-header" fill="#7e22ce">Governance, Privacy &amp; Reliability</text>
  <text x="490" y="180" class="d343b-text">5. **Data Privacy:** In-memory PII regex &amp; GDPR compliance</text>
  <text x="490" y="205" class="d343b-text">6. **Canary Safety:** Progressive rollouts (5% ➔ 100%)</text>
  <text x="490" y="230" class="d343b-text">7. **Self-Healing:** 500ms automated circuit breakers</text>
  <text x="490" y="255" class="d343b-text">8. **Incident Culture:** Blameless post-mortems &amp; runbooks</text>
  <text x="490" y="300" class="d343b-text" font-weight="600" fill="#7e22ce">Operational Excellence Certified</text>
</svg>