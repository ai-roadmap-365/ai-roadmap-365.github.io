<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six stages, each observable.">
  <title>One request, end to end</title>
  <style>
    .request-pipeline-bg   { fill: #f8fafc; }
    .request-pipeline-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-pipeline-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-pipeline-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-pipeline-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-pipeline-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .request-pipeline-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .request-pipeline-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .request-pipeline-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .request-pipeline-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .request-pipeline-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .request-pipeline-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .request-pipeline-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .request-pipeline-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .request-pipeline-stage { opacity: 1; }

    .request-pipeline-s0 { animation-delay: 0.00s; }
    .request-pipeline-e0 { animation-delay: 0.00s; }
    .request-pipeline-s1 { animation-delay: 1.37s; }
    .request-pipeline-e1 { animation-delay: 1.37s; }
    .request-pipeline-s2 { animation-delay: 2.74s; }
    .request-pipeline-e2 { animation-delay: 2.74s; }
    .request-pipeline-s3 { animation-delay: 4.11s; }
    .request-pipeline-e3 { animation-delay: 4.11s; }
    .request-pipeline-s4 { animation-delay: 5.49s; }
    .request-pipeline-e4 { animation-delay: 5.49s; }
    .request-pipeline-s5 { animation-delay: 6.86s; }
    .request-pipeline-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .request-pipeline-conn  { animation: request-pipeline-trace 9.600000000000001s ease-in-out infinite; }
      .request-pipeline-stage { animation: request-pipeline-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes request-pipeline-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes request-pipeline-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .request-pipeline-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .request-pipeline-stage { animation: request-pipeline-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes request-pipeline-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="request-pipeline-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="request-pipeline-bg" width="980" height="322"/>
  <text class="request-pipeline-h1"  x="30" y="40">One request, end to end</text>
  <text class="request-pipeline-sub" x="30" y="64">Six stages, each observable.</text>
  <g class="request-pipeline-stage request-pipeline-s0">
    <rect class="request-pipeline-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="44" y="142">01</text>
    <text class="request-pipeline-name" x="70" y="142">Inject a trace ID</text>
    <text class="request-pipeline-desc" x="44" y="166">At ingress.</text>
    <text class="request-pipeline-desc" x="44" y="182">Everything</text>
    <text class="request-pipeline-desc" x="44" y="198">downstream carries</text>
    <text class="request-pipeline-edge" x="44" y="242">W3C</text>
  </g>
  <line class="request-pipeline-line request-pipeline-conn request-pipeline-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#request-pipeline-tip)"/>
  <g class="request-pipeline-stage request-pipeline-s1">
    <rect class="request-pipeline-warn" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="201" y="142">02</text>
    <text class="request-pipeline-name" x="227" y="142">Redact PII in memory</text>
    <text class="request-pipeline-desc" x="201" y="166">Before any write,</text>
    <text class="request-pipeline-desc" x="201" y="182">anywhere.</text>
  </g>
  <line class="request-pipeline-line request-pipeline-conn request-pipeline-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#request-pipeline-tip)"/>
  <g class="request-pipeline-stage request-pipeline-s2">
    <rect class="request-pipeline-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="358" y="142">03</text>
    <text class="request-pipeline-name" x="384" y="142">Evaluate flags deterministically</text>
    <text class="request-pipeline-desc" x="358" y="166">hash(user) picks the</text>
    <text class="request-pipeline-desc" x="358" y="182">variant, stably.</text>
    <text class="request-pipeline-edge" x="358" y="242">sub-ms</text>
  </g>
  <line class="request-pipeline-line request-pipeline-conn request-pipeline-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#request-pipeline-tip)"/>
  <g class="request-pipeline-stage request-pipeline-s3">
    <rect class="request-pipeline-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="515" y="142">04</text>
    <text class="request-pipeline-name" x="541" y="142">Route and batch</text>
    <text class="request-pipeline-desc" x="515" y="166">LOR to the</text>
    <text class="request-pipeline-desc" x="515" y="182">least-loaded</text>
    <text class="request-pipeline-desc" x="515" y="198">replica; the</text>
  </g>
  <line class="request-pipeline-line request-pipeline-conn request-pipeline-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#request-pipeline-tip)"/>
  <g class="request-pipeline-stage request-pipeline-s4">
    <rect class="request-pipeline-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="672" y="142">05</text>
    <text class="request-pipeline-name" x="698" y="142">Emit telemetry</text>
    <text class="request-pipeline-desc" x="672" y="166">TTFT, ITL, tokens,</text>
    <text class="request-pipeline-desc" x="672" y="182">error — with the</text>
    <text class="request-pipeline-desc" x="672" y="198">trace ID attached.</text>
  </g>
  <line class="request-pipeline-line request-pipeline-conn request-pipeline-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#request-pipeline-tip)"/>
  <g class="request-pipeline-stage request-pipeline-s5">
    <rect class="request-pipeline-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="request-pipeline-step" x="829" y="142">06</text>
    <text class="request-pipeline-name" x="855" y="142">Attribute the cost</text>
    <text class="request-pipeline-desc" x="829" y="166">Per tenant, at the</text>
    <text class="request-pipeline-desc" x="829" y="182">model's pricing</text>
    <text class="request-pipeline-desc" x="829" y="198">tier, in real time.</text>
  </g>
  <text class="request-pipeline-sub" x="30" y="304">Every stage after the first inherits the trace ID, which is what makes the platform diagnosable: an alert at stage five leads directly to the log record from stage two of the same request.</text>
</svg>
