<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each spans more than one component.">
  <title>Four systemic hazards</title>
  <style>
    .end-to-end-hazards-bg   { fill: #f8fafc; }
    .end-to-end-hazards-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-hazards-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-hazards-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-hazards-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-hazards-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .end-to-end-hazards-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .end-to-end-hazards-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .end-to-end-hazards-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .end-to-end-hazards-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .end-to-end-hazards-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .end-to-end-hazards-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .end-to-end-hazards-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .end-to-end-hazards-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .end-to-end-hazards-stage { opacity: 1; }

    .end-to-end-hazards-s0 { animation-delay: 0.00s; }
    .end-to-end-hazards-e0 { animation-delay: 0.00s; }
    .end-to-end-hazards-s1 { animation-delay: 1.28s; }
    .end-to-end-hazards-e1 { animation-delay: 1.28s; }
    .end-to-end-hazards-s2 { animation-delay: 2.56s; }
    .end-to-end-hazards-e2 { animation-delay: 2.56s; }
    .end-to-end-hazards-s3 { animation-delay: 3.84s; }
    .end-to-end-hazards-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .end-to-end-hazards-conn  { animation: end-to-end-hazards-trace 6.4s ease-in-out infinite; }
      .end-to-end-hazards-stage { animation: end-to-end-hazards-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes end-to-end-hazards-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes end-to-end-hazards-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .end-to-end-hazards-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .end-to-end-hazards-stage { animation: end-to-end-hazards-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes end-to-end-hazards-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="end-to-end-hazards-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="end-to-end-hazards-bg" width="980" height="322"/>
  <text class="end-to-end-hazards-h1"  x="30" y="40">Four systemic hazards</text>
  <text class="end-to-end-hazards-sub" x="30" y="64">Each spans more than one component.</text>
  <g class="end-to-end-hazards-stage end-to-end-hazards-s0">
    <rect class="end-to-end-hazards-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="end-to-end-hazards-step" x="44" y="142">01</text>
    <text class="end-to-end-hazards-name" x="70" y="142">Telemetry silos</text>
    <text class="end-to-end-hazards-desc" x="44" y="166">Metrics, logs and billing with</text>
    <text class="end-to-end-hazards-desc" x="44" y="182">no shared identifier. Triage by</text>
    <text class="end-to-end-hazards-desc" x="44" y="198">timestamp.</text>
  </g>
  <line class="end-to-end-hazards-line end-to-end-hazards-conn end-to-end-hazards-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#end-to-end-hazards-tip)"/>
  <g class="end-to-end-hazards-stage end-to-end-hazards-s1">
    <rect class="end-to-end-hazards-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="end-to-end-hazards-step" x="280" y="142">02</text>
    <text class="end-to-end-hazards-name" x="306" y="142">Cascade failure</text>
    <text class="end-to-end-hazards-desc" x="280" y="166">A long-context spike crashes a</text>
    <text class="end-to-end-hazards-desc" x="280" y="182">node; the survivors take its</text>
    <text class="end-to-end-hazards-desc" x="280" y="198">traffic and follow.</text>
  </g>
  <line class="end-to-end-hazards-line end-to-end-hazards-conn end-to-end-hazards-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#end-to-end-hazards-tip)"/>
  <g class="end-to-end-hazards-stage end-to-end-hazards-s2">
    <rect class="end-to-end-hazards-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="end-to-end-hazards-step" x="516" y="142">03</text>
    <text class="end-to-end-hazards-name" x="542" y="142">Unattributed cost</text>
    <text class="end-to-end-hazards-desc" x="516" y="166">A bill nobody can decompose into</text>
    <text class="end-to-end-hazards-desc" x="516" y="182">customers.</text>
    <text class="end-to-end-hazards-edge" x="516" y="242">margins</text>
  </g>
  <line class="end-to-end-hazards-line end-to-end-hazards-conn end-to-end-hazards-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#end-to-end-hazards-tip)"/>
  <g class="end-to-end-hazards-stage end-to-end-hazards-s3">
    <rect class="end-to-end-hazards-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="end-to-end-hazards-step" x="752" y="142">04</text>
    <text class="end-to-end-hazards-name" x="778" y="142">PII on disk</text>
    <text class="end-to-end-hazards-desc" x="752" y="166">Written once, retained by</text>
    <text class="end-to-end-hazards-desc" x="752" y="182">default, uncovered by any</text>
    <text class="end-to-end-hazards-desc" x="752" y="198">deletion path.</text>
    <text class="end-to-end-hazards-edge" x="752" y="242">compliance</text>
  </g>
  <text class="end-to-end-hazards-sub" x="30" y="304">The second is the one that turns a single node failure into an outage: without shedding or breaking, every remaining replica inherits the dead one's load and fails for exactly the same reason.</text>
</svg>
