questions:
  - question: Why does deleting a job that has never caught a bug often save zero seconds of pipeline
      time?
    options:
      - Because the runner still allocates time for deleted jobs
      - Because if the job is not on the critical path, nothing was waiting for it — removing it saves
        runner minutes but cannot make anything finish sooner
      - Because CI systems cache the previous run's duration
      - Because the job is retried automatically elsewhere
    answer_index: 1
    explanation: In the lab, deleting both never-firing gates saves 0.0 minutes of wall clock and 5.5
      runner minutes. Real money, and not what anyone was complaining about.
  - question: What is the difference between wall clock and runner minutes, and which does a cache on
      the critical path improve?
    options:
      - They are the same measurement reported in different units
      - Wall clock is the longest chain of dependent jobs and runner minutes is the sum of all of
        them; a cache on the critical path shortens the chain, so it improves both
      - Wall clock includes queueing and runner minutes does not
      - Runner minutes measure only the deploy job
    answer_index: 1
    explanation: A cache off the critical path improves only the bill. On it, it improves the waiting
      too, which is why identifying the path first is what makes the optimisation land.
  - question: Why is pull_request_target dangerous when pull_request is not?
    options:
      - Because it runs on a slower class of runner
      - Because it executes in the base repository's context WITH secrets, so combining it with a
        checkout of the fork's code runs untrusted code with your credentials in the environment
      - Because it bypasses branch protection rules
      - Because it cannot be restricted by the permissions key
    answer_index: 1
    explanation: pull_request checks out fork code with a read-only token and no secrets. The rule
      that survives is that pull_request_target may inspect a pull request and must never run its code.
  - question: When a job is removed from a workflow, why must its dependants inherit its dependencies?
    options:
      - To preserve the original job count for billing
      - Because otherwise those dependants become root jobs that start immediately, which understates
        the wall clock and makes every deletion look better than it is
      - Because GitHub Actions requires every job to have a dependency
      - Because the cache keys would otherwise be invalidated
    answer_index: 1
    explanation: Dropping the edge without re-pointing it is the difference between modelling a
      deletion and modelling a deletion plus an accidental reordering.
  - question: Why should a gate that has never failed be deleted or downgraded to a report rather than
      left in place?
    options:
      - Because CI systems penalise workflows with unused jobs
      - Because it costs time and runner minutes on every run while providing no evidence that it
        catches anything — and a scanner nobody has seen fire is a control that exists only on the
        diagram
      - Because passing jobs make failures harder to spot in the log
      - Because gates expire after a fixed number of runs
    answer_index: 1
    explanation: The security version of the same point matters more — a scanner that has never
      reported anything is either misconfigured or unread, and both mean the control is not real.
