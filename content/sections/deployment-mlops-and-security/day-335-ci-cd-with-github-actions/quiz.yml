questions:
- question: What is the primary architectural goal of an Offline Batch Inference system compared to an
    Online Real-Time API?
  options:
  - To optimize exclusively for sub-200ms Time-to-First-Token (TTFT)
  - To maximize aggregate throughput (thousands of records processed per second per dollar) by maximizing
    GPU batch saturation and amortizing model overhead, tolerating completion latencies of minutes or
    hours
  - To display streaming text in a user interface
  - To run inference only on mobile phones
  answer_index: 1
  explanation: Offline batch processing prioritizes aggregate throughput and cost-efficiency over per-request
    latency.
- question: Why are cloud Spot / Preemptible GPU instances ideal for large-scale offline batch inference
    workloads?
  options:
  - Spot instances have 10x faster clock speeds
  - Spot instances offer 60% to 80% price discounts compared to on-demand GPUs; with proper checkpointing
    and retry queues, worker interruptions can be recovered seamlessly with zero data loss
  - Spot instances never crash
  - Spot instances provide unlimited VRAM
  answer_index: 1
  explanation: Spot instances provide 60-80% cost savings, perfectly suited for fault-tolerant checkpointed
    batch jobs.
- question: What role does a 'Dead-Letter Queue' (DLQ) play in a batch inference pipeline?
  options:
  - It deletes all customer emails
  - It isolates permanently failing input records (e.g. malformed inputs triggering token length errors)
    after maximum retry attempts, preventing the worker pool from getting stuck in endless retry loops
  - It speeds up GPU matrix multiplies
  - It reboots the Redis server
  answer_index: 1
  explanation: A DLQ isolates unrecoverable records to preserve pipeline progress across remaining batch
    items.
- question: How does Ray Data optimize large-scale batch LLM inference across multi-node GPU clusters?
  options:
  - By loading all 10 million documents into single-node RAM
  - By streaming dataset chunks through distributed GPU actor pools (`map_batches`), maintaining warm
    model weights in GPU VRAM and pipelining I/O reading, tokenization, and forward passes across all
    nodes
  - By compiling Python to Assembly
  - By running inference on mechanical disks
  answer_index: 1
  explanation: Ray Data streams batches across persistent GPU actors, maintaining high hardware utilization.
- question: Why is 'Idempotent Checkpointing' mandatory when processing a 10-million record batch job?
  options:
  - It is a legal requirement in all countries
  - If a worker node crashes 8 hours into a 10-hour run, checkpointing allows the pipeline to resume from
    the exact last successful batch ID rather than re-computing and paying for the first 8 hours again
  - It reduces the file size of the output
  - It turns off the cluster fans
  answer_index: 1
  explanation: Idempotent checkpointing prevents expensive duplicate compute upon worker failure or preemption.
