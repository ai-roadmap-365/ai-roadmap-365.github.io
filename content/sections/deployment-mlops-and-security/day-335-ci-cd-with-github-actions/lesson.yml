title: CI/CD with GitHub Actions
section: deployment-mlops-and-security
subsection: deployment-and-containers
week: 48
learning_promise:
  'Read a CI pipeline as the job graph it is, and learn why deleting the stage that has
  never caught a bug makes it zero seconds faster while one cache saves nearly four minutes. Then
  learn the one-word trigger difference that hands your repository secrets to a fork.'
objectives:
  - Compute finish times across a graph where independent jobs run in parallel.
  - Distinguish wall-clock time from runner minutes, and say which change improves each.
  - Explain why pull_request_target with secrets is dangerous and pull_request is not.
  - Identify gates that have never fired and slow jobs with no cache.
  - Show why removing an off-critical-path job saves money and no time.
