<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" height="100%" role="img" aria-label="Two Durations, Two Different Fixes contrasting critical path wall clock against total runner minutes">
  <title>Two Durations, Two Different Fixes</title>
  <defs>
    <style>
      .d335a-bg { fill: #f8fafc; }
      .d335a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d335a-path { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d335a-par { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2px; }
      .d335a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d335a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d335a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d335a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d335a-ax { stroke: #94a3b8; stroke-width: 1.5px; }
    </style>
  </defs>
  <rect class="d335a-bg" width="900" height="430" />
  <text class="d335a-title" x="30" y="34">Two Durations, Two Different Fixes</text>
  <text class="d335a-s" x="30" y="56">Eight jobs. Time runs left to right; each bar starts when its dependencies finish.</text>

  <line class="d335a-ax" x1="170" y1="266" x2="850" y2="266" />
  <text class="d335a-s" x="166" y="286">0</text>
  <text class="d335a-s" x="400" y="286">5 min</text>
  <text class="d335a-s" x="620" y="286">10 min</text>
  <text class="d335a-s" x="800" y="286">12.7</text>

  <text class="d335a-t" x="30" y="94">checkout</text>
  <rect class="d335a-path" x="170" y="78" width="16" height="20" rx="3" />
  <text class="d335a-t" x="30" y="120">install</text>
  <rect class="d335a-path" x="186" y="104" width="236" height="20" rx="3" />
  <text class="d335a-t" x="30" y="146">lint</text>
  <rect class="d335a-par" x="422" y="130" width="42" height="20" rx="3" />
  <text class="d335a-t" x="30" y="172">licence-scan</text>
  <rect class="d335a-par" x="422" y="156" width="126" height="20" rx="3" />
  <text class="d335a-t" x="30" y="198">docs-build</text>
  <rect class="d335a-par" x="422" y="182" width="163" height="20" rx="3" />
  <text class="d335a-t" x="30" y="224">unit</text>
  <rect class="d335a-par" x="422" y="208" width="168" height="20" rx="3" />
  <text class="d335a-t" x="30" y="250">integration</text>
  <rect class="d335a-path" x="422" y="234" width="341" height="20" rx="3" />

  <text class="d335a-s" x="778" y="120" fill="#7f1d1d">critical path</text>
  <text class="d335a-s" x="600" y="198" fill="#1d4ed8">free — nothing waits</text>

  <rect class="d335a-path" x="30" y="306" width="410" height="46" rx="8" />
  <text class="d335a-h" x="48" y="330">Wall clock 12.7 min</text>
  <text class="d335a-s" x="48" y="348">what the person watching the PR waits for</text>

  <rect class="d335a-par" x="460" y="306" width="410" height="46" rx="8" />
  <text class="d335a-h" x="478" y="330">Runner minutes 22.2</text>
  <text class="d335a-s" x="478" y="348">what you are billed for</text>

  <rect class="d335a-card" x="30" y="366" width="410" height="50" rx="6" />
  <text class="d335a-t" x="48" y="388">To make it FASTER:</text>
  <text class="d335a-s" x="48" y="408">shorten the critical path</text>

  <rect class="d335a-card" x="460" y="366" width="410" height="50" rx="6" />
  <text class="d335a-t" x="478" y="388">To make it CHEAPER:</text>
  <text class="d335a-s" x="478" y="408">remove work anywhere</text>
</svg>
