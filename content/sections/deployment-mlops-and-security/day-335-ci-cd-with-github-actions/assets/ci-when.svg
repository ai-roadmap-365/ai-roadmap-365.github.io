<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And three things not to do.">
  <title>What to do from the first commit</title>
  <style>
    .ci-when-bg   { fill: #f8fafc; }
    .ci-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ci-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .ci-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .ci-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ci-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .ci-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .ci-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ci-when-row { opacity: 1; }
    .ci-when-r0 { animation-delay: 0.00s; }
    .ci-when-r1 { animation-delay: 0.45s; }
    .ci-when-r2 { animation-delay: 0.90s; }
    .ci-when-r3 { animation-delay: 1.35s; }
    .ci-when-r4 { animation-delay: 1.80s; }
    .ci-when-row { animation: ci-when-reveal 7.3s ease-in-out infinite; }
    @keyframes ci-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="ci-when-bg" width="980" height="390"/>
  <text class="ci-when-h1"  x="30" y="40">What to do from the first commit</text>
  <text class="ci-when-sub" x="30" y="64">And three things not to do.</text>
  <rect class="ci-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="ci-when-name" x="46" y="122">Do</text>
  <text class="ci-when-desc" x="46" y="142">The cost is a file.</text>
  <text class="ci-when-desc ci-when-row ci-when-r0" x="46" y="182">Use CI from the first commit with tests</text>
  <text class="ci-when-desc ci-when-row ci-when-r1" x="46" y="216">Cache the slow thing on the critical path</text>
  <text class="ci-when-desc ci-when-row ci-when-r2" x="46" y="250">Measure which that is</text>
  <text class="ci-when-desc ci-when-row ci-when-r3" x="46" y="284">Pin third-party actions to a SHA</text>
  <text class="ci-when-desc ci-when-row ci-when-r4" x="46" y="318">Scope permissions per job</text>
  <rect class="ci-when-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="ci-when-name" x="526" y="122">Do not</text>
  <text class="ci-when-desc" x="526" y="142">Three, all common.</text>
  <text class="ci-when-desc ci-when-row ci-when-r0" x="526" y="182">Add a gate you cannot imagine failing</text>
  <text class="ci-when-desc ci-when-row ci-when-r1" x="526" y="216">Optimise without computing the path</text>
  <text class="ci-when-desc ci-when-row ci-when-r2" x="526" y="250">You will delete the annoying job</text>
  <text class="ci-when-desc ci-when-row ci-when-r3" x="526" y="284">Run fork code under pull_request_target</text>
  <text class="ci-when-desc ci-when-row ci-when-r4" x="526" y="318">Split into two workflows instead</text>
  <text class="ci-when-sub" x="30" y="372">"The cost is a file; the benefit compounds" is why the first row has no threshold: there is no project size at which a repeatable build stops being worth a few lines of YAML.</text>
</svg>
