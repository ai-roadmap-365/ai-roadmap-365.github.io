<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And one that never fails is a report.">
  <title>A gate is a claim</title>
  <style>
    .gate-or-report-bg   { fill: #f8fafc; }
    .gate-or-report-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-or-report-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-or-report-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-or-report-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-or-report-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .gate-or-report-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gate-or-report-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .gate-or-report-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .gate-or-report-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .gate-or-report-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .gate-or-report-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .gate-or-report-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .gate-or-report-row { opacity: 1; }
    .gate-or-report-r0 { animation-delay: 0.00s; }
    .gate-or-report-r1 { animation-delay: 0.45s; }
    .gate-or-report-r2 { animation-delay: 0.90s; }
    .gate-or-report-r3 { animation-delay: 1.35s; }
    .gate-or-report-r4 { animation-delay: 1.80s; }
    .gate-or-report-row { animation: gate-or-report-reveal 7.3s ease-in-out infinite; }
    @keyframes gate-or-report-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="gate-or-report-bg" width="980" height="390"/>
  <text class="gate-or-report-h1"  x="30" y="40">A gate is a claim</text>
  <text class="gate-or-report-sub" x="30" y="64">And one that never fails is a report.</text>
  <rect class="gate-or-report-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="gate-or-report-name" x="46" y="122">A gate</text>
  <text class="gate-or-report-desc" x="46" y="142">Blocks a merge.</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r0" x="46" y="182">A claim that this is worth blocking over</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r1" x="46" y="216">You can name what it would catch</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r2" x="46" y="250">Its dependants never start when it fails</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r3" x="46" y="284">Costs wall clock when on the path</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r4" x="46" y="318">Worth the time it takes</text>
  <rect class="gate-or-report-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="gate-or-report-name" x="526" y="122">A report</text>
  <text class="gate-or-report-desc" x="526" y="142">Informs, does not block.</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r0" x="526" y="182">Runs off the critical path</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r1" x="526" y="216">Nobody waits for it</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r2" x="526" y="250">A gate that never fails belongs here</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r3" x="526" y="284">Or should be deleted</text>
  <text class="gate-or-report-desc gate-or-report-row gate-or-report-r4" x="526" y="318">Leaving it as a gate is a control on a diagram only</text>
  <text class="gate-or-report-sub" x="30" y="372">"Do not add a gate you cannot imagine failing" is the usable form: write down what it would catch, and if you cannot, you have described a report.</text>
</svg>
