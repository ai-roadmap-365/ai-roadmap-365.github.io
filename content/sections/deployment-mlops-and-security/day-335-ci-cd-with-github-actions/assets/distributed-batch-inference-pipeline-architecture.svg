<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Distributed Batch Inference Pipeline Architecture">
  <title>Distributed Batch Inference Pipeline Architecture</title>
  <defs>
    <style>
      .d335a-bg { fill: #f8fafc; }
      .d335a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d335a-in { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d335a-wrk { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d335a-chk { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d335a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d335a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d335a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d335a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d335a-bg" />
  
  <text x="40" y="40" class="d335a-title">Distributed Batch Inference Pipeline (Celery / Ray)</text>
  <text x="40" y="65" class="d335a-subtitle">Distributed Batch Inference Pipeline Architecture showing Input Data Sliced into Batches, Message Broker Queue, Distributed GPU Worker Pool, Checkpoint Database, and Dead-Letter Queue</text>
  
  <!-- Ingestion & Broker -->
  <rect x="40" y="110" width="240" height="270" class="d335a-in" />
  <text x="55" y="145" class="d335a-header" fill="#1d4ed8">1. Job Queue &amp; Broker</text>
  <text x="55" y="180" class="d335a-text">• 1,000,000 Input Prompts</text>
  <text x="55" y="205" class="d335a-text">• Sliced into 1,000-item chunks</text>
  <text x="55" y="230" class="d335a-text">• Message Broker: Redis / SQS</text>
  <text x="55" y="255" class="d335a-text">• Job Metadata in PostgreSQL</text>
  <text x="55" y="295" class="d335a-text" font-weight="600" fill="#1d4ed8">Decoupled Architecture</text>
  <text x="55" y="320" class="d335a-text">Producers never block</text>
  
  <!-- GPU Worker Pool -->
  <rect x="315" y="110" width="240" height="270" class="d335a-wrk" />
  <text x="330" y="145" class="d335a-header" fill="#7e22ce">2. GPU Worker Pool (Spot)</text>
  <text x="330" y="180" class="d335a-text">• Worker #1: 4x A100 (Ray Actor)</text>
  <text x="330" y="205" class="d335a-text">• Worker #2: 4x A100 (Ray Actor)</text>
  <text x="330" y="230" class="d335a-text">• vLLM Offline Engine (Batch=256)</text>
  <text x="330" y="255" class="d335a-text">• 70% Discount on Spot Nodes</text>
  <text x="330" y="295" class="d335a-text" font-weight="600" fill="#7e22ce">Throughput: 8,500 Tok/s</text>
  <text x="330" y="320" class="d335a-text">Maximal GPU core saturation</text>
  
  <!-- Checkpoints & DLQ -->
  <rect x="590" y="110" width="270" height="270" class="d335a-chk" />
  <text x="605" y="145" class="d335a-header" fill="#15803d">3. Checkpoints &amp; DLQ</text>
  <text x="605" y="180" class="d335a-text">• Idempotent Checkpoint DB</text>
  <text x="605" y="205" class="d335a-text">• Writes outputs to S3 / Parquet</text>
  <text x="605" y="230" class="d335a-text">• **Dead-Letter Queue (DLQ):**</text>
  <text x="605" y="250" class="d335a-text">  Isolates malformed prompts</text>
  <text x="605" y="295" class="d335a-text" font-weight="600" fill="#15803d">Fault-Tolerant Resumption</text>
  <text x="605" y="320" class="d335a-text">Zero data loss on node kill</text>
</svg>