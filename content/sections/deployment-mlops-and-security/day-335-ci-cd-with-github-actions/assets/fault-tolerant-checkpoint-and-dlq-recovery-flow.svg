<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Fault-Tolerant Checkpoint and DLQ Recovery Flow">
  <title>Fault-Tolerant Checkpoint and DLQ Recovery Flow</title>
  <defs>
    <style>
      .d335b-bg { fill: #f8fafc; }
      .d335b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d335b-rec { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d335b-dlq { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 8px; }
      .d335b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d335b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d335b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d335b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d335b-bg" />
  
  <text x="40" y="40" class="d335a-title">Batch Failure Recovery &amp; DLQ Quarantine</text>
  <text x="40" y="65" class="d335a-subtitle">Fault-Tolerant Checkpoint and DLQ Recovery Flow showing Worker Preemption resuming from Last Checkpoint and Malformed Record Routed to Dead-Letter Queue</text>
  
  <!-- State Resumption -->
  <rect x="40" y="110" width="390" height="270" class="d335b-rec" />
  <text x="60" y="145" class="d335b-header" fill="#1d4ed8">Scenario A: Spot Node Preemption</text>
  <text x="60" y="180" class="d335b-text">• Batch #45 (Items 45,000 ➔ 46,000) running</text>
  <text x="60" y="205" class="d335b-text">• AWS preempts Spot GPU worker node</text>
  <text x="60" y="230" class="d335b-text">• Heartbeat timeout triggers orchestrator</text>
  <text x="60" y="255" class="d335b-text">• New worker claims Batch #45 from Redis queue</text>
  <text x="60" y="280" class="d335b-text">• Resumes cleanly without re-running Batches 1-44</text>
  <text x="60" y="320" class="d335b-text" font-weight="600" fill="#1d4ed8">Zero Compute Duplication</text>
  
  <!-- Dead Letter Queue -->
  <rect x="470" y="110" width="390" height="270" class="d335b-dlq" />
  <text x="490" y="145" class="d335b-header" fill="#b91c1c">Scenario B: Malformed Input Poison Pill</text>
  <text x="490" y="180" class="d335b-text">• Item #8,421 contains corrupted 100k token prompt</text>
  <text x="490" y="205" class="d335b-text">• Worker crashes with TokenLimitExceeded</text>
  <text x="490" y="230" class="d335b-text">• Retry #1 ➔ Fails; Retry #2 ➔ Fails; Retry #3 ➔ Fails</text>
  <text x="490" y="255" class="d335b-text">• Orchestrator moves Item #8,421 to **Dead-Letter Queue**</text>
  <text x="490" y="280" class="d335b-text">• Remaining 999,999 batch items complete successfully</text>
  <text x="490" y="320" class="d335b-text" font-weight="600" fill="#b91c1c">Prevents Pipeline Poisoning</text>
</svg>