<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six mechanics, and the first is the security one.">
  <title>What the runner does</title>
  <style>
    .pipeline-mechanics-bg   { fill: #f8fafc; }
    .pipeline-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pipeline-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .pipeline-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .pipeline-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .pipeline-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .pipeline-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .pipeline-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .pipeline-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .pipeline-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .pipeline-mechanics-stage { opacity: 1; }

    .pipeline-mechanics-s0 { animation-delay: 0.00s; }
    .pipeline-mechanics-e0 { animation-delay: 0.00s; }
    .pipeline-mechanics-s1 { animation-delay: 1.37s; }
    .pipeline-mechanics-e1 { animation-delay: 1.37s; }
    .pipeline-mechanics-s2 { animation-delay: 2.74s; }
    .pipeline-mechanics-e2 { animation-delay: 2.74s; }
    .pipeline-mechanics-s3 { animation-delay: 4.11s; }
    .pipeline-mechanics-e3 { animation-delay: 4.11s; }
    .pipeline-mechanics-s4 { animation-delay: 5.49s; }
    .pipeline-mechanics-e4 { animation-delay: 5.49s; }
    .pipeline-mechanics-s5 { animation-delay: 6.86s; }
    .pipeline-mechanics-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .pipeline-mechanics-conn  { animation: pipeline-mechanics-trace 9.600000000000001s ease-in-out infinite; }
      .pipeline-mechanics-stage { animation: pipeline-mechanics-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes pipeline-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes pipeline-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .pipeline-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .pipeline-mechanics-stage { animation: pipeline-mechanics-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes pipeline-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="pipeline-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="pipeline-mechanics-bg" width="980" height="322"/>
  <text class="pipeline-mechanics-h1"  x="30" y="40">What the runner does</text>
  <text class="pipeline-mechanics-sub" x="30" y="64">Six mechanics, and the first is the security one.</text>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s0">
    <rect class="pipeline-mechanics-warn" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="44" y="142">01</text>
    <text class="pipeline-mechanics-name" x="70" y="142">A trigger fires</text>
    <text class="pipeline-mechanics-desc" x="44" y="166">It decides the</text>
    <text class="pipeline-mechanics-desc" x="44" y="182">permissions and</text>
    <text class="pipeline-mechanics-desc" x="44" y="198">whether secrets are</text>
  </g>
  <line class="pipeline-mechanics-line pipeline-mechanics-conn pipeline-mechanics-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#pipeline-mechanics-tip)"/>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s1">
    <rect class="pipeline-mechanics-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="201" y="142">02</text>
    <text class="pipeline-mechanics-name" x="227" y="142">The runner builds the job graph</text>
    <text class="pipeline-mechanics-desc" x="201" y="166">From needs:,</text>
    <text class="pipeline-mechanics-desc" x="201" y="182">starting every job</text>
    <text class="pipeline-mechanics-desc" x="201" y="198">whose dependencies</text>
  </g>
  <line class="pipeline-mechanics-line pipeline-mechanics-conn pipeline-mechanics-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#pipeline-mechanics-tip)"/>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s2">
    <rect class="pipeline-mechanics-box" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="358" y="142">03</text>
    <text class="pipeline-mechanics-name" x="384" y="142">Independent jobs run concurrently</text>
    <text class="pipeline-mechanics-desc" x="358" y="166">Subject to available</text>
    <text class="pipeline-mechanics-desc" x="358" y="182">runners — a</text>
    <text class="pipeline-mechanics-desc" x="358" y="198">concurrency limit</text>
    <text class="pipeline-mechanics-edge" x="358" y="242">bounded</text>
  </g>
  <line class="pipeline-mechanics-line pipeline-mechanics-conn pipeline-mechanics-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#pipeline-mechanics-tip)"/>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s3">
    <rect class="pipeline-mechanics-good" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="515" y="142">04</text>
    <text class="pipeline-mechanics-name" x="541" y="142">Each job restores and saves caches</text>
    <text class="pipeline-mechanics-desc" x="515" y="166">A cache on the</text>
    <text class="pipeline-mechanics-desc" x="515" y="182">critical path is</text>
    <text class="pipeline-mechanics-desc" x="515" y="198">usually the largest</text>
  </g>
  <line class="pipeline-mechanics-line pipeline-mechanics-conn pipeline-mechanics-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#pipeline-mechanics-tip)"/>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s4">
    <rect class="pipeline-mechanics-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="672" y="142">05</text>
    <text class="pipeline-mechanics-name" x="698" y="142">A failing job stops its dependants</text>
    <text class="pipeline-mechanics-desc" x="672" y="166">That is the gate.</text>
  </g>
  <line class="pipeline-mechanics-line pipeline-mechanics-conn pipeline-mechanics-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#pipeline-mechanics-tip)"/>
  <g class="pipeline-mechanics-stage pipeline-mechanics-s5">
    <rect class="pipeline-mechanics-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="pipeline-mechanics-step" x="829" y="142">06</text>
    <text class="pipeline-mechanics-name" x="855" y="142">On success, deploy runs with secrets</text>
    <text class="pipeline-mechanics-desc" x="829" y="166">Which secrets, under</text>
    <text class="pipeline-mechanics-desc" x="829" y="182">which trigger, is</text>
    <text class="pipeline-mechanics-desc" x="829" y="198">the security</text>
  </g>
  <text class="pipeline-mechanics-sub" x="30" y="304">Dependency installation is usually the slowest thing nobody thinks about, which is why it is both on the critical path and the single most rewarding place to put a cache.</text>
</svg>
