visuals:
  - id: two-durations-two-fixes
    file: assets/two-durations-two-fixes.svg
    type: diagram
    title: Two Durations, Two Different Fixes
    alt: Two Durations, Two Different Fixes contrasting critical path wall clock against total runner
      minutes
    description: Eight jobs drawn on a timeline with the critical path highlighted, showing 12.7
      minutes of wall clock against 22.2 runner minutes and which change improves each.
  - id: deleting-the-useless-job
    file: assets/deleting-the-useless-job.svg
    type: diagram
    title: Deleting the Useless Job Saves Nothing
    alt: Deleting the Useless Job Saves Nothing showing two off-path jobs saving zero wall clock
      against one cache saving 3.7 minutes
    description: The two changes side by side — removing both never-firing gates for 0.0 minutes of
      wall clock, against one dependency cache on the critical path for 3.7.
  - id: graph-reading
    file: assets/graph-reading.svg
    type: diagram
    title: 'Read the workflow as a graph'
    alt: 'Diagram: how a workflow''s dependency graph produces its two durations'
    description: 'A four-stage description of reading a CI workflow as a graph, covering job start conditions, the critical path, the sum of runner minutes, and which fix improves which.'
  - id: pr-or-pr-target
    file: assets/pr-or-pr-target.svg
    type: diagram
    title: 'One word, categorically different'
    alt: 'Diagram: the pull_request trigger compared with pull_request_target'
    description: 'A two-column comparison of the pull_request trigger against pull_request_target by context, secret availability and what a hostile fork can achieve.'
  - id: ci-eras
    file: assets/ci-eras.svg
    type: diagram
    title: 'Five steps to the modern pipeline'
    alt: 'Diagram: the progression from CruiseControl to the Actions marketplace'
    description: 'A five-stage progression through CruiseControl, Jenkins, pipeline-as-code, GitHub Actions and the pull_request_target trigger.'
  - id: gate-or-report
    file: assets/gate-or-report.svg
    type: diagram
    title: 'A gate is a claim'
    alt: 'Diagram: a gate that blocks a merge compared with a report that informs'
    description: 'A two-column comparison of a CI gate against a report, and what to do with a gate that has never failed.'
  - id: pipeline-mechanics
    file: assets/pipeline-mechanics.svg
    type: diagram
    title: 'What the runner does'
    alt: 'Diagram: how a CI runner executes a workflow graph'
    description: 'A six-stage description of CI execution covering triggers and permissions, graph construction, concurrency, caching, gate failures, and the deploy job''s secrets.'
  - id: faster-or-cheaper
    file: assets/faster-or-cheaper.svg
    type: diagram
    title: 'Faster and cheaper are different jobs'
    alt: 'Diagram: shortening the critical path compared with removing off-path work'
    description: 'A two-column comparison of changes that reduce wall-clock time against changes that reduce runner minutes.'
  - id: dinner-analogy
    file: assets/dinner-analogy.svg
    type: diagram
    title: 'Getting dinner ready'
    alt: 'Diagram: the critical path of cooking compared with a parallel chore'
    description: 'A two-column comparison of the cooking sequence that determines when dinner is ready against a chore that runs alongside it.'
  - id: finish-table
    file: assets/finish-table.svg
    type: diagram
    title: 'Where the parallelism actually is'
    alt: 'Diagram: the measured finish times of an eight-job pipeline'
    description: 'A four-stage reading of measured job finish times showing where jobs run concurrently and which dependency determines the deploy time.'
  - id: two-fixes-priced
    file: assets/two-fixes-priced.svg
    type: diagram
    title: 'Both fixes, priced'
    alt: 'Diagram: the measured saving from deleting off-path jobs compared with caching the install'
    description: 'A two-column comparison of the measured effect of removing two off-path jobs against adding a dependency cache to the critical path.'
  - id: ci-implications
    file: assets/ci-implications.svg
    type: diagram
    title: 'Five consequences of a privileged runner'
    alt: 'Diagram: the security, supply-chain, privilege, cost and scaling implications of CI'
    description: 'A five-stage description of CI implications covering the trigger''s secret exposure, third-party actions, explicit permissions, cache poisoning, and runner-minute billing.'
  - id: cache-versus-artefact
    file: assets/cache-versus-artefact.svg
    type: diagram
    title: 'A cache may be missing; an artefact may not'
    alt: 'Diagram: a build cache compared with a build artefact'
    description: 'A two-column comparison of caches and artefacts by guarantee, purpose and failure mode.'
  - id: ci-when
    file: assets/ci-when.svg
    type: diagram
    title: 'What to do from the first commit'
    alt: 'Diagram: CI practices worth adopting immediately against three to avoid'
    description: 'A two-column comparison of CI practices worth adopting from the start against three common mistakes.'
