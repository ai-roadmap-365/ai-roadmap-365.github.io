terms:
- term: Batch Inference
  definition: High-throughput asynchronous processing of large datasets where per-request latency is relaxed.
- term: Celery
  definition: An asynchronous task queue framework based on distributed message passing (Redis / RabbitMQ).
- term: Ray Data
  definition: A distributed data processing framework optimized for streaming batches across GPU worker
    actors.
- term: Spot GPU Instances
  definition: Discounted cloud compute capacity subject to preemption, ideal for fault-tolerant batch
    jobs.
- term: Dead-Letter Queue (DLQ)
  definition: A dedicated quarantine queue capturing records that repeatedly fail execution after maximum
    retries.
- term: Idempotent Checkpoint
  definition: State tracking ensuring tasks can be safely re-executed without producing duplicate outputs.
- term: Worker Heartbeat
  definition: Periodic signals emitted by worker processes to prove liveness to the orchestrator.
- term: OpenAI Batch API
  definition: A 50% discounted asynchronous batch endpoint processing prompts within a 24-hour SLA window.
