terms:
  - term: Job Graph
    definition: The directed graph a workflow describes, where jobs are nodes and needs declarations
      are edges. Every useful question about a pipeline is a question about this graph.
  - term: Critical Path
    definition: The longest chain of dependent jobs, and therefore the wall-clock time of the
      pipeline. Shortening it is the only way to make a pipeline finish sooner.
  - term: Wall Clock
    definition: How long the person watching the pull request waits. Determined by the critical path,
      not by the number of jobs.
  - term: Runner Minutes
    definition: The sum of every job's duration, and what you are billed for. Reduced by removing work
      anywhere, on the critical path or not.
  - term: Gate
    definition: A job whose failure blocks a merge. A gate that has never failed is a report wearing a
      gate's clothes, and it costs time on every run.
  - term: Dependency Cache
    definition: Stored dependencies restored at the start of a job. Usually the largest single saving
      available, and only a wall-clock saving when the cached job is on the critical path.
  - term: pull_request
    definition: A trigger that runs against a fork's code with a read-only token and no secrets. A
      hostile pull request can run anything and gain nothing.
  - term: pull_request_target
    definition: A trigger that runs in the base repository's context with its secrets, so a workflow
      can label or comment on a fork's pull request. It must never run the fork's code.
  - term: GITHUB_TOKEN
    definition: The automatically provisioned token for a workflow run. Its permissions should be set
      explicitly and narrowed per job rather than inherited.
  - term: Action Pinning
    definition: Referencing a third-party action by full commit SHA rather than a mutable tag. A tag
      can be moved by its author or by anyone who compromises them.
  - term: Concurrency Limit
    definition: The number of runners available at once. It converts theoretical parallelism into
      queueing, and it can invert the advice about which job to remove.
