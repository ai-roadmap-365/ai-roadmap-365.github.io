<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Three parts, none executable.">
  <title>What is actually in the file</title>
  <style>
    .safetensors-format-bg   { fill: #f8fafc; }
    .safetensors-format-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-format-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-format-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-format-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-format-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safetensors-format-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .safetensors-format-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .safetensors-format-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .safetensors-format-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .safetensors-format-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .safetensors-format-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .safetensors-format-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .safetensors-format-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .safetensors-format-stage { opacity: 1; }

    .safetensors-format-s0 { animation-delay: 0.00s; }
    .safetensors-format-e0 { animation-delay: 0.00s; }
    .safetensors-format-s1 { animation-delay: 1.50s; }
    .safetensors-format-e1 { animation-delay: 1.50s; }
    .safetensors-format-s2 { animation-delay: 3.00s; }
    .safetensors-format-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .safetensors-format-conn  { animation: safetensors-format-trace 6s ease-in-out infinite; }
      .safetensors-format-stage { animation: safetensors-format-arrive 6s ease-in-out infinite; }
    }
    @keyframes safetensors-format-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes safetensors-format-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .safetensors-format-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .safetensors-format-stage { animation: safetensors-format-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes safetensors-format-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="safetensors-format-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="safetensors-format-bg" width="980" height="322"/>
  <text class="safetensors-format-h1"  x="30" y="40">What is actually in the file</text>
  <text class="safetensors-format-sub" x="30" y="64">Three parts, none executable.</text>
  <g class="safetensors-format-stage safetensors-format-s0">
    <rect class="safetensors-format-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="safetensors-format-step" x="44" y="142">01</text>
    <text class="safetensors-format-name" x="70" y="142">8 bytes: header length</text>
    <text class="safetensors-format-desc" x="44" y="166">Little-endian unsigned 64-bit. How long the</text>
    <text class="safetensors-format-desc" x="44" y="182">JSON is.</text>
  </g>
  <line class="safetensors-format-line safetensors-format-conn safetensors-format-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#safetensors-format-tip)"/>
  <g class="safetensors-format-stage safetensors-format-s1">
    <rect class="safetensors-format-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="safetensors-format-step" x="359" y="142">02</text>
    <text class="safetensors-format-name" x="385" y="142">N bytes: JSON metadata</text>
    <text class="safetensors-format-desc" x="359" y="166">Tensor names, dtypes, shapes, byte offsets.</text>
    <text class="safetensors-format-desc" x="359" y="182">Parsed, not evaluated.</text>
  </g>
  <line class="safetensors-format-line safetensors-format-conn safetensors-format-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#safetensors-format-tip)"/>
  <g class="safetensors-format-stage safetensors-format-s2">
    <rect class="safetensors-format-good" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="safetensors-format-step" x="674" y="142">03</text>
    <text class="safetensors-format-name" x="700" y="142">The rest: raw buffers</text>
    <text class="safetensors-format-desc" x="674" y="166">Contiguous memory, mapped with mmap. Zero</text>
    <text class="safetensors-format-desc" x="674" y="182">Python objects created.</text>
    <text class="safetensors-format-edge" x="674" y="242">zero-copy</text>
  </g>
  <text class="safetensors-format-sub" x="30" y="304">There is no place in that structure for an instruction: the JSON is data by construction and the buffer is numbers, which is what makes the guarantee architectural rather than a matter of careful parsing.</text>
</svg>
