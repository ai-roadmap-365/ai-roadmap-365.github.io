<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Unsealed capsule, or a holographic batch seal.">
  <title>Pharmaceutical packaging</title>
  <style>
    .blister-pack-bg   { fill: #f8fafc; }
    .blister-pack-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blister-pack-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blister-pack-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blister-pack-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blister-pack-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blister-pack-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blister-pack-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blister-pack-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blister-pack-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blister-pack-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blister-pack-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blister-pack-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blister-pack-row { opacity: 1; }
    .blister-pack-r0 { animation-delay: 0.00s; }
    .blister-pack-r1 { animation-delay: 0.45s; }
    .blister-pack-r2 { animation-delay: 0.90s; }
    .blister-pack-r3 { animation-delay: 1.35s; }
    .blister-pack-r4 { animation-delay: 1.80s; }
    .blister-pack-row { animation: blister-pack-reveal 7.3s ease-in-out infinite; }
    @keyframes blister-pack-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blister-pack-bg" width="980" height="390"/>
  <text class="blister-pack-h1"  x="30" y="40">Pharmaceutical packaging</text>
  <text class="blister-pack-sub" x="30" y="64">Unsealed capsule, or a holographic batch seal.</text>
  <rect class="blister-pack-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blister-pack-name" x="46" y="122">An unmarked capsule</text>
  <text class="blister-pack-desc" x="46" y="142">Handed over in an alleyway.</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r0" x="46" y="182">No packaging</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r1" x="46" y="216">Anyone could have altered the powder</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r2" x="46" y="250">No way to inspect without consuming</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r3" x="46" y="284">No manufacturer, no batch</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r4" x="46" y="318">This is an unsigned pickle checkpoint</text>
  <rect class="blister-pack-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blister-pack-name" x="526" y="122">Sealed and certified</text>
  <text class="blister-pack-desc" x="526" y="142">Inspectable, and provable.</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r0" x="526" y="182">Clear, tamper-evident blister packaging</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r1" x="526" y="216">Contents visible without opening</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r2" x="526" y="250">A serialised holographic batch seal</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r3" x="526" y="284">Scan to verify the facility and the batch</text>
  <text class="blister-pack-desc blister-pack-row blister-pack-r4" x="526" y="318">This is SafeTensors plus Sigstore</text>
  <text class="blister-pack-sub" x="30" y="372">The transparency and the seal do different jobs: one lets you see there is nothing hidden, and the other tells you who made it — which is why the format change alone does not remove the need for signing.</text>
</svg>
