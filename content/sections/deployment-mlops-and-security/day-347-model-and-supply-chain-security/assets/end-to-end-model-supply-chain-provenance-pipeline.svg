<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="End-to-End Model Supply Chain Provenance Pipeline">
  <title>End-to-End Model Supply Chain Provenance Pipeline</title>
  <defs>
    <style>
      .d347b-bg { fill: #f8fafc; }
      .d347b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d347b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d347b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d347b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d347b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d347b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d347b-bg" />
  
  <text x="40" y="40" class="d347a-title">AI Model Supply Chain Security Architecture</text>
  <text x="40" y="65" class="d347a-subtitle">End-to-End Model Supply Chain Provenance Pipeline showing Training Ingest, Static ModelScan AST Inspection, Sigstore Cosign Signing, AIBOM Generation, and Kubernetes Admission Gate Verification</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d347b-step" />
  <text x="55" y="145" class="d347b-header" fill="#1d4ed8">1. Model Ingest</text>
  <text x="55" y="180" class="d347b-text">• Download weights</text>
  <text x="55" y="205" class="d347b-text">• Verify file format</text>
  <text x="55" y="230" class="d347b-text">• Block .pkl &amp; .bin</text>
  <text x="55" y="255" class="d347b-text">• Enforce .safetensors</text>
  <text x="55" y="300" class="d347b-text" font-weight="600">Strict Ingress Filter</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d347b-step" />
  <text x="265" y="145" class="d347b-header" fill="#1d4ed8">2. AST Scanner</text>
  <text x="265" y="180" class="d347b-text">• ModelScan inspection</text>
  <text x="265" y="205" class="d347b-text">• Detect unsafe opcodes</text>
  <text x="265" y="230" class="d347b-text">• Scan tokenizer.json</text>
  <text x="265" y="255" class="d347b-text">• Scan config.json</text>
  <text x="265" y="300" class="d347b-text" font-weight="600">Zero Execution Scan</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d347b-step" />
  <text x="475" y="145" class="d347b-header" fill="#1d4ed8">3. Sigstore Sign</text>
  <text x="475" y="180" class="d347b-text">• Compute SHA256 hash</text>
  <text x="475" y="205" class="d347b-text">• Sign with Cosign key</text>
  <text x="475" y="230" class="d347b-text">• Generate AIBOM JSON</text>
  <text x="475" y="255" class="d347b-text">• Rekor Transparency Log</text>
  <text x="475" y="300" class="d347b-text" font-weight="600">Immutable Lineage</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d347b-step" />
  <text x="685" y="145" class="d347b-header" fill="#1d4ed8">4. K8s Admission</text>
  <text x="685" y="180" class="d347b-text">• OPA / Kyverno gate</text>
  <text x="685" y="205" class="d347b-text">• Verify signature</text>
  <text x="685" y="230" class="d347b-text">• Mount SafeTensors</text>
  <text x="685" y="255" class="d347b-text">• Spawn serving Pod</text>
  <text x="685" y="300" class="d347b-text" font-weight="600">Zero-Trust Serving</text>
</svg>