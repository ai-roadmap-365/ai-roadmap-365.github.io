terms:
- term: Pickle RCE Hazard
  definition: A vulnerability where unpickling malicious files executes arbitrary operating system commands.
- term: SafeTensors
  definition: A safe, zero-copy, memory-mapped tensor format designed to replace insecure pickle checkpoints.
- term: ModelScan
  definition: An open-source security tool that inspects ML model artifacts for embedded malicious code.
- term: AIBOM
  definition: AI Software Bill of Materials documenting model hashes, datasets, and supply chain provenance.
- term: Sigstore / Cosign
  definition: A standard and toolset for signing, verifying, and checking the provenance of software and
    model artifacts.
- term: SLSA Provenance
  definition: Supply-chain Levels for Software Artifacts framework ensuring build integrity and tamper-resistance.
- term: Weight Poisoning
  definition: A backdoor attack embedding malicious trigger behaviors into neural network weights during
    training.
- term: Zero-Copy Memory Mapping
  definition: Mapping disk files directly into process memory without intermediary buffer copies.
