learning_promise: 'Master AI model supply chain security: eliminate Python pickle deserialization RCE
  vulnerabilities, enforce SafeTensors formats, inspect model ASTs with ModelScan, verify Sigstore cryptographic
  signatures, and generate AI Software Bills of Materials (AIBOM) in Python.'
objectives:
- Analyze the mechanics of Arbitrary Remote Code Execution (RCE) embedded inside Python pickle serialized
  model weights (`torch.load`, `.pkl`, `.bin`).
- Deploy Hugging Face SafeTensors for zero-copy, immutable model weight storage immune to arbitrary code
  execution.
- Implement static AST inspection scanning model artifacts for malicious `__reduce__` system calls using
  ModelScan principles.
- Verify cryptographic model integrity and provenance using Sigstore Cosign signatures and SLSA Level
  3 supply chain standards.
- Build a Model Supply Chain Security Scanner in Python that validates file formats, inspects metadata
  headers, and verifies SHA256 cryptographic signatures.
