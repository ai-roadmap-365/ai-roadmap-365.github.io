questions:
- question: Why is loading model weights via standard Python `torch.load('model.pt')` or `pickle.load()`
    an extreme security hazard when downloading public checkpoints?
  options:
  - Pickle files take too long to download
  - 'Loading a pickle executes arbitrary attacker code'
  - Pickle files only run on Windows
  - PyTorch does not support GPU acceleration with pickle
  answer_index: 1
  explanation: Pickle deserialization executes arbitrary code during reconstruction, creating immediate
    Remote Code Execution (RCE) vulnerabilities.
- question: How does the Hugging Face `SafeTensors` format eliminate arbitrary code execution hazards?
  options:
  - By encrypting the file with a password
  - By compressing files with ZIP
  - 'SafeTensors holds raw bytes and a JSON header only'
  - By requiring a credit card to open
  answer_index: 2
  explanation: SafeTensors stores pure numeric tensors and a JSON header with zero executable bytecode.
- question: What is an 'AI Software Bill of Materials' (AIBOM)?
  options:
  - An invoice sent to accounting for GPU costs
  - A hardware warranty certificate
  - A list of Python print statements
  - 'A manifest of the model''s full lineage'
  answer_index: 3
  explanation: An AIBOM tracks the full provenance, dependencies, and cryptographic hashes of models and
    training pipelines.
- question: How does cryptographic model signing with Sigstore / Cosign protect AI pipelines?
  options:
  - 'It signs the artifact and logs it immutably'
  - It makes the model run at 100 FPS
  - It automatically trains the neural network
  - It reduces model size by 50%
  answer_index: 0
  explanation: Cryptographic signatures verify that model checkpoints have not been altered or backdoored
    in transit.
- question: What does a static model scanner (like ModelScan) inspect when evaluating an unverified PyTorch
    checkpoint?
  options:
  - The color of the graphics card
  - 'The opcode stream, for unsafe imports and REDUCE'
  - The user's monitor resolution
  - The temperature of the CPU
  answer_index: 1
  explanation: ModelScan analyzes pickle opcodes without executing them to detect malicious system calls.
