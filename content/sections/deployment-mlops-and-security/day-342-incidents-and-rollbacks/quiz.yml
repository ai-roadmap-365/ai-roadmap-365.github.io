questions:
- question: What is the primary philosophy behind a 'Blameless Post-Mortem' in SRE culture?
  options:
  - Finding out which engineer made the mistake and firing them immediately
  - Assuming all engineers had good intentions based on information available at the time, focusing ruthlessly
    on systemic, architectural, and tooling weaknesses rather than human error to prevent recurrence
  - Pretending the incident never happened to avoid bad publicity
  - Deleting all monitoring logs from the database
  answer_index: 1
  explanation: Blameless post-mortems investigate systemic vulnerabilities rather than blaming individuals,
    building resilient organizations.
- question: What is an 'Automated Rollback Circuit Breaker' in an AI deployment pipeline?
  options:
  - A physical electrical fuse in the datacenter
  - An automated safety mechanism that continuously monitors candidate model error rates and P99 latency;
    if thresholds are violated for N consecutive seconds, the load balancer automatically reverts 100%
    of traffic to the stable baseline without human intervention
  - A script that deletes the Kubernetes cluster
  - An AI model that writes apology emails
  answer_index: 1
  explanation: Automated circuit breakers instantly revert traffic to stable baselines upon metric anomalies,
    minimizing MTTR.
- question: What is 'Mean Time to Recovery' (MTTR) and why is it the gold-standard metric for incident
    response?
  options:
  - The time it takes to buy a new server
  - The average elapsed time from the moment a production outage begins until full operational service
    is restored to end users; lower MTTR directly reduces customer revenue loss
  - The time it takes to write a Python function
  - The duration of the daily standup meeting
  answer_index: 1
  explanation: MTTR measures the speed of incident mitigation and service restoration.
- question: What is the role of the 'Incident Commander' (IC) during a P0 production AI outage?
  options:
  - Writing code to fix the bug directly while in the meeting
  - Leading the incident response room, delegating diagnostic tasks to technical leads, managing internal
    and external communications, and keeping the team focused on rapid mitigation rather than root-cause
    fixing during the active outage
  - Approving employee vacation requests
  - Shutting down the company website
  answer_index: 1
  explanation: The Incident Commander orchestrates the response team and communications, delegating technical
    investigation.
- question: Why is 'Mitigate First, Investigate Root Cause Second' the foundational rule of incident response?
  options:
  - Because root causes do not matter
  - Because restoring customer uptime (e.g. by rolling back to the previous stable revision in 30 seconds)
    immediately stops business revenue bleeding, while deep code debugging can take hours or days in staging
  - Because rollbacks are free
  - Because investigating requires a court order
  answer_index: 1
  explanation: Stopping customer impact via instant rollback must always precede time-consuming root cause
    debugging.
