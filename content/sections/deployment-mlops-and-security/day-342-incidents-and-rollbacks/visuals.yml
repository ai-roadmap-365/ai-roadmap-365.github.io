visuals:
- id: incident-lifecycle-and-automated-circuit-breaker-rollback
  file: assets/incident-lifecycle-and-automated-circuit-breaker-rollback.svg
  type: diagram
  title: Incident Lifecycle and Automated Circuit Breaker Rollback
  alt: Incident Lifecycle and Automated Circuit Breaker Rollback showing Anomaly Detection, Incident Commander
    Triage, Automated Circuit Breaker Trip reverting traffic to Baseline, and Blameless Post-Mortem
  description: System architecture diagram illustrating incident state progression and automated fast
    rollback mechanisms.
- id: blameless-post-mortem-five-whys-root-cause-analysis
  file: assets/blameless-post-mortem-five-whys-root-cause-analysis.svg
  type: diagram
  title: Blameless Post-Mortem Five Whys Root Cause Analysis
  alt: Blameless Post-Mortem Five Whys Root Cause Analysis detailing step-by-step causal investigation
    from Surface Symptom to Architectural Defect and Preventive Action Items
  description: Methodology diagram illustrating the Five Whys root cause analysis framework for AI incidents.
- id: incident-order
  file: assets/incident-order.svg
  type: diagram
  title: 'The order of operations'
  alt: 'Diagram: the order of actions during an incident'
  description: 'A four-stage incident response sequence covering automated mitigation, incident command, communication and post-incident analysis.'
- id: mitigate-or-debug
  file: assets/mitigate-or-debug.svg
  type: diagram
  title: 'Mitigate first, debug later'
  alt: 'Diagram: mitigating an incident first compared with diagnosing it first'
  description: 'A two-column comparison of restoring service before diagnosis against diagnosing while the outage continues.'
- id: incident-eras
  file: assets/incident-eras.svg
  type: diagram
  title: 'Three eras of incident response'
  alt: 'Diagram: the progression from the blame era to automated AI circuit breakers'
  description: 'A three-stage progression of incident practice from punitive culture through blameless post-mortems to automated sub-second circuit tripping.'
- id: not-blame-not-debugging
  file: assets/not-blame-not-debugging.svg
  type: diagram
  title: 'Two things it is never'
  alt: 'Diagram: what incident management is compared with two practices that undermine it'
  description: 'A two-column comparison of correct incident management against blaming individuals and debugging during an active outage.'
- id: breaker-states
  file: assets/breaker-states.svg
  type: diagram
  title: 'The circuit breaker''s three states'
  alt: 'Diagram: the closed, open and half-open states of an incident circuit breaker'
  description: 'A four-stage description of circuit breaker operation covering normal measurement, tripping, redirected traffic and probe-based recovery.'
- id: five-whys
  file: assets/five-whys.svg
  type: diagram
  title: 'Five whys, on a real incident'
  alt: 'Diagram: a five-whys causal chain from symptom to architectural defect'
  description: 'A five-stage causal analysis descending from a surface symptom through proximate causes to an architectural defect and a preventive action.'
- id: aviation-analogy
  file: assets/aviation-analogy.svg
  type: diagram
  title: 'Aviation safety protocols'
  alt: 'Diagram: automated flight recovery and independent investigation as an incident analogy'
  description: 'A two-column comparison of automated aircraft recovery against post-incident investigation, as an analogy for circuit breakers and post-mortems.'
- id: chaos-verification
  file: assets/chaos-verification.svg
  type: diagram
  title: 'Prove the breaker trips'
  alt: 'Diagram: verifying a circuit breaker by injected failure compared with assuming it works'
  description: 'A two-column comparison of deliberately exercising a circuit breaker in staging against trusting that it will work when needed.'
- id: blameless-rules
  file: assets/blameless-rules.svg
  type: diagram
  title: 'Three rules that make it blameless'
  alt: 'Diagram: the three principles of a blameless post-mortem and the action-item deadline'
  description: 'A four-stage description of blameless post-mortem principles covering anonymised timelines, systemic focus, and enforced action-item deadlines.'
- id: incident-implications
  file: assets/incident-implications.svg
  type: diagram
  title: 'Four consequences of fast rollback'
  alt: 'Diagram: the security, cost, reliability and cultural implications of automated rollback'
  description: 'A four-stage description of incident management implications covering post-incident secret rotation, warm standby cost, MTTR reduction and deployment velocity.'
- id: rollback-or-forward
  file: assets/rollback-or-forward.svg
  type: diagram
  title: 'Roll back, or fix forward'
  alt: 'Diagram: rolling back during an incident compared with fixing forward'
  description: 'A two-column comparison of rolling back to a known-good revision against deploying a fix during an active incident.'
- id: incident-when
  file: assets/incident-when.svg
  type: diagram
  title: 'Where formal incident process belongs'
  alt: 'Diagram: when formal incident command is warranted and what applies at any scale'
  description: 'A two-column comparison of systems that warrant full incident command protocols against smaller systems, and the controls that apply either way.'
