<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The stick-shaker, and the NTSB.">
  <title>Aviation safety protocols</title>
  <style>
    .aviation-analogy-bg   { fill: #f8fafc; }
    .aviation-analogy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aviation-analogy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aviation-analogy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aviation-analogy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aviation-analogy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .aviation-analogy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .aviation-analogy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .aviation-analogy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .aviation-analogy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .aviation-analogy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .aviation-analogy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .aviation-analogy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .aviation-analogy-row { opacity: 1; }
    .aviation-analogy-r0 { animation-delay: 0.00s; }
    .aviation-analogy-r1 { animation-delay: 0.45s; }
    .aviation-analogy-r2 { animation-delay: 0.90s; }
    .aviation-analogy-r3 { animation-delay: 1.35s; }
    .aviation-analogy-r4 { animation-delay: 1.80s; }
    .aviation-analogy-row { animation: aviation-analogy-reveal 7.3s ease-in-out infinite; }
    @keyframes aviation-analogy-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="aviation-analogy-bg" width="980" height="390"/>
  <text class="aviation-analogy-h1"  x="30" y="40">Aviation safety protocols</text>
  <text class="aviation-analogy-sub" x="30" y="64">The stick-shaker, and the NTSB.</text>
  <rect class="aviation-analogy-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="aviation-analogy-name" x="46" y="122">In the moment</text>
  <text class="aviation-analogy-desc" x="46" y="142">Automatic, immediate.</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r0" x="46" y="182">Airflow drops: the stick-shaker fires</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r1" x="46" y="216">The flight computer lowers the nose</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r2" x="46" y="250">Airspeed recovers</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r3" x="46" y="284">Nobody debates the cause mid-stall</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r4" x="46" y="318">This is the circuit breaker</text>
  <rect class="aviation-analogy-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="aviation-analogy-name" x="526" y="122">Afterwards</text>
  <text class="aviation-analogy-desc" x="526" y="142">Investigation, not blame.</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r0" x="526" y="182">Investigators read the flight recorder</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r1" x="526" y="216">They do not blame the pilot</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r2" x="526" y="250">They redesign the pitot heating</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r3" x="526" y="284">So ice can never block it again</text>
  <text class="aviation-analogy-desc aviation-analogy-row aviation-analogy-r4" x="526" y="318">This is the post-mortem</text>
  <text class="aviation-analogy-sub" x="30" y="372">The two halves need each other: automatic recovery without investigation means the same stall recurs forever, and investigation without automatic recovery means every stall is survived by luck.</text>
</svg>
