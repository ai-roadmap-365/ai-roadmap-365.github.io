<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Each answer is a system, not a person.">
  <title>Five whys, on a real incident</title>
  <style>
    .five-whys-bg   { fill: #f8fafc; }
    .five-whys-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-whys-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-whys-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-whys-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-whys-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .five-whys-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .five-whys-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .five-whys-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .five-whys-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .five-whys-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .five-whys-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .five-whys-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .five-whys-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .five-whys-stage { opacity: 1; }

    .five-whys-s0 { animation-delay: 0.00s; }
    .five-whys-e0 { animation-delay: 0.00s; }
    .five-whys-s1 { animation-delay: 1.33s; }
    .five-whys-e1 { animation-delay: 1.33s; }
    .five-whys-s2 { animation-delay: 2.67s; }
    .five-whys-e2 { animation-delay: 2.67s; }
    .five-whys-s3 { animation-delay: 4.00s; }
    .five-whys-e3 { animation-delay: 4.00s; }
    .five-whys-s4 { animation-delay: 5.33s; }
    .five-whys-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .five-whys-conn  { animation: five-whys-trace 8s ease-in-out infinite; }
      .five-whys-stage { animation: five-whys-arrive 8s ease-in-out infinite; }
    }
    @keyframes five-whys-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes five-whys-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .five-whys-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .five-whys-stage { animation: five-whys-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes five-whys-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="five-whys-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="five-whys-bg" width="980" height="322"/>
  <text class="five-whys-h1"  x="30" y="40">Five whys, on a real incident</text>
  <text class="five-whys-sub" x="30" y="64">Each answer is a system, not a person.</text>
  <g class="five-whys-stage five-whys-s0">
    <rect class="five-whys-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="five-whys-step" x="44" y="142">01</text>
    <text class="five-whys-name" x="70" y="142">Symptom: workers crashed</text>
    <text class="five-whys-desc" x="44" y="166">CUDA out of memory during</text>
    <text class="five-whys-desc" x="44" y="182">a traffic surge.</text>
  </g>
  <line class="five-whys-line five-whys-conn five-whys-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#five-whys-tip)"/>
  <g class="five-whys-stage five-whys-s1">
    <rect class="five-whys-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="five-whys-step" x="233" y="142">02</text>
    <text class="five-whys-name" x="259" y="142">Why? Long-context prompts</text>
    <text class="five-whys-desc" x="233" y="166">A burst of 8k-token</text>
    <text class="five-whys-desc" x="233" y="182">requests exhausted the KV</text>
    <text class="five-whys-desc" x="233" y="198">cache.</text>
  </g>
  <line class="five-whys-line five-whys-conn five-whys-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#five-whys-tip)"/>
  <g class="five-whys-stage five-whys-s2">
    <rect class="five-whys-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="five-whys-step" x="422" y="142">03</text>
    <text class="five-whys-name" x="448" y="142">Why? No length cap</text>
    <text class="five-whys-desc" x="422" y="166">The gateway accepted any</text>
    <text class="five-whys-desc" x="422" y="182">prompt length from any</text>
    <text class="five-whys-desc" x="422" y="198">tenant.</text>
  </g>
  <line class="five-whys-line five-whys-conn five-whys-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#five-whys-tip)"/>
  <g class="five-whys-stage five-whys-s3">
    <rect class="five-whys-warn" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="five-whys-step" x="611" y="142">04</text>
    <text class="five-whys-name" x="637" y="142">Why? Nothing tested it</text>
    <text class="five-whys-desc" x="611" y="166">CI had no long-context</text>
    <text class="five-whys-desc" x="611" y="182">suite. The case was never</text>
    <text class="five-whys-desc" x="611" y="198">exercised.</text>
  </g>
  <line class="five-whys-line five-whys-conn five-whys-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#five-whys-tip)"/>
  <g class="five-whys-stage five-whys-s4">
    <rect class="five-whys-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="five-whys-step" x="800" y="142">05</text>
    <text class="five-whys-name" x="826" y="142">Action: cap and test</text>
    <text class="five-whys-desc" x="800" y="166">A per-tenant length</text>
    <text class="five-whys-desc" x="800" y="182">limit, and a long-context</text>
    <text class="five-whys-desc" x="800" y="198">suite in CI.</text>
    <text class="five-whys-edge" x="800" y="242">14 days</text>
  </g>
  <text class="five-whys-sub" x="30" y="304">No step in that chain names a person, and every step names something changeable — which is the property that makes the analysis produce work items rather than an apology.</text>
</svg>
