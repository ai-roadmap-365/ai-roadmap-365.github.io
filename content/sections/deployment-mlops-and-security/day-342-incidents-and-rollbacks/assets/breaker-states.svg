<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="And what returns it to normal.">
  <title>The circuit breaker's three states</title>
  <style>
    .breaker-states-bg   { fill: #f8fafc; }
    .breaker-states-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .breaker-states-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .breaker-states-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .breaker-states-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .breaker-states-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .breaker-states-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .breaker-states-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .breaker-states-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .breaker-states-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .breaker-states-stage { opacity: 1; }

    .breaker-states-s0 { animation-delay: 0.00s; }
    .breaker-states-e0 { animation-delay: 0.00s; }
    .breaker-states-s1 { animation-delay: 1.28s; }
    .breaker-states-e1 { animation-delay: 1.28s; }
    .breaker-states-s2 { animation-delay: 2.56s; }
    .breaker-states-e2 { animation-delay: 2.56s; }
    .breaker-states-s3 { animation-delay: 3.84s; }
    .breaker-states-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .breaker-states-conn  { animation: breaker-states-trace 6.4s ease-in-out infinite; }
      .breaker-states-stage { animation: breaker-states-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes breaker-states-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes breaker-states-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .breaker-states-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .breaker-states-stage { animation: breaker-states-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes breaker-states-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="breaker-states-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="breaker-states-bg" width="980" height="322"/>
  <text class="breaker-states-h1"  x="30" y="40">The circuit breaker's three states</text>
  <text class="breaker-states-sub" x="30" y="64">And what returns it to normal.</text>
  <g class="breaker-states-stage breaker-states-s0">
    <rect class="breaker-states-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="breaker-states-step" x="44" y="142">01</text>
    <text class="breaker-states-name" x="70" y="142">CLOSED</text>
    <text class="breaker-states-desc" x="44" y="166">All traffic to the candidate.</text>
    <text class="breaker-states-desc" x="44" y="182">Rolling error rate measured</text>
    <text class="breaker-states-desc" x="44" y="198">continuously.</text>
  </g>
  <line class="breaker-states-line breaker-states-conn breaker-states-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#breaker-states-tip)"/>
  <g class="breaker-states-stage breaker-states-s1">
    <rect class="breaker-states-warn" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="breaker-states-step" x="280" y="142">02</text>
    <text class="breaker-states-name" x="306" y="142">Threshold breached: OPEN</text>
    <text class="breaker-states-desc" x="280" y="166">100% of traffic to the baseline.</text>
    <text class="breaker-states-desc" x="280" y="182">Candidate calls rejected</text>
    <text class="breaker-states-desc" x="280" y="198">immediately.</text>
    <text class="breaker-states-edge" x="280" y="242">instant</text>
  </g>
  <line class="breaker-states-line breaker-states-conn breaker-states-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#breaker-states-tip)"/>
  <g class="breaker-states-stage breaker-states-s2">
    <rect class="breaker-states-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="breaker-states-step" x="516" y="142">03</text>
    <text class="breaker-states-name" x="542" y="142">Sleep window</text>
    <text class="breaker-states-desc" x="516" y="166">Five minutes, configurable. No</text>
    <text class="breaker-states-desc" x="516" y="182">probing during it.</text>
  </g>
  <line class="breaker-states-line breaker-states-conn breaker-states-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#breaker-states-tip)"/>
  <g class="breaker-states-stage breaker-states-s3">
    <rect class="breaker-states-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="breaker-states-step" x="752" y="142">04</text>
    <text class="breaker-states-name" x="778" y="142">HALF-OPEN: 1% probes</text>
    <text class="breaker-states-desc" x="752" y="166">Success resets to CLOSED.</text>
    <text class="breaker-states-desc" x="752" y="182">Failure re-trips at once.</text>
    <text class="breaker-states-edge" x="752" y="242">1%</text>
  </g>
  <text class="breaker-states-sub" x="30" y="304">The sleep window is what prevents a flapping service: without it, a breaker that reopens immediately on recovery oscillates and delivers a worse experience than either steady state.</text>
</svg>
