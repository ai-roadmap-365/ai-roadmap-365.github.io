<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And what to keep regardless.">
  <title>Where formal incident process belongs</title>
  <style>
    .incident-when-bg   { fill: #f8fafc; }
    .incident-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .incident-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .incident-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .incident-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .incident-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .incident-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .incident-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .incident-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .incident-when-row { opacity: 1; }
    .incident-when-r0 { animation-delay: 0.00s; }
    .incident-when-r1 { animation-delay: 0.45s; }
    .incident-when-r2 { animation-delay: 0.90s; }
    .incident-when-r3 { animation-delay: 1.35s; }
    .incident-when-r4 { animation-delay: 1.80s; }
    .incident-when-row { animation: incident-when-reveal 7.3s ease-in-out infinite; }
    @keyframes incident-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="incident-when-bg" width="980" height="390"/>
  <text class="incident-when-h1"  x="30" y="40">Where formal incident process belongs</text>
  <text class="incident-when-sub" x="30" y="64">And what to keep regardless.</text>
  <rect class="incident-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="incident-when-name" x="46" y="122">Full protocol</text>
  <text class="incident-when-desc" x="46" y="142">Customer-facing and revenue-critical.</text>
  <text class="incident-when-desc incident-when-row incident-when-r0" x="46" y="182">Production AI services with users</text>
  <text class="incident-when-desc incident-when-row incident-when-r1" x="46" y="216">Enterprise APIs with contracts</text>
  <text class="incident-when-desc incident-when-row incident-when-r2" x="46" y="250">Revenue-critical workflows</text>
  <text class="incident-when-desc incident-when-row incident-when-r3" x="46" y="284">Automated pipelines nobody watches</text>
  <text class="incident-when-desc incident-when-row incident-when-r4" x="46" y="318">An on-call rotation with a named IC</text>
  <rect class="incident-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="incident-when-name" x="526" y="122">Keep anyway</text>
  <text class="incident-when-desc" x="526" y="142">Even for a prototype.</text>
  <text class="incident-when-desc incident-when-row incident-when-r0" x="526" y="182">A rollback you have actually tested</text>
  <text class="incident-when-desc incident-when-row incident-when-r1" x="526" y="216">An error-rate trip condition</text>
  <text class="incident-when-desc incident-when-row incident-when-r2" x="526" y="250">A written note of what happened</text>
  <text class="incident-when-desc incident-when-row incident-when-r3" x="526" y="284">Blamelessness costs nothing</text>
  <text class="incident-when-desc incident-when-row incident-when-r4" x="526" y="318">No P0 commander for a sandbox</text>
  <text class="incident-when-sub" x="30" y="372">The tested rollback is the item with no size threshold: it is the cheapest control in this lesson and the one that determines how bad a bad day gets, exactly as Day 359 concluded.</text>
</svg>
