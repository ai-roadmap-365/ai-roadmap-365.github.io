terms:
- term: Blameless Post-Mortem
  definition: A structured retrospective analyzing system failures without attributing blame to individuals.
- term: Mean Time to Recovery (MTTR)
  definition: The average time required to troubleshoot and restore full service after an outage.
- term: Circuit Breaker Rollback
  definition: An automated mechanism reverting traffic to a known good version when error thresholds trip.
- term: Incident Commander (IC)
  definition: The designated leader responsible for directing the triage and resolution of a live outage.
- term: Five Whys Analysis
  definition: An iterative root-cause inquiry technique exploring the cause-and-effect relationships of
    a defect.
- term: P0 / P1 Severity
  definition: 'Classification of incident urgency: P0 is a critical customer-impacting outage; P1 is severe
    degradation.'
- term: Runbook
  definition: A standardized step-by-step procedural guide for diagnosing and resolving specific operational
    alerts.
- term: Statuspage
  definition: A public or internal dashboard communicating real-time incident status and updates to stakeholders.
