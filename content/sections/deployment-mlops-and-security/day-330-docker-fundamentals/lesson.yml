title: Docker Fundamentals
section: deployment-mlops-and-security
subsection: deployment-and-containers
week: 48
learning_promise:
  'Understand the one rule that decides how long a container build takes: a layer is
  reused only if every layer above it was reused and its own inputs are unchanged. Model it, measure
  it, and see the same instructions rebuild in 76 seconds or 1 second depending only on their order.'
objectives:
  - Explain what a layer is and which instructions produce one.
  - State the cache rule, including why an unchanged layer still rebuilds.
  - Order a Dockerfile so the expensive layer survives a source edit.
  - Explain why reordering costs nothing on a cold build.
  - Identify the pinning, cleanup and privilege mistakes that ship a real risk.
