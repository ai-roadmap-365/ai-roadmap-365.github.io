<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Host GPU Driver to Container Runtime Mapping">
  <title>Host GPU Driver to Container Runtime Mapping</title>
  <defs>
    <style>
      .d330b-bg { fill: #f8fafc; }
      .d330b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d330b-host { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; }
      .d330b-tk { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 6px; }
      .d330b-ctr { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 6px; }
      .d330b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d330b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d330b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d330b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d330b-bg" />
  
  <text x="40" y="40" class="d330a-title">NVIDIA GPU Container Architecture</text>
  <text x="40" y="65" class="d324a-subtitle">Host GPU Driver to Container Runtime Mapping showing Host Kernel NVIDIA Driver, NVIDIA Container Toolkit mounting /dev/nvidia* devices, and Container userspace CUDA Runtime</text>
  
  <!-- Host Kernel Layer -->
  <rect x="40" y="110" width="250" height="270" class="d330b-host" />
  <text x="55" y="145" class="d330b-header" fill="#1d4ed8">1. Host OS &amp; Kernel</text>
  <text x="55" y="180" class="d330b-text">• Physical NVIDIA H100 / A100 GPU</text>
  <text x="55" y="205" class="d330b-text">• Kernel Module: `nvidia.ko`</text>
  <text x="55" y="230" class="d330b-text">• Driver Version: `550.54.14`</text>
  <text x="55" y="255" class="d330b-text">• Device Nodes: `/dev/nvidia0`</text>
  <text x="55" y="295" class="d330b-text" font-weight="600" fill="#1d4ed8">Host Kernel Space</text>
  
  <!-- Container Toolkit Interface -->
  <rect x="325" y="110" width="250" height="270" class="d330b-tk" />
  <text x="340" y="145" class="d330b-header" fill="#7e22ce">2. NVIDIA Container Toolkit</text>
  <text x="340" y="180" class="d330b-text">• `nvidia-container-runtime`</text>
  <text x="340" y="205" class="d330b-text">• Dynamic Device Injection</text>
  <text x="340" y="230" class="d330b-text">• Exposes `/dev/nvidiactl`</text>
  <text x="340" y="255" class="d330b-text">• Mounts `libcuda.so.1` into container</text>
  <text x="340" y="295" class="d330b-text" font-weight="600" fill="#7e22ce">OCI Hook Layer</text>
  
  <!-- Docker Container User Space -->
  <rect x="610" y="110" width="250" height="270" class="d330b-ctr" />
  <text x="625" y="145" class="d330b-header" fill="#15803d">3. Container User Space</text>
  <text x="625" y="180" class="d330b-text">• CUDA Runtime: `libcudart.so`</text>
  <text x="625" y="205" class="d330b-text">• PyTorch / vLLM / ONNX Runtime</text>
  <text x="625" y="230" class="d330b-text">• Python FastAPI Application</text>
  <text x="625" y="255" class="d330b-text">• Executing as Non-Root User</text>
  <text x="625" y="295" class="d330b-text" font-weight="600" fill="#15803d">Zero Host Driver Conflict</text>
</svg>