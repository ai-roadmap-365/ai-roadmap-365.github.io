<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Same base, same packages, same edit.">
  <title>76 seconds against 1</title>
  <style>
    .seventy-six-to-one-bg   { fill: #f8fafc; }
    .seventy-six-to-one-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seventy-six-to-one-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seventy-six-to-one-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seventy-six-to-one-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seventy-six-to-one-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .seventy-six-to-one-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .seventy-six-to-one-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .seventy-six-to-one-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .seventy-six-to-one-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .seventy-six-to-one-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .seventy-six-to-one-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .seventy-six-to-one-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .seventy-six-to-one-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .seventy-six-to-one-stage { opacity: 1; }

    .seventy-six-to-one-s0 { animation-delay: 0.00s; }
    .seventy-six-to-one-e0 { animation-delay: 0.00s; }
    .seventy-six-to-one-s1 { animation-delay: 1.28s; }
    .seventy-six-to-one-e1 { animation-delay: 1.28s; }
    .seventy-six-to-one-s2 { animation-delay: 2.56s; }
    .seventy-six-to-one-e2 { animation-delay: 2.56s; }
    .seventy-six-to-one-s3 { animation-delay: 3.84s; }
    .seventy-six-to-one-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .seventy-six-to-one-conn  { animation: seventy-six-to-one-trace 6.4s ease-in-out infinite; }
      .seventy-six-to-one-stage { animation: seventy-six-to-one-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes seventy-six-to-one-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes seventy-six-to-one-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .seventy-six-to-one-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .seventy-six-to-one-stage { animation: seventy-six-to-one-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes seventy-six-to-one-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="seventy-six-to-one-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="seventy-six-to-one-bg" width="980" height="322"/>
  <text class="seventy-six-to-one-h1"  x="30" y="40">76 seconds against 1</text>
  <text class="seventy-six-to-one-sub" x="30" y="64">Same base, same packages, same edit.</text>
  <g class="seventy-six-to-one-stage seventy-six-to-one-s0">
    <rect class="seventy-six-to-one-box" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="seventy-six-to-one-step" x="44" y="142">01</text>
    <text class="seventy-six-to-one-name" x="70" y="142">Cold builds: 76.0s and 77.0s</text>
    <text class="seventy-six-to-one-desc" x="44" y="166">Ordering costs nothing on a</text>
    <text class="seventy-six-to-one-desc" x="44" y="182">first build.</text>
    <text class="seventy-six-to-one-edge" x="44" y="242">identical</text>
  </g>
  <line class="seventy-six-to-one-line seventy-six-to-one-conn seventy-six-to-one-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#seventy-six-to-one-tip)"/>
  <g class="seventy-six-to-one-stage seventy-six-to-one-s1">
    <rect class="seventy-six-to-one-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="seventy-six-to-one-step" x="280" y="142">02</text>
    <text class="seventy-six-to-one-name" x="306" y="142">Both miss on src/app.py</text>
    <text class="seventy-six-to-one-desc" x="280" y="166">The same file changed. The</text>
    <text class="seventy-six-to-one-desc" x="280" y="182">difference is where the miss</text>
    <text class="seventy-six-to-one-desc" x="280" y="198">lands.</text>
  </g>
  <line class="seventy-six-to-one-line seventy-six-to-one-conn seventy-six-to-one-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#seventy-six-to-one-tip)"/>
  <g class="seventy-six-to-one-stage seventy-six-to-one-s2">
    <rect class="seventy-six-to-one-warn" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="seventy-six-to-one-step" x="516" y="142">03</text>
    <text class="seventy-six-to-one-name" x="542" y="142">Naive: miss at line 3</text>
    <text class="seventy-six-to-one-desc" x="516" y="166">COPY . . sits above the install,</text>
    <text class="seventy-six-to-one-desc" x="516" y="182">so the install re-runs.</text>
    <text class="seventy-six-to-one-edge" x="516" y="242">76.0s</text>
  </g>
  <line class="seventy-six-to-one-line seventy-six-to-one-conn seventy-six-to-one-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#seventy-six-to-one-tip)"/>
  <g class="seventy-six-to-one-stage seventy-six-to-one-s3">
    <rect class="seventy-six-to-one-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="seventy-six-to-one-step" x="752" y="142">04</text>
    <text class="seventy-six-to-one-name" x="778" y="142">Ordered: miss below the install</text>
    <text class="seventy-six-to-one-desc" x="752" y="166">4 of 8 layers reused.</text>
    <text class="seventy-six-to-one-edge" x="752" y="242">1.0s</text>
  </g>
  <text class="seventy-six-to-one-sub" x="30" y="304">Editing README.md costs the full 76 seconds in the naive file and zero in the ordered one, which is what `.dockerignore` is actually for: not tidiness, but keeping irrelevant files out of the thing that decides your cache.</text>
</svg>
