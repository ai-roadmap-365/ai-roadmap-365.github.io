<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Three findings, one with no line number.">
  <title>What a Dockerfile linter finds</title>
  <style>
    .lint-findings-bg   { fill: #f8fafc; }
    .lint-findings-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-findings-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-findings-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-findings-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-findings-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lint-findings-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lint-findings-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .lint-findings-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .lint-findings-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .lint-findings-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .lint-findings-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .lint-findings-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .lint-findings-row { opacity: 1; }
    .lint-findings-r0 { animation-delay: 0.00s; }
    .lint-findings-r1 { animation-delay: 0.45s; }
    .lint-findings-r2 { animation-delay: 0.90s; }
    .lint-findings-r3 { animation-delay: 1.35s; }
    .lint-findings-r4 { animation-delay: 1.80s; }
    .lint-findings-row { animation: lint-findings-reveal 7.3s ease-in-out infinite; }
    @keyframes lint-findings-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="lint-findings-bg" width="980" height="390"/>
  <text class="lint-findings-h1"  x="30" y="40">What a Dockerfile linter finds</text>
  <text class="lint-findings-sub" x="30" y="64">Three findings, one with no line number.</text>
  <rect class="lint-findings-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="lint-findings-name" x="46" y="122">Naive</text>
  <text class="lint-findings-desc" x="46" y="142">Three findings.</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r0" x="46" y="182">line 3: COPY . . before the install layer</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r1" x="46" y="216">line 4: no --no-cache-dir, so the wheel cache ships</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r2" x="46" y="250">line 0: no USER instruction</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r3" x="46" y="284">line 0 is not a bug</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r4" x="46" y="318">An absence has no line to point at</text>
  <rect class="lint-findings-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="lint-findings-name" x="526" y="122">Ordered</text>
  <text class="lint-findings-desc" x="526" y="142">No findings.</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r0" x="526" y="182">Manifest copied first</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r1" x="526" y="216">Install above the source</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r2" x="526" y="250">--no-cache-dir on pip</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r3" x="526" y="284">A non-root USER</text>
  <text class="lint-findings-desc lint-findings-row lint-findings-r4" x="526" y="318">Same base, same packages</text>
  <text class="lint-findings-sub" x="30" y="372">The `line 0` convention is worth borrowing: a finding about something that is missing genuinely has no location, and inventing one — pointing at the last line, say — makes the report misleading.</text>
</svg>
