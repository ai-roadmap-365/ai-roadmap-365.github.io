<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" role="img" aria-label="The Layer Cache Rule showing that a layer is reused only when every layer before it was reused and its own inputs are unchanged">
  <title>The Layer Cache Rule</title>
  <defs>
    <style>
      .d330a-bg { fill: #f8fafc; }
      .d330a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d330a-hit { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d330a-miss { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d330a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d330a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d330a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d330a-m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .d330a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>
  <rect class="d330a-bg" width="900" height="460" />
  <text class="d330a-title" x="30" y="36">The Layer Cache Rule</text>
  <text class="d330a-s" x="30" y="58">A layer is reused only if every layer above it was reused, AND its own inputs are unchanged.</text>

  <rect class="d330a-card" x="30" y="78" width="840" height="34" rx="6" />
  <text class="d330a-t" x="46" y="100">One file changed since the last build: src/app.py</text>

  <text class="d330a-h" x="30" y="146">Naive order</text>
  <rect class="d330a-hit" x="30" y="158" width="390" height="30" rx="4" />
  <text class="d330a-m" x="44" y="178">FROM python:3.12-slim</text>
  <text class="d330a-s" x="330" y="178" fill="#15803d">reused</text>
  <rect class="d330a-hit" x="30" y="192" width="390" height="30" rx="4" />
  <text class="d330a-m" x="44" y="212">WORKDIR /app</text>
  <text class="d330a-s" x="330" y="212" fill="#15803d">reused</text>
  <rect class="d330a-miss" x="30" y="226" width="390" height="30" rx="4" />
  <text class="d330a-m" x="44" y="246">COPY . .</text>
  <text class="d330a-s" x="290" y="246" fill="#7f1d1d">reads src/app.py</text>
  <rect class="d330a-miss" x="30" y="260" width="390" height="30" rx="4" />
  <text class="d330a-m" x="44" y="280">RUN pip install -r requirements.txt</text>
  <text class="d330a-s" x="44" y="306" fill="#7f1d1d">rebuilt because a layer above it changed — 75s</text>

  <text class="d330a-h" x="480" y="146">Ordered</text>
  <rect class="d330a-hit" x="480" y="158" width="390" height="30" rx="4" />
  <text class="d330a-m" x="494" y="178">FROM python:3.12-slim</text>
  <text class="d330a-s" x="780" y="178" fill="#15803d">reused</text>
  <rect class="d330a-hit" x="480" y="192" width="390" height="30" rx="4" />
  <text class="d330a-m" x="494" y="212">COPY requirements.txt .</text>
  <text class="d330a-s" x="780" y="212" fill="#15803d">reused</text>
  <rect class="d330a-hit" x="480" y="226" width="390" height="30" rx="4" />
  <text class="d330a-m" x="494" y="246">RUN pip install --no-cache-dir …</text>
  <text class="d330a-s" x="780" y="246" fill="#15803d">reused</text>
  <rect class="d330a-miss" x="480" y="260" width="390" height="30" rx="4" />
  <text class="d330a-m" x="494" y="280">COPY src/ ./src/</text>
  <text class="d330a-s" x="494" y="306" fill="#7f1d1d">rebuilt — 1s</text>

  <rect class="d330a-card" x="30" y="330" width="840" height="46" rx="6" />
  <text class="d330a-t" x="46" y="360">Same base image. Same packages. Same application. The install moved above the copy.</text>

  <rect class="d330a-miss" x="30" y="390" width="410" height="46" rx="6" />
  <text class="d330a-h" x="48" y="410" fill="#7f1d1d">76.0s to rebuild</text>
  <text class="d330a-s" x="48" y="428">cold build 76.0s</text>
  <rect class="d330a-hit" x="460" y="390" width="410" height="46" rx="6" />
  <text class="d330a-h" x="478" y="410" fill="#15803d">1.0s to rebuild</text>
  <text class="d330a-s" x="478" y="428">cold build 77.0s — the ordering is free</text>
</svg>
