<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two are security, three are money.">
  <title>Five consequences of the layer model</title>
  <style>
    .docker-implications-bg   { fill: #f8fafc; }
    .docker-implications-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docker-implications-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docker-implications-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docker-implications-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docker-implications-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .docker-implications-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .docker-implications-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .docker-implications-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .docker-implications-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .docker-implications-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .docker-implications-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .docker-implications-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .docker-implications-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .docker-implications-stage { opacity: 1; }

    .docker-implications-s0 { animation-delay: 0.00s; }
    .docker-implications-e0 { animation-delay: 0.00s; }
    .docker-implications-s1 { animation-delay: 1.33s; }
    .docker-implications-e1 { animation-delay: 1.33s; }
    .docker-implications-s2 { animation-delay: 2.67s; }
    .docker-implications-e2 { animation-delay: 2.67s; }
    .docker-implications-s3 { animation-delay: 4.00s; }
    .docker-implications-e3 { animation-delay: 4.00s; }
    .docker-implications-s4 { animation-delay: 5.33s; }
    .docker-implications-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .docker-implications-conn  { animation: docker-implications-trace 8s ease-in-out infinite; }
      .docker-implications-stage { animation: docker-implications-arrive 8s ease-in-out infinite; }
    }
    @keyframes docker-implications-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes docker-implications-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .docker-implications-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .docker-implications-stage { animation: docker-implications-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes docker-implications-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="docker-implications-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="docker-implications-bg" width="980" height="322"/>
  <text class="docker-implications-h1"  x="30" y="40">Five consequences of the layer model</text>
  <text class="docker-implications-sub" x="30" y="64">Two are security, three are money.</text>
  <g class="docker-implications-stage docker-implications-s0">
    <rect class="docker-implications-warn" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="docker-implications-step" x="44" y="142">01</text>
    <text class="docker-implications-name" x="70" y="142">Secrets in a layer are permanent</text>
    <text class="docker-implications-desc" x="44" y="166">Removed on top,</text>
    <text class="docker-implications-desc" x="44" y="182">recoverable beneath. The</text>
    <text class="docker-implications-desc" x="44" y="198">commonest way credentials</text>
    <text class="docker-implications-edge" x="44" y="242">security</text>
  </g>
  <line class="docker-implications-line docker-implications-conn docker-implications-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#docker-implications-tip)"/>
  <g class="docker-implications-stage docker-implications-s1">
    <rect class="docker-implications-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="docker-implications-step" x="233" y="142">02</text>
    <text class="docker-implications-name" x="259" y="142">No USER means uid 0</text>
    <text class="docker-implications-desc" x="233" y="166">Root inside, plus a</text>
    <text class="docker-implications-desc" x="233" y="182">mounted host path, is a</text>
    <text class="docker-implications-desc" x="233" y="198">much worse starting</text>
    <text class="docker-implications-edge" x="233" y="242">privilege</text>
  </g>
  <line class="docker-implications-line docker-implications-conn docker-implications-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#docker-implications-tip)"/>
  <g class="docker-implications-stage docker-implications-s2">
    <rect class="docker-implications-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="docker-implications-step" x="422" y="142">03</text>
    <text class="docker-implications-name" x="448" y="142">A tag is a moving target</text>
    <text class="docker-implications-desc" x="422" y="166">python:3.12-slim today</text>
    <text class="docker-implications-desc" x="422" y="182">and in a year are</text>
    <text class="docker-implications-desc" x="422" y="198">different images.</text>
    <text class="docker-implications-edge" x="422" y="242">reproducibility</text>
  </g>
  <line class="docker-implications-line docker-implications-conn docker-implications-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#docker-implications-tip)"/>
  <g class="docker-implications-stage docker-implications-s3">
    <rect class="docker-implications-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="docker-implications-step" x="611" y="142">04</text>
    <text class="docker-implications-name" x="637" y="142">Size is pull time times nodes</text>
    <text class="docker-implications-desc" x="611" y="166">--no-cache-dir and</text>
    <text class="docker-implications-desc" x="611" y="182">cleaning apt lists in the</text>
    <text class="docker-implications-desc" x="611" y="198">same layer are the</text>
    <text class="docker-implications-edge" x="611" y="242">money</text>
  </g>
  <line class="docker-implications-line docker-implications-conn docker-implications-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#docker-implications-tip)"/>
  <g class="docker-implications-stage docker-implications-s4">
    <rect class="docker-implications-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="docker-implications-step" x="800" y="142">05</text>
    <text class="docker-implications-name" x="826" y="142">The cache is what makes CI affordable</text>
    <text class="docker-implications-desc" x="800" y="166">A cold cache pays the</text>
    <text class="docker-implications-desc" x="800" y="182">install on every commit.</text>
    <text class="docker-implications-edge" x="800" y="242">CI</text>
  </g>
  <text class="docker-implications-sub" x="30" y="304">The first and second cost nothing to fix and are the two most common findings in any first review of a Dockerfile, which is a reasonable argument for a linter in the pipeline rather than a code-review habit.</text>
</svg>
