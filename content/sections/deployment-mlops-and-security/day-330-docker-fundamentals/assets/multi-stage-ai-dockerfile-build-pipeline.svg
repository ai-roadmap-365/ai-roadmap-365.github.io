<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Stage AI Dockerfile Build Pipeline">
  <title>Multi-Stage AI Dockerfile Build Pipeline</title>
  <defs>
    <style>
      .d330a-bg { fill: #f8fafc; }
      .d330a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d330a-bld { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d330a-run { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d330a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d330a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d330a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d330a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d330a-bg" />
  
  <text x="40" y="40" class="d330a-title">Multi-Stage AI Containerization Pipeline</text>
  <text x="40" y="65" class="d324a-subtitle">Multi-Stage AI Dockerfile Build Pipeline showing Stage 1 Builder with GCC, NVCC, and Wheel Compilation, and Stage 2 Lean Runner (850MB) with Runtime CUDA Libraries and Non-Root User</text>
  
  <!-- Stage 1: Builder -->
  <rect x="40" y="110" width="380" height="270" class="d330a-bld" />
  <text x="60" y="145" class="d330a-header" fill="#1d4ed8">Stage 1: Heavy Build Environment (Discarded)</text>
  <text x="60" y="180" class="d330a-text">• Base: `nvidia/cuda:12.4.0-devel-ubuntu22.04`</text>
  <text x="60" y="205" class="d330a-text">• Toolchains: `gcc`, `g++`, `nvcc`, `cmake`, `git`</text>
  <text x="60" y="230" class="d330a-text">• Compilation: `pip wheel --wheel-dir=/wheels ...`</text>
  <text x="60" y="255" class="d330a-text">• Compiles FlashAttention &amp; vLLM C++ extensions</text>
  <text x="60" y="295" class="d330a-text" font-weight="600" fill="#1d4ed8">Size: ~12.5 GB (Build Only)</text>
  <text x="60" y="320" class="d330a-text">Never deployed to production clusters</text>
  
  <!-- Stage 2: Runner -->
  <rect x="480" y="110" width="380" height="270" class="d330a-run" />
  <text x="500" y="145" class="d330a-header" fill="#15803d">Stage 2: Lean Production Runtime</text>
  <text x="500" y="180" class="d330a-text">• Base: `nvidia/cuda:12.4.0-runtime-ubuntu22.04`</text>
  <text x="500" y="205" class="d330a-text">• Install pre-compiled `/wheels` from builder</text>
  <text x="500" y="230" class="d330a-text">• Zero compiler toolchains or dev headers</text>
  <text x="500" y="255" class="d330a-text">• Security: `USER appuser` (Non-Root UID 10001)</text>
  <text x="500" y="295" class="d330a-text" font-weight="600" fill="#15803d">Size: 850 MB (93% Reduction!)</text>
  <text x="500" y="320" class="d330a-text">Instant 2-second cluster image pull</text>
</svg>