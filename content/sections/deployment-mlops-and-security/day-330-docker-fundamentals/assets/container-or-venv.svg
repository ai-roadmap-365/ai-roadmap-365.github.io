<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a virtual environment is enough.">
  <title>When a container is the right tool</title>
  <style>
    .container-or-venv-bg   { fill: #f8fafc; }
    .container-or-venv-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-or-venv-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-or-venv-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-or-venv-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-or-venv-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .container-or-venv-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .container-or-venv-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .container-or-venv-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .container-or-venv-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .container-or-venv-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .container-or-venv-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .container-or-venv-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .container-or-venv-row { opacity: 1; }
    .container-or-venv-r0 { animation-delay: 0.00s; }
    .container-or-venv-r1 { animation-delay: 0.45s; }
    .container-or-venv-r2 { animation-delay: 0.90s; }
    .container-or-venv-r3 { animation-delay: 1.35s; }
    .container-or-venv-r4 { animation-delay: 1.80s; }
    .container-or-venv-row { animation: container-or-venv-reveal 7.3s ease-in-out infinite; }
    @keyframes container-or-venv-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="container-or-venv-bg" width="980" height="390"/>
  <text class="container-or-venv-h1"  x="30" y="40">When a container is the right tool</text>
  <text class="container-or-venv-sub" x="30" y="64">And when a virtual environment is enough.</text>
  <rect class="container-or-venv-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="container-or-venv-name" x="46" y="122">Containerise</text>
  <text class="container-or-venv-desc" x="46" y="142">When the target is not your machine.</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r0" x="46" y="182">A colleague's laptop, CI, a cloud host</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r1" x="46" y="216">A stack you cannot install cleanly</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r2" x="46" y="250">CUDA and system libraries, usually</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r3" x="46" y="284">The image you tested is the image that runs</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r4" x="46" y="318">Nearly always, in practice</text>
  <rect class="container-or-venv-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="container-or-venv-name" x="526" y="122">Do not</text>
  <text class="container-or-venv-desc" x="526" y="142">Three specific cases.</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r0" x="526" y="182">A script on your own machine — use a venv</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r1" x="526" y="216">As a boundary against hostile code</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r2" x="526" y="250">Model weights baked in without thinking</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r3" x="526" y="284">15 GB pulled onto every node, every rollout</text>
  <text class="container-or-venv-desc container-or-venv-row container-or-venv-r4" x="526" y="318">Weights belong in a volume or object storage</text>
  <text class="container-or-venv-sub" x="30" y="372">The last row is tomorrow's lesson: it is the single largest number in an AI image and the one that no general-purpose Dockerfile advice will tell you to look at.</text>
</svg>
