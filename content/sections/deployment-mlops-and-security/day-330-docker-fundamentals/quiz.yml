questions:
  - question: A Dockerfile begins `COPY . .` and then installs dependencies. Why does editing one
      Python source file re-run the whole install?
    options:
      - Because pip always reinstalls when any file in the working directory changes
      - Because the COPY layer reads every project file, so it misses; the install sits below it and a
        layer cannot be reused once a layer above it has been rebuilt
      - Because Docker cannot cache RUN instructions at all
      - Because the base image is re-pulled whenever the build context changes
    answer_index: 1
    explanation: The install's own inputs are unchanged. It rebuilds because its parent layer no
      longer exists in the form it was built against.
  - question: A layer's own inputs are unchanged and it still rebuilds. What explains it?
    options:
      - The build cache expired
      - A layer is a filesystem diff against a specific parent, so if the parent was rebuilt the diff
        has nothing to attach to and must be rebuilt too
      - Docker rebuilds every RUN instruction on every build
      - The instruction was not deterministic
    answer_index: 1
    explanation: This is the half of the cache rule people forget, and it is why instruction ORDER
      matters more than instruction content.
  - question: In the lab, the naive and ordered Dockerfiles take 76.0s and 77.0s on a cold build. What
      does that tell you?
    options:
      - That the measurement is too noisy to draw a conclusion from
      - That reordering is free — it costs nothing on a first build and returns the entire install on
        every build after it, so there is no trade-off to weigh
      - That the ordered Dockerfile is slightly worse and should only be used in CI
      - That cold builds are not affected by the cache at all, so the comparison is meaningless
    answer_index: 1
    explanation: If reordering had a cost, adopting it would be a judgement call. It does not, so it
      is simply the right way to write the file.
  - question: Why is a secret that you `COPY` and then `RUN rm` still readable in the finished image?
    options:
      - Because rm does not actually delete files inside a container
      - Because every layer is kept — the deletion is a later layer that hides the file, while the layer
        that added it still contains the bytes and can be read with docker save
      - Because Docker keeps a backup of every file it copies
      - Because the secret is cached in the registry rather than the image
    answer_index: 1
    explanation: Deleting in a later layer never shrinks an image and never removes data. The fix is
      to never copy it — .dockerignore, a build secret, or a runtime variable.
  - question: The linter reports `runs-as-root` at line 0. Why line 0?
    options:
      - Because the USER instruction is conventionally written on the first line
      - Because the finding is about the ABSENCE of an instruction, and an absence has no line to
        point at
      - Because line 0 always refers to the FROM instruction
      - Because the parser failed to record a line number for that instruction
    answer_index: 1
    explanation: Findings that report a missing thing need a convention. Line 0 means "this is about
      the file as a whole" rather than any particular line.
