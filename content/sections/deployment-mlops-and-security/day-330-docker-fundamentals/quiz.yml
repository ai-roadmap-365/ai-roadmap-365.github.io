questions:
- question: What is the primary architectural cause of massive container image bloat (e.g. 15GB+) in naive
    AI Dockerfiles?
  options:
  - Using too many comments in python files
  - Including full CUDA development toolchains (nvcc, header files), temporary pip build caches, dev compilation
    libraries, and uncompressed raw model checkpoints within a single monolithic container layer
  - Docker requires 15GB minimum by specification
  - Using Python instead of C
  answer_index: 1
  explanation: Monolithic Docker layers accumulate compiler toolchains, header files, and pip build artifacts
    that are unnecessary at runtime.
- question: How does Multi-Stage Docker building eliminate container bloat?
  options:
  - By deleting files after the container starts
  - By compiling dependencies and building wheels in a heavy 'builder' stage, and then copying only the
    final compiled wheels and runtime dependencies into a lean 'runner' base image (e.g. `python:3.11-slim`
    or `nvidia/cuda:runtime`)
  - By compressing files with ZIP format
  - By running Docker inside a virtual machine
  answer_index: 1
  explanation: Multi-stage builds decouple the heavy build environment from the lean runtime container.
- question: What is the relationship between the host operating system's NVIDIA GPU driver and the container's
    CUDA libraries?
  options:
  - The container must install the full Linux kernel GPU driver inside Docker
  - The host machine runs the kernel-level NVIDIA GPU driver and NVIDIA Container Toolkit (`nvidia-container-runtime`),
    which mounts the host driver devices (`/dev/nvidia*`) into the container, while the container only
    needs userspace CUDA runtime shared libraries (`libcudart.so`)
  - Containers do not need GPU drivers to use GPUs
  - CUDA drivers must be recompiled on every container boot
  answer_index: 1
  explanation: The host provides kernel driver devices; the container provides user-space CUDA runtime
    libraries.
- question: When should model weights be 'baked' directly into a Docker container image versus mounted
    via external volumes (e.g. S3 / EFS / Persistent Volume)?
  options:
  - Baking into Docker is best for immutable, sub-10-second cold-start autoscaling of small/medium models
    (e.g. 1B-7B parameters); External volume mounting is best for massive models (e.g. 70B+) to avoid
    140GB image pull delays across cluster nodes
  - Never bake models into Docker
  - Always store models in git repositories
  - Models must be downloaded via HTTP on every user request
  answer_index: 0
  explanation: Baking provides fast, immutable container boot for compact models; volume mounts avoid
    multi-GB image transfers for massive LLMs.
- question: Why should AI inference containers execute under a dedicated non-root user (`USER appuser`)?
  options:
  - Because root cannot execute Python
  - To prevent container breakout vulnerabilities from gaining full root access to the host kernel and
    GPU hardware devices
  - To speed up GPU inference by 50%
  - Docker requires non-root by default
  answer_index: 1
  explanation: Non-root execution enforces the principle of least privilege, preventing host escalation
    upon container compromise.
