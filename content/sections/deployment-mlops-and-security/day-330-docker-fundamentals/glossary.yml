terms:
- term: Multi-Stage Dockerfile
  definition: A Docker build pattern separating build-time compilation dependencies from runtime images.
- term: NVIDIA Container Toolkit
  definition: The runtime interface exposing host GPU drivers and hardware devices into Docker containers.
- term: CUDA Runtime
  definition: The user-space libraries (libcudart) required by PyTorch and vLLM to dispatch GPU kernels.
- term: Model Weight Baking
  definition: Packaging pre-downloaded model weight files directly into container filesystem layers.
- term: Container Cold-Start
  definition: The duration required to pull an image, start the container, and initialize GPU memory.
- term: Non-Root Container
  definition: Running container processes with restricted UID/GID permissions for security isolation.
- term: Health Probe (Liveness/Readiness)
  definition: HTTP endpoints verifying container availability before routing production traffic.
- term: Image Layer Caching
  definition: Docker build optimization reusing unchanged filesystem layers to accelerate rebuilds.
