terms:
  - term: Image
    definition: A layered filesystem plus metadata describing how to start a process in it. Inert
      until a runtime creates a container from it.
  - term: Layer
    definition: A filesystem diff produced by one Dockerfile instruction, stored against a specific
      parent. Immutable, and every one is kept.
  - term: Build Cache
    definition: The reuse of previously built layers. Governed by one rule — a layer is reused only if
      every layer above it was reused and its own inputs are unchanged.
  - term: Cache Key
    definition: What identifies a layer for reuse — the parent's identity, the instruction text, and
      for COPY and ADD a hash of the file contents being copied.
  - term: First Miss
    definition: The topmost layer that could not be reused. Everything below it rebuilds regardless of
      its own inputs, so this one layer explains the whole cost of a build.
  - term: Build Context
    definition: The set of files sent to the builder and therefore visible to COPY. Narrowed by
      .dockerignore, which is what controls accidental cache invalidation.
  - term: Multi-Stage Build
    definition: A Dockerfile with several FROM instructions where a later stage copies artefacts out
      of an earlier one, leaving the build tools behind.
  - term: Base Image
    definition: The image a build starts FROM. Unpinned, it is a moving target — a rebuild months
      later gets a different operating system and a different set of vulnerabilities.
  - term: Tag versus Digest
    definition: A tag is a mutable pointer such as 3.12-slim; a digest identifies exact bytes. A tag
      is a promise about compatibility, not identity.
  - term: OCI
    definition: The Open Container Initiative, whose image and runtime specifications are why Docker,
      Podman, containerd and Kubernetes all consume the same images.
  - term: Rootless Container
    definition: A container whose process does not run as uid 0. Achieved with a USER instruction, and
      the cheapest single reduction in blast radius available.
