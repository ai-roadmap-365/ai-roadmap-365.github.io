visuals:
  - id: the-layer-cache-rule
    file: assets/the-layer-cache-rule.svg
    type: diagram
    title: The Layer Cache Rule
    alt: The Layer Cache Rule showing that a layer is reused only when every layer before it was reused
      and its own inputs are unchanged
    description: The same four instructions in two orders after one source file changed, with each
      layer marked reused or rebuilt and the resulting 76-second and 1-second costs.
  - id: instruction-order-decides-rebuild-time
    file: assets/instruction-order-decides-rebuild-time.svg
    type: diagram
    title: Instruction Order Decides Rebuild Time
    alt: Instruction Order Decides Rebuild Time showing the same instructions in two orders and the
      resulting cache hits
    description: Rebuild cost after editing one source file, drawn to scale, with the note that the
      two cold builds differ by a single second.
  - id: cache-key-inputs
    file: assets/cache-key-inputs.svg
    type: diagram
    title: 'What decides a cache hit'
    alt: 'Diagram: the two conditions under which a Docker layer is reused'
    description: 'A four-stage description of the layer cache rule covering parent reuse, instruction inputs, the special case of COPY, and the consequence for ordering.'
  - id: copy-placement
    file: assets/copy-placement.svg
    type: diagram
    title: 'Where the COPY line goes'
    alt: 'Diagram: copying source before the dependency install compared with after it'
    description: 'A two-column comparison of a Dockerfile that copies all source before installing dependencies against one that copies the manifest first.'
  - id: container-lineage
    file: assets/container-lineage.svg
    type: diagram
    title: 'Forty years of the same idea'
    alt: 'Diagram: the progression from chroot to the OCI image standard'
    description: 'A five-stage progression from chroot through jails, cgroups and namespaces to Docker''s format and the OCI standard.'
  - id: not-a-security-boundary
    file: assets/not-a-security-boundary.svg
    type: diagram
    title: 'Isolation is not security'
    alt: 'Diagram: what a container boundary provides compared with what it does not'
    description: 'A two-column comparison of what a container isolates against what it does not protect from, given a shared kernel.'
  - id: build-mechanics
    file: assets/build-mechanics.svg
    type: diagram
    title: 'What the builder actually does'
    alt: 'Diagram: how a container build computes and walks the layer cache'
    description: 'A six-stage description of the build process covering the base image, layer creation, cache key computation, the walk down until a key differs, layer immutability and the build context.'
  - id: order-expensive-first
    file: assets/order-expensive-first.svg
    type: diagram
    title: 'The ordering rule'
    alt: 'Diagram: ordering Dockerfile instructions by stability and cost'
    description: 'A four-stage ordering rule placing the base image, system packages, dependency installation and application source in the sequence that maximises cache reuse.'
  - id: photograph-analogy
    file: assets/photograph-analogy.svg
    type: diagram
    title: 'A recipe photographed at every step'
    alt: 'Diagram: resuming a photographed recipe from an early step compared with a late one'
    description: 'A two-column comparison of changing an ingredient early in a photographed recipe against changing one late, and how much cooking must be repeated.'
  - id: seventy-six-to-one
    file: assets/seventy-six-to-one.svg
    type: diagram
    title: '76 seconds against 1'
    alt: 'Diagram: the measured rebuild times of two Dockerfile orderings'
    description: 'A four-stage reading of measured build results showing identical cold builds, divergent rebuilds, and the first cache miss in each ordering.'
  - id: lint-findings
    file: assets/lint-findings.svg
    type: diagram
    title: 'What a Dockerfile linter finds'
    alt: 'Diagram: the linter findings on a naive Dockerfile compared with an ordered one'
    description: 'A two-column comparison of lint findings on a poorly ordered Dockerfile against a correctly ordered one, including a finding about an absent instruction.'
  - id: docker-implications
    file: assets/docker-implications.svg
    type: diagram
    title: 'Five consequences of the layer model'
    alt: 'Diagram: the security, privilege, reproducibility, cost and CI consequences of container layers'
    description: 'A five-stage description of container implications covering secrets in layers, running as root, base image drift, image size as pull time, and the effect on CI cost.'
  - id: tag-versus-digest
    file: assets/tag-versus-digest.svg
    type: diagram
    title: 'A tag is not an identity'
    alt: 'Diagram: a mutable image tag compared with an immutable digest'
    description: 'A two-column comparison of referencing an image by tag against referencing it by content digest.'
  - id: container-or-venv
    file: assets/container-or-venv.svg
    type: diagram
    title: 'When a container is the right tool'
    alt: 'Diagram: when to containerise and when not to'
    description: 'A two-column comparison of situations where a container earns its complexity against those where a lighter tool suffices.'
