terms:
- term: Direct Prompt Injection
  definition: An adversarial exploit where a user directly prompts an LLM to override its system instructions.
- term: Indirect Prompt Injection
  definition: An exploit where malicious instructions embedded in third-party data (PDFs, web pages) hijack
    an agent.
- term: Canary Token
  definition: A secret random string injected into a system prompt to detect unauthorized leakage in model
    generations.
- term: Dual-LLM Sandboxing
  definition: A defensive pattern isolating untrusted data parsing in a tool-less LLM before passing data
    to an agent.
- term: Delimiter Tagging
  definition: Wrapping untrusted user inputs in distinct XML/Markdown tags to enforce instruction/data
    separation.
- term: Instruction Hierarchy
  definition: Training and architectural techniques ensuring system prompts take strict precedence over
    user data.
- term: Prompt Firewall
  definition: A gateway inspection layer evaluating input safety before payloads reach production inference
    backends.
- term: Base64 Obfuscation
  definition: An evasion technique encoding attack payloads to bypass superficial keyword filters.
