week: 50
learning_promise: 'Master defense-in-depth prompt security: neutralize direct and indirect prompt injection
  attacks, implement dual-LLM architectural sandboxes, enforce XML delimiter encodings, and deploy canary
  token exfiltration detectors in Python.'
objectives:
- Contrast Direct Prompt Injection (jailbreaking, ignore previous instructions) with Indirect Prompt Injection
  (data payload hijacking via RAG/web documents).
- Implement XML/Markdown structured delimiter tagging enforcing separation between system control instructions
  and untrusted user data.
- Architect Dual-LLM Sandboxing (Quarantine Extractor + Trusted Controller) to neutralize indirect injection
  vectors.
- Deploy Canary Tokens into system prompts to detect and block automated prompt exfiltration attempts
  in real time.
- Build a multi-stage Prompt Defense Firewall in Python combining regex sanitization, delimiter verification,
  and canary leak monitoring.
