questions:
- question: What is the key structural difference between Direct and Indirect Prompt Injection?
  options:
  - 'Direct comes from the user; indirect from fetched data'
  - Direct injection is written in Python; indirect is written in Java
  - Direct injection only happens on local GPUs
  - There is no difference between them
  answer_index: 0
  explanation: Indirect injection occurs when untrusted third-party data ingested by RAG or web search
    hijacks the model's control flow.
- question: How does a 'Canary Token' defend against system prompt exfiltration?
  options:
  - It sings a song when the server boots
  - 'A secret UUID in the prompt; block any reply containing it'
  - It speeds up token generation
  - It encrypts the GPU memory bus
  answer_index: 1
  explanation: Canary tokens detect prompt exfiltration by monitoring whether secret markers leak into
    outbound generations.
- question: Why is simple keyword filtering (e.g. blocking 'ignore all previous instructions') insufficient
    for prompt injection defense?
  options:
  - Keyword filters use too much RAM
  - Keywords only work in English
  - 'Paraphrase, encoding, and roleplay bypass keywords'
  - Python does not support regex
  answer_index: 2
  explanation: Linguistic variability and token encoding bypass static string-matching filters.
- question: What role does XML delimiter wrapping (e.g. `<user_input>...</user_input>`) play in prompt
    defense?
  options:
  - It formats the text for web browsers
  - 'It converts the text into vector embeddings first'
  - It compiles the prompt to C++
  - 'It marks the text structurally as data, not commands'
  answer_index: 3
  explanation: Delimiters establish clear boundaries between control instructions and untrusted data payloads.
- question: In a Dual-LLM Sandboxing architecture, what is the core restriction placed on LLM 1 (the Quarantine
    Worker)?
  options:
  - 'It has no tools, no database, and no network'
  - It can only run at night
  - It must use 8-bit quantization
  - 'It is forbidden from using the English language'
  answer_index: 0
  explanation: Quarantining untrusted document extraction prevents embedded instructions from calling
    internal enterprise tools.
