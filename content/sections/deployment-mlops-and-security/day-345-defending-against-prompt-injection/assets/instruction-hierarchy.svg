<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Two mechanisms, one from training.">
  <title>Why delimiters work at all</title>
  <style>
    .instruction-hierarchy-bg   { fill: #f8fafc; }
    .instruction-hierarchy-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instruction-hierarchy-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instruction-hierarchy-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instruction-hierarchy-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instruction-hierarchy-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .instruction-hierarchy-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .instruction-hierarchy-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .instruction-hierarchy-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .instruction-hierarchy-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .instruction-hierarchy-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .instruction-hierarchy-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .instruction-hierarchy-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .instruction-hierarchy-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .instruction-hierarchy-stage { opacity: 1; }

    .instruction-hierarchy-s0 { animation-delay: 0.00s; }
    .instruction-hierarchy-e0 { animation-delay: 0.00s; }
    .instruction-hierarchy-s1 { animation-delay: 1.50s; }
    .instruction-hierarchy-e1 { animation-delay: 1.50s; }
    .instruction-hierarchy-s2 { animation-delay: 3.00s; }
    .instruction-hierarchy-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .instruction-hierarchy-conn  { animation: instruction-hierarchy-trace 6s ease-in-out infinite; }
      .instruction-hierarchy-stage { animation: instruction-hierarchy-arrive 6s ease-in-out infinite; }
    }
    @keyframes instruction-hierarchy-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes instruction-hierarchy-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .instruction-hierarchy-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .instruction-hierarchy-stage { animation: instruction-hierarchy-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes instruction-hierarchy-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="instruction-hierarchy-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="instruction-hierarchy-bg" width="980" height="322"/>
  <text class="instruction-hierarchy-h1"  x="30" y="40">Why delimiters work at all</text>
  <text class="instruction-hierarchy-sub" x="30" y="64">Two mechanisms, one from training.</text>
  <g class="instruction-hierarchy-stage instruction-hierarchy-s0">
    <rect class="instruction-hierarchy-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="instruction-hierarchy-step" x="44" y="142">01</text>
    <text class="instruction-hierarchy-name" x="70" y="142">System messages carry higher priority</text>
    <text class="instruction-hierarchy-desc" x="44" y="166">Training penalises the model for letting user</text>
    <text class="instruction-hierarchy-desc" x="44" y="182">text override system rules.</text>
  </g>
  <line class="instruction-hierarchy-line instruction-hierarchy-conn instruction-hierarchy-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#instruction-hierarchy-tip)"/>
  <g class="instruction-hierarchy-stage instruction-hierarchy-s1">
    <rect class="instruction-hierarchy-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="instruction-hierarchy-step" x="359" y="142">02</text>
    <text class="instruction-hierarchy-name" x="385" y="142">Standard tags match the distribution</text>
    <text class="instruction-hierarchy-desc" x="359" y="166">instructions, context, user_query appear in</text>
    <text class="instruction-hierarchy-desc" x="359" y="182">the data the model learned from.</text>
  </g>
  <line class="instruction-hierarchy-line instruction-hierarchy-conn instruction-hierarchy-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#instruction-hierarchy-tip)"/>
  <g class="instruction-hierarchy-stage instruction-hierarchy-s2">
    <rect class="instruction-hierarchy-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="instruction-hierarchy-step" x="674" y="142">03</text>
    <text class="instruction-hierarchy-name" x="700" y="142">Jailbreak success falls by over 90%</text>
    <text class="instruction-hierarchy-desc" x="674" y="166">Not to zero. A reduction in surface, not a</text>
    <text class="instruction-hierarchy-desc" x="674" y="182">boundary.</text>
    <text class="instruction-hierarchy-edge" x="674" y="242">90%</text>
  </g>
  <text class="instruction-hierarchy-sub" x="30" y="304">The third stage is the honest one: a ninety percent reduction is a large and worthwhile change and it is still a probability, which is why the tool permissions behind it have to assume the remaining ten percent.</text>
</svg>
