<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Multi-Layer Prompt Defense Firewall Pipeline">
  <title>Multi-Layer Prompt Defense Firewall Pipeline</title>
  <defs>
    <style>
      .d345b-bg { fill: #f8fafc; }
      .d345b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d345b-step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d345b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d345b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d345b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .d345b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d345b-bg" />
  
  <text x="40" y="40" class="d345a-title">Multi-Layer Prompt Defense Firewall</text>
  <text x="40" y="65" class="d345a-subtitle">Multi-Layer Prompt Defense Firewall Pipeline showing Regex Input Scrubber, XML Delimiter Enclosure, Dual-LLM Sandboxing, and Outbound Canary Token Exfiltration Monitor</text>
  
  <!-- Step 1 -->
  <rect x="40" y="110" width="185" height="270" class="d345b-step" />
  <text x="55" y="145" class="d345b-header" fill="#1d4ed8">1. Input Firewall</text>
  <text x="55" y="180" class="d345b-text">• Base64 decode scan</text>
  <text x="55" y="205" class="d345b-text">• Regex heuristic filter</text>
  <text x="55" y="230" class="d345b-text">• 4k max token cap</text>
  <text x="55" y="255" class="d345b-text">• Prompt injection classifier</text>
  <text x="55" y="300" class="d345b-text" font-weight="600">Filters raw noise</text>
  
  <!-- Step 2 -->
  <rect x="250" y="110" width="185" height="270" class="d345b-step" />
  <text x="265" y="145" class="d345b-header" fill="#1d4ed8">2. Context Enclosure</text>
  <text x="265" y="180" class="d345b-text">• XML tag escaping</text>
  <text x="265" y="205" class="d345b-text">• &lt;user_input&gt; sandbox</text>
  <text x="265" y="230" class="d345b-text">• Instruction priority rule</text>
  <text x="265" y="255" class="d345b-text">• System prompt canary</text>
  <text x="265" y="300" class="d345b-text" font-weight="600">Structural separation</text>
  
  <!-- Step 3 -->
  <rect x="460" y="110" width="185" height="270" class="d345b-step" />
  <text x="475" y="145" class="d345b-header" fill="#1d4ed8">3. Dual-LLM Guard</text>
  <text x="475" y="180" class="d345b-text">• LLM 1: Tool-less ingest</text>
  <text x="475" y="205" class="d345b-text">• Schema-locked JSON</text>
  <text x="475" y="230" class="d345b-text">• LLM 2: Controller</text>
  <text x="475" y="255" class="d345b-text">• Scoped tool execution</text>
  <text x="475" y="300" class="d345b-text" font-weight="600">Quarantines payloads</text>
  
  <!-- Step 4 -->
  <rect x="670" y="110" width="190" height="270" class="d345b-step" />
  <text x="685" y="145" class="d345b-header" fill="#1d4ed8">4. Outbound Canary</text>
  <text x="685" y="180" class="d345b-text">• Canary UUID detector</text>
  <text x="685" y="205" class="d345b-text">• System prompt match</text>
  <text x="685" y="230" class="d345b-text">• Instant payload drop</text>
  <text x="685" y="255" class="d345b-text">• SRE incident alert</text>
  <text x="685" y="300" class="d345b-text" font-weight="600">Zero data exfiltration</text>
</svg>