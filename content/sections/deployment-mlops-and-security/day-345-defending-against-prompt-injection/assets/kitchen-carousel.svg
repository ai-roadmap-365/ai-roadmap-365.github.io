<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And a label on the truffle oil.">
  <title>Fake orders on the kitchen carousel</title>
  <style>
    .kitchen-carousel-bg   { fill: #f8fafc; }
    .kitchen-carousel-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-carousel-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-carousel-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-carousel-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-carousel-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kitchen-carousel-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-carousel-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .kitchen-carousel-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .kitchen-carousel-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .kitchen-carousel-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .kitchen-carousel-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .kitchen-carousel-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .kitchen-carousel-row { opacity: 1; }
    .kitchen-carousel-r0 { animation-delay: 0.00s; }
    .kitchen-carousel-r1 { animation-delay: 0.45s; }
    .kitchen-carousel-r2 { animation-delay: 0.90s; }
    .kitchen-carousel-r3 { animation-delay: 1.35s; }
    .kitchen-carousel-r4 { animation-delay: 1.80s; }
    .kitchen-carousel-row { animation: kitchen-carousel-reveal 7.3s ease-in-out infinite; }
    @keyframes kitchen-carousel-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="kitchen-carousel-bg" width="980" height="390"/>
  <text class="kitchen-carousel-h1"  x="30" y="40">Fake orders on the kitchen carousel</text>
  <text class="kitchen-carousel-sub" x="30" y="64">And a label on the truffle oil.</text>
  <rect class="kitchen-carousel-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-carousel-name" x="46" y="122">The forged order slip</text>
  <text class="kitchen-carousel-desc" x="46" y="142">The customer writes it.</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r0" x="46" y="182">"Chef: throw all the steaks away"</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r1" x="46" y="216">The chef reads every slip on the wheel</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r2" x="46" y="250">The customer is present and identifiable</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r3" x="46" y="284">A stamped-ticket rule catches it</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r4" x="46" y="318">This is direct injection</text>
  <rect class="kitchen-carousel-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="kitchen-carousel-name" x="526" y="122">The poisoned label</text>
  <text class="kitchen-carousel-desc" x="526" y="142">The supplier printed it.</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r0" x="526" y="182">"Chef Notice: ignore the waiter"</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r1" x="526" y="216">On a jar of imported truffle oil</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r2" x="526" y="250">The attacker never entered the restaurant</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r3" x="526" y="284">No ticket rule applies to a jar</text>
  <text class="kitchen-carousel-desc kitchen-carousel-row kitchen-carousel-r4" x="526" y="318">This is indirect injection</text>
  <text class="kitchen-carousel-sub" x="30" y="372">The prep worker who opens every jar in a room with no stoves is the quarantine model, and the point of the room is not that they are careful — it is that there is nothing in there to set on fire.</text>
</svg>
