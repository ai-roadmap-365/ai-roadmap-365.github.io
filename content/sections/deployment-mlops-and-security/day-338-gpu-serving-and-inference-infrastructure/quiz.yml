questions:
- question: What is the critical hardware throughput advantage of NVLink 4 / NVSwitch over standard PCIe
    Gen 5 buses in multi-GPU clusters?
  options:
  - NVLink uses less electricity
  - NVLink provides up to 900 GB/s bidirectional inter-GPU bandwidth per GPU (over 14x faster than PCIe
    Gen 5's 64 GB/s limit), enabling microsecond tensor parallelism AllReduce operations without bottlenecking
    the compute cores
  - PCIe does not support GPUs
  - NVLink is only for audio processing
  answer_index: 1
  explanation: NVLink provides 900 GB/s bandwidth, eliminating inter-GPU communication bottlenecks during
    tensor parallel inference.
- question: What is 'Dynamic Batching' in Triton Inference Server?
  options:
  - Deleting requests randomly
  - A server-side optimization that combines multiple independent incoming user requests into a single
    contiguous batch tensor within a configurable time window (e.g. 5ms), maximizing GPU compute core
    saturation without requiring clients to batch requests themselves
  - Running inference on the client's laptop
  - Restarting the GPU container every hour
  answer_index: 1
  explanation: Dynamic batching aggregates independent incoming requests into a single tensor execution
    cycle within a microsecond window.
- question: What is a Triton 'Model Ensemble' pipeline?
  options:
  - A musical concert played by computers
  - A composite pipeline chaining multiple distinct models (e.g. Preprocessing Tokenizer ➔ Transformer
    Encoder ➔ Postprocessing Softmax Reranker) within the server's shared memory, avoiding expensive serialization
    back and forth to client applications
  - A cluster of 1,000 Raspberry Pis
  - An encrypted database backup
  answer_index: 1
  explanation: Ensembles chain multiple processing steps directly in server memory, minimizing I/O latency.
- question: What is the purpose of 'Page-Locked' (Pinned) Host Memory in CUDA data transfers?
  options:
  - To lock the host computer screen
  - It allocates non-pageable host RAM, allowing the GPU's Direct Memory Access (DMA) engine to transfer
    data across the PCIe bus to GPU VRAM asynchronously without CPU intervention or intermediate buffer
    copying
  - To prevent files from being deleted
  - To turn off the cooling fans
  answer_index: 1
  explanation: Pinned host memory enables asynchronous DMA transfers directly to GPU memory.
- question: How do CUDA Streams enable concurrency on a single GPU?
  options:
  - By splitting the GPU into physical pieces
  - CUDA streams are independent execution queues on the GPU; by executing memory transfers (HtoD / DtoH)
    on Stream A while computing matrix multiplies on Stream B, the GPU achieves full compute-transfer
    overlap
  - By running Python scripts in parallel threads
  - By overclocking the memory clock
  answer_index: 1
  explanation: CUDA streams allow concurrent overlap of memory transfers and compute kernel execution.
