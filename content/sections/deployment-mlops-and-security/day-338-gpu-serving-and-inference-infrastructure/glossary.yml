terms:
  - term: Triton Inference Server
    definition: >-
      NVIDIA's open-source multi-framework inference engine supporting TensorRT, PyTorch, ONNX, and
      vLLM.
  - term: NVLink / NVSwitch
    definition: NVIDIA's high-speed direct inter-GPU interconnect delivering up to 900 GB/s per GPU.
  - term: Dynamic Batching
    definition: Server-side aggregation of concurrent client requests into unified GPU execution batches.
  - term: Model Ensemble
    definition: A DAG pipeline connecting multiple models in shared server memory with zero network overhead.
  - term: CUDA Streams
    definition: Independent GPU execution queues enabling overlapping compute and memory transfer operations.
  - term: Pinned Memory (Page-Locked)
    definition: Host RAM mapped directly for high-speed asynchronous DMA transfer to GPU VRAM.
  - term: TensorRT-LLM
    definition: NVIDIA's highly optimized runtime library for ultra-low latency LLM inference on Tensor Cores.
  - term: MIG (Multi-Instance GPU)
    definition: >-
      Hardware partitioning of an A100/H100 GPU into isolated hardware instances with dedicated
      compute and memory.
  - term: Static Batching
    definition: >-
      Grouping whole requests and running them together until the longest finishes. Correct for
      single-pass models and wasteful for generation, where the batch is held by its slowest member.
  - term: Continuous Batching
    definition: >-
      Scheduling at the token rather than the request level — after every forward pass, finished
      sequences are evicted and waiting ones admitted into the freed slots.
  - term: KV Cache
    definition: >-
      The stored keys and values for every previous token, which makes generation linear rather than
      quadratic. Its size, not FLOPs, usually limits how many requests fit on a card.
  - term: PagedAttention
    definition: >-
      Allocating the KV cache in fixed-size blocks with a per-sequence block table, so memory need
      not be contiguous and identical prefixes can share physical blocks.
