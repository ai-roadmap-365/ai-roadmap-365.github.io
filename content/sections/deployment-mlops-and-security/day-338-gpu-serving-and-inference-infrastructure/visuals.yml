visuals:
- id: nvlink-multi-gpu-topology-and-cuda-streams
  file: assets/nvlink-multi-gpu-topology-and-cuda-streams.svg
  type: diagram
  title: NVLink Multi-GPU Topology and CUDA Streams
  alt: NVLink Multi-GPU Topology and CUDA Streams showing 4x H100 GPUs connected via 900 GB/s NVSwitch
    Fabric with Concurrent CUDA Stream Overlap between DMA Memory Copy and Tensor Core Compute
  description: Hardware architecture diagram illustrating high-speed NVLink interconnects and concurrent
    CUDA stream execution.
- id: triton-inference-server-dynamic-batching-and-ensemble-flow
  file: assets/triton-inference-server-dynamic-batching-and-ensemble-flow.svg
  type: diagram
  title: Triton Inference Server Dynamic Batching and Ensemble Flow
  alt: Triton Inference Server Dynamic Batching and Ensemble Flow showing Dynamic Batch Scheduler aggregating
    incoming requests into unified batch tensors and passing them through Tokenizer, Model, and Postprocessing
    Ensembles
  description: Software architecture diagram detailing Triton dynamic batch scheduling and multi-model
    ensemble pipelines.
- id: three-bottlenecks
  file: assets/three-bottlenecks.svg
  type: diagram
  title: 'Three physical bottlenecks'
  alt: 'Diagram: the three hardware bottlenecks in GPU inference'
  description: 'A three-stage description of GPU inference bottlenecks covering inter-GPU bandwidth, kernel launch overhead on single requests, and unpinned host memory.'
- id: static-or-continuous
  file: assets/static-or-continuous.svg
  type: diagram
  title: 'Static batching against continuous'
  alt: 'Diagram: static request-level batching compared with continuous token-level scheduling'
  description: 'A two-column comparison of static batching against continuous iteration-level batching for autoregressive text generation.'
- id: kv-cache-arithmetic
  file: assets/kv-cache-arithmetic.svg
  type: diagram
  title: 'What actually bounds concurrency'
  alt: 'Diagram: why the KV cache rather than model size bounds concurrent requests'
  description: 'A four-stage explanation of the KV cache showing why it exists, how it grows, what it leaves on a 24 GB card, and the effect of naive allocation.'
- id: paged-attention
  file: assets/paged-attention.svg
  type: diagram
  title: 'PagedAttention, and where it came from'
  alt: 'Diagram: how PagedAttention allocates the KV cache in fixed-size blocks'
  description: 'A four-stage description of PagedAttention covering block allocation, per-sequence block tables, bounded fragmentation and block sharing between requests.'
- id: gpu-serving-eras
  file: assets/gpu-serving-eras.svg
  type: diagram
  title: 'Three generational leaps'
  alt: 'Diagram: the progression from synchronous PyTorch serving to NVLink and TensorRT-LLM'
  description: 'A three-stage progression of GPU inference infrastructure from synchronous Python workers through C++ inference engines to high-bandwidth multi-GPU fabrics.'
- id: not-single-threaded
  file: assets/not-single-threaded.svg
  type: diagram
  title: 'What serving infrastructure replaces'
  alt: 'Diagram: GPU serving infrastructure compared with the prototyping habits it replaces'
  description: 'A two-column comparison of production GPU serving against single-threaded scripts and network hops between pipeline stages.'
- id: elevator-analogy
  file: assets/elevator-analogy.svg
  type: diagram
  title: 'A skyscraper elevator'
  alt: 'Diagram: an elevator carrying one passenger compared with one that waits to fill'
  description: 'A two-column comparison of dispatching an elevator per passenger against holding the doors briefly to batch passengers.'
- id: mig-partitioning
  file: assets/mig-partitioning.svg
  type: diagram
  title: 'Partitioning one large GPU'
  alt: 'Diagram: what hardware partitioning of a GPU provides'
  description: 'A three-stage description of Multi-Instance GPU partitioning covering dedicated resources, fault isolation and deterministic quality of service.'
- id: gpu-hazards
  file: assets/gpu-hazards.svg
  type: diagram
  title: 'Four GPU serving hazards'
  alt: 'Diagram: the four failure modes of GPU serving infrastructure and their controls'
  description: 'A four-stage description of GPU serving hazards covering PCIe bandwidth limits, single-request inefficiency, unpinned memory latency and KV cache exhaustion.'
- id: mig-tenancy
  file: assets/mig-tenancy.svg
  type: diagram
  title: 'Multi-tenancy on one GPU'
  alt: 'Diagram: hardware-partitioned multi-tenancy compared with software sharing on one GPU'
  description: 'A two-column comparison of MIG hardware partitioning against software-level GPU sharing for multi-tenant serving.'
- id: triton-or-vllm
  file: assets/triton-or-vllm.svg
  type: diagram
  title: 'Triton or vLLM'
  alt: 'Diagram: Triton Inference Server compared with the vLLM engine'
  description: 'A two-column comparison of Triton and vLLM by workload fit and defining capability.'
- id: gpu-serving-when
  file: assets/gpu-serving-when.svg
  type: diagram
  title: 'When this infrastructure pays'
  alt: 'Diagram: when GPU serving infrastructure is worth its complexity'
  description: 'A two-column comparison of workloads that justify Triton-class serving infrastructure against those that do not.'
