<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="The unit of scheduling changes.">
  <title>Static batching against continuous</title>
  <style>
    .static-or-continuous-bg   { fill: #f8fafc; }
    .static-or-continuous-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-continuous-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-continuous-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-continuous-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-continuous-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .static-or-continuous-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-continuous-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .static-or-continuous-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .static-or-continuous-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .static-or-continuous-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .static-or-continuous-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .static-or-continuous-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .static-or-continuous-row { opacity: 1; }
    .static-or-continuous-r0 { animation-delay: 0.00s; }
    .static-or-continuous-r1 { animation-delay: 0.45s; }
    .static-or-continuous-r2 { animation-delay: 0.90s; }
    .static-or-continuous-r3 { animation-delay: 1.35s; }
    .static-or-continuous-r4 { animation-delay: 1.80s; }
    .static-or-continuous-row { animation: static-or-continuous-reveal 7.3s ease-in-out infinite; }
    @keyframes static-or-continuous-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="static-or-continuous-bg" width="980" height="390"/>
  <text class="static-or-continuous-h1"  x="30" y="40">Static batching against continuous</text>
  <text class="static-or-continuous-sub" x="30" y="64">The unit of scheduling changes.</text>
  <rect class="static-or-continuous-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-continuous-name" x="46" y="122">Static batching</text>
  <text class="static-or-continuous-desc" x="46" y="142">Scheduled per request.</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r0" x="46" y="182">Batch four, run, return four</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r1" x="46" y="216">Three finish at 20 tokens, one runs to 800</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r2" x="46" y="250">The batch occupies the GPU until the longest ends</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r3" x="46" y="284">Three quarters of the slots compute padding</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r4" x="46" y="318">A new request waits for the batch to drain</text>
  <rect class="static-or-continuous-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="static-or-continuous-name" x="526" y="122">Continuous batching</text>
  <text class="static-or-continuous-desc" x="526" y="142">Scheduled per token.</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r0" x="526" y="182">Evict finished sequences every forward pass</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r1" x="526" y="216">Admit waiting ones into the freed slots</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r2" x="526" y="250">A request arriving mid-generation joins the next iteration</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r3" x="526" y="284">No padding, no waiting for strangers</text>
  <text class="static-or-continuous-desc static-or-continuous-row static-or-continuous-r4" x="526" y="318">Ten to twenty times the throughput</text>
  <text class="static-or-continuous-sub" x="30" y="372">This is why `max_batch_size` is the wrong dial for an LLM: it sets how many requests may share a batch, and the thing that actually determines throughput is whether the scheduler runs per request or per iteration.</text>
</svg>
