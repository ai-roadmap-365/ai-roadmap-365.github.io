learning_promise: 'Master cloud AI infrastructure provisioning: deploy containerized AI workloads to serverless
  and container orchestration services (Cloud Run with GPU, AWS ECS Fargate, GCP GKE) using declarative
  Terraform and Python.'
objectives:
- Deconstruct the operational trade-offs between Serverless Container Hosting (Cloud Run / Modal) vs Dedicated
  Managed Kubernetes (EKS / GKE).
- Implement Infrastructure as Code (IaC) with Terraform provisioning container registries, GPU node pools,
  and IAM security perimeters.
- Configure automated Continuous Deployment (CD) pipelines pushing immutable versioned images and triggering
  rolling cluster updates.
- Build a Cloud Deployment Orchestration Simulator in Python modeling infrastructure provisioning, IAM
  binding, and rolling deployments.
- 'Evaluate cloud cost optimization: reserved instances vs savings plans vs spot GPU autoscaling policies.'
