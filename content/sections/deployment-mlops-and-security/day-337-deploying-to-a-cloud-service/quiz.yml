questions:
- question: What is the primary architectural differentiator of Serverless GPU Hosting (e.g. Google Cloud
    Run with Nvidia L4 GPUs, Modal, RunPod Serverless) compared to Dedicated Kubernetes Clusters?
  options:
  - Serverless GPUs do not support Python
  - Serverless GPU hosting charges per-millisecond of actual execution time with scale-to-zero when idle,
    eliminating fixed 24/7 node billing at the cost of container cold-start initialization latency (15–45s)
    on initial scale-up
  - Serverless GPUs have infinite memory
  - Dedicated clusters cannot run Docker containers
  answer_index: 1
  explanation: Serverless GPU platforms bill exclusively for active compute time with scale-to-zero, trading
    cold-start delays for massive cost savings.
- question: Why is Infrastructure as Code (IaC) with Terraform essential for production AI deployments?
  options:
  - It formats Markdown files
  - It provides declarative, version-controlled, reproducible definitions of cloud resources (GPU node
    pools, VPC subnets, IAM service accounts, secret managers), preventing configuration drift between
    Staging and Production environments
  - It makes models 10x faster
  - It compiles Python code into C++
  answer_index: 1
  explanation: Terraform ensures declarative, reproducible, and drift-free infrastructure provisioning
    across environments.
- question: What is the security principle of 'Least Privilege IAM' for AI container deployments?
  options:
  - Giving containers full root admin access to the entire cloud account
  - Granting the container service account only the exact minimal permissions required (e.g. read-only
    access to specific S3 model weight buckets and write access to CloudWatch logs), preventing catastrophic
    lateral movement upon container compromise
  - Disabling all passwords across the team
  - Running all services anonymously without authentication
  answer_index: 1
  explanation: Least privilege IAM ensures compromised containers cannot access unauthorized cloud resources.
- question: What is a 'Blue-Green Deployment' strategy in cloud AI serving?
  options:
  - Painting the server rack blue and green
  - Running two identical production environments (Blue = active live traffic, Green = new model version);
    once Green passes automated integration health checks, the cloud load balancer switches 100% of user
    traffic to Green instantly with zero downtime
  - Deleting the database before deployment
  - Restarting the model every 5 minutes
  answer_index: 1
  explanation: Blue-Green deployments maintain two identical environments, switching load balancer traffic
    instantaneously once verified.
- question: How do Cloud Cost Savings Plans / 1-Year Commitments reduce enterprise GPU spending?
  options:
  - By turning off the GPUs on weekends
  - By committing to a baseline hourly compute spend over 1 or 3 years, cloud providers grant 30% to 55%
    discounts off standard on-demand pricing for predictable baseline AI workloads
  - By deleting model weights from memory
  - By converting all models to 1-bit integers
  answer_index: 1
  explanation: Commitment-based savings plans provide 30-55% cost reductions for steady-state baseline
    AI workloads.
