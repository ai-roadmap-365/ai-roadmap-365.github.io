terms:
- term: Infrastructure as Code (IaC)
  definition: Managing and provisioning computing infrastructure through version-controlled definition
    files (e.g. Terraform).
- term: Serverless GPU
  definition: A cloud execution model where GPU instances are dynamically provisioned and billed per millisecond
    of active execution.
- term: Blue-Green Deployment
  definition: A deployment strategy utilizing two identical environments to achieve instantaneous zero-downtime
    cutover.
- term: Canary Deployment
  definition: Gradually rolling out a new model version to a small percentage of user traffic (e.g. 5%)
    before full rollout.
- term: IAM Role / Service Account
  definition: An identity created in cloud provider IAM that has specific permissions to interact with
    cloud services.
- term: Container Registry
  definition: A secure, managed repository for storing, versioning, and distributing Docker container
    images (ECR / Artifact Registry).
- term: Cold-Start Penalty
  definition: The latency overhead incurred when a serverless container initializes hardware, loads dependencies,
    and mounts weights.
- term: Spot / Preemptible Instances
  definition: Discounted spare cloud compute capacity that can be reclaimed by the cloud provider with
    short notice.
