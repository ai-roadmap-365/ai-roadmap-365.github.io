visuals:
- id: declarative-iac-cloud-deployment-pipeline
  file: assets/declarative-iac-cloud-deployment-pipeline.svg
  type: diagram
  title: Declarative IaC Cloud Deployment Pipeline
  alt: Declarative IaC Cloud Deployment Pipeline showing Terraform Plan & Apply, Secure Container Registry,
    IAM Role Attachment, and Cloud Run / Kubernetes Pod Provisioning with Zero Downtime Cutover
  description: System architecture diagram illustrating automated declarative cloud provisioning with
    Terraform and CI/CD.
- id: blue-green-vs-canary-deployment-traffic-split
  file: assets/blue-green-vs-canary-deployment-traffic-split.svg
  type: diagram
  title: Blue-Green vs Canary Deployment Traffic Split
  alt: Blue-Green vs Canary Deployment Traffic Split comparing instantaneous 100% Blue-to-Green cutover
    against progressive 5% to 25% to 100% Canary traffic ramp-up with automated rollback on error spikes
  description: Comparison diagram showing traffic management strategies during zero-downtime AI deployments.
- id: clickops-or-iac
  file: assets/clickops-or-iac.svg
  type: diagram
  title: 'Click-ops against a blueprint'
  alt: 'Diagram: manual console configuration compared with declarative infrastructure as code'
  description: 'A two-column comparison of configuring cloud infrastructure through a web console against defining it in Terraform.'
- id: deploy-pipeline-stages
  file: assets/deploy-pipeline-stages.svg
  type: diagram
  title: 'The deployment pipeline'
  alt: 'Diagram: the stages of a declarative cloud deployment pipeline'
  description: 'A five-stage description of a cloud deployment pipeline covering plan, image build, registry push, provisioning and traffic cutover.'
- id: cloud-deploy-eras
  file: assets/cloud-deploy-eras.svg
  type: diagram
  title: 'Three eras of cloud AI deployment'
  alt: 'Diagram: the progression from manual VM provisioning to serverless GPU'
  description: 'A three-stage progression of cloud AI deployment from manual instance provisioning through containerised platforms to serverless GPU hosting.'
- id: not-console-not-baked
  file: assets/not-console-not-baked.svg
  type: diagram
  title: 'Two things it is never'
  alt: 'Diagram: what cloud AI deployment is compared with two practices it excludes'
  description: 'A two-column comparison of a codified cloud deployment against manual console configuration and secrets baked into images.'
- id: iac-workflow
  file: assets/iac-workflow.svg
  type: diagram
  title: 'How a Terraform apply behaves'
  alt: 'Diagram: how declarative infrastructure is planned, locked, applied and verified'
  description: 'A six-stage description of an infrastructure-as-code workflow covering desired state, plan, state locking, apply, health verification and cutover.'
- id: blue-green-or-canary
  file: assets/blue-green-or-canary.svg
  type: diagram
  title: 'Blue-green or canary'
  alt: 'Diagram: blue-green cutover compared with a canary traffic ramp'
  description: 'A two-column comparison of an instantaneous blue-green cutover against a progressive canary traffic ramp.'
- id: airport-signage
  file: assets/airport-signage.svg
  type: diagram
  title: 'Rewiring an airport''s signage'
  alt: 'Diagram: cutting over airport signage mid-service compared with installing in parallel'
  description: 'A two-column comparison of modifying a live system in place against building the replacement alongside it and switching.'
- id: cloud-failure-modes
  file: assets/cloud-failure-modes.svg
  type: diagram
  title: 'Four ways a cloud deploy fails'
  alt: 'Diagram: the four failure modes of a cloud AI deployment and their controls'
  description: 'A four-stage description of cloud deployment failure modes covering configuration drift, premature probe termination, dropped connections and runaway spend.'
- id: cost-arbitrage
  file: assets/cost-arbitrage.svg
  type: diagram
  title: 'Three traffic classes, three price points'
  alt: 'Diagram: matching baseline, peak and batch traffic to committed, on-demand and spot capacity'
  description: 'A three-stage description of GPU cost optimisation matching steady-state traffic to savings plans, peaks to on-demand capacity, and batch work to spot instances.'
- id: private-or-public-endpoint
  file: assets/private-or-public-endpoint.svg
  type: diagram
  title: 'A public inference endpoint'
  alt: 'Diagram: a publicly exposed inference endpoint compared with a private one behind a gateway'
  description: 'A two-column comparison of a directly reachable GPU inference endpoint against one placed in a private subnet behind a gateway.'
- id: cloud-implications-ai
  file: assets/cloud-implications-ai.svg
  type: diagram
  title: 'Five consequences of running in a region'
  alt: 'Diagram: the security, privacy, performance, resilience and cost implications of cloud AI deployment'
  description: 'A five-stage description of cloud deployment implications covering secret injection, data residency, model startup time, multi-region failover and commitment modelling.'
- id: iac-when
  file: assets/iac-when.svg
  type: diagram
  title: 'When to codify infrastructure'
  alt: 'Diagram: when infrastructure as code is worth its overhead'
  description: 'A two-column comparison of deployments that justify a full Terraform pipeline against those where it is disproportionate.'
