<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="And when a notebook is fine.">
  <title>When to codify infrastructure</title>
  <style>
    .iac-when-bg   { fill: #f8fafc; }
    .iac-when-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-when-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-when-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-when-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-when-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-when-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iac-when-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .iac-when-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .iac-when-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .iac-when-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .iac-when-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .iac-when-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iac-when-row { opacity: 1; }
    .iac-when-r0 { animation-delay: 0.00s; }
    .iac-when-r1 { animation-delay: 0.45s; }
    .iac-when-r2 { animation-delay: 0.90s; }
    .iac-when-r3 { animation-delay: 1.35s; }
    .iac-when-r4 { animation-delay: 1.80s; }
    .iac-when-row { animation: iac-when-reveal 7.3s ease-in-out infinite; }
    @keyframes iac-when-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="iac-when-bg" width="980" height="390"/>
  <text class="iac-when-h1"  x="30" y="40">When to codify infrastructure</text>
  <text class="iac-when-sub" x="30" y="64">And when a notebook is fine.</text>
  <rect class="iac-when-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="iac-when-name" x="46" y="122">Codify it</text>
  <text class="iac-when-desc" x="46" y="142">Anything with users.</text>
  <text class="iac-when-desc iac-when-row iac-when-r0" x="46" y="182">Customer-facing SaaS</text>
  <text class="iac-when-desc iac-when-row iac-when-r1" x="46" y="216">Multi-tenant generative AI APIs</text>
  <text class="iac-when-desc iac-when-row iac-when-r2" x="46" y="250">More than one environment</text>
  <text class="iac-when-desc iac-when-row iac-when-r3" x="46" y="284">More than one person deploying</text>
  <text class="iac-when-desc iac-when-row iac-when-r4" x="46" y="318">Anything you would have to rebuild</text>
  <rect class="iac-when-hi" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="iac-when-name" x="526" y="122">Do not</text>
  <text class="iac-when-desc" x="526" y="142">Prototyping.</text>
  <text class="iac-when-desc iac-when-row iac-when-r0" x="526" y="182">A one-off notebook</text>
  <text class="iac-when-desc iac-when-row iac-when-r1" x="526" y="216">Local experimentation</text>
  <text class="iac-when-desc iac-when-row iac-when-r2" x="526" y="250">A demo that lives for a week</text>
  <text class="iac-when-desc iac-when-row iac-when-r3" x="526" y="284">Multi-region Terraform for one endpoint</text>
  <text class="iac-when-desc iac-when-row iac-when-r4" x="526" y="318">But keep the budget alert regardless</text>
  <text class="iac-when-sub" x="30" y="372">The budget alert is the exception to every proportionality argument here, exactly as in Day 334: it costs one console setting and it is the only control that bounds the worst case.</text>
</svg>
