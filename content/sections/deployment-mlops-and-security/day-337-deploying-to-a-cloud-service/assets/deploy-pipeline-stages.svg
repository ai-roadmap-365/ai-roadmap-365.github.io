<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Five stages, each with a gate.">
  <title>The deployment pipeline</title>
  <style>
    .deploy-pipeline-stages-bg   { fill: #f8fafc; }
    .deploy-pipeline-stages-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-pipeline-stages-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-pipeline-stages-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-pipeline-stages-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-pipeline-stages-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .deploy-pipeline-stages-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .deploy-pipeline-stages-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .deploy-pipeline-stages-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .deploy-pipeline-stages-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .deploy-pipeline-stages-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .deploy-pipeline-stages-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .deploy-pipeline-stages-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .deploy-pipeline-stages-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .deploy-pipeline-stages-stage { opacity: 1; }

    .deploy-pipeline-stages-s0 { animation-delay: 0.00s; }
    .deploy-pipeline-stages-e0 { animation-delay: 0.00s; }
    .deploy-pipeline-stages-s1 { animation-delay: 1.33s; }
    .deploy-pipeline-stages-e1 { animation-delay: 1.33s; }
    .deploy-pipeline-stages-s2 { animation-delay: 2.67s; }
    .deploy-pipeline-stages-e2 { animation-delay: 2.67s; }
    .deploy-pipeline-stages-s3 { animation-delay: 4.00s; }
    .deploy-pipeline-stages-e3 { animation-delay: 4.00s; }
    .deploy-pipeline-stages-s4 { animation-delay: 5.33s; }
    .deploy-pipeline-stages-e4 { animation-delay: 5.33s; }
    @media (prefers-reduced-motion: no-preference) {
      .deploy-pipeline-stages-conn  { animation: deploy-pipeline-stages-trace 8s ease-in-out infinite; }
      .deploy-pipeline-stages-stage { animation: deploy-pipeline-stages-arrive 8s ease-in-out infinite; }
    }
    @keyframes deploy-pipeline-stages-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes deploy-pipeline-stages-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .deploy-pipeline-stages-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .deploy-pipeline-stages-stage { animation: deploy-pipeline-stages-settle 8s ease-in-out infinite; opacity: 1; }
    }
    @keyframes deploy-pipeline-stages-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="deploy-pipeline-stages-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="deploy-pipeline-stages-bg" width="980" height="322"/>
  <text class="deploy-pipeline-stages-h1"  x="30" y="40">The deployment pipeline</text>
  <text class="deploy-pipeline-stages-sub" x="30" y="64">Five stages, each with a gate.</text>
  <g class="deploy-pipeline-stages-stage deploy-pipeline-stages-s0">
    <rect class="deploy-pipeline-stages-box" x="30" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-pipeline-stages-step" x="44" y="142">01</text>
    <text class="deploy-pipeline-stages-name" x="70" y="142">terraform plan</text>
    <text class="deploy-pipeline-stages-desc" x="44" y="166">What would change, before</text>
    <text class="deploy-pipeline-stages-desc" x="44" y="182">anything does. The</text>
    <text class="deploy-pipeline-stages-desc" x="44" y="198">cheapest possible review.</text>
  </g>
  <line class="deploy-pipeline-stages-line deploy-pipeline-stages-conn deploy-pipeline-stages-e0" x1="195" y1="170" x2="217" y2="170" marker-end="url(#deploy-pipeline-stages-tip)"/>
  <g class="deploy-pipeline-stages-stage deploy-pipeline-stages-s1">
    <rect class="deploy-pipeline-stages-box" x="219" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-pipeline-stages-step" x="233" y="142">02</text>
    <text class="deploy-pipeline-stages-name" x="259" y="142">Build an immutable image</text>
    <text class="deploy-pipeline-stages-desc" x="233" y="166">Signed, and identified by</text>
    <text class="deploy-pipeline-stages-desc" x="233" y="182">digest rather than a tag.</text>
    <text class="deploy-pipeline-stages-edge" x="233" y="242">digest</text>
  </g>
  <line class="deploy-pipeline-stages-line deploy-pipeline-stages-conn deploy-pipeline-stages-e1" x1="384" y1="170" x2="406" y2="170" marker-end="url(#deploy-pipeline-stages-tip)"/>
  <g class="deploy-pipeline-stages-stage deploy-pipeline-stages-s2">
    <rect class="deploy-pipeline-stages-box" x="408" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-pipeline-stages-step" x="422" y="142">03</text>
    <text class="deploy-pipeline-stages-name" x="448" y="142">Push to a regional registry</text>
    <text class="deploy-pipeline-stages-desc" x="422" y="166">With vulnerability</text>
    <text class="deploy-pipeline-stages-desc" x="422" y="182">scanning on.</text>
  </g>
  <line class="deploy-pipeline-stages-line deploy-pipeline-stages-conn deploy-pipeline-stages-e2" x1="573" y1="170" x2="595" y2="170" marker-end="url(#deploy-pipeline-stages-tip)"/>
  <g class="deploy-pipeline-stages-stage deploy-pipeline-stages-s3">
    <rect class="deploy-pipeline-stages-box" x="597" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-pipeline-stages-step" x="611" y="142">04</text>
    <text class="deploy-pipeline-stages-name" x="637" y="142">Provision with least-privilege IAM</text>
    <text class="deploy-pipeline-stages-desc" x="611" y="166">A service account with no</text>
    <text class="deploy-pipeline-stages-desc" x="611" y="182">admin rights, scoped to</text>
    <text class="deploy-pipeline-stages-desc" x="611" y="198">what it touches.</text>
  </g>
  <line class="deploy-pipeline-stages-line deploy-pipeline-stages-conn deploy-pipeline-stages-e3" x1="762" y1="170" x2="784" y2="170" marker-end="url(#deploy-pipeline-stages-tip)"/>
  <g class="deploy-pipeline-stages-stage deploy-pipeline-stages-s4">
    <rect class="deploy-pipeline-stages-good" x="786" y="118" width="163" height="104" rx="10"/>
    <text class="deploy-pipeline-stages-step" x="800" y="142">05</text>
    <text class="deploy-pipeline-stages-name" x="826" y="142">Cut traffic over</text>
    <text class="deploy-pipeline-stages-desc" x="800" y="166">Blue-green or canary,</text>
    <text class="deploy-pipeline-stages-desc" x="800" y="182">with an automated</text>
    <text class="deploy-pipeline-stages-desc" x="800" y="198">rollback hook.</text>
    <text class="deploy-pipeline-stages-edge" x="800" y="242">zero downtime</text>
  </g>
  <text class="deploy-pipeline-stages-sub" x="30" y="304">`terraform plan` occupies the same place in this pipeline that Day 359's preflight does in a release: it is the last gate at which a bad change costs nothing at all to stop.</text>
</svg>
