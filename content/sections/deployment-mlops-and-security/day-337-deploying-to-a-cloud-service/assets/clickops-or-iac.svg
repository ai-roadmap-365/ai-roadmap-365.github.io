<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One is remembered; one is reviewed.">
  <title>Click-ops against a blueprint</title>
  <style>
    .clickops-or-iac-bg   { fill: #f8fafc; }
    .clickops-or-iac-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickops-or-iac-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickops-or-iac-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickops-or-iac-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickops-or-iac-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .clickops-or-iac-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clickops-or-iac-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .clickops-or-iac-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .clickops-or-iac-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .clickops-or-iac-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .clickops-or-iac-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .clickops-or-iac-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .clickops-or-iac-row { opacity: 1; }
    .clickops-or-iac-r0 { animation-delay: 0.00s; }
    .clickops-or-iac-r1 { animation-delay: 0.45s; }
    .clickops-or-iac-r2 { animation-delay: 0.90s; }
    .clickops-or-iac-r3 { animation-delay: 1.35s; }
    .clickops-or-iac-r4 { animation-delay: 1.80s; }
    .clickops-or-iac-row { animation: clickops-or-iac-reveal 7.3s ease-in-out infinite; }
    @keyframes clickops-or-iac-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="clickops-or-iac-bg" width="980" height="390"/>
  <text class="clickops-or-iac-h1"  x="30" y="40">Click-ops against a blueprint</text>
  <text class="clickops-or-iac-sub" x="30" y="64">One is remembered; one is reviewed.</text>
  <rect class="clickops-or-iac-warn" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="clickops-or-iac-name" x="46" y="122">Click-ops</text>
  <text class="clickops-or-iac-desc" x="46" y="142">Configured from memory.</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r0" x="46" y="182">Buttons in a console, in order, from memory</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r1" x="46" y="216">Staging and production drift apart</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r2" x="46" y="250">Nobody can say what changed, or when</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r3" x="46" y="284">Reproducing it takes hours</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r4" x="46" y="318">"Works on staging, crashes in prod"</text>
  <rect class="clickops-or-iac-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="clickops-or-iac-name" x="526" y="122">Infrastructure as code</text>
  <text class="clickops-or-iac-desc" x="526" y="142">Reviewed like code.</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r0" x="526" y="182">Every stove and gas line in a blueprint</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r1" x="526" y="216">Identical kitchens in three cities</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r2" x="526" y="250">A diff shows exactly what changed</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r3" x="526" y="284">Reproducing it is one command</text>
  <text class="clickops-or-iac-desc clickops-or-iac-row clickops-or-iac-r4" x="526" y="318">Drift is detectable, and detected</text>
  <text class="clickops-or-iac-sub" x="30" y="372">The drift row is the expensive one: a CUDA driver version that differs between environments for reasons nobody recorded produces a crash that looks like a code bug and is not one.</text>
</svg>
