<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Instant switch, or a graded ramp.">
  <title>Blue-green or canary</title>
  <style>
    .blue-green-or-canary-bg   { fill: #f8fafc; }
    .blue-green-or-canary-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-or-canary-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-or-canary-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-or-canary-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-or-canary-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .blue-green-or-canary-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blue-green-or-canary-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .blue-green-or-canary-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .blue-green-or-canary-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .blue-green-or-canary-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .blue-green-or-canary-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .blue-green-or-canary-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .blue-green-or-canary-row { opacity: 1; }
    .blue-green-or-canary-r0 { animation-delay: 0.00s; }
    .blue-green-or-canary-r1 { animation-delay: 0.45s; }
    .blue-green-or-canary-r2 { animation-delay: 0.90s; }
    .blue-green-or-canary-r3 { animation-delay: 1.35s; }
    .blue-green-or-canary-r4 { animation-delay: 1.80s; }
    .blue-green-or-canary-row { animation: blue-green-or-canary-reveal 7.3s ease-in-out infinite; }
    @keyframes blue-green-or-canary-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="blue-green-or-canary-bg" width="980" height="390"/>
  <text class="blue-green-or-canary-h1"  x="30" y="40">Blue-green or canary</text>
  <text class="blue-green-or-canary-sub" x="30" y="64">Instant switch, or a graded ramp.</text>
  <rect class="blue-green-or-canary-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="blue-green-or-canary-name" x="46" y="122">Blue-green</text>
  <text class="blue-green-or-canary-desc" x="46" y="142">100% at once.</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r0" x="46" y="182">Green built fully in parallel</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r1" x="46" y="216">Verified before any traffic moves</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r2" x="46" y="250">One relay flip, 100 milliseconds</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r3" x="46" y="284">Roll back by flipping again</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r4" x="46" y="318">No partial exposure to reason about</text>
  <rect class="blue-green-or-canary-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="blue-green-or-canary-name" x="526" y="122">Canary</text>
  <text class="blue-green-or-canary-desc" x="526" y="142">5%, then 25%, then 100%.</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r0" x="526" y="182">A fraction of real traffic first</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r1" x="526" y="216">Watched against an error threshold</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r2" x="526" y="250">Automated rollback on a spike</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r3" x="526" y="284">Smaller blast radius</text>
  <text class="blue-green-or-canary-desc blue-green-or-canary-row blue-green-or-canary-r4" x="526" y="318">Needs enough traffic to measure</text>
  <text class="blue-green-or-canary-sub" x="30" y="372">This is Day 359's comparison at the infrastructure layer, and the same caveat applies: below a certain request volume a canary at 5% is not measuring anything, and blue-green with a fast flip back is the honest control.</text>
</svg>
