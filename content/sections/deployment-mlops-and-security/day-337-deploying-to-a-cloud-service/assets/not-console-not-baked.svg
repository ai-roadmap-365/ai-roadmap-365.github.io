<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Both are common first deployments.">
  <title>Two things it is never</title>
  <style>
    .not-console-not-baked-bg   { fill: #f8fafc; }
    .not-console-not-baked-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-console-not-baked-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-console-not-baked-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-console-not-baked-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-console-not-baked-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-console-not-baked-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-console-not-baked-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-console-not-baked-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-console-not-baked-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-console-not-baked-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-console-not-baked-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-console-not-baked-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-console-not-baked-row { opacity: 1; }
    .not-console-not-baked-r0 { animation-delay: 0.00s; }
    .not-console-not-baked-r1 { animation-delay: 0.45s; }
    .not-console-not-baked-r2 { animation-delay: 0.90s; }
    .not-console-not-baked-r3 { animation-delay: 1.35s; }
    .not-console-not-baked-r4 { animation-delay: 1.80s; }
    .not-console-not-baked-row { animation: not-console-not-baked-reveal 7.3s ease-in-out infinite; }
    @keyframes not-console-not-baked-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-console-not-baked-bg" width="980" height="390"/>
  <text class="not-console-not-baked-h1"  x="30" y="40">Two things it is never</text>
  <text class="not-console-not-baked-sub" x="30" y="64">Both are common first deployments.</text>
  <rect class="not-console-not-baked-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-console-not-baked-name" x="46" y="122">What it is</text>
  <text class="not-console-not-baked-desc" x="46" y="142">Codified and least-privilege.</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r0" x="46" y="182">GPU clusters, VPCs, IAM and secrets in Terraform</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r1" x="46" y="216">Immutable signed images in a registry</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r2" x="46" y="250">Blue-green or canary cutover</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r3" x="46" y="284">An IAM perimeter per container</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r4" x="46" y="318">Secrets injected at run time</text>
  <rect class="not-console-not-baked-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-console-not-baked-name" x="526" y="122">What it is not</text>
  <text class="not-console-not-baked-desc" x="526" y="142">Two, both common.</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r0" x="526" y="182">Clicking through a console for production GPUs</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r1" x="526" y="216">API keys inside a Dockerfile</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r2" x="526" y="250">An image is distributable — the key travels</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r3" x="526" y="284">Deleting the line does not remove the layer</text>
  <text class="not-console-not-baked-desc not-console-not-baked-row not-console-not-baked-r4" x="526" y="318">Rotate it; do not edit it out</text>
  <text class="not-console-not-baked-sub" x="30" y="372">Day 330's layer rule is what makes the second row unrecoverable: removing the secret in a later instruction leaves it fully present in the layer beneath, and the image has already been pushed.</text>
</svg>
