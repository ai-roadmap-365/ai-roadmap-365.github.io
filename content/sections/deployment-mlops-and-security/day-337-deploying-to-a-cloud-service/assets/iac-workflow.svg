<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six mechanics, and locking is one.">
  <title>How a Terraform apply behaves</title>
  <style>
    .iac-workflow-bg   { fill: #f8fafc; }
    .iac-workflow-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-workflow-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-workflow-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-workflow-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-workflow-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .iac-workflow-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .iac-workflow-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .iac-workflow-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .iac-workflow-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .iac-workflow-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .iac-workflow-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .iac-workflow-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .iac-workflow-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .iac-workflow-stage { opacity: 1; }

    .iac-workflow-s0 { animation-delay: 0.00s; }
    .iac-workflow-e0 { animation-delay: 0.00s; }
    .iac-workflow-s1 { animation-delay: 1.37s; }
    .iac-workflow-e1 { animation-delay: 1.37s; }
    .iac-workflow-s2 { animation-delay: 2.74s; }
    .iac-workflow-e2 { animation-delay: 2.74s; }
    .iac-workflow-s3 { animation-delay: 4.11s; }
    .iac-workflow-e3 { animation-delay: 4.11s; }
    .iac-workflow-s4 { animation-delay: 5.49s; }
    .iac-workflow-e4 { animation-delay: 5.49s; }
    .iac-workflow-s5 { animation-delay: 6.86s; }
    .iac-workflow-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .iac-workflow-conn  { animation: iac-workflow-trace 9.600000000000001s ease-in-out infinite; }
      .iac-workflow-stage { animation: iac-workflow-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes iac-workflow-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes iac-workflow-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .iac-workflow-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .iac-workflow-stage { animation: iac-workflow-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes iac-workflow-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="iac-workflow-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="iac-workflow-bg" width="980" height="322"/>
  <text class="iac-workflow-h1"  x="30" y="40">How a Terraform apply behaves</text>
  <text class="iac-workflow-sub" x="30" y="64">Six mechanics, and locking is one.</text>
  <g class="iac-workflow-stage iac-workflow-s0">
    <rect class="iac-workflow-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="44" y="142">01</text>
    <text class="iac-workflow-name" x="70" y="142">The file is the desired state</text>
    <text class="iac-workflow-desc" x="44" y="166">Not a script. It</text>
    <text class="iac-workflow-desc" x="44" y="182">describes an</text>
    <text class="iac-workflow-desc" x="44" y="198">outcome, like Day</text>
  </g>
  <line class="iac-workflow-line iac-workflow-conn iac-workflow-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#iac-workflow-tip)"/>
  <g class="iac-workflow-stage iac-workflow-s1">
    <rect class="iac-workflow-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="201" y="142">02</text>
    <text class="iac-workflow-name" x="227" y="142">plan diffs desired against actual</text>
    <text class="iac-workflow-desc" x="201" y="166">Remote state in</text>
    <text class="iac-workflow-desc" x="201" y="182">versioned encrypted</text>
    <text class="iac-workflow-desc" x="201" y="198">storage.</text>
  </g>
  <line class="iac-workflow-line iac-workflow-conn iac-workflow-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#iac-workflow-tip)"/>
  <g class="iac-workflow-stage iac-workflow-s2">
    <rect class="iac-workflow-warn" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="358" y="142">03</text>
    <text class="iac-workflow-name" x="384" y="142">A lock prevents concurrent applies</text>
    <text class="iac-workflow-desc" x="358" y="166">DynamoDB or native</text>
    <text class="iac-workflow-desc" x="358" y="182">GCS locking. One</text>
    <text class="iac-workflow-desc" x="358" y="198">pipeline at a time.</text>
    <text class="iac-workflow-edge" x="358" y="242">locking</text>
  </g>
  <line class="iac-workflow-line iac-workflow-conn iac-workflow-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#iac-workflow-tip)"/>
  <g class="iac-workflow-stage iac-workflow-s3">
    <rect class="iac-workflow-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="515" y="142">04</text>
    <text class="iac-workflow-name" x="541" y="142">apply makes the minimum change</text>
    <text class="iac-workflow-desc" x="515" y="166">Only what differs,</text>
    <text class="iac-workflow-desc" x="515" y="182">which is why it is</text>
    <text class="iac-workflow-desc" x="515" y="198">safe to re-run.</text>
  </g>
  <line class="iac-workflow-line iac-workflow-conn iac-workflow-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#iac-workflow-tip)"/>
  <g class="iac-workflow-stage iac-workflow-s4">
    <rect class="iac-workflow-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="672" y="142">05</text>
    <text class="iac-workflow-name" x="698" y="142">Health checks gate the cutover</text>
    <text class="iac-workflow-desc" x="672" y="166">With a 60-120 second</text>
    <text class="iac-workflow-desc" x="672" y="182">allowance for</text>
    <text class="iac-workflow-desc" x="672" y="198">weights to load.</text>
    <text class="iac-workflow-edge" x="672" y="242">startup</text>
  </g>
  <line class="iac-workflow-line iac-workflow-conn iac-workflow-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#iac-workflow-tip)"/>
  <g class="iac-workflow-stage iac-workflow-s5">
    <rect class="iac-workflow-good" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="iac-workflow-step" x="829" y="142">06</text>
    <text class="iac-workflow-name" x="855" y="142">Traffic moves, or rolls back</text>
    <text class="iac-workflow-desc" x="829" y="166">Automated, on an</text>
    <text class="iac-workflow-desc" x="829" y="182">error-rate</text>
    <text class="iac-workflow-desc" x="829" y="198">threshold.</text>
  </g>
  <text class="iac-workflow-sub" x="30" y="304">State locking exists because two engineers applying at once produce a state file that describes neither of their intentions, and recovering from that is considerably harder than waiting thirty seconds.</text>
</svg>
