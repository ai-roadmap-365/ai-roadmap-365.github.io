visuals:
  - id: what-depends-on-waits-for
    file: assets/what-depends-on-waits-for.svg
    type: diagram
    title: What depends_on Actually Waits For
    alt: What depends_on Actually Waits For contrasting service started with service healthy on the
      same four-service stack
    description: A timeline of postgres and api under both conditions, showing the api usable at 1.2s
      while postgres cannot answer until 4.4s, against the correct wiring at 5.2s.
  - id: failures-visible-before-running
    file: assets/failures-visible-before-running.svg
    type: diagram
    title: Three Failures Visible Before Anything Runs
    alt: Three Failures Visible Before Anything Runs showing a cycle, a host port conflict and a
      premature start
    description: The three graph failures side by side with their severities, and the note that a
      cycle suppresses the timing findings because there is no valid order to reason about.
  - id: three-graph-questions
    file: assets/three-graph-questions.svg
    type: diagram
    title: 'Three questions about the graph'
    alt: 'Diagram: the three properties of a Compose dependency graph that decide whether a stack works'
    description: 'A three-stage description of the graph properties that determine whether a Compose stack starts: acyclicity, host port uniqueness, and dependency conditions.'
  - id: started-or-healthy
    file: assets/started-or-healthy.svg
    type: diagram
    title: 'Started is not healthy'
    alt: 'Diagram: the three depends_on conditions and what each actually waits for'
    description: 'A two-column comparison of the default depends_on condition against the healthy and completed conditions, and what each guarantees.'
  - id: compose-eras
    file: assets/compose-eras.svg
    type: diagram
    title: 'How startup ordering found its home'
    alt: 'Diagram: the progression from Fig to healthcheck-based dependency conditions'
    description: 'A four-stage progression from Fig through the v2/v3 schism and wait-for-it scripts to healthchecks and dependency conditions.'
  - id: not-an-orchestrator
    file: assets/not-an-orchestrator.svg
    type: diagram
    title: 'Compose is not an orchestrator'
    alt: 'Diagram: what Compose provides compared with what an orchestrator provides'
    description: 'A two-column comparison of what Docker Compose does against the properties of a real orchestrator.'
  - id: compose-mechanics
    file: assets/compose-mechanics.svg
    type: diagram
    title: 'What Compose does, in order'
    alt: 'Diagram: how Compose reads a file and starts a stack'
    description: 'A six-stage description of Compose''s behaviour covering graph construction, cycle rejection, the default network, dependency-ordered starts, port publication and healthcheck intervals.'
  - id: healthcheck-that-means-something
    file: assets/healthcheck-that-means-something.svg
    type: diagram
    title: 'A healthcheck that carries information'
    alt: 'Diagram: a meaningful healthcheck compared with one that only reports liveness'
    description: 'A two-column comparison of a healthcheck that verifies a dependant''s requirement against one that returns success whenever the process is running.'
  - id: restaurant-analogy
    file: assets/restaurant-analogy.svg
    type: diagram
    title: 'Opening a restaurant'
    alt: 'Diagram: staff arriving compared with the kitchen being ready'
    description: 'A two-column comparison of a rule requiring staff to arrive in order against one requiring the head chef to confirm readiness.'
  - id: the-four-second-gap
    file: assets/the-four-second-gap.svg
    type: diagram
    title: 'The order is right and means nothing'
    alt: 'Diagram: the measured start times showing services usable before their dependencies'
    description: 'A four-stage reading of measured Compose start times showing correct ordering with incorrect availability, and how the error compounds through the chain.'
  - id: fatal-suppresses-warnings
    file: assets/fatal-suppresses-warnings.svg
    type: diagram
    title: 'A fatal error suppresses the warnings'
    alt: 'Diagram: reporting a fatal cycle compared with reporting timing warnings alongside it'
    description: 'A two-column comparison of a report that suppresses derived warnings when a fatal error exists against one that reports everything.'
  - id: compose-implications
    file: assets/compose-implications.svg
    type: diagram
    title: 'Five consequences of a Compose file'
    alt: 'Diagram: the security, secrets, availability, performance and scaling implications of Compose'
    description: 'A five-stage description of Compose implications covering published ports, secrets in the file, retry storms, runtime overhead and single-host replicas.'
  - id: compose-versus-k8s
    file: assets/compose-versus-k8s.svg
    type: diagram
    title: 'Compose ordering, Kubernetes retries'
    alt: 'Diagram: Compose startup ordering compared with Kubernetes readiness'
    description: 'A two-column comparison of Compose''s startup-ordering model against Kubernetes'' assumption of continuous failure and recovery.'
  - id: compose-when
    file: assets/compose-when.svg
    type: diagram
    title: 'Where Compose belongs'
    alt: 'Diagram: when Docker Compose is the right tool and when it is not'
    description: 'A two-column comparison of appropriate uses of Compose against three common misuses.'
