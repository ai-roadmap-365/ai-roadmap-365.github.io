title: Docker Compose for Multi-Service Apps
section: deployment-mlops-and-security
subsection: deployment-and-containers
week: 48
learning_promise:
  'Read a Compose file as the dependency graph it is, and find the three failures that
  are visible before anything runs. Learn why depends_on waits for the container rather than the
  service, and measure the four seconds during which an API is up and its database cannot answer.'
objectives:
  - Detect dependency cycles and report each one once rather than once per member.
  - Produce a stable startup order, and explain why a cycle has none.
  - Distinguish a host-port conflict from two containers sharing an internal port.
  - Model what service_started and service_healthy actually wait for.
  - Explain why a correctly wired stack reports ready later, and why that is the honest number.
