learning_promise: 'Master elastic GPU scaling: configure Kubernetes Horizontal Pod Autoscaler (HPA), event-driven
  KEDA queue depth scalers, vLLM concurrency metrics, and scale-to-zero serverless GPU pools in Python.'
objectives:
- Deconstruct why classical CPU/Memory metrics fail completely for LLM autoscaling and why Concurrency
  & Queue Depth are mandatory.
- Implement KEDA (Kubernetes Event-driven Autoscaling) trigger scalers tracking vLLM `num_requests_waiting`
  Prometheus metrics.
- Configure Scale-to-Zero and Scale-to-N GPU provisioning policies balancing idle cost against cold-start
  latency budgets.
- Build a production-grade GPU Autoscaling Decision Engine in Python calculating optimal replica counts
  with scale-up damping and scale-down stabilization.
- Evaluate GPU node provisioning SLAs, cluster over-provisioning buffers, and Karpenter / Cluster Autoscaler
  mechanics.
