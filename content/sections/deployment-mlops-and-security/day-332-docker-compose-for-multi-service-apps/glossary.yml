terms:
- term: KEDA
  definition: Kubernetes Event-driven Autoscaling framework scaling pods based on custom metrics and external
    event sources.
- term: Horizontal Pod Autoscaler (HPA)
  definition: Kubernetes controller automatically scaling the number of pod replicas based on observed
    metrics.
- term: Queue Depth Autoscaling
  definition: Scaling GPU replicas proportionally to the number of requests waiting in inference server
    queues.
- term: Scale-to-Zero
  definition: Shutting down all active GPU instances during idle periods to eliminate cloud infrastructure
    costs.
- term: Scale-Down Stabilization
  definition: A cooldown time window preventing rapid de-provisioning during transient traffic dips.
- term: Karpenter
  definition: A high-performance node autoprovisioner launching right-sized cloud GPU instances on demand.
- term: GPU Over-Provisioning Buffer
  definition: Maintaining warm standby instances to absorb sudden traffic bursts without cold-start delays.
- term: Thrashing
  definition: A pathological cycle where autoscalers rapidly create and destroy instances due to noisy
    metric fluctuations.
