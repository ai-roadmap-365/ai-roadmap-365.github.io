terms:
  - term: Compose File
    definition: A declarative description of a multi-container application on one host — services,
      networks, volumes, and the dependencies between them.
  - term: Service
    definition: One container definition in a Compose file, reachable by its service name on the
      default network without publishing any port.
  - term: depends_on
    definition: A startup ordering edge. On its own it waits only for the dependency's container to be
      created, which is the single most misread word in Compose.
  - term: service_started
    definition: The default condition. The container exists. It says nothing about whether the service
      can answer a request.
  - term: service_healthy
    definition: A condition satisfied when the dependency's healthcheck passes. What "wait for the
      database" actually means.
  - term: service_completed_successfully
    definition: A condition satisfied when a one-shot container exits zero. For migrations, seeding
      and index building.
  - term: Healthcheck
    definition: A command the runtime runs on an interval to decide whether a container is healthy. A
      useful one verifies what a dependant is about to rely on, not merely that the process is alive.
  - term: Premature Start
    definition: A service that begins work before a dependency can answer it. Passes on a warm laptop,
      fails in cold CI, and gets filed as flakiness.
  - term: Dependency Cycle
    definition: A loop in the depends_on graph. Nothing in it can start, and the failure is total and
      immediate rather than intermittent.
  - term: Host Port Binding
    definition: The left-hand side of a ports mapping. It binds on the host, which on a cloud VM with
      a permissive security group can mean the internet.
  - term: Compose Network
    definition: The implicit network every service joins, where services resolve one another by name.
      Its existence is why most services need no published port at all.
