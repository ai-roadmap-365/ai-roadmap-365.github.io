questions:
  - question: In the lab the correctly wired stack reports its API usable at 5.2s instead of 1.2s. Why
      is the slower number the better one?
    options:
      - Because slower startup reduces load on the database
      - Because the 1.2s measurement was taken with a warm cache
      - Because Compose adds overhead when healthchecks are enabled
      - 'At 1.2s it was running but not yet usable'
    answer_index: 3
    explanation: The naive number measures when a container exists. The slower number measures when
      the service can serve, which is the thing anyone actually cares about.
  - question: Two services map 8000:8080 and 8001:8080. Both containers listen on 8080. Why is there no
      conflict?
    options:
      - 'Only the host side of the mapping can clash'
      - Because Compose automatically remaps duplicate container ports
      - Because port 8080 is reserved and never conflicts
      - Because only the first service to start binds its port
    answer_index: 0
    explanation: This is why the lab's port check inspects only the host side. The host has one of
      each port; a container has its own.
  - question: Why does a dependency cycle suppress the "starts before ready" findings rather than being
      reported alongside them?
    options:
      - Because cycles are rare enough not to matter
      - 'With no valid order there are no start times'
      - Because Compose reports cycles itself, so the tool does not need to
      - Because timing findings are only relevant in production
    answer_index: 1
    explanation: Reporting warnings derived from an impossible ordering would be noise stacked on top
      of a fatal error.
  - question: A service declares the service_healthy condition on a dependency that defines no
      healthcheck. What happens?
    options:
      - Compose falls back to service_started automatically
      - The healthcheck is inherited from the base image
      - 'The condition can never be satisfied, so it waits forever'
      - The dependant starts immediately and logs a warning
    answer_index: 2
    explanation: The condition and the healthcheck are two halves of one mechanism. Declaring one
      without the other is a stall waiting to happen.
  - question: Why does publishing a database port not help the API reach the database?
    options:
      - Because databases require a dedicated network driver
      - Because the API must use the container IP rather than a name
      - Because published ports are only available after the healthcheck passes
      - 'Services already resolve by name; ports is for outside'
    answer_index: 3
    explanation: The wrong mental model here produces a database exposed to the internet on any cloud
      VM with a permissive security group.
