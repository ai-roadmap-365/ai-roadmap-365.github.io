questions:
- question: Why is classical CPU or standard GPU duty-cycle utilization (e.g. `gpu_utilization > 80%`)
    a terrible metric for autoscaling LLM inference replicas?
  options:
  - Because GPUs do not have duty cycles
  - Because a single streaming request can drive GPU utilization to 100% (the GPU is actively calculating
    matrix multiplies), while the server still has ample VRAM to accept 30 more concurrent streams; conversely,
    when 50 requests are queued waiting, GPU utilization might still read 100%, offering zero signal on
    queue backlog
  - Because CPU utilization is always zero on GPU servers
  - Kubernetes does not support GPU metrics
  answer_index: 1
  explanation: GPU utilization reads 100% whether serving 1 request or suffocating under 100 queued requests;
    concurrency and waiting queue depth are the true scaling metrics.
- question: What custom metric emitted by vLLM / TGI provides the optimal autoscaling signal for KEDA
    / HPA?
  options:
  - Number of CPU cores
  - '`vllm:num_requests_waiting` (the count of queued requests waiting for KV cache allocation) and `vllm:num_requests_running`
    (active concurrent generation streams)'
  - The server hostname
  - The total bytes written to disk
  answer_index: 1
  explanation: Queue depth (`num_requests_waiting`) and active concurrency (`num_requests_running`) provide
    direct scaling indicators.
- question: What is the purpose of 'Scale-Down Stabilization Windows' (cooldown periods) in GPU autoscaling?
  options:
  - To turn off the cooling fans
  - To prevent 'thrashing' (rapidly deleting and re-creating expensive GPU pods during oscillating traffic
    spikes), requiring a sustained drop in queue depth (e.g. 5 to 10 minutes) before terminating replicas
  - To reboot the host kernel
  - To delete unused model checkpoints
  answer_index: 1
  explanation: Stabilization windows prevent rapid oscillation and unnecessary GPU termination cycles.
- question: What is 'Scale-to-Zero' and what is its primary operational trade-off?
  options:
  - Deleting the entire cluster permanently
  - Terminating all GPU replicas when idle traffic reaches zero to eliminate expensive cloud GPU billing
    ($3-$30/hour per GPU), at the cost of a 30 to 90-second cold-start latency delay for the first subsequent
    user request
  - Setting the model parameter count to zero
  - Running inference without electric power
  answer_index: 1
  explanation: Scale-to-zero saves 100% of idle GPU costs but incurs cold-start latency when traffic resumes.
- question: How does Karpenter or Kubernetes Cluster Autoscaler interact with GPU pod autoscaling (HPA/KEDA)?
  options:
  - They are incompatible
  - When KEDA scales up GPU pod replicas from 2 to 6, the new pods trigger Pending states; Karpenter detects
    the pending pods and dynamically provisions new physical GPU EC2/GCE cloud instances within 45 seconds
    to host them
  - They only manage network routers
  - Karpenter compiles Python code into C
  answer_index: 1
  explanation: Pod autoscalers (KEDA) create pods; Node autoscalers (Karpenter) provision physical GPU
    cloud instances.
