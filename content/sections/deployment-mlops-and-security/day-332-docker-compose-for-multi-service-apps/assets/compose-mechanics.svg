<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Six mechanics.">
  <title>What Compose does, in order</title>
  <style>
    .compose-mechanics-bg   { fill: #f8fafc; }
    .compose-mechanics-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-mechanics-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-mechanics-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-mechanics-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-mechanics-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-mechanics-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-mechanics-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compose-mechanics-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compose-mechanics-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compose-mechanics-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compose-mechanics-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compose-mechanics-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .compose-mechanics-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .compose-mechanics-stage { opacity: 1; }

    .compose-mechanics-s0 { animation-delay: 0.00s; }
    .compose-mechanics-e0 { animation-delay: 0.00s; }
    .compose-mechanics-s1 { animation-delay: 1.37s; }
    .compose-mechanics-e1 { animation-delay: 1.37s; }
    .compose-mechanics-s2 { animation-delay: 2.74s; }
    .compose-mechanics-e2 { animation-delay: 2.74s; }
    .compose-mechanics-s3 { animation-delay: 4.11s; }
    .compose-mechanics-e3 { animation-delay: 4.11s; }
    .compose-mechanics-s4 { animation-delay: 5.49s; }
    .compose-mechanics-e4 { animation-delay: 5.49s; }
    .compose-mechanics-s5 { animation-delay: 6.86s; }
    .compose-mechanics-e5 { animation-delay: 6.86s; }
    @media (prefers-reduced-motion: no-preference) {
      .compose-mechanics-conn  { animation: compose-mechanics-trace 9.600000000000001s ease-in-out infinite; }
      .compose-mechanics-stage { animation: compose-mechanics-arrive 9.600000000000001s ease-in-out infinite; }
    }
    @keyframes compose-mechanics-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes compose-mechanics-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .compose-mechanics-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .compose-mechanics-stage { animation: compose-mechanics-settle 9.600000000000001s ease-in-out infinite; opacity: 1; }
    }
    @keyframes compose-mechanics-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="compose-mechanics-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="compose-mechanics-bg" width="980" height="322"/>
  <text class="compose-mechanics-h1"  x="30" y="40">What Compose does, in order</text>
  <text class="compose-mechanics-sub" x="30" y="64">Six mechanics.</text>
  <g class="compose-mechanics-stage compose-mechanics-s0">
    <rect class="compose-mechanics-box" x="30" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="44" y="142">01</text>
    <text class="compose-mechanics-name" x="70" y="142">Read the file, build a graph</text>
    <text class="compose-mechanics-desc" x="44" y="166">Services, networks,</text>
    <text class="compose-mechanics-desc" x="44" y="182">volumes, and the</text>
    <text class="compose-mechanics-desc" x="44" y="198">depends_on edges.</text>
  </g>
  <line class="compose-mechanics-line compose-mechanics-conn compose-mechanics-e0" x1="163" y1="170" x2="185" y2="170" marker-end="url(#compose-mechanics-tip)"/>
  <g class="compose-mechanics-stage compose-mechanics-s1">
    <rect class="compose-mechanics-box" x="187" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="201" y="142">02</text>
    <text class="compose-mechanics-name" x="227" y="142">Refuse a cycle immediately</text>
    <text class="compose-mechanics-desc" x="201" y="166">There is no valid</text>
    <text class="compose-mechanics-desc" x="201" y="182">order, so there is</text>
    <text class="compose-mechanics-desc" x="201" y="198">nothing to attempt.</text>
    <text class="compose-mechanics-edge" x="201" y="242">fatal</text>
  </g>
  <line class="compose-mechanics-line compose-mechanics-conn compose-mechanics-e1" x1="320" y1="170" x2="342" y2="170" marker-end="url(#compose-mechanics-tip)"/>
  <g class="compose-mechanics-stage compose-mechanics-s2">
    <rect class="compose-mechanics-good" x="344" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="358" y="142">03</text>
    <text class="compose-mechanics-name" x="384" y="142">Create a default network</text>
    <text class="compose-mechanics-desc" x="358" y="166">Every service joins</text>
    <text class="compose-mechanics-desc" x="358" y="182">it and resolves the</text>
    <text class="compose-mechanics-desc" x="358" y="198">others by service</text>
    <text class="compose-mechanics-edge" x="358" y="242">no ports needed</text>
  </g>
  <line class="compose-mechanics-line compose-mechanics-conn compose-mechanics-e2" x1="477" y1="170" x2="499" y2="170" marker-end="url(#compose-mechanics-tip)"/>
  <g class="compose-mechanics-stage compose-mechanics-s3">
    <rect class="compose-mechanics-box" x="501" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="515" y="142">04</text>
    <text class="compose-mechanics-name" x="541" y="142">Start in dependency order</text>
    <text class="compose-mechanics-desc" x="515" y="166">Waiting according to</text>
    <text class="compose-mechanics-desc" x="515" y="182">each edge's</text>
    <text class="compose-mechanics-desc" x="515" y="198">condition — by</text>
  </g>
  <line class="compose-mechanics-line compose-mechanics-conn compose-mechanics-e3" x1="634" y1="170" x2="656" y2="170" marker-end="url(#compose-mechanics-tip)"/>
  <g class="compose-mechanics-stage compose-mechanics-s4">
    <rect class="compose-mechanics-box" x="658" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="672" y="142">05</text>
    <text class="compose-mechanics-name" x="698" y="142">Publish only what ports: asks for</text>
    <text class="compose-mechanics-desc" x="672" y="166">That binds on the</text>
    <text class="compose-mechanics-desc" x="672" y="182">host. Everything</text>
    <text class="compose-mechanics-desc" x="672" y="198">else stays internal.</text>
    <text class="compose-mechanics-edge" x="672" y="242">deliberate</text>
  </g>
  <line class="compose-mechanics-line compose-mechanics-conn compose-mechanics-e4" x1="791" y1="170" x2="813" y2="170" marker-end="url(#compose-mechanics-tip)"/>
  <g class="compose-mechanics-stage compose-mechanics-s5">
    <rect class="compose-mechanics-box" x="815" y="118" width="131" height="104" rx="10"/>
    <text class="compose-mechanics-step" x="829" y="142">06</text>
    <text class="compose-mechanics-name" x="855" y="142">Run healthchecks on an interval</text>
    <text class="compose-mechanics-desc" x="829" y="166">A dependant with</text>
    <text class="compose-mechanics-desc" x="829" y="182">service_healthy</text>
    <text class="compose-mechanics-desc" x="829" y="198">blocks until one</text>
  </g>
  <text class="compose-mechanics-sub" x="30" y="304">The third mechanic is what people miss when they publish database ports "so the API can reach it": `api` reaches `postgres:5432` on the internal network with no published port at all, and publishing one only adds outside traffic.</text>
</svg>
