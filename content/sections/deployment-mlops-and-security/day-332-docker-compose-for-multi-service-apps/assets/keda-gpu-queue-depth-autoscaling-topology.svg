<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="KEDA GPU Queue Depth Autoscaling Topology">
  <title>KEDA GPU Queue Depth Autoscaling Topology</title>
  <defs>
    <style>
      .d332a-bg { fill: #f8fafc; }
      .d332a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d332a-met { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d332a-ked { fill: #faf5ff; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .d332a-pod { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2px; rx: 8px; }
      .d332a-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d332a-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d332a-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d332a-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d332a-bg" />
  
  <text x="40" y="40" class="d332a-title">KEDA Event-Driven GPU Autoscaling Pipeline</text>
  <text x="40" y="65" class="d332a-subtitle">KEDA GPU Queue Depth Autoscaling Topology showing Prometheus scraping vLLM num_requests_waiting metrics, KEDA ScaledObject computing desired replicas, HPA scaling GPU Pods, and Karpenter provisioning cloud GPU nodes</text>
  
  <!-- Metric Collection -->
  <rect x="40" y="110" width="240" height="270" class="d332a-met" />
  <text x="55" y="145" class="d332a-header" fill="#1d4ed8">1. Prometheus Metrics</text>
  <text x="55" y="180" class="d332a-text">• Scrapes vLLM `:8000/metrics`</text>
  <text x="55" y="205" class="d332a-text">• `vllm:num_requests_waiting`</text>
  <text x="55" y="230" class="d332a-text">• `vllm:num_requests_running`</text>
  <text x="55" y="255" class="d332a-text">• Scrape Interval: 2 seconds</text>
  <text x="55" y="295" class="d332a-text" font-weight="600" fill="#1d4ed8">Direct Backlog Signal</text>
  <text x="55" y="320" class="d332a-text">Zero GPU utilization noise</text>
  
  <!-- KEDA Decision Engine -->
  <rect x="315" y="110" width="240" height="270" class="d332a-ked" />
  <text x="330" y="145" class="d332a-header" fill="#7e22ce">2. KEDA ScaledObject / HPA</text>
  <text x="330" y="180" class="d332a-text">• Target: `threshold = 5 waiting`</text>
  <text x="330" y="205" class="d332a-text">• `desired = ceil(waiting / 5)`</text>
  <text x="330" y="230" class="d332a-text">• Scale-Up Policy: Immediate</text>
  <text x="330" y="255" class="d332a-text">• Scale-Down Window: 300s</text>
  <text x="330" y="295" class="d332a-text" font-weight="600" fill="#7e22ce">Asymmetric Dynamics</text>
  <text x="330" y="320" class="d332a-text">Fast grow | Stable shrink</text>
  
  <!-- GPU Pod Scaling & Karpenter -->
  <rect x="590" y="110" width="270" height="270" class="d332a-pod" />
  <text x="605" y="145" class="d332a-header" fill="#15803d">3. Pods &amp; Karpenter Nodes</text>
  <text x="605" y="180" class="d332a-text">• HPA scales Replicas: 2 ➔ 8 Pods</text>
  <text x="605" y="205" class="d332a-text">• Pending pods trigger Karpenter</text>
  <text x="605" y="230" class="d332a-text">• Launches 3x `g5.12xlarge` nodes</text>
  <text x="605" y="255" class="d332a-text">• Node Provisioning: 45 seconds</text>
  <text x="605" y="295" class="d332a-text" font-weight="600" fill="#15803d">Outcome: Zero Request Drops</text>
  <text x="605" y="320" class="d332a-text">P95 latency maintained &lt; 500ms</text>
</svg>