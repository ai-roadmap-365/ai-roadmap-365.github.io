<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" role="img" aria-label="Three Failures Visible Before Anything Runs showing a cycle, a host port conflict and a premature start">
  <title>Three Failures Visible Before Anything Runs</title>
  <defs>
    <style>
      .d332b-bg { fill: #f8fafc; }
      .d332b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d332b-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d332b-warn { fill: #fef9c3; stroke: #eab308; stroke-width: 2px; }
      .d332b-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d332b-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d332b-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d332b-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d332b-m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .d332b-arrow { stroke: #ef4444; stroke-width: 2px; fill: none; }
    </style>
    <marker id="d332b-head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444" />
    </marker>
  </defs>
  <rect class="d332b-bg" width="900" height="400" />
  <text class="d332b-title" x="30" y="36">Three Failures Visible Before Anything Runs</text>
  <text class="d332b-s" x="30" y="58">All three are graph properties. None of them requires starting a container to find.</text>

  <rect class="d332b-bad" x="30" y="80" width="270" height="180" rx="8" />
  <text class="d332b-h" x="48" y="106">1. dependency cycle</text>
  <text class="d332b-s" x="48" y="126">fatal — nothing can start</text>
  <rect class="d332b-card" x="60" y="146" width="90" height="30" rx="4" />
  <text class="d332b-m" x="88" y="166">api</text>
  <rect class="d332b-card" x="180" y="206" width="90" height="30" rx="4" />
  <text class="d332b-m" x="196" y="226">worker</text>
  <path class="d332b-arrow" d="M150 166 L225 166 L225 204" marker-end="url(#d332b-head)" />
  <path class="d332b-arrow" d="M180 221 L105 221 L105 178" marker-end="url(#d332b-head)" />
  <text class="d332b-s" x="48" y="252">Reported once, not once per member.</text>

  <rect class="d332b-bad" x="315" y="80" width="270" height="180" rx="8" />
  <text class="d332b-h" x="333" y="106">2. host port conflict</text>
  <text class="d332b-s" x="333" y="126">error — one host, one port</text>
  <text class="d332b-m" x="333" y="156">api     8000:8000</text>
  <text class="d332b-m" x="333" y="180">worker  8000:8080</text>
  <text class="d332b-s" x="333" y="212">Only the HOST side clashes.</text>
  <text class="d332b-s" x="333" y="232">8000:8080 and 8001:8080 are fine —</text>
  <text class="d332b-s" x="333" y="250">separate network namespaces.</text>

  <rect class="d332b-warn" x="600" y="80" width="270" height="180" rx="8" />
  <text class="d332b-h" x="618" y="106">3. premature start</text>
  <text class="d332b-s" x="618" y="126">warning — and the one that bites</text>
  <text class="d332b-m" x="618" y="156">api starts 4.0s before</text>
  <text class="d332b-m" x="618" y="176">postgres can answer</text>
  <text class="d332b-s" x="618" y="208">The start ORDER is correct.</text>
  <text class="d332b-s" x="618" y="228">Ordering container creation is</text>
  <text class="d332b-s" x="618" y="246">not ordering availability.</text>

  <rect class="d332b-card" x="30" y="284" width="840" height="46" rx="6" />
  <text class="d332b-t" x="48" y="313">A cycle suppresses the timing findings: with no valid start order, "starts too early" means nothing.</text>

  <rect class="d332b-card" x="30" y="344" width="840" height="42" rx="6" />
  <text class="d332b-t" x="48" y="371">Fix for 3: condition: service_healthy — plus a healthcheck that verifies what the dependant will use.</text>

  <style>
    /* Travelling highlights on arrows that are already drawn. Added by
       scripts/animate-diagrams.mjs; no original element was modified, so
       removing this block restores the diagram exactly.

       reduce-ok: .dx-flow is a highlight sliding along an arrow the reader can
       already see, complete with its head and its direction. With the motion
       off there is no second arrow to miss — only the moving glint is gone. */
    @keyframes dxflow{from{stroke-dashoffset:18}to{stroke-dashoffset:-100}}
    @keyframes dxflowr{from{stroke-dashoffset:-100}to{stroke-dashoffset:18}}
    .dx-flow{animation:dxflow 3.6s cubic-bezier(.5,0,.5,1) infinite;opacity:.9}
    /* An arrow whose head is at the START of the drawn path flows the other
       way. Running the dash backwards is exact and geometry-free; reversing a
       curve's control points by hand is neither. */
    .dx-rev{animation-name:dxflowr}
    .dx-f0{animation-delay:0.00s}.dx-f1{animation-delay:0.42s}
    @media (prefers-reduced-motion:reduce){
      .dx-flow{animation:none;opacity:0}
      .dx-rev{animation:none}
    }
  </style>
  <g aria-hidden="true">
    <path class="dx-flow dx-f0" d="M150 166 L225 166 L225 204" stroke="#ef4444" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
    <path class="dx-flow dx-f1" d="M180 221 L105 221 L105 178" stroke="#ef4444" stroke-width="3.6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="18 100" stroke-dashoffset="18"/>
  </g>
</svg>
