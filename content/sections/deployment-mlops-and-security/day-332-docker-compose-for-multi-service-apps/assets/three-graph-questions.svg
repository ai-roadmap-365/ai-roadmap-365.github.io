<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="All answerable before anything runs.">
  <title>Three questions about the graph</title>
  <style>
    .three-graph-questions-bg   { fill: #f8fafc; }
    .three-graph-questions-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-graph-questions-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-graph-questions-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-graph-questions-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-graph-questions-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .three-graph-questions-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .three-graph-questions-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .three-graph-questions-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .three-graph-questions-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .three-graph-questions-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .three-graph-questions-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .three-graph-questions-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .three-graph-questions-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .three-graph-questions-stage { opacity: 1; }

    .three-graph-questions-s0 { animation-delay: 0.00s; }
    .three-graph-questions-e0 { animation-delay: 0.00s; }
    .three-graph-questions-s1 { animation-delay: 1.50s; }
    .three-graph-questions-e1 { animation-delay: 1.50s; }
    .three-graph-questions-s2 { animation-delay: 3.00s; }
    .three-graph-questions-e2 { animation-delay: 3.00s; }
    @media (prefers-reduced-motion: no-preference) {
      .three-graph-questions-conn  { animation: three-graph-questions-trace 6s ease-in-out infinite; }
      .three-graph-questions-stage { animation: three-graph-questions-arrive 6s ease-in-out infinite; }
    }
    @keyframes three-graph-questions-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes three-graph-questions-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .three-graph-questions-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .three-graph-questions-stage { animation: three-graph-questions-settle 6s ease-in-out infinite; opacity: 1; }
    }
    @keyframes three-graph-questions-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="three-graph-questions-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="three-graph-questions-bg" width="980" height="322"/>
  <text class="three-graph-questions-h1"  x="30" y="40">Three questions about the graph</text>
  <text class="three-graph-questions-sub" x="30" y="64">All answerable before anything runs.</text>
  <g class="three-graph-questions-stage three-graph-questions-s0">
    <rect class="three-graph-questions-box" x="30" y="118" width="289" height="104" rx="10"/>
    <text class="three-graph-questions-step" x="44" y="142">01</text>
    <text class="three-graph-questions-name" x="70" y="142">Is it acyclic?</text>
    <text class="three-graph-questions-desc" x="44" y="166">api depends on worker, worker on api: nothing</text>
    <text class="three-graph-questions-desc" x="44" y="182">in the cycle can start. Compose refuses.</text>
    <text class="three-graph-questions-edge" x="44" y="242">immediate</text>
  </g>
  <line class="three-graph-questions-line three-graph-questions-conn three-graph-questions-e0" x1="321" y1="170" x2="343" y2="170" marker-end="url(#three-graph-questions-tip)"/>
  <g class="three-graph-questions-stage three-graph-questions-s1">
    <rect class="three-graph-questions-box" x="345" y="118" width="289" height="104" rx="10"/>
    <text class="three-graph-questions-step" x="359" y="142">02</text>
    <text class="three-graph-questions-name" x="385" y="142">Do two services claim a host port?</text>
    <text class="three-graph-questions-desc" x="359" y="166">Only the host side can clash. Two containers</text>
    <text class="three-graph-questions-desc" x="359" y="182">on 8080 each are fine.</text>
    <text class="three-graph-questions-edge" x="359" y="242">one host</text>
  </g>
  <line class="three-graph-questions-line three-graph-questions-conn three-graph-questions-e1" x1="636" y1="170" x2="658" y2="170" marker-end="url(#three-graph-questions-tip)"/>
  <g class="three-graph-questions-stage three-graph-questions-s2">
    <rect class="three-graph-questions-warn" x="660" y="118" width="289" height="104" rx="10"/>
    <text class="three-graph-questions-step" x="674" y="142">03</text>
    <text class="three-graph-questions-name" x="700" y="142">Does each service wait for what it needs?</text>
    <text class="three-graph-questions-desc" x="674" y="166">This is where the real problem lives.</text>
    <text class="three-graph-questions-edge" x="674" y="242">the trap</text>
  </g>
  <text class="three-graph-questions-sub" x="30" y="304">The first failure is the one you want: it is total, immediate and unambiguous. The third is the one that costs you, because it looks correct and fails only where nothing is warm.</text>
</svg>
