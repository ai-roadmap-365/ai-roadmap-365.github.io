<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" role="img"
     aria-label="Four findings compounding downward.">
  <title>The order is right and means nothing</title>
  <style>
    .the-four-second-gap-bg   { fill: #f8fafc; }
    .the-four-second-gap-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-four-second-gap-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-four-second-gap-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-four-second-gap-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-four-second-gap-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .the-four-second-gap-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .the-four-second-gap-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .the-four-second-gap-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .the-four-second-gap-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .the-four-second-gap-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .the-four-second-gap-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .the-four-second-gap-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    /* Finished state first: this is what a reader with motion off sees. */
    .the-four-second-gap-conn { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }
    .the-four-second-gap-stage { opacity: 1; }

    .the-four-second-gap-s0 { animation-delay: 0.00s; }
    .the-four-second-gap-e0 { animation-delay: 0.00s; }
    .the-four-second-gap-s1 { animation-delay: 1.28s; }
    .the-four-second-gap-e1 { animation-delay: 1.28s; }
    .the-four-second-gap-s2 { animation-delay: 2.56s; }
    .the-four-second-gap-e2 { animation-delay: 2.56s; }
    .the-four-second-gap-s3 { animation-delay: 3.84s; }
    .the-four-second-gap-e3 { animation-delay: 3.84s; }
    @media (prefers-reduced-motion: no-preference) {
      .the-four-second-gap-conn  { animation: the-four-second-gap-trace 6.4s ease-in-out infinite; }
      .the-four-second-gap-stage { animation: the-four-second-gap-arrive 6.4s ease-in-out infinite; }
    }
    @keyframes the-four-second-gap-trace {
      0%        { stroke-dashoffset: 54; opacity: 0.35; }
      14%, 100% { stroke-dashoffset: 0;  opacity: 1; }
    }
    @keyframes the-four-second-gap-arrive {
      0%        { opacity: 0.55; }
      10%, 22%  { opacity: 1; }
      34%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* No movement, but the order is still shown: each stage brightens in turn
         and stays bright. Opacity and colour are vestibular-safe. */
      .the-four-second-gap-conn  { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .the-four-second-gap-stage { animation: the-four-second-gap-settle 6.4s ease-in-out infinite; opacity: 1; }
    }
    @keyframes the-four-second-gap-settle {
      0%        { opacity: 0.62; }
      12%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="the-four-second-gap-tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect class="the-four-second-gap-bg" width="980" height="322"/>
  <text class="the-four-second-gap-h1"  x="30" y="40">The order is right and means nothing</text>
  <text class="the-four-second-gap-sub" x="30" y="64">Four findings compounding downward.</text>
  <g class="the-four-second-gap-stage the-four-second-gap-s0">
    <rect class="the-four-second-gap-warn" x="30" y="118" width="210" height="104" rx="10"/>
    <text class="the-four-second-gap-step" x="44" y="142">01</text>
    <text class="the-four-second-gap-name" x="70" y="142">Start order is correct</text>
    <text class="the-four-second-gap-desc" x="44" y="166">postgres, qdrant, api, worker.</text>
    <text class="the-four-second-gap-desc" x="44" y="182">Postgres does start first.</text>
    <text class="the-four-second-gap-edge" x="44" y="242">the trap</text>
  </g>
  <line class="the-four-second-gap-line the-four-second-gap-conn the-four-second-gap-e0" x1="242" y1="170" x2="264" y2="170" marker-end="url(#the-four-second-gap-tip)"/>
  <g class="the-four-second-gap-stage the-four-second-gap-s1">
    <rect class="the-four-second-gap-box" x="266" y="118" width="210" height="104" rx="10"/>
    <text class="the-four-second-gap-step" x="280" y="142">02</text>
    <text class="the-four-second-gap-name" x="306" y="142">api usable at 1.2s</text>
    <text class="the-four-second-gap-desc" x="280" y="166">postgres usable at 4.4s. The api</text>
    <text class="the-four-second-gap-desc" x="280" y="182">is up four seconds before its</text>
    <text class="the-four-second-gap-desc" x="280" y="198">database.</text>
  </g>
  <line class="the-four-second-gap-line the-four-second-gap-conn the-four-second-gap-e1" x1="478" y1="170" x2="500" y2="170" marker-end="url(#the-four-second-gap-tip)"/>
  <g class="the-four-second-gap-stage the-four-second-gap-s2">
    <rect class="the-four-second-gap-box" x="502" y="118" width="210" height="104" rx="10"/>
    <text class="the-four-second-gap-step" x="516" y="142">03</text>
    <text class="the-four-second-gap-name" x="542" y="142">worker starts before api can answer</text>
    <text class="the-four-second-gap-desc" x="516" y="166">And api started before postgres</text>
    <text class="the-four-second-gap-desc" x="516" y="182">could. Nothing waits for</text>
    <text class="the-four-second-gap-desc" x="516" y="198">anything real.</text>
    <text class="the-four-second-gap-edge" x="516" y="242">compounds</text>
  </g>
  <line class="the-four-second-gap-line the-four-second-gap-conn the-four-second-gap-e2" x1="714" y1="170" x2="736" y2="170" marker-end="url(#the-four-second-gap-tip)"/>
  <g class="the-four-second-gap-stage the-four-second-gap-s3">
    <rect class="the-four-second-gap-good" x="738" y="118" width="210" height="104" rx="10"/>
    <text class="the-four-second-gap-step" x="752" y="142">04</text>
    <text class="the-four-second-gap-name" x="778" y="142">With service_healthy: api at 5.2s</text>
    <text class="the-four-second-gap-desc" x="752" y="166">Four seconds slower. No</text>
    <text class="the-four-second-gap-desc" x="752" y="182">findings.</text>
    <text class="the-four-second-gap-edge" x="752" y="242">works</text>
  </g>
  <text class="the-four-second-gap-sub" x="30" y="304">Ordering the *creation* of containers is not ordering their *availability*, and the two look identical in a `docker compose up` log — which is why this is diagnosed as flaky CI rather than as a startup bug.</text>
</svg>
