<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="What depends_on Actually Waits For contrasting service started with service healthy on the same four-service stack">
  <title>What depends_on Actually Waits For</title>
  <defs>
    <style>
      .d332a-bg { fill: #f8fafc; }
      .d332a-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      .d332a-bad { fill: #fee2e2; stroke: #ef4444; stroke-width: 2px; }
      .d332a-good { fill: #dcfce7; stroke: #22c55e; stroke-width: 2px; }
      .d332a-wait { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5px; }
      .d332a-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d332a-h { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .d332a-t { font-family: system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .d332a-s { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .d332a-ax { stroke: #94a3b8; stroke-width: 1.5px; }
    </style>
  </defs>
  <rect class="d332a-bg" width="900" height="440" />
  <text class="d332a-title" x="30" y="34">What depends_on Actually Waits For</text>
  <text class="d332a-s" x="30" y="56">Same stack, same images. Only the condition differs. Time runs left to right.</text>

  <text class="d332a-h" x="30" y="90">depends_on: [postgres]</text>
  <text class="d332a-s" x="230" y="90">— waits for the CONTAINER</text>
  <line class="d332a-ax" x1="150" y1="176" x2="700" y2="176" />
  <text class="d332a-t" x="30" y="116">postgres</text>
  <rect class="d332a-wait" x="150" y="100" width="44" height="22" rx="3" />
  <rect class="d332a-bad" x="194" y="100" width="440" height="22" rx="3" />
  <text class="d332a-s" x="640" y="117">usable 4.4s</text>
  <text class="d332a-t" x="30" y="150">api</text>
  <rect class="d332a-wait" x="150" y="134" width="22" height="22" rx="3" />
  <rect class="d332a-bad" x="172" y="134" width="66" height="22" rx="3" />
  <text class="d332a-s" x="248" y="151" fill="#7f1d1d">usable 1.2s — but postgres cannot answer for another 3.2s</text>

  <text class="d332a-h" x="30" y="230">condition: service_healthy</text>
  <text class="d332a-s" x="250" y="230">— waits for the HEALTHCHECK</text>
  <line class="d332a-ax" x1="150" y1="316" x2="700" y2="316" />
  <text class="d332a-t" x="30" y="256">postgres</text>
  <rect class="d332a-wait" x="150" y="240" width="44" height="22" rx="3" />
  <rect class="d332a-good" x="194" y="240" width="440" height="22" rx="3" />
  <text class="d332a-s" x="640" y="257">usable 4.4s</text>
  <text class="d332a-t" x="30" y="290">api</text>
  <rect class="d332a-wait" x="150" y="274" width="484" height="22" rx="3" />
  <rect class="d332a-good" x="634" y="274" width="88" height="22" rx="3" />
  <text class="d332a-s" x="732" y="291" fill="#15803d">usable 5.2s</text>

  <rect class="d332a-card" x="30" y="340" width="410" height="86" rx="8" />
  <text class="d332a-h" x="48" y="366">The naive stack is faster</text>
  <text class="d332a-t" x="48" y="392">api up at 1.2s — and its first query fails</text>
  <text class="d332a-s" x="48" y="414">Passes on a warm laptop. Fails in cold CI.</text>

  <rect class="d332a-card" x="460" y="340" width="410" height="86" rx="8" />
  <text class="d332a-h" x="478" y="366">The correct stack is slower</text>
  <text class="d332a-t" x="478" y="392">api up at 5.2s — and it works</text>
  <text class="d332a-s" x="478" y="414">1.2s was never a measure of usable.</text>
</svg>
