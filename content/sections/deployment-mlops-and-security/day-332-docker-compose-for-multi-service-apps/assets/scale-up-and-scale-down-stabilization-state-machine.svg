<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" role="img" aria-label="Scale-Up and Scale-Down Stabilization State Machine">
  <title>Scale-Up and Scale-Down Stabilization State Machine</title>
  <defs>
    <style>
      .d332b-bg { fill: #f8fafc; }
      .d332b-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
      .d332b-up { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 8px; }
      .d332b-down { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .d332b-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .d332b-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .d332b-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      .d332b-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="d332b-bg" />
  
  <text x="40" y="40" class="d332a-title">Asymmetric Scaling: Fast Grow vs Stable Cooldown</text>
  <text x="40" y="65" class="d332a-subtitle">Scale-Up and Scale-Down Stabilization State Machine showing Instant Scale-Up on queue spike and 300-second Cooldown Stabilization Window before Scale-Down to prevent thrashing</text>
  
  <!-- Scale-Up Stage -->
  <rect x="40" y="110" width="390" height="270" class="d332b-up" />
  <text x="60" y="145" class="d332b-header" fill="#1d4ed8">Scale-Up Dynamics: Immediate Action</text>
  <text x="60" y="180" class="d332b-text">• **Trigger:** `waiting_requests &gt; 5`</text>
  <text x="60" y="205" class="d332b-text">• **Reaction Time:** 0 seconds (Immediate)</text>
  <text x="60" y="230" class="d332b-text">• **Step Increment:** Up to +100% replicas per cycle</text>
  <text x="60" y="255" class="d332b-text">• **Goal:** Drain waiting queue before client timeout</text>
  <text x="60" y="300" class="d332b-text" font-weight="600" fill="#1d4ed8">Aggressive Scale-Up Prevents HTTP 504</text>
  
  <!-- Scale-Down Stage -->
  <rect x="470" y="110" width="390" height="270" class="d332b-down" />
  <text x="490" y="145" class="d332b-header" fill="#b45309">Scale-Down Dynamics: 300s Stabilization</text>
  <text x="490" y="180" class="d332b-text">• **Trigger:** `waiting_requests == 0`</text>
  <text x="490" y="205" class="d332b-text">• **Stabilization Window:** Must stay idle for 300s</text>
  <text x="490" y="230" class="d332b-text">• **Step Rate:** Max 1 replica removed every 60s</text>
  <text x="490" y="255" class="d332b-text">• **Goal:** Prevent costly GPU churn and thrashing</text>
  <text x="490" y="300" class="d332b-text" font-weight="600" fill="#b45309">Controlled Shrink Saves $1000s in Churn</text>
</svg>