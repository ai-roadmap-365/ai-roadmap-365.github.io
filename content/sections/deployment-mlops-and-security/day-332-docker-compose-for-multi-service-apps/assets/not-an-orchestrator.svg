<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="One host, one failure domain.">
  <title>Compose is not an orchestrator</title>
  <style>
    .not-an-orchestrator-bg   { fill: #f8fafc; }
    .not-an-orchestrator-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-orchestrator-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-orchestrator-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-orchestrator-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-orchestrator-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .not-an-orchestrator-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-an-orchestrator-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .not-an-orchestrator-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .not-an-orchestrator-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .not-an-orchestrator-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .not-an-orchestrator-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .not-an-orchestrator-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .not-an-orchestrator-row { opacity: 1; }
    .not-an-orchestrator-r0 { animation-delay: 0.00s; }
    .not-an-orchestrator-r1 { animation-delay: 0.45s; }
    .not-an-orchestrator-r2 { animation-delay: 0.90s; }
    .not-an-orchestrator-r3 { animation-delay: 1.35s; }
    .not-an-orchestrator-r4 { animation-delay: 1.80s; }
    .not-an-orchestrator-row { animation: not-an-orchestrator-reveal 7.3s ease-in-out infinite; }
    @keyframes not-an-orchestrator-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="not-an-orchestrator-bg" width="980" height="390"/>
  <text class="not-an-orchestrator-h1"  x="30" y="40">Compose is not an orchestrator</text>
  <text class="not-an-orchestrator-sub" x="30" y="64">One host, one failure domain.</text>
  <rect class="not-an-orchestrator-good" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="not-an-orchestrator-name" x="46" y="122">Compose</text>
  <text class="not-an-orchestrator-desc" x="46" y="142">One machine, one file.</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r0" x="46" y="182">A readable multi-container topology</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r1" x="46" y="216">Dependency ordering with conditions</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r2" x="46" y="250">An implicit network with name resolution</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r3" x="46" y="284">Excellent for development and CI</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r4" x="46" y="318">Fine for a hobby deployment</text>
  <rect class="not-an-orchestrator-warn" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="not-an-orchestrator-name" x="526" y="122">Not Compose</text>
  <text class="not-an-orchestrator-desc" x="526" y="142">What it does not do.</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r0" x="526" y="182">No scheduling across machines</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r1" x="526" y="216">No rescheduling on node failure</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r2" x="526" y="250">No rolling updates worth the name</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r3" x="526" y="284">deploy.replicas is concurrency, not scale</text>
  <text class="not-an-orchestrator-desc not-an-orchestrator-row not-an-orchestrator-r4" x="526" y="318">A single host is a single point of failure</text>
  <text class="not-an-orchestrator-sub" x="30" y="372">`deploy.replicas` is the specific trap: several copies on one machine share that machine's CPU, memory and failure domain, which is not horizontal scaling by any definition that survives an outage.</text>
</svg>
