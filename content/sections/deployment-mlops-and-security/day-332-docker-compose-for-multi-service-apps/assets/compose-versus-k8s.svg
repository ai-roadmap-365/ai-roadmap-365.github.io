<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img"
     aria-label="Two different assumptions about failure.">
  <title>Compose ordering, Kubernetes retries</title>
  <style>
    .compose-versus-k8s-bg   { fill: #f8fafc; }
    .compose-versus-k8s-h1   { fill: #1a202c; font-size: 21px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-versus-k8s-sub  { fill: #475569; font-size: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-versus-k8s-name { fill: #1a202c; font-size: 15px; font-weight: 700; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-versus-k8s-desc { fill: #475569; font-size: 12.5px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-versus-k8s-edge { fill: #1d4ed8; font-size: 12.5px; font-weight: 600; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .compose-versus-k8s-mono { fill: #1a202c; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-versus-k8s-box  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.75; }
    .compose-versus-k8s-hi   { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.25; }
    .compose-versus-k8s-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .compose-versus-k8s-good { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
    .compose-versus-k8s-line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .compose-versus-k8s-step { fill: #1d4ed8; font-size: 12px; font-weight: 700; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .compose-versus-k8s-row { opacity: 1; }
    .compose-versus-k8s-r0 { animation-delay: 0.00s; }
    .compose-versus-k8s-r1 { animation-delay: 0.45s; }
    .compose-versus-k8s-r2 { animation-delay: 0.90s; }
    .compose-versus-k8s-r3 { animation-delay: 1.35s; }
    .compose-versus-k8s-r4 { animation-delay: 1.80s; }
    .compose-versus-k8s-row { animation: compose-versus-k8s-reveal 7.3s ease-in-out infinite; }
    @keyframes compose-versus-k8s-reveal {
      0%       { opacity: 0.5; }
      9%, 100% { opacity: 1; }
    }
  </style>
  <rect class="compose-versus-k8s-bg" width="980" height="390"/>
  <text class="compose-versus-k8s-h1"  x="30" y="40">Compose ordering, Kubernetes retries</text>
  <text class="compose-versus-k8s-sub" x="30" y="64">Two different assumptions about failure.</text>
  <rect class="compose-versus-k8s-hi" x="30" y="96" width="440" height="56" rx="9"/>
  <text class="compose-versus-k8s-name" x="46" y="122">Compose</text>
  <text class="compose-versus-k8s-desc" x="46" y="142">Order the start.</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r0" x="46" y="182">depends_on gives edges</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r1" x="46" y="216">Conditions decide what to wait for</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r2" x="46" y="250">Assumes a start, then steady state</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r3" x="46" y="284">One host</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r4" x="46" y="318">Good for development and CI</text>
  <rect class="compose-versus-k8s-good" x="510" y="96" width="440" height="56" rx="9"/>
  <text class="compose-versus-k8s-name" x="526" y="122">Kubernetes</text>
  <text class="compose-versus-k8s-desc" x="526" y="142">Assume continuous churn.</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r0" x="526" y="182">No depends_on equivalent</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r1" x="526" y="216">Readiness probes gate traffic instead</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r2" x="526" y="250">Assumes services fail and recover constantly</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r3" x="526" y="284">Expects clients to retry</text>
  <text class="compose-versus-k8s-desc compose-versus-k8s-row compose-versus-k8s-r4" x="526" y="318">Schedules across machines</text>
  <text class="compose-versus-k8s-sub" x="30" y="372">The absence of `depends_on` in Kubernetes is a design decision rather than a gap: in a system where any pod can be rescheduled at any moment, a one-time startup ordering would be correct for about a minute.</text>
</svg>
